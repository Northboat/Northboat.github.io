                  <!----></a></div></dd></dl></div></div></div> <div class="content-wrapper"><!----> <!----> <!----> <div class="theme-vdoing-content content__default"><center><h4>卷尼玛</h4></center> <p>我在第一次接触 Java 时便被它深深吸引，对我来说，它太熟悉了</p> <p>Java 和 C++ 很像，不是写法，是整个语言的感觉，无论是循环的关键字还是语法结构，以及结尾上的小字符，真的，非常非常像，有时候写 Java 代码，我甚至都会愣神</p> <p>而 Java 独有的一些机制，用法，以及设计，常常让我很兴奋，很惊喜，我不可否认，我爱上了这门语言，它让我重拾了探索的欲望，恢复了学习的热情</p> <p>但我很容易陷入一个怪圈，因为它们太像，我常常在写 Java 代码时便不由自主的把 C++ 的语法强行带入，于是反复发问，为什么它会没有指针，为什么它不可以多继承，为什么它不支持运算符重载</p> <p>……</p> <p>可是，它为什么需要有这些？凭什么就需要有这些？就因为 C++ 第一个对你说“你好世界”吗？</p> <p>后来，她去了西安，成了一名 Java 后端开发工程师，不仅是合格，应该称得上优秀，而我还在秦皇岛，还是一名 C++ 老师，谈不上优秀，应该算得上合格</p> <p>......</p> <p>她最近去了东莞，做着安全相关的工作，东莞的烧鹅很好吃，小姐也年轻，当然，那是以前；这些年技术革新的飞快，外边不停嚷嚷着 AI、Agent、超级个体，好像叫的越凶，股价就涨的越狠</p> <p>不过前端兄弟的命确实被革掉了，后端也快了，她的工作与智能体有关，在新时代，C++ 早就被她遗忘在一个靠海的小城，即使她喜欢海</p> <p>......</p> <p>我厌倦了 Java 的继承，看着那看似精妙但本质屎山的族系，不禁让我联想到世袭的清朝老皇帝，我放弃了 Java，放弃了海，也放弃了她，这是不亚于土地改革的解放</p> <p>我正在北京呼吸新鲜空气，正如农民在开垦属于自己的土地 —— 她有 Java 的模样，也有 C++ 的影子，她有云原生时代的所有气质，我正在和她磨合，她非常好，希望我们相处愉快</p> <p>......</p> <p>当发展到一定规模，复杂度总是随之而来，即使丢掉了世袭，组合同样让 Golang 无止境的膨胀，发苦、发闷，但组合总是大于继承，大不了砍了，我这样想</p> <p>矛盾是不可避免的，有矛盾才有进步</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/07/17, 00:54:41</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/cs/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">计算机科学与技术</div></a> <a href="/aisec/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">网安与人工智能</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
