body></table> <p>我有一个大胆的想法，用多个 AI 工作流来写我的小论文</p> <ol><li>论文 PRD 对齐：参考文献，方案方向，应用背景</li> <li>IDEA 敲定：效率安全性某项理论上超过参考文献</li> <li>讲好 Story：自圆其说</li> <li>给定模板逐段撰写</li> <li>完善配图：AI 制图 + PPT 手绘</li> <li>降重降 AI 率</li></ol> <p>关键在于前三项和最后一项</p> <ul><li>如何配比人工和 AI 的参与度？（1:1）</li> <li>如何权衡 AI 的自由度和每个步骤的准确度？人工校对的比例？</li> <li>Token 的消耗，Loop 的轮次，Timeout 的上限？</li></ul> <p>先用文心试试可行性，上下文不够就拆分步骤 + 压缩总结，如果真发出去了（不管出于哪种原因），都会对这套唯论文制度提出实质性的质疑</p></div></div> <div class="main-right"><aside class="blogger-wrapper card-box" data-v-d146d2d2><div class="avatar"><img src="/img/avatar.png" alt="头像" title="我好看吗"></div> <div class="icons"><a href="mailto:northboat@163.com" title="邮件" target="_blank" class="iconfont icon-youjian" style="width:33.333333333333336%;"></a><a href="https://github.com/northboat" title="GitHub" target="_blank" class="iconfont icon-github" style="width:33.333333333333336%;"></a><a href="https://music.163.com/#/my/m/music/playlist?id=5123040741" title="音乐" target="_blank" class="iconfont icon-erji" style="width:33.333333333333336%;"></a></div> <div class="blogger"><span class="name">Northboat</span> <span class="slogan">我直接抄你的码</span></div></aside> <!----> <!----> <!----></div></div></div> <div class="footer"><div class="icons"><a href="mailto:northboat@163.com" title="邮件" target="_blank" class="iconfont icon-youjian"></a><a href="https://github.com/northboat" title="GitHub" target="_blank" class="iconfont icon-github"></a><a href="https://music.163.com/#/my/m/music/playlist?id=5123040741" title="音乐" target="_blank" class="iconfont icon-erji"></a></div>
