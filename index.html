            JVM 基础（二）
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">Northboat</span> <span title="创建时间" class="iconfont icon-riqi">2025-10-29</span> <!----> <!----></div></div> <!----></div></div></div> <div class="pagination" data-v-d146d2d2><span class="card-box prev iconfont icon-jiantou-zuo disabled"><p>上一页</p></span> <div class="pagination-list"><span class="card-box active">1</span> <span title="上两页" class="ellipsis ell-two" style="display:none;"></span> <span class="card-box" style="display:;">2</span> <span class="card-box">3</span> <span title="下两页" class="ellipsis ell-four" style="display:;"></span> <span class="card-box" style="display:none;">11</span> <span class="card-box">12</span></div> <span class="card-box next iconfont icon-jiantou-you"><p>下一页</p></span></div> <div class="theme-vdoing-content custom card-box content__default" data-v-d146d2d2><!----> <p>备忘</p> <ul><li>Java：什么是 ThreadLocal；ThreadLocal 内存泄漏怎么办</li> <li>网络：TCP 报文字段和四次挥手</li> <li>限流算法：令牌桶和漏桶</li> <li>锁：分段锁，互斥锁，读写锁，分布式锁，原子性操作，aqs 公平锁和非公平锁</li> <li>数据库：为什么禁止使用 left join；varchar10 和 varchar100 的区别（匹配时不同）；SQL 优化效率三角（query，index，explain）</li> <li>消息队列：消息队列死信怎么办，消息队列堆积怎么办，Kafka 日志如何确认消费</li></ul> <p>百度还有两个大的要完成</p> <ul><li>新人串讲，吸收技术精华</li> <li>开发测试上线流程：开发、单测、EOS 联调（一定要测通每一条链路）、CR、同步分支、提测、上线（灰度和蓝绿发布）</li></ul> <p>STAR 法则状态机，单线程叙事</p> <table><thead><tr><th>Status</th> <th>Events</th></tr></thead> <tbody><tr><td>情景 Situation</td> <td>在某某背景、某某前提下</td></tr> <tr><td>任务 Task</td> <td>接到了什么任务、遇到了什么问题</td></tr> <tr><td>行动 Action</td> <td>怎么实施的行动</td></tr> <tr><td>结果 Result</td> <td>收获怎样的效果</td></tr></tbody></table> <p>角色定义 &gt; 任务驱动</p> <ul><li>我们总是在 system prompt 中预先定义 ai 的角色，这相当有用，其实对于人类也是一样的，比起列任务清单，不如定义自己为一个卷王</li> <li>例如：把 <em>todolist &amp; plan</em> 改成<em>我是一个日更的 Github 博主</em>，我天天都会 update 我的博客，即使今天没时间精力学习，我也会找个力扣刷刷更新我的算法笔记<s>Todolist &amp; Plan</s> → 我是一个日更的 Github 博主</li></ul> <p>Learn From Long</p> <table><thead><tr><th>Website</th> <th></th> <th></th> <th
