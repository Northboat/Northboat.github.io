            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">Northboat</span> <span title="创建时间" class="iconfont icon-riqi">2025-11-16</span> <!----> <!----></div></div> <!----></div></div></div> <div class="pagination" data-v-d146d2d2><span class="card-box prev iconfont icon-jiantou-zuo disabled"><p>上一页</p></span> <div class="pagination-list"><span class="card-box active">1</span> <span title="上两页" class="ellipsis ell-two" style="display:none;"></span> <span class="card-box" style="display:;">2</span> <span class="card-box">3</span> <span title="下两页" class="ellipsis ell-four" style="display:;"></span> <span class="card-box" style="display:none;">11</span> <span class="card-box">12</span></div> <span class="card-box next iconfont icon-jiantou-you"><p>下一页</p></span></div> <div class="theme-vdoing-content custom card-box content__default" data-v-d146d2d2><!----> <p>查漏补缺</p> <ol><li>AI 编程范式演进：Cube Sandbox</li> <li>高可用和高并发场景：日志切面和事务；画布协同详解的写并发问题</li> <li>从神经网络到大模型：CNN 构建</li> <li>消息队列：消息队列死信怎么办，消息队列堆积怎么办，Kafka 日志如何确认消费，NMQ 最佳实践</li> <li>分布式搜索引擎：传统 RAG、向量数据库和 ES；ANN 算法</li> <li>JUC 基础：什么是 ThreadLocal 以及 ThreadLocal 内存泄漏怎么办</li> <li>渗透测试基础：协议相关（TCP 报文字段和四次挥手），握手阶段 SYN 泛洪攻击</li> <li>键值数据库：Redis 限流算法（令牌桶和漏桶）</li> <li>关系数据库
<ul><li>Skip Scan 索引跳跃式扫描</li> <li>索引失效场景（最左匹配和前缀匹配原则）</li> <li>为什么禁止使用 left join</li> <li>varchar10 和 varchar100 的区别（匹配时不同）</li> <li>SQL 优化效率三角（query，index，explain）</li> <li>数据一致性：强一致和最终一致</li></ul></li></ol> <p>STAR 状态机，单线程叙事</p> <table><thead><tr><th>Status</th> <th>Events</th></tr></thead> <tbody><tr><td>情景 Situation</td> <td>在某某背景、某某前提下</td></tr> <tr><td>任务 Task</td> <td>接到了什么任务、遇到了什么问题</td></tr> <tr><td>行动 Action</td> <td>怎么实施的行动</td></tr> <tr><td>结果 Result</td> <td>收获怎样的效果</td></tr></tbody></table> <p>角色定义 &gt; 任务驱动</p> <ul><li>我们总是在 system prompt 中预先定义 ai 的角色，这相当有用，其实对于人类也是一样的，比起列任务清单，不如定义自己为一个卷王</li> <li>例如：把 <em>todolist &amp; plan</em> 改成<em>我是一个日更的 Github 博主</em>，我天天都会 update 我的博客，即使今天没时间精力学习，我也会找个力扣刷刷更新我的算法笔记</li></ul> <p>Learn From Long</p> <table><thead><tr><th>Website</th> <th></th> <th></th> <th></th></tr></thead> <tbody><tr><td><a href="https://www.codefather.cn/course" target="_blank" rel="nofollow noopener noreferrer">鱼皮编程导航<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td><a href="https://bugstack.cn/" target="_blank" rel="nofollow noopener noreferrer">小傅哥 bugstack 虫洞栈<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85
