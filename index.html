            JVM 基础（二）
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">Northboat</span> <span title="创建时间" class="iconfont icon-riqi">2025-10-29</span> <!----> <!----></div></div> <!----></div></div></div> <div class="pagination" data-v-d146d2d2><span class="card-box prev iconfont icon-jiantou-zuo disabled"><p>上一页</p></span> <div class="pagination-list"><span class="card-box active">1</span> <span title="上两页" class="ellipsis ell-two" style="display:none;"></span> <span class="card-box" style="display:;">2</span> <span class="card-box">3</span> <span title="下两页" class="ellipsis ell-four" style="display:;"></span> <span class="card-box" style="display:none;">10</span> <span class="card-box">11</span></div> <span class="card-box next iconfont icon-jiantou-you"><p>下一页</p></span></div> <div class="theme-vdoing-content custom card-box content__default" data-v-d146d2d2><!----> <div align="center"><h1>📋 查漏补缺</h1></div> <div style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#764ba2;margin-top:12px;">🐳 1. K8S 基础</h3> <ul><li><a href="https://www.bilibili.com/video/BV12L411a7Ne/?spm_id_from=333.337.search-card.all.click&amp;vd_source=757c95a458d7c9501de959636f126d0a">速学 150 个 Linux 常用命令</a></li> <li>容器编排</li> <li>Harness Engineering 和 Cube Sandbox</li></ul></div></div> <div style="background:linear-gradient(135deg, #f093fb 0%, #f5576c 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#c0392b;margin-top:12px;">📨 2. 消息队列</h3> <ul><li>消息队列堆积怎么办？死信队列怎么处理？</li> <li>Kafka 日志如何确认消费，MQ 最佳实践</li></ul></div></div> <div style="background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#2980b9;margin-top:12px;">🔍 3. 搜索引擎</h3> <ul><li>传统 RAG 和 ES 索引</li> <li>向量数据库和 ANN 算法</li></ul></div></div> <div style="background:linear-gradient(135deg, #fa709a 0%, #fee140 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#e67e22;margin-top:12px;">⚡ 4. 键值数据库</h3> <ul><li>Redis 限流算法，令牌桶和漏桶</li></ul></div></div> <div style="background:linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#27ae60;margin-top:12px;">🗄️ 5. 关系数据库</h3> <ul><li>Skip Scan 索引跳跃式扫描</li> <li>索引失效场景（最左匹配和前缀匹配原则）</li> <li>SQL 优化效率三角（query，index，explain）</li> <li>数据一致性：强一致和最终一致</li></ul></div></div> <hr style="margin:30px 0;border:1px solid #ddd;"> <div style="background:#f0f4ff;border-left:6px solid #3b82f6;border-radius:12px;padding:16px 20px;margin:20px 0;"><h3 style="margin-top:0;color:#1e40af;">⭐ STAR 叙事法则</h3> <p>在某某情景下（Situation），接到了什么任务（Task），如何采取行动（Action），收到了什么结果（Result）</p></div> <div style="background:#fff9e6;border-left:6px solid #f59e0b;border-radius:12px;padding:16px 20px;margin:20px 0;"><h3 style="margin-top:0;color:#b45309;">📐 如何把话说清楚？金字塔思维</h3> <ol style="margin-bottom:0;"><li><strong>结论先行</strong>：先说结论，稳住领导</li> <li><strong>逻辑呈现</strong>（逻辑呈现公式）
      <ul><li>时间流程式：阶段一 → 阶段二 → 阶段三</li> <li>演绎推理式：因为 ... 所以 ... 进而 ...</li> <li>空间维度式：角度一 + 角度二 + 角度三</li> <li>SWOT 分析（优势/劣势/机会/威胁）</li> <li>WWH 公式：Why → When → How</li></ul></li> <li><strong>论据证明</strong>：摆事实讲道理</li></ol></div> <div style="background:#e6f7f0;border-left:6px solid #10b981;border-radius:12px;padding:16px 20px;margin:20px 0;"><h3 style="margin-top:0;color:#047857;">🎭 角色定义 &gt; 任务驱动</h3> <p>我们总是在 system prompt 中预先定义 ai 的角色，这相当有用，对于人类也一样，比起列任务清单，不如定义自己为某某，例如把<code style="background:#d1fae5;padding:2px 6px;border-radius:6px;">todolist 和 plan</code>改成<code style="background:#d1fae5;padding:2px 6px;border-radius:6px;">我是一个雷打不动日更的 Github 博主</code>，问题就会在日积月累中解决</p></div> <div style="background:#f8f9fc;border-radius:16px;padding:16px 20px;margin:20px 0;border:1px solid #e0e4e8;"><h3 style="margin-top:0;">⚛️ 第一性原理</h3> <table style="width:100%;border-collapse:collapse;text-align:left;"><thead><tr><th style="border-bottom:2px solid #ddd;padding:8px;"> </th> <th style="border-bottom:2px solid #ddd;padding:8px;">true</th> <th style="border-bottom:2px solid #ddd;padding:8px;">false</th></tr></thead> <tbody><tr><td style="border-bottom:1px solid #eee;padding:8px;">学习</td><td style="border-bottom:1px solid #eee;padding:8px;">自学</td><td style="border-bottom:1px solid #eee;padding:8px;">督促</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">自学</td><td style="border-bottom:1px solid #eee;padding:8px;">总结</td><td style="border-bottom:1px solid #eee;padding:8px;">努力</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">总结</td><td style="border-bottom:1px solid #eee;padding:8px;">表达</td><td style="border-bottom:1px solid #eee;padding:8px;">重复</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">表达</td><td style="border-bottom:1px solid #eee;padding:8px;">逻辑</td><td style="border-bottom:1px solid #eee;padding:8px;">形式</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">逻辑</td><td style="border-bottom:1px solid #
