</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div> <div style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#764ba2;margin-top:12px;">🐳 1. K8S 基础</h3> <ul><li><a href="https://www.bilibili.com/video/BV12L411a7Ne/?spm_id_from=333.337.search-card.all.click&amp;vd_source=757c95a458d7c9501de959636f126d0a">速学 150 个 Linux 常用命令</a></li> <li>旁路快照</li> <li>容器编排</li> <li>Harness Engineering 和 Cube Sandbox</li> <li>K8S 的自动水平扩容 HPA</li></ul></div></div> <div style="background:linear-gradient(135deg, #f093fb 0%, #f5576c 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#c0392b;margin-top:12px;">📨 2. 消息队列</h3> <ul><li>消息队列堆积怎么办？死信队列怎么处理？</li> <li>Kafka 日志如何确认消费，MQ 最佳实践</li></ul></div></div> <div style="background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#2980b9;margin-top:12px;">🔍 3. 智能体</h3> <ul><li>传统 RAG 和 ES 索引</li> <li>向量数据库和 ANN 算法</li> <li>长任务的续跑</li></ul></div></div> <div style="background:linear-gradient(135deg, #fa709a 0%, #fee140 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#e67e22;margin-top:12px;">⚡ 4. 键值数据库</h3> <ul><li>Redis 限流算法，令牌桶和漏桶</li></ul></div></div> <div style="background:linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);padding:1px;border-radius:16px;margin:20px 0;"><div style="background:white;border-radius:16px;padding:8px 20px 20px 20px;"><h3 style="color:#27ae60;margin-top:12px;">🗄️ 5. 关系数据库</h3> <ul><li>Skip Scan 索引跳跃式扫描</li> <li>索引失效场景（最左匹配和前缀匹配原则）</li> <li>SQL 优化效率三角（query，index，explain）</li> <li>数据一致性：强一致和最终一致</li> <li>分库分表，水平与垂直，什么时候分怎么分</li></ul></div></div> <hr style="margin:30px 0;border:1px solid #ddd;"> <div style="background:#f0f4ff;border-left:6px solid #3b82f6;border-radius:12px;padding:16px 20px;margin:20px 0;"><h3 style="margin-top:0;color:#1e40af;">⭐ STAR 法则 Plus</h3> <p>Situation - Task - Action - Result - Think / Reflection / Value</p> <p>在某某情景下（Situation），接到了什么任务（Task），如何采取行动（Action），收到了什么结果（Result），有怎样的反思（Think），收到了什么反馈（Reflection），产生了怎样的收益 / 口碑（Value）</p></div> <div style="background:#fff9e6;border-left:6px solid #f59e0b;border-radius:12px;padding:16px 20px;margin:20px 0;"><h3 style="margin-top:0;color:#b45309;">📐 金字塔思维把话说明白</h3> <ol style="margin-bottom:0;"><li><strong>结论先行</strong>：先说结论，稳住领导</li> <li><strong>逻辑呈现</strong>（逻辑呈现公式）
      <ul><li>时间流程式：阶段一 → 阶段二 → 阶段三</li> <li>演绎推理式：因为 ... 所以 ... 进而 ...</li> <li>空间维度式：角度一 + 角度二 + 角度三</li> <li>SWOT 分析（优势/劣势/机会/威胁）</li> <li>WWH 公式：Why → When → How</li></ul></li> <li><strong>论据证明</strong>：摆事实讲道理</li></ol></div> <div style="background:#e6f7f0;border-left:6px solid #10b981;border-radius:12px;padding:16px 20px;margin:20px 0;"><h3 style="margin-top:0;color:#047857;">🎭 角色定义 &gt; 任务驱动</h3> <p>我们总是在 system prompt 中预先定义 ai 的角色，这相当有用，对于人类也一样，比起列任务清单，不如定义自己为某某，例如把<code style="background:#d1fae5;padding:2px 6px;border-radius:6px;">todolist 和 plan</code>改成<code style="background:#d1fae5;padding:2px 6px;border-radius:6px;">我是一个雷打不动日更的 Github 博主</code>，问题就会在日积月累中解决</p></div> <div style="background:#f8f9fc;border-radius:16px;padding:16px 20px;margin:20px 0;border:1px solid #e0e4e8;"><h3 style="margin-top:0;">⚛️ 第一性原理</h3> <table style="width:100%;border-collapse:collapse;text-align:left;"><thead><tr><th style="border-bottom:2px solid #ddd;padding:8px;"> </th> <th style="border-bottom:2px solid #ddd;padding:8px;">true</th> <th style="border-bottom:2px solid #ddd;padding:8px;">false</th></tr></thead> <tbody><tr><td style="border-bottom:1px solid #eee;padding:8px;">学习</td><td style="border-bottom:1px solid #eee;padding:8px;">自学</td><td style="border-bottom:1px solid #eee;padding:8px;">督促</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">自学</td><td style="border-bottom:1px solid #eee;padding:8px;">总结</td><td style="border-bottom:1px solid #eee;padding:8px;">努力</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">总结</td><td style="border-bottom:1px solid #eee;padding:8px;">表达</td><td style="border-bottom:1px solid #eee;padding:8px;">重复</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">表达</td><td style="border-bottom:1px solid #eee;padding:8px;">逻辑</td><td style="border-bottom:1px solid #eee;padding:8px;">形式</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">逻辑</td><td style="border-bottom:1px solid #eee;padding:8px;">理解</td><td style="border-bottom:1px solid #eee;padding:8px;">模板</td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;">理解</td><td style="border-bottom:1px solid #eee;padding:8px;">实践</td><td style="border-bottom:1px solid #eee;padding:8px;">理论</td></tr></tbody></table></div> <div style="background:#f8f9fc;border-radius:16px;padding:16px 20px;margin:20px 0;border:1px solid #e0e4e8;overflow-x:auto;"><h3 style="margin-top:0;">📚 龙的馈赠</h3> <table style="width:100%;border-collapse:collapse;"><thead><tr><th style="border-bottom:2px solid #ddd;padding:8px;text-align:left;">学习网站</th> <th style="border-bottom:2px solid #ddd;padding:8px;text-align:left;"> </th> <th style="border-bottom:2px solid #ddd;padding:8px;text-align:left;"> </th> <th style="border-bottom:2px solid #ddd;padding:8px;text-align:left;"> </th></tr></thead> <tbody><tr><td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://www.codefather.cn/course">鱼皮编程导航</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://bugstack.cn/">小傅哥 bugstack 虫洞栈</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://javaguide.cn/">Java 面试指南 JavaGuide</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://xiaolincoding.com/">小林 coding Java 面试学习</a></td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://www.programmercarl.com/">代码随想录程序员 Carl 卡哥</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://golangstar.cn/">秀才的进阶之路</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://labuladong.online/algo/home/">labuladong 的算法笔记</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://javabetter.cn/">二哥的 Java 进阶之路</a></td></tr> <tr><td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://linux.do/">LINUX DO 新的理想型社区</a></td> <td style="border-bottom:1px solid #eee;padding:8px;"><a href="https://v2ex.com/">V2
