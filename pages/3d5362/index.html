or">#</a> 工作</h2> <h3 id="huawei-icsl"><a href="#huawei-icsl" class="header-anchor">#</a> HuaWei ICSL</h3> <p>开智这一块，实习最重要的是拓宽视野，增加知识的广度以确认未来方向，次要是技术积累</p> <ul><li>打球和做业务一样，都是上网学，固定好框架，发力集中，讲究技巧和效率</li> <li>最大的优点就是业务理解的好，拆解的好，有自己的思考，擅于把业务做好就是最大的成功</li></ul> <p>AI 开发是风口</p> <ul><li>实习：腾讯，字节，阿里，百度，美团，京东</li> <li>校招：字节，腾讯，OV，虾皮，华为</li></ul> <p>找工作无非：平台、技术方向、Base 地和薪资</p> <p>技巧和项目</p> <ul><li>学习方法：记忆曲线、费曼学习法</li> <li>后端项目（微服务 + DDD）：点赞系统、短链系统、刚果商城</li> <li>安全项目：RASP 链路监控与漏洞防护</li> <li>轮子项目：mini spring cloud、guide-rpc-framework</li></ul> <h3 id="baidu-wenku"><a href="#baidu-wenku" class="header-anchor">#</a> Baidu Wenku</h3> <p>做业务不会增长技术，只会累积经验，真正的技术成长都是在做业务之余终生学习，偷学组里核心代码</p> <p>熟悉业务，一定要勤问，问清楚之后，再开始编码</p> <ol><li>先问架构，摸清组织架构、项目架构</li> <li>再问业务，针对具体业务，针对性的逮人问业务流程，上下游调用</li> <li>最后问 AI，理清具体代码逻辑，数据流转、状态转移</li></ol> <p>关于需求，有疑问一定要及时反馈，只要事情和对方有关系就要及时说，切忌单方面做共同决定，永远不要默认他人的决定，即使出现歧义的概率很小也要 mock 到</p> <ol><li>问清楚产品需要的效果</li> <li>理清楚接口的调用流程，链路一定要 cover 全</li> <li>记清楚失败情况的日志</li></ol> <p>能够好好工作的关键在于人脑上下文切换，当同时面临多个需求和多种压力，能够任意的切换对话去应对，是保持工作生活平衡的关键</p> <p>周末延长五步法</p> <ol><li>下班回家先洗澡：切换成生活状态</li> <li>周四当大扫除日：为周末提前解决麻烦事</li> <li>周五当狂欢日：安排值得期待的事</li> <li>周六当早起日：上午可以做很多事</li> <li>周日当收心日：早睡觉</li></ol> <h3 id="bytedance-flow"><a href="#bytedance-flow" class="header-anchor">#</a> ByteDance Flow</h3> <p>找工作全靠勇气、运气、托举和接纳，个人的努力是微不足道的，都是靠狗运找来的，不要有自己总是能找到工作的错觉</p> <h2 id="租房"><a href="#租房" class="header-anchor">#</a> 租房</h2> <p>租房教训</p> <ul><li>应该尽量短租，比如预计三个月，那么就应该先租两个月</li> <li>一定要先测完再签合同再交钱，交钱之后房东就是爷了</li> <li>重点检查项：洗衣机排水，花洒出水，空调是否漏水，卫生环境（潮湿、蚊虫等），白天看采光，晚上看隔音</li></ul> <p>可以提前一天中午到，将行李放在某一个房东处，看半天房，如果没有合适的住一晚酒店第二天再看</p> <p>另外，注意通勤时间，不仅仅是时长，还有时间段的限制，先问清楚大概什么时候上下班，再在合适的区间内选取合适的通勤区间</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/04/13, 19:45:04</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/mao/" class="page-nav-centre page-nav-centre-prev"><div cl
