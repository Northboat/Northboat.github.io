class="header-anchor">#</a> HW ICSL</h3> <p>开智了属于是，实习最重要的是拓宽视野，增加知识的广度以确认未来方向，技术的积累是次要的</p> <ul><li>老陕：打球和学业务一样，都是上网学，固定好框架，发力集中，讲究技巧和效率</li> <li>大叔：我最大的优点就是业务理解的好，拆解的好，有自己的思考，擅于把业务做好就是最大的成功</li></ul> <p>找工作 AI 开发是风口</p> <ul><li>实习：腾讯，阿里，字节，美团，京东</li> <li>校招：Oppo，Vivo，虾皮，腾讯，华为</li></ul> <p>技巧和项目</p> <ul><li>学习方法：记忆曲线、费曼学习法</li> <li>业务项目（微服务 + DDD）：点赞系统、短链系统、刚果商城</li> <li>安全项目：RASP 链路监控与漏洞防护</li> <li>轮子项目：mini spring cloud、guide-rpc-framework</li></ul> <h2 id="租房"><a href="#租房" class="header-anchor">#</a> 租房</h2> <p>租房教训</p> <ul><li>应该尽量短租，比如预计三个月，那么就应该先租两个月</li> <li>一定要先测完再签合同再交钱，交钱之后房东就是爷了</li> <li>重点检查项：洗衣机排水，花洒出水，空调是否漏水，卫生环境（潮湿、蚊虫等），白天看采光，晚上看隔音</li></ul> <p>可以提前一天中午到，将行李放在某一个房东处，看半天房，如果没有合适的住一晚酒店第二天再看</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/01, 13:24:26</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/633508/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">调酒基础</div></a> <a href="/pages/about/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">本站</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
