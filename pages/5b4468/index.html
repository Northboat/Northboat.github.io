p>简单的分类器训练及测试（交叉验证）</p> <h3 id="load-digits"><a href="#load-digits" class="header-anchor">#</a> load_digits</h3> <p><code>scikit-learn</code>中自带了很多的数据集在<code>sklearn.datasets</code>模块中，<code>load_digits</code>是其中一个用于识别手写数字的数据集</p> <p>导入<code>load_digits</code>并展示其数据集和结果</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>datasets <span class="token keyword">import</span> load_digits
<span class="token comment"># 关于手写数字识别的数据集</span>
<span class="token keyword">import</span> matplotlib<span class="token punctuation">.</span>pyplot <span class="token keyword">as</span> plt

<span class="token comment"># X的每行是64个图像像素的强度</span>
<span class="token comment"># y是每个图片识别出来的数字0-9</span>

<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;y:\n&quot;</span><span class="token punctuation">,</span> y<span class="token punctuation">)</span>

<span class="token comment"># 绘制一下图片，灰度图</span>
plt<span class="token punctuation">.</span>imshow<span class="token punctuation">(</span>X<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">,</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span> cmap<span class="token operator">=</span><span class="token string">'gray'</span><span class="token punctuation">)</span>

g6Hw/SEJZ+fn9MTuBG3+sYvl8v0BMhwAQQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAmPvpAXBtl8tlesKSx8fH6Qk5h8NhesKSW30r5/N5egJkuAACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQMy27/s+PYLbtG3b9IQlx+NxesKSr6+v6QnL3t7epicseX5+np6w5Fbf+NPT0/SEHAnQ5QIIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgZtv3fZ8ewW3atm16Qsrr6+v0hGXv7+/TE5Z8f39PT1jy8vIyPYEbIQG6XAABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIGbb932fHgEAwPW4AAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBiBCAAQIwABACIEYAAADECEAAgRgACAMQIQACAGAEIABAjAAEAYgQgAECMAAQAiBGAAAAxAhAAIEYAAgDECEAAgBgBCAAQIwABAGIEIABAjAAEAIgRgAAAMQIQACBGAAIAxAhAAIAYAQgAECMAAQBi/gLfllW5AIoHdwAAAABJRU5ErkJggg=="> <div class="language-bash extra-class"><pre class="language-bash"><code>the digit <span class="token keyword">in</span> the image is:  <span class="token number">0</span>
</code></pre></div><p>通过<code>train_test_split</code>将数据集分割成独立的多个</p> <ul><li>若干独立的数据集和测试集可以用于训练机器学习模型</li></ul> <div class="language-python extra-class"><pre class="language-python"><code><span class="token comment"># 手动分割数据集</span>
<span class="token comment"># 用多个独立的数据集训练模型</span>
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>model_selection <span class="token keyword">import</span> train_test_split

X_train<span class="token punctuation">,</span> X_test<span class="token punctuation">,</span> y_train<span class="token punctuation">,</span> y_test <span class="token operator">=</span> train_test_split<span class="token punctuation">(</span>X<span class="token punctuation">,</span> y<span class="token punctuation">,</span> stratify<span class="token operator">=</span>y<span class="token punctuation">,</span> random_state<span class="token operator">=</span><span class="token number">12</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>X_test<span class="token punctuation">)</span>
</code></pre></div><ul><li>这里<code>X_test</code>为两个独立的数据集（矩阵）</li></ul> <p>建立模型并进行训练、测试</p> <ul><li>用<code>classifier.fit(x, y)</code>进行训练，传入的是数据集</li> <li>用<code>classifier.score(x, y)</code>进行测试，传入的是准确的测试用例，即测试集</li></ul> <div class="language-python extra-class"><pre class="language-python"><code><span class="token comment"># 一旦拥有独立的训练和测试集，就可以使用fit方法学习机器学习模型</span>
<span class="token comment"># 用score方法测试此方法</span>
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>linear_model <span class="token keyword">import</span> LogisticRegression <span class="token comment"># 选择线性回归模型</span>
<span class="token comment"># 建立线性回归模型</span>
clf1 <span class="token operator">=</span> LogisticRegression<span class="token punctuation">(</span>solver<span class="token operator">=</span><span class="token string">'lbfgs'</span><span class="token punctuation">,</span>
                         multi_class<span class="token operator">=</span><span class="token string">'ovr'</span><span class="token punctuation">,</span> max_iter<span class="token operator">=</span><span class="token number">5000</span><span class="token punctuation">,</span> random_state<span class="token operator">=</span><span class="token number">12</span><span class="token punctuation">)</span>
<span class="token comment"># 通过已有数据集进行学习</span>
clf1<span class="token punctuation">.</span>fit<span class="token punctuation">(</span>X_train<span class="token punctuation">,</span> y_train<span class="token punctuation">)</span>
accuracy1 <span class="token operator">=</span> clf1<span class="token punctuation">.</span>score<span class="token punctuation">(</span>X_test<span class="token punctuation">,</span> y_test<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'Accuracy score of the {} is {:.2f}'</span><span class="token punctuation">.</span><span class="token builtin">format</span><span class="token punctuation">(</span>clf1<span class="token punctuation">.</span>__class__<span class="token punctuation">.</span>__name__<span class="token punctuation">,</span> accuracy1<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><div class="language-bash extra-class"><pre class="language-bash"><code>Accuracy score of the LogisticRegression is <span class="token number">0.97</span>
</code></pre></div><ul><li>这里使用的是线性回归模型，<code>scikit_learn</code>的<code>api</code>在各模型中保持一致</li></ul> <p>随机森林模型</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token comment"># 同样我们还可以使用RandomForest模型进行学习，api基本保持一致</span>
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>ensemble <span class="token keyword">import</span> RandomForestClassifier
<span class="token comment"># 建立模型</span>
clf2 <span class="token operator">=</span> RandomForestClassifier<span class="token punctuation">(</span>n_estimators<span class="token operator">=</span><span class="token number">100</span><span class="token punctuation">,</span> n_jobs<span class="token operator">=</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">,</span>
                              random_state<span class="token operator">=</span><span class="token number">12</span><span class="token punctuation">)</span>
clf2<span class="token punctuation">.</span>fit<span class="token punctuation">(</span>X_train<span class="token punctuation">,</span> y_train<span class="token punctuation">)</span>
accuracy2 <span class="token operator">=</span> clf2<span class="token punctuation">.</span>score<span class="token punctuation">(</span>X_test<span class="token punctuation">,</span> y_test<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'Accuracy score of the {} is {:.2f}'</span><span class="token punctuation">.</span><span class="token builtin">format</span><span class="token punctuation">(</span>clf2<span class="token punctuation">.</span>__class__<span class="token punctuation">.</span>__name__<span class="token punctuation">,</span> accuracy2<span class="token punctuation">)</span><span class="token punctuation">)</span>

y <span class="token operator">=</span> data<span class="token punctuation">[</span><span class="token string">'class'</span><span class="token punctuation">]</span>
X <span class="token operator">=</span> data<span class="token punctuation">.</span>drop<span class="token punctuation">(</span>columns<span class="token operator">=</span><span class="token punctuation">[</span><span class="token string">'class'</span><span class="token punctuation">,</span> <span class="token string">'fnlwgt'</span><span class="token punctuation">,</span> <span class="token string">'capitalgain'</span><span class="token punctuation">,</span> <span class="token string">'capitalloss'</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token comment"># print(X)</span>

<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>preprocessing <span class="token keyword">import</span> LabelEncoder
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>model_selection <span class="token keyword">import</span> train_test_split

X_train<span class="token punctuation">,</span> X_test<span class="token punctuation">,</span> y_train<span class="token punctuation">,</span> y_test <span class="token operator">=</span> train_test_split<span class="token punctuation">(</span>X<span class="token punctuation">,</span> y<span class="token punctuation">,</span> random_state<span class="token operator">=</span><span class="token number">12</span><span class="token punctuation">)</span>
<span class="token comment"># print(y_train)</span>
encoder <span class="token operator">=</span> LabelEncoder<span class="token punctuation">(</span><span class="token punctuation">)</span>
y_train <span class="token operator">=</span> encoder<span class="token punctuation">.</span>fit_transform<span class="token punctuation">(</span>y_train<span class="token punctuation">)</span>
y_test <span class="token operator">=</span> encoder<span class="token punctuation">.</span>transform<span class="token punctuation">(</span>y_test<span class="token punctuation">)</span>

<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>pipeline <span class="token keyword">import</span> make_pipeline
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>impute <span class="token keyword">import</span> SimpleImputer
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>preprocessing <span class="token keyword">import</span> StandardScaler
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>preprocessing <span class="token keyword">import</span> OneHotEncoder
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>compose <span class="token keyword">import</span> make_column_transformer
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>linear_model <span class="token keyword">import</span> LogisticRegression
<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>model_selection <span class="token keyword">import</span> GridSearchCV

pre_cat <span class="token operator">=</span> make_pipeline<span class="token punctuation">(</span>SimpleImputer<span class="token punctuation">(</span>strategy<span class="token operator">=</span><span class="token string">'constant'</span><span class="token punctuation">)</span><span class="token punctuation">,</span> OneHotEncoder<span class="token punctuation">(</span>handle_unknown<span class="token operator">=</span><span class="token string">'ignore'</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
pre_num <span class="token operator">=</span> make_pipeline<span class="token punctuation">(</span>SimpleImputer<span class="token punctuation">(</span>strategy<span class="token operator">=</span><span class="token string">'mean'</span><span class="token punctuation">)</span><span class="token punctuation">,</span> StandardScaler<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>

col_cat <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token string">'workclass'</span><span class="token punctuation">,</span> <span class="token string">'education'</span><span class="token punctuation">,</span> <span class="token string">'marital-status'</span><span class="token punctuation">,</span> <span class="token string">'relationship'</span><span class="token punctuation">,</span> <span class="token string">'race'</span><span class="token punctuation">,</span> <span class="token string">'sex'</span><span class="token punctuation">,</span> <span class="token string">'native-country'</span><span class="token punctuation">]</span>
col_num <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token string">'age'</span><span class="token punctuation">,</span> <span class="token string">'education-num'</span><span class="token punctuation">,</span> <span class="token string">'hoursperweek'</span><span class="token punctuation">]</span>

preprocessor <span class="token operator">=</span> make_column_transformer<span class="token punctuation">(</span><span class="token punctuation">(</span>pre_cat<span class="token punctuation">,</span> col_cat<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token punctuation">(</span>pre_num<span class="token punctuation">,</span> col_num<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># preprocessor.fit(X_train, y_train)</span>

pipe <span class="token operator">=</span> make_pipeline<span class="token punctuation">(</span>preprocessor<span class="token punctuation">,</span> LogisticRegression<span class="token punctuation">(</span>solver<span class="token operator">=</span><span class="token string">'lbfgs'</span><span class="token punctuation">,</span> max_iter<span class="token operator">=</span><span class="token number">5000</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># pipe.fit(X_train, y_train)</span>

param <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token string">'logisticregression__C'</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token number">0.1</span><span class="token punctuation">,</span> <span class="token number">1.0</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">]</span><span class="token punctuation">}</span>
grid <span class="token operator">=</span> GridSearchCV<span class="token punctuation">(</span>pipe<span class="token punctuation">,</span> param_grid<span class="token operator">=</span>param<span class="token punctuation">,</span> cv<span class="token operator">=</span><span class="token number">5</span><span class="token punctuation">,</span> n_jobs<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span>
grid<span class="token punctuation">.</span>fit<span class="token punctuation">(</span>X_train<span class="token punctuation">,</span> y_train<span class="token punctuation">)</span>
accuracy <span class="token operator">=</span> grid<span class="token punctuation">.</span>score<span class="token punctuation">(</span>X_test<span class="token punctuation">,</span> y_test<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'accuracy of the {} is {:.2f}'</span><span class="token punctuation">.</span><span class="token builtin">format</span><span class="token punctuation">(</span>grid<span class="token punctuation">.</span>__class__<span class="token punctuation">.</span>__name__<span class="token punctuation">,</span> accuracy<span class="token punctuation">)</span><span class="token punctuation">)</span>

<span class="token keyword">from</span> sklearn<span class="token punctuation">.</span>model_selection <span class="token keyword">import</span> cross_validate
<span class="token keyword">import</span> matplotlib<span class="token punctuation">.</span>pyplot <span class="token keyword">as</span> plt
scores <span class="token operator">=</span> pd<span class="token punctuation">.</span>DataFrame<span class="token punctuation">(</span>cross_validate<span class="token punctuation">(</span>grid<span class="token punctuation">,</span> X<span class="token punctuation">,</span> y<span class="token punctuation">,</span> scoring<span class="token operator">=</span><span class="token string">'balanced_accuracy'</span><span class="token punctuation">,</span> cv<span class="token operator">=</span><span class="token number">3</span><span class="token punctuation">,</span> n_jobs<span class="token operator">=</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">,</span> return_train_score<span class="token operator">=</span><span class="token boolean">True</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>scores<span class="token punctuation">)</span>
scores<span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token string">'train_score'</span><span class="token punctuation">,</span> <span class="token string">'test_score'</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">.</span>boxplot<span class="token punctuation">(</span>whis<span class="token operator">=</span><span class="token number">10</span><span class="token punctuation">)</span>
