-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>翻译</p> <ul><li>翻译插件：<a href="https://github.com/windingwind/zotero-pdf-translate" target="_blank" rel="nofollow noopener noreferrer">windingwind/zotero-pdf-translate: Translate PDF, EPub, webpage, metadata, annotations, notes to the target language. Support 20+ translate services.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>在工具栏找到插件，通过本地<code>.xpi</code>文件导入插件；而后在 Zotero 编辑 - 设置找到翻译一栏，选择翻译服务源即可使用</li></ul> <p>存储：数据存储位置：编辑 - 设置 - 高级 - 数据存储位置，自定义本地文件目录即可</p> <p>云同步：坚果云</p> <h3 id="流程图规范"><a href="#流程图规范" class="header-anchor">#</a> 流程图规范</h3> <p>符号要求</p> <ul><li>圆角矩形：开始或结束</li> <li>长方形：流程，一个步骤或操作</li> <li>菱形：判定</li> <li>平行四边形：数据</li></ul> <p>结构</p> <ul><li>顺序</li> <li>选择</li> <li>循环</li></ul> <h3 id="论文写作"><a href="#论文写作" class="header-anchor">#</a> 论文写作</h3> <ul><li>overleaf 在线编辑</li> <li>vscode + texlive + sumtrapdf 本地编辑</li></ul> <h2 id="专利"><a href="#专利" class="header-anchor">#</a> 专利</h2> <h3 id="专利申请"><a href="#专利申请" class="header-anchor">#</a> 专利申请</h3> <p>专利，Love From Long</p> <ul><li>佰腾网搜索相关内容</li> <li>越晦涩越专业越好</li></ul> <p>网上申请流程</p> <ul><li><a href="https://www.cnipa.gov.cn" target="_blank" rel="nofollow noopener noreferrer">办事指南<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cponline.cnipa.gov.cn" target="_blank" rel="nofollow noopener noreferrer">网上申请<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.cnipa.gov.cn/col/col192/index.html" target="_blank" rel="nofollow noopener noreferrer">表格下载<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="专利技术交底书"><a href="#专利技术交底书" class="header-anchor">#</a> 专利技术交底书</h3> <p>1️⃣ 本发明要解决的技术问题是什么？（160 字）</p> <p>对应现有技术的所有缺点，一一正面描述本发明所要解决的技术问题</p> <p>2️⃣ 详细介绍技术背景，并描述已有的与本发明最相近的实现方案（1200 字）</p> <p>包括两部分：背景技术及现有技术方案，应详细介绍</p> <p>3️⃣ 现有技术的缺点是什么？针对这些缺点，说明本发明的目的（300 字）</p> <p>现有技术的缺点是针对本发明的优点来说的，例如现有技术的缺点可以是成本高，效率底，耗时间等类似问题</p> <p>4️⃣ 本发明技术方案的详细阐述，应该结合附图进行说明（2400 字）</p> <p>结构说明、原理说明、动作关系说明等</p> <p>5️⃣ 本发明的关键点和保护点是什么？（1000 字）</p> <p>发明内容部分提供的是为完成一定功能的完整技术方案，本部分是提炼出技术方案的关键创新点，列出 1、2、3...，以提醒代理人注意，便于专利代理人撰写权利要求书</p> <p>6️⃣ 与第 2 部分所属的最好的现有技术相比，本发明有何优点？（500 字）</p> <p>效果一定要结合发明内容的技术方案来描述，做到有理有据；也可以对应本发明所要解决的技术问题来描述，一定是采用本发明技术方案带来的效果；效果可以是降低成本，提高了效率等</p> <p>7️⃣ 针对第 4 部分的技术方案，是否还有其他替代方案同样能完成发明目的？（NULL）</p> <p>如果有，请尽量详细写明，内容的提供可以扩大专利的保护范围，防止他人绕过本技术去实现同样的发明目的；“替代方案”可以是部分结构、器件、方法步骤的替代，也可以是完整技术方案的替代</p> <p>8️⃣ 附图及说明</p> <p>每幅图都应有相应的附图说明，尽量提供能清楚地显示本发明技术特征的图，如3D图、剖视图、工作原理、控制流程图等</p> <p>9️⃣ 附件</p> <p>如有相关参考文献（如专利/论文/期刊），也请提供</p> <p><strong>写技术交底书需注意</strong></p> <ol><li>避免使用英文单词，英文缩写应有中文译文</li> <li>专利法规定
<ul><li>专利必须是一个技术方案，应该阐述发明目的是通过什么技术方案来实现的，不能只有原理，也不能只做功能介绍</li> <li>专利必须充分公开，以本领域技术人员不需付出创造性劳动即可实现为准</li></ul></li></ol> <h3 id="专利说明书"><a href="#专利说明书" class="header-anchor">#</a> 专利说明书</h3> <p>1️⃣ 说明书摘要</p> <p>2️⃣ 摘要附图</p> <p>3️⃣ 权利要求书</p> <p>4️⃣ 说明书</p> <ol><li>技术领域</li> <li>背景技术</li> <li>发明内容</li> <li>附图说明</li> <li>具体实施方式</li></ol> <p>5️⃣ 说明书附图</p> <h2 id="idea"><a href="#idea" class="header-anchor">#</a> IDEA</h2> <p>移动设备群的批量认证和权限切换</p> <p>参考文献</p> <ol><li><p>Privacy-Aware Secure Region-Based Handover for  Small Cell Networks in 5G-Enabled  Mobile Communication</p> <p>讲的是 5G 网络环境下，移动设备与基站之间的快速的网络切换，主要依赖于可擦除签名实现权限的切割和设备的快速切换，同时用到 DH 密钥协商和 AES 算法加密通信过程中信息，实现高安全性</p></li> <li><p>Quantum2FA: Efficient Quantum-Resistant Two-Factor Authentication Scheme for Mobile Devices</p> <p>一个抗量子的 DH 协商方案，基于格上的 LWE 问题</p></li> <li><p>CRYSTALS – Kyber: a CCA-secure module-lattice-based KEM</p> <p>抗量子的 KEM 方案，可以考虑用 KEM 替换掉 DH 密钥协商</p></li></ol> <p>数据结构：跳表（SkipList），跳表中每个结点存储一个 KV 对</p> <ol><li>抗量子协商 → 抗量子的 DH 方案 / Kyber KEM 方案</li> <li>抗量子签名 → Falcon 签名</li> <li>快速切换 / 权限切割 → 可擦除签名，变色龙哈希</li></ol> <p>群组认证 → 聚合签名：聚合签名采用联邦学习的方式进行</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/mao/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">太阳照常升起</div></a> <a href="/pages/bca741/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">英语阅读与写作</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
