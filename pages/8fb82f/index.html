matrix <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span>
    <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token punctuation">[</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">6</span><span class="token punctuation">,</span><span class="token number">9</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">7</span><span class="token punctuation">,</span><span class="token number">8</span><span class="token punctuation">]</span>
<span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>matrix<span class="token punctuation">)</span>

<span class="token comment"># 维度</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;dim of matrix: &quot;</span><span class="token punctuation">,</span> matrix<span class="token punctuation">.</span>ndim<span class="token punctuation">)</span>
<span class="token comment"># (行,列)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'shape of matrix: '</span><span class="token punctuation">,</span> matrix<span class="token punctuation">.</span>shape<span class="token punctuation">)</span>
<span class="token comment"># 元素个数</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'size of matrix: '</span><span class="token punctuation">,</span> matrix<span class="token punctuation">.</span>size<span class="token punctuation">)</span>
</code></pre></div><p>这里的维度非常智能，可以自行判断其向量间是否线性无关</p> <p>注意通常的<code>python</code>环境并不包含这个库，要自己安装，<code>Anaconda</code>的<code>base</code>环境中自带，需要在<code>VSCode</code>中手动选择默认<code>python</code>环境：<code>ctrl+shift+p</code>输入<code>select Interpreter</code>切换环境</p> <h3 id="创建矩阵"><a href="#创建矩阵" class="header-anchor">#</a> 创建矩阵</h3> <p>创建一维矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np
a <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">,</span> dtype<span class="token operator">=</span>np<span class="token punctuation">.</span>int32<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>a<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token builtin">type</span><span class="token punctuation">(</span>a<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>a<span class="token punctuation">.</span>dtype<span class="token punctuation">)</span>
</code></pre></div><ul><li>通过输出结果可知<code>a</code>实际上是一个类，叫作<code>numpy.ndarray</code></li> <li><code>dtype</code>是矩阵中元素类型，默认为<code>int32</code></li></ul> <p>创建二维矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code>b <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">]</span><span class="token punctuation">,</span><span class="token punctuation">[</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>b<span class="token punctuation">)</span>
</code></pre></div><p>创建零阵</p> <div class="language-python extra-class"><pre class="language-python"><code>c <span class="token operator">=</span> np<span class="token punctuation">.</span>zeros<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span>
</code></pre></div><ul><li>调用<code>zeros((row, colume))</code>函数，入参为一个长度为2的元组，表示零阵的行列大小</li></ul> <p>创建全1阵（不是单位阵捏），同时规定元素类型</p> <div class="language-python extra-class"><pre class="language-python"><code>d <span class="token operator">=</span> np<span class="token punctuation">.</span>ones<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">,</span> dtype<span class="token operator">=</span>np<span class="token punctuation">.</span>int32<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>d<span class="token punctuation">)</span>
</code></pre></div><p>创建空阵，打印结果每个元素都是0，但实际上其实是接近于零的浮点数</p> <div class="language-python extra-class"><pre class="language-python"><code>e <span class="token operator">=</span> np<span class="token punctuation">.</span>empty<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span>
</code></pre></div><p>在范围内按照步长创建值等距的一维数组</p> <div class="language-python extra-class"><pre class="language-python"><code>f <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">21</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>f<span class="token punctuation">)</span>
</code></pre></div><ul><li>参数分别为<code>(start, end, step)</code>，和<code>range</code>函数一样含头不含尾</li></ul> <p>重塑矩阵，改变矩阵的行列数目</p> <div class="language-python extra-class"><pre class="language-python"><code>g <span class="token operator">=</span> f<span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>g<span class="token punctuation">)</span>
</code></pre></div><ul><li>当然要总元素数相同才可以重塑，不同将报错<code>ValueError: cannot reshape array of size 6 into shape (2,4)</code></li></ul> <p>创建线段型数据，即将某一范围内数据分割称<code>n</code>份，组成一维矩阵</p> <p>这里的分割是均分的，含头也含尾，即<code>start</code>将是向量第一个元素，<code>end</code>将是向量最后一个元素，若想按<code>1</code>的步长进行分割，则<code>n</code>要等于<code>end-start+1</code>（分得元素为间隔数+1）</p> <div class="language-python extra-class"><pre class="language-python"><code>h <span class="token operator">=</span> np<span class="token punctuation">.</span>linspace<span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">,</span><span class="token number">11</span><span class="token punctuation">,</span><span class="token number">12</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>h<span class="token punctuation">)</span>
</code></pre></div><p>同样通过<code>linspace()</code>得到的向量也可以重塑</p> <div class="language-python extra-class"><pre class="language-python"><code>i <span class="token operator">=</span> h<span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><h3 id="基本运算"><a href="#基本运算" class="header-anchor">#</a> 基本运算</h3> <p>乘法</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np
a <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">6</span><span class="token punctuation">,</span><span class="token number">7</span><span class="token punctuation">,</span><span class="token number">8</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
b <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>a<span class="token punctuation">,</span>b<span class="token punctuation">)</span>

<span class="token keyword">print</span><span class="token punctuation">(</span>a<span class="token operator">*</span>b<span class="token punctuation">,</span> a<span class="token punctuation">.</span>dot<span class="token punctuation">(</span>b<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p><code>a=[5,6,7,8], b=[0,1,2,3]</code>，<code>a*b</code>是列向量乘行向量，结果仍为一个一维的含四个元素的向量，<code>a.dot(b)</code>是维之和，即行向量乘以列向量，得到单个值</p> <p>乘方，矩阵的幂运算</p> <div class="language-python extra-class"><pre class="language-python"><code>c <span class="token operator">=</span> b<span class="token operator">**</span><span class="token number">2</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span>
</code></pre></div><p>三角函数，将作用于矩阵中每个元素</p> <div class="language-python extra-class"><pre class="language-python"><code>d <span class="token operator">=</span> np<span class="token punctuation">.</span>sin<span class="token punctuation">(</span>a<span class="token punctuation">)</span>
e <span class="token operator">=</span> np<span class="token punctuation">.</span>cos<span class="token punctuation">(</span>b<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>d<span class="token punctuation">,</span> e<span class="token punctuation">)</span>
</code></pre></div><p>数乘，加法运算</p> <div class="language-python extra-class"><pre class="language-python"><code>f <span class="token operator">=</span> b<span class="token operator">*</span><span class="token number">3</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>f<span class="token punctuation">)</span>

g <span class="token operator">=</span> b<span class="token operator">+</span><span class="token number">3</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>g<span class="token punctuation">)</span>
</code></pre></div><p>这里的乘 3 和加 3 都将作用于矩阵中每个元素</p> <p>布尔矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code>i <span class="token operator">=</span> b<span class="token operator">&gt;</span><span class="token number">2</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span>

j <span class="token operator">=</span> a<span class="token operator">==</span>b
<span class="token keyword">print</span><span class="token punctuation">(</span>j<span class="token punctuation">)</span>
</code></pre></div><p>实际上就是将这个条件判断作用于每个元素上，若为真，该位置则为<code>True</code>，为假反之，这样构成的一个新的元素均为布尔值的矩阵</p> <p>二维乘法，当然要保证二者能够相乘</p> <div class="language-python extra-class"><pre class="language-python"><code>k <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">,</span><span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
l <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>k<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>l<span class="token punctuation">)</span>

<span class="token keyword">print</span><span class="token punctuation">(</span>k<span class="token punctuation">.</span>dot<span class="token punctuation">(</span>l<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>l<span class="token punctuation">.</span>dot<span class="token punctuation">(</span>k<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>dot<span class="token punctuation">(</span>k<span class="token punctuation">,</span>l<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>dot<span class="token punctuation">(</span>l<span class="token punctuation">,</span>k<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><ul><li>由于这里是两个<code>2x2</code>的矩阵，左乘和右乘是有明显区别的，这里矩阵乘法的先后顺序也就表示了矩阵乘法的左右，如<code>k.dot(l)/np.dot(k,l)</code>即为<code>k</code>右乘<code>l</code>，结果一样</li> <li>多维矩阵乘法不能之久使用<code>*</code>号</li></ul> <p>矩阵元素求和</p> <div class="language-python extra-class"><pre class="language-python"><code>m <span class="token operator">=</span> np<span class="token punctuation">.</span>random<span class="token punctuation">.</span>random<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>m<span class="token punctuation">)</span>
s <span class="token operator">=</span> np<span class="token punctuation">.</span><span class="token builtin">sum</span><span class="token punctuation">(</span>m<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;sum: &quot;</span><span class="token punctuation">,</span> s<span class="token punctuation">)</span>
</code></pre></div><ul><li><code>np.random.random((i, j))</code>将生成一个<code>i</code>行<code>j</code>列的矩阵，其元素为<code>(0,1)</code>的随机浮点数</li> <li>使用<code>np.sum()</code>函数计算一个矩阵所有元素之和</li></ul> <p>矩阵最大/小元素</p> <div class="language-python extra-class"><pre class="language-python"><code>m2 <span class="token operator">=</span> np<span class="token punctuation">.</span><span class="token builtin">max</span><span class="token punctuation">(</span>m<span class="token punctuation">)</span>
m1 <span class="token operator">=</span> np<span class="token punctuation">.</span><span class="token builtin">min</span><span class="token punctuation">(</span>m<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;max: &quot;</span><span class="token punctuation">,</span> m2<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;min: &quot;</span><span class="token punctuation">,</span> m1<span class="token punctuation">)</span>
</code></pre></div><p>通过<code>axis=1/0</code>参数可以控制求每行/列的和/最大值/最小值</p> <ul><li><code>axis=1</code>表示行</li> <li><code>axis=0</code>表示列</li></ul> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;row sum: &quot;</span><span class="token punctuation">,</span> np<span class="token punctuation">.</span><span class="token builtin">sum</span><span class="token punctuation">(</span>m<span class="token punctuation">,</span> axis<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;colume min: &quot;</span><span class="token punctuation">,</span> np<span class="token punctuation">.</span><span class="token builtin">min</span><span class="token punctuation">(</span>m<span class="token punctuation">,</span> axis<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;row max: &quot;</span><span class="token punctuation">,</span> np<span class="token punctuation">.</span><span class="token builtin">max</span><span class="token punctuation">(</span>m<span class="token punctuation">,</span> axis<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>索引，<code>aij</code>的索引按照从左到右，从上到下的顺序计数，从<code>0</code>开始，如左上角元素索引为<code>0</code>，右下角元素索引为<code>元素总数-1</code></p> <div class="language-python extra-class"><pre class="language-python"><code>A <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">14</span><span class="token punctuation">)</span><span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">)</span>

<span class="token comment"># 最小元素索引</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>argmin<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># 最大元素索引</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>矩阵均值</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>mean<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>average<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">.</span>mean<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>矩阵中位数（按照索引来排）</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>median<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>排序，对每个向量进行从小到大的排序，返回一个排序好的矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>sort<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>转置</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>transpose<span class="token punctuation">(</span>A<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">.</span>T<span class="token punctuation">)</span>
</code></pre></div><p>规范化矩阵元素大小</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>clip<span class="token punctuation">(</span>A<span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">9</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>当元素小于<code>5</code>时，将变成<code>5</code>，将元素大于<code>9</code>，将变成<code>9</code></p> <h3 id="索引和切片"><a href="#索引和切片" class="header-anchor">#</a> 索引和切片</h3> <p>对于一维矩阵（向量），直接通过索引取得的将是单个元素</p> <div class="language-python extra-class"><pre class="language-python"><code>B <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token operator">==</span><span class="token number">1</span><span class="token punctuation">)</span> <span class="token comment"># True</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token operator">==</span><span class="token number">3</span><span class="token punctuation">)</span> <span class="token comment"># True</span>
</code></pre></div><p>对于多维矩阵，其实就相当于多维数组取下标</p> <div class="language-python extra-class"><pre class="language-python"><code>B <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">13</span><span class="token punctuation">)</span><span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token comment"># [1,2,3,4]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token comment"># 1</span>

<span class="token keyword">for</span> row <span class="token keyword">in</span> B<span class="token punctuation">:</span> <span class="token comment"># 一行一行打印</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>row<span class="token punctuation">)</span>
<span class="token keyword">for</span> colume <span class="token keyword">in</span> B<span class="token punctuation">.</span>T<span class="token punctuation">:</span> <span class="token comment"># 一列一列打印</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>colume<span class="token punctuation">)</span>
</code></pre></div><p>切片，有点像切片字符串</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">:</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token comment"># [6,7]</span>
</code></pre></div><p>第<code>1</code>行的第<code>1-2</code>元素组成的向量（这里的数字均为下标）</p> <p>多维转一维，按照索引构成一个一维矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code>C <span class="token operator">=</span> B<span class="token punctuation">.</span>flatten<span class="token punctuation">(</span><span class="token punctuation">)</span>
D <span class="token operator">=</span> <span class="token builtin">list</span><span class="token punctuation">(</span>B<span class="token punctuation">.</span>flat<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>D<span class="token punctuation">)</span>
</code></pre></div><p>这里<code>B.flat</code>得到的是一个迭代器，为<code>Object</code>，通过<code>list</code>转为一维数组</p> <h3 id="矩阵合并"><a href="#矩阵合并" class="header-anchor">#</a> 矩阵合并</h3> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np

A <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">6</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
B <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">)</span>
</code></pre></div><ul><li>这里的<code>A，B</code>都是向量，而不是矩阵</li> <li><code>[[1,2,3]]</code>和<code>[1,2,3]</code>有质的区别</li></ul> <p>向量上下合并，要求元素个数一样</p> <div class="language-python extra-class"><pre class="language-python"><code>C <span class="token operator">=</span> np<span class="token punctuation">.</span>vstack<span class="token punctuation">(</span><span class="token punctuation">(</span>A<span class="token punctuation">,</span>B<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">)</span>
</code></pre></div><p>向量左右合并</p> <div class="language-python extra-class"><pre class="language-python"><code>D <span class="token operator">=</span> np<span class="token punctuation">.</span>hstack<span class="token punctuation">(</span><span class="token punctuation">(</span>A<span class="token punctuation">,</span>B<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>D<span class="token punctuation">)</span>
</code></pre></div><p>将向量转为矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code>A1 <span class="token operator">=</span> A<span class="token punctuation">[</span>np<span class="token punctuation">.</span>newaxis<span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span>
A2 <span class="token operator">=</span> A<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> np<span class="token punctuation">.</span>newaxis<span class="token punctuation">]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A1<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A2<span class="token punctuation">)</span>
</code></pre></div><ul><li>通过<code>A[np.newaxis, :]</code>将向量转为一维行矩阵</li> <li>通过<code>A[:, np.newaxis]</code>将向量转为一维列矩阵</li></ul> <p>多个矩阵合并</p> <div class="language-python extra-class"><pre class="language-python"><code>A1 <span class="token operator">=</span> A<span class="token punctuation">[</span>np<span class="token punctuation">.</span>newaxis<span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span> <span class="token comment"># [[4,5,6]]</span>
A2 <span class="token operator">=</span> A<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> np<span class="token punctuation">.</span>newaxis<span class="token punctuation">]</span> <span class="token comment"># [[4,5,6]]T</span>
B1 <span class="token operator">=</span> B<span class="token punctuation">[</span>np<span class="token punctuation">.</span>newaxis<span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span> <span class="token comment"># [[1,2,3]]</span>
B2 <span class="token operator">=</span> B<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> np<span class="token punctuation">.</span>newaxis<span class="token punctuation">]</span> <span class="token comment"># [[1,2,3]]T</span>

E1 <span class="token operator">=</span> np<span class="token punctuation">.</span>hstack<span class="token punctuation">(</span><span class="token punctuation">(</span>A1<span class="token punctuation">,</span>B1<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment"># 横向合并 [[4,5,6,1,2,3]]</span>
E2 <span class="token operator">=</span> np<span class="token punctuation">.</span>vstack<span class="token punctuation">(</span><span class="token punctuation">(</span>A1<span class="token punctuation">,</span>B1<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment"># 纵向合并 [[4,5,6],[1,2,3]]</span>
E3 <span class="token operator">=</span> np<span class="token punctuation">.</span>vstack<span class="token punctuation">(</span><span class="token punctuation">(</span>A2<span class="token punctuation">,</span>B2<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment"># 纵向合并 [[4,1],[5,2],[6,3]]</span>
</code></pre></div><p>也可以通过<code>np.concatenate((A,B), axis=1/0)</code>进行合并，当<code>axis=1</code>横向合并，为<code>0</code>纵向合并，合并顺序和入参顺序保持一致</p> <h3 id="矩阵分割"><a href="#矩阵分割" class="header-anchor">#</a> 矩阵分割</h3> <p>构造3行4列矩阵</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np

A <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">12</span><span class="token punctuation">)</span><span class="token punctuation">.</span>reshape<span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">)</span>
</code></pre></div><p>等量分割，即均等分，分为纵向分割和横向分割</p> <ul><li><code>axis=1</code>纵向分割，第二个参数为分成的份数（<code>axis=1</code>为横向合并）</li> <li><code>axis=0</code>横向分割，第二个参数为分成的份数（<code>axis=0</code>为纵向合并）</li> <li>当无法等量分时将报错</li> <li>分割的结果为一个矩阵迭代器，每个元素都是一个矩阵</li></ul> <div class="language-python extra-class"><pre class="language-python"><code>A1 <span class="token operator">=</span> np<span class="token punctuation">.</span>split<span class="token punctuation">(</span>A<span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> axis<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> item <span class="token keyword">in</span> A1<span class="token punctuation">:</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>item<span class="token punctuation">)</span>
    
A2 <span class="token operator">=</span> np<span class="token punctuation">.</span>split<span class="token punctuation">(</span>A<span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> axis<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> item <span class="token keyword">in</span> A2<span class="token punctuation">:</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>item<span class="token punctuation">)</span>
</code></pre></div><p>不等量分割</p> <div class="language-python extra-class"><pre class="language-python"><code>A3<span class="token operator">=</span> np<span class="token punctuation">.</span>array_split<span class="token punctuation">(</span>A<span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">,</span>axis<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> item <span class="token keyword">in</span> A3<span class="token punctuation">:</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>item<span class="token punctuation">)</span>
</code></pre></div><p>第一个元素为<code>3x2</code>矩阵，第二、三个元素为<code>3x1</code>矩阵</p> <h3 id="copy-和"><a href="#copy-和" class="header-anchor">#</a> Copy 和 =</h3> <p>使用等于号对矩阵进行赋值，如</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np

A <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">)</span>
B <span class="token operator">=</span> A
C <span class="token operator">=</span> A
D <span class="token operator">=</span> A
A<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">11</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>B<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">)</span>
</code></pre></div><p>这里<code>A[0]</code>改变后，矩阵<code>B，C，D</code>的第一位元素均会改变，就像是<code>A，B，C，D</code>是不同的指针，但指向同一块内存空间</p> <p>同理改变<code>B[1:3]=[22,33]</code>，所有的矩阵<code>A,C,D</code>的第二、三个元素都会变成<code>22,33</code></p> <p>进行成员运算时，均会得到<code>True</code></p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">print</span><span class="token punctuation">(</span>B <span class="token keyword">is</span> A<span class="token punctuation">)</span> <span class="token comment"># True</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C <span class="token keyword">is</span> A<span class="token punctuation">)</span> <span class="token comment"># True</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>D <span class="token keyword">is</span> A<span class="token punctuation">)</span> <span class="token comment"># True</span>
</code></pre></div><p>通过<code>copy</code>函数赋值将重新开辟空间</p> <div class="language-python extra-class"><pre class="language-python"><code>E <span class="token operator">=</span> A<span class="token punctuation">.</span>copy<span class="token punctuation">(</span><span class="token punctuation">)</span>
A<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">7</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>A<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>E<span class="token punctuation">)</span>
</code></pre></div><p>这时二者指向不同的内存空间，互不影响</p> <h3 id="广播机制"><a href="#广播机制" class="header-anchor">#</a> 广播机制</h3> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np

A <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">,</span><span class="token punctuation">[</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">6</span><span class="token punctuation">]</span><span class="token punctuation">,</span><span class="token punctuation">[</span><span class="token number">7</span><span class="token punctuation">,</span><span class="token number">8</span><span class="token punctuation">,</span><span class="token number">9</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">)</span>

</code></pre></div><p>上述代码都是能够正常运行的</p> <p>怎么说，就是在做矩阵运算的时候，若两个矩阵不匹配，将对不匹配的部分自动进行广播，如</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="39.351ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 17393.3 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="5B" d="M118 -250V750H255V710H158V-210H255V-250H118Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(278,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(778,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(1222.7,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(1722.7, tchy="false">→</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">[</mo><mtable columnspacing="1em" rowspacing="4pt"><mtr><mtd><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn></mtd></mtr><mtr><mtd><mn>4</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>6</mn></mtd></mtr><mtr><mtd><mn>7</mn><mo>,</mo><mn>8</mn><mo>,</mo><mn>9</mn></mtd></mtr></mtable><mo data-mjx-texclass="CLOSE">]</mo></mrow><mo>∗</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">[</mo><mtable columnspacing="1em" rowspacing="4pt"><mtr><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd></mtr></mtable><mo data-mjx-texclass="CLOSE">]</mo></mrow></math></mjx-assistive-mml></mjx-container><h3 id="常用函数"><a href="#常用函数" class="header-anchor">#</a> 常用函数</h3> <h4 id="np-bincount"><a href="#np-bincount" class="header-anchor">#</a> np.bincount()</h4> <p>统计索引出现的次数，索引可以视作下标<code>0,1,2...</code></p> <p>如向量<code>[0,0,1,1,2,2]</code>的<code>bincount</code>为<code>[2,2,2]</code>，因为<code>0</code>出现两次，<code>1</code>出现两次，<code>2</code>出现两次，所以<code>bincount[0]=2,bincount[1]=2,bincount[2]=2</code></p> <p>对<code>bincount()</code>进行加权，即<code>bincount(arr, weights=weight)</code>，这里的<code>arr</code>和<code>weight</code>都是向量且必须长度相等，<code>arr[i]</code>的权重即为<code>weight[i]</code>，在没有权重的时候，每个<code>arr[i]</code>的权重都为<code>1</code>，在计算<code>bincount[i]</code>的时候，<code>i</code>每出现一次，<code>bincount[i]</code>就<code>+1</code>，当人为添加了权重，这时就不是加<code>1</code>了，而是加上<code>arr[i]</code>对应的权重<code>weight[i]</code>，例如</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np

arr <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span><span class="token number">0</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
weight <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">0.1</span><span class="token punctuation">,</span><span class="token number">0.3</span><span class="token punctuation">,</span><span class="token number">0.3</span><span class="token punctuation">,</span><span class="token number">0.5</span><span class="token punctuation">,</span><span class="token number">0.6</span><span class="token punctuation">,</span><span class="token number">0.2</span><span class="token punctuation">]</span><span class="token punctuation">)</span>

<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>bincount<span class="token punctuation">(</span>arr<span class="token punctuation">,</span> weights<span class="token operator">=</span>weight<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><ul><li><code>bincount[0] = weight[0]+weight[1] = 0.1+0.3 = 0.4</code>，为什么加这两个权重，因为<code>arr[0] = arr[1] = 0</code></li> <li>同理<code>bincount[1] = weight[2]+weight[3] = 0.3+0.5 = 0.8</code></li> <li><code>bincount[2] = weight[4]+weight[5] = 0.6+0.2 = 0.8</code></li></ul> <h4 id="np-argmax"><a href="#np-argmax" class="header-anchor">#</a> np.argmax()</h4> <p>返回矩阵中最大元素的索引</p> <div class="language-python extra-class"><pre class="language-python"><code>x <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
     <span class="token punctuation">[</span><span class="token number">7</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>x<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment"># 3，因为元素7的索引为3</span>
</code></pre></div><p>可以规定按列或行进行操作</p> <ul><li><code>axis=0</code>按列操作</li> <li><code>axis=1</code>按行操作</li></ul> <div class="language-python extra-class"><pre class="language-python"><code>x <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
     <span class="token punctuation">[</span><span class="token number">7</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>x<span class="token punctuation">,</span>axis<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment"># [1,1,0]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>x<span class="token punctuation">,</span>axis<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment"># [1,0]</span>
</code></pre></div><p>结合上述两个函数</p> <div class="language-python extra-class"><pre class="language-python"><code>x <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>np<span class="token punctuation">.</span>bincount<span class="token punctuation">(</span>x<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>结果为<code>1</code>，首先<code>bincount = [1,2,1,2,1]</code>，其最大值<code>2</code>的索引为<code>1</code>，故输出<code>1</code></p> <h4 id="np-around"><a href="#np-around" class="header-anchor">#</a> np.around()</h4> <p><code>np.around()</code>取精度函数，当精度为<code>0</code>时即为取整，负数向下取整，正数向上取整</p> <ul><li>第一个参数为矩阵/向量</li> <li>第二个参数为精度</li></ul> <div class="language-python extra-class"><pre class="language-python"><code>np<span class="token punctuation">.</span>around<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token operator">-</span><span class="token number">0.6</span><span class="token punctuation">,</span><span class="token number">1.2798</span><span class="token punctuation">,</span><span class="token number">2.357</span><span class="token punctuation">,</span><span class="token number">9.67</span><span class="token punctuation">,</span><span class="token number">13</span><span class="token punctuation">]</span><span class="token punctuation">,</span> decimals<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">)</span>
<span class="token comment"># [-1,2,3,10,13]</span>
</code></pre></div><p>当精度为<code>1</code>时，精确到小数点后一位，同样保持向下取整，正数向上取整</p> <div class="language-python extra-class"><pre class="language-python"><code>y <span class="token operator">=</span> np<span class="token punctuation">.</span>around<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token operator">-</span><span class="token number">1.2798</span><span class="token punctuation">,</span><span class="token number">1.2798</span><span class="token punctuation">,</span><span class="token number">2.357</span><span class="token punctuation">,</span><span class="token number">9.67</span><span class="token punctuation">,</span><span class="token number">13</span><span class="token punctuation">]</span><span class="token punctuation">,</span> decimals<span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>y<span class="token punctuation">)</span> <span class="token comment"># [-1.3  1.3  2.4  9.7 13. ]</span>
</code></pre></div><p>当精度为负数时，如<code>-1</code>，表示精确到<code>10</code>位，<code>-2</code>表示精确到<code>100</code>位，满足四舍五入的规则</p> <ul><li>注意是必须要超过<code>&quot;5&quot;</code>，如<code>5</code>精确到<code>10</code>位将变成<code>0</code>，<code>5.1</code>将变成<code>10</code>，同理<code>55</code>变成<code>50</code>，而<code>56</code>变成<code>60</code></li></ul> <p><code>np.floor(arr)</code>表示取下限，<code>-1.3 —&gt; -2, 1.3 —&gt; 1</code></p> <p><code>np.ceil(arr)</code>表示取上限，<code>-1.3 —&gt; -1, 1.3 —&gt; 2</code></p> <p><code>np.where(x&gt;0, x, 0)</code>，表示用<code>0</code>填充负数，第一个入参是一个布尔值，若为真，则用第二个入参填充，若为假，则用第三个入参填充</p> <div class="language-python extra-class"><pre class="language-python"><code>x <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">,</span> <span class="token operator">-</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token operator">-</span><span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span>where<span class="token punctuation">(</span>x<span class="token operator">&gt;</span><span class="token number">0</span><span class="token punctuation">,</span> x<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>结果为</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="6.287ex" height="8.597ex" role="img" focusable="false" viewBox="0 -2150 2778.7 3800" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-3.733ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mrow"><g data-mml-node="mo"><path data-c="23A1" d="M319 -645V1154H666V1070H403V-645H319Z" transform="translate(0,996)" style="stroke-width:3;"></path><path data-c="23A3" d="M319 -644V1155H403V-560H666V-644H319Z" transform="translate(0,-1006)" style="stroke-width:3;"></path><svg width="667" height="402" y="49" x="0" viewBox="0 100.5 667 402"><path data-c="23A2" d="M319 0V602H403V0H319Z" transform="scale(1,1.002)" style="stroke-width:3;"></path></svg></g><g data-mml-node="mtable" transform="translate(667,0)"><g data-mml-node="mtr" transform="translate(0,1400)"><g data-mml-node="mtd"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(500,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(944.7,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 3 assistive-mml></mjx-container><h2 id="scipy-科学计算库"><a href="#scipy-科学计算库" class="header-anchor">#</a> Scipy 科学计算库</h2> <p>Scipy 是一个用于数学、科学、工程领域的常用软件包，是一个数值计算库，可以处理插值、积分、优化、图像处理、常微分方程数值解的求解、信号处理等问题</p> <p>通常，Numpy 和 Scipy 协同工作来高效处理数据</p> <h3 id="常数和特殊函数"><a href="#常数和特殊函数" class="header-anchor">#</a> 常数和特殊函数</h3> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">from</span> scipy <span class="token keyword">import</span> constants <span class="token keyword">as</span> C

<span class="token comment"># 真空光速</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>c<span class="token punctuation">)</span>
<span class="token comment"># 普朗克常数</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>h<span class="token punctuation">)</span>
<span class="token comment"># pyysical_constants是一个常量字典，物理常量名为键，对应一个三元组，分别为常数值、单位和误差</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>physical_constants<span class="token punctuation">[</span><span class="token string">&quot;electron mass&quot;</span><span class="token punctuation">]</span><span class="token punctuation">)</span>

<span class="token comment"># 1英里等于多少米, 1英寸等于多少米, 1克等于多少千克, 1磅等于多少千克</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>mile<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>inch<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>gram<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>C<span class="token punctuation">.</span>pound<span class="token punctuation">)</span>
</code></pre></div><p>科学计算</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> scipy<span class="token punctuation">.</span>special <span class="token keyword">as</span> S

<span class="token keyword">print</span> <span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">+</span> <span class="token number">1e-20</span><span class="token punctuation">)</span>
<span class="token keyword">print</span> <span class="token punctuation">(</span>np<span class="token punctuation">.</span>log<span class="token punctuation">(</span><span class="token number">1</span><span class="token operator">+</span><span class="token number">1e-20</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">print</span> <span class="token punctuation">(</span>S<span class="token punctuation">.</span>log1p<span class="token punctuation">(</span><span class="token number">1e-20</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>线代计算</p> <div class="language-python extra-class"><pre class="language-python"><code>m <span class="token operator">=</span> np<span class="token punctuation">.</span>linspace<span class="token punctuation">(</span><span class="token number">0.1</span><span class="token punctuation">,</span> <span class="token number">0.9</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">)</span>
u <span class="token operator">=</span> np<span class="token punctuation">.</span>linspace<span class="token punctuation">(</span><span class="token operator">-</span><span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">200</span><span class="token punctuation">)</span>
results <span class="token operator">=</span> S<span class="token punctuation">.</span>ellipj<span class="token punctuation">(</span>u<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> <span class="token boolean">None</span><span class="token punctuation">]</span><span class="token punctuation">,</span> m<span class="token punctuation">[</span><span class="token boolean">None</span><span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span><span class="token punctuation">)</span>

<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token punctuation">[</span>y<span class="token punctuation">.</span>shape <span class="token keyword">for</span> y <span class="token keyword">in</span> results<span class="token punctuation">]</span><span class="token punctuation">)</span>
</code></pre></div><p>绘图</p> <div class="language-python extra-class"><pre class="language-python"><code>m <span class="token operator">=</span> np<span class="token punctuation">.</span>linspace<span class="token punctuation">(</span><span class="token number">0.1</span><span class="token punctuation">,</span> <span class="token number">0.9</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">)</span>
u <span class="token operator">=</span> np<span class="token punctuation">.</span>linspace<span class="token punctuation">(</span><span class="token operator">-</span><span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">200</span><span class="token punctuation">)</span>

<span class="token comment">#%figonly=使用广播计算得到的`ellipj()`返回值</span>

<span class="token keyword">from</span> scipy <span class="token keyword">import</span> optimize

<span class="token keyword">def</span> <span class="token function">f</span><span class="token punctuation">(</span>x<span class="token punctuation">)</span><span class="token punctuation">:</span>
    x0<span class="token punctuation">,</span>x1<span class="token punctuation">,</span>x2 <span class="token operator">=</span> x<span class="token punctuation">.</span>tolist<span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">return</span> <span class="token punctuation">[</span><span class="token number">5</span><span class="token operator">*</span>x1<span class="token operator">+</span><span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token operator">*</span>x0<span class="token operator">**</span><span class="token number">2</span><span class="token operator">-</span><span class="token number">2</span><span class="token operator">*</span>sin<span class="token punctuation">(</span>x1<span class="token operator">*</span>x2<span class="token punctuation">)</span><span class="token punctuation">,</span> x1<span class="token operator">*</span>x2<span class="token operator">-</span><span class="token number">1.5</span><span class="token punctuation">]</span>

result <span class="token operator">=</span> optimize<span class="token punctuation">.</span>fsolve<span class="token punctuation">(</span>f<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>result<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>f<span class="token punctuation">(</span>result<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p><code>fsolve</code>的第一个参数为方程组，第二个参数为未知数初始值</p> <p>方程组的形式由一个数组返回，<code>=0</code>省略，如上述代码表示方程组</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="28.857ex" height="8.003ex" role="img" focusable="false" viewBox="0 -2018.7 12754.9 3537.4" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-3.436ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mrow"><g data-mml-node="mo"><path data-c="23A7" d="M712 899L718 893V876V865Q718 854 704 846Q627 793 577 710T510 525Q510 524 509 521Q505 493 504 349Q504 345 504 334Q504 277 504 240Q504 -2 503 -4Q502 -8 494 -9T444 -10Q392 -10 390 -9Q387 -8 386 -5Q384 5 384 230Q384 262 384 312T383 382Q383 481 392 535T434 656Q510 806 664 892L677 899H712Z" transform="translate(0,1119.7)" style="stroke-width:3;"></path><path data-c="23A9" d="M718 -893L712 -899H677L666 -893Q542 -825 468 -714T385 -476Q384 -466 384 -282Q384 3 385 5L389 9Q392 10 444 10Q486 10 494 9T503 4Q504 2 504 -239V-310V-366Q504 -470 508 -513T530 -609Q546 -657 569 -698T617 -767T661 -812T699 -843T717 -856T718 -876V-893Z" transform="translate(0,-619.7)" style="stroke-width:3;"></path><path data-c="23A8" d="M389 1159Q391 1160 455 1160Q496 1160 498 1159Q501 1158 502 1155Q504 1145 504 924Q504 691 503 682Q494 549 425 439T243 259L229 250L243 241Q349 175 421 66T503 -182Q504 -191 504 -424Q504 -600 504 -629T499 -659H498Q496 -660 444 -660T390 -659Q387 -658 386 -655Q384 -645 384 -425V-282Q384 -176 377 -116T342 10Q325 54 301 92T255 155T214 196T183 222T171 232Q170 233 170 250T171 268Q171 269 191 284T240 331T300 407T354 524T383 679Q384 691 384 925Q384 1152 385 1155L389 1159Z" transform="translate(0,0)" style="stroke-width:3;"></path><svg width="889" height="149.7" y="1060" x="0" viewBox="0 26.4 889 149.7"><path data-c="23AA
