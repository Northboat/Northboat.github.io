    <span class="token keyword">return</span> <span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span> <span class="token number">5</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
           <span class="token punctuation">[</span><span class="token number">8</span><span class="token operator">*</span>x<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token operator">-</span><span class="token number">2</span><span class="token operator">*</span>cos<span class="token punctuation">(</span>x<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token operator">*</span>x<span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token operator">-</span><span class="token number">2</span><span class="token operator">*</span>x<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token operator">*</span>cos<span class="token punctuation">(</span>x<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token operator">*</span>x<span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
           <span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span> x<span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">,</span> x<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">]</span>
result1 <span class="token operator">=</span> optimize<span class="token punctuation">.</span>fsolve<span class="token punctuation">(</span>f<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">,</span> fprime<span class="token operator">=</span>g<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>result1<span class="token punctuation">)</span> 
</code></pre></div><p><code>fprime</code>： 可调用 <code>f(x, *args)</code> ，可选</p> <ul><li>用于计算 func 的雅可比行列式的函数，该函数具有跨行的导数。默认情况下，将估计雅可比行列式</li></ul> <h4 id="最小二乘拟合"><a href="#最小二乘拟合" class="header-anchor">#</a> 最小二乘拟合</h4> <blockquote><p>最小二乘法（又称最小平方法）是一种数学优化技术。它通过最小化误差的平方和寻找数据的最佳函数匹配。利用最小二乘法可以简便地求得未知的数据，并使得这些求得的数据与实际数据之间误差的平方和为最小</p> <p>最小二乘法还可用于曲线拟合，其他一些优化问题也可通过最小化能量或最大化熵用最小二乘法来表达</p></blockquote> <p>简单来说，就是通过构造函数，使计算结果和已知数据的平方差最小</p> <p>使用<code>optimize.leastsq</code>拟合一次函数</p> <div class="language-python extra-class"><pre class="language-python"><code>X <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span> <span class="token number">8.19</span><span class="token punctuation">,</span>  <span class="token number">2.72</span><span class="token punctuation">,</span>  <span class="token number">6.39</span><span class="token punctuation">,</span>  <span class="token number">8.71</span><span class="token punctuation">,</span>  <span class="token number">4.7</span> <span class="token punctuation">,</span>  <span class="token number">2.66</span><span class="token punctuation">,</span>  <span class="token number">3.78</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
Y <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span> <span class="token number">7.01</span><span class="token punctuation">,</span>  <span class="token number">2.78</span><span class="token punctuation">,</span>  <span class="token number">6.47</span><span class="token punctuation">,</span>  <span class="token number">6.71</span><span class="token punctuation">,</span>  <span class="token number">4.1</span> <span class="token punctuation">,</span>  <span class="token number">4.23</span><span class="token punctuation">,</span>  <span class="token number">4.05</span><span class="token punctuation">]</span><span class="token punctuation">)</span>

<span class="token keyword">def</span> <span class="token function">residuals</span><span class="token punctuation">(</span>p<span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token string">&quot;计算以p为参数的直线和原始数据之间的误差&quot;</span>
    k<span class="token punctuation">,</span> b <span class="token operator">=</span> p
    <span class="token keyword">return</span> Y <span class="token operator">-</span> <span class="token punctuation">(</span>k<span class="token operator">*</span>X <span class="token operator">+</span> b<span class="token punctuation">)</span>

<span class="token comment"># leastsq使得residuals()的输出数组的平方和最小，参数的初始值为[1,0]</span>
r <span class="token operator">=</span> optimize<span class="token punctuation">.</span>leastsq<span class="token punctuation">(</span>residuals<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
k<span class="token punctuation">,</span> b <span class="token operator">=</span> r<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span>
<span class="token keyword">print</span> <span class="token punctuation">(</span><span class="token string">&quot;k =&quot;</span><span class="token punctuation">,</span>k<span class="token punctuation">,</span> <span class="token string">&quot;b =&quot;</span><span class="token punctuation">,</span>b<span class="token punctuation">)</span>
</code></pre></div><p>拟合的结果<code>r[0]</code>为一个向量，按函数<code>residuals</code>入参<code>p</code>的顺序存放着未知参数的估计值</p> <p>更多应用</p> <ul><li>计算局域最小值</li> <li>计算全域最小值</li></ul> <h3 id="spatial-空间算法库"><a href="#spatial-空间算法库" class="header-anchor">#</a> Spatial 空间算法库</h3> <h4 id="最近旁点"><a href="#最近旁点" class="header-anchor">#</a> 最近旁点</h4> <p>对于一维序列，寻找最近旁点</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np
<span class="token keyword">from</span> scipy <span class="token keyword">import</span> spatial

x <span class="token operator">=</span> np<span class="token punctuation">.</span>sort<span class="token punctuation">(</span>np<span class="token punctuation">.</span>random<span class="token punctuation">.</span>rand<span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># print(x)</span>

idx <span class="token operator">=</span> np<span class="token punctuation">.</span>searchsorted<span class="token punctuation">(</span>x<span class="token punctuation">,</span><span class="token number">0.5</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>x<span class="token punctuation">[</span>idx<span class="token punctuation">]</span><span class="token punctuation">,</span> x<span class="token punctuation">[</span>idx<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
</code></pre></div><ul><li><code>np.random.rand</code>将随机生成<code>[0,1)</code>的浮点数，接收参数整型为生成浮点数个数</li> <li>用<code>np.searchsorted(迭代器, 数)</code>寻找最近旁点的下标（取上限），即最近的大于该数的数组元素的下标（自然最近旁点有可能是<code>x[idx-1]</code>，即最近的小于该数的元素下标）</li></ul> <p>对于二维的点阵，寻找最近旁点：用<code>cKDTree</code>寻找</p> <p><code>query</code></p> <div class="language-python extra-class"><pre class="language-python"><code>np<span class="token punctuation">.</span>random<span class="token punctuation">.</span>seed<span class="token punctuation">(</span><span class="token number">42</span><span class="token punctuation">)</span>
N <span class="token operator">=</span> <span class="token number">100</span>
<span class="token comment"># 生成(-1,1)的随机数共一百行，每行两列</span>
points <span class="token operator">=</span> np<span class="token punctuation">.</span>random<span class="token punctuation">.</span>uniform<span class="token punctuation">(</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token punctuation">(</span>N<span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
kd <span class="token operator">=</span> spatial<span class="token punctuation">.</span>cKDTree<span class="token punctuation">(</span>points<span class="token punctuation">)</span>
<span class="token comment"># 要寻找旁点的点</span>
targets <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">0.5</span><span class="token punctuation">,</span> <span class="token number">0.5</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
                    <span class="token punctuation">[</span><span class="token operator">-</span><span class="token number">0.5</span><span class="token punctuation">,</span> <span class="token number">0.5</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">0.5</span><span class="token punctuation">,</span> <span class="token operator">-</span><span class="token number">0.5</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
                    <span class="token punctuation">[</span><span class="token operator">-</span><span class="token number">0.5</span><span class="token punctuation">,</span> <span class="token operator">-</span><span class="token number">0.5</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>targets<span class="token punctuation">)</span>
dist<span class="token punctuation">,</span> idx <span class="token operator">=</span> kd<span class="token punctuation">.</span>query<span class="token punctuation">(</span>targets<span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>dist<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>idx<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>points<span class="token punctuation">[</span><span class="token number">83</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
</code></pre></div><ul><li><code>np.random.seed(42)</code>对随机数做种，使每次生成的随机数一样，<code>seed()</code>无参实际上就是随便调了一个整型做种生成随机数</li> <li><code>kd = spatial.cKDTree(points)</code>对已知所有点构造<code>cKDTree</code></li> <li>用<code>np.array()</code>构造目标点</li> <li>用<code>query(targets, 3)</code>搜索最近旁点，<code>3</code>表示搜索最近的三个旁点，因为一共五个目标点，所以结果是一个<code>5x3</code>的矩阵，每行表示一个目标点的<code>3</code>旁点</li> <li><code>query</code>返回的两个值分别为
<ul><li><code>dist</code>：旁点距目标点距离</li> <li><code>idx</code>：旁点在<code>points</code>的下标</li></ul></li></ul> <p><code>query_ball_point</code></p> <div class="language-python extra-class"><pre class="language-python"><code>r <span class="token operator">=</span> <span class="token number">0.2</span>
idx2 <span class="token operator">=</span> kd<span class="token punctuation">.</span>query_ball_point<span class="token punctuation">(</span>targets<span class="token punctuation">,</span> r<span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>idx2<span class="token punctuation">)</span>
</code></pre></div><ul><li><code>targets</code>同上，为目标点矩阵</li> <li><code>r</code>为旁点距目标点最大距离，意思是将返回距目标点<code>距离&lt;r</code>的点的坐标</li> <li>返回的是一个<code>list</code>数组，每个<code>list</code>储存一个目标点的旁点下标</li></ul> <p><code>query_pairs</code></p> <div class="language-python extra-class"><pre class="language-python"><code>idx3 <span class="token operator">=</span> kd<span class="token punctuation">.</span>query_pairs<span class="token punctuation">(</span><span class="token number">0.1</span><span class="token punctuation">)</span><span class="token operator">-</span>kd<span class="token punctuation">.</span>query_pairs<span class="token punctuation">(</span><span class="token number">0.08</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>idx3<span class="token punctuation">)</span>
</code></pre></div><ul><li><code>query_pairs(r)</code>返回的是一个<code>set</code>集合，集合中存的数据是一对对下标，如<code>(11,97)</code>，意思是<code>points[11]</code>和<code>points[97]</code>之间的距离小于<code>r</code></li> <li>用<code>set</code>集合减去<code>set</code>，即去掉前者中和后者共有的元素，如上述代码表示距离小于<code>0.1</code>但大于<code>0.08</code>的点对</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/02/28, 17:18:56</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/97d23c/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">神经网络与深度学习</div></a> <a href="/pages/2cc4e8/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">数据科学库（二）</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
