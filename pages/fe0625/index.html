</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="pod、deployment-和-service"><a href="#pod、deployment-和-service" class="header-anchor">#</a> Pod、Deployment 和 Service</h3> <p>pod 的几个核心概念</p> <ul><li>pod 本身是真正跑服务，执行业务逻辑的单元</li> <li>deployment 是 pod 的配置（一份 yaml 文件），定义 pod 副本数量、使用什么镜像、更新策略等</li> <li>service 是 pod 的网络配置，描述 pod 怎么访问，通过 iptable 和 label 对接其网络入口</li></ul> <p>查看 codev-web-server 节点的 deploy</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl get deploy codev-web-server <span class="token parameter variable">-o</span> yaml <span class="token operator">|</span> <span class="token function">head</span> <span class="token parameter variable">-60</span>

│                                      │
│  ┌─ codev-web-app <span class="token punctuation">(</span>main container<span class="token punctuation">)</span>─┐ │
│  │  Go 业务代码                     │ │
│  └─────────────────────────────────┘ │
│                                      │
│  ┌─ zhiyan-agent <span class="token punctuation">(</span>Sidecar<span class="token punctuation">)</span>─────────┐ │
│  │  Log Collection / Reporting     │ │
│  └─────────────────────────────────┘ │
│                                      │
│  共享：网络（同 IP）、存储卷            │
└──────────────────────────────────────┘
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>每个 pod 都是一个纯粹的“服务”，他是我们业务逻辑实现的程序，pod 的管理分为两部分</p> <ul><li>Master（Scheduler）→ 决定 Pod 分到哪台 Node  ← 决策</li> <li>Master（Controller Mgr）→ 保证 Pod 数量对 ← 决策</li> <li>Node（kubelet）→ 在本机启动/停止容器 ← 执行</li></ul> <p>k8s 中只有两种节点，一种 Master 一种 Node，Master 是管理者，Node 是执行者</p> <p>Node 本质上是一台安装了 Kubernetes 代理（kubelet）+ Kubernates 网络代理（kube-proxy） + 容器运行时（Docker/containerd）的服务器</p> <ol><li>Kubelet 代理，用于管理本机 pod</li> <li>Kube Proxy 网络代理，负责服务访问</li> <li>Container Runtime 容器运行时（Docker/containerd），负责起 pod</li></ol> <p>kubelet 是 Kubernetes（K8s）集群中运行在每个工作节点（Node）上的核心“节点代理”，是 k8s 的下层管理者</p> <ul><li>向外与 Master 通信实施 k8s 管理：通过 API Server 注册当前节点，并持续通报节点的主机名、CPU/内存等可用资源及健康状态；监听 Master 通知，接收并执行分配给该节点的任务，确保节点上的 Pod 和容器完全按照集群期望的状态正常运行</li> <li>向内管理容器生命周期：通过容器运行时（如 Docker、containerd）创建、启动、停止和删除 Pod 及容器；定期执行容器的探针（Probe，如 liveness 和 readiness），一旦发现容器异常，会自动重启或将其剔除出流量转发列表；管理节点本地的硬件资源分配，在 Pod 启动前挂载所需的存储卷（Volume）以及拉取镜像</li></ul> <p>一个 Node 可以跑上千个 Pod，二者相当于服务器与进程的关系（Pod 和 container 是进程和线程的关系）</p> <p>而 Master 节点相当于 k8s 的自动化运维，去统筹所有的 Node 服务器资源，他包括</p> <ol><li>API Server：所有请求入口，写入 etcd 对外暴露 REST API</li> <li>Etcd NoSQL 存储：存集群所有 YAML 数据（Deployment、Service、ConfigMap）以及集群状态（Pod 与 Node 的映射表、IP 多少）</li> <li>Scheduler 调度器：决定 Pod 分配到哪台 Node，看哪台机器 CPU/内存够用</li> <li>Controller Manager 控制器：控制 pod 状态，监听 etcd 变化，维持期望状态 Pod 挂了自动补、副本数不对自动扩缩</li></ol> <p>一个 k8s 集群可以运行多个 Master，但针对不同组件，尤其对于“写”的场景，同时只能有一个 Master 工作</p> <table><thead><tr><th style="text-align:center;">Master 组件</th> <th style="text-align:center;">工作模式</th></tr></thead> <tbody><tr><td style="text-align:center;"><strong>API Server</strong></td> <td style="text-align:center;">多实例<strong>同时工作</strong>，无状态</td></tr> <tr><td style="text-align:center;"><strong>etcd</strong></td> <td style="text-align:center;">Raft 协议，1 个 Leader 写，所有节点可读</td></tr> <tr><td style="text-align:center;"><strong>Scheduler</strong></td> <td style="text-align:center;"><strong>选主</strong>，只有 1 个活跃</td></tr> <tr><td style="text-align:center;"><strong>Controller Manager</strong></td> <td style="text-align:center;"><strong>选主</strong>，只有 1 个活跃</td></tr></tbody></table> <p>针对 etcd 的 Raft 共识要求，节点数必须是奇数个，并且同时只有一个“写”节点，否则会发生“脑裂”</p> <p>在运维过程中，人实际上只和 Master 打交道，准确的说是 API Server，剩余的工作均由 Master 和 kubelet 通信和实施，大致的请求分两种</p> <ul><li>配置的读写：例如查写 pod 的 Service、Deployment、ConfigMap，这一类操作基本上就是在读写 etcd，而后由 k8s 来<strong>实施</strong>这些改动</li> <li>pod 的交互：例如进入 pod，停止 pod，回滚 pod</li></ul> <p>例如执行一句 <code>kubectl exec -it pod --bash</code> 后，会经过以下过程</p> <div class="language-mermaid line-numbers-mode"><pre class="language-mermaid"><code><span class="token keyword">flowchart</span> LR
    <span class="token keyword">subgraph</span> LOCAL<span class="token text string">[&quot;你的终端&quot;]</span>
        KUBECTL[<span class="token string">&quot;kubectl exec -it pod -- bash&quot;</span>]
    <span class="token keyword">end</span>

    <span class="token keyword">subgraph</span> MASTER<span class="token text string">[&quot;Master&quot;]</span>
        API<span class="token text string">[&quot;API Server&lt;br/&gt;鉴权 + 找到 Pod 所在 Node&quot;]</span>
        ETCD<span class="token text string">[&quot;etcd&lt;br/&gt;查 Pod 跑在哪个 Node&quot;]</span>
    <span class="token keyword">end</span>

    <span class="token keyword">subgraph</span> NODE<span class="token text string">[&quot;Node: 9.135.144.31&quot;]</span>
        KL<span class="token text string">[&quot;kubelet&lt;br/&gt;收到请求，调 CRI&quot;]</span>
        CR<span class="token text string">[&quot;Container Runtime&lt;br/&gt;containerd&quot;]</span>
        CONT<span class="token text string">[&quot;Container&lt;br/&gt;bash 进程&quot;]</span>
    <span class="token keyword">end</span>

    KUBECTL <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;1. HTTPS POST /exec&quot;|</span> API
    API <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;2. 查 Pod 位置&quot;|</span> ETCD
    API <span class="token arrow operator">-.-&gt;</span><span class="token label property">|&quot;3. SPDY/WebSocket&lt;br/&gt;协议升级，双向流&quot;|</span> KL
    KL <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;4. CRI exec 调用&quot;|</span> CR
    CR <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;5. nsenter 进入&lt;br/&gt;容器 namespace&quot;|</span> CONT
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><table><thead><tr><th style="text-align:center;">步骤</th> <th style="text-align:center;">组件</th> <th style="text-align:center;">步骤详解</th></tr></thead> <tbody><tr><td style="text-align:center;">1</td> <td style="text-align:center;"><strong>kubectl</strong></td> <td style="text-align:center;">发 HTTPS 请求到 API Server：<code>POST /api/v1/namespaces/devcloud-ci/pods/codev-app-open-xxx/exec?command=bash&amp;stdin=true&amp;stdout=true&amp;tty=true</code></td></tr> <tr><td style="text-align:center;">2</td> <td style="text-align:center;"><strong>API Server → etcd</strong></td> <td style="text-align:center;">查 <code>codev-app-open-xxx</code> 跑在 <code>Node 9.135.144.31</code> 上</td></tr> <tr><td style="text-align:center;">3</td> <td style="text-align:center;"><strong>API Server → kubelet</strong></td> <td style="text-align:center;">把请求<strong>代理转发</strong>到 Node 上的 kubelet，协议从 HTTPS 升级为 <strong>SPDY/WebSocket</strong>（支持双向流）</td></tr> <tr><td style="text-align:center;">4</td> <td style="text-align:center;"><strong>kubelet → containerd</strong></td> <td style="text-align:center;">通过 CRI（容器运行时接口）调用 <code>ExecSync</code>，在容器里启动 bash</td></tr> <tr><td style="text-align:center;">5</td> <td style="text-align:center;"><strong>containerd → 容器</strong></td> <td style="text-align:center;">用 <code>nsenter</code> 进入容器的 namespace，启动 bash 进程，stdin/stdout/stderr 通过 SPDY/WebSocket 双向流转回你的终端</td></tr></tbody></table> <p>简单来说，就是建立一条 SPDY/WebSocket 双工通道，用户通过通道的 标准输入输出与 pod 中的 bash 进行交互，当然，这里由 API Server 作为通道的转发跳板，连通集群内外的我和你</p> <ul><li>SPDY 是老版本 k8s 的 <code>exec / log/ port-forward</code> 通信协议，这是 Google 09 年提出的实验协议，HTTP/2 的前身，在 k8s 1.30+ 中默认使用 WebSocket</li></ul> <h3 id="prometheus"><a href="#prometheus" class="header-anchor">#</a> Prometheus</h3> <p>Prometheus（普罗米修斯）是一款开源系统监控与警报工具包，为云原生环境设计，是 Kubernetes 的标准方案之一</p> <p>PromQL（Prometheus Query Language），Prometheus 监控系统的查询语言，其核心概念为</p> <table><thead><tr><th>概念</th> <th>说明</th> <th>示例</th></tr></thead> <tbody><tr><td>即时向量</td> <td>同一时刻的一组时间序列</td> <td><code>http_requests_total</code></td></tr> <tr><td>范围向量</td> <td>时间范围内的数据</td> <td><code>http_requests_total[5m]</code></td></tr> <tr><td>聚合运算</td> <td>sum、avg、max 等</td> <td><code>sum(rate(x[1m]))</code></td></tr> <tr><td>函数</td> <td>内置函数处理数据</td> <td><code>rate(), increase(), histogram_quantile()</code></td></tr></tbody></table> <p>常用查询示例</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># CPU 使用率</span>
rate<span class="token punctuation">(</span>node_cpu_seconds_total<span class="token punctuation">{</span>mode<span class="token operator">!=</span><span class="token string">&quot;idle&quot;</span><span class="token punctuation">}</span><span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">)</span>

<span class="token comment"># HTTP 错误率</span>
sum<span class="token punctuation">(</span>rate<span class="token punctuation">(</span>http_requests_total<span class="token punctuation">{</span>status<span class="token operator">=~</span><span class="token string">&quot;5..&quot;</span><span class="token punctuation">}</span><span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">))</span> / sum<span class="token punctuation">(</span>rate<span class="token punctuation">(</span>http_requests_total<span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">))</span>

<span class="token comment"># P99 延迟</span>
histogram_quantile<span class="token punctuation">(</span><span class="token number">0.99</span>, sum<span class="token punctuation">(</span>rate<span class="token punctuation">(</span>http_request_duration_seconds_bucket<span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">))</span> by <span class="token punctuation">(</span>le<span class="token punctuation">))</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h2 id="k8s-文件系统"><a href="#k8s-文件系统" class="header-anchor">#</a> K8s 文件系统</h2> <h3 id="ext4、xfs、btrfs-和-ceph"><a href="#ext4、xfs、btrfs-和-ceph" class="header-anchor">#</a> ext4、xfs、btrfs 和 ceph</h3> <p>Linux 和 K8s 的文件系统</p> <ul><li>ext4（Fourth Extended Filesystem）：Linux 上最经典、应用最广的本地文件系统，通常是本地双系统的选择</li> <li>XFS：CentOS 7+ 的默认文件系统，支持在线扩容，性能极佳，一般是服务器的选择</li> <li>Btrfs（B-Tree FS）：类似 ZFS 的 Linux 实现，设计目标是取代 ext4 和 XFS，支持秒级快照和回滚，快照和回滚是主要卖点</li> <li>CephFS：分布式存储系统，提供对象存储（RADOS GW，兼容 AWS S3）、块存储（RBD，像云硬盘一样挂载给虚拟机）和文件存储（CephFS），一般用于公共存储</li></ul> <p>一个容器挂载卷示例</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;environments&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
  <span class="token property">&quot;volumes&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
    <span class="token punctuation">{</span>
      <span class="token property">&quot;total&quot;</span><span class="token operator">:</span> <span class="token string">&quot;105558630400&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;used&quot;</span><span class="token operator">:</span> <span class="token string">&quot;15156269056&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;totalInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;6553600&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;usedInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;181313&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;ext4&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;mountPoint&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/dockerData&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">{</span>
      <span class="token property">&quot;total&quot;</span><span class="token operator">:</span> <span class="token string">&quot;7516243099648&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;used&quot;</span><span class="token operator">:</span> <span class="token string">&quot;5782302978048&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;totalInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;734212912&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;usedInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;23657123&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;xfs&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;mountPoint&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/dockerData/000&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">{</span>
      <span class="token property">&quot;total&quot;</span><span class="token operator">:</span> <span class="token string">&quot;1074815565824&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;used&quot;</span><span class="token operator">:</span> <span class="token string">&quot;12495220736&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;totalInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;0&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;usedInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;0&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;btrfs&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;mountPoint&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/dockerData/base&quot;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">]</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br></div></div><p>DeepSeek 的对比表格</p> <table><thead><tr><th style="text-align:left;">技术</th> <th style="text-align:left;">层级</th> <th style="text-align:left;">管理范围</th> <th style="text-align:left;">核心优势</th> <th style="text-align:left;">典型场景</th> <th style="text-align:left;">类比</th></tr></thead> <tbody><tr><td style="text-align:left;"><strong>Ext4</strong></td> <td style="text-align:left;">本地文件系统</td> <td style="text-align:left;">1 块硬盘/分区</td> <td style="text-align:left;">最稳定、兼容性无敌、恢复工具多</td> <td style="text-align:left;">通用服务器系统盘、家用 U 盘、入门级 VPS</td> <td style="text-align:left;">家用车：兼容性高</td></tr> <tr><td style="text-align:left;"><strong>XFS</strong></td> <td style="text-align:left;">本地文件系统</td> <td style="text-align:left;">1 块硬盘/分区</td> <td style="text-align:left;">大文件读写快、高并发强、支持在线扩容</td> <td style="text-align:left;">操作系统根目录、数据库数据目录、大文件存储</td> <td style="text-align:left;">重卡：性能上线更高</td></tr> <tr><td style="text-align:left;"><strong>Btrfs</strong></td> <td style="text-align:left;">本地文件系统</td> <td style="text-align:left;">多块硬盘（池化）</td> <td style="text-align:left;">快照回滚、数据压缩、校验和自愈</td> <td style="text-align:left;">容器/虚拟机存储、桌面系统、需要快照备份的服务器</td> <td style="text-align:left;">SUV：功能花哨，依赖操作技巧</td></tr> <tr><td style="text-align:left;"><strong>Ceph</strong></td> <td style="text-align:left;">分布式存储集群</td> <td style="text-align:left;">千数量级的服务器集群</td> <td style="text-align:left;">无限扩展、高可用、统一存储（块/文件/对象）</td> <td style="text-align:left;">OpenStack 私有云后端、Kubernetes 持久化存储（CSI 插件）、大规模视频监控或 AI 训练数据湖</td> <td style="text-align:left;">车站：不是一辆车，而是基建</td></tr></tbody></table> <p>在 K8s 里：Ceph 通常作为后端持久化存储（提供 PVC），提供给 Pod 使用；而 XFS 或 Btrfs 则作为宿主机（Node） 操作系统的文件系统，用来格式化承载 Ceph 数据盘或本地 PV 的物理磁盘</p> <ul><li>不求有功但求无过：选 Ext4（通用服务器、虚拟机镜像）</li> <li>跑数据库或大数据：选 XFS（性能上限更高）</li> <li>想要快照、压缩功能：选 Btrfs（生产环境建议搭配 RAID 卡，且避开早期 Btrfs 的 RAID5/6 坑）</li> <li>需要跨机器共享存储：选 Ceph</li></ul> <h3 id="容器-overlayfs-与备份"><a href="#容器-overlayfs-与备份" class="header-anchor">#</a> 容器 OverlayFS 与备份</h3> <p>OverlayFS 是一种联合文件系统（Union File System），它将多个目录（称为“层”）透明地叠加在一起，呈现为一个统一的目录视图，这是 Docker 和 Kubernetes 容器镜像和容器运行时默认的存储驱动之一，即 Pod 的默认文件系统</p> <ul><li>image (lower) + upper = merged</li></ul> <p>查看 GraphDriver</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> inspect <span class="token operator">&lt;</span>容器名/ID或镜像名<span class="token operator">&gt;</span> <span class="token operator">|</span> jq <span class="token string">'.[0].GraphDriver'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>一个实际 overlay 信息</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>

docker/overlay2/0a63c1220dfb1f30d8c8cb75901ecb8574c86e043f7ab12a8ccd4dfba39ad759/diff:/data/docker/overlay2/f18b31e52e1ad5c763cca0468d4ca0ca69979f0241e0bda6f05754bf386b138b/diff:/data/docker/overlay2/f740a17103f2a7678d8b6eac56c12bb7050d058a76eae27b38ad0b6e5a269756/diff:/data/docker/overlay2/039c923f6039d630f6dca6079a28a757cf5dae5eb0870b74a34c68b302e7e1e2/diff:/data/docker/overlay2/56556632c4da189befeb5195ec080ec3e785946156df2f5460895efac177f912/diff:/data/docker/overlay2/bdbbd91d025dce3b40f943c534047f44257bbde67e0fc4403009598de5722884/diff:/data/docker/overlay2/82aed04cfc9578846a6c290a98a69f0f987b5958a34e7d485d4109958fc72423/diff:/data/docker/overlay2/11635ebbb3609b2b0e1cb95ec4de6357c8164c84bd0225ca01d62afcf486052c/diff:/data/docker/overlay2/5781d21c924a5a8e2e27097f3feb1413a5b85a5638dbf2530f76cebe24241b97/diff&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;MergedDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/f5e5262918163b8d9099acf54b6caa4ce6b6a100cdb49daafea375784c5a1afb/merged&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;UpperDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/f5e5262918163b8d9099acf54b6caa4ce6b6a100cdb49daafea375784c5a1afb/diff&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;WorkDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/f5e5262918163b8d9099acf54b6caa4ce6b6a100cdb49daafea375784c5a1afb/work&quot;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><table><thead><tr><th>层级</th> <th>说明</th></tr></thead> <tbody><tr><td>LowerDir</td> <td>只读层（镜像层），用冒号 <code>:</code> 拼接，表示容器文件系统的底层堆叠</td></tr> <tr><td>UpperDir</td> <td>容器的读写层（容器运行时产生的修改）</td></tr> <tr><td>MergedDir</td> <td>将 Lower 和 Upper 统一挂载后的合并视图（容器内看到的最终文件系统）</td></tr> <tr><td>WorkDir</td> <td>OverlayFS 内部用于原子操作的工作目录</td></tr></tbody></table> <p>基于 Upper 层数据实现快照的快速制作：理论上，只要拿到 lower 层的数据，再加上 upper 层的修改，就可以完整还原一个容器运行时</p> <ul><li>lower 层数据好拿，直接根据原镜像启动一个容器，其初始状态就包含了 lower 数据</li> <li>upper 层则需要从原镜像中进行拷贝</li></ul> <p>基于这样的思路，可以实现“定时拷贝 + 旁路打包”的快照制作方案，即，在 K8s 母机上部署一个定时任务，将 pod 的 upper 层数据传输到旁路工作机，工作机根据原镜像启动容器，而后替换其 upper 数据，基于这个新的运行时打包镜像，实现实时快照</p> <ul><li>这样最大好处是，不会阻塞原 pod 的生命周期</li></ul> <p>具体实现细节</p> <table><thead><tr><th>任务</th> <th>说明</th></tr></thead> <tbody><tr><td>定时任务</td> <td>基于 robfig/cron 框架实现定时任务管理</td></tr> <tr><td>数据传输</td> <td>基于 rsync 进行 upper 层数据传输，工作机维护 rsync daemon 接收</td></tr> <tr><td>快照制作</td> <td>基于 docker client，先基于源镜像 create 并 start 容器，而后 stop，而后拷贝，而后再 start，在启动状态 commit 制作镜像</td></tr> <tr><td>流程控制</td> <td>控制面维护 backup、task 和 queue 三张表，通过回调和状态管理，在状态转移时插入执行逻辑，实现流程控制</td></tr></tbody></table> <p>关于流程控制和 DB 存储</p> <ul><li>queue 是现有 gpu 环境的管理表，因为 gpu 是排队申请定时分配的，queue 表中通过 status 字段维护 gpu 的生命周期，备份任务的下发和快照制作都从 queue 的状态转移中插入（备份在环境创建并启动后，做快照在环境销毁后）</li> <li>backup 存备份任务的元数据，例如备份周期、备份环境信息、工作机信息等等</li> <li>task 存两种任务（备份任务 / 快照制作任务）的执行记录，和 queue 类似的维护 status，参与快照制作 / 注册的生命周期管理</li> <li>控制面提供回调接口，用于更新 task 状态，并根据快照制作任务的状态转移去触发快照注册任务（这是一个 paas 层服务，把已制作好的镜像注册进系统）</li></ul> <p>DB 解构：上述用于业务流程的三张表，和母机上的备份服务（transport daemon）、工作机上的快照制作服务（snapshot server）是隔离开的，他们是两个“本地服务”，不应和系统的 DB 打交道，这两个本地服务只</p> <ul><li>暴露接口，作为任务触发的钩子</li> <li>任务需要的数据、任务执行的记录都以 json string 的方式存在本地 LevelDB，key 前缀的设计需要考虑查询接口的入参</li></ul> <h3 id="云磁盘-itfs"><a href="#云磁盘-itfs" class="header-anchor">#</a> 云磁盘 Itfs</h3> <p>随着 agent 的广泛应用，用户的存储（disk）和 agent 的工作环境（environment）分开成为迫切的需求，具体而言，通过在 pod 中挂载云磁盘的方式实现 agent 的共享记忆 —— 记忆随用户走，而不是跟着软件或 agent 走，将数据和工作流解耦</p> <h2 id="容器生命周期管理"><a href="#容器生命周期管理" class="header-anchor">#</a> 容器生命周期管理</h2> <blockquote><p>“编排”永远都是容器云项目的灵魂所在</p></blockquote> <p>Linux 的进程模型对于容器本身的重要意义，换言说，“控制器”模式对整个 Kubernetes 项目提纲挈领的作用</p> <ul><li>为什么容器里只能跑“一个进程”？</li> <li>为什么我原先一直在用的某个 JVM 参数，在容器里就不好使了？</li> <li>为什么 Kubernetes 就不能固定 IP 地址？容器网络连不通又该如何去 Debug？</li> <li>Kubernetes 中 StatefulSet 和 Operator 到底什么区别？</li> <li>PV 和 PVC 这些概念又该怎么用？</li></ul> <h3 id="hpa-自动伸缩"><a href="#hpa-自动伸缩" class="header-anchor">#</a> HPA 自动伸缩</h3> <blockquote><p><a href="https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/" target="_blank" rel="nofollow noopener noreferrer">Horizontal Pod Autoscaling<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>Scale 伸缩是 K8s 一个很重要的概念，K8s 控制器将根据 deployment yaml 动态的保证 pod 数量始终为 replicas 副本字段的值，这里用到 HPA 机制，当然也可以通过 kubectl 命令手动 scale，在 k8s 运行时中，防止 scale 抖动是一个值得讨论的命题</p> <p>可以使用 kubectl scale 更改 Kubernetes 的 <code>deployment, replica set, replication controller, statefulset</code> 等对象的副本数量（扩容缩容）</p> <ul><li>当我们增加副本数时，Kubernetes 将启动新的 Pod 来扩我们的服务</li> <li>降低副本数将导致 Kubernetes 优雅地终止一些 pod，从而释放集群资源</li></ul> <p>kubectl scale 命令，执行该命令将调整名为demo-deployment 的部署，使其拥有三个正在运行的副本</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl scale <span class="token parameter variable">--replicas</span><span class="token operator">=</span><span class="token number">3</span> deployment/demo-deployment
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>等价的方式是修改 Deployment yaml 文件，将 spec.replicas 字段修改为 3，然后重新应用 yaml 文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl apply <span class="token parameter variable">-f</span> demo-deployment.yaml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="kagent"><a href="#kagent" class="header-anchor">#</a> KAgent</h3> <blockquote><p>将 Agent 融入 K8s 的生命周期，以期解决 Agent 的工程化问题，包括但不限于网络通信、工作区管理、生命周期管理，这是一场赌局：赌 Agent 最后的生命形态会是 K8s 的一个个 Pod（这符合云原生的直觉）</p></blockquote> <p>kagent 是一个 k8s 原生 Agent 框架，将 agent 作为 k8s 的一种自定义资源 CRD 融入 k8s pod 的生命周期，使其成为一种原生的 K8s 配置（与普通的 Pod 同级），解决 agent 的编排、调度、通信、存储等生产级问题</p> <blockquote><p>通常而言，我们要实现一种自定义资源，首先是定义其 CRD，而后是实现其控制器 controller</p></blockquote> <p>参考文献</p> <ul><li><a href="https://mp.weixin.qq.com/s/94MvsVHEUY9zEOKwA7a3DA" target="_blank" rel="nofollow noopener noreferrer">kagent：CNCF 首个 Kubernetes 原生 AI Agent 框架，Go Operator 如何管理 Agent 生命周期<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/kagent-dev/kagent" target="_blank" rel="nofollow noopener noreferrer">GitHub - kagent-dev/kagent: Cloud Native Agentic AI | Discord: https://bit.ly/kagentdiscord · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://mp.weixin.qq.com/s/CeEqFEAbGW9yZC_sbUPFlw" target="_blank" rel="nofollow noopener noreferrer">从 Harness 到 Environment：Agent 工程范式的六阶跃迁<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>正常来说，我们做 Harmes Agent，就是创建一个 Pod，然后拉仓库启动项目，Agent 作为代码库的形式耦合到 K8s Pod 里</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> clone my-agent
pip <span class="token function">install</span> <span class="token parameter variable">-r</span> requirements.txt
python agent.py  <span class="token comment"># 手动管理生命周期</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>但 kagent 的思路是，把 Agent 是做 K8s 的资源，通过 yaml 文件启动</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>kubectl apply <span class="token punctuation">-</span>f agent.yaml
kubectl get agents
<span class="token comment"># NAME               STATUS   AGE</span>
<span class="token comment"># gateway-debugger   Ready    2m</span>
<span class="token comment"># log-analyzer       Ready    1m</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>很显然，前者不够“原生”，kagent 将 <strong>Infrastructure as Code</strong> 演进为 <strong>Infrastructure as Agents</strong></p> <table><thead><tr><th style="text-align:left;">传统资源</th> <th style="text-align:left;">kagent Agent</th></tr></thead> <tbody><tr><td style="text-align:left;"><code>kubectl apply -f deployment.yaml</code></td> <td style="text-align:left;"><code>kubectl apply -f agent.yaml</code></td></tr> <tr><td style="text-align:left;"><code>kubectl get pods</code></td> <td style="text-align:left;"><code>kubectl get agents</code></td></tr> <tr><td style="text-align:left;">HPA 自动伸缩</td> <td style="text-align:left;">K8s 原生弹性伸缩</td></tr> <tr><td style="text-align:left;">RBAC 权限控制</td> <td style="text-align:left;">K8s RBAC 控制 Agent 工具权限</td></tr> <tr><td style="text-align:left;"><code>kubectl delete</code> 触发垃圾回收</td> <td style="text-align:left;">Agent 删除自动清理所有关联资源</td></tr></tbody></table> <p>简单来说，就是自定义化一整套的 Agent CRD，使之成为与 Pod 同级别的容器环境</p> <ul><li>CRD = Custom Resource Definition，它允许用户向 Kubernetes API 添加自定义资源，而无需修改 K8s 源码（类似于 Spring 中自定义 Bean 的注入）</li></ul> <p>Agent CRD 是 Agent 环境的核心定义</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> kagent.dev/v1alpha2
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Agent
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">name</span><span class="token punctuation">:</span> gateway<span class="token punctuation">-</span>debugger
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> kagent
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">description</span><span class="token punctuation">:</span> <span class="token string">&quot;Debug Istio Gateway and HTTPRoute configuration issues&quot;</span>
  <span class="token key atrule">modelConfig</span><span class="token punctuation">:</span> claude<span class="token punctuation">-</span>sonnet<span class="token punctuation">-</span>4<span class="token punctuation">-</span>model    <span class="token comment"># 引用 ModelConfig</span>
  <span class="token key atrule">systemMessage</span><span class="token punctuation">:</span> <span class="token punctuation">|</span><span class="token scalar string">
    You are an expert Istio Gateway troubleshooting agent.
    Analyze Gateway and HTTPRoute configurations to find issues.</span>
  <span class="token key atrule">tools</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">type</span><span class="token punctuation">:</span> McpServer
      <span class="token key atrule">mcpServer</span><span class="token punctuation">:</span>
        <span class="token key atrule">name</span><span class="token punctuation">:</span> prometheus<span class="token punctuation">-</span>tools           <span class="token comment"># 引用 MCP 服务器</span>
        <span class="token key atrule">toolNames</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">&quot;query_metrics&quot;</span><span class="token punctuation">]</span>
    <span class="token punctuation">-</span> <span class="token key atrule">type</span><span class="token punctuation">:</span> Agent                        <span class="token comment"># 引用另一个 Agent 作为工具</span>
      <span class="token key atrule">agent</span><span class="token punctuation">:</span>
        <span class="token key atrule">name</span><span class="token punctuation">:</span> diagnostics<span class="token punctuation">-</span>agent
  <span class="token key atrule">memory</span><span class="token punctuation">:</span>
    <span class="token key atrule">modelConfig</span><span class="token punctuation">:</span> embedding<span class="token punctuation">-</span>model
    <span class="token key atrule">ttlDays</span><span class="token punctuation">:</span> <span class="token number">15</span>                          <span class="token comment"># 记忆保留 15 天</span>
  <span class="token key atrule">deployment</span><span class="token punctuation">:</span>
    <span class="token key atrule">replicas</span><span class="token punctuation">:</span> <span class="token number">2</span>
    <span class="token key atrule">resources</span><span class="token punctuation">:</span>
      <span class="token key atrule">requests</span><span class="token punctuation">:</span> <span class="token punctuation">{</span> <span class="token key atrule">cpu</span><span class="token punctuation">:</span> <span class="token string">&quot;100m&quot;</span><span class="token punctuation">,</span> <span class="token key atrule">memory</span><span class="token punctuation">:</span> <span class="token string">&quot;256Mi&quot;</span> <span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><p>其核心特性包括</p> <ol><li><p><strong>CEL 验证规则</strong> —— Kubernetes 原生的准入控制</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>// api/v1alpha2/agent_types.go
<span class="token key atrule">// +kubebuilder:validation:XValidation:rule=&quot;has(self.type) &amp;&amp; self.type == 'Declarative' ? has(self.declarative)</span> <span class="token punctuation">:</span> true&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div></li> <li><p><strong>Owner Reference 链</strong> —— Agent → Deployment + ConfigMap + Service，删除 Agent 自动清理</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>// 控制器创建资源时设置 OwnerReference
deployment.OwnerReferences = <span class="token punctuation">[</span><span class="token punctuation">]</span>metav1.OwnerReference<span class="token punctuation">{</span>
    <span class="token punctuation">{</span>
        <span class="token key atrule">APIVersion</span><span class="token punctuation">:</span> <span class="token string">&quot;kagent.dev/v1alpha2&quot;</span><span class="token punctuation">,</span>
        <span class="token key atrule">Kind</span><span class="token punctuation">:</span>       <span class="token string">&quot;Agent&quot;</span><span class="token punctuation">,</span>
        <span class="token key atrule">Name</span><span class="token punctuation">:</span>       agent.Name<span class="token punctuation">,</span>
        <span class="token key atrule">UID</span><span class="token punctuation">:</span>        agent.UID<span class="token punctuation">,</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div></li> <li><p><strong>跨命名空间访问控制</strong>——类似 Gateway API 模式</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">allowedNamespaces</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token string">&quot;production&quot;</span>
    <span class="token punctuation">-</span> <span class="token string">&quot;staging&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div></li></ol> <p>另外两个 CRD 是 <strong>ModelConfig</strong> 和 <strong>RemoteMCPServer</strong>，和普通 Pod 的 Deployment 和 Service 类似，分别定义了 Agent 的部署方式和通信方式</p> <ul><li>前者支持 8 个 Provider：OpenAI、Anthropic、Azure OpenAI、Google Gemini、Gemini Vertex AI、Anthropic Vertex AI、AWS Bedrock、Ollama</li> <li>后者通过控制器自动连接 MCP 服务器发现工具，并填充到 <code>status.tools</code></li></ul> <p>其 Controller 基于 controller-runtime 实现</p> <blockquote><p>Peter 哥关于 EaaS（Environment-as-a-Service）的判断</p> <ul><li>大模型最终如果要自我进化，需要一个可以给出确定结果的环境，比如修复一个 bug，需要有一个环境可以自动真实反馈给 agent，是不是真的修复了（现在还靠程序员来给他反馈），然后 agent 就可以积累经验了。类似把代码发布到某个环境，然后环境可以真实运行系统并反馈给 agent 结果 ，这里最好不需要人参与</li> <li>这里的环境有点像更真实更自动的测试用例，我也没有想通可以怎么样构建出一个这样的环境，如果能通过真实的生产环境构造人工智能的可信世界，实现 AI 自进化的最后一块拼图，或许能达到 agent 的某种终极形态</li></ul></blockquote> <p>但我始终认为 LLM 的记忆（具体而言是上下文长度），仍是这种“终极形态”的不可逾越的阻碍，如果过了这一关，或许 LLM 只缺生存和繁衍的本能......</p> <h3 id="k8s-controller"><a href="#k8s-controller" class="header-anchor">#</a> K8s Controller</h3> <p>kagent 的 Controller 是标准的 Kubernetes Operator，基于 <a href="https://github.com/kubernetes-sigs/controller-runtime" target="_blank" rel="nofollow noopener noreferrer">kubernetes-sigs/controller-runtime<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 框架</p> <ul><li><a href="https://zhuanlan.zhihu.com/p/663605675" target="_blank" rel="nofollow noopener noreferrer">一文读懂K8s controller-runtime - 知乎<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/1989055" target="_blank" rel="nofollow noopener noreferrer">Controller Runtime 的四种使用姿势-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.xiexianbin.cn/kubernetes/dev/controller-runtime/" target="_blank" rel="nofollow noopener noreferrer">k8s controller-runtime 介绍 | 谢先斌的博客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>我暂且将其理解为 Spring 中自定义 Bean 的开发，类似于 MyBatis</p></div></div> <!----
