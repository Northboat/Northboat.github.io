ZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">生产级容器编排与调度<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="kubernetes-基础"><a href="#kubernetes-基础" class="header-anchor">#</a> Kubernetes 基础</h2> <p>Kubernetes（K8s）<a href="https://github.com/kubernetes/kubernetes" target="_blank" rel="nofollow noopener noreferrer">GitHub - kubernetes/kubernetes: Production-Grade Container Scheduling and Management · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="kubectl"><a href="#kubectl" class="header-anchor">#</a> kubectl</h3> <p>kubectl 是 Kubernetes 集群的官方命令行工具（CLI），也是与 Kubernetes API 进行交互的主要客户端</p> <p>Mac Brew 下载并验证版本</p> <div class="language- extra-class"><pre class="language-text"><code>brew install kubectl
kubectl version

# 正常输出，安装成功
Client Version: v1.29.3
Kustomize Version: v5.0.4-0.20230601165947-6ce0bf390ce3
Server Version: v1.18.4-tke.25
WARNING: version difference between client (1.29) and server (1.18) exceeds the supported minor version skew of +/-1
</code></pre></div><p>将集群的 kubeconfig 写入 ~/.kube/config，包含</p> <ul><li>集群地址</li> <li>命名空间</li> <li>账号（受限于命名空间）</li> <li>token 凭证</li></ul> <p>测试连通性</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 设置别名，省事</span>
<span class="token builtin class-name">alias</span> <span class="token assign-left variable">k</span><span class="token operator">=</span><span class="token string">'/codev/bin/kubectl'</span>
<span class="token comment"># mac 本地</span>
<span class="token builtin class-name">echo</span> <span class="token string">'alias k=&quot;kubectl&quot;'</span> <span class="token operator">&gt;&gt;</span> ~/.zshrc
<span class="token builtin class-name">source</span> ~/.zshrc

<span class="token comment"># 查看当前上下文</span>
k config get-contexts

CURRENT   NAME          CLUSTER   AUTHINFO   NAMESPACE
*         cur-context   cluster   sa         devcloud-ci
</code></pre></div><p>直接命令连接操作集群，常用的 kubectl 命令</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 查看命名空间下的 Pod</span>
k get pods

<span class="token comment"># 查看所有资源</span>
k get all

<span class="token comment"># 查看 Service</span>
k get svc

<span class="token comment"># 查看 Deployment</span>
k get deploy

<span class="token comment"># 查看 Pod 日志</span>
k logs <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span>

<span class="token comment"># 实时查看日志</span>
k logs <span class="token parameter variable">-f</span> <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span>

<span class="token comment"># 进入容器交互</span>
k <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span> -- /bin/bash

<span class="token comment"># 查看 Pod 详细信息</span>
k describe pod <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span>

<span class="token comment"># 查看资源使用</span>
k <span class="token function">top</span> pods
</code></pre></div><h3 id="pod、deployment-和-service"><a href="#pod、deployment-和-service" class="header-anchor">#</a> Pod、Deployment 和 Service</h3> <p>pod 的几个核心概念</p> <ul><li>pod 本身是真正跑服务，执行业务逻辑的单元</li> <li>deployment 是 pod 的配置（一份 yaml 文件），定义 pod 副本数量、使用什么镜像、更新策略等</li> <li>service 是 pod 的网络配置，描述 pod 怎么访问，通过 iptable 和 label 对接其网络入口</li></ul> <p>查看 codev-web-server 节点的 deploy</p> <div class="language-bash extra-class"><pre class="language-bash"><code>kubectl get deploy codev-web-server <span class="token parameter variable">-o</span> yaml <span class="token operator">|</span> <span class="token function">head</span> <span class="token parameter variable">-60</span>
</code></pre></div><p>查看 service（svc）</p> <div class="language-bash extra-class"><pre class="language-bash"><code>kubectl get svc codev-web-server <span class="token parameter variable">-o</span> yaml <span class="token operator">|</span> <span class="token function">head</span> <span class="token parameter variable">-40</span>
</code></pre></div><p>deployment 和 service 都是存在 etcd 里可复用的远端 yaml 配置，etcd 充当 k8s 的配置中心（七彩石）；当配置文件更新后，通过 Master API Server 向相关的 Node 进行广播，Node 上的 kubelet 代理接收到通知后，在 Node 本地实施配置变更</p> <div class="language-mermaid extra-class"><pre class="language-mermaid"><code><span class="token keyword">graph</span> TD
    H<span class="token text string">[&quot;👤 运维更新配置&lt;br/&gt;kubectl apply -f xx.yaml&quot;]</span>

    <span class="token keyword">subgraph</span> MASTER<span class="token text string">[&quot;Master 控制面&quot;]</span>
        ETCD<span class="token text string">[&quot;📦 etcd 配置中心&lt;br/&gt;Deployment + Service&quot;]</span>
    <span class="token keyword">end</span>

    ETCD <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;通知 Node 变更&quot;|</span> AGENT

    <span class="token keyword">subgraph</span> NODE<span class="token text string">[&quot;Node 工作节点&quot;]</span>
        AGENT<span class="token text string">[&quot;kubelet + kube-proxy&quot;]</span>
        POD<span class="token text string">[&quot;Pod 代码容器&quot;]</span>
        AGENT <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;管理/转发&quot;|</span> POD
    <span class="token keyword">end</span>

    H <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;API 提交配置&quot;|</span> ETCD
</code></pre></div><p>一个 Service 示例</p> <div class="language-bash extra-class"><pre class="language-bash"><code>k get svc codev-app-open <span class="token parameter variable">-o</span> yaml <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span>
</code></pre></div><div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Service
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">annotations</span><span class="token punctuation">:</span>
    <span class="token key atrule">service.cloud.tencent.com/status.conditions</span><span class="token punctuation">:</span> <span class="token string">&quot;&quot;</span>
  <span class="token key atrule">creationTimestamp</span><span class="token punctuation">:</span> <span class="token string">&quot;2024-03-08T03:49:52Z&quot;</span>
  <span class="token key atrule">labels</span><span class="token punctuation">:</span>
    <span class="token key atrule">app.kubernetes.io/instance</span><span class="token punctuation">:</span> codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">name</span><span class="token punctuation">:</span> codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> devcloud<span class="token punctuation">-</span>ci
  <span class="token key atrule">resourceVersion</span><span class="token punctuation">:</span> <span class="token string">&quot;10466126729&quot;</span>
  <span class="token key atrule">selfLink</span><span class="token punctuation">:</span> /api/v1/namespaces/devcloud<span class="token punctuation">-</span>ci/services/codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">uid</span><span class="token punctuation">:</span> f7e77e2d<span class="token punctuation">-</span>18fa<span class="token punctuation">-</span>416c<span class="token punctuation">-</span>b562<span class="token punctuation">-</span>82d4d9e8b1bf
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">clusterIP</span><span class="token punctuation">:</span> 11.166.119.84
  <span class="token key atrule">ports</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">name</span><span class="token punctuation">:</span> web80
    <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>
    <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
    <span class="token key atrule">targetPort</span><span class="token punctuation">:</span> <span class="token number">8080</span>
  <span class="token key atrule">selector</span><span class="token punctuation">:</span>
    <span class="token key atrule">app</span><span class="token punctuation">:</span> codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">sessionAffinity</span><span class="token punctuation">:</span> None
  <span class="token key atrule">type</span><span class="token punctuation">:</span> ClusterIP
<span class="token key atrule">status</span><span class="token punctuation">:</span>
  <span class="token key atrule">loadBalancer</span><span class="token punctuation">:</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre></div><p>pod 和我们开发的项目，通过远端的镜像仓库和 Deployment 配置进行关联，CI 负责将我们提交的代码跟进项目的 Dockerfile 构建镜像并推送至镜像仓库，pod 根据 Deployment 拉取镜像并执行由 kubelet 调 containerd 跑</p> <div class="language-bash extra-class"><pre class="language-bash"><code>┌── Dockerfile ───────────────────────────────────────┐
│                                   ← 多阶段构建        │
│  阶段1: golang:1.20.2                                │
│          go build → 编译出 main 二进制                │
│                                                     │
│  阶段2: alpine:3.17                                  │
│          COPY main <span class="token builtin class-name">.</span>                                │
│          CMD <span class="token punctuation">[</span><span class="token string">&quot;./main&quot;</span><span class="token punctuation">]</span>                             │
└────────────────┬────────────────────────────────────┘
                 │ <span class="token function">docker</span> build <span class="token operator">&amp;</span> push
                 ▼
┌── 镜像仓库 ────────────────────────────────────────────┐
│  mirrors.tencent.com/codevpro/codev-web-server:3.4.2  │
└────────────────┬──────────────────────────────────────┘
                 │ Deployment YAML 引用镜像
                 ▼
┌── Deployment YAML ─────────────────────────────────────┐
│  spec:                                                 │
│    containers:                                         │
│    - name: codev-web-server                            │
│      image: mirrors<span class="token punctuation">..</span>.com/<span class="token punctuation">..</span>./codev-web-server:3.4.2   │
└────────────────┬───────────────────────────────────────┘
                 │ Master 分配 → kubelet 执行
                 ▼
┌── Pod（在 Node 上）─────────────────────────────────────┐
│  containerd 拉镜像 → 启动容器 → 运行 ./main              │
│  你的 Go 代码就在这个容器里跑                             │
└────────────────────────────────────────────────────────┘
</code></pre></div><h3 id="node-和-master"><a href="#node-和-master" class="header-anchor">#</a> Node 和 Master</h3> <p>pod 是 k8s 最小的工作单元，拥有独立的运行环境，是真正跑业务、处理请求逻辑的单元，其本质上是一个个 Docker 容器的组合，类似于一个 Docker Compose，这意味着，一个 pod 里可以跑多个 container 服务</p> <ul><li>例如，在一个 pod 中，额外跑一个 zhiyan-agent 容器监听当前 pod 里的 web-server 容器，用于日志采集和监控上报</li></ul> <p>同一个 pod 里的 container 共享 pod 的网络和存储，可以把 pod 理解为 os 中的进程，而 container 为同一进程中的不同线程</p> <div class="language-bash extra-class"><pre class="language-bash"><code>┌──── Pod: codev-web-app ──────────────┐
│                                      │
│  ┌─ codev-web-app <span class="token punctuation">(</span>main container<span class="token punctuation">)</span>─┐ │
│  │  Go 业务代码                     │ │
│  └─────────────────────────────────┘ │
│                                      │
│  ┌─ zhiyan-agent <span class="token punctuation">(</span>Sidecar<span class="token punctuation">)</span>─────────┐ │
│  │  Log Collection / Reporting     │ │
│  └─────────────────────────────────┘ │
│                                      │
│  共享：网络（同 IP）、存储卷            │
└──────────────────────────────────────┘
</code></pre></div><p>每个 pod 都是一个纯粹的“服务”，他是我们业务逻辑实现的程序，pod 的管理分为两部分</p> <ul><li>Master（Scheduler）→ 决定 Pod 分到哪台 Node  ← 决策</li> <li>Master（Controller Mgr）→ 保证 Pod 数量对 ← 决策</li> <li>Node（kubelet）→ 在本机启动/停止容器 ← 执行</li></ul> <p>k8s 中只有两种节点，一种 Master 一种 Node，Master 是管理者，Node 是执行者</p> <p>Node 本质上是一台安装了 Kubernetes 代理（kubelet）+ Kubernates 网络代理（kube-proxy） + 容器运行时（Docker/containerd）的服务器</p> <ol><li>Kubelet 代理，用于管理本机 pod</li> <li>Kube Proxy 网络代理，负责服务访问</li> <li>Container Runtime 容器运行时（Docker/containerd），负责起 pod</li></ol> <p>kubelet 是 Kubernetes（K8s）集群中运行在每个工作节点（Node）上的核心“节点代理”，是 k8s 的下层管理者</p> <ul><li>向外与 Master 通信实施 k8s 管理：通过 API Server 注册当前节点，并持续通报节点的主机名、CPU/内存等可用资源及健康状态；监听 Master 通知，接收并执行分配给该节点的任务，确保节点上的 Pod 和容器完全按照集群期望的状态正常运行</li> <li>向内管理容器生命周期：通过容器运行时（如 Docker、containerd）创建、启动、停止和删除 Pod 及容器；定期执行容器的探针（Probe，如 liveness 和 readiness），一旦发现容器异常，会自动重启或将其剔除出流量转发列表；管理节点本地的硬件资源分配，在 Pod 启动前挂载所需的存储卷（Volume）以及拉取镜像</li></ul> <p>一个 Node 可以跑上千个 Pod，二者相当于服务器与进程的关系（Pod 和 container 是进程和线程的关系）</p> <p>而 Master 节点相当于 k8s 的自动化运维，去统筹所有的 Node 服务器资源，他包括</p> <ol><li>API Server：所有请求入口，写入 etcd 对外暴露 REST API</li> <li>Etcd NoSQL 存储：存集群所有 YAML 数据（Deployment、Service、ConfigMap）以及集群状态（Pod 与 Node 的映射表、IP 多少）</li> <li>Scheduler 调度器：决定 Pod 分配到哪台 Node，看哪台机器 CPU/内存够用</li> <li>Controller Manager 控制器：控制 pod 状态，监听 etcd 变化，维持期望状态 Pod 挂了自动补、副本数不对自动扩缩</li></ol> <p>一个 k8s 集群可以运行多个 Master，但针对不同组件，尤其对于“写”的场景，同时只能有一个 Master 工作</p> <table><thead><tr><th style="text-align:center;">Master 组件</th> <th style="text-align:center;">工作模式</th></tr></thead> <tbody><tr><td style="text-align:center;"><strong>API Server</strong></td> <td style="text-align:center;">多实例<strong>同时工作</strong>，无状态</td></tr> <tr><td style="text-align:center;"><strong>etcd</strong></td> <td style="text-align:center;">Raft 协议，1 个 Leader 写，所有节点可读</td></tr> <tr><td style="text-align:center;"><strong>Scheduler</strong></td> <td style="text-align:center;"><strong>选主</strong>，只有 1 个活跃</td></tr> <tr><td style="text-align:center;"><strong>Controller Manager</strong></td> <td style="text-align:center;"><strong>选主</strong>，只有 1 个活跃</td></tr></tbody></table> <p>针对 etcd 的 Raft 共识要求，节点数必须是奇数个，并且同时只有一个“写”节点，否则会发生“脑裂”</p> <p>在运维过程中，人实际上只和 Master 打交道，准确的说是 API Server，剩余的工作均由 Master 和 kubelet 通信和实施，大致的请求分两种</p> <ul><li>配置的读写：例如查写 pod 的 Service、Deployment、ConfigMap，这一类操作基本上就是在读写 etcd，而后由 k8s 来<strong>实施</strong>这些改动</li> <li>pod 的交互：例如进入 pod，停止 pod，回滚 pod</li></ul> <p>例如执行一句 <code>kubectl exec -it pod --bash</code> 后，会经过以下过程</p> <div class="language-mermaid extra-class"><pre class="language-mermaid"><code><span class="token keyword">flowchart</span> LR
    <span class="token keyword">subgraph</span> LOCAL<span class="token text string">[&quot;你的终端&quot;]</span>
        KUBECTL[<span class="token string">&quot;kubectl exec -it pod -- bash&quot;</span>]
    <span class="token keyword">end</span>

    <span class="token keyword">subgraph</span> MASTER<span class="token text string">[&quot;Master&quot;]</span>
        API<span class="token text string">[&quot;API Server&lt;br/&gt;鉴权 + 找到 Pod 所在 Node&quot;]</span>
        ETCD<span class="token text string">[&quot;etcd&lt;br/&gt;查 Pod 跑在哪个 Node&quot;]</span>
    <span class="token keyword">end</span>

    <span class="token keyword">subgraph</span> NODE<span class="token text string">[&quot;Node: 9.135.144.31&quot;]</span>
        KL<span class="token text string">[&quot;kubelet&lt;br/&gt;收到请求，调 CRI&quot;]</span>
        CR<span class="token text string">[&quot;Container Runtime&lt;br/&gt;containerd&quot;]</span>
        CONT<span class="token text string">[&quot;Container&lt;br/&gt;bash 进程&quot;]</span>
    <span class="token keyword">end</span>

    KUBECTL <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;1. HTTPS POST /exec&quot;|</span> API
    API <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;2. 查 Pod 位置&quot;|</span> ETCD
    API <span class="token arrow operator">-.-&gt;</span><span class="token label property">|&quot;3. SPDY/WebSocket&lt;br/&gt;协议升级，双向流&quot;|</span> KL
    KL <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;4. CRI exec 调用&quot;|</span> CR
    CR <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;5. nsenter 进入&lt;br/&gt;容器 namespace&quot;|</span> CONT
</code></pre></div><table><thead><tr><th style="text-align:center;">步骤</th> <th style="text-align:center;">组件</th> <th style="text-align:center;">步骤详解</th></tr></thead> <tbody><tr><td style="text-align:center;">1</td> <td style="text-align:center;"><strong>kubectl</strong></td> <td style="text-align:center;">发 HTTPS 请求到 API Server：<code>POST /api/v1/namespaces/devcloud-ci/pods/codev-app-open-xxx/exec?command=bash&amp;stdin=true&amp;stdout=true&amp;tty=true</code></td></tr> <tr><td style="text-align:center;">2</td> <td style="text-align:center;"><strong>API Server → etcd</strong></td> <td style="text-align:center;">查 <code>codev-app-open-xxx</code> 跑在 <code>Node 9.135.144.31</code> 上</td></tr> <tr><td style="text-align:center;">3</td> <td style="text-align:center;"><strong>API Server → kubelet</strong></td> <td style="text-align:center;">把请求<strong>代理转发</strong>到 Node 上的 kubelet，协议从 HTTPS 升级为 <strong>SPDY/WebSocket</strong>（支持双向流）</td></tr> <tr><td style="text-align:center;">4</td> <td style="text-align:center;"><strong>kubelet → containerd</strong></td> <td style="text-align:center;">通过 CRI（容器运行时接口）调用 <code>ExecSync</code>，在容器里启动 bash</td></tr> <tr><td style="text-align:center;">5</td> <td style="text-align:center;"><strong>containerd → 容器</strong></td> <td style="text-align:center;">用 <code>nsenter</code> 进入容器的 namespace，启动 bash 进程，stdin/stdout/stderr 通过 SPDY/WebSocket 双向流转回你的终端</td></tr></tbody></table> <p>简单来说，就是建立一条 SPDY/WebSocket 双工通道，用户通过通道的 标准输入输出与 pod 中的 bash 进行交互，当然，这里由 API Server 作为通道的转发跳板，连通集群内外的我和你</p> <ul><li>SPDY 是老版本 k8s 的 <code>exec / log/ port-forward</code> 通信协议，这是 Google 09 年提出的实验协议，HTTP/2 的前身，在 k8s 1.30+ 中默认使用 WebSocket</li></ul> <h3 id="k8s-运维"><a href="#k8s-运维" class="header-anchor">#</a> k8s 运维</h3> <p>如何通过运维通道进到用户 pod 排查问题</p> <ul><li>如何去 k8s 底层看 pod 的运行情况？</li> <li>怎么判断 pod 是否运行正常？</li> <li>如何追 pod 异常原因？</li></ul> <p>接口测试，我现在想在测试集群里测试 app-open 的某个接口，首先先把 app-open 的 pod 和配置查出来，这一堆 grep 得熟悉</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 查 pod</span>
k get pods <span class="token operator">|</span> <span class="token function">grep</span> app-open

<span class="token comment"># 查 svc</span>
k get svc <span class="token operator">|</span> <span class="token function">grep</span> app-open

<span class="token comment"># 查 Deployment</span>
k get deploy <span class="token operator">|</span> <span class="token function">grep</span> app-open

<span class="token comment"># 查 pod 的 Node 信息</span>
k get pods <span class="token parameter variable">-o</span> wide <span class="token operator">|</span> <span class="token function">grep</span> app-open
</code></pre></div><p>找到了 pod 名</p> <div class="language-bash extra-class"><pre class="language-bash"><code>codev-app-open-7fd76f7885-xm5px 
</code></pre></div><p>查询 pod 上服务端口，通过 svc 配置文件得知</p> <div class="language-bash extra-class"><pre class="language-bash"><code>k get svc codev-app-open <span class="token parameter variable">-o</span> yaml <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-A5</span> <span class="token string">&quot;ports:&quot;</span>
</code></pre></div><div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">ports</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">name</span><span class="token punctuation">:</span> web80
    <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>
    <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
    <span class="token key atrule">targetPort</span><span class="token punctuation">:</span> <span class="token number">8080</span>
</code></pre></div><p>port forward 把 pod 映射到我本地的 8081，本质上是建立了一条 tcp 通道，这样不会影响到 pod</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 把 Pod 的 8080 映射到本地 8081</span>
kubectl port-forward pod/codev-app-open-7fd76f7885-xm5px <span class="token number">8081</span>:8080
</code></pre></div><p>也可以进 pod 之后在 pod 内部进行 curl</p> <div class="language-bash extra-class"><pre class="language-bash"><code>kubectl <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> codev-app-open-7fd76f7885-xm5px -- /bin/sh
</code></pre></div><p>然后直接 curl，如果是 port-forward 就是 8081，如果是 exec 后就是 8080</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">curl</span> <span class="token parameter variable">-i</span> <span class="token parameter variable">-X</span> POST <span class="token string">'http://127.0.0.1:8081/env/extra/info'</span> <span class="token parameter variable">-H</span> <span class="token string">'Content-Type: application/json'</span> <span class="token parameter variable">-H</span> <span class="token string">'APPID: anydev_all'</span> <span class="token parameter variable">-d</span> <span class="token string">'{&quot;username&quot;:&quot;saulxiong&quot;,&quot;envId&quot;:&quot;evnIns-72zylw7h9bcq&quot;,&quot;columns&quot;:&quot;passEnvId&quot;}'</span>

<span class="token function">curl</span> <span class="token parameter variable">-i</span> <span class="token parameter variable">-X</span> POST <span class="token string">'http://127.0.0.1:8081/env/info/update'</span> <span class="token parameter variable">-H</span> <span class="token string">'Content-Type: application/json'</span> <span class="token parameter variable">-H</span> <span class="token string">'APPID: anydev_all'</span> <span class="token parameter variable">-d</span> <span class="token string">'{&quot;username&quot;:&quot;saulxiong&quot;,&quot;envId&quot;:&quot;evnIns-72zylw7h9bcq&quot;,&quot;teamEnv&quot;:true,&quot;envName&quot;:&quot;https://git.woa.com/wenchain/genflow&quot;,&quot;idePath&quot;:&quot;/data/workspace&quot;,&quot;ideName&quot;:&quot;Comate&quot;,&quot;ideVersion&quot;:&quot;2.0&quot;}'</span>
</code></pre></div><h3 id="网关与代理"><a href="#网关与代理" class="header-anchor">#</a> 网关与代理</h3> <p>ssh 直连</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">ssh</span> root@saulxiong-any2.dev.cloud.woa.com <span class="token parameter variable">-p</span> <span class="token number">36000</span>
</code></pre></div><p>VPC 和 ENI</p> <ul><li>VPC 即 Virtual Private Cloud 虚拟私有云/专有网络，我们所有机器的 ip 都在一个大的 VPC 下，故而所有 ip 均保持唯一性，但是唯一性不等于可达性，这个一定要注意，不是说一个 ip 地址在网络中唯一了，我就可以无脑 ping 通了，这里存在很多我还没弄清网络限制，可能是出于对 k8s 集群安全考虑的权限认证</li> <li>ENI 即 Elastic Network Interface 弹性网卡接口，网络中可以使用 ENI 为容器分配独立 ENI IP，这个 IP 一经分配，是可以在 ENI 环境中进行直连的，属于稀缺资源</li></ul> <p>ssh 代理路线：用户 -&gt; 泛域名 -&gt; UDNS -&gt; CLB（Classic Load Balancer 负载均衡） -&gt; CVM -&gt; Pod</p> <h3 id="普罗米修斯"><a href="#普罗米修斯" class="header-anchor">#</a> 普罗米修斯</h3> <p>普罗米修斯（Prometheus）是一款开源系统监控与警报工具包，专为云原生环境设计，是 Kubernetes 的标准方案之一</p> <h2 id="容器生命周期管理"><a href="#容器生命周期管理" class="header-anchor">#</a> 容器生命周期管理</h2> <blockquote><p>“编排”永远都是容器云项目的灵魂所在</p></blockquote> <p>Linux 的进程模型对于容器本身的重要意义，或者说，“控制器”模式对整个 Kubernetes 项目提纲挈领的作用</p> <ul><li>为什么容器里只能跑“一个进程”？</li> <li>为什么我原先一直在用的某个 JVM 参数，在容器里就不好使了？</li> <li>为什么 Kubernetes 就不能固定 IP 地址？容器网络连不通又该如何去 Debug？</li> <li>Kubernetes 中 StatefulSet 和 Operator 到底什么区别？</li> <li>PV 和 PVC 这些概念又该怎么用？</li></ul> <h3 id="hpa-横向扩容"><a href="#hpa-横向扩容" class="header-anchor">#</a> HPA 横向扩容</h3> <p><a href="https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/" target="_blank" rel="nofollow noopener noreferrer">Horizontal Pod Autoscaling<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="upper-层实时快照"><a href="#upper-层实时快照" class="header-anchor">#</a> Upper 层实时快照</h3> <blockquote><p>OverlayFS 和 Upper 层</p></blockquote> <p>OverlayFS 是一种联合文件系统（Union File System），它可以将多个目录（称为“层”）透明地叠加在一起，呈现为一个统一的目录视图。它是 Docker 和 Kubernetes 容器镜像和容器运行时默认的存储驱动之一</p> <p>pod 的 image、merge 和 upper</p> <h2 id="k8s-x-agent"><a href="#k8s-x-agent" class="header-anchor">#</a> K8s x Agent</h2> <h3 id="云磁盘"><a href="#云磁盘" class="header-anchor">#</a> 云磁盘</h3> <p>随着 agent 的广泛应用，用户的存储（disk）和 agent 的工作环境（environment）分开成为实实在在的需求</p> <p>具体而言，通过在 pod 中挂载云磁盘的方式实现 agent 的共享记忆 —— 记忆随用户走，而不是跟着软件或 agent 走，将数据和工作流解耦</p> <h3 id="kagent"><a href="#kagent" class="header-anchor">#</a> kagent</h3> <blockquote><p><a href="https://github.com/kagent-dev/kagent" target="_blank" rel="nofollow noopener noreferrer">GitHub - kagent-dev/kagent: Cloud Native Agentic AI | Discord: https://bit.ly/kagentdiscord · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>kagent 将 agent 作为 k8s 的一种自定义资源 CRD 融入 k8s pod 的生命周期，解决 agent 的编排、调度、通信、存储等生产级问题</p> <h3 id="eaas"><a href="#eaas" class="header-anchor">#</a> EaaS</h3> <blockquote><p>Environment-as-a-Service</p></blockquote> <p><a href="https://mp.weixin.qq.com/s/CeEqFEAbGW9yZC_sbUPFlw" target="_blank" rel="nofollow noopener noreferrer">从 Harness 到 Environment：Agent 工程范式的六阶跃迁<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <blockquote><p>大模型最终如果要自我进化，需要一个可以给出确定结果的环境，比如修复一个 bug，需要有一个环境可以自动真实反馈给 agent，是不是真的修复了（现在还靠程序员来给他反馈），然后 agent 就可以积累经验了</p> <p>类似把代码发布到某个环境，然后环境可以真实运行系统并反馈给 agent结果 ，这里最好不需要人参与</p> <p>这里的环境有点像更真实更自动的测试用例，我也没有想通可以怎么样构建出一个这样的环境</p></blockquote> <p>通过真实的生产环境构造人工智能的可信世界，实现 AI 自进化的最后一块拼图，以期望达到某种 agent 的终极形态</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/07/07, 22:32:07</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/46b8df/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">DDD 领域驱动设计</div></a> <!----></div> <div class="page-nav"><p class="inner"><span class="prev">

        <a href="/pages/46b8df/" class="prev">DDD 领域驱动设计</a></span> <!----></p></div></div></div> <div class="article-list"><div class="article-title"><a href="/archives" class="iconfont icon-bi">最近更新</a></div> <div class="article-wrapper"><dl><dd>01</dd> <dt><a href="/pages/7648ae/"><div>
            AI 编程
            <!----></div></a> <span class="date">07-02</span></dt></dl><dl><dd>02</dd> <dt><a href="/pages/040068/"><div>
            开发联调与上线
