lank" title="作者" class="beLink" data-v-06970110>Northboat</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06970110><a href="javascript:;" data-v-06970110>2025-7-09</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAAXNSR0IArs4c6QAABGpJREFUSA3tVVtoXFUU3fvOI53UlmCaKIFmwEhsE7QK0ipFEdHEKpXaZGrp15SINsXUWvBDpBgQRKi0+KKoFeJHfZA+ED9KKoIU2gYD9UejTW4rVIzm0VSTziPzuNu1z507dibTTjL4U/DAzLn3nL3X2o91ziX6f9wMFdh6Jvbm9nNSV0msViVO6tN1Rm7NMu2OpeJ9lWBUTDxrJbYTS0hInuwciu9eLHlFxCLCZEk3MegsJmZ5K/JD6t7FkFdEvGUo1g7qJoG3MHImqRIn8/nzY1K9UPKKiJmtnUqHVE3Gbuay6vJE/N2FEmuxFjW2nUuE0yQXRRxLiTUAzs36zhZvOXJPdX850EVnnLZkB8prodQoM5JGj7Xk2mvC7JB8tG04Ef5PiXtG0UtxupRQSfTnBoCy554x18yJHI6I+G5Eru4LHmPJZEQsrvPUbMiA8G/WgMK7w7I+ez7++o2ANfbrjvaOl1tFMs+htG3IrZH9/hDX1Pr8Tc0UvH8tcX29KzAgIGcEkINyW5BF9x891hw6VYqgJHEk0huccS7vh3C6gTiODL+26huuBtbct8eZnqLML8PkxGYpuPZBqtqwkSjgc4mB5gbgig5i+y0UDK35LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">SCA 和白盒验证<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>业务是皮，安全是毛，有皮才有毛</p> <h2 id="sca-静态代码分析"><a href="#sca-静态代码分析" class="header-anchor">#</a> SCA 静态代码分析</h2> <h3 id="什么是-sca"><a href="#什么是-sca" class="header-anchor">#</a> 什么是 SCA</h3> <p>静态代码分析（Static Code Analysis），是指在不运行程序的前提下，对源代码或字节码进行分析，以发现潜在的问题、缺陷、漏洞</p> <p>通常分析的范围如下</p> <table><thead><tr><th>检查范围</th> <th>例子</th></tr></thead> <tbody><tr><td>语法错误</td> <td>拼写错误、漏掉分号、类型不匹配</td></tr> <tr><td>代码规范</td> <td>命名不规范、缩进不统一、行过长</td></tr> <tr><td>潜在 bug</td> <td>空指针、数组越界、死代码、未关闭资源</td></tr> <tr><td>安全漏洞</td> <td>SQL 注入、XSS、路径遍历、硬编码密码</td></tr> <tr><td>性能问题</td> <td>重复计算、不必要对象创建</td></tr> <tr><td>可维护性问题</td> <td>高复杂度、过深嵌套、长方法、循环依赖</td></tr> <tr><td>设计层面</td> <td>依赖反转、违反 SRP/OCP、代码坏味道（code smell）</td></tr></tbody></table> <p>常见的静态分析工具</p> <table><thead><tr><th>语言</th> <th>工具</th> <th>简介</th></tr></thead> <tbody><tr><td>Java</td> <td><a href="https://www.sonarqube.org/" target="_blank" rel="nofollow noopener noreferrer">SonarQube<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>全面代码质量平台（支持 Web 展示）</td></tr> <tr><td>Java</td> <td><a href="https://spotbugs.github.io/" target="_blank" rel="nofollow noopener noreferrer">SpotBugs（FindBugs）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>检查字节码，发现 bug 模式</td></tr> <tr><td>Java</td> <td>PMD</td> <td>检查代码规范、冗余代码</td></tr> <tr><td>Java</td> <td>Checkstyle</td> <td>检查命名、格式、注释规范等</td></tr> <tr><td>Python</td> <td>pylint / flake8 / mypy</td> <td>语法检查 + 类型检查</td></tr> <tr><td>JavaScript</td> <td>ESLint</td> <td>最广泛使用的前端代码静态分析</td></tr> <tr><td>C/C++</td> <td>cppcheck / clang-tidy / Coverity</td> <td>安全漏洞、内存错误分析</td></tr> <tr><td>多语言</td> <td><a href="https://semgrep.dev/" target="_blank" rel="nofollow noopener noreferrer">Semgrep<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>支持模式匹配式安全规则，可自定义</td></tr> <tr><td>多语言</td> <td>CodeQL（GitHub）</td> <td>类似 SQL 的代码查询语言，GitHub Actions 可集成</td></tr></tbody></table> <p>常见场景：在 CI/CD 流程中进行代码审查，例如使用 GitHub、GitLab、Jenkins，将分析工具集成进你的代码提交或 PR 流程中，每次 push 将自动化检查代码质量</p> <p>安全扫描类库</p> <ul><li>SonarQube 安全规则集</li> <li>Semgrep 安全规则库</li> <li>CodeQL：GitHub 官方推荐，用于查找逻辑型安全问题（如访问控制缺失、注入漏洞）</li></ul> <p>集成 SonarQube</p> <ul><li>在本地或 CI/CD 中部署 SonarQube Server</li> <li>使用<code>sonar-scanner</code>或 Maven 插件上传代码分析结果</li> <li>可通过浏览器查看：bugs、code smells、安全漏洞、重复代码等</li></ul> <p>或者在开发过程中使用插件进行代码检查</p> <table><thead><tr><th>工具</th> <th>集成方式</th></tr></thead> <tbody><tr><td>Checkstyle</td> <td>IDE 插件或 Maven 插件（自动 fail 构建）</td></tr> <tr><td>SpotBugs</td> <td>Maven 插件 / Gradle 插件</td></tr> <tr><td>PMD</td> <td>IDE 插件或<code>mvn pmd:check</code></td></tr></tbody></table> <h3 id="静态分析的底层逻辑"><a href="#静态分析的底层逻辑" class="header-anchor">#</a> 静态分析的底层逻辑</h3> <p>静态分析的底层，像是编译器的前端（语法分析 → 抽象语法树 → 语义检查 → 流程分析）</p> <div class="language- extra-class"><pre class="language-text"><code>源代码
  ↓
词法分析（Lexer）
  ↓
语法分析（Parser）→ 抽象语法树 AST
  ↓
语义分析（类型推断、符号绑定）
  ↓
控制流分析（CFA）&amp; 数据流分析（DFA）
  ↓
规则匹配（Lint）或模式匹配（如 Semgrep、CodeQL）
  ↓
输出警告 / 错误 / 报告
</code></pre></div><p>通过词法语法分析实现控制流分析（Control Flow Analysis, CFA）</p> <ul><li>构建控制流程图（CFG），分析条件/循环/分支/跳转</li> <li>用来判断代码是否可达、分支覆盖是否完整等</li></ul> <div class="language-css extra-class"><pre class="language-css"><code>[Start]
   ↓
[x &gt; 0] ─ Yes → [<span class="token function">doSomething</span><span class="token punctuation">(</span><span class="token punctuation">)</span>]
   └─ No → [return]
</code></pre></div><p>数据流分析（Data Flow Analysis, DFA）</p> <ul><li>分析变量的定义-使用链、是否初始化、是否为空等</li> <li>举例：空指针分析、资源未关闭、变量未赋值就使用等，SpotBugs 等工具广泛应用</li></ul> <p>规则匹配 / 模式识别（Pattern Matching）</p> <ul><li>使用预定义或用户自定义的规则集来匹配代码结构</li> <li>如 Checkstyle 会检查 <code>class 命名必须大写开头</code>，PMD 会匹配 <code>== null</code> 的代码块</li> <li>Semgrep/CodeQL 可以匹配结构 + 上下文</li></ul> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">rules</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">id</span><span class="token punctuation">:</span> detect<span class="token punctuation">-</span>hardcoded<span class="token punctuation">-</span>password
    <span class="token key atrule">pattern</span><span class="token punctuation">:</span> <span class="token punctuation">|</span><span class="token scalar string">
      password = &quot;...&quot;</span>
</code></pre></div><p>模式匹配 + AST 导航是现代分析工具（如 Semgrep、CodeQL）的重要特性</p> <p>其他方法</p> <table><thead><tr><th>方法</th> <th>说明</th></tr></thead> <tbody><tr><td>符号执行（Symbolic Execution）</td> <td>把变量当成符号而不是具体值进行逻辑推演，用于路径覆盖</td></tr> <tr><td>抽象解释（Abstract Interpretation）</td> <td>对程序执行进行近似建模，保守地发现问题</td></tr> <tr><td>模型检测（Model Checking）</td> <td>建模程序状态机，验证其是否满足规范（如死锁）</td></tr> <tr><td>人工智能辅助分析</td> <td>结合语言模型，自动修复警告或生成规则（GitHub Copilot + CodeQL）</td></tr></tbody></table> <h3 id="java-parser"><a href="#java-parser" class="header-anchor">#</a> Java Parser</h3> <p>AST 分析，文档</p> <ul><li><a href="https://javaparser.org/" target="_blank" rel="nofollow noopener noreferrer">JavaParser - Home<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/javaparser/javaparser" target="_blank" rel="nofollow noopener noreferrer">javaparser/javaparser: Java 1-21 Parser and Abstract Syntax Tree for Java with advanced analysis functionalities.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>核心库</p> <table><thead><tr><th>名称</th> <th>功能</th></tr></thead> <tbody><tr><td><code>JavaParser</code></td> <td>语法分析器，构建 Java 源码的 AST</td></tr> <tr><td><code>JavaSymbolSolver</code></td> <td>做静态符号解析（变量、方法、类之间的引用关系），基于类型信息解析方法调用、变量引用等</td></tr> <tr><td><code>CombinedTypeSolver</code></td> <td>提供类路径上的类型信息（包括 JRE、项目源码、依赖 jar）</td></tr></tbody></table> <p>Maven 依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>com.github.javaparser<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>javaparser-symbol-solver-core<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>3.25.5<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>分析示例</p> <p>ProjectAnalyzer：分析一个目录下的所有 Java 代码，记录各自的语法树</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ProjectAnalyzer</span> <span class="token punctuation">{</span>
    
    <span class="token keyword">private</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> pathToSource <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">CompilationUnit</span><span class="token punctuation">&gt;</span></span> pathToAst <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">analyzeDirectory</span><span class="token punctuation">(</span><span class="token class-name">File</span> root<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">File</span><span class="token punctuation">[</span><span class="token punctuation">]</span> files <span class="token operator">=</span> root<span class="token punctuation">.</span><span class="token function">listFiles</span><span class="token punctuation">(</span>f <span class="token operator">-&gt;</span> f<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">endsWith</span><span class="token punctuation">(</span><span class="token string">&quot;.java&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span>files <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span> <span class="token keyword">return</span><span class="token punctuation">;</span>

        <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">File</span> file <span class="token operator">:</span> files<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">try</span> <span class="token punctuation">{</span>
                <span class="token class-name">String</span> content <span class="token operator">=</span> <span class="token class-name">Files</span><span class="token punctuation">.</span><span class="token function">readString</span><span class="token punctuation">(</span>file<span class="token punctuation">.</span><span class="token function">toPath</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                pathToSource<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>file<span class="token punctuation">.</span><span class="token function">getAbsolutePath</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> content<span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token class-name">CompilationUnit</span> cu <span class="token operator">=</span> <span class="token class-name">StaticJavaParser</span><span class="token punctuation">.</span><span class="token function">parse</span><span class="token punctuation">(</span>content<span class="token punctuation">)</span><span class="token punctuation">;</span>
                pathToAst<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>file<span class="token punctuation">.</span><span class="token function">getAbsolutePath</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> cu<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token class-name">System</span><span class="token punctuation">.</span>err<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;Error parsing &quot;</span> <span class="token operator">+</span> file<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">CompilationUnit</span><span class="token punctuation">&gt;</span></span> <span class="token function">getAstMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> pathToAst<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> <span class="token function">getSourceMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> pathToSource<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>JsonGenerator：将 ProjectAnalyzer 的 AST 记录转化为 String 类型的 Json 数据</p> <p>获取的数据结构</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">MethodInfo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> methodName<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> returnType<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> parameters<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> calls <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ClassInfo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> className<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">MethodInfo</span><span class="token punctuation">&gt;</span></span> methods <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

</code></pre></div><p>在遍历 AST 的同时获取信息</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">com<span class="token punctuation">.</span>github<span class="token punctuation">.</span>javaparser<span class="token punctuation">.</span>ast<span class="token punctuation">.</span></span><span class="token class-name">CompilationUnit</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">com<span class="token punctuation">.</span>github<span class="token punctuation">.</span>javaparser<span class="token punctuation">.</span>ast<span class="token punctuation">.</span>body<span class="token punctuation">.</span></span><span class="token operator">*</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">com<span class="token punctuation">.</span>github<span class="token punctuation">.</span>javaparser<span class="token punctuation">.</span>ast<span class="token punctuation">.</span>expr<span class="token punctuation">.</span></span><span class="token class-name">MethodCallExpr</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">com<span class="token punctuation">.</span>google<span class="token punctuation">.</span>gson<span class="token punctuation">.</span></span><span class="token class-name">Gson</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">com<span class="token punctuation">.</span>google<span class="token punctuation">.</span>gson<span class="token punctuation">.</span></span><span class="token class-name">GsonBuilder</span></span><span class="token punctuation">;</span>

<span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token operator">*</span></span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">JsonGenerator</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">CompilationUnit</span><span class="token punctuation">&gt;</span></span> pathToAst<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">JsonGenerator</span><span class="token punctuation">(</span><span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">CompilationUnit</span><span class="token punctuation">&gt;</span></span> pathToAst<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>pathToAst <span class="token operator">=</span> pathToAst<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">generateJson</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> output <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">Map<span class="token punctuation">.</span>Entry</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">CompilationUnit</span><span class="token punctuation">&gt;</span></span> entry <span class="token operator">:</span> pathToAst<span class="token punctuation">.</span><span class="token function">entrySet</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token class-name">String</span> filePath <span class="token operator">=</span> entry<span class="token punctuation">.</span><span class="token function">getKey</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">CompilationUnit</span> cu <span class="token operator">=</span> entry<span class="token punctuation">.</span><span class="token function">getValue</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

            <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">ClassInfo</span><span class="token punctuation">&gt;</span></span> classInfos <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

            <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">TypeDeclaration</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> type <span class="token operator">:</span> cu<span class="token punctuation">.</span><span class="token function">getTypes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">if</span> <span class="token punctuation">(</span>type<span class="token punctuation">.</span><span class="token function">isClassOrInterfaceDeclaration</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                    <span class="token class-name">ClassOrInterfaceDeclaration</span> clazz <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">ClassOrInterfaceDeclaration</span><span class="token punctuation">)</span> type<span class="token punctuation">;</span>

                    <span class="token class-name">ClassInfo</span> classInfo <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ClassInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                    classInfo<span class="token punctuation">.</span>className <span class="token operator">=</span> clazz<span class="token punctuation">.</span><span class="token function">getNameAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

                    <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">MethodDeclaration</span> method <span class="token operator">:</span> clazz<span class="token punctuation">.</span><span class="token function">getMethods</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                        <span class="token class-name">MethodInfo</span> methodInfo <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">MethodInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                        methodInfo<span class="token punctuation">.</span>methodName <span class="token operator">=</span> method<span class="token punctuation">.</span><span class="token function">getNameAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                        methodInfo<span class="token punctuation">.</span>returnType <span class="token operator">=</span> method<span class="token punctuation">.</span><span class="token function">getTypeAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                        methodInfo<span class="token punctuation">.</span>parameters <span class="token operator">=</span> method<span class="token punctuation">.</span><span class="token function">getParameters</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">stream</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                            <span class="token punctuation">.</span><span class="token function">map</span><span class="token punctuation">(</span>p <span class="token operator">-&gt;</span> p<span class="token punctuation">.</span><span class="token function">getTypeAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot; &quot;</span> <span class="token operator">+</span> p<span class="token punctuation">.</span><span class="token function">getNameAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                            <span class="token punctuation">.</span><span class="token function">toList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

                        <span class="token comment">// 👇 提取调用的方法</span>
                        method<span class="token punctuation">.</span><span class="token function">findAll</span><span class="token punctuation">(</span><span class="token class-name">MethodCallExpr</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">forEach</span><span class="token punctuation">(</span>call <span class="token operator">-&gt;</span> <span class="token punctuation">{</span>
                            methodInfo<span class="token punctuation">.</span>calls<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>call<span class="token punctuation">.</span><span class="token function">getNameAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                        <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

                        classInfo<span class="token punctuation">.</span>methods<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>methodInfo<span class="token punctuation">)</span><span class="token punctuation">;</span>
                    <span class="token punctuation">}</span>

                    classInfos<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>classInfo<span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span>

            output<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>filePath<span class="token punctuation">,</span> classInfos<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token class-name">Gson</span> gson <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">GsonBuilder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">setPrettyPrinting</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> gson<span class="token punctuation">.</span><span class="token function">toJson</span><span class="token punctuation">(</span>output<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="lsp-语言服务器协议"><a href="#lsp-语言服务器协议" class="header-anchor">#</a> LSP 语言服务器协议</h2> <p>Language Server Protocol</p> <h3 id="jdt-ls-概述"><a href="#jdt-ls-概述" class="header-anchor">#</a> JDT-LS 概述</h3> <p>LSP 即 Language Server Protocol，语言服务器协议，用于 IDE 与语言服务器通信的协议，它定义了诸如“获取调用链”、“转到定义”等请求和响应，前端 IDE 通过 LSP 与 LS 通信获取以上服务</p> <p>常见的 Java 语言服务器：Eclipse JDT Language Server</p> <ul><li><a href="https://github.com/eclipse-jdtls/eclipse.jdt.ls" target="_blank" rel="nofollow noopener noreferrer">eclipse-jdtls/eclipse.jdt.ls: Java language server<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github-wiki-see.page/m/manateelazycat/lsp-bridge/wiki/Eclipse-JDT-Language-Server" target="_blank" rel="nofollow noopener noreferrer">Eclipse JDT Language Server - manateelazycat/lsp-bridge GitHub Wiki<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>JDT-LS 通过 Jar 包启动，JDK 版本要求 &gt;= 21，以 JDK-LS 1.48 为例，其目录结构如下</p> <div class="language- extra-class"><pre class="language-text"><code>jdt-language-server-1.48.0-202505152338
|-bin
|-config_linux
|-config_linux_arm
|-config_mac
|-config_mac_arm
|-config_ss_linux
|-config_ss_linux_arm
|-config_Ss_mac
|-config_ss_mac_arm
|-config_ss_win
|-config_win
|-features
|_plugins
    |_org.eclipse.equinox.launcher_1.7.0v20250424-1814.jar
</code></pre></div><p>启动命令</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-Declipse.application</span><span class="token operator">=</span>org.eclipse.jdt.ls.core.id1 <span class="token punctuation">\</span>
	<span class="token parameter variable">-Dosgi.bundles.defaultStartLevel</span><span class="token operator">=</span><span class="token number">4</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-Declipse.product</span><span class="token operator">=</span>org.eclipse.jdt.ls.core.product <span class="token punctuation">\</span>
	<span class="token parameter variable">-Dlog.protocol</span><span class="token operator">=</span>true <span class="token punctuation">\</span>
	<span class="token parameter variable">-Dlog.level</span><span class="token operator">=</span>ALL <span class="token punctuation">\</span>
	<span class="token parameter variable">-noverify</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-Xmx1G</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-jar</span> <span class="token punctuation">[</span>path/to/launcher.jar<span class="token punctuation">]</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-configuration</span> <span class="token punctuation">[</span>path/to/config_folder<span class="token punctuation">]</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-data</span> <span class="token punctuation">[</span>workspace<span class="token punctuation">]</span>
</code></pre></div><p>后三个参数需要根据实际情况配置一下</p> <h3 id="ls-启动和通信"><a href="#ls-启动和通信" class="header-anchor">#</a> LS 启动和通信</h3> <p>在 Java 代码中启动 JDT LS 并进行服务调用</p> <h4 id="language-server-config"><a href="#language-server-config" class="header-anchor">#</a> Language Server Config</h4> <p>在 application.yml 配置上述三个启动参数</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">lsp</span><span class="token punctuation">:</span>
  <span class="token key atrule">host</span><span class="token punctuation">:</span> 127.0.0.1
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">6666</span>
  <span class="token key atrule">jar-path</span><span class="token punctuation">:</span> <span class="token string">&quot;D:/Project/lsp-demo/lsp-server/jdt-language-server-1.48.0-202505152338/plugins/org.ecilipse.equinox.launcher_1.8.0.v20250424-1814.jar&quot;</span>
  <span class="token key atrule">config-path</span><span class="token punctuation">:</span> <span class="token string">&quot;D:/Project/lsp-demo/lsp-server/jdt-language-server-1.48.0-202505152338/config_win&quot;</span>
  <span class="token key atrule">workspace</span><span class="token punctuation">:</span> <span class="token string">&quot;D:/workspace/ls&quot;</span>
</code></pre></div><p>注入到 LanguageServerConfig.java 中</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token annotation punctuation">@ConfigurationProperties</span><span class="token punctuation">(</span>prefix<span class="token operator">=</span><span class="token string">&quot;lsp&quot;</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Data</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LanguageServerConfig</span><span class="token punctuation">{</span>
    <span class="token class-name">String</span> host<span class="token punctuation">;</span>
    <span class="token keyword">int</span> port<span class="token punctuation">;</span>
    <span class="token class-name">String</span> jarPath<span class="token punctuation">;</span>
    <span class="token class-name">String</span> configPath<span class="token punctuation">;</span>
    <span class="token class-name">String</span> workspace<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><h4 id="language-server-process"><a href="#language-server-process" class="header-anchor">#</a> Language Server Process</h4> <p>读入 LanguageServerConfig，采用硬编码的方式命令启动 jdt-ls</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token annotation punctuation">@Getter</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LanguageServerProcess</span><span class="token punctuation">{</span>
    
    <span class="token class-name">Process</span> process<span class="token punctuation">;</span>
    <span class="token class-name">InputStream</span> in<span class="token punctuation">;</span>
    <span class="token class-name">OutputStream</span> out<span class="token punctuation">;</span>
    
    <span class="token keyword">public</span> <span class="token class-name">LanguageServerProcess</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerConfig</span> languageServerConfig<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>config <span class="token operator">=</span> languageServerConfig<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>command <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">{</span>
            <span class="token string">&quot;java&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-Declipse.application=org.eclipse.jdt.ls.core.id1&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-Dosgi.bundles.defaultStartLevel=4&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;Declipse.product=org.eclipse.jdt.ls.core.product&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-Dlog.protocol=true&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-Dlog.level=ALL&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-noverify&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-Xmx1G&quot;</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-jar&quot;</span><span class="token punctuation">,</span>
            config<span class="token punctuation">.</span><span class="token function">getJarPath</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
            <span class="token string">&quot;-configuration&quot;</span><span class="token punctuation">,</span>
            config<span class="token punctuation">.</span><span class="token function">getConfigPath</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token punctuation">}</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token keyword">public</span> <span class="token class-name">Boolean</span> <span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">try</span><span class="token punctuation">{</span>
            process <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ProcessBuilder</span><span class="token punctuation">(</span>command<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            in <span class="token operator">=</span> process<span class="token punctuation">.</span><span class="token function">getInputStream</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            out <span class="token operator">=</span> process<span class="token punctuation">.</span><span class="token function">getOutputStream</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
            log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Starting LS Process Failed: {}&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h4 id="language-server-connection"><a href="#language-server-connection" class="header-anchor">#</a> Language Server Connection</h4> <p>通过 Process 中的输入输出流构造<code>Launcher&lt;LanguageSerer&gt; launcher</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token annotation punctuation">@Getter</span>
<span class="token annotation punctuation">@Slf4j</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LanguageServerConnection</span><span class="token punctuation">{</span>
    <span class="token class-name">InputStream</span> in<span class="token punctuation">;</span>
    <span class="token class-name">OutputStream</span> out<span class="token punctuation">;</span>
    <span class="token class-name">LanguageServerClient</span> client<span class="token punctuation">;</span>
    <span class="token class-name">Launcher</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">LanguageServer</span><span class="token punctuation">&gt;</span></span> launcher<span class="token punctuation">;</span>
    
    <span class="token keyword">public</span> <span class="token class-name">LanguageServerConnection</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerProcess</span> process<span class="token punctuation">,</span> <span class="token class-name">LanguageServerClient</span> client<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>in <span class="token operator">=</span> process<span class="token punctuation">.</span><span class="token function">getIn</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>out <span class="token operator">=</span> process<span class="token punctuation">.</span><span class="token function">getOut</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>client <span class="token operator">=</span> client<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">connect</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">ExecutorService</span> executorService <span class="token operator">=</span> <span class="token class-name">Executors</span><span class="token punctuation">.</span><span class="token function">newCachedThreadPool</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        laucher <span class="token operator">=</span> <span class="token class-name">LSPLauncher</span><span class="token punctuation">.</span><span class="token function">createClientLauncher</span><span class="token punctuation">(</span>client<span class="token punctuation">,</span> in<span class="token punctuation">,</span> out<span class="token punctuation">,</span> executorService<span class="token punctuation">,</span> <span class="token punctuation">(</span>trace<span class="token punctuation">)</span> <span class="token operator">-&gt;</span> trace<span class="token punctuation">)</span><span class="token punctuation">;</span>
        launcher<span class="token punctuation">.</span><span class="token function">startListening</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;LS Client Started&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里的 LanguageClient 是 lsp4j 提供的 LSP 客户端接口，需要我手动继承实现，关键如下</p> <h3 id="language-client"><a href="#language-client" class="header-anchor">#</a> Language Client</h3> <blockquote><p>lsp4j</p></blockquote> <p>Maven 依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token comment">&lt;!-- https://mvnrepository.com/artifact/org.eclipse.lsp4j/org.eclipse.lsp4j --&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.eclipse.lsp4j<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>org.eclipse.lsp4j<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>0.24.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>基本思路就是继承 LanguageClient 接口，同时接收一个<code>LanguageServerService</code>用于解锁文件</p> <p>在<code>publishDiagnostics</code>方法中，当收到 didOpen 的回送，调用<code>this.languageServerService.completeFuture(diagnostics.getUri())</code>进行解锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">/**
 * 接收 Language Server 的返回并做出反应
 * 职责:此类是语言服务器(Language Server)所有主动推送消息的接收终点
 * LSP(Language Server Protocol)是一个双向协议，当服务器有信息要通知客户端时，client将收到Diagnostics
 * 回调机制: 此类持有其父级{@link LanguageServerService}的引用，用于解锁，在收到诊断信息时，能够回调上层服务，完成异步工作流
 */</span>
<span class="token annotation punctuation">@Setter</span>
<span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LanguageServerClient</span> <span class="token keyword">implements</span> <span class="token class-name">LanguageClient</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">Logger</span> logger <span class="token operator">=</span> <span class="token class-name">LogManager</span><span class="token punctuation">.</span><span class="token function">getLogger</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerClient</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">LanguageServerService</span> languageServerService<span class="token punctuation">;</span>


    <span class="token keyword">public</span> <span class="token class-name">LanguageServerClient</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerService</span> languageServerService<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>languageServerService <span class="token operator">=</span> languageServerService<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>


    <span class="token comment">// =====================================================================================</span>
    <span class="token comment">// Section 1: 核心通信与诊断 (Core Communication &amp; Diagnostics)</span>
    <span class="token comment">// 这些是任何LSP客户端实现中最基本和最重要的方法。</span>
    <span class="token comment">// =====================================================================================</span>


    <span class="token comment">/**
     * LSP Method: {@code telemetry/event}
     * 作用: 服务器向客户端发送遥测数据或事件，通常用于收集使用情况统计或性能指标
     * 实现: 在我们的场景中，我们只记录接收到的遥测事件以供调试
     * 在生产环境中，可以根据需要将这些数据转发到专门的监控系统
     *
     * @param object 遥测数据，通常是一个JSON对象
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">telemetryEvent</span><span class="token punctuation">(</span><span class="token class-name">Object</span> object<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;收到遥测事件: {}&quot;</span><span class="token punctuation">,</span> object<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code textDocument/publishDiagnostics}
     * 作用: 服务器使用此通知向客户端推送指定文档的诊断信息（如编译错误、警告、语法提示）
     * 这是LSP提供“红色波浪线”功能的核心
     * 实现: 这是我们架构中最重要的回调方法。当收到诊断信息时，我们不直接处理它
     * 而是立即调用{@link LanguageServerService#completeFuture(String uri)}
     * 这将完成之前在LspService中为该文档创建的{@code CompletableFuture}，从而让等待诊断结果的API调用可以继续执行
     *
     * 参数 Diagnostics 包含文档URI和诊断信息列表的参数对象
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">publishDiagnostics</span><span class="token punctuation">(</span><span class="token class-name">PublishDiagnosticsParams</span> diagnostics<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;收到诊断信息 for URI: {}&quot;</span><span class="token punctuation">,</span> diagnostics<span class="token punctuation">.</span><span class="token function">getUri</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 打印一下诊断信息</span>
<span class="token comment">//        for(Diagnostic diagnostic : diagnostics.getDiagnostics()) {</span>
<span class="token comment">//            logger.info(diagnostic.toString());</span>
<span class="token comment">//        }</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;File {} Opened&quot;</span><span class="token punctuation">,</span> diagnostics<span class="token punctuation">.</span><span class="token function">getUri</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 通知 Language Service 诊断已完成</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>languageServerService<span class="token punctuation">.</span><span class="token function">completeFuture</span><span class="token punctuation">(</span>diagnostics<span class="token punctuation">.</span><span class="token function">getUri</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code window/logMessage}
     * 作用: 服务器请求客户端记录一条日志消息。这是一种让服务器日志显示在客户端日志系统中的标准方式
     * 对于调试服务器行为非常有用
     * 实现: 将服务器的消息类型(Error, Warning, Info)映射到自己的Log4j日志级别并记录下来，这使得服务器日志和客户端日志可以统一查看
     *
     * @param message 包含消息类型和内容的参数对象
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">logMessage</span><span class="token punctuation">(</span><span class="token class-name">MessageParams</span> message<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">switch</span> <span class="token punctuation">(</span>message<span class="token punctuation">.</span><span class="token function">getType</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">case</span> <span class="token class-name">Error</span><span class="token operator">:</span>
                logger<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;[Server Log]: {}&quot;</span><span class="token punctuation">,</span> message<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token keyword">break</span><span class="token punctuation">;</span>
            <span class="token keyword">case</span> <span class="token class-name">Warning</span><span class="token operator">:</span>
                logger<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;[Server Log]: {}&quot;</span><span class="token punctuation">,</span> message<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token keyword">break</span><span class="token punctuation">;</span>
            <span class="token keyword">case</span> <span class="token class-name">Info</span><span class="token operator">:</span>
            <span class="token keyword">case</span> <span class="token class-name">Log</span><span class="token operator">:</span>
            <span class="token keyword">default</span><span class="token operator">:</span>
                logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;[Server Log]: {}&quot;</span><span class="token punctuation">,</span> message<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token keyword">break</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// =====================================================================================</span>
    <span class="token comment">// Section 2: 用户交互 (User Interaction)</span>
    <span class="token comment">// 这些方法用于服务器需要与最终用户进行交互的场景。在无头客户端中，我们记录这些请求但不行动</span>
    <span class="token comment">// =====================================================================================</span>


    <span class="token annotation punctuation">@Override</span>

    <span class="token comment">/**
     * LSP Method: {@code workspace/applyEdit}

     * 这是实现“代码重构”、“快速修复”等功能的关键
     * 实现: 这是一个非常重要的方法。一个全功能的客户端会在这里修改其管理的文档内容

     * 1. 尝试将这些更改应用到我们内存中的虚拟文件系统

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">ApplyWorkspaceEditResponse</span><span class="token punctuation">&gt;</span></span> <span class="token function">applyEdit</span><span class="token punctuation">(</span><span class="token class-name">ApplyWorkspaceEditParams</span> params<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;服务器请求应用工作区编辑: {}&quot;</span><span class="token punctuation">,</span> params<span class="token punctuation">.</span><span class="token function">getLabel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 在此可以添加逻辑来实际修改内存中的文件</span>
        <span class="token comment">// ...</span>
        <span class="token comment">// 无论如何，我们都向服务器报告编辑已成功应用。</span>
        <span class="token keyword">return</span> <span class="token class-name">CompletableFuture</span><span class="token punctuation">.</span><span class="token function">completedFuture</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">ApplyWorkspaceEditResponse</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">List</span><span class="token punctuation">&lt;</span><span class="token class-name">Object</span><span class="token punctuation">&gt;</span><span class="token punctuation">&gt;</span></span> <span class="token function">configuration</span><span class="token punctuation">(</span><span class="token class-name">ConfigurationParams</span> configurationParams<span class="token punctuation">)</span> <span class="token punctuation">{</span>
