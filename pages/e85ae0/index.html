entColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://javaguide.cn/java/jvm/jvm-in-action.html" target="_blank" rel="nofollow noopener noreferrer">JVM 线上问题排查和性能调优案例 | JavaGuide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="gc-垃圾回收"><a href="#gc-垃圾回收" class="header-anchor">#</a> GC 垃圾回收</h2> <p>之前也提到，整个 JVM 包括类加载子系统、运行时数据区和执行引擎，其中执行引擎包括</p> <ul><li>解释器：翻译字节码到机器码的程序</li> <li>JIT 解释器：解释器的“缓存”，缓存高频字节码指令对应机器码</li> <li>垃圾回收器：执行垃圾回收算法，在堆中进行 GC</li></ul> <p>垃圾回收是很重要的调优内容</p> <h3 id="垃圾回收机制"><a href="#垃圾回收机制" class="header-anchor">#</a> 垃圾回收机制</h3> <blockquote><p>GC（Garbage Collection）</p></blockquote> <p>HotSpot VM 中的垃圾回收器以及适用场景</p> <ul><li>HotSpot VM 是 Sun 用于 Java 平台的虚拟机，也是 JDK1.3 及之后所有 Sun JDK 的默认虚拟机，当然，由于甲骨文收购了 BEA 和 Sun，所以 HotSpot VM 现在是 Oracle 的，他同时还拥有 JRockit VM</li></ul> <p>垃圾回收 GC 分类</p> <ul><li>Young GC / Minor GC：负责对新生代进行垃圾回收</li> <li>Old GC / Major GC：负责对老年代进行垃圾回收，目前只有 CMS 垃圾收集器会单独回收老年代，其他垃圾回收器都是在整堆回收的时候对老年代进行垃圾收集</li> <li>Full GC：整堆回收</li></ul> <p>为什么要垃圾回收？堆的内存有限，老的垃圾对象一直占着茅坑不拉屎，就会出现 OOM，回收是必要的</p> <ul><li>什么是垃圾：在 JVM 中没有任何引用指向他的对象</li></ul> <p>垃圾回收是为了解决内存泄露的问题？</p> <h3 id="垃圾标记"><a href="#垃圾标记" class="header-anchor">#</a> 垃圾标记</h3> <blockquote><p>先进行垃圾标记，而后再进行回收</p></blockquote> <p>垃圾标记阶段：找到 JVM 中（主要是堆中）的垃圾对象，有以下两种方式</p> <ul><li>引用计数法</li> <li>可达性分析法</li></ul> <p>引用计数法：每个对象维护一个计数器属性，记录当前对象被引用的次数</p> <ul><li>显然，实现很简单，当计数器为 0 时，为垃圾对象</li> <li>缺点：需要额外空间和时间开销来存储引用计数；<strong>无法处理循环引用的问题</strong></li></ul> <p>什么叫无法处理循环引用：例如 A 对象引用了 B，同时 B 对象引用了 A，如果采用引用计数，二者的计数器都为 1，将无法识别是否是垃圾（即使他们同时为垃圾对象），故而很少用这种方法来进行垃圾标记</p> <p>可达性分析法（用的最多的标记法）：以树状的方式，从 GC Root 根节点向下遍历，若可达，说明存在引用，否则则为垃圾对象</p> <p>GC Roots 是一组引用，包括</p> <ul><li>虚拟机栈中执行的方法参数、局部变量对应的对象引用</li> <li>本地方法栈中执行的方法参数、局部变量对应的对象引用</li> <li>方法区中保存的类信息中的静态属性、常量属性对应的对象引用</li></ul> <p>对于每个 Root 而言，即从某个局部变量开始，将其作为根，开始遍历引用，如果所有的 Roots 都没遍历到对象 A，那么 A 被标记为垃圾对象</p> <h3 id="垃圾回收算法"><a href="#垃圾回收算法" class="header-anchor">#</a> 垃圾回收算法</h3> <p><strong>标记-清除算法</strong>（Mark-Sweep）：遍历标记可达对象，再遍历清除非可达对象</p> <img src="/assets/img/image-20251020192901920.9ab1c660.png"> <ul><li>缺点：效率不高；会产生内存碎片</li> <li>优点：思路简单</li></ul> <p><strong>复制算法</strong>（Copying）：每找到一个可达对象，将其复制到一块顺序的空闲内存块中，而后对原有的内存块整块删除</p> <img src="/assets/img/image-20251020193443943.d7511a5d.png"> <p>优点</p> <ol><li>效率较高：只需要遍历一次就可实现，当找到可达对象，就直接复制（在标记-清除中，要先遍历一次找到可达对象，而后再遍历一次删除掉不可达的对象）</li> <li>无内存碎片</li></ol> <p>缺点</p> <ol><li>如果可达对象较多，会造成不必要的复制，降低性能 → 适合垃圾对象比较多的情况</li> <li>需要修改栈帧中的引用地址</li></ol> <p>在新生代中，Eden 区、S0 区和 S1 区的流转就伴随这样的复制，因为在新生代，垃圾对象的比例是比较高的，这样的算法是合算的</p> <p><strong>标记-整理算法</strong>（Mark-Compact）：双指针，在原地整理，就是一道<a href="https://leetcode.cn/problems/move-zeroes/description/" target="_blank" rel="nofollow noopener noreferrer">移动零<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，将非零元素（可达对象）整理到数组前侧；但注意，标记整理算法不是边遍历边移动，而是先遍历遍历，再遍历移动，最后遍历清除</p> <img src="/assets/img/image-20251020194232575.2076fb2b.png"> <ul><li>优点：无内存碎片；无需额外内存空间</li> <li>缺点：效率低于标记清除，因为这一过程相当于标记-整理-清除；和复制算法一样，需要修改栈帧中的引用地址</li></ul> <table><thead><tr><th>总结</th> <th>标记-清除</th> <th>标记-整理</th> <th>复制</th></tr></thead> <tbody><tr><td>时间效率</td> <td>O(2n)</td> <td>O(3n)</td> <td>O(n)</td></tr> <tr><td>空间开销</td> <td>O(1)</td> <td>O(1)</td> <td>O(n)</td></tr> <tr><td>内存碎片</td> <td>有</td> <td>无</td> <td>无</td></tr> <tr><td>移动对象（引用地址改变）</td> <td>否</td> <td>是</td> <td>是</td></tr></tbody></table> <h3 id="分代收集算法"><a href="#分代收集算法" class="header-anchor">#</a> 分代收集算法</h3> <blockquote><p>一种理念，而非具体的算法实现</p></blockquote> <p>几乎所有的垃圾收集器都是采用分代收集算法进行垃圾回收，这是由于新生代和老年代的对象性质决定的，新生代垃圾对象较多而老年代垃圾对象较少</p> <p>即，垃圾对象的密度决定了不同垃圾回收算法的实施，例如，若垃圾对象很多，采用复制算法将会有较高收益，反之若可达对象很多，则复制算法将会造成不必要的开销，故而垃圾回收要分代处理</p> <ul><li>新生代中，采用复制算法</li> <li>老年代中，不适合用复制算法，可以用标记-清除或标记-整理算法
<ul><li>CMS 垃圾收集器采用的就是标记-清除算法</li> <li>Serial Old 垃圾收集器采用的是标记-整理算法</li></ul></li></ul> <h2 id="java-垃圾回收器"><a href="#java-垃圾回收器" class="header-anchor">#</a> Java 垃圾回收器</h2> <h3 id="常见的垃圾回收器"><a href="#常见的垃圾回收器" class="header-anchor">#</a> 常见的垃圾回收器</h3> <table><thead><tr><th>回收器</th> <th>串/并行</th> <th>工作方式</th> <th>适用区域</th> <th>算法</th> <th>备注</th></tr></thead> <tbody><tr><td>Serial GC</td> <td>串行</td> <td>工作线程暂停，一个线程进行垃圾回收</td> <td>新生代</td> <td>复制算法</td> <td></td></tr> <tr><td>Serial Old GC</td> <td>串行</td> <td>工作线程暂停，一个线程进行垃圾回收</td> <td>老年代</td> <td>标记-整理</td> <td></td></tr> <tr><td>ParNew GC</td> <td>并行</td> <td>工作线程暂停，多个线程进行垃圾回收</td> <td>新生代</td> <td>复制算法</td> <td>Serial GC 的多线程版</td></tr> <tr><td>CMS GC</td> <td>并行</td> <td>用户线程和垃圾回收线程同时执行</td> <td>老年代</td> <td>标记-清除</td> <td>低暂停</td></tr> <tr><td>Parallel GC</td> <td>并行</td> <td>工作线程暂停，多个线程进行垃圾回收</td> <td>新生代</td> <td>复制算法</td> <td>和 ParNew 相比，能动态调整内存分配情况，JDK8 默认</td></tr> <tr><td>Parallel Old GC</td> <td>并行</td> <td>工作线程暂停，多个线程进行垃圾回收</td> <td>老年代</td> <td>标记-整理</td> <td>替代串行的 Serial Old GC</td></tr> <tr><td>G1</td> <td>并行</td> <td>用户线程和垃圾回收线程同时执行</td> <td>整堆</td> <td>分区算法</td> <td>再延迟可控的情况下尽可能提高吞吐量，JDK9 默认</td></tr> <tr><td>ZGC</td> <td>并行</td> <td>用户线程和垃圾回收线程同时执行</td> <td>整堆</td> <td>分页算法</td> <td>STW 的时间不超过 1ms，且不会随着堆的大小增加而增加</td></tr></tbody></table> <p>其中，Serial / Serial Old GC 是一组很老的回收器（复制 + 标记-整理）</p> <ul><li>出现时间很早</li> <li>全部串行</li> <li>可能在一些很老的 JDK8 项目会用到这样的垃圾回收</li></ul> <p>ParNew GC 和 CMS GC 是一个 GC 组合（复制 + 标记-清除）</p> <ul><li>并行回收</li> <li>前者将暂停工作线程，而后者将同时进行用户线程和垃圾回收线程</li></ul> <p>同样的，Parallel / Parallel Old GC 也是一个 GC 组合（复制 + 标记-整理）</p> <ul><li>均为并行</li> <li>二者都会暂停工作线程，而后进行多线程的垃圾回收</li> <li>是 JDK8 的默认 GC</li></ul> <p>而最后的 G1 和 ZGC 都是整堆回收，分别采用分区算法和分页算法，前者（G1）为 JDK9 默认的 GC，并且在这一版本废弃了 CMS 回收器</p> <p>垃圾回收器参数（在运行 JVM 时指定）</p> <ul><li>-XX：+PrintCommandLineFlags，查看使用的垃圾收集器</li> <li>-XX：+UseSerialGC，指定使用 Serial GC 和 Serial Old GC</li> <li>-XX：+UseParNewGC，指定新生代使用 ParNew GC；+UseConcMarkSweepGC，指定老年代使用 CMS GC</li> <li>-XX：+UseParallelGC，指定新生代使用 Parallel GC；+UseParallelOldGC，指定老年代使用 Parallel Old GC（这两个配置一个，另一个自动激活）</li></ul> <p>可以发现，在分代回收中，新生代专用的垃圾回收器都是用的复制算法，老年代采用标记-整理或标记-清除算法，这和之前提到的算法性质的适用场景是保持一致的</p> <h3 id="serial-和-parallel-gc"><a href="#serial-和-parallel-gc" class="header-anchor">#</a> Serial 和 Parallel GC</h3> <blockquote><p>读法：serial（siri）parallel（pie瑞乐）</p></blockquote> <p>Serial GC 和 Serial Old GC 都是串行 GC，在很早的 JDK 版本中有使用，他们在进行垃圾回收时</p> <ul><li>都会暂停工作线程，<strong>即 STW</strong>（Stop The World）</li> <li>而后，开启<strong>一个线程</strong>（串行的含义在此），对各自的区域执行垃圾回收算法（复制算法 / 标记-整理算法）</li></ul> <p>因为当时的机器，一般只有一颗 CPU，所以设计的时候没有考虑那么多，一个线程就够了</p> <p>Parallel GC 和 Parallel GC 像是 Serial 的多线程版本，他们同样会 STW，而后开启多个线程执行垃圾回收算法（复制算法 / 标记-整理算法）</p> <ul><li>为什么要 STW 的呢？如果边执行用户线程边回收会怎么样呢？答案是可能会造成垃圾对象的漏标和误删的情况</li> <li>那为什么有的算法不需要 STW 呢？</li></ul> <h3 id="cms-垃圾回收器"><a href="#cms-垃圾回收器" class="header-anchor">#</a> CMS 垃圾回收器</h3> <blockquote><p>CMS 垃圾回收器在 Java 9 中已被标记为过时（deprecated），即废弃，在 Java 14 中被移除</p></blockquote> <p>针对老年代的垃圾回收器，其对应的新生代垃圾回收组合为 ParNew GC</p> <p>CMS（ConcMarkSweep 并发标记清除），主要特点是“低暂停”，即 STW 的时间变短，这导致垃圾收集的过程更长了，但这似乎并不影响用户体验，因为用户并不感知垃圾回收，只觉得 STW 变短，我的任务执行得更快了，但实际上，程序的吞吐量更低了（单位时间内执行的用户线程变少了），因为垃圾回收的并发执行拖慢了程序</p> <img src="/assets/img/image-20251030213357417.3f1527d6.png"> <p>蓝色箭头为用户线程，黄色箭头为垃圾回收线程</p> <ul><li>初始标记阶段：只标记 GC Roots 下一层的可达对象，这个过程虽然会 STW，但很短</li> <li>并发标记阶段：这是最耗时的一个阶段，会采用<strong>三色算法</strong>减少并发造成的垃圾对象的误判，但误差无法避免</li> <li>重新标记阶段：修正并发标记阶段产生的误差，这需要 STW，但不是很长，这里会采用<strong>增量更新</strong></li> <li>并发清除阶段：删除垃圾对象（标记-清除算法），由于不需要移动对象位置，所以也可以和用户线程并发执行，不需要 STW</li></ul> <p>CMS 的问题</p> <ul><li>由于并发执行，有可能出现这样一种情况：老年代还没清理完毕，用户线程一直执行，产生的新对象又要进入老年代，而老年代没有足够的空间存放新来的对象，就会导致<code>concurrent mode failure</code>，此时就会利用 Serial Old 来做一次垃圾清理，Serial Old 会做一次全局的 STW</li> <li>在并发清除阶段，可能会产生新的垃圾（因为之前可达，在这一阶段不可达了，断链了，此时垃圾对象就被错标为可达对象），称之为<strong>浮动垃圾</strong>，只能等到下一次 GC 时清理</li> <li>采用的标记-清除算法会产生内存碎片，可通过参数<code>-XX: +UseCMSCompactAtFullCollection</code>可以让 JVM 执行完标记-清除后在做一次整理，还可以通过<code>-XX: CMSFullGCsBeforeCompaction</code>来指定多少次清除后再做整理，默认为 0，即每次清除后都做整理</li></ul> <p>例如</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token parameter variable">-XX:+UseConcMarkSweepGC</span>  <span class="token comment"># 启用 CMS 收集器</span>
<span class="token parameter variable">-XX:+UseCMSCompactAtFullCollection</span>  <span class="token comment"># 允许 Full GC 时压缩</span>
<span class="token parameter variable">-XX:CMSFullGCsBeforeCompaction</span><span class="token operator">=</span><span class="token number">2</span>  <span class="token comment"># 每 2 次不压缩的 Full GC 后，执行 1 次带压缩的 Full GC</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>当然，高版本 JDK 中建议优先使用 G1 等现代收集器，避免依赖 CMS 的这些参数</p> <h3 id="g1-垃圾回收器"><a href="#g1-垃圾回收器" class="header-anchor">#</a> G1 垃圾回收器</h3> <blockquote><p>Garbage-First GC</p></blockquote> <p>从 Java 9 开始，一直到 Java 25（2025 年 9 月发布），G1 一直都是 JDK 默认的垃圾回收器</p> <ul><li>ZGC 从 Java 15 转正，但需手动指定<code>-XX: +UseZGC</code>，<strong>适合低延迟大内存需求</strong>，但因兼容性和场景适应性，尚未替代 G1 的默认地位</li> <li>Shenandoah 在 Java 17 转正，和 ZGC 一样，都是低延迟 GC，需手动指定<code>-XX: +UseShenandoahGC</code>，同样针对低延迟大内存的特定场景优化</li></ul> <img src="/assets/img/image-20251030222710372.b3233137.png"> <p>G1 垃圾回收器会把堆空间划分成很多个 region，例如把堆内存平均分为 2048 个 region，仍然区分了 Eden 区、S0 区、S1 区和老年代，只不过各个区的空间可以是不连续的</p> <p>另外，Humongous 区用于专门存放大对象（大对象指，大小超过一个 region 50% 的对象），也就是说，一个 H region 只存一个对象</p> <img src="/assets/img/image-20251030223814832.564445bd.png"> <p>在初始标记和最终标记都会进行 STW，至此和 CMS 大致相同，但下一阶段有着明显不同</p> <ul><li>在 ConcMarkSweep 中，二次标记后，会执行并发清除，即一边清除一边执行用户线程，这样会导致有浮动垃圾</li> <li>而在 Garbage First 中，这一步回收将会 STW，这会避免浮动垃圾的产生，并且，这里是<strong>筛选回收</strong></li></ul> <p>筛选回收阶段：通过<code>-XX: MaxGCPauseMillis=?</code>来指定 GC 的 STW 停顿时间，默认 200ms，也就是说，这里的筛选回收只会执行 200ms，很有可能并不会回收掉所有垃圾对象，<strong>他会通过一些算法来筛选一些性价比较高的回收对象</strong>先进行回收</p> <p>并且，采用复制算法，不会产生内存碎片，他会把某个 region 里的垃圾对象复制到另外空闲的 region 中（例如相邻的 region）</p> <p>G1 的分区算法</p> <ul><li>YoungGC（复制算法）：Eden 区满，触发 G1 的 YoungGC，对 Eden 区进行垃圾回收</li> <li>MixedGC（复制算法）：当老年代的占用率达到了<code>-XX: InitiatingHeapOccupancyPercent=?</code>指定的百分比，回收所有的新生代、部分的老年代以及大对象区</li> <li>FullGC（标记-整理算法）：在进行 MixedGC 进行过程中，由于采用复制算法，如果复制过程中内存不够，则会触发 FullGC，会 STW，并采用单线程来进行标记-整理算法进行 GC，相当于用了一次 Serial GC</li></ul> <h3 id="zgc-垃圾回收器"><a href="#zgc-垃圾回收器" class="header-anchor">#</a> ZGC 垃圾回收器</h3> <p>适合低延迟大内存的特定业务场景，例如金融交易、实时服务等</p> <h2 id="常用-jvm-参数"><a href="#常用-jvm-参数" class="header-anchor">#</a> 常用 JVM 参数</h2> <h3 id="堆内存相关"><a href="#堆内存相关" class="header-anchor">#</a> 堆内存相关</h3> <h4 id="堆内存大小"><a href="#堆内存大小" class="header-anchor">#</a> 堆内存大小</h4> <p><a href="https://javaguide.cn/java/jvm/jvm-parameters-intro.html#%E8%AE%BE%E7%BD%AE%E5%A0%86%E5%86%85%E5%AD%98%E5%A4%A7%E5%B0%8F-xms-%E5%92%8C-xmx" target="_blank" rel="nofollow noopener noreferrer">设置堆内存大小 (-Xms 和 -Xmx)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，根据应用程序的实际需求设置初始和最大堆内存大小，是性能调优中最常见的实践之一</p> <p><strong>推荐显式设置这两个参数，并且通常建议将它们设置为相同的值</strong>，以避免运行时堆内存的动态调整带来的性能开销，例如将 JVM 初始堆和最大堆都设置为 4GB</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-Xms4G</span> <span class="token parameter variable">-Xmx4G</span> WebApplication.jar
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="新生代内存大小"><a href="#新生代内存大小" class="header-anchor">#</a> 新生代内存大小</h4> <p><a href="https://javaguide.cn/java/jvm/jvm-parameters-intro.html#%E8%AE%BE%E7%BD%AE%E6%96%B0%E7%94%9F%E4%BB%A3%E5%86%85%E5%AD%98%E5%A4%A7%E5%B0%8F-young-generation" target="_blank" rel="nofollow noopener noreferrer">设置新生代内存大小 (Young Generation)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，根据<a href="https://docs.oracle.com/javase/8/docs/technotes/guides/vm/gctuning/sizing.html" target="_blank" rel="nofollow noopener noreferrer">Oracle 官方文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，在堆总可用内存配置完成之后，第二大影响因素是为 <code>Young Generation</code> 在堆内存所占的比例</p> <p>默认情况下，YG 的最小大小为 <strong>1310 MB</strong>，最大大小为<strong>无限制</strong></p> <p><strong>1.通过<code>-XX:NewSize</code>和<code>-XX:MaxNewSize</code>指定</strong></p> <p>示例： 设置新生代最小 512MB，最大 1024MB</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token parameter variable">-XX:NewSize</span><span class="token operator">=</span>512m <span class="token parameter variable">-XX:MaxNewSize</span><span class="token operator">=</span>1024m
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>2.通过<code>-Xmn&lt;young size&gt;[unit]</code>指定</strong></p> <p>示例： 将新生代大小固定为 512MB</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token parameter variable">-Xmn512m</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>GC 调优策略中很重要的一条经验总结是这样说的</p> <blockquote><p>尽量让新创建的对象在新生代分配内存并被回收，因为 Minor GC 的成本通常远低于 Full GC。通过分析 GC 日志，判断新生代空间分配是否合理。如果大量新对象过早进入老年代（Promotion），可以适当通过 <code>-Xmn</code> 或 -<code>XX:NewSize/-XX:MaxNewSize</code> 调整新生代大小，目标是最大限度地减少对象直接进入老年代的情况</p></blockquote> <p>另外，你还可以通过 <strong><code>-XX:NewRatio=&lt;int&gt;</code></strong> 参数来设置<strong>老年代与新生代（不含 Survivor 区）的内存大小比例</strong></p> <p>例如，<code>-XX:NewRatio=2</code> （默认值）表示老年代 : 新生代 = 2 : 1。即新生代占整个堆大小的 1/3</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token parameter variable">-XX:NewRatio</span><span class="token operator">=</span><span class="token number">2</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="元空间内存大小"><a href="#元空间内存大小" class="header-anchor">#</a> 元空间内存大小</h4> <p>JDK 7，在堆内存中存在<strong>永久代</strong>（PermGen），是比老年代更加顽固的对象存储区域，从 JDK 8 开始，永久代被移除，转而被元空间（Metaspace）代替，元空间使用本地内存，并不在堆内存中，同样存储顽固的老年对象</p> <p>元空间的一些常用参数</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token parameter variable">-XX:MetaspaceSize</span><span class="token operator">=</span>N <span class="token comment">#设置 Metaspace 的初始大小（是一个常见的误区，后面会解释）</span>
<span class="token parameter variable">-XX:MaxMetaspaceSize</span><span class="token operator">=</span>N <span class="token comment">#设置 Metaspace 的最大大小</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><blockquote><p><strong><code>-XX:MetaspaceSize</code> 并非初始容量：</strong> Metaspace 的初始容量并不是 <code>-XX:MetaspaceSize</code> 设置，无论 <code>-XX:MetaspaceSize</code> 配置什么值，对于 64 位 JVM，元空间的初始容量通常是一个固定的较小值（Oracle 文档提到约 12MB 到 20MB 之间，实际观察约 20.8MB）</p> <p><strong>扩容与 Full GC：</strong> 当 Metaspace 的使用量增长并首次达到<code>-XX:MetaspaceSize</code> 指定的阈值时，会触发一次 Full GC。在此之后，JVM 会动态调整这个触发 GC 的阈值。如果元空间继续增长，每次达到新的阈值需要扩容时，仍然可能触发 Full GC（具体行为与垃圾收集器和版本有关）</p> <p><strong><code>-XX:MaxMetaspaceSize</code>的重要性</strong>：如果不显式设置<code>-XX:MaxMetaspaceSize</code>，元空间的最大大小理论上受限于可用的本地内存。在极端情况下（如类加载器泄漏导致不断加载类），这确实**可能耗尽大量本地内存。因此，<strong>强烈建议设置一个合理的<code>-XX:MaxMetaspaceSize</code>上限</strong>，以防止对系统造成影响</p></blockquote> <h3 id="垃圾收集相关"><a href="#垃圾收集相关" class="header-anchor">#</a> 垃圾收集相关</h3> <p>垃圾回收器的选择</p> <ul><li><code>-XX: +UseSerialGC</code></li> <li><code>-XX: +UseParallelGC</code></li> <li><code>-XX: +UseConcMarkSweepGC</code>（CMS 仅作用于老年代）</li> <li><code>-XX: +UseG1GC</code></li> <li><code>-XX: +UseZGC</code></li> <li><code>-XX: +UseShenandoahGC</code></li></ul> <p>日志打印，通过 Xlog 进行日志记录</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>-Xlog:<span class="token punctuation">[</span>选择器<span class="token punctuation">]</span><span class="token punctuation">[</span>:<span class="token punctuation">[</span>输出目标<span class="token punctuation">]</span><span class="token punctuation">[</span>:<span class="token punctuation">[</span>日志格式<span class="token punctuation">]</span><span class="token punctuation">[</span>:<span class="token punctuation">[</span>日志级别<span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>GC 日志打印</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">java</span> -Xlog:gc*<span class="token operator">=</span>info:file<span class="token operator">=</span>gc.log:time,level,tags <span class="token parameter variable">-jar</span> WebApplication.jar
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>gc*=info</code>：所有 GC 相关日志（<code>gc</code> 开头的标签），级别为 <code>info</code></li> <li><code>file=gc.log</code>：日志写入 <code>gc.log</code> 文件</li> <li><code>time,level,tags</code>：每条日志包含时间戳、级别、标签（如 <code>gc,young</code>）</li></ul> <h3 id="处理-oom"><a href="#处理-oom" class="header-anchor">#</a> 处理 OOM</h3> <p>OOM，即 Out Of Memory 内存溢出</p> <blockquote><p>对于大型应用程序来说，面对内存不足错误是非常常见的，这反过来会导致应用程序崩溃。这是一个非常关键的场景，很难通过复制来解决这个问题</p> <p>这就是为什么 JVM 提供了一些参数，这些参数将堆内存转储到一个物理文件中，以后可以用来查找泄漏</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 在发生 OOM 时生成堆转储文件</span>
<span class="token parameter variable">-XX:+HeapDumpOnOutOfMemoryError</span>

<span class="token comment"># 指定堆转储文件的输出路径。&lt;pid&gt; 会被替换为进程 ID</span>
<span class="token parameter variable">-XX:HeapDumpPath</span><span class="token operator">=</span>/path/to/heapdump/java_pid<span class="token operator">&lt;</span>pid<span class="token operator">&gt;</span>.hprof
<span class="token comment"># 示例：-XX:HeapDumpPath=/data/dumps/</span>

<span class="token comment"># (可选) 在发生 OOM 时执行指定的命令或脚本</span>
<span class="token comment"># 例如，发送告警通知或尝试重启服务（需谨慎使用）</span>
<span class="token comment"># -XX:OnOutOfMemoryError=&quot;&lt;command&gt; &lt;args&gt;&quot;</span>
<span class="token comment"># 示例：-XX:OnOutOfMemoryError=&quot;sh /path/to/notify.sh&quot;</span>

<span class="token comment"># (可选) 启用 GC 开销限制检查</span>
<span class="token comment"># 如果 GC 时间占总时间比例过高（默认 98%）且回收效果甚微（默认小于 2% 堆内存），</span>
<span class="token comment"># 会提前抛出 OOM，防止应用长时间卡死在 GC 中。</span>
<span class="token parameter variable">-XX:+UseGCOverheadLimit</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div></blockquote> <h2 id="jvm-测试及工具"><a href="#jvm-测试及工具" class="header-anchor">#</a> JVM 测试及工具</h2> <p>JDK 版本：17</p> <h3 id="jmh"><a href="#jmh" class="header-anchor">#</a> JMH</h3> <p>Java Microbenchmark Harness，微观性能测试（适合测试 GC、内存分配、JIT 编译等参数的影响），由 OpenJDK 官方提供，专门用于编写 Java 基准测试，可精确控制测试条件，输出吞吐量、延迟等指标</p> <p>编写测试类</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">org<span class="token punctuation">.</span>openjdk<span class="token punctuation">.</span>jmh<span class="token punctuation">.</span>annotations<span class="token punctuation">.</span></span><span class="token operator">*</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span>concurrent<span class="token punctuation">.</span></span><span class="token class-name">TimeUnit</span></span><span class="token punctuation">;</span>

<span class="token annotation punctuation">@BenchmarkMode</span><span class="token punctuation">(</span><span class="token class-name">Mode<span class="token punctuation">.</span>Throughput</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@OutputTimeUnit</span><span class="token punctuation">(</span><span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Warmup</span><span class="token punctuation">(</span>iterations <span class="token operator">=</span> <span class="token number">3</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Measurement</span><span class="token punctuation">(</span>iterations <span class="token operator">=</span> <span class="token number">5</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ObjectCreationBenchmark</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Benchmark</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">testObjectCreation</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">Object</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 测试对象创建</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token class-name"><span class="token namespace">org<span class="token punctuation">.</span>openjdk<span class="token punctuation">.</span>jmh<span class="token punctuation">.</span></span>Main</span><span class="token punctuation">.</span><span class="token function">main</span><span class="token punctuation">(</span>args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>测试不同垃圾回收器的表现</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-XX:+UseParallelGC</span> <span class="token parameter variable">-Xms512m</span> <span class="token parameter variable">-Xmx512m</span> ObjectCreationBenchmark
<span class="token function">java</span> <span class="token parameter variable">-XX:+UseG1GC</span> <span class="token parameter variable">-Xms512m</span> <span class="token parameter variable">-Xmx512m</span> ObjectCreationBenchmark

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>关注输出中的<code>Ops/s</code>（每秒操作数），数值越高表示性能越好</p> <p>通过对比不同 GC 收集器的结果，可观察</p> <ul><li>ZGC 在大对象创建时是否延迟更低？</li> <li>G1 的<code>MaxGCPauseMillis</code>参数是否会影响吞吐量？</li></ul> <h3 id="gc-stress-test"><a href="#gc-stress-test" class="header-anchor">#</a> gc-stress-test</h3> <p>一个简单的 Java 程序，通过循环创建大量对象（可控制对象大小和存活率），强制触发 GC，专门测试 GC 行为（适合调试 GC 参数、观察内存碎片、GC 日志等）</p> <p>测试类</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">GCStressTest</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span> <span class="token punctuation">{</span>
        <span class="token keyword">while</span> <span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token comment">// 创建一批对象（部分存活，部分垃圾）</span>
            <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> garbage <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token number">1000</span><span class="token punctuation">]</span><span class="token punctuation">;</span>
            <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> garbage<span class="token punctuation">.</span>length<span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                garbage<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">=</span> i <span class="token operator">%</span> <span class="token number">10</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token operator">?</span> <span class="token keyword">new</span> <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token number">1024</span> <span class="token operator">*</span> <span class="token number">10</span><span class="token punctuation">]</span> <span class="token operator">:</span> <span class="token keyword">null</span><span class="token punctuation">;</span> <span class="token comment">// 10%存活率</span>
            <span class="token punctuation">}</span>
            <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 控制创建频率</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>maven package 后 class 文件生成在<code>target/classes/com/jvmtest/GCStressTest.class</code></p> <p>执行命令</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token builtin class-name">cd</span> C:<span class="token punctuation">\</span>Users<span class="token punctuation">\</span>admin<span class="token punctuation">\</span>Desktop<span class="token punctuation">\</span>Repo<span class="token punctuation">\</span>JVMTest<span class="token punctuation">\</span>target<span class="token punctuation">\</span>classes
<span class="token function">java</span> <span class="token parameter variable">-Xms1g</span> <span class="token parameter variable">-Xmx1g</span> <span class="token parameter variable">-XX:+UseG1GC</span> -Xlog:gc*<span class="token operator">=</span>info:file<span class="token operator">=</span>g1_gc.log:time,level,tags com.jvmtest.GCStressTest
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>切换为 Parallel GC</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-Xms1g</span> <span class="token parameter variable">-Xmx1g</span> <span class="token parameter variable">-XX:+UseParallelGC</span> -Xlog:gc*<span class="token operator">=</span>info:file<span class="token operator">=</span>paralle_gc.log:time,level,tags com.jvmtest.GCStressTest
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>切换为 ZGC</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-Xms1g</span> <span class="token parameter variable">-Xmx1g</span> <span class="token parameter variable">-XX:+UseZGC</span> -Xlog:gc*<span class="token operator">=</span>info:file<span class="token operator">=</span>z_gc.log:time,level,tags com.jvmtest.GCStressTest
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这条命令参数将在当前目录下生成<code>xx_gc.log</code></p> <h3 id="jconsole"><a href="#jconsole" class="header-anchor">#</a> JConsole</h3> <blockquote><p>JConsole 是基于 JMX 的可视化监视、管理工具，可以很方便的监视本地及远程服务器的 java 进程的内存使用情况</p> <p>你可以在控制台输入<code>jconsole</code>命令启动或者在 JDK 目录下的 bin 目录找到<code>jconsole.exe</code>然后双击启动</p></blockquote> <p><a href="https://javaguide.cn/java/jvm/jvm-in-action.html" target="_blank" rel="nofollow noopener noreferrer">JVM线上问题排查和性能调优案例 | JavaGuide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="各版本-jdk-特性"><a href="#各版本-jdk-特性" class="header-anchor">#</a> 各版本 JDK 特性</h2> <p>参见 <a href="https://javaguide.cn/java/new-features/" target="_blank" rel="nofollow noopener noreferrer">New Features | JavaGuide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>record</li> <li><code>...</code>入参</li> <li>var</li> <li>虚拟线程</li></ul> <h3 id="java-8"><a href="#java-8" class="header-anchor">#</a> Java 8</h3> <p>主要改动</p> <ul><li>接口 interface 在这一版本被引入</li> <li>Lambda 表达式被引入，使代码更紧凑（流式编程），并且支持简单的函数式编程</li> <li>引入流类型 stream，可以流式操纵 Collection 数据</li> <li>在 Java 8 中，改动了 HashMap 的底层实现数据结构，从<code>链表数组</code>改为<code>链表/红黑树数组</code>，数组中存放头节点/根节点，通过 hash 算法找到数组下标再插入（链表长度超过 8 则转换为红黑树，红黑树节点少于 6 则转换为链表）</li> <li>引入 Optional 类，更优雅的处理 NPE（NullPointerException）</li></ul> <h3 id="java-9"><a href="#java-9" class="header-anchor">#</a> Java 9</h3> <p>主要改动</p> <ul><li>G1 成为默认垃圾回收器，在 Java 8，默认 GC 是 Parallel / Parallel Old GC，并且在 Java 9，CMS 回收器被废弃</li> <li>String 的存储结构优化：从 <code>char[]</code> 存储变为 <code>byte[]</code> 存储，节省了空间</li> <li>变量句柄</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/22, 01:10:43</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/6945a9/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">JVM 基础（一）</div></a> <a href="/pages/4feb0e/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Linux 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
