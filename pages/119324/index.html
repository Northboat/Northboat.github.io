模型指纹</p> <ol><li>Tokenizer 词表：BPE 分词器的词表由训练语料统计生成，同一型号的模型共享几乎相同的词表，给模型一段特定文本，看它能切出多少 Token 以及切分的方式，基本可以锁定</li> <li>logprob（Logarithmic Probability 对数概率）：给定同样的 prompt，不同模型输出的 token 概率分布差异很大。采集几百条 prompt 的 top-5 logprob 统计对比，可以缩小范围</li> <li>特殊 Token：不同模型的控制 Token，例如思考过程中的 <code>&lt;think&gt;, &lt;|im_start|&gt;, &lt;|endoftext|&gt;</code> 不相同</li> <li>知识截止：问模型最近发生的事件，结合公开的训练节点推断</li> <li>风格：比较玄学了，例如 GPT 喜欢列任务，Deepseek 废话少</li></ol> <p>BPE（Byte Pair Encoding，字节对编码）分词器是目前最主流的大语言模型（LLM）分词算法之一</p> <p>如何设计有效的 Tokenizer 探针？</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>构造文本集：构造探针文本
	↓
采集指纹：调用 Tokenizer 切分文本
	↓
建指纹库：将文本递给已知模型切分
	↓
比对：将未知模型的切分和指纹库比对
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>文本集覆盖容易产生差异的输入：多语言混合、生僻 Unicode、代码片段、长数字串、特定中文组合</p> <h3 id="训练原理"><a href="#训练原理" class="header-anchor">#</a> 训练原理</h3> <p>在训练大模型时使用 activation checkpointing（激活检查点）主要是为了？激活检查点牺牲计算速度，只保存部分激活值，反向时重算其余激活，以此降低显存占用峰值</p> <ul><li>A、减少模型参数数量</li> <li>B、自动提高数值精度</li> <li>C、降低显存峰值</li> <li>D、尽可能保存中间激活以加速反向传播</li></ul> <p>为什么在深度学习优化中常用 L2 正则化来提升稳定性？L2 正则惩罚大权重，抑制过拟合，让模型不会因输入微小变化产生剧烈输出波动</p> <ul><li>A、它能限制权重大小，降低模型对输入微小扰动的敏感度</li> <li>B、它能保证全局最优解</li> <li>C、它可以消除所有零特征值</li> <li>D、它可以缩短训练时间</li></ul> <p>当使用交叉损失函数时，若真实标签为 one-hot 编码 <code>[0,1,0]</code>，模型输出概率为 <code>[0.1,0.8,0.1]</code>，其损失值为多少？交叉熵仅计算真实类别对应的预测概率损失，这里真实类别对应概率 0.8，损失为 <code>-log(0.8)</code></p> <ul><li>A、<code>log(0.8)</code></li> <li>B、<code>-log(0.8)</code></li> <li>C、<code>-(log(0.1)+log(0.8)+log(0.1))</code></li> <li>D、<code>0.8</code></li></ul> <p>在进行 PCA 之前，为什么通常建议先对特征做标准化处理？PCA 依靠方差筛选主成分，不同单位、量级的特征会干扰方差权重，标准化消除量纲影响</p> <ul><li>A、因为标准化可以直接得到主成分</li> <li>B、因为PCA只能处理服从正态分布的数据</li> <li>C、因为标准化可以让不同量纲的特征在方差计算中更公平</li> <li>D、因为标准化后特征一定会线性无关</li></ul> <p>在复杂多模态预测任务（如 VQA）中，后融合（Late Fusion）是指？后融合先分开编码图像、文本等不同模态，到模型后端/输出决策阶段再融合信息</p> <ul><li>A、仅使用图像特征</li> <li>B、使用独立的编码器后，仅在决策层融合特征</li> <li>C、在输入层将图文拼接</li> <li>D、使用单一 Transformer 处理所有模态</li></ul> <p>在深度神经网络的典型结构中，隐藏层的主要作用是？隐藏层依靠权重、激活函数做多层非线性转换，提取原始数据里复杂高阶特征</p> <ul><li>A、负责显示模型的最终预测结果（如分类标签或回归数值）</li> <li>B、接收外部输入的原始数据，并将其直接传递给输出层</li> <li>C、通过多层次的非线性变换，从原始特征中自动提取和构造更高阶的特征表示</li> <li>D、存储训练过程中的损失函数值，以便计算梯度的方向</li></ul> <p>某电商的智能客服平台为了挖掘用户痛点，以便进行产品改进，通过分析大量未标注的用户问题，对用户常见问题进行自动分类，针对该任务下面说法正确的是？数据无人工标签，模型依靠样本相似度自动聚类分组，属于无监督学习</p> <ul><li>A、为了提升产品质量进行问题分析，属于强化学习</li> <li>B、对用户问题生成了分类，属于生成式学习</li> <li>C、对未标注的用户问题进行分类，属于无监督学习</li> <li>D、对已有的用户问题进行分类，属于监督学习</li></ul> <p>当用户评分数据存在明显的评分尺度差异时（如用户 A 评分范围为 1~5，用户 B 评分范围为 3~5），更适合使用？皮尔逊只关注评分变化趋势，能抵消不同用户打分区间、尺度带来的偏差</p> <ul><li>A、汉明距离</li> <li>B、欧几里得距离</li> <li>C、皮尔逊相关系数</li> <li>D、曼哈顿距离</li></ul> <p>在 VLLM 中，PagedAttention 使用固定大小的 Block 来管理 KV Cache，如果将 Block Size 设为 1，会产生什么主要问题？每个 token 单独占用一个块，映射表规模暴增，内存访问碎片化，推理性能大幅下降</p> <ul><li>A、模型无法加载</li> <li>B、显存利用率达到 100%</li> <li>C、计算吞吐量大幅提升</li> <li>D、Mapping Table 元数据开销过大且访问不连续</li></ul> <p>在评估预训练数据质量时，困惑度（Perplexity）常被用作指标，对一份高质量、符合目标分布的文本，模型对其计算的困惑度通常表现为？困惑度越低，模型对文本样本的预测概率越高，代表文本分布贴合模型训练目标</p> <ul><li>A、困惑度越高，表示数据越符合模型分布</li> <li>B、困惑度仅用于评估生成多样性</li> <li>C、困惑度越低，表示模型对数据的预测越准确</li> <li>D、困惑度与数据质量无关</li></ul> <p>某模型推理时，KV Cache 采用&quot;滑动窗口&quot;机制（窗口大小为 20），Prefill 阶段处理 30 个 token 的 prompt，Decode 阶段已生成 15 个 token，此时 KV Cache 中保留的 token 数量及自注意力计算的上下文长度分别为？滑动窗口机制仅留存最近 20 个 token，注意力计算仅使用窗口内 20 个 token</p> <ul><li>A、20个，20个</li> <li>B、15个，20个</li> <li>C、30+15=45个，45个</li> <li>D、20个，15个</li></ul> <p>关于奇异值分解（SVD，Singular Value Decomposition），下列哪项说法正确？标准 SVD 分解式 A=UΣV 转置，U、V 均为正交矩阵，任意矩阵都可做 SVD，奇异值恒非负</p> <ul><li>A、U 和 V 可以取为正交矩阵</li> <li>B、做 SVD 必须要求矩阵可逆</li> <li>C、只有方阵才能做 SVD</li> <li>D、奇异值可以为任意负数</li></ul> <p>关于余弦相似度（Cosine Similarity）与欧几里得距离（Euclidean Distance）的特性，以下说法最准确的是？余弦相似度只对比向量夹角，和向量模长无关；欧氏距离同时受向量方向、长度共同影响</p> <ul><li>A、余弦相似度仅反映向量的方向相对关系；欧几里得距离同时反映方向差异和绝对长度差异</li> <li>B、将两个向量单位化（归一化到单位长度）后，余弦相似度与欧几里得距离可以相互转换，结果等价</li> <li>C、两者都只反映向量的方向差异，与向量长度无关</li> <li>D、余弦相似度考虑向量的绝对长度，欧几里得距离不考虑</li></ul> <h2 id="模型训练"><a href="#模型训练" class="header-anchor">#</a> 模型训练</h2> <p>大致的训练过程，现在的大模型训练已经不是一个非常技术化的活，愈加偏向于工程化</p> <ol><li>预训练（在海量语料上自监督学习） → Base Model</li> <li>持续预训练（喂垂直领域语料） → 领域基座</li> <li>监督微调 / 指令微调（SFT） → SFT Model</li> <li>RLHF 对齐（训练 RM → PPO/DPO 优化） → 对齐模型</li> <li>下游任务微调 / PEFT（接入具体业务数据/使用 LoRA） → 业务模型</li> <li>蒸馏 + 量化（追求推理速度和体积） → 部署模型</li></ol> <h3 id="预训练"><a href="#预训练" class="header-anchor">#</a> 预训练</h3> <p>预训练模型（Base Model）只会“续写”文本，但不会“回答问题”，不知道正确与否</p> <h3 id="模型微调"><a href="#模型微调" class="header-anchor">#</a> 模型微调</h3> <p>SFT（ Supervised Fine-Tuning）监督微调，SFT 用海量的“问题-答案”对（Prompt-Response）喂给主模型，告知其怎么回答是对的，通常所说的微调（Fine-Tuning）指的就是这一阶段</p> <h3 id="rlhf"><a href="#rlhf" class="header-anchor">#</a> RLHF</h3> <blockquote><p>Reinforcement Learning from Human Feedback</p></blockquote> <p>通过人类偏好反馈训练 AI 模型，校正预训练模型与真实用户需求的偏差，RLHF 三阶段各自解决什么问题？</p> <ul><li>RM（Reward Model）奖励模型，专门训练一个小模型，专门对主模型的回答进行量化评分</li> <li>PPO（Proximal Policy Optimization）近端策略优化，主模型每生成一句话，RM 就打个分，而 PPO 负责把主模型的参数往“高分方向”微调</li></ul> <p>RLHF 是传统对齐方案，当前工业界正在向 DPO 等简化方案迁移：大致思路是把 RM 和 PPO 合并，直接用人类偏好的数据，通过数学推导，把“打分”的逻辑写进损失函数里，在训练时一步到位对齐</p> <h3 id="蒸馏和量化"><a href="#蒸馏和量化" class="header-anchor">#</a> 蒸馏和量化</h3> <p>deepseek v4 pro 和 glm 5.3 都是后训练的成果</p> <h2 id="检索增强生成"><a href="#检索增强生成" class="header-anchor">#</a> 检索增强生成</h2> <p>Retrieval Augmented Generation</p></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/040068/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">团队开发</div></a> <a href="/pages/ede82a/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Sockets 编程</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
