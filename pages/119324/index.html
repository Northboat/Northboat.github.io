a href="#rlhf" class="header-anchor">#</a> RLHF</h3> <blockquote><p>Reinforcement Learning from Human Feedback</p></blockquote> <p>通过人类偏好反馈训练 AI 模型，校正预训练模型与真实用户需求的偏差 → 无法通过直接问模型 “你是什么模型” 得到想要的回答</p> <ol><li>训练数据：“是什么模型” 这一事实并不决定模型的输出，这取决于训练过程中语料比重，最终的输出也只是一个概率事件</li> <li>系统提示词：在 RLHF 过程，很多厂商会加入“你叫什么”、“你是谁开发的”这类问答，导致最后模型的输出和原始的训练概率也不相同</li></ol> <p>如何识别一个匿名大模型？ → 模型指纹</p> <ol><li>Tokenizer 词表：BPE 分词器的词表由训练语料统计生成，同一型号的模型共享几乎相同的词表，给模型一段特定文本，看它能切出多少 Token 以及切分的方式，基本可以锁定</li> <li>logprob（Logarithmic Probability 对数概率）：给定同样的 prompt，不同模型输出的 token 概率分布差异很大。采集几百条 prompt 的 top-5 logprob 统计对比，可以缩小范围</li> <li>特殊 Token：不同模型的控制 Token，例如思考过程中的 <code>&lt;think&gt;, &lt;|im_start|&gt;, &lt;|endoftext|&gt;</code> 不相同</li> <li>知识截止：问模型最近发生的事件，结合公开的训练节点推断</li> <li>风格：比较玄学了，例如 GPT 喜欢列任务，DeepSeek 废话少</li></ol> <p>BPE（Byte Pair Encoding，字节对编码）分词器是目前最主流的大语言模型（LLM）分词算法之一</p> <p>如何设计有效的 Tokenizer 探针？</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>构造文本集：构造探针文本
	↓
采集指纹：调用 Tokenizer 切分文本
	↓
建指纹库：将文本递给已知模型切分
