Workflow、RAG</p> <ul><li>现在来看（2026.4），渐进式披露的 Skill 取代了大多数的 Prompt、MCP 和 RAG</li></ul> <p>Agent 的核心实现来自于 Agent Loop，这是一个让 LLM 自我思考自我迭代执行的过程</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">loop</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">for</span> <span class="token operator">!</span>task<span class="token punctuation">.</span><span class="token function">done</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        llm<span class="token punctuation">.</span><span class="token function">think</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        llm<span class="token punctuation">.</span><span class="token function">act</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        llm<span class="token punctuation">.</span><span class="token function">reflexion</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里存在一些不可忽视的问题，假设我有一个很强大的 AI，他回答的准确率高达 98%，然后有一个较为复杂的任务，在比较乐观的情况下，我在 20 轮循环后完成了这项任务，那么准确率会是</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="15.112ex" height="2.05ex" role="img" focusable="false" viewBox="0 -883.9 6679.7 905.9" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.05ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mn"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" style="stroke-width:3;"></path><path data-c="2E" d="M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z" transform="translate(500,0)" style="stroke-width:3;"></path><path data-c="39" d="M352 287Q304 211 232 211Q154 211 104 270T44 396Q42 412 42 436V444Q42 537 111 606Q171 666 243 666Q245 666 249 666T257 665H261Q273 665 286 663T323 651T370 619T413 560Q456 472 456 334Q456 194 396 97Q361 41 312 10T208 -22Q147 -22 108 7T68 93T121 149Q143 149 158 135T173 96Q173 78 164 65T148 49T135 44L131 43Q131 41 138 37T164 27T206 22H212Q272 22 313 86Q352 142 352 280V287ZM244 248Q292 248 321 297T351 430Q351 508 343 542Q341 552 337 562T323 588T293 615T246 625Q208 625 181 598Q160 576 154 546T147 441Q147 358 152 329T172 282Q197 248 244 248Z" transform="translate(778,0)" style="stroke-width:3;"></path><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 8T205 248Q207 248 213 248T223 249Q262 249 296 234T393 179L443 147Q502 112 553 112Q609 112 649 141T694 220Q694 249 708 249T722 217Q722 153 675 104T555 55Q514 55 468 76T388 123T308 170T224 192Q164 192 125 159T83 84Q80 55 69 55Q55 55 55 85Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(3901.7,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" style="stroke-width:3;"></path><path data-c="2E" d="M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z" transform="translate(500,0)" style="stroke-width:3;"></path><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(778,0)" style="stroke-width:3;"></path><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(1278,0)" style="stroke-width:3;"></path><path data-c="37" d="M55 458Q56 460 72 567L88 674Q88 676 108 676H128V672Q128 662 143 655T195 646T364 644H485V605L417 512Q408 500 387 472T360 435T339 403T319 367T305 330T292 284T284 230T278 162T275 80Q275 66 275 52T274 28V19Q270 2 255 -10T221 -22Q210 -22 200 -19T179 0T168 40Q168 198 265 368Q285 400 349 489L395 552H302Q128 552 119 546Q113 543 108 522T98 479L95 458V455H55V458Z" transform="translate(1778,0)" style="stroke-width:3;"></path><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(2278,0)" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msup><mn>0.98</mn><mrow data-mjx-texclass="ORD"><mn>20</mn></mrow></msup><mo>≈</mo><mn>0.6676</mn></math></mjx-assistive-mml></mjx-container><p>当然这里不能这么简单的指数运算，毕竟他可以有自我纠错机制，但不能否认的是，随着上下文不断增加，大模型注意力涣散，回答的准确率一定会降低，有两种比较明显的解决方案</p> <ol><li>缓解多轮 Loop 中的准确率降低：例如对中间分析过程进行缓存、加入纠正总结、精简每轮信息减少上下文等等</li> <li>尽可能降低任务的复杂度：例如让 agent 在 5 轮循环内解决问题，在前置或后置的辅助环节增加工作量</li></ol> <p>说白了，提高准确度的核心思想就是减少大模型的上下文长度，相较而言，第二种是更为简单的思路，在现阶段仍然将 AI 仅仅当作一个功能有限的工具使用，而不是当作一个能够独立解决问题的个体</p> <ul><li>当然，如果 LLM 单轮的准确率能达到 99.9%，那另说</li></ul> <p>如果要使用第二种方式实现一个真正可用的智能体，随之还会引发一个问题，那就是</p> <blockquote><p>让 Agent 来处理“简化的任务”，那么，这个简化的任务，是否真的需要 AI 来处理呢，我是指，如果任务够简单，这个所谓的 Agent 是否只是一层语言 UI，让本来的填表单变成了与 AI 对话，如果 AI 的输出结果还需要人力来校验，那我会觉得还不如填表单</p> <p>另外，很多 Agent 编码过程中的一些硬编码行为，真的能算是“智能”吗？是否是另一个形式的<code>if-else</code>语句，需要打个问号</p></blockquote> <p>综上所述，现阶段的 Agent，最好还是充当工具使用，在特定领域发光发亮，避免成为 LUI（Language UI），务实的降本增效</p> <p>例如，作为代码审计的智能体，利用现成的扫描工具加上 LLM 的算例，完全可以判断调用链中参数传递的影响，做深层的筛查，大致流程如下</p> <ol><li>扫描器扫描漏洞，输出危险点，这基本上是全覆盖的，只多不少</li> <li>Agent 依次读入危险点，进行 Agent Loop，分析调用链参数传递、绕过保护机制、输出报告</li> <li>审计工程师根据报告优先级进行人工审查</li></ol> <p>另外，上下文长度和混合注意力成为 Agent 的实现关键，现在的很多新模型用混合架构和更长的上下文来适配 Agent 的落地，如 Qwen next</p> <h3 id="agent-发展方向与框架"><a href="#agent-发展方向与框架" class="header-anchor">#</a> Agent 发展方向与框架</h3> <p>AI 时代的应用就是智能体，这在 25 下半年已经下了定论，Robin 认为与度子相关的四类智能体发展方向</p> <ul><li>搜索智能体：百看和文心助手，代替传统的 1 个 query + 10 个蓝色链接模式</li> <li>代码智能体：Cursor（Anysphere）、Claude Code（Anthropic）、Trae（字节）、Copilot（GitHub）、Comate（百度）、Lingma（阿里）</li> <li>数字人智能体：Robin 的开工红包</li> <li>演化智能体（模型推演）：伐谋、Mirofish</li></ul> <p>常见的 Agent 开发框架</p> <ul><li>langchain4j：自定义程度较于 Spring AI 更高</li> <li>EINO：字节的 Golang Agent 开发框架，Gin + Gorm + EINO 的技术栈</li> <li>Dify / n8n：低代码的智能体编排框架，自定义程度很低，在现阶段很难结合具体业务场景发挥现实作用</li></ul> <p>为什么开发污点分析的智能体使用 Spring AI，为什么语言服务器使用 Eclipse 而不是 VSCode？</p> <ol><li>因为是接口开发，Spring AI 与 Spring Boot 的集成更为平滑，能够快速开发展示效果；但在最终的插件版本中，显然 langchain4j 更适合插件开发，自定义化程度更高</li> <li>另外存在 Java 适配问题，Eclipse 对于 Java 的兼容更加友好，文档更全，而 VSCode 的语言服务器交互更多还是以 TypeScript 形式</li></ol> <h2 id="spring-ai-基础"><a href="#spring-ai-基础" class="header-anchor">#</a> Spring AI 基础</h2> <h3 id="chat-client"><a href="#chat-client" class="header-anchor">#</a> Chat Client</h3> <p>Spring AI 引入 Model 并管理对话，构造器注入 ChatClient，通过建造者模式 Builder 构建</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 方式1：使用构造器注入</span>
<span class="token annotation punctuation">@Service</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ChatService</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">ChatClient</span> chatClient<span class="token punctuation">;</span>
    
    <span class="token keyword">public</span> <span class="token class-name">ChatService</span><span class="token punctuation">(</span><span class="token class-name">ChatClient<span class="token punctuation">.</span>Builder</span> builder<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>chatClient <span class="token operator">=</span> builder
            <span class="token punctuation">.</span><span class="token function">defaultSystem</span><span class="token punctuation">(</span><span class="token string">&quot;你是恋爱顾问&quot;</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>基础对话</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">ChatResponse</span> response <span class="token operator">=</span> chatClient<span class="token punctuation">.</span><span class="token function">prompt</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">user</span><span class="token punctuation">(</span><span class="token string">&quot;你好&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">call</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> content <span class="token operator">=</span> response<span class="token punctuation">.</span><span class="token function">content</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>流式输出接口<code>Flux&lt;String&gt;</code>，基于 SSE（Server-Sent Events）</p> <p>服务端到浏览器的单向推送，“流”实际上就是一个下载的过程，类似于视频流，只不过这里是文字流</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">Flux</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> <span class="token function">streamChat</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 返回 Flux&lt;String&gt;，前端会持续收到事件</span>
    <span class="token keyword">return</span> chatClient<span class="token punctuation">.</span><span class="token function">stream</span><span class="token punctuation">(</span>request<span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">map</span><span class="token punctuation">(</span>response <span class="token operator">-&gt;</span> <span class="token punctuation">{</span>
            <span class="token class-name">String</span> content <span class="token operator">=</span> response<span class="token punctuation">.</span><span class="token function">getResult</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getContent</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">return</span> content <span class="token operator">!=</span> <span class="token keyword">null</span> <span class="token operator">?</span> content <span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">doOnComplete</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">-&gt;</span> <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;flux done&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>前端 js 接收</p> <div class="language-js extra-class"><pre class="language-js"><code><span class="token keyword">function</span> <span class="token function">startChat</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">const</span> prompt <span class="token operator">=</span> document<span class="token punctuation">.</span><span class="token function">getElementById</span><span class="token punctuation">(</span><span class="token string">&quot;prompt&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>value<span class="token punctuation">.</span><span class="token function">trim</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>prompt<span class="token punctuation">)</span> <span class="token keyword">return</span><span class="token punctuation">;</span>

    <span class="token keyword">const</span> chatBox <span class="token operator">=</span> document<span class="token punctuation">.</span><span class="token function">getElementById</span><span class="token punctuation">(</span><span class="token string">&quot;chat-box&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    chatBox<span class="token punctuation">.</span>innerHTML <span class="token operator">+=</span> <span class="token template-string"><span class="token template-punctuation string">`</span><span class="token string">\n🧑‍💻 You: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>prompt<span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">\n🤖 AI: </span><span class="token template-punctuation string">`</span></span><span class="token punctuation">;</span>

    <span class="token comment">// 关闭上一次 SSE（如果存在）</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span>window<span class="token punctuation">.</span>eventSource<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        window<span class="token punctuation">.</span>eventSource<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// SSE 流式接收</span>
    window<span class="token punctuation">.</span>eventSource <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">EventSource</span><span class="token punctuation">(</span><span class="token template-string"><span class="token template-punctuation string">`</span><span class="token string">/api/chat/stream?prompt=</span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span><span class="token function">encodeURIComponent</span><span class="token punctuation">(</span>prompt<span class="token punctuation">)</span><span class="token interpolation-punctuation punctuation">}</span></span><span class="token template-punctuation string">`</span></span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    window<span class="token punctuation">.</span>eventSource<span class="token punctuation">.</span><span class="token function-variable function">onmessage</span> <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token parameter">event</span><span class="token punctuation">)</span> <span class="token operator">=&gt;</span> <span class="token punctuation">{</span>
        chatBox<span class="token punctuation">.</span>innerHTML <span class="token operator">+=</span> event<span class="token punctuation">.</span>data<span class="token punctuation">;</span>
        chatBox<span class="token punctuation">.</span>scrollTop <span class="token operator">=</span> chatBox<span class="token punctuation">.</span>scrollHeight<span class="token punctuation">;</span>
    <span class="token punctuation">}</span><span class="token punctuation">;</span>

    window<span class="token punctuation">.</span>eventSource<span class="token punctuation">.</span><span class="token function-variable function">onerror</span> <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">=&gt;</span> <span class="token punctuation">{</span>
        chatBox<span class="token punctuation">.</span>innerHTML <span class="token operator">+=</span> <span class="token string">&quot;\n[连接已结束]\n&quot;</span><span class="token punctuation">;</span>
        window<span class="token punctuation">.</span>eventSource<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="advisor"><a href="#advisor" class="header-anchor">#</a> Advisor</h3> <p>参谋 → 拦截器，类似于 AOP 的作用，在对话前后触发，作用原理如下</p> <img src="/assets/img/image-20251009194703543.820f958b.png"> <p>LoggerAdvisor：日志记录</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">/**
 * 自定义日志 Advisor
 * 打印 info 级别日志、只输出单次用户提示词和 AI 回复的文本
 */</span>
<span class="token annotation punctuation">@Slf4j</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LoggerAdvisor</span> <span class="token keyword">implements</span> <span class="token class-name">CallAroundAdvisor</span><span class="token punctuation">,</span> <span class="token class-name">StreamAroundAdvisor</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getSimpleName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">getOrder</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">private</span> <span class="token class-name">AdvisedRequest</span> <span class="token function">before</span><span class="token punctuation">(</span><span class="token class-name">AdvisedRequest</span> request<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;AI Request: {}&quot;</span><span class="token punctuation">,</span> request<span class="token punctuation">.</span><span class="token function">userText</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> request<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">private</span> <span class="token keyword">void</span> <span class="token function">observeAfter</span><span class="token punctuation">(</span><span class="token class-name">AdvisedResponse</span> advisedResponse<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;AI Response: {}&quot;</span><span class="token punctuation">,</span> advisedResponse<span class="token punctuation">.</span><span class="token function">response</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getResult</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getText</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">AdvisedResponse</span> <span class="token function">aroundCall</span><span class="token punctuation">(</span><span class="token class-name">AdvisedRequest</span> advisedRequest<span class="token punctuation">,</span> <span class="token class-name">CallAroundAdvisorChain</span> chain<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        advisedRequest <span class="token operator">=</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">before</span><span class="token punctuation">(</span>advisedRequest<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">AdvisedResponse</span> advisedResponse <span class="token operator">=</span> chain<span class="token punctuation">.</span><span class="token function">nextAroundCall</span><span class="token punctuation">(</span>advisedRequest<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">observeAfter</span><span class="token punctuation">(</span>advisedResponse<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> advisedResponse<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">Flux</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">AdvisedResponse</span><span class="token punctuation">&gt;</span></span> <span class="token function">aroundStream</span><span class="token punctuation">(</span><span class="token class-name">AdvisedRequest</span> advisedRequest<span class="token punctuation">,</span> <span class="token class-name">StreamAroundAdvisorChain</span> chain<span class="token punctuation">)</span> <span class="token punctuation">{</span>

</code></pre></div><h3 id="chat-memory"><a href="#chat-memory" class="header-anchor">#</a> Chat Memory</h3> <p>对话记录管理</p> <h4 id="chatmemoryadvisor"><a href="#chatmemoryadvisor" class="header-anchor">#</a> ChatMemoryAdvisor</h4> <p>通过<code>MessageWindowChatMemory</code>创建<code>MessageChatMemoryAdvisor</code>，在对话中加入<code>advisor</code>并传入会话<code>ID(String)</code>，实现自动化的会话管理</p> <p>其底层实现是一个<code>ConcurrentHashMap&lt;String, List&lt;Message&gt;&gt;</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">ChatMemory</span> chatMemory <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">InMemoryChatMemory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
