cX29KzAgIGcEkINyW5BF9x891hw6VYqgJHEk0huccS7vh3C6gTiODL+26huuBtbct8eZnqLML8PkxGYpuPZBqtqwkSjgc4mB5gbgig5i+y0UDK35LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">污点分析智能体开发 - Spring AI<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="ai-开发概述"><a href="#ai-开发概述" class="header-anchor">#</a> AI 开发概述</h2> <h3 id="智能体概述"><a href="#智能体概述" class="header-anchor">#</a> 智能体概述</h3> <p>自从 Manus 打了个头，现在市面上的智能体层出不穷，他们通常用少许的 Tools，<strong>大量精细的 Prompt 提示、优秀的 Agent 工作流设计以及自建的 RAG 知识库</strong>以实现精准的业务需求，当然，最后的效果也很大程度上取决于大模型本身的质量</p> <p>现在炒得很火，也似乎取得了很不错的效果，但这里存在一些不可忽视的问题，假设这样一个场景，我有一个很强大的 AI，他回答的准确率高达 98%（绝大多数根本达不到这个水平，能达到 90% 就得烧高香了），然后有一个较为复杂的任务，例如我要审查整个项目的隐藏漏洞，在比较乐观的情况下，我在 20 轮 Loop 后完成了这项任务，那么准确率是多少呢</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="15.112ex" height="2.05ex" role="img" focusable="false" viewBox="0 -883.9 6679.7 905.9" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.05ex;"><g stroke="currentColor" fill= 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" style="stroke-width:3;"></path><path data-c="2E" d="M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z" transform="translate(500,0)" style="stroke-width:3;"></path><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(778,0)" style="stroke-width:3;"></path><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(1278,0)" style="stroke-width:3;"></path><path data-c="37" d="M55 458Q56 460 72 567L88 674Q88 676 108 676H128V672Q128 662 143 655T195 646T364 644H485V605L417 512Q408 500 387 472T360 435T339 403T319 367T305 330T292 284T284 230T278 162T275 80Q275 66 275 52T274 28V19Q270 2 255 -10T221 -22Q210 -22 200 -19T179 0T168 40Q168 198 265 368Q285 400 349 489L395 552H302Q128 552 119 546Q113 543 108 522T98 479L95 458V455H55V458Z" transform="translate(1778,0)" style="stroke-width:3;"></path><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(2278,0)" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msup><mn>0.98</mn><mrow data-mjx-texclass="ORD"><mn>20</mn></mrow></msup><mo>≈</mo><mn>0.6676</mn></math></mjx-assistive-mml></mjx-container><p>这是非常乐观的情况，Agent 勉强能够越过及格线，这是无法逾越的数学概率问题</p> <p>在单轮准确率不变的情况下，只有两种办法来尽可能提高准确率</p> <ul><li>缓解多轮 Loop 中的准确率降低：例如对中间分析过程进行缓存、加入纠正总结、精简每轮信息减少上下文等等</li> <li>尽可能降低任务的复杂度：例如让 agent 在 5 轮循环内解决问题，在前置或后置的辅助环节增加工作量</li></ul> <p>说白了，核心思想就是得减少大模型的上下文长度，这是分析结果是否准确的关键</p> <p>相较而言，第二种是更为简单的思路，在现阶段仍然是将 AI 仅仅当作一个功能有限的工具使用，而不是当作一个能够独立解决问题的个体</p> <p>或许有一天单轮问答的准确率能达到 99.9%，才能真正作为一个“个体”来代替人类工作，但至少在目前来看， 99.9% 准确率的 AI 成本远大于人力</p> <p>如果要使用第二种方式实现一个真正可用的智能体，随之还会引发一个问题，那就是</p> <blockquote><p>让 Agent 来处理“简化的任务”，那么，这个简化的任务，是否真的需要 AI 来处理呢，我是指，如果任务够简单，这个所谓的 Agent 是否只是一层语言 UI，让本来的填表单变成了与 AI 对话，如果 AI 的输出结果还需要人力来校验，那我会觉得还不如填表单</p> <p>另外，很多 Agent 编码过程中的一些硬编码行为，真的能算是“智能”吗？是否是另一个形式的<code>if-else</code>语句，我对此表示怀疑</p></blockquote> <p>综上所述，我认为现阶段的 Agent，首先，只能充当工具使用，其次，必须应用在特定领域才能避免成为 LUI，做到真正的降本增效</p> <p>而代码审计这一领域可谓是大有可为，用一些现成的审计工具加上 Agent 的思考，完全可以判断调用链中参数传递的影响，做更深一层的筛查，工作流程如下</p> <ol><li>扫描器扫描漏洞，输出危险点，这基本上是全覆盖的，只多不少</li> <li>Agent 依次读入危险点，进行调用链分析，考虑上层入参是否会触发危险点，并输出报告</li> <li>审计工程师根据报告优先级进行人工审查</li></ol> <p>这在赶进度交漏洞的时候显得尤为重要，AI 审查能够为审计工作提供实际有效的帮助</p> <p>另外，上下文长度和混合注意力成为 Agent 的实现关键，阿里很懂这点（Qwen next），从模型本身上，用混合专家模型 MoE 架构和增长的上下文来适配高难度任务需求以激发 Agent 潜力</p> <h3 id="实际的-agent"><a href="#实际的-agent" class="header-anchor">#</a> 实际的 Agent</h3> <p>智能体应用</p> <ul><li><code>Cline</code>：用于编程辅助的的 VSCode 插件，其实现了简单的“读文件”工具，加之精细的 Prompt 设计，使之成为一个可用的“工具”</li> <li><code>Cursor</code>：AI 版 VS Code</li> <li><code>Zread.ai</code>：AI 阅读器，解析 GitHub 仓库</li> <li><code>Copilot</code>：GitHub 强推的编程辅助 Agent</li></ul> <p>辅助编程</p> <ul><li><a href="https://bolt.new" target="_blank" rel="nofollow noopener noreferrer">Bolt<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>Cursor</li> <li>Jules（Google）</li> <li>Claude</li> <li>Trae（豆包）</li> <li>Copilot（GitHub）</li> <li>Comate（文心）</li> <li>TONGYI Lingma（千问）</li> <li>Cline（VSCode 插件）</li></ul> <p>智能体实现：Cherry Studio + System Prompt</p> <p>当下比较火的 AI 开发框架</p> <ul><li>dify</li> <li>Langchain4j</li> <li>Spring AI</li></ul> <h2 id="spring-ai-基础"><a href="#spring-ai-基础" class="header-anchor">#</a> Spring AI 基础</h2> <p>AI 开发框架一般按照封装度分为低代码和高代码两类，例如 dify 就是一个零代码/低代码 LLM 应用构建平台，封装程度极高</p> <p>而相应 langchain4j 的封装度较低，仅提供基础的 LLM 集成功能，Spring AI 介于二者之间，但也是一个高代码框架</p> <h3 id="chat-client"><a href="#chat-client" class="header-anchor">#</a> Chat Client</h3> <p>Spring AI 引入 Model 并管理对话，构造器注入 ChatClient，通过建造者模式 Builder 构建</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 方式1：使用构造器注入</span>
<span class="token annotation punctuation">@Service</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ChatService</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">ChatClient</span> chatClient<span class="token punctuation">;</span>

</code></pre></div><p>流式输出接口<code>Flux&lt;String&gt;</code>，基于 SSE（Server-Sent Events）</p> <p>服务端到浏览器的单向推送，“流”实际上就是一个下载的过程，类似于视频流，只不过这里是文字流</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">Flux</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> <span class="token function">streamChat</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

<span class="token punctuation">}</span>
</code></pre></div><p>前端 js 接收</p> <div class="language-js extra-class"><pre class="language-js"><code><span class="token keyword">function</span> <span class="token function">startChat</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

    chatBox<span class="token punctuation">.</span>innerHTML <span class="token operator">+=</span> <span class="token template-string"><span class="token template-punctuation string">`</span><span class="token string">\n🧑‍💻 You: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>prompt<span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">\n🤖 AI: </span><span class="token template-punctuation string">`</span></span><span class="token punctuation">;</span>

    <span class="token comment">// 关闭上一次 SSE（如果存在）</span>

    <span class="token comment">// SSE 流式接收</span>

        chatBox<span class="token punctuation">.</span>innerHTML <span class="token operator">+=</span> event<span class="token punctuation">.</span>data<span class="token punctuation">;</span>

        chatBox<span class="token punctuation">.</span>innerHTML <span class="token operator">+=</span> <span class="token string">&quot;\n[连接已结束]\n&quot;</span><span class="token punctuation">;</span>

    <span class="token punctuation">}</span><span class="token punctuation">;</span>

</code></pre></div><h3 id="advisor"><a href="#advisor" class="header-anchor">#</a> Advisor</h3> <p>参谋 → 拦截器，类似于 AOP 的作用，在对话前后触发，作用原理如下</p> <img src="/assets/img/image-20251009194703543.820f958b.png"> <p>LoggerAdvisor：日志记录</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">/**

<span class="token keyword">var</span> chatClient <span class="token operator">=</span> <span class="token class-name">ChatClient</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span>chatModel<span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">defaultAdvisors</span><span class="token punctuation">(</span>
        <span class="token keyword">new</span> <span class="token class-name">MessageChatMemoryAdvisor</span><span class="token punctuation">(</span>chatMemory<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token comment">// 对话记忆 advisor</span>
    <span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><h4 id="自定义-memory"><a href="#自定义-memory" class="header-anchor">#</a> 自定义 Memory</h4> <p>手动维护一个</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Message</span><span class="token punctuation">&gt;</span></span> memory<span class="token punctuation">;</span>
</code></pre></div><p>在对话时传入自己构造的会话</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">Prompt</span> prompt <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Prompt</span><span class="token punctuation">(</span>memory<span class="token punctuation">,</span> chatOptions<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> response <span class="token operator">=</span> chatClient<span class="token punctuation">.</span><span class="token function">prompt</span><span class="token punctuation">(</span>prompt<span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">user</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token comment">// ...</span>
    <span class="token punctuation">.</span><span class="token function">content</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p><code>ChatOptions</code>是阿里提供的 api，可以在 prompt 构造中禁用工具调用，非常鸡肋，不如用 Prompt 结构化输出 Json，再手动处理</p> <h3 id="rag"><a href="#rag" class="header-anchor">#</a> RAG</h3> <blockquote><p>检索增强生成</p></blockquote> <p>这是一个很重要且实用的部分，会用到本地的分词嵌入模型</p> <ul><li>模型部署：vLLM、Ollama</li> <li>模型资源：ModelScope、HuggingFace</li></ul> <p>RAG 的实现包含这样 4 个核心步骤</p> <ol><li>文档收集和切割：将长文档分割为片段 chunks</li> <li>向量转换和存储：使用 Embedding 嵌入模型将文本转为向量并进行存储</li> <li>文档过滤和检索：将用户问题转化为向量表示，基于元数据、关键词或自定义规则进行过滤，在向量数据库中查找与问题向量相似度最高的文档，并进行上下文组装</li> <li>查询增强和关联：将检索到的相关文档与用户问题组合成增强提示词，大模型将根据增强的提示来生成回答</li></ol> <p>RAG → Graph RAG → Agentic RAG</p> <h4 id="etl-数据处理"><a href="#etl-数据处理" class="header-anchor">#</a> ETL 数据处理</h4> <p>ETL 即抽取、转换和加载，Spring AI 提供了对 ETL 的支持：<a href="https://docs.spring.io/spring-ai/reference/api/etl-pipeline.html#_markdown" target="_blank" rel="nofollow noopener noreferrer">ETL Pipeline :: Spring AI Reference<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>引入 MarkdownDocumentReader 来读取 md 文档</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.ai<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-ai-markdown-document-reader<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>1.0.0-M6<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>文件加载类：<code>rag/DocumentLoader.java</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token annotation punctuation">@Slf4j</span>
<span class="token keyword">class</span> <span class="token class-name">DocumentLoader</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">ResourcePatternResolver</span> resourcePatternResolver<span class="token punctuation">;</span>

    <span class="token class-name">DocumentLoader</span><span class="token punctuation">(</span><span class="token class-name">ResourcePatternResolver</span> resourcePatternResolver<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>resourcePatternResolver <span class="token operator">=</span> resourcePatternResolver<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> <span class="token function">loadMarkdowns</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> allDocuments <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token comment">// 这里可以修改为你要加载的多个 Markdown 文件的路径模式</span>
            <span class="token class-name">Resource</span><span class="token punctuation">[</span><span class="token punctuation">]</span> resources <span class="token operator">=</span> resourcePatternResolver<span class="token punctuation">.</span><span class="token function">getResources</span><span class="token punctuation">(</span><span class="token string">&quot;classpath:document/*.md&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">Resource</span> resource <span class="token operator">:</span> resources<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token class-name">String</span> fileName <span class="token operator">=</span> resource<span class="token punctuation">.</span><span class="token function">getFilename</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token class-name">MarkdownDocumentReaderConfig</span> config <span class="token operator">=</span> <span class="token class-name">MarkdownDocumentReaderConfig</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                        <span class="token punctuation">.</span><span class="token function">withHorizontalRuleCreateDocument</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
                        <span class="token punctuation">.</span><span class="token function">withIncludeCodeBlock</span><span class="token punctuation">(</span><span class="token boolean">false</span><span class="token punctuation">)</span>
                        <span class="token punctuation">.</span><span class="token function">withIncludeBlockquote</span><span class="token punctuation">(</span><span class="token boolean">false</span><span class="token punctuation">)</span>
                        <span class="token punctuation">.</span><span class="token function">withAdditionalMetadata</span><span class="token punctuation">(</span><span class="token string">&quot;filename&quot;</span><span class="token punctuation">,</span> fileName<span class="token punctuation">)</span>
                        <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token class-name">MarkdownDocumentReader</span> reader <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">MarkdownDocumentReader</span><span class="token punctuation">(</span>resource<span class="token punctuation">,</span> config<span class="token punctuation">)</span><span class="token punctuation">;</span>
                allDocuments<span class="token punctuation">.</span><span class="token function">addAll</span><span class="token punctuation">(</span>reader<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">IOException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Markdown 文档加载失败&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> allDocuments<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>上述代码中，我们通过<code>MarkdownDocumentReaderConfig</code>文档加载配置来指定读取文档的细节，比如是否读取代码块、引用块等。特别需要注意的是，我们还指定了额外的元信息配置，提取文档的文件名（fileName）作为文档的元信息，可以便于后续知识库实现更精确的检索</p> <h4 id="simplevectorstore"><a href="#simplevectorstore" class="header-anchor">#</a> SimpleVectorStore</h4> <blockquote><p>向量存储和转换</p></blockquote> <p>为了实现方便，我们先使用 Spring AI 内置的、基于内存读写的向量数据库<code>SimpleVectorStore</code>来保存文档，<code>SimpleVectorStore</code>实现了<code>VectorStore</code>接口，而<code>VectorStore</code>接口集成了<code>DocumentWriter</code>，所以具备文档写入能力</p> <p>简单了解下源码，在将文档写入到数据库前，会先调用<code>Embedding</code>大模型将文档转换为向量，实际保存到数据库中的是向量类型的数据</p> <p><code>rag/VectorStoreConfig.java</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">VectorStoreConfig</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Resource</span>
    <span class="token keyword">private</span> <span class="token class-name">DocumentLoader</span> documentLoader<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Resource</span>
    <span class="token keyword">private</span> <span class="token class-name">MyTokenTextSplitter</span> myTokenTextSplitter<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Resource</span>
    <span class="token keyword">private</span> <span class="token class-name">MyKeywordEnricher</span> myKeywordEnricher<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Bean</span>
    <span class="token class-name">VectorStore</span> <span class="token function">loveAppVectorStore</span><span class="token punctuation">(</span><span class="token class-name">EmbeddingModel</span> dashscopeEmbeddingModel<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">SimpleVectorStore</span> simpleVectorStore <span class="token operator">=</span> <span class="token class-name">SimpleVectorStore</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span>dashscopeEmbeddingModel<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 加载文档</span>
        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> documentList <span class="token operator">=</span> loveAppDocumentLoader<span class="token punctuation">.</span><span class="token function">loadMarkdowns</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 自主切分文档</span>
<span class="token comment">//        List&lt;Document&gt; splitDocuments = myTokenTextSplitter.splitCustomized(documentList);</span>
        <span class="token comment">// 自动补充关键词元信息</span>
        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> enrichedDocuments <span class="token operator">=</span> myKeywordEnricher<span class="token punctuation">.</span><span class="token function">enrichDocuments</span><span class="token punctuation">(</span>documentList<span class="token punctuation">)</span><span class="token punctuation">;</span>
        simpleVectorStore<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>enrichedDocuments<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> simpleVectorStore<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里用到一个文档元信息增强器和一个单词切分器</p> <p><code>rag/MyKeywordEnricher.java</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">MyKeywordEnricher</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Resource</span>
    <span class="token keyword">private</span> <span class="token class-name">ChatModel</span> dashscopeChatModel<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> <span class="token function">enrichDocuments</span><span class="token punctuation">(</span><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> documents<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">KeywordMetadataEnricher</span> keywordMetadataEnricher <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">KeywordMetadataEnricher</span><span class="token punctuation">(</span>dashscopeChatModel<span class="token punctuation">,</span> <span class="token number">5</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span>  keywordMetadataEnricher<span class="token punctuation">.</span><span class="token function">apply</span><span class="token punctuation">(</span>documents<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p><code>rag/MyTokenTextAplitter.java</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">/**
 * 自定义基于 Token 的切词器
 */</span>
<span class="token annotation punctuation">@Component</span>
<span class="token keyword">class</span> <span class="token class-name">MyTokenTextSplitter</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> <span class="token function">splitDocuments</span><span class="token punctuation">(</span><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> documents<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">TokenTextSplitter</span> splitter <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">TokenTextSplitter</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> splitter<span class="token punctuation">.</span><span class="token function">apply</span><span class="token punctuation">(</span>documents<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> <span class="token function">splitCustomized</span><span class="token punctuation">(</span><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Document</span><span class="token punctuation">&gt;</span></span> documents<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">TokenTextSplitter</span> splitter <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">TokenTextSplitter</span><span class="token punctuation">(</span><span class="token number">200</span><span class="token punctuation">,</span> <span class="token number">100</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">5000</span><span class="token punctuation">,</span> <span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> splitter<span class="token punctuation">.</span><span class="token function">apply</span><span class="token punctuation">(</span>documents<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>前者是后者的增强版</p> <p>检索增强：直接在构造 chatClient 时以 QuestionAnserAdvisor 注入 VectorStore</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Resource</span>
<span class="token keyword">private</span> <span class="token class-name">VectorStore</span> vectorStore<span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">doChatWithRag</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">String</span> chatId<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token class-name">ChatResponse</span> chatResponse <span class="token operator">=</span> chatClient
            <span class="token punctuation">.</span><span class="token function">prompt</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">user</span><span class="token punctuation">(</span>message<span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">advisors</span><span class="token punctuation">(</span>spec <span class="token operator">-&gt;</span> spec<span class="token punctuation">.</span><span class="token function">param</span><span class="token punctuation">(</span><span class="token constant">CHAT_MEMORY_CONVERSATION_ID_KEY</span><span class="token punctuation">,</span> chatId<span class="token punctuation">)</span>
                    <span class="token punctuation">.</span><span class="token function">param</span><span class="token punctuation">(</span><span class="token constant">CHAT_MEMORY_RETRIEVE_SIZE_KEY</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token comment">// 开启日志，便于观察效果</span>
            <span class="token punctuation">.</span><span class="token function">advisors</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">LoggerAdvisor</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token comment">// 应用知识库问答</span>
            <span class="token punctuation">.</span><span class="token function">advisors</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">QuestionAnswerAdvisor</span><span class="token punctuation">(</span>vectorStore<span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">call</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">chatResponse</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">String</span> content <span class="token operator">=</span> chatResponse<span class="token punctuation">.</span><span class="token function">getResult</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getText</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;content: {}&quot;</span><span class="token punctuation">,</span> content<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> content<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="prompt-engineering"><a href="#prompt-engineering" class="header-anchor">#</a> Prompt Engineering</h2> <p>提示词工程，核心出装</p> <ul><li>Zero/Few Shot：零/少样本学习</li> <li>CoT：Chain of Thinking 思考链</li></ul> <p>如何检验 Prompt 质量？多次输入相同 Prompt，LLM 返回若输出一致，说明质量还不错，反之则说明 LLM 并不确定用户需求，需要反复输入</p> <ul><li>Claude Code 内置的 15 个工具和对应的 Prompt 是很好的学习资料</li></ul> <p>可以调低 LLM 的温度使之回答稳定</p> <h3 id="系统提示词"><a href="#系统提示词" class="header-anchor">#</a> 系统提示词</h3> <p>用以限定智能体的角色、技能、性格、约束等</p> <p>通用污点分析智能体的 SystemPrompt 示例</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code><span class="token title important"><span class="token punctuation">#</span> Role: Call Chain Security Analyst</span>

<span class="token title important"><span class="token punctuation">##</span> Profile</span>
<span class="token list punctuation">-</span> language: English
<span class="token list punctuation">-</span> description: A specialized AI expert in analyzing function call chains to identify potenial security vulnerabilities by examining taint propagation, execution sequences, defense mechanisms, and handling incorrect chains due to interface implementations. Focuses on ensuring accurate determination of danger points through meticulous parameter flow analysis.
<span class="token list punctuation">-</span> background: Rooted in code security and vulnerability assessment, with extensive experience in interpreting complex call chains and mitigating risks in software systems.
<span class="token list punctuation">-</span> personality: Critical, vigilant, detail-oriented, self-reflective and methodical.
<span class="token list punctuation">-</span> expertise: Code security analysis, vulnerability detection, call chain interpretation, taint tracking, and defense function evaluation.
<span class="token list punctuation">-</span> target_audience: Software developers, security analysts, penetration testers and code reviewers.

<span class="token title important"><span class="token punctuation">##</span> Skills</span>

<span class="token list punctuation">1.</span> Core Analysis Skills
<span class="token list punctuation">-</span> Taint Propagation Analysis: Traces user inputs through functions to determine if they reach and are used at danger points.
<span class="token list punctuation">-</span> Execution Order Assessment: Evaluates the sequence of function calls to identify only relevant paths before danger points.
<span class="token list punctuation">-</span> Defense Function Evaluation: Inspects functions that may sanitize or neutralize inputs before they propagate to vulnerabilities.
<span class="token list punctuation">-</span> Incorrect Chain Detection: Identifies and handles call chains with errors from interface inheritance or implementation issues.

<span class="token list punctuation">2.</span> Auxiliary Skills
<span class="token list punctuation">-</span> Tool Utilization: Employs functions like <span class="token code-snippet code keyword">`read`</span> or <span class="token code-snippet code keyword">`getFunctionBody`</span> to gather additional code details when needed.
<span class="token list punctuation">-</span> JSON Response Formatting: Outputs analysis results in a structured JSON format as specified.
<span class="token list punctuation">-</span> Critical Self-Review: Continuously critiques own reasoning to avoid oversights and ensure accuracy.
<span class="token list punctuation">-</span> Paramter Flow Documentation: Maps and describes how parameters move through the call chain for clarity.

<span class="token title important"><span class="token punctuation">##</span> Rules</span>
<span class="token list punctuation">1.</span> Fundamental Principles:
<span class="token list punctuation">-</span> Always assess the current state and determine the next required action based on the call chain analysis.
<span class="token list punctuation">-</span> Engage in continuous self-criticism, reminders, and alerts to maintain high accuracy and void errors.
<span class="token list punctuation">-</span> Response strictly in the specified JSON format without deviations.
<span class="token list punctuation">-</span> If the analysis goal is achieved, set the nextAction to &quot;goal achieved&quot; immediately.
<span class="token list punctuation">-</span> Constanly reference and adhere to the Attention section content during analysis.

<span class="token list punctuation">2.</span> Behavioral Guidelines:
<span class="token list punctuation">-</span> Only mark a call chain as Dangerous if there is 100 percent cerainty that user inputs propagate to and are used at the danger point.
<span class="token list punctuation">-</span> Focus analysis exclusively on functions executed before the danger point, ignoring any subsequent executions.
<span class="token list punctuation">-</span> Thoroughly evaluate defense functions to confirm if inputs are sanitized or reassigned to harmless states before reaching danger points.
<span class="token list punctuation">-</span> Immediately terminate analysis and mark as WrongChain upon detecting errors from interface implementation mismatches.

<span class="token list punctuation">3.</span> Limitations:
<span class="token list punctuation">-</span> Do not proceed with analysis for chains identified as WrongChain; terminate the task and mark accordingly.
<span class="token list punctuation">-</span> Utilize available tools to read function bodies or definitions when insufficient information is present.
<span class="token list punctuation">-</span> Consider a chain Safe if any function in the path does not propagate taints to the danger point or if inputs are not used.

<span class="token title important"><span class="token punctuation">##</span> Workflows</span>
<span class="token list punctuation">-</span> Goal: Determine whether the function call chain can trigger a security vulnerability by analyzing parameter flows and execution order.
<span class="token list punctuation">-</span> Step 1: Review the provided call chain, current iteration goal, previous observations, and reference chain to understand the context.
<span class="token list punctuation">-</span> Step 2: Analyze taint propagation from user inputs through each function, checking if parameters are passed and used at the danger point.
<span class="token list punctuation">-</span> Step 3: Assess execution order to ensure only functions before the danger point are considered, ignoring any post-danger executions.
<span class="token list punctuation">-</span> Step 4: Use tools like <span class="token code-snippet code keyword">`read`</span> to inspect function bodies if needed to verify parameter usage or defense mechanisms.
<span class="token list punctuation">-</span> Expected Result: Produce a JSON response with reasoning, plan, criticism, nextAction, dangerous status(NotSure, Dangerous, Safe, or WrongChain) and flows description.

<span class="token title important"><span class="token punctuation">##</span> Initialization</span>
As a Call Chain Security Analyst, you must adhere to the above Rules and folllow the Workflows to execute tasks. And your current goal is:
%s
</code></pre></div><h3 id="用户提示词"><a href="#用户提示词" class="header-anchor">#</a> 用户提示词</h3> <p>提示词用 Json 格式，更贴近机器、工程化的任务处理</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>

        <span class="token property">&quot;defenseFunctions&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
            <span class="token property">&quot;check&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;outcome&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        <span class="token property">&quot;incorrectChains&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
            <span class="token property">&quot;identification&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;action&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;responseFormat&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;requiredFields&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
            <span class="token property">&quot;reasoning&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;plan&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;criticism&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;nextAction&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;dangrous&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>

        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>    
<span class="token punctuation">}</span>
</code></pre></div><p>PS：值得注意的是，构造对象的时候尽量采用 toString() 构造 String 变量，这样不容易 ObjectMapper 映射出错</p> <p>例如构造思考 Thought</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">ChatResponse</span> response <span class="token operator">=</span> model<span class="token punctuation">.</span><span class="token function">prompt</span><span class="token punctuation">(</span>prompt<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">call</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">chatResponse</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> jsonContent <span class="token operator">=</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>
<span class="token keyword">try</span><span class="token punctuation">{</span>
    jsonContent <span class="token operator">=</span> <span class="token function">extractJson</span><span class="token punctuation">(</span>response<span class="token punctuation">.</span><span class="token function">getResult</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getText</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> thinkData <span class="token operator">=</span> objectMapper<span class="token punctuation">.</span><span class="token function">readValue</span><span class="token punctuation">(</span>jsonContent<span class="token punctuation">,</span> <span class="token class-name">Map</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token class-name">Thought</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">reasoning</span><span class="token punctuation">(</span>thinkData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;reasoning&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">plan</span><span class="token punctuation">(</span>thinkData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;plan&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">criticism</span><span class="token punctuation">(</span>thinkData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;criticism&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">nextAction</span><span class="token punctuation">(</span>thinkData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;nextAction&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">dangrous</span><span class="token punctuation">(</span>thinkData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;dangrous&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">flows</span><span class="token punctuation">(</span>thinkData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;flows&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Error building Thought: {}&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
