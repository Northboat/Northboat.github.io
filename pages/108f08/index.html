    <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="tool-calling-和-mcp"><a href="#tool-calling-和-mcp" class="header-anchor">#</a> Tool Calling 和 MCP</h2> <h3 id="工具调用"><a href="#工具调用" class="header-anchor">#</a> 工具调用</h3> <p>MCP 的前奏</p> <ul><li>Kryo：文档生成</li> <li>Knife4j</li> <li>Hutool</li> <li>Jsoup：网页抓取</li> <li>SearchAPI：搜索引擎</li></ul> <p>现在应该更多的选择工具调用，而非 MCP，只有公共服务，例如 LSP 服务，需要提供给多个 AI 应用，才会考虑 MCP 部署，这符合最小设计原则（从 Tool 提取到 MCP Server 很简单，但从 MCP 耦合到单个项目将是一个麻烦的问题）</p> <p>有两种方式进行调用，一种是直接在 chat 阶段给 LLM 注入工具，这样它可以在思考的过程中对工具进行调用</p> <p>但通常采用更自由化的方式调用工具，手动分为以下两步</p> <ol><li>让大模型思考，选择要调用的工具并构造参数</li> <li>调取工具执行参数并获得结果</li></ol> <p>第一步约束 LLM 结构化输出的 Prompt</p> <div class="language- extra-class"><pre class="language-text"><code>Respond with the tool name and paramters in JSON format:
{
	&quot;tool&quot;: &quot;toolName&quot;,
	&quot;parameters&quot;: {&quot;param1&quot;: &quot;value1&quot;, ...},
	&quot;justification&quot;: &quot;why this action helps achieve the goal&quot;
}
</code></pre></div><p>将得到的字符串进行 JSON 格式化处理，而后通过 ObjectMapper 转化为 Map 对象，最后构造 Action</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">ChatResponse</span> response <span class="token operator">=</span> model<span class="token punctuation">.</span><span class="token function">prompt</span><span class="token punctuation">(</span>prompt<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">call</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">chatResponse</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token class-name">String</span> jsonContent <span class="token operator">=</span> <span class="token function">extractJson</span><span class="token punctuation">(</span>response<span class="token punctuation">.</span><span class="token function">getResult</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getText</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> actionData <span class="token operator">=</span> objectMapper<span class="token punctuation">.</span><span class="token function">readValue</span><span class="token punctuation">(</span>jsonContent<span class="token punctuation">,</span> <span class="token class-name">Map</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token class-name">Action</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">tool</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">)</span> actionData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;tool&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">parameters</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">Map</span><span class="token operator">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">)</span> actionData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;parameters&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">justification</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">)</span> actionData<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;justification&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Error planning action: {}&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>抽取 Json 字符串方法</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">private</span> <span class="token class-name">String</span> <span class="token function">extractJson</span><span class="token punctuation">(</span><span class="token class-name">String</span> text<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">Pattern</span> pattern <span class="token operator">=</span> <span class="token class-name">Pattern</span><span class="token punctuation">.</span><span class="token function">compile</span><span class="token punctuation">(</span><span class="token string">&quot;\\{.*\\}&quot;</span><span class="token punctuation">,</span> <span class="token class-name">Pattern</span><span class="token punctuation">.</span><span class="token constant">DOTALL</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Matcher</span> matcher <span class="token operator">=</span> pattern<span class="token punctuation">.</span><span class="token function">matcher</span><span class="token punctuation">(</span>text<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span>matcher<span class="token punctuation">.</span><span class="token function">find</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> matcher<span class="token punctuation">.</span><span class="token function">group</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> text<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>当封装好任务对象 Action 后，调用 ToolCallback 执行</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">executeAction</span><span class="token punctuation">(</span><span class="token class-name">Action</span> action<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        <span class="token class-name">ToolCallback</span> tc <span class="token operator">=</span> tools<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>action<span class="token punctuation">.</span>tool<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span>tc <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token string">&quot;No Tool Matched &quot;</span> <span class="token operator">+</span> action<span class="token punctuation">.</span>tool<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> tc<span class="token punctuation">.</span><span class="token function">call</span><span class="token punctuation">(</span>objectMapper<span class="token punctuation">.</span><span class="token function">writeValueAsString</span><span class="token punctuation">(</span>action<span class="token punctuation">.</span>parameters<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">catch</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
        log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Error excuting action: {}&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="mcp"><a href="#mcp" class="header-anchor">#</a> MCP</h3> <blockquote><p>Model Context Protocol，模型上下文协议</p></blockquote> <p>切记：MCP 不是银弹，不要用 MCP 代替 Tool Calling</p> <p>常见的 MCP 平台：<a href="mcp.so">MCP.So</a>、<a href="https://bailian.console.aliyun.com/#/home" target="_blank" rel="nofollow noopener noreferrer">阿里百炼<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>、<a href="https://glama.ai/mcp/serer" target="_blank" rel="nofollow noopener noreferrer">Glama<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h4 id="mcp-server"><a href="#mcp-server" class="header-anchor">#</a> MCP Server</h4> <p>引入依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.ai<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-ai-mcp-server-spring-boot-starter<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>配置 SSE 服务（可选 stdio 模式）</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token comment"># 使用 spring-ai-starter-mcp-server-webmvc</span>
<span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">ai</span><span class="token punctuation">:</span>
    <span class="token key atrule">mcp</span><span class="token punctuation">:</span>
      <span class="token key atrule">server</span><span class="token punctuation">:</span>
        <span class="token key atrule">name</span><span class="token punctuation">:</span> webmvc<span class="token punctuation">-</span>mcp<span class="token punctuation">-</span>server
        <span class="token key atrule">version</span><span class="token punctuation">:</span> 1.0.0
        <span class="token key atrule">type</span><span class="token punctuation">:</span> SYNC <span class="token comment"># 同步</span>
        <span class="token key atrule">sse-message-endpoint</span><span class="token punctuation">:</span> /mcp/message  <span class="token comment"># SSE 消息端点路径</span>
        <span class="token key atrule">sse-endpoint</span><span class="token punctuation">:</span> /sse                  <span class="token comment"># SSE 端点路径</span>
</code></pre></div><p>天气服务样例</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Service</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">WeatherService</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Tool</span><span class="token punctuation">(</span>description <span class="token operator">=</span> <span class="token string">&quot;获取指定城市的天气信息&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getWeather</span><span class="token punctuation">(</span>
            <span class="token annotation punctuation">@ToolParameter</span><span class="token punctuation">(</span>description <span class="token operator">=</span> <span class="token string">&quot;城市名称，如北京、上海&quot;</span><span class="token punctuation">)</span> <span class="token class-name">String</span> cityName<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">// 实现天气查询逻辑</span>
        <span class="token keyword">return</span> <span class="token string">&quot;城市&quot;</span> <span class="token operator">+</span> cityName <span class="token operator">+</span> <span class="token string">&quot;的天气是晴天，温度22°C&quot;</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>注入<code>TollCallbackProvider</code>的 Bean</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">McpServerApplication</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">ToolCallbackProvider</span> <span class="token function">weatherTools</span><span class="token punctuation">(</span><span class="token class-name">WeatherService</span> weatherService<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token class-name">MethodToolCallbackProvider</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">toolObjects</span><span class="token punctuation">(</span>weatherService<span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h4 id="mcp-client"><a href="#mcp-client" class="header-anchor">#</a> MCP Client</h4> <p>引入依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.ai<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-ai-mcp-client-spring-boot-starter<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>配置</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">ai</span><span class="token punctuation">:</span>
    <span class="token key atrule">mcp</span><span class="token punctuation">:</span>
      <span class="token key atrule">client</span><span class="token punctuation">:</span>
        <span class="token key atrule">enabled</span><span class="token punctuation">:</span> <span class="token boolean important">true</span>
        <span class="token key atrule">name</span><span class="token punctuation">:</span> my<span class="token punctuation">-</span>mcp<span class="token punctuation">-</span>client
        <span class="token key atrule">version</span><span class="token punctuation">:</span> 1.0.0
        <span class="token key atrule">request-timeout</span><span class="token punctuation">:</span> 30s
        <span class="token key atrule">type</span><span class="token punctuation">:</span> SYNC
        <span class="token key atrule">sse</span><span class="token punctuation">:</span>
          <span class="token key atrule">connections</span><span class="token punctuation">:</span>
            <span class="token key atrule">server1</span><span class="token punctuation">:</span>
              <span class="token key atrule">url</span><span class="token punctuation">:</span> http<span class="token punctuation">:</span>//localhost<span class="token punctuation">:</span><span class="token number">8080</span>
        <span class="token key atrule">stdio</span><span class="token punctuation">:</span>
          <span class="token key atrule">connections</span><span class="token punctuation">:</span>
            <span class="token key atrule">server1</span><span class="token punctuation">:</span>
              <span class="token key atrule">command</span><span class="token punctuation">:</span> /path/to/server
              <span class="token key atrule">args</span><span class="token punctuation">:</span>
                <span class="token punctuation">-</span> <span class="token punctuation">-</span><span class="token punctuation">-</span>port=8080
              <span class="token key atrule">env</span><span class="token punctuation">:</span>
                <span class="token key atrule">API_KEY</span><span class="token punctuation">:</span> your<span class="token punctuation">-</span>api<span class="token punctuation">-</span>key
</code></pre></div><p>这样在启动时，就会自动扫描对应端口的 Tool，具体的注入方法得看官方文档，更新很快</p> <h2 id="ai-agent"><a href="#ai-agent" class="header-anchor">#</a> AI Agent</h2> <blockquote><p>2025 年 Agent 被证明图灵完备</p></blockquote> <p>Agent 根据处理问题的能力范畴，被分为 L0-L5 五档，参考于智能驾驶的分级</p> <ul><li>L0-没有人工智能</li> <li>L1-规则符号智能</li> <li>L2-推理决策智能</li> <li>L3-记忆反思智能</li> <li>L4-自主学习智能</li> <li>L5-个性群体智能</li></ul> <p>纯粹的大模型结合工具调用处于 L2 这一等级，具备基础的推理和决策行动能力，当引入记忆反思则进化为 L3，再引入自主学习与泛化将进化为 L4</p> <p>L5 则需要在 L4 的基础上加入个性与性格，并且引入智能体的协作行为（A2A）</p> <h3 id="agent-loop-and-react"><a href="#agent-loop-and-react" class="header-anchor">#</a> Agent Loop and ReAct</h3> <p>Agent Loop 是智能体的核心工作流，简单来说就是进行自己提问、自己回答、自己解决的对话循环</p> <ul><li>在最开始也说过，当 Agent Loop 轮次过多，上下文过长，一定会存在注意力不集中，导致滑坡式的正确率，如何解决？结构化中间语句，精炼结论，尽可能减少上下文长度</li></ul> <p>ReAct 模式：Reasoning + Acting（推理 + 行动）模型交互模式，通常会加入 Observe 过程</p> <p>每个过程通过 Prompt 规定输出结构，令四个步骤均按照 Json 格式结构化输出，构造相应对象</p> <ul><li>think → Thought</li> <li>planAction → Action → act</li> <li>observe → Observation</li></ul> <p>具体而言</p> <ul><li>think：根据上一轮的观察 Observation（若有），思考输出 Thought，包含思考推理和大致的下一步行动</li> <li>planAction：根据 Thought 挑选最合适的工具（这里的工具可以根据 Bean 注入，通过 formatted 嵌入提示词），并构造相应入参，封装为 Action</li> <li>act：执行 Action，返回执行结果 Result</li> <li>observe：观察评判 Result 输出，并给出下一步指导意见，封装为 Observation</li></ul> <p>值得明确的是，“在正确的时候干特定的事”对于 LLM 能力的提升是巨大的，即在 think 阶段只 think，在 planAction 过程只挑选工具，明确阶段意识，结构化 Agent 流程能够显著提高 Agent 效率</p> <h3 id="多-agent-菱形工作流"><a href="#多-agent-菱形工作流" class="header-anchor">#</a> 多 Agent 菱形工作流</h3> <p>分为以下</p> <ol><li>任务调度 Agent：为 Task 选择合适的 Agent，与 planAction 过程挑选工具类似，将根据用户输入分类任务，构造任务 Task，选取对应的任务处理 Agent 来执行任务，这里将维护一个<code>Map&lt;String, Agent&gt;</code>，根据任务 Task 类型选取 get 对应 Agent</li> <li>任务处理 Agent：任务处理 Agent 按照 reAct 工作流完成任务 Task，输出报告 Report</li> <li>任务报告 Agent：接收任务处理 Agent 输出的 Report，进行精炼提取，输出 HTML 格式的报告并落盘</li></ol> <p>任务处理 Agent 的多线程调度</p> <ul><li>在任务调度 Agent 中通过 Map 维护<strong>无状态的</strong>任务处理 Agent（无状态即任务处理 Agent 的 run 方法不依赖全局变量，仅作为工具类调用），仅需要维护任务并发上限而不需要考虑 Agent 工作状态</li> <li>若是单例有状态，则需要在调度 Agent 之前加一层状态判断，而后根据不同情况将任务放入阻塞队列</li></ul> <p>任务处理 Agent 同样采用多 Agent 形式，根据不同的任务类型分配不同的 Agent 工作，例如 SQL 注入的危险点丢给<code>SqlInjectionAgent</code>，而命令注入丢给<code>CommandInjectionAgent</code>，设计专门的提示词，给定专门的漏洞样例，将能大大提高 Agent 的辨别能力，从而提高整个 Agent 系统的准确率，这是很有意义的</p> <h3 id="现代智能体构建"><a href="#现代智能体构建" class="header-anchor">#</a> 现代智能体构建</h3> <p>A2A（Agent to Agent）协议，智能体通信交互协议</p> <p>A2A 和 MCP 的区别？A2A 和 MCP 其实对应着两种不同架构策略：即扁平化的和中心化的设计，A2A 更像是微服务，而 MCP 像是单机模式</p> <p>一个智能体的构建，无非五点</p> <ul><li>大模型 LLM</li> <li>知识库 RAG</li> <li>提示词 Prompt</li> <li>工作流 Workflow</li> <li>工具调用 Tools &amp; MCP</li></ul> <p>其中，大模型的调用已经非常成熟，例如 Spring AI Alibaba 和 Langchain4j 等等，工具调用也由于 MCP 的兴起变成“配置问题”而非开发问题，所以现在的智能体的开发更多体现在</p> <ul><li>工作流的编排</li> <li>提示词的设计</li> <li>知识库的构建</li></ul> <p>生产提示词的工具</p> <ul><li>https://prompt.always200.com</li> <li>https://prompts.chat</li></ul> <p>通常，智能体的角色定义包括</p> <ol><li>基本资料：语言，角色描述，技术经验背景，性格特征，专业领域等</li> <li>核心技能：专业技能和辅助技能</li> <li>规则：基本原则，行为准则，限制条件</li> <li>工作流：目标，步骤，预期结果</li> <li>初始化：“作为 xxx，你必须遵守上述规则，按照工作流执行任务”</li></ol> <p>一个很简单的应用就是在 Cherry Studio 的每一个对话中通过 Prompt 创建简单的智能体，以满足不同场景下的需求</p> <p>除了角色定义，样例（Examples）和输出格式（Output Format）同样很重要，通常以如下格式给定</p> <div class="language- extra-class"><pre class="language-text"><code>&lt;Examples&gt;
Q: how do you do?
A: I'm fine, thanks.

Q: What's up buddy?
A: I'm fucking good!

&lt;Output format&gt;
{
	&quot;reasoning&quot;: &quot;why you should do this?&quot;,
	&quot;result&quot;: &quot;the result you did this.&quot;,
	&quot;nextPlan&quot;: &quot;what should you do next?&quot;
}
</code></pre></div><p>其中，例子最好是少量的，即 few-shot-learning，并且正确和错误的例子应该乱序（一定要避免正确的全部放一块，错误的全放一块）</p> <h2 id="langchain4j-基础"><a href="#langchain4j-基础" class="header-anchor">#</a> LangChain4j 基础</h2></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/5b4468/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">分类器训练与验证 - SKLearn</div></a> <a href="/pages/3b881c/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">智能体流程编排 - LangGraph</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
