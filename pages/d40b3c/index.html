> <td>coreutils（<code>ls</code> <code>cp</code> <code>mv</code> <code>cat</code> <code>echo</code>…）、grep、sed、tar、bash</td> <td>日常命令的主体，<code>--help</code> 里带 GNU 字样的基本都出自这里</td></tr> <tr><td>开发工具</td> <td>binutils（<code>ld</code>/<code>as</code>）、gdb、make、autotools</td> <td>汇编、链接、调试与构建自动化</td></tr> <tr><td>协议</td> <td>GPL、LGPL、AGPL</td> <td>copyleft：修改后分发必须同样开源</td></tr></tbody></table> <p>与 Android 的用户空间区别</p> <table><thead><tr><th>类别</th> <th>Android 用户空间</th> <th>GNU/Linux</th> <th>说明</th></tr></thead> <tbody><tr><td>C 库</td> <td>bionic（<code>libc.so</code> 内含 libm/libdl/线程）</td> <td>glibc</td> <td>精简实现，无 NSS，POSIX 扩展不全</td></tr> <tr><td>动态链接器</td> <td><code>/system/bin/linker64</code></td> <td><code>ld-linux-aarch64.so.1</code></td> <td>ELF 的 <code>PT_INTERP</code> 指向不同，二进制不通用</td></tr> <tr><td>基础命令</td> <td>toybox（单二进制多命令）</td> <td>coreutils + util-linux</td> <td>只含常用子集，<code>--help</code> 极简</td></tr> <tr><td>shell</td> <td>mksh</td> <td>bash</td> <td>系统默认 <code>sh</code> 是 mksh</td></tr> <tr><td>init</td> <td><code>init</code> + <code>*.rc</code> 脚本 + 属性服务</td> <td>systemd / SysV init</td> <td>无依赖管理、无 cgroup 编排那套</td></tr> <tr><td>运行时</td> <td>ART（执行 dex）</td> <td>无（直接跑 ELF）</td> <td>应用层 Java/Kotlin → dex → ART</td></tr> <tr><td>IPC</td> <td>Binder</td> <td>unix socket、dbus</td> <td>跨进程调用主要走 Binder</td></tr> <tr><td>权限模型</td> <td>每 App 一个 uid + SELinux 域</td> <td>root/普通用户 + 文件权限</td> <td><code>untrusted_app</code> 域，默认无 root，setuid 无效</td></tr> <tr><td>目录布局</td> <td><code>/system</code> <code>/vendor</code> <code>/apex</code> <code>/data</code></td> <td><code>/bin</code> <code>/lib</code> <code>/etc</code> <code>/usr</code></td> <td>无 <code>/usr</code>、无 <code>/etc/passwd</code> 传统体系</td></tr> <tr><td>软件分发</td> <td>APK（<code>pm</code> / <code>installd</code>）</td> <td>apt / dnf / pacman</td> <td>装的是应用，不是系统软件包</td></tr></tbody></table> <h3 id="proot"><a href="#proot" class="header-anchor">#</a> proot</h3> <p>因为 Android 机器上没有 root 权限，所以这份 Linux 使用了 proot 去 change root，它不动内核、不做虚拟化，只用 ptrace 拦住系统调用（prehook），把路径参数和身份参数改掉，让进程以为自己住在一个独立的 Linux 里</p> <img src="/assets/img/proot-principle.89470cff.svg"> <p>对照几个容易混淆的说法</p> <ul><li><strong>不是模拟器</strong>：不解释指令、不虚拟硬件，CPU 和内核都是手机自己的，跑的是 ARM 原生二进制</li> <li><strong>不是容器</strong>：没有 namespace、cgroup 隔离，在系统眼里它就是一个普通的 Termux 进程，<code>ps</code> 里能看到</li> <li><strong>不是真 root</strong>：<code>proot -0</code> 只是把 <code>getuid()/geteuid()</code> 的返回值改成 0，内核仍按 Termux 用户（uid=10xxx）校验权限</li> <li><strong>实现的两件事</strong>：伪造路径视图（相当于 chroot + bind mount）、伪造身份（相当于 fakeroot）；Android 无 root 时 <code>chroot</code> 系统调用直接 EPERM，这才轮到 proot</li></ul> <p>真正的 <code>chroot()</code> 发生在内核态，需要 root 权限，是在修改根目录指针 <code>fs_struct-&gt;root</code></p> <ul><li>chroot 不是安全边界。它只改路径起点，进程仍共享内核、网络、PID、/proc。经典逃逸手法就是 chroot 后 chdir 出去再 <code>chroot(&quot;.&quot;)</code>；而且它不改变“进程已经有权限”的事实，所以 chroot 里弄到 root 往往更容易打主机。容器（namespace + cgroup + capability 裁剪）才有隔离语义，chroot 没有</li> <li>只 chroot() 而不 <code>chdir(&quot;/&quot;)</code> 也没用。当前工作目录还在旧根之外，ls 一敲就回去了，所以标准写法是 <code>chroot(newroot); chdir(&quot;/&quot;)</code></li></ul> <h3 id="termux-常用命令"><a href="#termux-常用命令" class="header-anchor">#</a> Termux 常用命令</h3> <p>termux 使用</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>termux-setup-storage                     <span class="token comment"># 获取存储权限</span>
termux-change-repo                       <span class="token comment"># 更换 pkg 下载源</span>
pkg <span class="token function">install</span> <span class="token function">vim</span> openjdk-17 clang         <span class="token comment"># 编辑器、Java、C 环境</span>

<span class="token comment"># 软连接与 C 文件编译：termux 不允许在 shared 目录执行 C 二进制文件，编译前先把源文件拷到 ~/c</span>
<span class="token function">ln</span> <span class="token parameter variable">-s</span> ~/storage/shared/northboat ~/northboat
<span class="token builtin class-name">read</span> <span class="token parameter variable">-p</span> <span class="token string">&quot;Enter the file name: &quot;</span> <span class="token function">file</span> <span class="token operator">&amp;&amp;</span> <span class="token function">cp</span> ~/storage/shared/northboat/c/<span class="token variable">$file</span> ~/c/<span class="token variable">$file</span>

<span class="token comment"># Git：openssl、openssh 用于生成密匙和连接</span>
pkg <span class="token function">install</span> <span class="token function">git</span> openssl openssh
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.name <span class="token string">&quot;Northboat&quot;</span> <span class="token operator">&amp;&amp;</span> <span class="token function">git</span> config <span class="token parameter variable">--global</span> user.email <span class="token string">&quot;northboat@163.com&quot;</span>
ssh-keygen <span class="token parameter variable">-t</span> rsa <span class="token parameter variable">-C</span> <span class="token string">&quot;northboat@163.com&quot;</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> <span class="token parameter variable">--add</span> safe.directory /storage/emulated/0/northboat/repo/Docs   <span class="token comment"># 设置安全目录</span>

<span class="token comment"># MySQL（mariadb）：初始密码为空直接回车，登录后 set password for 'root'@'localhost' = password('新密码');</span>
pkg <span class="token function">install</span> mariadb <span class="token operator">&amp;&amp;</span> <span class="token function">nohup</span> mysqld <span class="token operator">&amp;</span>
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
<span class="token comment"># 启动脚本 start_mysql.sh：nohup mysqld &gt; mysql.log &amp;；报 Unknown storage engine: InnoDB 时删掉</span>
<span class="token comment"># usr/var/lib/mysql 下的 aria_log*、ib_logfile*、ibdata1 再重启</span>

<span class="token comment"># Manjaro（Andronix + proot）与 python 环境</span>
pkg update <span class="token operator">&amp;&amp;</span> pkg <span class="token function">install</span> <span class="token function">wget</span> <span class="token function">curl</span> proot <span class="token function">tar</span>
<span class="token function">wget</span> https://raw.githubusercontent.com/AndronixApp/AndronixOrigin/master/Installer/Manjaro/manjaro.sh <span class="token parameter variable">-O</span> manjaro.sh <span class="token operator">&amp;&amp;</span> <span class="token function">bash</span> manjaro.sh
<span class="token comment"># 赋予存储权限并修改 start-manjaro.sh 挂载 sdcard 后启动</span>
./start-manjaro.sh <span class="token operator">&amp;&amp;</span> pacman <span class="token parameter variable">-Syy</span> <span class="token operator">&amp;&amp;</span> pacman <span class="token parameter variable">-S</span> python-pip
pip <span class="token function">install</span> numpy pandas scipy matplotlib
pip <span class="token function">install</span> torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br></div></div><h2 id="droid-deck"><a href="#droid-deck" class="header-anchor">#</a> Droid Deck</h2> <img src="/assets/img/droiddeck-glossary.9411e82d.svg"> <img src="/assets/img/droiddeck-architecture.0d5ab01c.svg"></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 16:06:13</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/ef6e91/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">网关与代理</div></a> <a href="/pages/4feb0e/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Linux 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
