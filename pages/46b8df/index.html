a-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://bugstack.cn/md/develop/framework/ddd/2019-10-15-DDD%E4%B8%93%E9%A2%98%E6%A1%88%E4%BE%8B%E4%B8%80%E3%80%8A%E5%88%9D%E8%AF%86%E9%A2%86%E5%9F%9F%E9%A9%B1%E5%8A%A8%E8%AE%BE%E8%AE%A1DDD%E8%90%BD%E5%9C%B0%E3%80%8B.html" target="_blank" rel="nofollow noopener noreferrer">DDD专题案例一《初识领域驱动设计DDD落地》 | 小傅哥 bugstack 虫洞栈<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>软件设计的核心目的：高内聚低耦合</p> <h2 id="ddd-设计思想"><a href="#ddd-设计思想" class="header-anchor">#</a> DDD 设计思想</h2> <p>Domain-Driven Design 领域驱动设计</p> <h3 id="service-贫血模型"><a href="#service-贫血模型" class="header-anchor">#</a> Service + 贫血模型</h3> <p>贫血模型（Anemic Model），是一种数据与行为分离的对象设计方式，对象仅存储数据，业务逻辑则放在单独的 “服务类” 中</p> <p>核心特征</p> <ol><li>类内部只有成员变量和对应的 getter/setter 方法，没有业务逻辑。</li> <li>所有业务操作（如计算、校验）都放在专门的服务类（如 <code>OrderService</code>）中。</li> <li>本质上更像 “数据容器”，而非完整的 “业务对象”。</li></ol> <p>例如：一个订单类<code>Order</code>只存订单号、金额等字段，计算订单折扣、判断是否可取消等逻辑，都放在<code>OrderService</code>里</p> <p>在我“历来”的开发中，我都是用的这样的模式，这样&quot;大而全&quot;的<code>service + 贫血数据模型</code>架构</p> <h3 id="充血模型"><a href="#充血模型" class="header-anchor">#</a> 充血模型</h3> <p>充血模型（Rich Model），是数据与行为绑定的对象设计方式，业务逻辑直接封装在对象内部，让对象既持有数据，又能完成自身相关的业务操作</p> <p>核心特征</p> <ol><li>类内部不仅有成员变量，还包含与自身数据强相关的业务方法（如校验、计算、状态变更）</li> <li>服务类仅负责协调多个对象的交互（如调用两个对象的方法完成跨对象业务），不承担具体业务逻辑</li> <li>更符合面向对象 “封装” 的核心思想，让对象自己 “对自己负责”</li></ol> <p>例如：击剑火柴人小游戏中，每个火柴人 MatchMan 把击剑、移动、跳跃等功能都包含了，在主程序中仅需创建 MatchMan 就可以开始游戏</p> <p>充血模型是更适合领域驱动设计的实现方案，当然，充血模型并非 “银弹”，它对开发者的业务理解能力要求更高（需要准确判断 “哪些行为属于对象本身”），但对于复杂业务系统，这种前期投入能显著降低长期维护成本</p> <h3 id="领域模型"><a href="#领域模型" class="header-anchor">#</a> 领域模型</h3> <p>领域模型（Domain Model），领域模型是对业务领域中 “概念、规则、流程” 的抽象表示，是描述业务的 “蓝图”，充血模型和贫血模型都是实现领域模型的具体方式</p> <ul><li>即领域模型是更上层的架构思想，用以分割业务，而充血和贫血模型是代码实现的具体风格</li></ul> <p>领域模型和微服务的相性一致</p> <h3 id="实体、聚合和值对象"><a href="#实体、聚合和值对象" class="header-anchor">#</a> 实体、聚合和值对象</h3> <p>实体 entity 是指有完整生命周期的数据，例如一个电商场景，用户的地址就是一个 entity，因为他有完整的 CRUD 流程，即创建、修改、销毁都在同一数据载体上进行</p> <p>而值对象只是一个值，例如订单中，用户的收货地址，这个收货地址当然有可能是用户的实体 entity 地址，但是他只是作为一个当前值存放在订单记录中，也就是说，即使用户修改了地址，这个收货地址仍作为一个值不变</p> <p>在数据库设计中，这样的 DDD 思想可以作为方法论来运用，即实体可以作为一个单独的表存在，而值对象需要单独的字段来存放，例如</p> <ul><li>我现在有一个订单表和用户个人信息表，这个订单表该用户用户地址这一字段吗？还是说直接去关联用户个人信息表中的数据项，再去拿地址字段</li> <li>答案是前者，因为在订单表中，用户地址是一个值对象，而非实体，不能这样外键关联，甚至于，对于这样的值对象，我们可以用一个 JSON 字段来进行存储（他只是一个一次性的数据，存着就行，其实不太需要关注他的结构和维护）</li></ul> <h3 id="仓储和适配器"><a href="#仓储和适配器" class="header-anchor">#</a> 仓储和适配器</h3> <h3 id="触发器"><a href="#触发器" class="header-anchor">#</a> 触发器</h3> <h2 id="cqrs-架构"><a href="#cqrs-架构" class="header-anchor">#</a> CQRS 架构</h2> <h3 id="什么-cqrs-架构"><a href="#什么-cqrs-架构" class="header-anchor">#</a> 什么 CQRS 架构</h3> <blockquote><p>读写分离架构</p></blockquote> <p>用上 DDD 后，自然就会用上命令与查询分离的设计，这就不得不提到 CQRS</p> <p>CQRS 源于 CQS 设计模式，CQS（命令查询分离，Command Query Segregation）设计模式建议将对象的方法映射到两类，方法要么改变对象的内部状态，但不返回任何内容，要么只返回元数据</p> <ul><li>只改变状态的方法称为 Command</li> <li>或者一个方法返回信息但不改变内部状态的方法称为 Query</li></ul> <p>例如，Java 中 Stack 的 pop 方法违反了 CQS 模式，因为它修改了堆栈的内部状态并同时返回信息</p> <p>在 CQS 模式的基础上，Greg Young 在 2010 年提出了 CQRS（Command Query Responsibility Segregation）架构模式，它也将写入和读取分开，但应用于 API 方面，例如</p> <ul><li>Command API 仅使用 POST 路由实现</li> <li>而 Query API 仅使用 GET 路由实现</li></ul> <p>CQRS 的最大优势之一是可以将技术代码与业务代码分离，特别是在与 DDD 和事件溯源相关的情况下</p> <p>可以在不更改技术子结构中的任何内容的情况下调整业务逻辑，更重要的是，反之亦然</p> <h3 id="cqrs-和-ddd"><a href="#cqrs-和-ddd" class="header-anchor">#</a> CQRS 和 DDD</h3> <h2 id="cola-架构"><a href="#cola-架构" class="header-anchor">#</a> COLA 架构</h2> <p>Clean Object-Oriented Layered Archetype，整洁面向对象分层架构，DDD 领域驱动设计的实践架构</p> <h3 id="ddd-四层架构"><a href="#ddd-四层架构" class="header-anchor">#</a> DDD 四层架构</h3> <h3 id="其他架构模式设计"><a href="#其他架构模式设计" class="header-anchor">#</a> 其他架构模式设计</h3> <p>了解即可，用到再学</p> <ul><li>CQRS 架构模式</li> <li>TDD 测试驱动开发</li> <li>Hexagonal Architecture 六边形架构</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/9a8ad9/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">分布式与微服务架构</div></a> <a href="/pages/dd1940/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">摒弃 Java 大脑从我做起</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
