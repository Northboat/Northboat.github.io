d"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://bugstack.cn/md/develop/framework/ddd/2019-10-15-DDD%E4%B8%93%E9%A2%98%E6%A1%88%E4%BE%8B%E4%B8%80%E3%80%8A%E5%88%9D%E8%AF%86%E9%A2%86%E5%9F%9F%E9%A9%B1%E5%8A%A8%E8%AE%BE%E8%AE%A1DDD%E8%90%BD%E5%9C%B0%E3%80%8B.html" target="_blank" rel="nofollow noopener noreferrer">DDD专题案例一《初识领域驱动设计DDD落地》 | 小傅哥 bugstack 虫洞栈<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>软件设计的核心目的：高内聚低耦合</p> <h2 id="ddd-设计思想"><a href="#ddd-设计思想" class="header-anchor">#</a> DDD 设计思想</h2> <p>Domain-Driven Design 领域驱动设计</p> <ul><li>DIP 依赖倒置原则</li> <li>业务与基础设施解耦</li></ul> <h3 id="service-贫血模型"><a href="#service-贫血模型" class="header-anchor">#</a> Service + 贫血模型</h3> <p>贫血模型（Anemic Model），是一种数据与行为分离的对象设计方式，对象仅存储数据，业务逻辑则放在单独的 “服务类” 中</p> <p>核心特征</p> <ol><li>类内部只有成员变量和对应的 getter/setter 方法，没有业务逻辑。</li> <li>所有业务操作（如计算、校验）都放在专门的服务类（如 <code>OrderService</code>）中。</li> <li>本质上更像 “数据容器”，而非完整的 “业务对象”。</li></ol> <p>例如：一个订单类<code>Order</code>只存订单号、金额等字段，计算订单折扣、判断是否可取消等逻辑，都放在<code>OrderService</code>里</p> <p>在我“历来”的开发中，我都是用的这样的模式，这样&quot;大而全&quot;的<code>service + 贫血数据模型</code>架构</p> <h3 id="充血模型"><a href="#充血模型" class="header-anchor">#</a> 充血模型</h3> <p>充血模型（Rich Model），是数据与行为绑定的对象设计方式，业务逻辑直接封装在对象内部，让对象既持有数据，又能完成自身相关的业务操作</p> <p>核心特征</p> <ol><li>类内部不仅有成员变量，还包含与自身数据强相关的业务方法（如校验、计算、状态变更）</li> <li>服务类仅负责协调多个对象的交互（如调用两个对象的方法完成跨对象业务），不承担具体业务逻辑</li> <li>更符合面向对象 “封装” 的核心思想，让对象自己 “对自己负责”</li></ol> <p>例如：击剑火柴人小游戏中，每个火柴人 MatchMan 把击剑、移动、跳跃等功能都包含了，在主程序中仅需创建 MatchMan 就可以开始游戏</p> <p>充血模型是更适合领域驱动设计的实现方案，当然，充血模型并非 “银弹”，它对开发者的业务理解能力要求更高（需要准确判断 “哪些行为属于对象本身”），但对于复杂业务系统，这种前期投入能显著降低长期维护成本</p> <h3 id="领域模型"><a href="#领域模型" class="header-anchor">#</a> 领域模型</h3> <p>领域模型（Domain Model），领域模型是对业务领域中 “概念、规则、流程” 的抽象表示，是描述业务的 “蓝图”，充血模型和贫血模型都是实现领域模型的具体方式</p> <ul><li>即领域模型是更上层的架构思想，用以分割业务，而充血和贫血模型是代码实现的具体风格</li></ul> <p>领域模型和微服务的相性一致</p> <h3 id="实体、聚合和值对象"><a href="#实体、聚合和值对象" class="header-anchor">#</a> 实体、聚合和值对象</h3> <p>实体 entity 依托于持久层数据 PO 设计，例如用户的一个地址 POJO，它实际上存储在数据库中，通过扩展他的功能，使之成为一个具有完整生命周期的数据</p> <ul><li>用户地址有完整的 CRUD 流程，创建、修改、销毁都在同一数据载体上进行</li></ul> <p>值对象可以理解为一个数据库记录，例如订单中，用户的收货地址，这个收货地址当然有可能是用户的实体 entity 地址，但是他只是作为一个当前值存放在订单记录中，也就是说，即使用户修改了收获地址，其实体的用户地址并不会改变</p> <p>这样的 DDD 思想可以作为方法论应用到数据表设计，即实体可以作为一个单独的表存在，而值对象仅作为一个列字段来存储，例如</p> <ul><li>我现在有一个订单表和用户个人信息表，这个订单表该用户用户地址这一字段吗？还是说直接去关联用户个人信息表中的数据项，再去拿地址字段</li> <li>答案是前者，因为在订单表中，用户地址是一个值对象，而非实体，不能这样外键关联，甚至于，对于这样的值对象，我们可以用一个 JSON 字段来进行存储（他只是一个一次性的数据，存着就行，其实不太需要关注他的结构和维护）</li></ul> <p>聚合对象：聚合对象是值对象的集合，当你对数据库的操作需要使用到多个实体时，可以创建聚合对象（相当于一个 left join？）</p> <ul><li>一个聚合对象来表示一个数据库事务，具有事务一致性，聚合中的实体可以由聚合提供创建操作，实体 PO 也被称为聚合根对象</li></ul> <p>例如，一个订单的聚合，会涵盖：下单用户实体对象、订单实体、订单明细实体和订单收货四级地址值对象</p> <h3 id="dip-依赖倒置"><a href="#dip-依赖倒置" class="header-anchor">#</a> DIP 依赖倒置</h3> <blockquote><p>基于 DIP（Dependency Inverse Principle）依赖倒置原则</p></blockquote> <p>传统<code>Service + 贫血模型</code>常见的问题是：Service 层直接依赖 Redis、RPC 客户端、配置中心、MQ 等基础设施，导致业务逻辑与技术实现深度耦合，难以测试、演进和复用</p> <p>DIP 的核心概念可以概括为以下几点</p> <ul><li>高层模块和低层模块都应该依赖于抽象：高层模块是指那些调用其他模块、类或函数的模块，而低层模块则是被调用的模块、类或函数</li> <li>抽象不应依赖于细节：在软件开发中，抽象通常指的是接口或抽象类，而细节则是具体的实现类</li> <li>依赖倒置的设计理念是相对于细节的多变性，抽象的东西要稳定得多，以抽象为基础搭建的架构比以细节为基础的架构要稳定得多</li></ul> <p>例如：上层调用依赖于一个底层接口而不关注其实现方式，于是这个底层接口的具体实现和上层调用被分离解耦，同时，这个底层实现也应当依赖于抽象接口实现</p> <p>具体到实例</p> <ul><li>在一个消息发送的场景中，如果我们有一个<code>Person</code>类需要发送消息，而消息的发送方式有电子邮件、微信等多种方式，我们可以定义一个抽象的接口<code>IReceiver</code>，然后让<code>Email</code>和<code>WeiXin</code>等具体的消息发送方式实现这个接口</li> <li>这样，<code>Person</code>类只需要依赖于<code>IReceiver</code>接口，而不是具体的发送方式，当新增一种消息发送方式时，只需要新增一个实现了<code>IReceiver</code>接口的类即可，而无需修改<code>Person</code>类的代码</li></ul> <p>另外，计算机网络层级的设计就也合这样的依赖倒置，只规范每一层 API 接口，而不关注每一层的具体实现，调用的代码不作修改</p> <p>在 DDD 架构中，从上往下分别是</p> <ol><li>用户接口层：暴露业务逻辑接口</li> <li>应用层：实现业务逻辑</li> <li>领域层：实现服务功能</li> <li>基础设施层：实现底层仓储和适配器</li></ol> <h3 id="仓储和适配器"><a href="#仓储和适配器" class="header-anchor">#</a> 仓储和适配器</h3> <p>仓储即数据库存储，适配器即通信框架，在 DDD 中属于基础设施层</p> <img src="/assets/img/image-20260114173216152.593c7c4a.png"> <p>仓储（基础设施层）与领域层的耦合实例</p> <ol><li>在领域层定义 Repository 接口（如 <code>AccountRepository</code>）</li> <li>在基础设施层实现该接口，可基于 MyBatis、JPA、RedisTemplate 等技术</li> <li>通过依赖注入将具体实现注入到应用服务中</li></ol> <h3 id="触发器"><a href="#触发器" class="header-anchor">#</a> 触发器</h3> <p>在 DDD 架构中，领域层的所有外部交互动作，无论是 HTTP、RPC、MQ 消息发布监听，还是定时任务，都被统一视作“触发动作”</p> <ul><li>它们本身不包含业务逻辑，仅作为<strong>入口点</strong>，负责接收外部请求并调用对应的<strong>应用层编排逻辑</strong></li></ul> <p>如何去调用领域层的服务，就是触发器的工作</p> <p>触发动作的职责非常明确：<strong>解析输入、校验边界、启动流程</strong>，然后委托给应用服务进行用例编排</p> <p>真正的业务规则，始终保留在领域层中，确保核心逻辑不受技术细节污染，实现“业务与基础设施解耦”</p> <h2 id="ddd-单体项目"><a href="#ddd-单体项目" class="header-anchor">#</a> DDD 单体项目</h2> <p>在开始之前，得首先搞清楚几个概念</p> <ul><li>分布式是项目部署的事，不管是单体项目还是微服务项目，都可以采用分布式部署，当然，通常情况下，微服务总是分布式部署</li> <li>微服务是项目模块化的事，与之对应的是单体项目，将单体项目拆分为微服务是常见的操作，Spring Cloud 是最广泛的微服务框架</li> <li>DDD 是代码设计的事，与之相对应的是典型的三层模型（Controller-Service-Dao），这是代码组织结构，例如 COLA 架构就是一个典型的 DDD 设计实例</li></ul> <p>也就是说，我可以用 DDD 的思想开发单体项目，当然也可以开发微服务，这只是一种代码设计风格，至于分布式，那是部署的事</p> <h3 id="ddd-案例"><a href="#ddd-案例" class="header-anchor">#</a> DDD 案例</h3> <h3 id="三层架构到四层架构"><a href="#三层架构到四层架构" class="header-anchor">#</a> 三层架构到四层架构</h3> <p>原有的单体架构项目采用三层架构，即 Controller-Service-Dao，典型的贫血模型，DDD 的一个四层架构示例如下</p> <img src="/assets/img/image-20260108211811461.690e3a98.png"> <h3 id="领域划分"><a href="#领域划分" class="header-anchor">#</a> 领域划分</h3> <p>model</p> <h3 id="基础设施层"><a href="#基础设施层" class="header-anchor">#</a> 基础设施层</h3> <p>library</p> <p>cmd</p> <h3 id="用户领域"><a href="#用户领域" class="header-anchor">#</a> 用户领域</h3> <h3 id="图片领域"><a href="#图片领域" class="header-anchor">#</a> 图片领域</h3> <h3 id="空间领域"><a href="#空间领域" class="header-anchor">#</a> 空间领域</h3> <h3 id="公共服务"><a href="#公共服务" class="header-anchor">#</a> 公共服务</h3> <h2 id="cqrs-架构和-tdd"><a href="#cqrs-架构和-tdd" class="header-anchor">#</a> CQRS 架构和 TDD</h2> <h3 id="什么是-cqrs"><a href="#什么是-cqrs" class="header-anchor">#</a> 什么是 CQRS</h3> <blockquote><p>读写分离架构</p></blockquote> <p>用上 DDD 后，自然就会用上命令与查询分离的设计，这就不得不提到 CQRS</p> <p>CQRS 源于 CQS 设计模式，CQS（命令查询分离，Command Query Segregation）设计模式建议将对象的方法映射到两类，方法要么改变对象的内部状态，但不返回任何内容，要么只返回元数据</p> <ul><li>只改变状态的方法称为 Command</li> <li>或者一个方法返回信息但不改变内部状态的方法称为 Query</li></ul> <p>例如，Java 中 Stack 的 pop 方法违反了 CQS 模式，因为它修改了堆栈的内部状态并同时返回信息</p> <p>在 CQS 模式的基础上，Greg Young 在 2010 年提出了 CQRS（Command Query Responsibility Segregation）架构模式，它也将写入和读取分开，但应用于 API 方面，例如</p> <ul><li>Command API 仅使用 POST 路由实现</li> <li>而 Query API 仅使用 GET 路由实现</li></ul> <p>CQRS 的最大优势之一是可以将技术代码与业务代码分离，特别是在与 DDD 和事件溯源相关的情况下</p> <p>可以在不更改技术子结构中的任何内容的情况下调整业务逻辑，更重要的是，反之亦然</p> <h3 id="cqrs-和-ddd"><a href="#cqrs-和-ddd" class="header-anchor">#</a> CQRS 和 DDD</h3> <p>CQRS 和 DDD 是天然契合的，CQRS 天然提供一种领域划分逻辑</p> <h3 id="tdd-测试驱动开发"><a href="#tdd-测试驱动开发" class="header-anchor">#</a> TDD 测试驱动开发</h3> <blockquote><p>Test-Driven Development</p></blockquote> <p>简单来说，就是先写测试再写代码</p> <h2 id="摒弃-java-大脑"><a href="#摒弃-java-大脑" class="header-anchor">#</a> 摒弃 Java 大脑</h2> <h3 id="组合大于继承"><a href="#组合大于继承" class="header-anchor">#</a> 组合大于继承</h3> <p>Java 的组合继承</p> <p>Go 无继承的轻量化设计</p> <h3 id="模块化大于垂直分层"><a href="#模块化大于垂直分层" class="header-anchor">#</a> 模块化大于垂直分层</h3> <p>充血与贫血模型</p> <p>领域驱动与分层架构</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:
