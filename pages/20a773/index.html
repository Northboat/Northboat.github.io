><a href="/pages/20a773/#智猪博弈" class="sidebar-link">智猪博弈</a></li><li class="sidebar-sub-header level3"><a href="/pages/20a773/#性别大战" class="sidebar-link">性别大战</a></li><li class="sidebar-sub-header level3"><a href="/pages/20a773/#鹰鸽博弈" class="sidebar-link">鹰鸽博弈</a></li></ul></li></ul></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06970110><div class="articleInfo" data-v-06970110><ul class="breadcrumbs" data-v-06970110><li data-v-06970110><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06970110></a></li> <li data-v-06970110><span data-v-06970110>网络空间安全</span></li><li data-v-06970110><span data-v-06970110>博弈论</span></li></ul> <div class="info" data-v-06970110><div title="作者" class="author iconfont icon-touxiang" data-v-06970110><a href="https://github.com/Northboat" target="_blank" title="作者" class="beLink" data-v-06970110>Northboat</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06970110><a href="javascript:;" data-v-06970110>2026-09-02</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAAXNSR0IArs4c6QAABGpJREFUSA3tVVtoXFUU3fvOI53UlmCaKIFmwEhsE7QK0ipFEdHEKpXaZGrp15SINsXUWvBDpBgQRKi0+KKoFeJHfZA+ED9KKoIU2gYD9UejTW4rVIzm0VSTziPzuNu1z507dibTTjL4U/DAzLn3nL3X2o91ziX6f9wMFdh6Jvbm9nNSV0msViVO6tN1Rm7NMu2OpeJ9lWBUTDxrJbYTS0hInuwciu9eLHlFxCLCZEk3MegsJmZ5K/JD6t7FkFdEvGUo1g7qJoG3MHImqRIn8/nzY1K9UPKKiJmtnUqHVE3Gbuay6vJE/N2FEmuxFjW2nUuE0yQXRRxLiTUAzs36zhZvOXJPdX850EVnnLZkB8prodQoM5JGj7Xk2mvC7JB8tG04Ef5PiXtG0UtxupRQSfTnBoCy554x18yJHI6I+G5Eru4LHmPJZEQsrvPUbMiA8G/WgMK7w7I+ez7++o2ANfbrjvaOl1tFMs+htG3IrZH9/hDX1Pr8Tc0UvH8tcX29KzAgIGcEkINyW5BF9x891hw6VYqgJHEk0huccS7vh3C6gTiODL+26huuBtbct8eZnqLML8PkxGYpuPZBqtqwkSjgc4mB5gbgig5i+y0UDK35LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">博弈论基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="博弈论概述"><a href="#博弈论概述" class="header-anchor">#</a> 博弈论概述</h2> <h3 id="博弈定义"><a href="#博弈定义" class="header-anchor">#</a> 博弈定义</h3> <p>任何博弈模型都由三个基本要素定义</p> <ul><li>参与者（Players）：做出决策的个体或团体</li> <li>策略（Strategies）：参与者在博弈中可能采取的行动方案</li> <li>收益（Payoffs）：在所有参与者选择特定策略组合后，每个参与者最终得到的结果（如利润、效用等）</li></ul> <p>纳什均衡（Nash Equilibrium）：非合作博弈的解，是一种稳定状态，即在当前策略和参与方上，由于都追求最优收益的限制的一种必然平衡</p> <h3 id="博弈分类"><a href="#博弈分类" class="header-anchor">#</a> 博弈分类</h3> <p>按是否有具有约束力的协议</p> <ul><li>合作博弈（Cooperative Game）：参与者之间可以达成并执行具有约束力的协议</li> <li>非合作博弈（Non-cooperative Game）：参与者之间无法达成或执行有约束力的协议，现代博弈论主要研究此类</li></ul> <p>非合作博弈的核心分类，按照行动顺序和信息结构</p> <table><thead><tr><th style="text-align:left;">博弈类型</th> <th style="text-align:left;">行动顺序</th> <th style="text-align:left;">信息结构</th> <th style="text-align:left;">核心均衡概念</th></tr></thead> <tbody><tr><td style="text-align:left;">完全信息静态博弈</td> <td style="text-align:left;">同时行动</td> <td style="text-align:left;">相互完全了解</td> <td style="text-align:left;">纳什均衡 (Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">完全信息动态博弈</td> <td style="text-align:left;">有先后顺序</td> <td style="text-align:left;">相互完全了解</td> <td style="text-align:left;">子博弈精炼纳什均衡 (Subgame Perfect Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">不完全信息静态博弈</td> <td style="text-align:left;">同时行动</td> <td style="text-align:left;">至少一方信息不完全</td> <td style="text-align:left;">贝叶斯纳什均衡 (Bayesian Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">不完全信息动态博弈</td> <td style="text-align:left;">有先后顺序</td> <td style="text-align:left;">至少一方信息不完全</td> <td style="text-align:left;">精炼贝叶斯纳什均衡 (Perfect Bayesian Nash Equilibrium)</td></tr></tbody></table> <p>其他常见分类</p> <ul><li>按博弈双方利益关系：零和博弈 (Zero-sum Game)（一方的收益恰好是另一方的损失）与非零和博弈 (Non-zero-sum Game)</li> <li>按博弈次数：有限博弈 (Finite Game) 与无限博弈 (Infinite Game)</li></ul> <h2 id="对称博弈"><a href="#对称博弈" class="header-anchor">#</a> 对称博弈</h2> <p>对称博弈 (Symmetric Game)：在对称博弈中，所有参与者是“可互换的”，这意味着参与者拥有完全相同的可选策略，并且对于某个特定策略组合，收益仅取决于你采取了什么行动，而不取决于你是谁</p> <h3 id="囚徒困境"><a href="#囚徒困境" class="header-anchor">#</a> 囚徒困境</h3> <h2 id="非对称博弈"><a href="#非对称博弈" class="header-anchor">#</a> 非对称博弈</h2> <p>非对称博弈 (Asymmetric Game)：博弈的参与方是“不可互换”的，参与者的“地位”不对等，这种不对称可以体现在两个方面</p> <ol><li>策略集不同：参与者可选的行动方案不同</li> <li>收益不同：即使选择完全相同的策略，不同参与者获得的收益也不一样</li></ol> <h3 id="智猪博弈"><a href="#智猪博弈" class="header-anchor">#</a> 智猪博弈</h3> <p>猪圈里有两只猪，一只大猪一支小猪，一个食槽，一个食槽按钮</p> <ul><li>每按一次按钮会消耗两格能量</li> <li>食槽会投入十格能量</li></ul> <p>由于时间差，按按钮的猪会比等在食槽前的猪少吃一个能量，并且大猪吃的比小猪快很多，于是每按一次按钮，有博弈</p> <table><thead><tr><th>智猪博弈</th> <th>小猪按</th> <th>小猪等</th></tr></thead> <tbody><tr><td><strong>大猪按</strong></td> <td><code>(5, 1)</code></td> <td><code>(4, 4)</code></td></tr> <tr><td><strong>大猪等</strong></td> <td><code>(9, -1)</code></td> <td><code>(0, 0)</code></td></tr></tbody></table> <ul><li>对于小猪而言，如果大猪去按，它也去按，只会得到 1 个能量，而不去按会得到 4 个能量，等待更好；同理大猪等，小猪不去按也是更好（<code>0 &gt; -1</code>）</li> <li>而对于大猪而言，小猪按的话，当然等更好，如果不按的话，按更好（<code>4 &gt; 0</code>）</li></ul> <p>所以只要小猪忍着不按，对于大猪而言，按是比不按更好的选择，并且无论如何，小猪等待都是<strong>严格占有策略</strong></p> <p>于是得到纳什均衡：<code>(按, 等)</code></p> <ul><li>大猪明明知道小猪在搭便车，依然不得不承担按按钮的成本，因为对于等待的小猪，按按钮依旧是更优策略，大猪被数学规则逼着承担全部成本</li></ul> <p>当规则让“搭便车”成为最优解时，大猪唯一的解是让食槽彻底空上一阵子，能力强 ≠ 承担更多</p> <h3 id="性别大战"><a href="#性别大战" class="header-anchor">#</a> 性别大战</h3> <h3 id="鹰鸽博弈"><a href="#鹰鸽博弈" class="header-anchor">#</a> 鹰鸽博弈</h3></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/mao/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">历史转折中的</div></a> <!----></div> <div class="page-nav"><p class="inner"><span class="prev">
