全了解</td> <td style="text-align:left;">纳什均衡 (Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">完全信息动态博弈</td> <td style="text-align:left;">有先后顺序</td> <td style="text-align:left;">相互完全了解</td> <td style="text-align:left;">子博弈精炼纳什均衡 (Subgame Perfect Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">不完全信息静态博弈</td> <td style="text-align:left;">同时行动</td> <td style="text-align:left;">至少一方信息不完全</td> <td style="text-align:left;">贝叶斯纳什均衡 (Bayesian Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">不完全信息动态博弈</td> <td style="text-align:left;">有先后顺序</td> <td style="text-align:left;">至少一方信息不完全</td> <td style="text-align:left;">精炼贝叶斯纳什均衡 (Perfect Bayesian Nash Equilibrium)</td></tr></tbody></table> <p>其他常见分类</p> <ul><li>按博弈双方利益关系：零和博弈 (Zero-sum Game)（一方的收益恰好是另一方的损失）与非零和博弈 (Non-zero-sum Game)</li> <li>按博弈次数：有限博弈 (Finite Game) 与无限博弈 (Infinite Game)</li></ul> <h2 id="对称博弈"><a href="#对称博弈" class="header-anchor">#</a> 对称博弈</h2> <p>对称博弈 (Symmetric Game)：在对称博弈中，所有参与者是“可互换的”，这意味着参与者拥有完全相同的可选策略，并且对于某个特定策略组合，收益仅取决于你采取了什么行动，而不取决于你是谁</p> <h3 id="囚徒困境"><a href="#囚徒困境" class="header-anchor">#</a> 囚徒困境</h3> <h2 id="非对称博弈"><a href="#非对称博弈" class="header-anchor">#</a> 非对称博弈</h2> <p>非对称博弈 (Asymmetric Game)：博弈的参与方是“不可互换”的，参与者的“地位”不对等，这种不对称可以体现在两个方面</p> <ol><li>策略集不同：参与者可选的行动方案不同</li> <li>收益不同：即使选择完全相同的策略，不同参与者获得的收益也不一样</li></ol> <h3 id="智猪博弈"><a href="#智猪博弈" class="header-anchor">#</a> 智猪博弈</h3> <p>猪圈里有两只猪，一只大猪一支小猪，一个食槽，一个食槽按钮</p> <ul><li>每按一次按钮会消耗两格能量</li> <li>食槽会投入十格能量</li></ul> <p>由于时间差，按按钮的猪会比等在食槽前的猪少吃一个能量，并且大猪吃的比小猪快很多，于是每按一次按钮，有博弈</p> <table><thead><tr><th>智猪博弈</th> <th>小猪按</th> <th>小猪等</th></tr></thead> <tbody><tr><td><strong>大猪按</strong></td> <td><code>(5, 1)</code></td> <td><code>(4, 4)</code></td></tr> <tr><td><strong>大猪等</strong></td> <td><code>(9, -1)</code></td> <td><code>(0, 0)</code></td></tr></tbody></table> <ul><li>对于小猪而言，如果大猪去按，它也去按，只会得到 1 个能量，而不去按会得到 4 个能量，等待更好；同理大猪等，小猪不去按也是更好（<code>0 &gt; -1</code>）</li> <li>而对于大猪而言，小猪按的话，当然等更好，如果不按的话，按更好（<code>4 &gt; 0</code>）</li></ul> <p>所以只要小猪忍着不按，对于大猪而言，按是比不按更好的选择，并且无论如何，小猪等待都是<strong>严格占有策略</strong></p> <p>于是得到纳什均衡：<code>(按, 等)</code></p> <ul><li>大猪明明知道小猪在搭便车，依然不得不承担按按钮的成本，因为对于等待的小猪，按按钮依旧是更优策略，大猪被数学规则逼着承担全部成本</li></ul> <p>当规则让“搭便车”成为最优解时，大猪唯一的解是让食槽彻底空上一阵子，能力强 ≠ 承担更多</p> <h3 id="性别大战"><a href="#性别大战" class="header-anchor">#</a> 性别大战</h3> <h3 id="鹰鸽博弈"><a href="#鹰鸽博弈" class="header-anchor">#</a> 鹰鸽博弈</h3></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/02, 23:38:19</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/mao/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">历史转折中的</div></a> <!----></div> <div class="page-nav"><p class="inner"><span class="prev">
