</code></pre></div><p>看看他的 compose.yaml</p> <ul><li>一个大象数据库</li> <li>一个 seaweedfs 对象存储</li> <li>初始化 Bucket 一次性任务，用于初始化 MinIO</li> <li>Reactive Resume 主应用，一个基于 NodeJS 的前端进程</li></ul> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">name</span><span class="token punctuation">:</span> reactive_resume

<span class="token key atrule">services</span><span class="token punctuation">:</span>
  <span class="token key atrule">postgres</span><span class="token punctuation">:</span>
    <span class="token key atrule">image</span><span class="token punctuation">:</span> postgres<span class="token punctuation">:</span>latest
    <span class="token key atrule">restart</span><span class="token punctuation">:</span> unless<span class="token punctuation">-</span>stopped
    <span class="token key atrule">networks</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> data_network
    <span class="token key atrule">environment</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> POSTGRES_DB=postgres
      <span class="token punctuation">-</span> POSTGRES_USER=postgres
      <span class="token punctuation">-</span> POSTGRES_PASSWORD=postgres
    <span class="token key atrule">ports</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> <span class="token string">&quot;5432:5432&quot;</span>
    <span class="token key atrule">volumes</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> postgres_data<span class="token punctuation">:</span>/var/lib/postgresql
    <span class="token key atrule">healthcheck</span><span class="token punctuation">:</span>
      <span class="token key atrule">test</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">&quot;CMD&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;pg_isready&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-U&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;postgres&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-d&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;postgres&quot;</span><span class="token punctuation">]</span>
      <span class="token key atrule">start_period</span><span class="token punctuation">:</span> 10s
      <span class="token key atrule">interval</span><span class="token punctuation">:</span> 30s
      <span class="token key atrule">timeout</span><span class="token punctuation">:</span> 10s
      <span class="token key atrule">retries</span><span class="token punctuation">:</span> <span class="token number">3</span>

  <span class="token key atrule">seaweedfs</span><span class="token punctuation">:</span>
    <span class="token key atrule">image</span><span class="token punctuation">:</span> chrislusf/seaweedfs<span class="token punctuation">:</span>latest
    <span class="token key atrule">restart</span><span class="token punctuation">:</span> unless<span class="token punctuation">-</span>stopped
    <span class="token key atrule">command</span><span class="token punctuation">:</span> server <span class="token punctuation">-</span>s3 <span class="token punctuation">-</span>filer <span class="token punctuation">-</span>dir=/data <span class="token punctuation">-</span>ip=0.0.0.0
    <span class="token key atrule">networks</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> storage_network
    <span class="token key atrule">environment</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> AWS_ACCESS_KEY_ID=seaweedfs
      <span class="token punctuation">-</span> AWS_SECRET_ACCESS_KEY=seaweedfs
    <span class="token key atrule">ports</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> <span class="token string">&quot;8333:8333&quot;</span>
    <span class="token key atrule">volumes</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> seaweedfs_data<span class="token punctuation">:</span>/data
    <span class="token key atrule">healthcheck</span><span class="token punctuation">:</span>
      <span class="token key atrule">test</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">&quot;CMD&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wget&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-q&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-O&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/dev/null&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;http://localhost:8888&quot;</span><span class="token punctuation">]</span>
      <span class="token key atrule">start_period</span><span class="token punctuation">:</span> 10s
      <span class="token key atrule">interval</span><span class="token punctuation">:</span> 30s
      <span class="token key atrule">timeout</span><span class="token punctuation">:</span> 10s
      <span class="token key atrule">retries</span><span class="token punctuation">:</span> <span class="token number">3</span>

  <span class="token key atrule">seaweedfs_create_bucket</span><span class="token punctuation">:</span>
    <span class="token key atrule">image</span><span class="token punctuation">:</span> quay.io/minio/mc<span class="token punctuation">:</span>latest
    <span class="token key atrule">restart</span><span class="token punctuation">:</span> on<span class="token punctuation">-</span>failure
    <span class="token key atrule">entrypoint</span><span class="token punctuation">:</span> <span class="token punctuation">&gt;</span><span class="token scalar string">
      /bin/sh -c &quot;
        sleep 5;
        mc alias set seaweedfs http://seaweedfs:8333 seaweedfs seaweedfs;
        mc mb seaweedfs/reactive-resume;
        exit 0;
      &quot;</span>
    <span class="token key atrule">networks</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> storage_network
    <span class="token key atrule">depends_on</span><span class="token punctuation">:</span>
      <span class="token key atrule">seaweedfs</span><span class="token punctuation">:</span>
        <span class="token key atrule">condition</span><span class="token punctuation">:</span> service_healthy

  <span class="token key atrule">reactive_resume</span><span class="token punctuation">:</span>
    <span class="token key atrule">build</span><span class="token punctuation">:</span>
      <span class="token key atrule">context</span><span class="token punctuation">:</span> .
      <span class="token key atrule">dockerfile</span><span class="token punctuation">:</span> Dockerfile
    <span class="token key atrule">networks</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> data_network
      <span class="token punctuation">-</span> storage_network
    <span class="token key atrule">ports</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> <span class="token string">&quot;3000:3000&quot;</span>
    <span class="token key atrule">environment</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> APP_URL=http<span class="token punctuation">:</span>//localhost<span class="token punctuation">:</span><span class="token number">3000</span>
      <span class="token punctuation">-</span> DATABASE_URL=postgresql<span class="token punctuation">:</span>//postgres<span class="token punctuation">:</span>postgres@postgres<span class="token punctuation">:</span>5432/postgres
      <span class="token punctuation">-</span> AUTH_SECRET=change<span class="token punctuation">-</span>me<span class="token punctuation">-</span>to<span class="token punctuation">-</span>a<span class="token punctuation">-</span>secure<span class="token punctuation">-</span>secret<span class="token punctuation">-</span>key<span class="token punctuation">-</span>in<span class="token punctuation">-</span>production
      <span class="token punctuation">-</span> S3_ACCESS_KEY_ID=seaweedfs
      <span class="token punctuation">-</span> S3_SECRET_ACCESS_KEY=seaweedfs
      <span class="token punctuation">-</span> S3_ENDPOINT=http<span class="token punctuation">:</span>//seaweedfs<span class="token punctuation">:</span><span class="token number">8333</span>
      <span class="token punctuation">-</span> S3_BUCKET=reactive<span class="token punctuation">-</span>resume
      <span class="token punctuation">-</span> S3_FORCE_PATH_STYLE=true
    <span class="token key atrule">volumes</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> reactive_resume_data<span class="token punctuation">:</span>/app/data
    <span class="token key atrule">depends_on</span><span class="token punctuation">:</span>
      <span class="token key atrule">postgres</span><span class="token punctuation">:</span>
        <span class="token key atrule">condition</span><span class="token punctuation">:</span> service_healthy
      <span class="token key atrule">seaweedfs_create_bucket</span><span class="token punctuation">:</span>
        <span class="token key atrule">condition</span><span class="token punctuation">:</span> service_completed_successfully
    <span class="token key atrule">healthcheck</span><span class="token punctuation">:</span>
      <span class="token key atrule">test</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">&quot;CMD&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;node&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-e&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;fetch('http://127.0.0.1:3000/api/health').then((r) =&gt; { if (!r.ok) process.exit(1); }).catch(() =&gt; process.exit(1));&quot;</span><span class="token punctuation">]</span>
      <span class="token key atrule">start_period</span><span class="token punctuation">:</span> 10s
      <span class="token key atrule">interval</span><span class="token punctuation">:</span> 30s
      <span class="token key atrule">timeout</span><span class="token punctuation">:</span> 10s
      <span class="token key atrule">retries</span><span class="token punctuation">:</span> <span class="token number">3</span>

<span class="token key atrule">volumes</span><span class="token punctuation">:</span>
  <span class="token key atrule">postgres_data</span><span class="token punctuation">:</span>
  <span class="token key atrule">seaweedfs_data</span><span class="token punctuation">:</span>
  <span class="token key atrule">reactive_resume_data</span><span class="token punctuation">:</span>

<span class="token key atrule">networks</span><span class="token punctuation">:</span>
  <span class="token key atrule">data_network</span><span class="token punctuation">:</span>
  <span class="token key atrule">storage_network</span><span class="token punctuation">:</span>
</code></pre></div><p>一些字段说明</p> <table><thead><tr><th>字段</th> <th>说明</th></tr></thead> <tbody><tr><td><code>name: reactive_resume</code></td> <td>定义了整个 Compose 项目的名称，Docker 会以此作为前缀命名容器、网络、数据卷（如<code>reactive_resume-postgres-1</code>），方便统一管理</td></tr> <tr><td><code>services</code></td> <td>定义所有容器服务</td></tr> <tr><td><code>Volumes</code></td> <td>声明了 3 个数据卷（named volumes）没有指定 driver_opts，使用默认的 local 驱动，容器删除后数据保留，做到数据与容器生命周期分离</td></tr> <tr><td><code>Networks</code></td> <td>声明了 2 个 自定义桥接网络（bridge network），实现网络隔离</td></tr></tbody></table> <p>启动流程</p> <div class="language- extra-class"><pre class="language-text"><code>docker compose up
  │
  ├→ postgres start → health check passed ─────────────┐
  |→ seaweedfs start → health check passed ────────────│
  │     |                                              │
  │     |→ seaweedfs_create_bucket → exit 1 ───────────|
  │                                                    │
  └─────────────────────────────────────► reactive_resume 启动
</code></pre></div><p>再看看他的 Dockerfile</p> <div class="language-dockerfile extra-class"><pre class="language-dockerfile"><code><span class="token comment"># syntax=docker/dockerfile:1.7</span>

<span class="token instruction"><span class="token keyword">ARG</span> NODE_VERSION=24</span>

<span class="token instruction"><span class="token keyword">FROM</span> node:<span class="token variable">${NODE_VERSION}</span>-slim <span class="token keyword">AS</span> base</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>

<span class="token instruction"><span class="token keyword">ENV</span> COREPACK_ENABLE_DOWNLOAD_PROMPT=0 <span class="token operator">\</span>
    PNPM_HOME=<span class="token string">&quot;/pnpm&quot;</span> <span class="token operator">\</span>
    PATH=<span class="token string">&quot;/pnpm:$PATH&quot;</span> <span class="token operator">\</span>
    TURBO_TELEMETRY_DISABLED=1</span>

<span class="token instruction"><span class="token keyword">RUN</span> corepack enable</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> pruner</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm dlx turbo@2.9.9 prune web --docker</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> builder</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span></span> /app/out/json/ ./</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span></span> /app/out/pnpm-lock.yaml ./pnpm-lock.yaml</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm install --frozen-lockfile</span>

<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span></span> /app/out/full/ ./</span>
<span class="token instruction"><span class="token keyword">RUN</span> pnpm turbo run build --filter=web</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> runtime-pruner</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm dlx turbo@2.9.9 prune @reactive-resume/runtime-externals --docker</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> runtime-deps</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">runtime-pruner</span></span> /app/out/json/ ./</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">runtime-pruner</span></span> /app/out/pnpm-lock.yaml ./pnpm-lock.yaml</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm --filter=@reactive-resume/runtime-externals deploy --prod --legacy /runtime-deps</span>

<span class="token instruction"><span class="token keyword">FROM</span> node:<span class="token variable">${NODE_VERSION}</span>-slim <span class="token keyword">AS</span> runtime</span>

<span class="token instruction"><span class="token keyword">LABEL</span> maintainer=<span class="token string">&quot;amruthpillai&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.licenses=<span class="token string">&quot;MIT&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.title=<span class="token string">&quot;Reactive Resume&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.description=<span class="token string">&quot;A free and open-source resume builder.&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.vendor=<span class="token string">&quot;Amruth Pillai&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.url=<span class="token string">&quot;https://rxresu.me&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.documentation=<span class="token string">&quot;https://docs.rxresu.me&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.source=<span class="token string">&quot;https://github.com/amruthpillai/reactive-resume&quot;</span></span>

<span class="token instruction"><span class="token keyword">ENV</span> NODE_ENV=<span class="token string">&quot;production&quot;</span> <span class="token operator">\</span>
    PORT=3000</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>

<span class="token instruction"><span class="token keyword">RUN</span> mkdir -p /app/apps/web /app/data &amp;&amp; chown node:node /app/data</span>

<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">runtime-deps</span> <span class="token property">--chown</span><span class="token punctuation">=</span><span class="token string">node:node</span></span> /runtime-deps/node_modules ./node_modules</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">builder</span> <span class="token property">--chown</span><span class="token punctuation">=</span><span class="token string">node:node</span></span> /app/apps/web/.output ./apps/web/.output</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span> <span class="token property">--chown</span><span class="token punctuation">=</span><span class="token string">node:node</span></span> /app/migrations ./migrations</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app/apps/web</span>

<span class="token instruction"><span class="token keyword">USER</span> node</span>

<span class="token instruction"><span class="token keyword">EXPOSE</span> 3000/tcp</span>
<span class="token instruction"><span class="token keyword">HEALTHCHECK</span> <span class="token options"><span class="token property">--interval</span><span class="token punctuation">=</span><span class="token string">30s</span> <span class="token property">--timeout</span><span class="token punctuation">=</span><span class="token string">10s</span> <span class="token property">--start-period</span><span class="token punctuation">=</span><span class="token string">60s</span> <span class="token property">--retries</span><span class="token punctuation">=</span><span class="token string">3</span></span> <span class="token operator">\</span>
    <span class="token keyword">CMD</span> [<span class="token string">&quot;node&quot;</span>, <span class="token string">&quot;-e&quot;</span>, <span class="token string">&quot;fetch('http://127.0.0.1:3000/api/health').then((r) =&gt; { if (!r.ok) process.exit(1); }).catch(() =&gt; process.exit(1));&quot;</span>]</span>

<span class="token instruction"><span class="token keyword">CMD</span> [<span class="token string">&quot;node&quot;</span>, <span class="token string">&quot;.output/server/index.mjs&quot;</span>]</span>
</code></pre></div><p>在含有<code>Dockerfile</code>和<code>compose.yml</code>的根目录执行</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">docker-compose</span> up <span class="token parameter variable">--build</span> <span class="token parameter variable">-d</span>
</code></pre></div><ul><li><code>docker-compose</code>: 多容器编排工具</li> <li><code>up</code>: 表示启动所有服务</li> <li><code>--build</code>: 表示在启动前强制重新构建服务镜像，如果不加，默认<strong>不会</strong>重新构建镜像，会直接用上次构建好的本地镜像，这是 Docker 的“增量构建”和“缓存重用”机制</li> <li><code>-d</code>：表示后台运行，当命令没有加上<code>-d</code>时，将默认为前台运行，即按下 ctrl c 后，将发送<code>SIGINT</code>给所有容器并关闭</li></ul> <p>Docker 将依次：解析 compose 文件 → 根据 Dockerfile 构建 APP 镜像 → 拉取远程镜像 → 创建网络 → 创建并启动容器 → 日志输出并后台运行</p> <p>这里出现了网络问题，即使我配置了 docker 镜像源，但他这里构建 build 的时候走的是独立的源，并且我开了 tun 还是走不通，只好在根目录下新建一个 .npmrc 强制他走镜像源</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token assign-left variable">registry</span><span class="token operator">=</span>https://registry.npmmirror.com
</code></pre></div><p>启动成功后，查看当前容器组状态，health 即为正常</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">docker-compose</span> <span class="token function">ps</span>
</code></pre></div><p>停止后台的容器组，这会停止并移除容器、网络、默认卷（但不会删除镜像）</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">docker-compose</span> down
</code></pre></div><p>彻底删除卷</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">docker-compose</span> down <span class="token parameter variable">--volumes</span> <span class="token parameter variable">--rmi</span> all
</code></pre></div><h3 id="dockerfile-和-compose-yml"><a href="#dockerfile-和-compose-yml" class="header-anchor">#</a> Dockerfile 和 compose.yml</h3> <p>如何编写 Dockerfile 和 compose.yml，其本质上还是一种标记语言，通过过程式的描述告知 Docker Engine 如何运行容器</p> <h2 id="k3s-基础"><a href="#k3s-基础" class="header-anchor">#</a> K3S 基础</h2> <p>k3s 是 Rancher 推出的轻量级 k8s，最大程度减少了外部依赖，仅需要 kernel 和 cgroup 挂在，内置了少量必要组件，如本地存储提供程序、服务负载均衡器、Helm 和 Traefik Ingress</p> <p>官方文档：<a href="https://docs.k3s.io/zh/" target="_blank" rel="nofollow noopener noreferrer">K3s - 轻量级 Kubernetes | K3s<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="k3d"><a href="#k3d" class="header-anchor">#</a> K3D</h3> <p>K3D（k3s in docker）是 k3s 的一种部署方式，把 k3s 集群打包部署在 Docker 容器中</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/05/09, 01:45:12</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/d1a669/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">分布式搜索引擎</div></a> <a href="/pages/4feb0e/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Linux 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
