eDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">驾驭 AI 编程<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>软件是现实世界的解决方案在数字世界的映射，程序员的工作是将现实世界的解决方案翻译为在数字世界运行的程序代码</p> <h2 id="vibe-编程概述"><a href="#vibe-编程概述" class="header-anchor">#</a> Vibe 编程概述</h2> <p>Vibe Coding 本质就是自然语言驱动 LLM 直接产出可执行代码，软件从 “工程实践” 退化成 “一个想法”，AI 是编程的义肢，并且随着 Agent 的不断发展，人逐渐编程 AI 的义肢，二者的主导关系在慢慢变化</p> <ul><li>从 22 年的 CSDN Coding，到 23 年的 Web Coding，到 24 年的 Agent Coding，到 25 年的 Vibe Coding，再到 26 年的 Harmes Coding，人的存在在不断弱化</li></ul> <p>虽然从效果 / 产出上来看，一个初级工程师更容易达到“中级”的水准，但人类本身能力的增长，似乎变慢了......</p> <h3 id="spec-coding-规约编程"><a href="#spec-coding-规约编程" class="header-anchor">#</a> Spec Coding 规约编程</h3> <p>规约编程（Spec Coding），或者说规范驱动编程（Spec-Driven Development），强调在动手编写代码之前，开发者与 AI 需先共同制定一套关于软件架构、功能边界与业务逻辑的详细规约文档，AI 将严格基于此文档逐点执行开发任务，旨在将 AI 编程从“玄学”拉回“工程学”</p> <table><thead><tr><th>原则</th> <th>解决什么问题</th></tr></thead> <tbody><tr><td>编码前思考</td> <td>错误假设、隐藏困惑、缺少权衡</td></tr> <tr><td>简洁优先</td> <td>过度复杂、臃肿抽象</td></tr> <tr><td>精准修改</td> <td>无关编辑、触碰不应碰的代码</td></tr> <tr><td>目标驱动执行</td> <td>通过测试优先、可验证的成功标准</td></tr></tbody></table> <p><strong>Rules</strong>：约束智能体的需求文档，统一放在项目根目录的 .rules 文件夹中，说白了就是规范 LLM 行为的文档形式的 System Prompt，在以下四个方面对 LLM 进行提示与约束</p> <ul><li>What：代码库干嘛的</li> <li>Where：目录结构如何组织</li> <li>How：场景流程，few shot</li> <li>Should/Not：应该/禁止做什么</li></ul> <p>可以参考 Cursor 内置的 Rules，本质上都是一段 markdown 格式的 User Prompt，通过令 AI 先阅读指定文件再进行操作，进行相对规范的操作</p> <ul><li>单测 rule：<a href="./assets/ut-rules.mdr">unit-test-rules</a></li> <li>代码风格 rule：<a href="./assets/cs.mdr">code-style</a></li></ul> <p><strong>MCP</strong>：模块化的、标准化的、微服务化的工具调用（function call），让 LLM 快速获取某项技能，包括但不限于搜索网页、生成文档、读写文件</p> <p>一些常见的规约</p> <table><thead><tr><th></th> <th>规范</th></tr></thead> <tbody><tr><td>模块化编程</td> <td>1. 驼峰命名保持一致性，如 Id、Uid、Ppt、Pdf，逻辑尽量保持一致<br>2. 将冗余的 if-else 在内部封装，不要在外面堆屎<br>3. 参数往外放，保持业务功能在函数的完整性和模块化，这意味着，每个大写的导出函数，应该具备独立的处理逻辑，不依赖于内部配置，而只依赖外部传参</td></tr> <tr><td>接口设计</td> <td>1. 遵循最小改动原则，按照重量级<br>2. 新增数据库表 ＞ 新插入数据表列 ＞ 在已有 json 字段里新增键值对 ＞ 复用字段<br>3. 新增接口 ＞ 修改 req / rsp + 处理分支</td></tr></tbody></table> <p>例如，可以通过控制入参字段的“空”与“空值”来控制业务层逻辑，通过 protobuf 的包装类 <code>google.protobuf.StringValue</code> 来实现 nil 和空值的区分</p> <p>以下非必须参数，如果不传（为空）将默认不进行修改，若传了但为空值并且在系统中合法，会修改为空值（<code>&quot;&quot; / false</code>）</p> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">必填</th> <th style="text-align:center;">说明</th></tr></thead> <tbody><tr><td style="text-align:center;">envId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">环境 id</td></tr> <tr><td style="text-align:center;">username</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">用户名（英文），例如<code>saulxiong</code>，只有环境拥有者才能通过校验</td></tr> <tr><td style="text-align:center;">envName</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">环境名</td></tr> <tr><td style="text-align:center;">teamEnv</td> <td style="text-align:center;">bool</td> <td style="text-align:center;">否</td> <td style="text-align:center;">标记是否为团队环境，只有 AI 环境能够被设置为 teamEnv，非 AI 容器设置团队环境将报错</td></tr> <tr><td style="text-align:center;">idePath</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">ide 默认打开路径（工作目录）</td></tr> <tr><td style="text-align:center;">ideName</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">默认 ide</td></tr> <tr><td style="text-align:center;">ideVersion</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">ide 版本，可为空值<code>&quot;&quot;</code></td></tr></tbody></table> <p>200 Response，无 err 说明修改结果正常</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>
    <span class="token property">&quot;message&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>亦或者通过 columns 入参决定返回字段</p> <ul><li>POST /env/extra/info</li> <li>columns 必填，若传入字段不支持查询，将自动忽略并返回空</li></ul> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">必填</th> <th style="text-align:center;">说明</th></tr></thead> <tbody><tr><td style="text-align:center;">username</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">用户名（透传，本期不参与鉴权）</td></tr> <tr><td style="text-align:center;">envId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">环境 ID</td></tr> <tr><td style="text-align:center;">columns</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">查询的字段，查询多个字段以 <code>,</code> 或 <code>;</code> 分隔；驼峰小写，如 <code>passEnvId</code></td></tr></tbody></table> <p>当前已支持查询的字段</p> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">中文含义</th></tr></thead> <tbody><tr><td style="text-align:center;">passEnvId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">环境的 pass 层 id</td></tr></tbody></table> <p>返回结果上，想让返回具备无限的扩展能力，放弃使用类型绑定（每次新增字段都要在 proto 结构里新增字段），直接将 <code>map&lt;string, string&gt;</code> 的 kv 存储作为 body 的 data 字段返回</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
  <span class="token property">&quot;message&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;passEnvId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;saulxiong-xxxxxxxxxxx&quot;</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h3 id="workflow-和-loops"><a href="#workflow-和-loops" class="header-anchor">#</a> Workflow 和 Loops</h3> <blockquote><p>数据是 LLM 的血液，工作流是 Agent 的心脏</p></blockquote> <p>常见的开发工作流：需求评审 → 技术评审 → 面向测试开发（TDD，Test-Driven Development）</p> <ul><li>在 TDD 里，人类天然可以充当 QA，完成 AI Coding 的质量闭环</li></ul> <p>Agent Loop 类似于 Audit Agent 的循环审计设计，旨在“完成任务之前持续工作”，在新的概念里引入了 Loop 过程中的“自学习”能力，演化能力是 Agent Loop 的精髓，正如 Robin 所说</p> <p>常见的 Workflow</p> <ul><li>Plan &amp; Execute</li> <li>reAct</li></ul> <h2 id="agent-结对编程"><a href="#agent-结对编程" class="header-anchor">#</a> Agent 结对编程</h2> <p>结对编程最早是 ACM 里的概念，一人编码，一人审查，在结对编程中，编码和审查的角色是随时互换的</p> <h3 id="comate-指南"><a href="#comate-指南" class="header-anchor">#</a> Comate 指南</h3> <blockquote><p>厂内的 Copilot，与 IDE 结合的 AI 编程工具</p></blockquote> <p>人机协同十二原则</p> <ol><li>用注释加强 AI 代码理解：先写注释再编码</li> <li>代码人易懂 ＝ AI 易懂，提升代码可读性：保持代码风格；有意义的命名；代码块粒度合适（150 行左右）；先搭架子再填空</li> <li>留心 AI 能力范围：AI 后台运行，需要定时检查</li> <li>准备私域知识：如优质的 few shot、RAG 等</li> <li>编码前多提问：了解 AI 意图，明确个人需求</li> <li>编码后 AI 审查：让 AI 审查 AI 代码</li> <li>写代码前先澄清：清晰代码意图和功能</li> <li>让 AI 复用和扩展个人能力：插件、MCP、Skills</li> <li>专注于核心业务，杂活全部交给 AI：如复杂的正则表达式</li> <li>不会的、不熟悉的让 AI 帮忙</li> <li>人是驾驶者，AI 是辅助手</li> <li>接受 AI 的不完美</li></ol> <p>常见场景</p> <ul><li>基于注释生成代码（Comment Driven Coding）</li> <li>根据代码生成注释</li> <li>充当搜索引擎</li> <li>单测文件生成</li></ul> <p>使用经验：在拿到一份项目时</p> <p>第一步：开启全局上下文并做全盘扫描在你的 AI 对话框里，确保你已经唤起了读取整个代码库的指令，然后发送这个破冰指令</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code>你现在是一个资深的后端架构师，我已经将整个代码库作为上下文发给了你，请你先不要修改任何代码，只做仔细的阅读和审查。请用中文为我总结这个项目的核心信息

<span class="token list punctuation">1.</span> 这个项目使用的核心技术栈是什么？(包括框架、上下游依赖、状态管理、构建工具等)
<span class="token list punctuation">2.</span> 请梳理并解释目前的目录结构 (如下各个子目录的作用)
<span class="token list punctuation">3.</span> 项目的入口文件和核心路由体系是如何组织的，项目暴露了哪些接口
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>第二步：深挖工程规范与约定</p> <p>等它梳理完骨架后，你需要让它提取项目里的“潜规则”这能保证后续它生成的代码风格与现有代码完全一致，而不是自编自导“非常好</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code>现在请深入到具体的业务代码层面，帮我总结一下目前项目中的编码约定

<span class="token list punctuation">1.</span> 数据请求：项目里是如何封装和接收 HTTP、MCP 或微服务请求的？(是否有统一的工厂处理模式?)
<span class="token list punctuation">2.</span> 数据存储：主要有哪些用户数据，存储在哪里，是否采用了缓存设计？
<span class="token list punctuation">3.</span> 日志处理：是否有统一的日志处理框架，是否用到了消息队列处理日志？
<span class="token list punctuation">4.</span> 有没有我需要特别注意的特殊逻辑或潜在的技术栈？
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>第三步：生成“记忆面包”（沉淀文档）</p> <p>当 AI 完美回答了前两步后，它此时的脑子里包含了这个项目最完整的信息，但只要开启新对话就会遗忘，所以需要让它把这些信息通过文档的方式固化下来</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code>基于你刚才的审查结果，请帮我生成一份详尽的 PROJECT.md 文档，这份文档的目的是：以后当我开启新的 AI 会话时，只要让 AI 读取这个文档，就能立刻了解项目的全局规范和架构，请排版清晰，包含技术栈概览、 目录说明、核心开发规范等关键信息
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>效率小贴士：拿到生成的 PROJECT. md 后，把它保存在项目根目录下，以后每次你想开发新功能，开启一个新的 AI 对话窗口，第一句话就是：“请先阅读 PROJECT. md，然后帮我实现 xxx 功能”，这样写出来代码质量会高得惊人</p> <h3 id="claude-code-和-cc-switch"><a href="#claude-code-和-cc-switch" class="header-anchor">#</a> Claude Code 和 CC Switch</h3> <p>感觉主要还是模型质量影响产出质量，同时必须得支持 Skill 生态，质量和生态，这二者很重要</p> <p>同时发现一个很有意思的事，细看之下，Claude 和文库的后端栈完全一样</p> <ul><li>基础：提供模型能力，对应 API Token 来源，如 GLM5.1</li> <li>策略：工作流编排和智能体循环，对应 Claude 智能体</li> <li>业务：交互逻辑和接口调用，对应 Cli 命令行的交互方式</li></ul> <p>下载 CC Switch：<a href="https://github.com/farion1231/cc-switch/releases/tag/v3.14.1" target="_blank" rel="nofollow noopener noreferrer">Release CC Switch v3.14.1 · farion1231/cc-switch<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>参考文档</p> <ul><li><a href="https://docs.packyapi.com/docs/ccswitch/2-claude.html" target="_blank" rel="nofollow noopener noreferrer">Claude Code 配置 | PackyAPI 使用文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/claude_code" target="_blank" rel="nofollow noopener noreferrer">接入 Claude Code | DeepSeek API Docs<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://platform.deepseek.com/usage" target="_blank" rel="nofollow noopener noreferrer">DeepSeek 开放平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>使用 CC Switch 切换 Claude 的模型，新建 Provider，填写请求地址和 API Key</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>https://api.deepseek.com/anthropic
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>DeepSeek V4 模型配置</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;env&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;ANTHROPIC_AUTH_TOKEN&quot;</span><span class="token operator">:</span> <span class="token string">&quot;api key...&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_BASE_URL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;https://api.deepseek.com/anthropic&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-pro[1m]&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_DEFAULT_OPUS_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-pro[1m]&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_DEFAULT_SONNET_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-pro[1m]&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_DEFAULT_HAIKU_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-flash&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;CLAUDE_CODE_SUBAGENT_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-flash&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;CLAUDE_CODE_EFFORT_LEVEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;max&quot;</span>
  <span class="token punctuation">}</span><span class="token punctuation">,</span>
  <span class="token property">&quot;theme&quot;</span><span class="token operator">:</span> <span class="token string">&quot;dark-daltonized&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>在设置中打开跳过 Claude Code Login，直接启动 Claude，用 /model 可以看到 DS 的四个模型</p> <ul><li>或者使用 <a href="https://github.com/shengcanxu/Reasonix" target="_blank" rel="nofollow noopener noreferrer">shengcanxu/Reasonix<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，更符合 DS 体质的 Native Agent，缓存命中率奇高</li> <li>或者在 CC 中使用 Kimi 2.5：<a href="https://juejin.cn/post/7611432757572141096" target="_blank" rel="nofollow noopener noreferrer">Claude Code 换成了 Kimi K2.5 后 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Claude Code npm 下载</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> <span class="token function">install</span> <span class="token parameter variable">-g</span> @anthropic-ai/claude-code

claude <span class="token parameter variable">--version</span>
claude <span class="token function">install</span>
claude update

<span class="token comment"># 启动 claude 需要开 tun 模式</span>
claude
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>常用命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>/init <span class="token comment"># 初始化仓库 Claude.md</span>
/model <span class="token comment"># 选模型</span>
/effort <span class="token comment"># 努力值</span>
/clear <span class="token comment"># 清除当前记忆</span>
/compact <span class="token comment"># 整理当前对话</span>
/agents  <span class="token comment"># 子 agent</span>
/memory <span class="token comment"># 查看记忆文件</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>基本使用</p> <ol><li>用贵的模型跑 agent.md 理解项目</li> <li>然后用 haiku / sonnet 去执行生成任务</li> <li>plan mode 理解 → agent mode 修改</li></ol> <h3 id="claude-skills"><a href="#claude-skills" class="header-anchor">#</a> Claude Skills</h3> <h4 id="什么是-skill"><a href="#什么是-skill" class="header-anchor">#</a> 什么是 Skill</h4> <blockquote><p>Skill 是 Anthropic 在 25 年 10 月推出的一项革命性功能，它允许 Claude AI 通过读取&quot;技能包&quot;来提升特定任务的执行能力，每个 Skills 相当于一套标准化的智能体接口，提供单独的文档、接口、代码执行能力，通过渐进式披露 SKILL.md 文档进行能力暴露</p> <p>经过大半年的发展到了 26 年 6 月，虽然现在还没有明晰的概念提出，但是 Skill 已经明显区分为两类</p> <ul><li>一种是环内的 skill：给 agent loop 的 skill</li> <li>一种是环外的 skill：与人交互的 skill</li></ul></blockquote> <p>Skill 与 MCP 区别：MCP 需要 JSON-RPC 协议接入并且一次暴露整个 MCP 能力，而 Skills 直接让 LLM 读取 Markdown 文档获取，通过“渐进式披露”提供能力，并且 Markdown 文档较于 MCP 调用更具普适性</p> <p>一个 Skill 的基本结构</p> <div class="language-text line-numbers-mode"><pre class="language-text"><code>skill-name
├── SKILL.md # 定义、描述 skill
├── scripts/ # 具体的可执行代码脚本，其说明在 SKILL 中定义
├── templates/ 文档模板
├── resources/ 资源文件
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>以 <a href="https://github.com/obra/superpowers" target="_blank" rel="nofollow noopener noreferrer">superpower<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 为例</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>/plugin marketplace <span class="token function">add</span> obra/superpowers-marketplace <span class="token comment"># 添加第三方市场</span>
/plugin <span class="token function">install</span> superpowers@superpowers-marketplace <span class="token comment"># 下载 superpowers</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ul><li>这里是通过插件的形式下载，本地文件将放在<code>~/plugins/cache/superpowers-marketplace/superpowers/5.1</code>下（实际上就是 github 仓库的源码），可以看到 Claude.md、Agents.md 等文件，点进 skill 目录，可以看到一个个的 skill 和对应的 skill.md</li> <li>也可以手动导入：将 skills 包 copy 进<code>~/.claude/skills</code>文件夹，Claude 就能够自动渐进式的阅读 Skill 并载入相应内置命令</li></ul> <p>本质上就是一段间进行披露的 markdown 提示词</p> <table><thead><tr><th>Skill 类型</th> <th>收藏</th></tr></thead> <tbody><tr><td>学术</td> <td>1. 科研团队：<a href="https://github.com/Imbad0202/academic-research-skills" target="_blank" rel="nofollow noopener noreferrer">Imbad0202/academic-research-skills: research → write → review → revise → finalize<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>2. 全自动化论文写作：<a href="https://github.com/Zyan0012/ARIS" target="_blank" rel="nofollow noopener noreferrer">Zyan0012/ARIS - Auto-Research-In-Sleep<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>3. 组会、综述报告：<a href="https://github.com/ResearAI/DeepScientist" target="_blank" rel="nofollow noopener noreferrer">ResearAI/DeepScientist<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>4. 面向期刊论文、会议论文、课程或技术报告、综述、竞赛论文的写作任务：<a href="https://github.com/WUBING2023/PaperSpine" target="_blank" rel="nofollow noopener noreferrer">WUBING2023/PaperSpine<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td></tr> <tr><td>开发</td> <td>1. 全流程开发方法论：<a href="https://github.com/obra/superpowers" target="_blank" rel="nofollow noopener noreferrer">obra/superpowers<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>2. 产品开发班子：<a href="https://github.com/garrytan/gstack" target="_blank" rel="nofollow noopener noreferrer">garrytan/gstack: serve as CEO, Designer, Eng Manager, Release Manager, Doc Engineer, and QA<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>3. Matt Pocock 软件工程之魂：<a href="https://github.com/mattpocock/skills" target="_blank" rel="nofollow noopener noreferrer">mattpocock/skills<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>4. 链路梳理 HTML 报告：<a href="https://www.skillhub.cn/skills/saulxiong-html-report" target="_blank" rel="nofollow noopener noreferrer">SkillHub - HTML Report<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>5. 编码范式：<a href="https://github.com/forrestchang/andrej-karpathy-skills" target="_blank" rel="nofollow noopener noreferrer">forrestchang/andrej-karpathy-skills: A single CLAUDE.md file to improve Claude Code behavior, derived from Andrej Karpathy's observations on LLM coding pitfalls.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a><br>6. PUA：<a href="https://github.com/tanweai/pua" target="_blank" rel="nofollow noopener noreferrer">tanweai/pua: 你是一个曾经被寄予厚望的 P8 级工程师，Anthropic 当初给你定级的时候，对你的期望是很高的<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td></tr> <tr><td>其他</td> <td>1. 长篇网文写作：<a href="https://github.com/lingfengQAQ/webnovel-writer" target="_blank" rel="nofollow noopener noreferrer">lingfengQAQ/webnovel-writer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td></tr></tbody></table> <h4 id="构造-skill"><a href="#构造-skill" class="header-anchor">#</a> 构造 Skill</h4> <p>Skill 构造的一些思路</p> <ol><li>用 diff 形式给 llm 示例 shot，例如</li></ol> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token operator">--</span><span class="token operator">-</span> a<span class="token operator">/</span>pkg<span class="token operator">/</span>request<span class="token operator">/</span>client<span class="token punctuation">.</span><span class="token keyword">go</span>
<span class="token operator">++</span><span class="token operator">+</span> b<span class="token operator">/</span>pkg<span class="token operator">/</span>request<span class="token operator">/</span>client<span class="token punctuation">.</span><span class="token keyword">go</span>
@@ <span class="token operator">-</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">7</span> <span class="token operator">+</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">7</span> @@
 <span class="token keyword">package</span> request

<span class="token operator">-</span><span class="token keyword">import</span> oldhttp <span class="token string">&quot;github.com/example/old-http-client&quot;</span>
<span class="token operator">+</span><span class="token keyword">import</span> uhttp <span class="token string">&quot;github.com/example/unified-httpclient&quot;</span>

<span class="token operator">-</span> <span class="token keyword">return</span> oldhttp<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>

<span class="token operator">+</span> <span class="token keyword">return</span> uhttp<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><ol start="2"><li>能用表格就用表格：AI 读表格比读大段文字准确得多，能结构化的信息，尽量用表格呈现</li> <li>前置检查或配置流程比较复杂，写成脚本放到 scripts/ 目录下，SKILL.md 里直接调用就行，例如检查 go、npm、pnpm、codegraph 等等</li> <li>Skill 的水平分割，通过主 Skill 调用子 Skill 的形式模块化 Skill 的能力，严格遵守“渐进式披露”，例如</li></ol> <div class="language- line-numbers-mode"><pre class="language-text"><code>project-migration/                  # 主 Skill：流程总览与编排
├── SKILL.md
└── steps/                          # 拆分出的子步骤文档，主 SKILL.md 按顺序引用
    ├── 00-environment-setup.md
    ├── 01-dependency-update.md
    └── 02-api-migration.md

project-migration-sub-env-setup/    # 子 Skill：可独立调用
├── SKILL.md
└── scripts/
    └── check-env.sh

project-migration-sub-api-migrate/  # 子 Skill：可独立调用
├── SKILL.md
└── references/
    └── api-mapping.json
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>Github 上随处可见创建 Skill 的 Skill，LLM 的生态已经逐渐自旋了（类似编译器的自编译），例如根据 Rules 构造 Skill，只需要一句话就可以直接让 Comate 生成一份 Skill</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>请把这份单测 rules 封装成一个 Claude Code 可以直接使用的 skill
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>Comate 直接把 skill 生成到 ./claude/skills 目录，ducc 不用重启就能动态加载指令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>/go-unit-test-rules
<span class="token comment"># 或者带参数查询特定内容</span>
/go-unit-test-rules <span class="token string">&quot;Mock 规则&quot;</span>
/go-unit-test-rules <span class="token string">&quot;覆盖率&quot;</span>
/go-unit-test-rules <span class="token string">&quot;测试模板&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>其他 Skill 提炼思路</p> <table><thead><tr><th>用途</th> <th>具体任务</th></tr></thead> <tbody><tr><td>内网 Skill</td> <td>1. 解读内网新闻<br>2. 解读知识库内容<br>3. 在内网自动搜索文章<br>4. 内网购物<br>5. 当做网页截图工具<br>6. 写周报</td></tr> <tr><td>作为研发工具</td> <td>1. 生成接口请求 curl，处理 json，类型转换；生成接口调用流程，辅助技术设计<br>2. 在代码库上级目录打开，这样 ai 可以去一次行读取多个代码库，对于查一下涉及上下游的调用的问题和 case 会比较好用，等于串联起完整的链路去分析，问题定位比较准<br>3. 同时开 Claude Code 和 Copilot，商讨技术实现，达到最终一致（Token x2）<br>4. 根据技术评审文档 + 接口文档改造接口并提交 CR，打通了代码仓库和知识库的数据流通和权限管理</td></tr></tbody></table> <h2 id="harmes-编程"><a href="#harmes-编程" class="header-anchor">#</a> Harmes 编程</h2> <blockquote><p>From Coder to Builder</p></blockquote> <p>我逐渐意识到，产品给我们提需求，也是一种 VIbe Coding，我们又何尝不是一种 Agent，甚至说，20~24 年的计算机毕业生是最后一批被代码训练的碳基生物</p> <p>程序员本质上是把现实需求转变为数字世界的语言描述的“翻译者”，在 AI 的加持下，“翻译”工作变得越来越简单，程序员的意义更多在于“信达雅”的翻译，相信 AI 的不断发展，这样的信达雅的优势也会逐渐减少，以及现实需求本身的完善，而不是仅仅做好“翻译”这件事</p> <p>Rules 通过规则 Prompt 约束 Agent 行为，属于 SDD，Harmes 通过严谨的环境条件限制 Agent 行为，属于 BDD</p> <ul><li>SDD（Specification Driven Development）是一种以规范为核心、先写规范再生成代码的开发方法，强调AI辅助下的高效、可控和可追踪的软件开发流程</li> <li>BDD（Behavior-Driven Development）是一种以业务需求为导向的软件开发方法，通过自然语言描述系统行为，促进开发、测试和业务团队的协作</li></ul> <p>在 AI Coding 里，LLM 是发动机，Harness 是车，人是驾驶者，“卧槽你有这么好的车怎么不早告诉我”，从 SDD → BDD → DDD，AI 编程的演化，最终一定是优雅的 DDD 编程</p> <h3 id="结构化搜索与-grep-之争"><a href="#结构化搜索与-grep-之争" class="header-anchor">#</a> 结构化搜索与 grep 之争</h3> <p>AST 语法树构建 Code Graph 和全局 Grep</p> <h3 id="agent-的-伪主动"><a href="#agent-的-伪主动" class="header-anchor">#</a> Agent 的“伪主动”</h3> <p>监听与定时任务，Code Graph 的全局更新</p> <h3 id="harmes-devops-全链路实践"><a href="#harmes-devops-全链路实践" class="header-anchor">#</a> Harmes Devops 全链路实践</h3> <p>通过 Agent + Workspace + Skills 的方式，让 AI 完整的承接真实需求，从需求分析、评审、拉分支、开发、联调到最终的 MR，人工只在最后阶段进行干预和 Review</p></div></div> <!----> <div class="page-edit">
