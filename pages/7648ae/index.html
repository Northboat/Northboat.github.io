vdoing-content content__default"><h2 id="vibe-coding-基础"><a href="#vibe-coding-基础" class="header-anchor">#</a> Vibe Coding 基础</h2> <p>L1 实时补全 → L2 研发助理 → L3 智能体组合 → L4 自然语言编程</p> <ul><li>软件到底是什么？将逐渐变成一个想法，而不是一套代码</li></ul> <h3 id="环境搭建"><a href="#环境搭建" class="header-anchor">#</a> 环境搭建</h3> <blockquote><p>Vibe Coding，本质上就是利用提示词 Prompt 和 LLM 交互获取实现编码逻辑，这里以利用 PyQT 实现一个简易的 Windows 客户端为例（函菌的需求）</p></blockquote> <p>环境</p> <ul><li><a href="https://www.doubao.com/chat" target="_blank" rel="nofollow noopener noreferrer">豆包 - 字节跳动旗下 AI 智能助手<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.python.org/downloads/" target="_blank" rel="nofollow noopener noreferrer">Download Python | Python.org<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://code.visualstudio.com/" target="_blank" rel="nofollow noopener noreferrer">Visual Studio Code - The open source AI code editor<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Cherry Agent：使用系统提示词实现简易的 Agent，免费的 API KEY</p> <ul><li><a href="https://longcat.chat/platform/usage" target="_blank" rel="nofollow noopener noreferrer">美团 LongCat AI<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.siliconflow.cn/me/account/ak" target="_blank" rel="nofollow noopener noreferrer">硅基流动 SiliconCloud<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://open.bigmodel.cn/usercenter/proj-mgmt/apikeys" target="_blank" rel="nofollow noopener noreferrer">智谱 AI 开放平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>IDE 和插件：一手 AI IDE，一手 IDEA，两头抓</p> <ul><li>Google AntiGravity</li> <li>字节 Trae：降智模型</li> <li>京东 JoyCode</li> <li>Claude Code</li> <li>Anysphere Cursor</li> <li>亚马逊 Kiro</li></ul> <p>还有阿里的 Lingma 插件，很不错</p> <h3 id="需求分析与技术选型"><a href="#需求分析与技术选型" class="header-anchor">#</a> 需求分析与技术选型</h3> <p>用户需求由函菌和我人工确定</p> <ul><li>希望实现一个类脚本程序</li> <li>识别 Windows 某一文件夹下的所有文件，根据文件名中的关键字，对文件进行重命名</li> <li>关键字识别和重命名的规则需要能够扩写</li> <li>需要能够在任一 Windows 环境下运行不需要额外环境</li></ul> <p>重命名的规则例如，若文件名含有“日程表”如“国庆放假日程表.docs”，那么需要重命名为“★机密★国庆放假日程表”</p> <h4 id="bat"><a href="#bat" class="header-anchor">#</a> .Bat</h4> <p>根据如上需求，我一开始想要用一个<code>.bat</code>脚本实现，我并不熟悉脚本编程，于是询问</p> <blockquote><p>我想做一个 .bat 脚本文件，它实现如下主要功能</p> <p>1.遍历当前目录下所有文件，识别包含某些关键词的文件
2.将这些识别到的文件进行重命名，重命名的规则如第3点
3.脚本将根据 config.yaml 中的配置进行重命名，其格式如下</p> <p>秘密: 图纸, 实验计划
一般: 日程表</p> <p>那么，当碰到文件&quot;图纸abcdefg.pdf&quot;则将其重命名为&quot;★秘密★图纸abcdefg.pdf&quot;</p> <p>请问这样的功能能单纯靠 bat 脚本实现吗</p></blockquote> <p>豆包进行了核心实现的分析以及一个简化的核心逻辑，于是我向其寻求一个完整的<code>.bat</code>版本实现</p> <blockquote><p>能给我一个 .bat 版本的实现吗</p></blockquote> <p>得到一份<code>.bat</code>文件，然后进行测试，很可惜，报错鸟，先后给了我很多版代码，我依次将报错信息喂给她，始终没解决，于是我放弃了</p> <h4 id="python"><a href="#python" class="header-anchor">#</a> Python</h4> <p>其实我知道如果用 Python 来写，这个逻辑是很好实现的，但是并不确定是否能够兼容任一 Windows 环境，所以首先考虑的是 .bat</p> <p>所以用 Python 的话，最重要的问题是封装成通用的 exe 文件，于是向他询问可行性，豆包给定了一个 Python 方案</p> <blockquote><p>如果需要将功能打包为单文件 EXE（无需依赖环境），使用 Python 实现是更优的选择（通过pyinstaller可轻松打包）。并给了我相应的代码（略）</p></blockquote> <p>很明显，这个方案可行性非常高，pyinstaller 打包之前也用过，那么现在唯一的问题就是<strong>确认代码逻辑的正确性</strong></p> <h3 id="业务逻辑实现"><a href="#业务逻辑实现" class="header-anchor">#</a> 业务逻辑实现</h3> <h4 id="一次误判"><a href="#一次误判" class="header-anchor">#</a> 一次误判</h4> <p>自然的，得到代码后，直接 ctrl cv 新建<code>renamer.py</code>，调出控制台<code>python renamer.py</code>运行</p> <p>当然，因为这份代码是在当前目录下进行修改，需要新建一个文件夹，里面放上几个需要修改的文件，目录大致如下</p> <div class="language- extra-class"><pre class="language-text"><code>新建文件夹
|__今日实验计划.docs
|__明日日程表.pdf
|__车身图纸.pdf
|__renamer.py
|__config.yaml
</code></pre></div><p>然后在这一目录下执行<code>python renamer.py</code>，会修改所有符合规则文件名</p> <p>但是问题出现了，实际并没有修改，我以为是文字匹配的问题，没有识别到相应的文件，于是我问了一下他</p> <blockquote><p>注意，我的要求是，修改所有含有&quot;图纸&quot;这个字符串的文件的，而不是名字为图纸的文件</p></blockquote> <p>他给我的回答是没有问题，并贴出来了关键的实现代码</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token comment"># 检查文件名是否包含任意分组的关键词</span>
<span class="token keyword">for</span> group<span class="token punctuation">,</span> keywords <span class="token keyword">in</span> config<span class="token punctuation">.</span>items<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">for</span> keyword <span class="token keyword">in</span> keywords<span class="token punctuation">:</span>
        <span class="token comment"># 核心逻辑：判断关键词是否&quot;包含&quot;在文件名中</span>
        <span class="token keyword">if</span> keyword <span class="token keyword">in</span> filename<span class="token punctuation">:</span>
            new_filename <span class="token operator">=</span> <span class="token string-interpolation"><span class="token string">f&quot;★</span><span class="token interpolation"><span class="token punctuation">{</span>group<span class="token punctuation">}</span></span><span class="token string">★</span><span class="token interpolation"><span class="token punctuation">{</span>filename<span class="token punctuation">}</span></span><span class="token string">&quot;</span></span>
            <span class="token comment"># 避免重复添加前缀（如果已重命名过）</span>
            <span class="token keyword">if</span> new_filename <span class="token operator">==</span> filename<span class="token punctuation">:</span>
                <span class="token keyword">break</span>
                <span class="token comment"># 执行重命名</span>
                os<span class="token punctuation">.</span>rename<span class="token punctuation">(</span>filename<span class="token punctuation">,</span> new_filename<span class="token punctuation">)</span>
                <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string-interpolation"><span class="token string">f&quot;已重命名：</span><span class="token interpolation"><span class="token punctuation">{</span>filename<span class="token punctuation">}</span></span><span class="token string"> → </span><span class="token interpolation"><span class="token punctuation">{</span>new_filename<span class="token punctuation">}</span></span><span class="token string">&quot;</span></span><span class="token punctuation">)</span>
                <span class="token keyword">break</span>  <span class="token comment"># 匹配到一个关键词后，跳出当前分组的关键词循环</span>
                <span class="token keyword">else</span><span class="token punctuation">:</span>
                    <span class="token keyword">continue</span>  <span class="token comment"># 当前分组未匹配，继续下一分组</span>
                    <span class="token keyword">break</span>  <span class="token comment"># 已匹配并重命名，跳出所有分组循环</span>
</code></pre></div><p>我浅略看了一下，确实没有问题，然后我开始手动排错，结果发现有一行代码会稳定触发</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">if</span> <span class="token keyword">not</span> <span class="token builtin">isinstance</span><span class="token punctuation">(</span>keywords<span class="token punctuation">,</span> <span class="token builtin">list</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">continue</span>  <span class="token comment"># 确保关键词是列表格式</span>
</code></pre></div><p>然后我直接问了 AI 上面这段代码会稳定触发，什么情况，而后找到了关键信息</p> <blockquote><p>关键修复
兼容非列表格式：即使 config.yaml 中关键词未用列表格式（如未加 -），也会自动转为列表（例如 图纸 会转为 [图纸]），避免触发类型判断错误。</p></blockquote> <p>我了个大草，我的 config.yaml 是手写的，没有加<code>-</code>，就是说配置文件解析不了，自然无法正确的重命名，而后我修改了 config.yaml</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">秘密</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> 图纸
  <span class="token punctuation">-</span> 实验计划
<span class="token key atrule">一般</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> 日程表
</code></pre></div><p>再测试，当前目录下的三个文件都正常修改为我想要的格式</p> <h4 id="逻辑修正"><a href="#逻辑修正" class="header-anchor">#</a> 逻辑修正</h4> <p>我进行了进一步的测试，由于需求要求是一级目录下的所有文件，所以我又在根目录新建了一个文件夹</p> <div class="language- extra-class"><pre class="language-text"><code>新建文件夹
|__今日实验计划.docs
|__明日日程表.pdf
|__车身图纸.pdf
|__renamer.py
|__config.yaml
|__新建文件夹
	|__今日实验计划.docs
	|__明日日程表.pdf
	|__车身图纸.pdf
</code></pre></div><p>再测试，发现第一层的文件修改了，而子目录中未修改，我知道逻辑出了问题，于是跟 AI 再次强调需求</p> <blockquote><p>ok，当前目录下没有问题，但是我的需求实际上是，当前 root 作为一个根目录，要遍历这个根目录下的所有文件，也就是说，例如二级目录 root/subroot/ 下的所有文件也都得修改</p></blockquote> <p>这里采用了一个简单的 one-shot 提示，用一个例子来说明需求，而后他给定了一版更正的代码</p> <blockquote><p>需要遍历根目录下的所有子目录（包括多级目录） 并处理其中的文件，只需在原有代码基础上添加递归遍历逻辑即可。以下是实现方案（略）</p></blockquote> <p>这一版非常不错，基本实现了我的需求</p> <p>经过不断的测试，同样发现了一个小问题，那就是他读取配置文件的时候，找到是需要更改的文件夹根目录的配置文件，而不是应用程序根目录的配置文件，这不是我想要的</p> <blockquote><p>发现一个逻辑问题，打开的config.yaml应该是当前.py文件或者说exe文件的同级目录下的config.yaml，而不是待处理根目录下的config.yaml</p></blockquote> <h4 id="异常处理"><a href="#异常处理" class="header-anchor">#</a> 异常处理</h4> <p>事情看上去好像非常顺利，但马上就出现了新的问题，我在根目录下连续执行两次程序，就会出现<code>★机密★★机密★国庆放假日程表</code></p> <ul><li>对于已经修改过的文件，不应该多次修改</li></ul> <p>我稍微想了一下，如果是我自己编码实现，我会检测头几个字符串，如果是带★号的，就跳过，但马上意识到了问题，如果我的配置文件更改，想把机密改成秘密，就不应该跳过，而是重写，算了，不想这么多了，直接丢给 AI 解决就行了</p> <blockquote><p>还有一个问题需要处理，比如，我的文件已经被处理过一次为★秘密★泪桥实验计划.docx，现在我修改配置文件要把&quot;实验计划&quot;改为&quot;一般&quot;，当这个脚本再次执行时，应该识别到他的前缀★秘密★，修改为★一般★泪桥实验计划.docx，而不是★一般★★秘密★泪桥实验计划.docx</p></blockquote> <p>豆包给了完整的解释和方案</p> <blockquote><p>需要处理<strong>已添加前缀的文件</strong>，确保再次执行时能更新前缀而非重复添加。核心逻辑是：先移除旧前缀，再添加新前缀。以下是实现方案，略</p></blockquote> <p>非常不错，完美的实现了我的需求</p> <h4 id="日志输出"><a href="#日志输出" class="header-anchor">#</a> 日志输出</h4> <p>和李函君对过需求，需要有一些统计信息的输出，例如</p> <ul><li>总共有多少文件</li> <li>修改了多少文件</li> <li>修改文件的路径</li> <li>未修改文件的路径</li></ul> <p>在测试代码的途中我就发现，他会 print 输出一些信息，于是提出以上需求，同样的给了我一版代码，日志将以以下形式写在当前根目录的 work.log 中</p> <div class="language- extra-class"><pre class="language-text"><code>[2023-10-19 10:23:45] 日志开始
[2023-10-19 10:23:45] 开始处理根目录：C:\test（包括所有子目录）
[2023-10-19 10:23:46] 已更新：C:\test\泪桥实验计划.docx → C:\test\★一般★泪桥实验计划.docx
[2023-10-19 10:23:46] 已更新：C:\test\文件夹A\图纸.pdf → C:\test\文件夹A\★秘密★图纸.pdf

===== 处理统计 =====
[2023-10-19 10:23:47] 总扫描文件数：5

[2023-10-19 10:23:47] 未修改文件数：3
[2023-10-19 10:23:47] 
[2023-10-19 10:23:47] 未修改的文件路径：
[2023-10-19 10:23:47] - C:\test\readme.txt
[2023-10-19 10:23:47] - C:\test\文件夹B\数据.csv
[2023-10-19 10:23:47] - C:\test\文件夹A\图像.png
[2023-10-19 10:23:47] ====================
[2023-10-19 10:23:47] 处理完成
</code></pre></div><p>挺好，是我想要的结果</p> <h4 id="exe-封装"><a href="#exe-封装" class="header-anchor">#</a> exe 封装</h4> <p>比较关键的一步，涉及到一个关键的环境适配问题（要求能够在任意 win 设备上运行）</p> <p>由于之前他已经给过我打包的命令</p> <div class="language-sh extra-class"><pre class="language-sh"><code>pyinstaller <span class="token parameter variable">--onefile</span> <span class="token parameter variable">--console</span> file_renamer.py
</code></pre></div><p>我直接在根目录执行，发生报错，核心问题是没找到 pyinstaller 这个包，直接把报错甩给 AI，得到</p> <blockquote><p>从你的的输出可知，pyinstaller 安装在：c:\users\northboat\appdata\roaming\python\python310\site-packages
但实际可执行文件 pyinstaller.exe 通常在同级的 Scripts 目录下，完整路径为：c:\users\northboat\appdata\roaming\python\python310\Scripts\pyinstaller.exe
步骤 2：直接使用完整路径执行打包命令
在 PowerShell 中输入以下命令（复制粘贴路径时注意检查是否正确）：
&amp; &quot;c:\users\northboat\appdata\roaming\python\python310\scripts\pyinstaller.exe&quot; --onefile --console renamer.py
若路径正确，会直接开始打包，生成的 exe 在 dist 目录中。</p></blockquote> <p>我找到了关键的一条命令，看起来非常靠谱</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token operator">&amp;</span> <span class="token string">&quot;c:\users<span class="token entity" title="\n">\n</span>orthboat<span class="token entity" title="\a">\a</span>ppdata<span class="token entity" title="\r">\r</span>oaming\python\python310\scripts\pyinstaller.exe&quot;</span> <span class="token parameter variable">--onefile</span> <span class="token parameter variable">--console</span> renamer.py
</code></pre></div><p>而后在根目录执行，报错了，但显然找到了 pyinstaller，是其他的错，依旧甩报错，得到<code>pathlib</code>这个包和<code>pyinstaller</code>不兼容的信息</p> <p>OK，我直接把 pathlib 给卸了</p> <div class="language-sh extra-class"><pre class="language-sh"><code>pip uninstall pathlib
</code></pre></div><p>再打包，成功了，得到了第一版的命令行 exe 程序，发给了李函君</p> <h4 id="扩展需求"><a href="#扩展需求" class="header-anchor">#</a> 扩展需求</h4> <p>通过 input 指定根目录：这里问了两次，第一次的指定给我的代码是在代码里硬编码目录，并不是我想要的效果，于是重新强调需求得到一份完整代码，并测试通过</p> <p>获取一个 GUI 界面：对预想的 UI 进行描述，比如几个框、几个按钮，什么风格，并且通过 pyqt 实现，记得下包<code>pip install pyqt6 --upgrade</code>，再进行一些 UI 细节调整</p> <p>启动时的警告：在项目启动时，会报五个 Unknown property cursor</p> <p>加 ICON：非常不错，我现在想给这个程序加一个 logo，即 icon；还有一个小问题，就是这个icon是程序左上角的图标，但在windows打开后，其在任务栏的图标仍是空白，能同步修改吗</p> <p>重新打包：最后的 BUG，点击修改配置文件按钮，若未创建文件，因为代码中 <code>default_config</code> 变量的作用域问题（在异常捕获块外未定义），将会使用写成一个空的配置文件</p> <h3 id="代码和文档"><a href="#代码和文档" class="header-anchor">#</a> 代码和文档</h3> <p>命令行版本：<a href="https://github.com/Northboat/XDU-Learning/blob/main/AI-Learning/vibe-coding/renamer/renamer_v1/renamer.py" target="_blank" rel="nofollow noopener noreferrer">XDU-Learning/AI-Learning/vibe-coding/renamer/renamer_v1/renamer.py at main · Northboat/XDU-Learning<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>GUI 版本：<a href="https://github.com/Northboat/XDU-Learning/blob/main/AI-Learning/vibe-coding/renamer/renamer_v2/renamer_gui.py" target="_blank" rel="nofollow noopener noreferrer">XDU-Learning/AI-Learning/vibe-coding/renamer/renamer_v2/renamer_gui.py at main · Northboat/XDU-Learning<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>文档编写：<a href="https://github.com/Northboat/XDU-Learning/blob/main/AI-Learning/vibe-coding/renamer/README.md" target="_blank" rel="nofollow noopener noreferrer">XDU-Learning/AI-Learning/vibe-coding/renamer/README.md at main · Northboat/XDU-Learning<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>很简单，一句话的事：“帮我写一份README.md，介绍他的功能和使用方法，以及开发的技术栈和关键步骤”</li></ul> <h2 id="comate-使用指南"><a href="#comate-使用指南" class="header-anchor">#</a> Comate 使用指南</h2> <blockquote><p>数据是 LLM 的血液</p></blockquote> <p>AI 的辅助领域：自动化流程 → 研发助理（当前阶段）→ 交付智能体</p> <h3 id="pair-coding-方法论"><a href="#pair-coding-方法论" class="header-anchor">#</a> Pair Coding 方法论</h3> <p>结对编程即，一人编码，一人审查，在结对编程中，编码和审查的角色是随时互换的</p> <p>人机协同十二原则</p> <ol><li>用注释加强 AI 代码理解：先写注释再编码</li> <li>代码人易懂 ＝ AI 易懂，提升代码可读性
<ul><li>保持代码风格</li> <li>有意义的命名</li> <li>代码块粒度合适（150 行左右）</li> <li>先搭架子再填空</li></ul></li> <li>留心 AI 能力范围：AI 后台运行，需要定时检查</li> <li>准备私域知识：如优质的 few shot、RAG 等</li> <li>编码前多提问：了解 AI 意图，明确个人需求</li> <li>编码后 AI 审查：让 AI 审查 AI 代码</li> <li>写代码前先澄清：清晰代码意图和功能</li> <li>让 AI 复用和扩展个人能力：插件、MCP、Skills</li> <li>专注于核心业务，杂活全部交给 AI：如复杂的正则表达式</li> <li>不会的、不熟悉的让 AI 帮忙</li> <li>人是驾驶者，AI 是辅助手</li> <li>接受 AI 的不完美</li></ol> <p>常见场景</p> <ul><li>基于注释生成代码（Comment Driven Coding）</li> <li>根据代码生成注释</li> <li>充当搜索引擎</li> <li>单测文件生成</li></ul> <h3 id="rule-约束"><a href="#rule-约束" class="header-anchor">#</a> Rule 约束</h3> <p>Rules：约束智能体的需求文档</p> <ul><li>What：代码库干嘛的</li> <li>Where：目录结构如何组织</li> <li>How：场景流程，few shot</li> <li>Should/Not：应该/禁止做什么</li></ul> <p>可以参考 Cursor 内置的 Rules，本质上都是一段 markdown 格式的 User Prompt，将 rules 文件统一放在项目根目录的 .rules 文件夹中，通过提示 comate 先阅读指定文件再进行操作，即可实现相应目标</p> <p>单测 rule：<a href="./assets/ut-rules.mdr">unit-test-rules</a></p> <p>代码风格 rule：<a href="./assets/cs.mdr">code-style</a></p> <h3 id="claude-skills-技能"><a href="#claude-skills-技能" class="header-anchor">#</a> Claude Skills 技能</h3> <p>Anthropic 在 25 年 10 月推出的一项革命性功能，它允许 Claude AI 通过加载专业化的&quot;技能包&quot;来提升特定任务的执行能力</p> <p>Skills 相当于一套标准化的智能体接口，每个 Skill 单独提供文档、接口、代码执行能力，主线程 LLM 通过 Markdown 文档进行动态的能力接入</p> <ul><li>能力 ≠ 工具，这是和 MCP 的主要区别，这里的能力更像一系列工具的聚合体</li> <li>其本质上，是一套由 Markdown 描述的 Agent <strong>工作流</strong></li></ul> <p>一个 Skill 的基本结构如下</p> <div class="language-text extra-class"><pre class="language-text"><code>skill-name
├── SKILL.md # 定义、描述 skill
├── reference.md # 定义依赖
├── scripts/ # 具体的可执行代码脚本，其说明在 SKILL 中定义
</code></pre></div><p>一个 Skill 示例，这是一个用于网页项目测试的 Skill.md</p> <ul><li><a href="https://github.com/anthropics/skills/blob/main/skills/webapp-testing/SKILL.md" target="_blank" rel="nofollow noopener noreferrer">webapp-testing/SKILL.md at main · anthropics/skills<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在其中，定义了决策流程，工具使用手册和一些注意事项，而后在 scripts 包中给了具体的执行脚本用于测试网页</p> <ul><li><a href="https://github.com/anthropics/skills/blob/main/skills/webapp-testing/scripts/with_server.py" target="_blank" rel="nofollow noopener noreferrer">webapp-testing/scripts/with_server.py at main · anthropics/skills<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在主线程中，LLM 通过阅读 Skill.md 学习使用这个 Skill 功能，相当于 MCP 的升级，从工具的调用到 “Agent 的调用”</p> <p>一些优质的 Skills 库</p> <ol><li><a href="https://github.com/anthropics/skills" target="_blank" rel="nofollow noopener noreferrer">anthropics/skills<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/ComposioHQ/awesome-claude-skills" target="_blank" rel="nofollow noopener noreferrer">awesome-claude-skills<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ol> <p>在实际使用中，将 skills 包放在项目根目录的 .skills 文件夹，同样通过提示 comate 去阅读 skill 掌握对应技能，加强 pair coding</p> <h2 id="open-code-使用指南"><a href="#open-code-使用指南" class="header-anchor">#</a> Open Code 使用指南</h2></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/5b4468/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">基于 SKLearn 的分类器训练验证</div></a> <a href="/pages/108f08/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">智能体开发理论、应用与实践</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
