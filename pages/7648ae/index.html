ntColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Cherry Agent：使用系统提示词实现简易的 Agent，免费的 API KEY</p> <ul><li><a href="https://longcat.chat/platform/usage" target="_blank" rel="nofollow noopener noreferrer">美团 LongCat AI<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.siliconflow.cn/me/account/ak" target="_blank" rel="nofollow noopener noreferrer">硅基流动 SiliconCloud<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://open.bigmodel.cn/usercenter/proj-mgmt/apikeys" target="_blank" rel="nofollow noopener noreferrer">智谱 AI 开放平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>IDE 和插件：一手 AI IDE，一手 IDEA，两头抓</p> <ul><li>Google AntiGravity</li> <li>字节 Trae：降智模型</li> <li>京东 JoyCode</li> <li>Claude Code</li> <li>Anysphere Cursor</li> <li>亚马逊 Kiro</li></ul> <p>还有阿里的 Lingma 插件，很不错</p> <h3 id="需求分析与技术选型"><a href="#需求分析与技术选型" class="header-anchor">#</a> 需求分析与技术选型</h3> <p>用户需求由函菌和我人工确定</p> <ul><li>希望实现一个类脚本程序</li> <li>识别 Windows 某一文件夹下的所有文件，根据文件名中的关键字，对文件进行重命名</li> <li>关键字识别和重命名的规则需要能够扩写</li> <li>需要能够在任一 Windows 环境下运行不需要额外环境</li></ul> <p>重命名的规则例如，若文件名含有“日程表”如“国庆放假日程表.docs”，那么需要重命名为“★机密★国庆放假日程表”</p> <h4 id="bat"><a href="#bat" class="header-anchor">#</a> .Bat</h4> <p>根据如上需求，我一开始想要用一个<code>.bat</code>脚本实现，我并不熟悉脚本编程，于是询问</p> <blockquote><p>我想做一个 .bat 脚本文件，它实现如下主要功能</p> <p>1.遍历当前目录下所有文件，识别包含某些关键词的文件
2.将这些识别到的文件进行重命名，重命名的规则如第3点
3.脚本将根据 config.yaml 中的配置进行重命名，其格式如下</p> <p>秘密: 图纸, 实验计划
一般: 日程表</p> <p>那么，当碰到文件&quot;图纸abcdefg.pdf&quot;则将其重命名为&quot;★秘密★图纸abcdefg.pdf&quot;</p> <p>请问这样的功能能单纯靠 bat 脚本实现吗</p></blockquote> <p>豆包进行了核心实现的分析以及一个简化的核心逻辑，于是我向其寻求一个完整的<code>.bat</code>版本实现</p> <blockquote><p>能给我一个 .bat 版本的实现吗</p></blockquote> <p>得到一份<code>.bat</code>文件，然后进行测试，很可惜，报错鸟，先后给了我很多版代码，我依次将报错信息喂给她</p> <blockquote><p>我测试了一下你的脚本，执行并没有成功，命令行输出：C:\Users\northboat\Desktop\新建文件夹&gt;rename.bat
此时不应有 |。</p> <p>报错：此时不应有 &quot; } }&quot;')。</p> <p>报错：命令语法不正确。</p> <p>报错：此时不应有 foreach。</p> <p>报错：'Where-Object' 不是内部或外部命令，也不是可运行的程序
或批处理文件。</p></blockquote> <p>于是我放弃了</p> <h4 id="python"><a href="#python" class="header-anchor">#</a> Python</h4> <p>其实我知道如果用 Python 来写，这个逻辑是很好实现的，但是并不确定是否能够兼容任一 Windows 环境，所以首先考虑的是 .bat</p> <p>所以用 Python 的话，最重要的问题是封装成通用的 exe 文件，于是向他询问</p> <blockquote><p>算了，我改变一下需求，我最终想把这个逻辑当作一个可以直接执行的 exe 文件，可以采用 python 或 java 编写，但是最后要转成一个不需要依赖任何环境的 exe 文件即可</p></blockquote> <p>豆包给定了一个 Python 方案</p> <blockquote><p>如果需要将功能打包为单文件 EXE（无需依赖环境），使用 Python 实现是更优的选择（通过pyinstaller可轻松打包）。并给了我相应的代码（略）</p></blockquote> <p>很明显，这个方案可行性非常高，pyinstaller 打包之前也用过，那么现在唯一的问题就是<strong>确认代码逻辑的正确性</strong></p> <h3 id="业务逻辑实现"><a href="#业务逻辑实现" class="header-anchor">#</a> 业务逻辑实现</h3> <h4 id="一次误判"><a href="#一次误判" class="header-anchor">#</a> 一次误判</h4> <p>自然的，得到代码后，直接 ctrl cv 新建<code>renamer.py</code>，调出控制台<code>python renamer.py</code>运行</p> <p>当然，因为这份代码是在当前目录下进行修改，需要新建一个文件夹，里面放上几个需要修改的文件，目录大致如下</p> <div class="language- extra-class"><pre class="language-text"><code>新建文件夹
|__今日实验计划.docs
|__明日日程表.pdf
|__车身图纸.pdf
|__renamer.py
|__config.yaml
</code></pre></div><p>然后在这一目录下执行<code>python renamer.py</code>，会修改所有符合规则文件名</p> <p>但是问题出现了，实际并没有修改，我以为是文字匹配的问题，没有识别到相应的文件，于是我问了一下他</p> <blockquote><p>注意，我的要求是，修改所有含有&quot;图纸&quot;这个字符串的文件的，而不是名字为图纸的文件</p></blockquote> <p>他给我的回答是没有问题，并贴出来了关键的实现代码</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token comment"># 检查文件名是否包含任意分组的关键词</span>
<span class="token keyword">for</span> group<span class="token punctuation">,</span> keywords <span class="token keyword">in</span> config<span class="token punctuation">.</span>items<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">for</span> keyword <span class="token keyword">in</span> keywords<span class="token punctuation">:</span>
        <span class="token comment"># 核心逻辑：判断关键词是否&quot;包含&quot;在文件名中</span>
        <span class="token keyword">if</span> keyword <span class="token keyword">in</span> filename<span class="token punctuation">:</span>
            new_filename <span class="token operator">=</span> <span class="token string-interpolation"><span class="token string">f&quot;★</span><span class="token interpolation"><span class="token punctuation">{</span>group<span class="token punctuation">}</span></span><span class="token string">★</span><span class="token interpolation"><span class="token punctuation">{</span>filename<span class="token punctuation">}</span></span><span class="token string">&quot;</span></span>
            <span class="token comment"># 避免重复添加前缀（如果已重命名过）</span>
            <span class="token keyword">if</span> new_filename <span class="token operator">==</span> filename<span class="token punctuation">:</span>
                <span class="token keyword">break</span>
                <span class="token comment"># 执行重命名</span>
                os<span class="token punctuation">.</span>rename<span class="token punctuation">(</span>filename<span class="token punctuation">,</span> new_filename<span class="token punctuation">)</span>
                <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string-interpolation"><span class="token string">f&quot;已重命名：</span><span class="token interpolation"><span class="token punctuation">{</span>filename<span class="token punctuation">}</span></span><span class="token string"> → </span><span class="token interpolation"><span class="token punctuation">{</span>new_filename<span class="token punctuation">}</span></span><span class="token string">&quot;</span></span><span class="token punctuation">)</span>
                <span class="token keyword">break</span>  <span class="token comment"># 匹配到一个关键词后，跳出当前分组的关键词循环</span>
                <span class="token keyword">else</span><span class="token punctuation">:</span>
                    <span class="token keyword">continue</span>  <span class="token comment"># 当前分组未匹配，继续下一分组</span>
                    <span class="token keyword">break</span>  <span class="token comment"># 已匹配并重命名，跳出所有分组循环</span>
</code></pre></div><p>我浅略看了一下，确实没有问题，然后我开始手动排错，结果发现有一行代码会稳定触发</p> <div class="language-python extra-class"><pre class="language-python"><code><span class="token keyword">if</span> <span class="token keyword">not</span> <span class="token builtin">isinstance</span><span class="token punctuation">(</span>keywords<span class="token punctuation">,</span> <span class="token builtin">list</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
