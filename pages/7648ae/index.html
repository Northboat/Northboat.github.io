G/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">AI 编程范式<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>从 AI 辅助人到人辅助 AI 编码，我不得不反思，写代码这样的工作是否硅基生命天然优于碳基生物</p> <h2 id="vibe-coding-基础"><a href="#vibe-coding-基础" class="header-anchor">#</a> Vibe Coding 基础</h2> <p>Vibe Coding 本质就是用自然语言驱动 LLM 直接产出可运行代码，软件从 “手写工程” 退化成 “一个想法”，AI 是编程义肢，并且随着 Agent 的不断发展，人逐渐编程 AI 的义肢，二者的主导关系在随时变化</p> <ul><li>AI 辅助进化路线：自动化流程 → 研发助理 → 智能体交付</li> <li>Vibe Coding 分级：L1 实时补全 → L2 研发助理 → L3 智能体组合 → L4 自然语言编程</li></ul> <p>工具链</p> <ul><li>编码：Chat GPT、Cherry Studio、VS Code、Python</li> <li>模型 API：硅基流动、智谱</li> <li>提问范式：使用角色定义 + Plan &amp; Execute + Few Shot 提需</li></ul> <h3 id="需求与技术评审"><a href="#需求与技术评审" class="header-anchor">#</a> 需求与技术评审</h3> <p>用户需求：由函菌和我人工确定</p> <ul><li>希望实现一个类脚本程序</li> <li>识别 Windows 某一文件夹下的所有文件，根据文件名中的关键字，对文件进行重命名</li> <li>关键字识别和重命名的规则需要能够扩写</li> <li>需要能够在任一 Windows 环境下运行不需要额外环境</li></ul> <p>重命名的规则例如，若文件名含有“日程表”如“国庆放假日程表.docs”，那么需要重命名为“★机密★国庆放假日程表”</p> <p>根据如上需求，我一开始想要用一个<code>.bat</code>脚本实现，我并不熟悉脚本编程，于是询问</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>我想做一个 .bat 脚本文件，它实现如下主要功能

1.遍历当前目录下所有文件，识别包含某些关键词的文件
2.将这些识别到的文件进行重命名，重命名的规则如第3点
3.脚本将根据 config.yaml 中的配置进行重命名

配置文件格式如下
秘密:
  <span class="token list punctuation">-</span> 图纸
  <span class="token list punctuation">-</span> 实验计划
一般:
  <span class="token list punctuation">-</span> 日程表

上述规则对于文件 &quot;图纸abcdefg.pdf&quot; 则会被重命名为 &quot;★秘密★图纸abcdefg.pdf&quot;

请问这样的功能能单纯靠 bat 脚本实现吗
</code></pre></div><p>豆包进行了核心实现的分析以及一个简化的核心逻辑，于是我向其寻求一个完整的<code>.bat</code>版本实现</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>能给我一个 .bat 版本的实现吗
</code></pre></div><p>得到一份<code>.bat</code>文件，然后进行测试，很可惜，报错鸟，先后给了我很多版代码，我依次将报错信息喂给她，始终没解决，于是我放弃了</p> <p>其实我知道如果用 Python 来写，这个逻辑是很好实现的，但有系统的适配性问题</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>如果需要将功能打包为单文件 EXE（无需依赖环境），使用 Python 实现是更优的选择（通过pyinstaller可轻松打包）
</code></pre></div><p>豆包给了我一版代码，很明显，这个方案可行性很高，pyinstaller 打包之前也用过，那么现在唯一的问题就是<strong>确认代码逻辑的正确性</strong></p> <h3 id="面向测试开发"><a href="#面向测试开发" class="header-anchor">#</a> 面向测试开发</h3> <p>因为开发任务全由 AI 承担（RD），我们充当 QA 的角色为其验证并提供修复需求即可，现在来看，可以让 AI 自己生成测试用例 Cases，然后让他自测，测试通过再返回，实现开发闭环</p> <h4 id="逻辑验证"><a href="#逻辑验证" class="header-anchor">#</a> 逻辑验证</h4> <p>对于同一文件夹种的文件进行重命名测试，没有问题，能够按照我想要版本进行修改，但对于深层文件夹如</p> <div class="language- extra-class"><pre class="language-text"><code>新建文件夹
|__今日实验计划.docs
|__明日日程表.pdf
|__车身图纸.pdf
|__renamer.py
|__config.yaml
|__新建文件夹
	|__今日实验计划.docs
	|__明日日程表.pdf
	|__车身图纸.pdf
</code></pre></div><p>发现子目录中未重命名，我知道逻辑出了问题，于是跟 AI 再次强调需求</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>ok，当前目录下没有问题，但是我的需求实际上是，当前 root 作为一个根目录，要遍历这个根目录下的所有文件，也就是说，例如二级目录 root/subroot/ 下的所有文件也都得修改
</code></pre></div><p>用了一个简单的 one-shot 来说明需求，而后他给定了一版更正的代码，这一版非常不错，基本实现了我的需求</p> <p>经过不断的测试，又发现了一个小问题，那就是他读取配置文件的时候，找到是需要更改的文件夹根目录的配置文件，而不是应用程序根目录的配置文件，这不是我想要的</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>发现一个逻辑问题，打开的config.yaml应该是当前.py文件或者说exe文件的同级目录下的config.yaml，而不是待处理根目录下的config.yaml
</code></pre></div><p>同样返回一版代码测试，case 通过</p> <h4 id="异常处理"><a href="#异常处理" class="header-anchor">#</a> 异常处理</h4> <p>事情看上去好像非常顺利，但马上就出现了新的问题，我在根目录下连续执行两次程序，就会出现<code>★机密★★机密★国庆放假日程表</code></p> <ul><li>对于已经修改过的文件，不应该多次修改</li></ul> <p>我稍微想了一下，如果是我自己编码实现，我会检测头几个字符串，如果是带★号的，就跳过，但马上意识到了问题，如果我的配置文件更改，想把机密改成秘密，就不应该跳过，而是重写，算了，不想这么多了，直接丢给 AI 解决就行了</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>还有一个问题需要处理，比如，我的文件已经被处理过一次为★秘密★泪桥实验计划.docx，现在我修改配置文件要把&quot;实验计划&quot;改为&quot;一般&quot;，当这个脚本再次执行时，应该识别到他的前缀★秘密★，修改为★一般★泪桥实验计划.docx，而不是★一般★★秘密★泪桥实验计划.docx
</code></pre></div><p>豆包给了完整的解释和方案</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>需要处理<span class="token bold"><span class="token punctuation">**</span><span class="token content">已添加前缀的文件</span><span class="token punctuation">**</span></span>，确保再次执行时能更新前缀而非重复添加。核心逻辑是：先移除旧前缀，再添加新前缀
</code></pre></div><p>非常不错，完美的实现了我的需求</p> <h4 id="日志输出"><a href="#日志输出" class="header-anchor">#</a> 日志输出</h4> <p>和李函君对过需求，需要有一些统计信息的输出，例如</p> <ul><li>总共有多少文件</li> <li>修改了多少文件</li> <li>修改文件的路径</li> <li>未修改文件的路径</li></ul> <p>在测试代码的途中我就发现，他会 print 输出一些信息，于是提出以上需求，同样的给了我一版代码，日志将以以下形式写在当前根目录的 work.log 中</p> <div class="language- extra-class"><pre class="language-text"><code>[2023-10-19 10:23:45] 日志开始
[2023-10-19 10:23:45] 开始处理根目录：C:\test（包括所有子目录）
[2023-10-19 10:23:46] 已更新：C:\test\泪桥实验计划.docx → C:\test\★一般★泪桥实验计划.docx
[2023-10-19 10:23:46] 已更新：C:\test\文件夹A\图纸.pdf → C:\test\文件夹A\★秘密★图纸.pdf

===== 处理统计 =====
[2023-10-19 10:23:47] 总扫描文件数：5
[2023-10-19 10:23:47] 已修改文件数：2
[2023-10-19 10:23:47] 未修改文件数：3
[2023-10-19 10:23:47] 
[2023-10-19 10:23:47] 未修改的文件路径：
[2023-10-19 10:23:47] - C:\test\readme.txt
[2023-10-19 10:23:47] - C:\test\文件夹B\数据.csv
[2023-10-19 10:23:47] - C:\test\文件夹A\图像.png
[2023-10-19 10:23:47] ====================
[2023-10-19 10:23:47] 处理完成
</code></pre></div><p>挺好，是我想要的结果</p> <h4 id="exe-封装"><a href="#exe-封装" class="header-anchor">#</a> Exe 封装</h4> <p>比较关键的一步，涉及到一个关键的环境适配问题（要求能够在任意 win 设备上运行），由于之前他已经给过我打包的命令</p> <div class="language-sh extra-class"><pre class="language-sh"><code>pyinstaller <span class="token parameter variable">--onefile</span> <span class="token parameter variable">--console</span> file_renamer.py
</code></pre></div><p>我直接在根目录执行，发生报错，核心问题是没找到 pyinstaller 这个包，直接把报错甩给 AI</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>从你的的输出可知，pyinstaller 安装在：c:\users\northboat\appdata\roaming\python\python310\site-packages
但实际可执行文件 pyinstaller.exe 通常在同级的 Scripts 目录下，完整路径为：c:\users\northboat\appdata\roaming\python\python310\Scripts\pyinstaller.exe
步骤 2：直接使用完整路径执行打包命令
在 PowerShell 中输入以下命令（复制粘贴路径时注意检查是否正确）：
&amp; &quot;c:\users\northboat\appdata\roaming\python\python310\scripts\pyinstaller.exe&quot; --onefile --console renamer.py
若路径正确，会直接开始打包，生成的 exe 在 dist 目录中
</code></pre></div><p>我找到了关键的一条命令，看起来非常靠谱</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token operator">&amp;</span> <span class="token string">&quot;c:\users<span class="token entity" title="\n">\n</span>orthboat<span class="token entity" title="\a">\a</span>ppdata<span class="token entity" title="\r">\r</span>oaming\python\python310\scripts\pyinstaller.exe&quot;</span> <span class="token parameter variable">--onefile</span> <span class="token parameter variable">--console</span> renamer.py
</code></pre></div><p>而后在根目录执行，报错了，但显然找到了 pyinstaller，是其他的错，依旧甩报错，得到<code>pathlib</code>这个包和<code>pyinstaller</code>不兼容的信息，OK，我直接把 pathlib 给卸了</p> <div class="language-bash extra-class"><pre class="language-bash"><code>pip uninstall pathlib
</code></pre></div><p>再打包，成功了，得到了第一版的命令行 exe 程序，发给了李函君</p> <h4 id="开发文档"><a href="#开发文档" class="header-anchor">#</a> 开发文档</h4> <p>很简单，一句话的事：“帮我写一份README.md，介绍他的功能和使用方法，以及开发的技术栈和关键步骤”</p> <ul><li>命令行版本代码：<a href="https://github.com/Northboat/XDU-Learning/blob/main/AI-Learning/vibe-coding/renamer/renamer_v1/renamer.py" target="_blank" rel="nofollow noopener noreferrer">XDU-Learning/AI-Learning/vibe-coding/renamer/renamer_v1/renamer.py at main · Northboat/XDU-Learning<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>GUI 版本代码：<a href="https://github.com/Northboat/XDU-Learning/blob/main/AI-Learning/vibe-coding/renamer/renamer_v2/renamer_gui.py" target="_blank" rel="nofollow noopener noreferrer">XDU-Learning/AI-Learning/vibe-coding/renamer/renamer_v2/renamer_gui.py at main · Northboat/XDU-Learning<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>文档：<a href="https://github.com/Northboat/XDU-Learning/blob/main/AI-Learning/vibe-coding/renamer/README.md" target="_blank" rel="nofollow noopener noreferrer">XDU-Learning/AI-Learning/vibe-coding/renamer/README.md at main · Northboat/XDU-Learning<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="copilot-指南"><a href="#copilot-指南" class="header-anchor">#</a> Copilot 指南</h2> <blockquote><p>数据是 LLM 的血液</p></blockquote> <p>厂内的 Copilot，与 IDE 结合的 AI 编程工具</p> <h3 id="pair-coding-指南"><a href="#pair-coding-指南" class="header-anchor">#</a> Pair Coding 指南</h3> <blockquote><p>结对编程即，一人编码，一人审查，在结对编程中，编码和审查的角色是随时互换的</p></blockquote> <p>人机协同十二原则</p> <ol><li>用注释加强 AI 代码理解：先写注释再编码</li> <li>代码人易懂 ＝ AI 易懂，提升代码可读性：保持代码风格；有意义的命名；代码块粒度合适（150 行左右）；先搭架子再填空</li> <li>留心 AI 能力范围：AI 后台运行，需要定时检查</li> <li>准备私域知识：如优质的 few shot、RAG 等</li> <li>编码前多提问：了解 AI 意图，明确个人需求</li> <li>编码后 AI 审查：让 AI 审查 AI 代码</li> <li>写代码前先澄清：清晰代码意图和功能</li> <li>让 AI 复用和扩展个人能力：插件、MCP、Skills</li> <li>专注于核心业务，杂活全部交给 AI：如复杂的正则表达式</li> <li>不会的、不熟悉的让 AI 帮忙</li> <li>人是驾驶者，AI 是辅助手</li> <li>接受 AI 的不完美</li></ol> <p>常见场景</p> <ul><li>基于注释生成代码（Comment Driven Coding）</li> <li>根据代码生成注释</li> <li>充当搜索引擎</li> <li>单测文件生成</li></ul> <p>使用经验：在拿到一份项目时</p> <p>第一步：开启全局上下文并做全盘扫描在你的 AI 对话框里，确保你已经唤起了读取整个代码库的指令，然后发送这个破冰指令</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>你现在是一个资深的后端架构师，我已经将整个代码库作为上下文发给了你，请你先不要修改任何代码，只做仔细的阅读和审查。请用中文为我总结这个项目的核心信息

<span class="token list punctuation">1.</span> 这个项目使用的核心技术栈是什么？(包括框架、上下游依赖、状态管理、构建工具等)
<span class="token list punctuation">2.</span> 请梳理并解释目前的目录结构 (如下各个子目录的作用)
<span class="token list punctuation">3.</span> 项目的入口文件和核心路由体系是如何组织的，项目暴露了哪些接口
</code></pre></div><p>第二步：深挖工程规范与约定</p> <p>等它梳理完骨架后，你需要让它提取项目里的“潜规则”这能保证后续它生成的代码风格与现有代码完全一致，而不是自编自导“非常好</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>现在请深入到具体的业务代码层面，帮我总结一下目前项目中的编码约定

<span class="token list punctuation">1.</span> 数据请求：项目里是如何封装和接收 HTTP、MCP 或微服务请求的？(是否有统一的工厂处理模式?)
<span class="token list punctuation">2.</span> 数据存储：主要有哪些用户数据，存储在哪里，是否采用了缓存设计？
<span class="token list punctuation">3.</span> 日志处理：是否有统一的日志处理框架，是否用到了消息队列处理日志？
<span class="token list punctuation">4.</span> 有没有我需要特别注意的特殊逻辑或潜在的技术栈？
</code></pre></div><p>第三步：生成“记忆面包”（沉淀文档）</p> <p>当 AI 完美回答了前两步后，它此时的脑子里包含了这个项目最完整的信息，但只要开启新对话就会遗忘，所以需要让它把这些信息通过文档的方式固化下来</p> <div class="language-markdown extra-class"><pre class="language-markdown"><code>基于你刚才的审查结果，请帮我生成一份详尽的 PROJECT.md 文档，这份文档的目的是：以后当我开启新的 AI 会话时，只要让 AI 读取这个文档，就能立刻了解项目的全局规范和架构，请排版清晰，包含技术栈概览、 目录说明、核心开发规范等关键信息
</code></pre></div><p>效率小贴士：拿到生成的 PROJECT. md 后，把它保存在项目根目录下，以后每次你想开发新功能，开启一个新的 AI 对话窗口，第一句话就是：“请先阅读 PROJECT. md，然后帮我实现 xxx 功能”，这样写出来代码质量会高得惊人</p> <h3 id="spec-coding-规约"><a href="#spec-coding-规约" class="header-anchor">#</a> Spec Coding 规约</h3> <p>规约编程（Spec Coding），或者叫规范驱动编程（Spec-Driven Development），强调在动手编写代码之前，开发者与 AI 需先共同制定一套关于软件架构、功能边界与业务逻辑的详细规约文档，AI 将严格基于此文档逐点执行开发任务，旨在将 AI 编程从“玄学”拉回“工程学”</p> <p><strong>Rules</strong>：约束智能体的需求文档，统一放在项目根目录的 .rules 文件夹中，说白了就是规范 LLM 行为的文档形式的 System Prompt，在以下四个方面对 LLM 进行提示与约束</p> <ul><li>What：代码库干嘛的</li> <li>Where：目录结构如何组织</li> <li>How：场景流程，few shot</li> <li>Should/Not：应该/禁止做什么</li></ul> <p>可以参考 Cursor 内置的 Rules，本质上都是一段 markdown 格式的 User Prompt，通过令 AI 先阅读指定文件再进行操作，进行相对规范的操作</p> <ul><li>单测 rule：<a href="./assets/ut-rules.mdr">unit-test-rules</a></li> <li>代码风格 rule：<a href="./assets/cs.mdr">code-style</a></li></ul> <p><strong>MCP</strong>：模块化的、标准化的、微服务化的工具调用（function call），让 LLM 快速获取某项技能，包括但不限于搜索网页、生成文档、读写文件</p> <h2 id="claude-code-神力"><a href="#claude-code-神力" class="header-anchor">#</a> Claude Code 神力</h2> <h3 id="cc-switch"><a href="#cc-switch" class="header-anchor">#</a> CC Switch</h3> <p>感觉主要还是模型质量影响产出质量，同时必须得支持 Skill 生态，质量和生态，这二者很重要</p> <p>同时发现一个很有意思的事，细看之下，Claude 和文库的后端栈完全一样</p> <ul><li>基础：提供模型能力，对应 API Token 来源，如 GLM5.1</li> <li>策略：工作流编排和智能体循环，对应 Claude 智能体</li> <li>业务：交互逻辑和接口调用，对应 Cli 命令行的交互方式</li></ul> <p>下载 CC Switch：<a href="https://github.com/farion1231/cc-switch/releases/tag/v3.14.1" target="_blank" rel="nofollow noopener noreferrer">Release CC Switch v3.14.1 · farion1231/cc-switch<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>参考文档</p> <ul><li><a href="https://docs.packyapi.com/docs/ccswitch/2-claude.html" target="_blank" rel="nofollow noopener noreferrer">Claude Code 配置 | PackyAPI 使用文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/claude_code" target="_blank" rel="nofollow noopener noreferrer">接入 Claude Code | DeepSeek API Docs<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://platform.deepseek.com/usage" target="_blank" rel="nofollow noopener noreferrer">DeepSeek 开放平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>使用 CC Switch 切换 Claude 的模型，新建 Provider，填写请求地址和 API Key</p> <div class="language-bash extra-class"><pre class="language-bash"><code>https://api.deepseek.com/anthropic
</code></pre></div><p>DeepSeek V4 模型配置</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;env&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;ANTHROPIC_AUTH_TOKEN&quot;</span><span class="token operator">:</span> <span class="token string">&quot;api key...&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_BASE_URL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;https://api.deepseek.com/anthropic&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-pro[1m]&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_DEFAULT_OPUS_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-pro[1m]&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_DEFAULT_SONNET_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-pro[1m]&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;ANTHROPIC_DEFAULT_HAIKU_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-flash&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;CLAUDE_CODE_SUBAGENT_MODEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;deepseek-v4-flash&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;CLAUDE_CODE_EFFORT_LEVEL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;max&quot;</span>
  <span class="token punctuation">}</span><span class="token punctuation">,</span>
  <span class="token property">&quot;theme&quot;</span><span class="token operator">:</span> <span class="token string">&quot;dark-daltonized&quot;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在设置中打开跳过 Claude Code Login，直接启动 Claude，用 /model 可以看到 DS 的四个模型</p> <ul><li>或者使用 <a href="https://github.com/shengcanxu/Reasonix" target="_blank" rel="nofollow noopener noreferrer">shengcanxu/Reasonix<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，更符合 DS 体质的 Native Agent，缓存命中率奇高</li> <li>或者在 CC 中使用 Kimi 2.5：<a href="https://juejin.cn/post/7611432757572141096" target="_blank" rel="nofollow noopener noreferrer">Claude Code 换成了 Kimi K2.5 后 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="claude-code"><a href="#claude-code" class="header-anchor">#</a> Claude Code</h3> <p>windows 用 npm 下载 Claude</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">npm</span> <span class="token function">install</span> <span class="token parameter variable">-g</span> @anthropic-ai/claude-code

claude <span class="token parameter variable">--version</span>
claude <span class="token function">install</span>
claude update

<span class="token comment"># 启动 claude 需要开 tun 模式</span>
claude
</code></pre></div><p>Claude Code 常用命令</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/init <span class="token comment"># 初始化仓库 Claude.md</span>
/model <span class="token comment"># 选模型</span>
/effort <span class="token comment"># 努力值</span>
/clear <span class="token comment"># 清除当前记忆</span>
/compact <span class="token comment"># 整理当前对话</span>
/agents  <span class="token comment"># 子 agent</span>
/memory <span class="token comment"># 查看记忆文件</span>
</code></pre></div><p>基本使用</p> <ol><li>用贵的模型跑 agent.md 理解项目</li> <li>然后用 haiku / sonnet 去执行生成任务</li> <li>plan mode 理解 → agent mode 修改</li></ol> <p>实践思路</p> <ul><li>内网 Skill：解读内网新闻；解读知识库内容；在内网自动搜索文章；内网购物；当做网页截图工具；写周报</li> <li>作为研发工具
<ul><li>生成接口请求 curl，处理 json，类型转换；生成接口调用流程，辅助技术设计</li> <li>在代码库上级目录打开，这样 ai 可以去一次行读取多个代码库，对于查一下涉及上下游的调用的问题和 case 会比较好用，等于串联起完整的链路去分析，问题定位比较准</li> <li>同时开 Claude Code 和 Copilot，商讨技术实现，达到最终一致（Token x2）</li> <li><strong>根据技术评审文档 + 接口文档改造接口并提交 CR</strong>，打通了代码仓库和知识库的数据流通和权限管理</li></ul></li></ul> <h3 id="skills"><a href="#skills" class="header-anchor">#</a> Skills</h3> <blockquote><p>Skill 是 Anthropic 在 25 年 10 月推出的一项革命性功能，它允许 Claude AI 通过读取&quot;技能包&quot;来提升特定任务的执行能力，每个 Skills 相当于一套标准化的智能体接口，提供单独的文档、接口、代码执行能力，通过渐进式披露 SKILL.md 文档进行能力暴露</p></blockquote> <p>Skill 与 MCP 区别：MCP 需要 JSON-RPC 协议接入并且一次暴露整个 MCP 能力，而 Skills 直接让 LLM 读取 Markdown 文档获取，通过“渐进式披露”提供能力，并且 Markdown 文档较于 MCP 调用更具普适性</p> <p>一个 Skill 的基本结构</p> <div class="language-text extra-class"><pre class="language-text"><code>skill-name
├── SKILL.md # 定义、描述 skill
├── scripts/ # 具体的可执行代码脚本，其说明在 SKILL 中定义
├── templates/ 文档模板
├── resources/ 资源文件
</code></pre></div><p>以下载 <a href="https://github.com/obra/superpowers" target="_blank" rel="nofollow noopener noreferrer">superpower<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 为例</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/plugin marketplace <span class="token function">add</span> obra/superpowers-marketplace <span class="token comment"># 添加第三方市场</span>
/plugin <span class="token function">install</span> superpowers@superpowers-marketplace <span class="token comment"># 下载 superpowers</span>
</code></pre></div><ul><li>这里是通过插件的形式下载，本地文件将放在<code>~/plugins/cache/superpowers-marketplace/superpowers/5.1</code>下（实际上就是 github 仓库的源码），可以看到 Claude.md、Agents.md 等文件，点进 skill 目录，可以看到一个个的 skill 和对应的 skill.md</li> <li>也可以手动导入：将 skills 包 copy 进<code>~/.claude/skills</code>文件夹，Claude 就能够自动渐进式的阅读 Skill 并载入相应内置命令</li></ul> <p>一些有用的 Skills</p> <ul><li>学术

ass="sr-only">(opens new window)</span></span></a></li> <li>链路梳理 HTML 报告：<a href="https://www.skillhub.cn/skills/saulxiong-html-report" target="_blank" rel="nofollow noopener noreferrer">SkillHub - HTML Report<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ol></li> <li>长篇网文写作：<a href="https://github.com/lingfengQAQ/webnovel-writer" target="_blank" rel="nofollow noopener noreferrer">lingfengQAQ/webnovel-writer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>Coding is cheap. Show me the skill

</code></pre></div><p>Comate 直接把 skill 生成到了 ./claude/skills 里，Claude 动态加载了以下指令</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/go-unit-test-rules

/go-unit-test-rules <span class="token string">&quot;测试模板&quot;</span>
</code></pre></div><p>完整 Skill 可见 <a href="/02.全栈开发/03.智能体开发/01.Go 编程/assets/SKILL.html">SKILL.md</a></p> <h2 id="其他-others"><a href="#其他-others" class="header-anchor">#</a> 其他 Others</h2> <h3 id="harnes-engineering"><a href="#harnes-engineering" class="header-anchor">#</a> Harnes Engineering</h3> <p>驾驭工程（环境工程），通过严格的权限限制，规范 Agent 的能力，不同于 Spec Coding 的 Prompt 约束， Harness Engineering 通过系统层面的约束规范 Agent 行为</p> <ul><li>OpenClaw 和 Shadow 没有本质区别，能干的活十分有限</li></ul> <p>Cube Sandbox：腾讯开源的 AI 沙箱环境</p> <p>用环境分割 AI 的权限</p> <ol><li>AI 的操作不能影响他自身的环境</li> <li>AI 的操作不能破坏物理机的环境</li></ol> <p>需要独立出一个可读写、可执行、可持久化的沙箱环境供 AI 调用</p> <p>从虚拟机到容器再到精简虚拟机</p> <p>复用虚拟机快照启动环境，实现毫秒级快速启动</p> <p>Cube Sandbox 与 E2B 的区别</p> <h3 id="aris"><a href="#aris" class="header-anchor">#</a> ARIS</h3> <blockquote><p>俩小时跑度子 100 块</p></blockquote> <p>快速开始 ARIS：<a href="https://github.com/wanshuiyin/Auto-claude-code-research-in-sleep/" target="_blank" rel="nofollow noopener noreferrer">Auto Research In Sleep<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 1. 安装 skills</span>
<span class="token function">git</span> clone https://github.com/wanshuiyin/Auto-claude-code-research-in-sleep.git
<span class="token function">cp</span> <span class="token parameter variable">-r</span> Auto-claude-code-research-in-sleep/skills/* ~/.claude/skills/
</code></pre></div><p>Claude Code <strong>会</strong>自动扫描并加载 <code>.claude/skills</code> 目录下的 skill 文件。当你把包含有效 <code>SKILL.md</code> 的文件夹复制进去时，它会自动识别并注册这些命令，这是 Claude Code 的内置机制</p> <ul><li><code>.claude/skills</code> 目录下的每个子文件夹如果包含有效的 skill 定义，就会被自动加载</li> <li>加载后对应的命令（如 <code>/idea-discovery</code>、<code>/paper-writing</code> 等）就会自动出现在 <code>/</code> 命令列表中</li></ul> <p>配置 CodeX，需要一个 Pro 的 GPT 账号</p> <ul><li><a href="https://zhuanlan.zhihu.com/p/2004914542765941622" target="_blank" rel="nofollow noopener noreferrer">小林 Coding CodeX 教程<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://getgpt.pro/plus-price" target="_blank" rel="nofollow noopener noreferrer">Get GPT Pro<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 2. 配置 Codex MCP（review 类 skill 需要）</span>
<span class="token function">npm</span> <span class="token function">install</span> <span class="token parameter variable">-g</span> @openai/codex
codex setup                    <span class="token comment"># 提示选模型时选 gpt-5.4</span>
claude mcp <span class="token function">add</span> codex <span class="token parameter variable">-s</span> user -- codex mcp-server
</code></pre></div><p>在 Claude Code 中使用 ARIS</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 3. 在 Claude Code 中使用</span>
/idea-discovery <span class="token string">&quot;你的研究方向&quot;</span>              <span class="token comment"># 工作流 1 — 方向要具体！不要 &quot;NLP&quot;，要 &quot;离散扩散语言模型的 factorized gap&quot;</span>
/experiment-bridge                         <span class="token comment"># 工作流 1.5 — 有计划了？实现 + 部署 + 收结果</span>
/auto-review-loop <span class="token string">&quot;你的论文主题或范围&quot;</span>         <span class="token comment"># 工作流 2：审稿 → 修复 → 再审，一夜完成</span>
/paper-writing <span class="token string">&quot;NARRATIVE_REPORT.md&quot;</span>       <span class="token comment"># 工作流 3：研究叙事 → 精修 PDF</span>
/rebuttal <span class="token string">&quot;paper/ + reviews&quot;</span> — venue: ICML  <span class="token comment"># 工作流 4：解析 review → 起草 rebuttal → follow-up</span>
/research-pipeline <span class="token string">&quot;你的研究方向&quot;</span>            <span class="token comment"># 全流程：工作流 1 → 1.5 → 2 → 3 端到端</span>
/research-wiki init                          <span class="token comment"># 📚 启用持久化研究记忆（一次性）</span>
/meta-optimize                               <span class="token comment"># 元优化：分析使用记录 → 提出技能改进方案</span>
</code></pre></div><p>使用 Python 做仿真实验更贴合 Claude 场景</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># Cryptography</span>
pycryptodome<span class="token operator">&gt;=</span><span class="token number">4.0</span>.0
sympy<span class="token operator">&gt;=</span><span class="token number">1.12</span>
charm-crypto<span class="token operator">&gt;=</span><span class="token number">0.50</span>  <span class="token comment"># For E3 (chameleon hash with pairing)</span>

<span class="token comment"># Math/Analysis</span>
numpy<span class="token operator">&gt;=</span><span class="token number">1.24</span>.0

<span class="token comment"># Testing</span>
pytest<span class="token operator">&gt;=</span><span class="token number">7.0</span>.0
</code></pre></div><p>pdf 文章解析，供 Claude 阅读 pdf 文件，本地下载 poppler</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># Mac 下载 poppler</span>
brew <span class="token function">install</span> poppler

<span class="token comment"># 提取文本</span>
<span class="token comment"># 提取全部文本到文件</span>
pdftotext xxx.pdf output.txt

<span class="token comment"># 提取到 stdout（直接显示）</span>
pdftotext xxx.pdf -

<span class="token comment"># 保留布局格式</span>
pdftotext <span class="token parameter variable">-layout</span> xxx.pdf output.txt

<span class="token comment"># 提取指定页（第 1-5 页）</span>
pdftotext <span class="token parameter variable">-f</span> <span class="token number">1</span> <span class="token parameter variable">-l</span> <span class="token number">5</span> xxx.pdf output.txt

<span class="token comment"># 查看 pdf 元数据</span>
pdfinfo xxx.pdf
</code></pre></div><p>可以编写一份 skill 让 Claude 拥有阅读 pdf 的能力，直接调用 <code>pdftotext xxx.pdf -</code> 输出 pdf 内容</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/06/01, 22:12:11</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/86248e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">面向机试编程</div></a> <a href="/pages/aecc6a/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">基于 LSP 的审计辅助工具</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
