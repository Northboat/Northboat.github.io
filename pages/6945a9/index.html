oading-process.html" target="_blank" rel="nofollow noopener noreferrer">类加载过程详解 | JavaGuide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://javaguide.cn/java/jvm/classloader.html" target="_blank" rel="nofollow noopener noreferrer">类加载器详解 | JavaGuide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.bilibili.com/video/BV1he4y1e7nW/" target="_blank" rel="nofollow noopener noreferrer">【JVM 极简教程】2 小时快速学会 JVM，史上用时最短，效率最高！bilibili<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="jvm-概述"><a href="#jvm-概述" class="header-anchor">#</a> JVM 概述</h2> <h3 id="什么是-jvm"><a href="#什么是-jvm" class="header-anchor">#</a> 什么是 JVM</h3> <p>JVM 即 Java Virtual Machine，Java 虚拟机，是软件层面的对各类计算机功能的虚拟仿真模拟</p> <p>相当于在操作系统上套了一层，他与操作系统交互，而不与硬件直接交互，调用 OS 系统功能向上提供统一的 Java 编程接口</p> <div class="language- extra-class"><pre class="language-text"><code>JVM
↓ ↑
操作系统 OS
↓ ↑
硬件：磁盘、内存、CPU 等
</code></pre></div><p>参考容器技术的跨平台原理，所有软件跑在容器上，而非操作系统，从而实现跨操作系统的运行</p> <h3 id="字节码运行过程"><a href="#字节码运行过程" class="header-anchor">#</a> 字节码运行过程</h3> <p>Java 文件运行过程</p> <img src="/assets/img/image-20251010213933971.eedac0a2.png"> <p>需要注意的是，最后运行的一定是机器码</p> <ul><li><code>.java</code>文本文件通过 javac 编译为<code>.class</code>字节码文件，而后在 JVM 中被解释为机器码并由 OS 执行</li> <li>JVM 完成字节码到机器码的转换，这个字节码的翻译过程在各个操作系统上的 JVM 都是统一的，这是 Java 跨平台的核心逻辑</li></ul> <p>一句话说：JVM 是运行字节码的工具，Java 是一门编译型的语言，Java 编译器将文本文档编译为字节码，类似的字节码语言还有很多</p> <img src="/assets/img/image-20251013154150707.1a37fddd.png"> <p>JVM 的整体结构如下</p> <img src="/assets/img/image-20251013154252502.e066b831.png"> <h2 id="类加载系统"><a href="#类加载系统" class="header-anchor">#</a> 类加载系统</h2> <h3 id="类加载过程"><a href="#类加载过程" class="header-anchor">#</a> 类加载过程</h3> <p>众所周知，程序在内存中被执行（冯诺依曼机），当我们编写并编译好了字节码文件，到实际运行，还有一个内存加载的过程，这一过程由类加载子系统实现</p> <img src="/assets/img/image-20251013161626430.34f24d7a.png"> <p>从类被加载到虚拟机内存中开始，到释放内存总共有 5 个步骤：加载，链接，初始化，使用，卸载</p> <ul><li>其中链接包括：验证、准备和解析</li></ul> <p>类的加载指的是前三步：<strong>加载、链接和初始化</strong></p> <p>链接的三步走</p> <ul><li>验证：验证<code>.class</code>文件格式</li> <li>准备：给变量赋零值，在初始化时才会正式赋值</li> <li>解析：将符号引用解析为直接引用，根据类名指定其在方法区的地址</li></ul> <h3 id="类加载器"><a href="#类加载器" class="header-anchor">#</a> 类加载器</h3> <p>类加载器完成类的加载（加载、链接和初始化）</p> <ul><li>类加载器的主要作用就是动态加载 Java 类的字节码（<code>.class</code>文件）到 JVM 中（在内存中生成一个代表该类的<code>Class</code>对象）</li></ul> <p>JVM 中内置了三个重要的<code>ClassLoader</code>（摘自 JavaGuide）</p> <ol><li><code>BootstrapClassLoader</code>（启动类加载器）：最顶层的加载类，由 C++实现，通常表示为 null，并且没有父级，主要用来加载 JDK 内部的核心类库（**<code>%JAVA_HOME%/lib</code>**目录下的<code>rt.jar</code>、<code>resources.jar</code>、<code>charsets.jar</code>等 jar 包和类）以及被<code>-Xbootclasspath</code>参数指定的路径下的所有类</li> <li><code>ExtensionClassLoader</code>（扩展类加载器）：主要负责加载**<code>%JRE_HOME%/lib/ext</code><strong>目录下的 jar 包和类以及被<code>java.ext.dirs</code>系统变量所指定的路径下的所有类（现在是</strong><code>PlatformClassLoader</code>**）</li> <li><code>AppClassLoader</code>（应用程序类加载器）：面向我们用户的加载器，负责加载当前应用**<code>-classpath</code>**下的所有 jar 包和类，如果是 SpringBoot 程序，这个目录将是<code>target/classes</code>，这个目录下所有的<code>.class</code>文件都会由 AppClassLoader 来进行加载</li></ol> <blockquote><p>🌈 拓展一下</p> <ul><li><strong><code>rt.jar</code></strong>：rt 代表“RunTime”，<code>rt.jar</code>是 Java 基础类库，包含 Java doc 里面看到的所有的类的类文件。也就是说，我们常用内置库 <code>java.xxx.*</code>都在里面，比如<code>java.util.*</code>、<code>java.io.*</code>、<code>java.nio.*</code>、<code>java.lang.*</code>、<code>java.sql.*</code>、<code>java.math.*</code></li> <li>Java 9 引入了模块系统，并且略微更改了上述的类加载器。扩展类加载器被改名为平台类加载器（platform class loader）。Java SE 中除了少数几个关键模块，比如说 <code>java.base</code> 是由启动类加载器加载之外，其他的模块均由平台类加载器所加载</li></ul></blockquote> <p>以 JDK17 为例，从最上层的 <strong>ClassLoader</strong> 往下找（即 BootStrapClassLoader），先是 SecureClassLoader</p> <ul><li>SecureClassLoader extends ClassLoader</li> <li>URLClassLoader extends SecureClassLoader</li> <li>BuiltinClassLoader extends SecureClassLoader</li></ul> <p>而后在<code>jdk/internal/loader/ClassLoaders.java</code>有（这个类很关键，维护了三个关键的类加载器）</p> <ul><li>BootClassLoader extends BuiltinClassLoader</li> <li>PlatformClassLoader extends BuiltinClassLoader</li> <li>AppClassLoader extends BuiltinClassLoader</li></ul> <p>还找到一个 WebappClassLoader extends URLClassLoader，是 Tomcat 10.1.24 的启动器</p> <p>加载器 Loader 以自顶向下的方式进行组织，每个 Loader 都会有一个 getParent 方法以获取其父类的加载器</p> <ul><li>注意：BootStrapClassLoader 的 getParent 将返回 null，因为其上层为 C++ 实现，并没有对应的 Java 类，而其余的 ClassLoader 均有双亲</li></ul> <h3 id="双亲委派模型"><a href="#双亲委派模型" class="header-anchor">#</a> 双亲委派模型</h3> <blockquote><p>向上委派，向下查找</p></blockquote> <p>双亲委派的作用</p> <ul><li>避免类的重复加载</li> <li>防止核心 API 被篡改</li></ul> <p>类加载器有很多种，当我们想要加载一个类的时候，具体是哪个类加载器加载呢？这就需要提到双亲委派模型了，根据官网介绍</p> <blockquote><p><code>ClassLoader</code>类使用委托模型来搜索类和资源，每个<code>ClassLoader</code>实例都有一个相关的父类加载器，需要查找类或资源时，<code>ClassLoader</code>实例会在试图亲自查找类或资源之前，将搜索类或资源的<strong>任务委托给其父类加载器</strong></p> <p>虚拟机中被称为 &quot;bootstrap class loader&quot; 的内置类加载器本身没有父类加载器，但是可以作为<code>ClassLoader</code>实例的父类加载器</p></blockquote> <p>用任意一个 Class 的 loadClass 方法，最终都会指向 ClassLoader 的 loadClass 方法，例如</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">ClassNotFoundException</span> <span class="token punctuation">{</span>
    <span class="token class-name">Class</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">loadClass</span><span class="token punctuation">(</span><span class="token string">&quot;cia.northboat.test.TreeTest&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一路 ctrl b loadClass 会指向 ClassLoader 的 loadClass 方法</p> <img src="/assets/img/image-20251014143446650.f74a4a79.png"> <ul><li>在 567 行，首先会做一个 synchronized 的互斥，不允许同时加载同一个类</li> <li>在 569 行，会做一个类是否被加载过的判断，这意味着类不会被重复加载</li> <li>在 572-577 行，可以明确看到，每个 loadClass 都会去找其父类的 loadClass，直到找到 BootstrapClassLoader</li></ul> <p>这是一个递归调用，当找到 BootstrapClassLoader 后，由于其 parent 为 null，所以会执行 findBootstrapClassLoaderOrNull，其实现如下</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">static</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> <span class="token function">findBootstrapClassOrNull</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span><span class="token function">checkName</span><span class="token punctuation">(</span>name<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token function">findBootstrapClass</span><span class="token punctuation">(</span>name<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// return null if not found</span>
<span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">native</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> <span class="token function">findBootstrapClass</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><ul><li>首先对要加载的类名进行检测</li> <li>若通过，则调用 BootstrapClassLoader 的 native 方法 findBootstrapClass 去加载这个类</li> <li>若未通过或 findBootstrapClass 加载失败，则会回到 BootstrapClassLoader 的上一级子类，执行 583-593 行代码，invoke 这个子类的 findClass 方法进行加载尝试</li> <li>同理，若当前的 findClass 仍旧查找失败，c 仍旧返回 null，则会进一步到下一级 ClassLoader 进行 findClass</li></ul> <p>所谓<strong>向上委派，向下查找</strong>就是这个意思，这是<strong>一个递归的自顶向下的尝试加载的过程</strong></p> <ul><li><p>这样能有效避免类的重复加载，即父类中加载过不为 null，子类就不会再尝试加载了，这样方法区里就只会保留一个类的一份信息</p></li> <li><p>并且，由于自顶向下加载，所以 jdk 的核心类一定会先由顶层的 BootstrapClassLoader 来加载，类的加载是可控的，因为加载器的调用顺序被写死，你不可能跨过 BootstrapClassLoader 用一个下层的 XXXLoader 去加载 jre/lib 中的 class 文件</p> <p>也就是说，jdk 可以指定一些类只能由 BootstrapClassLoader 加载，从而防止 jdk 的核心 API 被篡改</p></li></ul> <p>举一个简单的例子</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">ClassNotFoundException</span> <span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">Class</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">EncryptedTree</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>以上将依次输出</p> <div class="language- extra-class"><pre class="language-text"><code>null
null
jdk.internal.loader.ClassLoaders$AppClassLoader@63947c6b
</code></pre></div><p>这就说明，Class 类和 String 类（来自 jdk）都是由 BootstrapClassLoader 加载，而 EncryptedTree 由 AppClassLoader 加载</p> <p>防止篡改的意思就是，这种底层类百分之一万是由 BootstrapClassLoader 加载的，你无法通过自定义的加载器加载，自然不可能加载进自定义的 String 类</p> <h3 id="自定义类加载器"><a href="#自定义类加载器" class="header-anchor">#</a> 自定义类加载器</h3> <p>Tomcat 为什么要用自定义加载器？</p> <p>为了进行类的隔离，如果 Tomcat 直接使用 AppClassLoader 类加载类，那就会出现如下情况，假设同时有多个项目部署在 Tomcat 中</p> <ol><li>应用 A 中有一个 com.zhouyu.Hello.class</li> <li>应用 B 中也有一个 com.zhouyu.Hello.class</li> <li>虽然都叫做 Hello，但是具体的方法、属性可能不一样</li> <li>如果 AppClassLoader 先加载了应用 A 中的 Hello.class</li> <li>那么应用 B 中的 Hello.class 就不可能再被加载了，因为名字是一样</li> <li>如果就需要针对应用 A 和应用 B 设置各自单独的类加载器，也就是 WebappClassLoader</li> <li>这样两个应用中的 Hello.class 都能被各自的类加载器所加载，不会冲突</li> <li>这就是 Tomcat 为什么用自定义类加载器的核心原因，为了实现类加载的隔离</li> <li><strong>JVM 中判断一个类是否已经被加载的逻辑是：类名 + 对应的类加载器实例</strong></li></ol> <p>也就是说，两个应用中的 Hello.class 对应的加载器实例是两个 WebappClassLoader 对象，以此供 JVM 来进行类的区分</p> <h2 id="运行时数据区"><a href="#运行时数据区" class="header-anchor">#</a> 运行时数据区</h2> <p>JVM 虚拟机的运行时数据区</p> <img src="/assets/img/image-20251015161612920.3fa6b374.png"> <ul><li>方法区</li> <li>虚拟机堆</li> <li>虚拟机栈</li> <li>本地方法栈</li> <li>程序计数器</li></ul> <p>其中，方法区和堆属于线程共享区域，存在并发问题（蓝区）；栈、本地方法栈和程序计数器属于线程独享区域，不存在线程安全问题（绿区）；JVM 的调优主要就是围绕堆，栈两大块进行</p> <ul><li>例如：Student 类的信息将存储在方法区，Student 的一个实例对象 stu 存储在虚拟机堆中，stu 的 sayName() 方法和局部变量将存放在虚拟机栈</li></ul> <p>在类加载器中，类的加载，实际上就是把类的信息加载到方法区中</p> <h3 id="程序计数器"><a href="#程序计数器" class="header-anchor">#</a> 程序计数器</h3> <p>PC Register，程序计数寄存器</p> <ul><li>物理寄存器的抽象实现</li> <li>用来记录待执行的下一跳指令的地址</li> <li>程序控制流的指示器</li> <li>解释器工作时通过程序计数器来获取下一条需要执行的字节码指令</li> <li>唯一一个在 JVM 规范中没有规定任何 OutOfMemoryError 情况的区域（程序计数器不会出现内存溢出）</li></ul> <p>每个线程都会有一个程序计数器，只记录一个地址数字而已</p> <h3 id="方法区"><a href="#方法区" class="header-anchor">#</a> 方法区</h3> <p>方法区主要的作用技术存放类的元数据信息，常量和静态变量等等，当它存储的信息过大时，会在无法满足内存分配时报错</p> <h3 id="本地方法栈"><a href="#本地方法栈" class="header-anchor">#</a> 本地方法栈</h3> <p>本地方法，即 native method，例如 Thread 类的源码，其 start0 方法带有一个 native 关键字修饰，且不存在方法体，这种用 native 修饰的方法就是本地方法，这是底层 C++ 来实现，但在 Java 中定义的方法</p> <p>和虚拟机栈一样，本地方法栈同样存储的是栈帧，只不过是本地方法调用过程中的栈帧，其同样是线程私有的，也可能出现 OOM 和 SOF</p> <p>需要注意的是，如果执行的是 native 方法，程序计数器指针就不工作了</p> <h3 id="虚拟机栈"><a href="#虚拟机栈" class="header-anchor">#</a> 虚拟机栈</h3> <p>又称 Java 栈或 Java 方法栈，每个线程在创建时都会创建一个虚拟机栈，<strong>方法栈会保存一个个的栈帧</strong>，每个栈帧对应一个方法，其特点如下</p> <ol><li>虚拟机栈是线程私有的，生命周期和线程保持一致</li> <li>一个方法开始执行栈帧入栈、方法执行完对应的栈帧就出栈，所以虚拟机栈不需要进行垃圾回收</li> <li>虚拟机栈存在 OutOfMemoryError 和 StackOverflowError
<ul><li>线程太多，就可能会出现 OutOfMemoryError，线程创建时没有足够的内存去创建虚拟机栈了</li> <li>方法调用层次太多，就可能会出现 StackOverflowError</li> <li>可以通过 -Xss 指定参数来设置虚拟机栈的大小</li></ul></li></ol> <img src="/assets/img/image-20251016165023611.33e064a0.png"> <p>栈帧结构</p> <img src="/assets/img/image-20251016165203829.38cc292e.png"> <ul><li>局部变量表：记录一个 Slot 变量数组，即局部变量的信息，包括局部变量的数量，地址和长度</li> <li>操作数栈：执行字节码时，帮助进行计算的寄存器，类似于计算后缀表达式值时的操作数栈</li></ul> <p>以以下代码为例</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">int</span> a <span class="token operator">=</span> <span class="token number">10</span><span class="token punctuation">,</span> b <span class="token operator">=</span> <span class="token number">20</span><span class="token punctuation">;</span>
    <span class="token keyword">int</span> c <span class="token operator">=</span> a <span class="token operator">+</span> b<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>假设初始时，局部变量表为，其中数字标号表示变量的地址</p> <table><thead><tr><th>局部变量表</th> <th></th></tr></thead> <tbody><tr><td>0（args）</td> <td></td></tr> <tr><td>1（a）</td> <td></td></tr> <tr><td>2（b）</td> <td></td></tr> <tr><td>3（c）</td> <td></td></tr></tbody></table> <p>其字节码大致如下</p> <div class="language- extra-class"><pre class="language-text"><code>0: bipush	10
1: istore_1
2: bipush	20
3: istore_2
4: iload_1
5: iload_2
6: iadd
7: istore_3
8: return
</code></pre></div><p>操作数栈会经历以下步骤</p> <ul><li>压栈 10</li> <li>弹栈，把 10 存入地址为 1 的变量，即 a</li> <li>压栈 20</li> <li>弹栈，把 20 存入地址为 2 的变量，即 b</li> <li>从地址为 1 的内存取出值 10，压栈</li> <li>从地址为 2 的内存取出值 20，压栈</li> <li>执行加法指令，自动从操作数栈中取出两个值计算，并将结果 30 压栈</li> <li>弹栈，把 30 存入地址为 3 的变量，即 c</li></ul> <p>最终，局部变量表将成为</p> <table><thead><tr><th>局部变量表</th> <th></th></tr></thead> <tbody><tr><td>0（args）</td> <td></td></tr> <tr><td>1（a）</td> <td>10</td></tr> <tr><td>2（b）</td> <td>20</td></tr> <tr><td>3（c）</td> <td>30</td></tr></tbody></table> <h3 id="虚拟机堆"><a href="#虚拟机堆" class="header-anchor">#</a> 虚拟机堆</h3> <p>堆是一个共享的内存区域，存储着所有 Java 对象和数组，程序中所使用的所有引用，都是按照地址从堆中获取</p> <img src="/assets/img/image-20251016202022125.d26faf44.png"> <p>栈帧会随着方法的结束而消失，而方法中涉及到的对象不会立马被回收，因为<strong>对象和数组都存储在堆中</strong>，和虚拟机栈是相对独立的内存空间，只有在 JVM 后台执行 GC 后，对象才会被回收</p> <p>堆的空间大小可以通过 Java 命令指定</p> <ul><li>-Xms：ms 即 memory start，指定堆的初始化内存大小，等价于<code>-XX:InitialHeapSize</code></li> <li>-Xmx：mx 即 memory max，指定堆的最大内存大小，等价于<code>-XX:MaxHeapSize</code></li></ul> <p>通常会把 -Xms 和 -Xmx 设为一样，这样在运行过程中，就不会在 GC 后去修改堆的大小，提高效率（这是建议的情况）</p> <p>默认情况下（这是什么也不设置的情况）</p> <ul><li>初始化内存大小 = 物理内存大小 / 64</li> <li>最大内存大小 = 物理内存大小 / 4</li></ul> <p>另外，可以通过`-XX: NewRatio``来配置新生代和老年代的比例，默认为 2，即</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="16.456ex" height="5.285ex" role="img" focusable="false" viewBox="0 -1426 7273.6 2336" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-2.059ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mfrac"><g data-mml-node="mrow" transform="translate(220,676)"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">新</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">生</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">代</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">对</text></g><g data-mml-node="mi" transform="translate(4000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">象</text></g></g><g data-mml-node="mrow" transform="translate(220,-710)"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">老</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">年</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">代</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">对</text></g><g data-mml-node="mi" transform="translate(4000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">象</text></g></g><rect width="5200" height="60" x="120" y="220"></rect></g><g data-mml-node="mo" transform="translate(5717.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(6773.6,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mfrac><mrow><mi mathvariant="normal">新</mi><mi mathvariant="normal">生</mi><mi mathvariant="normal">代</mi><mi mathvariant="normal">对</mi><mi mathvariant="normal">象</mi></mrow><mrow><mi mathvariant="normal">老</mi><mi mathvariant="normal">年</mi><mi mathvariant="normal">代</mi><mi mathvariant="normal">对</mi><mi mathvariant="normal">象</mi></mrow></mfrac><mo>=</mo><mn>2</mn></math></mjx-assistive-mml></mjx-container><p>也就是说在整个堆中，新生代对象占 1/3，老年代对象占 2/3，一般情况下不需要手动调整，只有明确知道存活时间长的对象偏多，那么就要调大 NewRatio</p> <p>在新生代中，又分为 Eden 区，Survivor0 区和 Survivor1 区，同样可以通过<code>-XX: SurvivorRatio</code>来进行调整，默认为<code>8:1:1</code></p> <ul><li>其中 Survivor0 区又叫 S0 区，也叫 from 区</li> <li>Survivor1 区又叫 S1 区，也叫 to 区</li></ul> <p>S0 和 S1 区用来存放 MinorGC（YGC）后存在的对象</p> <p><strong>对象 A 在堆中各个区域的流转过程</strong></p> <ol><li>A 被创建后，首先待在 Eden 区，当 Eden 区满了，触发 GC，如果 A 仍存活，流转至 S0 区</li> <li>经过不断的创建和 GC，S0 区也满了，同样触发 GC，此时 A 仍然存活，流转至 S1 区</li> <li>经过不断的创建和 GC，S1 区也满了，触发 GC，A 仍存活，流转至 S0 区（对象将在 S0 和 S1 区来回交替）</li> <li>A 经过了 15 次 YGC（阈值）仍然存活在 S0/S1，又一次 GC，A 仍存活，则流转至老年代</li></ol> <p>除了上述进入老年代的情形，还有这样两种特殊情况</p> <ul><li>当 S0 和 S1 都放不下 Eden 区本次 GC 存活的对象 B，那么 B 会直接流转至老年代（直接从 Eden 区跳转到老年代）</li> <li>还有一种情况，当创建了一个超大对象 C，整个 Eden 区都放不下，那么会直接把 C 放到老年代</li></ul> <h2 id="垃圾回收"><a href="#垃圾回收" class="header-anchor">#</a> 垃圾回收</h2> <p>之前也提到，整个 JVM 包括类加载子系统、运行时数据区和执行引擎，其中执行引擎包括</p> <ul><li>解释器：翻译字节码到机器码的程序</li> <li>JIT 解释器：解释器的“缓存”，缓存高频字节码指令对应机器码</li> <li>垃圾回收器：执行垃圾回收算法，在堆中进行 GC</li></ul> <p>垃圾回收是很重要的调优内容</p> <h3 id="什么是垃圾回收"><a href="#什么是垃圾回收" class="header-anchor">#</a> 什么是垃圾回收</h3> <blockquote><p>GC（Garbage Collection）</p></blockquote> <p>HotSpot VM 中的垃圾回收器以及适用场景</p> <ul><li>HotSpot VM 是 Sun 用于 Java 平台的虚拟机，也是 JDK1.3 及之后所有 Sun JDK 的默认虚拟机，当然，由于甲骨文收购了 BEA 和 Sun，所以 HotSpot VM 现在是 Oracle 的，他同时还拥有 JRockit VM</li></ul> <p>垃圾回收 GC 分类</p> <ul><li>Young GC / Minor GC：负责对新生代进行垃圾回收</li> <li>Old GC / Major GC：负责对老年代进行垃圾回收，目前只有 CMS 垃圾收集器会单独回收老年代，其他垃圾回收器都是在整堆回收的时候对老年代进行垃圾收集</li> <li>Full GC：整堆回收</li></ul> <p>为什么要垃圾回收？堆的内存有限，老的垃圾对象一直占着茅坑不拉屎，就会出现 OOM，回收是必要的</p> <ul><li>什么是垃圾：在 JVM 中没有任何引用指向他的对象</li></ul> <p>垃圾回收是为了解决内存泄露的问题？</p> <h3 id="垃圾标记"><a href="#垃圾标记" class="header-anchor">#</a> 垃圾标记</h3> <blockquote><p>先进行垃圾标记，而后再进行回收</p></blockquote> <p>垃圾标记阶段：找到 JVM 中（主要是堆中）的垃圾对象，有以下两种方式</p> <ul><li>引用计数法</li> <li>可达性分析法</li></ul> <p>引用计数法：每个对象维护一个计数器属性，记录当前对象被引用的次数</p> <ul><li>显然，实现很简单，当计数器为 0 时，为垃圾对象</li> <li>缺点：需要额外空间和时间开销来存储引用计数；<strong>无法处理循环引用的问题</strong></li></ul> <p>什么叫无法处理循环引用：例如 A 对象引用了 B，同时 B 对象引用了 A，如果采用引用计数，二者的计数器都为 1，将无法识别是否是垃圾（即使他们同时为垃圾对象），故而很少用这种方法来进行垃圾标记</p> <p>可达性分析法（用的最多的标记法）：以树状的方式，从 GC Root 根节点向下遍历，若可达，说明存在引用，否则则为垃圾对象</p> <p>GC Roots 是一组引用，包括</p> <ul><li>虚拟机栈中执行的方法参数、局部变量对应的对象引用</li> <li>本地方法栈中执行的方法参数、局部变量对应的对象引用</li> <li>方法区中保存的类信息中的静态属性、常量属性对应的对象引用</li></ul> <p>对于每个 Root 而言，即从某个局部变量开始，将其作为根，开始遍历引用，如果所有的 Roots 都没遍历到对象 A，那么 A 被标记为垃圾对象</p> <h3 id="垃圾回收算法"><a href="#垃圾回收算法" class="header-anchor">#</a> 垃圾回收算法</h3> <p><strong>标记-清除算法</strong>（Mark-Sweep）：遍历标记可达对象，再遍历清除非可达对象</p> <img src="/assets/img/image-20251020192901920.9ab1c660.png"> <ul><li>缺点：效率不高；会产生内存碎片</li> <li>优点：思路简单</li></ul> <p><strong>复制算法</strong>（Copying）：每找到一个可达对象，将其复制到一块顺序的空闲内存块中，而后对原有的内存块整块删除</p> <img src="/assets/img/image-20251020193443943.d7511a5d.png"> <p>优点</p> <ol><li>效率较高：只需要遍历一次就可实现，当找到可达对象，就直接复制（在标记-清除中，要先遍历一次找到可达对象，而后再遍历一次删除掉不可达的对象）</li> <li>无内存碎片</li></ol> <p>缺点</p> <ol><li>如果可达对象较多，会造成不必要的复制，降低性能 → 适合垃圾对象比较多的情况</li> <li>需要修改栈帧中的引用地址</li></ol> <p>在新生代中，Eden 区、S0 区和 S1 区的流转就伴随这样的复制，因为在新生代，垃圾对象的比例是比较高的，这样的算法是合算的</p> <p><strong>标记-整理算法</strong>（Mark-Compact）：双指针，在原地整理，就是一道<a href="https://leetcode.cn/problems/move-zeroes/description/" target="_blank" rel="nofollow noopener noreferrer">移动零<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，将非零元素（可达对象）整理到数组前侧；但注意，标记整理算法不是边遍历边移动，而是先遍历遍历，再遍历移动，最后遍历清除</p> <img src="/assets/img/image-20251020194232575.2076fb2b.png"> <ul><li>优点：无内存碎片；无需额外内存空间</li> <li>缺点：效率低于标记清除，因为这一过程相当于标记-整理-清除；和复制算法一样，需要修改栈帧中的引用地址</li></ul> <table><thead><tr><th>总结</th> <th>标记-清除</th> <th>标记-整理</th> <th>复制</th></tr></thead> <tbody><tr><td>时间效率</td> <td>O(2n)</td> <td>O(3n)</td> <td>O(n)</td></tr> <tr><td>空间开销</td> <td>O(1)</td> <td>O(1)</td> <td>O(n)</td></tr> <tr><td>内存碎片</td> <td>有</td> <td>无</td> <td>无</td></tr> <tr><td>移动对象（引用地址改变）</td> <td>否</td> <td>是</td> <td>是</td></tr></tbody></table> <h3 id="分代收集算法"><a href="#分代收集算法" class="header-anchor">#</a> 分代收集算法</h3> <blockquote><p>一种理念，而非具体的算法实现</p></blockquote> <p>几乎所有的垃圾收集器都是采用分代收集算法进行垃圾回收，这是由于新生代和老年代的对象性质决定的，新生代垃圾对象较多而老年代垃圾对象较少</p> <p>即，垃圾对象的密度决定了不同垃圾回收算法的实施，例如，若垃圾对象很多，采用复制算法将会有较高收益，反之若可达对象很多，则复制算法将会造成不必要的开销，故而垃圾回收要分代处理</p> <ul><li>新生代中，采用复制算法</li> <li>老年代中，不适合用复制算法，可以用标记-清除或标记-整理算法
<ul><li>CMS 垃圾收集器采用的就是标记-清除算法</li> <li>Serial Old 垃圾收集器采用的是标记-整理算法</li></ul></li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/01/10, 00:49:48</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/699675/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">锁、单例和原子性</div></a> <a href="/pages/e85ae0/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">JVM 基础（二）</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
