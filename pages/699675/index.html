    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>8️⃣ 当 7 中例子换为两个对象 p1 和 p2，问 p1.sendMs() 和 p2.call() 谁先执行？与 7 同理，二者用的并不是同一把锁，之间互不影响，低延迟的 call 先执行</p> <ul><li>static synchronized：锁的是 Class，唯一的一个模板</li> <li>synchronized：锁的是 new this，具体的一个对象</li></ul> <h2 id="锁分类"><a href="#锁分类" class="header-anchor">#</a> 锁分类</h2> <h3 id="悲观锁和乐观锁"><a href="#悲观锁和乐观锁" class="header-anchor">#</a> 悲观锁和乐观锁</h3> <blockquote><p>悲观锁：synchronized，乐观锁：CAS</p></blockquote> <p>悲观锁：上面的 SetNX 就是天然的分布式悲观锁（Redis 单线程），同一时间只有一个操作者独占锁，其他请求必须等待，适合冲突频繁的场景</p> <p>乐观锁：不阻塞，多个操作可以并行，可以通过版本号来检测冲突，只有用户当前的版本号和服务器的版本号一致的情况，才允许修改数据，适合冲突少的场景，性能优于悲观锁，有一点要注意的是，更新版本号的操作必须要上锁，这得是一个原子操作，常见的乐观锁实现</p> <ul><li>基于版本号实现：在数据上新增一个版本号字段，例如通过<code>newVersion := currentVersion + 1</code>实现</li> <li>基于时间戳实现：和版本号差不多，一个道理，只不过更新的数据从版本号变成当前时间戳</li> <li>基于 CAS（Compare And Swap）实现：版本号的优化版本</li></ul> <p>一个 CAS 的版本号示例</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// SaveBDJsonWithCAS 使用CAS实现乐观锁</span>
<span class="token keyword">func</span> <span class="token function">SaveBDJsonWithCAS</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>SaveBDJsonParam<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
  versionKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>DocVersionKey<span class="token punctuation">,</span> req<span class="token punctuation">.</span>DocID<span class="token punctuation">)</span>

  <span class="token comment">// 重试机制，上限为 3</span>
  maxRetries <span class="token operator">:=</span> <span class="token number">3</span>
  <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> maxRetries<span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
    <span class="token comment">// 1. 获取当前版本</span>
    currentVersion<span class="token punctuation">,</span> err <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>PegaDocOther<span class="token punctuation">.</span><span class="token function">Get</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> versionKey<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Int64</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> err <span class="token operator">!=</span> redis<span class="token punctuation">.</span>Nil <span class="token punctuation">{</span>
      <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>

    <span class="token comment">// 2. 检查版本（首次保存时跳过）</span>
    <span class="token keyword">if</span> req<span class="token punctuation">.</span>Version <span class="token operator">!=</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> req<span class="token punctuation">.</span>Version <span class="token operator">!=</span> currentVersion <span class="token punctuation">{</span>
      <span class="token keyword">return</span> <span class="token operator">&amp;</span>ConflictError<span class="token punctuation">{</span>
        CurrentVersion<span class="token punctuation">:</span> currentVersion<span class="token punctuation">,</span>
        Message<span class="token punctuation">:</span>       <span class="token string">&quot;文档已被其他用户修改，请刷新后重试&quot;</span><span class="token punctuation">,</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 3. CAS操作：只有当版本没变时才更新</span>
    newVersion <span class="token operator">:=</span> currentVersion <span class="token operator">+</span> <span class="token number">1</span>
    updated<span class="token punctuation">,</span> err <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>PegaDocOther<span class="token punctuation">.</span><span class="token function">SetNX</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> versionKey<span class="token punctuation">,</span> newVersion<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
      <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> updated <span class="token punctuation">{</span>
      <span class="token comment">// CAS成功，保存BDJSON</span>
      <span class="token keyword">return</span> <span class="token function">saveBDJsonToBOS</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// CAS失败，版本被修改，重试</span>
    resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;CAS failed, retrying&quot;</span><span class="token punctuation">,</span>
                                     logit<span class="token punctuation">.</span><span class="token function">Int64</span><span class="token punctuation">(</span><span class="token string">&quot;retry&quot;</span><span class="token punctuation">,</span> <span class="token function">int64</span><span class="token punctuation">(</span>i<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
  <span class="token punctuation">}</span>

  <span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;保存失败，请重试&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="非公平锁和公平锁"><a href="#非公平锁和公平锁" class="header-anchor">#</a> 非公平锁和公平锁</h3> <blockquote><p>非公平锁：synchronized，公平锁：ReentrantLock(true)</p></blockquote> <p>公平锁 / 非公平锁和乐观锁 / 悲观锁是一组正交的概念，他们讨论的是两类问题</p> <ul><li>乐观锁和悲观锁关注的是如何处理冲突，即具体实施，是通过 SetNX 还是通过版本号</li> <li>公平锁和非公平锁关注的是锁的获取，是 FIFO 还是饥饿抢占，即等待锁的排队顺序是否“公平”</li></ul> <p>例如：对于公平锁，如果有三个请求 a、b、c 按顺序打到互斥资源，那么锁的获取将按照 a、b、c 的顺序；但若是非公平锁，每一次锁释放，都会重新进行抢占，第一次 a 抢到了，释放后，b 和 c 重新进行抢占，谁抢到就是谁的，这时候要是又来一个请求 d，d 也有可能在 c 前面抢到锁，导致 c 饥饿（非公平，先来但抢不到）</p> <p>公平锁特点</p> <ul><li>严格按照请求顺序（FIFO）</li> <li>不会饥饿</li> <li>性能相对较低（需要维护队列）</li></ul> <p>非公平锁特点</p> <ul><li>不保证请求顺序，后来的可能先获得锁</li> <li>性能高（不需要维护队列）</li> <li>可能产生饥饿（某个请求一直抢不到）</li></ul> <p>进一步看，非公平锁有独占互斥的前置条件，即必须独占，才有饥饿等待，这指向悲观锁（因为乐观锁其实不会锁住），也就是说，只有悲观锁才会发生非公平的现象，乐观锁不需要考虑公平性，因为没有真正的阻塞</p> <ul><li>非公平悲观锁：如画布的风控锁，每个请求直接去拿 SetNX 锁</li> <li>公平悲观锁：用 Redis List 排队去拿 SetNX 锁</li></ul> <p>Java AQS 公平锁：AQS 是 AbstractQueuedSynchronizer（抽象队列同步器）的缩写，是 Java 并发包（JUC）中的核心框架，通过一个 state 变量 + 一个 FIFO 队列来实现同步</p> <p>在 Java 里，ReentrantLock 默认是非公平的，采用 CAS 检查，若构造为公平，则会利用 AQS 队列实现 FIFO，以实现公平锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// ReentrantLock 默认非公平</span>
<span class="token class-name">ReentrantLock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// ReentrantLock 公平模式</span>
<span class="token class-name">ReentrantLock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><h3 id="互斥锁和信号量"><a href="#互斥锁和信号量" class="header-anchor">#</a> 互斥锁和信号量</h3> <p>互斥锁：就是独占锁，例如基于 SetNX 实现的悲观锁、Java 里的 synchronized 锁和默认的 ReentrantLock 锁</p> <p>信号量：通过一个变量控制并发数量，如 JUC 里的 CountDownLatch</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">CountDownLatch</span> cdl <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CountDownLatch</span><span class="token punctuation">(</span><span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 同时允许 10 个并发</span>
<span class="token function">countDown</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 减一</span>
<span class="token function">await</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 加锁，当 cdl 减为 0 的时候阻塞</span>
</code></pre></div><p>读写锁是信号量的一个实例，一般而言，“写”使用互斥锁保证同时只有一个在写，而读操作利用信号量机制，同时允许 10 个用户去读（或者压根不对读加锁）</p> <p>信号量机制和互斥锁有本质区别，互斥锁的上锁解锁，必须由同一人触发，但信号量的“解锁”，可以是任意一个拿到信号量的线程去放开，这里在逻辑上存在一个优先级的判断</p> <p>值得区分的是：互斥锁和是否公平没有必然联系，但互斥锁大多数情况下默认是非公平的，例如 synchronized 和默认的 ReentrantLock，都是互斥非公平锁，但 ReentrantLock 也可以利用 AQS 排队实例化为公平锁</p> <h3 id="分段锁和桶级锁"><a href="#分段锁和桶级锁" class="header-anchor">#</a> 分段锁和桶级锁</h3> <p>全局锁、分段锁和桶级锁是锁细粒度层面的区分</p> <p>分段锁其实在很多地方都有应用，例如数据库的行级锁，一次事务只锁一行，如果用全局锁锁整个表将会是灾难，其核心思路即：把一整个共享资源拆成多个独立分段，每一段配一把独立锁；不同分段的线程互不阻塞、并发执行，仅同一段内才会锁竞争，降低全局锁的竞争、提升高并发吞吐</p> <ul><li>还有一个例子，腾讯文档的协同编辑，每一个数据块实际上是一个操作单元，后写会覆盖前写（这里没有加锁，采用的 Last Write Wins 的策略，追求性能），不同的数据块可以同时写</li></ul> <p>一般的处理步骤入戏</p> <ol><li>将大集合 / 大资源（哈希表、库存、计数器）均匀划分为 N 个独立段（Segment），每段存储一部分数据</li> <li>段独立锁：每个分段自带一把独立互斥锁，段与段之间锁完全隔离</li> <li>路由定位：通过 <code>key.hash % 分段数</code> 哈希取模，把操作路由到对应分段</li> <li>局部加锁：读写仅锁住当前分段，不影响其他所有分段</li></ol> <p>JDK 7 中的 ConcurrentHashMap 就是采用的分段锁处理</p> <ul><li>一个 ConcurrentHashMap 默认分成 16 个 Segment 分段，每个 Segment 是一个独立小哈希表 + 一把 <code>ReentrantLock</code> 锁</li> <li>增删改：先通过 key 哈希定位到分段 → 只锁住该分段 → 操作</li> <li>查询：无锁直接读，读写并发友好</li> <li>JDK8 及之后：废弃分段锁，改用 CAS + 数组桶级 synchronized 细粒度锁，粒度更细、开销更低</li></ul> <p>为什么要从分段锁改成 synchronized 的桶级锁？桶是什么，桶就是哈希链表的头</p> <ol><li><code>synchronized</code>被优化了，偏向锁 → 轻量级锁（自旋 CAS）→ 重量级锁，大部分情况性能碾压 ReentrantLock</li> <li><code>synchronized</code> 是 JVM 原生指令，更轻量，不用额外创建 Lock 对象，代码实现简单，不用手动加解锁</li> <li>锁粒度极小（仅桶头节点），竞争极低，synchronized 完全够用</li></ol> <p>二者对比</p> <table><thead><tr><th>锁类型 \ 特点</th> <th>锁</th> <th>锁住范围</th> <th>并发度</th> <th>问题</th></tr></thead> <tbody><tr><td>JDK7 分段锁</td> <td>16 个 Segment，1 个 Segment 一把锁</td> <td>分段内所有桶</td> <td>最高 16 个线程同时修改</td> <td>同分段不同桶依然互斥</td></tr> <tr><td>JDK8 桶级锁</td> <td>每一个数组桶单独一把锁（锁头节点）</td> <td>当前这一个桶</td> <td>理论上 = 数组长度（几千级别）</td> <td>只有同一个桶多线程操作才互斥，不同桶完全并行</td></tr></tbody></table> <h3 id="可重入锁、自旋锁和死锁"><a href="#可重入锁、自旋锁和死锁" class="header-anchor">#</a> 可重入锁、自旋锁和死锁</h3> <p>递归锁：只要拿到了外面的锁，就自动拿到了内部的锁，如一个同步方法中调用了另一个同步方法，在单个线程拿到外部方法的锁时，也自动同时拿到了内部同步方法的锁</p> <p>可重入锁：ReentrantLock 锁可以重复上锁，但 lock 和 unlock 必须配对，否则就会死锁，可重入就是指可以重复上锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">Lock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">a</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    lock<span class="token punctuation">.</span><span class="token function">lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;方法a加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 调用方法b</span>
    lock<span class="token punctuation">.</span><span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    lock<span class="token punctuation">.</span><span class="token function">lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">// 同一个线程，再次加同一把锁！</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;方法b加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    lock<span class="token punctuation">.</span><span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>每一次上锁 state 加一，解锁 state 减一，直到 state = 0，锁才真正释放 —— 一个区分加锁者的信号量（只有加锁者能够解锁）</p> <p>synchronized 是天然的可重入锁，递归锁到方法 b，调用方法 a 完全正常，不会死锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">synchronized</span> <span class="token keyword">void</span> <span class="token function">a</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;a加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">synchronized</span> <span class="token keyword">void</span> <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;b加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>为什么要用可重入锁，以 CHM 为例：CHM 内部方法嵌套调用非常多，比如 put 里面会调用扩容、调用节点插入、调用计数方法，层层调用都要加同一把分段锁，必须可重入，否则直接死锁</p> <p>自旋锁（Spin Lock）：AtomicInteger 的 getAndIncrement 方法用了自旋锁，本质上是一个<code>do{} while()</code>循环</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 在 AtomicInteger 的 getAndIncrement 方法中 ——&gt; var1=AtomicInteger.class（地址），var2=AtomicInteger.get()（当前值），var4=1</span>
<span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">int</span> <span class="token function">getAndAddInt</span><span class="token punctuation">(</span><span class="token class-name">Object</span> var1<span class="token punctuation">,</span> <span class="token keyword">long</span> var2<span class="token punctuation">,</span> <span class="token keyword">int</span> var4<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> var5<span class="token punctuation">;</span>
    <span class="token comment">//自旋锁</span>
    <span class="token keyword">do</span> <span class="token punctuation">{</span>
        <span class="token comment">//获取当前值：从地址上读取</span>
        var5 <span class="token operator">=</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getIntVolatile</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//与上类似，执行一个CAS(比较交换)函数：var1和var2确定当前值(地址+长度)，var5为其先记录的当前值，当二者相同时，将自身替换为var5+var4(1)</span>
    <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token operator">!</span><span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">,</span> var5<span class="token punctuation">,</span> var5 <span class="token operator">+</span> var4<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">return</span> var5<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>死锁（Dead Lock）：比如<code>ReentrantLock l</code>锁<code>l.lock()</code>后忘记<code>l.unlock()</code>了，那么所有等待锁<code>l</code>的线程都会卡死，即为死锁</p> <h2 id="java-内存模型"><a href="#java-内存模型" class="header-anchor">#</a> Java 内存模型</h2> <h3 id="jmm-和-threadlocal"><a href="#jmm-和-threadlocal" class="header-anchor">#</a> JMM 和 ThreadLocal</h3> <p>JMM（Java Memory Model），实际上是一套关于 Java 线程之间同步的约定</p> <ol><li>线程解锁前，必须把共享变量立刻同步刷回主存
<ul><li>在线程工作时，实际上是将主存中的变量拷贝一份到线程的工作内存中（值传递），对那份拷贝的变量进行操作</li> <li>线程解锁前，必须将这份变量刷新回主存，使数据更新</li></ul></li> <li>线程加锁前，必须读取主存中的最新值到工作内存中</li> <li>加锁和解锁必须使用同一把锁</li></ol> <p>关于线程、主内存、工作内存的八个操作</p> <table><thead><tr><th>操作</th> <th>解释</th></tr></thead> <tbody><tr><td>lock</td> <td>锁定，作用域主内存的变量，把一个变量表示为线程独占状态</td></tr> <tr><td>unlock</td> <td>解锁，作用于主内存的变量，它把一个处于锁定状态的的变量释放出来，释放后的变量可以被其他线程锁定</td></tr> <tr><td>read</td> <td>读取，作用于主内存变量，它把一个变量的值从主内存传输到线程的工作内</td></tr> <tr><td>load</td> <td>载入，作用于工作内存的变量，它把 read 操作从主存中变量放入工作内存中</td></tr> <tr><td>use</td> <td>线程的执行引擎使用工作内存中的变量</td></tr> <tr><td>assignstore</td> <td>赋值，把执行引擎接受到的值重新赋给那个变量</td></tr> <tr><td>store</td> <td>把工作内存中的一个变量传送到主存中</td></tr> <tr><td>write</td> <td>把 store 操作从工作内存中得到的变量的值放入主存的变量中</td></tr></tbody></table> <p>JMM 对这八种指令的使用，制定了如下规则怪谈</p> <ol><li>不允许 read / load 和 store / write 操作之一单独出现，即 read 了必须 load ，store 了必须 write</li> <li>不允许线程丢弃它最近的 assign 操作，即工作变量的数据改变了后必须告知主存</li> <li>不允许一个线程将没有 assign 的数据从工作内存同步回主存</li> <li>一个新变量必须从主存中诞生，不允许工作内存直接使用一个未被初始化的便改良，也就是说对变量实施 use、store 操作之前必须经过 load 和 assign 操作</li> <li>一个变量同一时间只有一个线程能对其进行 lock，多次 lock 后，即重入锁后，必须执行相同次数的 unlcok 才能解锁</li> <li>如果对同一变量进行 lock 操作，回清空所有工作内存中此变量的值，在执行引擎使用这个变量前，必须重新 load 或 assign 操作初始化变量的值</li> <li>如果一个变量没有被 lock，就不同对其进行 unlock，也不能 unlock 一个被其他线程锁住的变量</li> <li>对一个变量进行 unlock 操作之前，必须把此变量同步回主存</li></ol> <p>ThreadLocal 类：将数据与线程做绑定，类似于 Thread 的 Session，在多线程场景下做参数透传或数据流转</p> <h3 id="volatile-和原子类"><a href="#volatile-和原子类" class="header-anchor">#</a> Volatile 和原子类</h3> <p>对于以下代码</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">JMMTest</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">volatile</span> <span class="token keyword">int</span> num <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//main线程</span>
        <span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span><span class="token keyword">while</span><span class="token punctuation">(</span>num<span class="token operator">==</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            num <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>num<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>当主存中变量更改后，线程的工作栈由于看不到这一改变，依旧在原来的基础上执行，即线程读入 num 为 0，导致线程一直卡死，即使在 2s 后 num 被主线程修改为 1 了，子线程依旧卡在这个 while 循环中</p> <ul><li>主线程对 num 的修改，子线程是“不可见的”</li></ul> <p>这个时候就要引入 volatile 关键字来解决这一问题，volatile 是 java 虚拟机提供的轻量级的同步机制</p> <ol><li>保证可见性</li> <li>禁止指令重排</li></ol> <p>volatile 保证可见性：在上述代码中把 num 用 volatile 修饰后可解决线程对主存变量 num 的不可见性问题，当主线程修改 num 后，会同步到每一个读入了 num 的子线程</p> <blockquote><p>指令重排：什么是指令重排？我们写的程序，计算机并不是按照我们写的那样去一行行执行，它会经过编译器优化的重排 → 指令并行重排 → 内存系统重排 → 最后执行机器码</p></blockquote> <p>Volatile 禁止指令重排：禁止编译器对你所写代码的优化指令重排，在多线程场景下，例如某个线程中 a → b → c 和 a → c → b 的执行结果一样，但另一个线程依赖于 b 的中间状态，如果擅自的重排，可能导致复杂的错乱</p> <p>但注意，Volatile 不保证原子性（事务性），在 Java 里，只有加锁能够保证代码执行的原子性</p> <ol><li>要么对 add 方法用 synchronized 修饰</li> <li>要么用 lock 锁把 add 方法锁住</li> <li>使用原子类解决原子性问题</li></ol> <p>加锁的方法不再赘述，我们来看看原子类（Atomic），这实际上是 JUC 的一个子包（<code>java.util.concurrent.atomic.*</code>），原子类的底层都直接和操作系统挂钩，通过 Unsafe 类直接调用的 C++ 实现的 Native 函数在内存中修改值，这是一个原子性的 +1</p> <img src="/assets/img/image-20210801192553197.e349e8ab.png"> <h3 id="cas-和-aba-问题"><a href="#cas-和-aba-问题" class="header-anchor">#</a> CAS 和 ABA 问题</h3> <p>CAS（compare and swap）是一种基于锁的操作（乐观锁），像 synchronized、Lock、ReadWriteLock 均为悲观锁，CAS 在操作数据前通过比较值来检查“是否可修改”，原子类就利用了 CAS 操作实现其原子性</p> <blockquote><p>但需要注意的是 Java 不能直接操作内存，但能直接操作 C++（navtive 方法），通过 C++ 来操作内存，C++ 是 Java 的后门，Unsafe 类即是 C++ 提供的一扇后门</p></blockquote> <p>点开 Unsafe 类可以发现其方法都是些 native 方法</p> <img src="/assets/img/image-20210801192926744.6b5ae8f7.png"> <p>compareAndSet</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CASDemo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//初始化 AtomicInteger</span>
        <span class="token class-name">AtomicInteger</span> atomicInteger <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicInteger</span><span class="token punctuation">(</span><span class="token number">2021</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//达到 expect 后 update 数值，即当atomicInteger为2021时更新其为2017，否则更新失败返回false</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicInteger<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">2021</span><span class="token punctuation">,</span> <span class="token number">2017</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicInteger<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">boolean</span> <span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token keyword">int</span> expect<span class="token punctuation">,</span> <span class="token keyword">int</span> update<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> unsafe<span class="token punctuation">.</span><span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">,</span> valueOffset<span class="token punctuation">,</span> expect<span class="token punctuation">,</span> update<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">native</span> <span class="token keyword">boolean</span> <span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span><span class="token class-name">Object</span> var1<span class="token punctuation">,</span> <span class="token keyword">long</span> var2<span class="token punctuation">,</span> <span class="token keyword">int</span> var4<span class="token punctuation">,</span> <span class="token keyword">int</span> var5<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>getAndIncrement</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span>concurrent<span class="token punctuation">.</span>atomic<span class="token punctuation">.</span></span><span class="token class-name">AtomicInteger</span></span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CASDemo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//初始化 AtomicInteger</span>
        <span class="token class-name">AtomicInteger</span> atomicInteger <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicInteger</span><span class="token punctuation">(</span><span class="token number">2017</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//加一</span>
        atomicInteger<span class="token punctuation">.</span><span class="token function">getAndIncrement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicInteger<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">int</span> <span class="token function">getAndIncrement</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> unsafe<span class="token punctuation">.</span><span class="token function">getAndAddInt</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">,</span> valueOffset<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 在 AtomicInteger 的 getAndIncrement 方法中 ——&gt; var1=AtomicInteger.class（地址），var2=AtomicInteger.get()（当前值），var4=1</span>
<span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">int</span> <span class="token function">getAndAddInt</span><span class="token punctuation">(</span><span class="token class-name">Object</span> var1<span class="token punctuation">,</span> <span class="token keyword">long</span> var2<span class="token punctuation">,</span> <span class="token keyword">int</span> var4<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> var5<span class="token punctuation">;</span>
    <span class="token comment">//自旋锁</span>
    <span class="token keyword">do</span> <span class="token punctuation">{</span>
        <span class="token comment">//获取当前值：从地址上读取</span>
        var5 <span class="token operator">=</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getIntVolatile</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//与上类似，执行一个CAS(比较交换)函数：var1和var2确定当前值(地址+长度)，var5为其先记录的当前值，当二者相同时，将自身替换为var5+var4(1)</span>
    <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token operator">!</span><span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">,</span> var5<span class="token punctuation">,</span> var5 <span class="token operator">+</span> var4<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">return</span> var5<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>缺点：循环会耗时；一次性只能保证一个共享变量的原子性；会引起 ABA 问题</p> <p>ABA 问题：单纯的 CAS 会导致 ABA 问题，这是一种无感知的 A → B → A（把某次变更记录 amend 了，虽然最后的结果是一致的），在某些场景下是不被允许的（例如转账记录）</p> <p>在以下情形，线程一并不会知道变量 A = 1 已经被线程二动过了（有一个 1 → 3 → 1 的过程），只会继续执行它的 CAS 操作，这样是不对的，因为线程一想操作的是原始的 1，而不是经过两次迭代回来的 1</p> <img src="/assets/img/image-20210801214045149.fbd65efd.png"> <p>原子引用：在 Java 中，为了解决上述问题，引入原子引用类<code>AtomicStampedReference&lt;V&gt;</code>，引入版本控制</p> <img src="/assets/img/image-20210802152221674.8cdb0fae.png"> <p>该类用版本号的方式防止 ABA 问题，即每次 cas 操作后手动令版本号（stamp）加一，若线程中事先获得的版本号与当前类版本号不符，则无法实现 cas 操作</p> <p>不符是指此处在线程 A 中事先记录的 stamp 与 <code>atomicReference.getStamp()</code> 不符，即版本号不符，无法进行 cas 操作</p> <img src="/assets/img/image-20210802164810192.e53b33da.png"> <p>一个带上版本号的 CAS +1 操作，重的没边了</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CASDemo02</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span> <span class="token punctuation">{</span>
        <span class="token class-name">AtomicStampedReference</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">&gt;</span></span> atomicReference <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicStampedReference</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token number">121</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span>
            <span class="token keyword">int</span> stamp <span class="token operator">=</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">try</span> <span class="token punctuation">{</span>
                <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">121</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> stamp<span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token string">&quot;A&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">121</span><span class="token punctuation">,</span> <span class="token number">95</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">95</span><span class="token punctuation">,</span> <span class="token number">121</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token string">&quot;B&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">getReference</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="锁的工程实践"><a href="#锁的工程实践" class="header-anchor">#</a> 锁的工程实践</h2> <h3 id="java-juc-锁"><a href="#java-juc-锁" class="header-anchor">#</a> Java JUC 锁</h3> <p>简单的办法就是给 service 的业务方法用 synchronized  修饰，这里的粒度会比较粗，但是其实大多时候够用了，除非需要用到一些锁的高级特性（如超时、公平锁等），才考虑 <code>ReentrantLock</code>，简单来说</p> <div class="language- extra-class"><pre class="language-text"><code>能用 synchronized 解决的，就别用 ReentrantLock
     ↓
需要 尝试获取锁 / 限时等待 / 可中断 / 公平锁 时
     ↓
换 ReentrantLock
</code></pre></div><p>例如对查 DB 和更新 DB 在业务层面上锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Service</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">InventoryService</span> <span class="token punctuation">{</span>

    <span class="token comment">// 锁对象，必须用 final，保证引用不变</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Object</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Object</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">deductStock</span><span class="token punctuation">(</span><span class="token class-name">Long</span> productId<span class="token punctuation">,</span> <span class="token keyword">int</span> quantity<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">// 只包裹临界区，保持锁粒度尽量小</span>
        <span class="token keyword">synchronized</span> <span class="token punctuation">(</span>lock<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token comment">// 1. 查库存</span>
            <span class="token keyword">int</span> stock <span class="token operator">=</span> <span class="token function">getStockFromDB</span><span class="token punctuation">(</span>productId<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token comment">// 2. 判断</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>stock <span class="token operator">&lt;</span> quantity<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">RuntimeException</span><span class="token punctuation">(</span><span class="token string">&quot;库存不足&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token comment">// 3. 扣减</span>
            <span class="token function">updateStockInDB</span><span class="token punctuation">(</span>productId<span class="token punctuation">,</span> stock <span class="token operator">-</span> quantity<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 这两个方法不在锁内，是模拟 DB 操作的</span>
    <span class="token keyword">private</span> <span class="token keyword">int</span> <span class="token function">getStockFromDB</span><span class="token punctuation">(</span><span class="token class-name">Long</span> productId<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">/* 查数据库 */</span> <span class="token punctuation">}</span>
    <span class="token keyword">private</span> <span class="token keyword">void</span> <span class="token function">updateStockInDB</span><span class="token punctuation">(</span><span class="token class-name">Long</span> productId<span class="token punctuation">,</span> <span class="token keyword">int</span> newStock<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">/* 更新数据库 */</span> <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>当然也可以用 ReentrantLock，可以使用尝试获取锁、设置超时、可中断等特性</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Service</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">InventoryService</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">ReentrantLock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">deductStock</span><span class="token punctuation">(</span><span class="token class-name">Long</span> productId<span class="token punctuation">,</span> <span class="token keyword">int</span> quantity<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        lock<span class="token punctuation">.</span><span class="token function">lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token keyword">int</span> stock <span class="token operator">=</span> <span class="token function">getStockFromDB</span><span class="token punctuation">(</span>productId<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>stock <span class="token operator">&lt;</span> quantity<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">RuntimeException</span><span class="token punctuation">(</span><span class="token string">&quot;库存不足&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token function">updateStockInDB</span><span class="token punctuation">(</span>productId<span class="token punctuation">,</span> stock <span class="token operator">-</span> quantity<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">finally</span> <span class="token punctuation">{</span>
            lock<span class="token punctuation">.</span><span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 必须在 finally 里解锁</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 进阶：带超时的尝试获取</span>
    <span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">tryDeductStock</span><span class="token punctuation">(</span><span class="token class-name">Long</span> productId<span class="token punctuation">,</span> <span class="token keyword">int</span> quantity<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>lock<span class="token punctuation">.</span><span class="token function">tryLock</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span> <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">try</span> <span class="token punctuation">{</span>
                    <span class="token comment">// 业务逻辑同上...</span>
                    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
                <span class="token punctuation">}</span> <span class="token keyword">finally</span> <span class="token punctuation">{</span>
                    lock<span class="token punctuation">.</span><span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span>
            <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span> <span class="token comment">// 没获取到锁</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">currentThread</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">interrupt</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="go-rwmutex-读写锁"><a href="#go-rwmutex-读写锁" class="header-anchor">#</a> Go RWMutex 读写锁</h3> <p>Go 本地读写锁</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">var</span> <span class="token punctuation">(</span>
    mu    sync<span class="token punctuation">.</span>RWMutex
    handlers <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>TaskHandler<span class="token punctuation">)</span>
<span class="token punctuation">)</span>

<span class="token comment">// Register 注册任务Handler</span>
<span class="token keyword">func</span> <span class="token function">Register</span><span class="token punctuation">(</span>taskName <span class="token builtin">string</span><span class="token punctuation">,</span> h TaskHandler<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    mu<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">defer</span> mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">if</span> h <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token function">panic</span><span class="token punctuation">(</span><span class="token string">&quot;handler is nil&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> exist <span class="token operator">:=</span> handlers<span class="token punctuation">[</span>taskName<span class="token punctuation">]</span><span class="token punctuation">;</span> exist <span class="token punctuation">{</span>
        <span class="token function">panic</span><span class="token punctuation">(</span><span class="token string">&quot;task handler already registered&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    handlers<span class="token punctuation">[</span>taskName<span class="token punctuation">]</span> <span class="token operator">=</span> h
<span class="token punctuation">}</span>
</code></pre></div><h3 id="redis-分布式锁"><a href="#redis-分布式锁" class="header-anchor">#</a> Redis 分布式锁</h3> <p>通过 <code>SET NX EX</code> 实现分布式的悲观锁</p> <p><strong>utils/clients/redis.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// RedisLock ...</span>
<span class="token keyword">func</span> <span class="token function">RedisLock</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> client redis<span class="token punctuation">.</span>Client<span class="token punctuation">,</span> key <span class="token builtin">string</span><span class="token punctuation">,</span> timeout <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ret<span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;SET&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;NX&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;EX&quot;</span><span class="token punctuation">,</span> timeout<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;lock failed:&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> ret <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token comment">// lock failed</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token comment">// lock ok</span>
    unlock <span class="token operator">:=</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;del&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;unlock failed:&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> unlock
<span class="token punctuation">}</span>
</code></pre></div><p>把他放在需要加锁的操作前即可，使用类似于</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">getAvailablePort</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> sshConfig <span class="token operator">*</span>config<span class="token punctuation">.</span>SshProxyItem<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">defer</span> <span class="token function">RedisLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> lockKey<span class="token punctuation">,</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span>
    <span class="token comment">// 加锁的业务逻辑...</span>
<span class="token punctuation">}</span>
</code></pre></div><p>例如：任务执行后的状态回写，因为可能存在多个线程同时操作同一环境并进行回写，这里做一个排斥的必然的</p> <ol><li>若 source = web-server，说明是定时任务 collector 触发的主动回调，这里直接用悲观锁</li> <li>若非 web-server，说明是第三方被动回调，需要加高优先级锁，在主动调用的场景，需要先检查这把高优先级的锁，被动回调没有上锁，才能去拿主动调用的锁（主动调用要求回避被动回调）</li></ol> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// UpdateStatus ...</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">UpdateStatus</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> taskId<span class="token punctuation">,</span> status<span class="token punctuation">,</span> userName<span class="token punctuation">,</span> source<span class="token punctuation">,</span>
    message <span class="token builtin">string</span><span class="token punctuation">,</span> code <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    <span class="token comment">// 主动处理任务需要加锁</span>
    <span class="token keyword">if</span> source <span class="token operator">==</span> Source <span class="token punctuation">{</span>
        <span class="token comment">// 定时任务触发的主动回调，尝试获取锁，获取不到退出</span>
        <span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
        <span class="token comment">// 加高优先级锁</span>
        <span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleCallbackLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> err
        <span class="token punctuation">}</span>
        <span class="token keyword">defer</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleCallbackUnlock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span>
        <span class="token comment">// 第三方被动回调，会不停尝试获取锁，直到超时</span>
        <span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskWaitingLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">defer</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskUnlock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span>
    <span class="token comment">// ...</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里的第三方被动回调去拿取任务锁，用了一个 5s 的自旋锁</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// HandleTaskWaitingLock 获取任务回调update status锁，乐观锁，最多等5秒</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">HandleTaskWaitingLock</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> taskId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
	timeoutChan <span class="token operator">:=</span> time<span class="token punctuation">.</span><span class="token function">After</span><span class="token punctuation">(</span><span class="token number">5</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
	<span class="token keyword">for</span> <span class="token punctuation">{</span>
		<span class="token keyword">select</span> <span class="token punctuation">{</span>
		<span class="token keyword">case</span> <span class="token operator">&lt;-</span>timeoutChan<span class="token punctuation">:</span>
			<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>InvokeErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;等待任务回调update status锁超时, taskId: %s&quot;</span><span class="token punctuation">,</span> taskId<span class="token punctuation">)</span>
		<span class="token keyword">default</span><span class="token punctuation">:</span>
			<span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">return</span> <span class="token boolean">nil</span>
			<span class="token punctuation">}</span>
			time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">100</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Millisecond<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>自旋锁本质上是悲观锁的变体，而不是乐观锁，这里 xiyou 的注释有误</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/07/06, 22:23:52</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/48385f/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Golang 基础</div></a> <a href="/pages/86248e/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">面向机试编程</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
