路和经验，琛狗如是说</p> <h2 id="icsl-铜级考试"><a href="#icsl-铜级考试" class="header-anchor">#</a> ICSL 铜级考试</h2> <h3 id="风险点与设计规范"><a href="#风险点与设计规范" class="header-anchor">#</a> 风险点与设计规范</h3> <table><thead><tr><th>方向 \ 内容</th> <th></th></tr></thead> <tbody><tr><td>Java &amp; Web</td> <td>1. Spring Boot<br>2. Java 三大器：Listener、Filter、Intercepter<br>3. Java 安全模型<br>4. Java 类加载机制<br>5. Java 多线程<br>6. Java 网络编程<br>7. IOC、DI 和 AOP<br>8. Java 反射机制</td></tr> <tr><td>数据库 DB</td> <td>1. MySQL<br>2. ORM<br>3. Redis<br>4. MongoDB</td></tr> <tr><td>脚本语言 Script</td> <td>1. Python HTTP<br>2. Python Socket<br>3. Python Burpsuite 插件开发<br>4. Python 本地碰撞密码</td></tr> <tr><td>后端安全 Web Back Security</td> <td>1. 身份认证和权限控制<br>2. SQL 注入<br>3. 代码注入<br>4. OS 命令注入<br>5. XML 注入<br>6. SSRF 漏洞<br>7. Java 反序列化漏洞</td></tr> <tr><td>前端安全 Web Front Security</td> <td>1. XSS 反射漏洞</td></tr> <tr><td>框架安全 Web Framework Security</td> <td>1. Apache<br>2. Nginx<br>3. Tomcat<br>4. Jetty<br>5. Flask<br>6. Beego<br>7. BME</td></tr></tbody></table> <p>五大设计规范</p> <ol><li>会话管理安全设计规范</li> <li>密码算法应用规范</li> <li>密码管理安全规范</li> <li>身份与访问管理安全规范</li> <li>隐私保护设计规范</li></ol> <h3 id="白盒验证测试方法"><a href="#白盒验证测试方法" class="header-anchor">#</a> 白盒验证测试方法</h3> <blockquote><p>验证测试部</p></blockquote> <p>一般的审计流程</p> <ol><li>工具扫危险点，通常是一些危险函数和危险语句</li> <li>分析入参传递，是否能从上层达到危险点并执行</li> <li>依次排除</li></ol> <p>方法论</p> <ul><li>收集产品信息</li> <li>制定测试策略</li> <li>掌握测试方法</li> <li>输出测试报告</li></ul> <p>合规类问题验证</p> <ul><li>敏感信息泄露</li> <li>密码算法合规</li> <li>不安全协议和加密套件</li> <li>源码无公网地址</li></ul> <p>典型漏洞验证</p> <ul><li>SQL 注入</li> <li>远程命令执行</li> <li>XML 注入</li> <li>XSS 漏洞</li> <li>文件上传 / 下载</li></ul> <p>业务逻辑类问题验证</p> <ul><li>权限控制</li> <li>绕过安全过滤</li> <li>条件竞争</li></ul> <p>一些调试习惯</p> <ul><li>断点调试：打断点跑项目或许是读懂源码的最快方式
<ul><li>打断点 → debug 运行 → 打断点 → 查看变量值 / 计算表达式值 → 断点步入 → 下一跳 → 下一断点 → 忽略断点</li></ul></li> <li>IDEA 快捷键
<ul><li>Ctrl + Alt + 左右方向键：找到上/下一个高亮</li> <li>Alt + F8：计算表达式值</li> <li>Ctrl + Alt + H：查看完整调用链</li> <li>准星设置：“始终选择打开的文件”</li></ul></li> <li>防御型编程
<ul><li>第一，永远不要相信上层输入</li> <li>第二，永远不要向上层暴露底层信息</li></ul></li></ul> <p>重点是关注漏洞的传递，即污点是否能够抵达危险函数，危险函数并不可怕，只需要加上防御机制就并非漏洞</p> <h2 id="常见-web-漏洞"><a href="#常见-web-漏洞" class="header-anchor">#</a> 常见 Web 漏洞</h2> <p><a href="https://github.com/whgojp/JavaSecLab" target="_blank" rel="nofollow noopener noreferrer">whgojp/JavaSecLab: JavaSecLab is a comprehensive Java vulnerability platform<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="sql-注入"><a href="#sql-注入" class="header-anchor">#</a> SQL 注入</h3> <p>攻击者在 Web 应用的输入字段中插入恶意 SQL 语句，使得服务器执行非预期的数据库操作，造成</p> <ul><li>数据泄露（如用户名密码）</li> <li>数据篡改或删除</li> <li>登录绕过</li> <li>提权（如使用 <code>xp_cmdshell</code>）</li></ul> <p>示例</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code>输入用户名: <span class="token string">' OR '</span><span class="token number">1</span><span class="token string">'='</span><span class="token number">1</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="文件操纵"><a href="#文件操纵" class="header-anchor">#</a> 文件操纵</h3> <p>利用用户对文件路径或内容的输入控制，执行非法文件操作，如读取任意文件、覆盖系统文件等</p> <p>常见类型</p> <ul><li>任意文件读取（LFI / Path Traversal）</li> <li>任意文件上传</li> <li>文件包含（RFI / LFI）</li></ul> <p>危害</p> <ul><li>读取敏感文件（如 <code>/etc/passwd</code>）</li> <li>上传 Webshell，远程控制服务器</li></ul> <p>示例</p> <div class="language-http line-numbers-mode"><pre class="language-http"><code>GET /?file=../../../../etc/passwd
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="ssrf"><a href="#ssrf" class="header-anchor">#</a> SSRF</h3> <p>服务器端请求伪造：攻击者诱导服务器向内网或其他受保护资源发起请求，实现信息收集或攻击内网</p> <p>危害</p> <ul><li>扫描内网服务</li> <li>获取内网接口数据</li> <li>利用云服务元数据获取访问凭证（如 AWS）</li></ul> <p>示例</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>http://localhost:8080/fetch?url<span class="token operator">=</span>http://169.254.169.254/latest/meta-data/
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="命令注入"><a href="#命令注入" class="header-anchor">#</a> 命令注入</h3> <p>Web 应用中拼接了用户输入到系统命令中，攻击者可以注入并执行恶意命令</p> <p>危害</p> <ul><li>远程执行任意系统命令</li> <li>上传、删除、修改文件</li> <li>建立反弹 shell</li></ul> <h3 id="xml-注入"><a href="#xml-注入" class="header-anchor">#</a> XML 注入</h3> <p>包括 XXE，攻击者构造恶意 XML 数据，通过外部实体注入（XXE）实现文件读取、请求伪造等</p> <p>危害</p> <ul><li>任意文件读取</li> <li>SSRF</li> <li>拒绝服务（DoS）</li> <li>泄露内存信息</li></ul> <p>示例</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token doctype"><span class="token punctuation">&lt;!</span><span class="token doctype-tag">DOCTYPE</span> <span class="token name">foo</span> <span class="token punctuation">[</span><span class="token internal-subset">
  <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>!ELEMENT</span> <span class="token attr-name">foo</span> <span class="token attr-name">ANY</span> <span class="token punctuation">&gt;</span></span>
  &lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot; &gt;
</span><span class="token punctuation">]</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>foo</span><span class="token punctuation">&gt;</span></span><span class="token entity named-entity" title="&amp;xxe;">&amp;xxe;</span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>foo</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="本地提权"><a href="#本地提权" class="header-anchor">#</a> 本地提权</h3> <p>Local Privilege Escalation：攻击者在系统中已经获得低权限账户，通过利用系统漏洞、配置错误等方式，提升至管理员权限</p> <p>常见方式</p> <ul><li>利用 SUID 程序漏洞</li> <li>滥用计划任务（cron）</li> <li>漏洞内核（如 Dirty COW）</li></ul> <p>危害</p> <ul><li>获得 root 权限</li> <li>控制整个主机</li> <li>持久化攻击入口</li></ul> <h2 id="靶场练手"><a href="#靶场练手" class="header-anchor">#</a> 靶场练手</h2> <p>练手靶场</p> <ul><li><a href="https://www.wechall.net/" target="_blank" rel="nofollow noopener noreferrer">WeChall<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://ctf.hacker101.com/ctf" target="_blank" rel="nofollow noopener noreferrer">Hacker101 CTF<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/whgojp/JavaSecLab" target="_blank" rel="nofollow noopener noreferrer">JavaSecLab<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>常见工具</p> <ul><li>Kali Linux</li> <li>Windows：UTools、Listary、BurpSuite</li></ul> <h3 id="micro-cms-v1"><a href="#micro-cms-v1" class="header-anchor">#</a> Micro-CMS v1</h3> <p>CMS（Content Management System）：网站内容管理系统</p> <p>通过 js 脚本直接注入 html，这是最简单常用的 POC（Proof of Concept，漏洞验证）</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>script</span><span class="token punctuation">&gt;</span></span><span class="token script"><span class="token language-javascript"><span class="token function">alert</span><span class="token punctuation">(</span>\xss<span class="token punctuation">)</span></span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>script</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>通过 img 标签的错误事件（随便请求一张图片）注入js事件</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>img</span> <span class="token attr-name">src</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span>x</span> <span class="token special-attr"><span class="token attr-name">onerror</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token value javascript language-javascript"><span class="token function">alert</span><span class="token punctuation">(</span>xss<span class="token punctuation">)</span></span></span></span><span class="token punctuation">&gt;</span></span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="training-get-sourced"><a href="#training-get-sourced" class="header-anchor">#</a> Training: Get Sourced</h3> <p><code>F12</code>查看<code>HTML</code>源码，答案写在注释里，藏在<code>body</code>的右下方</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token comment">&lt;!-- Now this is a comment! --&gt;</span>
<span class="token comment">&lt;!-- You are looking for this password: html_sourcecode --&gt;</span>       
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>body</span><span class="token punctuation">&gt;</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>html</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="training-stegano-i"><a href="#training-stegano-i" class="header-anchor">#</a> Training: Stegano Ⅰ</h3> <p>通过<code>html</code>代码找到图片源下载，得到<code>btegano1.bmp</code>，直接用记事本或者<code>notepad++</code>打开，或修改后缀为<code>.txt</code>打开，可得到答案</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>BMf       6   (               0                   Look what the hex-edit revealed: passwd:steganoI
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>可以用<code>notepad++</code>等编辑器打开<code>bmp</code>文件，在末尾加入文字信息（若用记事本直接修改将损坏文件）</p> <h3 id="training-mysql-i"><a href="#training-mysql-i" class="header-anchor">#</a> Training: MySQL Ⅰ</h3> <p>查看后端源码发现登录的<code>SQL</code>语句是这么写的，同时发现了管理员用户名<code>admin</code></p> <div class="language-php line-numbers-mode"><pre class="language-php"><code><span class="token variable">$query</span> <span class="token operator">=</span> <span class="token string double-quoted-string">&quot;SELECT * FROM users WHERE username='<span class="token interpolation"><span class="token variable">$username</span></span>' AND password='<span class="token interpolation"><span class="token variable">$password</span></span>'&quot;</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>可以在传入用户名时动手脚</p> <p>1、传入<code>admin'#</code>，这样<code>sql</code>语句的字符串将变成</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>&quot;select * from users where username='admin''#...&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>于是验证密码的部分被替换为<code>sql</code>注释，因为<code>admin</code>存在，返回一定为真</p> <p>2、传入<code>admin' or '1</code></p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> users <span class="token keyword">where</span> username<span class="token operator">=</span><span class="token string">'admin'</span> <span class="token operator">or</span> <span class="token string">'1'</span> <span class="token operator">and</span> password<span class="token operator">=</span><span class="token string">'$password'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>同样因为掺入了<code>1</code>，于是返回始终为真</p> <h3 id="training-crypto-caesar-i"><a href="#training-crypto-caesar-i" class="header-anchor">#</a> Training:  Crypto-Caesar Ⅰ</h3> <p>简单的古典密码解密，给定一串码</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>PDA MQEYG XNKSJ BKT FQILO KRAN PDA HWVU ZKC KB YWAOWN WJZ UKQN QJEMQA OKHQPEKJ EO BWCYZILHHNKW
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>合理猜测每个字母加上一个相同的数变为当前码，如<code>A+2=C, Z+1=A</code></p> <p>于是编写程序列出总共26种可能性，同时将大写转小写便于阅读</p> <p>python 代码</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code>code <span class="token operator">=</span> <span class="token string">&quot;LZW IMAUC TJGOF XGP BMEHK GNWJ LZW DSRQ VGY GX USWKSJ SFV QGMJ MFAIMW KGDMLAGF AK YZJJKAKWUUKH&quot;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="php-脚本与-linux"><a href="#php-脚本与-linux" class="header-anchor">#</a> PHP 脚本与 Linux</h2> <p>脚本语言，如 PHP、Bash、Lua 等等</p> <h3 id="php-基础"><a href="#php-基础" class="header-anchor">#</a> PHP 基础</h3> <p>PHP（Hypertext Preprocessor），超文本预处理器，原名 Personal Home Page，养活中文互联网 10 年渗透，内核为 C</p> <ul><li>PHP 文件可包含文本、HTML、JavaScript 代码和 PHP 代码</li> <li>PHP 代码在服务器上执行，结果以纯 HTML 形式返回给浏览器</li></ul> <p>LAMP（Linux + Apache + MySQL + PHP）环境：<a href="http://www.wampserver.com/" target="_blank" rel="nofollow noopener noreferrer">WampServer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>下载完成后，启动 wampmanager.exe，这将启动一系列服务</p> <ul><li>PHP 编译执行环境</li> <li>MySQL：跑在 3306 端口</li> <li>Apache 服务器：通过<code>localhost/index.php</code>将可以访问到 wamp 根目录 www 目录下的动态 html 文件</li></ul> <p>一个简单的 PHP 示例，简单来说，就是在 HTML 页面里面嵌入 PHP 代码</p> <p><strong>test_mysql.php</strong></p> <div class="language-php line-numbers-mode"><pre class="language-php"><code><span class="token php language-php"><span class="token delimiter important">&lt;?php</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>默认 3 秒刷新一次。</li> <li>按内存排序：按<code>M</code>键 (大写)，内存占用最高的进程会排到最上面</li> <li>退出：<code>q</code>键</li> <li>核心字段：<code>RES</code>常驻物理内存，真正占用的物理内存大小 (单位 KB)；<code>%MEM</code>为 RES 占总物理内存的百分比；<code>VIRT</code>虚拟内存总量</li></ul> <p>如何定位 OOM？OOM 是内核行为，日志会记录在内核缓冲区或系统日志中，所以核心思路是</p> <ol><li>使用<code>top</code>命令进行实时监控</li> <li><code>cat grep</code>读取<code>/proc</code>日志文件</li> <li><code>dmesg</code>查看内核日志</li></ol> <p>通过内核查看进程信息：所有进程信息都在 <code>/proc/[PID]</code> 目录下</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 列出所有进程 PID (替代 ps -ef)</span>
<span class="token function">ls</span> /proc <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-E</span> <span class="token string">'^[0-9]+$'</span>

<span class="token comment"># 查看进程详细状态 (包含内存)</span>
<span class="token function">cat</span> /proc/1234/status

<span class="token comment"># 过滤出关键内存指标</span>
<span class="token function">cat</span> /proc/1234/status <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-E</span> <span class="token string">&quot;^VmRSS|^VmSize|^VmData&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><ul><li><code>VmRSS</code>: 物理内存占用 (KB)，对应 top 的 RES</li> <li><code>VmSize</code>: 虚拟内存总大小 (KB)，对应 top 的 VIRT</li></ul> <p>查看 OOM 日志</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 过滤 OOM 相关日志</span>
<span class="token function">dmesg</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;out of memory\|killed process&quot;</span>

<span class="token comment"># 显示更友好的时间格式 (-T)，并查看上下文 (-B 前5行, -A 后30行)</span>
<span class="token function">dmesg</span> <span class="token parameter variable">-T</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-A</span> <span class="token number">30</span> <span class="token parameter variable">-B</span> <span class="token number">5</span> <span class="token string">&quot;Out of memory&quot;</span>

><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>.</td> <td>．━ ．━ ．━</td> <td>:</td> <td>━ ━ ━ ．．．</td> <td>,</td> <td>━ ━ ．．━ ━</td> <td>;</td> <td>━ ．━ ．━ ．</td></tr> <tr><td>?</td> <td>．．━ ━ ．．</td> <td>=</td> <td>━ ．．．━</td> <td>'</td> <td>．━ ━ ━ ━ ．</td> <td>/</td> <td>━ ．．━ ．</td></tr> <tr><td>!</td> <td>━ ．━ ．━ ━</td> <td>━</td> <td>━ ．．．．━</td> <td>_</td> <td>．．━ ━ ．━</td> <td>&quot;</td> <td>．━ ．．━ ．</td></tr> <tr><td>(</td> <td>━ ．━ ━ ．</td> <td>)</td> <td>━ ．━ ━ ．━</td> <td>$</td> <td>．．．━ ．．━</td> <td>&amp;</td> <td>． ．．．</td></tr> <tr><td>@</td> <td>．━ ━ ．━ ．</td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td></tr></tbody></table> <p>非英语字符</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>à或å</td> <td>．━ ━ ．━</td> <td>ä或æ</td> <td>．━ ．━</td> <td>ch</td> <td>━ ━ ━ ━</td> <td>ç或ĉ</td> <td>━ ．━ ．．</td></tr> <tr><td>ð</td> <td>．．━ ━ ．</td> <td>é</td> <td>．．━ ．．</td> <td>è</td> <td>．━ ．．━</td> <td>ĝ</td> <td>━ ━ ．━ ．</td></tr> <tr><td>ĥ</td> <td>━ ．━ ━ ．</td> <td>ĵ</td> <td>．━ ━ ━ ．</td> <td>ñ</td> <td>━ ━ ．━ ━</td> <td>ö或ø</td> <td>━ ━ ━ ．</td></tr> <tr><td>ŝ</td> <td>．．．━ ．</td> <td>þ</td> <td>．━ ━ ．．</td> <td>ü或ŭ</td> <td>．．━ ━</td> <td></td> <td></td></tr></tbody></table> <p>特殊符号</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>AR</td> <td>．━ ．━ ．</td> <td>AS</td> <td>．━ ．．．</td> <td>K</td> <td>━ ．━</td> <td>SK</td> <td>．．．━ ．━</td></tr> <tr><td>BT</td> <td>━ ．．．━</td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td></tr></tbody></table> <h3 id="https-与-tls-协议"><a href="#https-与-tls-协议" class="header-anchor">#</a> HTTPS 与 TLS 协议</h3> <blockquote><p>HTTPS = HTTP + SSL / TLS</p></blockquote> <p>众所周知，HTTP 是建立在 TCP 基础上的应用层协议，TPC 通过三次握手在服务端和客户端之间建立长连接（在 HTTP1.0 之后），通过超时重传、确认帧来保证可靠传输</p> <p>而三次握手并不存在身份认证，他仅靠累加的 ACK 码来确认握手双方的回应，这会造成</p> <ul><li>客户端无法认证服务端身份，任意一个服务器可以伪造响应来欺骗客户端，例如，攻击者可以搭建一个伪造网站（如模仿银行官网），并让用户的 HTTP 请求指向该伪造站点获取用户敏感信息</li> <li>HTTP 没有机制确认传输的数据是否完整，攻击者可在传输过程中随意修改数据包内容，接收方无法察觉数据已被篡改，无法抵抗中间人攻击</li></ul> <p>HTTPS 在电商与支付兴起的背景下应运而生，其本质上是一个组合协议，由 HTTP 实现数据可靠传输，SSL / TLS 实现身份安全认证，HTTPS 连接的建立顺序如下</p> <ol><li>TCP 三次握手</li> <li>TLS 握手</li> <li>HTTP 加密传输</li></ol> <p>在实际应用中，HTTPS 引入密钥协商、对称加密、数字证书、哈希摘要等技术来保证数据隐私、身份可信以及消息完整性，具体而言</p> <ol><li>使用非对称加密 + 对称加密的混合加密机制，如采用 RSA/ECC 进行密钥协商，AES 进行加密传输</li> <li>利用数字证书证明服务端可信：服务器需要向权威的证书颁发机构（CA）申请包含自身身份信息的数字证书，客户端（浏览器）在建立连接时，会验证服务器证书的合法性：若证书无效（如伪造、过期），浏览器会弹出安全警告，提醒用户 “该网站不安全”</li> <li>消息认证机制保证消息完整性：服务器会对传输的数据生成哈希摘要，并通过密钥进行签名，接收方在解密数据后，会重新计算哈希值并与签名比对：若不一致，说明数据已被篡改，直接丢弃数据包</li></ol> <p>SSL / TLS 握手过程</p> <img src="/assets/img/https.70d70a51.png"> <p>数字证书如何保证其可信度 → 证书链</p> <h3 id="tcp-三次握手与四次挥手"><a href="#tcp-三次握手与四次挥手" class="header-anchor">#</a> TCP 三次握手与四次挥手</h3> <p>TCP 报文头部字段</p> <img src="/assets/img/image-20260612003349465.6936b3a2.png"> <p>三次握手</p> <img src="/assets/img/image-20260612002953457.10b7c7a6.png"> <p>四次挥手</p> <img src="/assets/img/image-20260612003052305.08099b17.png"> <p>挥手状态老问</p> <ul><li>客户端：FIN-WAIT-1/2 + TIME-WAIT + CLOSED</li> <li>服务器：CLOSE-WAIT + LAST-ACK + CLOSED</li></ul> <h3 id="syn-flood-泛洪攻击"><a href="#syn-flood-泛洪攻击" class="header-anchor">#</a> SYN Flood 泛洪攻击</h3> <p>TCP 握手 SYN 泛洪攻击（SYN Flood）：TCP 建立连接的三次握手，服务端（被动一方）必须严格按照这个程序来进行，即对客户端始终响应，如果客户端发送 SYN 包企图与服务端建立连接，但发送完 SYN 包后就不管，那会发送什么事情捏</p> <img src="/assets/img/image-20260612003757340.f6bdf958.png"> <ul><li>客户端发送一个 SYN 包给服务端后就退出，而服务端接收到 SYN 包后，会回复一个 SYN+ACK 包给客户端，然后等待客户端回复一个 ACK 包</li> <li>但此时客户端并不会回复 ACK 包，所以服务端只能一直等待直到超时，服务端超时后，会重发 SYN+ACK 包给客户端，默认重试 5 次，而且每次等待的时间都会增加（可以参考 TCP 协议超时重传的实现）</li> <li>另外，当服务端接收到 SYN 包后，会建立一个半连接状态的 Socket，所以，当客户端一直发送 SYN 包，但不回复 ACK 包，那么将会耗尽服务端的资源，这就是 SYN Flood 攻击</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updat
