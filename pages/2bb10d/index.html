FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">高并发与高可用<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="aop-切面"><a href="#aop-切面" class="header-anchor">#</a> AOP 切面</h2> <h3 id="身份校验切面"><a href="#身份校验切面" class="header-anchor">#</a> 身份校验切面</h3> <p>切面定义与注入</p> <h3 id="日志切面"><a href="#日志切面" class="header-anchor">#</a> 日志切面</h3> <p>日志记录切面</p> <h2 id="判题沙箱"><a href="#判题沙箱" class="header-anchor">#</a> 判题沙箱</h2> <p>模板工厂模式</p> <h3 id="判题流程抽象"><a href="#判题流程抽象" class="header-anchor">#</a> 判题流程抽象</h3> <p>不管是哪种方式进行判题，都会经过这五种</p> <h3 id="判题策略"><a href="#判题策略" class="header-anchor">#</a> 判题策略</h3> <h2 id="mq-判题解耦"><a href="#mq-判题解耦" class="header-anchor">#</a> MQ 判题解耦</h2> <p>RabbitMQ</p> <h3 id="解耦判题流程"><a href="#解耦判题流程" class="header-anchor">#</a> 解耦判题流程</h3> <p>类似于车票排队等订单处理的设计</p> <img src="/assets/img/image-20260301175158350.7aaf4e8d.png"> <p>用户从页面查询、填写并发起一次判题请求，具体经过了如下步骤</p> <ol><li>从 Redis 读出题目详细信息，进入做题页面</li> <li>用户填写表单，包含用户信息、题目信息、用户代码等内容，点击提交</li> <li>后端收到请求，生成判题记录编号，而后将判题记录编号作为任务投递给 MQ，同时将记录编号返给前端（生产者的工作完成了）</li> <li>判题机作为消费者，读取 MQ 消息，根据编号读数据库信息进行编译执行，并将结果与数据库比对，更新 MySQL 判题记录状态，并把记录状态以<code>{judge:status:记录编号, 1/2/3/4/5}</code>的键值对形式写进 Redis</li> <li>用户点击提交后，将收到后端返回的判题编号，前端将根据判题编号不断轮询 Redis 查询判题状态，这一状态将持续 20s 左右，而后再从 MySQL 中拿取判题的详细信息</li></ol> <h3 id="rabbitmq-ack-机制"><a href="#rabbitmq-ack-机制" class="header-anchor">#</a> RabbitMQ ack 机制</h3> <h2 id="微服务拆分"><a href="#微服务拆分" class="header-anchor">#</a> 微服务拆分</h2> <h3 id="判题服务"><a href="#判题服务" class="header-anchor">#</a> 判题服务</h3> <h3 id="平台服务"><a href="#平台服务" class="header-anchor">#</a> 平台服务</h3> <h3 id="用户服务"><a href="#用户服务" class="header-anchor">#</a> 用户服务</h3> <h2 id="索引、缓存和限流"><a href="#索引、缓存和限流" class="header-anchor">#</a> 索引、缓存和限流</h2> <h3 id="联合覆盖索引"><a href="#联合覆盖索引" class="header-anchor">#</a> 联合覆盖索引</h3> <p>通过联合覆盖索引避免高频查询的回表问题</p> <p>对于判题记录表，我现在有这样几个需求，如何实现快速查找？</p> <ol><li>用户要能够根据 userId 快速找到自己做过哪些题目</li> <li>管理者要能够根据 questionId 快速找到某个题目被做了多少遍</li> <li>用户要能够根据 userId 和 questionId 快速找到指定题目的所有判题记录</li></ol> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><h4 id="联合索引"><a href="#联合索引" class="header-anchor">#</a> 联合索引</h4> <p>为了快速根据用户 id 和题目 id 查找数据，一个很朴素的方法就是，为这两个字段建立联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user_question<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>那么我们需要明确的是，这个索引的叶子节点中，包含<code>userId, questionId, recordId</code>三个字段，这意味着</p> <ol><li>在仅依靠 userId 这一个字段进行查询时，<strong>在效率上和 userId 的单个普通索引是一样的</strong>，但返回的结果将多一个 questionId 字段</li> <li>当根据<code>userId</code>和<code>questionId</code>进行联合查询时，这样能“快速”定位到对应数据的 recordId，但如果要其他信息，<strong>仍需要回表查询</strong></li></ol> <h4 id="覆盖索引"><a href="#覆盖索引" class="header-anchor">#</a> 覆盖索引</h4> <p>前面也说了，普通索引中存的是「索引列值 + 主键值」，这意味着，只要我查的是主键值，就不会回表</p> <p>例如</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span> recordId <span class="token keyword">from</span> record <span class="token keyword">where</span> userId<span class="token operator">=</span><span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre></div><p>由于 recordId 作为主键已经存在了 userId 的叶子索引结构中，所以他会直接返回结果，不需要回表查询</p> <p>那么我可不可以将一个关键信息都存在普通索引中呢？这样虽然增大了普通索引的存储开销，但不需要回表，节省的时间将是砍半的</p> <p>显然是可以的，我们可以利用联合索引，对一些高频数据全部丢到这个索引 B+ 树中，这样对于相当一部分的查询，都不需要回表操作</p> <p>例如，在上面的 record 表，一般而言，我只需要知道判题的状态，那么我们将 state 字段加入联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_union<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>那么在执行以下查询时</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SELECT</span> recordId<span class="token punctuation">,</span> state <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre></div><p>就不需要回表了，只查找一次联合索引，就可以得到所有想要的数据字段</p> <p>特别的，一次查询后，由于得到了关键的主键信息，判题记录们在前端作为一个列表呈现，所有的判题记录主键在前端是已经获得的信息，所以在进一步查询详细判题信息时，将直接走主键索引去查找，这样将始终不会回表</p> <h4 id="索引下推"><a href="#索引下推" class="header-anchor">#</a> 索引下推</h4> <blockquote><p>索引下推（Index Condition Pushdown，ICP），“遍历时过滤”</p></blockquote> <p>什么是索引下推，以上面的 record 表为例，我们此时只对 userId 建立了普通索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>对于一条查询</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre></div><p>若没有 ICP，数据库会先通过索引找到所有匹配<code>userId</code>的主键<code>recordId</code>，把这些主键“拉回”服务器层，再在服务器层过滤<code>questionId</code>等条件</p> <p>当有 ICP 时，数据库在遍历索引的过程中，就先过滤掉不满足<code>questionId</code>等条件的记录，只把符合所有条件的主键“拉回”服务器层</p> <ul><li>即：边遍历边过滤，而不是遍历完批处理</li></ul> <p>当然，ICP 在联合索引的场景下作用并不明显，因为联合索引本身已经能在索引树中直接定位<code>userId + questionId</code>，无需 ICP 额外过滤，也是为什么联合索引效率更高的原因之一</p> <h3 id="判题记录缓存"><a href="#判题记录缓存" class="header-anchor">#</a> 判题记录缓存</h3> <p>Redis 对题目表进行缓存</p> <h3 id="redis-令牌桶防刷"><a href="#redis-令牌桶防刷" class="header-anchor">#</a> Redis 令牌桶防刷</h3> <p>对于 API 请求，Redis 单线程记录 IP 对 API 每分钟的请求次数，超出则在 Controller 中拒绝访问，例如</p> <ol><li>用户提交成功后，在收到返回前，不能重复提交</li> <li>用户在 5s 以内只能成功提交一次</li></ol> <p>这样需要对这个接口上两道锁</p> <ul><li>一道是执行锁，限定单个用户对同一道题在同一时刻只能判一次</li> <li>一道是频控锁，限定单个用户对同一道题在 5s 内只能判题一次</li></ul> <p>执行锁：使用 Redis 的原子锁，SET NX + EX 实现，控制字段</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:lock:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> requestId NX EX <span class="token number">300</span>
</code></pre></div><p>这个字段的键由用户 ID 和题目 ID 构成，值为本次提交的请求 ID</p> <ul><li><code>NX</code>：不存在才设置</li> <li><code>EX 300</code>：兜底超时，防止执行锁卡死</li></ul> <p>只需要在判题前加入一个 Redis 的判断即可</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> locked <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span>
    requestId<span class="token punctuation">,</span>
    <span class="token number">300</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>locked<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;请勿重复提交任务&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在判题结束后，需要释放执行锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">finally</span> <span class="token punctuation">{</span>
    <span class="token function">releaseLock</span><span class="token punctuation">(</span><span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span> requestId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>频控锁：使用 Redis 的冷却锁实现</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:freq:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> <span class="token number">1</span> NX EX <span class="token number">5</span>
</code></pre></div><p>即设置一个 5s 超时时间的键值对，键同样由用户 ID 和题目 ID 构成，在判题前进行拦截</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> allowed <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:freq:&quot;</span> <span class="token operator">+</span> uid<span class="token punctuation">,</span>
    <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span>
    <span class="token number">5</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>allowed<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;操作频繁&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>执行流程如下</p> <div class="language- extra-class"><pre class="language-text"><code>请求进来
 ↓
校验身份 / IP
 ↓
【1】尝试获取执行锁（docker:lock）
    失败 → 直接拒绝
 ↓
【2】尝试获取 5s 频控锁（docker:freq）
    失败 → 释放执行锁 → 拒绝
 ↓
【3】真正执行 docker
 ↓
【4】finally 中释放执行锁
</code></pre></div><p>为什么频控在执行锁之后？更直觉的处理，先判断有没有锁进门，再判断能进多少人，这个优先级要搞清</p> <ul><li>如果频控先于执行，在第一秒和第六秒都有人来打请求，那么两个请求都能通过频控锁，而第一秒的请求没结束，所以第六秒的请求会消耗执行锁的判断（一共是四次判断）</li> <li>如果执行先于频控，上述事件就会少一次判断（三次判断），那另一种情况下，第一秒和第四秒都有请求打进来，并且已经执行完，那么也会有四次判断，但这里由于频率过高会被第四次判断拦截，这正是我想要的结果</li></ul> <p>就是说，我一定要先判断有没有进入的权限，再判断是否达标，否则我没有必要判断是否达标，懂我意思吗</p></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/548662/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">模型驱动的多智能体系统</div></a> <a href="/pages/d6f021/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">分布式与微服务基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
