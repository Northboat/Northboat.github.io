</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>AOP 日志切面</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Aspect</span>
<span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LogAspect</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Resource</span>
    <span class="token keyword">private</span> <span class="token class-name">LogMapper</span> logMapper<span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">ObjectMapper</span> objectMapper <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ObjectMapper</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 切点：所有加了 @LogAnnotation 注解的方法</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">logPointCut</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">logAfterReturning</span><span class="token punctuation">(</span><span class="token class-name">JoinPoint</span> joinPoint<span class="token punctuation">,</span> <span class="token class-name">Object</span> result<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token function">saveLog</span><span class="token punctuation">(</span>joinPoint<span class="token punctuation">,</span> result<span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">logAfterThrowing</span><span class="token punctuation">(</span><span class="token class-name">JoinPoint</span> joinPoint<span class="token punctuation">,</span> <span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token function">saveLog</span><span class="token punctuation">(</span>joinPoint<span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">MethodSignature</span> signature <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">MethodSignature</span><span class="token punctuation">)</span> joinPoint<span class="token punctuation">.</span><span class="token function">getSignature</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">Method</span> method <span class="token operator">=</span> signature<span class="token punctuation">.</span><span class="token function">getMethod</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">LogAnnotation</span> logAnnotation <span class="token operator">=</span> method<span class="token punctuation">.</span><span class="token function">getAnnotation</span><span class="token punctuation">(</span><span class="token class-name">LogAnnotation</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token comment">// 操作类型</span>

        <span class="token comment">// 操作方法</span>
        <span class="token class-name">String</span> className <span class="token operator">=</span> joinPoint<span class="token punctuation">.</span><span class="token function">getTarget</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> methodName <span class="token operator">=</span> method<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        log<span class="token punctuation">.</span><span class="token function">setObj</span><span class="token punctuation">(</span>className <span class="token operator">+</span> <span class="token string">&quot;.&quot;</span> <span class="token operator">+</span> methodName<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token comment">// 结果：0=失败 1=成功</span>

            log<span class="token punctuation">.</span><span class="token function">setResult</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            log<span class="token punctuation">.</span><span class="token function">setDescription</span><span class="token punctuation">(</span>log<span class="token punctuation">.</span><span class="token function">getDescription</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot;，异常：&quot;</span> <span class="token operator">+</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
            log<span class="token punctuation">.</span><span class="token function">setResult</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        log<span class="token punctuation">.</span><span class="token function">setDeleted</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        log<span class="token punctuation">.</span><span class="token function">setGmtCreate</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        log<span class="token punctuation">.</span><span class="token function">setGmtModified</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>有一个有意思的点是，在切面中要拿取用户信息，这里通过 ThreadLocal 去拿取，定义了一个 UserContext 工具类，内置<code>ThreadLocal&lt;User&gt;</code>在同一线程传递信息</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserContext</span> <span class="token punctuation">{</span>

    <span class="token punctuation">}</span>

    <span class="token comment">// 获取当前用户</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token class-name">User</span> <span class="token function">getUser</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token constant">USER_THREAD_LOCAL</span><span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br><span class="line-number">72</span><br><span class="line-number">73</span><br><span class="line-number">74</span><br><span class="line-number">75</span><br><span class="line-number">76</span><br><span class="line-number">77</span><br><span class="line-number">78</span><br><span class="line-number">79</span><br><span class="line-number">80</span><br><span class="line-number">81</span><br><span class="line-number">82</span><br><span class="line-number">83</span><br><span class="line-number">84</span><br><span class="line-number">85</span><br><span class="line-number">86</span><br><span class="line-number">87</span><br><span class="line-number">88</span><br><span class="line-number">89</span><br><span class="line-number">90</span><br><span class="line-number">91</span><br><span class="line-number">92</span><br><span class="line-number">93</span><br><span class="line-number">94</span><br><span class="line-number">95</span><br><span class="line-number">96</span><br><span class="line-number">97</span><br><span class="line-number">98</span><br><span class="line-number">99</span><br><span class="line-number">100</span><br><span class="line-number">101</span><br><span class="line-number">102</span><br><span class="line-number">103</span><br><span class="line-number">104</span><br><span class="line-number">105</span><br><span class="line-number">106</span><br><span class="line-number">107</span><br><span class="line-number">108</span><br><span class="line-number">109</span><br><span class="line-number">110</span><br><span class="line-number">111</span><br><span class="line-number">112</span><br><span class="line-number">113</span><br><span class="line-number">114</span><br><span class="line-number">115</span><br><span class="line-number">116</span><br><span class="line-number">117</span><br><span class="line-number">118</span><br><span class="line-number">119</span><br><span class="line-number">120</span><br><span class="line-number">121</span><br><span class="line-number">122</span><br><span class="line-number">123</span><br><span class="line-number">124</span><br><span class="line-number">125</span><br><span class="line-number">126</span><br><span class="line-number">127</span><br><span class="line-number">128</span><br><span class="line-number">129</span><br><span class="line-number">130</span><br><span class="line-number">131</span><br><span class="line-number">132</span><br><span class="line-number">133</span><br><span class="line-number">134</span><br><span class="line-number">135</span><br><span class="line-number">136</span><br><span class="line-number">137</span><br><span class="line-number">138</span><br><span class="line-number">139</span><br><span class="line-number">140</span><br><span class="line-number">141</span><br><span class="line-number">142</span><br></div></div><h3 id="消息队列业务解耦"><a href="#消息队列业务解耦" class="header-anchor">#</a> 消息队列业务解耦</h3> <p>设计模式</p> <ul><li>模板工厂模式：抽象判题流程</li> <li>策略模式：三种策略编译执行代码</li></ul> <p>类似于车票排队等订单处理的设计</p> <img src="/assets/img/image-20260301175158350.7aaf4e8d.png"> <p>用户从页面查询、填写并发起一次判题请求，具体经过了如下步骤</p> <ol><li>从 Redis 读出题目详细信息，进入做题页面</li> <li>用户填写表单，包含用户信息、题目信息、用户代码等内容，点击提交</li> <li>后端收到请求，生成判题记录编号，而后将判题记录编号作为任务投递给 MQ，同时将记录编号返给前端（生产者的工作完成了）</li> <li>判题机作为消费者，读取 MQ 消息，根据编号读数据库信息进行编译执行，并将结果与数据库比对，更新 MySQL 判题记录状态，并把记录状态以<code>{judge:status:记录编号, 1/2/3/4/5}</code>的键值对形式写进 Redis</li> <li>用户点击提交后，将收到后端返回的判题编号，前端将根据判题编号不断轮询 Redis 查询判题状态，这一状态将持续 20s 左右，而后再从 MySQL 中拿取判题的详细信息</li></ol> <p>如何保证消息被成功消费？ACK 机制？重试机制？死信队列？</p> <h2 id="自由画布协同编辑"><a href="#自由画布协同编辑" class="header-anchor">#</a> 自由画布协同编辑</h2> <h3 id="rbac-权限校验"><a href="#rbac-权限校验" class="header-anchor">#</a> RBAC 权限校验</h3> <p>基于角色权限体系（RBAC）控制用户权限，这里涉及复杂的权限申请、权限撤销等 CRUD</p> <table><thead><tr><th>角色 ID</th> <th>角色名称</th> <th>权限说明</th></tr></thead> <tbody><tr><td>0</td> <td>UserRoleClose</td> <td>文档关闭，无访问权限</td></tr> <tr><td>1</td> <td>UserRoleViewer</td> <td>查看者，只读权限</td></tr> <tr><td>2</td> <td>UserRoleEditor</td> <td>编辑者，可编辑内容</td></tr> <tr><td>3</td> <td>UserRoleOwner</td> <td>拥有者，完全控制权限</td></tr></tbody></table> <p>权限类型</p> <table><thead><tr><th>标记</th> <th>说明</th></tr></thead> <tbody><tr><td>URDFLagTemp (0)</td> <td>临时权限</td></tr> <tr><td>URDFLagPerm (1)</td> <td>永久权限</td></tr></tbody></table> <p>连接限制配置</p> <table><thead><tr><th>限制类型</th> <th>限制值</th> <th>说明</th></tr></thead> <tbody><tr><td>TotalTabLimit</td> <td>100</td> <td>总 Tab 数限制</td></tr> <tr><td>EditorTabLimit</td> <td>40</td> <td>可编辑者 Tab 数限制</td></tr> <tr><td>VisitorTabLimit</td> <td>20</td> <td>游客 Tab 数限制</td></tr> <tr><td>OneUserTabLimit</td> <td>2</td> <td>单用户 Tab 数限制</td></tr></tbody></table> <p>在 WebSocket 连接前，会先对 Limit Tab 进行校验</p> <h3 id="websocket-实时通信"><a href="#websocket-实时通信" class="header-anchor">#</a> WebSocket 实时通信</h3> <p>通过 WebSocket 实现画布协同编辑的通信，后端根据 docID 初始化 WebSocket 房间并写入数据库，</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">InitCoordinationRooms</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req UserRoleReq<span class="token punctuation">)</span> <span class="token builtin">error</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>处理流程</p> <ol><li>获取文档的协作者列表</li> <li>检查是否需要初始化房间</li> <li>如果是首次有协作者，调用<code>util.InitCoordinationRoom()</code>初始化 WebSocket 房间</li> <li>返回初始化结果</li></ol> <p>通知协同状态变更：当用户权限变更时，通过 WebSocket 通知所有在线协作者</p> <ul><li>通过前端触发 Post 接口<code>/service/canvas/updateperms</code>，后端进行广播推送</li> <li>底层调用 WS 微服务 <code>wkservice_wsapi</code></li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">type</span> CoordinationUpdatePerms <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    UID   <span class="token builtin">int</span> <span class="token string">`json:&quot;uid&quot; form:&quot;uid&quot;`</span>
    Perms <span class="token builtin">int</span> <span class="token string">`json:&quot;perms&quot; form:&quot;perms&quot;`</span>  <span class="token comment">// 权限角色</span>
    Cause <span class="token builtin">int</span> <span class="token string">`json:&quot;cause&quot; form:&quot;cause&quot;`</span>  <span class="token comment">// 变更原因</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> NoticeCoordinationStatusParams <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    DocID   <span class="token builtin">string</span>                    <span class="token string">`json:&quot;docId&quot; form:&quot;docId&quot;`</span> <span class="token comment">// 加密后的文档ID</span>
    Updates <span class="token punctuation">[</span><span class="token punctuation">]</span>CoordinationUpdatePerms <span class="token string">`json:&quot;updates&quot; form:&quot;updates&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">NoticeCoordinationStatus</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req NoticeCoordinationStatusParams<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>在房间建立完成后，后端其实不涉及 WebSocket 的接口了，前置到前端去进行通信，通过外挂 WebSocket API 来实现通信，这个外挂的 WS 服务包含一个 API 服务（广播推送）和一层网关校验（Cookie 及权限校验）</p> <ul><li><code>wkservice_wsapi</code>：WebSocket API 服务</li> <li><code>wkservice_wsgateway</code>：WebSocket 网关服务</li></ul> <p>而真正的“协同编辑”，通过在“保存”动作后调用后端的持久化接口实现数据一致性，这里的后端数据比较复杂，分为三个部分</p> <ul><li>MySQL 存储文档描述信息</li> <li>BOS 存储文档 BDJson 内容</li> <li>ES 存储文档索引</li></ul> <p>实时协同编辑流程</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>  用户操作
      ↓
  WebSocket 接收操作 (wkservice_wsapi服务)
      ↓
  操作转换成 BDJson 增量更新
      ↓
  广播给其他在线用户 (WebSocket Gateway)
      ↓
  调用 /savebdjson 持久化完整内容
      ↓
  wkservice_rtcs_canvas 保存到 BOS
      ↓
  NMQ 异步更新数据库
      ↓
  ES 索引更新
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><h3 id="前置风控与锁"><a href="#前置风控与锁" class="header-anchor">#</a> 前置风控与锁</h3> <p>风控上锁 SetNX 分布式锁 <strong>model/data/coordinate/coordinationrisk.go</strong>：SetNX 即 set if not exist</p> <ul><li>仅用于风控相关操作（ElementRisk、RiskCallBack）</li> <li>锁的 TTL 为1秒</li> <li>最多重试 3 次，每次间隔 400ms</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 第69-78行：Redis SetNX 实现分布式锁</span>
<span class="token keyword">func</span> <span class="token function">GetAndAddLock</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> key <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
  <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> MaxRetryNum<span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
    riskLock<span class="token punctuation">,</span> setErr <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">GetRedisIns</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">SetNX</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token string">&quot;true&quot;</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token operator">*</span>time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> setErr <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> riskLock <span class="token punctuation">{</span>
      <span class="token keyword">break</span>
    <span class="token punctuation">}</span>
    time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">400</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Millisecond<span class="token punctuation">)</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>


<span class="token keyword">func</span> <span class="token function">ElementRisk</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ElementRiskReq<span class="token punctuation">)</span> basis<span class="token punctuation">.</span>RiskContent <span class="token punctuation">{</span>
  <span class="token comment">// 读之前加锁</span>
  key <span class="token operator">:=</span> SetRiskLockKey <span class="token operator">+</span> req<span class="token punctuation">.</span>CanvasDocId
  <span class="token function">GetAndAddLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">)</span>
  <span class="token comment">// 确保锁会被释放</span>
  <span class="token keyword">defer</span> basis<span class="token punctuation">.</span><span class="token function">GetRedisIns</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Del</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">)</span>

  <span class="token comment">// 读风控内容</span>
  object <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>bos_util<span class="token punctuation">.</span>BosCanvasKeyPre<span class="token operator">+</span><span class="token string">&quot;/%s/risk/%s.%s&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>CanvasDocId<span class="token punctuation">,</span> req<span class="token punctuation">.</span>CanvasDocId<span class="token punctuation">,</span> <span class="token string">&quot;txt&quot;</span><span class="token punctuation">)</span>
  riskContent <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">GetRiskContent</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> object<span class="token punctuation">)</span>

  <span class="token comment">// 修改：根据不同元素类型操作列表，更新 riskContent.CanvasEleRiskList</span>
  <span class="token keyword">if</span> req<span class="token punctuation">.</span>ElementType <span class="token operator">==</span> ContentTypeText <span class="token punctuation">{</span>
    <span class="token comment">// 风控检查：调用 wenchain 的风控微服务</span>
    txtRisk<span class="token punctuation">,</span> err <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">RunWenchainRisk</span><span class="token punctuation">(</span>
      ctx<span class="token punctuation">,</span>
      basis<span class="token punctuation">.</span>WcRiskReq<span class="token punctuation">{</span>
        Channel<span class="token punctuation">:</span> basis<span class="token punctuation">.</span>FileRiskChannel<span class="token punctuation">,</span>
        UserID<span class="token punctuation">:</span>  strconv<span class="token punctuation">.</span><span class="token function">FormatUint</span><span class="token punctuation">(</span>req<span class="token punctuation">.</span>UID<span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
        Extra<span class="token punctuation">:</span> basis<span class="token punctuation">.</span>WcRiskReqExtra<span class="token punctuation">{</span>
          Content<span class="token punctuation">:</span> req<span class="token punctuation">.</span>Content<span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">)</span>
    resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;txt risk&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;txtRisk&quot;</span><span class="token punctuation">,</span> txtRisk<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">||</span> txtRisk <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
      <span class="token keyword">return</span> riskContent
    <span class="token punctuation">}</span>
    
    <span class="token comment">// 拓展风控列表</span>
    <span class="token keyword">if</span> txtRisk<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>IsRiskCheck <span class="token punctuation">{</span>
      riskContent<span class="token punctuation">.</span>CanvasEleRiskList <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>riskContent<span class="token punctuation">.</span>CanvasEleRiskList<span class="token punctuation">,</span> req<span class="token punctuation">.</span>ElementId<span class="token punctuation">)</span>
      <span class="token comment">// ...</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
      riskContent<span class="token punctuation">.</span>CanvasEleRiskList <span class="token operator">=</span> basis<span class="token punctuation">.</span><span class="token function">RemoveRiskEle</span><span class="token punctuation">(</span>riskContent<span class="token punctuation">.</span>CanvasEleRiskList<span class="token punctuation">,</span> req<span class="token punctuation">.</span>ElementId<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 更新风控列表，写入 BOS</span>

        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">.</span><span class="token keyword">to</span> <span class="token operator">!=</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>

        <span class="token punctuation">}</span>

        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">Comment</span> c<span class="token operator">:</span> comments<span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">if</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span><span class="token function">getTo</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token keyword">this</span><span class="token punctuation">.</span>floor<span class="token punctuation">)</span><span class="token punctuation">{</span>
                <span class="token keyword">this</span><span class="token punctuation">.</span>comments<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

<span class="token annotation punctuation">@Repository</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">CommentMapper</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Select</span><span class="token punctuation">(</span><span class="token string">&quot;select * from `comment` where `question`=#{question}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Comment</span><span class="token punctuation">&gt;</span></span> <span class="token function">getComments</span><span class="token punctuation">(</span><span class="token keyword">int</span> question<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Insert</span><span class="token punctuation">(</span><span class="token string">&quot;insert into `comment`(question, `to`, `from`, content) values(#{question}, #{to}, #{from}, #{content})&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">void</span> <span class="token function">comment</span><span class="token punctuation">(</span><span class="token class-name">Comment</span> comment<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>在 service 层做如下嵌套处理，把根据 questionId 从数据库查出的扁平所有评论 List 组装成树形结构，对每个 comment 都执行 setComment，set 的对象是所有当前 question 的评论，这里的时间复杂度会达到 <mjx-container jax="SVG" class="MathJax" style="direction:ltr;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="5.832ex" height="2.452ex" role="img" focusable="false" viewBox="0 -833.9 2577.6 1083.9" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z" style="stroke-width:3;"></path></g><g data-mml-node="msup" transform="translate(1152,0)"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(633,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mo" transform="translate(2188.6,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="inline" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;width:auto;overflow:hidden;"><math xmlns="http://www.w3.org/1998/Math/MathML"><mi>O</mi><mo stretchy="false">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Comment</span><span class="token punctuation">&gt;</span></span> <span class="token function">getComments</span><span class="token punctuation">(</span><span class="token keyword">int</span> question<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Comment</span><span class="token punctuation">&gt;</span></span> comments <span class="token operator">=</span> commentMapper<span class="token punctuation">.</span><span class="token function">getComments</span><span class="token punctuation">(</span>question<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">Comment</span> c<span class="token operator">:</span> comments<span class="token punctuation">)</span><span class="token punctuation">{</span>
        c<span class="token punctuation">.</span><span class="token function">setComments</span><span class="token punctuation">(</span>comments<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Comment</span><span class="token punctuation">&gt;</span></span> res <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">Comment</span> c<span class="token operator">:</span> comments<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span><span class="token function">getTo</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            res<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> res<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>其实也还行，就是每一次都要拿所有的评论出来，如果有只拿某一层的评论的需求，就出大问题了</p> <ul><li>正常的盖楼，一般只会展示根楼层，在用户点击显示更多的时候，才会展开当前楼层的所有回复，参考贴吧的实现</li></ul> <p>这里 to 只记录了直接父级，如果要构造树形结构，每一次都要读出所有的评论，实现不了“只读根楼层，再读子楼层”</p> <p>正确的楼层数据库设计：应设置一个 root 冗余字段，记录每个评论对应的根楼层，同时保留直接父级 to 字段用于构造树形结构</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Data</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Comment</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> id<span class="token punctuation">;</span> <span class="token comment">// 通原先的 floor</span>
    <span class="token keyword">int</span> from<span class="token punctuation">;</span> <span class="token comment">// 评论者</span>
    <span class="token keyword">int</span> <span class="token keyword">to</span><span class="token punctuation">;</span> <span class="token comment">// 直接父级</span>
    <span class="token keyword">int</span> root<span class="token punctuation">;</span> <span class="token comment">// 根父级</span>
    <span class="token class-name">String</span> content<span class="token punctuation">;</span> <span class="token comment">// 评论内容</span>
    <span class="token keyword">int</span> question<span class="token punctuation">;</span> <span class="token comment">// 所属题目</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>这样就可以了，在进入题目展示楼层时，先根据 question 和 to = 0 读出根楼层直接展示，当用户展开某一根楼层的评论时，根据 root 查出当前楼层所有评论，在业务侧构造完整的树形结构返回即可</p> <p>进一步的两个高并发问题</p> <ol><li>热门评论排序（Hot Sort）：<strong>冷热分离</strong>，一定不能在数据库 order by，而是要单独把热门评论拎出来放在 Redis ZSet 里，用 socre 表示点赞数，直接 TopK 返回即可，剩下的非热点评论从 SQL 里拿</li> <li>评论点赞高并发处理（Write Back）：<strong>异步回写</strong>，每次点赞不直接 update 数据库，而只写 Redis，即执行简单的 INCR 操作，当 INCR 了 100 次，再批量写回数据库，避免频繁写数据库触发行锁拖垮系统</li></ol> <h3 id="判题记录联合索引"><a href="#判题记录联合索引" class="header-anchor">#</a> 判题记录联合索引</h3> <h4 id="联合索引避免回表"><a href="#联合索引避免回表" class="header-anchor">#</a> 联合索引避免回表</h4> <p>通过联合覆盖索引避免高频查询的回表问题</p> <p>对于判题记录表，我现在有这样几个需求，如何实现快速查找？</p> <ol><li>用户要能够根据 userId 快速找到自己做过哪些题目</li> <li>管理者要能够根据 questionId 快速找到某个题目被做了多少遍</li> <li>用户要能够根据 userId 和 questionId 快速找到指定题目的所有判题记录</li></ol> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>联合索引：为了快速根据用户 id 和题目 id 查找数据，一个很朴素的方法就是，为这两个字段建立联合索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user_question<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>那么我们需要明确的是，这个索引的叶子节点中，包含<code>userId, questionId, recordId</code>三个字段，这意味着</p> <ol><li>在仅依靠 userId 这一个字段进行查询时，<strong>在效率上和 userId 的单个普通索引是一样的</strong>，但返回的结果将多一个 questionId 字段</li> <li>当根据<code>userId</code>和<code>questionId</code>进行联合查询时，这样能“快速”定位到对应数据的 recordId，但如果要其他信息，<strong>仍需要回表查询</strong></li></ol> <p>覆盖索引：前面也说了，普通索引中存的是「索引列值 + 主键值」，这意味着，只要我查的是主键值，就不会回表，例如</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> recordId <span class="token keyword">from</span> record <span class="token keyword">where</span> userId<span class="token operator">=</span><span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>由于 recordId 作为主键已经存在了 userId 的叶子索引结构中，所以他会直接返回结果，不需要回表查询</p> <p>那么我可不可以将一个关键信息都存在普通索引中呢？这样虽然增大了普通索引的存储开销，但不需要回表，节省的时间将是砍半的</p> <ul><li>显然可以，我们可以利用联合索引，对一些高频数据全部丢到这个索引 B+ 树中，这样对于相当一部分的查询，都不需要回表操作</li></ul> <p>例如，在上面的 record 表，一般而言，我只需要知道判题的状态，那么我们将 state 字段加入联合索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_union<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>那么在执行以下查询时</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> recordId<span class="token punctuation">,</span> state <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>就不需要回表了，只查找一次联合索引，就可以得到所有想要的数据字段</p> <p>特别的，一次查询后，由于得到了关键的主键信息，判题记录们在前端作为一个列表呈现，所有的判题记录主键在前端是已经获得的信息，所以在进一步查询详细判题信息时，将直接走主键索引去查找，这样将始终不会回表</p> <h4 id="索引下推和跳跃检索"><a href="#索引下推和跳跃检索" class="header-anchor">#</a> 索引下推和跳跃检索</h4> <blockquote><p>索引下推（Index Condition Pushdown，ICP），“遍历时过滤”</p></blockquote> <p>什么是索引下推，以上面的 record 表为例，我们此时只对 userId 建立了普通索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>对于一条查询</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>若没有 ICP，数据库会先通过索引找到所有匹配<code>userId</code>的主键<code>recordId</code>，把这些主键“拉回”服务器层，再在服务器层过滤<code>questionId</code>等条件</p> <p>当有 ICP 时，数据库在遍历索引的过程中，就先过滤掉不满足<code>questionId</code>等条件的记录，只把符合所有条件的主键“拉回”服务器层</p> <ul><li>边遍历边过滤，而不是遍历完批处理</li></ul> <p>当然，ICP 在联合索引的场景下作用并不明显，因为联合索引本身已经能在索引树中直接定位<code>userId + questionId</code>，无需 ICP 额外过滤，也是为什么联合索引效率更高的原因之一</p> <blockquote><p>Skip Scan 跳跃检索</p></blockquote> <p>在高版本的 MySQL 中引入 Skip Scan 跳跃检索机制，可以“逃避”最左匹配索引，其核心思路是遍历不确定的索引项，同样实现边遍历边过滤，避免回表</p> <h3 id="记录缓存与-api-限流"><a href="#记录缓存与-api-限流" class="header-anchor">#</a> 记录缓存与 API 限流</h3> <h4 id="判题记录缓存"><a href="#判题记录缓存" class="header-anchor">#</a> 判题记录缓存</h4> <p>对判题记录进行缓存，核心思路</p> <ul><li>先读 Cache 再读 SQL，先写 SQL 再更新 Cache，延时双删</li> <li>大 Key 热 Key 处理：大 Key 拆分，热 Key 分级</li></ul> <p>参考 <a href="https://northboat.github.io/pages/aee6d6/#redis-%E7%BC%93%E5%AD%98%E5%AD%98%E5%8F%96" target="_blank" rel="nofollow noopener noreferrer">键值数据库 | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h4 id="api-令牌桶限流"><a href="#api-令牌桶限流" class="header-anchor">#</a> API 令牌桶限流</h4> <p>对于 API 请求，Redis 单线程记录 IP 对 API 每分钟的请求次数，超出则在 Controller 中拒绝访问，例如</p> <ol><li>用户提交成功后，在收到返回前，不能重复提交</li> <li>用户在 5s 以内只能成功提交一次</li></ol> <p>这样需要对这个接口上两道锁</p> <ul><li>一道是执行锁，限定单个用户对同一道题在同一时刻只能判一次</li> <li>一道是频控锁，限定单个用户对同一道题在 5s 内只能判题一次</li></ul> <p>执行锁：使用 Redis 的原子锁，SET NX + EX 实现，控制字段</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>SET docker:lock:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> requestId NX EX <span class="token number">300</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这个字段的键由用户 ID 和题目 ID 构成，值为本次提交的请求 ID</p> <ul><li><code>NX</code>：不存在才设置</li> <li><code>EX 300</code>：兜底超时，防止执行锁卡死</li></ul> <p>只需要在判题前加入一个 Redis 的判断即可</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">boolean</span> locked <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span>
    requestId<span class="token punctuation">,</span>
    <span class="token number">300</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>locked<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;请勿重复提交任务&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>在判题结束后，需要释放执行锁</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">finally</span> <span class="token punctuation">{</span>
    <span class="token function">releaseLock</span><span class="token punctuation">(</span><span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span> requestId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>频控锁：使用 Redis 的冷却锁实现</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>SET docker:freq:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> <span class="token number">1</span> NX EX <span class="token number">5</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>即设置一个 5s 超时时间的键值对，键同样由用户 ID 和题目 ID 构成，在判题前进行拦截</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">boolean</span> allowed <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:freq:&quot;</span> <span class="token operator">+</span> uid<span class="token punctuation">,</span>
    <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span>
    <span class="token number">5</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>allowed<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;操作频繁&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>执行流程如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>请求进来
 ↓
校验身份 / IP
 ↓
【1】尝试获取执行锁（docker:lock）
    失败 → 直接拒绝
 ↓
【2】尝试获取 5s 频控锁（docker:freq）
    失败 → 释放执行锁 → 拒绝
 ↓
【3】真正执行 docker
 ↓
【4】finally 中释放执行锁
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>为什么频控在执行锁之后？更直觉的处理，先判断有没有锁进门，再判断能进多少人，这个优先级要搞清</p> <ul><li>如果频控先于执行，在第一秒和第六秒都有人来打请求，那么两个请求都能通过频控锁，而第一秒的请求没结束，所以第六秒的请求会消耗执行锁的判断（一共是四次判断）</li> <li>如果执行先于频控，上述事件就会少一次判断（三次判断），那另一种情况下，第一秒和第四秒都有请求打进来，并且已经执行完，那么也会有四次判断，但这里由于频率过高会被第四次判断拦截，这正是我想要的结果</li></ul> <p>就是说，我一定要先判断有没有进入的权限，再判断是否达标，否则我没有必要判断是否达标，懂我意思吗</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/13, 22:14:32</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/548662/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">大模型驱动的文档类产品</div></a> <a href="/pages/d6f021/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">微服务设计与开发</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
