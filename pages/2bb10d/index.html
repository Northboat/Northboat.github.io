IG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">高并发与高可用场景<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="消息队列业务解耦"><a href="#消息队列业务解耦" class="header-anchor">#</a> 消息队列业务解耦</h2> <h3 id="日志切面与解耦"><a href="#日志切面与解耦" class="header-anchor">#</a> 日志切面与解耦</h3> <p>AOP 日志切面</p> <h3 id="判题业务解耦"><a href="#判题业务解耦" class="header-anchor">#</a> 判题业务解耦</h3> <p>设计模式</p> <ul><li>模板工厂模式：抽象判题流程</li> <li>策略模式：三种策略编译执行代码</li></ul> <p>类似于车票排队等订单处理的设计</p> <img src="/assets/img/image-20260301175158350.7aaf4e8d.png"> <p>用户从页面查询、填写并发起一次判题请求，具体经过了如下步骤</p> <ol><li>从 Redis 读出题目详细信息，进入做题页面</li> <li>用户填写表单，包含用户信息、题目信息、用户代码等内容，点击提交</li> <li>后端收到请求，生成判题记录编号，而后将判题记录编号作为任务投递给 MQ，同时将记录编号返给前端（生产者的工作完成了）</li> <li>判题机作为消费者，读取 MQ 消息，根据编号读数据库信息进行编译执行，并将结果与数据库比对，更新 MySQL 判题记录状态，并把记录状态以<code>{judge:status:记录编号, 1/2/3/4/5}</code>的键值对形式写进 Redis</li> <li>用户点击提交后，将收到后端返回的判题编号，前端将根据判题编号不断轮询 Redis 查询判题状态，这一状态将持续 20s 左右，而后再从 MySQL 中拿取判题的详细信息</li></ol> <p>RabbitMQ ACK 机制</p> <h2 id="自由画布协同编辑"><a href="#自由画布协同编辑" class="header-anchor">#</a> 自由画布协同编辑</h2> <h3 id="rbac-权限校验"><a href="#rbac-权限校验" class="header-anchor">#</a> RBAC 权限校验</h3> <p>基于角色权限体系（RBAC）控制用户权限，这里涉及复杂的权限申请、权限撤销等 CRUD</p> <table><thead><tr><th>角色 ID</th> <th>角色名称</th> <th>权限说明</th></tr></thead> <tbody><tr><td>0</td> <td>UserRoleClose</td> <td>文档关闭，无访问权限</td></tr> <tr><td>1</td> <td>UserRoleViewer</td> <td>查看者，只读权限</td></tr> <tr><td>2</td> <td>UserRoleEditor</td> <td>编辑者，可编辑内容</td></tr> <tr><td>3</td> <td>UserRoleOwner</td> <td>拥有者，完全控制权限</td></tr></tbody></table> <p>权限类型</p> <table><thead><tr><th>标记</th> <th>说明</th></tr></thead> <tbody><tr><td>URDFLagTemp (0)</td> <td>临时权限</td></tr> <tr><td>URDFLagPerm (1)</td> <td>永久权限</td></tr></tbody></table> <p>连接限制配置</p> <table><thead><tr><th>限制类型</th> <th>限制值</th> <th>说明</th></tr></thead> <tbody><tr><td>TotalTabLimit</td> <td>100</td> <td>总 Tab 数限制</td></tr> <tr><td>EditorTabLimit</td> <td>40</td> <td>可编辑者 Tab 数限制</td></tr> <tr><td>VisitorTabLimit</td> <td>20</td> <td>游客 Tab 数限制</td></tr> <tr><td>OneUserTabLimit</td> <td>2</td> <td>单用户 Tab 数限制</td></tr></tbody></table> <p>在 WebSocket 连接前，会先对 Limit Tab 进行校验</p> <h3 id="websocket-实时通信"><a href="#websocket-实时通信" class="header-anchor">#</a> WebSocket 实时通信</h3> <p>通过 WebSocket 实现画布协同编辑的通信，后端根据 docID 初始化 WebSocket 房间并写入数据库，</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">InitCoordinationRooms</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req UserRoleReq<span class="token punctuation">)</span> <span class="token builtin">error</span>
</code></pre></div><p>处理流程</p> <ol><li>获取文档的协作者列表</li> <li>检查是否需要初始化房间</li> <li>如果是首次有协作者，调用<code>util.InitCoordinationRoom()</code>初始化 WebSocket 房间</li> <li>返回初始化结果</li></ol> <p>通知协同状态变更：当用户权限变更时，通过 WebSocket 通知所有在线协作者</p> <ul><li>通过前端触发 Post 接口<code>/service/canvas/updateperms</code>，后端进行广播推送</li> <li>底层调用 WS 微服务 <code>wkservice_wsapi</code></li></ul> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> CoordinationUpdatePerms <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    UID   <span class="token builtin">int</span> <span class="token string">`json:&quot;uid&quot; form:&quot;uid&quot;`</span>
    Perms <span class="token builtin">int</span> <span class="token string">`json:&quot;perms&quot; form:&quot;perms&quot;`</span>  <span class="token comment">// 权限角色</span>
    Cause <span class="token builtin">int</span> <span class="token string">`json:&quot;cause&quot; form:&quot;cause&quot;`</span>  <span class="token comment">// 变更原因</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> NoticeCoordinationStatusParams <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    DocID   <span class="token builtin">string</span>                    <span class="token string">`json:&quot;docId&quot; form:&quot;docId&quot;`</span> <span class="token comment">// 加密后的文档ID</span>
    Updates <span class="token punctuation">[</span><span class="token punctuation">]</span>CoordinationUpdatePerms <span class="token string">`json:&quot;updates&quot; form:&quot;updates&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">NoticeCoordinationStatus</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req NoticeCoordinationStatusParams<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span>
</code></pre></div><p>在房间建立完成后，后端其实不涉及 WebSocket 的接口了，前置到前端去进行通信，通过外挂 WebSocket API 来实现通信，这个外挂的 WS 服务包含一个 API 服务（广播推送）和一层网关校验（Cookie 及权限校验）</p> <ul><li><code>wkservice_wsapi</code>：WebSocket API 服务</li> <li><code>wkservice_wsgateway</code>：WebSocket 网关服务</li></ul> <p>而真正的“协同编辑”，通过在“保存”动作后调用后端的持久化接口实现数据一致性，这里的后端数据比较复杂，分为三个部分</p> <ul><li>MySQL 存储文档描述信息</li> <li>BOS 存储文档 BDJson 内容</li> <li>ES 存储文档索引</li></ul> <p>实时协同编辑流程</p> <div class="language- extra-class"><pre class="language-text"><code>  用户操作
      ↓
  WebSocket 接收操作 (wkservice_wsapi服务)
      ↓
  操作转换成 BDJson 增量更新
      ↓
  广播给其他在线用户 (WebSocket Gateway)
      ↓
  调用 /savebdjson 持久化完整内容
      ↓
  wkservice_rtcs_canvas 保存到 BOS
      ↓
  NMQ 异步更新数据库
      ↓
  ES 索引更新
</code></pre></div><h3 id="风控与加密"><a href="#风控与加密" class="header-anchor">#</a> 风控与加密</h3> <p>一般风控回调处理</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">RiskCallBack</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>RiskCallBackReq<span class="token punctuation">)</span> <span class="token builtin">error</span>
</code></pre></div><p>处理流程</p> <ol><li>验证回调签名</li> <li>调用<code>cooperate.HandleCooperateRiskUpdate()</code>更新文档风控状态</li> <li>通知相关用户</li></ol> <p>这样的风控嵌入到每一次协同画布的更新操作前，例如，用户在画布中添加一个 Excel 文档，将会触发 Excel 风控提交</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">ExcelRiskSubmit</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>ExcelRiskSubmitReq<span class="token punctuation">)</span> <span class="token builtin">error</span>
</code></pre></div><p>将经过【获取 Excel 内容 → 提交到风控服务 → 异步等待风控结果 → 风控状态同步到协同信息】四个步骤，若触发风控，将拒绝本次画布更新</p> <p>另外，对于敏感数据【文档 ID，用户 ID，权限 ID】 均使用<code>fcrypt</code>加密传输</p> <h3 id="数据持久化"><a href="#数据持久化" class="header-anchor">#</a> 数据持久化</h3> <p>协同编辑的数据持久化依赖以下技术点</p> <ul><li>协同工作：分布式锁防止写并发问题</li> <li>文档编辑：统一的数据结构 BDJson</li> <li>文档索引：通过 NMQ 解耦 ES 索引更新</li></ul> <p>Redis 策略</p> <ol><li>Redis 缓存协同信息和用户权限</li> <li>Redis 分布式锁防止文档写并发问题</li></ol> <p>持久化流程：后端提供持久化接口，当用户在画布上编辑内容时，会调用<code>/savebdjson</code>接口</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// httpserver/controller/frcanv/savebdjson.go</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>SaveBDJsonController<span class="token punctuation">)</span> <span class="token function">Handler</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    err <span class="token operator">:=</span> savebdjsonServ<span class="token punctuation">.</span><span class="token function">SaveBDJson</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token operator">&amp;</span>util<span class="token punctuation">.</span>SaveCanvasBDJsonRequest<span class="token punctuation">{</span>
        UID<span class="token punctuation">:</span>    g<span class="token punctuation">.</span>param<span class="token punctuation">.</span>UIDStr<span class="token punctuation">,</span>
        DocID<span class="token punctuation">:</span>  g<span class="token punctuation">.</span>param<span class="token punctuation">.</span>DocID<span class="token punctuation">,</span>
        Canvas<span class="token punctuation">:</span> g<span class="token punctuation">.</span>param<span class="token punctuation">.</span>BDJson<span class="token punctuation">,</span>  <span class="token comment">// BDJson格式的画布内容</span>
        Bucket<span class="token punctuation">:</span> canvas<span class="token punctuation">.</span><span class="token function">GetBucket</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在服务层调用外部存储服务：<code>SaveCanvasBDJson()</code>函数调用微服务<code>wkservice_rtcs_canvas</code>执行真正的持久化操作</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// library/util/convutil.go</span>
<span class="token keyword">func</span> <span class="token function">SaveCanvasBDJson</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>SaveCanvasBDJsonRequest<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    ralReq <span class="token operator">:=</span> <span class="token operator">&amp;</span>ghttp<span class="token punctuation">.</span>RalPostRequest<span class="token punctuation">{</span>
        Method<span class="token punctuation">:</span> <span class="token string">&quot;POST&quot;</span><span class="token punctuation">,</span>
        Path<span class="token punctuation">:</span>   RtcsSaveCanvasBDJsonPath<span class="token punctuation">,</span> <span class="token comment">// /service/canvas/savecanvas</span>
        PostData<span class="token punctuation">:</span> req<span class="token punctuation">,</span>
        Encoder<span class="token punctuation">:</span>  codec<span class="token punctuation">.</span>JSONEncoder<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>
    err <span class="token operator">:=</span> ral<span class="token punctuation">.</span><span class="token function">RAL</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> RtcsCanvasServiceName<span class="token punctuation">,</span> ralReq<span class="token punctuation">,</span> ralResp<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在外部的微服务执行真正的持久化业务，这里的数据持久化很复杂，一共有三份数据要保存，分别是</p> <ol><li>存储完整的 BDJson 内容到 BOS</li> <li>更新 MySQL 数据库中的文档元数据，如标题、创建时间、更新时间等</li> <li>通过 NMQ 触发后续 ES 索引更新，用于搜索和快速检索</li></ol> <p>所以，即使 WebSocket 只负责广播修改，数据库层面的更新是通过触发 HTTP 接口实现，以此实现了实时通信与持久化的分离</p> <p>MySQL 表结构（元数据存储），即文档的描述信息</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> DocInfo <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    DocID      <span class="token builtin">uint64</span>
    Title      <span class="token builtin">string</span>
    UID        <span class="token builtin">uint64</span>
    CreateTime <span class="token builtin">int64</span>
    UpdateTime <span class="token builtin">int64</span>
    IsHide     <span class="token builtin">int</span>
    Flag       <span class="token builtin">int</span>
    <span class="token comment">// ... 其他元数据字段</span>
<span class="token punctuation">}</span>
</code></pre></div><p>BOS（对象存储系统）存储文档的实际内容</p> <ul><li>BDJson 格式的画布完整内容</li> <li>BosUrl 文件对象存储路径：<code>wenku/online/editor/{elementID}.json</code></li></ul> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// BOS存储的是完整的BDJson内容</span>
obj <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;wenku/online/editor/%s.json&quot;</span><span class="token punctuation">,</span> elementID<span class="token punctuation">)</span>
err <span class="token operator">=</span> bosClient<span class="token punctuation">.</span><span class="token function">UploadObjectBytes</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> obj<span class="token punctuation">,</span> bdjson<span class="token punctuation">)</span>
</code></pre></div><p>ES（Elasticsearch）存储用于搜索和快速检索的索引</p> <ul><li>文档标题</li> <li>文档内容摘要</li> <li>用于全文搜索</li></ul> <h2 id="网银系统的转账一致性"><a href="#网银系统的转账一致性" class="header-anchor">#</a> 网银系统的转账一致性</h2> <h3 id="日志事务"><a href="#日志事务" class="header-anchor">#</a> 日志事务</h3> <p>Spring @Transaction 注解</p> <h2 id="索引、缓存和限流"><a href="#索引、缓存和限流" class="header-anchor">#</a> 索引、缓存和限流</h2> <h3 id="联合覆盖索引"><a href="#联合覆盖索引" class="header-anchor">#</a> 联合覆盖索引</h3> <p>通过联合覆盖索引避免高频查询的回表问题</p> <p>对于判题记录表，我现在有这样几个需求，如何实现快速查找？</p> <ol><li>用户要能够根据 userId 快速找到自己做过哪些题目</li> <li>管理者要能够根据 questionId 快速找到某个题目被做了多少遍</li> <li>用户要能够根据 userId 和 questionId 快速找到指定题目的所有判题记录</li></ol> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><h4 id="联合索引"><a href="#联合索引" class="header-anchor">#</a> 联合索引</h4> <p>为了快速根据用户 id 和题目 id 查找数据，一个很朴素的方法就是，为这两个字段建立联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user_question<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>那么我们需要明确的是，这个索引的叶子节点中，包含<code>userId, questionId, recordId</code>三个字段，这意味着</p> <ol><li>在仅依靠 userId 这一个字段进行查询时，<strong>在效率上和 userId 的单个普通索引是一样的</strong>，但返回的结果将多一个 questionId 字段</li> <li>当根据<code>userId</code>和<code>questionId</code>进行联合查询时，这样能“快速”定位到对应数据的 recordId，但如果要其他信息，<strong>仍需要回表查询</strong></li></ol> <h4 id="覆盖索引"><a href="#覆盖索引" class="header-anchor">#</a> 覆盖索引</h4> <p>前面也说了，普通索引中存的是「索引列值 + 主键值」，这意味着，只要我查的是主键值，就不会回表</p> <p>例如</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span> recordId <span class="token keyword">from</span> record <span class="token keyword">where</span> userId<span class="token operator">=</span><span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre></div><p>由于 recordId 作为主键已经存在了 userId 的叶子索引结构中，所以他会直接返回结果，不需要回表查询</p> <p>那么我可不可以将一个关键信息都存在普通索引中呢？这样虽然增大了普通索引的存储开销，但不需要回表，节省的时间将是砍半的</p> <p>显然是可以的，我们可以利用联合索引，对一些高频数据全部丢到这个索引 B+ 树中，这样对于相当一部分的查询，都不需要回表操作</p> <p>例如，在上面的 record 表，一般而言，我只需要知道判题的状态，那么我们将 state 字段加入联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_union<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>那么在执行以下查询时</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SELECT</span> recordId<span class="token punctuation">,</span> state <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre></div><p>就不需要回表了，只查找一次联合索引，就可以得到所有想要的数据字段</p> <p>特别的，一次查询后，由于得到了关键的主键信息，判题记录们在前端作为一个列表呈现，所有的判题记录主键在前端是已经获得的信息，所以在进一步查询详细判题信息时，将直接走主键索引去查找，这样将始终不会回表</p> <h4 id="索引下推"><a href="#索引下推" class="header-anchor">#</a> 索引下推</h4> <blockquote><p>索引下推（Index Condition Pushdown，ICP），“遍历时过滤”</p></blockquote> <p>什么是索引下推，以上面的 record 表为例，我们此时只对 userId 建立了普通索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>对于一条查询</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre></div><p>若没有 ICP，数据库会先通过索引找到所有匹配<code>userId</code>的主键<code>recordId</code>，把这些主键“拉回”服务器层，再在服务器层过滤<code>questionId</code>等条件</p> <p>当有 ICP 时，数据库在遍历索引的过程中，就先过滤掉不满足<code>questionId</code>等条件的记录，只把符合所有条件的主键“拉回”服务器层</p> <ul><li>即：边遍历边过滤，而不是遍历完批处理</li></ul> <p>当然，ICP 在联合索引的场景下作用并不明显，因为联合索引本身已经能在索引树中直接定位<code>userId + questionId</code>，无需 ICP 额外过滤，也是为什么联合索引效率更高的原因之一</p> <h4 id="skip-scan"><a href="#skip-scan" class="header-anchor">#</a> Skip Scan</h4> <p>在高版本的 MySQL 中引入的跳跃检索机制，可以“逃避”最左匹配索引</p> <h3 id="缓存"><a href="#缓存" class="header-anchor">#</a> 缓存</h3> <p>对文档表进行缓存，详见 <a href="https://northboat.github.io/pages/aee6d6/#redis-%E7%BC%93%E5%AD%98%E5%AD%98%E5%8F%96" target="_blank" rel="nofollow noopener noreferrer">键值数据库 | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>大 Key 热 Key 处理：大 Key 拆分，热 Key 分级</p> <h3 id="令牌桶限流"><a href="#令牌桶限流" class="header-anchor">#</a> 令牌桶限流</h3> <p>对于 API 请求，Redis 单线程记录 IP 对 API 每分钟的请求次数，超出则在 Controller 中拒绝访问，例如</p> <ol><li>用户提交成功后，在收到返回前，不能重复提交</li> <li>用户在 5s 以内只能成功提交一次</li></ol> <p>这样需要对这个接口上两道锁</p> <ul><li>一道是执行锁，限定单个用户对同一道题在同一时刻只能判一次</li> <li>一道是频控锁，限定单个用户对同一道题在 5s 内只能判题一次</li></ul> <p>执行锁：使用 Redis 的原子锁，SET NX + EX 实现，控制字段</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:lock:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> requestId NX EX <span class="token number">300</span>
</code></pre></div><p>这个字段的键由用户 ID 和题目 ID 构成，值为本次提交的请求 ID</p> <ul><li><code>NX</code>：不存在才设置</li> <li><code>EX 300</code>：兜底超时，防止执行锁卡死</li></ul> <p>只需要在判题前加入一个 Redis 的判断即可</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> locked <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span>
    requestId<span class="token punctuation">,</span>
    <span class="token number">300</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>locked<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;请勿重复提交任务&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在判题结束后，需要释放执行锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">finally</span> <span class="token punctuation">{</span>
    <span class="token function">releaseLock</span><span class="token punctuation">(</span><span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span> requestId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>频控锁：使用 Redis 的冷却锁实现</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:freq:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> <span class="token number">1</span> NX EX <span class="token number">5</span>
</code></pre></div><p>即设置一个 5s 超时时间的键值对，键同样由用户 ID 和题目 ID 构成，在判题前进行拦截</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> allowed <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:freq:&quot;</span> <span class="token operator">+</span> uid<span class="token punctuation">,</span>
    <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span>
    <span class="token number">5</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>allowed<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;操作频繁&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>执行流程如下</p> <div class="language- extra-class"><pre class="language-text"><code>请求进来
 ↓
校验身份 / IP
 ↓
【1】尝试获取执行锁（docker:lock）
    失败 → 直接拒绝
 ↓
【2】尝试获取 5s 频控锁（docker:freq）
    失败 → 释放执行锁 → 拒绝
 ↓
【3】真正执行 docker
 ↓
【4】finally 中释放执行锁
</code></pre></div><p>为什么频控在执行锁之后？更直觉的处理，先判断有没有锁进门，再判断能进多少人，这个优先级要搞清</p> <ul><li>如果频控先于执行，在第一秒和第六秒都有人来打请求，那么两个请求都能通过频控锁，而第一秒的请求没结束，所以第六秒的请求会消耗执行锁的判断（一共是四次判断）</li> <li>如果执行先于频控，上述事件就会少一次判断（三次判断），那另一种情况下，第一秒和第四秒都有请求打进来，并且已经执行完，那么也会有四次判断，但这里由于频率过高会被第四次判断拦截，这正是我想要的结果</li></ul> <p>就是说，我一定要先判断有没有进入的权限，再判断是否达标，否则我没有必要判断是否达标，懂我意思吗</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/04/20, 17:29:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/e9c57b/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">PPT 生成详解</div></a> <a href="/pages/d6f021/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">分布式与微服务基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
