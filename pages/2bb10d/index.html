pheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">高并发与高可用场景<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="网银系统的日志解耦"><a href="#网银系统的日志解耦" class="header-anchor">#</a> 网银系统的日志解耦</h2> <p>如何做业务解耦？如何保证数据一致性（事务）？</p> <h3 id="日志切面与解耦"><a href="#日志切面与解耦" class="header-anchor">#</a> 日志切面与解耦</h3> <p>AOP 日志切面</p> <h3 id="日志事务"><a href="#日志事务" class="header-anchor">#</a> 日志事务</h3> <p>Spring @Transaction 注解</p> <h3 id="判题业务解耦"><a href="#判题业务解耦" class="header-anchor">#</a> 判题业务解耦</h3> <p>设计模式</p> <ul><li>模板工厂模式：抽象判题流程</li> <li>策略模式：三种策略编译执行代码</li></ul> <p>类似于车票排队等订单处理的设计</p> <img src="/assets/img/image-20260301175158350.7aaf4e8d.png"> <p>用户从页面查询、填写并发起一次判题请求，具体经过了如下步骤</p> <ol><li>从 Redis 读出题目详细信息，进入做题页面</li> <li>用户填写表单，包含用户信息、题目信息、用户代码等内容，点击提交</li> <li>后端收到请求，生成判题记录编号，而后将判题记录编号作为任务投递给 MQ，同时将记录编号返给前端（生产者的工作完成了）</li> <li>判题机作为消费者，读取 MQ 消息，根据编号读数据库信息进行编译执行，并将结果与数据库比对，更新 MySQL 判题记录状态，并把记录状态以<code>{judge:status:记录编号, 1/2/3/4/5}</code>的键值对形式写进 Redis</li> <li>用户点击提交后，将收到后端返回的判题编号，前端将根据判题编号不断轮询 Redis 查询判题状态，这一状态将持续 20s 左右，而后再从 MySQL 中拿取判题的详细信息</li></ol> <p>RabbitMQ ACK 机制</p> <h2 id="自由画布协同编辑"><a href="#自由画布协同编辑" class="header-anchor">#</a> 自由画布协同编辑</h2> <h3 id="rbac-权限校验"><a href="#rbac-权限校验" class="header-anchor">#</a> RBAC 权限校验</h3> <p>基于角色权限体系（RBAC）控制用户权限，这里涉及复杂的权限申请、权限撤销等 CRUD</p> <table><thead><tr><th>角色 ID</th> <th>角色名称</th> <th>权限说明</th></tr></thead> <tbody><tr><td>0</td> <td>UserRoleClose</td> <td>文档关闭，无访问权限</td></tr> <tr><td>1</td> <td>UserRoleViewer</td> <td>查看者，只读权限</td></tr> <tr><td>2</td> <td>UserRoleEditor</td> <td>编辑者，可编辑内容</td></tr> <tr><td>3</td> <td>UserRoleOwner</td> <td>拥有者，完全控制权限</td></tr></tbody></table> <p>权限类型</p> <table><thead><tr><th>标记</th> <th>说明</th></tr></thead> <tbody><tr><td>URDFLagTemp (0)</td> <td>临时权限</td></tr> <tr><td>URDFLagPerm (1)</td> <td>永久权限</td></tr></tbody></table> <p>连接限制配置</p> <table><thead><tr><th>限制类型</th> <th>限制值</th> <th>说明</th></tr></thead> <tbody><tr><td>TotalTabLimit</td> <td>100</td> <td>总 Tab 数限制</td></tr> <tr><td>EditorTabLimit</td> <td>40</td> <td>可编辑者 Tab 数限制</td></tr> <tr><td>VisitorTabLimit</td> <td>20</td> <td>游客 Tab 数限制</td></tr> <tr><td>OneUserTabLimit</td> <td>2</td> <td>单用户 Tab 数限制</td></tr></tbody></table> <p>在 WebSocket 连接前，会先对 Limit Tab 进行校验</p> <h3 id="websocket-实时通信"><a href="#websocket-实时通信" class="header-anchor">#</a> WebSocket 实时通信</h3> <p>通过 WebSocket 实现画布协同编辑的通信，后端根据 docID 初始化 WebSocket 房间并写入数据库，</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">InitCoordinationRooms</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req UserRoleReq<span class="token punctuation">)</span> <span class="token builtin">error</span>
</code></pre></div><p>处理流程</p> <ol><li>获取文档的协作者列表</li> <li>检查是否需要初始化房间</li> <li>如果是首次有协作者，调用<code>util.InitCoordinationRoom()</code>初始化 WebSocket 房间</li> <li>返回初始化结果</li></ol> <p>通知协同状态变更：当用户权限变更时，通过 WebSocket 通知所有在线协作者</p> <ul><li>通过前端触发 Post 接口<code>/service/canvas/updateperms</code>，后端进行广播推送</li> <li>底层调用 WS 微服务 <code>wkservice_wsapi</code></li></ul> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> CoordinationUpdatePerms <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    UID   <span class="token builtin">int</span> <span class="token string">`json:&quot;uid&quot; form:&quot;uid&quot;`</span>
    Perms <span class="token builtin">int</span> <span class="token string">`json:&quot;perms&quot; form:&quot;perms&quot;`</span>  <span class="token comment">// 权限角色</span>
    Cause <span class="token builtin">int</span> <span class="token string">`json:&quot;cause&quot; form:&quot;cause&quot;`</span>  <span class="token comment">// 变更原因</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> NoticeCoordinationStatusParams <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    DocID   <span class="token builtin">string</span>                    <span class="token string">`json:&quot;docId&quot; form:&quot;docId&quot;`</span> <span class="token comment">// 加密后的文档ID</span>
    Updates <span class="token punctuation">[</span><span class="token punctuation">]</span>CoordinationUpdatePerms <span class="token string">`json:&quot;updates&quot; form:&quot;updates&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">NoticeCoordinationStatus</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req NoticeCoordinationStatusParams<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span>
</code></pre></div><p>在房间建立完成后，后端其实不涉及 WebSocket 的接口了，前置到前端去进行通信，通过外挂 WebSocket API 来实现通信，这个外挂的 WS 服务包含一个 API 服务（广播推送）和一层网关校验（Cookie 及权限校验）</p> <ul><li><code>wkservice_wsapi</code>：WebSocket API 服务</li> <li><code>wkservice_wsgateway</code>：WebSocket 网关服务</li></ul> <p>而真正的“协同编辑”，通过在“保存”动作后调用后端的持久化接口实现数据一致性，这里的后端数据比较复杂，分为三个部分</p> <ul><li>MySQL 存储文档描述信息</li> <li>BOS 存储文档 BDJson 内容</li> <li>ES 存储文档索引</li></ul> <p>实时协同编辑流程</p> <div class="language- extra-class"><pre class="language-text"><code>  用户操作
      ↓
  WebSocket 接收操作 (wkservice_wsapi服务)
      ↓
  操作转换成 BDJson 增量更新
      ↓
  广播给其他在线用户 (WebSocket Gateway)
      ↓
  调用 /savebdjson 持久化完整内容
      ↓
  wkservice_rtcs_canvas 保存到 BOS
      ↓
  NMQ 异步更新数据库
      ↓
  ES 索引更新
</code></pre></div><h3 id="风控和锁"><a href="#风控和锁" class="header-anchor">#</a> 风控和锁</h3> <p>风控上锁 SetNX 分布式锁 <strong>model/data/coordinate/coordinationrisk.go</strong>：SetNX 即 set if not exist</p> <ul><li>仅用于风控相关操作（ElementRisk、RiskCallBack）</li> <li>锁的 TTL 为1秒</li> <li>最多重试 3 次，每次间隔 400ms</li></ul> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// 第69-78行：Redis SetNX 实现分布式锁</span>
<span class="token keyword">func</span> <span class="token function">GetAndAddLock</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> key <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
  <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> MaxRetryNum<span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
    riskLock<span class="token punctuation">,</span> setErr <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">GetRedisIns</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">SetNX</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token string">&quot;true&quot;</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token operator">*</span>time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> setErr <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> riskLock <span class="token punctuation">{</span>
      <span class="token keyword">break</span>
    <span class="token punctuation">}</span>
    time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">400</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Millisecond<span class="token punctuation">)</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>


<span class="token keyword">func</span> <span class="token function">ElementRisk</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ElementRiskReq<span class="token punctuation">)</span> basis<span class="token punctuation">.</span>RiskContent <span class="token punctuation">{</span>
  <span class="token comment">// 读之前加锁</span>
  key <span class="token operator">:=</span> SetRiskLockKey <span class="token operator">+</span> req<span class="token punctuation">.</span>CanvasDocId
  <span class="token function">GetAndAddLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">)</span>
  <span class="token comment">// 确保锁会被释放</span>
  <span class="token keyword">defer</span> basis<span class="token punctuation">.</span><span class="token function">GetRedisIns</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Del</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">)</span>

  <span class="token comment">// 读风控内容</span>
  object <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>bos_util<span class="token punctuation">.</span>BosCanvasKeyPre<span class="token operator">+</span><span class="token string">&quot;/%s/risk/%s.%s&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>CanvasDocId<span class="token punctuation">,</span> req<span class="token punctuation">.</span>CanvasDocId<span class="token punctuation">,</span> <span class="token string">&quot;txt&quot;</span><span class="token punctuation">)</span>
  riskContent <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">GetRiskContent</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> object<span class="token punctuation">)</span>

  <span class="token comment">// 修改：根据不同元素类型操作列表，更新 riskContent.CanvasEleRiskList</span>
  <span class="token keyword">if</span> req<span class="token punctuation">.</span>ElementType <span class="token operator">==</span> ContentTypeText <span class="token punctuation">{</span>
    <span class="token comment">// 风控检查：调用 wenchain 的风控微服务</span>
    txtRisk<span class="token punctuation">,</span> err <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">RunWenchainRisk</span><span class="token punctuation">(</span>
      ctx<span class="token punctuation">,</span>
      basis<span class="token punctuation">.</span>WcRiskReq<span class="token punctuation">{</span>
        Channel<span class="token punctuation">:</span> basis<span class="token punctuation">.</span>FileRiskChannel<span class="token punctuation">,</span>
        UserID<span class="token punctuation">:</span>  strconv<span class="token punctuation">.</span><span class="token function">FormatUint</span><span class="token punctuation">(</span>req<span class="token punctuation">.</span>UID<span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
        Extra<span class="token punctuation">:</span> basis<span class="token punctuation">.</span>WcRiskReqExtra<span class="token punctuation">{</span>
          Content<span class="token punctuation">:</span> req<span class="token punctuation">.</span>Content<span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">)</span>
    resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;txt risk&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;txtRisk&quot;</span><span class="token punctuation">,</span> txtRisk<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">||</span> txtRisk <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
      <span class="token keyword">return</span> riskContent
    <span class="token punctuation">}</span>
    
    <span class="token comment">// 拓展风控列表</span>
    <span class="token keyword">if</span> txtRisk<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>IsRiskCheck <span class="token punctuation">{</span>
      riskContent<span class="token punctuation">.</span>CanvasEleRiskList <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>riskContent<span class="token punctuation">.</span>CanvasEleRiskList<span class="token punctuation">,</span> req<span class="token punctuation">.</span>ElementId<span class="token punctuation">)</span>
      <span class="token comment">// ...</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
      riskContent<span class="token punctuation">.</span>CanvasEleRiskList <span class="token operator">=</span> basis<span class="token punctuation">.</span><span class="token function">RemoveRiskEle</span><span class="token punctuation">(</span>riskContent<span class="token punctuation">.</span>CanvasEleRiskList<span class="token punctuation">,</span> req<span class="token punctuation">.</span>ElementId<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 更新风控列表，写入 BOS</span>
    err <span class="token operator">=</span> <span class="token function">uploadRiskContent</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> object<span class="token punctuation">,</span> riskContent<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
      resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;upload risk content failed&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;object&quot;</span><span class="token punctuation">,</span> object<span class="token punctuation">)</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;error&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
      <span class="token keyword">return</span> riskContent
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
  <span class="token comment">// ... 对于不同类型的 Element 都进行类似的 if-else 处理</span>
  <span class="token comment">// ...</span>
  <span class="token keyword">return</span> riskContent
<span class="token punctuation">}</span>


<span class="token comment">// 写操作：保存风控内容至 BOS</span>
<span class="token keyword">func</span> <span class="token function">uploadRiskContent</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> object <span class="token builtin">string</span><span class="token punctuation">,</span> content basis<span class="token punctuation">.</span>RiskContent<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
  textByte<span class="token punctuation">,</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Marshal</span><span class="token punctuation">(</span>content<span class="token punctuation">)</span>
  <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> err
  <span class="token punctuation">}</span>
  <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">=</span> modbdjson<span class="token punctuation">.</span><span class="token function">UploadObjectBytes</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> bos_util<span class="token punctuation">.</span><span class="token function">GetBucket</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> object<span class="token punctuation">,</span> textByte<span class="token punctuation">,</span> <span class="token boolean">true</span><span class="token punctuation">)</span>
  <span class="token keyword">return</span> err
<span class="token punctuation">}</span>
</code></pre></div><p>风控列表必须保持数据一致性</p> <ul><li>并发操作可能导致风险状态不准确</li> <li>风控列表的维护需要保证原子性</li> <li>通过加锁确保每次操作都是完整且独立</li></ul> <p>但对于文档持久化，在业务层并没有锁处理</p> <ol><li>对于 BDJson 存 BOS，这里是一个同步处理，调用外挂的写 BOS 服务实现，这里一定有锁机制控制</li> <li>MySQL、ES 也都没有加写锁，直接丢到消息队列给下游去消费处理了，可能消费者加锁了，但我已经无从得知了</li></ol> <p>此外，对于敏感数据【文档 ID，用户 ID，权限 ID】 均使用<code>fcrypt</code>加密传输</p> <h3 id="数据持久化"><a href="#数据持久化" class="header-anchor">#</a> 数据持久化</h3> <p>每次编辑文档，持久化顺序如下</p> <ol><li>同步阻塞更新 BOS 中 BDJson 内容</li> <li>异步更新 MySQL 元数据，通过 NMQ 解耦</li> <li>异步更新 ES 索引数据，通过 NMQ 解耦</li></ol> <p><strong>library/util/convutil.go</strong>：创建协同房间，其实就是调外挂的 websocket 微服务根据 docId、uid、docFrom 创建 ws 房间</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">InitCoordinationRoom</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req InitCoordinationRoomParams<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">var</span> form <span class="token operator">=</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span>
		<span class="token string">&quot;docId&quot;</span><span class="token punctuation">:</span>   req<span class="token punctuation">.</span>DocID<span class="token punctuation">,</span>
		<span class="token string">&quot;uid&quot;</span><span class="token punctuation">:</span>     req<span class="token punctuation">.</span>UID<span class="token punctuation">,</span>
		<span class="token string">&quot;docFrom&quot;</span><span class="token punctuation">:</span> req<span class="token punctuation">.</span>DocFrom<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>
	values <span class="token operator">:=</span> url<span class="token punctuation">.</span>Values<span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">for</span> k<span class="token punctuation">,</span> v <span class="token operator">:=</span> <span class="token keyword">range</span> form <span class="token punctuation">{</span>
		values<span class="token punctuation">.</span><span class="token function">Set</span><span class="token punctuation">(</span>k<span class="token punctuation">,</span> v<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	ralReq <span class="token operator">:=</span> <span class="token operator">&amp;</span>ghttp<span class="token punctuation">.</span>RalRequest<span class="token punctuation">{</span>
		Method<span class="token punctuation">:</span> <span class="token string">&quot;GET&quot;</span><span class="token punctuation">,</span>
		Path<span class="token punctuation">:</span>   WsapiInitRoomPath<span class="token punctuation">,</span>
		Query<span class="token punctuation">:</span>  values<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>
	response <span class="token operator">:=</span> <span class="token operator">&amp;</span>NoticeCoordinationStatusResp<span class="token punctuation">{</span><span class="token punctuation">}</span>
	ralResp <span class="token operator">:=</span> <span class="token operator">&amp;</span>ghttp<span class="token punctuation">.</span>RalResponse<span class="token punctuation">{</span>
		Data<span class="token punctuation">:</span>    response<span class="token punctuation">,</span>
		Decoder<span class="token punctuation">:</span> codec<span class="token punctuation">.</span>JSONDecoder<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>
	resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;init coordination room &quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;req&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">)</span><span class="token punctuation">)</span>
	err <span class="token operator">:=</span> ral<span class="token punctuation">.</span><span class="token function">RAL</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> WsapiServiceName<span class="token punctuation">,</span> ralReq<span class="token punctuation">,</span> ralResp<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;initroom ral fail&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> response<span class="token punctuation">.</span>Status<span class="token punctuation">.</span>Code <span class="token operator">!=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;initroom ral code is &quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;req&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> response<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>Success<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p><strong>httpserver/controller/frcanv/savebdjson.go</strong>：持久化接口</p> <ol><li>先同步更新 BOS</li> <li>再消息队列通知更新 MySQL</li> <li>最后消息队列通知更新 ES</li></ol> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>savebdjson<span class="token punctuation">)</span> <span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

	err <span class="token operator">:=</span> savebdjsonServ<span class="token punctuation">.</span><span class="token function">SaveBDJson</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token operator">&amp;</span>util<span class="token punctuation">.</span>SaveCanvasBDJsonRequest<span class="token punctuation">{</span>

		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> canvas_error<span class="token punctuation">.</span>ErrWkInternalError

	nuid <span class="token operator">:=</span> <span class="token function">uint64</span><span class="token punctuation">(</span>g<span class="token punctuation">.</span>sockID<span class="token punctuation">)</span>
	canvasDocPayload <span class="token operator">:=</span> canvasdoc<span class="token punctuation">.</span>CanvasDocPayload<span class="token punctuation">{</span>
		DocID<span class="token punctuation">:</span>      <span class="token operator">&amp;</span>g<span class="token punctuation">.</span>param<span class="token punctuation">.</span>DocIDInt<span class="token punctuation">,</span>
		Title<span class="token punctuation">:</span>      g<span class="token punctuation">.</span>param<span class="token punctuation">.</span>Title<span class="token punctuation">,</span>

		Product<span class="token punctuation">:</span>    frtocUtil<span class="token punctuation">.</span><span class="token function">Uint8PTR</span><span class="token punctuation">(</span>canvasmaterial<span class="token punctuation">.</span>ToB<span class="token punctuation">)</span><span class="token punctuation">,</span>

</code></pre></div><p>底层的 SaveCanvasBDJson 函数，调用的是一个叫<code>RtcsSaveCanvasBDJsonPath</code>的微服务</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// 保存自由画布内容</span>
<span class="token keyword">func</span> <span class="token function">SaveCanvasBDJson</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>SaveCanvasBDJsonRequest<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>

		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;SaveCanvasBDJson req is nil&quot;</span><span class="token punctuation">)</span>
		<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;SaveCanvasBDJson req is nil&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">var</span> header <span class="token operator">=</span> http<span class="token punctuation">.</span>Header<span class="token punctuation">{</span><span class="token punctuation">}</span>
	header<span class="token punctuation">.</span><span class="token function">Add</span><span class="token punctuation">(</span><span class="token string">&quot;Content-Type&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;application/json&quot;</span><span class="token punctuation">)</span>
	header<span class="token punctuation">.</span><span class="token function">Add</span><span class="token punctuation">(</span><span class="token string">&quot;Cookie&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;BDUSS=&quot;</span><span class="token operator">+</span>req<span class="token punctuation">.</span>BDUSS<span class="token punctuation">)</span>
	ralReq <span class="token operator">:=</span> <span class="token operator">&amp;</span>ghttp<span class="token punctuation">.</span>RalPostRequest<span class="token punctuation">{</span>
		RalRequest<span class="token punctuation">:</span> ghttp<span class="token punctuation">.</span>RalRequest<span class="token punctuation">{</span>
			Method<span class="token punctuation">:</span> <span class="token string">&quot;POST&quot;</span><span class="token punctuation">,</span>
			Path<span class="token punctuation">:</span>   RtcsSaveCanvasBDJsonPath<span class="token punctuation">,</span>
			Header<span class="token punctuation">:</span> header<span class="token punctuation">,</span>
		<span class="token punctuation">}</span><span class="token punctuation">,</span>
		PostData<span class="token punctuation">:</span> req<span class="token punctuation">,</span>
		Encoder<span class="token punctuation">:</span>  codec<span class="token punctuation">.</span>JSONEncoder<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>
	resp <span class="token operator">:=</span> <span class="token operator">&amp;</span>SaveCanvasBDJsonResponse<span class="token punctuation">{</span><span class="token punctuation">}</span>
	ralResp <span class="token operator">:=</span> <span class="token operator">&amp;</span>ghttp<span class="token punctuation">.</span>RalResponse<span class="token punctuation">{</span>
		Data<span class="token punctuation">:</span>    resp<span class="token punctuation">,</span>
		Decoder<span class="token punctuation">:</span> codec<span class="token punctuation">.</span>JSONDecoder<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> ral<span class="token punctuation">.</span><span class="token function">RAL</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> RtcsCanvasServiceName<span class="token punctuation">,</span> ralReq<span class="token punctuation">,</span> ralResp<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> RtcsCanvasServiceName<span class="token operator">+</span><span class="token string">&quot;call failed&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>RtcsCanvasServiceName <span class="token operator">+</span> <span class="token string">&quot;call failed&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> ralResp<span class="token punctuation">.</span><span class="token function">Response</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> ralResp<span class="token punctuation">.</span><span class="token function">Response</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>Body <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">defer</span> ralResp<span class="token punctuation">.</span><span class="token function">Response</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>Body<span class="token punctuation">.</span><span class="token function">Close</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> resp<span class="token punctuation">.</span>Status<span class="token punctuation">.</span>Code <span class="token operator">!=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> RtcsCanvasServiceName<span class="token operator">+</span><span class="token string">&quot;call failed&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">String</span><span class="token punctuation">(</span><span class="token string">&quot;errMSg&quot;</span><span class="token punctuation">,</span> resp<span class="token punctuation">.</span>Status<span class="token punctuation">.</span>Msg<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>RtcsCanvasServiceName <span class="token operator">+</span> <span class="token string">&quot;call failed&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p><strong>model/service.canvasdoc/doc.go</strong>：消息队列更新 ES 索引函数</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>d <span class="token operator">*</span>CanvasDocServiceImpl<span class="token punctuation">)</span> <span class="token function">UpdateDoc</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>CanvasDocPayload<span class="token punctuation">)</span> <span class="token punctuation">(</span>err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> req <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">||</span> req<span class="token punctuation">.</span>DocID <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">||</span> <span class="token operator">*</span>req<span class="token punctuation">.</span>DocID <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> wkerror<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>wkerror<span class="token punctuation">.</span>ErrorCodeParamsError<span class="token punctuation">,</span> <span class="token string">&quot;docid or title is empty&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	dbBody<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">buildESDocBody</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> wkerror<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>wkerror<span class="token punctuation">.</span>ErrorCodeParamsError<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

  <span class="token comment">// 发送消息队列</span>
	err <span class="token operator">=</span> <span class="token function">SendNmq</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> UdocCommandNo<span class="token punctuation">,</span> req<span class="token punctuation">.</span>DocID<span class="token punctuation">,</span> dbBody<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>NMQ 是异步消息队列，发送后不等待确认，如果需要确认持久化完成，需要通过查询下游系统（MySQL / ES）来间接判定，为什么这么设计？</p> <p>主要是性能优化，大约从 600 ms 降到 500 ms</p> <ul><li>BOS 上传：～100-500 ms</li> <li>MySQL 写入：～10-50 ms，异步的话 ～ 1-5 ms</li> <li>ES 索引：～ 50-200 ms，异步的话 ～ 1-5 ms</li></ul> <p>其次 MySQL 和 ES 数据没那么重要</p> <ul><li>BOS 是核心数据：画布的完整编辑内容，丢失后无法恢复，必须同步确认成功</li> <li>MySQL / ES 是辅助数据：元数据和搜索索引，即使失败也可以通过重新扫描 BOS 数据重建</li></ul> <p>另外，NMQ 的可靠性保证防止下游数据丢失</p> <ul><li>消息持久化到队列</li> <li>消费者重试机制</li> <li>支持死信队列处理失败消息</li></ul> <p>这是一种实用主义的架构设计，在数据可靠性、系统性能和开发复杂度之间做平衡</p> <h2 id="索引、缓存和限流"><a href="#索引、缓存和限流" class="header-anchor">#</a> 索引、缓存和限流</h2> <h3 id="联合覆盖索引"><a href="#联合覆盖索引" class="header-anchor">#</a> 联合覆盖索引</h3> <p>通过联合覆盖索引避免高频查询的回表问题</p> <p>对于判题记录表，我现在有这样几个需求，如何实现快速查找？</p> <ol><li>用户要能够根据 userId 快速找到自己做过哪些题目</li> <li>管理者要能够根据 questionId 快速找到某个题目被做了多少遍</li> <li>用户要能够根据 userId 和 questionId 快速找到指定题目的所有判题记录</li></ol> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><h4 id="联合索引"><a href="#联合索引" class="header-anchor">#</a> 联合索引</h4> <p>为了快速根据用户 id 和题目 id 查找数据，一个很朴素的方法就是，为这两个字段建立联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user_question<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>那么我们需要明确的是，这个索引的叶子节点中，包含<code>userId, questionId, recordId</code>三个字段，这意味着</p> <ol><li>在仅依靠 userId 这一个字段进行查询时，<strong>在效率上和 userId 的单个普通索引是一样的</strong>，但返回的结果将多一个 questionId 字段</li> <li>当根据<code>userId</code>和<code>questionId</code>进行联合查询时，这样能“快速”定位到对应数据的 recordId，但如果要其他信息，<strong>仍需要回表查询</strong></li></ol> <h4 id="覆盖索引"><a href="#覆盖索引" class="header-anchor">#</a> 覆盖索引</h4> <p>前面也说了，普通索引中存的是「索引列值 + 主键值」，这意味着，只要我查的是主键值，就不会回表</p> <p>例如</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span> recordId <span class="token keyword">from</span> record <span class="token keyword">where</span> userId<span class="token operator">=</span><span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre></div><p>由于 recordId 作为主键已经存在了 userId 的叶子索引结构中，所以他会直接返回结果，不需要回表查询</p> <p>那么我可不可以将一个关键信息都存在普通索引中呢？这样虽然增大了普通索引的存储开销，但不需要回表，节省的时间将是砍半的</p> <p>显然是可以的，我们可以利用联合索引，对一些高频数据全部丢到这个索引 B+ 树中，这样对于相当一部分的查询，都不需要回表操作</p> <p>例如，在上面的 record 表，一般而言，我只需要知道判题的状态，那么我们将 state 字段加入联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_union<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>那么在执行以下查询时</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SELECT</span> recordId<span class="token punctuation">,</span> state <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre></div><p>就不需要回表了，只查找一次联合索引，就可以得到所有想要的数据字段</p> <p>特别的，一次查询后，由于得到了关键的主键信息，判题记录们在前端作为一个列表呈现，所有的判题记录主键在前端是已经获得的信息，所以在进一步查询详细判题信息时，将直接走主键索引去查找，这样将始终不会回表</p> <h4 id="索引下推"><a href="#索引下推" class="header-anchor">#</a> 索引下推</h4> <blockquote><p>索引下推（Index Condition Pushdown，ICP），“遍历时过滤”</p></blockquote> <p>什么是索引下推，以上面的 record 表为例，我们此时只对 userId 建立了普通索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>对于一条查询</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre></div><p>若没有 ICP，数据库会先通过索引找到所有匹配<code>userId</code>的主键<code>recordId</code>，把这些主键“拉回”服务器层，再在服务器层过滤<code>questionId</code>等条件</p> <p>当有 ICP 时，数据库在遍历索引的过程中，就先过滤掉不满足<code>questionId</code>等条件的记录，只把符合所有条件的主键“拉回”服务器层</p> <ul><li>即：边遍历边过滤，而不是遍历完批处理</li></ul> <p>当然，ICP 在联合索引的场景下作用并不明显，因为联合索引本身已经能在索引树中直接定位<code>userId + questionId</code>，无需 ICP 额外过滤，也是为什么联合索引效率更高的原因之一</p> <h4 id="skip-scan"><a href="#skip-scan" class="header-anchor">#</a> Skip Scan</h4> <p>在高版本的 MySQL 中引入的跳跃检索机制，可以“逃避”最左匹配索引</p> <h3 id="缓存"><a href="#缓存" class="header-anchor">#</a> 缓存</h3> <p>对文档表进行缓存，详见 <a href="https://northboat.github.io/pages/aee6d6/#redis-%E7%BC%93%E5%AD%98%E5%AD%98%E5%8F%96" target="_blank" rel="nofollow noopener noreferrer">键值数据库 | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>大 Key 热 Key 处理：大 Key 拆分，热 Key 分级</p> <h3 id="令牌桶限流"><a href="#令牌桶限流" class="header-anchor">#</a> 令牌桶限流</h3> <p>对于 API 请求，Redis 单线程记录 IP 对 API 每分钟的请求次数，超出则在 Controller 中拒绝访问，例如</p> <ol><li>用户提交成功后，在收到返回前，不能重复提交</li> <li>用户在 5s 以内只能成功提交一次</li></ol> <p>这样需要对这个接口上两道锁</p> <ul><li>一道是执行锁，限定单个用户对同一道题在同一时刻只能判一次</li> <li>一道是频控锁，限定单个用户对同一道题在 5s 内只能判题一次</li></ul> <p>执行锁：使用 Redis 的原子锁，SET NX + EX 实现，控制字段</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:lock:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> requestId NX EX <span class="token number">300</span>
</code></pre></div><p>这个字段的键由用户 ID 和题目 ID 构成，值为本次提交的请求 ID</p> <ul><li><code>NX</code>：不存在才设置</li> <li><code>EX 300</code>：兜底超时，防止执行锁卡死</li></ul> <p>只需要在判题前加入一个 Redis 的判断即可</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> locked <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span>
    requestId<span class="token punctuation">,</span>
    <span class="token number">300</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>locked<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;请勿重复提交任务&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在判题结束后，需要释放执行锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">finally</span> <span class="token punctuation">{</span>
    <span class="token function">releaseLock</span><span class="token punctuation">(</span><span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span> requestId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>频控锁：使用 Redis 的冷却锁实现</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:freq:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> <span class="token number">1</span> NX EX <span class="token number">5</span>
</code></pre></div><p>即设置一个 5s 超时时间的键值对，键同样由用户 ID 和题目 ID 构成，在判题前进行拦截</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> allowed <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:freq:&quot;</span> <span class="token operator">+</span> uid<span class="token punctuation">,</span>
    <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span>
    <span class="token number">5</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>allowed<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;操作频繁&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>执行流程如下</p> <div class="language- extra-class"><pre class="language-text"><code>请求进来
 ↓
校验身份 / IP
 ↓
【1】尝试获取执行锁（docker:lock）
    失败 → 直接拒绝
 ↓
【2】尝试获取 5s 频控锁（docker:freq）
    失败 → 释放执行锁 → 拒绝
 ↓
【3】真正执行 docker
 ↓
【4】finally 中释放执行锁
</code></pre></div><p>为什么频控在执行锁之后？更直觉的处理，先判断有没有锁进门，再判断能进多少人，这个优先级要搞清</p> <ul><li>如果频控先于执行，在第一秒和第六秒都有人来打请求，那么两个请求都能通过频控锁，而第一秒的请求没结束，所以第六秒的请求会消耗执行锁的判断（一共是四次判断）</li> <li>如果执行先于频控，上述事件就会少一次判断（三次判断），那另一种情况下，第一秒和第四秒都有请求打进来，并且已经执行完，那么也会有四次判断，但这里由于频率过高会被第四次判断拦截，这正是我想要的结果</li></ul> <p>就是说，我一定要先判断有没有进入的权限，再判断是否达标，否则我没有必要判断是否达标，懂我意思吗</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/04/23, 20:46:17</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/e9c57b/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">PPT 生成详解</div></a> <a href="/pages/d6f021/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">分布式与微服务基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
