LOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">网关与代理<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="无-ip-容器访问"><a href="#无-ip-容器访问" class="header-anchor">#</a> 无 IP 容器访问</h2> <p>静态 IP 资源有限，AI 容器太多了，分配不过来，所以只能开辟无 IP 容器，但用户仍有 ssh 直连 AI 容器调试的需求，必须要新增一层转发控制，支持无 IP 容器的连接，这包括</p> <ul><li>HTTP 流量的请求转发</li> <li>WS 形式的 Web Terminal 流量的转发</li> <li>SSH 直连容器的需求</li></ul> <p>以 ssh 为例，在有 IP 的情况下，直接可以通过 ip 和私钥进行 ssh 直连，但现在分配不了 ip 了，所以只能用一个泛域名返回给用户，后台做一层映射转发，实现这样的需求</p> <h3 id="apisix-流量转发"><a href="#apisix-流量转发" class="header-anchor">#</a> APISIX 流量转发</h3> <p>WS / HTTP 流量的转发，核心思路</p> <ol><li>业务侧在更新域名 / IP 的时候，把鉴权 Token 和映射关系存到 redis，以供网关进行鉴权和代理转发</li> <li>用 udns 映射源域名到 apisix 网关，网关根据 envId 查 redis 找到 pod ip，再通过 apisix 插件 access 拦截将请求转发到 pod ip</li></ol> <p>流量的拦截和转发基于 APISIX（一个 Lua 网关服务），基于 OpenResty（Nginx + LuaJIT）实现，用 Etcd 存放本地数据</p> <ul><li><a href="https://apisix.apache.org/zh/blog/2025/04/08/introducing-apisix-ai-gateway/" target="_blank" rel="nofollow noopener noreferrer">APISIX AI 网关介绍 | Apache APISIX<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://apisix.apache.org/zh/blog/2025/05/07/apisix-gateway-practice-in-tencent-timi/" target="_blank" rel="nofollow noopener noreferrer">游戏业务出海：TAPISIX 稳定运营实践 | Apache APISIX<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>apisix 插件 plugins 通过导出 _M 并提供 <code>_M.access、_M.rewrite、_M.check_schema</code> 等钩子函数，在请求的生命周期不同阶段被挂载调用，实现流量的前置（如鉴权）后置（如转发）处理，例如</p> <ul><li>APISIX 在加载 / 更新插件配置时会调用 check_schema(conf)，确保用户传的 conf 合法</li> <li>access 是 APISIX 请求生命周期的&quot;访问控制&quot;阶段；返回数字 = HTTP 状态码并中断请求；返回 nil 表示放行</li></ul> <p>这里 ws 和 http 流量的转发就是通过插件的形式实现，通过调用 access 实现鉴权和转发</p> <p>最终，这里的插件通过 Dockerfile 构建并注入现有的 apisix 服务</p> <ol><li>定义 Dockerfile 将插件 copy 丢到现成的 APISIX 的 plugins 目录下</li> <li>配置 APISIX 的 config.yaml 插件白名单</li> <li>在运行阶段，如果路由命中了对应插件，APISIX 就会自动读入每个插件 _M 的函数，并按照 priority 大小顺序执行</li></ol> <p>Dockerfile 示例</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> mirrors.tencent.com/tapisix/tapisix:3.3.1-alpha</span>
<span class="token instruction"><span class="token keyword">COPY</span> plugins/* /usr/local/tapisix/apisix/plugins/</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="ssh-代理直连"><a href="#ssh-代理直连" class="header-anchor">#</a> SSH 代理直连</h3> <p>ssh 直连</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ssh</span> root@saulxiong-any2.dev.cloud.woa.com <span class="token parameter variable">-p</span> <span class="token number">36000</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>VPC 和 ENI</p> <ul><li>VPC 即 Virtual Private Cloud 虚拟私有云/专有网络，我们所有机器的 ip 都在一个大的 VPC 下，故而所有 ip 均保持唯一性，但是唯一性不等于可达性，这个一定要注意，不是说一个 ip 地址在网络中唯一了，我就可以无脑 ping 通了，这里存在很多我还没弄清网络限制，可能是出于对 k8s 集群安全考虑的权限认证</li> <li>ENI 即 Elastic Network Interface 弹性网卡接口，网络中可以使用 ENI 为容器分配独立 ENI IP，这个 IP 一经分配，是可以在 ENI 环境中进行直连的，属于稀缺资源</li></ul> <p>通过 DNAT + IPTable 实现泛域名到 Pod 的反向代理</p> <ul><li>UDNS（UCloud Domain Name System），域名解析服务系统，根据泛域名中某一字段，将泛域名重定向到具体域名，例如</li> <li>CLB（Classic Load Balancer），负载均衡器</li> <li>DNAT（Destination Network Address Translation），目的网络地址转换，是 Linux 系统软件的工作，将一个端口的 TCP 流量指定转发到另一 IP，通过 add 规则指定</li> <li>IP Table（IP 映射表），提供端口到 pod ip 的映射，例如 CMS_IP: 56001 映射 k8s 中的 80.133.22.231:22，一个端口映射一个 ip</li></ul> <p><strong>codev-web-server/services/web_service.go: EnableSsh</strong></p> <p>有一个现成的分配 SSH 的接口 <code>EnableSsh @alias=/env/enableSsh</code>，这个接口将返回用户可以 ssh 直连的 uri，例如</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code>response<span class="token operator">:</span> <span class="token punctuation">{</span>
  code<span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>
  data<span class="token operator">:</span> <span class="token punctuation">{</span>
    VSCode<span class="token operator">:</span> <span class="token string">&quot;vscode://vscode-remote/ssh-remote+root@jaceyuan-any2.devcloud.woa.com:36000/data/workspace/FeedbackAnalyzer/?windowId=_blank&quot;</span><span class="token punctuation">,</span> PhpStorm<span class="token operator">:</span> <span class="token string">&quot;jetbr&gt;-ains-gateway://connect#idePath=/codev/ide/PS/PhpStorm-2024.1.2&amp;projectPath=/data/workspace/FeedbackAnalyzer/&amp;host=jaceyuan-any2.devcloud.woa.com&amp;user=root&amp;port=36000&amp;type=ssh&amp;deploy=false&quot;</span><span class="token punctuation">,</span>
    CodeBuddyCN<span class="token operator">:</span> <span class="token string">&quot;codebuddyc://vscode-remote/codebuddy-remote-ssh+root@jaceyuan-any2.devcloud.woa.com:36000/data/workspace/FeedbackAnalyzer/?windowId=_blank&quot;</span><span class="token punctuation">,</span>
    <span class="token comment">//...</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>可以注意到这里的 url 包含了 ssh 地址、用户名、端口等等信息，我们的最终工作就是</p> <ul><li>针对无 IP 的容器，返回特定额外逻辑的域名 + 端口</li></ul> <p>具体而言，要在控制面实现域名到 K8s 内网 ip 的映射，有这样几个关键点</p> <ol><li>找到 serverType 为 CPU 环境且禁用 eniIp 的分支</li> <li>采用 DNAT，映射到实体是 CVM 端口到 pod ip，这里的端口 Port 由全局的 Redis 游标维护（40000 ~ 50000）</li> <li>CVM 的 IP 是可配置的，从七彩石里读取，这是一个 IP 列表，每次要全量下发</li> <li>远程命令执行，每次映射，要下发命令 <code>bash /data/home/yingqichen/nft/nft-ctl.sh add %d %s %d</code> 到全量的 CVM 上，添加 DNAT 规则</li> <li>DB 读写，主要就是规则的写入和读取，还有 Redis 的存取</li> <li>UriScheme 拼接，Scheme 写在配置文件中，在业务中通过实际的域名和 IP 替换 Scheme 中的占位符完成拼接</li></ol> <p>SSH 代理路线：用户 → 泛域名 → UDNS → CLB（Classic Load Balancer 负载均衡） → CVM（DNAT） → Pod</p> <h2 id="web-流量鉴权和转发"><a href="#web-流量鉴权和转发" class="header-anchor">#</a> Web 流量鉴权和转发</h2> <h3 id="控制面缓存代理规则"><a href="#控制面缓存代理规则" class="header-anchor">#</a> 控制面缓存代理规则</h3> <p>EnvInstanceController 基于 Redis 缓存 proxy 信息：<strong>business/env_instance.go: CacheProxyInformation</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// CacheProxyInformation 缓存proxy需要的信息（环境id对应用户名、环境id对应ip）</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">CacheProxyInformation</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
    envIns <span class="token operator">*</span>table<span class="token punctuation">.</span>DevEnvironmentInstance<span class="token punctuation">,</span> envTask <span class="token operator">*</span>table<span class="token punctuation">.</span>EnvironmentTask<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    envId <span class="token operator">:=</span> strings<span class="token punctuation">.</span><span class="token function">ToLower</span><span class="token punctuation">(</span>envIns<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
    IpKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxy<span class="token punctuation">.</span>IpKey<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
    UsernameKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxy<span class="token punctuation">.</span>UsernameKey<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
    TokenKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxy<span class="token punctuation">.</span>TokenKey<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>

    <span class="token keyword">if</span> envTask<span class="token punctuation">.</span>Action <span class="token operator">==</span> EnvActionDelete <span class="token punctuation">{</span>
        <span class="token boolean">_</span><span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;del&quot;</span><span class="token punctuation">,</span> IpKey<span class="token punctuation">)</span>
        <span class="token boolean">_</span><span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;del&quot;</span><span class="token punctuation">,</span> UsernameKey<span class="token punctuation">)</span>
        <span class="token boolean">_</span><span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;del&quot;</span><span class="token punctuation">,</span> TokenKey<span class="token punctuation">)</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
        <span class="token boolean">_</span><span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;set&quot;</span><span class="token punctuation">,</span> IpKey<span class="token punctuation">,</span> envIns<span class="token punctuation">.</span>EnvironmentIP<span class="token punctuation">)</span>
        <span class="token boolean">_</span><span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;set&quot;</span><span class="token punctuation">,</span> UsernameKey<span class="token punctuation">,</span> envIns<span class="token punctuation">.</span>Username<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br></div></div><h3 id="staff-name-请求头重写"><a href="#staff-name-请求头重写" class="header-anchor">#</a> staff name 请求头重写</h3> <blockquote><p>_M.rewrite</p></blockquote> <p><strong>codev-staff.lua</strong>：从用户请求中提取用户名并设置 staff_name</p> <div class="language-lua line-numbers-mode"><pre class="language-lua"><code><span class="token comment">-- 云研发 app + token + uri 鉴权</span>
<span class="token keyword">local</span> ngx                <span class="token operator">=</span> ngx
<span class="token keyword">local</span> core               <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;apisix.core&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> plugin_name        <span class="token operator">=</span> <span class="token string">&quot;codev-staff&quot;</span>
<span class="token keyword">local</span> staff_header_key   <span class="token operator">=</span> <span class="token string">&quot;STAFFNAME&quot;</span>
<span class="token keyword">local</span> x_staff_header_key <span class="token operator">=</span> <span class="token string">&quot;X-STAFFNAME&quot;</span>
<span class="token keyword">local</span> x_oauth_header_key <span class="token operator">=</span> <span class="token string">&quot;X-Userinfo&quot;</span>


<span class="token keyword">local</span> schema <span class="token operator">=</span> <span class="token punctuation">{</span> 
<span class="token punctuation">}</span>


<span class="token keyword">local</span> _M <span class="token operator">=</span> <span class="token punctuation">{</span>
    version <span class="token operator">=</span> <span class="token number">1.0</span><span class="token punctuation">,</span>
    priority <span class="token operator">=</span> <span class="token number">600</span><span class="token punctuation">,</span>
    name <span class="token operator">=</span> plugin_name<span class="token punctuation">,</span>
    schema <span class="token operator">=</span> schema<span class="token punctuation">,</span>
<span class="token punctuation">}</span>


<span class="token comment">-- oauth认证从请求头提取用户名</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">get_staff_name</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">local</span> user_value <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_oauth_header_key<span class="token punctuation">)</span>
    <span class="token keyword">if</span> user_value <span class="token keyword">then</span>
        <span class="token keyword">local</span> user_info <span class="token operator">=</span> ngx<span class="token punctuation">.</span><span class="token function">decode_base64</span><span class="token punctuation">(</span>user_value<span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> user_info <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Failed to decode base64 string: &quot;</span><span class="token punctuation">,</span> user_value<span class="token punctuation">)</span>
            <span class="token keyword">return</span> 
        <span class="token keyword">end</span>
        
        <span class="token keyword">local</span> user_obj<span class="token punctuation">,</span> err <span class="token operator">=</span> core<span class="token punctuation">.</span>json<span class="token punctuation">.</span><span class="token function">decode</span><span class="token punctuation">(</span>user_info<span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> user_obj <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Failed to decode JSON string: &quot;</span><span class="token punctuation">,</span> user_info<span class="token punctuation">,</span> <span class="token string">&quot; error: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
            <span class="token keyword">return</span>
        <span class="token keyword">end</span>
        <span class="token keyword">local</span> username <span class="token operator">=</span> user_obj<span class="token punctuation">[</span><span class="token string">&quot;user_name&quot;</span><span class="token punctuation">]</span>
        <span class="token keyword">if</span>  username <span class="token keyword">then</span>
            <span class="token keyword">return</span> username
        <span class="token keyword">else</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;not found username&quot;</span><span class="token punctuation">)</span>
        <span class="token keyword">end</span>
    <span class="token keyword">end</span>
<span class="token keyword">end</span>


<span class="token keyword">function</span> _M<span class="token punctuation">.</span><span class="token function">rewrite</span><span class="token punctuation">(</span>plugin_conf<span class="token punctuation">,</span> ctx<span class="token punctuation">)</span>
    <span class="token comment">-- staffname x-staffname 获取staffname</span>
    <span class="token keyword">local</span> staff_name <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">)</span> 
    <span class="token keyword">if</span> <span class="token keyword">not</span> staff_name <span class="token keyword">then</span>
        staff_name <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">)</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 如果都没有从header提取</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> staff_name <span class="token keyword">then</span>
        staff_name <span class="token operator">=</span> <span class="token function">get_staff_name</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 设置请求头</span>

        <span class="token keyword">if</span> <span class="token keyword">not</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">)</span> <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">set_header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">,</span> staff_name<span class="token punctuation">)</span>
        <span class="token keyword">end</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">)</span> <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">set_header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">,</span> staff_name<span class="token punctuation">)</span>
        <span class="token keyword">end</span>
    <span class="token keyword">end</span>
<span class="token keyword">end</span>

<span class="token keyword">return</span> _M
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br></div></div><h3 id="proxy-反向代理"><a href="#proxy-反向代理" class="header-anchor">#</a> proxy 反向代理</h3> <p>http 的代理，通过 access 转发 http 流量，和鉴权的逻辑类似，根据用户请求中的 envId 从 redis 里拿对应映射的 pod ip 地址，然后重定向把流量转发到指定 ip + port，实现代理</p> <p><strong>codev-ai-http-proxy.lua</strong></p> <div class="language-lua line-numbers-mode"><pre class="language-lua"><code><span class="token comment">-- anydev-ai-http-proxy.lua</span>
<span class="token comment">-- APISIX 插件：根据 *.connect.anydev.woa.com 域名前缀从 Redis 查 Pod IP，根据 URL 端口转发</span>

<span class="token keyword">local</span> ngx <span class="token operator">=</span> ngx
<span class="token keyword">local</span> core <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;apisix.core&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> upstream <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;apisix.upstream&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> redis_new <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;resty.redis&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> table_insert <span class="token operator">=</span> table<span class="token punctuation">.</span>insert

<span class="token keyword">local</span> plugin_name <span class="token operator">=</span> <span class="token string">&quot;anydev-ai-http-proxy&quot;</span>
<span class="token keyword">local</span> codev_pod_ip_prefix <span class="token operator">=</span> <span class="token string">&quot;anydev-proxy:ip:&quot;</span>

<span class="token keyword">local</span> schema <span class="token operator">=</span> <span class="token punctuation">{</span>
    type <span class="token operator">=</span> <span class="token string">&quot;object&quot;</span><span class="token punctuation">,</span>
    properties <span class="token operator">=</span> <span class="token punctuation">{</span>
        redis_host <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">,</span> minLength <span class="token operator">=</span> <span class="token number">2</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_port <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;integer&quot;</span><span class="token punctuation">,</span> minimum <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span> default <span class="token operator">=</span> <span class="token number">6379</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_username <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">,</span> minLength <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_password <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">,</span> minLength <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_database <span class="token operator">=</span> <span class="token punctuation">{</span>

        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_timeout <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;integer&quot;</span><span class="token punctuation">,</span> minimum <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span> default <span class="token operator">=</span> <span class="token number">1000</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        domain_suffix <span class="token operator">=</span> <span class="token punctuation">{</span>

            description <span class="token operator">=</span> <span class="token string">&quot;Domain suffix for extracting pod id, e.g. connect-test.devcloud.woa.com or connect.devcloud.woa.com&quot;</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>

<span class="token keyword">local</span> _M <span class="token operator">=</span> <span class="token punctuation">{</span>

<span class="token comment">-- 将域名后缀转为 Lua 匹配模式（转义 . 为 %.）</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">build_domain_pattern</span><span class="token punctuation">(</span>suffix<span class="token punctuation">)</span>
    <span class="token keyword">local</span> escaped <span class="token operator">=</span> suffix<span class="token punctuation">:</span><span class="token function">gsub</span><span class="token punctuation">(</span><span class="token string">&quot;%.&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;%%.&quot;</span><span class="token punctuation">)</span><span class="token punctuation">:</span><span class="token function">gsub</span><span class="token punctuation">(</span><span class="token string">&quot;%-&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;%%-&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">return</span> <span class="token string">&quot;^(.+)%.&quot;</span> <span class="token operator">..</span> escaped <span class="token operator">..</span> <span class="token string">&quot;$&quot;</span>
<span class="token keyword">end</span>

<span class="token comment">-- 从 Host 中提取 Pod ID: xxx.&lt;domain_suffix&gt; → xxx</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">extract_pod_id</span><span class="token punctuation">(</span>host<span class="token punctuation">,</span> domain_suffix<span class="token punctuation">)</span>
    <span class="token comment">-- 去掉端口</span>
    <span class="token keyword">local</span> h <span class="token operator">=</span> host<span class="token punctuation">:</span><span class="token function">match</span><span class="token punctuation">(</span><span class="token string">&quot;^([^:]+)&quot;</span><span class="token punctuation">)</span> <span class="token keyword">or</span> host
    <span class="token keyword">local</span> pattern <span class="token operator">=</span> <span class="token function">build_domain_pattern</span><span class="token punctuation">(</span>domain_suffix<span class="token punctuation">)</span>
    <span class="token keyword">local</span> pod_id <span class="token operator">=</span> h<span class="token punctuation">:</span><span class="token function">lower</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">:</span><span class="token function">match</span><span class="token punctuation">(</span>pattern<span class="token punctuation">)</span>
    <span class="token keyword">return</span> pod_id
<span class="token keyword">end</span>

<span class="token comment">-- 从 URI 中提取端口和实际路径: /8080/api/xxx → 8080, /api/xxx</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">extract_port_and_path</span><span class="token punctuation">(</span>uri<span class="token punctuation">)</span>
    <span class="token keyword">local</span> port<span class="token punctuation">,</span> path <span class="token operator">=</span> uri<span class="token punctuation">:</span><span class="token function">match</span><span class="token punctuation">(</span><span class="token string">&quot;^/(%d+)(/.*)$&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> port <span class="token keyword">then</span>
        port <span class="token operator">=</span> uri<span class="token punctuation">:</span><span class="token function">match</span><span class="token punctuation">(</span><span class="token string">&quot;^/(%d+)$&quot;</span><span class="token punctuation">)</span>
        path <span class="token operator">=</span> <span class="token string">&quot;/&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">return</span> port<span class="token punctuation">,</span> path
<span class="token keyword">end</span>

<span class="token comment">-- oauth认证从请求头提取用户名</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">get_staff_name</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">local</span> staff_name <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">)</span>

        staff_name <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">)</span>
    <span class="token keyword">end</span>

    <span class="token keyword">if</span> staff_name <span class="token keyword">then</span>
        <span class="token keyword">return</span> staff_name
    <span class="token keyword">end</span>

    <span class="token keyword">local</span> user_value <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_oauth_header_key<span class="token punctuation">)</span>
    <span class="token keyword">if</span> user_value <span class="token keyword">then</span>
        <span class="token keyword">local</span> user_info <span class="token operator">=</span> ngx<span class="token punctuation">.</span><span class="token function">decode_base64</span><span class="token punctuation">(</span>user_value<span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> user_info <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Failed to decode base64 string: &quot;</span><span class="token punctuation">,</span> user_value<span class="token punctuation">)</span>
            <span class="token keyword">return</span> 
        <span class="token keyword">end</span>
        
        <span class="token keyword">local</span> user_obj<span class="token punctuation">,</span> err <span class="token operator">=</span> core<span class="token punctuation">.</span>json<span class="token punctuation">.</span><span class="token function">decode</span><span class="token punctuation">(</span>user_info<span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> user_obj <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Failed to decode JSON string: &quot;</span><span class="token punctuation">,</span> user_info<span class="token punctuation">,</span> <span class="token string">&quot; error: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
            <span class="token keyword">return</span>
        <span class="token keyword">end</span>
        <span class="token keyword">local</span> username <span class="token operator">=</span> user_obj<span class="token punctuation">[</span><span class="token string">&quot;user_name&quot;</span><span class="token punctuation">]</span>
        <span class="token keyword">if</span>  username <span class="token keyword">then</span>
            <span class="token keyword">return</span> username
        <span class="token keyword">else</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;not found username&quot;</span><span class="token punctuation">)</span>
        <span class="token keyword">end</span>
    <span class="token keyword">end</span>
<span class="token keyword">end</span>

<span class="token comment">-- Redis 连接</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">redis_cli</span><span class="token punctuation">(</span>conf<span class="token punctuation">)</span>
    <span class="token keyword">local</span> red <span class="token operator">=</span> redis_new<span class="token punctuation">:</span><span class="token function">new</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">local</span> timeout <span class="token operator">=</span> conf<span class="token punctuation">.</span>redis_timeout <span class="token keyword">or</span> <span class="token number">1000</span>

    red<span class="token punctuation">:</span><span class="token function">set_timeouts</span><span class="token punctuation">(</span>timeout<span class="token punctuation">,</span> timeout<span class="token punctuation">,</span> timeout<span class="token punctuation">)</span>

    <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">connect</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_host<span class="token punctuation">,</span> conf<span class="token punctuation">.</span>redis_port <span class="token keyword">or</span> <span class="token number">6379</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> err
    <span class="token keyword">end</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> <span class="token string">&quot;redis connect err&quot;</span>
    <span class="token keyword">end</span>

    <span class="token keyword">local</span> count
    count<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">get_reused_times</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token number">0</span> <span class="token operator">==</span> count <span class="token keyword">then</span>
        <span class="token keyword">if</span> conf<span class="token punctuation">.</span>redis_password <span class="token keyword">and</span> conf<span class="token punctuation">.</span>redis_password <span class="token operator">~=</span> <span class="token string">''</span> <span class="token keyword">then</span>
            <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err
            <span class="token keyword">if</span> conf<span class="token punctuation">.</span>redis_username <span class="token keyword">then</span>
                ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">auth</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_username<span class="token punctuation">,</span> conf<span class="token punctuation">.</span>redis_password<span class="token punctuation">)</span>
            <span class="token keyword">else</span>
                ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">auth</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_password<span class="token punctuation">)</span>
            <span class="token keyword">end</span>
            <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
                <span class="token keyword">return</span> <span class="token keyword">nil</span><span class="token punctuation">,</span> err
            <span class="token keyword">end</span>
        <span class="token keyword">end</span>

        <span class="token keyword">if</span> conf<span class="token punctuation">.</span>redis_database <span class="token operator">~=</span> <span class="token number">0</span> <span class="token keyword">then</span>
            <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">select</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_database<span class="token punctuation">)</span>
            <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
                <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> <span class="token string">&quot;failed to change redis db, err: &quot;</span> <span class="token operator">..</span> err
            <span class="token keyword">end</span>
        <span class="token keyword">end</span>
    <span class="token keyword">elseif</span> err <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;redis reused_times err: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token keyword">nil</span><span class="token punctuation">,</span> err
    <span class="token keyword">end</span>
    <span class="token keyword">return</span> red<span class="token punctuation">,</span> <span class="token keyword">nil</span>
<span class="token keyword">end</span>

<span class="token comment">-- 查 Redis 单个 key</span>

<span class="token keyword">function</span> _M<span class="token punctuation">.</span><span class="token function">access</span><span class="token punctuation">(</span>conf<span class="token punctuation">,</span> ctx<span class="token punctuation">)</span>
    <span class="token comment">-- 1. 从域名提取 pod_id</span>
    <span class="token keyword">local</span> host <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;Host&quot;</span><span class="token punctuation">)</span> <span class="token keyword">or</span> <span class="token string">&quot;&quot;</span>
    <span class="token keyword">local</span> domain_suffix <span class="token operator">=</span> conf<span class="token punctuation">.</span>domain_suffix <span class="token keyword">or</span> <span class="token string">&quot;yingqichen-ws-test.devcloud.woa.com&quot;</span>

        <span class="token keyword">return</span> <span class="token number">403</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;missing staffname, authentication required&quot;</span> <span class="token punctuation">}</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 3. 从 Redis 查询 pod 对应的 username，校验是否匹配</span>

    <span class="token keyword">end</span>

    <span class="token keyword">if</span> pod_username <span class="token operator">~=</span> staff_name <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;username mismatch, staff_name: &quot;</span><span class="token punctuation">,</span> staff_name<span class="token punctuation">,</span> <span class="token string">&quot; pod_username: &quot;</span><span class="token punctuation">,</span> pod_username<span class="token punctuation">,</span> <span class="token string">&quot; pod_id: &quot;</span><span class="token punctuation">,</span> pod_id<span class="token punctuation">)</span>

mber">152</span><br><span class="line-number">153</span><br><span class="line-number">154</span><br><span class="line-number">155</span><br><span class="line-number">156</span><br><span class="line-number">157</span><br><span class="line-number">158</span><br><span class="line-number">159</span><br><span class="line-number">160</span><br><span class="line-number">161</span><br><span class="line-number">162</span><br><span class="line-number">163</span><br><span class="line-number">164</span><br><span class="line-number">165</span><br><span class="line-number">166</span><br><span class="line-number">167</span><br><span class="line-number">168</span><br><span class="line-number">169</span><br><span class="line-number">170</span><br><span class="line-number">171</span><br><span class="line-number">172</span><br><span class="line-number">173</span><br><span class="line-number">174</span><br><span class="line-number">175</span><br><span class="line-number">176</span><br><span class="line-number">177</span><br><span class="line-number">178</span><br><span class="line-number">179</span><br><span class="line-number">180</span><br><span class="line-number">181</span><br><span class="line-number">182</span><br><span class="line-number">183</span><br><span class="line-number">184</span><br><span class="line-number">185</span><br><span class="line-number">186</span><br><span class="line-number">187</span><br><span class="line-number">188</span><br><span class="line-number">189</span><br><span class="line-number">190</span><br><span class="line-number">191</span><br><span class="line-number">192</span><br><span class="line-number">193</span><br><span class="line-number">194</span><br><span class="line-number">195</span><br><span class="line-number">196</span><br><span class="line-number">197</span><br><span class="line-number">198</span><br><span class="line-number">199</span><br><span class="line-number">200</span><br><span class="line-number">201</span><br><span class="line-number">202</span><br><span class="line-number">203</span><br><span class="line-number">204</span><br><span class="line-number">205</span><br><span class="line-number">206</span><br><span class="line-number">207</span><br><span class="line-number">208</span><br><span class="line-number">209</span><br><span class="line-number">210</span><br><span class="line-number">211</span><br><span class="line-number">212</span><br><span class="line-number">213</span><br><span class="line-number">214</span><br><span class="line-number">215</span><br><span class="line-number">216</span><br><span class="line-number">217</span><br><span class="line-number">218</span><br><span class="line-number">219</span><br><span class="line-number">220</span><br><span class="line-number">221</span><br><span class="line-number">222</span><br><span class="line-number">223</span><br><span class="line-number">224</span><br><span class="line-number">225</span><br><span class="line-number">226</span><br><span class="line-number">227</span><br><span class="line-number">228</span><br><span class="line-number">229</span><br><span class="line-number">230</span><br></div></div><h2 id="无-ip-ssh-直连"><a href="#无-ip-ssh-直连" class="header-anchor">#</a> 无 IP SSH 直连</h2> <p>基于 AIPSIX 网关的 TCP 流量转发无法通过插件的形式实现 ，只能定义规则限定指定端口到 IP 的定向传输，通过 Admin API 来一条条定义，实现一个端口对应一个 pod ip 的 tcp 流量转发，实现一个端口映射一个 IP 的需求，但似乎是性能难以保证，apisix 的负载太重，所以这里敲定的是 DNAT + IPTable 的技术方案</p> <h3 id="编码规范"><a href="#编码规范" class="header-anchor">#</a> 编码规范</h3> <blockquote><p>你以后字段命名要注意一点，我是指沟通上，现在都是我看返回，才知道你是怎么命名的，像是这里，我截图里面命名了 sshProxyDomain，你又自己搞个 sshDomain，把 proxy 去掉了，一个字段，怎么命名，有什么改动，要告知前端</p> <p>你这里后台拼好啊，还要前端来拼啊？你返回个占位符给前端</p> <p>Go 的导出函数，必须要写注释，而且注释要以函数名开头</p></blockquote> <p>在 config.go 中新建字段并通过 <code>yaml:&quot;proxyCommand&quot;</code> 匹配赋值 cfg 中的固定参数（在生产环境中这些配置从七彩石拉下来）</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">sshProxyConfig</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">id</span><span class="token punctuation">:</span> ssh<span class="token punctuation">-</span>proxy1
    <span class="token key atrule">domain</span><span class="token punctuation">:</span> <span class="token string">'%s.ssh-proxy.devcloud.woa.com'</span>        <span class="token comment"># 访问proxy所用的泛域名, %s为环境id占位符</span>
    <span class="token key atrule">instanceIds</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">'ins-9bohmdl0'</span><span class="token punctuation">]</span>                  <span class="token comment"># proxy的节点</span>
    <span class="token key atrule">region</span><span class="token punctuation">:</span> <span class="token string">'ap-guangzhou'</span>                         <span class="token comment"># 节点的地域</span>
    <span class="token key atrule">maxPort</span><span class="token punctuation">:</span> <span class="token number">50000</span>                                 <span class="token comment"># 最大端口号</span>
    <span class="token key atrule">minPort</span><span class="token punctuation">:</span> <span class="token number">40000</span>                                 <span class="token comment"># 最小端口号</span>
    <span class="token key atrule">unschedulable</span><span class="token punctuation">:</span> <span class="token boolean important">false</span>                          <span class="token comment"># 是否不可调度，如果该字段为true，不往该proxy新增规则</span>
    <span class="token key atrule">proxyCommand</span><span class="token punctuation">:</span> <span class="token string">'bash /data/home/nft/nft-ctl.sh add %d %s %d'</span>  <span class="token comment"># 下发新增规则的命令，占位符依次为端口号，目标ip，目标端口</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>拼接 urischeme 时，这里 domain 的占位符 <code>%s</code> 要用实际的 envId 填充，一定要在后台替换掉这个 %s，替换为真实的环境 id</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 拼接 envId + 泛域名的 domain，替换占位符</span>
domain <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>sshConfig<span class="token punctuation">.</span>Domain<span class="token punctuation">,</span> environmentInstance<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>sshProxyDomain 和 sshProxyPort 的优先级很高，在 eniDisable 的情况，需要替换掉 scheme 里原有的 url 和 port 进行拼接</p> <p>先在 <strong>DevEnvironmentInstance</strong> 里加两个额外参数，代理 domain 和代理端口，因为拼接参数的时候只接收一个 <code>envIns *table.DevEnvironmentInstance</code></p> <p><strong>models/table/devEnvironmentInstance.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// DevEnvironmentInstance 开发环境实例表</span>
<span class="token keyword">type</span> DevEnvironmentInstance <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    <span class="token comment">// gorm 字段</span>
    <span class="token comment">// ...</span>
    <span class="token comment">// 存储环境对应的task，逻辑字段,不映射表字段存储</span>
    EnvironmentTask       <span class="token operator">*</span>EnvironmentTask <span class="token string">`gorm:&quot;-&quot;`</span>
    OriginalEnvironmentIP <span class="token builtin">string</span>           <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 原始环境IP</span>
    AutoDowngrade         <span class="token builtin">bool</span>             <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 是否自动降级，当前仅H20场景用到</span>
    <span class="token comment">// ssh 代理相关，逻辑字段,不映射表字段存储</span>
    SshProxyDomain <span class="token builtin">string</span> <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 对无 IP 容器进行 ssh 直连的代理泛域名</span>
    SshProxyPort   <span class="token builtin">int</span>    <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 对无 IP 容器 ssh 代理的 dnat 中转端口</span>
<span class="token punctuation">}</span>
