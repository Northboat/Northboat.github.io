    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>GORM 写 SQL</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 插入一条 sshProxyRule</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">createSshProxyRule</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> row <span class="token operator">*</span>table<span class="token punctuation">.</span>SshProxyRule<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Create</span><span class="token punctuation">(</span>row<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;写入 sshProxyRule 失败, uid=%s, err=%v&quot;</span><span class="token punctuation">,</span> row<span class="token punctuation">.</span>Uid<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>根据 environmentId 和 status 查规则</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 查表，根据 environmentIp 查询 sshProxyRule（原则上只有一条），未找到时返回 (nil, nil)</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">getSshProxyRuleByEnvIP</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> environmentIP <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>SshProxyRule<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    rule <span class="token operator">:=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>SshProxyRule<span class="token punctuation">{</span><span class="token punctuation">}</span>
    err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
        <span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;environmentIp = ? AND status = ?&quot;</span><span class="token punctuation">,</span> environmentIP<span class="token punctuation">,</span> table<span class="token punctuation">.</span>SshProxyRuleStatusActive<span class="token punctuation">)</span><span class="token punctuation">.</span>
        <span class="token function">First</span><span class="token punctuation">(</span>rule<span class="token punctuation">)</span><span class="token punctuation">.</span>Error
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> err <span class="token operator">==</span> gorm<span class="token punctuation">.</span>ErrRecordNotFound <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
        <span class="token punctuation">}</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询 sshProxyRule 失败, environmentIp=%s, err=%v&quot;</span><span class="token punctuation">,</span> environmentIP<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> rule<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><h3 id="redis-port-incr"><a href="#redis-port-incr" class="header-anchor">#</a> Redis Port INCR</h3> <blockquote><p>port 怎么拿？直接 Redis 字段 INCR</p></blockquote> <p>Redis INCR 实现每个集群 dnat 监听 port 的原子递增，虽然 incr 是原子的，但整个新增规则的流程并非原子，如果后续失败了，这个 incr 的 port 就被浪费了</p> <p>上锁使用现成的 redislock，这个方法返回一个 unlock 函数，用于 defer 执行，很有意思的设计</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 加锁</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">GetAvailablePort</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> sshConfig <span class="token operator">*</span>SshProxyItem<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// ...</span>
    lockKey <span class="token operator">:=</span> SshProxyPortLockPrefix <span class="token operator">+</span> id

    <span class="token comment">// 拿带重试的分布式锁，避免并发 INCR 之间穿插初始化逻辑</span>
    unlock <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">acquirePortLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> lockKey<span class="token punctuation">)</span>
    <span class="token keyword">if</span> unlock <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;acquire ssh proxy port lock timeout, cluster=%s&quot;</span><span class="token punctuation">,</span> id<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">defer</span> <span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token comment">// ...</span>
<span class="token punctuation">}</span>

<span class="token comment">// RedisLock ...</span>
<span class="token keyword">func</span> <span class="token function">RedisLock</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> client redis<span class="token punctuation">.</span>Client<span class="token punctuation">,</span> key <span class="token builtin">string</span><span class="token punctuation">,</span> timeout <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ret<span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;SET&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;NX&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;EX&quot;</span><span class="token punctuation">,</span> timeout<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;lock failed:&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> ret <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token comment">// lock failed</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token comment">// lock ok</span>
    unlock <span class="token operator">:=</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;del&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;unlock failed:&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> unlock
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br></div></div><p>不过最后还是没有对分配 port 过程上锁，虽然会造成 port 递增过程中后续执行失败将废用 port，但容忍这种浪费，直接 incr</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// Redis 操作</span>
<span class="token comment">// 构造可用的 port，依赖 redis INCR 的原子性，SETNX 把计数器初始化为 minPort-1，INCR 拿到下一个 port</span>
<span class="token comment">// 每个 clusterId 一个独立计数器，互不影响</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">getAvailablePort</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> sshConfig <span class="token operator">*</span>config<span class="token punctuation">.</span>SshProxyItem<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

    id <span class="token operator">:=</span> sshConfig<span class="token punctuation">.</span>Id
    minPort <span class="token operator">:=</span> sshConfig<span class="token punctuation">.</span>MinPort
    maxPort <span class="token operator">:=</span> sshConfig<span class="token punctuation">.</span>MaxPort

    counterKey <span class="token operator">:=</span> SshProxyPortKeyPrefix <span class="token operator">+</span> id

    <span class="token comment">// 若 Key 不存在，SETNX 初始化计数器为 minPort-1，仅在 key 不存在时生效。原子操作，不需要额外锁</span>
    <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;SET&quot;</span><span class="token punctuation">,</span> counterKey<span class="token punctuation">,</span> minPort<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;NX&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;初始化 redis port 计数器失败, key=%s, err=%v&quot;</span><span class="token punctuation">,</span> counterKey<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>

    <span class="token comment">// 原地 INCR 拿到下一个 port</span>
    ret<span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;INCR&quot;</span><span class="token punctuation">,</span> counterKey<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;INCR redis port 计数器失败, key=%s, err=%v&quot;</span><span class="token punctuation">,</span> counterKey<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    nextPort64<span class="token punctuation">,</span> ok <span class="token operator">:=</span> ret<span class="token punctuation">.</span><span class="token punctuation">(</span><span class="token builtin">int64</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;INCR 返回值类型异常, key=%s, ret=%T&quot;</span><span class="token punctuation">,</span> counterKey<span class="token punctuation">,</span> ret<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;INCR 返回值类型异常&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    nextPort <span class="token operator">:=</span> <span class="token function">int</span><span class="token punctuation">(</span>nextPort64<span class="token punctuation">)</span>

    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Infof</span><span class="token punctuation">(</span><span class="token string">&quot;获取可用 SSH Proxy 端口, key=%s, port=%d&quot;</span><span class="token punctuation">,</span> counterKey<span class="token punctuation">,</span> nextPort<span class="token punctuation">)</span>

    <span class="token keyword">if</span> nextPort <span class="token operator">&gt;</span> maxPort <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;ssh proxy cluster %s 端口已耗尽, port=%d, maxPort=%d&quot;</span><span class="token punctuation">,</span> id<span class="token punctuation">,</span> nextPort<span class="token punctuation">,</span> maxPort<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;ssh proxy cluster %s 端口已耗尽 (&gt;%d)&quot;</span><span class="token punctuation">,</span> id<span class="token punctuation">,</span> maxPort<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> nextPort <span class="token operator">&lt;</span> minPort <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;ssh proxy cluster %s 端口计数器异常, port=%d, minPort=%d&quot;</span><span class="token punctuation">,</span> id<span class="token punctuation">,</span> nextPort<span class="token punctuation">,</span> minPort<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;ssh proxy cluster %s 端口计数器异常 (%d &lt; %d)&quot;</span><span class="token punctuation">,</span> id<span class="token punctuation">,</span> nextPort<span class="token punctuation">,</span> minPort<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> nextPort<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br></div></div><h3 id="tat-命令下发"><a href="#tat-命令下发" class="header-anchor">#</a> TAT 命令下发</h3> <p>将写 dnat 规则的脚本执行在目标 CVM 机器上：<code>bash /data/home/yingqichen/nft/nft-ctl.sh add %d %s %d</code></p> <blockquote><p>下发不需要重试，只下发一次，然后查询命令下发状态，限定 3 秒的 timeout，每 100 ms 重试查询，只有查到所有节点任务都 success 才返回 success</p></blockquote> <p>tat 的命令下发接口，实际上是一个远程命令执行的后门程序 TAT...</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// RunUserCommand 运行用户命令</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>TatController<span class="token punctuation">)</span> <span class="token function">RunUserCommand</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> region <span class="token builtin">string</span><span class="token punctuation">,</span> params RunUserCommandParams<span class="token punctuation">)</span> <span class="token punctuation">(</span>invocationId <span class="token builtin">string</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">//...</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>下发 dnat 规则<code>bash /data/home/yingqichen/nft/nft-ctl.sh add %d %s %d</code>到指定 cvm，其中</p> <ul><li>listenPort 是 redis incr 分配的可用端口，对应第一个 <code>%d</code></li> <li>deliverIp 是流量转发的目标 ip，即内网的 pod ip，对应 <code>%s</code></li> <li>第二个 <code>%d</code> 是直连 cvm 的端口号</li> <li>sshConfig 包含了 cvm 的明细信息，如 region、instanceIds、command 等</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// tat 命令下发</span>
<span class="token comment">// DeliverSshProxyRule 通过 TAT 下发 dnat 规则到一组 proxy 节点</span>
<span class="token comment">// proxyCommand 使用 printf 占位，依次为：listenPort(中转监听端口) / deliverIp(目标IP) / 36000(目标SSH端口)</span>
<span class="token comment">// 如：bash /data/.../nft-ctl.sh add %d %s %d  -&gt;  bash /data/.../nft-ctl.sh add 40123 10.x.x.x 36000</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">deliverSshProxyRule</span><span class="token punctuation">(</span>
    ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
    listenPort <span class="token builtin">int</span><span class="token punctuation">,</span>
    deliverIp <span class="token builtin">string</span><span class="token punctuation">,</span>
    sshConfig <span class="token operator">*</span>config<span class="token punctuation">.</span>SshProxyItem<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

    instanceIds <span class="token operator">:=</span> sshConfig<span class="token punctuation">.</span>InstanceIds
    proxyCommand <span class="token operator">:=</span> sshConfig<span class="token punctuation">.</span>ProxyCommand
    region <span class="token operator">:=</span> sshConfig<span class="token punctuation">.</span>Region

    <span class="token comment">// 按 printf 占位符拼接下发命令</span>
    cmd <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxyCommand<span class="token punctuation">,</span> listenPort<span class="token punctuation">,</span> deliverIp<span class="token punctuation">,</span> sshBackendPort<span class="token punctuation">)</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Infof</span><span class="token punctuation">(</span><span class="token string">&quot;下发 SSH Proxy 规则, region=%s, instanceIds=%v, cmd=%s&quot;</span><span class="token punctuation">,</span> region<span class="token punctuation">,</span> instanceIds<span class="token punctuation">,</span> cmd<span class="token punctuation">)</span>

    params <span class="token operator">:=</span> tencentcloud<span class="token punctuation">.</span>RunUserCommandParams<span class="token punctuation">{</span>
        CommandName<span class="token punctuation">:</span> SshProxyCommandName<span class="token punctuation">,</span>
        Description<span class="token punctuation">:</span> <span class="token string">&quot;分发 SSH Proxy Dnat 到 CVM 节点&quot;</span><span class="token punctuation">,</span>
        Content<span class="token punctuation">:</span>     base64<span class="token punctuation">.</span>StdEncoding<span class="token punctuation">.</span><span class="token function">EncodeToString</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>cmd<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
        InstanceIds<span class="token punctuation">:</span> instanceIds<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Infof</span><span class="token punctuation">(</span><span class="token string">&quot;tat 下发 params: &quot;</span><span class="token punctuation">,</span> params<span class="token punctuation">)</span>
    invocationId<span class="token punctuation">,</span> err <span class="token operator">:=</span> tencentcloud<span class="token punctuation">.</span>DefaultTatController<span class="token punctuation">.</span><span class="token function">RunUserCommand</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> region<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;tat 下发 dnat 规则失败, region=%s, err=%v&quot;</span><span class="token punctuation">,</span> region<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> invocationId<span class="token punctuation">,</span> <span class="token boolean">nil</span>
    <span class="token comment">// [DEBUG] 临时 mock，跳过真实 TAT 下发</span>
    <span class="token comment">// ctx.Logger().Warn(&quot;[DEBUG] 跳过真实 TAT 下发, mock invocationId, cmd=&quot;, cmd)</span>
    <span class="token comment">// return fmt.Sprintf(&quot;inv-mock-%d&quot;, listenPort), nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br></div></div><p>查询命令下发状态，因为这里是全量下发，对集群中配置的所有 cvm 节点全量下发，所以查状态的时候，要对所有 instanceId 进行查询，全部成功后才 success</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// CheckAllTasksSuccess 返回 invocationId 的所有节点是否成功（全部成功算成功，否则失败）</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>TatController<span class="token punctuation">)</span> <span class="token function">CheckAllTasksSuccess</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> region<span class="token punctuation">,</span>
    invocationId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

    client<span class="token punctuation">,</span> err <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">newTatClient</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> region<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;new tat client error: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    req <span class="token operator">:=</span> tat<span class="token punctuation">.</span><span class="token function">NewDescribeInvocationsRequest</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    req<span class="token punctuation">.</span>InvocationIds <span class="token operator">=</span> common<span class="token punctuation">.</span><span class="token function">StringPtrs</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span>invocationId<span class="token punctuation">}</span><span class="token punctuation">)</span>
    rsp<span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">DescribeInvocations</span><span class="token punctuation">(</span>req<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;describe invocation error: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> rsp<span class="token punctuation">.</span>Response<span class="token punctuation">.</span>InvocationSet <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">||</span> <span class="token function">len</span><span class="token punctuation">(</span>rsp<span class="token punctuation">.</span>Response<span class="token punctuation">.</span>InvocationSet<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token operator">||</span> <span class="token function">len</span><span class="token punctuation">(</span>rsp<span class="token punctuation">.</span>Response<span class="token punctuation">.</span>InvocationSet<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span>InvocationTaskBasicInfoSet<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;invocation 无任务记录, invocationId=%s&quot;</span><span class="token punctuation">,</span> invocationId<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    tasks <span class="token operator">:=</span> rsp<span class="token punctuation">.</span>Response<span class="token punctuation">.</span>InvocationSet<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span>InvocationTaskBasicInfoSet
    <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> v <span class="token operator">:=</span> <span class="token keyword">range</span> tasks <span class="token punctuation">{</span>
        <span class="token keyword">if</span> v <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">||</span> v<span class="token punctuation">.</span>InstanceId <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">||</span> v<span class="token punctuation">.</span>TaskStatus <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;invocation 任务数据异常, invocationId=%s&quot;</span><span class="token punctuation">,</span> invocationId<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">if</span> <span class="token operator">*</span>v<span class="token punctuation">.</span>TaskStatus <span class="token operator">!=</span> CommandStatusSuccess <span class="token punctuation">{</span>
            ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Infof</span><span class="token punctuation">(</span><span class="token string">&quot;ssh proxy 节点任务未成功, invocationId=%s, instanceId=%s, status=%s&quot;</span><span class="token punctuation">,</span> invocationId<span class="token punctuation">,</span> <span class="token operator">*</span>v<span class="token punctuation">.</span>InstanceId<span class="token punctuation">,</span> <span class="token operator">*</span>v<span class="token punctuation">.</span>TaskStatus<span class="token punctuation">)</span>
            <span class="token keyword">return</span> <span class="token operator">*</span>v<span class="token punctuation">.</span>TaskStatus<span class="token punctuation">,</span> <span class="token boolean">nil</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> CommandStatusSuccess<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br></div></div><p>利用一个 3s 延迟的管道实现间隔 100ms 的重试机制</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">getDeliverSshProxyRuleResult</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> region<span class="token punctuation">,</span> invocationId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    timeoutChan <span class="token operator">:=</span> time<span class="token punctuation">.</span><span class="token function">After</span><span class="token punctuation">(</span><span class="token number">3</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
    <span class="token keyword">for</span> <span class="token punctuation">{</span>
        <span class="token keyword">select</span> <span class="token punctuation">{</span>
        <span class="token keyword">case</span> <span class="token operator">&lt;-</span>timeoutChan<span class="token punctuation">:</span>
            <span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>IllegalError<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;下发 ssh rule 命令超时&quot;</span><span class="token punctuation">)</span>
        <span class="token keyword">default</span><span class="token punctuation">:</span>
            status<span class="token punctuation">,</span> err <span class="token operator">:=</span> tencentcloud<span class="token punctuation">.</span>DefaultTatController<span class="token punctuation">.</span><span class="token function">CheckAllTasksSuccess</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> region<span class="token punctuation">,</span> invocationId<span class="token punctuation">)</span>
            <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                <span class="token keyword">return</span> err
            <span class="token punctuation">}</span>
            <span class="token keyword">if</span> status <span class="token operator">==</span> tencentcloud<span class="token punctuation">.</span>CommandStatusSuccess <span class="token punctuation">{</span>
                <span class="token keyword">return</span> <span class="token boolean">nil</span>
            <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> <span class="token operator">!</span><span class="token punctuation">(</span>status <span class="token operator">==</span> tencentcloud<span class="token punctuation">.</span>CommandStatusRunning <span class="token operator">||</span> status <span class="token operator">==</span> tencentcloud<span class="token punctuation">.</span>CommandStatusPending <span class="token operator">||</span>
                status <span class="token operator">==</span> tencentcloud<span class="token punctuation">.</span>CommandStatusDelivering<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;tat 下发任务状态异常: %v&quot;</span><span class="token punctuation">,</span> status<span class="token punctuation">)</span>
                <span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>IllegalError<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;tat 下发任务状态异常: %v&quot;</span><span class="token punctuation">,</span> status<span class="token punctuation">)</span>
            <span class="token punctuation">}</span>
            ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Infof</span><span class="token punctuation">(</span><span class="token string">&quot;tat 下发任务状态: %v&quot;</span><span class="token punctuation">,</span> status<span class="token punctuation">)</span>
            time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">100</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Millisecond<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br></div></div><h3 id="灰度编码"><a href="#灰度编码" class="header-anchor">#</a> 灰度编码</h3> <blockquote><p>这个功能需要加灰度，你看下 /env/UserEnvList 接口，返回的 accessDomain 的逻辑，按照相同逻辑加个字段 sshDomain，逻辑是和 accessDomain 的逻辑相互独立，灰度先配置 codev_test 这个 appId</p></blockquote> <p>本质上是从配置中心拉配置然后在后台进行 if 硬编码，返回屏蔽的数据实现灰度，这里需要前端配合使用 enableSshProxy 字段</p> <p>在 web_server.proto 中新增 enableSshProxy 字段，通过 proto 自动生成模版代码</p> <div class="language-protobuf line-numbers-mode"><pre class="language-protobuf"><code><span class="token keyword">message</span> <span class="token class-name">UserEnvListRsp</span><span class="token punctuation">{</span>
  <span class="token keyword">message</span> <span class="token class-name">UserEnv</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>
    <span class="token builtin">string</span> accessDomain <span class="token operator">=</span> <span class="token number">65</span><span class="token punctuation">;</span> <span class="token comment">// ai agent等无IP直连访问的域名</span>
    <span class="token builtin">string</span> wsDomain <span class="token operator">=</span> <span class="token number">66</span><span class="token punctuation">;</span> <span class="token comment">// ai agent等无IP web terminal访问的域名</span>
    <span class="token builtin">bool</span> enableSshProxy <span class="token operator">=</span> <span class="token number">67</span><span class="token punctuation">;</span> <span class="token comment">// 是否对该环境启用 SSH proxy（灰度命中标记）</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>在 proto/web-server 目录下执行命令将自动生成 pb 文件</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token string">`trpc create --protofile=web_server.proto --rpconly --alias --goversion=1.18`</span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>web_server.pb.go 中新增了 bool 字段 enableSshProxy</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">type</span> UserEnvListRsp_UserEnv <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>
    AccessDomain        <span class="token builtin">string</span>                  <span class="token string">`protobuf:&quot;bytes,65,opt,name=accessDomain,proto3&quot; json:&quot;accessDomain,omitempty&quot;`</span>      <span class="token comment">// ai agent等无IP直连访问的域名</span>
    WsDomain            <span class="token builtin">string</span>                  <span class="token string">`protobuf:&quot;bytes,66,opt,name=wsDomain,proto3&quot; json:&quot;wsDomain,omitempty&quot;`</span>              <span class="token comment">// ai agent等无IP web terminal访问的域名</span>
    EnableSshProxy      <span class="token builtin">bool</span>                    <span class="token string">`protobuf:&quot;varint,67,opt,name=enableSshProxy,proto3&quot; json:&quot;enableSshProxy,omitempty&quot;`</span> <span class="token comment">// 是否对该环境启用 SSH proxy（灰度命中标记）</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>然后在 env/list 接口中通过 if 启用硬编码，只有 appId 匹配或者通配时，才返回前端 <code>EnableSshProxy = true</code></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetUserEnvList 获取用户环境列表</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>env <span class="token operator">*</span>UserEnvListController<span class="token punctuation">)</span> <span class="token function">GetUserEnvList</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> username <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>
    rsp <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>api<span class="token punctuation">.</span>UserEnvListRsp_UserEnv<span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>
            <span class="token keyword">if</span> <span class="token operator">!</span>data<span class="token punctuation">.</span>EniIp <span class="token punctuation">{</span>
                <span class="token keyword">if</span> common<span class="token punctuation">.</span><span class="token function">ContainsInSlice</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>EnableAppId<span class="token punctuation">,</span> <span class="token string">&quot;*&quot;</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                    data<span class="token punctuation">.</span>AccessDomain <span class="token operator">=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>AccessDomain<span class="token punctuation">,</span> data<span class="token punctuation">.</span>Id<span class="token punctuation">)</span>
                    data<span class="token punctuation">.</span>WsDomain <span class="token operator">=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>WsDomain<span class="token punctuation">,</span> data<span class="token punctuation">.</span>Id<span class="token punctuation">)</span>
                <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> common<span class="token punctuation">.</span><span class="token function">ContainsInSlice</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>EnableAppId<span class="token punctuation">,</span> data<span class="token punctuation">.</span>AppInfo<span class="token punctuation">.</span>AppId<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                    data<span class="token punctuation">.</span>AccessDomain <span class="token operator">=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>AccessDomain<span class="token punctuation">,</span> data<span class="token punctuation">.</span>Id<span class="token punctuation">)</span>
                    data<span class="token punctuation">.</span>WsDomain <span class="token operator">=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>WsDomain<span class="token punctuation">,</span> data<span class="token punctuation">.</span>Id<span class="token punctuation">)</span>
                <span class="token punctuation">}</span>
                <span class="token comment">// SSH proxy 灰度：与 http/ws 域名灰度独立</span>
                <span class="token keyword">if</span> common<span class="token punctuation">.</span><span class="token function">ContainsInSlice</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>EnableSshAppId<span class="token punctuation">,</span> <span class="token string">&quot;*&quot;</span><span class="token punctuation">)</span> <span class="token operator">||</span>
                    common<span class="token punctuation">.</span><span class="token function">ContainsInSlice</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>AnydevProxyConfig<span class="token punctuation">.</span>EnableSshAppId<span class="token punctuation">,</span> data<span class="token punctuation">.</span>AppInfo<span class="token punctuation">.</span>AppId<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                    data<span class="token punctuation">.</span>EnableSshProxy <span class="token operator">=</span> <span class="token boolean">true</span>
                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span>
    <span class="token comment">//...</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><h3 id="测试与提交"><a href="#测试与提交" class="header-anchor">#</a> 测试与提交</h3> <p>指定 proto 生成 pb 文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>trpc create <span class="token parameter variable">--protofile</span><span class="token operator">=</span>web_server.proto <span class="token parameter variable">--rpconly</span> <span class="token parameter variable">--alias</span> <span class="token parameter variable">--goversion</span><span class="token operator">=</span><span class="token number">1.18</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>本地部署项目</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>go build <span class="token parameter variable">-o</span> main ./cmd/main.go
<span class="token assign-left variable">DEBUG</span><span class="token operator">=</span>true ./main <span class="token parameter variable">--local_config</span><span class="token operator">=</span>true <span class="token parameter variable">--config</span><span class="token operator">=</span>cfg
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>测试启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">curl</span> <span class="token parameter variable">-i</span> http://localhost:8080/health
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查看本地 ip</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">hostname</span> <span class="token parameter variable">-I</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查询 CMS dnat 状态，测试命令是否下发成功</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>nft list ruleset <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-A20</span> port2backend
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>删除 CVM 中脏规则</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>nft delete element inet nat port2backend <span class="token punctuation">{</span> <span class="token number">40008</span> <span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>从数据库里拿 env 实例数据，找状态为 running 且 serverType 不是 vm 和 cvmContainer 的数据</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> 
    uid<span class="token punctuation">,</span>
    paasEnvironmentId<span class="token punctuation">,</span>
    environmentIp<span class="token punctuation">,</span>
    disableEniIp<span class="token punctuation">,</span>
    serverType<span class="token punctuation">,</span>
    <span class="token keyword">status</span><span class="token punctuation">,</span>
    username
<span class="token keyword">FROM</span> devEnvironmentInstance
<span class="token keyword">WHERE</span> disableEniIp <span class="token operator">=</span> <span class="token number">1</span>
  <span class="token operator">AND</span> <span class="token keyword">status</span> <span class="token operator">=</span> <span class="token string">'running'</span>
  <span class="token operator">AND</span> environmentIp <span class="token operator">IS</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span>
  <span class="token operator">AND</span> environmentIp <span class="token operator">&lt;&gt;</span> <span class="token string">''</span>
  <span class="token operator">AND</span> serverType <span class="token operator">NOT</span> <span class="token operator">IN</span> <span class="token punctuation">(</span><span class="token string">'vm'</span><span class="token punctuation">,</span> <span class="token string">'cvmContainer'</span><span class="token punctuation">)</span>   <span class="token comment">-- 走 default 分支才会触发你的 ssh proxy 逻辑</span>
<span class="token keyword">LIMIT</span> <span class="token number">10</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>把 staffname 替换成 paasEnvironmentId 的前缀，构造 curl 命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">curl</span> <span class="token parameter variable">-X</span> POST http://21.214.96.51:8080/env/enableSsh <span class="token punctuation">\</span>

  <span class="token parameter variable">-d</span> <span class="token string">'{
    &quot;envId&quot;: &quot;evnIns-6kd8zjd4q2fm&quot;,
    &quot;keyName&quot;: &quot;test-key-123&quot;,
    &quot;ideName&quot;: &quot;VSCode&quot;,
    &quot;ideVersion&quot;: &quot;1.0&quot;
  }'</span>

<span class="token function">curl</span> <span class="token parameter variable">-X</span> POST http://localhost:8080/env/enableSsh <span class="token punctuation">\</span>
  <span class="token parameter variable">-H</span> <span class="token string">&quot;Content-Type: application/json&quot;</span> <span class="token punctuation">\</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>提代码 commit 规范</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>--sotry=tapd 需求单号 说明
--bug=tapd bug单号 说明
--other=其他说明

--story=134495465 无 ip 环境前端展示 ssh 连接入口

--other=写 redis sleep 100ms
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>打补丁</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> <span class="token function">add</span> proto/web-server/apidocs.swagger.json proto/web-server/web_server.pb.go proto/web-server/web_server.trpc.go proto/web-server/web_server.pb.validate.go

<span class="token function">git</span> commit <span class="token parameter variable">--amend</span> --no-edit

<span class="token function">git</span> push --force-with-lease
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>冲突解决</p> <ol><li>朴素方法：直接 fetch 目标分支如 release/3.3.2，在本地开发分支 dev/saulxiong-ssh-proxy 解决冲突，然后提交到 dev/saulxiong-ssh-proxy 分支，然后合并到 release/3.3.2 分支</li> <li>mt 教的办法：不污染开发分支，新建 personal 分支 dev/saulxiong-3.3.2，源分支为 release/3.3.2，拉到本地后，去 merge 开发分支 dev/saulxiong-ssh-proxy，然后提交这个 persion 分支，再去请求合并到 release/3.3.2，这样开发分支是纯净的，所有的 merge 和 mr 都在这个新的 personal 分支上进行</li></ol> <p>常见评论</p> <ul><li><strong>LGTM:</strong> Looks Good To Me</li> <li><strong>SGTM:</strong> Sounds Good To Me</li> <li><strong>AFAIK:</strong> As Far As I Know</li> <li><strong>WIP:</strong> Work In Progress</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/13, 22:14:32</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/ce21a8/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Web 登录认证</div></a> <a href="/pages/48385f/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Golang 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
