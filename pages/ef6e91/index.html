D9MF2aq6cPvG72CgnldWCFqyRw3lwH8ZMerjTD9ElRO7Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">网关与代理<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="需求场景和技术方案"><a href="#需求场景和技术方案" class="header-anchor">#</a> 需求场景和技术方案</h2> <p>静态 IP 资源有限，AI 容器太多了，分配不过来，所以只能开辟无 IP 容器，但用户仍有 ssh 直连 AI 容器调试的需求，必须要新增一层转发控制，支持无 IP 容器的连接，这包括</p> <ul><li>HTTP 流量的请求转发</li> <li>WS 形式的 Web Terminal 流量的转发</li> <li>SSH 直连容器的需求</li></ul> <p>以 ssh 为例，在有 IP 的情况下，直接可以通过 ip 和私钥进行 ssh 直连，但现在分配不了 ip 了，所以只能用一个泛域名返回给用户，后台做一层映射转发，实现这样的需求</p> <h3 id="ws-http-流量转发"><a href="#ws-http-流量转发" class="header-anchor">#</a> ws / http 流量转发</h3> <p>WS / HTTP 流量的转发，核心思路</p> <ol><li>业务侧在更新域名 / IP 的时候，把映射关系存到 redis，以供网关进行代理转发</li> <li>用 udns 映射源域名到 apisix 网关，网关根据 envId 查 redis 找到 pod ip，再通过 apisix 插件 access 拦截将请求转发到 pod ip</li></ol> <p>用这样的方案转发 http 和 ws 流量，以实现无 IP 容器的登陆（http 连接）和 Web Terminal 连接（ws 连接）</p> <p>APISIX 是一个 Lua 网关服务，基于 OpenResty（Nginx + LuaJIT）实现，用 Etcd 存放本地数据</p> <blockquote><ol><li><a href="https://apisix.apache.org/zh/blog/2025/04/08/introducing-apisix-ai-gateway/" target="_blank" rel="nofollow noopener noreferrer">APISIX AI 网关介绍 | Apache APISIX<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://apisix.apache.org/zh/blog/2025/05/07/apisix-gateway-practice-in-tencent-timi/" target="_blank" rel="nofollow noopener noreferrer">游戏业务出海：TAPISIX 稳定运营实践 | Apache APISIX<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ol></blockquote> <p>apisix 插件 plugins 通过导出 _M 并提供 <code>_M.access、_M.rewrite、_M.check_schema</code> 等钩子函数，在请求的生命周期不同阶段被挂载调用，实现流量的前置（如鉴权）后置（如转发）处理，例如</p> <ul><li>APISIX 在加载 / 更新插件配置时会调用 check_schema(conf)，确保用户传的 conf 合法</li> <li>access 是 APISIX 请求生命周期的&quot;访问控制&quot;阶段；返回数字 = HTTP 状态码并中断请求；返回 nil 表示放行</li></ul> <p>这里 ws 和 http 流量的转发就是通过插件的形式实现，通过调用 access 实现鉴权和转发</p> <p>最终，这里的插件通过 Dockerfile 构建并注入现有的 apisix 服务</p> <ol><li>定义 Dockerfile 将插件 copy 丢到现成的 APISIX 的 plugins 目录下</li> <li>配置 APISIX 的 config.yaml 插件白名单</li> <li>在运行阶段，如果路由命中了对应插件，APISIX 就会自动读入每个插件 _M 的函数，并按照 priority 大小顺序执行</li></ol> <p>Dockerfile 示例</p> <div class="language-dockerfile extra-class"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> mirrors.tencent.com/tapisix/tapisix:3.3.1-alpha</span>
<span class="token instruction"><span class="token keyword">COPY</span> plugins/* /usr/local/tapisix/apisix/plugins/</span>
</code></pre></div><h3 id="ssh-代理直连"><a href="#ssh-代理直连" class="header-anchor">#</a> ssh 代理直连</h3> <p>目前敲定的技术方案为：DNAT + IPTable 实现泛域名到 Pod 的反向代理</p> <ul><li>UDNS（UCloud Domain Name System），域名解析服务系统，根据泛域名中某一字段，将泛域名重定向到具体域名，例如</li> <li>CLB（Classic Load Balancer），负载均衡器</li> <li>DNAT（Destination Network Address Translation），目的网络地址转换，是 Linux 系统软件的工作，将一个端口的 TCP 流量指定转发到另一 IP，通过 add 规则指定</li> <li>IP Table（IP 映射表），提供端口到 pod ip 的映射，例如 CMS_IP: 56001 映射 k8s 中的 80.133.22.231:22，一个端口映射一个 ip</li></ul> <p>核心是修改 /env/enableSsh 接口：<strong>codev-web-server/services/web_service.go: EnableSsh</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// EnableSsh @alias=/env/enableSsh</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>WebService<span class="token punctuation">)</span> <span class="token function">EnableSsh</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>api<span class="token punctuation">.</span>EnableSshReq<span class="token punctuation">)</span> <span class="token punctuation">(</span>rsp <span class="token operator">*</span>api<span class="token punctuation">.</span>EnableSshRsp<span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    rsp <span class="token operator">=</span> <span class="token operator">&amp;</span>api<span class="token punctuation">.</span>EnableSshRsp<span class="token punctuation">{</span><span class="token punctuation">}</span>
    tCtx <span class="token operator">:=</span> tcontext<span class="token punctuation">.</span><span class="token function">WithDefaultContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    envId <span class="token operator">:=</span> req<span class="token punctuation">.</span>EnvId
    keyName <span class="token operator">:=</span> req<span class="token punctuation">.</span>KeyName
    ideName <span class="token operator">:=</span> req<span class="token punctuation">.</span>IdeName
    controller <span class="token operator">:=</span> business<span class="token punctuation">.</span>LocalIdeController<span class="token punctuation">{</span><span class="token punctuation">}</span>
    data<span class="token punctuation">,</span> err <span class="token operator">:=</span> controller<span class="token punctuation">.</span><span class="token function">EnableSSHD</span><span class="token punctuation">(</span>tCtx<span class="token punctuation">,</span> envId<span class="token punctuation">,</span> keyName<span class="token punctuation">,</span> ideName<span class="token punctuation">,</span> req<span class="token punctuation">.</span>IdeVersion<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        rsp<span class="token punctuation">.</span>Code <span class="token operator">=</span> <span class="token operator">-</span><span class="token number">1</span>
        rsp<span class="token punctuation">.</span>Message <span class="token operator">=</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span> rsp<span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    rsp<span class="token punctuation">.</span>Code <span class="token operator">=</span> <span class="token number">200</span>
    rsp<span class="token punctuation">.</span>Data <span class="token operator">=</span> data
    <span class="token keyword">return</span> rsp<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>用户请求 ssh 连接时将访问这个接口，正如一开始所说的有 IP 的场景，用户请求该接口后，后台将下发公钥到指定机器，把私钥下发到用户本地，这里的下发调用的是 PaaS 层提供的 EnableSsh 接口，控制面的工作是构造 req</p> <div class="language-go extra-class"><pre class="language-go"><code>resp<span class="token punctuation">,</span> err <span class="token operator">:=</span> agentClient<span class="token punctuation">.</span>EnvironmentClient<span class="token punctuation">.</span><span class="token function">EnableSsh</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
</code></pre></div><p>返回用户可以 ssh 直连的 uri</p> <div class="language-json extra-class"><pre class="language-json"><code>response<span class="token operator">:</span> <span class="token punctuation">{</span>
  code<span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>
  data<span class="token operator">:</span> <span class="token punctuation">{</span>
    VSCode<span class="token operator">:</span> <span class="token string">&quot;vscode://vscode-remote/ssh-remote+root@jaceyuan-any2.devcloud.woa.com:36000/data/workspace/FeedbackAnalyzer/?windowId=_blank&quot;</span><span class="token punctuation">,</span> PhpStorm<span class="token operator">:</span> <span class="token string">&quot;jetbr&gt;-ains-gateway://connect#idePath=/codev/ide/PS/PhpStorm-2024.1.2&amp;projectPath=/data/workspace/FeedbackAnalyzer/&amp;host=jaceyuan-any2.devcloud.woa.com&amp;user=root&amp;port=36000&amp;type=ssh&amp;deploy=false&quot;</span><span class="token punctuation">,</span>
    CodeBuddyCN<span class="token operator">:</span> <span class="token string">&quot;codebuddyc://vscode-remote/codebuddy-remote-ssh+root@jaceyuan-any2.devcloud.woa.com:36000/data/workspace/FeedbackAnalyzer/?windowId=_blank&quot;</span><span class="token punctuation">,</span>
    <span class="token comment">//...</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>用户直接通过这个链接去打开对应的 IDE，并携带其本地的私钥签名进行 ssh 连接，由于现在没有 ip 了，之前直接把 ip 对应的域名查表 return 就行，这里变为先做映射和转存，再返回代理的域名和端口，并拼接成上面的 uriScheme</p> <p>具体而言</p> <ol><li>修改 serverType 为容器环境且禁用 eniIp 的分支</li> <li>pod ip 是已知的，我们要做的是端口到 pod ip 的映射，所以先从 Redis 里拿可用的端口号 port</li> <li>从七彩石配置中读出可用的集群 id 和集群下的 cvm id，cvm 实例是真正进行 dnat 中转的机器，是接收映射配置的实体</li> <li>远程命令执行，下发 cvm 本地脚本命令 <code>bash /data/home/yingqichen/nft/nft-ctl.sh add %d %s %d</code>，将映射规则写入 dnat，并查询状态判断任务是否成功</li> <li>写数据库，此时已知道监听端口、集群 ID、下发任务 ID，任务状态，直接将这条规则写入</li> <li>返回 uriScheme：根据 sshProxyDomain 拼接 scheme，同时返回 sshProxyDomain（envId 占位符替换泛域名）和 sshProxyPort</li> <li>当然，数据库中若有规则（查表有数据）直接拼接返回即可</li></ol> <p>用户代理连接的流程：用户请求 <code>env/enableSsh</code> 接口拿到泛域名 + port，点击链接发起 ssh 请求，这个请求会先打到 UDND，解析泛域名重定向到 CLB，CLB 将流量均衡到某一台 CVM 的某一 port，请求经过 CVM DNAT 转发，转发到真正的 <code>pod_ip: 36000</code>，实现 ssh 连接</p> <h2 id="支持-ws-http-流量转发无-ip-容器"><a href="#支持-ws-http-流量转发无-ip-容器" class="header-anchor">#</a> 支持 WS / HTTP 流量转发无 IP 容器</h2> <h3 id="控制面缓存代理规则"><a href="#控制面缓存代理规则" class="header-anchor">#</a> 控制面缓存代理规则</h3> <p>EnvInstanceController 缓存 proxy 信息：<strong>business/env_instance.go: CacheProxyInformation</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// CacheProxyInformation 缓存proxy需要的信息（环境id对应用户名、环境id对应ip）</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">CacheProxyInformation</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
    envIns <span class="token operator">*</span>table<span class="token punctuation">.</span>DevEnvironmentInstance<span class="token punctuation">,</span> envTask <span class="token operator">*</span>table<span class="token punctuation">.</span>EnvironmentTask<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    envId <span class="token operator">:=</span> strings<span class="token punctuation">.</span><span class="token function">ToLower</span><span class="token punctuation">(</span>envIns<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
    IpKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxy<span class="token punctuation">.</span>IpKey<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
    UsernameKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxy<span class="token punctuation">.</span>UsernameKey<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
    TokenKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>proxy<span class="token punctuation">.</span>TokenKey<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>

    <span class="token keyword">if</span> envTask<span class="token punctuation">.</span>Action <span class="token operator">==</span> EnvActionDelete <span class="token punctuation">{</span>

        <span class="token boolean">_</span><span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;set&quot;</span><span class="token punctuation">,</span> UsernameKey<span class="token punctuation">,</span> envIns<span class="token punctuation">.</span>Username<span class="token punctuation">)</span>

<span class="token punctuation">}</span>
</code></pre></div><p>只要是更新实例状态，<strong>business/env_instance.go: UpdateStatus</strong>，就会根据 serverType 进行缓存，如果是 VM，一定有 IP，不需要走代理，如果是容器并且没有 IP（disableEniIp == true），则进行缓存</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// UpdateStatus ...</span>

            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>

    <span class="token keyword">default</span><span class="token punctuation">:</span>

            <span class="token boolean">_</span> <span class="token operator">=</span> envInstance<span class="token punctuation">.</span><span class="token function">onTaijiEnvTaskComplete</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token operator">&amp;</span>environmentInstance<span class="token punctuation">,</span> <span class="token operator">&amp;</span>environmentTask<span class="token punctuation">)</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 开机更新token</span>
        <span class="token keyword">if</span> environmentTask<span class="token punctuation">.</span>Action <span class="token operator">==</span> EnvActionStart <span class="token operator">&amp;&amp;</span> environmentInstance<span class="token punctuation">.</span>Status <span class="token operator">==</span> runningStatus <span class="token punctuation">{</span>
            <span class="token boolean">_</span> <span class="token operator">=</span> defaultPaaSController<span class="token punctuation">.</span><span class="token function">UpdateEnvGitToken</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token operator">&amp;</span>environmentInstance<span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 环境创建成功，绑定域名</span>

            <span class="token comment">// 如果是带appId创建的环境且不是预备环境，则需要判断是否要注册预缓存盘v2</span>

                <span class="token operator">!</span>environmentInstance<span class="token punctuation">.</span><span class="token function">IsPrepareEnv</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                er <span class="token operator">:=</span> codeprecacheController<span class="token punctuation">.</span><span class="token function">CreatePrecacheV2</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token operator">&amp;</span>environmentInstance<span class="token punctuation">)</span>
                <span class="token keyword">if</span> er <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>

                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 处理预约排队相关</span>
        DefaultQueueController<span class="token punctuation">.</span><span class="token function">QueueTaskCallBack</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token operator">&amp;</span>environmentTask<span class="token punctuation">,</span> <span class="token operator">&amp;</span>environmentInstance<span class="token punctuation">)</span>
        <span class="token comment">// 从any回调回来，目前默认回调信息为命令执行的结果，没有更多标志位</span>

        <span class="token punctuation">}</span>

</code></pre></div><h3 id="存储鉴权-token"><a href="#存储鉴权-token" class="header-anchor">#</a> 存储鉴权 Token</h3> <p>写 Redis Token 给 apisix lua 插件鉴权：<strong>business/cli/token.go: 120</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// SaveTokenToRedis 持久化到redis 供tapisix查询</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>TokenController<span class="token punctuation">)</span> <span class="token function">SaveTokenToRedis</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> token <span class="token operator">*</span>table<span class="token punctuation">.</span>CliToken<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    key <span class="token operator">:=</span> cliTokenRedisKey <span class="token operator">+</span> token<span class="token punctuation">.</span>Token
    <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;set&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> token<span class="token punctuation">.</span>Username<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warn</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>真正的鉴权和转发由 apisix 网关执行，这里只是做前置的存储</p> <h3 id="apisix-auth-插件鉴权"><a href="#apisix-auth-插件鉴权" class="header-anchor">#</a> apisix auth 插件鉴权</h3> <p><strong>codev-auth.lua</strong> 常量定义</p> <ul><li>ngx 是 LuaJIT 启动时由 C 模块直接注册到 _G（全局环境）里的变量，里面挂着访问 Nginx 内部的所有 API，所以在任何 .lua 文件里直接写 ngx.xxx 都能用，为什么要本地 local 赋值？很简单，因为 local 查的快，全局查表慢</li> <li>core.lrucache 是 lua 的本地缓存，设置最多缓存 1000 项，每项存活 300 秒，用于缓存 Redis 中查到的 appid 信息，避免每个请求都查 Redis</li></ul> <div class="language-lua extra-class"><pre class="language-lua"><code><span class="token comment">-- 云研发 app + token + uri 鉴权</span>
<span class="token keyword">local</span> ngx     <span class="token operator">=</span> ngx
<span class="token keyword">local</span> core    <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;apisix.core&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> redis_new <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;resty.redis&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>new
<span class="token keyword">local</span> sha256   <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;resty.sha256&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> hex      <span class="token operator">=</span> <span class="token function">assert</span><span class="token punctuation">(</span><span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;resty.string&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span>to_hex

<span class="token keyword">local</span> plugin_name <span class="token operator">=</span> <span class="token string">&quot;codev-auth&quot;</span>
<span class="token keyword">local</span> codev_app_key <span class="token operator">=</span> <span class="token string">&quot;codev_app_token&quot;</span>
<span class="token keyword">local</span> codev_app_uri_prefix <span class="token operator">=</span> <span class="token string">&quot;codev_app_uri___&quot;</span>
<span class="token keyword">local</span> tonumber <span class="token operator">=</span> tonumber
<span class="token keyword">local</span> my_cache <span class="token operator">=</span> core<span class="token punctuation">.</span>lrucache<span class="token punctuation">.</span><span class="token function">new</span><span class="token punctuation">(</span><span class="token punctuation">{</span>
    serial_creating <span class="token operator">=</span> <span class="token keyword">true</span> <span class="token punctuation">,</span> invalid_stale <span class="token operator">=</span> <span class="token keyword">true</span> <span class="token punctuation">,</span> ttl <span class="token operator">=</span> <span class="token number">300</span><span class="token punctuation">,</span> count <span class="token operator">=</span> <span class="token number">1000</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span>

<span class="token keyword">local</span> schema <span class="token operator">=</span> <span class="token punctuation">{</span>
    type <span class="token operator">=</span> <span class="token string">&quot;object&quot;</span><span class="token punctuation">,</span>
    properties <span class="token operator">=</span> <span class="token punctuation">{</span>
        redis_host <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">,</span> minLength <span class="token operator">=</span> <span class="token number">2</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_port <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;integer&quot;</span><span class="token punctuation">,</span> minimum <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span> default <span class="token operator">=</span> <span class="token number">6379</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_username <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">,</span> minLength <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_password <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">,</span> minLength <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_database <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;integer&quot;</span><span class="token punctuation">,</span> minimum <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">,</span> default <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
        redis_timeout <span class="token operator">=</span> <span class="token punctuation">{</span>
            type <span class="token operator">=</span> <span class="token string">&quot;integer&quot;</span><span class="token punctuation">,</span> minimum <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span> default <span class="token operator">=</span> <span class="token number">1000</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>

    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    required <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token string">&quot;redis_host&quot;</span><span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>钩子函数及导出定义</p> <div class="language-lua extra-class"><pre class="language-lua"><code><span class="token keyword">local</span> _M <span class="token operator">=</span> <span class="token punctuation">{</span>
    version <span class="token operator">=</span> <span class="token number">1.0</span><span class="token punctuation">,</span>
    priority <span class="token operator">=</span> <span class="token number">2500</span><span class="token punctuation">,</span>
    name <span class="token operator">=</span> plugin_name<span class="token punctuation">,</span>
    schema <span class="token operator">=</span> schema<span class="token punctuation">,</span>
<span class="token punctuation">}</span>

<span class="token keyword">function</span> _M<span class="token punctuation">.</span><span class="token function">check_schema</span><span class="token punctuation">(</span>conf<span class="token punctuation">)</span>
    <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err <span class="token operator">=</span> core<span class="token punctuation">.</span>schema<span class="token punctuation">.</span><span class="token function">check</span><span class="token punctuation">(</span>schema<span class="token punctuation">,</span> conf<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> err
    <span class="token keyword">end</span>
    <span class="token keyword">return</span> <span class="token keyword">true</span>
<span class="token keyword">end</span>

<span class="token keyword">function</span> _M<span class="token punctuation">.</span><span class="token function">access</span><span class="token punctuation">(</span>plugin_conf<span class="token punctuation">,</span> ctx<span class="token punctuation">)</span>
    <span class="token keyword">local</span> conf <span class="token operator">=</span> core<span class="token punctuation">.</span>table<span class="token punctuation">.</span><span class="token function">clone</span><span class="token punctuation">(</span>plugin_conf<span class="token punctuation">)</span>
    <span class="token keyword">local</span> err <span class="token operator">=</span> <span class="token function">check_codev_app_token</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> conf<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;code auth failed: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">401</span>
    <span class="token keyword">end</span>
<span class="token keyword">end</span>

<span class="token keyword">return</span> _M
</code></pre></div><p>鉴权的业务逻辑实现：读 redis，与请求参数比较进行鉴权</p> <div class="language-lua extra-class"><pre class="language-lua"><code><span class="token comment">-- 连接 redis</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">redis_cli</span><span class="token punctuation">(</span>conf<span class="token punctuation">)</span>
    <span class="token keyword">local</span> red <span class="token operator">=</span> <span class="token function">redis_new</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">local</span> timeout <span class="token operator">=</span> conf<span class="token punctuation">.</span>redis_timeout <span class="token keyword">or</span> <span class="token number">1000</span>    <span class="token comment">-- 1sec</span>

    red<span class="token punctuation">:</span><span class="token function">set_timeouts</span><span class="token punctuation">(</span>timeout<span class="token punctuation">,</span> timeout<span class="token punctuation">,</span> timeout<span class="token punctuation">)</span>

    <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">connect</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_host<span class="token punctuation">,</span> conf<span class="token punctuation">.</span>redis_port <span class="token keyword">or</span> <span class="token number">6379</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> err
    <span class="token keyword">end</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> <span class="token string">&quot;redis connect err&quot;</span>
    <span class="token keyword">end</span>

    <span class="token keyword">local</span> count
    count<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">get_reused_times</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token number">0</span> <span class="token operator">==</span> count <span class="token keyword">then</span>
        <span class="token keyword">if</span> conf<span class="token punctuation">.</span>redis_password <span class="token keyword">and</span> conf<span class="token punctuation">.</span>redis_password <span class="token operator">~=</span> <span class="token string">''</span> <span class="token keyword">then</span>
            <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err
            <span class="token keyword">if</span> conf<span class="token punctuation">.</span>redis_username <span class="token keyword">then</span>
                ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">auth</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_username<span class="token punctuation">,</span> conf<span class="token punctuation">.</span>redis_password<span class="token punctuation">)</span>
            <span class="token keyword">else</span>
                ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">auth</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_password<span class="token punctuation">)</span>
            <span class="token keyword">end</span>
            <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
                <span class="token keyword">return</span> <span class="token keyword">nil</span><span class="token punctuation">,</span> err
            <span class="token keyword">end</span>
        <span class="token keyword">end</span>

        <span class="token comment">-- select db</span>
        <span class="token keyword">if</span> conf<span class="token punctuation">.</span>redis_database <span class="token operator">~=</span> <span class="token number">0</span> <span class="token keyword">then</span>
            <span class="token keyword">local</span> ok<span class="token punctuation">,</span> err <span class="token operator">=</span> red<span class="token punctuation">:</span><span class="token function">select</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>redis_database<span class="token punctuation">)</span>
            <span class="token keyword">if</span> <span class="token keyword">not</span> ok <span class="token keyword">then</span>
                <span class="token keyword">return</span> <span class="token keyword">false</span><span class="token punctuation">,</span> <span class="token string">&quot;failed to change redis db, err: &quot;</span> <span class="token operator">..</span> err
            <span class="token keyword">end</span>
        <span class="token keyword">end</span>
    <span class="token keyword">elseif</span> err <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot; err: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token keyword">nil</span><span class="token punctuation">,</span> err
    <span class="token keyword">end</span>
    <span class="token keyword">return</span> red<span class="token punctuation">,</span> <span class="token keyword">nil</span>
<span class="token keyword">end</span>
</code></pre></div><p>sha256 加密，进行鉴权时，是对密文进行 <code>~=</code> 匹配</p> <div class="language-lua extra-class"><pre class="language-lua"><code><span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">gen_codev_app_enckey</span><span class="token punctuation">(</span>token<span class="token punctuation">,</span> ts<span class="token punctuation">,</span> random<span class="token punctuation">)</span>
    <span class="token keyword">local</span> data <span class="token operator">=</span> token <span class="token operator">..</span> ts <span class="token operator">..</span> random
    <span class="token keyword">local</span> hash <span class="token operator">=</span> sha256<span class="token punctuation">:</span><span class="token function">new</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    hash<span class="token punctuation">:</span><span class="token function">update</span><span class="token punctuation">(</span>data<span class="token punctuation">)</span>
    <span class="token keyword">return</span> string<span class="token punctuation">.</span><span class="token function">upper</span><span class="token punctuation">(</span><span class="token function">hex</span><span class="token punctuation">(</span>hash<span class="token punctuation">:</span><span class="token function">final</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">end</span>
</code></pre></div><p>鉴权验权</p> <div class="language-lua extra-class"><pre class="language-lua"><code><span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">check_codev_app_token</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> conf<span class="token punctuation">)</span>
    <span class="token comment">-- Get Authorization header, maybe.</span>
    <span class="token keyword">local</span> appid_header <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;APPID&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> appid_header <span class="token keyword">then</span>
        <span class="token keyword">return</span>  <span class="token string">&quot;header APPID is empty.&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">local</span> random_header <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;RANDOM&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> random_header <span class="token keyword">then</span>
        <span class="token keyword">return</span>  <span class="token string">&quot;header RANDOM is empty.&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">local</span> ts_header <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;TIMESTP&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> ts_header <span class="token keyword">then</span>
        <span class="token keyword">return</span>  <span class="token string">&quot;header TIMESTP is empty.&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">local</span> enckey_header <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;ENCKEY&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> enckey_header <span class="token keyword">then</span>
        <span class="token keyword">return</span>  <span class="token string">&quot;header ENCKEY is empty.&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">local</span> now <span class="token operator">=</span> os<span class="token punctuation">.</span><span class="token function">time</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">local</span> ts <span class="token operator">=</span> <span class="token function">tonumber</span><span class="token punctuation">(</span>ts_header<span class="token punctuation">)</span>
    <span class="token keyword">if</span> ts <span class="token operator">+</span> <span class="token number">300</span> <span class="token operator">&lt;</span> <span class="token function">tonumber</span><span class="token punctuation">(</span>now<span class="token punctuation">)</span> <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token string">&quot;TIMESTP is expired&quot;</span>
    <span class="token keyword">end</span>
    
    <span class="token keyword">local</span> app_info<span class="token punctuation">,</span> err <span class="token operator">=</span> <span class="token function">my_cache</span><span class="token punctuation">(</span>appid_header<span class="token punctuation">,</span> <span class="token keyword">nil</span><span class="token punctuation">,</span> get_appid_token_info<span class="token punctuation">,</span> conf<span class="token punctuation">,</span> appid_header<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token keyword">then</span>
        <span class="token keyword">return</span> err
    <span class="token keyword">end</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> app_info <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token string">&quot;query app err&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">local</span> token <span class="token operator">=</span> app_info<span class="token punctuation">[</span><span class="token string">&quot;token&quot;</span><span class="token punctuation">]</span>
    <span class="token keyword">local</span> uris <span class="token operator">=</span> app_info<span class="token punctuation">[</span><span class="token string">&quot;uris&quot;</span><span class="token punctuation">]</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> token <span class="token keyword">or</span> token <span class="token operator">==</span> ngx<span class="token punctuation">.</span>null <span class="token keyword">or</span> token <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token keyword">then</span>
        <span class="token keyword">return</span>  <span class="token string">&quot;APPID not exist.&quot;</span>
    <span class="token keyword">end</span>

    <span class="token keyword">local</span> enckey <span class="token operator">=</span> <span class="token function">gen_codev_app_enckey</span><span class="token punctuation">(</span>token<span class="token punctuation">,</span> ts_header<span class="token punctuation">,</span> random_header<span class="token punctuation">)</span>
    <span class="token keyword">if</span> enckey <span class="token operator">~=</span> string<span class="token punctuation">.</span><span class="token function">upper</span><span class="token punctuation">(</span>enckey_header<span class="token punctuation">)</span> <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token string">&quot;enckey is error&quot;</span>
    <span class="token keyword">end</span>

    <span class="token keyword">local</span> uri <span class="token operator">=</span> ctx<span class="token punctuation">.</span>var<span class="token punctuation">.</span>uri
    <span class="token keyword">if</span> <span class="token keyword">not</span> uris <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token string">&quot;not exist access uri.&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">local</span> allow_uri <span class="token operator">=</span> <span class="token keyword">false</span>
    <span class="token keyword">for</span> i<span class="token punctuation">,</span> uri_p <span class="token keyword">in</span> <span class="token function">ipairs</span><span class="token punctuation">(</span>uris<span class="token punctuation">)</span> <span class="token keyword">do</span>
        <span class="token keyword">local</span> p <span class="token operator">=</span> string<span class="token punctuation">.</span><span class="token function">match</span><span class="token punctuation">(</span>uri<span class="token punctuation">,</span> uri_p<span class="token punctuation">)</span>
        <span class="token keyword">if</span> p <span class="token keyword">then</span>
            allow_uri <span class="token operator">=</span> <span class="token keyword">true</span>
        <span class="token keyword">end</span>
    <span class="token keyword">end</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> allow_uri <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token string">&quot;not allow access uri.&quot;</span>
    <span class="token keyword">end</span>
    <span class="token keyword">return</span>  <span class="token keyword">nil</span>
<span class="token keyword">end</span>
</code></pre></div><h3 id="staff-请求头重写"><a href="#staff-请求头重写" class="header-anchor">#</a> staff 请求头重写</h3> <blockquote><p>_M.rewrite</p></blockquote> <p><strong>codev-staff.lua</strong>：从用户请求中提取用户名并设置 staff_name</p> <div class="language-lua extra-class"><pre class="language-lua"><code><span class="token comment">-- 云研发 app + token + uri 鉴权</span>
<span class="token keyword">local</span> ngx                <span class="token operator">=</span> ngx
<span class="token keyword">local</span> core               <span class="token operator">=</span> <span class="token function">require</span><span class="token punctuation">(</span><span class="token string">&quot;apisix.core&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">local</span> plugin_name        <span class="token operator">=</span> <span class="token string">&quot;codev-staff&quot;</span>
<span class="token keyword">local</span> staff_header_key   <span class="token operator">=</span> <span class="token string">&quot;STAFFNAME&quot;</span>
<span class="token keyword">local</span> x_staff_header_key <span class="token operator">=</span> <span class="token string">&quot;X-STAFFNAME&quot;</span>
<span class="token keyword">local</span> x_oauth_header_key <span class="token operator">=</span> <span class="token string">&quot;X-Userinfo&quot;</span>


<span class="token keyword">local</span> schema <span class="token operator">=</span> <span class="token punctuation">{</span> 
<span class="token punctuation">}</span>


<span class="token keyword">local</span> _M <span class="token operator">=</span> <span class="token punctuation">{</span>
    version <span class="token operator">=</span> <span class="token number">1.0</span><span class="token punctuation">,</span>
    priority <span class="token operator">=</span> <span class="token number">600</span><span class="token punctuation">,</span>
    name <span class="token operator">=</span> plugin_name<span class="token punctuation">,</span>
    schema <span class="token operator">=</span> schema<span class="token punctuation">,</span>
<span class="token punctuation">}</span>


<span class="token comment">-- oauth认证从请求头提取用户名</span>
<span class="token keyword">local</span> <span class="token keyword">function</span> <span class="token function">get_staff_name</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">local</span> user_value <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_oauth_header_key<span class="token punctuation">)</span>
    <span class="token keyword">if</span> user_value <span class="token keyword">then</span>
        <span class="token keyword">local</span> user_info <span class="token operator">=</span> ngx<span class="token punctuation">.</span><span class="token function">decode_base64</span><span class="token punctuation">(</span>user_value<span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> user_info <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Failed to decode base64 string: &quot;</span><span class="token punctuation">,</span> user_value<span class="token punctuation">)</span>
            <span class="token keyword">return</span> 
        <span class="token keyword">end</span>
        
        <span class="token keyword">local</span> user_obj<span class="token punctuation">,</span> err <span class="token operator">=</span> core<span class="token punctuation">.</span>json<span class="token punctuation">.</span><span class="token function">decode</span><span class="token punctuation">(</span>user_info<span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> user_obj <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Failed to decode JSON string: &quot;</span><span class="token punctuation">,</span> user_info<span class="token punctuation">,</span> <span class="token string">&quot; error: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
            <span class="token keyword">return</span>
        <span class="token keyword">end</span>
        <span class="token keyword">local</span> username <span class="token operator">=</span> user_obj<span class="token punctuation">[</span><span class="token string">&quot;user_name&quot;</span><span class="token punctuation">]</span>
        <span class="token keyword">if</span>  username <span class="token keyword">then</span>
            <span class="token keyword">return</span> username
        <span class="token keyword">else</span>
            core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;not found username&quot;</span><span class="token punctuation">)</span>
        <span class="token keyword">end</span>
    <span class="token keyword">end</span>
<span class="token keyword">end</span>


<span class="token keyword">function</span> _M<span class="token punctuation">.</span><span class="token function">rewrite</span><span class="token punctuation">(</span>plugin_conf<span class="token punctuation">,</span> ctx<span class="token punctuation">)</span>
    <span class="token comment">-- staffname x-staffname 获取staffname</span>
    <span class="token keyword">local</span> staff_name <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">)</span> 
    <span class="token keyword">if</span> <span class="token keyword">not</span> staff_name <span class="token keyword">then</span>
        staff_name <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">)</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 如果都没有从header提取</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> staff_name <span class="token keyword">then</span>
        staff_name <span class="token operator">=</span> <span class="token function">get_staff_name</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 设置请求头</span>
    <span class="token keyword">if</span> staff_name <span class="token keyword">then</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">)</span> <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">set_header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> staff_header_key<span class="token punctuation">,</span> staff_name<span class="token punctuation">)</span>
        <span class="token keyword">end</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">)</span> <span class="token keyword">then</span>
            core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">set_header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> x_staff_header_key<span class="token punctuation">,</span> staff_name<span class="token punctuation">)</span>
        <span class="token keyword">end</span>
    <span class="token keyword">end</span>
<span class="token keyword">end</span>

    <span class="token keyword">local</span> host <span class="token operator">=</span> core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;Host&quot;</span><span class="token punctuation">)</span> <span class="token keyword">or</span> <span class="token string">&quot;&quot;</span>
    <span class="token keyword">local</span> domain_suffix <span class="token operator">=</span> conf<span class="token punctuation">.</span>domain_suffix <span class="token keyword">or</span> <span class="token string">&quot;yingqichen-ws-test.devcloud.woa.com&quot;</span>
    <span class="token keyword">local</span> pod_id <span class="token operator">=</span> <span class="token function">extract_pod_id</span><span class="token punctuation">(</span>host<span class="token punctuation">,</span> domain_suffix<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> pod_id <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token number">400</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;invalid domain, expected &lt;pod_id&gt;.&quot;</span> <span class="token operator">..</span> domain_suffix <span class="token punctuation">}</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 2. 获取 staffname，没有则拒绝</span>
    <span class="token keyword">local</span> staff_name <span class="token operator">=</span> <span class="token function">get_staff_name</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> staff_name <span class="token keyword">or</span> staff_name <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token keyword">then</span>
        <span class="token keyword">return</span> <span class="token number">403</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;missing staffname, authentication required&quot;</span> <span class="token punctuation">}</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 3. 从 Redis 查询 pod 对应的 username，校验是否匹配</span>
    <span class="token keyword">local</span> pod_username<span class="token punctuation">,</span> err <span class="token operator">=</span> <span class="token function">redis_get</span><span class="token punctuation">(</span>conf<span class="token punctuation">,</span> redis_prefix_username <span class="token operator">..</span> pod_id<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> pod_username <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;failed to get pod username: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">502</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;failed to get pod username: &quot;</span> <span class="token operator">..</span> <span class="token punctuation">(</span>err <span class="token keyword">or</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">)</span> <span class="token punctuation">}</span>
    <span class="token keyword">end</span>

    <span class="token keyword">if</span> pod_username <span class="token operator">~=</span> staff_name <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;username mismatch, staff_name: &quot;</span><span class="token punctuation">,</span> staff_name<span class="token punctuation">,</span> <span class="token string">&quot; pod_username: &quot;</span><span class="token punctuation">,</span> pod_username<span class="token punctuation">,</span> <span class="token string">&quot; pod_id: &quot;</span><span class="token punctuation">,</span> pod_id<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">403</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;permission denied, you are not the owner of this pod&quot;</span> <span class="token punctuation">}</span>
    <span class="token keyword">end</span>

    <span class="token comment">-- 4. 从 Redis 查询 token，塞到请求头</span>
    <span class="token keyword">local</span> token<span class="token punctuation">,</span> err <span class="token operator">=</span> <span class="token function">redis_get</span><span class="token punctuation">(</span>conf<span class="token punctuation">,</span> redis_prefix_token <span class="token operator">..</span> pod_id<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> token <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;failed to get pod token: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">502</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;failed to get pod token: &quot;</span> <span class="token operator">..</span> <span class="token punctuation">(</span>err <span class="token keyword">or</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">)</span> <span class="token punctuation">}</span>
    <span class="token keyword">end</span>
    core<span class="token punctuation">.</span>request<span class="token punctuation">.</span><span class="token function">set_header</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;X-ANY-TOKEN&quot;</span><span class="token punctuation">,</span> token<span class="token punctuation">)</span>

    <span class="token comment">-- 5. 从 Redis 查询 pod IP，设置 upstream 转发</span>
    <span class="token keyword">local</span> pod_ip<span class="token punctuation">,</span> err <span class="token operator">=</span> <span class="token function">redis_get</span><span class="token punctuation">(</span>conf<span class="token punctuation">,</span> redis_prefix_ip <span class="token operator">..</span> pod_id<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token keyword">not</span> pod_ip <span class="token keyword">then</span>
        core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;failed to get pod ip: &quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token number">502</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> message <span class="token operator">=</span> <span class="token string">&quot;failed to get pod ip: &quot;</span> <span class="token operator">..</span> <span class="token punctuation">(</span>err <span class="token keyword">or</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">)</span> <span class="token punctuation">}</span>
    <span class="token keyword">end</span>

    <span class="token keyword">local</span> ws_port <span class="token operator">=</span> conf<span class="token punctuation">.</span>ws_port <span class="token keyword">or</span> <span class="token number">8900</span>
    <span class="token keyword">local</span> new_nodes <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
    <span class="token function">table_insert</span><span class="token punctuation">(</span>new_nodes<span class="token punctuation">,</span> <span class="token punctuation">{</span> host <span class="token operator">=</span> pod_ip<span class="token punctuation">,</span> port <span class="token operator">=</span> ws_port<span class="token punctuation">,</span> weight <span class="token operator">=</span> <span class="token number">1</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
    <span class="token keyword">local</span> up_conf <span class="token operator">=</span> <span class="token punctuation">{</span>
        name <span class="token operator">=</span> plugin_name<span class="token punctuation">,</span>
        type <span class="token operator">=</span> <span class="token string">&quot;roundrobin&quot;</span><span class="token punctuation">,</span>
        nodes <span class="token operator">=</span> new_nodes<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">local</span> matched_route <span class="token operator">=</span> ctx<span class="token punctuation">.</span>matched_route
    upstream<span class="token punctuation">.</span><span class="token function">set</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;roundrobin&quot;</span> <span class="token operator">..</span> <span class="token string">&quot;#route_&quot;</span> <span class="token operator">..</span> matched_route<span class="token punctuation">.</span>value<span class="token punctuation">.</span>id<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span>conf_version<span class="token punctuation">,</span> up_conf<span class="token punctuation">,</span> matched_route<span class="token punctuation">)</span>

    <span class="token comment">-- 重写 URI 为 /</span>
    ngx<span class="token punctuation">.</span>req<span class="token punctuation">.</span><span class="token function">set_uri</span><span class="token punctuation">(</span><span class="token string">&quot;/&quot;</span><span class="token punctuation">,</span> <span class="token keyword">false</span><span class="token punctuation">)</span>

    core<span class="token punctuation">.</span>log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;ws proxy: pod_id=&quot;</span><span class="token punctuation">,</span> pod_id<span class="token punctuation">,</span> <span class="token string">&quot; staff=&quot;</span><span class="token punctuation">,</span> staff_name<span class="token punctuation">,</span> <span class="token string">&quot; → &quot;</span><span class="token punctuation">,</span> pod_ip<span class="token punctuation">,</span> <span class="token string">&quot;:&quot;</span><span class="token punctuation">,</span> ws_port<span class="token punctuation">)</span>
<span class="token keyword">end</span>

<span class="token keyword">return</span> _M
</code></pre></div><h2 id="支持-ssh-直连无-ip-容器"><a href="#支持-ssh-直连无-ip-容器" class="header-anchor">#</a> 支持 SSH 直连无 IP 容器</h2> <p>基于 AIPSIX 网关的 TCP 流量转发无法通过插件的形式实现 ，只能定义规则限定指定端口到 IP 的定向传输，通过 Admin API 来一条条定义，实现一个端口对应一个 pod ip 的 tcp 流量转发</p> <p>其实这里通过 admin api 做一个 apisix 的远程规则下发也可以实现一个端口映射一个 IP 的需求，但似乎是性能难以保证，apisix 的负载太重，所以这里敲定的是 DNAT + IPTable 的技术方案</p> <h3 id="编码与参数规范"><a href="#编码与参数规范" class="header-anchor">#</a> 编码与参数规范</h3> <p>驼峰命名：ClusterId，InstanceIp，Cmd，Uid，InstanceIds</p> <p>导出函数注释必须以函数名开头，如</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// SshProxy ...</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SshProxyController<span class="token punctuation">)</span> <span class="token function">SshProxy</span><span class="token punctuation">(</span>
    ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
    environmentInstance <span class="token operator">*</span>table<span class="token punctuation">.</span>DevEnvironmentInstance<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>
<span class="token punctuation">}</span>
</code></pre></div><blockquote><p>你以后字段命名要注意一点。。。我是指沟通上，现在都是我看返回，才知道你是怎么命名的，像是这里，我截图里面命名了 sshProxyDomain，你又自己搞个 sshDomain，把 proxy 去掉了，一个字段，怎么命名，有什么改动，要告知前端</p> <p>你这里后台拼好啊，还要前端来拼啊？你返回个占位符给前端</p></blockquote> <p>在 config.go 中新建字段并通过 <code>yaml:&quot;proxyCommand&quot;</code> 匹配赋值 cfg 中的固定参数（在生产环境中这些配置从七彩石拉下来）</p> <div class="language-cfg extra-class"><pre class="language-text"><code>sshProxyConfig:
  - id: ssh-proxy1
    domain: '%s.ssh-proxy.devcloud.woa.com'        # 访问proxy所用的泛域名, %s为环境id占位符
    instanceIds: ['ins-9bohmdl0']                  # proxy的节点
    region: 'ap-guangzhou'                         # 节点的地域
    maxPort: 50000                                 # 最大端口号
    minPort: 40000                                 # 最小端口号
    unschedulable: false                          # 是否不可调度，如果该字段为true，不往该proxy新增规则
    proxyCommand: 'bash /data/home/nft/nft-ctl.sh add %d %s %d'  # 下发新增规则的命令，占位符依次为端口号，目标ip，目标端口
</code></pre></div><p>拼接 urischeme 时，这里 domain 的占位符 <code>%s</code> 要用实际的 envId 填充，一定要在后台替换掉这个 %s，替换为真实的环境 id</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// 拼接 envId + 泛域名的 domain，替换占位符</span>
domain <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>sshConfig<span class="token punctuation">.</span>Domain<span class="token punctuation">,</span> environmentInstance<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
</code></pre></div><p>sshProxyDomain 和 sshProxyPort 的优先级很高，在 eniDisable 的情况，需要替换掉 scheme 里原有的 url 和 port 进行拼接</p> <p>先在 <strong>DevEnvironmentInstance</strong> 里加两个额外参数，代理 domain 和代理端口，因为拼接参数的时候只接收一个 <code>envIns *table.DevEnvironmentInstance</code></p> <p><strong>models/table/devEnvironmentInstance.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// DevEnvironmentInstance 开发环境实例表</span>
<span class="token keyword">type</span> DevEnvironmentInstance <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    <span class="token comment">// gorm 字段</span>
    <span class="token comment">// ...</span>
    <span class="token comment">// 存储环境对应的task，逻辑字段,不映射表字段存储</span>
    EnvironmentTask       <span class="token operator">*</span>EnvironmentTask <span class="token string">`gorm:&quot;-&quot;`</span>
    OriginalEnvironmentIP <span class="token builtin">string</span>           <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 原始环境IP</span>
    AutoDowngrade         <span class="token builtin">bool</span>             <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 是否自动降级，当前仅H20场景用到</span>
    <span class="token comment">// ssh 代理相关，逻辑字段,不映射表字段存储</span>
    SshProxyDomain <span class="token builtin">string</span> <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 对无 IP 容器进行 ssh 直连的代理泛域名</span>
    SshProxyPort   <span class="token builtin">int</span>    <span class="token string">`gorm:&quot;-&quot;`</span> <span class="token comment">// 对无 IP 容器 ssh 代理的 dnat 中转端口</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里的代理域名和端口在外层处理并封装好：<strong>business/env_settings.go: GetInjectVariable</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>EnvSettingController<span class="token punctuation">)</span> <span class="token function">GetInjectVariable</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
    envIns <span class="token operator">*</span>table<span class="token punctuation">.</span>DevEnvironmentInstance<span class="token punctuation">)</span> <span class="token punctuation">(</span>envs <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>
    <span class="token comment">// 优先 ssh 代理泛域名</span>
    <span class="token keyword">if</span> envIns<span class="token punctuation">.</span>DisableEniIp <span class="token operator">&amp;&amp;</span> envIns<span class="token punctuation">.</span>SshProxyDomain <span class="token operator">!=</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
        url <span class="token operator">=</span> envIns<span class="token punctuation">.</span>SshProxyDomain
    <span class="token punctuation">}</span>
    <span class="token comment">//其次自定义域名</span>
    <span class="token keyword">if</span> url <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">&amp;&amp;</span> domain<span class="token punctuation">.</span>Id <span class="token operator">!=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        url <span class="token operator">=</span> domain<span class="token punctuation">.</span>Domain
    <span class="token punctuation">}</span>
    <span class="token boolean">_</span> <span class="token operator">=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>envIns<span class="token punctuation">.</span>EnvAccessDomains<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>domains<span class="token punctuation">)</span>
    <span class="token comment">//其次默认域名</span>
    <span class="token keyword">if</span> url <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
        fixUrl<span class="token punctuation">,</span> ok <span class="token operator">:=</span> domains<span class="token punctuation">[</span><span class="token string">&quot;fix&quot;</span><span class="token punctuation">]</span>
        <span class="token keyword">if</span> ok <span class="token punctuation">{</span>
            url <span class="token operator">=</span> fixUrl
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//最后ip域名</span>
    <span class="token keyword">if</span> url <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
        url <span class="token operator">=</span> domains<span class="token punctuation">[</span><span class="token string">&quot;dynamics&quot;</span><span class="token punctuation">]</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> url <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
        url <span class="token operator">=</span> envIns<span class="token punctuation">.</span>EnvironmentIP
    <span class="token punctuation">}</span>

    <span class="token comment">//...</span>
    <span class="token comment">// 默认端口36000</span>
    port <span class="token operator">:=</span> <span class="token number">36000</span>
    <span class="token keyword">if</span> envIns<span class="token punctuation">.</span>ServerType <span class="token operator">==</span> cvmContainerServerType <span class="token punctuation">{</span>
        containerInfo <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>envIns<span class="token punctuation">.</span>ContainerInfo<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>containerInfo<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">if</span> portStr<span class="token punctuation">,</span> ok <span class="token operator">:=</span> containerInfo<span class="token punctuation">[</span><span class="token string">&quot;port&quot;</span><span class="token punctuation">]</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
