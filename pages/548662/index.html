yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">大模型驱动的文档类产品<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>大模型驱动产品，确定的 API 变成概率的返回，这将是产品演化的趋势</p> <h2 id="智能体产品概述"><a href="#智能体产品概述" class="header-anchor">#</a> 智能体产品概述</h2> <h3 id="熵增"><a href="#熵增" class="header-anchor">#</a> 熵增</h3> <p>ToC 产品和技术是两回事，既不割裂也不强相关，好的技术不一定产出好的产品，好的产品也不一定依赖绝对好的技术，技术达标 + 用户体验 = 好的产品</p> <p>相应的，如果用户体验不行，这个产品总是不能称之为好，除非技术出现断层式的领先</p> <p>以 toC 的文档服务为例，传统的文库，无非提供存储、下载、搜索等服务，然后通过“卖文档”实现盈利，这之中有两个关键问题</p> <ul><li>搜索质量：用户是否需要动用大量精力才能搜到想要的内容</li> <li>文档质量：用户找到的文档是否值得花钱购买</li></ul> <p>这类产品的核心竞争力，说白了就是用户能否从你的文档库获到值得付费的文档内容</p> <p>但在 AI 时代，搜索的门槛被拉的很低，只需要用一个文本框，一个 query，大模型就能给出一大堆回答，这里不得不考虑一个问题，用户是否还会为“人工搜索、手动筛查、付费下载”这套逻辑买单？包不会的，2025 年百度的广告收益下降 16 个点</p> <blockquote><p>如何立足于“存储”发扬 AI 功能，是 PSIG 是否能存活并增长的核心，这里有两个发展方向，一个是依靠存储发展个性化的 AI（例如提供个体 AI 如 OpenClaw 的记忆服务），一个是依靠存储发展 toB 的 AI 服务（类似于 Saas，但这一套似乎并不奏效），随着智能体的发展，用户 PC 端的使用量显著上升，甚至超过疫情时期的下载量，这充分说明当前 AI 对用户使用习惯的改变，显然电脑更适合与 AI 交互，以将算力转化为可以看得见的生产力，依据云存储提供个性化的 AI 记忆服务是一个很好的点子</p></blockquote> <p>耦合 AI 底座和业务逻辑</p> <ul><li>通过 MCP 将复杂的业务处理能力提供给智能体，智能体通过策略分发找到对应的 MCP 工具，实现一次处理并返回用户，这里是一个嵌套的功能，业务逻辑需要 AI 功能来实现，上层的智能体调用 MCP 获取业务逻辑，实现 AI - Service - AI 的架构</li> <li>也就是说，现在与用户交互的不再是死板的接口，而是一个个智能体，智能体通过预设的 prompt 调用相应的 MCP 获取具体的业务操作，并返回给用户；也可以理解为，从前的 routes 路由实现的业务分发，被智能体调用 MCP 的方式取代了，当然，调用智能体仍然使用某一接口如 /chat 触发</li></ul> <h3 id="自我进化"><a href="#自我进化" class="header-anchor">#</a> 自我进化</h3> <p>在 Robin 看来，「AI能做事只是第一步；能不能判断自己有没有把事情做好，才是效率真正被打开的关键」，如果 AI 验证没做好的话，AI 就会重新迭代、优化，这就形成了一个闭环。这个闭环中如果几乎没有人干预，效率就会很高。目前，已经有伐谋这类工具，基于这个“闭环”的思路帮助许多企业提效，但在更多的场景下，由于目前的工具还不足够成熟，仍然需要依赖人脑来构建这样的闭环，并想办法让 AI 能够验证自己的工作做得好还是不好
Robin 再次重申的，还有上次总监会提过的「希望业务不要训模型，业务训模型是一个熵增的过程」，原因首先是资源层面的。训练模型本身非常耗费算力，而当前行业整体算力依然紧张，卡资源十分珍贵。如果各条业务线都分散去训练自己的模型，不仅投入巨大，也会削弱整体竞争力。而且模型的评估是个很难很复杂的事儿，业务团队往往并不擅长对模型做全面、准确和长期有效的评估。有可能自己训了一个模型短期看效果不错，但实际上再过一个月就会发现效果并没有那么好</p> <p>更关键的是，这样被训出来的模型，极易被基础模型的升级能力所覆盖。这样的结果，就是团队陷入“训一轮、追一轮、再训一轮”的恶性循环，最后做了很多无用功。相比之下，业务更应把精力投入到产品和应用层面，把模型能力真正转化为用户价值和业务结果
2B、2C 和 2P，这次他又做了一轮澄清</p> <ul><li>2B 是企业付费</li> <li>2C 单指靠广告赚钱的模式</li> <li>2P 指的是个人付费</li></ul> <p>Robin 还跟大家传递了一个理念，希望「用 coding 解决所有的问题」。目前普遍的做法还是“机做人审” —— 让 AI 去做事，人来把关、做一些必要环节的 check；再往后的趋势，很可能就是“不允许人 coding”了，这个观点虽然现在听起来比较激进，但如果类比很多其他领域，就会发现在很多事儿机器来做更加精确，并不是人的长项（例如写论文）</p> <h3 id="工作方向"><a href="#工作方向" class="header-anchor">#</a> 工作方向</h3> <p>业务上下游调用复杂，沟通强度大，需要及时发问、总结、提升，以承接开发任务</p> <table><thead><tr><th><strong>培训课程</strong></th> <th><strong>时间</strong></th> <th><strong>状态</strong></th></tr></thead> <tbody><tr><td>码神训练营 QC 考核</td> <td>26/02/05 - 26/02/12</td> <td>完成</td></tr> <tr><td>码神训练营 QAC 考核</td> <td>26/02/05 - 26/02/12</td> <td>完成</td></tr> <tr><td>百度安全课程</td> <td>26/02/05 - 26/02/12</td> <td>完成</td></tr> <tr><td>稳定性意识考试 - RD</td> <td>26/04/01 - 26/04/01</td> <td>完成</td></tr></tbody></table> <p>工作方向</p> <ol><li>开发中要注重代码的执行效率和健壮性</li> <li>对文库的不同业务逻辑进行梳理并落实到文档上，便于分享和以后回顾，尤其是完善各种接口文档和业务流程</li> <li>对于需求中的各种要点要反复推敲，不明白的要及时去核实，遇到的修改点要举一反三，穷举链路，看是否会影响到别的服务，有全局意识</li> <li>合作开发中要及时沟通，明确需求后制定设计方案，并给出对应的排期，要有计划去同步，尽可能的查补漏洞，并提前自己的工期，急事不慌，缓事不怠</li></ol> <h2 id="智能体产品架构及框架"><a href="#智能体产品架构及框架" class="header-anchor">#</a> 智能体产品架构及框架</h2> <h3 id="模型驱动服务"><a href="#模型驱动服务" class="header-anchor">#</a> 模型驱动服务</h3> <p>模型驱动三层架构</p> <ol><li>Genflow：与用户直接交互，实现工作流编排</li> <li>MCP：为 Genflow 提供具体业务能力</li> <li>Strategy：提供例如转码、存储和 AI 等策略接口</li></ol> <p>文库、橙篇、自由画布场景下 AI 助手对话流程</p> <ol><li>用户输入指令</li> <li>意图识别、风控</li> <li>策略分发</li> <li>业务逻辑</li> <li>返回 SSE 流</li></ol> <p>以 Genflow 根据用户文档生成 PPT 流程为例，GF 的一次调用过程如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>用户输入
 ↓
调用 /convertparsesubmit 和 /convertparsesubmit 上传并解析文件 bdjson 至 BOS
 ↓
调用 /filecreate 拿取 BOS 文件并绑定本次对话 queryID 和 chatID
 ↓
调用 /chat 接口，分析用户请求，打向统一的 MCP 调度服务，由该服务返回需要使用到的工具 toolName，而后再去找 function 模块，请求对应的 MCP 服务
 ↓
具体的 MCP 工具实现依赖于下层的策略服务，也就是说，MCP 服务的核心功能是依靠打下层策略实现的，而后同步返回 Genflow
 ↓
策略接口
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>整个链路中，真正的业务逻辑在 function 层实现，GenFlow 上游进行意图识别，下游策略为 function 提供真正的业务能力，同时在状态流转时插入风控、商业化等前置 / 后置服务，构成完整的生 PPT 链路</p> <p>在整个 GenFlow 架构下，后端被分为三层</p> <ul><li>基础：提供底层转码、AI 对话流、文档解析等服务</li> <li>业务：负责组装基础的服务，实现真正的业务逻辑</li> <li>策略：复制工作流设计、策略分发、业务调用等</li></ul> <h3 id="mcp-function-模块"><a href="#mcp-function-模块" class="header-anchor">#</a> MCP function 模块</h3> <blockquote><p>function 库，为 GenFlow 提供内置的 MCP 工具</p></blockquote> <p>GenFlow 上层收到用户请求后，会经过网盘那边的意图识别和策略分发，打到 MCP 模块，即 function 库中的内容，很有意思的链路，MCP 数据通过 Json 协议传输</p> <p>PPT 相关工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>pptagent.go</code></td> <td>处理 HTML PPT 生成流程</td></tr> <tr><td><code>agentppt.go</code></td> <td>Agent PPT 生成工具</td></tr> <tr><td><code>agentpptbase.go</code></td> <td>Agent PPT 基础功能</td></tr> <tr><td><code>agentpptoutline.go</code></td> <td>Agent PPT 大纲生成</td></tr> <tr><td><code>makeppt.go</code></td> <td>传统 PPT 生成工具</td></tr> <tr><td><code>makepptoutline.go</code></td> <td>传统 PPT 大纲生成工具</td></tr> <tr><td><code>makehtmlppt.go</code></td> <td>HTML 格式 PPT 生成</td></tr> <tr><td><code>ppteditor.go</code></td> <td>PPT 编辑功能</td></tr> <tr><td><code>pptgenappbuilder.go</code></td> <td>应用构建器 PPT 生成</td></tr> <tr><td><code>pptgenmultiquery.go</code></td> <td>多查询 PPT 生成</td></tr></tbody></table> <p>Word 文档工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>wordgen.go</code></td> <td>Word 文档生成工具（已废弃）</td></tr> <tr><td><code>wordgenv2.go</code></td> <td>Word 生成工具 V2 版本</td></tr> <tr><td><code>wordedit.go</code></td> <td>Word 文档编辑工具</td></tr> <tr><td><code>wordoutline.go</code></td> <td>Word 大纲生成工具（已废弃）</td></tr> <tr><td><code>wordoutlinev2.go</code></td> <td>Word 大纲生成 V2 版本</td></tr></tbody></table> <p>Excel 表格工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>excelagentv2.go</code></td> <td>Excel Agent V2 工具，支持表格生成和编辑</td></tr> <tr><td><code>exceledit.go</code></td> <td>Excel 编辑工具</td></tr></tbody></table> <p>图片生成工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>imagegen.go</code></td> <td>图片生成工具</td></tr> <tr><td><code>multiimagegen.go</code></td> <td>多图片生成工具</td></tr> <tr><td><code>imggenwp.go</code></td> <td>文链文生图工具</td></tr> <tr><td><code>imgunderstand.go</code></td> <td>图片理解/识别工具</td></tr> <tr><td><code>generateposter.go</code></td> <td>海报生成工具</td></tr> <tr><td><code>generateposterlist.go</code></td> <td>海报列表生成工具</td></tr> <tr><td><code>generatehandcopy.go</code></td> <td>手抄报生成工具</td></tr></tbody></table> <p>搜索工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>websearch.go</code></td> <td>网络搜索工具</td></tr> <tr><td><code>browsesearch.go</code></td> <td>浏览器搜索工具</td></tr> <tr><td><code>getsearch.go</code></td> <td>搜索获取工具</td></tr> <tr><td><code>xueshusearch.go</code></td> <td>学术搜索工具</td></tr> <tr><td><code>knowledgesearch.go</code></td> <td>知识库搜索工具</td></tr> <tr><td><code>knowledgedata.go</code></td> <td>知识库数据获取工具</td></tr> <tr><td><code>wangpansearch.go</code></td> <td>网盘搜索工具</td></tr> <tr><td><code>fileretrieval.go</code></td> <td>文件检索工具</td></tr> <tr><td><code>searchfile.go</code></td> <td>文件搜索工具</td></tr></tbody></table> <p>文档处理工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>basedoc.go</code></td> <td>基础文档处理</td></tr> <tr><td><code>getfileinfo.go</code></td> <td>获取文件信息</td></tr> <tr><td><code>parse.go</code></td> <td>文档解析工具</td></tr> <tr><td><code>convert.go</code></td> <td>文档转换工具</td></tr> <tr><td><code>makedoc.go</code></td> <td>文档创建工具</td></tr></tbody></table> <p>研报生成工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>reportgen.go</code></td> <td>研报生成工具</td></tr> <tr><td><code>report_generate.go</code></td> <td>研报生成（新版本）</td></tr> <tr><td><code>reportgenoutline.go</code></td> <td>研报大纲生成工具</td></tr> <tr><td><code>report_h5.go</code></td> <td>研报 H5 页面生成</td></tr></tbody></table> <p>图表绘制工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>make_frame_chart.go</code></td> <td>框架图/流程图生成</td></tr> <tr><td><code>make_mindmap_chart.go</code></td> <td>思维导图生成</td></tr> <tr><td><code>datachart.go</code></td> <td>数据图表生成</td></tr></tbody></table> <p>多媒体工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>videogen.go</code></td> <td>视频生成工具</td></tr> <tr><td><code>podcastgen.go</code></td> <td>播客生成工具</td></tr> <tr><td><code>storymediagenerate.go</code></td> <td>故事媒体生成工具</td></tr> <tr><td><code>storymediaoutline.go</code></td> <td>故事媒体大纲生成</td></tr></tbody></table> <p>其他工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>uploadfile.go</code></td> <td>文件上传工具</td></tr> <tr><td><code>memorysearch.go</code></td> <td>记忆搜索工具</td></tr> <tr><td><code>memoryrecord.go</code></td> <td>记忆记录工具</td></tr> <tr><td><code>cronjob.go</code></td> <td>定时任务工具</td></tr> <tr><td><code>codegen.go</code></td> <td>代码生成工具</td></tr></tbody></table> <p>接口入口</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>base.go</code></td> <td>MCP 基础服务，定义接口、常量、通用方法</td></tr></tbody></table> <p>这些工具涵盖了内容生成（PPT、Word、Excel、研报）、搜索检索、图片视频生成、文档处理等多个领域，为 GenFlow 提供一个完整的 AIGC 工具生态链</p> <h3 id="gdp-框架的-ioc-和多态实现"><a href="#gdp-框架的-ioc-和多态实现" class="header-anchor">#</a> GDP 框架的 IoC 和多态实现</h3> <p>GDP 整体架构：包含数据库（MySQL）、缓存（Redis）、消息队列（NMQ）、日志系统（Logger）、配置中心（Sula）等等一系列中间件的开发框架</p> <p>GDP ghttp.HandlerFunc 注册和执行逻辑：如何注册一个 http 路由？注册过程在 GDP 框架里做了什么事？</p> <p>注册路由：<strong>ghome/httpserver/router.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>userInfo <span class="token operator">:=</span> rootGroup<span class="token punctuation">.</span><span class="token function">Group</span><span class="token punctuation">(</span><span class="token string">&quot;/user&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 返回一个 Router</span>
<span class="token comment">// 获取用户信息操作路由</span>
userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;any&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/userinfo&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewUserInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserInfoWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;get&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/doclist&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewDocList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserLoginExtraWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;post,get&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/docinfo&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewDocInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserLoginExtraWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>Router 通过统一的 HandleFunc 接口注册 Handler，用于处理 HTTP 请求</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">type</span> Router <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    http<span class="token punctuation">.</span>Handler <span class="token comment">// 继承标准库 net/http 的所有方法</span>

    <span class="token comment">// HandleFunc 注册业务 handler 方式1</span>
    <span class="token comment">//     method  是http方法，如GET、POST,也可以使用逗号来连接同时传入多个，如 &quot;GET,POST&quot;</span>
    <span class="token comment">//             也可以用特殊的 ANY,会自动注册所有( ANY 的取值详见 MethodAny )</span>
    <span class="token comment">//     path    接口地址，如 &quot;/index&quot;,&quot;/user/:name&quot;,&quot;/user/*&quot;。详见 Router</span>
    <span class="token comment">//     handler 是业务的逻辑，执行后会返回一个 Response 对象</span>
    <span class="token comment">//     ms      是该接口特有的中间件函数，一般为风控、日志等等</span>
    <span class="token function">HandleFunc</span><span class="token punctuation">(</span>method <span class="token builtin">string</span><span class="token punctuation">,</span> path <span class="token builtin">string</span><span class="token punctuation">,</span> handler HandlerFunc<span class="token punctuation">,</span> ms <span class="token operator">...</span>MiddleWareFunc<span class="token punctuation">)</span>

    <span class="token comment">// HandleStreamFunc 注册业务 handler 方式2: handler 是业务的逻辑，可以持续的以流式方式输出数据</span>
    <span class="token function">HandleStreamFunc</span><span class="token punctuation">(</span>method <span class="token builtin">string</span><span class="token punctuation">,</span> path <span class="token builtin">string</span><span class="token punctuation">,</span> handler StreamHandlerFunc<span class="token punctuation">,</span> ms <span class="token operator">...</span>MiddleWareFunc<span class="token punctuation">)</span>

    <span class="token comment">// HandleStd 注册业务 handler 方式3: handler 是标准库的 http.HandlerFunc ，比如：</span>
    <span class="token comment">// HandlerStd(&quot;any&quot;, &quot;/abc*&quot;, http.StripPrefix(&quot;/abc&quot;, http.FileServer(http.Dir(&quot;./&quot;))))</span>
    <span class="token function">HandleStd</span><span class="token punctuation">(</span>method <span class="token builtin">string</span><span class="token punctuation">,</span> path <span class="token builtin">string</span><span class="token punctuation">,</span> handler http<span class="token punctuation">.</span>Handler<span class="token punctuation">,</span> ms <span class="token operator">...</span>MiddleWareFunc<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>HandleFunc：常规的 HTTP RR 响应，如上面 ghome 例子中返回文库文档列表</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;get&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/doclist&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewDocList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserLoginExtraWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>HandleStreamFunc：流式接口返回，如 genflow 中的 /chat 接口，返回的将是一个 chatChan 管道</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// registerGenFlowAPI</span>
<span class="token keyword">func</span> <span class="token function">registerGenFlowAPI</span><span class="token punctuation">(</span>router ghttp<span class="token punctuation">.</span>Router<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    router<span class="token punctuation">.</span><span class="token function">HandleStreamFunc</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>MethodPost<span class="token punctuation">,</span> <span class="token string">&quot;/chat&quot;</span><span class="token punctuation">,</span> genflow<span class="token punctuation">.</span>Chat<span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserInfoWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>HandleStd：标准库的 HandlerFunc，但我发现 wenchain/function 库里的全是 HandleStd，可能因为是中间层的缘故，同时 HandleStd 里也有 SSE Handler 的返回</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>mcprouter <span class="token operator">:=</span> router<span class="token punctuation">.</span><span class="token function">Group</span><span class="token punctuation">(</span><span class="token string">&quot;/mcp&quot;</span><span class="token punctuation">)</span>
mcprouter<span class="token punctuation">.</span><span class="token function">HandleStd</span><span class="token punctuation">(</span><span class="token string">&quot;post&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/makepptbyoutline&quot;</span><span class="token punctuation">,</span> mcpapi<span class="token punctuation">.</span><span class="token function">NewMakePPTCallFunc</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>               <span class="token comment">// ppt生成</span>
mcprouter<span class="token punctuation">.</span><span class="token function">HandleStd</span><span class="token punctuation">(</span><span class="token string">&quot;post&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/makepptoutline&quot;</span><span class="token punctuation">,</span> mcpapi<span class="token punctuation">.</span><span class="token function">NewMakePPTOutlineCallFunc</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>          <span class="token comment">// ppt大纲生成</span>
imageService<span class="token punctuation">.</span><span class="token function">HandleStd</span><span class="token punctuation">(</span><span class="token string">&quot;post&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/imageanalysesse&quot;</span><span class="token punctuation">,</span> image<span class="token punctuation">.</span><span class="token function">NewImageAnalyseSSE</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">//图片理解sse</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>Handler 的实现（Controller 的实现），第一步：定义一个处理业务的结构体，接收请求参数，例如</p> <p><strong>ghome/controller/user/doclist.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">type</span> docList <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    reqParams docListParam
<span class="token punctuation">}</span>

<span class="token keyword">type</span> docListParam <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    <span class="token comment">// ... 略</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>第二步：实现 InitBase、OnInit 和 OnExecute 方法（和 Gin 一样）</p> <ul><li>OnInit 主要是做一些参数过滤，业务级别的鉴权，反作弊和频率控制</li> <li>OnExecute 是业务主逻辑实现</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// InitBase 初始化基础控制器，将基础控制器传入函数中</span>
<span class="token comment">// 参数：b *mcpapibasecontrol.BaseController - 基础控制器指针</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>u <span class="token operator">*</span>makepptoutlineCallFunc<span class="token punctuation">)</span> <span class="token function">InitBase</span><span class="token punctuation">(</span>b <span class="token operator">*</span>mcpapibasecontrol<span class="token punctuation">.</span>BaseController<span class="token punctuation">)</span> <span class="token punctuation">{</span>
	u<span class="token punctuation">.</span>base <span class="token operator">=</span> b
	<span class="token keyword">if</span> u<span class="token punctuation">.</span>base <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span>
	<span class="token punctuation">}</span>
	u<span class="token punctuation">.</span>base<span class="token punctuation">.</span>OuterName <span class="token operator">=</span> mcpapibasecontrol<span class="token punctuation">.</span>OuterWcSSE
	u<span class="token punctuation">.</span>base<span class="token punctuation">.</span>Logger <span class="token operator">=</span> resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// OnInit 请求初始化处理</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>d <span class="token operator">*</span>docList<span class="token punctuation">)</span> <span class="token function">OnInit</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> next frame<span class="token punctuation">.</span>MiddleWareQueue<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    c <span class="token operator">:=</span> gin<span class="token punctuation">.</span>Context<span class="token punctuation">{</span>
        Request<span class="token punctuation">:</span> req<span class="token punctuation">.</span><span class="token function">HTTPRequest</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> err <span class="token operator">:=</span> c<span class="token punctuation">.</span><span class="token function">ShouldBind</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>d<span class="token punctuation">.</span>reqParams<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> wkerror<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>wkerror<span class="token punctuation">.</span>ErrorCodeParamsError<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> err <span class="token operator">:=</span> d<span class="token punctuation">.</span><span class="token function">paramCheck</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>

    <span class="token keyword">return</span> next<span class="token punctuation">.</span><span class="token function">Next</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>d <span class="token operator">*</span>docList<span class="token punctuation">)</span> <span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    docListRes <span class="token operator">:=</span> <span class="token operator">&amp;</span>userDocHomeListRes<span class="token punctuation">{</span><span class="token punctuation">}</span>
    docType <span class="token operator">:=</span> d<span class="token punctuation">.</span>reqParams<span class="token punctuation">.</span>Type
    <span class="token comment">// ... 略</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br></div></div><p>实际上，这两个方法隐式实现了 Initializer 和 Executor 这两个接口，这是框架 frame.go 的内容</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// Initializer 业务流程初始化接口</span>
<span class="token keyword">type</span> Initializer <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    <span class="token comment">// 业务流程初始化，最外层的中间件</span>
    <span class="token comment">// 建议参数过滤，业务级别鉴权，反作弊和频率控制等可以在此执行，也可以向里细分中间件分层执行。</span>
    <span class="token comment">// 接受context和request，next，next用于可以执行下一级别的中间件。</span>
    <span class="token function">OnInit</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> next MiddleWareQueue<span class="token punctuation">)</span> <span class="token punctuation">(</span>data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// Executor 业务代码主干部分执行接口</span>
<span class="token keyword">type</span> Executor <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    <span class="token comment">// 业务主干流程，业务最内层的&quot;中间件&quot;，阉割了next参数，防止业务继续调用Next。</span>
    <span class="token comment">// 建议在此做主干的接口业务，复杂业务请考虑接口是否可以拆分分层，向外拓展分层</span>
    <span class="token comment">// 接受context和request，返回data以及error，用于渲染</span>
    <span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span>data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>在 frame.go 里</p> <ol><li>ExecutorNew 作为工厂函数返回 Executor 和一个中间件列表</li> <li>NewCommonHandle 方法接收 ExecutorNew，处理所有函数 func，构建 ghttp.HandlerFunc</li></ol> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// ExecutorNew 是Executor的构造函数，并返回需要注册额外的MiddleWareFunc列表</span>
<span class="token comment">// 构造一个新的业务对象，不同请求下的业务对象都是新生成的，除非业务自己实现了引用，否则每个对象相互独立</span>
<span class="token comment">// MiddleWareFunc的内容也是延迟构造的，MiddleWareFunc本身也可以拿到本次请求的独立业务对象，因此各个业务层的中间件可以是带状态的</span>
<span class="token keyword">type</span> ExecutorNew <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>Executor<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>MiddleWareFunc<span class="token punctuation">)</span>

<span class="token comment">// NewCommonHandle 以e创建一个Handle</span>
<span class="token keyword">func</span> <span class="token function">NewCommonHandle</span><span class="token punctuation">(</span>e ExecutorNew<span class="token punctuation">,</span> opts <span class="token operator">...</span>Option<span class="token punctuation">)</span> ghttp<span class="token punctuation">.</span>HandlerFunc <span class="token punctuation">{</span>
    newFrame <span class="token operator">:=</span> <span class="token operator">&amp;</span>commonHandleFrame<span class="token punctuation">{</span>
        <span class="token builtin">new</span><span class="token punctuation">:</span> e<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> opt <span class="token operator">:=</span> <span class="token keyword">range</span> opts <span class="token punctuation">{</span>
        opt<span class="token punctuation">.</span><span class="token function">apply</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>newFrame<span class="token punctuation">.</span>opts<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    newFrame<span class="token punctuation">.</span>opts<span class="token punctuation">.</span><span class="token function">applyDefaultOption</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">return</span> newFrame<span class="token punctuation">.</span>do
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>框架内部的处理过程：将所有的方法连同 OnInit 和 OnExecute 都包装成中间件丢到 []frame.MiddleWareFunc 里（OnInit 在倒数第二个，OnExecute 在倒数第一个），触发时，将挨个调用 next.Next 执行这些中间件，构成链路递归</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>r <span class="token operator">*</span>commonHandleFrame<span class="token punctuation">)</span> <span class="token function">do</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span>resp ghttp<span class="token punctuation">.</span>Response<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 第1步：调用工厂函数，创建业务对象</span>
    e<span class="token punctuation">,</span> funcs <span class="token operator">:=</span> r<span class="token punctuation">.</span><span class="token function">new</span><span class="token punctuation">(</span><span class="token punctuation">)</span>  <span class="token comment">// 这里得到 *docList，每一次 HTTP 打来，都会新建一个业务实例 e</span>
    
    <span class="token comment">// 第2步：检查是否实现了 Initializer 接口</span>
    initializer<span class="token punctuation">,</span> ok <span class="token operator">:=</span> e<span class="token punctuation">.</span><span class="token punctuation">(</span>Initializer<span class="token punctuation">)</span>  <span class="token comment">// 接口断言</span>
    
    <span class="token comment">// 第3步：将 OnExecute 包装成最后一个中间件</span>
    funcs <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>funcs<span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> <span class="token boolean">_</span> MiddleWareQueue<span class="token punctuation">)</span> <span class="token punctuation">(</span>data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> e<span class="token punctuation">.</span><span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>  <span class="token comment">// 这里调用 docList.OnExecute</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>
    
    <span class="token comment">// 第4步：构建中间件链并执行</span>
    next <span class="token operator">:=</span> <span class="token function">NewMiddleWareQueue</span><span class="token punctuation">(</span>funcs<span class="token punctuation">)</span>
    data<span class="token punctuation">,</span> err <span class="token operator">=</span> next<span class="token punctuation">.</span><span class="token function">Next</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
    
    <span class="token keyword">return</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>体现到应用层的使用即为，传入一个匿名函数（实则为 <code>ExecutorNew</code>），把刚刚实现了 <code>OnInit</code> 和 <code>OnExecute</code> 的 <code>docList</code> 作为 <code>Executor</code> 返回，同时将日志记录作为中间件函数传进去，<code>NewCommonHandle</code> 接收这个 <code>ExecutorNew</code> 方法，触发 <code>do</code> 方法，按照中间件方法依次执行的顺序构造 <code>ghttp.HandlerFunc</code> 函数返回</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">NewDocList</span><span class="token punctuation">(</span><span class="token punctuation">)</span> ghttp<span class="token punctuation">.</span>HandlerFunc <span class="token punctuation">{</span>
    feedWareFunc <span class="token operator">:=</span> frame<span class="token punctuation">.</span><span class="token function">FeedSampleWareFunc</span><span class="token punctuation">(</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token punctuation">)</span>

    <span class="token keyword">return</span> frame<span class="token punctuation">.</span><span class="token function">NewCommonHandle</span><span class="token punctuation">(</span>
        <span class="token comment">// 工厂方法</span>
        <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>frame<span class="token punctuation">.</span>Executor<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>frame<span class="token punctuation">.</span>MiddleWareFunc<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            d <span class="token operator">:=</span> <span class="token operator">&amp;</span>docList<span class="token punctuation">{</span><span class="token punctuation">}</span>
            <span class="token keyword">return</span> d<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>frame<span class="token punctuation">.</span>MiddleWareFunc<span class="token punctuation">{</span>feedWareFunc<span class="token punctuation">}</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>可以发现</p> <ul><li>函数是 Golang 的一等公民，最后绑定到接口 /doclist 上的，其实是一连串函数顺序构造的 <code>ghttp.HandlerFunc</code></li> <li>通过实现 <code>OnInit</code> 和 <code>OnExecute</code> 方法构造 <code>Executor</code>，再通过工厂模式将 <code>Executor</code> 涉及的所有方法注册成<code>ghttp.HandlerFunc</code>，是 GDP 实现 Controller 控制反转的方式，每一个 HTTP 请求都会触发一次 <code>r.new()</code>，即每个请求都有独立的 <code>docList</code>，每个实例里的 <code>reqParams</code> 也不会串数据，从而避免并发问题</li> <li>虽然 Go 没有继承，但通过工厂模式、接口和函数传递一样能够实现多态，相比于 Java 的编码更扁平，更模块化</li></ul> <h2 id="代码逻辑实现"><a href="#代码逻辑实现" class="header-anchor">#</a> 代码逻辑实现</h2> <h3 id="前置风控与小流量"><a href="#前置风控与小流量" class="header-anchor">#</a> 前置风控与小流量</h3> <p>请求打进来，意图识别 Agent，枚举类型分配 MCP 工具，或者前端传参带工具名强制命中，而后在业务侧进行异步的风控检查</p> <p>例如对内部图片链接进行风控，业务侧调用风控接口而已，传入拿到的 url，交给下层微服务处理</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>imgUrlInner <span class="token operator">:=</span> <span class="token function">getInnerUrl</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> oriURL<span class="token punctuation">)</span>
Risk<span class="token punctuation">,</span> err <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">RunWenchainRisk</span><span class="token punctuation">(</span>

            ImgUrls<span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span>imgUrlInner<span class="token punctuation">}</span><span class="token punctuation">,</span>

    <span class="token punctuation">}</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span>
<span class="token comment">//这里不检查IsRiskAbnormal，风控稳定性不阻塞业务流程</span>
<span class="token keyword">if</span> Risk <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">||</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">||</span> Risk<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>IsRiskCheck <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> wkerror<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>aigc<span class="token punctuation">.</span>ImgRiskError<span class="token punctuation">,</span> <span class="token string">&quot;this img is not allowed&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

 punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> fileIDs <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> seconds <span class="token builtin">int</span><span class="token punctuation">,</span> baseParams base<span class="token punctuation">.</span>AIGCParams<span class="token punctuation">)</span> <span class="token punctuation">(</span>

    processingFiles <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">)</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br></div></div><h3 id="商业化回调"><a href="#商业化回调" class="header-anchor">#</a> 商业化回调</h3> <p>生成文档时，商业化回调，根据文档是否是长文 isLong 字段进行计费，实现用户的商业化权益操作（消费、冻结、解冻、查询），预占用 + 实际扣费的商业化模式</p> <ol><li>用户发送生 PPT 请求</li> <li>权益检查，若有权益，则触发冻结，同时生成生 PPT 任务，异步执行</li> <li>生 PPT 任务为 SSE 输出，结束帧返回后，会回调商业化接口，根据任务具体的执行情况决定是解冻还是扣费</li></ol> <div class="language- line-numbers-mode"><pre class="language-text"><code>用户触发 AI 工具
    ↓
[Get] 查询 CommercialGet
    ├─ 调用 IsHasTicketNew() → GetAll() 查询剩余次数
    └─ 判断：剩余次数 &gt;= 使用次数？否 → 拦截，返回提示
    ↓
[Freeze] 预占用阶段（防止并发）
    ├─ 冻结 1 次权益（30 分钟）
    └─ 返回冻结成功
    ↓
[执行 AI 生成任务] （耗时较长）
    ↓
    ├─ 成功 → [Consume] 真正扣费 + [UnFreeze] 释放预占用
    └─ 失败 → [UnFreeze] 释放预占用（不扣费）
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>核心逻辑：根据用户当前行为响应，实现拦截重复消费，撤销预扣费等逻辑</p> <p><strong>doc: /service/gdoc/configcallback</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>tool <span class="token operator">:=</span> toolItem
useCnt <span class="token operator">:=</span> toolMap<span class="token punctuation">[</span>tool<span class="token punctuation">.</span>ToolName<span class="token punctuation">]</span>
<span class="token comment">// g.Go(func() error {</span>
hitActs <span class="token operator">:=</span> <span class="token boolean">false</span>
hitUsesTimes <span class="token operator">:=</span> <span class="token boolean">false</span>

<span class="token comment">// 消费权益动作</span>
<span class="token keyword">if</span> obj<span class="token punctuation">.</span>configCallbackParams<span class="token punctuation">.</span>Action <span class="token operator">==</span> ActionConsume <span class="token punctuation">{</span>
    <span class="token comment">// consume</span>
    err <span class="token operator">:=</span> obj<span class="token punctuation">.</span><span class="token function">CommercialConsume</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> toolItem<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token comment">// 请求商业化服务失败，不拦截</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;CommercialConsume error&quot;</span><span class="token punctuation">,</span>
            logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
        hitUsesTimes <span class="token operator">=</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token comment">// 冻结行为</span>
<span class="token keyword">if</span> obj<span class="token punctuation">.</span>configCallbackParams<span class="token punctuation">.</span>Action <span class="token operator">==</span> ActionFreeze <span class="token punctuation">{</span>
    <span class="token comment">// freeze</span>
    <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> obj<span class="token punctuation">.</span><span class="token function">CommercialFreeze</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> toolItem<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token comment">// 请求商业化服务失败，不拦截</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;CommercialFreeze error&quot;</span><span class="token punctuation">,</span>
            logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
        hitUsesTimes <span class="token operator">=</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token comment">// 解冻行为</span>
<span class="token keyword">if</span> obj<span class="token punctuation">.</span>configCallbackParams<span class="token punctuation">.</span>Action <span class="token operator">==</span> ActionUnFreeze <span class="token punctuation">{</span>
    <span class="token comment">// unfreeze</span>
    <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> obj<span class="token punctuation">.</span><span class="token function">CommercialUnFreeze</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> toolItem<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token comment">// 请求商业化服务失败，不拦截</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;CommercialUnFreeze error&quot;</span><span class="token punctuation">,</span>
            logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
        hitUsesTimes <span class="token operator">=</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token comment">// 权益查询, 不会触发频控</span>
<span class="token keyword">if</span> obj<span class="token punctuation">.</span>configCallbackParams<span class="token punctuation">.</span>Action <span class="token operator">==</span> ActionGet <span class="token punctuation">{</span>
    hitUsesTimes <span class="token operator">=</span> obj<span class="token punctuation">.</span><span class="token function">CommercialGet</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> toolItem<span class="token punctuation">,</span> useCnt<span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// set ret</span>
tl <span class="token operator">:=</span> ToolList<span class="token punctuation">{</span>
    ToolName<span class="token punctuation">:</span>     tool<span class="token punctuation">.</span>ToolName<span class="token punctuation">,</span>
    HitActs<span class="token punctuation">:</span>      hitActs<span class="token punctuation">,</span>
    HitUsesTimes<span class="token punctuation">:</span> hitUsesTimes<span class="token punctuation">,</span>
    TrialTimes<span class="token punctuation">:</span>   <span class="token boolean">nil</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br></div></div><p>文档的生成结果 isLong 的判断在从策略的返回中拿，通过业务的商业化帧传到前端，前端识别到商业化帧后，取到 isLong 再去回调商业化计费函数实现解冻扣费，也就是说，在文章生成完之后，才知道是不是长文，再进行相应的扣费回调</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>wordGenV2File<span class="token punctuation">.</span>FileInfo <span class="token operator">=</span> fileInfo
wordGenV2File<span class="token punctuation">.</span>IsLong <span class="token operator">=</span> strategyRespFrame<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>ContentItem<span class="token punctuation">.</span>IsLong <span class="token comment">// 商业化帧</span>

wordGenV2File<span class="token punctuation">.</span>IsLongText <span class="token operator">=</span> <span class="token string">&quot;0&quot;</span>
<span class="token keyword">if</span> wordGenV2File<span class="token punctuation">.</span>IsLong <span class="token punctuation">{</span>
    wordGenV2File<span class="token punctuation">.</span>IsLongText <span class="token operator">=</span> <span class="token string">&quot;1&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>这里想改造成根据用户意图进行计费，即在请求打进来时，判断用户要生成的文档类型 AIType，直接根据文档类型确定计费标准</p> <p>另外有一个很重要的点，冻结 30 分钟后，如果持续没有取消或者消费行为，这次冻结将被解冻并返还点数</p> <ul><li>用户主动取消，解冻并返还点数</li> <li>用户被动取消，例如暂停 GenFlow，或者生成了大纲没有后续生成文档动作，在 30min 后这次冻结将被系统自动解冻并返还点数</li></ul> <p>这里的 30min 自动解冻怎么实现的？没有抄到这个点，难受捏</p> <ol><li>cron 定时任务</li> <li>redis zset 扫描</li> <li>rabbitmq 死信队列，缓冲队列和业务队列</li> <li>时间轮算法</li></ol></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/e9c57b/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">语言模型的文档生成</div></a> <a href="/pages/2bb10d/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">高并发与高可用场景</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
