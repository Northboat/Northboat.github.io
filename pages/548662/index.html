	<span class="token comment">// DaoIDTypeDocID db查询条件是doc_id</span>
	DaoIDTypeDocID <span class="token operator">=</span> <span class="token number">1</span>
	<span class="token comment">// DaoIDTypeStoreID db查询条件是store_id</span>
	DaoIDTypeStoreID <span class="token operator">=</span> <span class="token number">2</span>
<span class="token punctuation">)</span>

<span class="token keyword">var</span> <span class="token punctuation">(</span>
	cMap configMap <span class="token operator">=</span> configMap<span class="token punctuation">{</span>m<span class="token punctuation">:</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span>Config<span class="token punctuation">)</span><span class="token punctuation">}</span>

	<span class="token comment">// ErrFieldNotRegistered 使用的缓存字段未注册</span>
	ErrFieldNotRegistered <span class="token operator">=</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;cache field not registered&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">)</span>

<span class="token comment">// Field 缓存内容在hash表中的Field类型</span>
<span class="token keyword">type</span> Field <span class="token builtin">string</span>

<span class="token comment">// Config 注册一个Cache所需要的信息，</span>
<span class="token comment">// Field表征字段的key</span>
<span class="token comment">// DaoFunc指在未命中缓存时的数据生成方法，需要满足形式func(ctx context.Context, id uint64) ((pointer to struct, error)</span>
<span class="token comment">// DaoIDType 指DaoFunc输入的ID类型</span>
<span class="token comment">// ExpireTime 缓存的过期时间</span>
<span class="token keyword">type</span> Config <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	Field      Field
	DaoFunc    <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
	DaoIDType  <span class="token builtin">int</span>
	ExpireTime time<span class="token punctuation">.</span>Duration

	<span class="token comment">// 存储的结构体类型</span>
	cacheStructType reflect<span class="token punctuation">.</span>Type
<span class="token punctuation">}</span>

<span class="token comment">// configMap 用于存储Config的映射关系</span>
<span class="token keyword">type</span> configMap <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	m <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span>Config
	sync<span class="token punctuation">.</span>Mutex
<span class="token punctuation">}</span>

<span class="token comment">// MustRegister 注册一批缓存conf，如果不合法直接panic</span>
<span class="token keyword">func</span> <span class="token function">MustRegister</span><span class="token punctuation">(</span>conf <span class="token operator">...</span>Config<span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">Register</span><span class="token punctuation">(</span>conf<span class="token operator">...</span><span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token function">panic</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token comment">// Register 注册一个缓存</span>
<span class="token keyword">func</span> <span class="token function">Register</span><span class="token punctuation">(</span>conf <span class="token operator">...</span>Config<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
	cMap<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> cMap<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> c <span class="token operator">:=</span> <span class="token keyword">range</span> conf <span class="token punctuation">{</span>
		<span class="token comment">// 检查Key是否有重复</span>
		<span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> ok <span class="token operator">:=</span> cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>c<span class="token punctuation">.</span>Field<span class="token punctuation">]</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
			<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;cache field already exists, field: %s&quot;</span><span class="token punctuation">,</span> c<span class="token punctuation">.</span>Field<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 检查DaoIDType是否合法</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">!=</span> DaoIDTypeDocID <span class="token operator">&amp;&amp;</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">!=</span> DaoIDTypeStoreID <span class="token punctuation">{</span>
			<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;illegal DaoIDType: %d&quot;</span><span class="token punctuation">,</span> c<span class="token punctuation">.</span>DaoIDType<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 如果c.ExpireTime小于0，则使用默认的基础过期时间</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span>ExpireTime <span class="token operator">&lt;=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			c<span class="token punctuation">.</span>ExpireTime <span class="token operator">=</span> defaultFieldExpireTime
		<span class="token punctuation">}</span>

		<span class="token comment">// 检查DaoFunc是否合法</span>
		fType <span class="token operator">:=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span>DaoFunc<span class="token punctuation">)</span>
		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Func <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;DaoFunc must be a func&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">NumIn</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;number of DaoFunc parameters must be 2&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">NumOut</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;number of DaoFunc return values must be 2&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">In</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>context<span class="token punctuation">.</span>Context<span class="token punctuation">)</span><span class="token punctuation">(</span><span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;first parameter of DaoFunc must be context.Context interface&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">In</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Uint64 <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;second parameter of DaoFunc must be uint64&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Ptr <span class="token operator">||</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Struct <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;first return value of DaoFunc must be pointer to struct&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span><span class="token builtin">error</span><span class="token punctuation">)</span><span class="token punctuation">(</span><span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;second return value of DaoFunc must be error interface&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 设置DaoFunc返回的结果并注册到map</span>
		c<span class="token punctuation">.</span>cacheStructType <span class="token operator">=</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>c<span class="token punctuation">.</span>Field<span class="token punctuation">]</span> <span class="token operator">=</span> c
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="redis-缓存存取"><a href="#redis-缓存存取" class="header-anchor">#</a> Redis 缓存存取</h3> <p>文档缓存，对外暴露的缓存读取接口</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// WithCache 同时获取多个 field 的数据，优先从缓存中读取，不存在则使用传入的 dataOps 读取</span>
<span class="token keyword">func</span> <span class="token function">WithCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	itemInfoMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>

	filteredFields<span class="token punctuation">,</span> storeID <span class="token operator">:=</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> itemInfoMap<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中全部查询完毕，返回</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 函数退出时延迟存储缓存</span>
	dbResMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>dbResMap<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">setCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> dbResMap<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set conv_range info to cache failed, docID=%d, err=%s&quot;</span><span class="token punctuation">,</span> docID<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中没有查到的从db查询</span>
	dbResMap<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">goGetFieldFromDB</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> filteredFields<span class="token punctuation">,</span> storeID<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>

	<span class="token comment">// 合并两个map</span>
	<span class="token keyword">for</span> field<span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> dbResMap <span class="token punctuation">{</span>
		itemInfoMap<span class="token punctuation">[</span>field<span class="token punctuation">]</span> <span class="token operator">=</span> value
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>defer 的作用是延迟逻辑，在函数返回时才执行，相当于定义一个回调函数，其作用域等同于函数内部</p> <p>其中，getFieldFromCache 从 Redis 中取缓存，逻辑如下</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getFieldCache 从缓存中获取指定field的数据，并检查field中是否有需要storeID作为主键的数据</span>
<span class="token comment">// 将cache中查询到的内容，写入itemInfoMap，并返回未查询到的field列表</span>
<span class="token keyword">func</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> itemInfoMap <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token builtin">uint64</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token comment">// 从缓存中获取所有filed的数据</span>
	cacheDatas<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token comment">// GetCache中出错也会把成功的结果返回</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token comment">// 查询出错</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;get cache failed, err=%s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 缓存中未查到数据，直接返回。</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>cacheDatas<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> fields<span class="token punctuation">,</span> <span class="token number">0</span>
	<span class="token punctuation">}</span>
	filteredFields <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>fields<span class="token punctuation">)</span><span class="token punctuation">)</span>

	storeID <span class="token operator">:=</span> <span class="token function">uint64</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> f <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		<span class="token comment">//增加了cacheDatas[f] != nil的判断，正常获取不需要添加，避免缓存中数据为nil，但db有值的情况，后续docstore迁移后可直接读取db服务</span>
		<span class="token keyword">if</span> cacheData<span class="token punctuation">,</span> has <span class="token operator">:=</span> cacheDatas<span class="token punctuation">[</span>f<span class="token punctuation">]</span><span class="token punctuation">;</span> has <span class="token operator">&amp;&amp;</span> cacheData <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			itemInfoMap<span class="token punctuation">[</span>f<span class="token punctuation">]</span> <span class="token operator">=</span> cacheData
			<span class="token comment">// 如果成功取到缓存的数据中有实现StoreIDGetter接口，获取StoreID</span>
			<span class="token keyword">if</span> storeID <span class="token operator">==</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> cacheData <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">if</span> getter<span class="token punctuation">,</span> ok <span class="token operator">:=</span> cacheData<span class="token punctuation">.</span><span class="token punctuation">(</span>StoreIDGetter<span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
					storeID <span class="token operator">=</span> getter<span class="token punctuation">.</span><span class="token function">StoreID</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
				<span class="token punctuation">}</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
			<span class="token comment">// 在缓存中不存在，准备进行db查询</span>
			filteredFields <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">,</span> f<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> filteredFields<span class="token punctuation">,</span> storeID
<span class="token punctuation">}</span>
</code></pre></div><p>获取单个缓存数据</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getCache 从缓存中获取数据，支持同时获取多个field中的数据，返回一个map,不存在的或者失败的field不写入map中</span>
<span class="token keyword">func</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> id <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	fl <span class="token operator">:=</span> <span class="token function">len</span><span class="token punctuation">(</span>fields<span class="token punctuation">)</span>
	<span class="token keyword">if</span> fl <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;fields must given, but fields is empty&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	cp <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	fieldArr <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> fl<span class="token punctuation">)</span>

	key <span class="token operator">:=</span> <span class="token function">generateKey</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>

	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> field <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		fieldArr <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>fieldArr<span class="token punctuation">,</span> field<span class="token punctuation">.</span><span class="token function">String</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	sc <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>DocPush<span class="token punctuation">.</span><span class="token function">HMGet</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> fieldArr<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;GetCache: hmget failed, key=%s, field=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> fields<span class="token punctuation">,</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	res<span class="token punctuation">,</span> err <span class="token operator">:=</span> sc<span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;GetCache: hmget failed, key=%s, field=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> fields<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">for</span> i<span class="token punctuation">,</span> field <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		<span class="token comment">// 单个field不存在，不将这个field填入map</span>
		<span class="token keyword">if</span> res<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		valStr <span class="token operator">:=</span> <span class="token string">&quot;&quot;</span>
		ok <span class="token operator">:=</span> <span class="token boolean">false</span>
		<span class="token keyword">if</span> valStr<span class="token punctuation">,</span> ok <span class="token operator">=</span> res<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 解外层包装, 失败的话当成缓存中没有这个field</span>
		c<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">unpackCacheData</span><span class="token punctuation">(</span>valStr<span class="token punctuation">)</span>
		<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;unpack cache error, key=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 检查该field中的数据是否已过期</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span>ExpireAt <span class="token operator">&lt;</span> time<span class="token punctuation">.</span><span class="token function">Now</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Unix</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 如果缓存的数据是空，表示缓存值为nil</span>
		<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span>Data<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			cp<span class="token punctuation">[</span>field<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token boolean">nil</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// field未注册，业务流程不正常，需要返回error，方便业务发现错误</span>
		conf<span class="token punctuation">,</span> ok <span class="token operator">:=</span> cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>field<span class="token punctuation">]</span>
		<span class="token keyword">if</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Fatal</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;cache field not register, field=%s, err=%s&quot;</span><span class="token punctuation">,</span> field<span class="token punctuation">,</span> ErrFieldNotRegistered<span class="token punctuation">)</span><span class="token punctuation">)</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 检查field对应的struct是否有实现unmarshal方法</span>
		<span class="token keyword">var</span> data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
		<span class="token comment">// 每次生成新struct</span>
		i <span class="token operator">:=</span> reflect<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>conf<span class="token punctuation">.</span>cacheStructType<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Interface</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		<span class="token keyword">if</span> v<span class="token punctuation">,</span> ok <span class="token operator">:=</span> i<span class="token punctuation">.</span><span class="token punctuation">(</span>Unmarshaler<span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
			err <span class="token operator">=</span> v<span class="token punctuation">.</span><span class="token function">UnmarshalCache</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span>Data<span class="token punctuation">)</span>
			data <span class="token operator">=</span> v
		<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
			err <span class="token operator">=</span> <span class="token function">defaultUnmarshaler</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span>Data<span class="token punctuation">,</span> i<span class="token punctuation">)</span>
			data <span class="token operator">=</span> i
		<span class="token punctuation">}</span>

		<span class="token comment">// unmarshal失败</span>
		<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;unmarshal cache error, key=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		cp<span class="token punctuation">[</span>field<span class="token punctuation">]</span> <span class="token operator">=</span> data
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> cp<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>设置缓存：随机过期时间防止击穿</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// setCache 保存数据到缓存中，支持保存多个field的数据</span>
<span class="token keyword">func</span> <span class="token function">setCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> id <span class="token builtin">uint64</span><span class="token punctuation">,</span> dataMap <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>

	<span class="token comment">// storeID 准备就绪</span>
	<span class="token keyword">if</span> storeID <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		storeIDReadyClosed<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token function">close</span><span class="token punctuation">(</span>storeIDReady<span class="token punctuation">)</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> field <span class="token operator">:=</span> <span class="token keyword">range</span> filteredFields <span class="token punctuation">{</span>
		<span class="token comment">// field未注册，业务流程不正常，需要返回error，方便业务发现错误</span>
		conf<span class="token punctuation">,</span> ok <span class="token operator">:=</span> cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>field<span class="token punctuation">]</span>
		<span class="token keyword">if</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Fatal</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;cache field not register, field=%s, err=%s&quot;</span><span class="token punctuation">,</span> field<span class="token punctuation">,</span> ErrFieldNotRegistered<span class="token punctuation">)</span><span class="token punctuation">)</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		wg<span class="token punctuation">.</span><span class="token function">Add</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span>
		<span class="token comment">// 对使用docID进行查询的单独计数，因为没有依赖关系</span>
		<span class="token keyword">if</span> conf<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeDocID <span class="token punctuation">{</span>
			docWg<span class="token punctuation">.</span><span class="token function">Add</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span>c Config<span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">var</span> daoRes <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span>

			<span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				<span class="token keyword">if</span> r <span class="token operator">:=</span> <span class="token function">recover</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> r <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
					mu<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
					daoErr <span class="token operator">=</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;go func run error, err=%v&quot;</span><span class="token punctuation">,</span> r<span class="token punctuation">)</span>
					mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
					resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Fatal</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;go func panic, err=%v&quot;</span><span class="token punctuation">,</span> r<span class="token punctuation">)</span><span class="token punctuation">)</span>
				<span class="token punctuation">}</span>

				<span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeDocID <span class="token punctuation">{</span>
					docWg<span class="token punctuation">.</span><span class="token function">Done</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
				<span class="token punctuation">}</span>
				wg<span class="token punctuation">.</span><span class="token function">Done</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
			<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

			<span class="token comment">// storeID类型的等待storeID准备就绪</span>
			<span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeStoreID <span class="token punctuation">{</span>
				<span class="token keyword">select</span> <span class="token punctuation">{</span>
				<span class="token comment">// 等待storeID准备就绪</span>
				<span class="token keyword">case</span> <span class="token operator">&lt;-</span>storeIDReady<span class="token punctuation">:</span>
				<span class="token comment">// 超时结束goroutine，防止协程未被正常关闭造成协程泄漏</span>
				<span class="token keyword">case</span> <span class="token operator">&lt;-</span>ctx<span class="token punctuation">.</span><span class="token function">Done</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
					<span class="token keyword">return</span>
				<span class="token punctuation">}</span>
			<span class="token punctuation">}</span>

			<span class="token keyword">var</span> id <span class="token builtin">uint64</span>
			<span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeDocID <span class="token punctuation">{</span>
				id <span class="token operator">=</span> docID
			<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeStoreID <span class="token punctuation">{</span>
				<span class="token comment">// 检查输入store_id，如果store_id为0，则未获取到storeId，不需要进一步dao操作</span>
				<span class="token keyword">if</span> storeID <span class="token operator">&lt;=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
					<span class="token keyword">return</span>
				<span class="token punctuation">}</span>
				id <span class="token operator">=</span> storeID
			<span class="token punctuation">}</span>

			in <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>reflect<span class="token punctuation">.</span>Value<span class="token punctuation">{</span>
				reflect<span class="token punctuation">.</span><span class="token function">ValueOf</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">,</span>
				reflect<span class="token punctuation">.</span><span class="token function">ValueOf</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">,</span>
			<span class="token punctuation">}</span>

			<span class="token comment">// 注册函数时，保证函数结构为 f(ctx, id)(ptrToS, error)</span>
			out <span class="token operator">:=</span> reflect<span class="token punctuation">.</span><span class="token function">ValueOf</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span>DaoFunc<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Call</span><span class="token punctuation">(</span>in<span class="token punctuation">)</span>

			<span class="token comment">// 第一个返回值是一个指针，在不为nil的情况下赋值interface{}，防止后续逻辑错乱</span>
			<span class="token keyword">if</span> <span class="token operator">!</span>out<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token function">IsNil</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				daoRes <span class="token operator">=</span> out<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token function">Interface</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
			<span class="token punctuation">}</span>

			<span class="token keyword">var</span> err <span class="token builtin">error</span>
			<span class="token keyword">if</span> out1<span class="token punctuation">,</span> ok <span class="token operator">:=</span> out<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token function">Interface</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token punctuation">(</span><span class="token builtin">error</span><span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
				err <span class="token operator">=</span> out1
			<span class="token punctuation">}</span>

			mu<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
			<span class="token comment">// 查询数据库出错，返回</span>
			<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> err <span class="token operator">!=</span> mysql<span class="token punctuation">.</span>ErrEmptyResult <span class="token punctuation">{</span>
				daoErr <span class="token operator">=</span> err
				mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
				<span class="token keyword">return</span>
			<span class="token punctuation">}</span>

			<span class="token comment">// 结果为空，设置为nil,</span>
			<span class="token keyword">if</span> err <span class="token operator">==</span> mysql<span class="token punctuation">.</span>ErrEmptyResult <span class="token operator">||</span> daoRes <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				itemInfoMap<span class="token punctuation">[</span>conf<span class="token punctuation">.</span>Field<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token boolean">nil</span>
				mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
				<span class="token keyword">return</span>
			<span class="token punctuation">}</span>

			<span class="token keyword">if</span> storeID <span class="token operator">==</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> daoRes <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">if</span> getter<span class="token punctuation">,</span> ok <span class="token operator">:=</span> daoRes<span class="token punctuation">.</span><span class="token punctuation">(</span>StoreIDGetter<span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
					storeID <span class="token operator">=</span> getter<span class="token punctuation">.</span><span class="token function">StoreID</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
					<span class="token comment">// storeID拿到，广播通知等待storeID的协程</span>
					storeIDReadyClosed<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token function">close</span><span class="token punctuation">(</span>storeIDReady<span class="token punctuation">)</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
				<span class="token punctuation">}</span>
			<span class="token punctuation">}</span>

			itemInfoMap<span class="token punctuation">[</span>conf<span class="token punctuation">.</span>Field<span class="token punctuation">]</span> <span class="token operator">=</span> daoRes
			mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span><span class="token punctuation">(</span>conf<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	docWg<span class="token punctuation">.</span><span class="token function">Wait</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token keyword">if</span> storeID <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		storeIDReadyClosed<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token function">close</span><span class="token punctuation">(</span>storeIDReady<span class="token punctuation">)</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	wg<span class="token punctuation">.</span><span class="token function">Wait</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> daoErr <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> daoErr
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
