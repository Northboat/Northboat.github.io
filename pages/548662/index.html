Ridljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">智能体赋能传统 toC 软件<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="ai-赋能传统文档软件"><a href="#ai-赋能传统文档软件" class="header-anchor">#</a> AI 赋能传统文档软件</h2> <h3 id="轰轰烈烈的-ai-大革命"><a href="#轰轰烈烈的-ai-大革命" class="header-anchor">#</a> 轰轰烈烈的 AI 大革命</h3> <p>以 toC 的文档服务为例，传统的文库，无非提供存储、下载、搜索等服务，然后通过“卖文档”实现盈利，这之中有两个关键问题</p> <ul><li>搜索质量：用户是否需要动用大量精力才能搜到想要的内容</li> <li>文档质量：用户找到的文档是否值得花钱购买</li></ul> <p>这是这类产品的核心竞争力，说白了，就是用户能否从你的文档库获到值得付费的文档内容</p> <p>但在 AI 时代，搜索的门槛被拉的很低，只需要用一个文本框，一个 query，大模型就能给出一大堆回答，这里不得不考虑一个问题，用户是否还会为“人工搜索、手动筛查、付费下载”这套逻辑买单？</p> <p>随着模型的质量越来越高，回复越来越精准，这种费时费力的古法收集文档只会被逐渐淘汰，2025 年百度的广告收益下降 16 个点正印证了这一事实</p> <p>如何立足于“存储”发扬 AI 功能，是 PSIG 是否能存活并增长的核心，这里有两个发展方向，一个是依靠存储发展个性化的 AI（例如提供个体 AI 如 OpenClaw 的记忆服务），一个是依靠存储发展 toB 的 AI 服务（类似于 Saas，但这一套似乎并不奏效），随着智能体的发展，用户 PC 端的使用量显著上升，甚至超过疫情时期的下载量，这充分说明当前 AI 对用户使用习惯的改变，显然电脑更适合与 AI 交互，以将算力转化为可以看得见的生产力，或许依据云存储提供个性化的 AI 记忆服务是一个很好的点子</p> <p>很多人说，AI 智能化，应该将存储和搜索深度绑定，确实有一定道理，但这这么走的话，智能化的是公有数据，可能现在更多考虑的是私有数据与 AI 的结合，走个性化的道路，故而是将存储和 toC 服务深度结合</p> <h3 id="ai-底座与业务逻辑耦合"><a href="#ai-底座与业务逻辑耦合" class="header-anchor">#</a> AI 底座与业务逻辑耦合</h3> <p>通过 MCP 将复杂的业务处理能力提供给智能体，智能体通过策略分发找到对应的 MCP 工具，实现一次处理并返回用户，这里是一个嵌套的功能，业务逻辑需要 AI 功能来实现，上层的智能体调用 MCP 获取业务逻辑，实现 AI - Service - AI 的架构</p> <p>也就是说，现在与用户交互的不再是死板的接口，而是一个个智能体，智能体通过预设的 prompt 调用相应的 MCP 获取具体的业务操作，并返回给用户；也可以理解为，从前的 routes 路由实现的业务分发，被智能体调用 MCP 的方式取代了，当然，调用智能体仍然使用某一接口如 /chat 触发</p> <h3 id="makeppt-详解"><a href="#makeppt-详解" class="header-anchor">#</a> makeppt 详解</h3> <h4 id="获取-md-格式大纲"><a href="#获取-md-格式大纲" class="header-anchor">#</a> 获取 MD 格式大纲</h4> <p>MakePPTPrepare 函数：根据文件 ID 从 Bos 中拿取内容，作为 markdownOutline</p> <ol><li>解析传参 fileID</li> <li>p.GenflowfileService.GetFileInfoMCP 根据 fileID 获取文件信息 fileIDInfoList，这里返回的是一个切片，p 就是 *mcp</li> <li>util.GetBosFileContent：我们使用 fileIDInfoList[0] 存储的 URL 从 BOS 中拿取文件内容，作为 markdownOutline，err == nil 则返回</li></ol> <h4 id="生成-ppt-并返回-sse-流"><a href="#生成-ppt-并返回-sse-流" class="header-anchor">#</a> 生成 PPT 并返回 SSE 流</h4> <p>MakePPT 函数：根据入参 makePPTReq 调用下游工具生成 PPT 并返回 SSE 流做流式输出，这是一个大几百行的复杂函数</p> <p>初始化与准备</p> <ol><li>通过 resouce.LoggerService 统一进行日志处理</li> <li>生成 sse 管道 pptChan := make(chan any)，chan 是协程通道 Channel 的关键字，通过<code>&lt;-</code>向管道输入数据</li> <li>创建 AIGC 客户端，这是获取下层 AI 服务的关键，通过 base/model/service/common/channel 的<code>GetClientTypeByChannel(ctx, params.Channel)</code>创建 client，params 是 makeppt 的入参，由前端传来</li> <li>上一步生成的大纲 markdownOutline 封装在 makePPTReq.Outline 中，这里将 MD 格式的大纲转成 MindBDJson
<ul><li>如果报错，说明大纲格式错误，调用 p.MakePPTOutline 生成大纲，这是 makepptoutline 实现的 mcp 功能</li> <li>创建管道 outlinechatChan，获取重新生成的大纲，如果这一步报错，将会直接把报错输出到 pptChan 返回，<code>pptChan &lt;- wkerror.New(funcerror.ErrorCodePPTGen, &quot;OutlineToPPTSSE error&quot;)</code></li> <li>若打赢复活赛，则将新大纲赋值给 makePPTReq.Outline</li></ul></li></ol> <p>生成策略参数</p> <ol><li>初始化运行参数：<code>PPTRunInfo := p.PPTInitRunParams(ctx, params)</code></li> <li>构建策略参数和生成流请求：<code>strategyParams, reqGenStream := p.MakePPTStrategyParams(ctx, makePPTReq, params, PPTRunInfo)</code></li> <li>PPT 通知策略？埋点与监控？</li></ol> <p>异步生成 PPT 主流程</p> <ol><li><p>生成 taskId 和声明成功标志</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">var</span> taskId <span class="token builtin">int64</span>
<span class="token keyword">var</span> pptgensuccess <span class="token builtin">bool</span>
<span class="token keyword">if</span> params<span class="token punctuation">.</span>Channel <span class="token operator">==</span> DeepChannelv2 <span class="token operator">||</span> params<span class="token punctuation">.</span>Channel <span class="token operator">==</span> ChannelHarmonyGenflowV2 <span class="token punctuation">{</span>
    taskId <span class="token operator">=</span> <span class="token function">AddPPtTask</span><span class="token punctuation">(</span>ctc<span class="token punctuation">,</span> strategyParams<span class="token punctuation">.</span>Extra<span class="token punctuation">.</span><span class="token punctuation">(</span>function<span class="token punctuation">.</span>GeneralOutlineToPPTReq<span class="token punctuation">)</span><span class="token punctuation">.</span>TplID<span class="token punctuation">,</span> makePPTReq<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div></li> <li><p>启动协程 go func，定义 defer，defer 内容包括关闭通道 pptChan、错误恢复 recover() 处理、updateStatus 状态确认以及回调写回生成状态<code>util.ConsumeCallback(ctx, util.ConsumerTaskCallbackReq{...})</code></p></li></ol> <h3 id="状态机和事件驱动"><a href="#状态机和事件驱动" class="header-anchor">#</a> 状态机和事件驱动</h3> <p>通过事件驱动状态机流转，实现 PPT 生成流程，这是 makeppt 的上层调用，genflow 的工作</p> <h2 id="数据库设计与缓存"><a href="#数据库设计与缓存" class="header-anchor">#</a> 数据库设计与缓存</h2> <p>以文档存储为例，数据库存储文档信息，文档真正落盘在 BOS（对象存储系统）</p> <h3 id="数据表的设计和读取"><a href="#数据表的设计和读取" class="header-anchor">#</a> 数据表的设计和读取</h3> <p>文档表结构</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> Doc <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	DocId      <span class="token builtin">uint64</span> <span class="token string">`ddb:&quot;doc_id&quot;`</span>
	MainStatus <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;main_status&quot;`</span>
	SubStatus  <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;sub_status&quot;`</span>
	CreateTime <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;create_time&quot;`</span>
	Cid1       <span class="token builtin">uint16</span> <span class="token string">`ddb:&quot;cid1&quot;`</span>
	Cid2       <span class="token builtin">uint16</span> <span class="token string">`ddb:&quot;cid2&quot;`</span>
	Cid3       <span class="token builtin">uint16</span> <span class="token string">`ddb:&quot;cid3&quot;`</span>
	Type       <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;type&quot;`</span>
	Page       <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;page&quot;`</span>
	Size       <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;size&quot;`</span>
	Price      <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;price&quot;`</span>

	Uid        <span class="token builtin">uint64</span> <span class="token string">`ddb:&quot;uid&quot;`</span>
	Uname      <span class="token builtin">string</span> <span class="token string">`ddb:&quot;uname&quot;`</span>
	Uip        <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;uip&quot;`</span>
	ModifyLock <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;modify_lock&quot;`</span>
	Profit     <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;profit&quot;`</span>
	Flag       <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;flag&quot;`</span>
	Islock     <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;islock&quot;`</span>
	Ishide     <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;ishide&quot;`</span>
	TagStr     <span class="token builtin">string</span> <span class="token string">`ddb:&quot;tag_str&quot;`</span>
	StoreId    <span class="token builtin">uint64</span> <span class="token string">`ddb:&quot;store_id&quot;`</span>
	PcsData    <span class="token builtin">string</span> <span class="token string">`ddb:&quot;pcs_data&quot;`</span>
	UpdateTime <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;update_time&quot;`</span>
	FixedDocId <span class="token builtin">uint64</span> <span class="token string">`json:&quot;fixedDocId,omitempty&quot;`</span> <span class="token comment">//精编后对应的docid</span>
<span class="token punctuation">}</span>
</code></pre></div><p>其中 ModifyLock 字段用于锁定用户的写操作</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">update</span> doc <span class="token keyword">set</span> modify_lock <span class="token operator">=</span> <span class="token number">1</span> <span class="token keyword">where</span> doc_id <span class="token operator">=</span> ? <span class="token operator">and</span> modify_lock <span class="token operator">=</span> <span class="token number">0</span>
</code></pre></div><p>通过将其置 1/0 维护写状态</p> <p>同时进行查询时，用专门的查询条件数据结构来进行传参</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// DocParam 表 Doc 的查询条件</span>
<span class="token keyword">type</span> DocParam <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	<span class="token comment">// ColumnName ColumnType `ddb:&quot;column_type[,opt]&quot;`</span>
	<span class="token comment">// opt= { =, &gt;, &amp;lt;, =, &amp;lt;=, &gt;=, !=, &amp;lt;&gt;, in, not in, like, not like, between, not between,</span>

	<span class="token comment">// IDs []int64 `ddb:&quot;id,in&quot;`  // for example</span>

	DocId      <span class="token operator">*</span><span class="token builtin">uint64</span> <span class="token string">`ddb:&quot;doc_id&quot;`</span>
	MainStatus <span class="token operator">*</span><span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;main_status&quot;`</span>
	SubStatus  <span class="token operator">*</span><span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;sub_status&quot;`</span>
	CreateTime <span class="token operator">*</span><span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;create_time&quot;`</span>
	Cid1       <span class="token operator">*</span><span class="token builtin">uint16</span> <span class="token string">`ddb:&quot;cid1&quot;`</span>

	Uid        <span class="token operator">*</span><span class="token builtin">uint64</span> <span class="token string">`ddb:&quot;uid&quot;`</span>
	Uname      <span class="token operator">*</span><span class="token builtin">string</span> <span class="token string">`ddb:&quot;uname&quot;`</span>
	Uip        <span class="token operator">*</span><span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;uip&quot;`</span>
	ModifyLock <span class="token operator">*</span><span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;modify_lock&quot;`</span>
	Profit     <span class="token operator">*</span><span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;profit&quot;`</span>
	Flag       <span class="token operator">*</span><span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;flag&quot;`</span>

		<span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">!=</span> DaoIDTypeDocID <span class="token operator">&amp;&amp;</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">!=</span> DaoIDTypeStoreID <span class="token punctuation">{</span>
			<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;illegal DaoIDType: %d&quot;</span><span class="token punctuation">,</span> c<span class="token punctuation">.</span>DaoIDType<span class="token punctuation">)</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Func <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;DaoFunc must be a func&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">NumIn</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;number of DaoFunc parameters must be 2&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">NumOut</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;number of DaoFunc return values must be 2&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">In</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>context<span class="token punctuation">.</span>Context<span class="token punctuation">)</span><span class="token punctuation">(</span><span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;first parameter of DaoFunc must be context.Context interface&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">In</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Uint64 <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;second parameter of DaoFunc must be uint64&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Ptr <span class="token operator">||</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Struct <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;first return value of DaoFunc must be pointer to struct&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span><span class="token builtin">error</span><span class="token punctuation">)</span><span class="token punctuation">(</span><span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;second return value of DaoFunc must be error interface&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 设置DaoFunc返回的结果并注册到map</span>
		c<span class="token punctuation">.</span>cacheStructType <span class="token operator">=</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>c<span class="token punctuation">.</span>Field<span class="token punctuation">]</span> <span class="token operator">=</span> c
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>文档缓存，对外暴露的缓存读取接口</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// WithCache 同时获取多个 field 的数据，优先从缓存中读取，不存在则使用传入的 dataOps 读取</span>
<span class="token keyword">func</span> <span class="token function">WithCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	itemInfoMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>

	filteredFields<span class="token punctuation">,</span> storeID <span class="token operator">:=</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> itemInfoMap<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中全部查询完毕，返回</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 函数退出时延迟存储缓存</span>
	dbResMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>dbResMap<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">setCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> dbResMap<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set conv_range info to cache failed, docID=%d, err=%s&quot;</span><span class="token punctuation">,</span> docID<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中没有查到的从db查询</span>
	dbResMap<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">goGetFieldFromDB</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> filteredFields<span class="token punctuation">,</span> storeID<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>

	<span class="token comment">// 合并两个map</span>
	<span class="token keyword">for</span> field<span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> dbResMap <span class="token punctuation">{</span>
		itemInfoMap<span class="token punctuation">[</span>field<span class="token punctuation">]</span> <span class="token operator">=</span> value
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>defer 的作用是延迟逻辑，在函数返回时才执行，相当于定义一个回调函数，其作用域等同于函数内部</p> <p>其中，getFieldFromCache 从 Redis 中取缓存，逻辑如下</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getFieldCache 从缓存中获取指定field的数据，并检查field中是否有需要storeID作为主键的数据</span>
<span class="token comment">// 将cache中查询到的内容，写入itemInfoMap，并返回未查询到的field列表</span>
<span class="token keyword">func</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> itemInfoMap <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token builtin">uint64</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token comment">// 从缓存中获取所有filed的数据</span>
	cacheDatas<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token comment">// GetCache中出错也会把成功的结果返回</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token comment">// 查询出错</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;get cache failed, err=%s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 缓存中未查到数据，直接返回。</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>cacheDatas<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> fields<span class="token punctuation">,</span> <span class="token number">0</span>
	<span class="token punctuation">}</span>
	filteredFields <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>fields<span class="token punctuation">)</span><span class="token punctuation">)</span>

	storeID <span class="token operator">:=</span> <span class="token function">uint64</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> f <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		<span class="token comment">//增加了cacheDatas[f] != nil的判断，正常获取不需要添加，避免缓存中数据为nil，但db有值的情况，后续docstore迁移后可直接读取db服务</span>
		<span class="token keyword">if</span> cacheData<span class="token punctuation">,</span> has <span class="token operator">:=</span> cacheDatas<span class="token punctuation">[</span>f<span class="token punctuation">]</span><span class="token punctuation">;</span> has <span class="token operator">&amp;&amp;</span> cacheData <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			itemInfoMap<span class="token punctuation">[</span>f<span class="token punctuation">]</span> <span class="token operator">=</span> cacheData
			<span class="token comment">// 如果成功取到缓存的数据中有实现StoreIDGetter接口，获取StoreID</span>
			<span class="token keyword">if</span> storeID <span class="token operator">==</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> cacheData <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">if</span> getter<span class="token punctuation">,</span> ok <span class="token operator">:=</span> cacheData<span class="token punctuation">.</span><span class="token punctuation">(</span>StoreIDGetter<span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
					storeID <span class="token operator">=</span> getter<span class="token punctuation">.</span><span class="token function">StoreID</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
				<span class="token punctuation">}</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
			<span class="token comment">// 在缓存中不存在，准备进行db查询</span>
			filteredFields <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">,</span> f<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> filteredFields<span class="token punctuation">,</span> storeID
<span class="token punctuation">}</span>
</code></pre></div><p>获取单个缓存数据</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getCache 从缓存中获取数据，支持同时获取多个field中的数据，返回一个map,不存在的或者失败的field不写入map中</span>
<span class="token keyword">func</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> id <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	fl <span class="token operator">:=</span> <span class="token function">len</span><span class="token punctuation">(</span>fields<span class="token punctuation">)</span>
	<span class="token keyword">if</span> fl <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;fields must given, but fields is empty&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	cp <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	fieldArr <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> fl<span class="token punctuation">)</span>

	key <span class="token operator">:=</span> <span class="token function">generateKey</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>

	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> field <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		fieldArr <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>fieldArr<span class="token punctuation">,</span> field<span class="token punctuation">.</span><span class="token function">String</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	sc <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>DocPush<span class="token punctuation">.</span><span class="token function">HMGet</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> fieldArr<span class="token operator">...</span><span class="token punctuation">)</span>

	key <span class="token operator">:=</span> docCacheKeyPrefix <span class="token operator">+</span> strconv<span class="token punctuation">.</span><span class="token function">FormatUint</span><span class="token punctuation">(</span>id<span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span>

	<span class="token keyword">return</span> key
<span class="token punctuation">}</span>

<span class="token comment">// unpackCacheData 使用自定义方法解包 cacheData</span>
<span class="token keyword">func</span> <span class="token function">unpackCacheData</span><span class="token punctuation">(</span>d <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>cacheData<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	s <span class="token operator">:=</span> strings<span class="token punctuation">.</span><span class="token function">Split</span><span class="token punctuation">(</span>d<span class="token punctuation">,</span> cacheDataSplitChar<span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;parseCacheData: data split result length not 2&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	expireAt<span class="token punctuation">,</span> err <span class="token operator">:=</span> strconv<span class="token punctuation">.</span><span class="token function">ParseInt</span><span class="token punctuation">(</span>s<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">64</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;parseCacheData: expireAt parse int failed, err=%s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	c <span class="token operator">:=</span> cacheData<span class="token punctuation">{</span>
		Data<span class="token punctuation">:</span>     <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>s<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
		ExpireAt<span class="token punctuation">:</span> expireAt<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token operator">&amp;</span>c<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

<span class="token comment">// packCacheData 使用自定义方式打包 cacheData</span>
<span class="token keyword">func</span> <span class="token function">packCacheData</span><span class="token punctuation">(</span>d <span class="token builtin">string</span><span class="token punctuation">,</span> field Field<span class="token punctuation">,</span> expire time<span class="token punctuation">.</span>Duration<span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> expire <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		expire <span class="token operator">=</span> defaultFieldExpireTime
	<span class="token punctuation">}</span>

	<span class="token comment">// 以当前时间点为原点，设置 expireAt</span>
	expireAtStr <span class="token operator">:=</span> strconv<span class="token punctuation">.</span><span class="token function">FormatInt</span><span class="token punctuation">(</span><span class="token function">int64</span><span class="token punctuation">(</span>expire<span class="token operator">/</span>time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span><span class="token operator">+</span>time<span class="token punctuation">.</span><span class="token function">Now</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Unix</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span>
	c <span class="token operator">:=</span> expireAtStr <span class="token operator">+</span> cacheDataSplitChar <span class="token operator">+</span> d

	<span class="token keyword">return</span> c
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">defaultMarshaler</span><span class="token punctuation">(</span>d <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">byte</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	b<span class="token punctuation">,</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Marshal</span><span class="token punctuation">(</span>d<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> b<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">defaultUnmarshaler</span><span class="token punctuation">(</span>s <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">byte</span><span class="token punctuation">,</span> v <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
	err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> <span class="token operator">&amp;</span>v<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>c Field<span class="token punctuation">)</span> <span class="token function">String</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="zset-存储智能体对话"><a href="#zset-存储智能体对话" class="header-anchor">#</a> ZSet 存储智能体对话</h3> <p>采用有序集合存储 AI 对话，具体而言，每新增一条对话，其 score 加一，这样在读取历史会话或者加载剩余会话时，只需要取 score 范围即可，同时保证对话的有序性</p> <p>支持</p> <ol><li>实时写入</li> <li>按序输出</li> <li>断点续传</li> <li>重新生成</li></ol> <p>注意，score 为 0 表示对话未开始，在编码时先执行 +1，再进行存取</p> <h2 id="es-文档全文搜索"><a href="#es-文档全文搜索" class="header-anchor">#</a> ES 文档全文搜索</h2> <p>文档全文搜索功能</p> <h2 id="mq-解耦文档处理流程"><a href="#mq-解耦文档处理流程" class="header-anchor">#</a> MQ 解耦文档处理流程</h2> <p>异步数据同步，通知推送</p> <ol><li>用户创建文档时通知下游</li> <li>任务完成通知（点赞、评论、任务）</li></ol></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/03/09, 18:19:07</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/108f08/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">智能体开发理论、应用与实践</div></a> <!----></div> <div class="page-nav"><p class="inner"><span class="prev">
