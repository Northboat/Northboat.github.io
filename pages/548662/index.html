<span class="token keyword">func</span> <span class="token function">WithCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	itemInfoMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>

	filteredFields<span class="token punctuation">,</span> storeID <span class="token operator">:=</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> itemInfoMap<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中全部查询完毕，返回</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 函数退出时延迟存储缓存</span>
	dbResMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>dbResMap<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">setCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> dbResMap<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set conv_range info to cache failed, docID=%d, err=%s&quot;</span><span class="token punctuation">,</span> docID<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中没有查到的从db查询</span>
	dbResMap<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">goGetFieldFromDB</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> filteredFields<span class="token punctuation">,</span> storeID<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>

	<span class="token comment">// 合并两个map</span>
	<span class="token keyword">for</span> field<span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> dbResMap <span class="token punctuation">{</span>
		itemInfoMap<span class="token punctuation">[</span>field<span class="token punctuation">]</span> <span class="token operator">=</span> value
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>defer 的作用是延迟逻辑，在函数返回时才执行，相当于定义一个回调函数，其作用域等同于函数内部</p> <h3 id="redis-缓存存取"><a href="#redis-缓存存取" class="header-anchor">#</a> Redis 缓存存取</h3> <p>其中，getFieldFromCache 从 Redis 中取缓存，逻辑如下</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getFieldCache 从缓存中获取指定field的数据，并检查field中是否有需要storeID作为主键的数据</span>
<span class="token comment">// 将cache中查询到的内容，写入itemInfoMap，并返回未查询到的field列表</span>
<span class="token keyword">func</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> itemInfoMap <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token builtin">uint64</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token comment">// 从缓存中获取所有filed的数据</span>
	cacheDatas<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token comment">// GetCache中出错也会把成功的结果返回</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token comment">// 查询出错</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;get cache failed, err=%s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 缓存中未查到数据，直接返回。</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>cacheDatas<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> fields<span class="token punctuation">,</span> <span class="token number">0</span>
	<span class="token punctuation">}</span>
	filteredFields <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>fields<span class="token punctuation">)</span><span class="token punctuation">)</span>

	storeID <span class="token operator">:=</span> <span class="token function">uint64</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> f <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		<span class="token comment">//增加了cacheDatas[f] != nil的判断，正常获取不需要添加，避免缓存中数据为nil，但db有值的情况，后续docstore迁移后可直接读取db服务</span>
		<span class="token keyword">if</span> cacheData<span class="token punctuation">,</span> has <span class="token operator">:=</span> cacheDatas<span class="token punctuation">[</span>f<span class="token punctuation">]</span><span class="token punctuation">;</span> has <span class="token operator">&amp;&amp;</span> cacheData <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			itemInfoMap<span class="token punctuation">[</span>f<span class="token punctuation">]</span> <span class="token operator">=</span> cacheData
			<span class="token comment">// 如果成功取到缓存的数据中有实现StoreIDGetter接口，获取StoreID</span>
			<span class="token keyword">if</span> storeID <span class="token operator">==</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> cacheData <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">if</span> getter<span class="token punctuation">,</span> ok <span class="token operator">:=</span> cacheData<span class="token punctuation">.</span><span class="token punctuation">(</span>StoreIDGetter<span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
					storeID <span class="token operator">=</span> getter<span class="token punctuation">.</span><span class="token function">StoreID</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
				<span class="token punctuation">}</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
			<span class="token comment">// 在缓存中不存在，准备进行db查询</span>
			filteredFields <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">,</span> f<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> filteredFields<span class="token punctuation">,</span> storeID
<span class="token punctuation">}</span>
</code></pre></div><p>获取单个缓存数据</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getCache 从缓存中获取数据，支持同时获取多个field中的数据，返回一个map,不存在的或者失败的field不写入map中</span>
<span class="token keyword">func</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> id <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	fl <span class="token operator">:=</span> <span class="token function">len</span><span class="token punctuation">(</span>fields<span class="token punctuation">)</span>
	<span class="token keyword">if</span> fl <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;fields must given, but fields is empty&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	cp <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	fieldArr <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> fl<span class="token punctuation">)</span>

	key <span class="token operator">:=</span> <span class="token function">generateKey</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>

	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> field <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		fieldArr <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>fieldArr<span class="token punctuation">,</span> field<span class="token punctuation">.</span><span class="token function">String</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	sc <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>DocPush<span class="token punctuation">.</span><span class="token function">HMGet</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> fieldArr<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;GetCache: hmget failed, key=%s, field=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> fields<span class="token punctuation">,</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	res<span class="token punctuation">,</span> err <span class="token operator">:=</span> sc<span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;GetCache: hmget failed, key=%s, field=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> fields<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">for</span> i<span class="token punctuation">,</span> field <span class="token operator">:=</span> <span class="token keyword">range</span> fields <span class="token punctuation">{</span>
		<span class="token comment">// 单个field不存在，不将这个field填入map</span>
		<span class="token keyword">if</span> res<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			<span class="token keyword">continue</span>
		<span class="token punctuation">}</span>

		valStr <span class="token operator">:=</span> <span class="token string">&quot;&quot;</span>
		ok <span class="token operator">:=</span> <span class="token boolean">false</span>
		<span class="token keyword">if</span> valStr<span class="token punctuation">,</span> ok <span class="token operator">=</span> res<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
			<span class="token keyword">continue</span>

<span class="token keyword">func</span> <span class="token function">goGetFieldFromDB</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> filteredFields <span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> storeID <span class="token builtin">uint64</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	wg <span class="token operator">:=</span> sync<span class="token punctuation">.</span>WaitGroup<span class="token punctuation">{</span><span class="token punctuation">}</span>

	storeIDReady <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>

		<span class="token keyword">if</span> conf<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeDocID <span class="token punctuation">{</span>

			<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">==</span> DaoIDTypeStoreID <span class="token punctuation">{</span>
				<span class="token comment">// 检查输入store_id，如果store_id为0，则未获取到storeId，不需要进一步dao操作</span>
