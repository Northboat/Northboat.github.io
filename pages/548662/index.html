j2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">模型驱动的 ToC 文档智能体产品<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="toc-智能体概述"><a href="#toc-智能体概述" class="header-anchor">#</a> ToC 智能体概述</h2> <h3 id="轰轰烈烈的-ai-大革命"><a href="#轰轰烈烈的-ai-大革命" class="header-anchor">#</a> 轰轰烈烈的 AI 大革命</h3> <p>ToC 产品和技术是两回事，既不割裂也不强相关，好的技术不一定产出好的产品，好的产品也不一定依赖绝对好的技术，技术达标 + 用户体验 = 好的产品</p> <p>相应的，如果用户体验不行，这个产品总是不能称之为好，除非技术出现断层式的领先</p> <p>以 toC 的文档服务为例，传统的文库，无非提供存储、下载、搜索等服务，然后通过“卖文档”实现盈利，这之中有两个关键问题</p> <ul><li>搜索质量：用户是否需要动用大量精力才能搜到想要的内容</li> <li>文档质量：用户找到的文档是否值得花钱购买</li></ul> <p>这是这类产品的核心竞争力，说白了，就是用户能否从你的文档库获到值得付费的文档内容</p> <p>但在 AI 时代，搜索的门槛被拉的很低，只需要用一个文本框，一个 query，大模型就能给出一大堆回答，这里不得不考虑一个问题，用户是否还会为“人工搜索、手动筛查、付费下载”这套逻辑买单？</p> <p>随着模型的质量越来越高，回复越来越精准，这种费时费力的古法收集文档只会被逐渐淘汰，2025 年百度的广告收益下降 16 个点正印证了这一事实</p> <blockquote><p>如何立足于“存储”发扬 AI 功能，是 PSIG 是否能存活并增长的核心，这里有两个发展方向，一个是依靠存储发展个性化的 AI（例如提供个体 AI 如 OpenClaw 的记忆服务），一个是依靠存储发展 toB 的 AI 服务（类似于 Saas，但这一套似乎并不奏效），随着智能体的发展，用户 PC 端的使用量显著上升，甚至超过疫情时期的下载量，这充分说明当前 AI 对用户使用习惯的改变，显然电脑更适合与 AI 交互，以将算力转化为可以看得见的生产力，依据云存储提供个性化的 AI 记忆服务是一个很好的点子</p></blockquote> <p>耦合 AI 底座和业务逻辑</p> <ul><li>通过 MCP 将复杂的业务处理能力提供给智能体，智能体通过策略分发找到对应的 MCP 工具，实现一次处理并返回用户，这里是一个嵌套的功能，业务逻辑需要 AI 功能来实现，上层的智能体调用 MCP 获取业务逻辑，实现 AI - Service - AI 的架构</li> <li>也就是说，现在与用户交互的不再是死板的接口，而是一个个智能体，智能体通过预设的 prompt 调用相应的 MCP 获取具体的业务操作，并返回给用户；也可以理解为，从前的 routes 路由实现的业务分发，被智能体调用 MCP 的方式取代了，当然，调用智能体仍然使用某一接口如 /chat 触发</li></ul> <h3 id="问题及工作方向"><a href="#问题及工作方向" class="header-anchor">#</a> 问题及工作方向</h3> <p>业务上下游调用复杂，沟通强度大，需要及时发问、总结、提升，以承接开发任务</p> <table><thead><tr><th><strong>培训课程</strong></th> <th><strong>时间</strong></th> <th><strong>状态</strong></th></tr></thead> <tbody><tr><td>码神训练营 QC 考核</td> <td>26/02/05 - 26/02/12</td> <td>完成</td></tr> <tr><td>码神训练营 QAC 考核</td> <td>26/02/05 - 26/02/12</td> <td>完成</td></tr> <tr><td>百度安全课程</td> <td>26/02/05 - 26/02/12</td> <td>完成</td></tr> <tr><td>稳定性意识考试 - RD</td> <td>26/04/01 - 26/04/01</td> <td>完成</td></tr></tbody></table> <p>工作方向</p> <ol><li>开发中要注重代码的执行效率和健壮性</li> <li>对文库的不同业务逻辑进行梳理并落实到文档上，便于分享和以后回顾，尤其是完善各种接口文档和业务流程</li> <li>对于需求中的各种要点要反复推敲，不明白的要及时去核实，遇到的修改点要举一反三，穷举链路，看是否会影响到别的服务，有全局意识</li> <li>合作开发中要及时沟通，明确需求后制定设计方案，并给出对应的排期，要有计划去同步，尽可能的查补漏洞，并提前自己的工期，急事不慌，缓事不怠</li></ol> <h2 id="框架与架构"><a href="#框架与架构" class="header-anchor">#</a> 框架与架构</h2> <h3 id="模型驱动服务"><a href="#模型驱动服务" class="header-anchor">#</a> 模型驱动服务</h3> <p>模型驱动三层架构</p> <ol><li>Genflow：与用户直接交互，实现工作流编排</li> <li>MCP：为 Genflow 提供具体业务能力</li> <li>Strategy：提供例如转码、存储和 AI 等策略接口</li></ol> <p>文库、橙篇、自由画布场景下 AI 助手对话流程</p> <ol><li>用户输入指令</li> <li>意图识别、风控</li> <li>策略分发</li> <li>业务逻辑</li> <li>返回 SSE 流</li></ol> <p>以 Genflow 根据用户文档生成 PPT 流程为例，GF 的一次调用过程如下</p> <div class="language- extra-class"><pre class="language-text"><code>用户输入
 ↓
调用 /convertparsesubmit 和 /convertparsesubmit 上传并解析文件 bdjson 至 BOS
 ↓
调用 /filecreate 拿取 BOS 文件并绑定本次对话 queryID 和 chatID
 ↓
调用 /chat 接口，分析用户请求，打向统一的 MCP 调度服务，由该服务返回需要使用到的工具 toolName，而后再去找 function 模块，请求对应的 MCP 服务
 ↓
具体的 MCP 工具实现依赖于下层的策略服务，也就是说，MCP 服务的核心功能是依靠打下层策略实现的，而后同步返回 Genflow
 ↓
策略接口
</code></pre></div><p>整个链路中，真正的业务逻辑在 function 层实现，GenFlow 上游进行意图识别，下游策略为 function 提供真正的业务能力，同时在状态流转时插入风控、商业化等前置 / 后置服务，构成完整的生 PPT 链路</p> <p>在整个 GenFlow 架构下，后端被分为三层</p> <ul><li>基础：提供底层转码、AI 对话流、文档解析等服务</li> <li>业务：负责组装基础的服务，实现真正的业务逻辑</li> <li>策略：复制工作流设计、策略分发、业务调用等</li></ul> <h3 id="mcp-模块"><a href="#mcp-模块" class="header-anchor">#</a> MCP 模块</h3> <blockquote><p>function 库，为 GenFlow 提供内置的 MCP 工具</p></blockquote> <p>GenFlow 上层收到用户请求后，会经过网盘那边的意图识别和策略分发，打到 MCP 模块，即 function 库中的内容，很有意思的链路，MCP 数据通过 Json 协议传输</p> <p>PPT 相关工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>pptagent.go</code></td> <td>处理 HTML PPT 生成流程</td></tr> <tr><td><code>agentppt.go</code></td> <td>Agent PPT 生成工具</td></tr> <tr><td><code>agentpptbase.go</code></td> <td>Agent PPT 基础功能</td></tr> <tr><td><code>agentpptoutline.go</code></td> <td>Agent PPT 大纲生成</td></tr> <tr><td><code>makeppt.go</code></td> <td>传统 PPT 生成工具</td></tr> <tr><td><code>makepptoutline.go</code></td> <td>传统 PPT 大纲生成工具</td></tr> <tr><td><code>makehtmlppt.go</code></td> <td>HTML 格式 PPT 生成</td></tr> <tr><td><code>ppteditor.go</code></td> <td>PPT 编辑功能</td></tr> <tr><td><code>pptgenappbuilder.go</code></td> <td>应用构建器 PPT 生成</td></tr> <tr><td><code>pptgenmultiquery.go</code></td> <td>多查询 PPT 生成</td></tr></tbody></table> <p>Word 文档工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>wordgen.go</code></td> <td>Word 文档生成工具（已废弃）</td></tr> <tr><td><code>wordgenv2.go</code></td> <td>Word 生成工具 V2 版本</td></tr> <tr><td><code>wordedit.go</code></td> <td>Word 文档编辑工具</td></tr> <tr><td><code>wordoutline.go</code></td> <td>Word 大纲生成工具（已废弃）</td></tr> <tr><td><code>wordoutlinev2.go</code></td> <td>Word 大纲生成 V2 版本</td></tr></tbody></table> <p>Excel 表格工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>excelagentv2.go</code></td> <td>Excel Agent V2 工具，支持表格生成和编辑</td></tr> <tr><td><code>exceledit.go</code></td> <td>Excel 编辑工具</td></tr></tbody></table> <p>图片生成工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>imagegen.go</code></td> <td>图片生成工具</td></tr> <tr><td><code>multiimagegen.go</code></td> <td>多图片生成工具</td></tr> <tr><td><code>imggenwp.go</code></td> <td>文链文生图工具</td></tr> <tr><td><code>imgunderstand.go</code></td> <td>图片理解/识别工具</td></tr> <tr><td><code>generateposter.go</code></td> <td>海报生成工具</td></tr> <tr><td><code>generateposterlist.go</code></td> <td>海报列表生成工具</td></tr> <tr><td><code>generatehandcopy.go</code></td> <td>手抄报生成工具</td></tr></tbody></table> <p>搜索工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>websearch.go</code></td> <td>网络搜索工具</td></tr> <tr><td><code>browsesearch.go</code></td> <td>浏览器搜索工具</td></tr> <tr><td><code>getsearch.go</code></td> <td>搜索获取工具</td></tr> <tr><td><code>xueshusearch.go</code></td> <td>学术搜索工具</td></tr> <tr><td><code>knowledgesearch.go</code></td> <td>知识库搜索工具</td></tr> <tr><td><code>knowledgedata.go</code></td> <td>知识库数据获取工具</td></tr> <tr><td><code>wangpansearch.go</code></td> <td>网盘搜索工具</td></tr> <tr><td><code>fileretrieval.go</code></td> <td>文件检索工具</td></tr> <tr><td><code>searchfile.go</code></td> <td>文件搜索工具</td></tr></tbody></table> <p>文档处理工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>basedoc.go</code></td> <td>基础文档处理</td></tr> <tr><td><code>getfileinfo.go</code></td> <td>获取文件信息</td></tr> <tr><td><code>parse.go</code></td> <td>文档解析工具</td></tr> <tr><td><code>convert.go</code></td> <td>文档转换工具</td></tr> <tr><td><code>makedoc.go</code></td> <td>文档创建工具</td></tr></tbody></table> <p>研报生成工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>reportgen.go</code></td> <td>研报生成工具</td></tr> <tr><td><code>report_generate.go</code></td> <td>研报生成（新版本）</td></tr> <tr><td><code>reportgenoutline.go</code></td> <td>研报大纲生成工具</td></tr> <tr><td><code>report_h5.go</code></td> <td>研报 H5 页面生成</td></tr></tbody></table> <p>图表绘制工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>make_frame_chart.go</code></td> <td>框架图/流程图生成</td></tr> <tr><td><code>make_mindmap_chart.go</code></td> <td>思维导图生成</td></tr> <tr><td><code>datachart.go</code></td> <td>数据图表生成</td></tr></tbody></table> <p>多媒体工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>videogen.go</code></td> <td>视频生成工具</td></tr> <tr><td><code>podcastgen.go</code></td> <td>播客生成工具</td></tr> <tr><td><code>storymediagenerate.go</code></td> <td>故事媒体生成工具</td></tr> <tr><td><code>storymediaoutline.go</code></td> <td>故事媒体大纲生成</td></tr></tbody></table> <p>其他工具</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>uploadfile.go</code></td> <td>文件上传工具</td></tr> <tr><td><code>memorysearch.go</code></td> <td>记忆搜索工具</td></tr> <tr><td><code>memoryrecord.go</code></td> <td>记忆记录工具</td></tr> <tr><td><code>cronjob.go</code></td> <td>定时任务工具</td></tr> <tr><td><code>codegen.go</code></td> <td>代码生成工具</td></tr></tbody></table> <p>接口入口</p> <table><thead><tr><th>工具文件</th> <th>功能描述</th></tr></thead> <tbody><tr><td><code>base.go</code></td> <td>MCP 基础服务，定义接口、常量、通用方法</td></tr></tbody></table> <p>这些工具涵盖了内容生成（PPT、Word、Excel、研报）、搜索检索、图片视频生成、文档处理等多个领域，为 GenFlow 提供一个完整的 AIGC 工具生态链</p> <h3 id="gdp-框架的-ioc-和多态实现"><a href="#gdp-框架的-ioc-和多态实现" class="header-anchor">#</a> GDP 框架的 IoC 和多态实现</h3> <p>GDP 整体架构：包含数据库（MySQL）、缓存（Redis）、消息队列（NMQ）、日志系统（Logger）、配置中心（Sula）等等一系列中间件的开发框架</p> <p>GDP ghttp.HandlerFunc 注册和执行逻辑：如何注册一个 http 路由？注册过程在 GDP 框架里做了什么事？</p> <p>注册路由：<strong>ghome/httpserver/router.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code>userInfo <span class="token operator">:=</span> rootGroup<span class="token punctuation">.</span><span class="token function">Group</span><span class="token punctuation">(</span><span class="token string">&quot;/user&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 返回一个 Router</span>
<span class="token comment">// 获取用户信息操作路由</span>
userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;any&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/userinfo&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewUserInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserInfoWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;get&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/doclist&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewDocList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserLoginExtraWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;post,get&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/docinfo&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewDocInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserLoginExtraWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>Router 通过统一的 HandleFunc 接口注册 Handler，用于处理 HTTP 请求</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> Router <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    http<span class="token punctuation">.</span>Handler <span class="token comment">// 继承标准库 net/http 的所有方法</span>

    <span class="token comment">// HandleFunc 注册业务 handler 方式1</span>
    <span class="token comment">//     method  是http方法，如GET、POST,也可以使用逗号来连接同时传入多个，如 &quot;GET,POST&quot;</span>
    <span class="token comment">//             也可以用特殊的 ANY,会自动注册所有( ANY 的取值详见 MethodAny )</span>
    <span class="token comment">//     path    接口地址，如 &quot;/index&quot;,&quot;/user/:name&quot;,&quot;/user/*&quot;。详见 Router</span>
    <span class="token comment">//     handler 是业务的逻辑，执行后会返回一个 Response 对象</span>
    <span class="token comment">//     ms      是该接口特有的中间件函数，一般为风控、日志等等</span>
    <span class="token function">HandleFunc</span><span class="token punctuation">(</span>method <span class="token builtin">string</span><span class="token punctuation">,</span> path <span class="token builtin">string</span><span class="token punctuation">,</span> handler HandlerFunc<span class="token punctuation">,</span> ms <span class="token operator">...</span>MiddleWareFunc<span class="token punctuation">)</span>

    <span class="token comment">// HandleStreamFunc 注册业务 handler 方式2: handler 是业务的逻辑，可以持续的以流式方式输出数据</span>
    <span class="token function">HandleStreamFunc</span><span class="token punctuation">(</span>method <span class="token builtin">string</span><span class="token punctuation">,</span> path <span class="token builtin">string</span><span class="token punctuation">,</span> handler StreamHandlerFunc<span class="token punctuation">,</span> ms <span class="token operator">...</span>MiddleWareFunc<span class="token punctuation">)</span>

    <span class="token comment">// HandleStd 注册业务 handler 方式3: handler 是标准库的 http.HandlerFunc ，比如：</span>
    <span class="token comment">// HandlerStd(&quot;any&quot;, &quot;/abc*&quot;, http.StripPrefix(&quot;/abc&quot;, http.FileServer(http.Dir(&quot;./&quot;))))</span>
    <span class="token function">HandleStd</span><span class="token punctuation">(</span>method <span class="token builtin">string</span><span class="token punctuation">,</span> path <span class="token builtin">string</span><span class="token punctuation">,</span> handler http<span class="token punctuation">.</span>Handler<span class="token punctuation">,</span> ms <span class="token operator">...</span>MiddleWareFunc<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>HandleFunc：常规的 HTTP RR 响应，如上面 ghome 例子中返回文库文档列表</p> <div class="language-go extra-class"><pre class="language-go"><code>userInfo<span class="token punctuation">.</span><span class="token function">HandleFunc</span><span class="token punctuation">(</span><span class="token string">&quot;get&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/doclist&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">NewDocList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserLoginExtraWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>HandleStreamFunc：流式接口返回，如 genflow 中的 /chat 接口，返回的将是一个 chatChan 管道</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// registerGenFlowAPI</span>
<span class="token keyword">func</span> <span class="token function">registerGenFlowAPI</span><span class="token punctuation">(</span>router ghttp<span class="token punctuation">.</span>Router<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    router<span class="token punctuation">.</span><span class="token function">HandleStreamFunc</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>MethodPost<span class="token punctuation">,</span> <span class="token string">&quot;/chat&quot;</span><span class="token punctuation">,</span> genflow<span class="token punctuation">.</span>Chat<span class="token punctuation">,</span> gmiddleware<span class="token punctuation">.</span><span class="token function">NewUserInfoWareFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>HandleStd：标准库的 HandlerFunc，但我发现 wenchain/function 库里的全是 HandleStd，可能因为是中间层的缘故，同时 HandleStd 里也有 SSE Handler 的返回</p> <div class="language-go extra-class"><pre class="language-go"><code>mcprouter <span class="token operator">:=</span> router<span class="token punctuation">.</span><span class="token function">Group</span><span class="token punctuation">(</span><span class="token string">&quot;/mcp&quot;</span><span class="token punctuation">)</span>
mcprouter<span class="token punctuation">.</span><span class="token function">HandleStd</span><span class="token punctuation">(</span><span class="token string">&quot;post&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/makepptbyoutline&quot;</span><span class="token punctuation">,</span> mcpapi<span class="token punctuation">.</span><span class="token function">NewMakePPTCallFunc</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>               <span class="token comment">// ppt生成</span>
mcprouter<span class="token punctuation">.</span><span class="token function">HandleStd</span><span class="token punctuation">(</span><span class="token string">&quot;post&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/makepptoutline&quot;</span><span class="token punctuation">,</span> mcpapi<span class="token punctuation">.</span><span class="token function">NewMakePPTOutlineCallFunc</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>          <span class="token comment">// ppt大纲生成</span>
imageService<span class="token punctuation">.</span><span class="token function">HandleStd</span><span class="token punctuation">(</span><span class="token string">&quot;post&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/imageanalysesse&quot;</span><span class="token punctuation">,</span> image<span class="token punctuation">.</span><span class="token function">NewImageAnalyseSSE</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">//图片理解sse</span>
</code></pre></div><p>Handler 的实现（Controller 的实现），第一步：定义一个处理业务的结构体，接收请求参数，例如</p> <p><strong>ghome/controller/user/doclist.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> docList <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    reqParams docListParam
<span class="token punctuation">}</span>

<span class="token keyword">type</span> docListParam <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    <span class="token comment">// ... 略</span>
<span class="token punctuation">}</span>
</code></pre></div><p>第二步：实现 OnInit 和 OnExecute 方法，前者主要是做一些参数过滤，业务级别的鉴权，反作弊和频率控制，后者 OnExecute 是业务主逻辑实现</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// OnInit 请求初始化处理</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>d <span class="token operator">*</span>docList<span class="token punctuation">)</span> <span class="token function">OnInit</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> next frame<span class="token punctuation">.</span>MiddleWareQueue<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    c <span class="token operator">:=</span> gin<span class="token punctuation">.</span>Context<span class="token punctuation">{</span>
        Request<span class="token punctuation">:</span> req<span class="token punctuation">.</span><span class="token function">HTTPRequest</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> err <span class="token operator">:=</span> c<span class="token punctuation">.</span><span class="token function">ShouldBind</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>d<span class="token punctuation">.</span>reqParams<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> wkerror<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span>wkerror<span class="token punctuation">.</span>ErrorCodeParamsError<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> err <span class="token operator">:=</span> d<span class="token punctuation">.</span><span class="token function">paramCheck</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>

    <span class="token keyword">return</span> next<span class="token punctuation">.</span><span class="token function">Next</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>d <span class="token operator">*</span>docList<span class="token punctuation">)</span> <span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    docListRes <span class="token operator">:=</span> <span class="token operator">&amp;</span>userDocHomeListRes<span class="token punctuation">{</span><span class="token punctuation">}</span>
    docType <span class="token operator">:=</span> d<span class="token punctuation">.</span>reqParams<span class="token punctuation">.</span>Type
    <span class="token comment">// ... 略</span>
<span class="token punctuation">}</span>
</code></pre></div><p>实际上，这两个方法隐式实现了 Initializer 和 Executor 这两个接口，这是框架 frame.go 的内容</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// Initializer 业务流程初始化接口</span>
<span class="token keyword">type</span> Initializer <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    <span class="token comment">// 业务流程初始化，最外层的中间件</span>
    <span class="token comment">// 建议参数过滤，业务级别鉴权，反作弊和频率控制等可以在此执行，也可以向里细分中间件分层执行。</span>
    <span class="token comment">// 接受context和request，next，next用于可以执行下一级别的中间件。</span>
    <span class="token function">OnInit</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> next MiddleWareQueue<span class="token punctuation">)</span> <span class="token punctuation">(</span>data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// Executor 业务代码主干部分执行接口</span>
<span class="token keyword">type</span> Executor <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    <span class="token comment">// 业务主干流程，业务最内层的&quot;中间件&quot;，阉割了next参数，防止业务继续调用Next。</span>
    <span class="token comment">// 建议在此做主干的接口业务，复杂业务请考虑接口是否可以拆分分层，向外拓展分层</span>
    <span class="token comment">// 接受context和request，返回data以及error，用于渲染</span>
    <span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span>data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在 frame.go 里</p> <ol><li>ExecutorNew 作为工厂函数返回 Executor 和一个中间件列表</li> <li>NewCommonHandle 方法接收 ExecutorNew，处理所有函数 func，构建 ghttp.HandlerFunc</li></ol> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// ExecutorNew 是Executor的构造函数，并返回需要注册额外的MiddleWareFunc列表</span>
<span class="token comment">// 构造一个新的业务对象，不同请求下的业务对象都是新生成的，除非业务自己实现了引用，否则每个对象相互独立</span>
<span class="token comment">// MiddleWareFunc的内容也是延迟构造的，MiddleWareFunc本身也可以拿到本次请求的独立业务对象，因此各个业务层的中间件可以是带状态的</span>
<span class="token keyword">type</span> ExecutorNew <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>Executor<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>MiddleWareFunc<span class="token punctuation">)</span>

<span class="token comment">// NewCommonHandle 以e创建一个Handle</span>
<span class="token keyword">func</span> <span class="token function">NewCommonHandle</span><span class="token punctuation">(</span>e ExecutorNew<span class="token punctuation">,</span> opts <span class="token operator">...</span>Option<span class="token punctuation">)</span> ghttp<span class="token punctuation">.</span>HandlerFunc <span class="token punctuation">{</span>
    newFrame <span class="token operator">:=</span> <span class="token operator">&amp;</span>commonHandleFrame<span class="token punctuation">{</span>
        <span class="token builtin">new</span><span class="token punctuation">:</span> e<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> opt <span class="token operator">:=</span> <span class="token keyword">range</span> opts <span class="token punctuation">{</span>
        opt<span class="token punctuation">.</span><span class="token function">apply</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>newFrame<span class="token punctuation">.</span>opts<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    newFrame<span class="token punctuation">.</span>opts<span class="token punctuation">.</span><span class="token function">applyDefaultOption</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">return</span> newFrame<span class="token punctuation">.</span>do
<span class="token punctuation">}</span>
</code></pre></div><p>框架内部的处理过程：将所有的方法连同 OnInit 和 OnExecute 都包装成中间件丢到 []frame.MiddleWareFunc 里（OnInit 在倒数第二个，OnExecute 在倒数第一个），触发时，将挨个调用 next.Next 执行这些中间件，构成链路递归</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>r <span class="token operator">*</span>commonHandleFrame<span class="token punctuation">)</span> <span class="token function">do</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span>resp ghttp<span class="token punctuation">.</span>Response<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 第1步：调用工厂函数，创建业务对象</span>
    e<span class="token punctuation">,</span> funcs <span class="token operator">:=</span> r<span class="token punctuation">.</span><span class="token function">new</span><span class="token punctuation">(</span><span class="token punctuation">)</span>  <span class="token comment">// 这里得到 *docList，每一次 HTTP 打来，都会新建一个业务实例 e</span>
    
    <span class="token comment">// 第2步：检查是否实现了 Initializer 接口</span>
    initializer<span class="token punctuation">,</span> ok <span class="token operator">:=</span> e<span class="token punctuation">.</span><span class="token punctuation">(</span>Initializer<span class="token punctuation">)</span>  <span class="token comment">// 接口断言</span>
    
    <span class="token comment">// 第3步：将 OnExecute 包装成最后一个中间件</span>
    funcs <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>funcs<span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> <span class="token boolean">_</span> MiddleWareQueue<span class="token punctuation">)</span> <span class="token punctuation">(</span>data <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> e<span class="token punctuation">.</span><span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>  <span class="token comment">// 这里调用 docList.OnExecute</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>
    
    <span class="token comment">// 第4步：构建中间件链并执行</span>
    next <span class="token operator">:=</span> <span class="token function">NewMiddleWareQueue</span><span class="token punctuation">(</span>funcs<span class="token punctuation">)</span>
    data<span class="token punctuation">,</span> err <span class="token operator">=</span> next<span class="token punctuation">.</span><span class="token function">Next</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
    
    <span class="token keyword">return</span>
<span class="token punctuation">}</span>
</code></pre></div><p>体现到应用层的使用即为，传入一个匿名函数（实则为 <code>ExecutorNew</code>），把刚刚实现了 <code>OnInit</code> 和 <code>OnExecute</code> 的 <code>docList</code> 作为 <code>Executor</code> 返回，同时将日志记录作为中间件函数传进去，<code>NewCommonHandle</code> 接收这个 <code>ExecutorNew</code> 方法，触发 <code>do</code> 方法，按照中间件方法依次执行的顺序构造 <code>ghttp.HandlerFunc</code> 函数返回</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">NewDocList</span><span class="token punctuation">(</span><span class="token punctuation">)</span> ghttp<span class="token punctuation">.</span>HandlerFunc <span class="token punctuation">{</span>
    feedWareFunc <span class="token operator">:=</span> frame<span class="token punctuation">.</span><span class="token function">FeedSampleWareFunc</span><span class="token punctuation">(</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token punctuation">)</span>

    <span class="token keyword">return</span> frame<span class="token punctuation">.</span><span class="token function">NewCommonHandle</span><span class="token punctuation">(</span>
        <span class="token comment">// 工厂方法</span>
        <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>frame<span class="token punctuation">.</span>Executor<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>frame<span class="token punctuation">.</span>MiddleWareFunc<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            d <span class="token operator">:=</span> <span class="token operator">&amp;</span>docList<span class="token punctuation">{</span><span class="token punctuation">}</span>
            <span class="token keyword">return</span> d<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>frame<span class="token punctuation">.</span>MiddleWareFunc<span class="token punctuation">{</span>feedWareFunc<span class="token punctuation">}</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>可以发现</p> <ul><li>函数是 Golang 的一等公民，最后绑定到接口 /doclist 上的，其实是一连串函数顺序构造的 <code>ghttp.HandlerFunc</code></li> <li>通过实现 <code>OnInit</code> 和 <code>OnExecute</code> 方法构造 <code>Executor</code>，再通过工厂模式将 <code>Executor</code> 涉及的所有方法注册成<code>ghttp.HandlerFunc</code>，是 GDP 实现 Controller 控制反转的方式，每一个 HTTP 请求都会触发一次 <code>r.new()</code>，即每个请求都有独立的 <code>docList</code>，每个实例里的 <code>reqParams</code> 也不会串数据，从而避免并发问题</li> <li>虽然 Go 没有继承，但通过工厂模式、接口和函数传递一样能够实现多态，相比于 Java 的编码更扁平，更模块化</li></ul> <h2 id="代码技术逻辑"><a href="#代码技术逻辑" class="header-anchor">#</a> 代码技术逻辑</h2> <h3 id="前置风控与小流量"><a href="#前置风控与小流量" class="header-anchor">#</a> 前置风控与小流量</h3> <p>对内部图片链接进行风控，在业务侧只是调用风控接口而已，传入拿到的 url，然后给基础处理</p> <div class="language-go extra-class"><pre class="language-go"><code>imgUrlInner <span class="token operator">:=</span> <span class="token function">getInnerUrl</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> oriURL<span class="token punctuation">)</span>
Risk<span class="token punctuation">,</span> err <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">RunWenchainRisk</span><span class="token punctuation">(</span>

</code></pre></div><p>下层调用的是 wenchain 的风控接口</p> <p><strong>function/model/service/frcanv/basic/risk.go: RunWenchainRisk</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// RunWenchainRisk 调用文链风控接口</span>

<span class="token function">smallflow</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">,</span> <span class="token operator">&amp;</span>param<span class="token punctuation">)</span>
<span class="token keyword">if</span> c<span class="token punctuation">.</span>Request <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> c<span class="token punctuation">.</span>Request<span class="token punctuation">.</span>URL <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    param<span class="token punctuation">.</span>ExtraValues <span class="token operator">=</span> c<span class="token punctuation">.</span>Request<span class="token punctuation">.</span>URL<span class="token punctuation">.</span><span class="token function">Query</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

</code></pre></div><p>例如 chat 接口中做了一个小流量识别，若命中小流量，则封装额外参数在 param 中</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">smallflow</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">,</span> param <span class="token operator">*</span>genflowtypes<span class="token punctuation">.</span>RunReq<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">var</span> dataExtra <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>any
    <span class="token keyword">if</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span>param<span class="token punctuation">.</span>Extra<span class="token punctuation">,</span> <span class="token operator">&amp;</span>dataExtra<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;param.Extra json Unmarshal failed&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">String</span><span class="token punctuation">(</span><span class="token string">&quot;extra&quot;</span><span class="token punctuation">,</span> <span class="token function">string</span><span class="token punctuation">(</span>param<span class="token punctuation">.</span>Extra<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span>
    <span class="token punctuation">}</span>

        newCtx <span class="token operator">:=</span> wkcontext<span class="token punctuation">.</span><span class="token function">WithHTTPRequest</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">.</span><span class="token function">HTTPRequest</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        sampleList <span class="token operator">:=</span> wkcontext<span class="token punctuation">.</span><span class="token function">GetFeedSample</span><span class="token punctuation">(</span>newCtx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">GetFeedSampleList</span><span class="token punctuation">(</span>newCtx<span class="token punctuation">)</span>
        sampleLists <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span><span class="token punctuation">}</span>

            sampleLists <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>sampleLists<span class="token punctuation">,</span> sample<span class="token punctuation">.</span>ID<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        smallflowV2 <span class="token operator">=</span> strings<span class="token punctuation">.</span><span class="token function">Join</span><span class="token punctuation">(</span>sampleLists<span class="token punctuation">,</span> <span class="token string">&quot;-&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> param<span class="token punctuation">.</span>Channel <span class="token operator">==</span> <span class="token string">&quot;wenku_na_genflow_v2&quot;</span> <span class="token punctuation">{</span>
        smallflowV2 <span class="token operator">=</span> gjson<span class="token punctuation">.</span><span class="token function">Get</span><span class="token punctuation">(</span><span class="token function">string</span><span class="token punctuation">(</span>param<span class="token punctuation">.</span>Extra<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token string">&quot;smallflow&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>Str
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>smallflowV2<span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        dataExtra<span class="token punctuation">[</span><span class="token string">&quot;smallflow_v2&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> smallflowV2
        extra<span class="token punctuation">,</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Marshal</span><span class="token punctuation">(</span>dataExtra<span class="token punctuation">)</span>

            resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;param.Extra json Marshal failed&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;extra&quot;</span><span class="token punctuation">,</span> dataExtra<span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token keyword">return</span>
        <span class="token punctuation">}</span>
        param<span class="token punctuation">.</span>Extra <span class="token operator">=</span> extra
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>可以看到这里只是简单的做了透传而已，真正的小流量逻辑在基础侧实现</p> <h3 id="ppt-状态机"><a href="#ppt-状态机" class="header-anchor">#</a> PPT 状态机</h3> <p>通过事件驱动状态机实现 PPT 生成流程，这是 makeppt 的上层 genflow 的“管控”工作，利用 Golang 库 FSM 实现 PPT 状态流转的有向无环图，这是一个基于 Apache License 2.0 的开源库</p> <ul><li><a href="https://github.com/looplab/fsm" target="_blank" rel="nofollow noopener noreferrer">looplab/fsm: Finite State Machine for Go<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://pkg.go.dev/github.com/looplab/fsm?utm_source=godoc" target="_blank" rel="nofollow noopener noreferrer">fsm package - github.com/looplab/fsm - Go Packages<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2334525" target="_blank" rel="nofollow noopener noreferrer">Go 每日一库之 134：fsm 基有限状态机库<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p><strong>genflow/model/service/genflow/fsm.go</strong></p> <h4 id="定义状态和事件"><a href="#定义状态和事件" class="header-anchor">#</a> 定义状态和事件</h4> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">const</span> <span class="token punctuation">(</span>

<span class="token punctuation">}</span>
</code></pre></div><h3 id="文档转码与拿取"><a href="#文档转码与拿取" class="header-anchor">#</a> 文档转码与拿取</h3> <blockquote><p>bdjson 转码和存取</p></blockquote> <p>在业务侧，收到的所有文档信息其实都是 bdjson 结构，所有的文档都会经过前置的转码处理，把文档内容解析为 bdjson 并存在 bos 里，业务侧将直接根据 fileID 去 bos 里取 bdjson 实现业务逻辑</p> <p>但文档转存 bdjson 是一个异步过程，策略请求打过去时直接把 fileID 返回，后台执行转码、存 BOS 的操作，但业务侧会通过传来的 fileID 直接去 bos 拿 fileInfo，如果“取的太快”，会出现取到空值的情况，因为 bdjson 还没存好，这里有一个等待机制</p> <p><strong>function/model/service/genflowfile/getfileInfo.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>p <span class="token operator">*</span>genflowfile<span class="token punctuation">)</span> <span class="token function">GetFileInfosWait</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> fileIDs <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> seconds <span class="token builtin">int</span><span class="token punctuation">,</span> baseParams base<span class="token punctuation">.</span>AIGCParams<span class="token punctuation">)</span> <span class="token punctuation">(</span>
    finishFiles<span class="token punctuation">,</span> processingFiles <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

    finishFiles <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">)</span>
    processingFiles <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">)</span>
    <span class="token comment">// 实现等待逻辑</span>
    waitFileIDs <span class="token operator">:=</span> fileIDs
    <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> seconds<span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
        files<span class="token punctuation">,</span> err <span class="token operator">:=</span> p<span class="token punctuation">.</span><span class="token function">GetFileInfoMCP</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> waitFileIDs<span class="token punctuation">,</span> baseParams<span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;GetFileInfoMCP error&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>
        waitFileIDs <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
        <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> file <span class="token operator">:=</span> <span class="token keyword">range</span> files <span class="token punctuation">{</span>
            <span class="token keyword">if</span> file<span class="token punctuation">.</span>Status <span class="token operator">!=</span> <span class="token number">1</span> <span class="token punctuation">{</span>
                finishFiles<span class="token punctuation">[</span>file<span class="token punctuation">.</span>FileID<span class="token punctuation">]</span> <span class="token operator">=</span> file
                <span class="token function">delete</span><span class="token punctuation">(</span>processingFiles<span class="token punctuation">,</span> file<span class="token punctuation">.</span>FileID<span class="token punctuation">)</span>
            <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
                waitFileIDs <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>waitFileIDs<span class="token punctuation">,</span> file<span class="token punctuation">.</span>FileID<span class="token punctuation">)</span>
                processingFiles<span class="token punctuation">[</span>file<span class="token punctuation">.</span>FileID<span class="token punctuation">]</span> <span class="token operator">=</span> file
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>waitFileIDs<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
            <span class="token keyword">break</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 等待1秒</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">return</span> finishFiles<span class="token punctuation">,</span> processingFiles<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在实际测试中，只有链接解析 bdjson 出现了“取空值”的情况，原因可能是网络延迟 + 网页抓取耗时过长，所以这里用 sleep 的方式每秒取一次</p> <h3 id="genflow-暂停-与续传"><a href="#genflow-暂停-与续传" class="header-anchor">#</a> GenFlow “暂停” 与续传</h3> <blockquote><p>pause 和 message 接口
在基础侧，通过特殊的 ping 数据帧实现 GenFlow 生成的暂停，在业务侧标记暂停状态，告知前端停止输出，但是他这个暂停在基础好像只是传输暂停（提供 ping 帧），但是后台模型其实还在跑任务，被骗了</p></blockquote> <h4 id="暂停-pause"><a href="#暂停-pause" class="header-anchor">#</a> 暂停 pause</h4> <p>业务层面的暂停：先检查是否有暂停 flag，然后设置暂停 flag</p> <p><strong>genflow/httpserver/controller/genflow/pause.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>u <span class="token operator">*</span>pause<span class="token punctuation">)</span> <span class="token function">OnExecute</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token punctuation">(</span>data any<span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    svc <span class="token operator">:=</span> genflow<span class="token punctuation">.</span><span class="token function">NewGenflow</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    pauseData <span class="token operator">:=</span> message<span class="token punctuation">.</span>PauseData<span class="token punctuation">{</span>
        Type<span class="token punctuation">:</span>    genflow<span class="token punctuation">.</span>PauseTypeUser<span class="token punctuation">,</span>
        SubType<span class="token punctuation">:</span> <span class="token number">1</span><span class="token punctuation">,</span>
        Message<span class="token punctuation">:</span> u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>Message<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> ok <span class="token operator">:=</span> svc<span class="token punctuation">.</span><span class="token function">HasPauseFlag</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token function">int</span><span class="token punctuation">(</span>u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>chatIDInt<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token function">int</span><span class="token punctuation">(</span>u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>queryIDInt<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>

        protocol<span class="token punctuation">.</span><span class="token function">UserOperaMonitor</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> protocol<span class="token punctuation">.</span>UserOperaData<span class="token punctuation">{</span>
            Channel<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>Channel<span class="token punctuation">,</span>
            Operation<span class="token punctuation">:</span> protocol<span class="token punctuation">.</span>OperationTypePause<span class="token punctuation">,</span>
            SubType<span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
            ErrNo<span class="token punctuation">:</span>     fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;%d&quot;</span><span class="token punctuation">,</span> gerror<span class="token punctuation">.</span>ErrorCodeUserPauseExixts<span class="token punctuation">)</span><span class="token punctuation">,</span>
            ChatID<span class="token punctuation">:</span>    u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>chatIDInt<span class="token punctuation">,</span>
            QueryID<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>queryIDInt<span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;fail , already has pause flag&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    key<span class="token punctuation">,</span> err <span class="token operator">:=</span> svc<span class="token punctuation">.</span><span class="token function">SetPauseData</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token function">int</span><span class="token punctuation">(</span>u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>chatIDInt<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token function">int</span><span class="token punctuation">(</span>u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>queryIDInt<span class="token punctuation">)</span><span class="token punctuation">,</span> pauseData<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        protocol<span class="token punctuation">.</span><span class="token function">UserOperaMonitor</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> protocol<span class="token punctuation">.</span>UserOperaData<span class="token punctuation">{</span>
            Channel<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>Channel<span class="token punctuation">,</span>
            Operation<span class="token punctuation">:</span> protocol<span class="token punctuation">.</span>OperationTypePause<span class="token punctuation">,</span>
            SubType<span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
            ErrNo<span class="token punctuation">:</span>     fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;%d&quot;</span><span class="token punctuation">,</span> gerror<span class="token punctuation">.</span>ErrorCodeFuncUnknownError<span class="token punctuation">)</span><span class="token punctuation">,</span>
            ChatID<span class="token punctuation">:</span>    u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>chatIDInt<span class="token punctuation">,</span>
            QueryID<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>queryIDInt<span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span>

        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>

    protocol<span class="token punctuation">.</span><span class="token function">UserOperaMonitor</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> protocol<span class="token punctuation">.</span>UserOperaData<span class="token punctuation">{</span>
        Channel<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>Channel<span class="token punctuation">,</span>
        Operation<span class="token punctuation">:</span> protocol<span class="token punctuation">.</span>OperationTypePause<span class="token punctuation">,</span>
        SubType<span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
        ErrNo<span class="token punctuation">:</span>     <span class="token string">&quot;0&quot;</span><span class="token punctuation">,</span>
        ChatID<span class="token punctuation">:</span>    u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>chatIDInt<span class="token punctuation">,</span>
        QueryID<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>queryIDInt<span class="token punctuation">,</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>

    resp <span class="token operator">:=</span> PauseResponse<span class="token punctuation">{</span>
        Type<span class="token punctuation">:</span>      genflow<span class="token punctuation">.</span>PauseTypeUser<span class="token punctuation">,</span>
        Message<span class="token punctuation">:</span>   u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>Message<span class="token punctuation">,</span>
        SubType<span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
        MessageID<span class="token punctuation">:</span> key<span class="token punctuation">,</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> resp<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里的 has 和 set 逻辑其实就是去设置 Redis ZSet，然后同步 MySQL</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> PauseTToolsList <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    PauseToolsList <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span> <span class="token string">`json:&quot;pause_tools_list&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">const</span> <span class="token punctuation">(</span>
    PauseTypeUser   <span class="token operator">=</span> <span class="token number">1</span>
    PauseTypeSystem <span class="token operator">=</span> <span class="token number">2</span>
    PauseSubTypeToolStop <span class="token operator">=</span> <span class="token number">2</span> <span class="token comment">// 自动暂停</span>
<span class="token punctuation">)</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>genflow<span class="token punctuation">)</span> <span class="token function">checkNeedPause</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">(</span>pauseKey <span class="token builtin">string</span><span class="token punctuation">,</span> needPause <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    cacheKey <span class="token operator">:=</span> g<span class="token punctuation">.</span><span class="token function">MakePauseCacheKey</span><span class="token punctuation">(</span>g<span class="token punctuation">.</span>information<span class="token punctuation">.</span>Base<span class="token punctuation">.</span>ChatID<span class="token punctuation">,</span> g<span class="token punctuation">.</span>information<span class="token punctuation">.</span>Base<span class="token punctuation">.</span>QueryID<span class="token punctuation">)</span>
    keys<span class="token punctuation">,</span> err <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>Genflow<span class="token punctuation">.</span><span class="token function">ZRangeByScoreWithScores</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> cacheKey<span class="token punctuation">,</span> <span class="token operator">&amp;</span>redis<span class="token punctuation">.</span>ZRangeBy<span class="token punctuation">{</span>
        Min<span class="token punctuation">:</span>   <span class="token string">&quot;-inf&quot;</span><span class="token punctuation">,</span>
        Max<span class="token punctuation">:</span>   <span class="token string">&quot;+inf&quot;</span><span class="token punctuation">,</span>
        Count<span class="token punctuation">:</span> <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>keys<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span>
    pauseKey<span class="token punctuation">,</span> needPause <span class="token operator">=</span> keys<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span>Member<span class="token punctuation">.</span><span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token boolean">true</span>
    resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>g<span class="token punctuation">.</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;get pause info &quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;redisCacheKey&quot;</span><span class="token punctuation">,</span> cacheKey<span class="token punctuation">)</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;pauseKey&quot;</span><span class="token punctuation">,</span> pauseKey<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token keyword">return</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>genflow<span class="token punctuation">)</span> <span class="token function">MakePauseCacheKey</span><span class="token punctuation">(</span>chatID <span class="token builtin">int</span><span class="token punctuation">,</span> queryID <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;pause:%d_%d&quot;</span><span class="token punctuation">,</span> chatID<span class="token punctuation">,</span> queryID<span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// 设置暂停的flag信息</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>genflow<span class="token punctuation">)</span> <span class="token function">HasPauseFlag</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> chatID <span class="token builtin">int</span><span class="token punctuation">,</span> queryID <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">bool</span> <span class="token punctuation">{</span>
    cacheKey <span class="token operator">:=</span> g<span class="token punctuation">.</span><span class="token function">MakePauseCacheKey</span><span class="token punctuation">(</span>chatID<span class="token punctuation">,</span> queryID<span class="token punctuation">)</span>
    hasCacheInfo <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>Genflow<span class="token punctuation">.</span><span class="token function">ZCard</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> cacheKey<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Val</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">0</span>
    <span class="token keyword">return</span> hasCacheInfo
<span class="token punctuation">}</span>

<span class="token comment">// 设置暂停后的结果信息</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>genflow<span class="token punctuation">)</span> <span class="token function">SetPauseData</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> chatID <span class="token builtin">int</span><span class="token punctuation">,</span> queryID <span class="token builtin">int</span><span class="token punctuation">,</span> value message<span class="token punctuation">.</span>PauseData<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    _v<span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Marshal</span><span class="token punctuation">(</span>value<span class="token punctuation">)</span>
    cacheKey <span class="token operator">:=</span> g<span class="token punctuation">.</span><span class="token function">MakePauseCacheKey</span><span class="token punctuation">(</span>chatID<span class="token punctuation">,</span> queryID<span class="token punctuation">)</span>

    <span class="token comment">// 设置flag 的标识</span>

    <span class="token keyword">return</span> key<span class="token punctuation">,</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>Genflow<span class="token punctuation">.</span><span class="token function">Set</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token function">string</span><span class="token punctuation">(</span>_v<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

<span class="token comment">// 获取暂停后的结果</span>

<span class="token comment">// 输出停止</span>

</code></pre></div><p>为什么用 ZSet 存？是这样，每次调 chat 接口，其实都不是从头开始 chat，而是根据 queryID 和 chatID 调用 /message 接口，会直接从断点处开始继续输出 SSE，实现续传</p> <h4 id="续传-message"><a href="#续传-message" class="header-anchor">#</a> 续传 message</h4> <p>需要设置 continueKey 和 _continueData 和过期时间，标记重新开始生成</p> <p><strong>genflow/httpserver/controller/genflow/message.go</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">MakeContinueKey</span><span class="token punctuation">(</span>key <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>

            UID<span class="token punctuation">:</span>       u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>UserID<span class="token punctuation">,</span>
