V4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">模型驱动的多智能体系统<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>产品和技术是两回事，不割裂也不强相关，好的技术不一定产出好的产品，好的产品也不一定依赖好的技术，技术达标 + 用户体验 = 好的产品</p> <p>相应的，如果用户体验不行，这个产品总是不能称之为好，除非技术出现断层式的领先，但这不现实</p> <ol><li>首先，我认为现代工业远领先于实验室，或者说，工业界的实验室是遥遥领先的，现代 AI 产业一定得依托于公司资本</li> <li>其次，我始终认为不注重用户体感的公司，造不出断崖式技术领先，于是得到“依托技术断层而不关注用户体验的好产品不现实”的结论，这太“实验室化”了</li></ol> <h2 id="ai-赋能文档产品"><a href="#ai-赋能文档产品" class="header-anchor">#</a> AI 赋能文档产品</h2> <h3 id="轰轰烈烈的-ai-大革命"><a href="#轰轰烈烈的-ai-大革命" class="header-anchor">#</a> 轰轰烈烈的 AI 大革命</h3> <p>以 toC 的文档服务为例，传统的文库，无非提供存储、下载、搜索等服务，然后通过“卖文档”实现盈利，这之中有两个关键问题</p> <ul><li>搜索质量：用户是否需要动用大量精力才能搜到想要的内容</li> <li>文档质量：用户找到的文档是否值得花钱购买</li></ul> <p>这是这类产品的核心竞争力，说白了，就是用户能否从你的文档库获到值得付费的文档内容</p> <p>但在 AI 时代，搜索的门槛被拉的很低，只需要用一个文本框，一个 query，大模型就能给出一大堆回答，这里不得不考虑一个问题，用户是否还会为“人工搜索、手动筛查、付费下载”这套逻辑买单？</p> <p>随着模型的质量越来越高，回复越来越精准，这种费时费力的古法收集文档只会被逐渐淘汰，2025 年百度的广告收益下降 16 个点正印证了这一事实</p> <p>如何立足于“存储”发扬 AI 功能，是 PSIG 是否能存活并增长的核心，这里有两个发展方向，一个是依靠存储发展个性化的 AI（例如提供个体 AI 如 OpenClaw 的记忆服务），一个是依靠存储发展 toB 的 AI 服务（类似于 Saas，但这一套似乎并不奏效），随着智能体的发展，用户 PC 端的使用量显著上升，甚至超过疫情时期的下载量，这充分说明当前 AI 对用户使用习惯的改变，显然电脑更适合与 AI 交互，以将算力转化为可以看得见的生产力，或许依据云存储提供个性化的 AI 记忆服务是一个很好的点子</p> <p>很多人说，AI 智能化，应该将存储和搜索深度绑定，确实有一定道理，但这这么走的话，智能化的是公有数据，可能现在更多考虑的是私有数据与 AI 的结合，走个性化的道路，故而是将存储和 toC 服务深度结合</p> <h3 id="ai-底座与业务逻辑耦合"><a href="#ai-底座与业务逻辑耦合" class="header-anchor">#</a> AI 底座与业务逻辑耦合</h3> <p>通过 MCP 将复杂的业务处理能力提供给智能体，智能体通过策略分发找到对应的 MCP 工具，实现一次处理并返回用户，这里是一个嵌套的功能，业务逻辑需要 AI 功能来实现，上层的智能体调用 MCP 获取业务逻辑，实现 AI - Service - AI 的架构</p> <p>也就是说，现在与用户交互的不再是死板的接口，而是一个个智能体，智能体通过预设的 prompt 调用相应的 MCP 获取具体的业务操作，并返回给用户；也可以理解为，从前的 routes 路由实现的业务分发，被智能体调用 MCP 的方式取代了，当然，调用智能体仍然使用某一接口如 /chat 触发</p> <h3 id="makeppt-详解"><a href="#makeppt-详解" class="header-anchor">#</a> makeppt 详解</h3> <p>makeppt 的生成逻辑是，接收大纲 pptoutline，然后调用底层的 AI 策略服务<code>generalServ.OutlineToPPTSSE()</code>实现，生成一页页 PPT，这里的 outline 是由 makepptoutline 生成的 bdjson 格式数据</p> <h4 id="makepptoutline"><a href="#makepptoutline" class="header-anchor">#</a> makepptoutline</h4> <p>首先是生成大纲 outline，实际上是根据用户 query 和 fileInfo 调用底层策略服务生成，用户 query 很好理解，就是前端的输入，而 fileInfo 就有点讲究了</p> <p>因为前置操作里已经完成了文件的解析和存储（以 Bdjson 格式存在 Bos 里），所以这里只是从 Bos 中拿出对应的 Bdjson，然后封装为 fileInfo 参数丢给下游生成大纲</p> <ol><li>封装 StrategyGeneralPPTSSEReq 请求，主要是文件信息 req.MultiFiles</li> <li>打策略接口<code>generalServ.PPTOutlineSSE()</code>获取 outlineChan 输出流</li> <li>整理 SSE 输出（包括风控和异常处理），封装为 Bdjson 格式的 PPTOutlineInfo 输出到 outlineChan</li></ol> <h4 id="初始化与准备"><a href="#初始化与准备" class="header-anchor">#</a> 初始化与准备</h4> <p>MakePPT 函数：上一步生成的 pptoutline 将封装在入参 makePPTReq 中，makeppt 调用下游策略函数<code>generalServ.OutlineToPPTSSE()</code>生成 PPT 并返回 SSE 流做流式输出</p> <p>初始化与准备</p> <ol><li>通过<code>resouce.LoggerService</code>统一进行日志处理</li> <li>创建管道<code>pptChan := make(chan any)</code></li> <li>通过<code>channel.GetClientTypeByChannel</code>获取 client 判定 outline 格式是否是 bdjson，若不是则会重新调用<code>p.MakePPTOutline</code>获取大纲</li></ol> <p>生成策略参数，准备向下游调用生成 PPT 功能，实际上生成 PPT 的操作是在包含在这一 Params 打向 generalServ.OutlineToPPTSSE 的</p> <ol><li>初始化运行参数：<code>PPTRunInfo := p.PPTInitRunParams(ctx, params)</code></li> <li>构建策略参数和生成流请求：<code>strategyParams, reqGenStream := p.MakePPTStrategyParams(ctx, makePPTReq, params, PPTRunInfo)</code></li> <li>PPT 通知策略？埋点与监控？</li></ol> <h4 id="异步生成-ppt-主流程"><a href="#异步生成-ppt-主流程" class="header-anchor">#</a> 异步生成 PPT 主流程</h4> <p>首先生成 taskId 和成功标志 pagegensuccess</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">var</span> taskId <span class="token builtin">int64</span>
<span class="token keyword">var</span> pptgensuccess <span class="token builtin">bool</span>
<span class="token keyword">if</span> params<span class="token punctuation">.</span>Channel <span class="token operator">==</span> DeepChannelv2 <span class="token operator">||</span> params<span class="token punctuation">.</span>Channel <span class="token operator">==</span> ChannelHarmonyGenflowV2 <span class="token punctuation">{</span>
    taskId <span class="token operator">=</span> <span class="token function">AddPPtTask</span><span class="token punctuation">(</span>ctc<span class="token punctuation">,</span> strategyParams<span class="token punctuation">.</span>Extra<span class="token punctuation">.</span><span class="token punctuation">(</span>function<span class="token punctuation">.</span>GeneralOutlineToPPTReq<span class="token punctuation">)</span><span class="token punctuation">.</span>TplID<span class="token punctuation">,</span> makePPTReq<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>启动协程 go func 处理 PPT 生成逻辑，这一协程将覆盖之后所有的 makeppt 函数</p> <p>定义 defer</p> <ul><li>defer 内容包括关闭通道 pptChan、错误恢复 recover() 处理、updateStatus 状态确认以及回调写回生成状态<code>util.ConsumeCallback(ctx, util.ConsumerTaskCallbackReq{...})</code></li></ul> <p>获取 chatChan：这是核心的 PPT 传输管道，通过 generalServ.OutlineToPPTSSE 获取，这个 generalServ 是 generalppt.NewPPTGeneralService 得到的，而 generalppt 这个实例 function/model/service/generalppt 导入的内容</p> <ol><li>for range 遍历 chatChan，每一次遍历会获取一页 PPT</li> <li>通过 chatChan 拿取 bdjsonTmp，这是由 chatChan 返回的 PPT 内部数据，for 循环将把所以 bdjson 追加到统一的 wholePageBdjson</li> <li>同时将统计页数，统计缺页的页面下标，是否缺页等等信息</li> <li>并且伴随小流量的新版逻辑测试（灰度发布，是否 hitZmixFlow），以及出错处理，若 err != nil，将会把 error 直接输出到 pptChan 然后 return</li></ol> <p>这一过程结束后，将会得到完成的 PPT Json 数据，存放在 wholePageBdjson 中，而后将对缺页 isLackPage 进行处理</p> <ul><li>通过调用 MakePPTRR 获取缺页的 PPT，RR 指 Request-Response，及传统的请求响应（与 sse 流式做区别）</li> <li>由于遍历 chatChan 时统计了缺页下标，这里作为 MakePPTRR 的参数传入即可获得缺失的页面，并载入 wholePageBdjson</li></ul> <p>ok，我们现在获取了完整的 PPT 数据（wholePageBdjson），而后将实现序列化和文档创建/更新的操作</p> <ol><li>通过 sonic 提供的序列化字符串接口 MarshalString(wholePageBdjson) 得到 wholePageBdjsonStr</li> <li>而后根据 hitZmixFlow，若大流量，直接调用 p.PPTCreateWkDoc 同步创建 PPT 文件，获取生成文件的 URL，若小流量，则是异步调用 p.PPTUpdateWkDoc 更新 PPT（这里并不返回 URL，肯定会影响后续处理逻辑）</li> <li>这里的文档全部会存放到 BOS 中</li></ol> <p>最后是处理倒数第二个数据帧<code>generateCard := PPTSSEFileInfo{...}</code></p> <ol><li>将其整理为 infoByte，这是 PPT 的文件信息</li> <li>调用<code>base.WenkuMCPSSEResponse{...string(infoByte)...}</code>获取 PPT 文件信息，并输入到 pptChan 中，这是第一个除了 err 外向 pptChan 输入的信息</li></ol> <p>根据诸多信息生成请求 reqPPTJson 获取 PPT 下载链接 downUrl</p> <ul><li>下载链接通过<code>util.GetPPTEdtDocUrlData(..., PPTRunInfo.UID, reqPPTJson)</code>获取</li> <li>因为之前已经存进了 BOS，所以这里只是做一个拿链接的操作</li> <li>这里的 downUrl 包含了多个信息，通过 / 分割数组<code>urlParts := strings.Split(downUrl, &quot;/&quot;)</code>，从固定的下标获取相应数据，合理吗</li></ul> <p>解析 downUrl 构造文件注册信息，上面已经存好了 BOS，这里是把文件信息存入 MySQL（我猜）</p> <ul><li>这里调用了一个下游 Ral，路径为<code>WkFileAddAPI: /service/wcdata/userknowledge/createfile</code>，应该是把这个生成的文件存到用户的知识库</li> <li>这里有两种方式，一种是 HTML PPT 存入，一种是传统 PPT 存入，前者将会直接把 HTML PPT 输出到 pptChan 返回给上层，后者暂不做处理</li></ul> <p>然后捏，这里生成的 PPT 已经入库成功了，要做最后的数据整理了</p> <ol><li><p>首先是通过 pptChan 发送 PPT 结束帧 thoughtRes：<code>pptChan &lt;- thoughtRes</code>，结束帧 thoughtRes 包括</p> <div class="language-go extra-class"><pre class="language-go"><code>thoughtRes <span class="token operator">:=</span> base<span class="token punctuation">.</span>WenkuMCPSSEResponse<span class="token punctuation">{</span><span class="token punctuation">}</span>
thoughtRes<span class="token punctuation">.</span>ThoughtType <span class="token operator">=</span> ThoughtTypeMakePPTEnd
thoughtRes<span class="token punctuation">.</span>Result <span class="token operator">=</span> <span class="token function">string</span><span class="token punctuation">(</span>pptRespByte<span class="token punctuation">)</span>
thoughtRes<span class="token punctuation">.</span>ResultType <span class="token operator">=</span> base<span class="token punctuation">.</span>ResultTypeThoughts
pptChan <span class="token operator">&lt;-</span> thoughtRes
</code></pre></div><p>其中<code>pptRespByte := sonic.Marshal(pptResp)</code>是经过 sonic 整理过的 ppt 注册的返回<code>pptResp := RegisterPPT{ FileID: []string{fileID} }</code></p></li> <li><p>发送 FileIDs 帧 outputThoughtRes</p></li> <li><p>发送最终输出帧 lastRes</p></li></ol> <p>在 go func 外，返回通道 pptChan</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>p <span class="token operator">*</span>mcp<span class="token punctuation">)</span> <span class="token function">MakePPT</span><span class="token punctuation">(</span><span class="token operator">...</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 数据准备</span>
    pptChan <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> any<span class="token punctuation">)</span>
    <span class="token comment">// 主流程</span>
    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">// 后置操作</span>
        <span class="token keyword">defer</span> <span class="token keyword">func</span> <span class="token punctuation">{</span>
        <span class="token comment">// ...</span>
    	<span class="token punctuation">}</span>
        <span class="token comment">// 生成 PPT</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> pptChan<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>实现 SSE 流的传输</p> <h2 id="数据库设计与缓存"><a href="#数据库设计与缓存" class="header-anchor">#</a> 数据库设计与缓存</h2> <p>以文档存储为例，数据库存储文档信息，文档真正落盘在 BOS（对象存储系统）</p> <h3 id="数据表的设计和读取"><a href="#数据表的设计和读取" class="header-anchor">#</a> 数据表的设计和读取</h3> <p>文档表结构</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> Doc <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	DocId      <span class="token builtin">uint64</span> <span class="token string">`ddb:&quot;doc_id&quot;`</span>
	MainStatus <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;main_status&quot;`</span>
	SubStatus  <span class="token builtin">uint8</span>  <span class="token string">`ddb:&quot;sub_status&quot;`</span>
	CreateTime <span class="token builtin">uint32</span> <span class="token string">`ddb:&quot;create_time&quot;`</span>

		<span class="token punctuation">}</span><span class="token punctuation">(</span>conf<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	docWg<span class="token punctuation">.</span><span class="token function">Wait</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token keyword">if</span> storeID <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		storeIDReadyClosed<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token function">close</span><span class="token punctuation">(</span>storeIDReady<span class="token punctuation">)</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	wg<span class="token punctuation">.</span><span class="token function">Wait</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> daoErr <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> daoErr
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="redis-配置和缓存"><a href="#redis-配置和缓存" class="header-anchor">#</a> Redis 配置和缓存</h3> <p>Redis 键值库配置和数据结构</p> <p>config.go</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">const</span> <span class="token punctuation">(</span>
	<span class="token comment">// DaoIDTypeDocID db查询条件是doc_id</span>
	DaoIDTypeDocID <span class="token operator">=</span> <span class="token number">1</span>
	<span class="token comment">// DaoIDTypeStoreID db查询条件是store_id</span>
	DaoIDTypeStoreID <span class="token operator">=</span> <span class="token number">2</span>
<span class="token punctuation">)</span>

<span class="token keyword">var</span> <span class="token punctuation">(</span>
	cMap configMap <span class="token operator">=</span> configMap<span class="token punctuation">{</span>m<span class="token punctuation">:</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span>Config<span class="token punctuation">)</span><span class="token punctuation">}</span>

	<span class="token comment">// ErrFieldNotRegistered 使用的缓存字段未注册</span>
	ErrFieldNotRegistered <span class="token operator">=</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;cache field not registered&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">)</span>

<span class="token comment">// Field 缓存内容在hash表中的Field类型</span>
<span class="token keyword">type</span> Field <span class="token builtin">string</span>

<span class="token comment">// Config 注册一个Cache所需要的信息，</span>
<span class="token comment">// Field表征字段的key</span>
<span class="token comment">// DaoFunc指在未命中缓存时的数据生成方法，需要满足形式func(ctx context.Context, id uint64) ((pointer to struct, error)</span>
<span class="token comment">// DaoIDType 指DaoFunc输入的ID类型</span>
<span class="token comment">// ExpireTime 缓存的过期时间</span>
<span class="token keyword">type</span> Config <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	Field      Field
	DaoFunc    <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
	DaoIDType  <span class="token builtin">int</span>
	ExpireTime time<span class="token punctuation">.</span>Duration

	<span class="token comment">// 存储的结构体类型</span>
	cacheStructType reflect<span class="token punctuation">.</span>Type
<span class="token punctuation">}</span>

<span class="token comment">// configMap 用于存储Config的映射关系</span>
<span class="token keyword">type</span> configMap <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	m <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span>Config
	sync<span class="token punctuation">.</span>Mutex
<span class="token punctuation">}</span>

<span class="token comment">// MustRegister 注册一批缓存conf，如果不合法直接panic</span>
<span class="token keyword">func</span> <span class="token function">MustRegister</span><span class="token punctuation">(</span>conf <span class="token operator">...</span>Config<span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">Register</span><span class="token punctuation">(</span>conf<span class="token operator">...</span><span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token function">panic</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token comment">// Register 注册一个缓存</span>
<span class="token keyword">func</span> <span class="token function">Register</span><span class="token punctuation">(</span>conf <span class="token operator">...</span>Config<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
	cMap<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> cMap<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> c <span class="token operator">:=</span> <span class="token keyword">range</span> conf <span class="token punctuation">{</span>
		<span class="token comment">// 检查Key是否有重复</span>
		<span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> ok <span class="token operator">:=</span> cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>c<span class="token punctuation">.</span>Field<span class="token punctuation">]</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>
			<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;cache field already exists, field: %s&quot;</span><span class="token punctuation">,</span> c<span class="token punctuation">.</span>Field<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 检查DaoIDType是否合法</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">!=</span> DaoIDTypeDocID <span class="token operator">&amp;&amp;</span> c<span class="token punctuation">.</span>DaoIDType <span class="token operator">!=</span> DaoIDTypeStoreID <span class="token punctuation">{</span>
			<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;illegal DaoIDType: %d&quot;</span><span class="token punctuation">,</span> c<span class="token punctuation">.</span>DaoIDType<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 如果c.ExpireTime小于0，则使用默认的基础过期时间</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span>ExpireTime <span class="token operator">&lt;=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			c<span class="token punctuation">.</span>ExpireTime <span class="token operator">=</span> defaultFieldExpireTime
		<span class="token punctuation">}</span>

		<span class="token comment">// 检查DaoFunc是否合法</span>
		fType <span class="token operator">:=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span>c<span class="token punctuation">.</span>DaoFunc<span class="token punctuation">)</span>
		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Func <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;DaoFunc must be a func&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">NumIn</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;number of DaoFunc parameters must be 2&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">NumOut</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;number of DaoFunc return values must be 2&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">In</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>context<span class="token punctuation">.</span>Context<span class="token punctuation">)</span><span class="token punctuation">(</span><span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;first parameter of DaoFunc must be context.Context interface&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">In</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Uint64 <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;second parameter of DaoFunc must be uint64&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Ptr <span class="token operator">||</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Kind</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span>Struct <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;first return value of DaoFunc must be pointer to struct&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token keyword">if</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">!=</span> reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span><span class="token builtin">error</span><span class="token punctuation">)</span><span class="token punctuation">(</span><span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;second return value of DaoFunc must be error interface&quot;</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>

		<span class="token comment">// 设置DaoFunc返回的结果并注册到map</span>
		c<span class="token punctuation">.</span>cacheStructType <span class="token operator">=</span> fType<span class="token punctuation">.</span><span class="token function">Out</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Elem</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		cMap<span class="token punctuation">.</span>m<span class="token punctuation">[</span>c<span class="token punctuation">.</span>Field<span class="token punctuation">]</span> <span class="token operator">=</span> c
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>文档缓存，对外暴露的缓存读取接口</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// WithCache 同时获取多个 field 的数据，优先从缓存中读取，不存在则使用传入的 dataOps 读取</span>
<span class="token keyword">func</span> <span class="token function">WithCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	itemInfoMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>

	filteredFields<span class="token punctuation">,</span> storeID <span class="token operator">:=</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> itemInfoMap<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中全部查询完毕，返回</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>filteredFields<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 函数退出时延迟存储缓存</span>
	dbResMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>dbResMap<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">setCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> dbResMap<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set conv_range info to cache failed, docID=%d, err=%s&quot;</span><span class="token punctuation">,</span> docID<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 缓存中没有查到的从db查询</span>
	dbResMap<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">goGetFieldFromDB</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> filteredFields<span class="token punctuation">,</span> storeID<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>

	<span class="token comment">// 合并两个map</span>
	<span class="token keyword">for</span> field<span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> dbResMap <span class="token punctuation">{</span>
		itemInfoMap<span class="token punctuation">[</span>field<span class="token punctuation">]</span> <span class="token operator">=</span> value
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> itemInfoMap<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre></div><p>defer 的作用是延迟逻辑，在函数返回时才执行，相当于定义一个回调函数，其作用域等同于函数内部</p> <p>其中，getFieldFromCache 从 Redis 中取缓存，逻辑如下</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// getFieldCache 从缓存中获取指定field的数据，并检查field中是否有需要storeID作为主键的数据</span>
<span class="token comment">// 将cache中查询到的内容，写入itemInfoMap，并返回未查询到的field列表</span>
<span class="token keyword">func</span> <span class="token function">getFieldFromCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> docID <span class="token builtin">uint64</span><span class="token punctuation">,</span> itemInfoMap <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> fields <span class="token operator">...</span>Field<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>Field<span class="token punctuation">,</span> <span class="token builtin">uint64</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token comment">// 从缓存中获取所有filed的数据</span>
	cacheDatas<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">getCache</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> docID<span class="token punctuation">,</span> fields<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token comment">// GetCache中出错也会把成功的结果返回</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token comment">// 查询出错</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;get cache failed, err=%s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 缓存中未查到数据，直接返回。</span>

		cd <span class="token operator">:=</span> <span class="token function">packCacheData</span><span class="token punctuation">(</span><span class="token function">string</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">,</span> field<span class="token punctuation">,</span> expire<span class="token punctuation">)</span>

		dataSlice <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>dataSlice<span class="token punctuation">,</span> <span class="token function">string</span><span class="token punctuation">(</span>field<span class="token punctuation">)</span><span class="token punctuation">,</span> cd<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	key <span class="token operator">:=</span> <span class="token function">generateKey</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>

	sc <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>DocPush<span class="token punctuation">.</span><span class="token function">HMSet</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> dataSlice<span class="token operator">...</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;hmset failed, key=%s, err=%s; %s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> cacheErr<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> sc<span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;hmset failed, key=%s, err=%s; %s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">,</span> cacheErr<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 给过期时间加上随机值，防止击穿</span>
	expireTime <span class="token operator">:=</span> defaultKeyExpireTime <span class="token operator">+</span> <span class="token punctuation">(</span>time<span class="token punctuation">.</span><span class="token function">Duration</span><span class="token punctuation">(</span>rand<span class="token punctuation">.</span><span class="token function">Int63n</span><span class="token punctuation">(</span>randTimeRange<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
	sc <span class="token operator">=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>DocPush<span class="token punctuation">.</span><span class="token function">Expire</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> expireTime<span class="token punctuation">)</span>
	<span class="token keyword">if</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set expire error, key=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> ok<span class="token punctuation">,</span> err <span class="token operator">:=</span> sc<span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">||</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
		resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set expire error, key=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> cacheErr
<span class="token punctuation">}</span>

	s <span class="token operator">:=</span> strings<span class="token punctuation">.</span><span class="token function">Split</span><span class="token punctuation">(</span>d<span class="token punctuation">,</span> cacheDataSplitChar<span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">2</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;parseCacheData: data split result length not 2&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	expireAt<span class="token punctuation">,</span> err <span class="token operator">:=</span> strconv<span class="token punctuation">.</span><span class="token function">ParseInt</span><span class="token punctuation">(</span>s<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">64</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;parseCacheData: expireAt parse int failed, err=%s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	c <span class="token operator">:=</span> cacheData<span class="token punctuation">{</span>
		Data<span class="token punctuation">:</span>     <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>s<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
		ExpireAt<span class="token punctuation">:</span> expireAt<span class="token punctuation">,</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token operator">&amp;</span>c<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

<span class="token comment">// packCacheData 使用自定义方式打包 cacheData</span>
<span class="token keyword">func</span> <span class="token function">packCacheData</span><span class="token punctuation">(</span>d <span class="token builtin">string</span><span class="token punctuation">,</span> field Field<span class="token punctuation">,</span> expire time<span class="token punctuation">.</span>Duration<span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> expire <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		expire <span class="token operator">=</span> defaultFieldExpireTime
	<span class="token punctuation">}</span>

	<span class="token comment">// 以当前时间点为原点，设置 expireAt</span>
	expireAtStr <span class="token operator">:=</span> strconv<span class="token punctuation">.</span><span class="token function">FormatInt</span><span class="token punctuation">(</span><span class="token function">int64</span><span class="token punctuation">(</span>expire<span class="token operator">/</span>time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span><span class="token operator">+</span>time<span class="token punctuation">.</span><span class="token function">Now</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Unix</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token number">10</span><span class="token punctuation">)</span>
	c <span class="token operator">:=</span> expireAtStr <span class="token operator">+</span> cacheDataSplitChar <span class="token operator">+</span> d

<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">defaultMarshaler</span><span class="token punctuation">(</span>d <span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">byte</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	b<span class="token punctuation">,</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Marshal</span><span class="token punctuation">(</span>d<span class="token punctuation">)</span>

	err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> <span class="token operator">&amp;</span>v<span class="token punctuation">)</span>

	<span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span>

</code></pre></div><h3 id="zset-存储智能体对话"><a href="#zset-存储智能体对话" class="header-anchor">#</a> ZSet 存储智能体对话</h3> <p>采用有序集合存储 AI 对话，具体而言，每新增一条对话，其 score 加一，这样在读取历史会话或者加载剩余会话时，只需要取 score 范围即可，同时保证对话的有序性</p> <p>支持</p> <ol><li>实时写入</li> <li>按序输出</li> <li>断点续传</li> <li>重新生成</li></ol> <p>注意，score 为 0 表示对话未开始，在编码时先执行 +1，再进行存取</p> <h2 id="文档处理与解耦"><a href="#文档处理与解耦" class="header-anchor">#</a> 文档处理与解耦</h2> <h3 id="处理状态机和事件驱动"><a href="#处理状态机和事件驱动" class="header-anchor">#</a> 处理状态机和事件驱动</h3> <blockquote><p><a href="https://github.com/looplab/fsm" target="_blank" rel="nofollow noopener noreferrer">looplab/fsm: Finite State Machine for Go<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>通过事件驱动状态机实现 PPT 生成流程，这是 makeppt 的上层 genflow 的“管控”工作，利用 Golang 库 FMS 实现 PPT 状态流转的有向无环图，这是一个基于 Apache License 2.0 的开源库</p> <ul><li><a href="https://github.com/looplab/fsm" target="_blank" rel="nofollow noopener noreferrer">looplab/fsm: Finite State Machine for Go<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://pkg.go.dev
