dh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">消息队列<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="消息队列概述"><a href="#消息队列概述" class="header-anchor">#</a> 消息队列概述</h2> <h3 id="message-queue"><a href="#message-queue" class="header-anchor">#</a> Message Queue</h3> <p>消息队列，说白了就是一个队列的数据结构，先进先出，顺序排队执行，根本上是为了解决业务的解耦问题，通过队列的中间层实现业务的异步顺序执行</p> <ul><li>例如使用 Redis 实现简单的消息队列，就是通过 Redis 的 List，进行<code>lpush / rpop</code>操作来实现一对多的场景（一个生产者对应多个消费者），详见 <a href="https://northboat.github.io/pages/aee6d6/#redis-%E6%B6%88%E6%81%AF%E9%98%9F%E5%88%97" target="_blank" rel="nofollow noopener noreferrer">键值数据库 | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>我们把 push 任务进队列的进程称为生产者，将 pop 任务出队列的进程称为消费者，在此基础上，有这样两种对应模式</p> <ul><li>一个生产者对应一个消费者，很简单的流水线模式，一个递给下一个</li> <li>一个生产者对应多个消费者，一经发布，所有“订阅”了这一队列的消费者都会执行“消费”行为</li></ul> <p>另外，如何确保消息的正确消费是消息队列一个重要的研究课题</p> <ul><li>如何处理消息太多了在队列中堆积的情形 → 朴素的增加消费者 or 其他</li> <li>如何确保消息被真正的消费 → 对应了超时重传和重试机制，当多次重试失败，消息将被丢入死信队列 DLQ（Dead Letter Queue） —— 一个专门放无法被正确消费的消息的垃圾桶，这么做是为了防止消息彻底丢失，应当有一个记录</li> <li>如何正确的处理死信队列 → 通过定时任务扫描死信队列并做相应处理</li></ul> <h3 id="消息队列模型"><a href="#消息队列模型" class="header-anchor">#</a> 消息队列模型</h3> <h4 id="点对点模型"><a href="#点对点模型" class="header-anchor">#</a> 点对点模型</h4> <p>队列模型，又叫点对点模型，每个生产者对应一个消费者（一对一）</p> <p>比如 OJ 中 MQ 的使用，后端收到判题请求后，先将判题记录写入数据库，而后作为生产者将判题记录 ID 写入消息队列，此时真正的判题模块由于订阅了该判题队列，于是自动从 MQ 中读出判题请求 ID，从 DB 中拿取数据执行判题业务，最后通过 WebSocket 返回</p> <h4 id="订阅发布模型"><a href="#订阅发布模型" class="header-anchor">#</a> 订阅发布模型</h4> <p>订阅发布模型，一个生产者将把消息广播到每一个订阅者，即一对多</p> <p>订阅发布能够将串行执行的任务变成“并行”，例如以下串行场景，他是一步步执行</p> <img src="/assets/img/image-20250303143017426.77128625.png"> <p>若引入 MQ，它可以变成这样的形式，这是合理的，实际上，更新积分、通知商家、更新用户标签这三个事件并没有直接的逻辑联系或是执行顺序问题，他们都是由“更新订单状态触发”</p> <img src="/assets/img/image-20250303143143342.6d217d1f.png"> <p>从而大幅提高效率</p> <p>上述订阅发布模式的举例是 MQ 一大应用场景，<strong>异步处理</strong>，而队列模式的举例是<strong>应用解耦</strong>，消息队列的常用场景如下</p> <ul><li>异步处理：就是将一些非核心的业务流程以异步并行的方式执行，从而减少请求响应时间，提高系统吞吐量</li> <li>应用解耦：顾名思义就是解除应用系统之间的耦合依赖。通过消息队列，使得每个应用系统不必受其他系统影响，可以更独立自主运行</li> <li>流量削峰：是消息队列中的常用场景，一般在秒杀或团抢活动中使用广泛</li> <li>消息通讯：指应用间的数据通信，消息队列一般都内置了高效的通信机制，因此也可以用在纯的消息通讯。比如实现点对点消息队列，或者聊天室等点对点通讯</li></ul> <h3 id="观察者设计模式"><a href="#观察者设计模式" class="header-anchor">#</a> 观察者设计模式</h3> <p>行为型设计模式的一种，消息队列中的发布订阅模型天然符合这样的设计模式，同时这样的设计模式会造就解耦这样的上层效果</p> <blockquote><p>解耦的思路可以理解为设计模式中观察者模式的具体使用效果，当对象间存在一对多关系时，则使用观察者模式，它是一种定义对象间的一种一对多的依赖关系，当一个对象的状态发生改变时，所有依赖于它的对象都得到通知并被自动更新</p></blockquote> <p>例如发布-订阅模式是观察者模式的一种，比如美团的订单推送、实时群聊系统，都会有这样的需求，即有多个“用户”等待某一个事件摔杯为号</p> <p>实现发布-订阅的几种方式</p> <ol><li>轮询关系型数据库实现“订阅”</li> <li>采用 Redis 的<code>publish(&quot;channel&quot;, &quot;message&quot;)</code>和<code>subscribe(&quot;channel&quot;)</code>来实现发布订阅</li> <li>利用 WebSocket 长连接实现即时的发布订阅</li> <li>采用消息队列实现大数据高并发情况下的发布订阅</li></ol> <table><thead><tr><th style="text-align:left;"><strong>场景</strong></th> <th style="text-align:left;"><strong>推荐方案</strong></th> <th style="text-align:left;"><strong>理由</strong></th></tr></thead> <tbody><tr><td style="text-align:left;">高并发、大数据</td> <td style="text-align:left;">Kafka/RocketMQ</td> <td style="text-align:left;">高吞吐、持久化、分区有序</td></tr> <tr><td style="text-align:left;">实时聊天/通知</td> <td style="text-align:left;">WebSocket + Redis Pub/Sub</td> <td style="text-align:left;">低延迟、简单易用</td></tr> <tr><td style="text-align:left;">企业级复杂路由</td> <td style="text-align:left;">RabbitMQ</td> <td style="text-align:left;">灵活的路由规则、可靠性高</td></tr> <tr><td style="text-align:left;">IoT 设备通信</td> <td style="text-align:left;">MQTT（如 Mosquitto）</td> <td style="text-align:left;">低带宽消耗、支持 QoS</td></tr> <tr><td style="text-align:left;">云原生应用</td> <td style="text-align:left;">AWS SNS/SQS 或阿里云 MNS</td> <td style="text-align:left;">免运维、弹性扩展</td></tr> <tr><td style="text-align:left;">小型单机应用</td> <td style="text-align:left;">语言内置事件（如 Spring Event）</td> <td style="text-align:left;">无需额外依赖，开发快捷</td></tr></tbody></table> <h2 id="rabbitmq-基础"><a href="#rabbitmq-基础" class="header-anchor">#</a> RabbitMQ 基础</h2> <h3 id="部署与集成"><a href="#部署与集成" class="header-anchor">#</a> 部署与集成</h3> <p>安装和启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> rabbitmq rabbitmqadmin
<span class="token function">sudo</span> rabbitmq-plugins <span class="token builtin class-name">enable</span>
<span class="token function">sudo</span> rabbitmq-server
</code></pre></div><p>默认端口</p> <ul><li>管理界面：15672</li> <li>客户端：5672</li></ul> <p>后台运行</p> <div class="language-bash extra-class"><pre class="language-bash"><code>rabbitmq-server <span class="token parameter variable">-detached</span>
</code></pre></div><p>Spring 集成：引入 RabbitMQ 依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.boot<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-amqp<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>配置文件</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">spring</span><span class="token punctuation">:</span>
	<span class="token key atrule">rabbitmq</span><span class="token punctuation">:</span>
		<span class="token key atrule">host</span><span class="token punctuation">:</span> 10.2.1.231
		<span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">5672</span>
		<span class="token key atrule">username</span><span class="token punctuation">:</span> northboat
		<span class="token key atrule">password</span><span class="token punctuation">:</span> <span class="token number">123456</span>
		<span class="token key atrule">virtualHost</span><span class="token punctuation">:</span> order
</code></pre></div><p>一个简单的消费者，订阅队列&quot;<code>rabbitmq_queue&quot;</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Consumer</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@RabbitHandler</span>
	<span class="token annotation punctuation">@RabbitListener</span><span class="token punctuation">(</span>queuesToDeclare <span class="token operator">=</span> <span class="token annotation punctuation">@Queue</span><span class="token punctuation">(</span><span class="token string">&quot;rabbitmq_queue&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">process</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;消费者消费消息: &quot;</span> <span class="token operator">+</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一个简单的生产者</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Producer</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@Autowired</span>
	<span class="token keyword">private</span> <span class="token class-name">RabbitTemplate</span> rabbitTemplate<span class="token punctuation">;</span>
	
	<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">produce</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">String</span> message <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot;Beijing&quot;</span><span class="token punctuation">;</span>
		<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;生产者产生消息: &quot;</span> <span class="token operator">+</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
		rabbitTemplate<span class="token punctuation">.</span><span class="token function">convertAndSend</span><span class="token punctuation">(</span><span class="token string">&quot;rabbitmq_queue&quot;</span><span class="token punctuation">,</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里传输的是简单字符串，我们尝试传输一个实体对象 User，需要进行序列化，即继承<code>Serializable</code>类</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">User</span> <span class="token keyword">implements</span> <span class="token class-name">Serializable</span> <span class="token punctuation">{</span>
	<span class="token keyword">public</span> <span class="token class-name">String</span> name<span class="token punctuation">;</span>
	<span class="token keyword">public</span> <span class="token class-name">String</span> password<span class="token punctuation">;</span>
	<span class="token comment">// 省略get和set方法</span>
<span class="token punctuation">}</span>
</code></pre></div><p>仍然通过<code>convertAndSend</code>方法进行传输</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Producer</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@Autowired</span>
	<span class="token keyword">private</span> <span class="token class-name">RabbitTemplate</span> rabbitTemplate<span class="token punctuation">;</span>
	
	<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">produce</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>	
		<span class="token class-name">User</span> user <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">User</span><span class="token punctuation">(</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;生产者生产消息: &quot;</span> <span class="token operator">+</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
		
		rabbitTemplate<span class="token punctuation">.</span><span class="token function">convertAndSend</span><span class="token punctuation">(</span><span class="token string">&quot;rabbitmq_queue_object&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>convertAndSend() 方法支持 String、Integer 等基础数据类型，也可以传输复杂对象 Object，但传输的对象需要实现序列化接口 Serializable</p> <h3 id="rabbitmq-交换机"><a href="#rabbitmq-交换机" class="header-anchor">#</a> RabbitMQ 交换机</h3> <blockquote><p>Exchange，参照网络交换机的设计逻辑，用于定义 MQ 的转发规则</p></blockquote> <p>Direct 交换机做精确的一对一、一对多传输，用于任务分发，例如</p> <p>绑定队列到 Direct 交换机</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 声明 Direct 交换机</span>
channel<span class="token punctuation">.</span><span class="token function">exchangeDeclare</span><span class="token punctuation">(</span><span class="token string">&quot;direct_logs&quot;</span><span class="token punctuation">,</span> <span class="token class-name">BuiltinExchangeType</span><span class="token punctuation">.</span><span class="token constant">DIRECT</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 声明队列</span>
channel<span class="token punctuation">.</span><span class="token function">queueDeclare</span><span class="token punctuation">(</span><span class="token string">&quot;error_queue&quot;</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
channel<span class="token punctuation">.</span><span class="token function">queueDeclare</span><span class="token punctuation">(</span><span class="token string">&quot;info_queue&quot;</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 绑定队列到交换机，指定绑定键</span>
channel<span class="token punctuation">.</span><span class="token function">queueBind</span><span class="token punctuation">(</span><span class="token string">&quot;error_queue&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;direct_logs&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;error&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
channel<span class="token punctuation">.</span><span class="token function">queueBind</span><span class="token punctuation">(</span><span class="token string">&quot;info_queue&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;direct_logs&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;info&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>生产者发送消息</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 发送error级别的消息，路由键为&quot;error&quot;</span>
channel<span class="token punctuation">.</span><span class="token function">basicPublish</span><span class="token punctuation">(</span><span class="token string">&quot;direct_logs&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;error&quot;</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">,</span> <span class="token string">&quot;Error message&quot;</span><span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 发送info级别的消息，路由键为&quot;info&quot;</span>
channel<span class="token punctuation">.</span><span class="token function">basicPublish</span><span class="token punctuation">(</span><span class="token string">&quot;direct_logs&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;info&quot;</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">,</span> <span class="token string">&quot;Info message&quot;</span><span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>其他交换机</p> <table><thead><tr><th style="text-align:center;">交换机类型</th> <th style="text-align:center;">匹配规则</th> <th style="text-align:center;">适用场景</th></tr></thead> <tbody><tr><td style="text-align:center;">Direct</td> <td style="text-align:center;">路由键与绑定键完全相等</td> <td style="text-align:center;">精准路由、任务分发</td></tr> <tr><td style="text-align:center;">Fanout</td> <td style="text-align:center;">忽略路由键，广播到所有绑定队列</td> <td style="text-align:center;">发布订阅、消息广播</td></tr> <tr><td style="text-align:center;">Topic</td> <td style="text-align:center;">路由键与绑定键支持通配符（<code>*</code>匹配一个词，<code>#</code>匹配多个词）</td> <td style="text-align:center;">模糊匹配、分类路由</td></tr> <tr><td style="text-align:center;">Headers</td> <td style="text-align:center;">基于消息头属性匹配，不依赖路由键</td> <td style="text-align:center;">复杂属性匹配（极少使用）</td></tr></tbody></table> <h3 id="rabbitmq-三大队列"><a href="#rabbitmq-三大队列" class="header-anchor">#</a> RabbitMQ 三大队列</h3> <p>Classic 经典队列、Quorum 仲裁队列和 Stream 流式队列</p> <table><thead><tr><th style="text-align:center;">特性维度</th> <th style="text-align:center;">Classic 经典队列</th> <th style="text-align:center;">Quorum 仲裁队列</th> <th style="text-align:center;">Stream 流式队列</th></tr></thead> <tbody><tr><td style="text-align:center;"><strong>队列类型</strong></td> <td style="text-align:center;">基础队列</td> <td style="text-align:center;">分布式一致性队列</td> <td style="text-align:center;">流式日志队列</td></tr> <tr><td style="text-align:center;"><strong>一致性算法</strong></td> <td style="text-align:center;">无（依赖镜像异步复制）</td> <td style="text-align:center;">Raft 算法（强一致性）</td> <td style="text-align:center;">Raft 算法（强一致性）</td></tr> <tr><td style="text-align:center;"><strong>高可用保障</strong></td> <td style="text-align:center;">镜像队列（可能丢消息）</td> <td style="text-align:center;">仲裁组复制（零数据丢失）</td> <td style="text-align:center;">仲裁组复制（零数据丢失）</td></tr> <tr><td style="text-align:center;"><strong>消费模式</strong></td> <td style="text-align:center;">竞争消费（推 / 拉）</td> <td style="text-align:center;">竞争消费（仅推）</td> <td style="text-align:center;">独占 / 广播消费（支持 Offset）</td></tr> <tr><td style="text-align:center;"><strong>消息留存</strong></td> <td style="text-align:center;">消费 ACK 后删除</td> <td style="text-align:center;">消费 ACK 后删除</td> <td style="text-align:center;">按保留策略清理（不随消费删除）</td></tr> <tr><td style="text-align:center;"><strong>回溯消费</strong></td> <td style="text-align:center;">不支持</td> <td style="text-align:center;">不支持</td> <td style="text-align:center;">支持（任意 Offset 位置）</td></tr> <tr><td style="text-align:center;"><strong>吞吐性能</strong></td> <td style="text-align:center;">高（无一致性开销）</td> <td style="text-align:center;">中（一致性同步开销）</td> <td style="text-align:center;">高（追加写 + 批量消费）</td></tr> <tr><td style="text-align:center;"><strong>适用场景</strong></td> <td style="text-align:center;">低延迟、中等可靠性业务</td> <td style="text-align:center;">核心业务、强可靠性要求</td> <td style="text-align:center;">海量存储、多播、回溯消费</td></tr></tbody></table> <h3 id="确保可靠传输"><a href="#确保可靠传输" class="header-anchor">#</a> 确保可靠传输</h3> <p>在使用消息队列时，因为生产者和消费者不直接交互，所以面临下面几个问题</p> <ol><li>要把消息添加到队列中，怎么保证消息成功添加？</li> <li>如何保证消息发送出去时一定会被消费者正常消费？</li> <li>消费者正常消费了，生产者或者队列如何知道消费者已经成功消费了消息？</li></ol> <p>那么，如何保证消息 100% 可靠性发送？我们可以采用 ack 应答 + 日志记录 + 定时任务来实现</p> <p>假设有一个创建订单业务，后端收到请求后，将该业务通过消息队列发送到具体的业务模块，我们这样保证消息的可靠传输</p> <ol><li>完成订单业务处理后，生产者发送一条消息到消息队列，同时记录这条操作日志（发送中）</li> <li>消费者收到消息后处理进行</li> <li>消费者处理成功后给消息队列发送 ack 应答</li> <li>消息队列收到 ack 应答后，给生成者的 Confirm Listener 发送确认</li> <li>生产者对消息日志表进行操作，修改之前的日志状态（发送成功）</li> <li>在消费端返回应答的过程中，可能发生网络异常，导致生产者未收到应答消息，因此需要一个定时任务去提取其状态为“发送中”并已经超时的消息集合</li> <li>使用定时任务判断为消息事先设置的最大重发次数，大于最大重发次数就判断消息发送失败，更新日志记录状态为发送失败</li></ol> <p>流程图如下</p> <img src="data:image/png;base64,UklGRhAXAABXRUJQVlA4IAQXAACQggCdASpCAusAPm00lUikIqIhIjI62IANiWlu/BV4hUbl6JOHbO6X60/3ntX/xn5E+dv4z8q/ZPzJ/u/txZT7TP5t9mP0/9z9C/9P4T/EP/L9QL8q/n/+l8TvaJbD/pfQC9Yvpn/G/w/iLf7noJ9bP937gH8y/r3ov/o/Bv+3/6n2Af5f/if2D91/+x/+f+y9BP03/6/9R8BP8+/wP/c7HX7qkFIRLNwKdnIIIIIIIIIAWrGxodzNcof0U2GM9jc09pWWTFbbbbbbbbbEeVlM6Sm63M1yh/RTYYz2NytrPrJXzY3KZ2Re7kir9u5zpeCgnW <span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">RabbitOrderSender</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token class-name">Logger</span> logger <span class="token operator">=</span> <span class="token class-name">LoggerFactory</span><span class="token punctuation">.</span><span class="token function">getLogger</span><span class="token punctuation">(</span><span class="token class-name">RabbitOrderSender</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">RabbitTemplate</span> rabbitTemplate<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">MessageLogMapper</span> messageLogMapper<span class="token punctuation">;</span>

    <span class="token comment">/**
     * Broker应答后，会调用该方法区获取应答结果
     */</span>
    <span class="token keyword">final</span> <span class="token class-name">RabbitTemplate<span class="token punctuation">.</span>ConfirmCallback</span> confirmCallback <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">RabbitTemplate<span class="token punctuation">.</span>ConfirmCallback</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token annotation punctuation">@Override</span>
        <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">confirm</span><span class="token punctuation">(</span><span class="token class-name">CorrelationData</span> correlationData<span class="token punctuation">,</span> <span class="token keyword">boolean</span> ack<span class="token punctuation">,</span> <span class="token class-name">String</span> cause<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;correlationData：&quot;</span><span class="token operator">+</span>correlationData<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">String</span> messageId <span class="token operator">=</span> correlationData<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;消息确认返回值：&quot;</span><span class="token operator">+</span>ack<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>ack<span class="token punctuation">)</span><span class="token punctuation">{</span>
                <span class="token comment">//如果返回成功，则进行更新</span>
                messageLogMapper<span class="token punctuation">.</span><span class="token function">changeMessageLogStatus</span><span class="token punctuation">(</span>messageId<span class="token punctuation">,</span> <span class="token class-name">Constans</span><span class="token punctuation">.</span><span class="token constant">ORDER_SEND_SUCCESS</span><span class="token punctuation">,</span><span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span><span class="token keyword">else</span> <span class="token punctuation">{</span>
                <span class="token comment">//失败进行操作：根据具体失败原因选择重试或补偿等手段</span>
                logger<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;异常处理,返回结果：&quot;</span><span class="token operator">+</span>cause<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">;</span>

    <span class="token comment">/**
     * 发送消息方法调用: 构建自定义对象消息
     * @param order
     * @throws Exception
     */</span>
    <span class="token keyword">public</span> <span class="token keyword">synchronized</span> <span class="token keyword">void</span>  <span class="token function">sendOrder</span><span class="token punctuation">(</span><span class="token class-name">OrderInfo</span> order<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token comment">// 通过实现 ConfirmCallback 接口，消息发送到 Broker 后触发回调，确认消息是否到达 Broker 服务器，也就是只确认是否正确到达 Exchange 中</span>
        rabbitTemplate<span class="token punctuation">.</span><span class="token function">setConfirmCallback</span><span class="token punctuation">(</span>confirmCallback<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//消息唯一ID</span>
        <span class="token class-name">CorrelationData</span> correlationData <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CorrelationData</span><span class="token punctuation">(</span>order<span class="token punctuation">.</span><span class="token function">getMessageId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        rabbitTemplate<span class="token punctuation">.</span><span class="token function">convertAndSend</span><span class="token punctuation">(</span><span class="token string">&quot;order.exchange&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;order.message&quot;</span><span class="token punctuation">,</span> order<span class="token punctuation">,</span> correlationData<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>当生产者调用<code>ConfirmCallback()</code>，说明当前请求已被消费者消费</p> <p>定义消息定时重发任务：定期去数据库中找状态为 0 的数据项，进行消息重发</p> <ul><li>通过<code>@Compoent</code>和<code>@Scheduled(initialDelay = 5000, fixedDelay = 10000)</code>注解将定时任务注入 Spring，初始 5 s 后开始执行，往后每 10s 执行一次</li> <li>判断逻辑为：当重发大于两次，认为任务失败，不再执行，否则通过 RabbitOrderSender 进行重发</li></ul> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">RetryMessageTasker</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token class-name">Logger</span> logger <span class="token operator">=</span> <span class="token class-name">LoggerFactory</span><span class="token punctuation">.</span><span class="token function">getLogger</span><span class="token punctuation">(</span><span class="token class-name">RetryMessageTasker</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">RabbitOrderSender</span> rabbitOrderSender<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">MessageLogMapper</span> messageLogMapper<span class="token punctuation">;</span>

    <span class="token comment">/**

     */</span>
    <span class="token annotation punctuation">@Scheduled</span><span class="token punctuation">(</span>initialDelay <span class="token operator">=</span> <span class="token number">5000</span><span class="token punctuation">,</span> fixedDelay <span class="token operator">=</span> <span class="token number">10000</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">reSend</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;-----------定时任务开始-----------&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//抽取消息状态为0且已经超时的消息集合</span>
        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">MessageLog</span><span class="token punctuation">&gt;</span></span> list <span class="token operator">=</span> messageLogMapper<span class="token punctuation">.</span><span class="token function">query4StatusAndTimeoutMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        list<span class="token punctuation">.</span><span class="token function">forEach</span><span class="token punctuation">(</span>messageLog <span class="token operator">-&gt;</span> <span class="token punctuation">{</span>
            <span class="token comment">//投递三次以上的消息</span>
            <span class="token keyword">if</span><span class="token punctuation">(</span>messageLog<span class="token punctuation">.</span><span class="token function">getTryCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">&gt;=</span> <span class="token number">3</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
                <span class="token comment">//更新失败的消息</span>
                messageLogMapper<span class="token punctuation">.</span><span class="token function">changeMessageLogStatus</span><span class="token punctuation">(</span>messageLog<span class="token punctuation">.</span><span class="token function">getMessageId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token class-name">Constans</span><span class="token punctuation">.</span><span class="token constant">ORDER_SEND_FAILURE</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
                <span class="token comment">// 重试投递消息，将重试次数递增</span>
                messageLogMapper<span class="token punctuation">.</span><span class="token function">update4ReSend</span><span class="token punctuation">(</span>messageLog<span class="token punctuation">.</span><span class="token function">getMessageId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>  <span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token class-name">OrderInfo</span> reSendOrder <span class="token operator">=</span> <span class="token class-name">JsonUtil</span><span class="token punctuation">.</span><span class="token function">jsonToObject</span><span class="token punctuation">(</span>messageLog<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token class-name">OrderInfo</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token keyword">try</span> <span class="token punctuation">{</span>
                    rabbitOrderSender<span class="token punctuation">.</span><span class="token function">sendOrder</span><span class="token punctuation">(</span>reSendOrder<span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                    e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                    logger<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;-----------异常处理-----------&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>测试</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RunWith</span><span class="token punctuation">(</span><span class="token class-name">SpringRunner</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span>

</code></pre></div><h2 id="其他消息队列"><a href="#其他消息队列" class="header-anchor">#</a> 其他消息队列</h2> <h3 id="吞吐量和并发量"><a href="#吞吐量和并发量" class="header-anchor">#</a> 吞吐量和并发量</h3> <blockquote><p>日志处理</p></blockquote> <p>Kafka 的一些通用的应用场景</p> <ul><li>日志收集：最经典用途，解耦日志生成和分析</li> <li>流式处理：搭配 Flink、Spark Streaming 做实时ETL、报警、监控</li> <li>指标监控：低延迟收集与分析，做实时仪表盘</li> <li>数据管道：将 MySQL、MongoDB 等变更流入 Kafka，推送到 Hadoop、Hive、ES</li></ul> <p>以日志收集为例，系统的数据流向大致如下</p> <div class="language- extra-class"><pre class="language-text"><code>日志收集 - 日志源服务器（Nginx，Tomcat，SpringBoot 应用）
    	  ↓
	      Filebeat / Fluentd / Logstash（轻量级收集）
    	  ↓
日志存储 - Kafka（原始日志 Topic）
    	  ↓
日志消费 - Logstash / Flink（复杂加工处理）
    	  ↓
    	  Elasticsearch / HDFS / DB（存储 &amp; 检索）
</code></pre></div><p><strong>为什么在日志处理这一业务领域，说 Kafka 比 RabbitMQ 更快？</strong></p> <p>Kafka 更适合批量处理，那又为什么 Kafka 有流式处理场景呢？根据我的理解，日志处理不应该属于流式处理吗</p> <p>Kafka 的核心结构是 Append-only log</p> <div class="language- extra-class"><pre class="language-text"><code>Producer → PageCache → Disk → PageCache → Consumer
</code></pre></div><p>他的写入是从缓存到磁盘再到缓存，并且</p> <ul><li>永远只追加</li> <li>顺序写</li> <li>批量写</li></ul> <p>在写的过程中，Kafka 实际是在用操作系统的磁盘 I/O 当作 Socket 网络缓冲区，在这，Kafka 用到了一个关键的技术：Zero Copy + mmap</p> <p>Kafka 为什么那么快？（from 知乎）</p> <ul><li>顺序读写 + mmap（Memory Map 内存映射），使用 linux 内核提供的 mmap api，mmap 将磁盘文件（设备内存）映射到内存，支持读和写，对内存的操作就会反映在磁盘文件上，但这不是实时写入磁盘的，操作系统会在程序主动调用 flush 的时候才真正的把数据写到硬盘（kafka 也提供了一个参数 producer.type 来控制是不是主动 flush，如果 kafka 写入到 mmap 之后立即 flush 然后返回 producer 叫同步，写入 mmap 之后立即返回 producer 之后再 flush 叫异步）</li> <li>零拷贝，使用 linux 内核提供的 sendfile api，sendfile 是将读到内核空间的数据直接发送到 socket buffer，这是一个直接的网络发送</li></ul> <p>这里不得不提到一个传奇 Web 服务器，也是用的这套技术方案</p> <p>而 RabbitMQ 的模型为 AMQP（Advanced Message Queue Protocol），这是 CPU + 内存驱动的架构</p> <img src="/assets/img/amqp.a151d41c.png"> <ol><li>发布者（Publisher）发布消息（Message），经由交换机（Exchange）</li> <li>交换机根据路由规则将收到的消息分发给与该交换机绑定的队列（Queue）</li> <li>最后 AMQP 代理会将消息投递给订阅了此队列的消费者，或者消费者按照需求自行获取</li></ol> <p>在 RabbitMQ 中，每次消息分发到指定队列，都是对原来的消息的一次<strong>逻辑复制</strong></p> <ul><li>什么叫“逻辑复制”？就是说，每次复制，消息体复制一份指针指向共享内存，但由于需要状态管理，在每个队列中，都必须有自己的 offset、ack 状态、重试、TTL、死信等信息，这些信息都是需要复制一份的</li></ul> <p>AMQP 的每条消息都要经过这样几个步骤</p> <ul><li>解析协议，路由</li> <li><strong>复制到队列</strong></li> <li>做 ACK，做状态维护</li></ul> <p>综合来说</p> <ol><li>从消息传递方式来考虑，RabbitMQ 要分发要复制，Kafka 是直接把磁盘作为 Socket 网络缓存，采用零拷贝和系统 mmap 接口，后者更直接、更快</li> <li>从硬件资源来考虑，Kafka 用磁盘缓冲，量级远大于 RabbitMQ 用内存缓冲</li> <li>从任务的复杂度来考虑，Kafka 不需要维护消息状态，不需要 ack 相应，这使得他对消息的处理更加简单</li></ol> <p>故而 Kafka 吞吐显著大于 RabbitMQ</p> <p>但相应的：由于 CPU + 内存的处理速度远大于 CPU + I/O，故而 RabbitMQ 的响应速度远大于 Kafka，并且由于 RabbitMQ 的确认机制，使之更适合做功能解耦的业务场景</p> <ul><li>Kafka 是“重消费者模型”，一个消费者干大量的活，但不支持连接过多的消费者</li> <li>RabbitMQ 的 Channel 是“轻量级虚拟连接”，支持连接大量的消费者，但每个消费者的处理速度较慢</li></ul> <p>例如 RabbitMQ 可以有 10w 订阅，2w 消费者，如果放在 Kafka 中，1w 消费者就崩了；但如果总量都是 10w 条消息，Kafka 100 个连接的处理速度会大于 RabbitMQ 1w 个连接的处理速度</p> <p>RabbitMQ 的适用场景</p> <ul><li>低延迟任务队列：适合需要<strong>实时处理、快速响应</strong>的任务，例如发送邮件、处理订单、实时通知</li> <li>复杂路由：需要根据消息内容或规则将消息路由到不同消费者的场景</li> <li>可靠传递：需要确保<strong>每条消息都被正确处理</strong>，适合对消息丢失敏感的场景</li></ul> <p>Kafka 的适用场景</p> <ul><li>日志收集与溯源：适合收集和存储大量日志数据，例如应用程序日志、系统日志，或是需要记录事件历史的场景，例如金融交易记录、审计日志（因为数据会写入磁盘进行持久化）</li> <li>流处理：适合实时流处理场景，例如用户行为分析、实时推荐系统</li> <li>大数据管道：适合作为大数据生态系统的数据传输管道，例如将数据从生产系统传输到 Hadoop 或 Spark</li></ul> <h3 id="分布式环境一致性"><a href="#分布式环境一致性" class="header-anchor">#</a> 分布式环境一致性</h3> <p>如何在分布式环境下保证消息队列中的消息按顺序消费？</p> <p>在单片 Topic 中，每个消息将按照他进入消息队列的顺序被依次消费，但很多时候 Topic 不止一个，我们该如何保证每个消息的顺序执行呢</p> <ul><li>答案是，只关心特定的操作顺序，在粗粒度下进行单 Topic 的传输，例如对于一次个订单，下单、付款、发货三个操作必须按照顺序执行，那么他们必须存在同一个 Topic 下，但对于其他订单并不产生影响，所以我只需要考虑将需要按照顺序执行的消息存放在同一个 Topic 就行</li></ul> <h3 id="开源-mq-对比"><a href="#开源-mq-对比" class="header-anchor">#</a> 开源 MQ 对比</h3> <p>一些开源 MQ 的对比</p> <table><thead><tr><th>特性/消息队列</th> <th>Kafka</th> <th>RocketMQ</th> <th>RabbitMQ</th> <th>ActiveMQ</th></tr></thead> <tbody><tr><td>单机吞吐量</td> <td>10 万级</td> <td>10 万级</td> <td>万级</td> <td>10 万级</td></tr> <tr><td>开发语言</td> <td>Scala</td> <td>Java</td> <td>Erlang</td> <td>Java</td></tr> <tr><td>高可用</td> <td>分布式</td> <td>分布式</td> <td>主从</td> <td>分布式</td></tr> <tr><td>消息延迟</td> <td>ms 级</td> <td>ms 级</td> <td>us 级</td> <td>ms 级</td></tr> <tr><td>消息丢失</td> <td>理论上不会丢失</td> <td>理论上不会丢失</td> <td>低</td> <td>低</td></tr> <tr><td>消费模式</td> <td>拉取</td> <td>推拉</td> <td>推拉</td> <td></td></tr> <tr><td>持久化</td> <td>日志文件</td> <td>文件</td> <td>内存，文件</td> <td>内存，文件，数据库</td></tr> <tr><td>支持协议</td> <td>基于 TCP 的自定义协议</td> <td>自定义协议</td> <td>AMQP</td> <td>AMQP</td></tr> <tr><td>社区活跃度</td> <td>高</td> <td>中</td> <td>高</td> <td>高</td></tr> <tr><td>部署方式</td> <td>独立</td> <td>独立</td> <td>独立</td> <td>独立，嵌入</td></tr> <tr><td>成熟度</td> <td>成熟</td> <td>比较成熟</td> <td>成熟</td> <td>成熟</td></tr> <tr><td>综合评价</td> <td>优点：拥有强大的性能及吞吐量，兼容性很好。 缺点：由于支持消息堆积，导致延迟比较高</td> <td>优点：性能好，稳定可靠，有活跃的中文社区，特点响应快。 缺点：兼容性较差，但随着影响力的扩大，该问题会有改善</td> <td>优点：产品成熟，容易部署和使用，拥有灵活的路由配置。 缺点：性能和吞吐量较差，不易进行二次开发</td> <td>优点：产品成熟，支持协议多，支持多种语言的客户端。 缺点：社区不活跃，存在消息丢失的可能</td></tr></tbody></table> <p>以及后现代消息队列 AutoMQ</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="l
