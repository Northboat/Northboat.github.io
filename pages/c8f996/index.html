6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">OJ 系统 - SpringBoot + Docker<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="前期准备"><a href="#前期准备" class="header-anchor">#</a> 前期准备</h2> <h3 id="talking-with-alan"><a href="#talking-with-alan" class="header-anchor">#</a> Talking with Alan</h3> <p>计算机基础</p> <ul><li>计算机网络 → tcp/http 详解</li> <li>65535 个端口</li> <li>Unix sockets support：本地端口相通</li></ul> <p>网络编程：json、rest api、云计算</p> <p>容器</p> <ul><li>一个容器就是一个进程</li> <li>docker java：操作容器资源</li></ul> <p>JUC 编程</p> <ul><li>corePoolSize：核心线程数</li> <li>maximumPoolSize：最大线程数</li> <li>keepAliveTime</li> <li>TimeUnit unit</li> <li><code>BlockingQueue&lt;Runnable&gt; workQueue</code></li> <li>控制在内存的75%以下</li> <li>尽量保证阻塞队列大小大于5</li> <li>四种拒绝策略</li> <li>线程池的构造方法</li></ul> <p>容器池仿造线程池做 → 三种类型的容器池</p> <p>java -jar xxx.jar nohup &amp;</p> <ul><li>安全问题：内存限制，时间限制（防止恶意代码）</li> <li>提交次数：防止恶意提交（Submission ID）</li></ul> <p>思维导图：processon.com</p> <p>更多</p> <ul><li>netty</li> <li>Nacos</li> <li>java 函数式编程</li> <li>implements Serializable：序列化</li></ul> <h3 id="编译执行-java-程序"><a href="#编译执行-java-程序" class="header-anchor">#</a> 编译执行 Java 程序</h3> <p>用bash命令编译执行 java 程序，对于以下程序</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">package</span> <span class="token namespace">com</span><span class="token punctuation">;</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">HelloWorld</span><span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> list <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        list<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        list<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token operator">:</span> list<span class="token punctuation">)</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>str<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>编译：<code>javac -d . HelloWorld.java</code>在当前目录下生成一个 com 的文件夹，将 .class 文件统一编译到 com 文件夹下</p> <p>运行：<code>java com/HelloWorld</code>运行<code>HelloWorld</code>中的主程序，该主程序将自动链接包（com）中的其他类，完成多个类的统一运行</p> <p>这种执行将自动导入程序中导入的 java 自带类包（如 ArrayList 等等）</p> <h3 id="runner-from-qin"><a href="#runner-from-qin" class="header-anchor">#</a> Runner from Qin</h3> <p>实现覃辉学长给的接口 Runner</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Runner</span> <span class="token punctuation">{</span>
    <span class="token comment">/**
     *      获取运行结果，如果任何一条命令出错则立即返回 并在exitCode 写入错误代码，不再执行下一条命令
     *      运行时间和内存此时可以直接返回负数，不用再计算
     *      样例届时也会放置在输入文件夹中。
     *      友情提示：一条命令结束后 执行echo $?可以得到它的返回值 其他方案也可以
     *      以下命令可以得到当前容器内存大小等信息
     *      docker stats --no-stream --format &quot;{\&quot;container\&quot;:\&quot;{{ .Container }}\&quot;,\&quot;memory\&quot;:{\&quot;raw\&quot;:\&quot;{{ .MemUsage }}\&quot;,\&quot;percent\&quot;:\&quot;{{ .MemPerc }}\&quot;},\&quot;cpu\&quot;:\&quot;{{ .CPUPerc }}\&quot;}&quot;
     *      
     *      @param workPath  容器工作目录 目前都会传（/usr/codeRun/) ————&gt; 暂时废弃
     *      @param inputFilePath - 输入文件路径目录，需要拷贝此目录下所有文件到容器的工作目录（即/var/temp/code/20002/所有都拷贝到/usr/codeRun/) ————&gt; 暂时废弃
     *      @param commandLine - 待执行程序的命令行数组，多条命令，按顺序串行执行，包含完整目录(如javac /usr/codeRun/Hello.java )
     *      @param imageType -(0 未定 |10520 python |10730 gcc:7.3 |  20800 openjdk:8 | 21100 openjdk:11| 30114 golang:1.14|用于选择镜像)
     *      @param timeLimit - 每条命令的时间限制(单位ms, 0表示不限制)
     *      @param memoryLimit - 每条命令的内存限制(单位KB, 0表示不限制)
     *      @return 一个包含程序运行结果的Map&lt;String, Object&gt;对象（key有 &quot;result&quot;:List&lt;String&gt;每条语句执行后的控制台输出,&quot;exitCode&quot;:List&lt;Integer&gt;每条语句的运行后的状态代码
     *      &quot;usedTime: List&lt;Integer&gt;&quot;，usedMemory: List&lt;Integer&gt;&quot; 每条命令执行耗费的内存  其中result顺序要和命令顺序一致，如果没输出则放入“”)
     **/</span>

    <span class="token keyword">public</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> <span class="token function">judge</span><span class="token punctuation">(</span><span class="token class-name">String</span> workPath<span class="token punctuation">,</span> <span class="token class-name">String</span> inputFilePath<span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span> commandLine<span class="token punctuation">,</span>
                                   <span class="token keyword">int</span> imageType<span class="token punctuation">,</span> <span class="token keyword">int</span><span class="token punctuation">[</span><span class="token punctuation">]</span> timeLimit<span class="token punctuation">,</span> <span class="token keyword">int</span><span class="token punctuation">[</span><span class="token punctuation">]</span> memoryLimit<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span><span class="token punctuation">;</span>

<span class="token punctuation">}</span>
</code></pre></div><p>执行命令 comandLine</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span> command3 <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token punctuation">{</span><span class="token string">&quot;javac&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-d&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;.&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;Solution.java&quot;</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token punctuation">{</span><span class="token string">&quot;java&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;test/Solution&quot;</span><span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">;</span>

</code></pre></div><h2 id="后端开发"><a href="#后端开发" class="header-anchor">#</a> 后端开发</h2> <p>SpringBoot + MyBatis + Redis</p> <h3 id="设计与配置"><a href="#设计与配置" class="header-anchor">#</a> 设计与配置</h3> <p>总体设计</p> <img src="/assets/img/system.36d28547.png"> <p>数据库 ER 图</p> <img src="/assets/img/er.d03c3f3f.png"> <p>正常用 MySQL 存就行</p> <p>对于一些统计数据和临时数据，例如</p> <ul><li>注册时用的邮箱验证码</li> <li>热门题目排行：根据点赞数排序</li> <li>访问的较多的题目信息</li></ul> <p>采用 Redis 存储，分别使用</p> <ol><li>HMAP 存储键值对存储：<code>&lt;register:code, &lt;UserID/Email, Code&gt;&gt;</code></li> <li>SortedSet 存储题目 ID 和点赞次数（Double）：<code>&lt;question:thumb, &lt;QuestionID, Count&gt;&gt;</code></li> <li>HMAP 存储完整的题目信息：<code>&lt;question:info, &lt;QuestionID, {title, level, template...}&gt;&gt;</code></li></ol> <p>环境</p> <ul><li>JDK 1.8</li> <li>Spring 2.6.1</li> <li>Docker Client 8.16.0</li> <li>MyBatis 3.4.5</li> <li>Druid 1.2.8</li></ul> <p>配置文件</p> <ul><li>maven - pom.xml：<a href="https://github.com/Arkrypto/Bears-OJ/blob/master/backend/pom.xml" target="_blank" rel="nofollow noopener noreferrer">Bears-OJ/backend/pom.xml at master · Arkrypto/Bears-OJ<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>log4j - log4j.properties：<a href="https://github.com/Arkrypto/Bears-OJ/blob/master/backend/src/main/resources/log4j.properties" target="_blank" rel="nofollow noopener noreferrer">Bears-OJ/backend/src/main/resources/log4j.properties at master · Arkrypto/Bears-OJ<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>springboot - application.yml</li></ul> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">spring</span><span class="token punctuation">:</span>

nguage-java"><code><span class="token class-name">StopWatch</span> stopWatch <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">StopWatch</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// ...初始化</span>
<span class="token keyword">long</span> time <span class="token operator">=</span> <span class="token number">0L</span><span class="token punctuation">;</span>
stopWatch<span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// ... Docker 代码执行</span>
stopWatch<span class="token punctuation">.</span><span class="token function">stop</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 记录时间</span>
time <span class="token operator">=</span> stopWath<span class="token punctuation">.</span><span class="token function">getLastTaskTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
executeMessage<span class="token punctuation">.</span><span class="token function">setTime</span><span class="token punctuation">(</span>time<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>获取程序占用内存，考虑执行中的最大值，使用 DockerClient 的 API 对容器进行监控，维护一个 Integer 变量记录最大内存占用</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">final</span> <span class="token keyword">long</span><span class="token punctuation">[</span><span class="token punctuation">]</span> maxMemory <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token number">0L</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
<span class="token class-name">StatsCmd</span> statsCmd <span class="token operator">=</span> dockerClient<span class="token punctuation">.</span><span class="token function">statsCmd</span><span class="token punctuation">(</span>containerId<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">return</span> resultUtil<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token class-name">ResultUtil</span> <span class="token function">failure</span><span class="token punctuation">(</span><span class="token class-name">ResultCode</span> resultCode<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">ResultUtil</span> resultUtil <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ResultUtil</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        resultUtil<span class="token punctuation">.</span><span class="token function">setResultCode</span><span class="token punctuation">(</span>resultCode<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> resultUtil<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token class-name">ResultUtil</span> <span class="token function">failure</span><span class="token punctuation">(</span><span class="token class-name">ResultCode</span> resultCode<span class="token punctuation">,</span> <span class="token class-name">Object</span> data<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">ResultUtil</span> resultUtil <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ResultUtil</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        resultUtil<span class="token punctuation">.</span><span class="token function">setResultCode</span><span class="token punctuation">(</span>resultCode<span class="token punctuation">)</span><span class="token punctuation">;</span>
        resultUtil<span class="token punctuation">.</span><span class="token function">setData</span><span class="token punctuation">(</span>data<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> resultUtil<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="mapper-示例"><a href="#mapper-示例" class="header-anchor">#</a> Mapper 示例</h3> <p>QuestionMapper.java（偷懒用注解写了）</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Mapper</span>
<span class="token annotation punctuation">@Repository</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">QuestionMapper</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Select</span><span class="token punctuation">(</span><span class="token string">&quot;select * from `question`&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Question</span><span class="token punctuation">&gt;</span></span> <span class="token function">getAllQuestions</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Select</span><span class="token punctuation">(</span><span class="token string">&quot;select * from `question` where num=#{num}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">Question</span> <span class="token function">getQuestion</span><span class="token punctuation">(</span><span class="token keyword">int</span> num<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">void</span> <span class="token function">addQuestion</span><span class="token punctuation">(</span><span class="token class-name">Question</span> question<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Select</span><span class="token punctuation">(</span><span class="token string">&quot;select * from `question` where tag=#{tag}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Question</span><span class="token punctuation">&gt;</span></span> <span class="token function">getQuestionByTag</span><span class="token punctuation">(</span><span class="token class-name">String</span> tag<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="服务器部署"><a href="#服务器部署" class="header-anchor">#</a> 服务器部署</h3> <p>通过 nginx 部署</p> <ul><li>部署前端静态文件，做反向代理</li> <li>对 java 程序端口做负载均衡</li></ul> <p>nginx.conf</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token comment">#user  nobody;</span>
worker_processes  1;

<span class="token comment">#error_log  logs/error.log;</span>
<span class="token comment">#error_log  logs/error.log  notice;</span>
<span class="token comment">#error_log  logs/error.log  info;</span>

<span class="token comment">#pid        logs/nginx.pid;</span>


events <span class="token punctuation">{</span>
    worker_connections  1024;
<span class="token punctuation">}</span>


http <span class="token punctuation">{</span>
    include       mime.types;
    default_type  application/octet<span class="token punctuation">-</span>stream;

    <span class="token comment">#log_format  main  '$remote_addr - $remote_user [$time_local] &quot;$request&quot; '</span>
    <span class="token comment">#                  '$status $body_bytes_sent &quot;$http_referer&quot; '</span>
    <span class="token comment">#                  '&quot;$http_user_agent&quot; &quot;$http_x_forwarded_for&quot;';</span>

    <span class="token comment">#access_log  logs/access.log  main;</span>

    sendfile        on;
    <span class="token comment">#tcp_nopush     on;</span>

    <span class="token comment">#keepalive_timeout  0;</span>
    keepalive_timeout  65;
    
    <span class="token comment">#gzip  on;</span>

    upstream NEUQ<span class="token punctuation">-</span>OJ<span class="token punctuation">{</span>
	<span class="token comment"># OJ后台服务负载均衡</span>
	server 39.106.160.174<span class="token punctuation">:</span>8089 weight=2;
	server 110.42.161.162<span class="token punctuation">:</span>8089 weight=1;
    <span class="token punctuation">}</span>
    server <span class="token punctuation">{</span>
	listen       8087;
	server_name  localhost;
	location / <span class="token punctuation">{</span>
	    root   html;
	    index  index.html index.htm;
        <span class="token punctuation">}</span>
	location /api <span class="token punctuation">{</span>
	    rewrite   ^.+api/<span class="token punctuation">?</span>(.<span class="token important">*)$</span> /$1 break;
	    proxy_pass   http<span class="token punctuation">:</span>//NEUQ<span class="token punctuation">-</span>OJ;
	    proxy_redirect off;
	    proxy_set_header Host $host;
	    proxy_set_header X<span class="token punctuation">-</span>Real<span class="token punctuation">-</span>IP $remote_addr;
	    proxy_set_header X<span class="token punctuation">-</span>Forwarded<span class="token punctuation">-</span>For $proxy_add_x_forwarded_for;
	<span class="token punctuation">}</span>
	error_page    500 502 503 504    /50x.html;
	location = /50x.html <span class="token punctuation">{</span>
	    root    html;
	<span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="代码安全"><a href="#代码安全" class="header-anchor">#</a> 代码安全</h2> <p>防护用户的恶意代码执行</p> <h3 id="超时控制"><a href="#超时控制" class="header-anchor">#</a> 超时控制</h3> <p>无限睡眠，这样的程序丢到沙箱执行，如果没有处理，只会造成无意义的系统资源消耗</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Main</span><span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">{</span>
        <span class="token keyword">long</span> <span class="token constant">ONE_HOUR</span> <span class="token operator">=</span> <span class="token number">60</span><span class="token operator">*</span><span class="token number">60</span><span class="token operator">*</span><span class="token number">1000L</span><span class="token punctuation">;</span>
        <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token constant">ONE_HOUR</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;睡完了&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>解决办法：超时控制，定义超时时间，在主线程中开辟一个统计线程（相当于守护线程），监控用户代码的运行时间</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">Process</span> runProcess <span class="token operator">=</span> <span class="token class-name">Runtime</span><span class="token punctuation">.</span><span class="token function">getRuntime</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span>runCmd<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">-&gt;</span> <span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token constant">TIME_OUT</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 超时了，中断</span>
        runProcess<span class="token punctuation">.</span><span class="token function">destroy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">catch</span><span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">RuntimeException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>  
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 正常跑 runProcess</span>
<span class="token class-name">ExecuteMessage</span> executeMessage <span class="token operator">=</span> <span class="token class-name">ProcessUtils</span><span class="token punctuation">.</span><span class="token function">runProcessAndGetMessage</span><span class="token punctuation">(</span>runProcess<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>先睡一段超时时间，如果这段时间内 runProcess 没执行完，就会被守护线程销毁，从而不会一直占用</p> <h3 id="内存资源"><a href="#内存资源" class="header-anchor">#</a> 内存资源</h3> <p>占用内存不释放</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Main</span><span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">{</span>
        <span class="token class-name">List</span><span class="token operator">&lt;</span><span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">&gt;</span> btyes <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            bytes<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token number">10000</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>解决办法：限制 JVM 的启动内存，比如只给 JVM 256MB 的堆内存</p> <p>在执行 class 文件时，设置 JVM 的 -Xmx 参数（-Xms 是初始堆空间大小，一般二者保持一致）</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">java</span> <span class="token parameter variable">-Xmx256m</span> <span class="token parameter variable">-cp</span> Main
</code></pre></div><p>但要注意，-Xmx 参数并不等于系统实际占用的最大资源，可能会超出，就是说，这个限制并不是严格的，他有可能在某一秒超出 256MB 的限制</p> <p>如果在 Linux 系统，可以使用 cgroup 来实现堆某个进程的 CPU、内存等资源的分配</p> <h3 id="读写文件"><a href="#读写文件" class="header-anchor">#</a> 读写文件</h3> <p>读取当前目录相对路径获取文件，信息泄露</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Main</span><span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">{</span>
        <span class="token class-name">String</span> userDir <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">getProperty</span><span class="token punctuation">(</span><span class="token string">&quot;user.dir&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> filePath <span class="token operator">=</span> userDir <span class="token operator">+</span> <span class="token class-name">File</span><span class="token punctuation">.</span>separator <span class="token operator">+</span> <span class="token string">&quot;src/main/resources/application.yml&quot;</span><span class="token punctuation">;</span>
        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> allLines <span class="token operator">=</span> <span class="token class-name">Files</span><span class="token punctuation">.</span><span class="token function">readAllLines</span><span class="token punctuation">(</span><span class="token class-name">Paths</span><span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>filePath<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">.</span><span class="token function">join</span><span class="token punctuation">(</span><span class="token string">&quot;\n&quot;</span><span class="token punctuation">,</span> allLines<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>写文件，越权植入木马</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Main</span><span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">{</span>
        <span class="token class-name">String</span> userDir <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">getProperty</span><span class="token punctuation">(</span><span class="token string">&quot;user.dir&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> filePath <span class="token operator">=</span> userDir <span class="token operator">+</span> <span class="token class-name">File</span><span class="token punctuation">.</span>separator <span class="token operator">+</span> <span class="token string">&quot;src/main/resources/application.yml&quot;</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> errorProgram <span class="token operator">=</span> <span class="token string">&quot;java -version 2&gt;&amp;1&quot;</span><span class="token punctuation">;</span>
        <span class="token class-name">Files</span><span class="token punctuation">.</span><span class="token function">write</span><span class="token punctuation">(</span><span class="token class-name">Paths</span><span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>filePath<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token class-name">Arrays</span><span class="token punctuation">.</span><span class="token function">asList</span><span class="token punctuation">(</span>errorProgram<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;写文件成功，你完了&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>解决办法：限制代码，黑白名单和字符串匹配，在保存文件前进行代码校验</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> blackList <span class="token operator">=</span> <span class="token class-name">Arrays</span><span class="token punctuation">.</span><span class="token function">asList</span><span class="token punctuation">(</span><span class="token string">&quot;Files&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;exec&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// From hutool</span>
<span class="token class-name">WordTree</span> wordTree <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">WordTree</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
wordTree<span class="token punctuation">.</span><span class="token function">addWords</span><span class="token punctuation">(</span>blackTree<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">FoundWord</span> foundWord <span class="token operator">=</span> wordTree<span class="token punctuation">.</span><span class="token function">matchWord</span><span class="token punctuation">(</span>code<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>foundWord <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">Log</span><span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span><span class="token string">&quot;High Danger Word Matched: &quot;</span><span class="token punctuation">,</span> foundWord<span class="token punctuation">.</span>getFoundWord<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 跳过逻辑...</span>
    <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>如果要更严格，可以修改 WordTree 的配置，在实际项目中，这个 WordTree 应该是全局初始化的<code>WORD_TREE</code></p> <p>字典树原理：在单词末尾的节点标注其为一个单词</p> <img src="/assets/img/image-20260106171433971.debc2eac.png"> <p>这样的数据结构，每层不会超过 26 个节点，高度由最长的单词决定</p> <h3 id="securitymanager"><a href="#securitymanager" class="header-anchor">#</a> SecurityManager</h3> <blockquote><p>在 JVM 层面限制命令执行和网络连接</p></blockquote> <p>例如这样的命令</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">rm</span> <span class="token parameter variable">-rf</span> /*
</code></pre></div><p>首先和危险代码一样，需要裹一层字典树 + 黑白名单的校验，但这样会留下隐患</p> <ul><li>无法覆盖所有的风险点</li> <li>不同的编程语言，关键词都不一样，限制人工成本很大</li></ul> <p>解决办法：限制用户的操作权限，对文件、内存、CPU、网络等资源的操作和访问，通过 Java 安全管理器来实现更严格的限制</p> <ul><li>Java 安全管理器（Security Manager），Java 自带的保护 JVM、Java 安全的机制</li></ul> <p>新建 security 包，定义 DefaultSecurityManager 继承 SecurityManager</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">DefaultSecurityManager</span> <span class="token keyword">extends</span> <span class="token class-name">SecurityManager</span><span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">checkPermission</span><span class="token punctuation">(</span><span class="token class-name">Permission</span> perm<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;不做限制&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>perm<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 如果 super 了，就会默认检查所有权限</span>
        <span class="token comment">// super.checkPermission(perm);</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>实现安全管理器，只需要继承 SecurityManager 就可以了</p> <p>在方法中加入检查</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">ExecuteCodeResponse</span> <span class="token function">executeCode</span><span class="token punctuation">(</span><span class="token class-name">ExecuteCodeRequest</span> executeCodeRequest<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setSecutiryManager</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">DefaultSecurityManager</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// .. 正常跑流程</span>
<span class="token punctuation">}</span>
</code></pre></div><p>如果不想给某个方法权限，那么只需要修改对应的权限检查方法，令其抛出异常，这样 SecurityManager 在检查时，就会直接抛异常</p> <p>例如想要拒绝所有权限</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">DenySecurityManager</span> <span class="token keyword">extends</span> <span class="token class-name">SecurityManager</span><span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">checkPermission</span><span class="token punctuation">(</span><span class="token class-name">Permission</span> perm<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">SecurityException</span><span class="token punctuation">(</span><span class="token string">&quot;权限不足: &quot;</span> <span class="token operator">+</span> perm<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这样在方法中碰到任何权限检查，都会触发 SecurityManager 的 checkPermission 方法，从而直接抛出异常</p> <p>其他的权限检查</p> <ol><li>文件执行权限：<code>checkExec(String cmd)</code></li> <li>读文件权限：<code>checkRead(String file, Object context)</code></li> <li>写文件权限：<code>checkWrite(String file)</code></li> <li>删除文件：<code>checkDelete(String file)</code></li> <li>网络连接权限：<code>checkConnect(String host, int port)</code></li></ol> <p>那么可以实现这样一个 SecurityManager，先放行所有的 checkPermission，而后重写上面的 5 个方法，令其抛异常，这样就可以直接<strong>从 JVM 层面禁用方法权限</strong></p> <ul><li>然后在一个公共的区域进行 System.setSecurityManager（比如 Application 启动类），类似于一个配置类加载</li></ul> <p>写白名单：在抛异常前，对放行的情况写 if-return 语句，这样就是写白名单，非常麻烦，尤其是读权限，会导致类直接加载不出来，放白名单非常麻烦</p> <p>缺点</p> <ol><li>如果要做严格的权限控制，粒度太细了（针对到包名），需要编程者自己判断，难以精细化控制</li> <li>程序上的限制，没到系统层面</li></ol> <h2 id="容器安全"><a href="#容器安全" class="header-anchor">#</a> 容器安全</h2> <h3 id="环境隔离"><a href="#环境隔离" class="header-anchor">#</a> 环境隔离</h3> <p>通过 Docker 容器隔离代码执行环境与宿主机，<strong>我们需要的是一个持续可交互的容器</strong>，即这个容器创建好之后，需要和我们的终端进行持续的输入输出交互</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 根据镜像初始化容器</span>
<span class="token class-name">CreateContainerCmd</span> containerCmd <span class="token operator">=</span> dockerClient<span class="token punctuation">.</span><span class="token function">createContainerCmd</span><span class="token punctuation">(</span>image<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 将本地目录绑定到容器内部</span>
<span class="token class-name">HostConfig</span> hostConfig <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HostConfig</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
hostConfig<span class="token punctuation">.</span><span class="token function">setBinds</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Bind</span><span class="token punctuation">(</span>userCodeParentPath<span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">Volume</span><span class="token punctuation">(</span><span class="token string">&quot;/app&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 限制内存，很关键且好用</span>
hostConfig<span class="token punctuation">.</span><span class="token function">withMemory</span><span class="token punctuation">(</span><span class="token number">100</span> <span class="token operator">*</span> <span class="token number">1000</span> <span class="token operator">*</span> <span class="token number">1000L</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 限制 CPU 个数</span>
hostConfig<span class="token punctuation">.</span><span class="token function">withCpuCount</span><span class="token punctuation">(</span><span class="token number">1L</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 开启持续的容器交互窗口</span>
<span class="token class-name">CreateContainerResponse</span> createContainerResponse <span class="token operator">=</span> containerCmd
    <span class="token punctuation">.</span><span class="token function">withHostConfig</span><span class="token punctuation">(</span>hostConfig<span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withAttachStdin</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withAttachStdout</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withAttachStderr</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withTty</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 启动容器</span>
<span class="token class-name">String</span> containerId <span class="token operator">=</span> createContainerResponse<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
dockerClient<span class="token punctuation">.</span><span class="token function">startContainerCmd</span><span class="token punctuation">(</span>containerId<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 创建执行命令</span>
<span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> cmdArray <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">{</span><span class="token string">&quot;java&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-cp&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;/app&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;Main&quot;</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
<span class="token class-name">ExecCreateCmdResponse</span> execCreateCmdResponse <span class="token operator">=</span> dockerClient<span class="token punctuation">.</span><span class="token function">execCreateCmd</span><span class="token punctuation">(</span>containerId<span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withCmd</span><span class="token punctuation">(</span>cmdArray<span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withAttachStderr</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withAttachStdin</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">withAttachStdout</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> execId <span class="token operator">=</span> execCreateCmdResponse<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 定义回调，构造返回 ExcuteMessage</span>
<span class="token class-name">ExcuteMessage</span> executeMessage <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ExecuteMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">final</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> message <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token keyword">null</span><span class="token punctuation">}</span><span class="token punctuation">,</span> errorMessage <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token keyword">null</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> execId <span class="token operator">=</span> execCreateCmdResponse<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">ExecStartResultCallback</span> execStartResultCallback <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ExecStartResultClassback</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">onNext</span><span class="token punctuation">(</span><span class="token class-name">Frame</span> frame<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">StreamType</span> streamType <span class="token operator">=</span> frame<span class="token punctuation">.</span><span class="token function">getStreamType</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token class-name">StreamType</span><span class="token punctuation">.</span><span class="token constant">STDERR</span><span class="token punctuation">.</span><span class="token function">equals</span><span class="token punctuation">(</span>streamType<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            errorMessage<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">(</span>frame<span class="token punctuation">.</span><span class="token function">getPayload</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;error: &quot;</span> <span class="token operator">+</span> errorMessage<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
            message<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">(</span>frame<span class="token punctuation">.</span><span class="token function">getPayload</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>message<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">super</span><span class="token punctuation">.</span><span class="token function">onNext</span><span class="token punctuation">(</span>frame<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">;</span>
<span class="token comment">// 执行命令</span>
<span class="token keyword">try</span><span class="token punctuation">{</span>
    dockerClient<span class="token punctuation">.</span><span class="token function">execStartCmd</span><span class="token punctuation">(</span>execId<span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span>execStartResultCallback<span class="token punctuation">)</span>
        <span class="token punctuation">.</span><span class="token function">awaitCompletion</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 等待完成返回</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">RuntimeExeption</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> 

executeMessage<span class="token punctuation">.</span><span class="token function">setMessage</span><span class="token punctuation">(</span>message<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
executeMessage<span class="token punctuation">.</span><span class="token function">setErrorMessage</span><span class="token punctuation">(</span>errorMessage<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>容器内部的代码执行顺序必须是线性的，不然多线程下用户输出会混乱</p> <h3 id="容器安全-2"><a href="#容器安全-2" class="header-anchor">#</a> 容器安全</h3> <h4 id="超时控制-2"><a href="#超时控制-2" class="header-anchor">#</a> 超时控制</h4> <p>无限循环代码执行，在 DockerClient 的 API 中，同步等待有一个时间限制</p> <div class="language-java extra-class"><pre class="language-java"><code>dockerClient<span class="token punctuation">.</span><span class="token function">execStartCmd</span><span class="token punctuation">(</span>execId<span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token punctuation">.</span><span class="token function">awaitCompletion</span><span class="token punctuation">(</span><span class="token constant">TIME_OUT</span><span class="token punctuation">,</span> <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">MICROSECONDS</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>如何判断是程序超时了，还是无限循环造成的超时？</p> <ul><li>重写执行命令的回调<code>onComplete()</code>，若执行完了，令一个外部布尔变量<code>timeout[0] = false</code>（默认为 true）</li> <li>也就是说，容器执行完了就会让<code>timeout[0]</code>为假，若未执行完，而上述不等待，则<code>timeout[0]</code>将为真</li></ul> <h4 id="内存限制"><a href="#内存限制" class="header-anchor">#</a> 内存限制</h4> <p>内存泄漏：在创建容器时指定 HostConfig 限制容器最大内存占用</p> <h4 id="网络资源"><a href="#网络资源" class="header-anchor">#</a> 网络资源</h4> <p>限制网络资源：在创建容器时配置<code>withNetworkDisabled(true)</code>，直接禁掉网络</p> <h4 id="代码安全-2"><a href="#代码安全-2" class="header-anchor">#</a> 代码安全</h4> <p>在运行环境上做了隔离，不太重要</p> <h4 id="权限管理"><a href="#权限管理" class="header-anchor">#</a> 权限管理</h4> <p>在软件和系统层面禁用读写、执行等权限</p> <ul><li>之前用了 SecurityManager 做了权限管理，但代码跑在 Docker 容器中，已经比较安全，但不排除从容器中影响宿主机的骚操作，这里也可以加上</li> <li>限制用户不能向 root 根目录写文件</li> <li>用 Linux 自带的一些安全管理措施，在 HostConfig 中设置容器<code>Seccomp</code>安全策略<code>hostConfig.withSecurityOpts(Arrays.asList(&quot;seccomp=配置json&quot;))</code></li></ul> <h3 id="api-管理"><a href="#api-管理" class="header-anchor">#</a> API 管理</h3> <p>当我们把 Docker 的代码沙箱服务提供在公网，如果不做任何权限校验，是极其危险的</p> <p>如果是内部使用，可以约定一个字符串来进行校验，只在服务器内部传递（最好加密），这是最常用的方法，直接在 Controller 中定义一个静态 String 变量，然后在接口 HttpServletRequest 的请求头中去拿，进行一个 if 判断就行</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Controller</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">MainController</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">String</span> <span class="token constant">AUTH_REQUEST_HEADER</span> <span class="token operator">=</span> <span class="token string">&quot;auth&quot;</span><span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">String</span> <span class="token constant">AUTH_REQUEST_SECRET</span> <span class="token operator">=</span> <span class="token string">&quot;secret&quot;</span><span class="token punctuation">;</span>
    
    <span class="token annotation punctuation">@PostMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/run&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">ResultUtil</span> <span class="token function">run</span><span class="token punctuation">(</span><span class="token annotation punctuation">@RequestBody</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> params<span class="token punctuation">,</span> <span class="token class-name">HttpServletRequest</span> request<span class="token punctuation">,</span> <span class="token class-name">HttpServletResponse</span> response<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">String</span> authHeader <span class="token operator">=</span> request<span class="token punctuation">.</span><span class="token function">getHeader</span><span class="token punctuation">(</span><span class="token constant">AUTH_REQUEST_HEADER</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token operator">!</span>authHeader<span class="token punctuation">.</span><span class="token function">equals</span><span class="token punctuation">(</span><span class="token constant">AUTH_REQUEST_SECRET</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            response<span class="token punctuation">.</span><span class="token function">setStatus</span><span class="token punctuation">(</span><span class="token number">403</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// ... 正常逻辑</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>然后在调用方加上请求头进行请求就行</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">RemoteCodeSandbox</span> <span class="token keyword">implements</span> <span class="token class-name">CodeSandbox</span><span class="token punctuation">{</span>
    <span class="token comment">//定义鉴权请求头和密钥</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">String</span> <span class="token constant">AUTH_REQUEST_HEADER</span> <span class="token string">&quot;auth&quot;</span><span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">String</span> <span class="token constant">AUTH_REQUEST_SECRET</span> <span class="token string">&quot;secretKey&quot;</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">ExecuteCodeResponse</span> <span class="token function">executeCode</span><span class="token punctuation">(</span><span class="token class-name">ExecuteCodeRequest</span> executeCodeRequest<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;远程代码沙箱&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> url <span class="token string">&quot;http://Localhost:8090/executeCode&quot;</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> json <span class="token class-name">JSONUtil</span><span class="token punctuation">.</span><span class="token function">toJsonStr</span><span class="token punctuation">(</span>executeCodeRequest<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> responsestr <span class="token class-name">Httputil</span><span class="token punctuation">.</span><span class="token function">createPost</span><span class="token punctuation">(</span>url<span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">header</span><span class="token punctuation">(</span><span class="token constant">AUTH_REQUEST_HEADER</span><span class="token punctuation">,</span> <span class="token constant">AUTH_REQUEST_SECRET</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">body</span><span class="token punctuation">(</span>json<span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">execute</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">body</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token class-name">Stringutils</span><span class="token punctuation">.</span><span class="token function">isBLank</span><span class="token punctuation">(</span>responsestr<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BusinessException</span><span class="token punctuation">(</span><span class="token class-name">ErrorCode</span><span class="token punctuation">.</span><span class="token constant">API_REQUEST_ERROR</span><span class="token punctuation">,</span><span class="token string">&quot;executeCode remoteSandbox error, message: &quot;</span><span class="token operator">+</span> responseStr<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token class-name">JSONUtil</span><span class="token punctuation">.</span><span class="token function">toBean</span><span class="token punctuation">(</span>responseStr<span class="token punctuation">,</span><span class="token class-name">ExecuteCodeResponse</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这样实现最简单，适合内部调用，但缺点是不够灵活，如果 key 泄露或变更需要重启代码</p> <p>API 签名认证：给允许调用的人员分配 accessKey 和 secretKey，然后校验这两组 Key 是否匹配</p> <h3 id="api-防刷"><a href="#api-防刷" class="header-anchor">#</a> API 防刷</h3> <p>对于判题请求，因为会操纵 Docker 容器消耗资源，需要对用户的请求在后端做一层防刷，利用 Redis 单线程记录 IP 对 API 每分钟的请求次数，超出则在 Controller 中拒绝访问，初步的想法是这样</p> <ol><li>用户提交成功后，在收到返回前，不能重复提交</li> <li>用户在 5s 以内只能成功提交一次</li></ol> <p>需要对这个接口上两道锁</p> <ul><li>一道是执行锁，限定单个用户对同一道题在同一时刻只能判一次</li> <li>一道是频控锁，限定单个用户对同一道题在 5s 内只能判题一次</li></ul> <h4 id="执行锁"><a href="#执行锁" class="header-anchor">#</a> 执行锁</h4> <p>使用 Redis 的原子锁，SET NX + EX 实现，控制字段</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:lock:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> requestId NX EX <span class="token number">300</span>
</code></pre></div><p>这个字段的键由用户 ID 和题目 ID 构成，值为本次提交的请求 ID</p> <ul><li><code>NX</code>：不存在才设置</li> <li><code>EX 300</code>：兜底超时，防止执行锁卡死</li></ul> <p>只需要在判题前加入一个 Redis 的判断即可</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> locked <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span>
    requestId<span class="token punctuation">,</span>
    <span class="token number">300</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>locked<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;请勿重复提交任务&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在判题结束后，需要释放执行锁</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">finally</span> <span class="token punctuation">{</span>
    <span class="token function">releaseLock</span><span class="token punctuation">(</span><span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span> requestId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><h4 id="频控锁"><a href="#频控锁" class="header-anchor">#</a> 频控锁</h4> <p>使用 Redis 的冷却锁实现</p> <div class="language-bash extra-class"><pre class="language-bash"><code>SET docker:freq:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> <span class="token number">1</span> NX EX <span class="token number">5</span>
</code></pre></div><p>即设置一个 5s 超时时间的键值对，键同样由用户 ID 和题目 ID 构成，在判题前进行拦截</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">boolean</span> allowed <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:freq:&quot;</span> <span class="token operator">+</span> uid<span class="token punctuation">,</span>
    <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span>
    <span class="token number">5</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>allowed<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;操作频繁&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>执行流程如下</p> <div class="language- extra-class"><pre class="language-text"><code>请求进来
 ↓
校验身份 / IP
 ↓
【1】尝试获取执行锁（docker:lock）
    失败 → 直接拒绝
 ↓
【2】尝试获取 5s 频控锁（docker:freq）
    失败 → 释放执行锁 → 拒绝
 ↓
【3】真正执行 docker
 ↓
【4】finally 中释放执行锁
</code></pre></div><p>为什么频控在执行锁之后？更直觉的处理，先判断有没有锁进门，再判断能进多少人，这个优先级要搞清</p> <ul><li>如果频控先于执行，在第一秒和第六秒都有人来打请求，那么两个请求都能通过频控锁，而第一秒的请求没结束，所以第六秒的请求会消耗执行锁的判断（一共是四次判断）</li> <li>如果执行先于频控，上述事件就会少一次判断（三次判断），那另一种情况下，第一秒和第四秒都有请求打进来，并且已经执行完，那么也会有四次判断，但这里由于频率过高会被第四次判断拦截，这正是我想要的结果</li></ul> <p>就是说，我一定要先判断有没有进入的权限，再判断是否达标，否则我没有必要判断是否达标，懂我意思吗</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/01/08, 22:17:27</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/5455e2/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">聊天室 - SpringBoot + WebSockets</div></a> <a href="/pages/699675/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">锁、单例和原子性</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
