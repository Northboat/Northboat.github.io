6Jvbm9nNSV0msViVO6tN1Rm7NMu2OpeJ9lWBUTDxrJbYTS0hInuwciu9eLHlFxCLCZEk3MegsJmZ5K/JD6t7FkFdEvGUo1g7qJoG3MHImqRIn8/nzY1K9UPKKiJmtnUqHVE3Gbuay6vJE/N2FEmuxFjW2nUuE0yQXRRxLiTUAzs36zhZvOXJPdX850EVnnLZkB8prodQoM5JGj7Xk2mvC7JB8tG04Ef5PiXtG0UtxupRQSfTnBoCy554x18yJHI6I+G5Eru4LHmPJZEQsrvPUbMiA8G/WgMK7w7I+ez7++o2ANfbrjvaOl1tFMs+htG3IrZH9/hDX1Pr8Tc0UvH8tcX29KzAgIGcEkINyW5BF9x891hw6VYqgJHEk0huccS7vh3C6gTiODL+26huuBtbct8eZnqLML8PkxGYpuPZBqtqwkSjgc4mB5gbgig5i+y0UDK35LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">智能体流程编排 - LangGraph<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="workflow-工作流编排"><a href="#workflow-工作流编排" class="header-anchor">#</a> Workflow 工作流编排</h2> <p>常见的工作流架构</p> <ul><li>ReAct：Thought-Action-Observation 的交错循环</li> <li>Plan &amp; Excete：计划与执行架构</li> <li>REWOOO：Reasoning Without Observation，无观察推理</li> <li>LLM Compiler：核心思想是让 Planner 生成一个任务的有向无环图（DAG），这个人物图将清晰的定义所有任务、所需工具、参数以及人物之间的依赖关系</li> <li>Basic Reflection：基础反思架构</li> <li>Reflexion：强化反思框架</li> <li>LATS：Language Agent Tree Search，语言模型的推理能力与经典的蒙特卡洛树搜索（MCTS）算法的完美结合，通过树状搜索，同时探索多个 ReAct 序列，并利用自反思和外部反馈来评估和回溯最优的 ReAct 执行路径</li></ul> <h3 id="菱形工作流"><a href="#菱形工作流" class="header-anchor">#</a> 菱形工作流</h3> <h3 id="lean-side-business"><a href="#lean-side-business" class="header-anchor">#</a> lean side business</h3> <h3 id="betta-fish"><a href="#betta-fish" class="header-anchor">#</a> Betta Fish</h3> <h3 id="mine-context"><a href="#mine-context" class="header-anchor">#</a> Mine Context</h3> <p>四个智能体协作</p> <h2 id="langgraph-基础"><a href="#langgraph-基础" class="header-anchor">#</a> LangGraph 基础</h2> <p>基于 LangChain 的智能体编排框架</p> <h3 id="langchain4j"><a href="#langchain4j" class="header-anchor">#</a> LangChain4j</h3> <h3 id="langgraph"><a href="#langgraph" class="header-anchor">#</a> LangGraph</h3> <h2 id="mcp-网关"><a href="#mcp-网关" class="header-anchor">#</a> MCP 网关</h2> <blockquote><p>Higress + Nacos 实现 MCP 网关</p></blockquote> <p>Higress 是阿里基于开源 Istio + Envoy 为核心构建的云原生 API 网关应用；Nacos 是云原生的服务注册中心应用，可利用其命名空间实现服务和工作集的隔离，给不同用户提供不同的 MCP 工作集</p> <ul><li>Higress 担任 MCP Proxy 的角色</li> <li>Nacos 担任 MCP Registry 的角色</li></ul> <h2 id="rag-构建与应用"><a href="#rag-构建与应用" class="header-anchor">#</a> RAG 构建与应用</h2> <blockquote><p>RAG is dead</p></blockquote> <h2 id="ace-上下文工程"><a href="#ace-上下文工程" class="header-anchor">#</a> ACE 上下文工程</h2> <blockquote><p>ACE，Agentic Context Engineering，Prompt 告诉模型如何思考，而 Context 则赋予模型完成工作所需的知识和工具</p></blockquote> <p>上下文工程（Context Engineering）是一门侧重于系统设计的学科，旨在在正确的时间，以正确的格式为 LLM 提供正确的信息和工具，从而可靠、可扩展的完成复杂任务</p> <p>它关注的不是如何训练 LLM，而是<strong>如何精心设计和优化给模型的输入内容</strong>。其核心思想是<strong>不改变模型的结构，只改变模型看到了什么</strong>，目的是让模型在有限的上下文窗口（Context Window）内尽可能地理解得更准确、回答得更好、花费更少</p> <p>简单来说，一个上下文工程通过<strong>格式化关键信息</strong>，缩减对话上下文长度（这决定了模型能否记住关键信息），有效防止注意力发散和幻觉的产生，从而提高模型思考的准确率</p> <ul><li>例如可以通过精简污点传递的关键信息，结合 Prompt 工程，有效缩减污点传递分析的上下文，实现注意力的集中</li></ul> <p>上下文工程，主要就是解决上下文腐败（Context Corruption）问题</p> <h3 id="上下文分类"><a href="#上下文分类" class="header-anchor">#</a> 上下文分类</h3> <p>Instructions 指令上下文</p> <ul><li>系统提示词（SystemPrompts）：定义AI的角色、行为准则和响应风格</li> <li>任务指令：具体的任务描述和执行要求</li> <li>少样本示例（Few-shotExamples）：输入输出示例，帮助模型理解预期格式</li> <li>工具描述：可用函数/工具的规范和使用说明</li> <li>格式约束：输出格式、结构化要求等</li></ul> <p>Knowledge 知识上下文</p> <ul><li>领域知识：特定行业或专业的事实性信息</li> <li>记忆系统：用户偏好、历史交互、会话历史</li> <li>检索增强生成（RAG）：从向量数据库或知识库检索的相关信息</li> <li>实时数据：当前状态、动态更新的信息</li></ul> <p>Tools 工具上下文</p> <ul><li>函数调用结果：API 响应、数据库查询结果</li> <li>工具执行状态：成功/失败反馈、错误信息</li> <li>多步骤工具链：工具间的依赖关系和数据传递</li> <li>执行历史：之前的工具调用记录和结果</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/108f08/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">污点分析智能体开发 - Spring AI</div></a> <!----></div> <div class="page-nav"><p class="inner"><span class="prev">
