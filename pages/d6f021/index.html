9ldM7A6nTpAjuolUikAwq7CE3WcM2RRDz+XGVgN3FptU/aUSlvq9Pa3iZ1+sgAqJyyAFqkipd9dqiwHF3P65YycLWc/6sqGrvoEoIp6DOFaX5h6+dnfjkWprwqsPk0dUGq5vySwDImC10KxFHgGL1SWoc92O3eVht09qdXNH11I2SsTsJYqMWzihqGMi+A+Garf3BAuuLI5oGlULyNfyB/HYNujwktOfRrMr5t77NmevqaUopx0grnKAyvVpmwUDB4x6FPXuGvYLTDwWsejwgtgkYKPqRJg8SV6xaiZ3ZTppGneS4yfH5/66fZSDHv+QZci/+h5c5UHtpy67JUqGppM0sh0Nc1dW6/N1W5Yoqat8/TU/VnadmdeW2PLLSyh0cvxBs3KbqTmwYPpxN4do/mzE8nEpvX/UMu2Wbp74zUAK5q6WkHns7V0eWkdPbPzd3rxkTGybadYySumVzhcaJFbs5UrEkQ/+CK8gF5dnh/6ciIZ73gwQ927L1IitoxKLXYP3SjYdOrHHfTZhRRlFyrorafPk20B3HPD1y2G3qKZME5Jcf3t/HUC13/8tSd++vqFveMUTwAUxSUFI1QekR1+bIze3D9MF2aq6cPvG72CgnldWCFqyRw3lwH8ZMerjTD9ElRO7Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">分布式与微服务基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>软件业的人乐于做这样的事 —— 找一些词汇，并把它们引申到大量微妙而又互相矛盾的意义，例如“架构”</p> <ul><li>《Patterns of Enterprise Application Architecture》</li></ul> <h2 id="spring-cloud-alibaba"><a href="#spring-cloud-alibaba" class="header-anchor">#</a> Spring Cloud Alibaba</h2> <blockquote><p>现阶段的代码优化，一个就是单体项目的微服务改造，再一个就是设计模式的优化</p></blockquote> <h3 id="soa-与分布式系统"><a href="#soa-与分布式系统" class="header-anchor">#</a> SOA 与分布式系统</h3> <p>SOA（Service Oriented Architecture），面向服务架构，是一种通过服务接口将应用程序功能模块化的架构风格，相比于微服务，他的设计粒度更大，服务之间的交互更复杂，通常是大系统之间的耦合</p> <p>分布式系统的定义：多个计算机通过网络协同工作而<strong>对外表现为一个整体</strong></p> <p>分布式系统的核心特点</p> <ol><li>多机协作：任务由多个计算机协作完成，而非单机处理</li> <li>数据共享：不同节点之间共享数据，可能涉及数据一致性问题</li> <li>去中心化：避免单点故障，提高系统可用性</li> <li>并发性：多个节点可以并行处理任务，提高吞吐量</li> <li>容错能力：某些节点宕机时，系统仍能继续运行</li></ol> <p>导致扩展性好、稳定性高、容错强</p> <h3 id="微服务与云原生概念"><a href="#微服务与云原生概念" class="header-anchor">#</a> 微服务与云原生概念</h3> <p>微服务本质上是通过 HTTP 或其他网络协议进行通讯来实现，更多的是一种细腻的模块化思想，其核心在于</p> <ul><li>服务拆分</li> <li>服务之间调用</li> <li>服务管理</li></ul> <p>微服务和单体项目，分布式部署和单机部署，这是两套不同的概念，不能混为一谈，一个是项目设计的事，一个是项目部署的事，但二者存在关联，例如绝大部分微服务都会选择分布式部署，单机部署不完</p> <p>常见的微服务实现技术</p> <ul><li>Spring Cloud</li> <li>Spring Cloud Alibaba</li> <li>Dubbo</li> <li>RPC（GRPC、TRPC）</li></ul> <p>在现有的成熟框架中，如 Spring Cloud Alibaba，其每一项组件都是在解决一项具体的分布式问题，从而能够快速开发一个成熟的微服务系统</p> <p>云计算背景下，软件、平台和基础设施都被视作服务 Service</p> <ul><li>SaaS：Software as a Service 软件即服务</li> <li>Paas：Platform as a Service 平台即服务</li> <li>IaaS：Infrastructure as a Service 基础设施即服务</li></ul> <p>云原生是一种概念，各个地方的定义不尽相同，但总是包含以下关键词</p> <ol><li>微服务</li> <li>容器化</li> <li>DevOps</li> <li>持续交付</li></ol> <p>云原生用持续交付代替瀑布开发，采用“小步快跑”的方式进行开发，并且由于模块化程度极高，提供极高的服务弹性</p> <ul><li>与传统单体服务相比，例如一个企业化的 Java 系统，存在思想上根本的差异</li></ul> <p>其目的和软件设计的目标一致：高内聚低耦合（这同样是 DDD 领域驱动设计的目标）</p> <h3 id="单体项目改造微服务"><a href="#单体项目改造微服务" class="header-anchor">#</a> 单体项目改造微服务</h3> <p>原有架构：系统分为负责核心业务的后端模块、负责校验结果的判题模块和负责编译执行代码的可复用代码沙箱，各模块相互独立，通过 API 接口和分包的方式实现协作</p> <p>微服务重构：基于 Spring Cloud Alibaba + Nacos + Dubbo + Higress 对单体项目进行重构，使用 Redis 分布式 Session 存储登录用户信息，并将项目划分为用户服务、题目服务、判题服务和公共模块</p> <p>Spring Cloud Alibaba 是阿里开源的微服务开发一站式解决方案，我们将用 Spring Cloud Alibaba 改造这个单体 OJ 项目</p> <img src="/assets/img/spring-cloud-alibaba-img.3f7ac48d.png"> <p>Spring Cloud Alibaba 的五大组件</p> <ol><li>Nacos 注册中心</li> <li>Dubbo 通信框架</li> <li>Sentinel 熔断降级</li> <li>Seata 分布式事务</li> <li>RocketMQ 消息队列</li></ol> <p>注意 Spring Cloud Alibaba、Spring Cloud 和 Spring Boot 的对应版本：<a href="https://sca.aliyun.com/docs/2023/overview/version-explain/?spm=7145af80.4cc2c60e.0.0.133270216znaVp" target="_blank" rel="nofollow noopener noreferrer">版本发布说明-阿里云Spring Cloud Alibaba官网<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>SCA 最佳实践</p> <div class="language- extra-class"><pre class="language-text"><code>1. Spring Cloud Gateway：网关
2. Nacos：服务注册和配置中心
3. Sentinel：熔断限流
4. Seata：分布式事务
5. RocketMQ：消息队列，削峰填谷
6. Docker：使用Docker进行容器化部署
7. Kubernetes：使用k8s进行容器化部署
</code></pre></div><img src="/assets/img/20260111-springcloud-sca.291b4d2c.png"> <p>很多时候点赞那么快，实际上，并没有直接进行写 DB，而是丢给消息队列去处理，前端仅做展示</p> <p>对于原有的单体项目，包含后端、沙箱和判题模块，该如何进行改造？需要从业务需求出发</p> <ul><li>用户登录功能：需要改造为分布式登录</li> <li>有没有用到单机锁？如有需要改造为分布式锁</li> <li>有没有用到本地缓存？改造为分布式缓存（Redis）</li> <li>需不需要用到分布式事务？比如操作多个库</li></ul> <p>通过 Redis 分布式 Session 将单机缓存登录改造为分布式登录，此事在聊天室系统中早有记载 [聊天室 - SpringBoot + WebSockets | Northboat](https://northboat.github.io/pages/5455e2/#分布式 Session)</p> <p>此外，这个单体项目将被改造为一下四个服务</p> <ol><li>用户服务</li> <li>题目服务</li> <li>判题服务</li> <li>公共服务</li></ol> <h2 id="nacos-注册中心"><a href="#nacos-注册中心" class="header-anchor">#</a> Nacos 注册中心</h2> <blockquote><p>注册中心是微服务通信的资源核心，不管是 gRPC、Feign 还是 Dubbo，他们的服务端和客户端均要在注册中心进行动态管理</p></blockquote> <p>Nacos 是 Spring Cloud Alibaba 的组件，而 Spring Cloud Alibaba 遵循 Spring Cloud 中定义的服务注册、发现规范</p> <p>对于微服务接口而言，使用 Nacos 和使用 Eureka 并没有太大区别，无非依赖不同、服务地址不同</p> <p>对于每个注册中心，都有<strong>服务端</strong>和<strong>客户端</strong>，并通过指定的<strong>通信协议</strong>进行交互</p> <h3 id="nacos-集成"><a href="#nacos-集成" class="header-anchor">#</a> Nacos 集成</h3> <p>引入 Nacos 客户端依赖并配置</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>com.alibaba.cloud<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-cloud-starter-alibaba-nacos-discovery<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2022.0.0.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span> <span class="token comment">&lt;!-- 根据 Spring Cloud 版本选择 --&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">8081</span>

<span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">application</span><span class="token punctuation">:</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> user<span class="token punctuation">-</span>service
  <span class="token key atrule">cloud</span><span class="token punctuation">:</span>
    <span class="token key atrule">nacos</span><span class="token punctuation">:</span>
      <span class="token key atrule">discovery</span><span class="token punctuation">:</span>
        <span class="token key atrule">server-addr</span><span class="token punctuation">:</span> localhost<span class="token punctuation">:</span><span class="token number">8848</span>  <span class="token comment"># Nacos 服务器地址</span>
        <span class="token key atrule">namespace</span><span class="token punctuation">:</span> public           <span class="token comment"># 命名空间（默认 public）</span>
        <span class="token key atrule">group</span><span class="token punctuation">:</span> DEFAULT_GROUP        <span class="token comment"># 分组（默认 DEFAULT_GROUP）</span>
</code></pre></div><p>在主类中启动 Nacos 注册服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token annotation punctuation">@EnableDiscoveryClient</span> <span class="token comment">// 启用服务注册与发现（兼容 Nacos）</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserServiceApplication</span> <span class="token punctuation">{</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">UserServiceApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>对于正常编写的<code>Controller</code>层代码</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/users&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">class</span> <span class="token class-name">UserController</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Long</span><span class="token punctuation">,</span> <span class="token class-name">User</span><span class="token punctuation">&gt;</span></span> userMap <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 创建用户</span>
    <span class="token annotation punctuation">@PostMapping</span>
    <span class="token keyword">public</span> <span class="token class-name">User</span> <span class="token function">createUser</span><span class="token punctuation">(</span><span class="token annotation punctuation">@RequestBody</span> <span class="token class-name">User</span> user<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        userMap<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> user<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 查询用户</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">User</span> <span class="token function">getUser</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> userMap<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>进行服务注册</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@FeignClient</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;user-service&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 服务名需与目标服务在 Nacos 中的名称一致</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">UserServiceClient</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">User</span> <span class="token function">getUserById</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> userId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>当前项目<code>user-service</code>的接口就被注册在地址为<code>localhost:8848</code>的 Nacos 中</p> <p>服务调用</p> <h3 id="cap-原则"><a href="#cap-原则" class="header-anchor">#</a> CAP 原则</h3> <p>CAP 原则：一致性（Consistency）、可用性（Availability）和分区容忍性（Partition Tolerance）三者不可兼得</p> <p>什么是一致性、可用性和分区容忍性？</p> <ul><li>C 一致性：所有节点在同一时间看到的数据相同</li> <li>A 可用性：每个请求都能得到响应（即使部分节点故障），但不保证是最新数据</li> <li>P 分区容忍性：指系统能够处理网络分区（节点间通信中断）的情况，即使部分节点无法通信，系统仍能正常运行</li></ul> <p>CAP 理论的核心是：一个分布式系统不可能同时很好的满足一致性，可用性和分区容错性这三个需求，因此，根据 CAP 原理将 NoSQL 数据库分成了满足 CA 原则、满足 CP 原则和满足 AP 原则三大类</p> <ul><li>CA：单点集群，满足一致性，可用性的系统，通常缺失可扩展性</li> <li>CP：满足一致性，分区容忍性的系统，通常性能略低</li> <li>AP：满足可用性，分区容忍性的系统，通常一致性要求略低</li></ul> <p>需要注意的是，在分布式环境中，网络分区是不可避免的，因此分布式系统都需要具有分区容忍性（P），故分布式系统的设计中，变成了 AP 和 CP 系统的选择</p> <ul><li>CA 是单点集群，满足一致性和可用性，不支持分区，故仅支持单机系统</li></ul> <p>通常而言，要满足一致性就要牺牲一定的性能（即 CP 的性能会略逊于 AP），或者说“弹性”，举两个简单的例子</p> <p>网飞（Netflex）开源的注册中心 Eureka 是一个典型的 CP 系统，因为他更注重实时性（而非一致性）；而在支付场景，一定是一致性大于实时性，故而阿里开源的 Nacos 必然要能够满足 AP 原则（Nacos 可以在 CP 和 AP 之间切换，这是他的核心竞争力之一）</p> <table><thead><tr><th>系统</th> <th>一致性（C）</th> <th>可用性（A）</th> <th>分区容忍性（P）</th></tr></thead> <tbody><tr><td>Eureka（AP）</td> <td>Eureka 选择<strong>最终一致性</strong>，当一个 Eureka Server 节点失联时，其他节点仍然可以提供服务，保证高可用性，即使短时间内数据可能不同步</td> <td>Eureka 在网络分区时会优先保证可用性，即使某些实例信息不同步，也不会阻止服务发现。这使得 Eureka 能在部分失败的情况下继续运行，提供高可用性</td> <td>Eureka 通过牺牲一致性来保证可用性（AP），即便部分节点无法通信，仍然可以继续提供服务</td></tr> <tr><td>Zookeeper（CP）</td> <td>Zookeeper 采用 ZAB（Zookeeper Atomic Broadcast）协议，保证强一致性，确保集群中的所有节点数据保持同步。一旦有节点崩溃或网络分区发生，Zookeeper 会进入 Leader 选举过程，短时间内不可用，确保数据一致性</td> <td>Zookeeper 在网络分区时更倾向于保持<strong>数据一致性</strong>，可能会拒绝提供服务（即使有部分节点仍可用），导致部分时间不可用</td> <td>Zookeeper 通过<strong>强一致性</strong>机制，在发生分区时优先保证数据正确性（CP），但可能会牺牲部分可用性</td></tr></tbody></table> <h2 id="dubbo-通信"><a href="#dubbo-通信" class="header-anchor">#</a> Dubbo 通信</h2> <p>RPC（Remote Procedure Call），远程过程调用，RPC 框架封装了底层的网络通信、序列化和反序列化，使开发者可以透明地进行远程方法调用（就像调用本地方法一样）</p> <h3 id="nio-和-netty"><a href="#nio-和-netty" class="header-anchor">#</a> NIO 和 Netty</h3> <p>NIO（New Input/Output） 是 Java 1.4 引入的一组用于提供非阻塞输入输出的 API，通过<strong>事件驱动</strong>实现</p> <ul><li>这个事件驱动太熟悉了，在 Spring ApplicationContext 的事件监听实现中，实际上就是一个事件驱动，将监听器的行为通过事件驱动和主逻辑解耦</li> <li>其次在消息队列一对多的场景下，观察者模式的实现，实际上也是一个事件驱动，由中心发布事件触发对应监听者的反应</li></ul> <p>Netty 是一个封装了 Java NIO 的底层网络通信组件，很多应用通信框架（如 Dubbo、Elasticsearch、RocketMQ、gRPC）的实现都离不开 Netty</p> <p>Netty 高性能的关键在于</p> <ul><li>线程池 + 事件驱动</li> <li>零拷贝技术 Zero Copy</li> <li>池化内存</li> <li>TCP 粘包 / 拆包处理</li></ul> <h3 id="集成-dubbo"><a href="#集成-dubbo" class="header-anchor">#</a> 集成 Dubbo</h3> <p>Dubbo 是一个 RPC 框架，他并不是打的 HTTP 请求，而是基于 TCP 的 Dubbo 协议，省去了很多 HTTP 中冗余部分</p> <p>核心特性如下</p> <ol><li>高性能 RPC：基于 Netty 实现，性能优异</li> <li>服务治理：支持负载均衡、服务降级、熔断、限流等功能</li> <li>服务发现：支持多种注册中心（如 Zookeeper、Nacos）</li> <li>多协议支持：支持 Dubbo 协议、HTTP、REST 等</li> <li>分布式事务：支持分布式事务解决方案（如 Seata）</li></ol> <p>注册中心挂了之后，Dubbo 还能访问到服务吗？</p> <ul><li>分情况，如果之前调用过，Dubbo 会把服务地址缓存在本地，再次调用时不会访问注册中心，这里会存在一致性的问题</li></ul> <h3 id="rpc-框架选择"><a href="#rpc-框架选择" class="header-anchor">#</a> RPC 框架选择</h3> <p>简单考虑</p> <ul><li>简单的 HTTP 请求，选择 WebClient（异步或流式场景），Spring Boot 4 新引入了 HTTP Service Clients</li> <li>负载均衡和声明式 HTTP 调用，选择 OpenFeign，内置了 Ribbon 做负载均衡</li> <li>如果需要高性能的 RPC 调用和更强的服务管理能力，选择 Dubbo / gRPC</li></ul> <p>总的来说，基于 TCP 的协议，例如 Dubbo 的 Dubbo 协议和 gRPC 的 HTTP2，效率会明显高于使用 HTTP 的 Feign</p> <h2 id="higress-网关"><a href="#higress-网关" class="header-anchor">#</a> Higress 网关</h2> <h3 id="路由与限流"><a href="#路由与限流" class="header-anchor">#</a> 路由与限流</h3> <p>网关的常见用途：权限控制、路由、负载均衡、限流</p> <p>一个网关的基本架构</p> <img src="/assets/img/2729274-20230205163347683-397320818.b336006b.png"> <p>项目中，用户请求先走负载均衡，再打网关，最后打到微服务</p> <p>我更倾向于用后端去做权限校验，而不是网关层，故而网关的作用更多是路由、负载均衡和限流，类似于一个更高级更全面的 Nginx 管理</p> <h2 id="sentinel-限流"><a href="#sentinel-限流" class="header-anchor">#</a> Sentinel 限流</h2> <blockquote><p>阿里开源的熔断降级解决方案，Spring Cloud Alibaba 的五大组件之一</p></blockquote> <p>限流、熔断和服务降级是三种常用的系统稳定性策略，通常我们说为了保证系统的可用性，限流、降级、熔断一把梭</p> <ul><li>降级：服务端出现问题，客户端降级使用 FallbackMethod 方法，返回一个友好的提示，而不至于忙等</li> <li>熔断：达到一定条件后（比如请求故障率达到 60%），一直降级，缓慢恢复</li> <li>限流：比如点对点消息队列缓慢消费请求，大家排队，一秒钟 N 个，有序进行，秒杀高并发等操作，严禁一窝蜂的过来拥挤</li></ul> <h3 id="熔断和限流"><a href="#熔断和限流" class="header-anchor">#</a> 熔断和限流</h3> <p>熔断（Circuit Breaker）类似于家里的电路保险丝，当电流过大时，保险丝会断开电路，以防电器损坏。在<strong>分布式系统</strong>中，熔断机制用于<strong>检测服务是否故障，并在故障严重时自动阻止请求，以防止系统崩溃</strong></p> <p>熔断器通常有以下三种状态</p> <ol><li>关闭（Closed）：服务正常运行，请求可以自由通过</li> <li>打开（Open）：当错误率达到阈值，熔断器打开，所有请求都会被拒绝，防止系统继续崩溃</li> <li>半开（Half-Open）：经过一段时间后，系统尝试放行部分请求进行测试，如果恢复正常，熔断器关闭，否则保持打开状态</li></ol> <p>一个简单示例</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@CircuitBreaker</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;paymentService&quot;</span><span class="token punctuation">,</span> fallbackMethod <span class="token operator">=</span> <span class="token string">&quot;fallbackPayment&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">callPaymentService</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 调用远程支付服务</span>
    <span class="token keyword">return</span> restTemplate<span class="token punctuation">.</span><span class="token function">getForObject</span><span class="token punctuation">(</span><span class="token string">&quot;http://payment-service/pay&quot;</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 熔断后的降级方法</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">fallbackPayment</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;支付服务不可用，请稍后重试&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">resilience4j.circuitbreaker</span><span class="token punctuation">:</span>
  <span class="token key atrule">instances</span><span class="token punctuation">:</span>
    <span class="token key atrule">paymentService</span><span class="token punctuation">:</span>
      <span class="token key atrule">failureRateThreshold</span><span class="token punctuation">:</span> <span class="token number">50</span>  <span class="token comment"># 失败率达到 50% 时触发熔断</span>
      <span class="token key atrule">waitDurationInOpenState</span><span class="token punctuation">:</span> 5000ms  <span class="token comment"># 熔断后 5 秒再尝试恢复</span>
      <span class="token key atrule">permittedNumberOfCallsInHalfOpenState</span><span class="token punctuation">:</span> <span class="token number">3</span>  <span class="token comment"># 半开状态时允许 3 个请求进行尝试</span>
</code></pre></div><p>而限流（Rate Limiting）是一种限制请求速率的技术，防止单个服务被过量请求拖垮，确保系统能够平稳运行</p> <p>为什么需要限流</p> <ul><li>防止流量暴增导致系统崩溃（如双十一购物、秒杀活动）</li> <li>防止恶意攻击（如爬虫、DDoS 攻击）</li> <li>合理分配系统资源，保障 VIP 用户的优先级</li></ul> <p>Spring Cloud Gateway 内置了基于 Redis 令牌桶算法的限流功能，需要同时引入 Redis 和 Gateway 依赖并进行限流规则配置</p> <table><thead><tr><th>特性</th> <th>熔断（Circuit Breaker）</th> <th>限流（Rate Limiting）</th></tr></thead> <tbody><tr><td>目的</td> <td>保护服务，防止雪崩</td> <td>保护系统，防止过载</td></tr> <tr><td>触发条件</td> <td>远程服务故障率高</td> <td>访问量超出限制</td></tr> <tr><td>作用</td> <td>暂停访问故障服务</td> <td>限制请求速率</td></tr> <tr><td>适用场景</td> <td>微服务间调用</td> <td>API 网关、秒杀活动</td></tr> <tr><td>实现工具</td> <td>Resilience4J、Hystrix</td> <td>Spring Cloud Gateway、Redis</td></tr></tbody></table> <p>什么时候使用熔断？什么时候使用限流？</p> <ul><li>熔断：服务出现错误返回是不被允许的，例如微信支付，如果支付接口故障，启用熔断，显示“支付系统繁忙”，而不能让请求挂着造成未知错误</li> <li>限流：当你的服务流量暴增时，防止服务器资源被耗尽，例如淘宝双十一，高并发限流，防止流量冲垮系统，运行请求在后台“挂着”</li></ul> <p>简单来说：熔断用于<strong>保护服务</strong>，防止雪崩效应；限流用于<strong>平稳流量</strong>，防止高并发拖垮系统</p> <h2 id="seata-事务"><a href="#seata-事务" class="header-anchor">#</a> Seata 事务</h2> <blockquote><p>Spring Cloud Alibaba 的五大组件之一，阿里开源的分布式事务解决方案</p></blockquote> <h3 id="事务与隔离级别"><a href="#事务与隔离级别" class="header-anchor">#</a> 事务与隔离级别</h3> <p>什么是事务？事务是指一组操作的逻辑单元，这些操作要么全部成功，要么全部失败，事务具有四个基本特性（ACID）</p> <ul><li>原子性：事务中的所有操作要么全部完成，要么全部不做</li> <li>一致性：事务执行前后，数据库必须保持一致性状态</li> <li>隔离性：并发执行的事务之间互不干扰</li> <li>持久性：一旦事务提交，其结果是永久性的，即使系统崩溃也不会丢失</li></ul> <p>在 Spring 中，可用<code>@Transactional</code> 声明事务，它极大地简化了事务管理，直接在 Service 层对应的方法上进行注解，即可完成一次事务的编写</p> <ul><li><code>@Transactional</code> 只能修饰 public 方法</li> <li><code>@Transactional</code> 不能自身调用，比如方法 A 和 B 都在 UserService 类中，如果在 A 中调用 B 方法，即使 B 方法有<code>@Transactional</code> 修饰，这个事务也不会生效，这和 Java 的动态代理机制有关</li></ul> <p>例如网银系统 Demo 中的一次 SQL 数据库事务写入</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Deprecated</span>
<span class="token annotation punctuation">@Transactional</span>
<span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">doWithdrawal</span><span class="token punctuation">(</span><span class="token class-name">TransactionDTO</span> transactionDTO<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> r <span class="token operator">=</span> accountMapper<span class="token punctuation">.</span><span class="token function">updateBalanceById</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">negate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Transaction</span> transaction <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Transaction</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token number">0L</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;外部账户&quot;</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;用户取款&quot;</span><span class="token punctuation">,</span>
                                              r <span class="token operator">==</span> <span class="token number">1</span> <span class="token operator">?</span> <span class="token number">0</span> <span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> transactionMapper<span class="token punctuation">.</span><span class="token function">insertTransaction</span><span class="token punctuation">(</span>transaction<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一些设置</p> <ul><li><code>@Transactional(timeout = 5)</code>：设置超时，单位秒，超过时间未完成则回滚</li> <li><code>@Transactional(readOnly = true)</code>：只读事务中不能执行写操作，否则会抛出异常</li> <li>事务回滚规则：默认情况下，<code>@Transactional</code> 回滚的是 RunTimeException，如果需要特殊要求，需要指定
<ul><li><code>@Transactional(rollbackFor = {IOException.class, SQLException.class})</code>：回滚 I/O 和 SQL 异常</li> <li><code>@Transactional(noRollbackFor = {NullPointerException.class})</code>：不回滚空指针异常</li></ul></li></ul> <p>常见的事务隔离事故，以注解 @Transactional 为例</p> <p><code>@Transactional</code> 的 <code>isolation</code> 属性用于定义事务的隔离级别，常见的隔离级别如下</p> <table><thead><tr><th>隔离级别</th> <th>防止脏读</th> <th>防止不可重复读</th> <th>防止幻读</th></tr></thead> <tbody><tr><td>read uncommitted</td> <td>✗</td> <td>✗</td> <td>✗</td></tr> <tr><td>read committed</td> <td>✓</td> <td>✗</td> <td>✗</td></tr> <tr><td>repeatable read (MySQL 默认)</td> <td>✓</td> <td>✓</td> <td>部分 ✓（间隙锁）</td></tr> <tr><td>serializable</td> <td>✓</td> <td>✓</td> <td>✓</td></tr></tbody></table> <p>使用示例</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Transactional</span><span class="token punctuation">(</span>isolation <span class="token operator">=</span> <span class="token class-name">Isolation</span><span class="token punctuation">.</span><span class="token constant">REPEATABLE_READ</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">methodB</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 在可重复读隔离级别下执行</span>
<span class="token punctuation">}</span>
</code></pre></div><p>什么是脏读、不可重复读和幻读？</p> <p>脏读</p> <ul><li>读到了写过程中的临时数据</li> <li>解决办法：给写加锁，写时不能读</li></ul> <p>不可重复读</p> <ul><li>就是说，在一个事务中，前后重复读同一数据，数据存在改变</li> <li>原因：读时可写 → 解决办法：给读加锁</li></ul> <p>幻读</p> <ul><li>针对表而言，之前给行加了读/写锁，即单个数据项有读/写锁从而防止脏读和不可重复读，但对于数据表而言，比如<code>count(*)</code>操作，即使数据项 a 在被写，数据项 b 在被读，但不影响数据 c 插入数据表，那么同一事务的前后两次<code>count(*)</code>就有可能返回不一样的结果，这就叫幻读</li> <li>解决方法：对整个数据表加读写锁，彻底串行执行，效率极低</li></ul> <p>修改丢失</p> <ul><li>写写没加锁，后一次写覆盖了前一次写的提交，很有可能会破坏数据一致性</li> <li>例如：存款原本有 1000，A 事务存 50，B 事务取 100，二者进行修改时，都会先读取余额，假设他们现在同时读，都读到 1000，那么 A 会将 1050 写回（操作 ①），B 会将 900 写回（操作 ②），操作 ① ② 先后执行，那么最终存款将会变成 900</li> <li>这一过程覆盖了 A 事务存款 50 的 commit，并且破坏了数据的一致性</li></ul> <p>一般而言，解决分布式事务会用到以下几种机制</p> <ul><li>2PC：两阶段提交，将事务的提交过程分为资源准备和资源提交两个阶段，并且由事务协调者来协调所有事务参与者，如果准备阶段所有事务参与者都预留资源成功，则进行第二阶段的资源提交，否则事务协调者回滚资源</li> <li>3PC：三阶段提交协议，是二阶段提交协议的改进版本，三阶段提交有两个改动点
<ol><li>在协调者和参与者中都引入超时机制</li> <li>在第一阶段和第二阶段中插入一个准备阶段，保证了在最后提交阶段之前各参与节点的状态是一致的</li></ol></li> <li>TCC：一种分布式事务处理方法，它的名称来自于其三个阶段<code>Try, Confirm, Cancel</code>，这种方法主要用于处理在分布式系统中，多个服务需要协同完成一项操作时的一致性问题</li></ul> <h2 id="其他分布式问题"><a href="#其他分布式问题" class="header-anchor">#</a> 其他分布式问题</h2> <h3 id="分布式计算"><a href="#分布式计算" class="header-anchor">#</a> 分布式计算</h3> <p>大数据 / 分布式计算引擎</p> <ul><li>Flink</li> <li>Spark</li></ul> <p>在大数据场景中，Flink 经常和 Kafka 搭配，用来<strong>清洗</strong> Kafka 的数据流，例如 Flink 接收 Kafka 日志队列统计用户点击量</p> <ol><li>Kafka 生产数据（日志、用户点击、设备数据等）</li> <li>Flink 进行实时处理（聚合、分析、清洗）</li> <li>处理结果存入 Kafka（本地磁盘） / 关系型数据库 / Elasticsearch</li></ol> <p>Flink 专注于流处理，而 Spark 以批处理为主，二者对比</p> <table><thead><tr><th>对比</th> <th>Flink</th> <th>Spark</th></tr></thead> <tbody><tr><td>计算模式</td> <td>主要是流计算，也支持批处理</td> <td>主要是批处理，支持流计算</td></tr> <tr><td>延迟</td> <td>毫秒级</td> <td>秒级</td></tr> <tr><td>吞吐量</td> <td>高吞吐，适用于高并发</td> <td>较高吞吐，但稍逊于 Flink</td></tr> <tr><td>故障恢复</td> <td>Exactly-Once 语义，保证数据一致性</td> <td>At-Least-Once，可能重复计算</td></tr> <tr><td>API 兼容</td> <td>提供 SQL、Java、Python API</td> <td>提供 SQL、Scala、Java API</td></tr></tbody></table> <h3 id="分布式链路追踪"><a href="#分布式链路追踪" class="header-anchor">#</a> 分布式链路追踪</h3> <p>参考文献：<a href="https://www.cnblogs.com/caoweixiong/p/14475815.html" target="_blank" rel="nofollow noopener noreferrer">分布式服务调用链路追踪——方案选型 - 曹伟雄 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>在分布式系统中，一次调用如果时间过长，由于微服务之间的相互调用，想要找出到底是谁掉了链子是一件很困难的事情，这对故障排查是很大的阻碍，于是就有了分布式链路追踪的需求</p> <ul><li>分布式链路实际上就是指的请求的调用链</li></ul> <p>常见的分布式链路追踪框架</p> <ul><li>Zipkin：由 Twitter 开源、现由 OpenZipkin 社区维护的 <strong>分布式链路追踪系统</strong>，可帮助开发者收集和分析微服务调用的时序数据，快速定位性能瓶颈与故障点，支持内存、MySQL、Elasticsearch、Cassandra 等多种存储方式</li> <li>SkyWalking：华子开源的分布式链路追踪框架，其基本思路就是利用 Java Agent 对现成的项目进行插桩，通过外置的 Collector 收集者对项目的链路进行监控并进行持久化存储以及可视化控制</li></ul> <p>有这样几个关键点</p> <ul><li>每个链路必须有其独有的 ID 标识</li> <li>每条链路中的每个服务必须独有标识</li> <li>采用类似于心跳检测的策略对链路进行监控（约 1s 一次），但要注意，一但收集到上游的请求，那么必须对整条链路进行收集</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/03/01, 21:02:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/9e801d/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">软件工程原理与应用</div></a> <a href="/pages/46b8df/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">DDD 领域驱动设计</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
