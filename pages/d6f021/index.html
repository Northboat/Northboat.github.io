0FPxx/Q35mA8aEUrH6nCgwEl0tn7wUiZYJnNRh6DK4UH/k0lfyrsBKdPVv/AriGIQcEDQZ65LBAGe2Rzui9Ybjz7XUppz1/uKBbyVPGkN3ZAeC6hr0x7Nr38N5+EqkoOm17xpoqR9ohQF55ERSvr4Dkr3chNfC3DMzGJlNBElW8w9nsGQvhNGIzDkXzCg8cLK951xHsFBlTJspJNi3ZFIMF2AeDV3q8DNOB+YHi6QTrChDIWDBRi5U5f+ZMfJLu3ccrqxtdxk4SKH336LFxSmkqefwU5T8fhdSdQf9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">微服务开发<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>软件业的人乐于做这样的事 —— 找一些词汇，并把它们引申到大量微妙而又互相矛盾的意义，例如“架构” —— 《Patterns of Enterprise Application Architecture》</p> <h2 id="微服务系统概述"><a href="#微服务系统概述" class="header-anchor">#</a> 微服务系统概述</h2> <blockquote><p>现阶段的代码优化，一个就是单体项目的微服务改造，再一个就是设计模式的优化</p></blockquote> <h3 id="soa-与分布式系统"><a href="#soa-与分布式系统" class="header-anchor">#</a> SOA 与分布式系统</h3> <p>SOA（Service Oriented Architecture），面向服务架构，是一种通过服务接口将应用程序功能模块化的架构风格，相比于微服务，他的设计粒度更大，服务之间的交互更复杂，通常是大系统之间的耦合</p> <p>分布式系统的定义：多个计算机通过网络协同工作而<strong>对外表现为一个整体</strong></p> <p>分布式系统的核心特点</p> <ol><li>多机协作：任务由多个计算机协作完成，而非单机处理</li> <li>数据共享：不同节点之间共享数据，可能涉及数据一致性问题</li> <li>去中心化：避免单点故障，提高系统可用性</li> <li>并发性：多个节点可以并行处理任务，提高吞吐量</li> <li>容错能力：某些节点宕机时，系统仍能继续运行</li></ol> <p>导致扩展性好、稳定性高、容错强</p> <h3 id="微服务与云原生概念"><a href="#微服务与云原生概念" class="header-anchor">#</a> 微服务与云原生概念</h3> <p>微服务本质上是通过 HTTP 或其他网络协议进行通讯来实现，更多的是一种细腻的模块化思想，其核心在于</p> <ul><li>服务拆分</li> <li>服务之间调用</li> <li>服务管理</li></ul> <p>微服务和单体项目，分布式部署和单机部署，这是两套不同的概念，不能混为一谈，一个是项目设计的事，一个是项目部署的事，但二者存在关联，例如绝大部分微服务都会选择分布式部署，单机部署不完</p> <p>常见的微服务技术</p> <ul><li>Spring Cloud</li> <li>Spring Cloud Alibaba</li> <li>Dubbo</li> <li>RPC（GRPC、TRPC）</li></ul> <p>在现有的成熟框架中，如 Spring Cloud Alibaba，其每一项组件都是在解决一项具体的分布式问题，从而能够快速开发一个成熟的微服务系统</p> <p>云计算背景下，软件、平台和基础设施都被视作服务 Service</p> <ul><li>SaaS：Software as a Service 软件即服务</li> <li>Paas：Platform as a Service 平台即服务</li> <li>IaaS：Infrastructure as a Service 基础设施即服务</li></ul> <p>云原生是一种概念，各个地方的定义不尽相同，但总是包含以下关键词</p> <ol><li>微服务</li> <li>容器化</li> <li>DevOps</li> <li>持续交付</li></ol> <p>云原生用持续交付代替瀑布开发，采用“小步快跑”的方式进行开发，并且由于模块化程度极高，提供极高的服务弹性</p> <ul><li>与传统单体服务相比，例如一个企业化的 Java 系统，存在思想上根本的差异</li></ul> <p>其目的和软件设计的目标一致：高内聚低耦合（这同样是 DDD 领域驱动设计的目标），在我的理解里，云原生像是一种自治但协作的<strong>主体</strong>理念，忠橙！</p> <h3 id="单体项目改造微服务"><a href="#单体项目改造微服务" class="header-anchor">#</a> 单体项目改造微服务</h3> <p>原有架构：系统分为负责核心业务的后端模块、负责校验结果的判题模块和负责编译执行代码的可复用代码沙箱，各模块相互独立，通过 API 接口和分包的方式实现协作</p> <p>微服务重构：基于 Spring Cloud Alibaba + Nacos + Dubbo + Higress 对单体项目进行重构，使用 Redis 分布式 Session 存储登录用户信息，并将项目划分为用户服务、题目服务、判题服务和公共模块</p> <p>Spring Cloud Alibaba 是阿里开源的微服务开发一站式解决方案，我们将用 Spring Cloud Alibaba 改造这个单体 OJ 项目</p> <img src="/assets/img/spring-cloud-alibaba-img.3f7ac48d.png"> <p>Spring Cloud Alibaba 的五大组件</p> <ol><li>Nacos 注册中心</li> <li>Dubbo 通信框架</li> <li>Sentinel 熔断降级</li> <li>Seata 分布式事务</li> <li>RocketMQ 消息队列</li></ol> <p>注意 Spring Cloud Alibaba、Spring Cloud 和 Spring Boot 的对应版本：<a href="https://sca.aliyun.com/docs/2023/overview/version-explain/?spm=7145af80.4cc2c60e.0.0.133270216znaVp" target="_blank" rel="nofollow noopener noreferrer">版本发布说明-阿里云Spring Cloud Alibaba官网<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>SCA 最佳实践</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>1. Spring Cloud Gateway：网关
2. Nacos：服务注册和配置中心
3. Sentinel：熔断限流
4. Seata：分布式事务
5. RocketMQ：消息队列，削峰填谷
6. Docker：使用 Docker 进行容器化部署
7. Kubernetes：使用 k8s 进行容器化部署
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><img src="/assets/img/20260111-springcloud-sca.291b4d2c.png"> <p>很多时候点赞那么快，实际上，并没有直接进行写 DB，而是丢给消息队列去处理，前端仅做展示</p> <p>对于原有的单体项目，包含后端、沙箱和判题模块，该如何进行改造？需要从业务需求出发</p> <ul><li>用户登录功能：需要改造为分布式登录</li> <li>有没有用到单机锁？如有需要改造为分布式锁</li> <li>有没有用到本地缓存？改造为分布式缓存（Redis）</li> <li>需不需要用到分布式事务？比如操作多个库</li></ul> <p>通过 Redis 分布式 Session 将单机缓存登录改造为分布式登录，此事在聊天室系统中早有记载 [聊天室 - SpringBoot + WebSockets | Northboat](https://northboat.github.io/pages/5455e2/#分布式 Session)</p> <p>例如，OJ 这个单体 Spring 项目可以被改造为以下四个服务</p> <ol><li>用户服务</li> <li>题目服务</li> <li>判题服务</li> <li>公共服务</li></ol> <p>各个服务的业务能力保持不变，接口保持不变，只是调用关系发生改变，从内部调用变成 RPC 调用，前端的请求地址从 1 个变成 4 个</p> <h2 id="微服务组件"><a href="#微服务组件" class="header-anchor">#</a> 微服务组件</h2> <p>每个微服务组件都是在解决一个分布式问题</p> <h3 id="配置中心-nacos"><a href="#配置中心-nacos" class="header-anchor">#</a> 配置中心 Nacos</h3> <blockquote><p>注册中心是微服务通信的资源核心，不管是 gRPC、Feign 还是 Dubbo，他们的服务端和客户端均要在注册中心进行动态管理</p></blockquote> <p>Nacos 是 Spring Cloud Alibaba 的组件，是一个中心化的配置中心，可用于微服务的接口注册和配置统计管理</p> <ul><li>对于业务层而言，配置中心的使用是透明的，使用 Nacos 和使用 Eureka 并没有太大区别，无非依赖和服务地址不同</li> <li>每个注册中心的服务端和客户端，通过指定的通信协议进行交互</li></ul> <p>引入 Nacos 客户端依赖并配置</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>com.alibaba.cloud<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-cloud-starter-alibaba-nacos-discovery<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2022.0.0.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span> <span class="token comment">&lt;!-- 根据 Spring Cloud 版本选择 --&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">8081</span>

<span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">application</span><span class="token punctuation">:</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> user<span class="token punctuation">-</span>service
  <span class="token key atrule">cloud</span><span class="token punctuation">:</span>
    <span class="token key atrule">nacos</span><span class="token punctuation">:</span>
      <span class="token key atrule">discovery</span><span class="token punctuation">:</span>
        <span class="token key atrule">server-addr</span><span class="token punctuation">:</span> localhost<span class="token punctuation">:</span><span class="token number">8848</span>  <span class="token comment"># Nacos 服务器地址</span>
        <span class="token key atrule">namespace</span><span class="token punctuation">:</span> public           <span class="token comment"># 命名空间（默认 public）</span>
        <span class="token key atrule">group</span><span class="token punctuation">:</span> DEFAULT_GROUP        <span class="token comment"># 分组（默认 DEFAULT_GROUP）</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>在主类中启动 Nacos 注册服务</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token annotation punctuation">@EnableDiscoveryClient</span> <span class="token comment">// 启用服务注册与发现（兼容 Nacos）</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserServiceApplication</span> <span class="token punctuation">{</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">UserServiceApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>例如一个正常的<code>Controller</code>层代码</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/users&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">class</span> <span class="token class-name">UserController</span> <span class="token punctuation">{</span>
    <span class="token comment">// 查询用户</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">User</span> <span class="token function">getUser</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> userService<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>对接口进行微服务注册</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@FeignClient</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;user-service&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 服务名需与目标服务在 Nacos 中的名称一致</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">UserServiceClient</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">User</span> <span class="token function">getUserById</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> userId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>当前项目<code>user-service</code>的接口就被注册在地址为<code>localhost:8848</code>的 Nacos 中</p> <h4 id="cap-原则"><a href="#cap-原则" class="header-anchor">#</a> CAP 原则</h4> <p>CAP 原则：一致性（Consistency）、可用性（Availability）和分区容忍性（Partition Tolerance）三者不可兼得</p> <p>什么是一致性、可用性和分区容忍性</p> <ul><li>一致性：所有节点在同一时间看到的数据相同</li> <li>可用性：每个请求都能得到响应（即使部分节点故障），但不保证是最新数据</li> <li>分区容忍性：指系统能够处理网络分区（节点间通信中断）的情况，即使部分节点无法通信，系统仍能正常运行</li></ul> <p>CAP 理论的核心是：一个分布式系统不可能同时很好的满足一致性，可用性和分区容错性这三个需求，因此，根据 CAP 原理将 NoSQL 数据库分成了满足 CA 原则、满足 CP 原则和满足 AP 原则三大类</p> <ul><li>CA：单点集群，满足一致性，可用性的系统，通常缺失可扩展性</li> <li>CP：满足一致性，分区容忍性的系统，通常性能略低</li> <li>AP：满足可用性，分区容忍性的系统，通常一致性要求略低</li></ul> <p>需要注意的是，在分布式环境中，网络分区是不可避免的，因此分布式系统都需要具有分区容忍性（P），故分布式系统的设计中，变成了 AP 和 CP 系统的选择</p> <ul><li>CA 是单点集群，满足一致性和可用性，不支持分区，故仅支持单机系统</li></ul> <p>通常而言，要满足一致性就要牺牲一定的性能（即 CP 的性能会略逊于 AP），或者说“弹性”，举两个简单的例子</p> <p>网飞（Netflex）开源的注册中心 Eureka 是一个典型的 CP 系统，因为他更注重实时性（而非一致性）；而在支付场景，一定是一致性大于实时性，故而阿里开源的 Nacos 必然要能够满足 AP 原则（Nacos 可以在 CP 和 AP 之间切换，这是他的核心竞争力之一）</p> <table><thead><tr><th>系统</th> <th>一致性（C）</th> <th>可用性（A）</th> <th>分区容忍性（P）</th></tr></thead> <tbody><tr><td>Eureka（AP）</td> <td>Eureka 选择<strong>最终一致性</strong>，当一个 Eureka Server 节点失联时，其他节点仍然可以提供服务，保证高可用性，即使短时间内数据可能不同步</td> <td>Eureka 在网络分区时会优先保证可用性，即使某些实例信息不同步，也不会阻止服务发现。这使得 Eureka 能在部分失败的情况下继续运行，提供高可用性</td> <td>Eureka 通过牺牲一致性来保证可用性（AP），即便部分节点无法通信，仍然可以继续提供服务</td></tr> <tr><td>Zookeeper（CP）</td> <td>Zookeeper 采用 ZAB（Zookeeper Atomic Broadcast）协议，保证强一致性，确保集群中的所有节点数据保持同步。一旦有节点崩溃或网络分区发生，Zookeeper 会进入 Leader 选举过程，短时间内不可用，确保数据一致性</td> <td>Zookeeper 在网络分区时更倾向于保持<strong>数据一致性</strong>，可能会拒绝提供服务（即使有部分节点仍可用），导致部分时间不可用</td> <td>Zookeeper 通过<strong>强一致性</strong>机制，在发生分区时优先保证数据正确性（CP），但可能会牺牲部分可用性</td></tr></tbody></table> <h3 id="rpc-通信框架-dubbo"><a href="#rpc-通信框架-dubbo" class="header-anchor">#</a> RPC 通信框架 Dubbo</h3> <p>RPC（Remote Procedure Call），远程过程调用，RPC 框架封装了底层的网络通信、序列化和反序列化，使远程接口本地调用化</p> <ul><li>MCP 的调用本质上也是一种 RPC，只不过用的是 Json 2 协议，通常微服务的 RPC 基于 TCP 或 HTTP</li></ul> <blockquote><p>NIO 和 Netty 是 RPC 的实现底层原理</p></blockquote> <p>NIO（New Input/Output） 是 Java 1.4 引入的一组用于提供非阻塞输入输出的 API，通过<strong>事件驱动</strong>实现</p> <ul><li>这个事件驱动太熟悉了，在 Spring ApplicationContext 的事件监听实现中，实际上就是一个事件驱动，将监听器的行为通过事件驱动和主逻辑解耦</li> <li>其次在消息队列一对多的场景下，观察者模式的实现，实际上也是一个事件驱动，由中心发布事件触发对应监听者的反应</li></ul> <p>Netty 是一个封装了 Java NIO 的底层网络通信组件，很多应用通信框架（如 Dubbo、Elasticsearch、RocketMQ、gRPC）的实现都离不开 Netty</p> <p>Netty 高性能的关键在于</p> <ul><li>线程池 + 事件驱动</li> <li>零拷贝技术 Zero Copy</li> <li>池化内存</li> <li>TCP 粘包 / 拆包处理</li></ul> <p>Dubbo：Dubbo 是一个 RPC 框架，通信基于 TCP 的 Hessian 2 协议，省去了很多 HTTP 中冗余部分</p> <p>核心特性如下</p> <ol><li>高性能：基于 Netty 实现</li> <li>服务治理：支持负载均衡、服务降级、熔断、限流等功能</li> <li>服务发现：支持多种注册中心（如 Zookeeper、Nacos）</li> <li>多协议支持：支持 Dubbo 协议、HTTP、REST 等</li> <li>分布式事务：支持分布式事务解决方案（如 Seata）</li></ol> <p>注册中心挂了之后，Dubbo 还能访问到服务吗？分情况，如果之前调用过，Dubbo 会把服务地址缓存在本地，再次调用时不会访问注册中心，这里会存在一致性的问题</p> <p>RPC 框架选择</p> <ul><li>简单的 HTTP 请求，选择 WebClient（异步或流式场景），Spring Boot 4 新引入了 HTTP Service Clients</li> <li>负载均衡和声明式 HTTP 调用，选择 OpenFeign，内置了 Ribbon 做负载均衡</li> <li>如果需要高性能的 RPC 调用和更强的服务管理能力，选择 Dubbo / gRPC</li></ul> <p>总的来说，基于 TCP 的协议，例如 Dubbo 的 Dubbo 协议和 gRPC 的 HTTP2，效率会明显高于使用 HTTP 的 Feign</p> <h3 id="网关-higress"><a href="#网关-higress" class="header-anchor">#</a> 网关 Higress</h3> <blockquote><p>网关的常见用途：权限控制、路由、负载均衡、限流</p></blockquote> <p>一个网关的基本架构：项目中，用户请求先走负载均衡，再打网关，最后打到微服务</p> <img src="/assets/img/2729274-20230205163347683-397320818.b336006b.png"> <p>我更倾向于用后端去做权限校验，而不是网关层，故而网关的作用更多是路由、负载均衡和限流，类似于一个更高级更全面的 Nginx 管理</p> <ul><li>实际中也确实如此，真正的用户权限在后端鉴权（因为用户权限落在后端 DB 中），但网关也负责一部分的鉴权，例如是否携带必要的请求头，请求来源是否合法等等过滤</li></ul> <h3 id="限流熔断组件-sentinel"><a href="#限流熔断组件-sentinel" class="header-anchor">#</a> 限流熔断组件 Sentinel</h3> <blockquote><p>阿里开源的熔断降级解决方案，Spring Cloud Alibaba 的五大组件之一</p></blockquote> <p>限流、熔断和服务降级是三种常用的系统稳定性策略，通常我们说为了保证系统的可用性，限流、降级、熔断一把梭</p> <ul><li>降级：服务端出现问题，客户端降级使用 FallbackMethod 方法，返回一个友好的提示，而不至于忙等</li> <li>熔断：达到一定条件后（比如请求故障率达到 60%），一直降级，缓慢恢复</li> <li>限流：比如点对点消息队列缓慢消费请求，大家排队，一秒钟 N 个，有序进行，秒杀高并发等操作，严禁一窝蜂的过来拥挤</li></ul> <p>熔断（Circuit Breaker）类似于家里的电路保险丝，当电流过大时，保险丝会断开电路，以防电器损坏。在<strong>分布式系统</strong>中，熔断机制用于<strong>检测服务是否故障，并在故障严重时自动阻止请求，以防止系统崩溃</strong></p> <p>熔断器通常有以下三种状态</p> <ol><li>关闭（Closed）：服务正常运行，请求可以自由通过</li> <li>打开（Open）：当错误率达到阈值，熔断器打开，所有请求都会被拒绝，防止系统继续崩溃</li> <li>半开（Half-Open）：经过一段时间后，系统尝试放行部分请求进行测试，如果恢复正常，熔断器关闭，否则保持打开状态</li></ol> <p>一个简单示例</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@CircuitBreaker</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;paymentService&quot;</span><span class="token punctuation">,</span> fallbackMethod <span class="token operator">=</span> <span class="token string">&quot;fallbackPayment&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">callPaymentService</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 调用远程支付服务</span>
    <span class="token keyword">return</span> restTemplate<span class="token punctuation">.</span><span class="token function">getForObject</span><span class="token punctuation">(</span><span class="token string">&quot;http://payment-service/pay&quot;</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 熔断后的降级方法</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">fallbackPayment</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;支付服务不可用，请稍后重试&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">resilience4j.circuitbreaker</span><span class="token punctuation">:</span>
  <span class="token key atrule">instances</span><span class="token punctuation">:</span>
    <span class="token key atrule">paymentService</span><span class="token punctuation">:</span>
      <span class="token key atrule">failureRateThreshold</span><span class="token punctuation">:</span> <span class="token number">50</span>  <span class="token comment"># 失败率达到 50% 时触发熔断</span>
      <span class="token key atrule">waitDurationInOpenState</span><span class="token punctuation">:</span> 5000ms  <span class="token comment"># 熔断后 5 秒再尝试恢复</span>
      <span class="token key atrule">permittedNumberOfCallsInHalfOpenState</span><span class="token punctuation">:</span> <span class="token number">3</span>  <span class="token comment"># 半开状态时允许 3 个请求进行尝试</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>而限流（Rate Limiting）是一种限制请求速率的技术，防止单个服务被过量请求拖垮，确保系统能够平稳运行</p> <p>为什么需要限流</p> <ul><li>防止流量暴增导致系统崩溃（如双十一购物、秒杀活动）</li> <li>防止恶意攻击（如爬虫、DDoS 攻击）</li> <li>合理分配系统资源，保障 VIP 用户的优先级</li></ul> <p>Spring Cloud Gateway 内置了基于 Redis 令牌桶算法的限流功能，需要同时引入 Redis 和 Gateway 依赖并进行限流规则配置</p> <table><thead><tr><th>特性</th> <th>熔断（Circuit Breaker）</th> <th>限流（Rate Limiting）</th></tr></thead> <tbody><tr><td>目的</td> <td>保护服务，防止雪崩</td> <td>保护系统，防止过载</td></tr> <tr><td>触发条件</td> <td>远程服务故障率高</td> <td>访问量超出限制</td></tr> <tr><td>作用</td> <td>暂停访问故障服务</td> <td>限制请求速率</td></tr> <tr><td>适用场景</td> <td>微服务间调用</td> <td>API 网关、秒杀活动</td></tr> <tr><td>实现工具</td> <td>Resilience4J、Hystrix</td> <td>Spring Cloud Gateway、Redis</td></tr></tbody></table> <p>什么时候使用熔断？什么时候使用限流？</p> <ul><li>熔断：服务出现错误返回是不被允许的，例如微信支付，如果支付接口故障，启用熔断，显示“支付系统繁忙”，而不能让请求挂着造成未知错误</li> <li>限流：当你的服务流量暴增时，防止服务器资源被耗尽，例如淘宝双十一，高并发限流，防止流量冲垮系统，运行请求在后台“挂着”</li></ul> <p>简单来说：熔断用于<strong>保护服务</strong>，防止雪崩效应；限流用于<strong>平稳流量</strong>，防止高并发拖垮系统</p> <h3 id="事务与隔离组件-seata"><a href="#事务与隔离组件-seata" class="header-anchor">#</a> 事务与隔离组件 Seata</h3> <blockquote><p>Spring Cloud Alibaba 的五大组件之一，阿里开源的分布式事务解决方案</p></blockquote> <p>什么是事务？事务是指一组操作的逻辑单元，这些操作要么全部成功，要么全部失败，事务具有四个基本特性（ACID）</p> <ul><li>原子性：事务中的所有操作要么全部完成，要么全部不做</li> <li>一致性：事务执行前后，数据库必须保持一致性状态</li> <li>隔离性：并发执行的事务之间互不干扰</li> <li>持久性：一旦事务提交，其结果是永久性的，即使系统崩溃也不会丢失</li></ul> <p>在 Spring 中，可用<code>@Transactional</code> 声明事务，直接在 Service 层对应的方法上进行注解，即可完成一次事务的编写</p> <ul><li><code>@Transactional</code> 只能修饰 public 方法</li> <li><code>@Transactional</code> 不能自身调用，比如方法 A 和 B 都在 UserService 类中，如果在 A 中调用 B 方法，即使 B 方法有<code>@Transactional</code> 修饰，这个事务也不会生效，这和 Java 的动态代理机制有关</li></ul> <p>例如网银系统中的一次 SQL 数据库事务写入</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Deprecated</span>
<span class="token annotation punctuation">@Transactional</span>
<span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">doWithdrawal</span><span class="token punctuation">(</span><span class="token class-name">TransactionDTO</span> transactionDTO<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> r <span class="token operator">=</span> accountMapper<span class="token punctuation">.</span><span class="token function">updateBalanceById</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">negate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Transaction</span> transaction <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Transaction</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token number">0L</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;外部账户&quot;</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;用户取款&quot;</span><span class="token punctuation">,</span>
                                              r <span class="token operator">==</span> <span class="token number">1</span> <span class="token operator">?</span> <span class="token number">0</span> <span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> transactionMapper<span class="token punctuation">.</span><span class="token function">insertTransaction</span><span class="token punctuation">(</span>transaction<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>其中</p> <ul><li><code>@Transactional(timeout = 5)</code>：设置超时，单位秒，超过时间未完成则回滚</li> <li><code>@Transactional(readOnly = true)</code>：只读事务中不能执行写操作，否则会抛出异常</li> <li>事务回滚规则：默认情况下，<code>@Transactional</code> 回滚的是 RunTimeException，如果需要特殊要求，需要指定
<ul><li><code>@Transactional(rollbackFor = {IOException.class, SQLException.class})</code>：回滚 I/O 和 SQL 异常</li> <li><code>@Transactional(noRollbackFor = {NullPointerException.class})</code>：不回滚空指针异常</li></ul></li></ul> <p>常见的事务隔离级别，以<code>@Transactional</code>为例，其 <code>isolation</code> 属性用于定义事务的隔离级别</p> <table><thead><tr><th>隔离级别</th> <th>防止脏读</th> <th>防止不可重复读</th> <th>防止幻读</th></tr></thead> <tbody><tr><td>read uncommitted</td> <td>✗</td> <td>✗</td> <td>✗</td></tr> <tr><td>read committed</td> <td>✓</td> <td>✗</td> <td>✗</td></tr> <tr><td>repeatable read (MySQL 默认)</td> <td>✓</td> <td>✓</td> <td>部分 ✓（间隙锁）</td></tr> <tr><td>serializable</td> <td>✓</td> <td>✓</td> <td>✓</td></tr></tbody></table> <p>使用示例</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Transactional</span><span class="token punctuation">(</span>isolation <span class="token operator">=</span> <span class="token class-name">Isolation</span><span class="token punctuation">.</span><span class="token constant">REPEATABLE_READ</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">methodB</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 在可重复读隔离级别下执行</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>脏读：读到了写过程中的临时数据</p> <ul><li>给写加锁，写时不能读</li></ul> <p>不可重复读：例如，在一个事务中，前后重复读同一数据，数据存在改变，说明读的时候有人在写</p> <ul><li>给读加锁，读时不能写</li></ul> <p>幻读：这是针对”数据表“层面的事故，假设我们给数据加了上述的读写锁（读时不写，写时不读），但这里的粒度只针对于这条数据，也就是说，在范围查表的时候，有可能出现同一事务的两次<code>count(*)</code>返回不一样的结果（第一次读之后有人在往表里豪数据）</p> <ul><li>对整个数据表加读写锁，彻底串行执行，效率极低</li></ul> <p>修改丢失：就是 ABA 问题，前后两次写，都根据同一源状态进行变更，后一次写覆盖了前一次写的提交，并且第一次写在 DB 中完全没有记录</p> <ul><li>对同一条数据写互斥</li></ul> <p>一般而言，解决分布式事务会用到以下几种机制</p> <ul><li>2PC：两阶段提交，将事务的提交过程分为资源准备和资源提交两个阶段，并且由事务协调者来协调所有事务参与者，如果准备阶段所有事务参与者都预留资源成功，则进行第二阶段的资源提交，否则事务协调者回滚资源</li> <li>3PC：三阶段提交协议，是二阶段提交协议的改进版本，三阶段提交有两个改动点
<ol><li>在协调者和参与者中都引入超时机制</li> <li>在第一阶段和第二阶段中插入一个准备阶段，保证了在最后提交阶段之前各参与节点的状态是一致的</li></ol></li> <li>TCC：另一种分布式事务处理方法，它的名称来自于其三个阶段<code>Try, Confirm, Cancel</code>，这种方法主要用于处理在分布式系统中，多个服务需要协同完成一项操作时的一致性问题</li></ul> <h3 id="搜索引擎-es"><a href="#搜索引擎-es" class="header-anchor">#</a> 搜索引擎 ES</h3> <blockquote><p>模糊查询、全文搜索、语义搜索及关键词搜索的区别？</p></blockquote> <p>ES 是什么？一个基于 Lucene 的分布式搜索和分析引擎，主要用于全文检索和日志分析，例如百度文库的文档需要支持全文搜索和语义搜索，就是用的 ES 索引，返回文档 id，控制面再从 BOS 里取内容</p> <ul><li>ES 的快速索引核心在于倒排索引（相对于关系型数据库的正向索引而言），在模糊搜索时速度很快，可见 <a href="https://northboat.github.io/pages/7bc025" target="_blank" rel="nofollow noopener noreferrer">加密系统构建<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，这里可搜索加密系统的范围查询就是基于 BM25 算法的倒排索引</li> <li>ES 的数据一致性基于 Raft 算法，这个算法在很多地方看到过，例如 K8s 里 etcd 的选主</li></ul> <p>大体上，ES 的用法就两种</p> <ul><li>一种就是像文库做文档的索引，当一个搜索引擎在用</li> <li>另一种就是做 DB，比如日志系统，直接用 ES 作为日志的落盘点，典型的就是 ELK 栈，包括华子的 SkyWalking 分布式链路追踪系统的存储用的也是 ES</li></ul> <p>ELK（Elastic Stack），是以 ElasticSearch 为核心的技术栈，被广泛应用在日志数据分析、实时监控等领域</p> <ol><li>数据可视化：Kibana</li> <li>数据索引和存储：Elasticsearch</li> <li>数据清晰：Logstash、Beats</li></ol> <p>日志数据流向</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>日志数据 ➡️ FileBeat ➡️ Kafka ➡️ Logstash ➡️ Elasticsearch ➡️ Kibana
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>与 MySQL 的对比：DSL ≈ SQL</p> <table><thead><tr><th><strong>MySQL</strong></th> <th><strong>Elasticsearch</strong></th> <th><strong>说明</strong></th></tr></thead> <tbody><tr><td>Table</td> <td>Index</td> <td>索引（index），就是文档的集合，类似数据库的表(table)</td></tr> <tr><td>Row</td> <td>Document</td> <td>文档（Document），就是一条条的数据，类似数据库中的行（Row），文档都是 JSON 格式</td></tr> <tr><td>Column</td> <td>Field</td> <td>字段（Field），就是 JSON 文档中的字段，类似数据库中的列（Column）</td></tr> <tr><td>Schema</td> <td>Mapping</td> <td>Mapping（映射）是索引中文档的约束，例如字段类型约束。类似数据库的表结构（Schema）</td></tr> <tr><td>SQL</td> <td>DSL</td> <td>DSL 是 elasticsearch 提供的JSON风格的请求语句，用来操作 elasticsearch，实现CRUD</td></tr></tbody></table> <p>ES 的索引库和文档</p> <ul><li>索引库就是数据表定义</li> <li>文档就是数据行</li></ul> <p>例如一个 /hotel 的索引库，以 json 的格式通过 <code>PUT /hotel</code> 命令入库（create table）</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p><a href="https://www.elastic.co/guide/en/elasticsearch/client/index.html" target="_blank" rel="nofollow noopener noreferrer">Elasticsearch Clients | Elastic<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：在 Spring 中引入 ES Client 依赖，通过远程 DSL 操作 ES 数据库</p> <p>初始化 RestHighLevelClient 并注入 Bean</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Bean</span>
<span class="token keyword">public</span> <span class="token class-name">RestHighLevelClient</span> <span class="token function">client</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">RestHighLevelClient</span><span class="token punctuation">(</span><span class="token class-name">RestClient</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span>
        <span class="token class-name">HttpHost</span><span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token string">&quot;http://192.168.150.101:9200&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>具体可查阅文档</p> <h3 id="其他分布式问题"><a href="#其他分布式问题" class="header-anchor">#</a> 其他分布式问题</h3> <h4 id="分布式计算"><a href="#分布式计算" class="header-anchor">#</a> 分布式计算</h4> <p>大数据计算引擎，一般用于数据清洗：Flink 和 Spark</p> <p>在大数据场景中，Flink 经常和 Kafka 搭配，用来清洗 Kafka 的数据流，例如 Flink 接收 Kafka 日志队列统计用户点击量</p> <ol><li>Kafka 生产数据（日志、用户点击、设备数据等）</li> <li>Flink 进行实时处理（聚合、分析、清洗）</li> <li>处理结果存入 Kafka（本地磁盘） / 关系型数据库 / Elasticsearch</li></ol> <p>Flink 专注于流处理，而 Spark 以批处理为主，二者对比</p> <table><thead><tr><th>对比</th> <th>Flink</th> <th>Spark</th></tr></thead> <tbody><tr><td>计算模式</td> <td>主要是流计算，也支持批处理</td> <td>主要是批处理，支持流计算</td></tr> <tr><td>延迟</td> <td>毫秒级</td> <td>秒级</td></tr> <tr><td>吞吐量</td> <td>高吞吐，适用于高并发</td> <td>较高吞吐，但稍逊于 Flink</td></tr> <tr><td>故障恢复</td> <td>Exactly-Once 语义，保证数据一致性</td> <td>At-Least-Once，可能重复计算</td></tr> <tr><td>API 兼容</td> <td>提供 SQL、Java、Python API</td> <td>提供 SQL、Scala、Java API</td></tr></tbody></table> <h4 id="分布式链路追踪"><a href="#分布式链路追踪" class="header-anchor">#</a> 分布式链路追踪</h4> <blockquote><p><a href="https://www.cnblogs.com/caoweixiong/p/14475815.html" target="_blank" rel="nofollow noopener noreferrer">分布式服务调用链路追踪——方案选型 - 曹伟雄 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>分布式链路实际上就是指的微服务系统中请求的调用链</p></blockquote> <p>在分布式系统中，一次调用如果时间过长，由于微服务之间的相互调用，想要找出到底是谁掉了链子是一件很困难的事情，这对故障排查是很大的阻碍，于是就有了分布式链路追踪的需求</p> <p>有这样几个关键点</p> <ul><li>每个链路必须有其独有的 ID 标识，即 traceId</li> <li>每条链路中的每个服务必须独有标识</li> <li>采用类似于心跳检测的策略对链路进行监控（约 1s 一次），但要注意，一但收集到上游的请求，那么必须对整条链路进行收集</li></ul> <p>常见的分布式链路追踪框架</p> <ul><li>Zipkin：Twitter 开源，现由 OpenZipkin 社区维护，支持内存、MySQL、Elasticsearch、Cassandra 等多种存储</li> <li>SkyWalking：华子开源的分布式链路追踪框架，其基本思路就是利用 Java Agent 对现成的项目进行插桩，通过外置的 Collector 收集者对项目的链路进行监控并进行持久化存储以及可视化控制</li></ul> <h4 id="分布式-uuid"><a href="#分布式-uuid" class="header-anchor">#</a> 分布式 UUID</h4> <p>雪花算法，一共 64 位，首位是固定值，中间 41 位是时间戳，10 位机器码，12 位 ID 分配</p> <ul><li><a href="https://cloud.tencent.com/developer/article/2364487" target="_blank" rel="nofollow noopener noreferrer">一文读懂“Snowflake（雪花）”算法-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>也就是说，在一个毫秒时间戳，可以分配 12 位的 ID 数量（当分配满了，就得等一个毫秒再分配），这样有如下好处</p> <ul><li>ID 按时间戳呈递增分布，B+ 树好建索引</li> <li>唯一性取决于时间戳，这和服务器时钟有关</li> <li>可以通过配 10 位的机器码，区分不同集群不同机器</li></ul> <p>雪花依赖于时间的一致性，如果发生时间回拨，可能会导致一致性问题，但其实概率很低，如果非要避免这种情况，百度有现成的增强型雪花算法：<a href="https://github.com/baidu/uid-generator" target="_blank" rel="nofollow noopener noreferrer">baidu/uid-generator: UniqueID generator<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>分布式的 UUID 要保证唯一性有两层含义</p> <ul><li>单点的 DB 主键一定要保证唯一且有序（方便建索引）</li> <li>多点的 DB，每个 DB 的主键在全局中要保证唯一。在分布式系统中，由于存在地域之间的 DTS（Data Transport Service），数据会在多个地域之间进行相互同步，若不同地域的数据库表的主键不是全局唯一的，DTS 合并会报错</li></ul> <p>在分布式系统中，要保证 ID 的全局唯一性，两种比较成熟的方案</p> <ol><li>Redis 自增 ID：多机设置不同初始 ID 和不同步长，有一定的运维成本</li> <li>雪花算法：生成 64 位的 ID，包含时间戳、机器 ID 和序列号；高性能、有序，依赖时钟同步</li></ol> <p>真实的工程化实践是：用 <code>varchar(45)</code> 存放主键 id，主键 id 由两部分组成</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="39.002ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 17238.7 910" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.464ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1055.8,0)"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 317 385H210L174 240Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z" style="stroke-width:3;"></path></g><g data-mml-node T49 278T41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(15662.9,0)"><path data-c="1D451" d="M366 683Q367 683 438 688T511 694Q523 694 523 686Q523 679 450 384T375 83T374 68Q374 26 402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487H491Q506 153 506 145Q506 140 503 129Q490 79 473 48T445 8T417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157Q33 205 53 255T101 341Q148 398 195 420T280 442Q336 442 364 400Q369 394 369 396Q370 400 396 505T424 616Q424 629 417 632T378 637H357Q351 643 351 645T353 664Q358 683 366 683ZM352 326Q329 405 277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q233 26 290 98L298 109L352 326Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(16460.7,0)"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mo>&lt;</mo><mi>t</mi><mi>a</mi><mi>b</mi><mi>l</mi><mi>e</mi><mi>N</mi><mi>a</mi><mi>m</mi><mi>e</mi><mo>&gt;</mo><mo>−</mo><mo>&lt;</mo><mi>s</mi><mi>n</mi><mi>o</mi><mi>w</mi><mi>f</mi><mi>l</mi><mi>a</mi><mi>k</mi><mi>e</mi><mi>U</mi><mi>u</mi><mi>i</mi><mi>d</mi><mo>&gt;</mo></math></mjx-assistive-mml></mjx-container><p>这里雪花 id 应该是做了某种截断或者优化，只取了一部分</p> <h2 id="微服务开发实践"><a href="#微服务开发实践" class="header-anchor">#</a> 微服务开发实践</h2> <h3 id="微服务中间件"><a href="#微服务中间件" class="header-anchor">#</a> 微服务中间件</h3> <p>度子的微服务组件（因为很多时候会对文档进行索引，所以会用到 ES）</p> <ul><li>GDP 微服务框架：包含 RPC 调用和 Streaming 流式调用，后者被用作 AI 流式对话（包括 Planner 框架和 MCP 的流式返回）</li> <li>Sula 配置中心：等同于 Nacos</li> <li>DB：MySQL 持久化和 Redis 缓存</li> <li>ES 索引和 BOS 对象存储</li> <li>NMQ 消息队列</li></ul> <p>腾子的微服务组件，其实都大差不差，有需求才会驱动轮子制造</p> <ol><li>TRPC：远程调用框架</li> <li>Taihu 太湖：网关</li> <li>Rainbow 七彩：配置的统一管理与灰度</li> <li>PolarisMesh 北极星：服务治理中心，类 Nacos</li> <li>DB：MySQL（GORM）和 Redis</li> <li>UDNS 域名分配</li> <li>TAT 命令下发</li> <li>TDMQ 分布式消息队列</li></ol> <h3 id="微服务注册流程"><a href="#微服务注册流程" class="header-anchor">#</a> 微服务注册流程</h3> <blockquote><p>一个微服务接口的实现、注册和调用流程，从前端到 admin 接口到下游的 web-server 服务</p></blockquote> <p>proto 层：admin_server.proto：新增 admin 接口</p> <p>web-server 后端</p> <ul><li>services/devops.go 新增 DevopsService.DevopsEnvStop</li> <li>business/devops.go 新增 DevopsController.StopEnv</li></ul> <p>admin 后端</p> <ul><li>services/env_devops_service.go 新增 AdminDevopsService.StopEnv</li> <li>business/devops.go 新增 DevopsController.StopEnv</li></ul> <p>admin-app 前端</p> <ul><li>codev-service/src/adminApi/api.ts 新增 stopEnv 后端 url，以及接口 batchStopEnv 定义并导出</li> <li>修改 codev-admin-app/src/views/devops/nodeManager.vue 前端样式，新增批量休眠按钮以及每个数据行后新增休眠环境按钮，二者均调用 batchStopEnv 接口</li></ul> <h3 id="protobuf-基础"><a href="#protobuf-基础" class="header-anchor">#</a> Protobuf 基础</h3> <blockquote><p>Protobuf（Protocol Buffers）是 Google 开发的一种语言中立、平台无关、可扩展的结构化数据序列化格式，常用于取代 JSON/XML</p> <ul><li>Protobuf 体积比 JSON 小约 60-70%，解析速度快 2-5 倍，非常适合高吞吐量、低延迟的微服务通信，如 tRPC</li></ul> <p>Protobuf 通过规范化的序列化和反序列化，可以轻易生成各种编程的语言的数据结构，是批量生成 pojo 和 interface 数据结构定义的首选</p></blockquote> <p>通过 proto 定义 po 数据结构和接口，并通过 protobuf 命令一键生成 pb.go 文件，例如</p> <ol><li><strong>admin-server.proto</strong>：新增批量休眠接口，复用了批量操作的入参 BatchEnvIdsReq 和规范出参 AdminEmptyRsp</li></ol> <div class="language-protobuf line-numbers-mode"><pre class="language-protobuf"><code><span class="token comment">// @alias=/admin/devops/env/stopEnv 批量关闭环境</span>
<span class="token keyword">rpc</span> <span class="token function">StopEnv</span><span class="token punctuation">(</span><span class="token class-name">BatchEnvIdsReq</span><span class="token punctuation">)</span> <span class="token keyword">returns</span><span class="token punctuation">(</span><span class="token class-name">AdminEmptyRsp</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ol start="2"><li><strong>web-server.proto</strong>：新增接口和入参出参</li></ol> <div class="language-protobuf line-numbers-mode"><pre class="language-protobuf"><code><span class="token comment">// @alias=/devops/env/stop 运维操作休眠环境</span>
<span class="token keyword">rpc</span> <span class="token function">DevopsEnvStop</span><span class="token punctuation">(</span><span class="token class-name">DevopsEnvStopReq</span><span class="token punctuation">)</span> <span class="token keyword">returns</span> <span class="token punctuation">(</span><span class="token class-name">DevopsEnvStopRsp</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>

<span class="token keyword">message</span> <span class="token class-name">DevopsEnvStopReq</span> <span class="token punctuation">{</span>
    <span class="token keyword">repeated</span> <span class="token builtin">string</span> envIds <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token keyword">message</span> <span class="token class-name">DevopsEnvStopRsp</span> <span class="token punctuation">{</span>
    <span class="token builtin">int32</span> code <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
    <span class="token builtin">string</span> message <span class="token operator">=</span> <span class="token number">2</span><span class="token punctuation">;</span>
    <span class="token positional-class-name class-name">Data</span> data <span class="token operator">=</span> <span class="token number">3</span><span class="token punctuation">;</span>
    <span class="token keyword">message</span> <span class="token class-name">Data</span> <span class="token punctuation">{</span>
        <span class="token keyword">repeated</span> <span class="token builtin">string</span> errorEnvIds <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>通过 trpc 命令指定 proto 文件构建成套的 pb 文件，包括</p> <ul><li><code>*.proto</code></li> <li><code>*.pb.go</code></li> <li><code>*.trpc.go</code></li> <li><code>*.pb.validate.go</code></li> <li><code>*_mock.go</code></li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/19, 02:10:09</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/2bb10d/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">高并发与高可用</div></a> <a href="/pages/46b8df/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">领域驱动设计</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
