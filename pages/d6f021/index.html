ckquote> <h3 id="soa-与分布式系统"><a href="#soa-与分布式系统" class="header-anchor">#</a> SOA 与分布式系统</h3> <p>SOA（Service Oriented Architecture），面向服务架构，是一种通过服务接口将应用程序功能模块化的架构风格，相比于微服务，他的设计粒度更大，服务之间的交互更复杂，通常是大系统之间的耦合</p> <p>分布式系统的定义：多个计算机通过网络协同工作而<strong>对外表现为一个整体</strong></p> <p>分布式系统的核心特点</p> <ol><li>多机协作：任务由多个计算机协作完成，而非单机处理</li> <li>数据共享：不同节点之间共享数据，可能涉及数据一致性问题</li> <li>去中心化：避免单点故障，提高系统可用性</li> <li>并发性：多个节点可以并行处理任务，提高吞吐量</li> <li>容错能力：某些节点宕机时，系统仍能继续运行</li></ol> <p>说白了，就是扩展性好、稳定性高、容错强，“狡兔三窟”</p> <h3 id="微服务与云原生概念"><a href="#微服务与云原生概念" class="header-anchor">#</a> 微服务与云原生概念</h3> <p>微服务本质上是通过 HTTP 或其他网络协议进行通讯来实现，更多的是一种细腻的模块化思想，其核心在于</p> <ul><li>服务拆分</li> <li>服务之间调用</li> <li>服务管理</li></ul> <p>微服务和单体项目，分布式部署和单机部署，这是两套不同的概念，不能混为一谈，一个是项目设计的事，一个是项目部署的事，但二者存在关联，例如绝大部分微服务都会选择分布式部署，单机部署不完</p> <p>常见的微服务实现技术</p> <ul><li>Spring Cloud</li> <li>Spring Cloud Alibaba</li> <li>Dubbo</li> <li>RPC（GRPC、TRPC）</li></ul> <p>在现有的成熟框架中，如 Spring Cloud Alibaba，其每一项组件都是在解决一项具体的分布式问题，从而能够快速开发一个成熟的微服务系统</p> <p>云计算背景下，软件、平台和基础设施都被视作服务 Service</p> <ul><li>SaaS：Software as a Service 软件即服务</li> <li>Paas：Platform as a Service 平台即服务</li> <li>IaaS：Infrastructure as a Service 基础设施即服务</li></ul> <p>云原生是一种概念，各个地方的定义不尽相同，但总是包含以下关键词</p> <ol><li>微服务</li> <li>容器化</li> <li>DevOps</li> <li>持续交付</li></ol> <p>云原生用持续交付代替瀑布开发，采用“小步快跑”的方式进行开发，并且由于模块化程度极高，提供极高的服务弹性</p> <ul><li>与传统单体服务相比，例如一个企业化的 Java 系统，存在思想上根本的差异</li></ul> <p>其目的和软件设计的目标一致：高内聚低耦合（这同样是 DDD 领域驱动设计的目标）</p> <h3 id="单体项目改造微服务"><a href="#单体项目改造微服务" class="header-anchor">#</a> 单体项目改造微服务</h3> <p>原有架构：系统分为负责核心业务的后端模块、负责校验结果的判题模块和负责编译执行代码的可复用代码沙箱，各模块相互独立，通过 API 接口和分包的方式实现协作</p> <p>微服务重构：基于 Spring Cloud Alibaba + Nacos + Dubbo + Higress 对单体项目进行重构，使用 Redis 分布式 Session 存储登录用户信息，并将项目划分为用户服务、题目服务、判题服务和公共模块</p> <p>我们将用 Spring Cloud Alibaba 改造这个单体 OJ 项目</p> <img src="/assets/img/spring-cloud-alibaba-img.3f7ac48d.png"> <p>Spring Cloud Alibaba 的五大组件</p> <ol><li>Nacos 注册中心</li> <li>Dubbo 通信框架</li> <li>Sentinel 熔断降级</li> <li>Seata 分布式事务</li> <li>RocketMQ 消息队列</li></ol> <p>对于原有的单体项目，包含后端、沙箱和判题模块，将被改造为一下四个服务</p> <ol><li>用户服务</li> <li>题目服务</li> <li>判题服务</li> <li>公共服务</li></ol> <h2 id="nacos-注册中心"><a href="#nacos-注册中心" class="header-anchor">#</a> Nacos 注册中心</h2> <blockquote><p>注册中心是微服务通信的资源核心，不管是 gRPC、Feign 还是 Dubbo，他们的服务端和客户端均要在注册中心进行动态管理</p></blockquote> <p>Nacos 是 Spring Cloud Alibaba 的组件，而 Spring Cloud Alibaba 遵循 Spring Cloud 中定义的服务注册、服务发现规范，因此使用 Nacos 和使用 Eureka 对于微服务接口而言，并没有太大区别</p> <p>差异无非</p> <ul><li>依赖不同</li> <li>服务地址不同</li></ul> <p>具体而言，每个微服务通过这样的方式集中管理</p> <p>1️⃣ 首先引入 Nacos 客户端依赖并进行配置</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>com.alibaba.cloud<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-cloud-starter-alibaba-nacos-discovery<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2022.0.0.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span> <span class="token comment">&lt;!-- 根据 Spring Cloud 版本选择 --&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">8081</span>

<span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">application</span><span class="token punctuation">:</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> user<span class="token punctuation">-</span>service
  <span class="token key atrule">cloud</span><span class="token punctuation">:</span>
    <span class="token key atrule">nacos</span><span class="token punctuation">:</span>
      <span class="token key atrule">discovery</span><span class="token punctuation">:</span>
        <span class="token key atrule">server-addr</span><span class="token punctuation">:</span> localhost<span class="token punctuation">:</span><span class="token number">8848</span>  <span class="token comment"># Nacos 服务器地址</span>
        <span class="token key atrule">namespace</span><span class="token punctuation">:</span> public           <span class="token comment"># 命名空间（默认 public）</span>
        <span class="token key atrule">group</span><span class="token punctuation">:</span> DEFAULT_GROUP        <span class="token comment"># 分组（默认 DEFAULT_GROUP）</span>
</code></pre></div><p>2️⃣ 在主类中启动 Nacos 注册服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">package</span> <span class="token namespace">com<span class="token punctuation">.</span>example<span class="token punctuation">.</span>userservice</span><span class="token punctuation">;</span>

<span class="token keyword">import</span> <span class="token import"><span class="token namespace">org<span class="token punctuation">.</span>springframework<span class="token punctuation">.</span>boot<span class="token punctuation">.</span></span><span class="token class-name">SpringApplication</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">org<span class="token punctuation">.</span>springframework<span class="token punctuation">.</span>boot<span class="token punctuation">.</span>autoconfigure<span class="token punctuation">.</span></span><span class="token class-name">SpringBootApplication</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">org<span class="token punctuation">.</span>springframework<span class="token punctuation">.</span>cloud<span class="token punctuation">.</span>client<span class="token punctuation">.</span>discovery<span class="token punctuation">.</span></span><span class="token class-name">EnableDiscoveryClient</span></span><span class="token punctuation">;</span>

<span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token annotation punctuation">@EnableDiscoveryClient</span> <span class="token comment">// 启用服务注册与发现（兼容 Nacos）</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserServiceApplication</span> <span class="token punctuation">{</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">UserServiceApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>3️⃣ 正常编写<code>Controller</code>层代码，如</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/users&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">class</span> <span class="token class-name">UserController</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Long</span><span class="token punctuation">,</span> <span class="token class-name">User</span><span class="token punctuation">&gt;</span></span> userMap <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 创建用户</span>
    <span class="token annotation punctuation">@PostMapping</span>
    <span class="token keyword">public</span> <span class="token class-name">User</span> <span class="token function">createUser</span><span class="token punctuation">(</span><span class="token annotation punctuation">@RequestBody</span> <span class="token class-name">User</span> user<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        userMap<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> user<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 查询用户</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">User</span> <span class="token function">getUser</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> userMap<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>最后注册服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@FeignClient</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;user-service&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 服务名需与目标服务在 Nacos 中的名称一致</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">UserServiceClient</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">User</span> <span class="token function">getUserById</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> userId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>当前项目<code>user-service</code>的接口就被注册在地址为<code>localhost:8848</code>的 Nacos 中，其他模块可以通过 Feign 客户端对该接口进行调用</p> <h2 id="dubbo-通信"><a href="#dubbo-通信" class="header-anchor">#</a> Dubbo 通信</h2> <blockquote><p>在 SpringBoot 4 中，引入 HTTP Service Clients，使微服务间的调用更简便优雅</p></blockquote> <p>OpenFeign，本质上是 RestTemplate 的上位替代，封装了 HTTP 请求在各微服务接口之间进行调用，属同步调用，不属于 RPC（远程过程调用）</p> <h3 id="openfeign-nacos-调用"><a href="#openfeign-nacos-调用" class="header-anchor">#</a> OpenFeign + Nacos 调用</h3> <p>创建一个 order-service 模块运行在 8082 端口，并提供一个订单查询接口注册到 Nacos</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">8082</span>

<span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">application</span><span class="token punctuation">:</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> order<span class="token punctuation">-</span>service
  <span class="token key atrule">cloud</span><span class="token punctuation">:</span>
    <span class="token key atrule">nacos</span><span class="token punctuation">:</span>
      <span class="token key atrule">discovery</span><span class="token punctuation">:</span>
        <span class="token key atrule">server-addr</span><span class="token punctuation">:</span> localhost<span class="token punctuation">:</span><span class="token number">8848</span>  <span class="token comment"># Nacos 服务器地址</span>
        <span class="token key atrule">namespace</span><span class="token punctuation">:</span> public           <span class="token comment"># 命名空间（默认 public）</span>
        <span class="token key atrule">group</span><span class="token punctuation">:</span> DEFAULT_GROUP        <span class="token comment"># 分组（默认 DEFAULT_GROUP）</span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/orders&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">class</span> <span class="token class-name">OrderController</span> <span class="token punctuation">{</span>
    <span class="token comment">// 查询用户账单</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{userId}&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Order</span><span class="token punctuation">&gt;</span></span> <span class="token function">getOrders</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token class-name">OrderService</span><span class="token punctuation">.</span><span class="token function">getOrdersByUserId</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>以下展示如何在 user-service 模块中调用上面注册到 Nacos 的 order-service 服务</p> <p>引入 OpenFeign 依赖并在主类中启用（在 UserService 模块中）</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.cloud<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-cloud-starter-openfeign<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token annotation punctuation">@EnableDiscoveryClient</span>
<span class="token annotation punctuation">@EnableFeignClients</span> <span class="token comment">// 启用 Feign 客户端</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserServiceApplication</span> <span class="token punctuation">{</span>
    <span class="token comment">// ...</span>
<span class="token punctuation">}</span>
</code></pre></div><p>编写 Feign 客户端调用上面 order-service 的服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@FeignClient</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;order-service&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 服务名需与目标服务在 Nacos 中的名称一致</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">OrderServiceClient</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/orders/{userId}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Order</span><span class="token punctuation">&gt;</span></span> <span class="token function">getOrdersByUserId</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> userId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在 Controller 层调用 Feign 客户端</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/users&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">class</span> <span class="token class-name">UserController</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">OrderServiceClient</span> orderServiceClient<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}/orders&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Order</span><span class="token punctuation">&gt;</span></span> <span class="token function">getUserOrders</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> orderServiceClient<span class="token punctuation">.</span><span class="token function">getOrdersByUserId</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>如此便实现了微服务之间的一次简单的调用，对于用户而言，他请求的实际上是<code>/users/{id}/orders</code>接口，在微服务内部，这个请求被转发到<code>/orders/{id}</code>接口，并最终将结果通过<code>/users/{id}/orders</code>返回</p> <h3 id="http-service-clients"><a href="#http-service-clients" class="header-anchor">#</a> HTTP Service Clients</h3> <p>Spring Boot 4 新引入的通信框架</p> <h2 id="higress-网关"><a href="#higress-网关" class="header-anchor">#</a> Higress 网关</h2> <p>Gateway 网关负责</p> <ul><li><strong>权限控制</strong>：网关作为微服务入口，需要校验用户是是否有请求资格，如果没有则进行拦截</li> <li><strong>路由和负载均衡</strong>：一切请求都必须先经过gateway，但网关不处理业务，而是根据某种规则，把请求转发到某个微服务，这个过程叫做路由。当然路由的目标服务有多个时，还需要做负载均衡</li> <li><strong>限流</strong>：当请求流量过高时，在网关中按照下流的微服务能够接受的速度来放行请求，避免服务压力过大</li></ul> <p>基本架构</p> <img src="/assets/img/2729274-20230205163347683-397320818.b336006b.png"> <p><strong>实际业务中，请求先走负载均衡，再打网关，最后打到微服务</strong></p> <p>有一个问题：Gateway 的权限拦截和 SpringSecurity 有什么区别，能否相互替代？</p> <h2 id="sentinel-限流"><a href="#sentinel-限流" class="header-anchor">#</a> Sentinel 限流</h2> <p>限流、熔断和服务降级是三种常用的系统稳定性策略，通常我们说为了保证系统的可用性，限流、降级、熔断一把梭</p> <ul><li>降级：服务端出现问题，客户端降级使用 FallbackMethod 方法，返回一个友好的提示，而不至于忙等</li> <li>熔断：达到一定条件后（比如请求故障率达到 60%），一直降级，缓慢恢复</li> <li>限流：比如点对点消息队列缓慢消费请求，大家排队，一秒钟 N 个，有序进行，秒杀高并发等操作，严禁一窝蜂的过来拥挤</li></ul> <h3 id="熔断和限流"><a href="#熔断和限流" class="header-anchor">#</a> 熔断和限流</h3> <p>熔断（Circuit Breaker）类似于家里的电路保险丝，当电流过大时，保险丝会断开电路，以防电器损坏。在<strong>分布式系统</strong>中，熔断机制用于<strong>检测服务是否故障，并在故障严重时自动阻止请求，以防止系统崩溃</strong></p> <p>熔断器通常有以下三种状态</p> <ol><li>关闭（Closed）：服务正常运行，请求可以自由通过</li> <li>打开（Open）：当错误率达到阈值，熔断器打开，所有请求都会被拒绝，防止系统继续崩溃</li> <li>半开（Half-Open）：经过一段时间后，系统尝试放行部分请求进行测试，如果恢复正常，熔断器关闭，否则保持打开状态</li></ol> <p>一个简单示例</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@CircuitBreaker</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;paymentService&quot;</span><span class="token punctuation">,</span> fallbackMethod <span class="token operator">=</span> <span class="token string">&quot;fallbackPayment&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">callPaymentService</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 调用远程支付服务</span>
    <span class="token keyword">return</span> restTemplate<span class="token punctuation">.</span><span class="token function">getForObject</span><span class="token punctuation">(</span><span class="token string">&quot;http://payment-service/pay&quot;</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 熔断后的降级方法</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">fallbackPayment</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;支付服务不可用，请稍后重试&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">resilience4j.circuitbreaker</span><span class="token punctuation">:</span>
  <span class="token key atrule">instances</span><span class="token punctuation">:</span>
    <span class="token key atrule">paymentService</span><span class="token punctuation">:</span>
      <span class="token key atrule">failureRateThreshold</span><span class="token punctuation">:</span> <span class="token number">50</span>  <span class="token comment"># 失败率达到 50% 时触发熔断</span>
      <span class="token key atrule">waitDurationInOpenState</span><span class="token punctuation">:</span> 5000ms  <span class="token comment"># 熔断后 5 秒再尝试恢复</span>
      <span class="token key atrule">permittedNumberOfCallsInHalfOpenState</span><span class="token punctuation">:</span> <span class="token number">3</span>  <span class="token comment"># 半开状态时允许 3 个请求进行尝试</span>
</code></pre></div><p>而限流（Rate Limiting）是一种限制请求速率的技术，防止单个服务被过量请求拖垮，确保系统能够平稳运行</p> <p>为什么需要限流</p> <ul><li>防止流量暴增导致系统崩溃（如双十一购物、秒杀活动）</li> <li>防止恶意攻击（如爬虫、DDoS 攻击）</li> <li>合理分配系统资源，保障 VIP 用户的优先级</li></ul> <p>Spring Cloud Gateway 内置了基于 Redis 令牌桶算法的限流功能，需要同时引入 Redis 和 Gateway 依赖并进行限流规则配置</p> <table><thead><tr><th>特性</th> <th>熔断（Circuit Breaker）</th> <th>限流（Rate Limiting）</th></tr></thead> <tbody><tr><td>目的</td> <td>保护服务，防止雪崩</td> <td>保护系统，防止过载</td></tr> <tr><td>触发条件</td> <td>远程服务故障率高</td> <td>访问量超出限制</td></tr> <tr><td>作用</td> <td>暂停访问故障服务</td> <td>限制请求速率</td></tr> <tr><td>适用场景</td> <td>微服务间调用</td> <td>API 网关、秒杀活动</td></tr> <tr><td>实现工具</td> <td>Resilience4J、Hystrix</td> <td>Spring Cloud Gateway、Redis</td></tr></tbody></table> <p>什么时候使用熔断？什么时候使用限流？</p> <ul><li>熔断：服务出现错误返回是不被允许的，例如微信支付，如果支付接口故障，启用熔断，显示“支付系统繁忙”，而不能让请求挂着造成未知错误</li> <li>限流：当你的服务流量暴增时，防止服务器资源被耗尽，例如淘宝双十一，高并发限流，防止流量冲垮系统，运行请求在后台“挂着”</li></ul> <p>简单来说：熔断用于<strong>保护服务</strong>，防止雪崩效应；限流用于<strong>平稳流量</strong>，防止高并发拖垮系统</p> <h3 id="sentinel-熔断降级"><a href="#sentinel-熔断降级" class="header-anchor">#</a> Sentinel 熔断降级</h3> <p>阿里开源的熔断降级解决方案，Spring Cloud Alibaba 的五大组件之一</p> <h2 id="seata-事务"><a href="#seata-事务" class="header-anchor">#</a> Seata 事务</h2> <blockquote><p>Spring Cloud Alibaba 的五大组件之间，用于解决分布式事务</p></blockquote> <h3 id="事务概述"><a href="#事务概述" class="header-anchor">#</a> 事务概述</h3> <p>什么是事务？</p> <p>事务是指一组操作的逻辑单元，这些操作要么全部成功，要么全部失败。事务具有四个基本特性（ACID）</p> <ul><li>原子性：事务中的所有操作要么全部完成，要么全部不做</li> <li>一致性：事务执行前后，数据库必须保持一致性状态</li> <li>隔离性：并发执行的事务之间互不干扰</li> <li>持久性：一旦事务提交，其结果是永久性的，即使系统崩溃也不会丢失</li></ul> <p>在 Spring 中，可用<code>@Transactional</code> 声明事务，它极大地简化了事务管理，直接在 Service 层对应的方法上进行注解，即可完成一次事务的编写</p> <ul><li><code>@Transactional</code> 只能修饰 public 方法</li> <li><code>@Transactional</code> 不能自身调用，比如方法 A 和 B 都在 UserService 类中，如果在 A 中调用 B 方法，即使 B 方法有<code>@Transactional</code> 修饰，这个事务也不会生效，这和 Java 的动态代理机制有关</li></ul> <p>例如网银系统 Demo 中的一次 SQL 数据库事务写入</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Deprecated</span>
<span class="token annotation punctuation">@Transactional</span>
<span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">doWithdrawal</span><span class="token punctuation">(</span><span class="token class-name">TransactionDTO</span> transactionDTO<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> r <span class="token operator">=</span> accountMapper<span class="token punctuation">.</span><span class="token function">updateBalanceById</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">negate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Transaction</span> transaction <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Transaction</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token number">0L</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;外部账户&quot;</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;用户取款&quot;</span><span class="token punctuation">,</span>
                                              r <span class="token operator">==</span> <span class="token number">1</span> <span class="token operator">?</span> <span class="token number">0</span> <span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> transactionMapper<span class="token punctuation">.</span><span class="token function">insertTransaction</span><span class="token punctuation">(</span>transaction<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一些设置</p> <ul><li><code>@Transactional(timeout = 5)</code>：设置超时，单位秒，超过时间未完成则回滚</li> <li><code>@Transactional(readOnly = true)</code>：只读事务中不能执行写操作，否则会抛出异常</li> <li>事务回滚规则：默认情况下，<code>@Transactional</code> 回滚的是 RunTimeException，如果需要特殊要求，需要指定
<ul><li><code>@Transactional(rollbackFor = {IOException.class, SQLException.class})</code>：回滚 I/O 和 SQL 异常</li> <li><code>@Transactional(noRollbackFor = {NullPointerException.class})</code>：不回滚空指针异常</li></ul></li></ul> <h3 id="常见的事务隔离事故"><a href="#常见的事务隔离事故" class="header-anchor">#</a> 常见的事务隔离事故</h3> <p><code>@Transactional</code> 的 <code>isolation</code> 属性用于定义事务的隔离级别，常见的隔离级别如下</p> <table><thead><tr><th>隔离级别</th> <th>防止脏读</th> <th>防止不可重复读</th> <th>防止幻读</th></tr></thead> <tbody><tr><td>read uncommitted</td> <td>✗</td> <td>✗</td> <td>✗</td></tr> <tr><td>read committed</td> <td>✓</td> <td>✗</td> <td>✗</td></tr> <tr><td>repeatable read (MySQL 默认)</td> <td>✓</td> <td>✓</td> <td>部分 ✓（间隙锁）</td></tr> <tr><td>serializable</td> <td>✓</td> <td>✓</td> <td>✓</td></tr></tbody></table> <p>例如</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Transactional</span><span class="token punctuation">(</span>isolation <span class="token operator">=</span> <span class="token class-name">Isolation</span><span class="token punctuation">.</span><span class="token constant">REPEATABLE_READ</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">methodB</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 在可重复读隔离级别下执行</span>
<span class="token punctuation">}</span>
</code></pre></div><p>什么是脏读、不可重复读和幻读？</p> <p>1️⃣ 脏读</p> <ul><li>读到了写过程中的临时数据</li> <li>解决办法：给写加锁，写时不能读</li></ul> <p>2️⃣ 不可重复读</p> <ul><li>就是说，在一个事务中，前后重复读同一数据，数据存在改变</li> <li>原因：读时可写 → 解决办法：给读加锁</li></ul> <p>3️⃣ 幻读</p> <ul><li>针对表而言，之前给行加了读/写锁，即单个数据项有读/写锁从而防止脏读和不可重复读，但对于数据表而言，比如<code>count(*)</code>操作，即使数据项 a 在被写，数据项 b 在被读，但不影响数据 c 插入数据表，那么同一事务的前后两次<code>count(*)</code>就有可能返回不一样的结果，这就叫幻读</li> <li>解决方法：对整个数据表加读写锁，彻底串行执行，效率极低</li></ul> <p>4️⃣ 修改丢失</p> <ul><li>写写没加锁，后一次写覆盖了前一次写的提交，很有可能会破坏数据一致性</li> <li>例如：存款原本有 1000，A 事务存 50，B 事务取 100，二者进行修改时，都会先读取余额，假设他们现在同时读，都读到 1000，那么 A 会将 1050 写回（操作 ①），B 会将 900 写回（操作 ②），操作 ① ② 先后执行，那么最终存款将会变成 900</li> <li>这一过程覆盖了 A 事务存款 50 的 commit，并且破坏了数据的一致性</li></ul> <h3 id="分布式事务处理原理"><a href="#分布式事务处理原理" class="header-anchor">#</a> 分布式事务处理原理</h3> <p>一般而言，解决分布式事务，有以下几种方法</p> <p>2PC：两阶段提交，将事务的提交过程分为资源准备和资源提交两个阶段，并且由事务协调者来协调所有事务参与者，如果准备阶段所有事务参与者都预留资源成功，则进行第二阶段的资源提交，否则事务协调者回滚资源</p> <p>3PC：三阶段提交协议，是二阶段提交协议的改进版本，三阶段提交有两个改动点</p> <ol><li>在协调者和参与者中都引入超时机制</li> <li>在第一阶段和第二阶段中插入一个准备阶段，保证了在最后提交阶段之前各参与节点的状态是一致的</li></ol> <p>TCC：一种分布式事务处理方法，它的名称来自于其三个阶段<code>Try, Confirm, Cancel</code>，这种方法主要用于处理在分布式系统中，多个服务需要协同完成一项操作时的一致性问题</p> <h3 id="redis-事务"><a href="#redis-事务" class="header-anchor">#</a> Redis 事务</h3> <p>Redis + Lua 脚本是实现 Redis 事务的常见搭配</p> <h3 id="seata-事务处理"><a href="#seata-事务处理" class="header-anchor">#</a> Seata 事务处理</h3> <blockquote><p>阿里开源的分布式事务解决方案</p></blockquote> <h2 id="其他分布式问题"><a href="#其他分布式问题" class="header-anchor">#</a> 其他分布式问题</h2> <h3 id="大数据计算"><a href="#大数据计算" class="header-anchor">#</a> 大数据计算</h3> <p>大数据 / 分布式计算引擎</p> <ul><li>Flink</li> <li>Spark</li></ul> <p>在大数据场景中，Flink 经常和 Kafka 搭配，用来<strong>清洗</strong> Kafka 的数据流</p> <ol><li>Kafka 生产数据（日志、用户点击、设备数据等）</li> <li>Flink 进行实时处理（聚合、分析、清洗）</li> <li>处理结果存入 Kafka（本地磁盘） / 关系型数据库 / Elasticsearch</li></ol> <p>示例场景：Flink 读取 Kafka 并统计用户点击量</p> <p>Flink 专注于流处理，而 Spark 以批处理为主，二者对比</p> <table><thead><tr><th>对比</th> <th>Flink</th> <th>Spark</th></tr></thead> <tbody><tr><td>计算模式</td> <td>主要是流计算，也支持批处理</td> <td>主要是批处理，支持流计算</td></tr> <tr><td>延迟</td> <td>毫秒级</td> <td>秒级</td></tr> <tr><td>吞吐量</td> <td>高吞吐，适用于高并发</td> <td>较高吞吐，但稍逊于 Flink</td></tr> <tr><td>故障恢复</td> <td>Exactly-Once 语义，保证数据一致性</td> <td>At-Least-Once，可能重复计算</td></tr> <tr><td>API 兼容</td> <td>提供 SQL、Java、Python API</td> <td>提供 SQL、Scala、Java API</td></tr></tbody></table> <h3 id="es-全局搜索"><a href="#es-全局搜索" class="header-anchor">#</a> ES 全局搜索</h3> <blockquote><p><a href="https://www.cnblogs.com/buchizicai/p/17093719.html" target="_blank" rel="nofollow noopener noreferrer">ElasticSearch (ES从入门到精通一篇就够了) - 不吃紫菜 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>ELK，Elastic Stack，是以 ElasticSearch 为核心的技术栈，包括 Beats、<strong>Logstash</strong>、Kibana、<strong>ElasticSerach</strong>，被广泛应用在日志数据分析、实时监控等领域</p> <p>ES 所存放的数据（索引库）都是 JSON 格式的数据</p> <img src="/assets/img/2729274-20230205171722024-1222796164.ed917391.png"> <p>ES 的核心在于倒排索引（相对于关系型数据库的正向索引而言），在模糊搜索时速度很快（依仗于 BM25 算法），一开始是 TF-IDF 算法，在 5.1 版本后改为 BM25</p> <img src="/assets/img/2729274-20230205173438720-1124832591.60253107.png"> <p>与 MySQL 的对比</p> <table><thead><tr><th><strong>MySQL</strong></th> <th><strong>Elasticsearch</strong></th> <th><strong>说明</strong></th></tr></thead> <tbody><tr><td>Table</td> <td>Index</td> <td>索引（index），就是文档的集合，类似数据库的表(table)</td></tr> <tr><td>Row</td> <td>Document</td> <td>文档（Document），就是一条条的数据，类似数据库中的行（Row），文档都是 JSON 格式</td></tr> <tr><td>Column</td> <td>Field</td> <td>字段（Field），就是 JSON 文档中的字段，类似数据库中的列（Column）</td></tr> <tr><td>Schema</td> <td>Mapping</td> <td>Mapping（映射）是索引中文档的约束，例如字段类型约束。类似数据库的表结构（Schema）</td></tr> <tr><td>SQL</td> <td>DSL</td> <td>DSL 是 elasticsearch 提供的JSON风格的请求语句，用来操作 elasticsearch，实现CRUD</td></tr></tbody></table> <p>像操纵 MySQL 一样，我们本质上都是使用 DSL 对 ES 进行 CRUD，无论是命令行还是调用 RestAPI，都是在完成这一工作</p> <p>索引库和文档 = 数据表和数据</p> <p>索引库用以规定数据的存储格式，例如一个 /hotel 的索引库</p> <div class="language-json extra-class"><pre class="language-json"><code>PUT /hotel

  <span class="token property">&quot;mappings&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;properties&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>

        <span class="token property">&quot;analyzer&quot;</span><span class="token operator">:</span> <span class="token string">&quot;ik_max_word&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>

        <span class="token property">&quot;index&quot;</span><span class="token operator">:</span> <span class="token boolean">false</span>

      <span class="token punctuation">}</span><span class="token punctuation">,</span>

        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;integer&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;brand&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>

        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>

      <span class="token punctuation">}</span><span class="token punctuation">,</span>

<span class="token punctuation">}</span>
</code></pre></div><p>而 /hotel/1 这样的文档就对应一个个酒店</p> <p>Spring Boot 集成</p> <p>引入依赖：<a href="https://www.elastic.co/guide/en/elasticsearch/client/index.html" target="_blank" rel="nofollow noopener noreferrer">Elasticsearch Clients | Elastic<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.elasticsearch.client<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>elasticsearch-rest-high-level-client<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>

</code></pre></div><p>因为 SpringBoot 默认的 ES 版本是 7.6.2，所以我们需要覆盖默认的 ES 版本与自己的版本一致</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>properties</span><span class="token punctuation">&gt;</span></span>

    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>elasticsearch.version</span><span class="token punctuation">&gt;</span></span>7.12.1<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>elasticsearch.version</span><span class="token punctuation">&gt;</span></span>

</code></pre></div><p>初始化 RestHighLevelClient 并注入 Bean</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Bean</span>

<span class="token punctuation">}</span>
</code></pre></div><p>单元测试</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootTest</span>

                <span class="token class-name">HttpHost</span><span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token string">&quot;http://192.168.150.101:9200&quot;</span><span class="token punctuation">)</span>

    <span class="token annotation punctuation">@Test</span>

        <span class="token comment">// Do CRUD Test</span>
    <span class="token punctuation">}</span>

    <span class="token annotation punctuation">@AfterEach</span>
    <span class="token keyword">void</span> <span class="token function">tearDown</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">IOException</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>client<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>CRUD 文档库 Hotel，本质上就是<strong>拼接字符串和 HTTP 请求</strong>，向 ES 数据库<strong>发送 DSL 命令</strong>，而后 ES 返回执行结果的过程</p> <p>ES 的查询类似于 SQL 的编写，有很多查询条件和复合嵌套规则</p> <h3 id="分布式链路追踪"><a href="#分布式链路追踪" class="header-anchor">#</a> 分布式链路追踪</h3> <p>参考文献：<a href="https://www.cnblogs.com/caoweixiong/p/14475815.html" target="_blank" rel="nofollow noopener noreferrer">分布式服务调用链路追踪——方案选型 - 曹伟雄 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>在分布式系统中，一次调用如果时间过长，由于微服务之间的相互调用，想要找出到底是谁掉了链子是一件很困难的事情，这对故障排查是很大的阻碍，于是就有了分布式链路追踪的需求</p> <ul><li>分布式链路实际上就是指的请求的调用链</li></ul> <p>常见的分布式链路追踪框架</p> <ul><li>Zipkin：由 Twitter 开源、现由 OpenZipkin 社区维护的 <strong>分布式链路追踪系统</strong>，可帮助开发者收集和分析微服务调用的时序数据，快速定位性能瓶颈与故障点，支持内存、MySQL、Elasticsearch、Cassandra 等多种存储方式</li> <li>SkyWalking：华子开源的分布式链路追踪框架，其基本思路就是利用 Java Agent 对现成的项目进行插桩，通过外置的 Collector 收集者对项目的链路进行监控并进行持久化存储以及可视化控制</li></ul> <p>有这样几个关键点</p> <ul><li>每个链路必须有其独有的 ID 标识</li> <li>每条链路中的每个服务必须独有标识</li> <li>采用类似于心跳检测的策略对链路进行监控（约 1s 一次），但要注意，一但收集到上游的请求，那么必须对整条链路进行收集</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/9e801d/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">软件工程原理与应用</div></a> <a href="/pages/46b8df/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">DDD 领域驱动设计</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
