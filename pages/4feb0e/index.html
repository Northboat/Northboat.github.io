<span class="token builtin class-name">pwd</span>
<span class="token comment"># 查看当前目录所有文件</span>
<span class="token function">ls</span>
<span class="token comment"># 获取root权限</span>
<span class="token function">sudo</span> <span class="token function">su</span>
<span class="token comment"># 切换目录</span>
<span class="token builtin class-name">cd</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>vim</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> test.log
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>按<code>:</code>对vim进行功能选择</p> <ul><li>开始编辑：<code>i</code></li> <li>不保存退出：<code>q!</code></li> <li>保存并退出：<code>wq!</code></li></ul> <p>文件和文件夹</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 创建文件夹</span>
<span class="token function">mkdir</span>
<span class="token comment"># 创建文件</span>
<span class="token function">touch</span>
<span class="token comment"># 查看文件</span>
<span class="token function">cat</span>
<span class="token function">tail</span>
<span class="token function">less</span>
<span class="token comment"># 重命名文件：将A改为B</span>
<span class="token function">mv</span> A B
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>跑路</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">rm</span> <span class="token parameter variable">-rf</span> /*
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>解压缩</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> <span class="token parameter variable">-C</span>
<span class="token function">tar</span> <span class="token parameter variable">-xvf</span> mysql-8.0.16-2.el7.x86_64.rpm-bundle.tar
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>系统服务</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 启动</span>
systemctl start .service
<span class="token comment"># 重启</span>
systemctl restart .service
<span class="token comment"># 停止</span>
systemctl stop .service
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>设置快捷键</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> ~/.bashrc
<span class="token builtin class-name">source</span> .bashrc
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>通过配置 bashrc 文件创建自定义 linux 命令（快捷键）</p> <p>在较新版本的<code>linux</code>中，启动一项服务时，系统会首先找<code>/etc/systemd/system/</code>中的<code>.service</code>文件，通过该文件连接到<code>/lib/systemd/system</code>中</p> <p>例如以下命令就会走上述流程通过<code>docker.service</code>文件启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>systemctl start <span class="token function">docker</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>赋予权限：<code>+rw</code>为赋予读写权限，<code>-w</code>为删除写权限</p> <p>每个文件的权限由三部分组成：<code>drwxrwxrw-</code></p> <ul><li><code>rwx</code>：所有者 Owner，缩写 u</li> <li><code>rwx</code>：用户组 Group，缩写 g</li> <li><code>rw-</code>：其他 Others，缩写 o</li></ul> <p>权限类型有三种：r（读）、w（写）和 x（执行）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">chmod</span> +rw xxx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>权限的数字表示法：所谓数字表示法，是指将 r、w 和 x 分别用 4、2、1 来代表，没有授予权限的则为 0，然后把权限相加，如</p> <table><thead><tr><th>原始权限</th> <th>转换为数字</th> <th>数字表示法</th></tr></thead> <tbody><tr><td>rwxrwxr-x</td> <td>(421)(421)(401)</td> <td>775</td></tr> <tr><td>rwxr-xr-x</td> <td>(421)(401)(401)</td> <td>755</td></tr></tbody></table> <p>更多</p> <ol><li><a href="https://www.linuxcool.com/" target="_blank" rel="nofollow noopener noreferrer">Linux 命令手册<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="http://c.biancheng.net/view/735.html" target="_blank" rel="nofollow noopener noreferrer">第一个 Shell 脚本<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ol> <h3 id="包管理"><a href="#包管理" class="header-anchor">#</a> 包管理</h3> <p>apt：Debian 和 Ubuntu 的包管理器</p> <p>换源，需要修改配置文件后执行 apt update</p> <ul><li>Centos: /etc/yum.repolist.d</li> <li>Ubuntu: /etc/apt/sources.list</li></ul> <p>源</p> <ul><li>清华大学：<code>https://mirrors.tuna.tsinghua.edu.cn/help/ubuntu/</code></li> <li>阿里云开源镜像站：<code>https://developer.aliyun.com/mirror/ubuntu?spm=a2c6h.13651102.0.0.3e221b118zsOVM</code></li></ul> <p>常用命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 安装软件包</span>
<span class="token function">apt</span> <span class="token function">install</span> <span class="token function">vim</span>

<span class="token comment"># 移除软件包</span>
<span class="token function">apt</span> remove <span class="token function">curl</span> <span class="token parameter variable">-y</span>

<span class="token comment"># 移除软件包及配置文件</span>
<span class="token function">apt</span> purge nginx

<span class="token comment"># 刷新存储库</span>
<span class="token function">apt</span> update

<span class="token comment"># 升级所有可用软件包</span>
<span class="token function">apt</span> upgrade

<span class="token comment"># 自动删除不需要的包</span>
<span class="token function">apt</span> autoremove

<span class="token comment"># 搜索包</span>
<span class="token function">apt</span> search nginx

<span class="token comment"># 列出所有包</span>
<span class="token function">apt</span> list <span class="token comment"># 列出所有包</span>
<span class="token function">apt</span> list <span class="token parameter variable">--installed</span> <span class="token comment"># 列出所有已安装的包</span>
<span class="token function">apt</span> list <span class="token parameter variable">--upgradable</span> <span class="token comment"># 列出所有可升级的包</span>

<span class="token comment"># 查看包依赖</span>
<span class="token function">apt-cache</span> depends nginx <span class="token comment"># 查看这个包有哪些依赖</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br></div></div><p>wget：一个下载工具，并非包管理器，用于从网络上下载资源，没有指定目录，下载资源回默认为当前目录</p> <p>命令格式</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">wget</span> <span class="token punctuation">[</span>参数<span class="token punctuation">]</span> <span class="token punctuation">[</span>URL地址<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>下载参数</p> <table><thead><tr><th>短格式</th> <th>长格式</th> <th>说明</th></tr></thead> <tbody><tr><td></td> <td>–bind-address=ADDRESS</td> <td>指定本地使用地址（主机名或 IP，当本地有多个 IP 或名字时使用）</td></tr> <tr><td>-t</td> <td>–tries=NUMBER</td> <td>设定最大尝试链接次数（0 表示无限制）</td></tr> <tr><td>-O</td> <td>–output-document=FILE</td> <td>把文档写到 FILE 文件中</td></tr> <tr><td>-nc</td> <td>–no-clobber</td> <td>不要覆盖存在的文件或使用 .# 前缀</td></tr> <tr><td>-c</td> <td>–continue</td> <td>接着下载没下载完的文件</td></tr> <tr><td></td> <td>–progress=TYPE</td> <td>设定进程条标记</td></tr> <tr><td>-N</td> <td>–timestamping</td> <td>不要重新下载文件除非比本地文件新</td></tr> <tr><td>-S</td> <td>–server-response</td> <td>打印服务器的回应</td></tr> <tr><td></td> <td>–spider</td> <td>不下载任何东西</td></tr> <tr><td>-T</td> <td>–timeout=SECONDS</td> <td>设定响应超时的秒数</td></tr> <tr><td>-w</td> <td>–wait=SECONDS</td> <td>两次尝试之间间隔 SECONDS 秒</td></tr> <tr><td></td> <td>–waitretry=SECONDS</td> <td>在重新链接之间等待 1…SECONDS 秒</td></tr> <tr><td></td> <td>–random-wait</td> <td>在下载之间等待 0…2*WAIT 秒</td></tr> <tr><td>-Y</td> <td>–proxy=on/off</td> <td>打开或关闭代理</td></tr> <tr><td>-Q</td> <td>–quota=NUMBER</td> <td>设置下载的容量限制</td></tr> <tr><td></td> <td>–limit-rate=RATE</td> <td>限定下载速率</td></tr></tbody></table> <h3 id="nginx-服务器"><a href="#nginx-服务器" class="header-anchor">#</a> Nginx 服务器</h3> <blockquote><p>高性能 <a href="https://baike.baidu.com/item/HTTP" target="_blank" rel="nofollow noopener noreferrer">HTTP<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 和 <a href="https://baike.baidu.com/item/%E5%8F%8D%E5%90%91%E4%BB%A3%E7%90%86/7793488" target="_blank" rel="nofollow noopener noreferrer">反向代理<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> Web 服务器</p></blockquote> <h4 id="安装"><a href="#安装" class="header-anchor">#</a> 安装</h4> <p>ubuntu 下载并使用 Nginx</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">apt</span> update
<span class="token function">apt-get</span> <span class="token function">install</span> nginx
systemctl start nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>此时访问 IP:80 端口，可以看到 Nginx 的欢迎界面</p> <p>在目录<code>/usr/share/nginx/html</code>中，存放有默认的 index 页面，我们将其换成自己的，然后找到文件<code>/etc/nginx/sites-available/default</code>，修改其 server 模块</p> <div class="language-nginx line-numbers-mode"><pre class="language-nginx"><code><span class="token directive"><span class="token keyword">server</span></span> <span class="token punctuation">{</span>
    <span class="token directive"><span class="token keyword">listen</span> <span class="token number">80</span> default_server</span><span class="token punctuation">;</span>
    <span class="token directive"><span class="token keyword">listen</span> [::]:80 default_server</span><span class="token punctuation">;</span>

    <span class="token comment"># 确认根目录指向你的网页目录</span>
    <span class="token directive"><span class="token keyword">root</span> /usr/share/nginx/html</span><span class="token punctuation">;</span>

    <span class="token comment"># 优先识别你的 index.html（核心修改）</span>
    <span class="token directive"><span class="token keyword">index</span> index.html index.htm</span><span class="token punctuation">;</span>

    <span class="token comment"># 确保 charset 正确（非必须，但建议保留）</span>
    <span class="token directive"><span class="token keyword">charset</span> utf-8</span><span class="token punctuation">;</span>

    <span class="token comment"># 强制指向 index.html，避免路径匹配问题</span>
    <span class="token directive"><span class="token keyword">location</span> /</span> <span class="token punctuation">{</span>
        <span class="token directive"><span class="token keyword">try_files</span> <span class="token variable">$uri</span> <span class="token variable">$uri</span>/ /index.html</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment"># 其他默认配置（如 error_page 等）保留不变</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>将静态页面 root 指向自定义的网页目录，这样一个静态页面就部署好了，重新加载配置文件</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>systemctl reload nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>静态页面可以随时换，Nginx 采用热部署</p> <h4 id="proxy-与-lb"><a href="#proxy-与-lb" class="header-anchor">#</a> Proxy 与 LB</h4> <p>正向代理</p> <ul><li>VPN：挂在客户端上的代理</li> <li>客户端 → VPN → 服务器</li></ul> <p>反向代理：挂在服务器上的代理</p> <ul><li>作为中间代理分发请求给服务器，实现负载均衡</li> <li>如访问<code>www.baidu.com</code>，服务端代理这个域名，将请求分发给不同的服务器去接收请求</li></ul> <p>负载均衡轮询</p> <ul><li>轮询：请求依次打到服务器（循环）</li> <li>加权轮询：优先打到权重较高的服务器，保证服务器性能最大化</li></ul> <p>IPHash</p> <ul><li>Session 保存在 Tomcat 中，用 Redis 共享 Session</li> <li>通过 IP 进行计算，固定的 IP 打到固定的服务器，这样 Session 就不会丢失，但一旦这台服务器挂了，Session 也全没了</li></ul> <p>动静分离：静态资源直接通过 Nginx 返回，不走项目，如前端静态网页</p> <h4 id="配置"><a href="#配置" class="header-anchor">#</a> 配置</h4> <p>核心配置文件 nginx.conf</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment">#user  nobody;</span>
worker_processes  <span class="token number">1</span><span class="token punctuation">;</span>

<span class="token comment">#error_log  logs/error.log;</span>
<span class="token comment">#error_log  logs/error.log  notice;</span>
<span class="token comment">#error_log  logs/error.log  info;</span>

<span class="token comment">#pid        logs/nginx.pid;</span>


events <span class="token punctuation">{</span>
	<span class="token comment"># 最大worker数量</span>
    worker_connections  <span class="token number">1024</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>


http <span class="token punctuation">{</span>
    include       mime.types<span class="token punctuation">;</span>
    default_type  application/octet-stream<span class="token punctuation">;</span>

    <span class="token comment">#log_format  main  '$remote_addr - $remote_user [$time_local] &quot;$request&quot; '</span>
    <span class="token comment">#                  '$status $body_bytes_sent &quot;$http_referer&quot; '</span>
    <span class="token comment">#                  '&quot;$http_user_agent&quot; &quot;$http_x_forwarded_for&quot;';</span>

    <span class="token comment">#access_log  logs/access.log  main;</span>

    sendfile        on<span class="token punctuation">;</span>
    <span class="token comment">#tcp_nopush     on;</span>

    <span class="token comment">#keepalive_timeout  0;</span>
    keepalive_timeout  <span class="token number">65</span><span class="token punctuation">;</span>
    
    <span class="token comment">#gzip  on;</span>

    server <span class="token punctuation">{</span>
        listen       <span class="token number">8080</span><span class="token punctuation">;</span>
        server_name  localhost<span class="token punctuation">;</span>

        <span class="token comment">#charset koi8-r;</span>

        <span class="token comment">#access_log  logs/host.access.log  main;</span>

        location / <span class="token punctuation">{</span>
            root   html<span class="token punctuation">;</span>
            index  index.html index.htm<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment">#error_page  404              /404.html;</span>

        <span class="token comment"># redirect server error pages to the static page /50x.html</span>
        <span class="token comment">#</span>
        error_page   <span class="token number">500</span> <span class="token number">502</span> <span class="token number">503</span> <span class="token number">504</span>  /50x.html<span class="token punctuation">;</span>
        location <span class="token operator">=</span> /50x.html <span class="token punctuation">{</span>
            root   html<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment"># proxy the PHP scripts to Apache listening on 127.0.0.1:80</span>
        <span class="token comment">#</span>
        <span class="token comment">#location ~ \.php$ {</span>

mber">102</span><br><span class="line-number">103</span><br><span class="line-number">104</span><br><span class="line-number">105</span><br><span class="line-number">106</span><br><span class="line-number">107</span><br><span class="line-number">108</span><br><span class="line-number">109</span><br><span class="line-number">110</span><br><span class="line-number">111</span><br><span class="line-number">112</span><br><span class="line-number">113</span><br><span class="line-number">114</span><br><span class="line-number">115</span><br><span class="line-number">116</span><br></div></div><p>配置 server</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 配置负载均衡</span>

个软件对端口进行映射，需要一个具有公网<code>ip</code>的服务器</p> <p>配置<code>frps.ini</code>文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token punctuation">[</span>common<span class="token punctuation">]</span>
bind_port <span class="token operator">=</span> <span class="token number">7000</span>
             
dashboard_port <span class="token operator">=</span> <span class="token number">7500</span>
dashboard_user <span class="token operator">=</span> admin
dashboard_pwd <span class="token operator">=</span> <span class="token number">123456</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>其中<code>7000</code>是对外开放的端口，需要开启防火墙供人访问</p> <p><code>dashboard</code>是<code>frp</code>自提供的一个监控平台，观察各种连接信息</p> <ul><li><code>dashboard_port</code>是网站入口</li> <li><code>dashboard_user</code>是用户名</li> <li><code>dashboard_pwd</code>是密码</li></ul> <p>启动<code>frp</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>./frps <span class="token parameter variable">-c</span> frps.ini
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>编辑<code>frps.service</code>方便开机自启</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> /etc/systemd/system/frps.service
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token punctuation">[</span>Unit<span class="token punctuation">]</span>
<span class="token assign-left variable">Description</span><span class="token operator">=</span>frps daemon
<span class="token assign-left variable">After</span><span class="token operator">=</span>syslog.target  network.target
<span class="token assign-left variable">Wants</span><span class="token operator">=</span>network.target
<span class="token punctuation">[</span>Service<span class="token punctuation">]</span>
<span class="token assign-left variable">Type</span><span class="token operator">=</span>simple
<span class="token comment"># frp的路径</span>
<span class="token assign-left variable">ExecStart</span><span class="token operator">=</span>/root/frp_0.34.3_linux_amd64/frps <span class="token parameter variable">-c</span> /root/frp_0.34.3_linux_amd64/frps.ini
<span class="token assign-left variable">Restart</span><span class="token operator">=</span> always
<span class="token assign-left variable">RestartSec</span><span class="token operator">=</span>1min
<span class="token punctuation">[</span>Install<span class="token punctuation">]</span>
<span class="token assign-left variable">WantedBy</span><span class="token operator">=</span>multi-user.target
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><ul><li>启动 frps：sudo systemctl start frps</li> <li>打开开机自启动：sudo systemctl enable frps</li> <li>重启应用：sudo systemctl restart frps</li> <li>停止应用：sudo systemctl stop frps</li> <li>查看应用的日志：sudo systemctl status frps</li></ul> <p>启动并开机自启</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>systemctl start frps <span class="token operator">&amp;&amp;</span> systemctl <span class="token builtin class-name">enable</span> frps
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="client"><a href="#client" class="header-anchor">#</a> Client</h4> <p>配置<code>frpc.ini</code>文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token punctuation">[</span>common<span class="token punctuation">]</span>
<span class="token comment"># 公网ip地址</span>
server_addr <span class="token operator">=</span> <span class="token number">80.251</span>.215.170
<span class="token comment"># frps服务端口号</span>
server_port <span class="token operator">=</span> <span class="token number">7000</span>

<span class="token punctuation">[</span>RDP<span class="token punctuation">]</span>
<span class="token builtin class-name">type</span> <span class="token operator">=</span> tcp
<span class="token comment"># 自身本地ip</span>
local_ip <span class="token operator">=</span> <span class="token number">192.168</span>.1.5
<span class="token comment"># 自身要映射的端口号</span>
local_port <span class="token operator">=</span> <span class="token number">3389</span>
<span class="token comment"># 要映射到的端口号</span>
remote_port <span class="token operator">=</span> <span class="token number">7001</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>主要<code>frps</code>配置的<code>port:7000</code>是<code>frp</code>服务的端口号，这里映射的<code>7001</code>是本地应用服务的端口号，若要访问同样需要开放<code>7001</code>端口</p> <p>启动<code>frp</code>客户端</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>.<span class="token punctuation">\</span>frpc.exe <span class="token parameter variable">-c</span> frpc.ini
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="manjaro-本地配置"><a href="#manjaro-本地配置" class="header-anchor">#</a> Manjaro 本地配置</h2> <h3 id="系统安装"><a href="#系统安装" class="header-anchor">#</a> 系统安装</h3> <h4 id="ubuntu"><a href="#ubuntu" class="header-anchor">#</a> ubuntu</h4> <p>准备：制作启动盘及本地硬盘分区</p> <ul><li>下载镜像和 U 盘制作工具</li> <li>分盘</li> <li>使用 Ultraiso 制作 U 盘（写入方式：<code>USB-HDD+</code>）</li></ul> <p>安装</p> <p>跳过 wifi 选项，在安装界面选择 something else</p> <p>点击 + 号对 ubuntu 系统进行分区</p> <ul><li>primary，挂在目录选择<code>/</code>，该分区类似于 win 的 c</li> <li>logical，use as为<code>swap area</code>，为内存大小，以电脑为准</li> <li>logical，挂在目录选择<code>/boot</code>目录，为启动盘，<code>300MB</code>即可；若启动方式为<code>uefi</code>，该处需要选择<code>/efi</code>目录</li> <li>logical，Mount point选择 /home，你的所有软件将下在该目录</li> <li>选中boot区，continue</li> <li>选择时区、设置密码，等待安装</li></ul> <p>网卡驱动：检查是否有驱动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ifconfig</span> <span class="token parameter variable">-a</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>若出现 l0 字样，则为驱动缺失</p> <p>首先，在终端输入如下内容，查看网卡型号</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>lspci
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>下载对应驱动，船船为 rtl8821ce ，解压驱动压缩文件，修改文件 Makefile</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>export TopDIR ?= /home/rtl8821ce
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>在 /home/rtl8821ce 目录下分别执行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">make</span>
<span class="token function">sudo</span> <span class="token function">make</span> <span class="token function">install</span>
<span class="token function">sudo</span> modprobe <span class="token parameter variable">-a</span> 8821ce
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>有时提示找不到 package，尝试使用以下命令更新软件源</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">apt-get</span> update
<span class="token function">sudo</span> <span class="token function">apt-get</span> upgrade
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h4 id="manjaro"><a href="#manjaro" class="header-anchor">#</a> Manjaro</h4> <p>基于Arch - <a href="https://blog.csdn.net/qq_27525611/article/details/109269569" target="_blank" rel="nofollow noopener noreferrer">安装教程<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>准备</p> <ul><li>下载镜像，需要去官网下载，速度并不慢</li> <li>下载<code>Rufus</code></li> <li>制作启动盘</li></ul> <p>安装：熟悉的安装以及分区，注意可以像那篇博文一样分的很细，也可以只分<code>/home、/boot、/、/swap</code>分区，其余会自动分好</p> <p>Surface</p> <ul><li>下载驱动：<a href="https://github.com/linux-surface/linux-surface/releases/tag/arch-5.10.10-1" target="_blank" rel="nofollow noopener noreferrer">github/linux-surface<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>B乎教程：<a href="https://zhuanlan.zhihu.com/p/345302643" target="_blank" rel="nofollow noopener noreferrer">在Surface上安装Manjaro系统<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>关闭<code>bitlocker</code>，选择<code>usb</code>启动，扩展坞显得尤为重要</p> <h3 id="环境配置"><a href="#环境配置" class="header-anchor">#</a> 环境配置</h3> <p>1️⃣ 包管理</p> <p>initPacman.sh：初始化包管理，更换 pacman 源，同步库，下载 yay</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> pacman-mirrors <span class="token parameter variable">-c</span> China
<span class="token function">sudo</span> pacman <span class="token parameter variable">-Syy</span>
<span class="token function">sudo</span> pacman <span class="token parameter variable">-Sy</span> yay
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>在软件与安装中勾选AUR源</p> <p>更换<code>pacman</code>下载源</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> pacman-mirrors <span class="token parameter variable">-c</span> China
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>会跳出一个gui框让你选择</p> <p>或可直接修改配置文件<code>/etc/pacman.d/mirrorlist</code></p> <div class="language- line-numbers-mode"><pre class="language-text"><code># China
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinux/$repo/os/$arch
Server = https://mirrors.zju.edu.cn/archlinux/$repo/os/$arch
Server = http://mirrors.cpu.edu.cn/archlinux/$repo/os/$arch
Server = http://mirrors.163.com/archlinux/$repo/os/$arch
Server = http://mirrors.dgut.edu.cn/archlinux/$repo/os/$arch
#东软牌面
Server = http://mirrors.neusoft.edu.cn/archlinux/$repo/os/$arch
Server = http://mirrors.ustc.edu.cn/archlinux/$repo/os/$arch
Server = http://mirror.lzu.edu.cn/archlinux/$repo/os/$arch
Server = http://mirror.redrock.team/archlinux/$repo/os/$arch
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>下载<code>yay</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pacman <span class="token parameter variable">-Sy</span> yay
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>yay的配置文件在<code>~/.config/yay/config.json</code></p> <p>这里不要换清华源，很多资源都已失效，不如不换</p> <p>自动生成合适的 grub.cfg 文件，让 manjaro 读到 win 的引导</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">update-grub</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>修改 grub 设置</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查看</span>
<span class="token function">sudo</span> <span class="token function">cat</span> /etc/default/grub

<span class="token assign-left variable">GRUB_DEFAULT</span><span class="token operator">=</span>saved
<span class="token assign-left variable">GRUB_TIMEOUT</span><span class="token operator">=</span><span class="token number">5</span>
<span class="token assign-left variable">GRUB_TIMEOUT_STYLE</span><span class="token operator">=</span>hidden
<span class="token assign-left variable">GRUB_DISTRIBUTOR</span><span class="token operator">=</span><span class="token string">&quot;Manjaro&quot;</span>
<span class="token assign-left variable">GRUB_CMDLINE_LINUX_DEFAULT</span><span class="token operator">=</span><span class="token string">&quot;quiet apparmor=1 security=apparmor resume=UUID=75c1c3b5-d413-4ca6-8946-15a0fc7ef18b udev.log_priority=3&quot;</span>
<span class="token assign-left variable">GRUB_CMDLINE_LINUX</span><span class="token operator">=</span><span class="token string">&quot;&quot;</span>

<span class="token comment"># 删除 quiet 加上 loglever=5</span>
<span class="token assign-left variable">GRUB_CMDLINE_LINUX_DEFAULT</span><span class="token operator">=</span><span class="token string">&quot;apparmor=1 security=apparmor resume=UUID=75c1c3b5-d413-4ca6-8946-15a0fc7ef18b udev.log_priority=3 loglever=5&quot;</span>

<span class="token comment"># 使 grub.cfg 文件生效</span>
<span class="token function">sudo</span> <span class="token function">grub-mkconfig</span> <span class="token parameter variable">-o</span> /boot/grub/grub.cfg
<span class="token comment"># 这里要找一下 grub.cfg 的位置，可以在 /boot/efi/ 里</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>校正时间</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl set-local-rtc <span class="token number">1</span> --adjust-system-clock
timedatectl set-ntp <span class="token number">0</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>brightness.sh：亮度调节</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> <span class="token string">&quot;------start.&quot;</span>
<span class="token builtin class-name">read</span> <span class="token parameter variable">-p</span> <span class="token string">&quot;Enter the bright_lever: &quot;</span> lever
<span class="token keyword">case</span> <span class="token variable">$lever</span> <span class="token keyword">in</span>
  <span class="token number">1</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">9000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
  <span class="token number">2</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">15000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
  <span class="token number">3</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">20000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
  <span class="token number">4</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">25000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
<span class="token keyword">esac</span>
<span class="token function">sudo</span> <span class="token function">su</span> <span class="token operator">&lt;&lt;</span> <span class="token string">EOF<span class="token bash punctuation"> <span class="token comment"># 后续为子进程或子 shell 的输入</span></span>
cd /sys/class/backlight/intel_backlight/
echo <span class="token variable">$bright</span> &gt; brightness
EOF</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;--------end.&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>面板排布</p> <img src="/assets/img/panel.23bffe27.png"> <p>2️⃣ 中文</p> <p>changeInput.sh：中文输入法</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 下载vim</span>
yay <span class="token parameter variable">-S</span> <span class="token function">vim</span>

<span class="token comment"># 下载fcitx</span>

pacman <span class="token parameter variable">-S</span> fcitx-configtool

<span class="token comment"># 创建fcitx配置文件</span>

<span class="token comment"># 文件填写以下内容</span>

<span class="token builtin class-name">export</span> <span class="token assign-left variable"><span class="token environment constant">XMODIFIERS</span></span><span class="token operator">=</span><span class="token string">&quot;@im=fcitx&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>changeDir.sh：更改目录名为英文，因为安装时选择的中文系统，默认 home 下的目录名将是中文</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> pacman <span class="token parameter variable">-S</span> xdg-user-dirs-gtk
<span class="token builtin class-name">export</span> <span class="token assign-left variable"><span class="token environment constant">LANG</span></span><span class="token operator">=</span>en_US
xdg-user-dirs-gtk-update

<span class="token builtin class-name">export</span> <span class="token assign-left variable"><span class="token environment constant">LANG</span></span><span class="token operator">=</span>zh_CN.UTF-8
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>3️⃣ 常用软件</p> <p>installSoftware.sh：常用软件下载</p> <p>vscode</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># vscode和gdb</span>
yay <span class="token parameter variable">-S</span> visual-studio-code-bin
yay <span class="token parameter variable">-S</span> gdb
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>休闲</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> netease-cloud-music <span class="token comment"># 网易云</span>
yay <span class="token parameter variable">-S</span> microsoft-edge-dev-bin <span class="token comment"># edge</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>QQ</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> deepin-wine-qq <span class="token comment"># wine版</span>
<span class="token comment"># electron 新版，腾讯，我真的哭死</span>
yay <span class="token parameter variable">-S</span> linuxqq-new
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ul><li>Typora 解压使用</li> <li>使用 AppImage 版本的度盘</li></ul> <p>官网下载 natapp 用于内网穿透：<a href="https://natapp.cn/" target="_blank" rel="nofollow noopener noreferrer">natapp<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>执行命令为</li></ul> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>./natapp <span class="token parameter variable">-authtoken</span><span class="token operator">=</span>xxxxx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>4️⃣ 开发环境</p> <p>initGit.sh：初始化 git</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> user.name <span class="token string">&quot;NorthBoat&quot;</span> 设置 <span class="token function">git</span> <span class="token comment">#全局用户名</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.email <span class="token string">&quot;northboat@163.com&quot;</span> <span class="token comment">#设置 git 全局邮箱</span>
ssh-keygen <span class="token parameter variable">-t</span> rsa <span class="token parameter variable">-C</span> <span class="token string">&quot;northboat@163.com&quot;</span> <span class="token comment">#生成秘钥</span>

<span class="token function">cat</span> /home/northboat/.ssh/id.rsa.pub
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>installAnaconda.sh：配置 Python 环境</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> anaconda

<span class="token comment"># 换源</span>
conda config <span class="token parameter variable">--add</span> channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free
conda config <span class="token parameter variable">--add</span> channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
conda config <span class="token parameter variable">--set</span> show_channel_urls <span class="token function">yes</span>

<span class="token comment"># 加载配置文件</span>
<span class="token builtin class-name">source</span> /opt/anaconda/bin/activate root
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><ul><li>解压 dataspell</li></ul> <p>installJava.sh：配置 Java 环境</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> jdk8-openjdk
yay <span class="token parameter variable">-S</span> jdk11-openjdk

archlinux-java status <span class="token comment"># 查看 java 版本</span>
archlinux-java <span class="token builtin class-name">set</span> java-11-openjdk <span class="token comment"># 切换默认java版本</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><ul><li>解压 IDEA，学生帐号激活</li> <li>解压 Maven，手动建 repo 文件夹装包</li></ul> <p>installMysql.sh</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> mysql

<span class="token comment"># 初始化MySQL，记住输出的root密码</span>
mysqld <span class="token parameter variable">--initialize</span> <span class="token parameter variable">--user</span><span class="token operator">=</span>mysql <span class="token parameter variable">--basedir</span><span class="token operator">=</span>/usr <span class="token parameter variable">--datadir</span><span class="token operator">=</span>/var/lib/mysql
<span class="token comment"># 设置开机启动MySQL服务</span>
systemctl <span class="token builtin class-name">enable</span> mysqld.service
systemctl daemon-reload
systemctl start mysqld.service
<span class="token comment"># 使用MySQL前必须修改root密码，MySQL 8.0.15不能使用set password修改密码</span>
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
mysql<span class="token operator">&gt;</span> ALTER <span class="token environment constant">USER</span> <span class="token string">'root'</span>@<span class="token string">'localhost'</span> IDENTIFIED WITH mysql_native_password BY <span class="token string">'新密码'</span><span class="token punctuation">;</span>

<span class="token comment"># 图形化界面</span>
yay <span class="token parameter variable">-S</span> mysql-workbench
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>installRedis.sh：安装 Redis，解压后进入目录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> gcc g++

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>使用 appimage 形式的 qv2ray</li> <li>保存有祖传版内核，在 qv2ray 首选项中配置使用</li></ul> <p>5️⃣ 拉仓库</p> <p>blog.sh：下载 npm、hexo、vuepress 等以及插件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> nodejs
