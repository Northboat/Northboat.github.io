</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>pull.sh：拉取仓库脚本</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> <span class="token string">&quot;-------start&quot;</span>
<span class="token builtin class-name">cd</span> Blog
<span class="token function">git</span> pull
<span class="token builtin class-name">echo</span> <span class="token parameter variable">-e</span> <span class="token string">&quot;blog pull end!<span class="token entity" title="\n">\n</span>&quot;</span> <span class="token comment"># -e 启用转义字符</span>
<span class="token builtin class-name">cd</span> <span class="token punctuation">..</span>
<span class="token builtin class-name">cd</span> Docs
<span class="token function">git</span> pull
<span class="token builtin class-name">echo</span> <span class="token parameter variable">-e</span> <span class="token string">&quot;docs pull end!<span class="token entity" title="\n">\n</span>&quot;</span>
<span class="token builtin class-name">cd</span> <span class="token punctuation">..</span>
<span class="token builtin class-name">cd</span> Index
<span class="token function">git</span> pull
<span class="token builtin class-name">echo</span> <span class="token parameter variable">-e</span> <span class="token string">&quot;index pull end!<span class="token entity" title="\n">\n</span>&quot;</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;---------end&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><h3 id="系统设置"><a href="#系统设置" class="header-anchor">#</a> 系统设置</h3> <p>1️⃣ 调整时间</p> <p><a href="https://www.jianshu.com/p/92a2de6d9862" target="_blank" rel="nofollow noopener noreferrer">Manjaro配置准确时间<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl set-local-rtc <span class="token number">1</span> --adjust-system-clock
timedatectl set-ntp <span class="token number">0</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>显示系统的当前时间和日期</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl status
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>结果中RTC time就是硬件时钟的时间</p> <p>Linux系统上的time总是通过系统的 timezone 设置的，查看当前时区：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl <span class="token operator">|</span> <span class="token function">grep</span> Time
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查看所有可用的时区：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl list-timezones
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>根据地理位置找到本地的时区：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl list-timezones <span class="token operator">|</span> <span class="token function">egrep</span> <span class="token parameter variable">-o</span> “Asia/B.*”
timedatectl list-timezones <span class="token operator">|</span> <span class="token function">egrep</span> <span class="token parameter variable">-o</span> “Europe/L.*”
timedatectl list-timezones <span class="token operator">|</span> <span class="token function">egrep</span> <span class="token parameter variable">-o</span> “America/N.*”
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>在Linux中设置本地时区，使用set-timezone开关：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl set-timezone “Asia/shagnhai”
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>2️⃣ 桌面</p> <p>用<code>*.desktop</code>创建桌面快捷方式</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>#godotengine.desktop
[Desktop Entry]
Name=godot engine
GenericName=Game Engine
Exec=~/tool/godotengine/godotengine
Icon=godot.png
Terminal=false
Type=Application
StartupNotify=false
Categories=Development;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>3️⃣ Timeshift 快照</p> <p>使用 timeshift 创建 rsync 快照，将在第一次储存的基础上不断更新，一个快照大概7-9G</p> <p>4️⃣ 添加环境变量</p> <p>在<code>~/.bashrc</code>中添加</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">export</span> <span class="token assign-left variable"><span class="token environment constant">PATH</span></span><span class="token operator">=</span>/opt/anaconda/bin:<span class="token environment constant">$PATH</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>5️⃣ 更改启动项</p> <p>查看启动项</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sudo efibootmgr //显示efi的启动项
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>删除多余启动项</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>efibootmgr -b 000C -B
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>其中 000C是要删除的引导项编号，通过 efibootmgr命令可以直接查看</p> <ul><li>没有屁用，还得是格式化引导分区</li></ul> <p>发生了其他的问题，就是说我把引导分区格了之后，uuid变了，从manjaro进不了windows，这个时候要修改<code>/boot/grub/grub.cfg</code>文件的windows启动设置</p> <p>将<code>set=root uuid=</code>后的内容改成新的uuid保存退出即可</p> <p>查看分区信息（包括但不限于uuid）</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>blkid
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>改得头疼</p> <p>有智能的方法</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sudo update-grub
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>让linux系统自动生成合适的grub.cfg文件</p> <p>6️⃣ 虚拟控制台</p> <p><code>ctrl alt f2-f6</code>可以开启虚拟控制台，即黑框框的 linux，f7 为图形界面</p> <h3 id="shell-脚本"><a href="#shell-脚本" class="header-anchor">#</a> Shell 脚本</h3> <p>1️⃣ 解压缩</p> <p>压缩成 zip</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">zip</span> <span class="token parameter variable">-q</span> <span class="token parameter variable">-r</span> <span class="token punctuation">[</span>压缩文件名如:lexer.zip<span class="token punctuation">]</span> <span class="token punctuation">[</span>要压缩的文件<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>tar 压缩</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-czvf</span> lexer.tar.gz lexer <span class="token comment"># lexer 是文件夹</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>tar 解压</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-xzvf</span> lexer.tar.gz <span class="token comment"># 解压到当前目录</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>2️⃣ 博客部署</p> <p>部署 vuepress-reco 博客</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> run build
<span class="token builtin class-name">cd</span> public
<span class="token function">git</span> init
<span class="token function">git</span> <span class="token function">add</span> <span class="token builtin class-name">.</span>
<span class="token function">git</span> commit <span class="token parameter variable">-m</span> <span class="token string">&quot;reco&quot;</span>
<span class="token function">git</span> push <span class="token parameter variable">-f</span> git@github.com:NorthBoat/NorthBoat.github.io.git master
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>拉取更新 Blog&amp;Docs</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> <span class="token string">&quot;-------start&quot;</span>
<span class="token builtin class-name">cd</span> /home/northboat/File/reco/Blog
<span class="token function">git</span> pull
<span class="token builtin class-name">echo</span> <span class="token parameter variable">-e</span> <span class="token string">&quot;blog pull ok!<span class="token entity" title="\n">\n</span>&quot;</span> <span class="token comment"># -e 启用转义字符</span>
<span class="token builtin class-name">cd</span> <span class="token punctuation">..</span>
<span class="token builtin class-name">cd</span> Docs
<span class="token function">git</span> pull
<span class="token builtin class-name">echo</span> <span class="token parameter variable">-e</span> <span class="token string">&quot;docs pull ok!<span class="token entity" title="\n">\n</span>&quot;</span>

<span class="token builtin class-name">echo</span> <span class="token string">&quot;---------end&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>3️⃣ 亮度</p> <p>修改 manjaro-kde 亮度</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> <span class="token string">&quot;------start.&quot;</span>
<span class="token builtin class-name">read</span> <span class="token parameter variable">-p</span> <span class="token string">&quot;Enter the max_bright: &quot;</span> bright
<span class="token function">sudo</span> <span class="token function">su</span> <span class="token operator">&lt;&lt;</span> <span class="token string">EOF<span class="token bash punctuation"> <span class="token comment"># 后续为子进程或子 shell 的输入</span></span>
cd /sys/class/backlight/intel_backlight/
echo <span class="token variable">$bright</span> &gt; brightness
EOF</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;--------end.&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>更自动化，一键更改，使用 case 语句条件选择和 let 语句赋值</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> <span class="token string">&quot;------start.&quot;</span>
<span class="token builtin class-name">read</span> <span class="token parameter variable">-p</span> <span class="token string">&quot;Enter the bright_lever: &quot;</span> lever

<span class="token keyword">case</span> <span class="token variable">$lever</span> <span class="token keyword">in</span>
  <span class="token number">1</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">9000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
  <span class="token number">2</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">15000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
  <span class="token number">3</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">20000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
  <span class="token number">4</span><span class="token punctuation">)</span> <span class="token builtin class-name">let</span> <span class="token assign-left variable">bright</span><span class="token operator">=</span><span class="token number">25000</span><span class="token punctuation">;</span><span class="token punctuation">;</span>
<span class="token keyword">esac</span>

<span class="token function">sudo</span> <span class="token function">su</span> <span class="token operator">&lt;&lt;</span> <span class="token string">EOF<span class="token bash punctuation"> <span class="token comment"># 后续为子进程或子 shell 的输入</span></span>

cd /sys/class/backlight/intel_backlight/
echo <span class="token variable">$bright</span> &gt; brightness

EOF</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;--------end.&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>4️⃣ 软连接</p> <p><code>ln -s a b</code>，将 a 软连接到 b，相当于创建快捷方式</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">ln</span> <span class="token parameter variable">-s</span> /usr/local/bin/redis-server /home/northboat/Desktop/redis-server
<span class="token function">sudo</span> <span class="token function">ln</span> <span class="token parameter variable">-s</span> /usr/local/bin/redis-cli /home/northboat/Desktop/redis-cli
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h2 id="红米-termux"><a href="#红米-termux" class="header-anchor">#</a> 红米 Termux</h2> <p>安卓 linux 模拟器，非虚拟机，在 chroot 作用下可在非 root 环境下工作运行，类似于 wsl，因为买了一个平板，遂玩之</p> <h3 id="pkg-包管理"><a href="#pkg-包管理" class="header-anchor">#</a> PKG 包管理</h3> <blockquote><p>在 F-Droid 中下载安装</p></blockquote> <p>获取存储权限</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>termux-setup-storage
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>换 pkg 下载源</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>termux-change-repo
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>pkg：termux 包管理工具，安装编辑器、Java 以及 C 环境</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>pkg install vim
pkg install openjdk-17
pkg install clang
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>建立软连接</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ln</span> <span class="token parameter variable">-s</span> ~/storage/shared/northboat ~/northboat
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>注意 termux 不允许在 shared 目录执行 C 二进制文件，要在 home 目录下执行，于是在编译之后需要将 c/cpp 文件 cp 到 /home/c 中然后再编译执行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">read</span> <span class="token parameter variable">-p</span> <span class="token string">&quot;Enter the file name: &quot;</span> <span class="token function">file</span>
<span class="token function">cp</span> ~/storage/shared/northboat/c/<span class="token variable">$file</span> ~/c/<span class="token variable">$file</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="git-绑定"><a href="#git-绑定" class="header-anchor">#</a> GIt 绑定</h3> <p>设置昵称邮箱</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pkg <span class="token function">install</span> <span class="token function">git</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.name <span class="token string">&quot;Northboat&quot;</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.email <span class="token string">&quot;northboat@163.com&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>下载 ssl / ssh，生成密匙和连接要用</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pkg <span class="token function">install</span> openssl
pkg <span class="token function">install</span> openssh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>生成密匙</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>ssh-keygen <span class="token parameter variable">-t</span> rsa <span class="token parameter variable">-C</span> <span class="token string">&quot;northboat@163.com&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>设置安全目录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> <span class="token parameter variable">--add</span> safe.directory /storage/emulated/0/northboat/repo/Docs

<span class="token comment"># 或者编辑文件配置 git global</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> <span class="token parameter variable">-e</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>然后就可以快乐的 git 辣</p> <h3 id="mysql-连接"><a href="#mysql-连接" class="header-anchor">#</a> MySQL 连接</h3> <p>下载</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pkg <span class="token function">install</span> mariadb
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">nohup</span> mysqld <span class="token operator">&amp;</span>
<span class="token comment">#查看运行进程</span>
<span class="token function">ps</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>登录并配置</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>mysql <span class="token parameter variable">-h</span> localhost <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
<span class="token comment"># 初始密码为空，直接回车</span>

<span class="token comment"># 配置</span>
use mysql<span class="token punctuation">;</span>
<span class="token comment"># 设置密码</span>
<span class="token builtin class-name">set</span> password <span class="token keyword">for</span> <span class="token string">'root'</span>@<span class="token string">'localhost'</span> <span class="token operator">=</span> password<span class="token punctuation">(</span><span class="token string">'123456'</span><span class="token punctuation">)</span>
<span class="token comment"># 刷新权限</span>
flush privileges
<span class="token comment"># 退出</span>
<span class="token builtin class-name">exit</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>重新登陆</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>mysqld 启动脚本 start_mysql.sh</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token builtin class-name">echo</span> <span class="token string">'start mysqld'</span>
<span class="token function">nohup</span> mysqld <span class="token operator">&gt;</span> mysql.log <span class="token operator">&amp;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>赋权并执行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">chmod</span> +x start_mysql.sh
<span class="token function">sh</span> start_mysql.sh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>碰到一个问题：mysqld 启动报错 Unknown / unsupported storage engine: InnoDB</p> <p>解决办法：删除<code>usr/var/lib/mysql</code>目录下一些日志文件再重启</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">rm</span> <span class="token parameter variable">-rf</span> aria_log*
<span class="token function">rm</span> <span class="token parameter variable">-rf</span> ib_logfile*
<span class="token function">rm</span> <span class="token parameter variable">-rf</span> ibdata1
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>问题解决</p> <h3 id="andronix-虚拟机"><a href="#andronix-虚拟机" class="header-anchor">#</a> Andronix 虚拟机</h3> <p>在安装 manjaro 之前记得更新 pkg 的库</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pkg update
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>使用 andronix ＋ termux 安装 manjaro 配置 python 开发环境</p> <p>通过 andronix 生成 pkg 下载命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pkg update <span class="token parameter variable">-y</span> <span class="token operator">&amp;&amp;</span> pkg <span class="token function">install</span> <span class="token function">wget</span> <span class="token function">curl</span> proot <span class="token function">tar</span> <span class="token parameter variable">-y</span> <span class="token operator">&amp;&amp;</span> <span class="token function">wget</span> https://raw.githubusercontent.com/AndronixApp/AndronixOrigin/master/Installer/Manjaro/manjaro.sh <span class="token parameter variable">-O</span> manjaro.sh <span class="token operator">&amp;&amp;</span> <span class="token function">chmod</span> +x manjaro.sh <span class="token operator">&amp;&amp;</span> <span class="token function">bash</span> manjaro.sh 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>赋予 termux 存储权限后修改<code>start-manjaro.sh</code>，挂载 sdcard 目录</p> <p>运行<code>./start-manjaro.sh</code>启动 manjaro</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>pacman -Syy
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>配置环境</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>pacman <span class="token parameter variable">-S</span> python-pip
pip <span class="token function">install</span> numpy pandas scipy matplotlib
pip <span class="token function">install</span> torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>pytorch 下载命令生成：<a href="https://pytorch.org/get-started/locally/" target="_blank" rel="nofollow noopener noreferrer">pytorch.org<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="linux-文件系统"><a href="#linux-文件系统" class="header-anchor">#</a> Linux 文件系统</h2> <h3 id="本地文件系统"><a href="#本地文件系统" class="header-anchor">#</a> 本地文件系统</h3> <p>Linux 和 K8s 的文件系统</p> <ul><li>ext4（Fourth Extended Filesystem）：Linux 上最经典、应用最广的本地文件系统，通常是本地双系统的选择</li> <li>XFS：CentOS 7+ 的默认文件系统，支持在线扩容，性能极佳，一般是服务器的选择</li> <li>Btrfs（B-Tree FS）：类似 ZFS 的 Linux 实现，设计目标是取代 ext4 和 XFS，支持秒级快照和回滚，快照和回滚是主要卖点</li></ul> <p>一个容器挂载卷示例</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;environments&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
  <span class="token property">&quot;volumes&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
    <span class="token punctuation">{</span>
      <span class="token property">&quot;total&quot;</span><span class="token operator">:</span> <span class="token string">&quot;105558630400&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;used&quot;</span><span class="token operator">:</span> <span class="token string">&quot;15156269056&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;totalInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;6553600&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;usedInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;181313&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;ext4&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;mountPoint&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/dockerData&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">{</span>
      <span class="token property">&quot;total&quot;</span><span class="token operator">:</span> <span class="token string">&quot;7516243099648&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;used&quot;</span><span class="token operator">:</span> <span class="token string">&quot;5782302978048&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;totalInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;734212912&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;usedInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;23657123&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;xfs&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;mountPoint&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/dockerData/000&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">{</span>
      <span class="token property">&quot;total&quot;</span><span class="token operator">:</span> <span class="token string">&quot;1074815565824&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;used&quot;</span><span class="token operator">:</span> <span class="token string">&quot;12495220736&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;totalInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;0&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;usedInodes&quot;</span><span class="token operator">:</span> <span class="token string">&quot;0&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;btrfs&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;mountPoint&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/dockerData/base&quot;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">]</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br></div></div><p>DeepSeek 的对比表格</p> <table><thead><tr><th style="text-align:left;">技术</th> <th style="text-align:left;">层级</th> <th style="text-align:left;">管理范围</th> <th style="text-align:left;">核心优势</th> <th style="text-align:left;">典型场景</th> <th style="text-align:left;">类比</th></tr></thead> <tbody><tr><td style="text-align:left;"><strong>Ext4</strong></td> <td style="text-align:left;">本地文件系统</td> <td style="text-align:left;">1 块硬盘/分区</td> <td style="text-align:left;">最稳定、兼容性无敌、恢复工具多</td> <td style="text-align:left;">通用服务器系统盘、家用 U 盘、入门级 VPS</td> <td style="text-align:left;">家用车：兼容性高</td></tr> <tr><td style="text-align:left;"><strong>XFS</strong></td> <td style="text-align:left;">本地文件系统</td> <td style="text-align:left;">1 块硬盘/分区</td> <td style="text-align:left;">大文件读写快、高并发强、支持在线扩容</td> <td style="text-align:left;">操作系统根目录、数据库数据目录、大文件存储</td> <td style="text-align:left;">重卡：性能上线更高</td></tr> <tr><td style="text-align:left;"><strong>Btrfs</strong></td> <td style="text-align:left;">本地文件系统</td> <td style="text-align:left;">多块硬盘（池化）</td> <td style="text-align:left;">快照回滚、数据压缩、校验和自愈</td> <td style="text-align:left;">容器/虚拟机存储、桌面系统、需要快照备份的服务器</td> <td style="text-align:left;">SUV：功能花哨，依赖操作技巧</td></tr></tbody></table> <ul><li>不求有功但求无过：选 Ext4（通用服务器、虚拟机镜像）</li> <li>跑数据库或大数据：选 XFS（性能上限更高）</li> <li>想要快照、压缩功能：选 Btrfs（生产环境建议搭配 RAID 卡，且避开早期 Btrfs 的 RAID5/6 坑）</li></ul> <h3 id="分布式存储系统"><a href="#分布式存储系统" class="header-anchor">#</a> 分布式存储系统</h3> <p>CephFS：分布式存储系统，提供</p> <ul><li>对象存储（RADOS GW，兼容 AWS S3）</li> <li>块存储（RBD，像云硬盘一样挂载给虚拟机）</li> <li>文件存储（CephFS），类似于 BOS，用于公共存储</li></ul> <p>在 K8s 里：Ceph 通常作为后端持久化存储（提供 PVC），提供给 Pod 使用；而 XFS 或 Btrfs 则作为宿主机（Node） 操作系统的文件系统，用来格式化承载 Ceph 数据盘或本地 PV 的物理磁盘</p> <h3 id="overlayfs"><a href="#overlayfs" class="header-anchor">#</a> OverlayFS</h3> <p>OverlayFS 是一种联合文件系统（Union File System），它将多个目录（称为“层”）透明地叠加在一起，呈现为一个统一的目录视图，这是 Docker 和 Kubernetes 容器镜像和容器运行时默认的存储驱动之一，即 Pod 的默认文件系统</p> <ul><li>image (lower) + upper = merged</li></ul> <p>查看 GraphDriver</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> inspect <span class="token operator">&lt;</span>容器名/ID或镜像名<span class="token operator">&gt;</span> <span class="token operator">|</span> jq <span class="token string">'.[0].GraphDriver'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>一个实际 overlay 信息</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
