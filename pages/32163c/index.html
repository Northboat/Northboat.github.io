+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">接口与表设计<!----></h1> <!----> <div class="theme-vdoing-content content__default"><blockquote><ol><li>不要把需求想的太复杂，anydev 大部分业务也就是对数据库进行crud操作而已，我入职一两年，也还是一个 sql boy，很多时候，只需要很基础的设计就可以了</li> <li>不要钻牛角尖，也不要害羞，有问题我们及时沟通，快速迭代修改，很多方案肯定不是一开始就是没有任何问题的</li></ol></blockquote> <h2 id="api-接口设计"><a href="#api-接口设计" class="header-anchor">#</a> API 接口设计</h2> <h3 id="接口的修改"><a href="#接口的修改" class="header-anchor">#</a> 接口的修改</h3> <p>修改一个已有接口，遵循最小改动原则，尽量不动原有逻辑，不影响已有 API 调用</p> <ul><li>按照重量级：新增数据库表 ＞ 新插入数据表列 ＞ 在已有 json 字段里新增键值对 ＞ 复用字段</li> <li>新增接口 ＞ 修改 DTO ＞ 新增处理分支</li></ul> <p>模块化编程，注意泛化函数的命名</p> <ol><li>驼峰命名保持一致性，如 Id、Uid、Ppt、Pdf，逻辑尽量保持一致</li> <li>将冗余的 if-else 在内部封装，不要在外面堆屎</li> <li>参数往外放，保持业务功能在函数的完整性和模块化，这意味着，每个大写的导出函数，应该具备独立的处理逻辑，不依赖于内部配置，而只依赖外部传参</li></ol> <h3 id="空与空值"><a href="#空与空值" class="header-anchor">#</a> 空与空值</h3> <p>可以通过控制入参字段的“空”与“空值”来控制业务层逻辑，通过 protobuf 的包装类 <code>google.protobuf.StringValue</code> 来实现 nil 和空值的区分</p> <p>例如：以下非必须参数，如果不传（为空）将默认不进行修改，若传了但为空值并且在系统中合法，会修改为空值（<code>&quot;&quot; / false</code>）</p> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">必填</th> <th style="text-align:center;">说明</th></tr></thead> <tbody><tr><td style="text-align:center;">envId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">环境 id</td></tr> <tr><td style="text-align:center;">username</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">用户名（英文），例如<code>saulxiong</code>，只有环境拥有者才能通过校验</td></tr> <tr><td style="text-align:center;">envName</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">环境名</td></tr> <tr><td style="text-align:center;">teamEnv</td> <td style="text-align:center;">bool</td> <td style="text-align:center;">否</td> <td style="text-align:center;">标记是否为团队环境，只有 AI 环境能够被设置为 teamEnv，非 AI 容器设置团队环境将报错</td></tr> <tr><td style="text-align:center;">idePath</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">ide 默认打开路径（工作目录）</td></tr> <tr><td style="text-align:center;">ideName</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">默认 ide</td></tr> <tr><td style="text-align:center;">ideVersion</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">ide 版本，可为空值<code>&quot;&quot;</code></td></tr></tbody></table> <p>200 Response，无 err 说明修改结果正常</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>
    <span class="token property">&quot;message&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="枚举控制分支"><a href="#枚举控制分支" class="header-anchor">#</a> 枚举控制分支</h3> <p>除了常见的 Action 字段控制本次执行分支，还可以通过 Columns 入参决定返回字段，例如</p> <ul><li>POST /env/extra/info</li> <li>columns 必填，若传入字段不支持查询，将自动忽略并返回空</li></ul> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">必填</th> <th style="text-align:center;">说明</th></tr></thead> <tbody><tr><td style="text-align:center;">username</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">用户名（透传，本期不参与鉴权）</td></tr> <tr><td style="text-align:center;">envId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">环境 ID</td></tr> <tr><td style="text-align:center;">columns</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">查询的字段，查询多个字段以 <code>,</code> 或 <code>;</code> 分隔；驼峰小写，如 <code>passEnvId</code></td></tr></tbody></table> <p>当前已支持查询的字段</p> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">中文含义</th></tr></thead> <tbody><tr><td style="text-align:center;">passEnvId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">环境的 pass 层 id</td></tr></tbody></table> <p>返回结果上，想让返回具备无限的扩展能力，放弃使用类型绑定（每次新增字段都要在 proto 结构里新增字段），直接将 <code>map&lt;string, string&gt;</code> 的 kv 存储作为 body 的 data 字段返回</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
  <span class="token property">&quot;message&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;passEnvId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;saulxiong-xxxxxxxxxxx&quot;</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h2 id="数据表设计"><a href="#数据表设计" class="header-anchor">#</a> 数据表设计</h2> <h3 id="nil-与-err"><a href="#nil-与-err" class="header-anchor">#</a> nil 与 err</h3> <p>这里是一个编码习惯问题，这里我习惯<code>gorm.ErrRecordNotFound</code>错误时不返回 err，而返回空数据，具体的逻辑判断交由上层实现</p> <p>另一种做法就是无脑返回 err，反正没查到数据，大概率后面的业务流程也不会继续了，但这里的情况不太一样，即使这里没查到，还要查另一张表判断是否是创建者 creator，完成鉴权</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>CollaboratorController<span class="token punctuation">)</span> <span class="token function">getCollaboratorByEnvIdAndUsername</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> username<span class="token punctuation">,</span>
	envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>EnvCollaborator<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	collaborator <span class="token operator">:=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>EnvCollaborator<span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span>
		<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId = ? AND memberName = ? AND valid = 1&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">,</span> username<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Take</span><span class="token punctuation">(</span>collaborator<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token comment">// 当没查到协作记录，既不返回数据也不返回报错</span>
		<span class="token keyword">if</span> errors<span class="token punctuation">.</span><span class="token function">Is</span><span class="token punctuation">(</span>err<span class="token punctuation">,</span> gorm<span class="token punctuation">.</span>ErrRecordNotFound<span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
		<span class="token punctuation">}</span>

		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;getCollaboratorByEnvIdAndUsername failed, err: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> collaborator<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><h3 id="表设计"><a href="#表设计" class="header-anchor">#</a> 表设计</h3> <p>SSH 转发规则表：这里的 port 字段由一个全局的 Redis 游标维护，每次使用后 INCR 一次，通过 status 字段进行软删（<code>deleted</code>）</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> <span class="token identifier"><span class="token punctuation">`</span>sshProxyRule<span class="token punctuation">`</span></span> <span class="token punctuation">(</span>
    <span class="token identifier"><span class="token punctuation">`</span>uid<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">45</span><span class="token punctuation">)</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">COMMENT</span> <span class="token string">'主键'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>environmentIp<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">COMMENT</span> <span class="token string">'环境Pod IP'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>port<span class="token punctuation">`</span></span> <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">11</span><span class="token punctuation">)</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">COMMENT</span> <span class="token string">'中转机监听端口'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>clusterId<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">COMMENT</span> <span class="token string">'集群ID'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>taskId<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">COMMENT</span> <span class="token string">'TAT任务ID'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>status<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">COMMENT</span> <span class="token string">'规则状态(active/delivering/deleted)'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>createdAt<span class="token punctuation">`</span></span> <span class="token keyword">datetime</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span> <span class="token keyword">DEFAULT</span> <span class="token keyword">CURRENT_TIMESTAMP</span> <span class="token keyword">COMMENT</span> <span class="token string">'创建时间'</span><span class="token punctuation">,</span>
    <span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>uid<span class="token punctuation">`</span></span><span class="token punctuation">)</span><span class="token punctuation">,</span>

    <span class="token keyword">KEY</span> <span class="token identifier"><span class="token punctuation">`</span>idx_username_status<span class="token punctuation">`</span></span> <span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>username<span class="token punctuation">`</span></span><span class="token punctuation">,</span> <span class="token identifier"><span class="token punctuation">`</span>status<span class="token punctuation">`</span></span><span class="token punctuation">)</span><span class="token punctuation">,</span>

    <span class="token keyword">KEY</span> <span class="token identifier"><span class="token punctuation">`</span>idx_imageUrl<span class="token punctuation">`</span></span> <span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>imageUrl<span class="token punctuation">`</span></span><span class="token punctuation">)</span>
<span class="token punctuation">)</span> <span class="token keyword">ENGINE</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span> <span class="token keyword">DEFAULT</span> <span class="token keyword">CHARSET</span> <span class="token operator">=</span> utf8
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>这里对应的业务流程如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>创建 CreateEnvCommit
 ├─ :55  CheckResource(环境属主)        ← 校验余量，你已改 ✓
 ├─ :71  paas.CommitEnvImage 成功
 ├─ :76  AdjustResourceUsed(create)     ← 扣款：used+1，你已改为环境属主 ✓
 └─ :81  存任务：Username=操作者(:97), Creator=操作者(:104)  ← 关键：没记属主

终态流转（全部由 /env/commit/operate 驱动 → OperateCommitTask :167）
 ├─ success(:219) → successCommitTask(:256)：建模板，不退款
 │    （镜像存在期间配额一直占着，是业务设计，不是 bug）
 ├─ cancel(:190)  → 退款 used-1 → 退给 taskInfo.Creator(:202) ✗
 ├─ fail(:207)    → 退款 used-1 → 退给 taskInfo.Creator(:214) ✗
 └─ delete(:181)  → 退款 used-1 → 退给 taskInfo.Creator(:185) ✗

被动退款（用户不直接操作，也走 OperateCommitTask）
 ├─ 环境销毁 DestroyEnv(:3731)、环境崩溃回调(callback_env_status.go:133)、
 │   换模板 BindEnvTemplate(:5174)、StopEnv(:8340)
 │   → CancelEnvCommitTaskByEnvId(:561) → cancel → 退给 taskInfo.Creator
 └─ 模板删除 DeleteTemplate(template.go:2070) → delete → 退给 taskInfo.Creator
     （这是 success 后长期占用配额的唯一释放口）

重试 RetryCommitTask(:326)
 ├─ 前提：任务处于 cancel/failed（即：已退款完毕）
 ├─ :350  CheckResource(ctx.UserName())        ← 校验操作者 ✗
 └─ :371  AdjustResourceUsed(create)           ← 重新扣款给操作者 ✗
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>冗余与预留</p> <ul><li>冗余存储是大忌，不要因为省一次查表，从而把一个已经存储过的数据存到新的一张表中</li> <li>预留字段：如果要预留字段，json string 是一种比较好的数据结构，比如
<ol><li>opTask 里的 params 和 result 字段，因为任务的多样性，每个任务的参数和返回都不相同，所以会这样选择</li> <li>又如百度里的 extraParams，也是一个 json string，专门用来塞一些还未确定的策略参数 Strategy</li></ol></li></ul> <p>虽然保留了很多不确定性，但在一些必要场景下是完全可以接受的</p> <h3 id="sql-编写"><a href="#sql-编写" class="header-anchor">#</a> SQL 编写</h3> <p>刷法务环境的 subServerType，将其打标为 AIEnv 环境</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">update</span> devEnvironmentInstance <span class="token keyword">set</span> remark <span class="token operator">=</span> json_set<span class="token punctuation">(</span>remark<span class="token punctuation">,</span> <span class="token string">'$.subServerType'</span><span class="token punctuation">,</span> <span class="token string">'AIEnv'</span><span class="token punctuation">)</span> <span class="token keyword">where</span> appId <span class="token operator">=</span> <span class="token string">'lawtech'</span> <span class="token operator">and</span> <span class="token keyword">status</span> <span class="token operator">!=</span> <span class="token string">'deleted'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>不要这么执行！<strong>大范围的使用 where 变更是大忌</strong>，应该一条条查出来 envId，再逐条执行变更，这样的话</p> <ol><li>一定会命中索引，不会造成慢 SQL</li> <li>将风险分为 300 条，而不是浓缩在一次执行中（难排查）</li></ol> <p>这和 N+1 SQL 是反着来的（差点真写进测试环境了），一个典型的 N+1 反例，我实现了一个 SQL 查询函数，判断是否环境是否被协作（是否有有效的协作记录）</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// IsCollaborated 判断环境是否存在有效的协作关系</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>CollaboratorController<span class="token punctuation">)</span> <span class="token function">IsCollaborated</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> envId <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">,</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;环境ID不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">var</span> count <span class="token builtin">int64</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Model</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>table<span class="token punctuation">.</span>EnvCollaborator<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId = ? AND valid = 1&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Count</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>count<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询环境协作关系失败, envId=%s, err=%v&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> count <span class="token operator">&gt;</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>然后在外层的 <code>Env/List</code> 接口，对当前用户的所有环境进行是否被协作的标记</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> instance <span class="token operator">:=</span> <span class="token keyword">range</span> devEnvironmentInstance <span class="token punctuation">{</span>
	collaborated<span class="token punctuation">,</span> err <span class="token operator">:=</span> collaboratorController<span class="token punctuation">.</span><span class="token function">IsCollaborated</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> instance<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;collaboratorController.IsCollaborated err: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">continue</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> collaborated <span class="token punctuation">{</span>
		collaboratorRoleMap<span class="token punctuation">[</span>instance<span class="token punctuation">.</span>Uid<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token string">&quot;creator&quot;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>这直接干了 N+1 条 SQL 查询，这不是索不索引的问题了，这是 N+1 次 TTL 往返，怎么可能这么查呢，用 <code>for</code> 嵌套 SQL 查询，是一年级的本科生才干得出来的事，正确的做法是整理好所有待查询的 envIds，做一次范围查询</p> <ul><li><strong>这和 SQL 变更完全是反着来的，后台 SQL 变更求稳，系统 SQL 查询求快</strong></li></ul> <p>批量查询 SQL</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetCollaboratedEnvIds 批量查询存在有效协作关系的环境 ID 集合</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>CollaboratorController<span class="token punctuation">)</span> <span class="token function">GetCollaboratedEnvIds</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	envIds <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	result <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>envIds<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> result<span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">var</span> collaboratedEnvIds <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Model</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>table<span class="token punctuation">.</span>EnvCollaborator<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId IN ? AND valid = 1&quot;</span><span class="token punctuation">,</span> envIds<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Distinct</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Pluck</span><span class="token punctuation">(</span><span class="token string">&quot;envId&quot;</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>collaboratedEnvIds<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;批量查询环境协作关系失败, envIds=%v, err=%v&quot;</span><span class="token punctuation">,</span> envIds<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> envId <span class="token operator">:=</span> <span class="token keyword">range</span> collaboratedEnvIds <span class="token punctuation">{</span>
		result<span class="token punctuation">[</span>envId<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">{</span><span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>业务调用</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 批量检查我创建的环境是否存在有效协作记录，区分我创建的协作环境和非协作环境</span>
ownedEnvIds <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>devEnvironmentInstance<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> instance <span class="token operator">:=</span> <span class="token keyword">range</span> devEnvironmentInstance <span class="token punctuation">{</span>
    ownedEnvIds <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>ownedEnvIds<span class="token punctuation">,</span> instance<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
collaboratedEnvIds<span class="token punctuation">,</span> err <span class="token operator">:=</span> collaboratorController<span class="token punctuation">.</span><span class="token function">GetCollaboratedEnvIds</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> ownedEnvIds<span class="token punctuation">)</span>
<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;GetCollaboratedEnvIds err: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><h2 id="非侵入式编码"><a href="#非侵入式编码" class="header-anchor">#</a> 非侵入式编码</h2> <h3 id="函数变长入参"><a href="#函数变长入参" class="header-anchor">#</a> 函数变长入参</h3> <p>新增入参函数</p> <ol><li>定义结构体参数 <code>AllocOperateOption</code></li> <li>定义入参接口 <code>AllocOperateOpt</code></li> <li>实现入参函数 <code>WithCollaboratorAuth</code></li></ol> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// AllocOperateOption 环境操作鉴权配置</span>
<span class="token comment">// CollaboratorRole 表示协作成员执行本次操作所需的最低角色。</span>
<span class="token keyword">type</span> AllocOperateOption <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	EnvID            <span class="token builtin">string</span>
	CollaboratorRole <span class="token builtin">string</span>
<span class="token punctuation">}</span>

<span class="token comment">// AllocOperateOpt 环境操作鉴权选项</span>
<span class="token comment">// 默认仅允许环境属主和管理员操作；传入协作鉴权选项后，可按角色放行协作成员。</span>
<span class="token keyword">type</span> AllocOperateOpt <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token operator">*</span>AllocOperateOption<span class="token punctuation">)</span>

<span class="token comment">// WithCollaboratorAuth 配置协作成员鉴权</span>
<span class="token keyword">func</span> <span class="token function">WithCollaboratorAuth</span><span class="token punctuation">(</span>envID<span class="token punctuation">,</span> role <span class="token builtin">string</span><span class="token punctuation">)</span> AllocOperateOpt <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token keyword">func</span><span class="token punctuation">(</span>o <span class="token operator">*</span>AllocOperateOption<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		o<span class="token punctuation">.</span>EnvID <span class="token operator">=</span> envID
		o<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">=</span> role
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>在现有函数中使用变长的函数入参 <code>opt ...AllocOperateOpt</code>，这样做的好处是</p> <ul><li>对原有函数无侵入式，不影响已有调用逻辑</li> <li>新增的参数可读性极佳，相较于 <code>args ...string</code> 的方式，实现了一个有名字的强类型参数</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// AllocOperate 校验当前用户是否允许操作环境，owner 为环境属主，AllocOperateOpt 为协作环境选项</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">AllocOperate</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> owner <span class="token builtin">string</span><span class="token punctuation">,</span> opt <span class="token operator">...</span>AllocOperateOpt<span class="token punctuation">)</span> <span class="token punctuation">(</span>err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> owner <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;环境属主不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	opts <span class="token operator">:=</span> <span class="token operator">&amp;</span>AllocOperateOption<span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> o <span class="token operator">:=</span> <span class="token keyword">range</span> opt <span class="token punctuation">{</span>
		<span class="token function">o</span><span class="token punctuation">(</span>opts<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	username <span class="token operator">:=</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> username <span class="token operator">==</span> owner <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> ok<span class="token punctuation">,</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">IsAdmin</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> ok <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>EnvID <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">&amp;&amp;</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>ForbiddenErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;你无权限操作环境，环境所有人:%s&quot;</span><span class="token punctuation">,</span> owner<span class="token punctuation">)</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warn</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>EnvID <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">||</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;协作环境和协作角色不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">!=</span> Manager <span class="token operator">&amp;&amp;</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">!=</span> Collaborator <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;不支持的协作鉴权角色:%s&quot;</span><span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>collaboratorController<span class="token punctuation">.</span><span class="token function">AllocCollaborate</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> username<span class="token punctuation">,</span> opts<span class="token punctuation">.</span>EnvID<span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>ForbiddenErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;你无权限操作环境，当前协作权限不足，所需权限: %s&quot;</span><span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warn</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br></div></div><p>在业务中增加 Collaborator 参数逻辑</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// StartWebIde 启动web ide</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>ResourceV2Controller<span class="token punctuation">)</span> <span class="token function">GetResourceInfo</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	username <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceQuotaV2<span class="token punctuation">,</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceUsedV2<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	quota<span class="token punctuation">,</span> err <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">GetResourceQuota</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> username<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	used<span class="token punctuation">,</span> err <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">GetResourceUsed</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">,</span> username<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">for</span> k <span class="token operator">:=</span> <span class="token keyword">range</span> quota <span class="token punctuation">{</span>
		<span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> ok <span class="token operator">:=</span> used<span class="token punctuation">[</span>k<span class="token punctuation">]</span><span class="token punctuation">;</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
			used<span class="token punctuation">[</span>k<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>ResourceUsedV2<span class="token punctuation">{</span>
				Username<span class="token punctuation">:</span>     username<span class="token punctuation">,</span>
				ResourceType<span class="token punctuation">:</span> k<span class="token punctuation">,</span>
				Quota<span class="token punctuation">:</span>        <span class="token number">0</span><span class="token punctuation">,</span>
				LockQuota<span class="token punctuation">:</span>    <span class="token number">0</span><span class="token punctuation">,</span>
				Status<span class="token punctuation">:</span>       StatusActive<span class="token punctuation">,</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> quota<span class="token punctuation">,</span> used<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>我要实现一个用环境的 username 来查 ResourceInfo 的函数，应当在外封装一层，采用 <code>XXXByEnvId</code> 的方式实现，然后在新的需求里调用这个新的函数，不要对已有逻辑有任何改动</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetResourceInfoByEnvId 获取环境所有者配额信息</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>ResourceV2Controller<span class="token punctuation">)</span> <span class="token function">GetResourceInfoByEnvId</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceQuotaV2<span class="token punctuation">,</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceUsedV2<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	envInstance<span class="token punctuation">,</span> err <span class="token operator">:=</span> envInstanceController<span class="token punctuation">.</span><span class="token function">getEnvInstanceById</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> its<span class="token punctuation">.</span><span class="token function">GetResourceInfo</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envInstance<span class="token punctuation">.</span>Username<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>参数的内置，是对一个已有的函数进行底层替换，例如有一个已知逻辑，他是通过 <code>ctx.UserName()</code> 来进行底层查询</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryThirdPartyToken 查询第三方授权Token</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>DebugResourceController<span class="token punctuation">)</span> <span class="token function">QueryThirdPartyToken</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> origin <span class="token builtin">string</span><span class="token punctuation">,</span>
	deleted <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	token <span class="token operator">:=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">{</span><span class="token punctuation">}</span>
    query <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;origin = ? and username = ?&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>deleted <span class="token punctuation">{</span>
		query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;status = ?&quot;</span><span class="token punctuation">,</span> StatusActive<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> query<span class="token punctuation">.</span><span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>token<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询第三方授权Token失败, origin: %s, username: %s, err: %+v&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
			err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> token<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>我现在想实现一个根据外部传参 username 来查询的函数，如果是侵入式的，我要修改这个函数的入参，然后把已有的所有调用的入参写成 <code>(ctx, origin, deleted, ctx.UserName())</code>，这个改动不可谓不大，侵入式十足</p> <p>但如果我这么改，抽象出一个底层函数</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryThirdPartyToken 查询第三方授权Token</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>DebugResourceController<span class="token punctuation">)</span> <span class="token function">QueryThirdPartyTokenByUsername</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> origin <span class="token builtin">string</span><span class="token punctuation">,</span>
	deleted <span class="token builtin">bool</span><span class="token punctuation">,</span> username <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	token <span class="token operator">:=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">{</span><span class="token punctuation">}</span>
	query <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;origin = ? and username = ?&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> username<span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>deleted <span class="token punctuation">{</span>
		query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;status = ?&quot;</span><span class="token punctuation">,</span> StatusActive<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> query<span class="token punctuation">.</span><span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>token<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询第三方授权Token失败, origin: %s, username: %s, err: %+v&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> username<span class="token punctuation">,</span>
			err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> token<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>然后让已有的函数依赖于这个 <code>XXXByUsername</code> 函数</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryThirdPartyToken 查询第三方授权Token</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>DebugResourceController<span class="token punctuation">)</span> <span class="token function">QueryThirdPartyToken</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> origin <span class="token builtin">string</span><span class="token punctuation">,</span>
	deleted <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">return</span> its<span class="token punctuation">.</span><span class="token function">QueryThirdPartyTokenByUsername</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> origin<span class="token punctuation">,</span> deleted<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>那么，<code>QueryThirdPartyToken</code> 本身就没有了任何侵入性，至于我的需求，直接去调用这个“底层”的 <code>QueryThirdPartyTokenByUsername</code> 就可以了，不可谓不优雅</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/04, 22:59:51</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/7648ae/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">驾驭 AI 编程</div></a> <a href="/pages/aecc6a/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">LSP x MCP 的 SCA 工具</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
