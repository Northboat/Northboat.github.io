WSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">分布式搜索引擎<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="向量数据库与-rag"><a href="#向量数据库与-rag" class="header-anchor">#</a> 向量数据库与 RAG</h2> <p>向量数据库 = 向量检索 + 数据库</p> <h3 id="pgvector"><a href="#pgvector" class="header-anchor">#</a> pgvector</h3> <blockquote><p>Postgres/pgvector</p></blockquote> <p>如果想开始探索向量库，通常建议已经有 Postgres 的人使用 pgvector</p> <p>Postgres 的 B-Link 索引和共享内存</p> <ul><li>PostgreSQL 的底层数据结构，一颗变种的 B+ 树，之前也说过，B+ 是就是一个叶子节点间存在链路的 B 树</li> <li>在 B-Link 树中，每一层中间节点之间同样存在向右的单向链路，这样可以有效避免回退根节点搜索右子树的操作，即可以直接从左子树跳转到右子树以提升检索效率</li></ul> <p>数据库连接（Postmaster 和 Postgres）</p> <ul><li>每个数据库连接都会新起一个后端进程（Postgres），各个后端进程之间相互独立，Postmaster 作为主进程（类似于 Docker Demon），管理各个后端进程的连接和释放</li></ul> <p>共享内存</p> <ul><li>对于每个相互独立的连接 Postgres，我们不可能为他们每一个都维护一个内存区域以供读写，这样太过于浪费，于是在磁盘和后端进程之间会多加一层共享内存</li> <li>后端进程收到读写命令后，会先到共享内存中去进行查找，如果查找失败，则从磁盘中将相关内容读入共享内存</li></ul> <p>WAL（Write Ahead Logging）机制和后台进程 → 解决共享内存与磁盘的同步更新问题</p> <ul><li>其核心原理是：顺序写入比离散写入快无数倍，所以在写入磁盘之前会先顺序写 WAL 日志，等到有充足时间后，再将 WAF 文件依次写入磁盘</li></ul> <p>向量数据库扩展：为了支持多种索引，后端进程中的优化器、执行器以及 Access Methods 被设计为开放接口</p> <ul><li>优化器指 SQL 语句解析后的优化程序</li> <li>执行器指执行具体机器码数据库操作的程序</li> <li>Access Methods 是 PostgreSQL 向后端进程提供的 API</li></ul> <p>通过扩写优化器、执行器插件的形式，PostgreSQL 可以支持多种索引，例如今天的主角 pgvector</p> <h3 id="qdrant"><a href="#qdrant" class="header-anchor">#</a> Qdrant</h3> <blockquote><p><a href="https://superlinked.com/vector-db-comparison" target="_blank" rel="nofollow noopener noreferrer">数据库榜单<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>pgvector 相当不错，但绝对无法在规模上与专门构建的向量数据库（例如 Qdrant、Weaviate 和 Milvus）的性能相提并论常见的向量数据库</p> <ul><li><a href="https://github.com/milvus-io/milvus" target="_blank" rel="nofollow noopener noreferrer">Milvus<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.baidu.com/doc/VDB/s/Wlr8wp591" target="_blank" rel="nofollow noopener noreferrer">VectorDB<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：基于 bRaft 协议库构建，通过了 TLA+ 形式化验证和混沌测试；基于 C++ 编写，使用 bRPC 和 bthread 协程等编程框架构建</li> <li><a href="https://qdrant.org.cn/documentation/" target="_blank" rel="nofollow noopener noreferrer">Qdrant<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="rag-实战"><a href="#rag-实战" class="header-anchor">#</a> RAG 实战</h3> <blockquote><p>文档切分 → 向量检索 → 多路召回 → Re-rank → RAG 评估 → 幻觉抑制</p></blockquote> <p>Audit Agent 的 RAG 整体流程大致如下</p> <ol><li>用户上传文档后，系统会先对文档进行分片处理，把长文档切成若干个 chunk</li> <li>每个 chunk 生成对应的向量（embedding），然后和原始文本一起存入 ElasticSearch</li> <li>用户提问时，系统对问题向量化，在 ES 中执行混合检索（向量检索 + BM25 关键词检索），把召回的相关 chunk 拼接进 prompt，交给大模型生成答案</li> <li>最后通过 WebSocket 流式返回给前端</li></ol> <p>文档 chunk 分片策略：文档分片不是随便切</p> <ul><li>切太短（256～384 token）：上下文严重丢失，语义太碎，回复没有质量</li> <li>切太长（768～1024 token）：当分片长度超过模型上限的 80%，就会导致语义被稀释，embedding 质量下降</li></ul> <p>一般嵌入模型的 token 长度（1 token ≈ 1.2～1.5 个中文字符）</p> <ul><li>中文轻量 embedding 模型（m3e-small/base）：512 token</li> <li>中文强 embedding 模型（bge-large-zh）：512 / 1024 token</li> <li>OpenAI text-embedding-ada-002：8191 token</li></ul> <p>Audit Agent 实践</p> <ul><li>采用固定大小分片（512 token）</li> <li>overlap chunk 分片长度的 25%（一般为 10~25%），保证相邻 chunk 之间有一定内容重叠，避免关键信息刚好落在切割边界上导致要素丢失</li></ul> <p>如何 overlap？滑动窗口切分就行</p> <div class="language-go extra-class"><pre class="language-go"><code>chunks <span class="token operator">:=</span> <span class="token punctuation">[</span>token1<span class="token punctuation">,</span> token2<span class="token punctuation">,</span> <span class="token operator">...</span><span class="token punctuation">,</span> tokenN<span class="token punctuation">]</span>

chunk_size <span class="token operator">:=</span> <span class="token number">512</span>
overlap <span class="token operator">:=</span> <span class="token number">128</span>
step <span class="token operator">:=</span> chunk_size <span class="token operator">-</span> overlap  <span class="token comment">// 实际滑动步长</span>

start <span class="token operator">:=</span> <span class="token number">0</span>
<span class="token keyword">for</span> start <span class="token operator">&lt;</span> <span class="token function">len</span><span class="token punctuation">(</span>chunks<span class="token punctuation">)</span><span class="token punctuation">{</span>
    end <span class="token operator">=</span> start <span class="token operator">+</span> chunk_size
    chunk <span class="token operator">=</span> chunks<span class="token punctuation">[</span>start<span class="token punctuation">:</span>end<span class="token punctuation">]</span>
    <span class="token function">store</span><span class="token punctuation">(</span>chunk<span class="token punctuation">)</span> <span class="token comment">// 保存切片</span>
    start <span class="token operator">+=</span> step
<span class="token punctuation">}</span>
</code></pre></div><p>向量检索的召回效果怎么保证，很多人的回答是”用混合检索，结合 BM25 和语义检索，再加重排序”</p> <ul><li>最早只用纯向量检索，发现对一些包含专有名词的查询效果很差，比如问某个特定型号的参数，语义相似度高但关键词匹配完全失效。后来引入 ES 做 BM25 融合，用 RRF 算法做分数合并，这类精确查询的命中率明显提升了，但对长文本的语义理解反而有点退步，最后在重排序阶段用了一个轻量的 cross-encoder 做补偿</li></ul> <p>“遇到过什么比较难处理的问题” —— 潜台词是：你的工程经验够不够，抗压能力怎么样</p> <h3 id="llm-wiki"><a href="#llm-wiki" class="header-anchor">#</a> LLM Wiki</h3> <p>现在业内的共识是：直接用 LLM 做 grep 比 RAG 性能和效果都好很多，与其费时费力去做切分、向量化、嵌入，不如直接来一个 Skill 直接高效</p> <p>可以考虑这样几个问题</p> <ol><li>文档解析能力：可以用外置的文档解析命令行工具，并告知 Claude 如何使用，让 AI 具备自我解析的能力，</li> <li>文档索引问题：告知 AI 如何建立 Markdown 索引，采用渐进式披露，这是 LLM Wiki 的核心，提供索引构建接口 /build-index</li> <li>文档搜索问题：告知 AI 怎么根据索引 grep 信息，如何全局搜索兜底</li></ol> <p>现成的开源项目：<a href="https://github.com/VectifyAI/PageIndex" target="_blank" rel="nofollow noopener noreferrer">VectifyAI/PageIndex: 📑 PageIndex: Document Index for Vectorless, Reasoning-based RAG<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>思路基本一致，RAG 向量检索 + 语义检索 → 渐进式披露</p> <h2 id="elasticsearch-基础"><a href="#elasticsearch-基础" class="header-anchor">#</a> Elasticsearch 基础</h2> <h3 id="elk-栈"><a href="#elk-栈" class="header-anchor">#</a> ELK 栈</h3> <blockquote><p><a href="https://www.cnblogs.com/buchizicai/p/17093719.html" target="_blank" rel="nofollow noopener noreferrer">ElasticSearch (ES从入门到精通一篇就够了) - 不吃紫菜 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>ELK，Elastic Stack，是以 ElasticSearch 为核心的技术栈，包括 Beats、<strong>Logstash</strong>、Kibana、<strong>ElasticSerach</strong>，被广泛应用在日志数据分析、实时监控等领域</p> <ol><li>数据可视化：Kibana</li> <li>存储、计算、搜索数据：Elasticsearch</li> <li>数据抓取：Logstash、Beats</li></ol> <p>ES 的核心在于倒排索引（相对于关系型数据库的正向索引而言），在模糊搜索时速度很快</p> <p>其核心依仗于 BM25 算法（一开始是 TF-IDF 算法）在 5.1 版本后改为 BM25，其相关分数计算如下</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="67.07ex" height="6.555ex" role="img" focusable="false" viewBox="0 -1562.5 29645.1 2897.2" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-3.02ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D446" d="M308 24Q367 24 416 76T466 197Q466 260 414 284Q308 311 278 321T236 341Q176 383 176 462Q176 523 208 573T273 648Q302 673 343 688T407 704H418H425Q521 704 564 640Q565 640 577 653T603 682T623 704Q624 704 627 704T632 705Q645 705 645 698T617 577T585 459T569 456Q549 456 549 465Q549 471 550 475Q550 478 551 494T553 520Q553 554 544 579T526 616T501 641Q465 662 419 662Q362 662 313 616T263 510Q263 480 278 458T319 427Q323 425 389 408T456 390Q490 379 522 342T554 242Q554 216 546 186Q541 164 528 137T492 78T426 18T332 -20Q320 -22 298 -22Q199 -22 144 33L134 44L106 13Q83 -14 78 -18T65 -22Q52 -22 52 -14Q52 -11 110 221Q112 227 130 227H143Q149 221 149 216Q149 214 148 207T144 186T142 153Q144 114 160 87T203 47T255 29T308 24Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="transl </tr> <tr><td>Schema</td> <td>Mapping</td> <td>Mapping（映射）是索引中文档的约束，例如字段类型约束。类似数据库的表结构（Schema）</td></tr> <tr><td>SQL</td> <td>DSL</td> <td>DSL 是 elasticsearch 提供的JSON风格的请求语句，用来操作 elasticsearch，实现CRUD</td></tr></tbody></table> <p>像操纵 MySQL 的 SQL 语句一样，本质上都是使用 DSL 对 ES 进行 CRUD，无论是命令行还是 API 调用，都是在进行这一工作</p> <h3 id="索引库和文档"><a href="#索引库和文档" class="header-anchor">#</a> 索引库和文档</h3> <p>就是表和数据行的关系</p> <div class="language-go extra-class"><pre class="language-go"><code>索引库<span class="token punctuation">,</span> 文档 <span class="token operator">:=</span> 数据表<span class="token punctuation">,</span> 数据
</code></pre></div><p>索引库用以规定数据的存储格式，例如一个 /hotel 的索引库</p> <div class="language-json extra-class"><pre class="language-json"><code>PUT /hotel
<span class="token punctuation">{</span>
  <span class="token property">&quot;mappings&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;properties&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;id&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;name&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;text&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;analyzer&quot;</span><span class="token operator">:</span> <span class="token string">&quot;ik_max_word&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;address&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;index&quot;</span><span class="token operator">:</span> <span class="token boolean">false</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;price&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;integer&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;score&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;integer&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;brand&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;city&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;starName&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;business&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;location&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;geo_point&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;pic&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;index&quot;</span><span class="token operator">:</span> <span class="token boolean">false</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;all&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;text&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;analyzer&quot;</span><span class="token operator">:</span> <span class="token string">&quot;ik_max_word&quot;</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>而 /hotel/1 这样的文档就对应一个个酒店，他以 /hotel 规定的 Json 格式存储具体数据</p> <h3 id="es-clients"><a href="#es-clients" class="header-anchor">#</a> ES Clients</h3> <p>Java Spring 集成 ES，引入依赖：<a href="https://www.elastic.co/guide/en/elasticsearch/client/index.html" target="_blank" rel="nofollow noopener noreferrer">Elasticsearch Clients | Elastic<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.elasticsearch.client<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>elasticsearch-rest-high-level-client<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>因为 SpringBoot 默认的 ES 版本是 7.6.2，所以我们需要覆盖默认的 ES 版本与自己的版本一致</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>properties</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>java.version</span><span class="token punctuation">&gt;</span></span>1.8<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>java.version</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>elasticsearch.version</span><span class="token punctuation">&gt;</span></span>7.12.1<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>elasticsearch.version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>properties</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>初始化 RestHighLevelClient 并注入 Bean</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Bean</span>
<span class="token keyword">public</span> <span class="token class-name">RestHighLevelClient</span> <span class="token function">client</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">RestHighLevelClient</span><span class="token punctuation">(</span><span class="token class-name">RestClient</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span>
        <span class="token class-name">HttpHost</span><span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token string">&quot;http://192.168.150.101:9200&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>单元测试</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootTest</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">HotelIndexTest</span> <span class="token punctuation">{</span>
    
    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">RestHighLevelClient</span> client<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@BeforeEach</span>
    <span class="token keyword">void</span> <span class="token function">setUp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>client <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">RestHighLevelClient</span><span class="token punctuation">(</span><span class="token class-name">RestClient</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span>
                <span class="token class-name">HttpHost</span><span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token string">&quot;http://192.168.150.101:9200&quot;</span><span class="token punctuation">)</span>
        <span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token annotation punctuation">@Test</span>
    <span class="token keyword">void</span> <span class="token function">test</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token comment">// Do CRUD Test</span>
    <span class="token punctuation">}</span>

    <span class="token annotation punctuation">@AfterEach</span>
    <span class="token keyword">void</span> <span class="token function">tearDown</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">IOException</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>client<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>CRUD 文档库 Hotel，本质上就是拼接字符串和 HTTP 请求，向 ES 数据库发送 DSL 命令，而后 ES 返回执行结果，ES 的查询 DSL 类似 SQL 的编写，同样有很多查询条件和复合嵌套规则</p> <h3 id="业务场景"><a href="#业务场景" class="header-anchor">#</a> 业务场景</h3> <p>Baidu Elasticsearch</p> <ul><li>搜索场景：单片 10-20 GB，默认一片</li> <li>日志分析场景：单片 30 GB，默认一片</li></ul> <p>日志数据流向</p> <div class="language-bash extra-class"><pre class="language-bash"><code>日志数据 ➡️ FileBeat ➡️ Kafka ➡️ Logstash ➡️ Elasticsearch ➡️ Kibana
</code></pre></div><p>如何确定索引数量</p> <ol><li>日志类型：建议按照时间维度进行创建，例如天/月/日，方便对数据进行清理</li> <li>搜索类型：建议注意控制单个分片的大小以及单节点上的分片个数</li></ol> <p>手动创建索引是个好习惯，尽可能养成使用模板 template 的习惯</p> <p>索引数量上限</p> <ol><li>单节点分片个数不建议超过 1000</li> <li>磁盘使用率控制在 75% 以下</li></ol> <p>是否需要副本？服务高可用 vs 数据高可用</p> <h3 id="一致性保证"><a href="#一致性保证" class="header-anchor">#</a> 一致性保证</h3> <blockquote><p>Raft 算法</p></blockquote> <p>参考文献</p> <ol><li><a href="https://cloud.tencent.com/developer/article/1525566" target="_blank" rel="nofollow noopener noreferrer">10 分钟弄懂 Raft 算法<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://raft.github.io/raft.pdf" target="_blank" rel="nofollow noopener noreferrer">In Search of an Understandable Consensus Algorithm<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ol> <p>Raft集群包含多个服务器，5个服务器是比较典型的，允许系统容忍两个故障。在任何给定时间，每个服务器都处于以下三种状态之一，领导者（Leader），追随者（Follower）或候选人（Candidate）。 这几个状态见可以相互转换</p> <ul><li>Leader：处理所有客户端交互，日志复制等，一般一次只有一个 Leader</li> <li>Follower：类似选民，完全被动</li> <li>Candidate：类似 Proposer 律师，可以被选为一个新的领导人</li></ul>
