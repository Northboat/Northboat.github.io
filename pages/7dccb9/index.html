cOperateOption 环境操作鉴权配置</span>

<span class="token comment">// 默认仅允许环境属主和管理员操作；传入协作鉴权选项后，可按角色放行协作成员。</span>
<span class="token keyword">type</span> AllocOperateOpt <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token operator">*</span>AllocOperateOption<span class="token punctuation">)</span>

<span class="token comment">// WithCollaboratorAuth 配置协作成员鉴权</span>
<span class="token keyword">func</span> <span class="token function">WithCollaboratorAuth</span><span class="token punctuation">(</span>envID<span class="token punctuation">,</span> role <span class="token builtin">string</span><span class="token punctuation">)</span> AllocOperateOpt <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token keyword">func</span><span class="token punctuation">(</span>o <span class="token operator">*</span>AllocOperateOption<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		o<span class="token punctuation">.</span>EnvID <span class="token operator">=</span> envID

	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>在现有函数中使用变长的函数入参 <code>opt ...AllocOperateOpt</code>，这样做的好处是</p> <ul><li>对原有函数无侵入式，不影响已有调用逻辑</li> <li>新增的参数可读性极佳，相较于 <code>args ...string</code> 的方式，实现了一个有名字的强类型参数</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// AllocOperate 校验当前用户是否允许操作环境，owner 为环境属主，AllocOperateOpt 为协作环境选项</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">AllocOperate</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> owner <span class="token builtin">string</span><span class="token punctuation">,</span> opt <span class="token operator">...</span>AllocOperateOpt<span class="token punctuation">)</span> <span class="token punctuation">(</span>err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> owner <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;环境属主不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	opts <span class="token operator">:=</span> <span class="token operator">&amp;</span>AllocOperateOption<span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> o <span class="token operator">:=</span> <span class="token keyword">range</span> opt <span class="token punctuation">{</span>
		<span class="token function">o</span><span class="token punctuation">(</span>opts<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	username <span class="token operator">:=</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> username <span class="token operator">==</span> owner <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> ok<span class="token punctuation">,</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">IsAdmin</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> ok <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>EnvID <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">&amp;&amp;</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>ForbiddenErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;你无权限操作环境，环境所有人:%s&quot;</span><span class="token punctuation">,</span> owner<span class="token punctuation">)</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warn</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>EnvID <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">||</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;协作环境和协作角色不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">!=</span> Manager <span class="token operator">&amp;&amp;</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">!=</span> Collaborator <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;不支持的协作鉴权角色:%s&quot;</span><span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>collaboratorController<span class="token punctuation">.</span><span class="token function">AllocCollaborate</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> username<span class="token punctuation">,</span> opts<span class="token punctuation">.</span>EnvID<span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>ForbiddenErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;你无权限操作环境，当前协作权限不足，所需权限: %s&quot;</span><span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warn</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br></div></div><p>在业务中增加 Collaborator 参数逻辑</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// StartWebIde 启动web ide</span>

	<span class="token keyword">if</span> err <span class="token operator">=</span> envInstanceController<span class="token punctuation">.</span><span class="token function">AllocOperate</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> environmentInstance<span class="token punctuation">.</span>Username<span class="token punctuation">,</span> <span class="token function">WithCollaboratorAuth</span><span class="token punctuation">(</span>environmentInstance<span class="token punctuation">.</span>Uid<span class="token punctuation">,</span> Collaborator<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	c <span class="token operator">:=</span> GitIdeController<span class="token punctuation">{</span><span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><h3 id="参数外置-内置"><a href="#参数外置-内置" class="header-anchor">#</a> 参数外置 / 内置</h3> <p>参数外置很 easy，就是在外封装一层，假设我已有一个函数逻辑</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetResourceInfo 获取用户资源配额信息</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>ResourceV2Controller<span class="token punctuation">)</span> <span class="token function">GetResourceInfo</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	username <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceQuotaV2<span class="token punctuation">,</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceUsedV2<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	quota<span class="token punctuation">,</span> err <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">GetResourceQuota</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> username<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	used<span class="token punctuation">,</span> err <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">GetResourceUsed</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">,</span> username<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">for</span> k <span class="token operator">:=</span> <span class="token keyword">range</span> quota <span class="token punctuation">{</span>
		<span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> ok <span class="token operator">:=</span> used<span class="token punctuation">[</span>k<span class="token punctuation">]</span><span class="token punctuation">;</span> <span class="token operator">!</span>ok <span class="token punctuation">{</span>
			used<span class="token punctuation">[</span>k<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>ResourceUsedV2<span class="token punctuation">{</span>
				Username<span class="token punctuation">:</span>     username<span class="token punctuation">,</span>
				ResourceType<span class="token punctuation">:</span> k<span class="token punctuation">,</span>
				Quota<span class="token punctuation">:</span>        <span class="token number">0</span><span class="token punctuation">,</span>
				LockQuota<span class="token punctuation">:</span>    <span class="token number">0</span><span class="token punctuation">,</span>
				Status<span class="token punctuation">:</span>       StatusActive<span class="token punctuation">,</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> quota<span class="token punctuation">,</span> used<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>我要实现一个用环境的 username 来查 ResourceInfo 的函数，应当在外封装一层，采用 <code>XXXByEnvId</code> 的方式实现，然后在新的需求里调用这个新的函数，不要对已有逻辑有任何改动</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetResourceInfoByEnvId 获取环境所有者配额信息</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>ResourceV2Controller<span class="token punctuation">)</span> <span class="token function">GetResourceInfoByEnvId</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceQuotaV2<span class="token punctuation">,</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ResourceUsedV2<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	envInstance<span class="token punctuation">,</span> err <span class="token operator">:=</span> envInstanceController<span class="token punctuation">.</span><span class="token function">getEnvInstanceById</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> its<span class="token punctuation">.</span><span class="token function">GetResourceInfo</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envInstance<span class="token punctuation">.</span>Username<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>参数的内置，是对一个已有的函数进行底层替换，例如有一个已知逻辑，他是通过 <code>ctx.UserName()</code> 来进行底层查询</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryThirdPartyToken 查询第三方授权Token</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>DebugResourceController<span class="token punctuation">)</span> <span class="token function">QueryThirdPartyToken</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> origin <span class="token builtin">string</span><span class="token punctuation">,</span>
	deleted <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	token <span class="token operator">:=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">{</span><span class="token punctuation">}</span>
    query <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;origin = ? and username = ?&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>deleted <span class="token punctuation">{</span>
		query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;status = ?&quot;</span><span class="token punctuation">,</span> StatusActive<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> query<span class="token punctuation">.</span><span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>token<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询第三方授权Token失败, origin: %s, username: %s, err: %+v&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
			err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> token<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>我现在想实现一个根据外部传参 username 来查询的函数，如果是侵入式的，我要修改这个函数的入参，然后把已有的所有调用的入参写成 <code>(ctx, origin, deleted, ctx.UserName())</code>，这个改动不可谓不大，侵入式十足</p> <p>但如果我这么改，抽象出一个底层函数</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryThirdPartyToken 查询第三方授权Token</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>DebugResourceController<span class="token punctuation">)</span> <span class="token function">QueryThirdPartyTokenByUsername</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> origin <span class="token builtin">string</span><span class="token punctuation">,</span>
	deleted <span class="token builtin">bool</span><span class="token punctuation">,</span> username <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	token <span class="token operator">:=</span> <span class="token operator">&amp;</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">{</span><span class="token punctuation">}</span>
	query <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;origin = ? and username = ?&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> username<span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>deleted <span class="token punctuation">{</span>
		query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;status = ?&quot;</span><span class="token punctuation">,</span> StatusActive<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> query<span class="token punctuation">.</span><span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>token<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询第三方授权Token失败, origin: %s, username: %s, err: %+v&quot;</span><span class="token punctuation">,</span> origin<span class="token punctuation">,</span> username<span class="token punctuation">,</span>
			err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> token<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>然后让已有的函数依赖于这个 <code>XXXByUsername</code> 函数</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryThirdPartyToken 查询第三方授权Token</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>DebugResourceController<span class="token punctuation">)</span> <span class="token function">QueryThirdPartyToken</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> origin <span class="token builtin">string</span><span class="token punctuation">,</span>
	deleted <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>table<span class="token punctuation">.</span>ThirdPartyToken<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">return</span> its<span class="token punctuation">.</span><span class="token function">QueryThirdPartyTokenByUsername</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> origin<span class="token punctuation">,</span> deleted<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>那么，<code>QueryThirdPartyToken</code> 本身就没有了任何侵入性，至于我的需求，直接去调用这个“底层”的 <code>QueryThirdPartyTokenByUsername</code> 就可以了，不可谓不优雅</p> <h3 id="配置化前端"><a href="#配置化前端" class="header-anchor">#</a> 配置化前端</h3> <p>通过后端 rainbow 动态配置前端下拉框内容，前端启动时一次性拉取配置</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">codev.dind.version.options</span><span class="token punctuation">:</span> <span class="token string">'{&quot;options&quot;:[{&quot;label&quot;:&quot;19.03.15-dind&quot;,&quot;value&quot;:&quot;19.03.15-dind&quot;},{&quot;label&quot;:&quot;26.1.3-dind&quot;,&quot;value&quot;:&quot;26.1.3-dind&quot;}],&quot;default&quot;:&quot;26.1.3-dind&quot;}'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>options 这样处理不太可读，也不好维护</li> <li>options 前端拿到版本自己处理，不在后端存这种前端数据</li></ul> <p>通过数组的方式只存版本信息，交由前端解析和拼装</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">codev.dind.version.options</span><span class="token punctuation">:</span> <span class="token string">'[&quot;19.03.15-dind&quot;, &quot;26.1.3-dind&quot;]'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>为啥要改成这样呢？json.parse 这个操作就有风险，加入了复杂性，比如我少写一个引号，你前端就解析不了了，我觉得直接字符串分号分隔是最简单的</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">codev.dind.version.options</span><span class="token punctuation">:</span> <span class="token string">&quot;19.03.15-dind;26.1.3-dind&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>前端拿完整的字符串，通过 <code>;</code> 自己分割展示，越简单的设计，越不容易报错</p> <h3 id="hook-编码"><a href="#hook-编码" class="header-anchor">#</a> Hook 编码</h3> <p>通过钩子的方式去实现业务逻辑，例如在请求经过网关时加一个钩子去进行日志统计，非侵入式的标准为：不需要项目本体发布就可以实现业务需求</p> <p>又例如 Java Agent 的非侵入式探针实现插桩追踪，但注意 Spring 的 APO 绝非非侵入式，只能说侵入式比较小</p> <h2 id="防御性编程"><a href="#防御性编程" class="header-anchor">#</a> 防御性编程</h2> <h3 id="不要相信上游"><a href="#不要相信上游" class="header-anchor">#</a> 不要相信上游</h3> <p>对于调用你服务的人，不要相信他的任何传参</p> <h3 id="不要相信依赖"><a href="#不要相信依赖" class="header-anchor">#</a> 不要相信依赖</h3> <p>对于你要调用的服务，不要相信他的任何可靠性支持，预留一个灰度配置开关做兜底处理</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/08, 23:26:12</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/8aaaf4/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">渗透基础</div></a> <a href="/pages/ede82a/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">套接字编程</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
