></tr> <tr><td>[4]</td> <td>√</td> <td>√</td> <td>√</td> <td>√</td> <td>√</td> <td>×</td></tr></tbody></table> <h3 id="hash-lock"><a href="#hash-lock" class="header-anchor">#</a> Hash Lock</h3> <h4 id="hash-lock-2"><a href="#hash-lock-2" class="header-anchor">#</a> Hash-Lock</h4> <blockquote><p>RFID Systems and Security and Privacy Implications</p></blockquote> <p>一种基于哈希函数的简单加密协议，主要用于数据保护和访问控制。它的核心思想是使用哈希值作为一种“锁”，而原始数据的对应信息（如密码或密钥）作为“钥匙”，以便在符合条件时解锁数据</p> <p>非常简单的协议，首先，系统根据一个随机键生成一个哈希值并写入标签内存，这个哈希值作为这个标签的锁</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="17.619ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 7787.6 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D459" d="M117 59Q117 26 142 26Q179 26 205 131Q211 151 215 152Q217 153 225 153H229Q238 153 241 153T246 151T248 144Q247 138 245 128T234 90T214 43T183 6T137 -11Q101 -11 70 11T38 85Q38 97 39 102L104 360Q167 615 167 623Q167 626 166 628T162 632T157 634T149 635T141 636T132 637T122 637Q112 637 109 637T101 638T95 641T94 647Q94 649 96 661Q101 680 107 682T179 688Q194 689 213 690T243 693T254 694Q266 694 266 686Q266 675 193 386T118 83Q118 81 118 75T117 65V59Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(298,0)"><path data-c="1D45C" d="M201 -11Q126 -11 80 38T34 156Q34 221 64 279T146 380Q222 441 301 441Q333 441 341 440Q354 437 367 433T402 417T438 387T464 338T476 268Q476 161 390 75T201 -11ZM121 120Q121 70 147 48T206 26Q250 26 289 58T351 142Q360 163 374 216T388 308Q388 352 370 375Q346 405 306 405Q243 405 195 347Q158 303 140 230T121 120Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(783,0)"><path data-c= r:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>l</mi><mi>o</mi><mi>c</mi><mi>k</mi><mo>=</mo><mi>H</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><mi>k</mi><mi>e</mi><mi>y</mi><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>在需要进行认证时，读写器将凭证 k 发送给标签，标签计算 Hash(k) 是否等于自身存储的 lock，若相同则认证通过</p> <img src="/assets/img/image-20241117172508275.9541648b.png"> <h4 id="randomized-hash-lock"><a href="#randomized-hash-lock" class="header-anchor">#</a> Randomized Hash-Lock</h4> <blockquote><p>Security and privacy aspects of low-cost radio frequency identification systems</p></blockquote> <p>在简单的 Hash-Lock 中，meta ID 会导致追踪攻击，于是引入额外的随机操作</p> <p>这是一个双向认证</p> <img src="/assets/img/image-20241117173301301.79b78d24.png"> <p>当收到查询请求后</p> <ul><li>标签生成一个随机数 R，与标签 ID 联结后进行哈希，得到哈希值 H，而后将随机数 R 和 H 一同发给读写器进行认证</li> <li>后端收到 R 和 H 后，将遍历所有的 ID'，将 ID' 和 R 联结并哈希得到 H'，若 H = H'，则说明当前使用的 ID' 为标签的 ID</li> <li>当读写器发送回标签的 ID' 等于标签 ID 时，本次认证通过</li></ul> <p>这样的联结并不是唯一的办法，文中还提供了这样两种混淆的方案</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="40.31ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 17817 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(389,0)"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 41  50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(562,413) scale(0.707)"><path data-c="2032" d="M79 43Q73 43 52 49T30 61Q30 68 85 293T146 528Q161 560 198 560Q218 560 240 545T262 501Q262 496 260 486Q259 479 173 263T84 45T79 43Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(562,-247) scale(0.707)"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msub><mi>a</mi><mi>i</mi></msub><mover><mrow data-mjx-texclass="OP"><mo>=</mo></mrow><mo>?</mo></mover><mo data-mjx-texclass="NONE">⁡</mo><msubsup><mi>a</mi><mi>i</mi><mo data-mjx-alternate="1">′</mo></msubsup></math></mjx-assistive-mml></mjx-container><p>若相等则认证成功，将服务器中的存储标签 ID 发送给标签，若 ID 符合，则标签进行密钥更新</p> <p>这一方案具备不可分辨性，并且是前向保密的</p> <ul><li>攻击者知道标签的输出 a，无法推知密钥 s</li> <li>攻击者知道当前密钥 s(i)，无法得知之前任意一轮的密钥（基于单向散列函数的特性）</li></ul> <p>这得益于单向散列函数（H 和 G）的特性</p> <h3 id="ya-trap-协议"><a href="#ya-trap-协议" class="header-anchor">#</a> YA-TRAP 协议</h3> <blockquote><p>YA-TRAP: Yet another trivial RFID authentication protocol</p></blockquote> <p>利用简单的哈希函数和随机数生成器（PRNG）来实现标签和读写器之间的双向认证。其核心机制是通过哈希值验证标签的合法性，同时通过随机数实现认证会话的唯一性，从而防止重放攻击</p> <p>本文的模型中，标签被三个变量初始化，分别是 Ki、T0 和 Tmax，其中</p> <ul><li>Ki 作为标签的唯一标识，同时作为加密的密钥（为了满足消息认证码 MAC 的要求，在实践中需要 160 位）</li> <li>T0 是标签的初始时间戳，他的位大小取决于时间粒度和可被身份认证的次数</li> <li>Tmax 是时间戳上限，可用于限定标签的认证次数</li></ul> <p>同时，每个标签具备一个 PRNG（pseudo-random number generator），即伪随机数生成器</p> <p>YA-TRAP Protocol 认证步骤</p> <img src="/assets/img/image-20241118210536815.5799cad2.png"> <p>就是一个基于时间戳的消息认证码，Tr 为当前的时间戳，随机数</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="8.051ex" height="2.866ex" role="img" focusable="false" viewBox="0 -965.2 3558.3 1266.8" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.682ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(751,0)"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 6  46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(882,-150) scale(0.707)"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mo" transform="translate(5075.9,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>P</mi><mi>R</mi><mi>N</mi><msub><mi>G</mi><mi>i</mi></msub><mo stretchy="false">(</mo><msub><mi>K</mi><mi>i</mi></msub><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>即以密钥 Ki 为种子生成的随机数</p> <p>显然，只有合法的读写器能够从数据库中查询哈希表，天然对 reader 进行了认证。其次，标签每次的响应通过 Ki 对变化的时间戳 Tr 进行加密散列，保证响应安全性和动态性</p> <ul><li>有点像 TOTP（这不就是 TOTP？）</li></ul> <h2 id="重量级协议"><a href="#重量级协议" class="header-anchor">#</a> 重量级协议</h2> <blockquote><p>重量级安全认证协议也被部分文献命名为完备 RFID 安全认证协议，主要分为对称加密算法和非对称加密算法</p></blockquote> <p>目前基于非对称算法的 RFID 协议主要采用椭圆曲线密码体制（Elliptic Curve Cryptography, ECC）[1-3] 。与 RSA [4] 密码体制相比，ECC 算法速度更快、体积更小、功耗更低，因此更适合于 RFID 系统</p> <ul><li>[1] Y.-P. Liao, C.-M. Hsiao. A secure ECC-based RFID authentication scheme integrated with ID-verifier transfer protocol[J]. Ad Hoc Networks, 2014, 18: 133-146</li> <li>[2] C. Jin, C. Xu, X. Zhang, et al. A secure RFID mutual authentication protocol for healthcare environments using elliptic curve cryptography[J]. Journal of medical systems, 2015, 39, (3): 24</li> <li>[3] M. S. Farash, O. Nawaz, K. Mahmood, et al. A provably secure RFID authentication protocol based on elliptic curve for healthcare environments[J]. Journal of medical systems, 2016, 40, (7): 165</li> <li>[4] Golle P,Jakobsson M,Juels A,et al.Universal re-encryption for mixnets[C]∥Proc of Cryptographers' Track at the RSA Conference,2004:163-178</li></ul> <p>不同研究人员利用 ECC 为 RFID 认证提供服务，并采用了不同的加密和认证方法。大多数研究表明，只使用一种 ECC 算法的安全认证协议只能提供单向认证，且整个系统容易受到攻击。随着第 2 个 ECC 算法的安全认证协议的加入，双向认证达成，为系统整体提供了更好的安全性。2 个 ECC 安全认证协议耦合的不同导致各个安全认证协议的效率与安全性有差异</p> <p>虽然 ECC 在计算速度与功耗等方面在非对称密码体制中具有明显的优势，但将其应用于资源受限的 RFID 系统中仍然显得比较勉强。于是安全性稍弱但功耗与计算速度具有明显优势的对称加密算法被引入 RFID 安全协议中，其中典型的方案有 Feldhofer 等人提出的基于 AES（Advance Encryption Standard）的协议 [5] 和 Kaps 提出的基于 XTEA（Extended Tiny Encryption Algorithm） 的协议 [6] 等</p> <ul><li>[5] M. Feldhofer, S. Dominikus, J. Wolkerstorfer. Strong authentication for RFID systems using the AES algorithm[C]. International Workshop on Cryptographic Hardware and Embedded Systems, 2004, 357-370</li> <li>[6] J.-P. Kaps. Chai-tea, cryptographic hardware implementations of xtea[C]. International Conference on Cryptology in India, 2008, 363-375</li></ul> <p>回顾一下公钥密码体系</p> <table><thead><tr><th><strong>特性</strong></th> <th><strong>RSA</strong></th> <th><strong>ElGamal</strong></th> <th><strong>ECC</strong></th></tr></thead> <tbody><tr><td><strong>数学基础</strong></td> <td>大整数分解问题</td> <td>离散对数问题</td> <td>椭圆曲线上的离散对数问题</td></tr> <tr><td><strong>加密/解密原理</strong></td> <td>指数和模运算</td> <td>指数和模运算，增加随机性</td> <td>椭圆曲线上的点加法和点乘</td></tr> <tr><td><strong>密钥长度</strong></td> <td>较长</td> <td>较长</td> <td>更短，同等安全性下需要的密钥长度更小</td></tr> <tr><td><strong>效率</strong></td> <td>加密慢、解密快（相较 ElGamal）</td> <td>加密快、解密慢</td> <td>加密和解密均快，适合低功耗设备</td></tr> <tr><td><strong>随机性需求</strong></td> <td>不需要随机数</td> <td>需要随机数</td> <td>需要随机数（如签名和加密中的 kkk）</td></tr> <tr><td><strong>密文长度</strong></td> <td>与密钥长度一致</td> <td>密文长度较长</td> <td>密文较短，更适合资源受限环境</td></tr> <tr><td><strong>主要用途</strong></td> <td>加密、签名、数字证书</td> <td>加密、签名</td> <td>加密、签名、密钥交换、区块链和物联网</td></tr></tbody></table> <h3 id="基于-elgamal"><a href="#基于-elgamal" class="header-anchor">#</a> 基于 ElGamal</h3> <blockquote><p>Universal re-encryption for mixnets</p></blockquote> <p>传统的随机公钥密码系统由三个算法组成，CS = (KG, E, D)，分别用于密钥生成、加密和解密，具体而言</p> <ul><li>密钥生成：KG → (PK, SK)</li> <li>加密：E(m, r, PK) → C，其中 E 为加密函数，m 为明文消息，r 是随即参数，PK 为公钥</li> <li>解密：D(SK, C)，需要私钥、密文和解密函数</li></ul> <p>语义安全：从相应密文中学习明文所有信息是不可行的</p> <p>重加密即，在不知道明文信息的情况下，对密文 C 进行重新加密，并且不影响后续的解密操作</p> <ul><li>Re(C, r, PK) → C'</li> <li>D(SK, C') = m</li></ul> <p>文中提出了一个具有通用重加密的公钥密码系统，可以基于在任何合适的代数群上实现的 ElGamal 密码系统。基本思想很简单：我们将标准 ElGamal 密文附加到身份元素上的第二个密文。通过利用ElGamal的代数同态，我们可以使用第二个密文来改变第一个密文中的加密因子。因此，我们可以在重加密操作中分配公钥的知识。如前所述，这种结构与标准 ElGamal 一样有效</p> <p>1、密钥生成</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="32.124ex" height="2.347ex" role="img" focusable="false" viewBox="0 -750 14198.7 1037.2" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.65ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data mml></mjx-container><h3 id="基于-ecc"><a href="#基于-ecc" class="header-anchor">#</a> 基于 ECC</h3> <p>Elliptic Curve Cryptography 是一种基于椭圆曲线数学结构的密码学体系</p> <h4 id="schnorr-protocol"><a href="#schnorr-protocol" class="header-anchor">#</a> Schnorr Protocol</h4> <blockquote><p>RFID-tags for anti-counterfeiting</p></blockquote> <p>单密钥的 ECC 认证变体</p> <img src="/assets/img/image-20241113130344973.f4de2c71.png"> <p>攻击者可以使用 ZT 来跟踪目标标签。换句话说，Tuyls 等人的方案容易受到位置跟踪攻击。此外，攻击者获取特定标签的交换消息 {X, e, y} 和公钥 ZT</p> <h4 id="okamoto-protocol"><a href="#okamoto-protocol" class="header-anchor">#</a> Okamoto Protocol</h4> <blockquote><p>Public-key cryptography for RFID tags</p></blockquote> <p>双密钥结构</p> <img src="/assets/image-20241113130455425.png"> <p>双密钥增强了安全性，但仍可计算得到公钥 Zt，导致标签可追踪。同时，Batina 等人的方案也存在可扩展性问题和前向保密</p> <h4 id="ec-rac-protocol"><a href="#ec-rac-protocol" class="header-anchor">#</a> EC-RAC Protocol</h4> <blockquote><p>EC-RAC (ECDLP Based Randomized Access Control): Provably Secure RFID Authentication Protocol</p></blockquote> <p>改进的双密钥</p> <img src="/assets/img/image-20241113130837274.8c949f94.png"> <p>由于相应结果可以是特定标签的固定值，因此攻击者可以跟踪标签。此外， Bringer 等人展示了如何跟踪如果攻击者两次拦截相同的标签，并且如果标签被被动窃听三次，则可以冒充标签。同样，他们的协议只考虑标签到读者的身份验证，不包括读者到标签身份验证。这使得标签容易受到恶意查询的影响</p> <ul><li>如果没有双向认证，恶意查询是可行的</li></ul> <h4 id="ecdlp-rk-protocol"><a href="#ecdlp-rk-protocol" class="header-anchor">#</a> ECDLP-RK Protocol</h4> <blockquote><p>An ECDLP-Based Randomized Key RFID Authentication Protocol</p></blockquote> <p>对 EC-RAC 的改进，多引入了一个随机数</p> <img src="/assets/img/image-20241113131346350.bab71cd4.png"> <p>在这种方案下，即使攻击者知道 r3 和 xT'P，他们仍然无法获得关于 xT 的任何信息。此外，当随机 r3 时，攻击者也无法跟踪 ZT'。但随着认证添加到更新数据库中，这种动作会随着后台服务器的消耗而增加。在这种情况下，Zhang 等人的方案会导致可扩展性问题。此外，Zhang 等人的方案也缺乏双向认证</p> <h4 id="liao-hsiao-scheme"><a href="#liao-hsiao-scheme" class="header-anchor">#</a> Liao &amp; Hsiao Scheme</h4> <blockquote><p>A secure ECC-based RFID authentication scheme integrated with ID-verifier transfer protocol</p></blockquote> <img src="/assets/img/image-20241113132314815.4b00b33a.png"> <h2 id="发展与展望"><a href="#发展与展望" class="header-anchor">#</a> 发展与展望</h2> <p>安全性分析</p> <ul><li><strong>隐私性</strong>：数据加密传输</li> <li><strong>匿名性/抗追踪</strong>：是否引入随机数产生响应</li> <li><strong>欺骗攻击</strong>：通过以往数据伪造标签</li> <li><strong>重放攻击</strong></li> <li><strong>可扩展性</strong>：服务器密钥搜索开销</li> <li><strong>中间人攻击</strong>：常见于单向认证，包括恶意查询</li> <li><strong>拒绝服务攻击</strong></li> <li><strong>去同步攻击</strong>：属于DOS攻击的一种，通过使服务器和标签的密钥不同步而让标签拒绝提供服务</li> <li><strong>双向认证</strong>：标签认证读写器，服务器认证标签</li> <li><strong>前向保密</strong>：是否存在密钥更新策略，更新策略是否单向</li></ul> <p>对在格上的轻量加密，如 LPN 问题、LWE 问题、同态加密等，比较感兴趣</p> <ul><li>与区块链技术的结合，不管是去中心化的思想还是加密方式，都可以借鉴</li></ul> <p>在轻量加密中，与 PUF 的结合有一定的讨论价值</p> <p>然后是常见的哈希、ECC 加密、双线性配对等</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/1e89ae/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">RFID 认证综述（一）</div></a> <a href="/pages/752eb6/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">基于 Pairing 的 SE 算法仿真</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
