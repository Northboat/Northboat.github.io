i> <li>分片架构（Sharding）：适用于高并发场景，如 Elasticsearch 数据分片</li> <li>微服务架构（Microservices）：适用于企业级应用，如 Spring Cloud/Dubbo</li> <li>事件驱动架构（EDA, Event-Driven Architecture）：适用于高吞吐业务，如 Kafka 消息队列处理日志流</li></ol> <p>在这些架构模式之上，构建了一个个所谓的分布式系统，如最常见的应用淘宝、京东等，都是采用<strong>微服务架构</strong>的分布式系统</p> <p>通常，Spring 小子（没错就是我）开发的所谓分布式系统，都是指的微服务架构（Spring Cloud）上的分布式系统</p> <h3 id="为什么分布式设计"><a href="#为什么分布式设计" class="header-anchor">#</a> 为什么分布式设计</h3> <p>分布式系统的核心特点</p> <ul><li>多机协作：任务由多个计算机协作完成，而非单机处理</li> <li>数据共享：不同节点之间共享数据，可能涉及数据一致性问题</li> <li>去中心化：避免单点故障，提高系统可用性</li> <li>并发性：多个节点可以并行处理任务，提高吞吐量</li> <li>容错能力：某些节点宕机时，系统仍能继续运行</li></ul> <p>说白了，就是扩展性好、稳定性高、容错强 —— 所谓“狡兔三窟”</p> <p>云计算架构下，软件、平台和基础设施都被视作服务 Service</p> <ul><li>SaaS：Software as a Service 软件即服务</li> <li>Paas：Platform as a Service 平台即服务</li> <li>IaaS：Infrastructure as a Service 基础设施即服务</li></ul> <h3 id="云原生之于分布式"><a href="#云原生之于分布式" class="header-anchor">#</a> 云原生之于分布式</h3> <p>云原生是一种概念，各个地方的定义不尽相同，但总是包含以下关键词</p> <ul><li>微服务</li> <li>容器化</li> <li>DevOps</li> <li>持续交付</li></ul> <p>我们说，云原生中并没有分布式的概念，云原生让分布式变得透明但实际上无处不在，系统被拆分成一个个小的云服务</p> <p>云原生用持续交付代替瀑布开发，采用小步快跑的方式进行开发，并且由于模块化程度极高，提供极高的服务弹性</p> <ul><li>与传统单体服务相比，例如一个企业化的 Java 系统，存在思想上、根本上的差异</li></ul> <p>其目的和软件设计的目标一致：高内聚低耦合（这同样是 DDD 领域驱动设计的目标）</p> <h2 id="soa-和微服务"><a href="#soa-和微服务" class="header-anchor">#</a> SOA 和微服务</h2> <h3 id="soa-和-service-mesh"><a href="#soa-和-service-mesh" class="header-anchor">#</a> SOA 和 Service Mesh</h3> <p>Service Oriented Architecture，面向服务架构，是一种通过服务接口将应用程序功能模块化的架构风格。它旨在实现服务的松耦合、复用性和灵活性，适用于复杂企业级应用的开发和集成。SOA 的核心思想是将业务逻辑分解为独立的服务模块，这些服务通过标准化接口进行通信，支持跨平台和跨技术栈的协作</p> <p>简单来说，SOA 将服务拆分，但这里的拆分不同于先入为主的微服务，他的粒度大很多，通常是大系统之间的耦合</p> <p>通常依赖如下技术</p> <ol><li>SOAP：基于 XML 的协议，适用于需要高安全性和事务支持的场景</li> <li>REST：轻量级协议，使用 HTTP 和 JSON，适合快速开发和互联网应用</li> <li>服务注册中心：如 UDDI、Eureka，用于服务的动态注册与发现</li> <li>企业服务总线（ESB）：用于服务的编排、路由和协议转换，简化系统集成</li></ol> <p>显然，SOA 和微服务都基于服务模块化思想，但存在差异</p> <ol><li>粒度：SOA 服务粒度较大，微服务粒度更小</li> <li>通信方式：SOA 通常使用 SOAP 或 ESB，微服务偏向 REST 和消息队列</li> <li>数据管理：SOA 常使用共享数据库，微服务强调独立数据库</li> <li>适用场景：SOA 适合复杂企业集成，微服务更适合快速迭代的互联网应用</li></ol> <p>最大的差别来自于服务的拆分粒度</p> <h3 id="spring-cloud-微服务"><a href="#spring-cloud-微服务" class="header-anchor">#</a> Spring Cloud 微服务</h3> <p>刚刚也说到，Spring Cloud 是 Java 生态中最成熟的<strong>微服务架构</strong>解决方案之一</p> <ul><li>微服务架构（Microservices Architecture） 是一种软件架构风格，它将应用拆分为多个独立运行的服务，每个服务负责单一业务功能，服务之间通过 API（通常是 HTTP + JSON 或 RPC）进行通信</li></ul> <p>Spring Cloud 就是专门用于构建、管理和维护微服务架构的框架，提供了一整套完整的微服务架构解决方案，涵盖服务注册发现、负载均衡、配置管理、熔断限流、分布式链路追踪等关键功能</p> <table><thead><tr><th>组件</th> <th>作用</th> <th>具体而言</th></tr></thead> <tbody><tr><td>Spring Cloud Eureka</td> <td>服务注册与发现</td> <td>负责管理微服务实例，类似于 DNS</td></tr> <tr><td>Spring Cloud LoadBalancer</td> <td>负载均衡</td> <td>让多个实例均衡接收请求</td></tr> <tr><td>Spring Cloud OpenFeign</td> <td>服务调用</td> <td>通过 HTTP 远程调用其他微服务</td></tr> <tr><td>Spring Cloud Gateway</td> <td>API 网关</td> <td>统一流量入口，路由请求并提供安全控制</td></tr> <tr><td>Spring Cloud Config</td> <td>配置管理</td> <td>统一管理分布式系统的配置</td></tr> <tr><td>Spring Cloud Sleuth &amp; Zipkin</td> <td>分布式链路追踪</td> <td>监控请求的调用链路，排查性能瓶颈</td></tr> <tr><td>Spring Cloud Resilience4J</td> <td>熔断限流</td> <td>保护服务避免雪崩效应（Circuit Breaker）</td></tr> <tr><td>Spring Cloud Stream</td> <td>消息队列</td> <td>让服务间异步通信（支持 Kafka、RabbitMQ）</td></tr></tbody></table> <p>一个经典的 Spring Cloud 微服务：假设我们有一个电商系统，包含</p> <ul><li>用户服务（User Service）</li> <li>订单服务（Order Service）</li> <li>商品服务（Product Service）</li> <li>支付服务（Payment Service）</li> <li>网关（Gateway）</li></ul> <p>其体系架构如下</p> <div class="language-sql extra-class"><pre class="language-sql"><code>                         <span class="token operator">+</span><span class="token comment">-----------------------+</span>

<span class="token operator">|</span> <span class="token punctuation">(</span>Payment<span class="token punctuation">)</span>   <span class="token operator">|</span> <span class="token operator">&lt;</span><span class="token comment">-----------------&gt; | 事件驱动        |</span>
<span class="token operator">+</span><span class="token comment">------------+                      +----------------+</span>
</code></pre></div><p>在这个架构中</p> <ul><li>Spring Cloud Gateway 为 API 网关，管理所有 HTTP 请求</li> <li>Eureka 为注册中心，负责管理微服务实例，实现服务发现</li> <li>Feign 实现服务间调用，服务之间直接从 Eureka 中查找</li> <li>Resilience4J 保障服务故障时的自动熔断，防止级联故障</li> <li>Kafka 实现异步消息通信（如订单完成后通知支付服务）</li></ul> <p>Service Mesh 服务网格</p> <h3 id="分布式、微服务和-ddd"><a href="#分布式、微服务和-ddd" class="header-anchor">#</a> 分布式、微服务和 DDD</h3> <p>分布式是部署的事，不管是单体项目还是微服务项目，都可以采用分布式部署，一个典型的应用是 k8s</p> <p>微服务是项目的事，与之对应的是单体项目，将单体项目拆分为微服务是常见的操作，Spring Cloud 是最广泛的微服务框架</p> <p>DDD 是代码设计的事，与之相对应的是典型的三层模型（Controller-Service-Dao），这是代码组织结构，例如 COLA 架构就是一个典型的 DDD 设计实例</p> <h2 id="常见分布式问题"><a href="#常见分布式问题" class="header-anchor">#</a> 常见分布式问题</h2> <h3 id="分布式事务"><a href="#分布式事务" class="header-anchor">#</a> 分布式事务</h3> <p>2PC：两阶段提交，将事务的提交过程分为资源准备和资源提交两个阶段，并且由事务协调者来协调所有事务参与者，如果准备阶段所有事务参与者都预留资源成功，则进行第二阶段的资源提交，否则事务协调者回滚资源</p> <p>3PC：三阶段提交协议，是二阶段提交协议的改进版本，三阶段提交有两个改动点</p> <ol><li>在协调者和参与者中都引入超时机制</li> <li>在第一阶段和第二阶段中插入一个准备阶段，保证了在最后提交阶段之前各参与节点的状态是一致的</li></ol> <p>TCC：一种分布式事务处理方法，它的名称来自于其三个阶段<code>Try, Confirm, Cancel</code>，这种方法主要用于处理在分布式系统中，多个服务需要协同完成一项操作时的一致性问题</p> <h3 id="分布式锁"><a href="#分布式锁" class="header-anchor">#</a> 分布式锁</h3> <p>由于要保证分布式系统的性能，分布式锁一般都是乐观锁，与之对应的是悲观锁</p> <p>悲观锁是将资源锁住，等一个之前获得锁的线程释放锁之后，下一个线程才可以访问。而乐观锁采取了一种宽泛的态度，通过某种方式不加锁来处理资源，比如通过给记录加 version 或 timestamp 来操作数据（比如 CAS 策略），<strong>性能较悲观锁有很大的提高</strong></p> <ul><li>像 synchronized、Lock、ReadWriteLock 均为悲观锁</li> <li>而原子类例如 AtomicInteger 用的实际上是 CAS 机制，所以是一个乐观锁 → 但是没有引入版本控制，所以会出现 ABA 问题（A→B→A），详见 - <a href="https://northboat.github.io/pages/479c11/#%E4%BB%80%E4%B9%88%E6%98%AF-cas" target="_blank" rel="nofollow noopener noreferrer">原子性、单例模式和 CAS | 北船<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>还有一种乐观锁的理解：Git</p> <ul><li>我们只有在 push 的时候才会进行锁的检查，返回错误信息</li> <li>无论是 add 还是 commit，都是不上锁的（乐观的默认可执行），碰到问题（push 版本不对）再去解决</li></ul> <p>当然，我们在此处只讨论分布式锁的实现，需要明确的是，分布式锁既可以是悲观的也可以是乐观的，这要根据具体场景进行设计考量</p> <p>1️⃣ Redis 实现</p> <p>Redission，基于 Redis 集群的分布式锁，本质上就是维护同一个键值对，作为 Lock，获取时上锁，获取前检查这个键值对是否有锁，释放时解锁</p> <p>2️⃣ Zookeeper 实现</p> <p>订阅发布模式下，多个 Watcher 争用一个临时节点</p> <ul><li>上锁：创建临时节点</li> <li>释放：删除临时节点</li></ul> <h3 id="分布式会话"><a href="#分布式会话" class="header-anchor">#</a> 分布式会话</h3> <p>在分布式系统的诸多后端接口之间维护<strong>唯一</strong>的用户 Session，用以管理用户登陆状态，可以用 Redis 存放用户 Session 并设置有效期实现（在这里，一个 Session 实际上就是一个 KV 对）</p> <p>使用 Redis 做用户登陆状态管理（分布式会话管理），通常有这样两种做法</p> <p>1️⃣ Token 为键，用户信息为值，例如</p> <div class="language- extra-class"><pre class="language-text"><code>Key:   login:token:{jwt-token}
Value: &quot;{userId: u12345}, {username: arkrypto}, {roles: [admin]}, {loginTime: 2025-05-19T18:00:00}&quot;
</code></pre></div><p>Value 实际上是用户信息的一个 JsonToString</p> <p>2️⃣ 用户 ID 为键，Token 为值，这个很简单</p> <div class="language- extra-class"><pre class="language-text"><code>Key:   login:user:{userId}
Value: jwt-token
</code></pre></div><p>其中，2 适合单点登录（SSO，Single Sign-On）控制，因为可以很轻松的做到一个 ID 对应一个 KV 对，即一个会话；而前者默认支持多端登录</p> <table><thead><tr><th>项目</th> <th>方式一：以 <code>token</code> 为 key</th> <th>方式二：以 <code>userId</code> 为 key</th></tr></thead> <tbody><tr><td>Key</td> <td><code>login:token:{token}</code></td> <td><code>login:user:{userId}</code></td></tr> <tr><td>Value</td> <td>用户信息（JSON 格式）</td> <td>token 字符串</td></tr> <tr><td>是否支持多端登录</td> <td>支持（每个 token 独立）</td> <td>默认不支持（一个 userId 对应一个 token）</td></tr> <tr><td>用途</td> <td>校验身份和获取用户信息</td> <td>实现单点登录/控制登录唯一性</td></tr> <tr><td>删除策略</td> <td>删除 token（用于登出）</td> <td>删除 userId-token 绑定（用于限制）</td></tr></tbody></table> <h3 id="分布式-id"><a href="#分布式-id" class="header-anchor">#</a> 分布式 ID</h3> <p>在分布式系统中，要保证 ID 的唯一性，粗糙方案</p> <ol><li>UUID：空间大，无序</li> <li>数据库自增 ID：性能差，单点故障</li></ol> <p>较好的方案</p> <ol><li>Redis 自增 ID：多机设置不同初始 ID 和不同步长</li> <li>雪花算法（Snowflake）
<ul><li>生成 64 位的 ID，包含时间戳、机器 ID 和序列号</li> <li>高性能、有序，但依赖时钟同步</li></ul></li></ol> <h3 id="分布式链路追踪"><a href="#分布式链路追踪" class="header-anchor">#</a> 分布式链路追踪</h3> <p>参考文献：<a href="https://www.cnblogs.com/caoweixiong/p/14475815.html" target="_blank" rel="nofollow noopener noreferrer">分布式服务调用链路追踪——方案选型 - 曹伟雄 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>在分布式系统中，一次调用如果时间过长，由于微服务之间的相互调用，想要找出到底是谁掉了链子是一件很困难的事情，这对故障排查是很大的阻碍，于是就有了分布式链路追踪的需求</p> <ul><li>分布式链路实际上就是指的请求的调用链</li></ul> <p>SkyWalking - 华子开源的分布式链路追踪框架，其基本思路就是利用 Java Agent 对现成的项目进行插桩，通过外置的 Collector（收集者）对项目的链路进行监控并进行持久化存储以及可视化控制</p> <p>有这样几个关键点</p> <ul><li>每个链路必须有其独有的 id 标识</li> <li>每条链路中的每个服务必须独有标识</li> <li>采用类似于心跳检测的策略对链路进行监控（约 1s 一次），但要注意，一但收集到上游的请求，那么必须对整条链路进行收集</li></ul> <h3 id="定时任务"><a href="#定时任务" class="header-anchor">#</a> 定时任务</h3> <p>XXL JOB：分布式任务调度平台</p> <h2 id="集群同步问题"><a href="#集群同步问题" class="header-anchor">#</a> 集群同步问题</h2> <p>参考文献</p> <ul><li><a href="https://juejin.cn/post/7383957603016048655" target="_blank" rel="nofollow noopener noreferrer">考考你Redis主从，就知道有没深入Redis大家好，我是南哥。 一个对Java程序员进阶成长颇有研究的人，今天继续给大 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2448914" target="_blank" rel="nofollow noopener noreferrer">Redis部署方案的演进-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="主从架构如何避免脏读"><a href="#主从架构如何避免脏读" class="header-anchor">#</a> 主从架构如何避免脏读</h3> <p>在 Redis 主从架构中：</p> <ul><li><strong>主节点</strong>：负责处理写操作（如 SET、DEL），并将写操作同步到从节点</li> <li><strong>从节点</strong>：负责处理读操作（如 GET），并提供数据的副本</li></ul> <p>可以参考 Eureka 集群和 Zookeeper 集群的设计，感觉是差不多的（同属于 NoSQL）：主节点负责写，通过<strong>复制</strong>将数据同步到副节点，而副节点只负责数据的读取</p> <p>这里的复制加粗了，为什么呢？因为在 Eureka 中是异步复制，而 Zookeeper 中是同步复制，这造就了二者<strong>一致性</strong>的差别，前者是 AP 系统，而后者是 CP 系统</p> <p>在 Redis 集群中，这样的复制和 Eureka 一样，属于异步复制</p> <ul><li>由于主从同步是异步的，写操作在主节点完成后，并不会立即同步到从节点。因此，在同步完成之前，从节点可能会返回旧数据，导致<strong>脏读</strong></li></ul> <p>一个很经典的避免脏读的方法：<strong>读写锁</strong>（写时禁止读）</p> <p>这样会有很多局限性，存在以下问题：</p> <ol><li><strong>性能瓶颈</strong>：写操作期间禁止读操作，会导致读请求被阻塞，降低系统的并发性能</li> <li><strong>系统卡住</strong>：如果主节点的写 I/O 阻塞，整个系统可能会卡住，影响可用性</li> <li><strong>复杂性</strong>：实现<strong>分布式读写锁</strong>会增加系统的复杂性</li></ol> <p>主从结构下，避免脏读除了读写锁还有什么方法呢？（天美 /(ㄒoㄒ)/~~）</p> <p>4️⃣ 强制读主节点</p> <p>对于敏感数据，强制性的让用户只能读取主节点内容，由于 Redis 是单线程的原子操作，单独读写一个节点，当然不会发生脏读啦</p> <p>随之而来的是主节点负担增加，从而拖慢读写性能</p> <p>1️⃣ 写后同步等待</p> <p>刚刚提到，用读写锁，实际上是分布式锁的一种应用，这与“写后同步等待”不同，“写后同步等待”实际上就类似于 Eureka 的同步复制机制，主节点写完后对所有副节点进行阻塞的同步更新，更新完成后，才可以执行读操作</p> <p>这可以使用 Redis 的 Wait 命令实现</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key value
WAIT <span class="token number">1</span> <span class="token number">1000</span>  <span class="token comment"># 等待至少 1 个从节点同步完成，超时时间为 1000 毫秒</span>
</code></pre></div><p>2️⃣ 版本号或时间戳机制</p> <p>原理：为每个键（Key）添加版本号或时间戳，客户端在读取数据时检查版本号或时间戳，确保读取的是最新数据</p> <p>优点</p> <ul><li>不需要阻塞读操作，性能较高</li> <li>可以灵活控制数据的一致性级别</li></ul> <p>缺点</p> <ul><li>需要在客户端实现额外的逻辑</li> <li>增加了数据存储的开销（多一个存储字段）</li></ul> <p>实现方式</p> <p>在写操作时，更新键的版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key:version <span class="token number">1</span>
SET key:value <span class="token string">&quot;data&quot;</span>
</code></pre></div><p>在读操作时，检查版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>GET key:version
GET key:value
</code></pre></div><p>这里的读是指一次事务中的前后两次读（脏读的本质），在后一次做一个版本的检查，比如刚进入时读一次数据（这个数据上带一个版本号，或时间戳），然后在退出函数时再读一次，若版本号不同，则按后一次读出的数据为准</p> <p>3️⃣ 最终一致性容忍</p> <p>原理：接受一定时间内的脏读，通过业务逻辑容忍最终一致性</p> <p>优点</p> <ul><li>性能最高，没有额外的同步开销</li> <li>适合对一致性要求不高的场景</li></ul> <p>缺点：不适用于对一致性要求严格的场景（如金融交易）</p> <p>实现方式：在业务逻辑中处理脏读问题，例如</p> <ul><li>对脏读不敏感的数据（如用户昵称、文章内容）可以直接使用从节点读取</li> <li>对脏读敏感的数据（如余额、库存）可以从主节点读取</li></ul> <p><strong>注意，我们可以强制用户在主节点上读取数据，这样可以保证不会出现脏读，代价是主节点负担较大</strong>，所以这里的实现采取了折中的方案，敏感数据限定读主节点，非敏感数据读副节点</p> <p>那么“最终一致性容忍”是个什么情况呢，允许了一部分的脏读，但换回了相当一部分的性能</p> <h3 id="限流算法"><a href="#限流算法" class="header-anchor">#</a> 限流算法</h3> <p>令牌桶算法、漏桶算法、固定窗口算法、滑动窗口算法以及动态限流算法</p> <ul><li>令牌桶：每秒给多少令牌，同时给定令牌上限，令牌用完了拒绝请求</li> <li>漏桶：每秒处理多少个水滴（请求），类似于消息队列的方式，每秒消费多少个请求</li> <li>固定窗口：固定时间窗口，每个窗口通过的请求有限</li> <li>滑动窗口：细粒的划分时间，在每个大窗口中控制小窗口，并可以通过小窗口的状态判断大窗口的访问控制，详见示例</li> <li>动态限流：根据系统负载动态调节漏桶的流速，负载越高，流速越小</li></ul> <p>不同算法的异同</p> <table><thead><tr><th>算法</th> <th>原理</th> <th>优点</th> <th>缺点</th> <th>适用场景</th> <th>示例</th></tr></thead> <tbody><tr><td>令牌桶算法</td> <td>系统以固定的速率向桶中添加令牌（Token），桶的容量是固定的。 每个请求需要从桶中获取一个令牌，如果桶中有足够的令牌，则允许请求通过；否则拒绝请求。 如果桶满了，新生成的令牌会被丢弃</td> <td>可以应对突发流量，因为桶中的令牌可以累积。 限流速率平滑，适合需要控制平均速率的场景</td> <td>实现相对复杂，需要维护令牌桶的状态。 突发流量可能导致短时间内大量请求通过</td> <td>需要平滑限流的场景，如 API 网关、流量控制</td> <td>假设桶的容量为 10，每秒生成 2 个令牌。 如果桶中有 5 个令牌，同时有 8 个请求到达，则前 5 个请求可以通过，后 3 个请求被拒绝</td></tr> <tr><td>漏桶算法</td> <td>请求像水一样流入漏桶，漏桶以固定的速率处理请求（漏水）。 如果桶满了，新的请求会被丢弃或排队等待</td> <td>限流速率非常平滑，适合需要严格控制请求速率的场景。 实现简单，容易理解</td> <td>无法应对突发流量，即使桶中有空闲容量，请求也只能以固定速率通过。 可能导致请求的延迟增加</td> <td>需要严格控制请求速率的场景，如消息队列、任务调度</td> <td>假设漏桶的容量为 10，处理速率为每秒 2 个请求。 如果桶中有 5 个请求，同时有 8 个请求到达，则前 5 个请求可以进入桶中，后 3 个请求被拒绝。 桶中的请求以每秒 2 个的速率被处理</td></tr> <tr><td>固定窗口算法</td> <td>将时间划分为固定的窗口（如 1 秒），每个窗口内允许通过的请求数量是固定的。 如果窗口内的请求数量超过限制，则拒绝多余的请求</td> <td>实现简单，容易理解。 适合对限流精度要求不高的场景</td> <td>无法应对窗口边界处的突发流量。例如，如果窗口大小为 1 秒，限制为 100 个请求，则可能在窗口的最后 100ms 内收到 100 个请求，而在下一个窗口的前 100ms 内又收到 100 个请求，导致实际通过的请求数量是限制的两倍。 限流不够平滑</td> <td>对限流精度要求不高的场景，如简单的 API 限流</td> <td>假设窗口大小为 1 秒，限制为 100 个请求。 如果在 1 秒内收到 120 个请求，则前 100 个请求可以通过，后 20 个请求被拒绝</td></tr> <tr><td>滑动窗口算法</td> <td>将时间划分为多个小窗口（如 100ms），每个小窗口内允许通过的请求数量是固定的。 通过滑动窗口的方式动态计算当前时间窗口内的请求数量，如果超过限制，则拒绝多余的请求</td> <td>比固定窗口算法更精确，能够更好地应对突发流量。 限流更加平滑</td> <td>实现相对复杂，需要维护滑动窗口的状态。 计算开销较大</td> <td>对限流精度要求较高的场景，如高并发 API 限流</td> <td>假设窗口大小为 1 秒，划分为 10 个小窗口，每个小窗口的限制为 10 个请求。 如果在当前时间窗口内已经收到 90 个请求，则新的请求会被拒绝</td></tr> <tr><td>动态限流算法</td> <td>根据系统的实时负载动态调整限流速率。 例如，当系统负载较高时，降低限流速率；当系统负载较低时，提高限流速率</td> <td>能够根据系统状态动态调整限流策略，更加灵活。 适合负载波动较大的场景</td> <td>实现复杂，需要实时监控系统状态。 调整限流速率的策略需要精心设计</td> <td>负载波动较大的场景，如电商大促、秒杀活动</td> <td>假设系统负载超过 80% 时，将限流速率从每秒 100 个请求降低到每秒 50 个请求</td></tr></tbody></table> <p>限流算法的选择</p> <ul><li>如果需要平滑限流并支持突发流量，选择<strong>令牌桶算法</strong></li> <li>如果需要严格控制请求速率，选择<strong>漏桶算法</strong></li> <li>如果对限流精度要求不高，选择<strong>固定窗口算法</strong>或<strong>计数器算法</strong></li> <li>如果对限流精度要求较高，选择<strong>滑动窗口算法</strong></li> <li>如果需要根据系统状态动态调整限流策略，选择<strong>动态限流算法</strong></li></ul> <h3 id="缓存穿透、击穿和雪崩"><a href="#缓存穿透、击穿和雪崩" class="header-anchor">#</a> 缓存穿透、击穿和雪崩</h3> <p>充当缓存是 Redis 的主要功能之一，既然作为缓存，就面临穿透、击穿和雪崩的问题（所谓缓存三兄弟）</p> <ul><li>主要问题是如何避免以及发生了如何挽救</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/9e801d/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">软件工程原理与应用</div></a> <a href="/pages/46b8df/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">DDD 领域驱动设计</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
