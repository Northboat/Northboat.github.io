</code></pre></div><p>解压</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> redis-6.2.6.tar.gz
</code></pre></div><p>进入redis目录</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> redis-6.2.6.tar.gz
</code></pre></div><p>编译下载</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> <span class="token function">make</span>
yay <span class="token parameter variable">-S</span> pkg-config

<span class="token function">make</span> <span class="token operator">&amp;&amp;</span> <span class="token function">make</span> <span class="token function">install</span>
</code></pre></div><p>默认安装路径</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/usr/local/bin
</code></pre></div><p>进入该目录，将redis.conf拷贝至当前目录，使用这个拷贝的文件进行配置启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">mkdir</span> config
<span class="token function">cp</span> /home/northboat/redis-6.2.6/redis.conf config
</code></pre></div><p>修改默认启动方式</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> config
<span class="token function">vim</span> redis.conf
<span class="token comment">#设置 daemonize 为 yes 保存并退出</span>
</code></pre></div><p>在 /usr/local/bin 目录下启动服务，通过指定的配置文件启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-server config/redis.conf
</code></pre></div><p>数据库操作与命名：连接 redis</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token comment"># -h 默认为本机</span>
 
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token function">ping</span>
PONG
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> name NorthBoat
OK
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get a
<span class="token punctuation">(</span>nil<span class="token punctuation">)</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> keys *
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;name&quot;</span>
</code></pre></div><p>查看 redis 进程是否开启</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> redis

<span class="token comment">#查看后台java进程</span>
<span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> <span class="token function">java</span>
jps <span class="token parameter variable">-l</span> <span class="token parameter variable">-v</span>
</code></pre></div><p>关闭 redis 服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span><span class="token operator">:</span><span class="token number">6379</span><span class="token operator">&gt;</span> shutdown
not connected<span class="token operator">&gt;</span> exit
</code></pre></div><p>设置密码，在 redis.conf 中搜索 requirepass，插入新行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># vim搜索：&quot;:/requirepass&quot;，按寻找下一个</span>
requirepass <span class="token number">123456</span>
</code></pre></div><p>在登录 redis 后验证密码即可操作数据</p> <div class="language-bash extra-class"><pre class="language-bash"><code>auth <span class="token string">&quot;123456&quot;</span>

<span class="token comment">#或在启动时验证，这样并不安全，因为密码可见</span>
redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token parameter variable">-a</span> <span class="token number">123456</span>
</code></pre></div><p>可视化工具：<a href="https://gitee.com/qishibo/AnotherRedisDesktopManager" target="_blank" rel="nofollow noopener noreferrer">Another Redis Desktop Manager<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <table><thead><tr><th>命令</th> <th>解释</th></tr></thead> <tbody><tr><td>set name NorthBoat</td> <td>设置键值对{name: NorthBoat}</td></tr> <tr><td>get name</td> <td>获取键的值</td></tr> <tr><td>del name</td> <td>删除键值对</td></tr> <tr><td>exists name</td> <td>检查键是否存在</td></tr> <tr><td>expire name seconds</td> <td>为键设置过期时间，单位s（注意在设置完键值后使用）</td></tr> <tr><td>move name db</td> <td>将当前库的name转移到指定的数据库db中</td></tr> <tr><td>ttl name</td> <td>返回name剩余时间，单位为s</td></tr> <tr><td>persist name</td> <td>移除name的过期时间</td></tr> <tr><td>rename name n</td> <td>将键name改名为n</td></tr> <tr><td>flushdb</td> <td>刷新redis，清除所有键值</td></tr></tbody></table> <p>键规范：业界规范即采用<strong>冒号</strong>作为分隔符表示数据的层级关系</p> <p>一套常用的结构模板</p> <table><thead><tr><th>类型</th> <th>命名规则</th> <th>示例</th></tr></thead> <tbody><tr><td>用户 Token 存储</td> <td><code>login:token:{token}</code></td> <td><code>login:token:abc123</code></td></tr> <tr><td>用户 ID 映射 Token</td> <td><code>login:user:{userId}</code></td> <td><code>login:user:u001</code></td></tr> <tr><td>缓存（对象）</td> <td><code>cache:{业务}:{标识}</code></td> <td><code>cache:user:u001</code></td></tr> <tr><td>限流</td> <td><code>rate_limit:{类型}:{标识}</code></td> <td><code>rate_limit:ip:127.0.0.1</code></td></tr> <tr><td>队列</td> <td><code>queue:{业务}</code></td> <td><code>queue:email</code></td></tr> <tr><td>计数器</td> <td><code>counter:{业务}:{标识}</code></td> <td><code>counter:login_fail:u001</code></td></tr> <tr><td>分布式锁</td> <td><code>lock:{资源}</code></td> <td><code>lock:order:123456</code></td></tr> <tr><td>会话管理</td> <td><code>session:{sessionId}</code></td> <td><code>session:sess_abc123</code></td></tr></tbody></table> <h3 id="数据类型"><a href="#数据类型" class="header-anchor">#</a> 数据类型</h3> <p>基于内存的 KV 数据库，支持高速读写，常用作关系型数据库的缓存</p> <p>String：从<code>Redis</code>中取出的字符串在<code>Java</code>程序中会显示为<code>&quot;NorthBoat&quot;</code>的形式，要加转义字符<code>\&quot;</code>表示双引号</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> <span class="token keyword">set</span> name NorthBoat
OK
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>

<span class="token comment"># 批量设置</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mset id <span class="token number">4</span> grade <span class="token number">11</span>
OK
<span class="token comment"># 批量获取</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mget id grade
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;4&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;11&quot;</span>
</code></pre></div><p>List：向左插入队列</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> redis
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> mysql
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">2</span>
</code></pre></div><p>查看队列</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrange <span class="token builtin class-name">test</span> <span class="token number">0</span> <span class="token number">10</span>
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;redis&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;mysql&quot;</span>
</code></pre></div><p>查看队列长度</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> llen <span class="token builtin class-name">test</span>
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">2</span>
</code></pre></div><p>删除元素</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 1 表示从左向右找第一个元素删</span>
<span class="token comment"># -1 表示从右向左找第一个元素删</span>
<span class="token comment"># 0 表示把该元素删完</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrem <span class="token builtin class-name">test</span> <span class="token number">1</span> mysql
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>

<span class="token comment"># # 从 start 删到 end，若 start &gt; end 则删完</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> ltrim <span class="token builtin class-name">test</span> <span class="token number">1</span> <span class="token number">0</span> 
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>
</code></pre></div><p>Hash：一个嵌套的哈希表<code>Map&lt;String, Map&lt;String, Object&gt;&gt;</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 获取key表中itme对应的值</span>
<span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">hget</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">String</span> item<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> item<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 获取整个Hash表</span>
<span class="token keyword">public</span> <span class="token class-name">Map</span> <span class="token function">hmget</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">entries</span><span class="token punctuation">(</span>key<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 简单设置一个Hash</span>

</code></pre></div><p>Zset / SortedSet：有序集合，每个元素有一个 double 类型的权重，Zset 将根据权重对元素进行排序<code>Map&lt;String, Map&lt;String, Double&gt;&gt;</code></p> <ul><li>zadd key weight val：添加成员，weight 为权重</li> <li>zrange start end：查询下标 start 到 end 的元素</li> <li>zrem key member：删除成员</li> <li>zcard key：查询数量</li></ul> <p>特殊数据类型支持</p> <ul><li>Geospatial（地理空间）：用于存储地理位置信息，支持距离计算、范围查询等功能</li> <li>HyperLogLog：用于基数统计（估算集合中不重复元素的数量），内存效率极高，适用于大数据量的去重计数</li> <li>Bitmap（位图）：基于字符串类型的二进制位操作，适合处理大量状态标记场景</li></ul> <h3 id="redis-持久化方法"><a href="#redis-持久化方法" class="header-anchor">#</a> Redis 持久化方法</h3> <blockquote><p>日志和快照</p></blockquote> <p>Redis 有两种持久化方法，RDB（Redis Database）和 AOF（Append Only File）</p> <ol><li>RDB：在指定间隔（小时为单位）新 fork 一个子线程来保存数据集的时间点<strong>快照</strong></li> <li>AOF：使用后台进程记录服务器接收到的每一个写操作，类似于<strong>写日志</strong>，这些操作可以在服务器启动时重新执行，以重建原始数据集</li></ol> <p>从保存的频率、资源的消耗、恢复的速度上来看</p> <ul><li>AOF 的持久化更密集（以秒为单位进行记录），但记录的是写命令日志，在恢复时重新进行写，恢复较慢</li> <li>而 RBD 的备份更松散（以小时为单位），且保存更耗费资源，但快照保存的更为完整，允许大数据集快速重启</li></ul> <p>其中</p> <ul><li>保存的频率决定了数据安全等级，频率越高，数据一致性保障越高，AOF fsync 1s 能够应对突然断电的情况</li> <li>存储的消耗上，AOF 比 RBD 消耗更高，因为快照文件更为紧凑</li> <li>性能上，一般而言 RBD 比 AOF 更好，但即使 fsync 每秒一次，AOF 性能表现仍然不错</li></ul> <p>值得注意的是：AOF 方式中，即使日志由于某种原因（磁盘满或其他原因）以一个写了一半的命令结束，redis-check-aof 工具能轻松修复</p> <p><a href="https://redis.io/docs/latest/operate/rs/databases/configure/database-persistence/" target="_blank" rel="nofollow noopener noreferrer">配置数据库持久化 | 文档 - Configure database persistence | Docs<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>数据库持久化选项</p> <table><thead><tr><th>Options 选项</th> <th>Description 描述</th></tr></thead> <tbody><tr><td>None</td> <td>完全不持久化到磁盘</td></tr> <tr><td>Append-only file (AOF) - fsync every write</td> <td>数据每次写入命令都 fsync 到磁盘</td></tr> <tr><td>Append-only file (AOF) - fsync every 1 sec</td> <td>数据每次写入命令每秒同步到磁盘</td></tr> <tr><td>Snapshot, every 1 hour</td> <td>数据库每小时创建一次快照</td></tr> <tr><td>Snapshot, every 6 hours</td> <td>数据库每 6 小时创建一次快照</td></tr> <tr><td>Snapshot, every 12 hours</td> <td>数据库每 12 小时创建一次快照</td></tr></tbody></table> <h3 id="redis-分布式-id"><a href="#redis-分布式-id" class="header-anchor">#</a> Redis 分布式 ID</h3> <p>类似于分布式会话的键值存储，只不过上面存的是 SessionId，这里存的是用户 ID，用一个远端的 Map 结构这样去保证主键唯一，只不过 Session 会话的键是由后端服务器哈希的，分布式 ID 是由 Redis 自增生成的</p> <p>在分布式系统中，要保证 ID 的唯一性，粗糙方案</p> <ol><li>UUID：空间大，无序</li> <li>MySQL 自增 ID：性能差，单点故障</li></ol> <p>较好的方案</p> <ol><li><strong>Redis 自增 ID：多机设置不同初始 ID 和不同步长</strong></li> <li>雪花算法（Snowflake）：生成 64 位的 ID，包含时间戳、机器 ID 和序列号；高性能、有序，但依赖时钟同步</li></ol> <p>一个典型的应用：利用 Redis 存服务器的 SessionId，实现分布式会话管理，详见 [聊天室 - SpringBoot + WebSockets | Northboat](https://northboat.github.io/pages/5455e2/#分布式 Session)</p> <h3 id="redis-分布式锁"><a href="#redis-分布式锁" class="header-anchor">#</a> Redis 分布式锁</h3> <blockquote><p>redis 可以使用 watch 机制实现乐观锁</p></blockquote> <p>由于要保证分布式系统的性能，分布式锁一般都是乐观锁，与之对应的是悲观锁</p> <p>悲观锁是将资源锁住，等一个之前获得锁的线程释放锁之后，下一个线程才可以访问。而乐观锁采取了一种宽泛的态度，通过某种方式不加锁来处理资源，比如通过给记录加 version 或 timestamp 来操作数据（比如 CAS 策略），<strong>性能较悲观锁有很大的提高</strong></p> <ul><li>像 synchronized、Lock、ReadWriteLock 均为悲观锁</li> <li>而原子类例如 AtomicInteger 用的实际上是 CAS 机制，所以是一个乐观锁 → 但是没有引入版本控制，所以会出现 ABA 问题（A→B→A），详见 - <a href="https://northboat.github.io/pages/479c11/#%E4%BB%80%E4%B9%88%E6%98%AF-cas" target="_blank" rel="nofollow noopener noreferrer">原子性、单例模式和 CAS | 北船<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>还有一种乐观锁的理解：Git</p> <ul><li>我们只有在 push 的时候才会进行锁的检查，返回错误信息</li> <li>无论是 add 还是 commit，都是不上锁的（乐观的默认可执行），碰到问题（push 版本不对）再去解决</li></ul> <p>当然，我们在此处只讨论分布式锁的实现，需要明确的是，分布式锁既可以是悲观的也可以是乐观的，这要根据具体场景进行设计考量</p> <p>Redission，基于 Redis 集群的分布式锁，本质上就是维护同一个键值对，作为 Lock，获取时上锁，获取前检查这个键值对是否有锁，释放时解锁</p> <h3 id="redis-事物"><a href="#redis-事物" class="header-anchor">#</a> Redis 事物</h3> <blockquote><p>Redis + Lua 脚本是实现事务的常见搭配</p></blockquote> <p>事物：一组命令的集合，如多条 SQL，入队出队依次执行，事物中的所有命令都会被序列化并按顺序执行，事务中的多条 SQL 作为一个整体，要么都成功，要么都失败</p> <p>ACID 原则：原子性、一致性、隔离性、持久性</p> <ul><li>redis 单条命令保证原子性，但 redis 事物不保证原子性</li> <li>redis 事务没有隔离级别的概念，所有命令在事务中并没有直接被执行，只有发起执行命令的时候才会执行（exec）</li></ul> <p>redis 事务的一次正常执行</p> <ol><li>开启事务：multi</li> <li>命令入队：依次写命令</li> <li>执行事务：exec</li></ol> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k1 v1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k3 v3
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>
<span class="token number">1</span><span class="token punctuation">)</span> OK
<span class="token number">2</span><span class="token punctuation">)</span> OK
<span class="token number">3</span><span class="token punctuation">)</span> OK
<span class="token number">4</span><span class="token punctuation">)</span> <span class="token string">&quot;v2&quot;</span>
</code></pre></div><p>放弃事务：discard（在 multi 后、exec 前执行，队列中所有命令都不会执行）</p> <p>事务报错：编译型异常，代码有问题，编译都过不了，整个事务都不会被执行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k1 v1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> getset k3
<span class="token punctuation">(</span>error<span class="token punctuation">)</span> ERR wrong number of arguments <span class="token keyword">for</span> <span class="token string">'getset'</span> <span class="token builtin class-name">command</span>
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>
<span class="token punctuation">(</span>error<span class="token punctuation">)</span> EXECABORT Transaction discarded because of previous errors.

<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k1
<span class="token punctuation">(</span>nil<span class="token punctuation">)</span>
</code></pre></div><p>运行时异常：如果事务队列中某个命令存在某个问题，类似与 RuntimeException，在执行事务时，其他命令可以正常执行，错误命令抛出异常</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> k1 <span class="token string">&quot;v1&quot;</span>
OK
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> incr k1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>

<span class="token number">1</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>error<span class="token punctuation">)</span> ERR value is not an integer or out of range
<span class="token number">2</span><span class="token punctuation">)</span> OK
<span class="token number">3</span><span class="token punctuation">)</span> <span class="token string">&quot;v2&quot;</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span>
</code></pre></div><h3 id="redis-限流"><a href="#redis-限流" class="header-anchor">#</a> Redis 限流</h3> <p>Redis 限流算法</p> <ul><li>令牌桶算法：每秒给多少令牌，同时给定令牌上限，令牌用完了拒绝请求</li> <li>漏桶算法：每秒处理多少个水滴（请求），类似于消息队列的方式，每秒消费多少个请求</li> <li>固定窗口算法：固定时间窗口，每个窗口通过的请求有限</li> <li>滑动窗口算法：细粒的划分时间，在每个大窗口中控制小窗口，并可以通过小窗口的状态判断大窗口的访问控制，详见示例</li> <li>动态限流算法：根据系统负载动态调节漏桶的流速，负载越高，流速越小</li></ul> <p>如何选择限流算法</p> <ul><li>如果需要平滑限流并支持突发流量，选择<strong>令牌桶</strong></li> <li>如果需要严格控制请求速率，选择<strong>漏桶</strong></li> <li>如果对限流精度要求不高，选择<strong>固定窗口</strong>或<strong>计数器</strong></li> <li>如果对限流精度要求较高，选择<strong>滑动窗口</strong></li> <li>如果需要根据系统状态动态调整限流策略，选择<strong>动态限流</strong></li></ul> <h3 id="redis-主从同步"><a href="#redis-主从同步" class="header-anchor">#</a> Redis 主从同步</h3> <blockquote><p>Redis 主从架构如何避免脏读</p></blockquote> <p>参考</p> <ul><li><a href="https://juejin.cn/post/7383957603016048655" target="_blank" rel="nofollow noopener noreferrer">考考你Redis主从，就知道有没深入Redis大家好，我是南哥。 一个对Java程序员进阶成长颇有研究的人，今天继续给大 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2448914" target="_blank" rel="nofollow noopener noreferrer">Redis部署方案的演进-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在 Redis 主从架构中</p> <ul><li><strong>主节点</strong>：负责处理写操作（如 SET、DEL），并将写操作同步到从节点</li> <li><strong>从节点</strong>：负责处理读操作（如 GET），并提供数据的副本</li></ul> <p>这也是 CQRS 的一种具体实现，即读写分离架构</p> <p>在 Redis 集群中，这样的复制和 Eureka 一样，属于异步复制，均属于 AP 系统（可用性大于一致性）</p> <ul><li>由于主从同步是异步的，写操作在主节点完成后，并不会立即同步到从节点，因此在同步完成之前，从节点可能会返回旧数据，导致<strong>脏读</strong></li></ul> <p>一个很经典的避免脏读的方法：<strong>读写锁</strong>（写时禁读）</p> <p>但经典的解决方案导致经典的问题</p> <ol><li>性能瓶颈：写操作期间禁止读操作，会导致读请求被阻塞，降低系统的并发性能</li> <li>系统卡死：若主节点的写 I/O 阻塞，整个系统可能会卡住，影响可用性</li> <li>复杂性：实现分布式读写锁会增加系统的复杂性</li></ol> <p>主从结构下，避免脏读除了读写锁还有什么方法呢？（天美 /(ㄒoㄒ)/~~）</p> <p>1️⃣ 写后同步等待</p> <p>刚刚提到，用读写锁，实际上是分布式锁的一种应用，这与“写后同步等待”不同，“写后同步等待”实际上就类似于 Eureka 的同步复制机制，主节点写完后对所有副节点进行阻塞的同步更新，更新完成后，才可以执行读操作</p> <p>这可以使用 Redis 的 Wait 命令实现</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key value
WAIT <span class="token number">1</span> <span class="token number">1000</span>  <span class="token comment"># 等待至少 1 个从节点同步完成，超时时间为 1000 毫秒</span>
</code></pre></div><p>2️⃣ 版本号或时间戳机制</p> <p>为每个键（Key）添加版本号或时间戳，客户端在读取数据时检查版本号或时间戳，确保读取的是最新数据</p> <p>优点</p> <ul><li>不需要阻塞读操作，性能较高</li> <li>可以灵活控制数据的一致性级别</li></ul> <p>缺点</p> <ul><li>需要在客户端实现额外的逻辑</li> <li>增加了数据存储的开销（多一个存储字段）</li></ul> <p>实现方式：在写操作时，更新键的版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key:version <span class="token number">1</span>
SET key:value <span class="token string">&quot;data&quot;</span>
</code></pre></div><p>在读操作时，检查版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>GET key:version
GET key:value
</code></pre></div><p>这里的读是指一次事务中的前后两次读（脏读的本质），在后一次做一个版本的检查，比如刚进入时读一次数据（这个数据上带一个版本号，或时间戳），然后在退出函数时再读一次，若版本号不同，则按后一次读出的数据为准</p> <p>3️⃣ 最终一致性容忍</p> <p>原理：接受一定时间内的脏读，通过业务逻辑容忍最终一致性</p> <p>优点</p> <ul><li>性能最高，没有额外的同步开销</li> <li>适合对一致性要求不高的场景</li></ul> <p>缺点：不适用于对一致性要求严格的场景（如金融交易）</p> <p>实现方式：在业务逻辑中处理脏读问题，例如</p> <ul><li>对脏读不敏感的数据（如用户昵称、文章内容）可以直接使用从节点读取</li> <li>对脏读敏感的数据（如余额、库存）可以从主节点读取</li></ul> <p><strong>注意，我们可以强制用户在主节点上读取数据，这样可以保证不会出现脏读，代价是主节点负担较大</strong>，所以这里的实现采取了折中的方案，敏感数据限定读主节点，非敏感数据读副节点</p> <p>那么“最终一致性容忍”是个什么情况呢，允许了一部分的脏读，但换回了相当一部分的性能</p> <p>4️⃣ 强制读主节点</p> <p>对于敏感数据，强制性的让用户只能读取主节点内容，由于 Redis 是单线程的原子操作，单独读写一个节点，当然不会发生脏读啦</p> <p>随之而来的是主节点负担增加，从而拖慢读写性能</p> <h3 id="redis-布隆过滤器"><a href="#redis-布隆过滤器" class="header-anchor">#</a> Redis 布隆过滤器</h3> <blockquote><p>利用 Redis 模块组件 Redis BF 实现布隆过滤器</p></blockquote> <p>什么是布隆过滤器，通过二进制位哈希快速实现“是否存在”的判断，从而实现过滤的逻辑</p> <h3 id="redis-search-和向量存储"><a href="#redis-search-和向量存储" class="header-anchor">#</a> Redis Search 和向量存储</h3> <blockquote><p>Redis ReJson 存储和 Redis Vectorset 向量存储</p></blockquote> <p>倒排索引 → 模糊搜索，让 Redis 代替 MySQL 应用在全文搜索场景，当然真正的全文搜索还是得用下面提到的搜索引擎 ES</p> <h2 id="redis-缓存"><a href="#redis-缓存" class="header-anchor">#</a> Redis 缓存</h2> <h3 id="缓存三兄贵"><a href="#缓存三兄贵" class="header-anchor">#</a> 缓存三兄贵</h3> <p>穿透、击穿和雪崩</p> <ul><li><p>缓存穿透：用户始终请求 Redis 缓存和 MySQL 数据库中都不存在的数据，这样会穿透缓存，每次都打在数据库，拖慢应用</p> <p>解决办法：给这个“不存在的热点数据”存一个值为 null 的缓存</p></li> <li><p>缓存击穿：单点热 Key 过期，对这个 Key 的请求在同时全打在了 MySQL</p> <p>解决办法：有条件的情况下，缓存不设置有效期；给读 MySQL 加锁，而对读 Redis 不做限制</p></li> <li><p>缓存雪崩：大量缓存同时过期，导致请求全打在 MySQL</p> <p>解决办法：防止热 Key 统一过期，设置随机的过期时延；设置限流和熔断降级机制，如当数据库压力超过阈值，返回兜底的空数据</p></li></ul> <p>缓存穿透、击穿和雪崩，本质上都是缓存失效，导致数据库的压力，只不过穿透和击穿是“点”的问题，即单个热 Key 的问题，而雪崩是“面”的问题，是大量 Key 同时失效的雪崩，显然后者事故级别远大于前者</p> <p>如何处理大 Key 和热 Key？</p> <ul><li>大 Key 做字段拆分</li> <li>热 Key 做多级缓存，例如本地缓存</li></ul> <h3 id="mysql-存取与锁"><a href="#mysql-存取与锁" class="header-anchor">#</a> MySQL 存取与锁</h3> <p>Doc 表设计：<strong>canvas-global/model/dao/ddbs/table_doc.go</strong></p> <div class="la                 <span class="token keyword">if</span> getter<span class="token punctuation">,</span> ok <span class="token operator">:=</span> daoRes<span class="token punctuation">.</span><span class="token punctuation">(</span>StoreIDGetter<span class="token punctuation">)</span><span class="token punctuation">;</span> ok <span class="token punctuation">{</span>

</code></pre></div><p>在 WithCache 退出时对 dbResMap 进行缓存，若命中了 DB 则缓存，并设置随机超时时间防止雪崩</p> <p><strong>canvas-global/library/doc_cache.go: setCache</strong></p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// setCache 保存数据到缓存中，支持保存多个field的数据</span>
<span class="token keyword">func</span> <span class="token function">setCache</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> id <span class="token builtin">uint64</span><span class="token punctuation">,</span> dataMap <span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>

    <span class="token punctuation">}</span>

    <span class="token keyword">var</span> cacheErr <span class="token builtin">error</span>
    dataSlice <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>dataMap<span class="token punctuation">)</span><span class="token operator">*</span><span class="token number">2</span><span class="token punctuation">)</span>

    <span class="token keyword">for</span> field<span class="token punctuation">,</span> data <span class="token operator">:=</span> <span class="token keyword">range</span> dataMap <span class="token punctuation">{</span>
        <span class="token comment">// field未注册，业务流程不正常，需要返回error，方便业务发现错误</span>

        cd <span class="token operator">:=</span> <span class="token function">packCacheData</span><span class="token punctuation">(</span><span class="token function">string</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">,</span> field<span class="token punctuation">,</span> expire<span class="token punctuation">)</span>

        dataSlice <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>dataSlice<span class="token punctuation">,</span> <span class="token function">string</span><span class="token punctuation">(</span>field<span class="token punctuation">)</span><span class="token punctuation">,</span> cd<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>

    sc <span class="token operator">=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>DocPush<span class="token punctuation">.</span><span class="token function">Expire</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> expireTime<span class="token punctuation">)</span>
    <span class="token keyword">if</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;set expire error, key=%s, err=%s&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> sc<span class="token punctuation">.</span><span class="token function">Err</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>

</code></pre></div><h2 id="redis-消息队列"><a href="#redis-消息队列" class="header-anchor">#</a> Redis 消息队列</h2> <p>文件转码服务</p> <h3 id="架构"><a href="#架构" class="header-anchor">#</a> 架构</h3> <p>文档处理 Redis MQ</p> <ul><li>生产者：<strong>canvas-global/model/service/frcanv/basis/convbase.go</strong>，失败重试机制，Redis SETNX 上锁</li> <li>消费者：<strong>canvas-global/cmdtask/smappsynctask/canvs/fileparsetask.go</strong>，协程池消费，令牌桶限流，AddToken 上锁</li></ul> <p>缺点：消息可能丢失（进程崩溃时未 ACK 的任务）、没有持久化保证</p> <p>架构概览</p> <div class="language- extra-class"><pre class="language-text"><code>  ┌─────────────────┐          Redis List               ┌─────────────────┐
