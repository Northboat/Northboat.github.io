</code></pre></div><p>解压</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> redis-6.2.6.tar.gz
</code></pre></div><p>进入redis目录</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> redis-6.2.6.tar.gz
</code></pre></div><p>编译下载</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> <span class="token function">make</span>
yay <span class="token parameter variable">-S</span> pkg-config

<span class="token function">make</span> <span class="token operator">&amp;&amp;</span> <span class="token function">make</span> <span class="token function">install</span>
</code></pre></div><p>默认安装路径</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/usr/local/bin
</code></pre></div><p>进入该目录，将redis.conf拷贝至当前目录，使用这个拷贝的文件进行配置启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">mkdir</span> config
<span class="token function">cp</span> /home/northboat/redis-6.2.6/redis.conf config
</code></pre></div><p>修改默认启动方式</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> config
<span class="token function">vim</span> redis.conf
<span class="token comment">#设置 daemonize 为 yes 保存并退出</span>
</code></pre></div><p>在/usr/local/bin目录下启动服务，通过指定的配置文件启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-server config/redis.conf
</code></pre></div><h3 id="数据库操作与命名"><a href="#数据库操作与命名" class="header-anchor">#</a> 数据库操作与命名</h3> <p>连接redis</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token comment"># -h 默认为本机</span>
 
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token function">ping</span>
PONG
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> name NorthBoat
OK
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get a
<span class="token punctuation">(</span>nil<span class="token punctuation">)</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> keys *
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;name&quot;</span>
</code></pre></div><p>查看redis进程是否开启</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> redis

<span class="token comment">#查看后台java进程</span>
<span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> <span class="token function">java</span>
jps <span class="token parameter variable">-l</span> <span class="token parameter variable">-v</span>
</code></pre></div><p>关闭redis服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span><span class="token operator">:</span><span class="token number">6379</span><span class="token operator">&gt;</span> shutdown
not connected<span class="token operator">&gt;</span> exit
</code></pre></div><p>设置密码，在redis.conf中搜索requirepass，插入新行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># vim搜索：&quot;:/requirepass&quot;，按寻找下一个</span>
requirepass <span class="token number">123456</span>
</code></pre></div><p>在登录redis后验证密码即可操作数据</p> <div class="language-bash extra-class"><pre class="language-bash"><code>auth <span class="token string">&quot;123456&quot;</span>

<span class="token comment">#或在启动时验证，这样并不安全，因为密码可见</span>
redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token parameter variable">-a</span> <span class="token number">123456</span>
</code></pre></div><p>可视化工具：<a href="https://gitee.com/qishibo/AnotherRedisDesktopManager" target="_blank" rel="nofollow noopener noreferrer">Another Redis Desktop Manager<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>基本使用</p> <table><thead><tr><th>命令</th> <th>解释</th></tr></thead> <tbody><tr><td>set name NorthBoat</td> <td>设置键值对{name: NorthBoat}</td></tr> <tr><td>get name</td> <td>获取键的值</td></tr> <tr><td>del name</td> <td>删除键值对</td></tr> <tr><td>exists name</td> <td>检查键是否存在</td></tr> <tr><td>expire name seconds</td> <td>为键设置过期时间，单位s（注意在设置完键值后使用）</td></tr> <tr><td>move name db</td> <td>将当前库的name转移到指定的数据库db中</td></tr> <tr><td>ttl name</td> <td>返回name剩余时间，单位为s</td></tr> <tr><td>persist name</td> <td>移除name的过期时间</td></tr> <tr><td>rename name n</td> <td>将键name改名为n</td></tr> <tr><td>flushdb</td> <td>刷新redis，清除所有键值</td></tr></tbody></table> <p>键规范：Redis 的键命名有一套业界推荐的规范，即采用<strong>冒号</strong>作为分隔符表示数据的层级关系</p> <p>一套常用的结构模板</p> <table><thead><tr><th>类型</th> <th>命名规则</th> <th>示例</th></tr></thead> <tbody><tr><td>用户 Token 存储</td> <td><code>login:token:{token}</code></td> <td><code>login:token:abc123</code></td></tr> <tr><td>用户 ID 映射 Token</td> <td><code>login:user:{userId}</code></td> <td><code>login:user:u001</code></td></tr> <tr><td>缓存（对象）</td> <td><code>cache:{业务}:{标识}</code></td> <td><code>cache:user:u001</code></td></tr> <tr><td>限流</td> <td><code>rate_limit:{类型}:{标识}</code></td> <td><code>rate_limit:ip:127.0.0.1</code></td></tr> <tr><td>队列</td> <td><code>queue:{业务}</code></td> <td><code>queue:email</code></td></tr> <tr><td>计数器</td> <td><code>counter:{业务}:{标识}</code></td> <td><code>counter:login_fail:u001</code></td></tr> <tr><td>分布式锁</td> <td><code>lock:{资源}</code></td> <td><code>lock:order:123456</code></td></tr> <tr><td>会话管理</td> <td><code>session:{sessionId}</code></td> <td><code>session:sess_abc123</code></td></tr></tbody></table> <h3 id="数据类型"><a href="#数据类型" class="header-anchor">#</a> 数据类型</h3> <p>基于内存的 KV 数据库，支持高速读写，常用作关系型数据库的缓存</p> <p>String：从<code>Redis</code>中取出的字符串在<code>Java</code>程序中会显示为<code>&quot;NorthBoat&quot;</code>的形式，要加转义字符<code>\&quot;</code>表示双引号</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> <span class="token keyword">set</span> name NorthBoat
OK
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>

<span class="token comment"># 批量设置</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mset id <span class="token number">4</span> grade <span class="token number">11</span>
OK
<span class="token comment"># 批量获取</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mget id grade
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;4&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;11&quot;</span>
</code></pre></div><p>List：向左插入队列</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> redis
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> mysql
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">2</span>
</code></pre></div><p>查看队列</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrange <span class="token builtin class-name">test</span> <span class="token number">0</span> <span class="token number">10</span>
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;redis&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;mysql&quot;</span>
</code></pre></div><p>查看队列长度</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> llen <span class="token builtin class-name">test</span>
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">2</span>
</code></pre></div><p>删除元素</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 1 表示从左向右找第一个元素删</span>
<span class="token comment"># -1 表示从右向左找第一个元素删</span>
<span class="token comment"># 0 表示把该元素删完</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrem <span class="token builtin class-name">test</span> <span class="token number">1</span> mysql
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>

<span class="token comment"># # 从 start 删到 end，若 start &gt; end 则删完</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> ltrim <span class="token builtin class-name">test</span> <span class="token number">1</span> <span class="token number">0</span> 
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>
</code></pre></div><p>Hash：一个嵌套的哈希表<code>Map&lt;String, Map&lt;String, Object&gt;&gt;</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 获取key表中itme对应的值</span>
<span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">hget</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">String</span> item<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> item<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 获取整个Hash表</span>
<span class="token keyword">public</span> <span class="token class-name">Map</span> <span class="token function">hmget</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">entries</span><span class="token punctuation">(</span>key<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

</code></pre></div><p>Zset / SortedSet：有序集合，每个元素有一个 double 类型的权重，Zset 将根据权重对元素进行排序<code>Map&lt;String, Map&lt;String, Double&gt;&gt;</code></p> <ul><li>zadd key weight val：添加成员，weight 为权重</li> <li>zrange start end：查询下标 start 到 end 的元素</li> <li>zrem key member：删除成员</li> <li>zcard key：查询数量</li></ul> <p>特殊数据类型支持</p> <ul><li>Geospatial（地理空间）：用于存储地理位置信息，支持距离计算、范围查询等功能</li> <li>HyperLogLog：用于基数统计（估算集合中不重复元素的数量），内存效率极高，适用于大数据量的去重计数</li> <li>Bitmap（位图）：基于字符串类型的二进制位操作，适合处理大量状态标记场景</li></ul> <h3 id="redis-持久化方法"><a href="#redis-持久化方法" class="header-anchor">#</a> Redis 持久化方法</h3> <blockquote><p>日志和快照</p></blockquote> <p>Redis 有两种持久化方法，RDB（Redis Database）和 AOF（Append Only File）</p> <ol><li>RDB：在指定间隔（小时为单位）新 fork 一个子线程来保存数据集的时间点<strong>快照</strong></li> <li>AOF：使用后台进程记录服务器接收到的每一个写操作，类似于<strong>写日志</strong>，这些操作可以在服务器启动时重新执行，以重建原始数据集</li></ol> <p>从保存的频率、资源的消耗、恢复的速度上来看</p> <ul><li>AOF 的持久化更密集（以秒为单位进行记录），但记录的是写命令日志，在恢复时重新进行写，恢复较慢</li> <li>而 RBD 的备份更松散（以小时为单位），且保存更耗费资源，但快照保存的更为完整，允许大数据集快速重启</li></ul> <p>其中</p> <ul><li>保存的频率决定了数据安全等级，频率越高，数据一致性保障越高，AOF fsync 1s 能够应对突然断电的情况</li> <li>存储的消耗上，AOF 比 RBD 消耗更高，因为快照文件更为紧凑</li> <li>性能上，一般而言 RBD 比 AOF 更好，但即使 fsync 每秒一次，AOF 性能表现仍然不错</li></ul> <p>值得注意的是：AOF 方式中，即使日志由于某种原因（磁盘满或其他原因）以一个写了一半的命令结束，redis-check-aof 工具能轻松修复</p> <p><a href="https://redis.io/docs/latest/operate/rs/databases/configure/database-persistence/" target="_blank" rel="nofollow noopener noreferrer">配置数据库持久化 | 文档 - Configure database persistence | Docs<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>数据库持久化选项</p> <table><thead><tr><th>Options 选项</th> <th>Description 描述</th></tr></thead> <tbody><tr><td>None</td> <td>完全不持久化到磁盘</td></tr> <tr><td>Append-only file (AOF) - fsync every write</td> <td>数据每次写入命令都 fsync 到磁盘</td></tr> <tr><td>Append-only file (AOF) - fsync every 1 sec</td> <td>数据每次写入命令每秒同步到磁盘</td></tr> <tr><td>Snapshot, every 1 hour</td> <td>数据库每小时创建一次快照</td></tr> <tr><td>Snapshot, every 6 hours</td> <td>数据库每 6 小时创建一次快照</td></tr> <tr><td>Snapshot, every 12 hours</td> <td>数据库每 12 小时创建一次快照</td></tr></tbody></table> <h3 id="redis-分布式会话"><a href="#redis-分布式会话" class="header-anchor">#</a> Redis 分布式会话</h3> <p>见 [聊天室 - SpringBoot + WebSockets | Northboat](https://northboat.github.io/pages/5455e2/#分布式 Session)</p> <h3 id="redis-限流算法"><a href="#redis-限流算法" class="header-anchor">#</a> Redis 限流算法</h3> <p>见 <a href="https://northboat.github.io/pages/2bb10d/" target="_blank" rel="nofollow noopener noreferrer">网银系统 - SpringBoot + Redis | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="redis-分布式-id"><a href="#redis-分布式-id" class="header-anchor">#</a> Redis 分布式 ID</h3> <p>类似于分布式会话的键值存储，只不过上面存的是 SessionId，这里存的是用户 ID，用一个远端的 Map 结构这样去保证主键唯一，只不过 Session 会话的键是由后端服务器哈希的，分布式 ID 是由 Redis 自增生成的</p> <p>在分布式系统中，要保证 ID 的唯一性，粗糙方案</p> <ol><li>UUID：空间大，无序</li> <li>MySQL 自增 ID：性能差，单点故障</li></ol> <p>较好的方案</p> <ol><li><strong>Redis 自增 ID：多机设置不同初始 ID 和不同步长</strong></li> <li>雪花算法（Snowflake）：生成 64 位的 ID，包含时间戳、机器 ID 和序列号；高性能、有序，但依赖时钟同步</li></ol> <h3 id="redis-分布式锁"><a href="#redis-分布式锁" class="header-anchor">#</a> Redis 分布式锁</h3> <blockquote><p>redis 可以使用 watch 机制实现乐观锁</p></blockquote> <p>由于要保证分布式系统的性能，分布式锁一般都是乐观锁，与之对应的是悲观锁</p> <p>悲观锁是将资源锁住，等一个之前获得锁的线程释放锁之后，下一个线程才可以访问。而乐观锁采取了一种宽泛的态度，通过某种方式不加锁来处理资源，比如通过给记录加 version 或 timestamp 来操作数据（比如 CAS 策略），<strong>性能较悲观锁有很大的提高</strong></p> <ul><li>像 synchronized、Lock、ReadWriteLock 均为悲观锁</li> <li>而原子类例如 AtomicInteger 用的实际上是 CAS 机制，所以是一个乐观锁 → 但是没有引入版本控制，所以会出现 ABA 问题（A→B→A），详见 - <a href="https://northboat.github.io/pages/479c11/#%E4%BB%80%E4%B9%88%E6%98%AF-cas" target="_blank" rel="nofollow noopener noreferrer">原子性、单例模式和 CAS | 北船<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>还有一种乐观锁的理解：Git</p> <ul><li>我们只有在 push 的时候才会进行锁的检查，返回错误信息</li> <li>无论是 add 还是 commit，都是不上锁的（乐观的默认可执行），碰到问题（push 版本不对）再去解决</li></ul> <p>当然，我们在此处只讨论分布式锁的实现，需要明确的是，分布式锁既可以是悲观的也可以是乐观的，这要根据具体场景进行设计考量</p> <p>Redission，基于 Redis 集群的分布式锁，本质上就是维护同一个键值对，作为 Lock，获取时上锁，获取前检查这个键值对是否有锁，释放时解锁</p> <h3 id="redis-布隆过滤器"><a href="#redis-布隆过滤器" class="header-anchor">#</a> Redis 布隆过滤器</h3> <blockquote><p>Redis BF</p></blockquote> <p>Redis 的模块组件</p> <h3 id="redis-事物"><a href="#redis-事物" class="header-anchor">#</a> Redis 事物</h3> <blockquote><p>Redis + Lua 脚本是实现事务的常见搭配</p></blockquote> <p>事物：一组命令的集合，如多条 SQL，入队出队依次执行，事物中的所有命令都会被序列化并按顺序执行，事务中的多条 SQL 作为一个整体，要么都成功，要么都失败</p> <p>ACID 原则：原子性、一致性、隔离性、持久性</p> <ul><li>redis 单条命令保证原子性，但 redis 事物不保证原子性</li> <li>redis 事务没有隔离级别的概念，所有命令在事务中并没有直接被执行，只有发起执行命令的时候才会执行（exec）</li></ul> <p>redis 事务的一次正常执行</p> <ol><li>开启事务：multi</li> <li>命令入队：依次写命令</li> <li>执行事务：exec</li></ol> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k1 v1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k3 v3
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>

</code></pre></div><p>放弃事务：discard（在 multi 后、exec 前执行，队列中所有命令都不会执行）</p> <p>事务报错：编译型异常，代码有问题，编译都过不了，整个事务都不会被执行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k1 v1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> getset k3

<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>

</code></pre></div><p>运行时异常：如果事务队列中某个命令存在某个问题，类似与 RuntimeException，在执行事务时，其他命令可以正常执行，错误命令抛出异常</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> k1 <span class="token string">&quot;v1&quot;</span>

<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span>
</code></pre></div><h3 id="redis-缓存与穿透击穿雪崩"><a href="#redis-缓存与穿透击穿雪崩" class="header-anchor">#</a> Redis 缓存与穿透击穿雪崩</h3> <p>缓存设计：在 <a href="http://northboat.github.io/pages/548662/#redis-%E7%BC%93%E5%AD%98%E8%AE%BE%E8%AE%A1" target="_blank" rel="nofollow noopener noreferrer">多功能文档内容生成处理平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 有所记载</p> <p>如何避免缓存灾难三兄贵？</p> <ul><li><p>**什么是缓存穿透？**用户始终请求 Redis 缓存和 MySQL 数据库中都不存在的数据，这样会穿透缓存，每次都打在数据库，拖慢应用</p> <p>解决办法：给这个“不存在的热点数据”存一个值为 null 的缓存</p></li> <li><p>**什么是缓存击穿？**单点热 Key 过期，对这个 Key 的请求在同时全打在了 MySQL</p> <p>解决办法：有条件的情况下，缓存不设置有效期；给读 MySQL 加锁，而对读 Redis 不做限制</p></li> <li><p>**什么是缓存雪崩？**大量缓存同时过期，导致请求全打在 MySQL</p> <p>解决办法：防止热 Key 统一过期，设置随机的过期时延；设置限流和熔断降级机制，如当数据库压力超过阈值，返回兜底的空数据</p></li></ul> <p>缓存穿透、击穿和雪崩，本质上都是缓存失效，导致数据库的压力，只不过穿透和击穿是“点”的问题，即单个热 Key 的问题，而雪崩是“面”的问题，是大量 Key 同时失效的雪崩，显然后者事故级别远大于前者</p> <p><strong>大 Key 和热 Key 如何去处理？</strong></p> <p>大 Key 就是指字段很大的键值对，常见的处理就是进行<strong>字段拆分</strong>；而热 Key 就是高频的缓存字段，由于过于“热”，需要对其做<strong>缓存分级</strong>，比如在客户端存一份，服务器内存存一份，再在 Redis 存一份</p> <h3 id="redis-主从同步"><a href="#redis-主从同步" class="header-anchor">#</a> Redis 主从同步</h3> <blockquote><p>Redis 主从架构如何避免脏读</p></blockquote> <p>参考</p> <ul><li><a href="https://juejin.cn/post/7383957603016048655" target="_blank" rel="nofollow noopener noreferrer">考考你Redis主从，就知道有没深入Redis大家好，我是南哥。 一个对Java程序员进阶成长颇有研究的人，今天继续给大 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2448914" target="_blank" rel="nofollow noopener noreferrer">Redis部署方案的演进-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在 Redis 主从架构中</p> <ul><li><strong>主节点</strong>：负责处理写操作（如 SET、DEL），并将写操作同步到从节点</li> <li><strong>从节点</strong>：负责处理读操作（如 GET），并提供数据的副本</li></ul> <p>这也是 CQRS 的一种具体实现，即读写分离架构</p> <p>在 Redis 集群中，这样的复制和 Eureka 一样，属于异步复制，均属于 AP 系统（可用性大于一致性）</p> <ul><li>由于主从同步是异步的，写操作在主节点完成后，并不会立即同步到从节点，因此在同步完成之前，从节点可能会返回旧数据，导致<strong>脏读</strong></li></ul> <p>一个很经典的避免脏读的方法：<strong>读写锁</strong>（写时禁读）</p> <p>但经典的解决方案导致经典的问题</p> <ol><li>性能瓶颈：写操作期间禁止读操作，会导致读请求被阻塞，降低系统的并发性能</li> <li>系统卡死：若主节点的写 I/O 阻塞，整个系统可能会卡住，影响可用性</li> <li>复杂性：实现分布式读写锁会增加系统的复杂性</li></ol> <p>主从结构下，避免脏读除了读写锁还有什么方法呢？（天美 /(ㄒoㄒ)/~~）</p> <p>1️⃣ 写后同步等待</p> <p>刚刚提到，用读写锁，实际上是分布式锁的一种应用，这与“写后同步等待”不同，“写后同步等待”实际上就类似于 Eureka 的同步复制机制，主节点写完后对所有副节点进行阻塞的同步更新，更新完成后，才可以执行读操作</p> <p>这可以使用 Redis 的 Wait 命令实现</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key value
WAIT <span class="token number">1</span> <span class="token number">1000</span>  <span class="token comment"># 等待至少 1 个从节点同步完成，超时时间为 1000 毫秒</span>
</code></pre></div><p>2️⃣ 版本号或时间戳机制</p> <p>为每个键（Key）添加版本号或时间戳，客户端在读取数据时检查版本号或时间戳，确保读取的是最新数据</p> <p>优点</p> <ul><li>不需要阻塞读操作，性能较高</li> <li>可以灵活控制数据的一致性级别</li></ul> <p>缺点</p> <ul><li>需要在客户端实现额外的逻辑</li> <li>增加了数据存储的开销（多一个存储字段）</li></ul> <p>实现方式：在写操作时，更新键的版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key:version <span class="token number">1</span>
SET key:value <span class="token string">&quot;data&quot;</span>
</code></pre></div><p>在读操作时，检查版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>GET key:version
GET key:value
</code></pre></div><p>这里的读是指一次事务中的前后两次读（脏读的本质），在后一次做一个版本的检查，比如刚进入时读一次数据（这个数据上带一个版本号，或时间戳），然后在退出函数时再读一次，若版本号不同，则按后一次读出的数据为准</p> <p>3️⃣ 最终一致性容忍</p> <p>原理：接受一定时间内的脏读，通过业务逻辑容忍最终一致性</p> <p>优点</p> <ul><li>性能最高，没有额外的同步开销</li> <li>适合对一致性要求不高的场景</li></ul> <p>缺点：不适用于对一致性要求严格的场景（如金融交易）</p> <p>实现方式：在业务逻辑中处理脏读问题，例如</p> <ul><li>对脏读不敏感的数据（如用户昵称、文章内容）可以直接使用从节点读取</li> <li>对脏读敏感的数据（如余额、库存）可以从主节点读取</li></ul> <p><strong>注意，我们可以强制用户在主节点上读取数据，这样可以保证不会出现脏读，代价是主节点负担较大</strong>，所以这里的实现采取了折中的方案，敏感数据限定读主节点，非敏感数据读副节点</p> <p>那么“最终一致性容忍”是个什么情况呢，允许了一部分的脏读，但换回了相当一部分的性能</p> <p>4️⃣ 强制读主节点</p> <p>对于敏感数据，强制性的让用户只能读取主节点内容，由于 Redis 是单线程的原子操作，单独读写一个节点，当然不会发生脏读啦</p> <p>随之而来的是主节点负担增加，从而拖慢读写性能</p> <h3 id="redis-消息队列"><a href="#redis-消息队列" class="header-anchor">#</a> Redis 消息队列</h3> <p>本质上是利用 Redis 的 List 做消息队列，左进右出</p> <h3 id="redis-json"><a href="#redis-json" class="header-anchor">#</a> Redis Json</h3> <p>Redis Rejson，Redis 的模块组件</p> <h3 id="redis-search"><a href="#redis-search" class="header-anchor">#</a> Redis Search</h3> <p>倒排索引 → 模糊搜索，让 Redis 代替 MySQL 运行</p> <h3 id="redis-向量存储"><a href="#redis-向量存储" class="header-anchor">#</a> Redis 向量存储</h3> <blockquote><p>Redis Vectorset</p></blockquote> <h2 id="分布式搜索引擎-es"><a href="#分布式搜索引擎-es" class="header-anchor">#</a> 分布式搜索引擎 ES</h2> <h3 id="elasticsearch"><a href="#elasticsearch" class="header-anchor">#</a> Elasticsearch</h3> <blockquote><p><a href="https://www.cnblogs.com/buchizicai/p/17093719.html" target="_blank" rel="nofollow noopener noreferrer">ElasticSearch (ES从入门到精通一篇就够了) - 不吃紫菜 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>ELK，Elastic Stack，是以 ElasticSearch 为核心的技术栈，包括 Beats、<strong>Logstash</strong>、Kibana、<strong>ElasticSerach</strong>，被广泛应用在日志数据分析、实时监控等领域</p> <ol><li>数据可视化：Kibana</li> <li>存储、计算、搜索数据：Elasticsearch</li> <li>数据抓取：Logstash、Beats</li></ol> <p>ES 的核心在于倒排索引（相对于关系型数据库的正向索引而言），在模糊搜索时速度很快</p> <p>其核心依仗于 BM25 算法（一开始是 TF-IDF 算法）在 5.1 版本后改为 BM25，其相关分数计算如下</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="67.07ex" height="6.555ex" role="img" focusable="false" viewBox="0 -1562.5 29645.1 2897.2" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-3.02ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D446" d="M308 24Q367 24 416 76T466 197Q466 260 414 284Q308 311 278 321T236 341Q176 383 176 462Q176 523 208 573T273 648Q302 673 343 688T407 704H418H425Q521 704 564 640Q565 640 577 653T603 682T623 704Q624 704 627 704T632 705Q645 705 645 698T617 577T585 459T569 456Q549 456 549 465Q549 471 550 475Q550 478 551 494T553 520Q553 554 544 579T526 616T501 641Q465 662 419 662Q362 662 313 616T263 510Q263 480 278 458T319 427Q323 425 389 408T456 390Q490 379 522 342T554 242Q554 216 546 186Q541 164 528 137T492 78T426 18T332 -20Q320 -22 298 -22Q199 -22 144 33L134 44L106 13Q83 -14 78 -18T65 -22Q52 -22 52 -14Q52 -11 110 221Q112 227 130 227H143Q149 221 149 216Q149 214 148 207T144 186T142 153Q144 114 160 87T203 47T255 29T308 24Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(645,0)"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q1 :0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>S</mi><mi>c</mi><mi>o</mi><mi>r</mi><mi>e</mi><mo stretchy="false">(</mo><mi>Q</mi><mo>,</mo><mi>d</mi><mo stretchy="false">)</mo><mo>=</mo><munderover><mo data-mjx-texclass="OP">∑</mo><mrow data-mjx-texclass="ORD"><mi>i</mi></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></munderover><mi>log</mi><mo data-mjx-texclass="NONE">⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mfrac><mrow><mi>N</mi><mo>−</mo><mi>n</mi><mo>+</mo><mn>0.5</mn></mrow><mrow><mi>n</mi><mo>+</mo><mn>0.5</mn></mrow></mfrac><mo stretchy="false">)</mo><mo>⋅</mo><mfrac><msub><mi>f</mi><mi>i</mi></msub><mrow><msub><mi>f</mi><mi>i</mi></msub><mo>+</mo><msub><mi>k</mi><mn>1</mn></msub><mo>⋅</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>b</mi><mo>+</mo><mi>b</mi><mo>⋅</mo><mfrac><mrow><mi>d</mi><mi>l</mi></mrow><mrow><mi>a</mi><mi>v</mi><mi>g</mi><mi>d</mi><mi>l</mi></mrow></mfrac><mo stretchy="false">)</mo></mrow></mfrac></math></mjx-assistive-mml></mjx-container><p>与 MySQL 的对比</p> <table><thead><tr><th><strong>MySQL</strong></th> <th><strong>Elasticsearch</strong></th> <th><strong>说明</strong></th></tr></thead> <tbody><tr><td>Table</td> <td>Index</td> <td>索引（index），就是文档的集合，类似数据库的表(table)</td></tr> <tr><td>Row</td> <td>Document</td> <td>文档（Document），就是一条条的数据，类似数据库中的行（Row），文档都是 JSON 格式</td></tr> <tr><td>Column</td> <td>Field</td> <td>字段（Field），就是 JSON 文档中的字段，类似数据库中的列（Column）</td></tr> <tr><td>Schema</td> <td>Mapping</td> <td>Mapping（映射）是索引中文档的约束，例如字段类型约束。类似数据库的表结构（Schema）</td></tr> <tr><td>SQL</td> <td>DSL</td> <td>DSL 是 elasticsearch 提供的JSON风格的请求语句，用来操作 elasticsearch，实现CRUD</td></tr></tbody></table> <p>像操纵 MySQL 的 SQL 语句一样，本质上都是使用 DSL 对 ES 进行 CRUD，无论是命令行还是 API 调用，都是在进行这一工作</p> <h3 id="索引库和文档"><a href="#索引库和文档" class="header-anchor">#</a> 索引库和文档</h3> <p>索引库和文档 = 数据表和数据</p> <p>索引库用以规定数据的存储格式，例如一个 /hotel 的索引库</p> <div class="language-json extra-class"><pre class="language-json"><code>PUT /hotel

        <span class="token property">&quot;index&quot;</span><span class="token operator">:</span> <span class="token boolean">false</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;price&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;integer&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;score&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;integer&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;brand&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;city&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>

      <span class="token property">&quot;business&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>

    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>java.version</span><span class="token punctuation">&gt;</span></span>1.8<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>java.version</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>elasticsearch.version</span><span class="token punctuation">&gt;</span></span>7.12.1<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>elasticsearch.version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>properties</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>初始化 RestHighLevelClient 并注入 Bean</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Bean</span>
<span class="token keyword">public</span> <span class="token class-name">RestHighLevelClient</span> <span class="token function">client</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>

	<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>单元测试</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootTest</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">HotelIndexTest</span> <span class="token punctuation">{</span>

        <span class="token keyword">this</span><span class="token punctuation">.</span>client <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">RestHighLevelClient</span><span class="token punctuation">(</span><span class="token class-name">RestClient</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span>
                <span class="token class-name">HttpHost</span><span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token string">&quot;http://192.168.150.101:9200&quot;</span><span class="token punctuation">)</span>
        <span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token annotation punctuation">@Test</span>

    <span class="token punctuation">}</span>

    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>CRUD 文档库 Hotel，本质上就是<strong>拼接字符串和 HTTP 请求</strong>，向 ES 数据库<strong>发送 DSL 命令</strong>，而后 ES 返回执行结果的过程</p> <p>ES 的查询类似于 SQL 的编写，有很多查询条件和复合嵌套规则</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/02/25, 00:59:34</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/0d525f/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">关系数据库</div></a> <a href="/pages/d7c3d3/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">容器技术</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
