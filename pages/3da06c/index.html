rkJggg==">控制反转与设计模式<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>先学会使用再研究源码，切勿本末倒置</p> <p>参考文献</p> <ul><li><a href="https://github.com/DerekYRC/mini-spring/blob/main/changelog.md" target="_blank" rel="nofollow noopener noreferrer">mini-spring/changelog.md at main · DerekYRC/mini-spring<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://bugstack.cn/md/spring/develop-spring/2021-05-16-%E7%AC%AC1%E7%AB%A0%EF%BC%9A%E5%BC%80%E7%AF%87%E4%BB%8B%E7%BB%8D%EF%BC%8C%E6%89%8B%E5%86%99Spring%E8%83%BD%E7%BB%99%E4%BD%A0%E5%B8%A6%E6%9D%A5%E4%BB%80%E4%B9%88%EF%BC%9F.html" target="_blank" rel="nofollow noopener noreferrer">第01章：开篇介绍，我要带你撸 Spring 啦！ | 小傅哥 bugstack 虫洞栈<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>“对于一个知识的学习来说，写代码只是最后的步骤，往往整个思路、设计、方案，才更重要，只要你知道了因为什么、所以什么，才能让你有一个真正的理解”</p> <p>IoC 容器：由 BeanDefinitionMap、BeanFactoryPostProcessor、BeanPostProcessor、BeanMap 等等容器共同组成、共同完成、提供依赖注入和控制反转功能的一组集合</p> <h2 id="最简单的-bean-管理"><a href="#最简单的-bean-管理" class="header-anchor">#</a> 最简单的 Bean 管理</h2> <h3 id="反射和动态代理"><a href="#反射和动态代理" class="header-anchor">#</a> 反射和动态代理</h3> <p>反射和动态代理是实现 IoC 控制反转和 Bean 管理的核心技术和思路</p> <p>反射：从字节码获取类信息，从而反向构造对象的过程</p> <ul><li>通过类名（字符串）去拿取字节码信息，再通过解析字节码中包含的类信息（如类名、方法、字段等元数据）来实现对类的动态操作，如创建、方法调用等</li> <li>这是一个反向构造的过程，在 Spring 中，多用注解的形式，对所有的对象进行一个反向构造和统一管理，即 IoC 的实现</li></ul> <p>一个正向构造的例子</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Apple</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//直接初始化，「正射」</span>
apple<span class="token punctuation">.</span><span class="token function">setPrice</span><span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>两个反射创建对象的例子</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 通过 Class 对象的 newInstance 方法</span>
<span class="token class-name">Class</span> clz <span class="token operator">=</span> <span class="token class-name">Apple</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">;</span>
<span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Apple</span><span class="token punctuation">)</span>clz<span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 通过 Constructor 对象 newInstance 方法</span>
<span class="token class-name">Class</span> clz <span class="token operator">=</span> <span class="token class-name">Apple</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">;</span>
<span class="token class-name">Constructor</span> constructor <span class="token operator">=</span> clz<span class="token punctuation">.</span><span class="token function">getConstructor</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Apple</span><span class="token punctuation">)</span>constructor<span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>通过 Constructor 对象创建类对象可以选择特定构造方法，而通过 Class 对象则只能使用默认的无参数构造方法</p> <p>下面的代码调用了一个有参数的构造方法进行了类对象的初始化</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">Class</span> clz <span class="token operator">=</span> <span class="token class-name">Apple</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">;</span>
<span class="token class-name">Constructor</span> constructor <span class="token operator">=</span> clz<span class="token punctuation">.</span><span class="token function">getConstructor</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> <span class="token keyword">int</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Apple</span><span class="token punctuation">)</span>constructor<span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token string">&quot;红富士&quot;</span><span class="token punctuation">,</span> <span class="token number">15</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>这两种方法其本质上都是 Method.invoke 的交互，但是其具体实现方式在内部有两种</p> <ul><li>C++ native 原生实现：Native 版本一开始启动快，但是随着运行时间边长，速度变慢</li> <li>Java 实现：Java 版本一开始加载慢，但是随着运行时间边长，速度变快</li> <li>JDK 源码使用了代理的设计模式（一个接口，两种代理实现）去进行优化：第一次类加载使用<code>NativeMethodAccessorImpl</code>，当反射调用超 15 次后，使用<code>MethodAccessorGenerator</code>生成的<code>MethodAccessorImpl</code>对象实现反射</li></ul> <p>动态代理</p> <ul><li>动态：类的创建是动态进行的，在需要时才进行创建，而不是一开始全部 new 好</li> <li>代理：有代理，就有原主，这里的代理和代理模式中的代理有相似之处，例如一个父类接口，有两个子类实现，这两个子类就是父类的代理（在实例化时，创建的是父类，实例化的是子类代理）</li></ul> <p>动态代理的实现和反射机制、字节码增加技术息息相关，常常被应用于 IoC / AOP 场景</p> <h3 id="record"><a href="#record" class="header-anchor">#</a> record</h3> <p><strong>com.northboat.winterframework.beans.factory.config.BeanDefinition</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Object</span> bean<span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre></div><p>record 是 Java 14 引入的语法糖，用于简化数据类，包括自动的构造方法、字段访问、<code>equals()</code>、<code>hashCode()</code>、<code>toString</code>，其本质上是<strong>隐式的 final 类</strong></p> <blockquote><p><a href="https://juejin.cn/post/7515379500152635418" target="_blank" rel="nofollow noopener noreferrer">一文搞懂Java Record：从入门到避坑，解锁高效编程新姿势！ - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>以上 record 等价于</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">class</span> <span class="token class-name">BeanDefinition</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Object</span> bean<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Object</span> bean<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">this</span><span class="token punctuation">.</span>bean <span class="token operator">=</span> bean<span class="token punctuation">;</span> <span class="token punctuation">}</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">return</span> bean<span class="token punctuation">;</span> <span class="token punctuation">}</span>
    <span class="token comment">// ... equals(), toString()</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="beanfactory"><a href="#beanfactory" class="header-anchor">#</a> BeanFactory</h3> <p>BeanFactory：维护一个<code>Map&lt;String, BeanDefinition&gt; beanDefinitionMap</code>，通过类名返回对应的<code>BeanDefinition.bean()</code></p> <h2 id="bean-的自动注入"><a href="#bean-的自动注入" class="header-anchor">#</a> Bean 的自动注入</h2> <h3 id="单例模块"><a href="#单例模块" class="header-anchor">#</a> 单例模块</h3> <p>通过 Class 类进行对象的自动创建，复杂的继承设计（司马了），BeanDefinition 中的 Bean 改为 Class 类型，在 Bean Factory 中维护两个核心的 Map</p> <ul><li><code>Map&lt;String, Object&gt; singletonObjects</code>存放已实例化的单例对象</li> <li><code>Map&lt;String, BeanDefinition&gt; beanDefinitionMap</code>存放 Bean 的类 Class 信息，用于 Bean 对象的自动实例化</li></ul> <p>核心思路是：在 getBean 时，先从单例表<code>singletonObjects</code>中 get，若没有，则根据 Bean 信息表<code>beanDefinitionMap</code>中的类信息进行 createBean 并放入单例表</p> <img src="/assets/img/spring-3-02.9ecce121.png"> <h3 id="concurrenthashmap"><a href="#concurrenthashmap" class="header-anchor">#</a> ConcurrentHashMap</h3> <p>这里存在一个单例的并发管理问题，即用于存放单例对象或者 Bean 信息的哈希表是否要采用 ConcurrentHashMap，Spring 源码中</p> <ul><li><code>DefaultSingletonBeanRegistry</code>的<code>singletonObjects</code>是<code>ConcurrentHashMap</code></li> <li><code>DefaultListableBeanFactory</code>的<code>beanDefinitionMap</code>是普通<code>HashMap</code>，但通过<code>beanDefinitionLock</code>锁保证线程安全</li> <li>获取 Bean 时通过<code>getSingleton()</code>方法结合双重检查锁 + 同步块确保单例</li></ul> <p>这是由于，<code>beanDefinitionMap</code>在起 Bean 时，scan Class 类就完成了写，在之后均为读操作，不涉及频繁的读写交替，而单例表<code>singletonObjects</code>除了频繁的读任务，当找不到对象时，还要被<code>beanDefinitionMap</code>写，所以采用更安全但效率更低的 ConcurrentHashMap</p> <p>另外还有一个问题，上面也说了，BeanDefinition 存放<code>Class bean</code>，在通过 BeanDefinition 创建对象时，采用 newInstance 的方式，这个方法在 Java 9 就已废弃，并且无法接受含入参的对象创建</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
<span class="token keyword">try</span> <span class="token punctuation">{</span>
    bean <span class="token operator">=</span> beanDefinition<span class="token punctuation">.</span><span class="token function">getBeanClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InstantiationException</span> <span class="token operator">|</span> <span class="token class-name">IllegalAccessException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Instantiation of bean failed&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>该如何解决呢？</p> <h2 id="含入参的-autowire-策略"><a href="#含入参的-autowire-策略" class="header-anchor">#</a> 含入参的 Autowire 策略</h2> <h3 id="策略模式"><a href="#策略模式" class="header-anchor">#</a> 策略模式</h3> <p>接入实例化策略 InstantiationStrategy</p> <img src="/assets/img/spring-4-02.931527f1.png"> <p>实例化策略接口</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">InstantiationStrategy</span> <span class="token punctuation">{</span>
    <span class="token comment">// 初始化 Bean</span>
    <span class="token class-name">Object</span> <span class="token function">instantiate</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Constructor</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> ctor<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>采用 JDK 和 CGLib 两种方式实现 instantiate 接口</p> <ul><li><code>SimpleInstantiationStrategy</code>：通过构造函数 ctor 和入参列表 args 进行 newInstance</li> <li><code>CglibSubclassingInstantiationStrategy</code>：同理，enhancer 通过<code>setSuperclass → setCallback → create</code>过程创建对象</li></ul> <h3 id="dogetbean"><a href="#dogetbean" class="header-anchor">#</a> doGetBean</h3> <p>然后是改造原有的 createBean 过程：<code>getBean(类名, 参数)</code> → 无 Bean → <code>createBean(类名, 参数, 策略)</code></p> <p>增加一个根据构造入参获取 Bean 的方法</p> <p><strong>com.northboat.winterframework.beans.factory.BeanFactory</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">BeanFactory</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span><span class="token punctuation">;</span>

    <span class="token comment">// 传递构造函数入参获取实例对象</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在下层 AbstractBeanFactory 中对 getBean 进行改写</p> <p><strong>com.northboat.winterframework.beans.factory.support.BeanFactory</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractBeanFactory</span> <span class="token keyword">extends</span> <span class="token class-name">DefaultSingletonBeanRegistry</span> <span class="token keyword">implements</span> <span class="token class-name">BeanFactory</span> <span class="token punctuation">{</span>
    <span class="token comment">// 实现 BeanFactory 的 getBean 接口</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token function">doGetBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token function">doGetBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>将统一的获取 Bean 逻辑写在 doGetBean 中</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">&gt;</span></span> <span class="token class-name">T</span> <span class="token function">doGetBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
    <span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token function">getSingleton</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span>bean <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token punctuation">(</span><span class="token class-name">T</span><span class="token punctuation">)</span> bean<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 当 Bean Object 并未初始化，使用 Class 对象进行实例化</span>
    <span class="token class-name">BeanDefinition</span> beanDefinition <span class="token operator">=</span> <span class="token function">getBeanDefinition</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token punctuation">(</span><span class="token class-name">T</span><span class="token punctuation">)</span> <span class="token function">createBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 获取 Bean Class 实例，用于创建 Bean Object</span>
<span class="token keyword">protected</span> <span class="token keyword">abstract</span> <span class="token class-name">BeanDefinition</span> <span class="token function">getBeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span><span class="token punctuation">;</span>

<span class="token comment">// 根据入参 args 创建 Object 并存入单例的 Map 中</span>
<span class="token keyword">protected</span> <span class="token keyword">abstract</span> <span class="token class-name">Object</span> <span class="token function">createBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span><span class="token punctuation">;</span>
</code></pre></div><p>createBean 逻辑在更下层的 AbstractAutowireCapableBeanFactory 的<code>createBeanInstance()</code>中实现，以此实现自动装配</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractAutowireCapableBeanFactory</span> <span class="token keyword">extends</span> <span class="token class-name">AbstractBeanFactory</span><span class="token punctuation">{</span>

    <span class="token comment">// 初始化实例化策略</span>
    <span class="token keyword">private</span> <span class="token class-name">InstantiationStrategy</span> instantiationStrategy <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CglibSubclassingInstantiationStrategy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">protected</span> <span class="token class-name">Object</span> <span class="token function">createBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
        <span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            bean <span class="token operator">=</span> <span class="token function">createBeanInstance</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Instantiation of bean failed&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token function">addSingleton</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> bean<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">protected</span> <span class="token class-name">Object</span> <span class="token function">createBeanInstance</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">Constructor</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> constructor <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
        <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass <span class="token operator">=</span> beanDefinition<span class="token punctuation">.</span><span class="token function">getBeanClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">Constructor</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">[</span><span class="token punctuation">]</span> declaredConstructors <span class="token operator">=</span> beanClass<span class="token punctuation">.</span><span class="token function">getDeclaredConstructors</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">Constructor</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> ctor<span class="token operator">:</span> declaredConstructors<span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">if</span><span class="token punctuation">(</span>args <span class="token operator">!=</span> <span class="token keyword">null</span> <span class="token operator">&amp;&amp;</span> ctor<span class="token punctuation">.</span><span class="token function">getParameterTypes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>length <span class="token operator">==</span> args<span class="token punctuation">.</span>length<span class="token punctuation">)</span><span class="token punctuation">{</span>
                constructor <span class="token operator">=</span> ctor<span class="token punctuation">;</span>
                <span class="token keyword">break</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token function">getInstantiationStrategy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">instantiate</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> constructor<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">InstantiationStrategy</span> <span class="token function">getInstantiationStrategy</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> instantiationStrategy<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这里直接用 Class.getParameterTypes 获取所有的构造函数，再和传入的构造函数进行参数长度的比较，若一致，则认定这是需要的构造函数</p> <h3 id="cglib-版本问题"><a href="#cglib-版本问题" class="header-anchor">#</a> CGLib 版本问题</h3> <p>新建带入参的 UserService</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">UserService</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">queryUserInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>name <span class="token operator">+</span> <span class="token string">&quot; is querying user info&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在 BeanFactory 中注册后进行 getBean</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">testBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>

    <span class="token class-name">DefaultListableBeanFactory</span> beanFactory <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultListableBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 通过 class 注册 Bean</span>
    <span class="token class-name">BeanDefinition</span> userServiceBean <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">,</span> userServiceBean<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 获取 Bean</span>
    <span class="token comment">// 第一次没有实例化，会调用 createBean</span>
    <span class="token class-name">UserService</span> userService <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">)</span> beanFactory<span class="token punctuation">.</span><span class="token function">getBean</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;northboat&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    userService<span class="token punctuation">.</span><span class="token function">queryUserInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>输出</p> <div class="language- extra-class"><pre class="language-text"><code>northboat is querying user info
</code></pre></div><p>这里需要解决一个 JDK 版本过高的问题，在 JDK 9 及以后，引入了更加严格的安全策略，不允许 CGLib 如此简单的创建代理类</p> <p>需要在编译命令处（<code>run</code>→<code>edit configurations</code>或者运行小箭头处点击三个浮点而后<code>edit</code>）的<code>Build and run</code>后缀添加</p> <div class="language-sh extra-class"><pre class="language-sh"><code>--add-opens java.base/java.lang<span class="token operator">=</span>ALL-UNNAMED
--add-opens java.base/java.lang.reflect<span class="token operator">=</span>ALL-UNNAMED
--add-opens java.base/java.security<span class="token operator">=</span>ALL-UNNAMED
</code></pre></div><p>以逃过安全审查（当然用 JDK 8 不会遇到这个问题）</p> <h2 id="属性注入和-bean-依赖"><a href="#属性注入和-bean-依赖" class="header-anchor">#</a> 属性注入和 Bean 依赖</h2> <p>对 BeanDefinition 进行进一步的改造</p> <ul><li>这是创建 Bean 对象的核心，包含对象的 Class 定义</li> <li>在这一阶段将引入对象的属性列表 PropertyValues，以便进行更深层次的初始化</li></ul> <p>这里暂不考虑 Bean 的循环依赖问题（让我想起 JVM 的类加载，双亲委派模型，“向上委派，向下查找”），只进行简单的对象属性注入和 Bean 对象依赖，即，在创建 Bean 时，同时填充该类的内置属性和内置的 Bean 对象</p> <img src="/assets/img/spring-5-01.c11361cb.png"> <h3 id="propertyvalues"><a href="#propertyvalues" class="header-anchor">#</a> PropertyValues</h3> <p>首先我们要让 BeanDefinition “拥有属性”，这一步很重要，通过一个<code>List&lt;PropertyValue&gt;</code>和<code>record PropertyValue(String name, Object value)</code>来实现</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">,</span> <span class="token class-name">Object</span> value<span class="token punctuation">)</span><span class="token punctuation">{</span> <span class="token comment">/* 省略一些 setter/getter */</span> <span class="token punctuation">}</span>
<span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">PropertyValue</span><span class="token punctuation">&gt;</span></span> propertyValueList<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">/* 省略一些 setter/getter */</span> <span class="token punctuation">}</span>
</code></pre></div><p>改写 BeanDefinition，自此一个 BeanDefinition 除了包含对应 Bean 的 Class 类，还包含其所有内置属性的信息（Bean 对象将被标注为 BeanReference）</p> <p><strong>com.northboat.winterframework.beans.factory.config.BeanDefinition</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">BeanDefinition</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">PropertyValues</span> propertyValues<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>beanClass <span class="token operator">=</span> beanClass<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>propertyValues <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass<span class="token punctuation">,</span> <span class="token class-name">PropertyValues</span> propertyValues<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>beanClass <span class="token operator">=</span> beanClass<span class="token punctuation">;</span>
        <span class="token comment">// 若传入的 propertyValues 为空，则创建一个空的 propertyValues</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>propertyValues <span class="token operator">=</span> propertyValues <span class="token operator">!=</span> <span class="token keyword">null</span> <span class="token operator">?</span> propertyValues <span class="token operator">:</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// setter and getter...</span>
<span class="token punctuation">}</span>
</code></pre></div><p>改写后的 BeanDefinition 将维护</p> <ul><li>当前 Bean 对应的 Class 类，用于 Bean 的创建</li> <li>一个<code>List&lt;Pair&lt;String, Object&gt;&gt;</code>的数据结构（<code>PropertyValues</code>），是当前 Bean 的属性列表，相当于属性填充的模板</li></ul> <h3 id="bean-依赖"><a href="#bean-依赖" class="header-anchor">#</a> Bean 依赖</h3> <p>即在一个 Bean 中，存在某个内置属性，同样是一个 Bean</p> <p>在 PropertyValues 中，对于 Bean 对象的表示（即当前 Bean 的内置属性包含另一个 Bean），用 BeanReference 来实现</p> <p>com.northboat.winterframework.beans.factory.config.BeanReference</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre></div><p>它只需要包含 Bean 引用的名字就行，譬如 UserService 含有 UserDao 这样一个 Bean</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserService</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> uId<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">UserDao</span> userDao<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>那么在其对应的 BeanDefinition 中的 PropertyValues，就会有一项</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 将 Bean 属性写入 propertyValues</span>
propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>而后，显然，填充属性是在 Bean 对象创建之后的一个操作，于是我们改动 createBean 的实现即可（在<code>AbstractAutowireCapableBeanFactory</code>中），在<code>createBeanInstance</code>后对创建的 Bean 对象进行属性填充</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Override</span>
<span class="token keyword">protected</span> <span class="token class-name">Object</span> <span class="token function">createBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
    <span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token keyword">try</span> <span class="token punctuation">{</span>
        bean <span class="token operator">=</span> <span class="token function">createBeanInstance</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 填充属性</span>
        <span class="token function">applyPropertyValues</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Instantiation of bean failed&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token function">addSingleton</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> bean<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>通过 hutool 的 BeanUtil 进行属性的填充</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">BeanUtil</span><span class="token punctuation">.</span><span class="token function">setFieldValue</span><span class="token punctuation">(</span><span class="token class-name">Object</span> bean<span class="token punctuation">,</span> <span class="token class-name">String</span> name<span class="token punctuation">,</span> <span class="token class-name">Object</span> value<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>以上函数将属性<code>name: value</code>填充至对象<code>bean</code>中</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token keyword">void</span> <span class="token function">applyPropertyValues</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span> bean<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        <span class="token class-name">PropertyValues</span> propertyValues <span class="token operator">=</span> beanDefinition<span class="token punctuation">.</span><span class="token function">getPropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">PropertyValue</span> propertyValue<span class="token operator">:</span> propertyValues<span class="token punctuation">.</span><span class="token function">getPropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token class-name">String</span> name <span class="token operator">=</span> propertyValue<span class="token punctuation">.</span><span class="token function">name</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">Object</span> value <span class="token operator">=</span> propertyValue<span class="token punctuation">.</span><span class="token function">value</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

            <span class="token comment">// 这里只是一个简单的模拟</span>
            <span class="token comment">// 就是说，如果当前的属性是 beanReference 的一个引用，说明这个属性也是一个 Bean</span>
            <span class="token comment">// 那么就直接从 Map 中 getBean 以获取这个 Bean 的实例化对象</span>
            <span class="token keyword">if</span><span class="token punctuation">(</span>value <span class="token keyword">instanceof</span> <span class="token class-name">BeanReference</span> beanReference<span class="token punctuation">)</span><span class="token punctuation">{</span>
                <span class="token comment">// 如果 A 依赖于 B，获取 B 的实例化</span>
                value <span class="token operator">=</span> <span class="token function">getBean</span><span class="token punctuation">(</span>beanReference<span class="token punctuation">.</span><span class="token function">beanName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token class-name">BeanUtil</span><span class="token punctuation">.</span><span class="token function">setFieldValue</span><span class="token punctuation">(</span>bean<span class="token punctuation">,</span> name<span class="token punctuation">,</span> value<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Error setting property values: &quot;</span> <span class="token operator">+</span> beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>测试代码</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">testBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>

    <span class="token class-name">DefaultListableBeanFactory</span> beanFactory <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultListableBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 注册 UserDao</span>
    beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserDao</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 设置内置属性 uId 和 userDao</span>
    <span class="token class-name">PropertyValues</span> propertyValues <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;uId&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;10001&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 注册 UserService 并将内置属性注入</span>
    <span class="token class-name">BeanDefinition</span> userServiceBean <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> propertyValues<span class="token punctuation">)</span><span class="token punctuation">;</span>
    beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">,</span> userServiceBean<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 获取 UserService Bean</span>
    <span class="token class-name">UserService</span> userService <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">)</span> beanFactory<span class="token punctuation">.</span><span class="token function">getBean</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    userService<span class="token punctuation">.</span><span class="token function">queryUserInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在构造 UserService 这个 Bean 时，根据他的 BeanDefinition，就会通过他内置的 PropertyValues 进行属性填充，例如</p> <ul><li>把<code>10001</code>填充进 UserService 的<code>uId</code>字段</li> <li>把<code>getBean(&quot;userDao&quot;)</code>填充进<code>userDao</code>字段（这里是一个对 Bean 的特殊处理，具体可以看<code>applyPropertyValues()</code>的代码）</li></ul> <p>输出</p> <div class="language- extra-class"><pre class="language-text"><code>Querying user info of 10001: northboat
</code></pre></div><p>说明 UserDao 被正常注入（<code>queryUserInfo()</code>正常调用返回<code>northboat</code>），uId 也被正常注入（查询的是用户<code>10001</code>）</p> <img src="/assets/img/image-20251124195822799.c6de24e1.png"> <p>打断点发现 UserDao 明显是 CGLib 生成的对象，说明在注入 UserDao 时进行了<code>getBean(&quot;userDao&quot;)</code>并触发了 UserDao 的 createBean</p> <p>这个 Bean 套 Bean 的自动注入有点优雅了，<code>getBean</code>的自动套娃实现</p> <h3 id="bean-的循环依赖"><a href="#bean-的循环依赖" class="header-anchor">#</a> Bean 的循环依赖</h3> <blockquote><p>不禁想问，Bean 的循环依赖到底是什么？该如何解决？</p></blockquote> <p>通过三级缓存解决循环依赖</p> <h2 id="资源加载器和-xml-解析器"><a href="#资源加载器和-xml-解析器" class="header-anchor">#</a> 资源加载器和 XML 解析器</h2> <p>设计目标：将 Bean 的注册通过 xml 配置文件自动化实现，把以下的三个步骤，通过 Spring 配置文件的方式将 Bean 对象实例化</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 注册 UserDao</span>
beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserDao</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 设置内置属性 uId 和 userDao</span>
<span class="token class-name">PropertyValues</span> propertyValues <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;uId&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;10001&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 注册 UserService 并将内置属性注入</span>
<span class="token class-name">BeanDefinition</span> userServiceBean <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> propertyValues<span class="token punctuation">)</span><span class="token punctuation">;</span>
beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">,</span> userServiceBean<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>问题的重点是：添加能解决 Spring 配置的读取、解析、注册 Bean 的操作</p> <h3 id="资源加载模块"><a href="#资源加载模块" class="header-anchor">#</a> 资源加载模块</h3> <img src="/assets/img/spring-6-02.2d4ae51e.png"> <p>上图描述了一个资源加载器的架构模块和功能</p> <p>那么在实际操作中，如何将这个“资源加载系统”接入现有的 Bean Factory？</p> <p>答案是：通过<code>BeanDefinitionRegistry</code>接口进行接入</p> <ul><li>在之前的代码中，<code>BeanDefinitionRegistry</code>早已提供了<code>registerBeanDefinition</code>方法，并在下层中实现（将 BeanDefinition 存入相应的 Map 中）。那么理论上，我只需要在资源加载器中传入这个 Map，就可以将解析出来的 Bean 信息进行 put</li> <li>或者更方便的方法是，直接传入一个<code>BeanDefinitionRegistry</code>，在解析时直接调用<code>registerBeanDefinition</code>将 Bean 注册到这个<code>BeanDefinitionRegistry</code>的 Map 中</li></ul> <p>这样处理不会影响下层其他功能的实现，即仅修改注册和与获取无关，无需修改<code>getBean/createBean</code> 的任何代码</p> <img src="/assets/img/spring-6-03.ab9a33ad.png"> <p>现在我们尝试做一个 Bean 的注入器 Reader，将<code>BeanDefinitionRegistry</code>和<code>ResourceLoader</code>注入，并实现 Bean 的加载</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractBeanDefinitionReader</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractBeanDefinitionReader</span> <span class="token keyword">implements</span> <span class="token class-name">BeanDefinitionReader</span> <span class="token punctuation">{</span>    
    <span class="token keyword">public</span> <span class="token class-name">AbstractBeanDefinitionReader</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinitionRegistry</span> registry<span class="token punctuation">,</span> <span class="token class-name">ResourceLoader</span> resourceLoader<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>registry <span class="token operator">=</span> registry<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>resourceLoader <span class="token operator">=</span> resourceLoader<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
   
    <span class="token comment">// getRegistry() / getResourceLoader() 略</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这一层仅进行注册器和加载器的构造，不进行具体的实现，我发现一个规律，Java 的一个接口设计</p> <ul><li>最上层是一个或多个 interface，将所有需要的方法罗列</li> <li>中间是多层 abstract class，会将上层接口的方法<strong>逻辑实现</strong>，像是一层伪码，会声明真正干事的代码方法，但逻辑仍留给下层实现</li> <li>下层是一个或多个 class，这一层会把所有的方法逻辑都实现</li></ul> <p>在下层进行<code>doLoadBeanDefinitions</code>逻辑的实现</p> <p><strong>com.northboat.winterframework.beans.factory.xml.XmlBeanDefinitionReader</strong></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">XmlBeanDefinitionReader</span> <span class="token keyword">extends</span> <span class="token class-name">AbstractBeanDefinitionReader</span> <span class="token punctuation">{</span>
     <span class="token keyword">public</span> <span class="token class-name">XmlBeanDefinitionReader</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinitionRegistry</span> registry<span class="token punctuation">,</span> <span class="token class-name">ResourceLoader</span> resourceLoader<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span>registry<span class="token punctuation">,</span> resourceLoader<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token comment">// loadBeanDefinitions(Resource resource)</span>
    <span class="token comment">// loadBeanDefinitions(Resource... resources)</span>
    <span class="token comment">// loadBeanDefinitions(String location)</span>
    <span class="token comment">// doLoadBeanDefinitions(InputStream inputStream)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在具体的使用中，我们先创建一个<code>DefaultListableBeanFactory</code>（这个类同时继承了 BeanFactory 和 BeanDefinitionRegistry）和一个 ResourceLoader</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 1.初始化 BeanFactory</span>
<span class="token class-name">DefaultListableBeanFactory</span> beanFactory <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultListableBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">DefaultResourceLoader</span> resourceLoader <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultResourceLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>而后将这俩一起丢到加载器中进行 Bean 加载</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 2. 读取配置文件&amp;注册Bean</span>
<span class="token class-name">XmlBeanDefinitionReader</span> reader <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">XmlBeanDefinitionReader</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">,</span> resourceLoader<span class="token punctuation">)</span><span class="token punctuation">;</span>
reader<span class="token punctuation">.</span><span class="token function">loadBeanDefinitions</span><span class="token punctuation">(</span><span class="token string">&quot;classpath:winter.xml&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>实际上就是：<code>XmlBeanDefinitionReader</code>通过<code>ResourceLoader</code>解析配置为一个个 BeanDefinition，然后将其 put 到<code>BeanDefinitionRegistry</code>对应的<code>Map&lt;String, BeanDefinition&gt;</code>里</p> <h3 id="泛型-getbean"><a href="#泛型-getbean" class="header-anchor">#</a> 泛型 getBean</h3> <p>晕了，别急，到这里已经可以实现类的自动加载，但现在引入一个新的需求，我想要的 getBean 的时候，自动返回对应的对象，而不是 Object 对象，即实现一个泛型<code>&lt;T&gt; T</code>的 getBean 方法，这里需要修改最上层位于 BeanFactory 接口的 getBean，而后在 AbstractBeanFactory 中进行具体的实现</p> <div class="language- extra-class"><pre class="language-text"><code>interface BeanFactory
+ &lt;T&gt; T getBean(String name, Class&lt;T&gt; requiredType)
↓
abstract class AbstractBeanFactory
+ &lt;T&gt; T getBean(String name, Class&lt;T&gt; requiredType)
</code></pre></div><p>其实实现很简单，就是将传入的<code>Class&lt;T&gt; requiredType</code>对原先返回 Object 的 getBean 进行一个强转</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">&gt;</span></span> <span class="token class-name">T</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">&gt;</span></span> type<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token punctuation">(</span><span class="token class-name">T</span><span class="token punctuation">)</span> <span class="token function">getBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这个泛型传递形式第一次见，传入一个<code>Class&lt;T&gt; type</code>，编译器会自动解析 T 为 type 的对象类型</p> <p>再然后，为了在后续扩展功能，仿照 Spring 的设计结构，引入更多的接口和继承，这里和 Bean 的配置加载以及泛型的返回都没啥关系，只是为了后续的扩展</p> <img src="/assets/img/spring-6-04.3ea64457.png"> <p>好，以上就是本次迭代的需求，在这一步我已经不能自己管理包结构了，有点复杂了，我需要照着教程来才能看懂</p> <p>现在的系统已经相当“冗余”了，至此的类继承关系如下图所示</p> <img src="/assets/img/xml-file-define-bean.5982e1a7.png"> <h2 id="设计模式详解"><a href="#设计模式详解" class="header-anchor">#</a> 设计模式详解</h2> <p>“23 种设计模式”是指《设计模式：可复用面向对象软件的基础》（Design Patterns: Elements of Reusable Object-Oriented Software）书中总结的 23 种经典 GoF 设计模式（Gang of Four，四人帮）</p> <ul><li>MVC 就像毛坯，而设计模式就是在精装，合理的设计模式使代码复杂，复杂之下蕴含了极强的扩展和解耦能力，如何选择和运用设计模式是一门精深的功夫，搬砖之于室内设计不外乎如此</li></ul> <p>这些模式分为三大类：创建型、结构型和行为型，可以通过以下方式帮助记忆</p> <ul><li>创建型（5个） → &quot;单工抽建原&quot;：工厂方法模式、<strong>抽象工厂模式</strong>、<strong>单例模式</strong>、建造者模式、原型模式</li> <li>结构型（7个） → &quot;适装代外桥组享&quot;：适配器模式、装饰器模式、<strong>代理模式</strong>、外观模式、桥接模式、组合模式、享元模式</li> <li>行为型（11个） → &quot;策模观迭责命状备中解访&quot;：<strong>策略模式</strong>、<strong>模板方法模式</strong>、<strong>观察者模式</strong>、迭代子模式、责任链模式、命令模式、备忘录模式、状态模式、访问者模式、中介者模式、解释器模式</li></ul> <h3 id="单例模式"><a href="#单例模式" class="header-anchor">#</a> 单例模式</h3> <blockquote><p>单例模式（Singleton Pattern）是 Java 中最简单的设计模式之一，属于创建型模式，它提供了一种创建对象的最佳方式</p> <p>这种模式涉及到一个单一的类，该类负责创建自己的对象，同时确保只有单个对象被创建</p></blockquote> <p>特点</p> <ul><li>单例类只能有一个实例</li> <li>单例类必须自己创建自己的唯一实例</li> <li>单例类必须给所有其他对象提供这一实例</li></ul> <p>意在保证一个类仅有一个实例，并提供一个访问它的全局访问点</p> <p>Spring 中的 Singleton Bean 采用的便是单例模式（创建型），任意一个被 @Mapper / @Service / @Controller / @Repository / @Bean 修饰的接口都是一个单例</p> <p>在 Spring 中，维护单例对象的 Map 是一个 ConcurrentHashMap，并且单例的创建只有在 getBean 时才会触发，所以 Spring 中的 Bean 实际上是一个懒汉式单例</p> <p>单例分类，可见【锁机制】</p> <ul><li>饿汉式</li> <li>懒汉式</li> <li>DCL 懒汉式</li></ul> <h3 id="代理模式"><a href="#代理模式" class="header-anchor">#</a> 代理模式</h3> <p>常常与字节码增强技术挂钩，例如使用 CGLib 动态生成 Object，就是依据原先的 Class 父类，通过继承的方式生成代理类（这一步操作将在本地生成对应的字节码），而后使用该代理类的字节码进行对象创建</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">instantiate</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Constructor</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> ctor<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
    <span class="token class-name">Enhancer</span> enhancer <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Enhancer</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 根据原有类创建代理类</span>
    enhancer<span class="token punctuation">.</span><span class="token function">setSuperclass</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">.</span><span class="token function">getBeanClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    enhancer<span class="token punctuation">.</span><span class="token function">setCallback</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">NoOp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token annotation punctuation">@Override</span>
        <span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">hashCode</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token keyword">super</span><span class="token punctuation">.</span><span class="token function">hashCode</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span>ctor <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> enhancer<span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> enhancer<span class="token punctuation">.</span><span class="token function">create</span><span class="token punctuation">(</span>ctor<span class="token punctuation">.</span><span class="token function">getParameterTypes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>以上代码中，enhancer 字节码增强器就通过原有类<code>beanDefinition.getBeanClass</code>生成新的<strong>代理类</strong>，注意这个代理类在编译后是存在相应的字节码文件的，最后在<code>enhancer.create</code>时，是通过这个代理类的字节码文件进行对象生成</p> <p>在 AOP 中，这样的代理实现更多，字节码增强技术使用更为频繁</p> <h3 id="工厂方法模式"><a href="#工厂方法模式" class="header-anchor">#</a> 工厂方法模式</h3> <p>工厂方法模式的定义：定义一个用于创建对象的接口**，**让子类决定实例化哪一个类，工厂方法使一个类的实例化延迟到其子类</p> <ul><li>父类提供一个创建对象的方法，但不实现</li> <li><strong>交给子类去决定创建哪个具体类</strong></li></ul> <p>比方说，我设计了一个 Auth 接口</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Auth</span> <span class="token punctuation">{</span>
    <span class="token class-name">KeyPair</span> <span class="token function">keygen</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">CryptoMap</span> <span class="token function">sign</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> sk<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">CryptoMap</span> <span class="token function">sanitize</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> sk<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> signature<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Boolean</span> <span class="token function">verify</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> pk<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> signature<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>而后定义了一个抽象类 CipherSystem，去继承 Auth 接口，但仍没有实现具体逻辑，而是实现初始化逻辑</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">CipherSystem</span> <span class="token keyword">implements</span> <span class="token class-name">Auth</span> <span class="token punctuation">{</span>

    <span class="token class-name">Pairing</span> <span class="token constant">BP</span><span class="token punctuation">;</span>
    <span class="token class-name">Field</span> <span class="token constant">G1</span><span class="token punctuation">,</span> <span class="token constant">G2</span><span class="token punctuation">,</span> <span class="token constant">GT</span><span class="token punctuation">,</span> <span class="token class-name">Zr</span><span class="token punctuation">;</span>
    <span class="token class-name">Boolean</span> sanitizable<span class="token punctuation">,</span> updatable<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">CipherSystem</span><span class="token punctuation">(</span><span class="token class-name">Pairing</span> <span class="token constant">BP</span><span class="token punctuation">,</span> <span class="token class-name">Field</span> <span class="token constant">G1</span><span class="token punctuation">,</span> <span class="token class-name">Field</span> <span class="token constant">G2</span><span class="token punctuation">,</span> <span class="token class-name">Field</span> <span class="token constant">GT</span><span class="token punctuation">,</span> <span class="token class-name">Field</span> <span class="token class-name">Zr</span><span class="token punctuation">,</span> <span class="token class-name">Boolean</span> sanitizable<span class="token punctuation">,</span> <span class="token class-name">Boolean</span> updatable<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token constant">BP</span> <span class="token operator">=</span> <span class="token constant">BP</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token constant">G1</span> <span class="token operator">=</span> <span class="token constant">G1</span><span class="token punctuation">;</span>
