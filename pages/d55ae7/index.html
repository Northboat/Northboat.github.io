punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">equals</span><span class="token punctuation">(</span><span class="token class-name">Object</span> obj<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">//若引用同一个对象，直接返回true</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token keyword">this</span> <span class="token operator">==</span> obj<span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
    <span class="token comment">//判断o是否为空</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span>obj <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
    <span class="token comment">//判断类型是否一致</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span>obj <span class="token keyword">instanceof</span> <span class="token class-name">Student</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//强制转换类型</span>
        <span class="token class-name">Student</span> student <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Student</span><span class="token punctuation">)</span> obj<span class="token punctuation">;</span>
        <span class="token comment">//比较属性</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">.</span>age <span class="token operator">==</span> student<span class="token punctuation">.</span><span class="token function">getAge</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">&amp;&amp;</span> <span class="token keyword">this</span><span class="token punctuation">.</span>name<span class="token punctuation">.</span><span class="token function">equals</span><span class="token punctuation">(</span>student<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>instanceof 关键字：判断前者类型是否直接或间接属于后者，即是否存在直接创建或继承关系</p> <p>finalize：垃圾（不用的对象）回收方法（可重写）</p> <h3 id="类的拆装箱"><a href="#类的拆装箱" class="header-anchor">#</a> 类的拆装箱</h3> <p>概念：装箱即把基本类型变量转换为引用类型变量，将存放在栈中的数据转移到堆中，完成基本类型到对象的转换，而拆箱即把引用类型转化为基本类型</p> <p>实现</p> <ul><li>拆箱：调用Number类中的 Value() 方法</li> <li>装箱：调用包装类的构造方法，如<code>Integer(int value)</code>，调用<code>valueOf(int value)</code>方法（返回 Integer 对象)</li></ul> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">int</span> num4 <span class="token operator">=</span> <span class="token number">10</span><span class="token punctuation">;</span>
<span class="token comment">//底层实现valueOf()方法，即Integer integer4 = Integer.valueOf(num4)</span>
<span class="token class-name">Integer</span> integer4 <span class="token operator">=</span> num4<span class="token punctuation">;</span>
<span class="token comment">//底层实现intValue()方法，即int num5 = integer4.intValue()</span>
<span class="token keyword">int</span> num5 <span class="token operator">=</span> integer4<span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>字符串与数字类型转换</p> <p>使用包装类中<code>toString</code>方法和<code>parseXXX</code>方法进行转换</p> <p><code>Integer.valueOf(int i)</code>方法的缓冲区</p> <p>为了减少内存的消耗，在<code>value()</code>方法内部存在一个数组，当传入的 i 在数组范围时，方法将直接从数组中提出对应的 i 赋给新的 Integer 对象，这样 new 出来的 Integer 实际上指向的是堆中的同一片区域，即数组中 i 的地址</p> <p>当 i 超出缓冲区时，将重新在堆中开辟一个空间赋给 Integer 对象，Integer 缓冲区为<code>[-128,127]</code></p> <h3 id="string"><a href="#string" class="header-anchor">#</a> String</h3> <p>常用方法</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token function">length</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//返回字符串长度</span>
<span class="token function">charAt</span><span class="token punctuation">(</span><span class="token keyword">int</span> index<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//返回某个位置的字符</span>
<span class="token function">contains</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//判断是否包含某个子字符串</span>

<span class="token function">toCharArray</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//将字符串转换为字符数组</span>
<span class="token function">indexOf</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//查找str首次出现的下标索引 (index:索引)</span>
<span class="token function">lastIndexOf</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//查找str最后一次出现的下表索引</span>

<span class="token function">trim</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//去掉字符串前后的空格 (trim:修剪)</span>
<span class="token function">toUpperCase</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//将小写转成大写 (upper:上面的、上部的、较高的)</span>
<span class="token function">endWith</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//判断字符串是否以str结尾</span>

<span class="token function">replace</span><span class="token punctuation">(</span><span class="token keyword">char</span> oldChar<span class="token punctuation">,</span> <span class="token keyword">char</span> newChar<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//将旧字符(串)替换为新字符(串)</span>
<span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token function">split</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//根据str做拆分</span>

<span class="token function">equals</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//比较两个字符串值是否相等</span>
<span class="token function">equalsIgnoreCase</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//忽略大小写比较两个字符串值是否相等</span>
<span class="token function">compareTo</span><span class="token punctuation">(</span><span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//优先返回首个ASCII码不同的字符的ASCII码大小的差，若原字符串是str从前向后的子串，则返回两个字符串长度的差(前减后)</span>
<span class="token function">substring</span><span class="token punctuation">(</span><span class="token keyword">int</span> begin<span class="token punctuation">,</span> <span class="token keyword">int</span> end<span class="token punctuation">)</span><span class="token operator">/</span><span class="token function">substring</span><span class="token punctuation">(</span><span class="token keyword">int</span> begin<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//截取字符串，从第begin个字符截取到第end个字符或从begin截取到最后</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>可变字符串（较于重新在池中储存字符串更节省内存、更高效）</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">//StringBuffer:效率较高，线程安全</span>
<span class="token comment">//StringBuilder:效率更高，线程不太安全(单线程随便搞)</span>

<span class="token comment">//常用方法</span>
<span class="token function">append</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>	<span class="token comment">//追加</span>
<span class="token function">insert</span><span class="token punctuation">(</span><span class="token keyword">int</span> start<span class="token punctuation">)</span><span class="token punctuation">;</span>	<span class="token comment">//插入</span>
<span class="token function">delete</span><span class="token punctuation">(</span><span class="token keyword">int</span> start<span class="token punctuation">,</span> <span class="token keyword">int</span> end<span class="token punctuation">)</span><span class="token punctuation">;</span>	<span class="token comment">//删除</span>
<span class="token function">reverse</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>	<span class="token comment">//翻转</span>
<span class="token function">replace</span><span class="token punctuation">(</span><span class="token keyword">int</span> start<span class="token punctuation">,</span> <span class="token keyword">int</span> end<span class="token punctuation">,</span> <span class="token class-name">String</span> str<span class="token punctuation">)</span><span class="token punctuation">;</span>	<span class="token comment">//替换</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><h3 id="bigdecimal"><a href="#bigdecimal" class="header-anchor">#</a> BigDecimal</h3> <p>原因：double、float 类型储存的是近似值，在精确计算时会出较大偏差，需要一个高精度类来进行计算</p> <p>常见方法</p> <ul><li><code>add(BigDecimal bd)</code>：加法</li> <li><code>substract(BigDecimal bd)</code>：减法(前减后)</li> <li><code>multiply(BigDecimal bd)</code>：乘法</li> <li><code>divide(BigDecimal bd)</code>：除法(前除以后)</li></ul> <p>注意：当除法碰到除不尽的情况，使用其重载<code>divide(BigDecimal bd, int scal, RoundingMode mode)</code>，其中</p> <ul><li><code>scal</code>为精确位数</li> <li><code>RoundingMode</code>为取舍模式 (一般为四舍五入<code>ROUND_HALF_UP</code>)</li></ul> <h3 id="时间类型"><a href="#时间类型" class="header-anchor">#</a> 时间类型</h3> <p>Date 类</p> <ul><li><code>Date() / Date(long date)</code>：构造方法，前者获取当前时间，后者获取输入时间（以毫秒为单位）</li> <li><code>void toString()</code>：打印字符串时间</li> <li><code>int getTime()</code>：返回当前Date对象的时间</li> <li><code>int compareTo(Date d)</code>：返回前后天数之差</li> <li><code>boolean equals(Date d)</code>：判断两个时间是否相等</li> <li><code>boolean before/after(Date d)</code>：判断当前 Date 是否在 d 之前/后</li></ul> <p>Calendar 类</p> <ul><li><code>Calendar.instance()</code>：构造方法被保护，使用该静态方法构造 Calendar 对象</li> <li><code>Date getTime()</code>：返回一个Date对象，与原时间相同</li> <li><code>int get(field f)</code>：获取诸如年、月、日、小时、分钟、秒等时间</li> <li><code>void add()</code>：在原对象上添加或减少时间</li> <li><code>void set(field f, int d)</code>：设置时间，field 设置时间类型（年月日时分秒），d 设置时间长度</li> <li><code>int getActualMaximum(field f) / int getActualMinimum(field f)</code>：返回 f 类型在该时间的最大值，如三月的最大天数为 31</li></ul> <p>SimpleDateFormat</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>text<span class="token punctuation">.</span></span><span class="token class-name">ParseException</span></span><span class="token punctuation">;</span>

    <span class="token keyword">if</span><span class="token punctuation">(</span>条件<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token comment">//当满足条件时主动抛出异常给下方捕获</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">Exception</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//监控区</span>
<span class="token punctuation">}</span><span class="token keyword">catch</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">//捕获异常</span>
	<span class="token comment">//处理区</span>
<span class="token punctuation">}</span><span class="token keyword">finally</span><span class="token punctuation">{</span>
    <span class="token comment">//善后区</span>
<span class="token punctuation">}</span>


<span class="token keyword">void</span> <span class="token function">calculate</span><span class="token punctuation">(</span><span class="token keyword">int</span> a<span class="token punctuation">,</span> <span class="token keyword">int</span> b<span class="token punctuation">)</span>	<span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token comment">//从方法内部将异常抛出</span>
<span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span>b<span class="token operator">==</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">Exception</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>a<span class="token operator">/</span>b<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span><span class="token keyword">catch</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>

    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br></div></div><h3 id="自定义异常类"><a href="#自定义异常类" class="header-anchor">#</a> 自定义异常类</h3> <p>自定义异常</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">package</span> <span class="token namespace">com<span class="token punctuation">.</span></span><span class="token class-name">Exception</span><span class="token punctuation">;</span>

<span class="token keyword">while</span><span class="token punctuation">(</span>it<span class="token punctuation">.</span>hasNext<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">Student</span> s <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Student</span><span class="token punctuation">)</span>it<span class="token punctuation">.</span><span class="token function">next</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span><span class="token comment">//类型强制转换(Obj到具体类)</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>Iterator：迭代器</p> <ul><li>hasNext():判断容器中是否有下一个元素</li> <li>next(): 返回容器中下一个元素</li> <li>remove(): 把当前元素删除</li></ul> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// List的迭代器</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>lt<span class="token punctuation">.</span><span class="token function">next</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="list-动态数组"><a href="#list-动态数组" class="header-anchor">#</a> List 动态数组</h3> <blockquote><p>List：有序、有下标</p></blockquote> <p>ArrayList：内部维护一个数组（查找快，增删慢），默认初始容量 10，常用方法</p> <ul><li>add：当达到数组上限时创建一个 1.5 倍大小的新数组，用 System 中 arrayCopy 方法复制原来元素至新数组</li> <li>remove：定位要删除元素，创建新数组，去掉要删除元素</li> <li>get：获取对应下标的元素</li> <li>isEmpty：判空</li> <li>contains：判断元素存在与否</li></ul> <p>LinkedList：内部维护一个双向链表（查找慢，增删快）</p> <p>Vector：线程安全的数组</p> <h3 id="set-集合"><a href="#set-集合" class="header-anchor">#</a> Set 集合</h3> <p>Set（无序、无下标、无重复元素），常用方法</p> <ul><li>add()</li> <li>size()</li> <li>isEmpty()</li> <li>remove()</li> <li>iterator()</li> <li>contains()</li></ul> <p>HashSet：内部维护一个哈希表（数组 + 链表 + 红黑树），利用 hashcode() 和 equals() 实现不重复</p> <p>SortedSet → TreeSet</p> <ul><li>存储结构：红黑树 → 中序遍历（二叉搜索）</li> <li>基于排序顺序实现元素不重复，通过实现 SortedSet 接口，对集合元素自动排序</li></ul> <p>TreeSet 的排序规则</p> <ul><li>用 Comparable 接口中 CompareTo() 方法作为排序标准：在类中重写，当 CompareTo() 返回值为 0 时，判断两者相同</li> <li>利用 TreeSet 含 Comparator 接口（比较器）的构造方法，在 Comparator 的匿名内部类中重写 compare() 方法，实现比较规则的定义</li></ul> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">TreeSet</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> tree <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">TreeSet</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Comparator</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">compare</span><span class="token punctuation">(</span><span class="token class-name">String</span> s1<span class="token punctuation">,</span> <span class="token class-name">String</span> s2<span class="token punctuation">)</span><span class="token punctuation">{</span>

        <span class="token keyword">int</span> n1 <span class="token operator">=</span> s1<span class="token punctuation">.</span><span class="token function">length</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-</span>s2<span class="token punctuation">.</span><span class="token function">length</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">int</span> n2 <span class="token operator">=</span> s1<span class="token punctuation">.</span><span class="token function">compareTo</span><span class="token punctuation">(</span>s2<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">return</span> n1<span class="token operator">==</span><span class="token number">0</span><span class="token operator">?</span>n2<span class="token operator">:</span>n1<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><h3 id="map-哈希表"><a href="#map-哈希表" class="header-anchor">#</a> Map 哈希表</h3> <p>常用方法</p> <ul><li><p>put (k key, v value)</p></li> <li><p>remove(k key)</p></li> <li><p>keySet()</p></li> <li><p>entrySet()</p></li> <li><p>size()</p></li> <li><p>containsKey(k key)</p></li> <li><p>containsValue(v value)</p></li></ul> <p>Entry: Map 中的静态内部类，储存 key 和 value 的键值对<code>&lt;key, value&gt;</code></p> <p>Entry 常用方法：<code>getKey() / getValue()</code></p> <p>HashMap 使用</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">/**
 * 存储结构：哈希表

 * 线程不安全，效率高，允许null作为键和值
 */</span>

<span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token class-name">HashMap</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token class-name">Map</span></span><span class="token punctuation">;</span>
<span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token class-name">Set</span></span><span class="token punctuation">;</span>

名内部类定制比较器</li></ul> <p>自定义比较器</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">//实现Comparable接口</span>

><li>礼让线程，让当前正在执行的线程暂停，但不阻塞</li> <li>将现场从运行状态转为就绪状态</li> <li>让 cpu 重新调度，但不一定成功</li></ul> <h2 id="java-输入输出"><a href="#java-输入输出" class="header-anchor">#</a> Java 输入输出</h2> <h3 id="命令行-i-o"><a href="#命令行-i-o" class="header-anchor">#</a> 命令行 I/O</h3> <p>Scanner：命令行输入</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span></span><span class="token class-name">Scanner</span></span><span class="token punctuation">;</span>

        <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token punctuation">(</span>count <span class="token operator">=</span> fis<span class="token punctuation">.</span><span class="token function">read</span><span class="token punctuation">(</span>b<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">(</span>b<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> count<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token comment">//关闭输入流</span>
        fis<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>FileOutputStream</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">class</span> <span class="token class-name">FileOutputStream</span> <span class="token keyword">extends</span> <span class="token class-name">OutputStream</span>
    <span class="token comment">//一次写入多个字节，将b数组中所有字节写入输出流，存到文件系统的某个文件中</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">write</span><span class="token punctuation">(</span><span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> b<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>io<span class="token punctuation">.</span></span><span class="token class-name">FileOutputStream</span></span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">TestFileOutputStream</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token comment">//append参数true会使文件不会被覆盖，即每次运行都会继续储存在上次数据之后</span>
        <span class="token comment">//不传入参数或传入false，每次写文件，将会覆盖掉之前数据</span>
        <span class="token class-name">FileOutputStream</span> fos <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">FileOutputStream</span><span class="token punctuation">(</span><span class="token string">&quot;E:\\Java\\Java SE\\idea\\src\\resource\\b.txt&quot;</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">/*
        * 一次执行一个字符
        * fos.write('a');
        * fos.write('9');

        */</span>
        <span class="token class-name">String</span> str <span class="token operator">=</span> <span class="token string">&quot;helloWorld\n&quot;</span><span class="token punctuation">;</span>
        <span class="token comment">//调用字符串的 getBytes() 方法将字符串转化为字节数组</span>
        fos<span class="token punctuation">.</span><span class="token function">write</span><span class="token punctuation">(</span>str<span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        fos<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><h2 id="java-特性"><a href="#java-特性" class="header-anchor">#</a> Java 特性</h2> <h3 id="java-enum"><a href="#java-enum" class="header-anchor">#</a> Java Enum</h3> <p>枚举类，以这样的方式创建一个枚举类</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">enum</span> <span class="token class-name">Beer</span><span class="token punctuation">{</span>
    <span class="token constant">WUSU</span><span class="token punctuation">,</span> <span class="token constant">QINGDAO</span><span class="token punctuation">,</span> <span class="token constant">ZHUJIANG</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>这实际上是一种语法糖，<code>Enum</code>作为一个抽象类，以上述方式定义的<code>Beer</code>将会继承<code>Enum</code>并创建一个<code>Beer[]</code>，其中存放了三个名叫<code>WUSU, QINGDAO, ZHUJIANG</code>的<code>Beer</code>对象，同时<code>Beer</code>将维护一个<code>Map&lt;String, Beer&gt;</code>，键即为定义时的字符串，值即为对应的 Beer 对象</p> <p>在进行拿取时</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Beer</span> currentBeer <span class="token operator">=</span> <span class="token class-name">Beer</span><span class="token punctuation">.</span><span class="token constant">WUSU</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>也可以直接通过字符串来强转</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Beer</span> currentBeer <span class="token operator">=</span> <span class="token class-name">Beer</span><span class="token punctuation">.</span><span class="token function">valueOf</span><span class="token punctuation">(</span><span class="token string">&quot;WUSU&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>很明显第二种方式就是在用 Map 进行拿取，键为对象名，值为对象</p> <h3 id="匿名内部类"><a href="#匿名内部类" class="header-anchor">#</a> 匿名内部类</h3> <p>众所周知，匿名内部类访问外部变量时，变量需要被声明为<code>final</code>，这是 Java 的语法规则决定的</p> <ul><li>如果允许修改外部变量，会导致内部类持有的值与外部变量的值不一致，破坏 Java 的内存模型一致性</li></ul> <p>例如如下代码，将会编译不通过，因为根本无法访问外部变量</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 这样会编译错误</span>
<span class="token keyword">int</span> count <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token class-name">Runnable</span> runnable <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Runnable</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">run</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        count<span class="token operator">++</span><span class="token punctuation">;</span> <span class="token comment">// 编译错误：不能修改final变量</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>但是 final 字段能够将变量定义为“不可变”，这种不可变可以保持 Java 的内存模型一致性，那么就可以改变外部变量了</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">final</span> <span class="token keyword">int</span> count <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token class-name">Runnable</span> runnable <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Runnable</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">run</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        count<span class="token operator">++</span><span class="token punctuation">;</span> <span class="token comment">// 编译错误：不能修改final变量</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>这样会编译错误，都说了 final 修饰的变量不可变，你还搁这变，包报错的</p> <p>怎么办呢，我们可以用 final 修饰一个数组</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 数组方式可以修改内部值</span>
<span class="token keyword">final</span> <span class="token keyword">int</span><span class="token punctuation">[</span><span class="token punctuation">]</span> count <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token number">0</span><span class="token punctuation">}</span><span class="token punctuation">;</span>

<span class="token class-name">Runnable</span> runnable <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Runnable</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">run</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        count<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token operator">++</span><span class="token punctuation">;</span> <span class="token comment">// 合法，修改数组元素</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;内部类中：&quot;</span> <span class="token operator">+</span> count<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">;</span>
runnable<span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;外部：&quot;</span> <span class="token operator">+</span> count<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 输出1，体现了修改效果</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>众所周知数组是指针，final 修饰的实际上是指针，ok，那么指针是不可变的，但指针指向的值是可变的，这样就可以做到匿名内部类的修改值传递</p> <h2 id="函数式接口"><a href="#函数式接口" class="header-anchor">#</a> 函数式接口</h2> <blockquote><p>新的编程风格：lambda 表达式、链式编程、函数式接口、Stream 流式计算</p></blockquote> <p>函数式接口：只有一个方法的接口，比如 Runnable / Callable</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@FunctionalInterface</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Runnable</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">void</span> <span class="token function">run</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">//新版java中有很多很多FunctionalInterface</span>
<span class="token comment">//简化编程模型，再新版本的框架底层大量应用</span>
<span class="token comment">//forEach(消费者类的函数式接口)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h3 id="function-函数型"><a href="#function-函数型" class="header-anchor">#</a> Function 函数型</h3> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@FunctionalInterface</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Function</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">,</span> <span class="token class-name">R</span><span class="token punctuation">&gt;</span></span> <span class="token punctuation">{</span>

    <span class="token comment">/**
     * Applies this function to the given argument.
     *
     * @param t the function argument
     * @return the function result
     */</span>
    <span class="token class-name">R</span> <span class="token function">apply</span><span class="token punctuation">(</span><span class="token class-name">T</span> t<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>有一个传入参数，有一个返回值（均为泛型，默认Object），仅含一个方法：apply (Object o, Object b)</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span>function<span class="token punctuation">.</span></span><span class="token class-name">Function</span></span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">FunctionTest</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">/**用匿名内部类重写apply函数
         * Function&lt;String, String&gt; f = new Function&lt;String, String&gt;() {
         *         @Override
         *         public String apply(String str) {
         *             return str;
         *         }
         *     };
        */</span>
        <span class="token comment">//用lambda表达式简化</span>
        <span class="token class-name">Function</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> function <span class="token operator">=</span> <span class="token punctuation">(</span>str<span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span><span class="token keyword">return</span> str<span class="token punctuation">;</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>function<span class="token punctuation">.</span><span class="token function">apply</span><span class="token punctuation">(</span><span class="token string">&quot;daslkfj&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><h3 id="predicate-断定型"><a href="#predicate-断定型" class="header-anchor">#</a> Predicate 断定型</h3> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@FunctionalInterface</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Predicate</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">&gt;</span></span> <span class="token punctuation">{</span>

    <span class="token comment">/**
     * Evaluates this predicate on the given argument.
     *
     * @param t the input argument
     * @return {@code true} if the input argument matches the predicate,
     * otherwise {@code false}
     */</span>
