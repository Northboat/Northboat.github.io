gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">开发联调上线<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="开发与联调"><a href="#开发与联调" class="header-anchor">#</a> 开发与联调</h2> <h3 id="分支创建与开发"><a href="#分支创建与开发" class="header-anchor">#</a> 分支创建与开发</h3> <p>根据 icafe 卡片在 icode 对应代码库新建分支，前往 ipipe 根据源版本新建，<strong>注意这里如果没有构建，需要前往流水线，选取 master 分支执行构建</strong>，然后才能根据源分支新建，分支新建完成之后，新建 webide 代码空间并使用 comate 打开</p> <p>这里可能需要配置 comate 的 go 设置，cmd + Shfit + p 打开 setting.json，配置 go 编译器环境，然后安装 Go 插件，下载语言服务器</p> <div class="language-json extra-class"><pre class="language-json"><code>    <span class="token property">&quot;go.alternateTools&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;go&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/root/.gvm/gos/go1.24.9/bin/go&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;go.goroot&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/root/.gvm/gos/go1.24.9&quot;</span><span class="token punctuation">,</span>
</code></pre></div><p>配置文件拉取，Confer，贴吧的 go 配置工具</p> <div class="language-bash extra-class"><pre class="language-bash"><code>go <span class="token function">install</span> <span class="token parameter variable">-v</span> icode.baidu.com/baidu/tieba-server-go/confer/confer@latest
confer <span class="token parameter variable">-s</span> conf <span class="token parameter variable">-e</span> offline --pandora-value noahdes/value/hb/conf_template.value
</code></pre></div><p>编辑端口配置 port.conf</p> <div class="language-go extra-class"><pre class="language-go"><code>LISTEN_PORT<span class="token punctuation">:</span> <span class="token number">8062</span>
PORT_COUNT<span class="token punctuation">:</span> <span class="token number">20</span>
</code></pre></div><p>启动命令</p> <div class="language-bash extra-class"><pre class="language-bash"><code>go run main.go <span class="token parameter variable">-conf</span> conf/app.toml
</code></pre></div><p>这样就能在本地启动代码库服务，因为都在内网环境中，所以只需要修改上游服务对应的 conf/servicer 端口，再用 Postman 打上游接口，就可以在本地 debug 调试</p> <h3 id="eos-联调"><a href="#eos-联调" class="header-anchor">#</a> EOS 联调</h3> <p>基于模版 362 创建 EOS 测试环境，xstp 命令</p> <ul><li>2 查看当前域名</li> <li>5 重启所有服务</li> <li>11 根据代码库名和 commit-id 重新部署模块</li> <li>19 查看所有服务地址</li></ul> <p>修改 servicer 端口并重启服务：一开始想直接修改上游 genflow 对下游 function 的调用 servicer，让他打到我本地的 function 然后进行 Debug 测试，但是由于这里的请求转发比较复杂，打到 genflow 的请求会先经过网盘那边的 mcp 调度，再打到 function，直接改 genflow 的 servicer 不会生效（要在调度侧修改），所以只能在本地开发打包好，传到同一个 EOS 测试环境，然后打日志测试</p> <p>首先修改 function 代码，放开 function 中对 .xmind 和 .mm 格式文件的支持</p> <div class="language-go extra-class"><pre class="language-go"><code>extDocMap <span class="token operator">:=</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span>
    <span class="token string">&quot;doc&quot;</span><span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;docx&quot;</span><span class="token punctuation">:</span>  <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;pdf&quot;</span><span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;ppt&quot;</span><span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;pptx&quot;</span><span class="token punctuation">:</span>  <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;xls&quot;</span><span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;xlsx&quot;</span><span class="token punctuation">:</span>  <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;txt&quot;</span><span class="token punctuation">:</span>   <span class="token number">1</span><span class="token punctuation">,</span>
    <span class="token string">&quot;xmind&quot;</span><span class="token punctuation">:</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token comment">// 支持脑图</span>
    <span class="token string">&quot;mm&quot;</span><span class="token punctuation">:</span>    <span class="token number">1</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在代码空间 build 打包，下载再上传 EOS 环境，重启 function 服务</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token assign-left variable">CGO_ENABLED</span><span class="token operator">=</span><span class="token number">0</span> go build <span class="token parameter variable">-o</span> <span class="token keyword">function</span> main.go

<span class="token function">ps</span> <span class="token parameter variable">-ef</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'function'</span>
<span class="token function">kill</span> demon_pid
<span class="token function">kill</span> function_pid
<span class="token function">chmod</span> +x /bin/function
./bin/function <span class="token operator">&gt;</span> /dev/null <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span> <span class="token operator">&amp;</span>
</code></pre></div><p>前端没有放开对应的文件上传，靠 Postman 来打 /chat 接口完成 PPT 生成的测试，所以问题变成如何构造一个 /chat 请求，这里麻烦睿霆开了一个前端测试环境，支持在前端上传 .xmind 和 .mm 文件，通过文件上传接口上传，拿到 docID 和 queryID，再去手动构造请求测试</p> <ul><li><strong>这里犯蠢了，联调就应该让他给完整的前端环境，手动打接口一个效率慢，另一个很有可能漏掉链路</strong></li></ul> <p>浏览器抓 cURL 构造原始请求</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;channel&quot;</span><span class="token operator">:</span> <span class="token string">&quot;wenku_pc_genflow_v2&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;messages&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
        <span class="token punctuation">{</span>
            <span class="token property">&quot;role&quot;</span><span class="token operator">:</span> <span class="token string">&quot;user&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;content&quot;</span><span class="token operator">:</span> <span class="token string">&quot;生成 PPT&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token property">&quot;extra&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;disable_h5&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>
        <span class="token property">&quot;wanpanAuthStatus&quot;</span><span class="token operator">:</span> <span class="token number">1</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;chat_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;108ef2fb33e952d380eb6294dd88d0d232d43ca5&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;query_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;bfec9e2e25164b7302768e9951e79b89680268a9&quot;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>把 query_id 替换为之前上传文件的 query_id，文件和会话的关系绑定通过 query_id 这一字段，然后把浏览器 Cookie 替换 Postman 中 Headers 里的 Cookie，打请求就行</p> <h2 id="日志查询"><a href="#日志查询" class="header-anchor">#</a> 日志查询</h2> <h3 id="追链接生-ppt-内容无关"><a href="#追链接生-ppt-内容无关" class="header-anchor">#</a> 追链接生 PPT 内容无关</h3> <p>日志目录，日志每小时刷新一次</p> <ul><li>log 下是 nginx 日志，记录接收到的 http 请求</li> <li>service 下是业务日志，其中 wf 结尾为错误日志</li></ul> <p>查询流程：首先找到对应代码位置</p> <div class="language-go extra-class"><pre class="language-go"><code>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;pptegent_outline_req_strategyparams&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;req&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre></div><p>通过 queryid 和日志信息 grep</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">cat</span> service.log.* <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'313126566710330'</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'pptegent_outline_req_strategyparams'</span>
</code></pre></div><p>查看日志信息</p> <div class="language-bash extra-class"><pre class="language-bash"><code>NOTICE: <span class="token number">2026</span>-03-30 <span class="token number">11</span>:56:56 /tmp/goc-build-e8339558a23d/model/service/mcp/pptagent.go:192 logid<span class="token punctuation">[</span><span class="token number">1746184404</span><span class="token punctuation">]</span> client_ip<span class="token punctuation">[</span><span class="token number">10.227</span>.82.17<span class="token punctuation">]</span> tracecode<span class="token punctuation">[</span><span class="token number">17461844040170478484033011</span><span class="token punctuation">]</span> method<span class="token punctuation">[</span>POST<span class="token punctuation">]</span> uri<span class="token punctuation">[</span>/service/wcfunction/mcp/makepptoutline<span class="token punctuation">]</span> product<span class="token punctuation">[</span>wenchain<span class="token punctuation">]</span> subsys<span class="token punctuation">[</span>wenchain-gdp-function<span class="token punctuation">]</span> host<span class="token punctuation">[</span>ppttestoffline331.wenku.baidu-int.com<span class="token punctuation">]</span> uid<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> cuid<span class="token punctuation">[</span><span class="token punctuation">]</span> msec<span class="token punctuation">[</span><span class="token number">1774843008075</span><span class="token punctuation">]</span> module<span class="token punctuation">[</span>function<span class="token punctuation">]</span> idc<span class="token punctuation">[</span>tc<span class="token punctuation">]</span> user_ip<span class="token punctuation">[</span><span class="token number">10.227</span>.82.17:54305<span class="token punctuation">]</span> req<span class="token punctuation">[</span><span class="token punctuation">{</span><span class="token string">&quot;PPT_resul </code></pre></div><h3 id="代码合入"><a href="#代码合入" class="header-anchor">#</a> 代码合入</h3> <p>需要 +2 才能 push 入开发分支，注意编码规范和 SA 检查，具体而言</p> <ul><li>模块化功能，不要用冗余的 if-else</li> <li>要处理所有的 err 返回</li></ul> <p>代码质量很重要：一定要考虑模块化和可扩展化，不要堆 if-else 屎</p> <p>代码合入后，创建 iPipe 流水线，在 TestOne 触发准入，按照正常流程，需要找 QA 要测试样例，然后自测一个个签章，签章通过后再准入，然后进入 QA 的测试阶段，QA 测试完就可以上线了</p> <h2 id="发布上线"><a href="#发布上线" class="header-anchor">#</a> 发布上线</h2> <h3 id="蓝绿机上线"><a href="#蓝绿机上线" class="header-anchor">#</a> 蓝绿机上线</h3> <p>QA 准出后，在流水线执行“发布”，然后去 <a href="http://tower.baidu.com/teams/270/dashboard?start_time=2026-04-02%2015:19:36&amp;end_time=2026-04-09%2015:19:36&amp;job_templates=31936" target="_blank" rel="nofollow noopener noreferrer">Tower<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 发上线单，绑定对应代码库和对应分支，开始上线</p> <p>使用 EasyTool 切换不同场景（预览机、单台、华北全量、全量）测试相应链路</p> <p>上线流程（灰度发布）</p> <ol><li>预览机</li> <li>华北单台</li> <li>华北全流量</li> <li>华东华南单台</li> <li>华东全流量</li> <li>华南全流量</li> <li>后置任务</li></ol> <p>推全之后，一定要狠狠观察流量监控 10-15 分钟，重点看是否存在激增的 panic 报错，即 500+ 报错，确认没问题后才能往后推，如果出现问题，第一时间撤销或回滚</p> <h3 id="bug-修复"><a href="#bug-修复" class="header-anchor">#</a> Bug 修复</h3> <p>由 QA 提 Bug 单，RD 根据 Bug 单生成 Story 卡片进行开发，在机器人群中发 bug 卡片 ID 自动生成 story 卡片，按照正常分支开发流程在该卡片上修改并上线（重走一遍完整的上线流程），而后将 bug 卡片置为 Resolved，然后找 QA Close Bug 卡片，完成修复</p> <h3 id="回归效果"><a href="#回归效果" class="header-anchor">#</a> 回归效果</h3> <p>对实验组小流量进行测试</p> <p>回归 4.7-4.12 6 天 20% 小流量实验：实验组三正向，效果如下</p> <ul><li>**成单表现：**实验组较对照组收银台付费率 +3.35%，成单预计 +91单/天（其中体验卡 +84单，连续包月 +11单）</li> <li>**解约率：**实验组较对照组体验卡当日解约率 -2.11pp，连续包月当日解约率 +4.19pp</li> <li>**长线收益预估：**Q2含续费收入预计 +24.9万，12个月含续费收入预计 +160万</li></ul> <p>这个回归表现是用 xleaarn 模型去预测的，很有意思</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/04/15, 22:36:55</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/040068/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">测开基础</div></a> <a href="/pages/e12125/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">HTML 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
