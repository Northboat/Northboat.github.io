8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">电吉他基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="电吉他概述"><a href="#电吉他概述" class="header-anchor">#</a> 电吉他概述</h2> <h3 id="琴的分类"><a href="#琴的分类" class="header-anchor">#</a> 琴的分类</h3> <p>按形状来分</p> <ul><li>TL（Telecaster）：一边椭圆一边角</li> <li>LP（Les Paul）：一边圆润一边角</li> <li>ST（Stratocaster）：两边角</li></ul> <p>常见品牌</p> <ul><li>马丁、泰勒、雅马哈</li> <li>吉普森 → 易普锋</li> <li>芬达 → Squier</li> <li>依班娜</li></ul> <h3 id="输出逻辑"><a href="#输出逻辑" class="header-anchor">#</a> 输出逻辑</h3> <p>和木吉他一样，电吉他的声音输出逻辑是相同的</p> <ol><li>拾音器拾取声音模拟信号</li> <li>插入线传输拾取到的模拟信号</li> <li>转换为数字信号</li> <li>输出数字信号</li></ol> <p>这里的第三步数模转换会用到效果器</p> <ul><li>对于木吉他而言会比较简单，毕竟简单的转换信号就行，不需要管音色的切换</li> <li>有的音箱会自带这种转换功能，即直接插线到音箱上就可以进行一体式的输出</li></ul> <p>所以数据流就是：电吉他产生模拟信号（input） → 效果器转换模拟信号为数字信号 → 通过耳机或音箱输出（output）</p> <h2 id="入门曲"><a href="#入门曲" class="header-anchor">#</a> 入门曲</h2> <p>Somke on the water</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">for</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;噔噔噔，噔噔噔噔，噔噔噔，噔噔&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>灰色轨迹</p> <div class="language-go extra-class"><pre class="language-go"><code>fmt<span class="token punctuation">.</span><span class="token function">Printf</span><span class="token punctuation">(</span><span class="token string">&quot;%s, %s!&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;哦欧&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;不想你离去&quot;</span><span class="token punctuation">)</span>
</code></pre></div><p>Sweet Dreams</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">1</span><span class="token punctuation">;</span> i <span class="token operator">&lt;=</span> <span class="token number">4</span><span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;噔噔噔噔噔噔噔噔，噔噔~噔噔，噔噔~噔噔&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="la-和-mi-指型"><a href="#la-和-mi-指型" class="header-anchor">#</a> La 和 Mi 指型</h2> <h2 id="强力和弦"><a href="#强力和弦" class="header-anchor">#</a> 强力和弦</h2> <h2 id="吉他维修工"><a href="#吉他维修工" class="header-anchor">#</a> 吉他维修工</h2> <h3 id="挡位器更换"><a href="#挡位器更换" class="header-anchor">#</a> 挡位器更换</h3> <p>因为一次事故，LP 的挡位器断了，拼多多买了一个 10 块钱的挡位器试图更换，需要简单的焊上</p> <h3 id="补漆"><a href="#补漆" class="header-anchor">#</a> 补漆</h3> <p>还是因为挡位器断了，我居然试图用 502（之类的）沾一下，结果，胶水在琴面上除不掉了！！！fuck</p> <p>试图用砂纸磨砂抛光后，再用补漆笔补</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/a55895/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">木吉他基础</div></a> <a href="/pages/633508/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">调酒基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
