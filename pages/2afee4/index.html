<ul><li>NIO（New Input/Output） 是 Java 1.4 引入的一组 API，用于提供非阻塞（Asynchronous）的输入输出操作，它让我们能更高效地处理大量的 I/O 操作</li></ul> <p>NIO 主要的优势在于能够<strong>不阻塞线程</strong>来处理 I/O 操作，它是为了弥补传统的阻塞 I/O（BIO）和 高并发场景下性能瓶颈而设计的</p> <p>怎么实现的非阻塞？</p> <ul><li>Selector 和 Channel 是 NIO 的核心组成，通过<strong>事件驱动</strong>实现异步非阻塞 I/O 操作</li></ul> <p>Netty 高性能的关键在于</p> <ul><li>线程池 + 事件驱动</li> <li>零拷贝技术</li> <li>池化内存</li> <li>TCP 粘包 / 拆包处理</li></ul> <h3 id="线程池-事件驱动"><a href="#线程池-事件驱动" class="header-anchor">#</a> 线程池 + 事件驱动</h3> <p>Netty 采用多 Reactor 线程模型，通过 <strong>EventLoopGroup + 线程池</strong>，避免传统 BIO 的<strong>一线程一连接</strong>低效模式</p> <ul><li>BIO（阻塞 IO）：一个线程处理一个连接</li> <li>NIO（非阻塞 IO）：多个连接共享一个线程</li> <li>Netty（多 Reactor 模型）：多个线程池高效管理连接</li></ul> <p>📌 示例：Netty 线程池</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">EventLoopGroup</span> bossGroup <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">NioEventLoopGroup</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">// 处理连接</span>
<span class="token class-name">EventLoopGroup</span> workerGroup <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">NioEventLoopGroup</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 处理读写</span>
</code></pre></div><h3 id="zero-copy"><a href="#zero-copy" class="header-anchor">#</a> Zero Copy</h3> <p>零拷贝技术：Netty 通过 DirectByteBuf、CompositeByteBuf 进行零拷贝优化</p> <ul><li>减少 CPU 拷贝（避免 <code>System.arraycopy</code>）</li> <li>减少内存分配（减少 GC 压力）</li> <li><strong>减少 <strong>Buffer</strong> 复制</strong>（直接操作堆外内存）</li></ul> <p>Netty 直接使用堆外内存</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">ByteBuf</span> buffer <span class="token operator">=</span> <span class="token class-name">Unpooled</span><span class="token punctuation">.</span><span class="token function">directBuffer</span><span class="token punctuation">(</span><span class="token number">1024</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 直接分配堆外内存</span>
</code></pre></div><h3 id="pooled-buffer"><a href="#pooled-buffer" class="header-anchor">#</a> Pooled Buffer</h3> <p>池化内存：Netty 使用内存池（Buffer Pool），重复利用 ByteBuf，避免反复创建对象</p> <p>使用池化的 ByteBuf</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">ByteBuf</span> pooledBuf <span class="token operator">=</span> <span class="token class-name">PooledByteBufAllocator</span><span class="token punctuation">.</span><span class="token constant">DEFAULT</span><span class="token punctuation">.</span><span class="token function">buffer</span><span class="token punctuation">(</span><span class="token number">256</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><h2 id="rpc-和-cap"><a href="#rpc-和-cap" class="header-anchor">#</a> RPC 和 CAP</h2> <h3 id="什么是-rpc"><a href="#什么是-rpc" class="header-anchor">#</a> 什么是 RPC</h3> <p>RPC（Remote Procedure Call，远程过程调用）是一种允许分布式系统中的不同服务像调用本地方法一样调用远程服务的技术。RPC 框架封装了底层的网络通信、序列化和反序列化，使开发者可以透明地进行远程调用（成为一名调包小子）</p> <p>在分布式系统中，不同的服务大概率部署在不同的服务器上，它们需要相互通信，例如</p> <ul><li>电商系统：订单服务需要调用库存服务检查库存，再调用支付服务处理支付</li></ul> <p>RPC 通信对标的是 HTTP/REST 通信，但值得注意的是，HTTP 是协议，RPC 是远程调用本地化的思想，严格意义上二者并不是同级的概念</p> <ul><li>RPC 当然可以用 HTTP 实现，因为他是一种逻辑，而 HTTP 是一种实现规范，只不过通常 RPC 用 TCP 实现</li> <li>一般而言，HTTP/REST 更适合前后端的通信，而 RPC 适合后端微服务之间的通信</li></ul> <p>我们可以直接通过打请求的方式获取数据，例如</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token class-name">RestTemplate</span> restTemplate <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">RestTemplate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> result <span class="token operator">=</span> restTemplate<span class="token punctuation">.</span><span class="token function">getForObject</span><span class="token punctuation">(</span><span class="token string">&quot;http://server/user?id=1&quot;</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>这其实也是一种 RPC，只不过实现的比较丑陋</p> <p>并且，HTTP 这个协议太上层了，导致消息传输会显得臃肿</p> <ul><li>请求体较大：HTTP 请求头、JSON 序列化等</li> <li>性能损耗：HTTP 需要解析文本，序列化和反序列化的开销大</li> <li>协议不够高效：HTTP 是基于文本的，相比于二进制协议有较多的拆装包过程</li></ul> <p>通常，RPC 会采用基于 TCP 的二进制协议，较于 HTTP 更</p> <ul><li>高效：使用二进制协议（如 Protobuf），减少数据传输体积</li> <li>透明：像调用本地方法一样调用远程服务</li> <li>易扩展：内置负载均衡、服务注册与发现、流量控制等功能</li></ul> <h3 id="rpc-框架概述"><a href="#rpc-框架概述" class="header-anchor">#</a> RPC 框架概述</h3> <p>RPC 框架主要包含客户端、服务端、注册中心三个核心组件</p> <p>客户端（Client Stub）</p> <ul><li>发送请求给服务端，就像调用本地方法一样</li> <li>负责序列化请求数据（将 Java 对象转换成字节流）</li></ul> <p>服务端（Server Stub）</p> <ul><li>监听客户端请求，调用对应的本地方法，并返回结果</li> <li>负责反序列化请求数据（将字节流转换成 Java 对象）</li></ul> <p>注册中心（Service Registry）</p> <ul><li>维护所有可用的服务列表</li> <li>客户端在调用时<strong>动态发现服务</strong>，而不是写死 IP 地址</li> <li>常用的注册中心：Zookeeper、Nacos</li></ul> <p>RPC 典型流程</p> <div class="language- extra-class"><pre class="language-text"><code>1️⃣ 客户端调用本地方法（伪装成普通的 Java 方法）
2️⃣ RPC 框架将请求数据序列化并发送到服务端
3️⃣ 服务端接收请求，反序列化数据，并调用目标方法
4️⃣ 目标方法执行后返回结果
5️⃣ 服务端将返回结果序列化并发送回客户端
6️⃣ 客户端接收结果，返回给调用方
</code></pre></div><h3 id="cap-原则"><a href="#cap-原则" class="header-anchor">#</a> CAP 原则</h3> <p>基于 CAP 原则：一致性（Consistency）、可用性（Availability）和分区容忍性（Partition Tolerance）三者不可兼得</p> <p>什么是一致性、可用性和分区容忍性？</p> <ul><li>C 一致性：所有节点在同一时间看到的数据相同</li> <li>A 可用性：每个请求都能得到响应（即使部分节点故障），但不保证是最新数据</li> <li>P 分区容忍性：指系统能够处理网络分区（节点间通信中断）的情况，即使部分节点无法通信，系统仍能正常运行</li></ul> <p>CAP 理论的核心是：一个分布式系统不可能同时很好的满足一致性，可用性和分区容错性这三个需求，因此，根据 CAP 原理将 NoSQL 数据库分成了满足 CA 原则、满足 CP 原则和满足 AP 原则三大类</p> <ul><li>CA：单点集群，满足一致性，可用性的系统，通常缺失可扩展性</li> <li>CP：满足一致性，分区容忍性的系统，通常性能略低</li> <li>AP：满足可用性，分区容忍性的系统，通常一致性要求略低</li></ul> <p>需要注意的是，在分布式环境中，网络分区是不可避免的，因此分布式系统都需要具有分区容忍性（P），故分布式系统的设计中，变成了 AP 和 CP 系统的选择</p> <p>AP 系统和 CP 系统的例子</p> <table><thead><tr><th>系统</th> <th>一致性（C）</th> <th>可用性（A）</th> <th>分区容忍性（P）</th></tr></thead> <tbody><tr><td>Eureka（AP）</td> <td>Eureka 选择<strong>最终一致性</strong>，当一个 Eureka Server 节点失联时，其他节点仍然可以提供服务，保证高可用性，即使短时间内数据可能不同步</td> <td>Eureka 在网络分区时会优先保证可用性，即使某些实例信息不同步，也不会阻止服务发现。这使得 Eureka 能在部分失败的情况下继续运行，提供高可用性</td> <td>Eureka 通过牺牲一致性来保证可用性（AP），即便部分节点无法通信，仍然可以继续提供服务</td></tr> <tr><td>Zookeeper（CP）</td> <td>Zookeeper 采用 ZAB（Zookeeper Atomic Broadcast）协议，保证强一致性，确保集群中的所有节点数据保持同步。一旦有节点崩溃或网络分区发生，Zookeeper 会进入 Leader 选举过程，短时间内不可用，确保数据一致性</td> <td>Zookeeper 在网络分区时更倾向于保持<strong>数据一致性</strong>，可能会拒绝提供服务（即使有部分节点仍可用），导致部分时间不可用</td> <td>Zookeeper 通过<strong>强一致性</strong>机制，在发生分区时优先保证数据正确性（CP），但可能会牺牲部分可用性</td></tr></tbody></table> <h2 id="注册中心的选择"><a href="#注册中心的选择" class="header-anchor">#</a> 注册中心的选择</h2> <p>注册中心可以说是微服务架构中的”通讯录“，它通过本地的文件系统记录了服务和服务地址的映射关系（类似于一个键值数据库），同时提供服务的调用功能，即调用者</p> <p>一般包含如下功能</p> <ul><li>服务发现
<ol><li>服务注册/反注册：保存服务提供者和服务调用者的信息</li> <li>服务订阅/取消订阅：服务调用者订阅服务提供者的信息，最好有实时推送的功能</li> <li>服务路由（可选）：具有筛选整合服务提供者的能力</li></ol></li> <li>服务配置
<ol><li>配置订阅：服务提供者和服务调用者订阅微服务相关的配置</li> <li>配置下发：主动将配置推送给服务提供者和服务调用者</li></ol></li> <li>服务健康检测：检测服务提供者的健康情况</li></ul> <p>注册中心总览</p> <table><thead><tr><th>组件名</th> <th>语言</th> <th>CAP</th> <th>服务健康检查</th> <th>对外暴露接口</th> <th>Spring Cloud 集成</th></tr></thead> <tbody><tr><td>Eureka</td> <td>Java</td> <td>AP</td> <td>可配</td> <td>HTTP</td> <td>√</td></tr> <tr><td>Zookeeper</td> <td>Java</td> <td>CP</td> <td>支持</td> <td>客户端</td> <td>√</td></tr> <tr><td>Nacos</td> <td>Java</td> <td>AP / CP</td> <td>支持</td> <td>RPC / DNS</td> <td>√</td></tr></tbody></table> <p>CA 是单点集群，满足一致性和可用性，不支持分区，仅能用于单机系统（本地玩具）</p> <p>在分布式系统中，分区容忍性一定是要满足的，所以注册中心的选取实际上就是在一致性和可用性之间的选取，通常而言，要满足一致性就要牺牲一定的性能（即 CP 的性能会略逊于 AP），或者说，“弹性”</p> <ul><li>Eureka 是网飞（Netflex）开源的，某知名视频网站，这样的网站处理讲究一个实时性、讲究一个弹性，而不需要高度的一致性，比如我去请求一个视频，我管你新的旧的，先打回来再说，我都上膛了，不得不起飞，所以选择 AP 系统，放弃一定的一致性而换来高可用性，以保证用户不管什么时候都不会请求炸膛</li> <li>但是在一些强调一致性的场景下，比如支付，一定是不能有吞订单、吞付款记录的情况出现，他的一致性一定是要优先保障的，一定是要选择所谓的 CP 系统，当订单出现异常时，一定是拒绝服务（可能是引入熔断机制），而不能随随便便进行后台数据的读写</li></ul> <h3 id="zookeeper-cp"><a href="#zookeeper-cp" class="header-anchor">#</a> Zookeeper - CP</h3> <blockquote><p>Zookeeper 遵循 CP 原则，保证一致性和分区容错性</p></blockquote> <p>ZooKeeper = 文件系统 + 通知机制的事件调度中心（参考 Spring 中容器事件的发布和监听）</p> <ul><li>基于观察者模式设计，注册服务相当于推送事件，服务调用者相当于监听器</li> <li>文件系统采用树形结构，每一个服务以 znode 节点的形式存放在树中</li></ul> <p>微服务的注册调用实际上就是</p> <ol><li>调用者去 zookeeper 订阅某一服务，这个服务包含了具体的调用地址，当要发起调用时，通过键取出服务信息，然后去打</li> <li>注册者在 zookeeper 存放自己服务的信息，为一个 znode，当发生注册/修改/撤销时，会发布事件，通知所有订阅了该服务的调用者，更新该服务信息，而后在下次调用时，使用新的信息去请求</li></ol> <p>如此解耦服务注册和服务调用的解耦，就是说，每次调用者调用时，都请求的是最新的服务地址，通过这样的订阅发布实现数据的一致性</p> <p>Zookeeper 服务端常用命令</p> <ul><li>启动 ZooKeeper 服务: ./zkServer.sh start</li> <li>查看 ZooKeeper 服务状态: ./zkServer.sh status</li> <li>停止 ZooKeeper 服务: ./zkServer.sh stop</li> <li>重启 ZooKeeper 服务: ./zkServer.sh restart</li></ul> <p>Curator API：建立连接；添加节点；删除节点；修改节点；查询节点</p> <p>Zookeeper 分布式锁，和 Redis 的分布式锁（Redission）类似，通过拿取/删除临时 znode 节点（Redis 是键值对）来实现锁，Curator 提供了基于五种基于 Zookeeper 的分布式锁方案</p> <ul><li>InterProcessSemaphoreMutex：分布式排它锁（非可重入锁）</li> <li>InterProcessMutex：分布式可重入排它锁</li> <li>InterProcessReadWriteLock：分布式读写锁</li> <li>InterProcessMultiLock：将多个锁作为单个实体管理的容器</li> <li>InterProcessSemaphoreV2：共享信号量</li></ul> <p>Watch 事件监听：ZooKeeper 允许用户在指定节点上注册一些 Watcher，并且在一些特定事件触发的时候，ZooKeeper 服务端会将事件通知到感兴趣的客户端上去，该机制是 ZooKeeper 实现分布式协调服务的重要特性</p> <p>ZooKeeper 提供了三种 Watcher</p> <ol><li>NodeCache：只是监听某一个特定的节点</li> <li>PathChildrenCache：监控一个 ZNode 的子节点</li> <li>TreeCache：可以监控整个树上的所有节点，类似于 PathChildrenCache 和 NodeCache 的组合</li></ol> <p>在 ZooKeeper <strong>集群</strong>服务中有三个角色，这是一个经典的<strong>主从架构</strong></p> <ul><li>Leader 领导者：Leader 是集群的核心，负责处理所有写请求（如创建、更新、删除节点）和事务性操作，Leader 负责将写操作同步到所有 Follower 和 Observer 节点，确保数据一致性</li> <li>Follower 跟随者：处理客户端的读请求，参与写请求的投票（ZooKeeper 使用 Zab 协议，写请求需要大多数节点确认），参与 Leader 选举</li> <li>Observer 观察者：处理客户端的读请求，不参与写请求的投票，也不参与 Leader 选举。Observer 的<strong>主要作用是扩展 ZooKeeper 集群的读能力</strong>，而不会增加写操作的开销</li></ul> <p>就是说，Leader 负责写，Follower 和 Observer 负责读，并且通过同步复制（区别于 Eureka 的异步复制）从 Leader 节点中同步数据，以保证系统的一致性</p> <ul><li>Leader 相当于经典的主从架构中的 Master，而 Follower 相当于 Slave</li></ul> <p>Zookeeper 集群的读写流程</p> <ol><li>写请求流程：
<ul><li>客户端发送写请求到任意节点（Leader 或 Follower）</li> <li>如果请求发送到 Follower，Follower 会将请求转发给 Leader</li> <li>Leader 将写请求作为提案（Proposal）广播给所有 Follower</li> <li>Follower 收到提案后，会进行投票（ACK）</li> <li>当大多数节点（包括 Leader 自己）确认后，Leader 会提交（Commit）该写操作，并通知所有 Follower 和 Observer 同步数据</li></ul></li> <li>读请求流程：
<ul><li>客户端发送读请求到任意节点（Leader、Follower 或 Observer）</li> <li>节点直接返回本地数据，不需要与其他节点协商</li></ul></li></ol> <p>Leader 的选举：Zookeeper 集群的 Leader 是动态选举的，而不是静态指派</p> <ul><li>Serverid：服务器 ID，比如有三台服务器，编号分别为<code>1,2,3</code>，编号越大在选择算法中的权重越大</li> <li>Zxid：数据 ID，服务器中存放的最大数据 ID 值越大说明数据越新，在选举算法中数据越新权重越大</li></ul> <p>在 Leader 选举的过程中，如果某台 ZooKeeper 获得了超过半数的选票，则此 ZooKeeper 就可以成为 Leader 了</p> <p>我突然想到了 Nginx 的主进程和工作进程（因为看到了 Master 和 Slave），这是否也是一种主从架构？似乎不是，Nginx 就是一个主进程作为管理者，工作进程之间相互平等，无主从关系，实际做事的都是工作进程。就像 FTP 协议，21 端口控制，20 端口传输，你不能说这是一个主从吧</p> <ul><li>实际上，Nginx 是一个<strong>单主多进程</strong>的架构，并不涉及数据一致性和分布式协调问题，而是专注于高效处理网络请求</li></ul> <h3 id="eureka-ap"><a href="#eureka-ap" class="header-anchor">#</a> Eureka - AP</h3> <p>前面提到过，Eureka 是一个 AP 系统，是 Netflix 开源的<strong>服务发现组件</strong>，因为应用在视频平台，它的设计目标是高可用性和弹性，因此在 CAP 中选择了 AP，这样总是能返回用户视频流，但不严格保证一致性</p> <p>Eureka 包含两个组件：Eureka Server 和 Eureka Client</p> <ul><li>Eureka Server 提供服务注册服务：各个微服务节点通过配置启动后，会在 EurekaServer 中进行注册，这样 EurekaServer 中的服务注册表中将会存储所有可用服务节点的信息，服务节点的信息可以在界面中直观看到</li> <li>Eureka Client 通过注册中心进行访问：本质上是一个 Java 客户端，用于简化 Eureka Server 的交互，客户端同时也具备一个内置的、使用轮询（round-robin）负载算法的负载均衡器。在应用启动后，将会向 Eureka Server 发送心跳（默认周期为30秒）。<strong>如果 Eureka Server 在多个心跳周期内没有接收到某个节点的心跳，EurekaServer 将会从服务注册表中把这个服务节点移除（默认90秒）</strong></li></ul> <p>Eureka 有一个重要的特性叫<strong>自我保护机制</strong>（Self-Preservation），这是它作为 AP 系统的核心设计之一</p> <ul><li>触发条件：当 Eureka 服务器节点在短时间内丢失过多客户端心跳（例如网络分区或大规模服务故障），Eureka 会进入自我保护模式</li> <li>行为：在自我保护模式下，Eureka 不会立即注销丢失心跳的服务实例，<strong>而是保留这些实例，即使它们可能已经不可用</strong></li> <li>目的：这是为了防止因网络分区或临时故障导致的服务实例被错误地注销，从而避免大规模服务不可用</li> <li>影响：在自我保护模式下，Eureka 的数据可能不一致（例如保留了已宕机的服务实例），但保证了系统的可用性</li></ul> <h3 id="nacos-ap-cp"><a href="#nacos-ap-cp" class="header-anchor">#</a> Nacos - AP / CP</h3> <blockquote><p>Nacos 支持两种模式：<strong>AP 模式</strong>（基于 Distro 协议）和 <strong>CP 模式</strong>（基于 Raft 协议）</p></blockquote> <p>Nacos 是阿里巴巴开源的一款 Java 实现的动态服务发现、配置管理和服务管理平台，是 Spring Cloud Alibaba 生态的核心组件之一，支持多种服务注册与发现模式</p> <p>核心特性</p> <ul><li>服务发现：支持基于 DNS 和 RPC 的服务发现，提供服务的注册、注销和查询功能</li> <li>动态 DNS：支持将服务名解析为具体的 IP 地址和端口</li> <li><strong>一致性协议</strong> <ul><li>Nacos 支持两种模式：<strong>AP 模式</strong>（基于 Distro 协议）和 <strong>CP 模式</strong>（基于 Raft 协议）</li> <li>默认情况下，Nacos 使用 AP 模式，适合需要高可用性的场景，CP 模式适合需要强一致性的场景</li></ul></li> <li>健康检查：支持多种健康检查机制，包括心跳检测和主动探测</li></ul> <p>模式的切换是 Nacos 的核心卖点，适合需要灵活选择 AP 或 CP 模式的场景</p> <h2 id="rpc-框架的选择"><a href="#rpc-框架的选择" class="header-anchor">#</a> RPC 框架的选择</h2> <p>注册中心是存取信息的地方，即注册某个服务和订阅（拿取）某个服务的地方，信息拿到了之后怎么去用，是 RPC 框架的问题，是用 HTTP 打还是 TCP 打呢？</p> <p>常见 RPC 框架</p> <table><thead><tr><th>RPC 框架</th> <th>语言</th> <th>主要特点</th></tr></thead> <tbody><tr><td><strong>gRPC</strong></td> <td>多语言（Java、Go、Python等）</td> <td>Google 开发，基于 HTTP/2 和 Protobuf，高性能，支持流式通信</td></tr> <tr><td><strong>Dubbo</strong></td> <td>Java</td> <td>阿里巴巴开发，支持服务发现、负载均衡、流量控制</td></tr> <tr><td><strong>Motan</strong></td> <td>Java</td> <td>美团开源，轻量级，适用于高并发场景</td></tr> <tr><td><strong>Thrift</strong></td> <td>多语言（Java、C++、Python等）</td> <td>Facebook 开发，支持多种语言，适用于跨语言 RPC</td></tr> <tr><td><strong>Tars</strong></td> <td>多语言（Java、C++、Go等）</td> <td>腾讯开源，支持大规模分布式应用</td></tr> <tr><td><strong>Hessian</strong></td> <td>Java</td> <td>简单易用，适用于小型应用，序列化采用二进制格式</td></tr></tbody></table> <p>服务调用的选择，简单考虑</p> <ul><li>如果需要简单的 HTTP 请求，选择 WebClient</li> <li>如果需要客户端负载均衡和声明式 HTTP 调用，选择 OpenFeign</li> <li>如果需要高性能的 RPC 调用和强大的服务治理能力，选择 Dubbo</li></ul> <h3 id="resttemplate"><a href="#resttemplate" class="header-anchor">#</a> RestTemplate</h3> <p><code>RestTemplate</code> 是 Spring 提供的一个用于同步 HTTP 请求的客户端工具，它封装了 HTTP 请求的细节，例如请求方式（Get / Post）、请求格式（Json）等，支持 RESTful 风格的调用</p> <ul><li>已被 Spring 标记为“<strong>不再推荐</strong>”，官方建议使用 <code>WebClient</code>（响应式非阻塞）作为替代，RestTemplate 在 Spring Framework 7.0 中进入弃用计划，并在后续版本中逐步移除</li></ul> <p>傻卵奥联给的密码机接口就是封装的 RestTemplate ，有如下特点</p> <ol><li>同步调用，<code>RestTemplate</code>的调用是同步阻塞的，适合简单的 HTTP 请求场景</li> <li>支持多种 HTTP 方法，如 GET、POST、PUT、DELETE 等</li> <li>集成 Spring 生态，简单易用，适合快速开发和小规模项目</li></ol> <p>随着 RestTemplate 的弃用，Spring HTTP 大多使用</p> <ul><li>RestClient：作为 RestTemplate 的替代，适用于大多数同步阻塞式应用</li> <li>WebClient：适合需要 Reactive、异步或流式处理的应用（MCP 的一种实现方式正是使用 WebClient，包括 Flux 的 SSE 传输）</li></ul> <h3 id="http-service-clients"><a href="#http-service-clients" class="header-anchor">#</a> HTTP Service Clients</h3> <p>Spring Boot 4 / Spring Framework 7 新扶正的 HTTP 通信框架</p> <h3 id="feign-openfeign"><a href="#feign-openfeign" class="header-anchor">#</a> Feign / OpenFeign</h3> <p><code>Feign</code>是 Netflix 开源的一个声明式的 HTTP 客户端，旨在简化服务调用。它通过注解的方式定义接口，自动生成 HTTP 请求</p> <ul><li>值得注意的是，Feign 内置了 Ribbon，自带负载均衡配置项</li></ul> <p>核心特性</p> <ol><li>声明式调用：通过注解定义接口，无需编写具体的 HTTP 请求代码</li> <li>集成 Ribbon：默认集成了 Ribbon，支持客户端负载均衡</li> <li>支持多种编码器/解码器：如 JSON、XML 等</li></ol> <p>我理解为 HTTP 请求的一层封装，通过注解定义接口，而无需编写复杂的 HTTP 请求代码，但本质上是一样的，都是 HTTP 的同步阻塞调用</p> <p><code>OpenFeign</code>是<code>Feign</code>的社区维护版本，Spring Cloud 对其进行了增强和集成。它继承了<code>Feign</code>的所有特性，并增加了对 Spring 生态的支持（可以理解为更适合 Spring 宝宝体质的 Feign）</p> <table><thead><tr><th>Feign</th> <th>OpenFeign</th></tr></thead> <tbody><tr><td>Feign 是 Spring Cloud 组件中的一个轻量级 Restful HTTP 服务客户端</td> <td>OpenFeign 是 Spring Cloud 在 Feign 的基础上支持了 SpringMVC 的注解，如 @RequestMapping 等</td></tr> <tr><td>Feign 内置了 Ribbon 用来做客户端负载均衡，去调用注册中心的服务。Feign 的使用方式是：使用 Feign 的注解定义接口，调用这个接口，就可以调用服务注册中心的服务</td> <td>OpenFeign 的 @FeignClient 注解可以解析 SpringMVC 的 @RequestMapping 主接线所有接口，并通过动态代理的方式产生增强的代理实现类，在代理类中实现复杂均衡并调用其他服务</td></tr> <tr><td><code>spring-cloud-starter-feign</code></td> <td><code>spring-cloud-starter-openfeign</code></td></tr></tbody></table> <p>核心特性</p> <ol><li>声明式调用：与 <code>Feign</code> 相同，通过注解定义接口</li> <li>集成 Spring Cloud：支持 Spring Cloud 的<strong>服务发现、负载均衡、熔断器、超时控制</strong>等特性</li> <li>扩展性强：支持自定义编码器、解码器、拦截器等</li></ol> <p>与 Feign 的区别就是，集成在 Spring Cloud 生态中，与微服务调用相结合，并支持更多的功能和扩展性</p> <h3 id="dubbo"><a href="#dubbo" class="header-anchor">#</a> Dubbo</h3> <p><code>Dubbo</code>是阿里巴巴开源的一款高性能 Java RPC 框架，主要用于分布式服务之间的远程调用，这里也说了，Dubbo 是一个 RPC 框架，他并不是打的 HTTP 请求，而是某种二进制协议</p> <ul><li>就叫 Dubbo 协议，是基于 TCP 的高效通信协议，省去了很多 HTTP 中冗余的部分</li></ul> <p>核心特性 → 适用于高性能的分布式服务调用和需要强大服务治理能力的场景</p> <ol><li>高性能 RPC：基于 Netty 实现，性能优异</li> <li>服务治理：支持负载均衡、服务降级、熔断、限流等功能</li> <li>服务发现：支持多种注册中心（如 Zookeeper、Nacos）</li> <li>多协议支持：支持 Dubbo 协议、HTTP、REST 等</li> <li>分布式事务：支持分布式事务解决方案（如 Seata）</li></ol> <p>注册中心挂了之后，Dubbo 还能访问到服务吗？</p> <p>分情况，如果之前调用过，Dubbo 会把服务地址缓存在本地，再次调用时不会访问注册中心，这里存在一致性的问题？</p> <h3 id="grpc"><a href="#grpc" class="header-anchor">#</a> gRPC</h3> <p>gRPC 是 Google 开源的一个高性能、通用的远程过程调用（RPC）框架，用于在分布式系统中实现跨服务、跨语言的高效通信</p> <p>核心特点</p> <table><thead><tr><th>特性</th> <th>简要说明</th></tr></thead> <tbody><tr><td>基于 HTTP/2</td> <td>支持多路复用、头部压缩、流式传输，提升网络效率和性能</td></tr> <tr><td>使用 Protobuf</td> <td>使用 Protocol Buffers（协议缓冲）进行序列化，比 JSON 更小更快更高效</td></tr> <tr><td>多语言支持</td> <td>支持 Java、Go、Python、C++、C#、Node.js 等主流语言，适合构建<strong>多语言微服务架构</strong></td></tr> <tr><td>自动代码生成</td> <td>使用 <code>.proto</code> 文件定义接口和数据结构，gRPC 工具自动生成客户端和服务端代码。</td></tr> <tr><td>支持四种通信模式</td> <td>包括：一元调用（普通 RPC）、服务端流、客户端流、双向流通信</td></tr></tbody></table> <p>响应流程</p> <div class="language- extra-class"><pre class="language-text"><code>客户端调用方法 → gRPC 框架序列化请求 → 通过 HTTP/2 发送 → 服务端反序列化处理 → 返回响应
</code></pre></div><p>与 HTTP 方式的对比</p> <table><thead><tr><th>对比点</th> <th>gRPC</th> <th>REST（如 Feign）</th></tr></thead> <tbody><tr><td>协议</td> <td>HTTP/2 + Protobuf</td> <td>HTTP/1.1 + JSON</td></tr> <tr><td>性能</td> <td>高</td> <td>中</td></tr> <tr><td>类型支持</td> <td>强类型（proto约束）</td> <td>弱类型（JSON）</td></tr> <tr><td>开发效率</td> <td>高（代码自动生成）</td> <td>中（需手写接口类）</td></tr> <tr><td>跨语言支持</td> <td>很强</td> <td>一般</td></tr></tbody></table> <p>使用场景</p> <ul><li>微服务架构下的高性能服务间通信</li> <li>跨语言通信</li> <li>移动端与后端通信（如 Android/Go）</li> <li>IoT、大数据服务对接等对延迟、带宽要求高的系统</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/699675/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">锁、单例和原子性</div></a> <a href="/pages/6945a9/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">JVM 基础（一）</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
