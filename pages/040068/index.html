PdX850EVnnLZkB8prodQoM5JGj7Xk2mvC7JB8tG04Ef5PiXtG0UtxupRQSfTnBoCy554x18yJHI6I+G5Eru4LHmPJZEQsrvPUbMiA8G/WgMK7w7I+ez7++o2ANfbrjvaOl1tFMs+htG3IrZH9/hDX1Pr8Tc0UvH8tcX29KzAgIGcEkINyW5BF9x891hw6VYqgJHEk0huccS7vh3C6gTiODL+26huuBtbct8eZnqLML8PkxGYpuPZBqtqwkSjgc4mB5gbgig5i+y0UDK35LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">测试开发基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="junit-单元测试"><a href="#junit-单元测试" class="header-anchor">#</a> Junit 单元测试</h2> <p>就程序 Bug 而言，一般包括</p> <ul><li>产品 PRD 流程上的</li> <li>运营配置活动时候的</li> <li>研发开发时功能实现的</li> <li>测试验证时漏掉流程的</li> <li>上线过程中运维服务相关配置的</li></ul> <p>以上都可以通过规范的开发测试流程和逐渐积累的研发经验尽可能减少，而另外一类是沟通留下的 Bug，越早发现 Bug，就能越快解决问题，将漏洞扼杀在单元测试是最有性价比的选择</p> <h3 id="junit"><a href="#junit" class="header-anchor">#</a> Junit</h3> <p>Maven 依赖（Junit5）</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.junit.jupiter<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>junit-jupiter<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>5.8.2<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>JUnit 注解说明</p> <table><thead><tr><th style="text-align:left;">注解</th> <th style="text-align:left;">说明</th></tr></thead> <tbody><tr><td style="text-align:left;">@Test</td> <td style="text-align:left;">标识一条测试用例，指定异常 expected = XXEception.class，设置超时时间 timeout = xxx</td></tr> <tr><td style="text-align:left;">@Ignore</td> <td style="text-align:left;">忽略的测试用例</td></tr> <tr><td style="text-align:left;">@Before</td> <td style="text-align:left;">每一个测试方法之前运行</td></tr> <tr><td style="text-align:left;">@After</td> <td style="text-align:left;">每一个测试方法之后运行</td></tr> <tr><td style="text-align:left;">@BefreClass</td> <td style="text-align:left;">所有测试开始之前运行</td></tr> <tr><td style="text-align:left;">@AfterClass</td> <td style="text-align:left;">所有测试结果之后运行</td></tr></tbody></table> <h3 id="springboottest"><a href="#springboottest" class="header-anchor">#</a> SpringBootTest</h3> <p>现在有这样一个需求，我需要对一个 Spring 的 Component 类 EncryptedTree 进行功能和性能测试</p> <ul><li>原则上，每个<code>@Test</code>函数只测一个功能，所以需要对<code>Junit</code>的生命周期有一定了解（不能把一个完整流程写在一个函数中）</li> <li>另外，因为该类由 Spring 管理，初始化可以直接<code>@Autowired</code>注入，但需要搭配<code>SpringBootTest</code>使用</li></ul> <p>Maven 依赖（Spring Boot Test）</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.boot<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-test<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>新建类<code>EncryptedTreeTest</code>，并进行初始化，命名规范一般为<code>类名 + Test</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootTest</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">EncryptedTreeTest</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">CsvReaderUtil</span> csvReaderUtil<span class="token punctuation">;</span>
    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">EncryptedTree</span> <span class="token constant">TREE</span><span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">List</span><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span><span class="token punctuation">&gt;</span></span> data<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@BeforeEach</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">setup</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">int</span> dimension <span class="token operator">=</span> <span class="token number">2</span><span class="token punctuation">,</span> size <span class="token operator">=</span> <span class="token number">5000</span><span class="token punctuation">;</span>
        <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">init</span><span class="token punctuation">(</span>dimension<span class="token punctuation">)</span><span class="token punctuation">;</span>
        data <span class="token operator">=</span> csvReaderUtil<span class="token punctuation">.</span><span class="token function">readCsvWithRange</span><span class="token punctuation">(</span><span class="token string">&quot;classpath:test_data/hi.csv&quot;</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> dimension<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">,</span> size<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>data<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>其中</p> <ul><li>CsvReaderUtil 同样是一个 Component，用以读入本地的 csv 文件并将结果存入内存<code>List&lt;List&lt;String&gt;&gt; data</code>中</li> <li><code>@BeforeEach</code>将在当前类的所有<code>@Test</code>注解之前执行，完成加载测试数据的工作</li></ul> <h3 id="生命周期"><a href="#生命周期" class="header-anchor">#</a> 生命周期</h3> <p>多叉树的构建测试</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">insert</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> str1 <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">{</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;test&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wcnm&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
    <span class="token class-name">TreeNode</span> t1 <span class="token operator">=</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">insert</span><span class="token punctuation">(</span>str1<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> str2 <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">{</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;test&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;sad&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
    <span class="token class-name">TreeNode</span> t2 <span class="token operator">=</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">insert</span><span class="token punctuation">(</span>str2<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>t1<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>t2<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getTreeStruct</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">assertEquals</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getSize</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">long</span> cost <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> <span class="token number">10</span><span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span>
        cost <span class="token operator">+=</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span>data<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getTreeStruct</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>cost<span class="token operator">/</span><span class="token number">10</span> <span class="token operator">+</span> <span class="token string">&quot;ms&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token function">assertEquals</span><span class="token punctuation">(</span>data<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getSize</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><ul><li>这两个 Test 都会在 setup 之后执行（换句话说，每次测试都会 setup 一次）</li> <li><code>assertEquals</code>断言会在为假时报告测试 failed</li></ul> <p>测试查询</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@AfterEach</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">search</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">TreeNode</span><span class="token punctuation">&gt;</span></span> result <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">int</span> loop <span class="token operator">=</span> <span class="token number">10</span><span class="token punctuation">;</span>
    <span class="token keyword">long</span> s <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">currentTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span> i <span class="token operator">&lt;=</span> loop<span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span> result<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">search</span><span class="token punctuation">(</span>data<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token number">490</span><span class="token operator">*</span>i<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">long</span> e <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">currentTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token punctuation">(</span>e<span class="token operator">-</span>s<span class="token punctuation">)</span> <span class="token operator">/</span> loop<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">assertEquals</span><span class="token punctuation">(</span>loop<span class="token punctuation">,</span> result<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一定是先构建再查询，所以查询操作会在<code>@Test</code>构建逻辑之后，使用<code>@AfterEach</code>注解</p> <p>执行一次<code>@Test build</code>，将会依次执行以下函数完成本次测试</p> <div class="language- extra-class"><pre class="language-text"><code>setup() → build() → search()
</code></pre></div><p>当然了，对于非 Spring 管理的类测试，直接在 setup 函数中进行手动的初始化即可，Junit 的流程一致</p> <h2 id="postman-接口测试"><a href="#postman-接口测试" class="header-anchor">#</a> Postman 接口测试</h2> <p>HTTP 接口测试，模拟前端表单提交</p> <h3 id="postman"><a href="#postman" class="header-anchor">#</a> Postman</h3> <blockquote><p>Postman 是一款功能强大的 API 开发与测试工具，支持 REST、SOAP、GraphQL 等协议调试</p></blockquote> <p>下载：<a href="https://www.postman.com/downloads/" target="_blank" rel="nofollow noopener noreferrer">Download Postman | Get Started for Free<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>入门：<a href="https://www.cnblogs.com/-lhl/articles/18663600" target="_blank" rel="nofollow noopener noreferrer">Postman 使用教程：从基础到高级 - 测试小萌新一枚 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="http"><a href="#http" class="header-anchor">#</a> HTTP</h3> <p>对常规的 HTTP 接口进行测试</p> <h3 id="dubbo"><a href="#dubbo" class="header-anchor">#</a> Dubbo</h3> <p>对 Dubbo 接口进行测试</p> <h2 id="jmter-压测"><a href="#jmter-压测" class="header-anchor">#</a> Jmter 压测</h2> <p>参考</p> <ul><li>Jmeter 性能压测：Java 程序性能测试，JVM 监控，参考 <a href="https://blog.csdn.net/Zachyy/article/details/139717444" target="_blank" rel="nofollow noopener noreferrer">JMeter的基本使用与性能测试，完整入门篇保姆式教程-CSDN博客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.bilibili.com/video/BV18K25BBEk7?spm_id_from=333.788.videopod.episodes&amp;vd_source=757c95a458d7c9501de959636f126d0a&amp;p=4" target="_blank" rel="nofollow noopener noreferrer">4.辅助组件_哔哩哔哩 - bilibili<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="jmeter"><a href="#jmeter" class="header-anchor">#</a> Jmeter</h3> <blockquote><p>Apache JMeter™ 是一个开源软件，它是一个 100% 纯 Java 应用程序，旨在测试功能行为和衡量性能，它最初是为测试 Web 应用程序而设计的，但后来已扩展到其他测试功能</p></blockquote> <p>官网：<a href="https://jmeter.apache.org/index.html" target="_blank" rel="nofollow noopener noreferrer">Apache JMeter - Apache JMeter™<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d=" icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cwiki.apache.org/confluence/display/JMETER/JMeterFAQ" target="_blank" rel="nofollow noopener noreferrer">JMeter 常见问题解答（Wiki）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cwiki.apache.org/confluence/display/JMETER/Home" target="_blank" rel="nofollow noopener noreferrer">JMeter Wiki<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://jmeter.apache.org/building.html" target="_blank" rel="nofollow noopener noreferrer">构建 JMeter 和插件<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>核心组件</p> <ul><li>测试计划</li> <li>线程组</li> <li>取样器</li></ul> <p>辅助组件</p> <ul><li>监听器</li> <li>配置元件</li> <li>定时器：延迟取样器执行</li> <li>断言：判断取样器结果</li> <li>前置处理器：在取样器之前执行</li> <li>后置处理器：在取样器之后执行</li> <li>逻辑控制器：对取样器进行逻辑控制（条件、分支、循环、跳转）</li></ul> <h3 id="接口-api-测试"><a href="#接口-api-测试" class="header-anchor">#</a> 接口 API 测试</h3> <p>在<code>apache-jmeter-5.6.3\bin</code>目录下，找到 ApacheJmeter.jar 这个 jar，通过 java -jar 命令运行 GUI 界面</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-jar</span> ApacheJMeter.jar
</code></pre></div><p>新建测试计划</p> <ul><li>右键测试计划：<code>添加 → 线程（用户） → tearDown 线程组</code></li></ul> <p>线程组的两个关键参数：线程数和循环次数，暂设为 1</p> <ul><li>右键线程组：<code>添加 → 取样器 → HTTP 请求</code></li></ul> <p>线程组定义如下</p> <img src="/assets/img/image-20251218165900166.6068c3c1.png"> <p>随便在 <a href="https://www.showapi.com/" target="_blank" rel="nofollow noopener noreferrer">万维易源<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 上找一个天气接口 <a href="https://www.showapi.com/apiGateway/view/9" target="_blank" rel="nofollow noopener noreferrer">天气预报 API 接口-万维易源<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，注册登录获取，从网页上可以得知其接口地址</p> <ul><li><code>https://route.showapi.com/9-2?appKey={your_appKey}</code></li></ul> <p>而后构造 JMeter 中的 HTTP 请求</p> <ul><li>将<code>route.showapi.com</code>作为 JMeter HTTP 请求的<code>服务器名称或IP</code>字段</li> <li>将路径<code>/9-2</code>作为<code>路径</code>字段</li> <li>端口号默认</li></ul> <p>添加 HTTP 请求参数，按照给定的接口格式，添加 appKey 字段和查询的城市</p> <ul><li><code>appKey: 922D56C4ea904CDEB35aB1d12C64A148</code></li> <li><code>area: 西安</code></li></ul> <p>HTTP 请求定义如下</p> <img src="/assets/img/image-20251218165816693.812ebe1e.png"> <p>定义完 HTTP 请求，为其添加一个监听器用以查看服务器的返回信息</p> <ul><li>右键 HTTP 请求：<code>添加 → 监听器 → 查看结果树</code></li></ul> <p>点击保存和运行，得到服务器的响应结果，在查看结果树中查看带小盾牌的 HTTP 请求</p> <img src="/assets/img/image-20251218165731451.ab021c37.png"> <p>可以在小盾牌上方按钮选择文本的展示格式如 JSON / Text 等</p> <h3 id="性能测试"><a href="#性能测试" class="header-anchor">#</a> 性能测试</h3> <p>监听器 → 聚合报告</p> <p>通过修改线程组中的线程数和循环次数来对接口进行压测</p> <h2 id="burpsuite-抓包测试"><a href="#burpsuite-抓包测试" class="header-anchor">#</a> BurpSuite 抓包测试</h2> <blockquote><p>通过 BurpSuite 对网络请求进行抓包</p></blockquote> <h3 id="burpsuite"><a href="#burpsuite" class="header-anchor">#</a> BurpSuite</h3> <p>Burp Suite Professional 是一套来自 PortSwigger，用于测试 web 安全性的高级工具集，从一个基本的拦截代理到尖端的 Burp 扫描器</p> <p>下载</p> <ul><li><a href="https://sysin.org/blog/burp-suite-pro-win/" target="_blank" rel="nofollow noopener noreferrer">Burp Suite Professional 2025.12 for Windows x64 - 领先的 Web 渗透测试软件 - sysin | SYStem INside | 软件与技术分享<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://portswigger.net/burp/communitydownload" target="_blank" rel="nofollow noopener noreferrer">Download Burp Suite Community Edition - PortSwigger<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>入门：<a href="https://www.cnblogs.com/xingzhifeng/p/18702715" target="_blank" rel="nofollow noopener noreferrer">BurpSuite 安装及使用实操 - 刑之风 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="代理设置和网络包重放"><a href="#代理设置和网络包重放" class="header-anchor">#</a> 代理设置和网络包重放</h3> <p>BurpSuite 测试</p> <ol><li>设置端口代理</li> <li>抓包</li> <li>重放</li></ol> <p>基本思路：在 Burp 设置 Proxy 拦截，然后把浏览器/程序/应用写一个代理发到 Burp 的 Proxy 上，Burp 将作为一个中转站进行网络通信，这样就能对每个 HTTP 进行数据抓包</p> <p>首先在 Burp 的 Settings → Tools → Proxy 中设置代理<code>127.0.0.1:8080</code></p> <p>若是 Spring 程序，可以在启动类前设置代理</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">setProxy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;http.proxyHost&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;127.0.0.1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;http.proxyPort&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;8080&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;https.proxyHost&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;127.0.0.1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;https.proxyPort&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;8080&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">ProxyUtil</span><span class="token punctuation">.</span><span class="token function">setProxy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">AuditAiAgentApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这样从 Spring 打出的所有网络请求都会走<code>127.0.0.1:8080</code>，从而被 Burp 捕捉</p> <p>其他代理设置</p> <ul><li>在浏览器中，通过 Zero Omega 同样可以设置这样的代理：选项 → 情景模式 → 新建情景模式（设置为<code>127.0.0.1:8080</code>）同默，而后启用即可，这样 Burp 就能捕捉到当前浏览器发出的所有 HTTP 请求</li> <li>本地应用代理设置：Proxifier</li></ul> <p>一些使用小技巧</p> <ul><li>Ctrl + R 重放请求 Repeater</li> <li>Intercept on 打开网络断电</li> <li>HTTP history 查看每一次请求包</li></ul> <h2 id="swagger-接口文档"><a href="#swagger-接口文档" class="header-anchor">#</a> Swagger 接口文档</h2> <h3 id="swagger"><a href="#swagger" class="header-anchor">#</a> Swagger</h3> <p>Swagger 是一款由 <em>SmartBear Software</em> 提供的致力于解决接口规范化、标准化、文档化的开源库，可以根据 resutful 风格生成接口开发文档，并且支持做测试的一款中间软件</p> <p>Swagger 采用全注解方式侵入代码，后端定义好接口后，能够自动生成文档、接口功能和参数，并且提供接口测试的网页 UI</p> <p>Maven 依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token comment">&lt;!--引入swagger--&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>io.springfox<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>springfox-swagger2<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2.7.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>io.springfox<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>springfox-swagger-ui<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2.7.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>在 Spring 中，注入 Swaager 的配置依赖</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token annotation punctuation">@EnableSwagger2</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">SwaggerConfig</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">Docket</span> <span class="token function">productApi</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">Docket</span><span class="token punctuation">(</span><span class="token class-name">DocumentationType</span><span class="token punctuation">.</span><span class="token constant">SWAGGER_2</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">select</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">apis</span><span class="token punctuation">(</span><span class="token class-name">RequestHandlerSelectors</span><span class="token punctuation">.</span><span class="token function">withMethodAnnotation</span><span class="token punctuation">(</span><span class="token class-name">ApiOperation</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span>  <span class="token comment">//添加ApiOperiation注解的被扫描</span>
                <span class="token punctuation">.</span><span class="token function">paths</span><span class="token punctuation">(</span><span class="token class-name">PathSelectors</span><span class="token punctuation">.</span><span class="token function">any</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token punctuation">}</span>

    <span class="token keyword">private</span> <span class="token class-name">ApiInfo</span> <span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">ApiInfoBuilder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">title</span><span class="token punctuation">(</span>”swagger和springBoot整合“<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">description</span><span class="token punctuation">(</span>”swagger 的 <span class="token constant">API</span> 文档&quot;<span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">version</span><span class="token punctuation">(</span><span class="token string">&quot;1.0&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

<span class="token punctuation">}</span>
</code></pre></div><h3 id="springboot-整合"><a href="#springboot-整合" class="header-anchor">#</a> SpringBoot 整合</h3> <p>在 Controller 层代码中使用 Swagger 注解</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@Api</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token string">&quot;电影Controller&quot;</span><span class="token punctuation">,</span> tags <span class="token operator">=</span> <span class="token punctuation">{</span> <span class="token string">&quot;电影访问接口&quot;</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/film&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">FilmController</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">FilmService</span> filmService<span class="token punctuation">;</span>

    <span class="token comment">/**
     * 添加一个电影数据
     *
     * @param
     * @return
     */</span>
    <span class="token annotation punctuation">@ApiOperation</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token string">&quot;添加一部电影&quot;</span><span class="token punctuation">)</span>
    <span class="token annotation punctuation">@PostMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/addFilm&quot;</span><span class="token punctuation">)</span>
    <span class="token annotation punctuation">@ApiResponses</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token punctuation">{</span> <span class="token annotation punctuation">@ApiResponse</span><span class="token punctuation">(</span>code <span class="token operator">=</span> <span class="token number">1000</span><span class="token punctuation">,</span> message <span class="token operator">=</span> <span class="token string">&quot;成功&quot;</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token annotation punctuation">@ApiResponse</span><span class="token punctuation">(</span>code <span class="token operator">=</span> <span class="token number">1001</span><span class="token punctuation">,</span> message <span class="token operator">=</span> <span class="token string">&quot;失败&quot;</span><span class="token punctuation">)</span><span class="token punctuation">,</span>

            <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getSuccessResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getErrorResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>启动后，直接访问<code>localhost:8080/swagger-ui.html</code>就可以看到清晰的 API 测试界面</p> <p>一些需要注意的点</p> <ul><li>对于只有一个<code>HttpServletRequest</code>参数的方法，如果参数小于 5 个，推荐使用<code>@ApiImplicitParams</code>的方式单独封装每一个参数；如果参数大于 5 个，采用定义一个对象去封装所有参数的属性，然后使用<code>@APiParam</code>的方式</li> <li>默认的访问地址：<code>ip:port/swagger-ui.html#/</code>，但在 shiro 中会拦截所有的请求，必须加上默认访问路径（比如项目中，就是<code>ip:port/context/swagger-ui.html#/</code>），然后登陆后才可以看到</li> <li>在 GET 请求中，参数在 Body 体里面,不能使用<code>@RequestBody</code>；在 POST 请求，可以使用<code>@RequestBody</code>和<code>@RequestParam</code>，如果使用<code>@RequestBody</code>，对于参数转化的配置必须统一</li> <li>controller 必须指定请求类型 GET/POST，否则 swagger 会把所有的类型（6 种）都生成出来</li> <li>swagger 在生产环境不能对外暴露，可以使用<code>@Profile({&quot;dev&quot;, &quot;prod&quot;, &quot;pre&quot;})</code>指定可用的环境</li></ul> <h2 id="开发测试流程"><a href="#开发测试流程" class="header-anchor">#</a> 开发测试流程</h2> <h3 id="git-流程"><a href="#git-流程" class="header-anchor">#</a> Git 流程</h3> <p>养成需求分析 - 方案设计 - 开发测试 - 迭代优化的工作思维</p> <ul><li>主仓库维护 master/dev/test 分支和各类 release/customer 分支</li> <li>每个 developer 自己 fork 仓库 checkout 自己的 feature 分支，开发完需求后，再 merge 到主仓库的分支</li> <li>merge 时，提 merge 单，由相关同事或主管 cr 代码，给出评审意见，cr 全部 approve 后，由 owner 合并</li></ul> <h3 id="应用开发流程"><a href="#应用开发流程" class="header-anchor">#</a> 应用开发流程</h3> <p>一个应用开发流程，可以参考 AI 软件开发框架 BMAD 的工作流图</p> <ol><li>产品调用</li> <li>PRD</li> <li>架构设计</li> <li>具体实施</li></ol> <img src="/assets/img/workflow-method-greenfield.9655698f.svg"></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4feb0e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Linux 运维与开发</div></a> <a href="/pages/0d525f/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">数据库</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
