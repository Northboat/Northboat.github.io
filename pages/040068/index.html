0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">测试开发基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="junit-单元测试"><a href="#junit-单元测试" class="header-anchor">#</a> Junit 单元测试</h2> <p>就程序 Bug 而言，一般包括</p> <ul><li>产品 PRD 流程上的</li> <li>运营配置活动时候的</li> <li>研发开发时功能实现的</li> <li>测试验证时漏掉流程的</li> <li>上线过程中运维服务相关配置的</li></ul> <p>以上都可以通过规范的开发测试流程和逐渐积累的研发经验尽可能减少，而另外一类是沟通留下的 Bug，越早发现 Bug，就能越快解决问题，将漏洞扼杀在单元测试是最有性价比的选择</p> <h3 id="junit-和-springboottest"><a href="#junit-和-springboottest" class="header-anchor">#</a> Junit 和 SpringBootTest</h3> <p>Maven 依赖（Junit5）</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.junit.jupiter<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>junit-jupiter<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>5.8.2<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>JUnit 注解说明</p> <table><thead><tr><th style="text-align:left;">注解</th> <th style="text-align:left;">说明</th></tr></thead> <tbody><tr><td style="text-align:left;">@Test</td> <td style="text-align:left;">标识一条测试用例，指定异常 expected = XXEception.class，设置超时时间 timeout = xxx</td></tr> <tr><td style="text-align:left;">@Ignore</td> <td style="text-align:left;">忽略的测试用例</td></tr> <tr><td style="text-align:left;">@Before</td> <td style="text-align:left;">每一个测试方法之前运行</td></tr> <tr><td style="text-align:left;">@After</td> <td style="text-align:left;">每一个测试方法之后运行</td></tr> <tr><td style="text-align:left;">@BefreClass</td> <td style="text-align:left;">所有测试开始之前运行</td></tr> <tr><td style="text-align:left;">@AfterClass</td> <td style="text-align:left;">所有测试结果之后运行</td></tr></tbody></table> <p>现在有这样一个需求，我需要对一个 Spring 的 Component 类 EncryptedTree 进行功能和性能测试</p> <ul><li>原则上，每个<code>@Test</code>函数只测一个功能，所以需要对<code>Junit</code>的生命周期有一定了解（不能把一个完整流程写在一个函数中）</li> <li>另外，因为该类由 Spring 管理，初始化可以直接<code>@Autowired</code>注入，但需要搭配<code>SpringBootTest</code>使用</li></ul> <p>Maven 依赖（Spring Boot Test）</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.boot<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-test<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>新建类<code>EncryptedTreeTest</code>，并进行初始化，命名规范一般为<code>类名 + Test</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootTest</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">EncryptedTreeTest</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">CsvReaderUtil</span> csvReaderUtil<span class="token punctuation">;</span>
    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">EncryptedTree</span> <span class="token constant">TREE</span><span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">List</span><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span><span class="token punctuation">&gt;</span></span> data<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@BeforeEach</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">setup</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">int</span> dimension <span class="token operator">=</span> <span class="token number">2</span><span class="token punctuation">,</span> size <span class="token operator">=</span> <span class="token number">5000</span><span class="token punctuation">;</span>
        <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">init</span><span class="token punctuation">(</span>dimension<span class="token punctuation">)</span><span class="token punctuation">;</span>
        data <span class="token operator">=</span> csvReaderUtil<span class="token punctuation">.</span><span class="token function">readCsvWithRange</span><span class="token punctuation">(</span><span class="token string">&quot;classpath:test_data/hi.csv&quot;</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> dimension<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">,</span> size<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>data<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>其中</p> <ul><li>CsvReaderUtil 同样是一个 Component，用以读入本地的 csv 文件并将结果存入内存<code>List&lt;List&lt;String&gt;&gt; data</code>中</li> <li><code>@BeforeEach</code>将在当前类的所有<code>@Test</code>注解之前执行，完成加载测试数据的工作</li></ul> <h3 id="junit-生命周期"><a href="#junit-生命周期" class="header-anchor">#</a> Junit 生命周期</h3> <p>多叉树的构建测试</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">insert</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> str1 <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">{</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;test&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wcnm&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
    <span class="token class-name">TreeNode</span> t1 <span class="token operator">=</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">insert</span><span class="token punctuation">(</span>str1<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> str2 <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">{</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;test&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;sad&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
    <span class="token class-name">TreeNode</span> t2 <span class="token operator">=</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">insert</span><span class="token punctuation">(</span>str2<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>t1<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>t2<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getTreeStruct</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">assertEquals</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getSize</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">long</span> cost <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> <span class="token number">10</span><span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span>
        cost <span class="token operator">+=</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span>data<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getTreeStruct</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>cost<span class="token operator">/</span><span class="token number">10</span> <span class="token operator">+</span> <span class="token string">&quot;ms&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token function">assertEquals</span><span class="token punctuation">(</span>data<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">getSize</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><ul><li>这两个 Test 都会在 setup 之后执行（换句话说，每次测试都会 setup 一次）</li> <li><code>assertEquals</code>断言会在为假时报告测试 failed</li></ul> <p>测试查询</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@AfterEach</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">search</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">TreeNode</span><span class="token punctuation">&gt;</span></span> result <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">int</span> loop <span class="token operator">=</span> <span class="token number">10</span><span class="token punctuation">;</span>
    <span class="token keyword">long</span> s <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">currentTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span> i <span class="token operator">&lt;=</span> loop<span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span> result<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token constant">TREE</span><span class="token punctuation">.</span><span class="token function">search</span><span class="token punctuation">(</span>data<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token number">490</span><span class="token operator">*</span>i<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">long</span> e <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">currentTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token punctuation">(</span>e<span class="token operator">-</span>s<span class="token punctuation">)</span> <span class="token operator">/</span> loop<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">assertEquals</span><span class="token punctuation">(</span>loop<span class="token punctuation">,</span> result<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一定是先构建再查询，所以查询操作会在<code>@Test</code>构建逻辑之后，使用<code>@AfterEach</code>注解</p> <p>执行一次<code>@Test build</code>，将会依次执行以下函数完成本次测试</p> <div class="language- extra-class"><pre class="language-text"><code>setup() → build() → search()
</code></pre></div><p>当然了，对于非 Spring 管理的类测试，直接在 setup 函数中进行手动的初始化即可，Junit 的流程一致</p> <h2 id="接口测试与抓包"><a href="#接口测试与抓包" class="header-anchor">#</a> 接口测试与抓包</h2> <p>快速熟悉一个项目流程</p> <ol><li>配置环境把项目跑起来</li> <li>浏览器直接打开控制台点击按钮监控网络请求，看打的什么接口</li> <li>在对应项目的 route 中找到接口，一层层向下看接口实现逻辑</li></ol> <p>这和审计的思路是一致的</p> <h3 id="postman-curl-测试"><a href="#postman-curl-测试" class="header-anchor">#</a> Postman cURL 测试</h3> <p>HTTP 接口测试，模拟前端表单提交</p> <blockquote><p>Postman 是一款功能强大的 API 开发与测试工具，支持 REST、SOAP、GraphQL 等协议调试</p></blockquote> <p>下载安装</p> <ul><li><a href="https://www.postman.com/downloads/" target="_blank" rel="nofollow noopener noreferrer">Download Postman | Get Started for Free<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.cnblogs.com/-lhl/articles/18663600" target="_blank" rel="nofollow noopener noreferrer">Postman 使用教程：从基础到高级 - 测试小萌新一枚 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>对常规的 HTTP 接口进行测试，基本流程</p> <ol><li>浏览器控制台，右键复制 cURL，通过 postman 导入请求</li> <li>控制台复制请求 cookie，header 里添加 cookie 字段，打请求测试</li></ol> <p>其实我突然意识到，BurpSuite 可以完全取代这一功能，把包直接抓住，然后重放就可以了</p> <p>一次抓包请求实战，现有功能支持上传 docx 文档而后生成 PPT，这一过程涉及文档的上传解析，存储到 Bos，而后 chat 流式接口请求生成 PPT 的 mcp 工具，mcp 工具根据 queryID 查出涉及的文档 fileID，从 Bos 中读出数据，调用下层策略接口实现 PPT 生成</p> <ol><li>文件上传并存储</li> <li>文件解析并存储</li> <li>生成 PPT</li></ol> <p>而我现在需要测试一个新的格式文档 .mm 的生成 PPT 的效果，这里请前端提供了一个半成品的接口，仅支持文件上传的功能，于是我们在页面上传本地的 .mm 文件，在控制台中监控网络搜索 file，发现有一个 pccompletefile 请求，返回</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;status&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token property">&quot;msg&quot;</span><span class="token operator">:</span> <span class="token null keyword">null</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
		<span class="token property">&quot;doc_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;xxx&quot;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这个 doc_id 正是我们所需的文件源格式，接口实现了文件的上传存储，并返回 bos 中对应的 doc_id</p> <p>而后是文件的解析和存储，这里需要用到一个 filecreate 接口，是从正常的 docx 生成 PPT 的流程中抓到的包</p> <p>将其 copy cURL 到 Postman，替换掉其中的 docID 字段为刚刚上传的 .mm 文件，并且复制浏览器的 cookie 到 header 里，发送请求，成功返回</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;status&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token property">&quot;msg&quot;</span><span class="token operator">:</span> <span class="token string">&quot;success&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;sLogin&quot;</span><span class="token operator">:</span> <span class="token string">&quot;1505377885&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
		<span class="token property">&quot;files&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
         	<span class="token property">&quot;url&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;downloadUrl&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;imgUrl&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;fileId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;file-18023115633&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;fileName&quot;</span><span class="token operator">:</span> <span class="token string">&quot;安全技能树.mm&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>好，我们发现了一个关键的返回 fileId，这似乎是 chat 接口的关键入参，但变数来了，我抓了 chat 接口的请求，看他的入参，发现并没有这个字段</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;channel&quot;</span><span class="token operator">:</span> <span class="token string">&quot;wenku_pc_genflow_v2&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;messages&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
        <span class="token punctuation">{</span>
            <span class="token property">&quot;role&quot;</span><span class="token operator">:</span> <span class="token string">&quot;user&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;content&quot;</span><span class="token operator">:</span> <span class="token string">&quot;生成PPT&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token property">&quot;query_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;b1754a33292942323968011ca300a6c30c22f1b3&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;extra&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;disable_h5&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>
        <span class="token property">&quot;wanpanAuthStatus&quot;</span><span class="token operator">:</span> <span class="token number">1</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;chat_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;75cb06ead52fd15abe23482fb4daa58da2111c7a&quot;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>思路有点问题，于是我回头去看 filecreate 的入参</p> <div class="language-json extra-class"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;chatId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;75cb06ead52fd15abe23482fb4daa58da2111c7a&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;queryId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;b1754a33292942323968011ca300a6c30c22f1b3&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;files&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
        <span class="token punctuation">{</span>
            <span class="token property">&quot;docId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;522f9e4205f69e3143323968011ca300a6c3f60d&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;source&quot;</span><span class="token operator">:</span> <span class="token number">2</span><span class="token punctuation">,</span>
            <span class="token property">&quot;title&quot;</span><span class="token operator">:</span> <span class="token string">&quot;安全技能树&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token property">&quot;channel&quot;</span><span class="token operator">:</span> <span class="token string">&quot;wenku_pc_genflow_v2&quot;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>发现二者的共同之处只有 chatId 和 queryId，于是我意识到，后端一定是根据相同的 chatId 或者 queryId（最后证实是 queryId）来找同一个对话里涉及到的文档，那么问题就简单了</p> <p>我直接令 filecreate 和 chat 入参中的两个 id 一致，然后顺序打 filecreate 和 chat 接口，果然得到了想要的结果，后端正确解析了文档库里的 doc，并将其转化为 bdjson 存在 bos 里</p> <p>而后，生成 ppt 的 mcp 工具从 bos 里拿到了这份 bdjson 并根据内容生成了 PPT，完美的测试</p> <h3 id="burpsuite-抓包重放"><a href="#burpsuite-抓包重放" class="header-anchor">#</a> BurpSuite 抓包重放</h3> <blockquote><p>通过 BurpSuite 对网络请求进行抓包</p></blockquote> <p>Burp Suite Professional 是一套来自 PortSwigger，用于测试 web 安全性的高级工具集，从一个基本的拦截代理到尖端的 Burp 扫描器</p> <p>下载</p> <ul><li><a href="https://sysin.org/blog/burp-suite-pro-win/" target="_blank" rel="nofollow noopener noreferrer">Burp Suite Professional 2025.12 for Windows x64 - 领先的 Web 渗透测试软件 - sysin | SYStem INside | 软件与技术分享<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://portswigger.net/burp/communitydownload" target="_blank" rel="nofollow noopener noreferrer">Download Burp Suite Community Edition - PortSwigger<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>入门：<a href="https://www.cnblogs.com/xingzhifeng/p/18702715" target="_blank" rel="nofollow noopener noreferrer">BurpSuite 安装及使用实操 - 刑之风 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>BurpSuite 测试流程</p> <ol><li>设置端口代理</li> <li>抓包</li> <li>重放</li></ol> <p>基本思路：在 Burp 设置 Proxy 拦截，然后把浏览器/程序/应用写一个代理发到 Burp 的 Proxy 上，Burp 将作为一个中转站进行网络通信，这样就能对每个 HTTP 进行数据抓包</p> <p>首先在 Burp 的 Settings → Tools → Proxy 中设置代理<code>127.0.0.1:8080</code></p> <p>若是 Spring 程序，可以在启动类前设置代理</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">setProxy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;http.proxyHost&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;127.0.0.1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;http.proxyPort&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;8080&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;https.proxyHost&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;127.0.0.1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;https.proxyPort&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;8080&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">ProxyUtil</span><span class="token punctuation">.</span><span class="token function">setProxy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">AuditAiAgentApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>这样从 Spring 打出的所有网络请求都会走<code>127.0.0.1:8080</code>，从而被 Burp 捕捉</p> <p>其他代理设置</p> <ul><li>在浏览器中，通过 Zero Omega 同样可以设置这样的代理：选项 → 情景模式 → 新建情景模式（设置为<code>127.0.0.1:8080</code>）同默，而后启用即可，这样 Burp 就能捕捉到当前浏览器发出的所有 HTTP 请求</li> <li>本地应用代理设置：Proxifier</li></ul> <p>一些使用小技巧</p> <ul><li>Ctrl + R 重放请求 Repeater</li> <li>Intercept on 打开网络断电</li> <li>HTTP history 查看每一次请求包</li></ul> <h3 id="jmter-多线程压测"><a href="#jmter-多线程压测" class="header-anchor">#</a> Jmter 多线程压测</h3> <blockquote><p>Apache JMeter™ 是一个开源软件，它是一个 100% 纯 Java 应用程序，旨在测试功能行为和衡量性能，它最初是为测试 Web 应用程序而设计的，但后来已扩展到其他测试功能</p></blockquote> <p>参考</p> <ul><li><a href="https://blog.csdn.net/Zachyy/article/details/139717444" target="_blank" rel="nofollow noopener noreferrer">JMeter的基本使用与性能测试，完整入门篇保姆式教程-CSDN博客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.bilibili.com/video/BV18K25BBEk7?spm_id_from=333.788.videopod.episodes&amp;vd_source=757c95a458d7c9501de959636f126d0a&amp;p=4" target="_blank" rel="nofollow noopener noreferrer">4.辅助组件_哔哩哔哩 - bilibili<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>官网：<a href="https://jmeter.apache.org/index.html" target="_blank" rel="nofollow noopener noreferrer">Apache JMeter - Apache JMeter™<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>下载：<a href="https://jmeter.apache.org/download_jmeter.cgi" target="_blank" rel="nofollow noopener noreferrer">Apache JMeter - Download Apache JMeter<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>How do I do it?</p> <ul><li><a href="https://jmeter.apache.org/usermanual/index.html" target="_blank" rel="nofollow noopener noreferrer">使用 JMeter<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 来了解如何使用它</li> <li><a href="https://jmeter.apache.org/usermanual/component_reference.html" target="_blank" rel="nofollow noopener noreferrer">组件参考<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 以获取每个测试元素的详细信息</li> <li><a href="https://jmeter.apache.org/usermanual/functions.html" target="_blank" rel="nofollow noopener noreferrer">函数参考<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 以获取每个函数的详细信息和示例</li> <li><a href="https://jmeter.apache.org/usermanual/properties_reference.html" target="_blank" rel="nofollow noopener noreferrer">属性参考<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 以获取所有允许您自定义 JMeter 属性</li> <li><a href="https://jmeter.apache.org/api/index.html" target="_blank" rel="nofollow noopener noreferrer">Javadoc API 文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cwiki.apache.org/confluence/display/JMETER/JMeterFAQ" target="_blank" rel="nofollow noopener noreferrer">JMeter 常见问题解答（Wiki）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cwiki.apache.org/confluence/display/JMETER/Home" target="_blank" rel="nofollow noopener noreferrer">JMeter Wiki<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://jmeter.apache.org/building.html" target="_blank" rel="nofollow noopener noreferrer">构建 JMeter 和插件<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>核心组件</p> <ul><li>测试计划</li> <li>线程组</li> <li>取样器</li></ul> <p>辅助组件</p> <ul><li>监听器</li> <li>配置元件</li> <li>定时器：延迟取样器执行</li> <li>断言：判断取样器结果</li> <li>前置处理器：在取样器之前执行</li> <li>后置处理器：在取样器之后执行</li> <li>逻辑控制器：对取样器进行逻辑控制（条件、分支、循环、跳转）</li></ul> <p>接口测试：在<code>apache-jmeter-5.6.3\bin</code>目录下，找到 ApacheJmeter.jar 这个 jar，通过 java -jar 命令运行 GUI 界面</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-jar</span> ApacheJMeter.jar
</code></pre></div><p>新建测试计划：右键测试计划：<code>添加 → 线程（用户） → tearDown 线程组</code></p> <p>线程组的两个关键参数：右键线程组：<code>添加 → 取样器 → HTTP 请求</code>，线程数和循环次数，暂设为 1</p> <p>线程组定义如下</p> <img src="/assets/img/image-20251218165900166.6068c3c1.png"> <p>随便在 <a href="https://www.showapi.com/" target="_blank" rel="nofollow noopener noreferrer">万维易源<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 上找一个天气接口 <a href="https://www.showapi.com/apiGateway/view/9" target="_blank" rel="nofollow noopener noreferrer">天气预报 API 接口-万维易源<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，注册登录获取，从网页上可以得知其接口地址</p> <ul><li><code>https://route.showapi.com/9-2?appKey={your_appKey}</code></li></ul> <p>而后构造 JMeter 中的 HTTP 请求</p> <ul><li>将<code>route.showapi.com</code>作为 JMeter HTTP 请求的<code>服务器名称或IP</code>字段</li> <li>将路径<code>/9-2</code>作为<code>路径</code>字段</li> <li>端口号默认</li></ul> <p>添加 HTTP 请求参数，按照给定的接口格式，添加 appKey 字段和查询的城市</p> <ul><li><code>appKey: 922D56C4ea904CDEB35aB1d12C64A148</code></li> <li><code>area: 西安</code></li></ul> <p>HTTP 请求定义如下</p> <img src="/assets/img/image-20251218165816693.812ebe1e.png"> <p>定义完 HTTP 请求，为其添加一个监听器用以查看服务器的返回信息</p> <ul><li>右键 HTTP 请求：<code>添加 → 监听器 → 查看结果树</code></li></ul> <p>点击保存和运行，得到服务器的响应结果，在查看结果树中查看带小盾牌的 HTTP 请求</p> <img src="/assets/img/image-20251218165731451.ab021c37.png"> <p>可以在小盾牌上方按钮选择文本的展示格式如 JSON / Text 等</p> <p>性能测试</p> <ul><li>监听器 → 聚合报告</li> <li>通过修改线程组中的线程数和循环次数来对接口进行压测</li></ul> <h2 id="swagger-接口文档"><a href="#swagger-接口文档" class="header-anchor">#</a> Swagger 接口文档</h2> <h3 id="swagger"><a href="#swagger" class="header-anchor">#</a> Swagger</h3> <p>Swagger 是一款由 <em>SmartBear Software</em> 提供的致力于解决接口规范化、标准化、文档化的开源库，可以根据 resutful 风格生成接口开发文档，并且支持做测试的一款中间软件</p> <p>Swagger 采用全注解方式侵入代码，后端定义好接口后，能够自动生成文档、接口功能和参数，并且提供接口测试的网页 UI</p> <p>Maven 依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token comment">&lt;!--引入swagger--&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>io.springfox<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>springfox-swagger2<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2.7.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>io.springfox<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>springfox-swagger-ui<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2.7.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>在 Spring 中，注入 Swaager 的配置依赖</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token annotation punctuation">@EnableSwagger2</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">SwaggerConfig</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">Docket</span> <span class="token function">productApi</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">Docket</span><span class="token punctuation">(</span><span class="token class-name">DocumentationType</span><span class="token punctuation">.</span><span class="token constant">SWAGGER_2</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">select</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">apis</span><span class="token punctuation">(</span><span class="token class-name">RequestHandlerSelectors</span><span class="token punctuation">.</span><span class="token function">withMethodAnnotation</span><span class="token punctuation">(</span><span class="token class-name">ApiOperation</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span>  <span class="token comment">//添加ApiOperiation注解的被扫描</span>
                <span class="token punctuation">.</span><span class="token function">paths</span><span class="token punctuation">(</span><span class="token class-name">PathSelectors</span><span class="token punctuation">.</span><span class="token function">any</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">ResultModel</span> <span class="token function">getFilmById</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>

        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token class-name">Objects</span><span class="token punctuation">.</span><span class="token function">isNull</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getLessParamResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token class-name">Film</span> film <span class="token operator">=</span> filmService<span class="token punctuation">.</span><span class="token function">getFilmById</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token class-name">Objects</span><span class="token punctuation">.</span><span class="token function">nonNull</span><span class="token punctuation">(</span>film<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">ResultModel</span><span class="token punctuation">(</span>film<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getErrorResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * 修改整个电影
     *
     * @param film
     * @return
     */</span>
    <span class="token annotation punctuation">@PostMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/insertFilm&quot;</span><span class="token punctuation">)</span>
    <span class="token annotation punctuation">@ApiOperation</span><span class="token punctuation">(</span><span class="token string">&quot;插入一部电影&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">ResultModel</span> <span class="token function">insertFilm</span><span class="token punctuation">(</span><span class="token annotation punctuation">@ApiParam</span><span class="token punctuation">(</span><span class="token string">&quot;电影实体对象&quot;</span><span class="token punctuation">)</span> <span class="token annotation punctuation">@RequestBody</span> <span class="token class-name">Film</span> film<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token class-name">Objects</span><span class="token punctuation">.</span><span class="token function">isNull</span><span class="token punctuation">(</span>film<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getLessParamResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token class-name">Boolean</span> isSuccess <span class="token operator">=</span> filmService<span class="token punctuation">.</span><span class="token function">insertFilm</span><span class="token punctuation">(</span>film<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span>isSuccess<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getSuccessResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getErrorResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>启动后，直接访问<code>localhost:8080/swagger-ui.html</code>就可以看到清晰的 API 测试界面</p> <p>一些需要注意的点</p> <ul><li>对于只有一个<code>HttpServletRequest</code>参数的方法，如果参数小于 5 个，推荐使用<code>@ApiImplicitParams</code>的方式单独封装每一个参数；如果参数大于 5 个，采用定义一个对象去封装所有参数的属性，然后使用<code>@APiParam</code>的方式</li> <li>默认的访问地址：<code>ip:port/swagger-ui.html#/</code>，但在 shiro 中会拦截所有的请求，必须加上默认访问路径（比如项目中，就是<code>ip:port/context/swagger-ui.html#/</code>），然后登陆后才可以看到</li> <li>在 GET 请求中，参数在 Body 体里面,不能使用<code>@RequestBody</code>；在 POST 请求，可以使用<code>@RequestBody</code>和<code>@RequestParam</code>，如果使用<code>@RequestBody</code>，对于参数转化的配置必须统一</li> <li>controller 必须指定请求类型 GET/POST，否则 swagger 会把所有的类型（6 种）都生成出来</li> <li>swagger 在生产环境不能对外暴露，可以使用<code>@Profile({&quot;dev&quot;, &quot;prod&quot;, &quot;pre&quot;})</code>指定可用的环境</li></ul> <h2 id="git-分支发布"><a href="#git-分支发布" class="header-anchor">#</a> Git 分支发布</h2> <h3 id="git-教程"><a href="#git-教程" class="header-anchor">#</a> Git 教程</h3> <blockquote><p><a href="https://www.liaoxuefeng.com/wiki/896043488029600" target="_blank" rel="nofollow noopener noreferrer">廖雪峰的文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <h4 id="绑定-ssh-密钥"><a href="#绑定-ssh-密钥" class="header-anchor">#</a> 绑定 ssh 密钥</h4> <p>命令行配置 git</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> user.name <span class="token string">&quot;northboat&quot;</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.email <span class="token string">&quot;northboat@163.com&quot;</span>
</code></pre></div><p>生成 ssh 密匙</p> <div class="language-bash extra-class"><pre class="language-bash"><code>ssh-keygen <span class="token parameter variable">-t</span> rsa <span class="token parameter variable">-C</span> <span class="token string">&quot;northboat@163.com&quot;</span>
</code></pre></div><p>找到对应路径下的 id_rsa.pub，将公钥和对应的 Git 仓库绑定即可</p> <h4 id="常见报错码"><a href="#常见报错码" class="header-anchor">#</a> 常见报错码</h4> <p>报错码 10056：一般是这是因为服务器的 SSL 证书没有经过第三方机构的签署，所以才报错，使用以下命令接触 ssl 验证后再次 git 即可解决</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> http.sslVerify <span class="token string">&quot;false&quot;</span>
</code></pre></div><p>port 443 timed out：卡了</p> <p>broken pipe：文件过大导致，git 默认文件大小小于等于 100MB，可修改缓存大小为 500MB 强行上传（不建议把 git 仓库当网盘）</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token function">git</span> config http.postBuffer <span class="token number">52428800</span> 
</code></pre></div><h4 id="提交描述规范"><a href="#提交描述规范" class="header-anchor">#</a> 提交描述规范</h4> <p>在提交代码时输入清晰的说明有利于版本管理，建议搭配如下关键字编写提交描述</p> <div class="language- extra-class"><pre class="language-text"><code># 新建(add)
# 删除(rm)
# 更新(update)
# 改动(change)
# 实现(feat)
# 发布(publish)
# 修复(fix)
...
</code></pre></div><p>当然，企业开发会有自己的一套规范，例如 icafe 卡片 id 加本次需求改动</p> <h4 id="分支冲突与合并"><a href="#分支冲突与合并" class="header-anchor">#</a> 分支冲突与合并</h4> <p>开发分支拉取主分支更新，这里需要解决拉取的主分支和本地分支冲突（如果有的话）</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> checkout main
<span class="token function">git</span> pull
<span class="token function">git</span> checkout NorthBoat
<span class="token function">git</span> merge main <span class="token comment"># 把 main 合并到当前 NorthBoat 分支，main 可省略，默认为主分支</span>
<span class="token function">git</span> push <span class="token comment"># 更新当前分支</span>
</code></pre></div><p>主分支合并开发分支</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> checkout main
<span class="token function">git</span> merge NorthBoat <span class="token comment"># 主分支合并 NorthBoat 分支</span>
<span class="token function">git</span> push <span class="token comment"># 更新主分支</span>
<span class="token function">git</span> checkout NorthBoat <span class="token comment"># 返回原分支</span>
</code></pre></div><h4 id="版本回退"><a href="#版本回退" class="header-anchor">#</a> 版本回退</h4> <p>撤销<code>git add .</code></p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> reset <span class="token builtin class-name">.</span>
</code></pre></div><p>回退到上一个版本并保存当前版本</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> stash

<span class="token comment"># 查看保存的版本</span>
<span class="token function">git</span> stash list
<span class="token comment"># 恢复到上个版本并删除上个版本保存</span>
<span class="token function">git</span> stash pop
<span class="token comment"># 恢复到某个保存的某个版本</span>
<span class="token function">git</span> stash apply stash@<span class="token punctuation">{</span>版本id<span class="token punctuation">}</span>
</code></pre></div><p>撤销本地提交：HEAD 一定要大写</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 撤销上次commit，但不撤销add</span>
<span class="token function">git</span> reset <span class="token parameter variable">--soft</span> HEAD~1
<span class="token function">git</span> reset <span class="token parameter variable">--soft</span> HEAD~ <span class="token comment"># 二者等价</span>

<span class="token comment"># 撤销上次commit和add</span>
<span class="token function">git</span> reset HEAD~
</code></pre></div><p>本地版本回退</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 查看 commit_id</span>
<span class="token function">git</span> log

<span class="token comment"># 回到到前两个版本</span>
<span class="token function">git</span> reset <span class="token parameter variable">--hard</span> head~2
<span class="token comment"># 回到到指定版本</span>
<span class="token function">git</span> reset <span class="token parameter variable">--hard</span> commit_id
</code></pre></div><p>两个人推一个仓库，同时拉取 A 版本，第一个人修改后提交 B 版本并推送到远程仓库，此时第二个人并不知晓这次推送，在修改 A 版本为 C 版本后进行推送时，就会发生冲突，那么此时就需要进行上述的版本回退</p> <ol><li>将本地仓库回退到 A 版本</li> <li>git pull 拉取最新的 B 版本</li> <li>在 B 版本的基础上进行修改得到 C 版本</li> <li>提交推送，则远程仓库将完成 A → B → C 的更新</li></ol> <h4 id="添加-patch"><a href="#添加-patch" class="header-anchor">#</a> 添加 patch</h4> <p>一次推送有误，不想新建一次 commit 再次提交，可以使用<code>git commit --amend</code>将本次更新与上一次 commit 合并，即</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> <span class="token function">add</span> <span class="token builtin class-name">.</span>
<span class="token function">git</span> commit <span class="token parameter variable">--amend</span>
<span class="token function">git</span> push
</code></pre></div><p>这样远程仓库只会出现一次 commit，相当于给上一次 commit 打补丁</p> <h4 id="重置仓库"><a href="#重置仓库" class="header-anchor">#</a> 重置仓库</h4> <p>由于一个仅供展示、不需要追踪历史提交的 page 仓库每次 commit 需要大量的删除原有文件，导致 .git 文件膨胀很快，当 &gt;200MB 时需要这样的重置操作</p> <p>进入仓库目录</p> <div class="language- extra-class"><pre class="language-text"><code>cd northboat.github.io
</code></pre></div><p>删除 <code>.git</code></p> <div class="language- extra-class"><pre class="language-text"><code>rm -rf .git
</code></pre></div><p>重新初始化仓库</p> <div class="language- extra-class"><pre class="language-text"><code>git init
git branch -M main
git add .
git commit -m &quot;reset pages repository&quot;
</code></pre></div><p>重新关联远程仓库（覆盖式）</p> <div class="language- extra-class"><pre class="language-text"><code>git remote add origin https://github.com/northboat/northboat.github.io.git
git push -f origin main
</code></pre></div><p>这里用 <code>-f</code> 是完全合理的，因为就是要“历史清零”，这是 Pages 仓库的标准重置姿势</p> <ul><li>结果就是：<code>.git</code>体积变小几十 KB，其次所有历史提交全部清空，只剩下 1 次提交</li></ul> <h4 id="锁定-git-分支"><a href="#锁定-git-分支" class="header-anchor">#</a> 锁定 git 分支</h4> <p>进入 .git 目录，找到 hooks 子目录</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token builtin class-name">cd</span> .git/hooks
</code></pre></div><p>创建一个名为 ”pre-commit” 的文件，这是一个Git钩子脚本，用于在每次提交之前执行</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token function">touch</span> pre-commit
</code></pre></div><p>打开 &quot;pre-commit&quot; 文件，添加以下内容</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token shebang important">#!/bin/sh</span>

<span class="token comment"># 正确获取当前分支名称（原脚本缺少 $ 符号和反引号/括号包裹命令）</span>
<span class="token assign-left variable">current_branch</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token function">git</span> symbolic-ref HEAD <span class="token operator">|</span> <span class="token function">sed</span> <span class="token parameter variable">-e</span> <span class="token string">'s,.*/\(.*\),\1,'</span><span class="token variable">)</span></span>

<span class="token comment"># 锁定的分支名称（比如 master/main）</span>
<span class="token assign-left variable">LOCKED_BRANCH</span><span class="token operator">=</span><span class="token string">&quot;main&quot;</span>

<span class="token keyword">if</span> <span class="token punctuation">[</span> <span class="token string">&quot;<span class="token variable">$current_branch</span>&quot;</span> <span class="token operator">=</span> <span class="token string">&quot;<span class="token variable">$LOCKED_BRANCH</span>&quot;</span> <span class="token punctuation">]</span><span class="token punctuation">;</span> <span class="token keyword">then</span>
   <span class="token builtin class-name">echo</span> <span class="token string">&quot;错误：禁止直接向 <span class="token variable">$LOCKED_BRANCH</span> 分支提交代码！&quot;</span>
   <span class="token builtin class-name">echo</span> <span class="token string">&quot;请切换到功能分支开发，通过 PR/MR 合并。&quot;</span>
   <span class="token builtin class-name">exit</span> <span class="token number">1</span>  <span class="token comment"># 非 0 退出码会阻止 commit 执行</span>
<span class="token keyword">fi</span>

<span class="token builtin class-name">exit</span> <span class="token number">0</span>
</code></pre></div><p>以上脚本将锁定 Main 分支，在每次 add/commit 之前进行检查</p> <p>为 &quot;pre-commit&quot; 文件添加可执行权限</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token function">chmod</span> +x pre-commit
</code></pre></div><p>每当有人试图在被锁定的分支上进行提交时，&quot;pre-commit&quot; 钩子脚本将会检查当前分支名称：如果分支名称与你预先定义的名称不匹配，则会显示一条错误消息，并阻止提交</p> <p>此时 Main 分支只能通过 PR/MR 合并进行更新，无法直接 git commit 更新</p> <h3 id="git-分支开发测试流程"><a href="#git-分支开发测试流程" class="header-anchor">#</a> Git 分支开发测试流程</h3> <p>养成需求分析 - 方案设计 - 开发测试 - 迭代优化的工作思维</p> <ul><li>主仓库维护 master/dev/test 分支和各类 release/customer 分支</li> <li>每个 developer 自己 fork 仓库 checkout 自己的 feature 分支，开发完需求后，再 merge 到主仓库的分支</li> <li>merge 时，提 merge 单，由相关同事或主管 cr 代码，给出评审意见，cr 全部 approve 后，由 owner 合并</li></ul> <p>以百度的一次分支开发推送为例：我现有仓库 function 的分支创建权限，我以需求 ID 为分支名，以 master 为源分支创建我的开发分支 wk-web-61949</p> <p>以开发分支创建代码空间，并在改分支上进行修改，修改完成后，把改动推送到分支</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> <span class="token function">add</span> <span class="token builtin class-name">.</span>
<span class="token function">git</span> commit <span class="token parameter variable">-m</span> <span class="token string">&quot;wk-web-61949 支持思维导图生成 PPT&quot;</span>
<span class="token function">git</span> push origin HEAD:refs/for/wk-web-61949 <span class="token comment"># 推送评审</span>
</code></pre></div><p>而后会自动触发评审 CR，需要一个上级进行 +2，我才能彻底将改动更新到远程仓库中我的分支</p> <p>而后所有的提测都会在这个开发分支上进行，当联调通过后，则合入 master 分支，完成一次上线，也就是说，真正的需求迭代通过 master 合并开发分支实现，这就是所谓的分支发布</p> <p>当 commit 了一次，还想要修改，但不改变 commit，可以使用 <code>git commit --amend</code></p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> commit <span class="token parameter variable">--amend</span>
</code></pre></div><p>自己的库，如果让 master 合并开发分支，可以使用以下命令</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">git</span> checkout master
<span class="token function">git</span> merge feature_print_my_name_on_demo_app
<span class="token comment"># ... 解决冲突</span>
<span class="token comment"># 更新主分支</span>
<span class="token function">git</span> push origin HEAD:refs/for/master
