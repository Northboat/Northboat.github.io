Z3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">关系数据库<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="关系型数据库-mysql"><a href="#关系型数据库-mysql" class="header-anchor">#</a> 关系型数据库 MySQL</h2> <h3 id="安装及初始化"><a href="#安装及初始化" class="header-anchor">#</a> 安装及初始化</h3> <p>Windos 下安装并初始化</p> <ol><li>登录 mysql 官网，点击侧边栏：download，选择对应版本的压缩包下载到本地并解压</li> <li>在 bin 目录下初始化 mysql：<code>mysqld --initialize</code></li> <li>启动 mysql 服务器：<code>net start mysql</code></li> <li>确认用户身份：<code>mysqladmin -u root -p password</code> → 在初始化后，在 bin 的同级目录下会自动生成一个 data 目录，在 data 目录中的<code>DESKTOP-VCLA78O.err</code>文件中含有系统随机分配的初始密码，此时输入初始密码，再输入新密码，此时你的 mysql 算初始化完成</li> <li>停止 mysql 服务器：net stop mysql</li></ol> <p>linux 启动/重启 mysql</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">service</span> mysqld start
<span class="token function">service</span> mysqld restart
<span class="token function">service</span> mysql restart <span class="token comment"># 某些版本</span>
</code></pre></div><p>启动命令行客户端：<code>mysql -u root -p</code></p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token comment">#本地机</span>
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>

<span class="token comment">#远端机</span>
mysql <span class="token parameter variable">-h</span> <span class="token function">ip</span> <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>

<span class="token comment">#再输入密码即可登录命令行客户端</span>
</code></pre></div><p>Manjaro 中安装并配置</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> mysql

mysqld <span class="token parameter variable">--initialize</span> <span class="token parameter variable">--user</span><span class="token operator">=</span>mysql <span class="token parameter variable">--basedir</span><span class="token operator">=</span>/usr <span class="token parameter variable">--datadir</span><span class="token operator">=</span>/var/lib/mysql
<span class="token comment"># 设置开机启动MySQL服务</span>
systemctl <span class="token builtin class-name">enable</span> mysqld.service
systemctl daemon-reload
systemctl start mysqld.service

mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
mysql<span class="token operator">&gt;</span> ALTER <span class="token environment constant">USER</span> <span class="token string">'root'</span>@<span class="token string">'localhost'</span> IDENTIFIED WITH mysql_native_password BY <span class="token string">'新密码'</span><span class="token punctuation">;</span>
</code></pre></div><p>可视化工具</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> mysql-workbench
</code></pre></div><h3 id="数据库操作和数据表引擎"><a href="#数据库操作和数据表引擎" class="header-anchor">#</a> 数据库操作和数据表引擎</h3> <h4 id="数据库操作"><a href="#数据库操作" class="header-anchor">#</a> 数据库操作</h4> <p>创建数据库：<code>create database database_name;</code></p> <div class="language-sql extra-class"><pre class="language-sql"><code>mysql<span class="token operator">&gt;</span> <span class="token keyword">create</span> <span class="token keyword">database</span> Book<span class="token punctuation">;</span>

Query OK<span class="token punctuation">,</span> <span class="token number">1</span> <span class="token keyword">row</span> affected <span class="token punctuation">(</span><span class="token number">0.01</span> sec<span class="token punctuation">)</span>xxxxxxxxxx creat <span class="token keyword">database</span> Book<span class="token punctuation">;</span>mysql<span class="token operator">&gt;</span> <span class="token keyword">create</span> <span class="token keyword">database</span> Book<span class="token punctuation">;</span>Query OK<span class="token punctuation">,</span> <span class="token number">1</span> <span class="token keyword">row</span> affected <span class="token punctuation">(</span><span class="token number">0.01</span> sec<span class="token punctuation">)</span>
</code></pre></div><p>删库</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">database</span> <span class="token operator">is</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

<span class="token keyword">show</span> <span class="token keyword">create</span> <span class="token keyword">database</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span> <span class="token comment">#显示创建school的sql语句</span>

<span class="token keyword">use</span> school<span class="token punctuation">;</span>

<span class="token keyword">drop</span> <span class="token keyword">database</span> <span class="token keyword">if</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span>
</code></pre></div><h4 id="数据表操作"><a href="#数据表操作" class="header-anchor">#</a> 数据表操作</h4> <p>建表</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token comment"># 进入数据库</span>
mysql<span class="token operator">&gt;</span> <span class="token keyword">use</span> Book
<span class="token keyword">Database</span> changed

<span class="token comment"># 建表</span>
mysql<span class="token operator">&gt;</span> <span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> bookList<span class="token punctuation">(</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> ISBN <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span> <span class="token punctuation">,</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token keyword">CHARACTER</span> <span class="token keyword">SET</span> gb2312<span class="token punctuation">,</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> price <span class="token keyword">float</span><span class="token punctuation">,</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> chubanDate <span class="token keyword">date</span><span class="token punctuation">,</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> <span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>ISBN<span class="token punctuation">)</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> <span class="token punctuation">)</span><span class="token punctuation">;</span>
Query OK<span class="token punctuation">,</span> <span class="token number">0</span> <span class="token keyword">rows</span> affected <span class="token punctuation">(</span><span class="token number">0.02</span> sec<span class="token punctuation">)</span>
</code></pre></div><p>列属性</p> <ol><li><code>unsigned</code>：无符号整数，该数据必不为负</li> <li><code>zerofill</code>：0 填充，十位数将从前往后填充<code>0</code>，如<code>312 ——&gt; 0000000312</code></li> <li><code>auto_increment</code>：自增，可自定义设置起始值和步长</li> <li><code>not null</code>：非空，默认为可空</li> <li><code>default</code>：设置默认值</li> <li><code>comment</code>：解释</li></ol> <p>查看数据表</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
	<span class="token identifier"><span class="token punctuation">`</span>id<span class="token punctuation">`</span></span> <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span> <span class="token keyword">auto_increment</span> <span class="token keyword">comment</span> <span class="token string">'学号'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>name<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">30</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span> <span class="token keyword">default</span> <span class="token string">'匿名'</span> <span class="token keyword">comment</span> <span class="token string">'姓名'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>birthday<span class="token punctuation">`</span></span> <span class="token keyword">datetime</span> <span class="token keyword">default</span> <span class="token boolean">null</span> <span class="token keyword">comment</span> <span class="token string">'出生日期'</span><span class="token punctuation">,</span>
    <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>id<span class="token punctuation">`</span></span><span class="token punctuation">)</span> <span class="token comment">#设置主键，莫忘辽</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>

<span class="token keyword">show</span> <span class="token keyword">tables</span><span class="token punctuation">;</span>

<span class="token keyword">show</span> <span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

<span class="token comment">#展示表列属性信息</span>
<span class="token keyword">desc</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">;</span>
</code></pre></div><p>修改表属性</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token comment">#修改表名</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span> <span class="token keyword">rename</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span><span class="token punctuation">;</span>
<span class="token comment">#增加字段</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span> <span class="token keyword">add</span> <span class="token identifier"><span class="token punctuation">`</span>age<span class="token punctuation">`</span></span> <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">11</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span>

<span class="token comment">#修改表的字段</span>
<span class="token comment">#1、重命名，同时修改约束，不加int(4)会报错</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span> change <span class="token identifier"><span class="token punctuation">`</span>age<span class="token punctuation">`</span></span> <span class="token identifier"><span class="token punctuation">`</span>age1<span class="token punctuation">`</span></span> <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">#2、修改约束，modify只能修改约束</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span> <span class="token keyword">modify</span> <span class="token identifier"><span class="token punctuation">`</span>age<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">9</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">#删除表的字段</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span> <span class="token keyword">drop</span> <span class="token identifier"><span class="token punctuation">`</span>age1<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

<span class="token comment">#删除表</span>
<span class="token keyword">drop</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span>
</code></pre></div><p>注意：所有删除创建操作尽量加上判断语句，避免误操作</p> <p>添加、更新、查询数据</p> <div class="language-sql extra-class"><pre class="language-sql"><code>mysql<span class="token operator">&gt;</span> <span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> bookList<span class="token punctuation">;</span>
Empty <span class="token keyword">set</span> <span class="token punctuation">(</span><span class="token number">0.01</span> sec<span class="token punctuation">)</span>

mysql<span class="token operator">&gt;</span> <span class="token keyword">insert</span> <span class="token keyword">into</span> bookList <span class="token keyword">values</span><span class="token punctuation">(</span><span class="token string">'7-302-01465-5'</span><span class="token punctuation">,</span><span class="token string">'高等数学'</span><span class="token punctuation">,</span><span class="token number">28.27</span><span class="token punctuation">,</span><span class="token string">'2020-12-10'</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
Query OK<span class="token punctuation">,</span> <span class="token number">1</span> <span class="token keyword">row</span> affected <span class="token punctuation">(</span><span class="token number">0.00</span> sec<span class="token punctuation">)</span>

mysql<span class="token operator">&gt;</span> <span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> bookList<span class="token punctuation">;</span>
<span class="token operator">+</span><span class="token comment">---------------+----------+-------+------------+</span>
<span class="token operator">|</span> ISBN          <span class="token operator">|</span> name     <span class="token operator">|</span> price <span class="token operator">|</span> chubanDate <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">---------------+----------+-------+------------+</span>
<span class="token operator">|</span> <span class="token number">7</span><span class="token operator">-</span><span class="token number">302</span><span class="token operator">-</span><span class="token number">01465</span><span class="token operator">-</span><span class="token number">5</span> <span class="token operator">|</span> 高等数学 <span class="token operator">|</span> <span class="token number">28.27</span> <span class="token operator">|</span> <span class="token number">2020</span><span class="token operator">-</span><span class="token number">12</span><span class="token operator">-</span><span class="token number">10</span> <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">---------------+----------+-------+------------+</span>
<span class="token number">1</span> <span class="token keyword">row</span> <span class="token operator">in</span> <span class="token keyword">set</span> <span class="token punctuation">(</span><span class="token number">0.00</span> sec<span class="token punctuation">)</span>
</code></pre></div><p>导入 .sql 文件中的 SQL 语句：<code>sourse + 文件路径</code></p> <p>删除数据库或表</p> <ol><li><code>drop database + 库名;</code></li> <li><code>drop table + 表名;</code></li></ol> <p>图形界面管理</p> <ul><li>SQLyog</li> <li>IDEA 自带的数据库管理</li> <li>DataGrip</li></ul> <h4 id="数据表引擎"><a href="#数据表引擎" class="header-anchor">#</a> 数据表引擎</h4> <table><thead><tr><th>区别</th> <th>MyISAM</th> <th>InnoDB</th></tr></thead> <tbody><tr><td>事务支持</td> <td>不支持</td> <td>支持</td></tr> <tr><td>外键约束</td> <td>不支持</td> <td>支持</td></tr> <tr><td>全文索引</td> <td>支持</td> <td>不支持</td></tr> <tr><td>数据行锁定</td> <td>不支持</td> <td>支持</td></tr> <tr><td>表空间大小</td> <td>较小</td> <td>较大，约为前者两倍</td></tr></tbody></table> <p>简单来说</p> <ul><li>MyISAM 更轻便（节约空间）、更快</li> <li>InnoDB 安全性高，支持事务处理，支持多表多用户操作（外键、多行同时操作），功能更丰富</li></ul> <p>数据库的本质仍是文件存储，储存在 data 文件夹下，一个文件夹对应一个数据库</p> <p>MySQL 引擎在物理文件上的区别</p> <ul><li>InnoDB 中数据库表中只有一个<code>*.frm</code>以及上级目录下的<code>ibdata1</code>文件</li> <li>MyISAM 对应的文件
<ul><li>*.frm 表结构的定义文件</li> <li>*.MYD 数据文件（data）</li> <li>*.MYI 索引文件</li></ul></li></ul> <p>表默认的字符集编码并不支持中文，要手动设置</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">default</span> <span class="token keyword">charset</span><span class="token operator">=</span>utf8
</code></pre></div><h3 id="orm-框架"><a href="#orm-框架" class="header-anchor">#</a> ORM 框架</h3> <p>ORM（Object-Relational Mapping），对象关系映射框架，用对象映射关系代替 SQL 语句编写</p> <p>详见 <a href="https://northboat.github.io/pages/2d1368/#spring-date" target="_blank" rel="nofollow noopener noreferrer">Spring Boot 基础 - Spring Data | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="主键、联合主键、外键和回表"><a href="#主键、联合主键、外键和回表" class="header-anchor">#</a> 主键、联合主键、外键和回表</h3> <h4 id="b-树"><a href="#b-树" class="header-anchor">#</a> B+ 树</h4> <p>什么是 B 树</p> <ol><li>叶子节点具有相同深度，叶节点指针为空</li> <li>索引元素不重复</li> <li>节点中数据索引从左到右递增</li></ol> <p>一个简单的 B 树</p> <img src="/assets/img/1176659-20190124170518912-630934803.8182c82f.png"> <p>而 B+ 树，就是在 B 树叶子节点间建立一条横向链路 ，使叶子节点的查找效率压缩到 O(n)，一条链表向后查；在 MySQL 中，不管是聚集索引还是普通索引，都以 B+ 树为底层的存储数据结构，在 MySQL 中，索引 == B+ 树</p> <h4 id="聚集索引"><a href="#聚集索引" class="header-anchor">#</a> 聚集索引</h4> <p>而在 InnoDB 里，每个数据表必须要有且只有一个聚集索引（主键索引），其规则如下</p> <ol><li>如果定义了主键 PK，则 PK 是聚集索引</li> <li>若未定义主键，则第一个非空唯一索引将默认作为聚集索引</li> <li>若既无主键，也无非空唯一字段，则 InnoDB 会创建一个隐藏的 row-id 作为聚集索引</li></ol> <p>例如下面这张表</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
    id <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span> 
    name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">16</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    role <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">index</span> <span class="token punctuation">(</span>name<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>
</code></pre></div><p>id 这一字段作为聚集索引，而 name 字段作为一个普通索引</p> <h4 id="联合主键"><a href="#联合主键" class="header-anchor">#</a> 联合主键</h4> <p>以判题记录为例，设置一个用户 ID + 题目 ID 的联合主键</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    userId <span class="token keyword">INT</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">INT</span><span class="token punctuation">,</span>
    state <span class="token keyword">INT</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>联合主键遵循“最左前缀原则”，例如这里的主键是</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>studentID<span class="token punctuation">,</span> courseID<span class="token punctuation">)</span>
</code></pre></div><p>那么主键索引可用情况为</p> <table><thead><tr><th>查询条件</th> <th>是否走索引</th></tr></thead> <tbody><tr><td>studentID = 1</td> <td>是</td></tr> <tr><td>studentID = 1 AND courseID = 2</td> <td>是</td></tr> <tr><td>courseID = 2</td> <td>否</td></tr></tbody></table> <p>这点在设计阶段必须想清楚，否则索引等于白建</p> <p>并且，如果以 userId 和 questionId 为主键，那么对于每个用户而言，每个题目的判题记录将会是唯一的，这实际上严重不符合业务逻辑</p> <p>所以，正确的判题记录表应该是</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>用一个判题记录 id 作为主键（仅作为记录的行数记录），然后为 userId 和 questionId 建立索引以满足根据用户查记录和根据题目查记录的业务需求，这样的普通索引会导致回表问题</p> <h4 id="索引最左匹配原则"><a href="#索引最左匹配原则" class="header-anchor">#</a> 索引最左匹配原则</h4> <blockquote><p>什么是最左匹配原则，底层数据结构原理是什么？</p></blockquote> <p>索引最左匹配原则</p> <ul><li>在使用联合索引查询时，数据库会优先匹配索引的<strong>最左侧字段</strong>，并依次向右匹配</li> <li>如果左侧字段不参与查询条件（或无法被索引匹配），那么右侧字段将无法使用该联合索引，会退化为全表扫描或部分索引扫描</li></ul> <p>例如联合索引</p> <div class="language-sql extra-class"><pre class="language-sql"><code>idx<span class="token punctuation">(</span>a<span class="token punctuation">,</span> b<span class="token punctuation">,</span> c<span class="token punctuation">)</span>
</code></pre></div><p>B+ 树的排序优先级为：<strong>先按<code>a</code>字段排序 → 再按<code>b</code>字段排序 → 最后按<code>c</code>字段排序</strong></p> <p>这是导致最左匹配原则的底层原理，这意味着</p> <ul><li>若查询条件包含<code>a</code>，可以快速定位到<code>a</code>对应的子树，再在子树中匹配<code>b</code>，以此类推</li> <li>若查询条件不包含<code>a</code>，B+ 树无法确定起始遍历位置，只能全表扫描，无法利用<code>b, c</code>字段的索引</li></ul> <p>也就是说，如果是多个联合索引，一定要满足“左侧”的搜索条件，“右侧”的索引才会生效</p> <p>具体而言，其联合索引<code>idx(a,b,c)</code>索引的可用情况为</p> <table><thead><tr><th>情况</th> <th>查询条件</th> <th>是否走索引</th></tr></thead> <tbody><tr><td>1</td> <td>a = 1</td> <td>是</td></tr> <tr><td>2</td> <td>a = 1 and b = 2</td> <td>是</td></tr> <tr><td>3</td> <td>a = 1 and b = 2 and c = 3</td> <td>是</td></tr> <tr><td>4</td> <td>b = 2 and c = 3</td> <td>否</td></tr> <tr><td>5</td> <td>a = 1 and c = 3</td> <td>否</td></tr></tbody></table> <p>注意</p> <ul><li>在情况 4 中：因为最左条件没有，所以从一开始就不会走索引，会直接全表扫描<code>b = 2 and c = 3</code>的数据行</li> <li>而在情况 5 中：最左条件<code>a = 1</code>存在，所以会先走一遍索引，筛选出<code>a = 1</code>的记录，而后因为此时的最左索引<code>b</code>条件不存在，所以不会继续索引匹配，而是直接回表逐行过滤<code>c = 3</code>的情况（暴力过滤）</li></ul> <h4 id="外键"><a href="#外键" class="header-anchor">#</a> 外键</h4> <p>使用外键</p> <ul><li>优点：由数据库自身保证数据的一致性和完整性，比程序更可靠，增加 ER 图的可读性，帮助理解数据库设计</li> <li>缺点：增加开发难度，使数据管理变得复杂，影响性能，特别是在处理大量数据时</li></ul> <p>例如，将用户表 user 与判题记录表通过 userId 这一外键关联</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
    id <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span> 
    name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">16</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    role <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">index</span> <span class="token punctuation">(</span>name<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>

<span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">FOREIGN</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>userId<span class="token punctuation">)</span> <span class="token keyword">REFERENCES</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>
</code></pre></div><p>这样，record 这张表的 userId 将依赖于 user 表的 id 字段，也就是说，每一个在 record 中出现的记录，其 userId 必然是 user 中的某一个已存在的值，那么</p> <ul><li>在删除 user 表中某一个用户时，数据库会先把 record 中所有外键依赖了这个用户的所有记录先删除，再会从主表中删除用户</li> <li>从表 record 不会出现“永陵数据”，每个 userId 都一定是 user 中存在的</li></ul> <p>外键的本质是：是数据一致性约束，而不是查询机制</p> <h4 id="回表查询"><a href="#回表查询" class="header-anchor">#</a> 回表查询</h4> <p>但在现实场景中，基本上不用外键约束，这极大的增大了数据库设计的复杂度和耦合度，一般情况会设置一个逻辑外键，即不写<code>Foreign key</code>，但作为外键逻辑使用</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>这里虽然没有令 userId 为外键，但为其建立了一个普通索引，我可以直接根据 userId 去查询记录</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span> state <span class="token keyword">from</span> record <span class="token keyword">where</span> userId <span class="token operator">=</span> <span class="token string">&quot;202012143&quot;</span><span class="token punctuation">;</span>
</code></pre></div><p>这样会先根据 idx_user 索引找到 userId 为 202012143 的 B+ 树叶子节点，获取这条数据的聚集索引 recordId，然后根据 recordId 查主键索引，找到对应记录的 state，这就是所谓的回表查询</p> <p>在普通索引（非主键索引）中：B+ 树叶子节点存的是「索引列值 + 主键值」</p> <p>假设我在 record 表中插入这样一条数据</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">INSERT</span> <span class="token keyword">INTO</span> record<span class="token punctuation">(</span>recordId<span class="token punctuation">,</span> userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">,</span> <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span><span class="token punctuation">)</span> <span class="token keyword">VALUES</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">202012143</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;通过&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>然后我要查询 userId 字段为 202012143 的数据行</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> record <span class="token keyword">where</span> userId <span class="token operator">=</span> <span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre></div><p>这段查询</p> <ol><li>会先走普通索引，找到记录了 userId 为 202012143 的叶子节点后，拿到其对应的 recordId 主键索引值，例如这里为 1</li> <li>然后再根据聚集索引 1 去找到这条完整的数据</li></ol> <p>在整个流程中，存在先找普通索引，再找聚集索引的过程，实际上查了两次表，这第二次查表，就是所谓的回表查询</p> <ul><li>这样的查询会大幅拖慢查询速度，所以在在大表 + 高频查询场景中要谨慎设计普通索引</li></ul> <p>也就是说，用户想找自己做了哪些题，仅仅为 userId 做一个普通索引，是一定会导致回表的</p> <h3 id="联合索引、覆盖索引和索引下推"><a href="#联合索引、覆盖索引和索引下推" class="header-anchor">#</a> 联合索引、覆盖索引和索引下推</h3> <p>如何解决回表，就不得不提到我们的覆盖索引，详见业务场景 <a href="https://northboat.github.io/pages/2bb10d/#%E5%88%A4%E9%A2%98%E8%AE%B0%E5%BD%95%E8%81%94%E5%90%88%E8%A6%86%E7%9B%96%E7%B4%A2%E5%BC%95" target="_blank" rel="nofollow noopener noreferrer">判题记录联合覆盖索引 - OJ 系统优化 - 效率与安全 | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="mvcc-多版本并发控制"><a href="#mvcc-多版本并发控制" class="header-anchor">#</a> MVCC 多版本并发控制</h3> <p>MVCC（Multi-Version Concurrency Control），多版本并发控制，是MySQL中被广泛采用的并发控制机制，它通过版本管理（维护多个版本快照）让读写互不阻塞，并实现事务的隔离</p> <p>核心机制：用<strong>版本快照</strong>替代锁阻塞，依赖 3 个关键组件，事务版本号、数据版本链和 Read View（读视图）</p> <p>事务版本号</p> <ul><li>数据库会为每个事务分配一个唯一递增的事务 ID（<code>transaction_id</code>），事务开始时生成</li> <li>数据的每次修改（INSERT/UPDATE/DELETE） 都会生成一个新的数据版本，并更新当前事务 ID 为新版本号</li></ul> <p>数据版本链：以 InnoDB 为例，每行数据的物理存储包含 3 个隐藏字段</p> <table><thead><tr><th style="text-align:center;">隐藏字段</th> <th style="text-align:center;">作用</th></tr></thead> <tbody><tr><td style="text-align:center;"><code>DB_TRX_ID</code></td> <td style="text-align:center;">最后一次修改该数据的事务 ID</td></tr> <tr><td style="text-align:center;"><code>DB_ROLL_PTR</code></td> <td style="text-align:center;">回滚指针，指向该数据的<strong>上一个历史版本</strong></td></tr> <tr><td style="text-align:center;"><code>DB_ROW_ID</code></td> <td style="text-align:center;">行唯一标识（无主键时自动生成）</td></tr></tbody></table> <p>通过当前事务 ID 和回滚指针能够轻松定位当前行数据的操作链（链表结构）</p> <p>Read View：当事务执行快照读（普通 <code>SELECT</code>，不加锁）时，数据库会生成一个 Read View，包含 4 个核心参数</p> <ul><li><code>m_ids</code>：当前活跃事务 ID 列表（未提交的事务）</li> <li><code>min_trx_id</code>：<code>m_ids</code>中的最小事务 ID</li> <li><code>max_trx_id</code>：下一个即将分配的事务 ID</li> <li><code>creator_trx_id</code>：生成该 Read View 的事务 ID</li></ul> <p>Read View 的可见性规则（判断数据版本是否对当前事务可见）</p> <ol><li>若数据版本的 <code>DB_TRX_ID == creator_trx_id</code> → 自己修改的，可见</li> <li>若 <code>DB_TRX_ID &lt; min_trx_id</code> → 事务已提交，可见</li> <li>若 <code>DB_TRX_ID &gt;= max_trx_id</code> → 事务在 Read View 生成后开启，不可见</li> <li>若 <code>min_trx_id ≤ DB_TRX_ID &lt; max_trx_id</code> → 若 <code>DB_TRX_ID</code> 在 <code>m_ids</code> 中（事务活跃），不可见，否则可见</li></ol> <p>如果当前版本不可见，就通过<code>DB_ROLL_PTR</code>回溯版本链，直到找到第一个可见版本</p> <p>也就是说，MVCC 通过管理事务状态，如果当前数据“正在被写”不允许读（读写锁的功能），那么就会通过事务回滚找到之前的版本返回，这样就能实现“写时可读”的需求</p> <h3 id="延时双删和-binlog-异步双删"><a href="#延时双删和-binlog-异步双删" class="header-anchor">#</a> 延时双删和 Binlog 异步双删</h3> <h4 id="缓存数据一致性"><a href="#缓存数据一致性" class="header-anchor">#</a> 缓存数据一致性</h4> <p>假设我现在有一个高频数据表，用户的每次“读”都会先查询 Redis 数据库，看看有没有缓存，如果有就直接拿，如果无就去打 MySQL 数据库，拿到数据后，将数据存入 Redis 缓存，再返回</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 拿缓存</span>
<span class="token class-name">User</span> cache <span class="token operator">=</span> redisService<span class="token punctuation">.</span><span class="token function">getCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>cache <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> cache<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token comment">// 拿数据库</span>
<span class="token class-name">User</span> user <span class="token operator">=</span> userService<span class="token punctuation">.</span><span class="token function">getUserById</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>user <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">CustomException</span><span class="token punctuation">(</span><span class="token string">&quot;User not found&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token comment">// 存缓存</span>
redisService<span class="token punctuation">.</span><span class="token function">setCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">return</span> user<span class="token punctuation">;</span>
</code></pre></div><p>OK，看起来非常正常，但马上就会出现问题，考虑这样一个场景</p> <ul><li>现在用户 1 需要“写”一个数据项</li> <li>同时另一个用户 2 并发的想“读”这条数据</li></ul> <p>显然，如果不做任何处理，处理的结果会是这样</p> <ol><li>用户 1 成功的更改了 MySQL 中数据</li> <li>用户 2 成功的命中了缓存</li></ol> <p>但用户 2 拿到的永远会是缓存中的脏数据</p> <p>那么显然，在用户“写” MySQL 数据时，我一定要把这条数据对应的缓存从 Redis 里面删掉，于是现在的写流程变为</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 删缓存</span>
redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 写数据库</span>
userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>这样，再读的时候，缓存将命中不了，用户 2 会从 MySQL 中拿到最新的数据</p> <h4 id="延时双删"><a href="#延时双删" class="header-anchor">#</a> 延时双删</h4> <p>OK，看起来非常完美，但马上又会出现问题，众所周知，写是需要时间的，假设</p> <ol><li>用户 1 在写的这条数据（还没写完），此时用户 2 来读这条数据，由于 MySQL 的 MVCC 机制，MySQL 将返回上一版本的数据</li> <li>这样，后端将会拿到一条上个版本的脏数据，继而把他存入 Redis 缓存，最后返回给前端</li> <li>之后的每次查询，都会命中 Redis 缓存中的脏数据返回，而不会去找 MySQL 的新数据</li></ol> <p>于是又发生了第一个场景中的问题，用户 2 将始终命中缓存，返回脏数据</p> <p>所以很自然的，提出了一个“双删”的办法，简单来说，就是在写之前删一次缓存，写之后再删一次缓存，这样无论其他并发怎么写缓存，脏数据的缓存都会被删掉</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 延时</span>
    <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 再删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>可以注意到这里 sleep 了 1 秒，这是因为在后端，我无法判断 MySQL “到底写完没”，所以只能采取简单的线程等待，再去执行删除</p> <ul><li>sleep 的时间实际上取决于“完成写事务”的时间，因为第二次删除是防止从“开始写”到“写完”这段时间的读取，将 MVCC 上一版本的脏数据缓存到 Redis</li></ul> <p>有个问题，我都延时删缓存了，为什么不直接去更新缓存，这样能保证下次命中还不用等？</p> <ul><li>和缓存的存储逻辑严重不符，这样做的结果就是，每次写都会同步写缓存，读写对于 Redis 都变成了增量操作，相当于把 MySQL 整个搬到 Redis 里，那我为什么不直接用 Redis 存，脑瘫了</li></ul> <p>但这样的同步阻塞，对于高并发场景显然是极大的负担</p> <h4 id="binlog-异步双删"><a href="#binlog-异步双删" class="header-anchor">#</a> Binlog 异步双删</h4> <p>既然同步阻塞不行，我们可以考虑异步删除</p> <ul><li>MySQL 的 Binlog（二进制日志）记录了数据库的所有数据变更操作（如 INSERT、UPDATE 和 DELETE），对数据恢复、主从复制和审计非常重要</li></ul> <p>查看 Binlog 文件</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SHOW</span> MASTER <span class="token keyword">STATUS</span><span class="token punctuation">;</span>
</code></pre></div><p>每当写操作之后，通过查看解析 Binlog 内容，将删除缓存的事件通过 MQ 发布，消费者 Comsumer 对相应的缓存进行删除，也就是说，双删的第二次删，通过 Binlog 事件驱动 MQ 消费者异步处理</p> <p>这样，在我的后端，每次写之后，进行一条消息推送，然后正常返回即可</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 推送第二次删除</span>
    rabbitMqService<span class="token punctuation">.</span><span class="token function">pushDeleteCacheEvent</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一个题外话，try - catch - finally 的执行顺序</p> <ul><li>try 中无异常，则 try → finally</li> <li>try 中有异常，则 try → catch → finally</li> <li>try 中无异常但有 return 语句，则 try → finally → return</li> <li>try 中有异常且有 return 语句，则 try → catch → finally → return</li> <li>try 中有异常且有 return 语句，catch 中有 throw 语句，则 try → catch → finally → throw</li></ul> <p>所以不会在 finally 中 return，只是做资源关闭等操作</p> <h2 id="内存数据库-h2db"><a href="#内存数据库-h2db" class="header-anchor">#</a> 内存数据库 H2DB</h2> <blockquote><p><a href="https://juejin.cn/post/6844903625039282183" target="_blank" rel="nofollow noopener noreferrer">h2db新手入门篇——概念及初步使用 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>关系型内存数据库，存储关系型数据（和 MySQL）一样，数据默认存在内存中（和 Redis 一样），目前主流的内存数据库有以下</p> <ol><li>关系型内存数据库：作为传统数据库应用层数据的缓存，支持 sql 语句访问数据库中的数据，提供有限的事务保证，例如 h2db</li> <li>键值对内存数据库：键值对存储结果，按 key 进行读取，value 支持各种数据类型，比如 redis</li> <li>传统数据库的内核引擎：在数据库层面提供了数据库引擎机制，最大程度减少磁盘 IO；支持事务和数据持久化保证，但对数据类型有限制，如 MySQL Memory Engine</li></ol> <p>官网下载：<a href="http://www.h2database.com/html/download.html" target="_blank" rel="nofollow noopener noreferrer">Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>h2db 是纯 Java 编写的开源内存数据库，其源码都打包在 jar 文件中，目前稳定的最新版本 h2-1.4.196.jar 只有 1.8M 左右</p> <p>h2db 有两种工作方式：嵌入式模式和服务器模式</p> <ul><li>嵌入式运行模式：数据库作为整个应用的一部分，数据库 server 和应用运行在一个进程中；应用结束时，h2db server 也会关闭</li> <li>服务器运行模式：数据库 server 运行在独立的进程中，应用通过连接和数据库 server 建立联系。该模式下又有三种连接方式，分别是 web  server 模式、TCP  server 模式，PG server 模式（PostgreSQL clients），在启动 h2db 服务时通过参数指定工作模式</li></ul> <p>由于在服务器模式下，数据要通过 TCP/IP 相关协议完成传输，所以工作效率可能低于嵌入模式</p> <p>这两种模式还可以混合使用，即工作在嵌入式模式下的 h2db 允许其他应用连接，这样就是一种混合模式了。无论在哪种模式下，h2db 都支持都支持持久（persistence）和内存临时数据库（in-memory）</p> <img src="/assets/img/h2db-mixed-mode.e973d97b.png"> <h2 id="后现代数据库-postgresql"><a href="#后现代数据库-postgresql" class="header-anchor">#</a> 后现代数据库 PostgreSQL</h2> <h3 id="b-link-索引和共享内存"><a href="#b-link-索引和共享内存" class="header-anchor">#</a> B-Link 索引和共享内存</h3> <p>PostgreSQL 的底层数据结构，一颗变种的 B+ 树，之前也说过，B+ 是就是一个叶子节点间存在链路的 B 树</p> <p>在 B-Link 树中，其每一层的分支节点之间同样存在向右的单向链路，这样可以有效避免回退根节点搜索右子树的操作，即可以直接从左子树跳转到右子树</p> <p>数据库连接（Postmaster 和 Postgres）</p> <ul><li>每个数据库连接都会新起一个后端进程（Postgres），各个后端进程之间相互独立，Postmaster 作为主进程（类似于 Docker Demon），管理各个后端进程的连接和释放</li></ul> <p>共享内存</p> <ul><li>对于每个相互独立的连接 Postgres，我们不可能为他们每一个都维护一个内存区域以供读写，这样太过于浪费，于是在磁盘和后端进程之间会多加一层共享内存</li> <li>后端进程收到读写命令后，会先到共享内存中去进行查找，如果查找失败，则从磁盘中将相关内容读入共享内存</li></ul> <p>WAL（Write Ahead Logging）机制和后台进程 → 解决共享内存与磁盘的同步更新问题</p> <ul><li>其核心原理是，顺序写入比离散写入快无数倍，所以在写入磁盘之前会先顺序写 WAL 日志，等到有充足时间后，再将 WAF 文件依次写入磁盘</li></ul> <h3 id="向量数据库扩展"><a href="#向量数据库扩展" class="header-anchor">#</a> 向量数据库扩展</h3> <p>为了支持多种索引，后端进程中的优化器、执行器以及 Access Methods 被设计为开放接口</p> <ul><li>优化器指 SQL 语句解析后的优化程序</li> <li>执行器指执行具体机器码数据库操作的程序</li> <li>Access Methods 是 PostgreSQL 向后端进程提供的 API</li></ul> <p>通过扩写优化器、执行器插件的形式，PostgreSQL 可以支持多种索引，例如</p> <ul><li><strong>向量数据库（VectorSQL）</strong></li> <li>图数据库</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="tim
