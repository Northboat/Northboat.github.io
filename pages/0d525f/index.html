</code></pre></div><h3 id="数据库操作"><a href="#数据库操作" class="header-anchor">#</a> 数据库操作</h3> <p>创建删除数据库</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">database</span> <span class="token operator">is</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

</code></pre></div><p>操作数据表</p> <p>列属性</p> <ol><li>unsigned：无符号整数，该数据必不为负</li> <li>zerofill：<code>0</code>填充的，十位数将从前往后填充<code>0</code>，如<code>312 ——&gt; 0000000312</code></li> <li>auto_increment：自增的，可自定义设置起始值和步长</li> <li>not null：非空，默认为可空</li> <li>default：设置默认值</li> <li>comment：解释</li></ol> <h4 id="创建-查看"><a href="#创建-查看" class="header-anchor">#</a> 创建/查看</h4> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">(</span>

</code></pre></div><p>所有删除创建操作尽量加上判断语句，以免报错</p> <h4 id="数据表引擎类型"><a href="#数据表引擎类型" class="header-anchor">#</a> 数据表引擎类型</h4> <table><thead><tr><th>区别</th> <th>MyISAM</th> <th>InnoDB</th></tr></thead> <tbody><tr><td>事务支持</td> <td>不支持</td> <td>支持</td></tr> <tr><td>外键约束</td> <td>不支持</td> <td>支持</td></tr> <tr><td>全文索引</td> <td>支持</td> <td>不支持</td></tr> <tr><td>数据行锁定</td> <td>不支持</td> <td>支持</td></tr> <tr><td>表空间大小</td> <td>较小</td> <td>较大，约为前者两倍</td></tr></tbody></table> <p>简单来说</p> <ul><li>MyISAM 更轻便（节约空间）、更快</li> <li>InnoDB 安全性高，支持事务处理，支持多表多用户操作（外键、多行同时操作），功能更丰富</li></ul> <p>数据库的本质仍是文件存储，储存在 data 文件夹下，一个文件夹对应一个数据库</p> <p>MySQL 引擎在物理文件上的区别</p> <ul><li>InnoDB 中数据库表中只有一个<code>*.frm</code>以及上级目录下的<code>ibdata1</code>文件</li> <li>MyISAM 对应的文件
<ul><li>*.frm 表结构的定义文件</li> <li>*.MYD 数据文件（data）</li> <li>*.MYI 索引文件</li></ul></li></ul> <p>表默认的字符集编码并不支持中文，要手动设置</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">default</span> <span class="token keyword">charset</span><span class="token operator">=</span>utf8

</code></pre></div><p>以上都是物理外键，数据库级别的外键不建议使用，避免数据库过多造成臃肿</p> <p>最佳实践</p> <ul><li>数据库就是单纯的表，只用来存数据，只有行（数据）列（字段）</li> <li>我们想使用多张表的数据，想使用外键，我们用程序去实现（一段逻辑）</li></ul> <p>DML：参考SQL语句编写</p> <h3 id="b-树索引"><a href="#b-树索引" class="header-anchor">#</a> B+ 树索引</h3> <blockquote><p>MySQL 的索引结构</p></blockquote> <p>B 树</p> <ul><li>叶子节点具有相同深度，叶节点指针为空</li> <li>索引元素不重复</li> <li>节点中数据索引从左到右递增</li></ul> <p>B+ 树：叶子节点间存在横向链路的 B 树</p> <img src="/assets/img/1176659-20190124170518912-630934803.8182c82f.png"> <h3 id="mvcc-机制"><a href="#mvcc-机制" class="header-anchor">#</a> MVCC 机制</h3> <p>MySQL 同步机制</p> <h2 id="非关系型数据库-redis"><a href="#非关系型数据库-redis" class="header-anchor">#</a> 非关系型数据库 Redis</h2> <blockquote><p>Key-Value 型数据库</p></blockquote> <p>主要的三个使用场景</p> <ul><li>数据缓存</li> <li>分布式锁</li> <li>消息队列（简单的发布-订阅场景）</li></ul> <p>古法安装：上传安装包并放在 /opt 目录下（古法）</p> <div class="language-java extra-class"><pre class="language-java"><code>mv redis<span class="token operator">-</span><span class="token number">6.2</span><span class="token number">.6</span><span class="token punctuation">.</span>tar<span class="token punctuation">.</span>gz <span class="token operator">/</span>opt
</code></pre></div><p>解压</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> redis-6.2.6.tar.gz
</code></pre></div><p>进入redis目录</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> redis-6.2.6.tar.gz
</code></pre></div><p>编译下载</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> <span class="token function">make</span>
yay <span class="token parameter variable">-S</span> pkg-config

<span class="token function">make</span> <span class="token operator">&amp;&amp;</span> <span class="token function">make</span> <span class="token function">install</span>
</code></pre></div><p>默认安装路径</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/usr/local/bin
</code></pre></div><p>进入该目录，将redis.conf拷贝至当前目录，使用这个拷贝的文件进行配置启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">mkdir</span> config
<span class="token function">cp</span> /home/northboat/redis-6.2.6/redis.conf config
</code></pre></div><p>修改默认启动方式</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> config
<span class="token function">vim</span> redis.conf
<span class="token comment">#设置 daemonize 为 yes 保存并退出</span>
</code></pre></div><p>在/usr/local/bin目录下启动服务，通过指定的配置文件启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-server config/redis.conf
</code></pre></div><h3 id="数据库操作与命名"><a href="#数据库操作与命名" class="header-anchor">#</a> 数据库操作与命名</h3> <p>连接redis</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token comment"># -h 默认为本机</span>

<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> name NorthBoat
OK
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>

</code></pre></div><p>查看redis进程是否开启</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> redis

</code></pre></div><p>关闭redis服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span><span class="token operator">:</span><span class="token number">6379</span><span class="token operator">&gt;</span> shutdown

</code></pre></div><p>设置密码，在redis.conf中搜索requirepass，插入新行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># vim搜索：&quot;:/requirepass&quot;，按寻找下一个</span>
requirepass <span class="token number">123456</span>
</code></pre></div><p>在登录redis后验证密码即可操作数据</p> <div class="language-bash extra-class"><pre class="language-bash"><code>auth <span class="token string">&quot;123456&quot;</span>

</code></pre></div><p>可视化工具：<a href="https://gitee.com/qishibo/AnotherRedisDesktopManager" target="_blank" rel="nofollow noopener noreferrer">Another Redis Desktop Manager<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>基本使用</p> <table><thead><tr><th>命令</th> <th>解释</th></tr></thead> <tbody><tr><td>set name NorthBoat</td> <td>设置键值对{name: NorthBoat}</td></tr> <tr><td>get name</td> <td>获取键的值</td></tr> <tr><td>del name</td> <td>删除键值对</td></tr> <tr><td>exists name</td> <td>检查键是否存在</td></tr> <tr><td>expire name seconds</td> <td>为键设置过期时间，单位s（注意在设置完键值后使用）</td></tr> <tr><td>move name db</td> <td>将当前库的name转移到指定的数据库db中</td></tr> <tr><td>ttl name</td> <td>返回name剩余时间，单位为s</td></tr> <tr><td>persist name</td> <td>移除name的过期时间</td></tr> <tr><td>rename name n</td> <td>将键name改名为n</td></tr> <tr><td>flushdb</td> <td>刷新redis，清除所有键值</td></tr></tbody></table> <p>键规范：Redis 的键命名有一套业界推荐的规范，即采用<strong>冒号</strong>作为分隔符表示数据的层级关系</p> <p>一套常用的结构模板</p> <table><thead><tr><th>类型</th> <th>命名规则</th> <th>示例</th></tr></thead> <tbody><tr><td>用户 Token 存储</td> <td><code>login:token:{token}</code></td> <td><code>login:token:abc123</code></td></tr> <tr><td>用户 ID 映射 Token</td> <td><code>login:user:{userId}</code></td> <td><code>login:user:u001</code></td></tr> <tr><td>缓存（对象）</td> <td><code>cache:{业务}:{标识}</code></td> <td><code>cache:user:u001</code></td></tr> <tr><td>限流</td> <td><code>rate_limit:{类型}:{标识}</code></td> <td><code>rate_limit:ip:127.0.0.1</code></td></tr> <tr><td>队列</td> <td><code>queue:{业务}</code></td> <td><code>queue:email</code></td></tr> <tr><td>计数器</td> <td><code>counter:{业务}:{标识}</code></td> <td><code>counter:login_fail:u001</code></td></tr> <tr><td>分布式锁</td> <td><code>lock:{资源}</code></td> <td><code>lock:order:123456</code></td></tr> <tr><td>会话管理</td> <td><code>session:{sessionId}</code></td> <td><code>session:sess_abc123</code></td></tr></tbody></table> <h3 id="缓存数据库"><a href="#缓存数据库" class="header-anchor">#</a> 缓存数据库</h3> <p>基于内存的 KV 数据库，支持高速读写，常用作关系型数据库的缓存</p> <p>String：从<code>Redis</code>中取出的字符串在<code>Java</code>程序中会显示为<code>&quot;NorthBoat&quot;</code>的形式，要加转义字符<code>\&quot;</code>表示双引号</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> <span class="token keyword">set</span> name NorthBoat

        e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>Zset / SortedSet：有序集合，每个 String 元素有一个 double 类型的权重，Zset 将根据权重对元素进行排序</p> <ul><li>zadd key weight val：添加成员，weight 为权重</li> <li>zrange start end：查询下标 start 到 end 的元素</li> <li>zrem key member：删除成员</li> <li>zcard key：查询数量</li></ul> <h3 id="特殊数据类型支持"><a href="#特殊数据类型支持" class="header-anchor">#</a> 特殊数据类型支持</h3> <p>Geospatial</p> <p>Hyperloglog</p> <p>Bitmap</p> <h3 id="redis-事物"><a href="#redis-事物" class="header-anchor">#</a> Redis 事物</h3> <blockquote><p>实现 Redis 事务，通常需要 Lua 脚本辅助</p></blockquote> <p>事物：一组命令的集合，如多条 SQL，入队出队依次执行，事物中的所有命令都会被序列化，会按顺序执行</p> <div class="language- extra-class"><pre class="language-text"><code>= 队头 set1 set2 set3 ... 队尾 =
</code></pre></div><p>ACID 原则：原子性、一致性、隔离性、持久性</p> <ul><li>redis 单条命令保证原子性，但 redis 事物不保证原子性</li> <li>redis 事务没有隔离级别的概念，所有命令在事务中并没有直接被执行，只有发起执行命令的时候才会执行（exec）</li></ul> <p>redis 事务的一次正常执行</p> <ol><li>开启事务：multi</li> <li>命令入队：依次写命令</li> <li>执行事务：exec</li></ol> <p>例如</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k1 v1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k3 v3
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>
<span class="token number">1</span><span class="token punctuation">)</span> OK
<span class="token number">2</span><span class="token punctuation">)</span> OK
<span class="token number">3</span><span class="token punctuation">)</span> OK
<span class="token number">4</span><span class="token punctuation">)</span> <span class="token string">&quot;v2&quot;</span>
</code></pre></div><p>放弃事务：discard（在multi后、exec前执行，队列中所有命令都不会执行）</p> <p>事务报错：编译型异常：代码有问题，编译都过不了，整个事务都不会被执行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k1 v1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> getset k3
<span class="token punctuation">(</span>error<span class="token punctuation">)</span> ERR wrong number of arguments <span class="token keyword">for</span> <span class="token string">'getset'</span> <span class="token builtin class-name">command</span>
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>
<span class="token punctuation">(</span>error<span class="token punctuation">)</span> EXECABORT Transaction discarded because of previous errors.

<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k1
<span class="token punctuation">(</span>nil<span class="token punctuation">)</span>
</code></pre></div><p>运行时异常：如果事务队列中某个命令存在某个问题，类似与 RuntimeException，在执行事务时，其他命令可以正常执行，错误命令抛出异常</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> k1 <span class="token string">&quot;v1&quot;</span>
OK
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi
OK
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> incr k1
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">set</span> k2 v2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> get k2
QUEUED
<span class="token number">127.0</span>.0.1:6379<span class="token punctuation">(</span>TX<span class="token punctuation">)</span><span class="token operator">&gt;</span> <span class="token builtin class-name">exec</span>

<span class="token number">1</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>error<span class="token punctuation">)</span> ERR value is not an integer or out of range
<span class="token number">2</span><span class="token punctuation">)</span> OK
<span class="token number">3</span><span class="token punctuation">)</span> <span class="token string">&quot;v2&quot;</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span>
</code></pre></div><h3 id="redis-分布式锁"><a href="#redis-分布式锁" class="header-anchor">#</a> Redis 分布式锁</h3> <blockquote><p>redis 可以使用 watch 机制实现乐观锁</p></blockquote> <p>由于要保证分布式系统的性能，分布式锁一般都是乐观锁，与之对应的是悲观锁</p> <p>悲观锁是将资源锁住，等一个之前获得锁的线程释放锁之后，下一个线程才可以访问。而乐观锁采取了一种宽泛的态度，通过某种方式不加锁来处理资源，比如通过给记录加 version 或 timestamp 来操作数据（比如 CAS 策略），<strong>性能较悲观锁有很大的提高</strong></p> <ul><li>像 synchronized、Lock、ReadWriteLock 均为悲观锁</li> <li>而原子类例如 AtomicInteger 用的实际上是 CAS 机制，所以是一个乐观锁 → 但是没有引入版本控制，所以会出现 ABA 问题（A→B→A），详见 - <a href="https://northboat.github.io/pages/479c11/#%E4%BB%80%E4%B9%88%E6%98%AF-cas" target="_blank" rel="nofollow noopener noreferrer">原子性、单例模式和 CAS | 北船<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>还有一种乐观锁的理解：Git</p> <ul><li>我们只有在 push 的时候才会进行锁的检查，返回错误信息</li> <li>无论是 add 还是 commit，都是不上锁的（乐观的默认可执行），碰到问题（push 版本不对）再去解决</li></ul> <p>当然，我们在此处只讨论分布式锁的实现，需要明确的是，分布式锁既可以是悲观的也可以是乐观的，这要根据具体场景进行设计考量</p> <p>Redission，基于 Redis 集群的分布式锁，本质上就是维护同一个键值对，作为 Lock，获取时上锁，获取前检查这个键值对是否有锁，释放时解锁</p> <h3 id="redis-分布式会话"><a href="#redis-分布式会话" class="header-anchor">#</a> Redis 分布式会话</h3> <p>在分布式系统的诸多后端接口之间维护<strong>唯一</strong>的用户 Session，用以管理用户登陆状态，可以用 Redis 存放用户 Session 并设置有效期实现（在这里，一个 Session 实际上就是一个 KV 对）</p> <p>使用 Redis 做用户登陆状态管理（分布式会话管理），通常有这样两种做法</p> <p>1️⃣ Token 为键，用户信息为值，例如</p> <div class="language- extra-class"><pre class="language-text"><code>Key:   login:token:{jwt-token}
Value: &quot;{userId: u12345}, {username: arkrypto}, {roles: [admin]}, {loginTime: 2025-05-19T18:00:00}&quot;
</code></pre></div><p>Value 实际上是用户信息的一个 JsonToString</p> <p>2️⃣ 用户 ID 为键，Token 为值，这个很简单</p> <div class="language- extra-class"><pre class="language-text"><code>Key:   login:user:{userId}
Value: jwt-token
</code></pre></div><p>其中，2 适合单点登录（SSO，Single Sign-On）控制，因为可以很轻松的做到一个 ID 对应一个 KV 对，即一个会话；而前者默认支持多端登录</p> <table><thead><tr><th>项目</th> <th>方式一：以 <code>token</code> 为 key</th> <th>方式二：以 <code>userId</code> 为 key</th></tr></thead> <tbody><tr><td>Key</td> <td><code>login:token:{token}</code></td> <td><code>login:user:{userId}</code></td></tr> <tr><td>Value</td> <td>用户信息（JSON 格式）</td> <td>token 字符串</td></tr> <tr><td>是否支持多端登录</td> <td>支持（每个 token 独立）</td> <td>默认不支持（一个 userId 对应一个 token）</td></tr> <tr><td>用途</td> <td>校验身份和获取用户信息</td> <td>实现单点登录/控制登录唯一性</td></tr> <tr><td>删除策略</td> <td>删除 token（用于登出）</td> <td>删除 userId-token 绑定（用于限制）</td></tr></tbody></table> <h3 id="redis-分布式-id"><a href="#redis-分布式-id" class="header-anchor">#</a> Redis 分布式 ID</h3> <p>在分布式系统中，要保证 ID 的唯一性，粗糙方案</p> <ol><li>UUID：空间大，无序</li> <li>数据库自增 ID：性能差，单点故障</li></ol> <p>较好的方案</p> <ol><li>Redis 自增 ID：多机设置不同初始 ID 和不同步长</li> <li>雪花算法（Snowflake）：生成 64 位的 ID，包含时间戳、机器 ID 和序列号；高性能、有序，但依赖时钟同步</li></ol> <h3 id="redis-主从同步"><a href="#redis-主从同步" class="header-anchor">#</a> Redis 主从同步</h3> <blockquote><p>Redis 主从架构如何避免脏读</p></blockquote> <p>参考</p> <ul><li><a href="https://juejin.cn/post/7383957603016048655" target="_blank" rel="nofollow noopener noreferrer">考考你Redis主从，就知道有没深入Redis大家好，我是南哥。 一个对Java程序员进阶成长颇有研究的人，今天继续给大 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2448914" target="_blank" rel="nofollow noopener noreferrer">Redis部署方案的演进-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在 Redis 主从架构中</p> <ul><li><strong>主节点</strong>：负责处理写操作（如 SET、DEL），并将写操作同步到从节点</li> <li><strong>从节点</strong>：负责处理读操作（如 GET），并提供数据的副本</li></ul> <p>这也是 CQRS 的一种具体实现，即读写分离架构</p> <p>在 Redis 集群中，这样的复制和 Eureka 一样，属于异步复制，均属于 AP 系统（可用性大于一致性）</p> <ul><li>由于主从同步是异步的，写操作在主节点完成后，并不会立即同步到从节点。因此，在同步完成之前，从节点可能会返回旧数据，导致<strong>脏读</strong></li></ul> <p>一个很经典的避免脏读的方法：<strong>读写锁</strong>（写时禁读）</p> <p>经典的解决方案导致经典的问题</p> <ol><li>性能瓶颈：写操作期间禁止读操作，会导致读请求被阻塞，降低系统的并发性能</li> <li>系统卡死：若主节点的写 I/O 阻塞，整个系统可能会卡住，影响可用性</li> <li>复杂性：实现分布式读写锁会增加系统的复杂性</li></ol> <p>主从结构下，避免脏读除了读写锁还有什么方法呢？（天美 /(ㄒoㄒ)/~~）</p> <p>1️⃣ 写后同步等待</p> <p>刚刚提到，用读写锁，实际上是分布式锁的一种应用，这与“写后同步等待”不同，“写后同步等待”实际上就类似于 Eureka 的同步复制机制，主节点写完后对所有副节点进行阻塞的同步更新，更新完成后，才可以执行读操作</p> <p>这可以使用 Redis 的 Wait 命令实现</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key value
WAIT <span class="token number">1</span> <span class="token number">1000</span>  <span class="token comment"># 等待至少 1 个从节点同步完成，超时时间为 1000 毫秒</span>
</code></pre></div><p>2️⃣ 版本号或时间戳机制</p> <p>原理：为每个键（Key）添加版本号或时间戳，客户端在读取数据时检查版本号或时间戳，确保读取的是最新数据</p> <p>优点</p> <ul><li>不需要阻塞读操作，性能较高</li> <li>可以灵活控制数据的一致性级别</li></ul> <p>缺点</p> <ul><li>需要在客户端实现额外的逻辑</li> <li>增加了数据存储的开销（多一个存储字段）</li></ul> <p>实现方式：在写操作时，更新键的版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>SET key:version <span class="token number">1</span>
SET key:value <span class="token string">&quot;data&quot;</span>
</code></pre></div><p>在读操作时，检查版本号或时间戳</p> <div class="language-sh extra-class"><pre class="language-sh"><code>GET key:version
GET key:value
</code></pre></div><p>这里的读是指一次事务中的前后两次读（脏读的本质），在后一次做一个版本的检查，比如刚进入时读一次数据（这个数据上带一个版本号，或时间戳），然后在退出函数时再读一次，若版本号不同，则按后一次读出的数据为准</p> <p>3️⃣ 最终一致性容忍</p> <p>原理：接受一定时间内的脏读，通过业务逻辑容忍最终一致性</p> <p>优点</p> <ul><li>性能最高，没有额外的同步开销</li> <li>适合对一致性要求不高的场景</li></ul> <p>缺点：不适用于对一致性要求严格的场景（如金融交易）</p> <p>实现方式：在业务逻辑中处理脏读问题，例如</p> <ul><li>对脏读不敏感的数据（如用户昵称、文章内容）可以直接使用从节点读取</li> <li>对脏读敏感的数据（如余额、库存）可以从主节点读取</li></ul> <p><strong>注意，我们可以强制用户在主节点上读取数据，这样可以保证不会出现脏读，代价是主节点负担较大</strong>，所以这里的实现采取了折中的方案，敏感数据限定读主节点，非敏感数据读副节点</p> <p>那么“最终一致性容忍”是个什么情况呢，允许了一部分的脏读，但换回了相当一部分的性能</p> <p>4️⃣ 强制读主节点</p> <p>对于敏感数据，强制性的让用户只能读取主节点内容，由于 Redis 是单线程的原子操作，单独读写一个节点，当然不会发生脏读啦</p> <p>随之而来的是主节点负担增加，从而拖慢读写性能</p> <h3 id="redis-限流算法"><a href="#redis-限流算法" class="header-anchor">#</a> Redis 限流算法</h3> <p>令牌桶算法、漏桶算法、固定窗口算法、滑动窗口算法以及动态限流算法</p> <ul><li>令牌桶：每秒给多少令牌，同时给定令牌上限，令牌用完了拒绝请求</li> <li>漏桶：每秒处理多少个水滴（请求），类似于消息队列的方式，每秒消费多少个请求</li> <li>固定窗口：固定时间窗口，每个窗口通过的请求有限</li> <li>滑动窗口：细粒的划分时间，在每个大窗口中控制小窗口，并可以通过小窗口的状态判断大窗口的访问控制，详见示例</li> <li>动态限流：根据系统负载动态调节漏桶的流速，负载越高，流速越小</li></ul> <p>限流算法的选择</p> <ul><li>如果需要平滑限流并支持突发流量，选择<strong>令牌桶算法</strong></li> <li>如果需要严格控制请求速率，选择<strong>漏桶算法</strong></li> <li>如果对限流精度要求不高，选择<strong>固定窗口算法</strong>或<strong>计数器算法</strong></li> <li>如果对限流精度要求较高，选择<strong>滑动窗口算法</strong></li> <li>如果需要根据系统状态动态调整限流策略，选择<strong>动态限流算法</strong></li></ul> <h3 id="缓存穿透、击穿和雪崩"><a href="#缓存穿透、击穿和雪崩" class="header-anchor">#</a> 缓存穿透、击穿和雪崩</h3> <blockquote><p>如何避免缓存灾难三兄贵，如何避免？发生了如何挽救？</p></blockquote> <h2 id="orm-框架"><a href="#orm-框架" class="header-anchor">#</a> ORM 框架</h2> <p>ORM 框架，即 Object-Relational Mapping，对象关系映射框架，用对象映射关系代替 SQL 语句编写</p> <p>参见 <a href="https://northboat.github.io/pages/2d1368/#spring-date" target="_blank" rel="nofollow noopener noreferrer">Spring Boot 基础 - Spring Data | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="内存数据库-h2db"><a href="#内存数据库-h2db" class="header-anchor">#</a> 内存数据库 H2DB</h2> <blockquote><p><a href="https://juejin.cn/post/6844903625039282183" target="_blank" rel="nofollow noopener noreferrer">h2db新手入门篇——概念及初步使用 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>关系型内存数据库，存储关系型数据（和 MySQL）一样，数据默认存在内存中（和 Redis 一样），目前主流的内存数据库有以下</p> <ol><li>关系型内存数据库：作为传统数据库应用层数据的缓存，支持 sql 语句访问数据库中的数据，提供有限的事务保证，例如 h2db</li> <li>键值对内存数据库：键值对存储结果，按 key 进行读取，value 支持各种数据类型，比如 redis</li> <li>传统数据库的内核引擎：在数据库层面提供了数据库引擎机制，最大程度减少磁盘 IO；支持事务和数据持久化保证，但对数据类型有限制，如 MySQL Memory Engine</li></ol> <h3 id="h2db-概述"><a href="#h2db-概述" class="header-anchor">#</a> H2DB 概述</h3> <p>官网下载：<a href="http://www.h2database.com/html/download.html" target="_blank" rel="nofollow noopener noreferrer">Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>h2db 是纯 Java 编写的内存数据库，是一个开源项目，其源码都打包在 jar 文件中，目前稳定的最新版本 h2-1.4.196.jar 只有 1.8M 左右</p> <p>h2db 有两种工作方式：嵌入式模式和服务器模式</p> <ul><li>嵌入式运行模式：数据库作为整个应用的一部分，数据库 server 和应用运行在一个进程中；应用结束时，h2db server 也会关闭</li> <li>服务器运行模式：数据库 server 运行在独立的进程中，应用通过连接和数据库 server 建立联系。该模式下又有三种连接方式，分别是 web  server 模式、TCP  server 模式，PG server 模式（PostgreSQL clients），在启动 h2db 服务时通过参数指定工作模式</li></ul> <p>由于在服务器模式下，数据要通过 TCP/IP 相关协议完成传输，所以工作效率可能低于嵌入模式</p> <p>这两种模式还可以混合使用，即工作在嵌入式模式下的 h2db 允许其他应用连接，这样就是一种混合模式了。无论在哪种模式下，h2db 都支持都支持持久（persistence）和内存临时数据库（in-memory）</p> <img src="/assets/img/h2db-mixed-mode.e973d97b.png"> <h2 id="后现代数据库-postgresql"><a href="#后现代数据库-postgresql" class="header-anchor">#</a> 后现代数据库 PostgreSQL</h2> <h3 id="b-link-树索引"><a href="#b-link-树索引" class="header-anchor">#</a> B-Link 树索引</h3> <p>PostgreSQL 的底层数据结构，一颗变种的 B+ 树，之前也说过，B+ 是就是一个叶子节点间存在链路的 B 树</p> <p>而在 B-Link 树中，其每一层的分支节点之间同样存在向右的单向链路，这样可以有效避免回退根节点搜索右子树的操作，即可以直接从左子树跳转到右子树</p> <h3 id="postmaster-和-postgres"><a href="#postmaster-和-postgres" class="header-anchor">#</a> Postmaster 和 Postgres</h3> <p>每个数据库连接都会新起一个后端进程（Postgres），各个后端进程之间相互独立，Postmaster 作为主进程（类似于 Docker Demon），管理各个后端进程的连接和释放</p> <h3 id="共享内存"><a href="#共享内存" class="header-anchor">#</a> 共享内存</h3> <p>对于每个相互独立的连接 Postgres，我们不可能为他们每一个都维护一个内存区域以供读写，这样太过于浪费，于是在磁盘和后端进程之间会多加一层共享内存</p> <p>后端进程收到读写命令后，会先到共享内存中去进行查找，如果查找失败，则从磁盘中将相关内容读入共享内存</p> <h3 id="wal-机制和后台进程"><a href="#wal-机制和后台进程" class="header-anchor">#</a> WAL 机制和后台进程</h3> <p>Write Ahead Logging，解决共享内存与磁盘的同步更新问题</p> <p>其核心原理是，顺序写入比离散写入快无数倍，所以在写入磁盘之前会先顺序写 WAL 日志，等到有充足时间后，再将 WAF 文件依次写入磁盘</p> <h3 id="模块化扩展"><a href="#模块化扩展" class="header-anchor">#</a> 模块化扩展</h3> <p>为了支持多种索引，后端进程中的优化器、执行器以及 Access Methods 被设计为开放接口</p> <ul><li>优化器指 SQL 语句解析后的优化程序</li> <li>执行器指执行具体机器码数据库操作的程序</li> <li>Access Methods 是 PostgreSQL 向后端进程提供的 API</li></ul> <p>通过扩写优化器、执行器插件的形式，PostgreSQL 可以支持多种索引，例如</p> <ul><li>向量数据库（VectorSQL）</li> <li>图数据库</li></ul><
