ervice</span> mysqld restart

</code></pre></div><p>启动命令行客户端：mysqp -u root -p</p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token comment">#本地机</span>

<span class="token comment">#远端机</span>

</code></pre></div><h3 id="数据库操作"><a href="#数据库操作" class="header-anchor">#</a> 数据库操作</h3> <p>创建删除数据库</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">database</span> <span class="token operator">is</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

</code></pre></div><p>操作数据表</p> <p>列属性</p> <ol><li>unsigned：无符号整数，该数据必不为负</li> <li>zerofill：<code>0</code>填充的，十位数将从前往后填充<code>0</code>，如<code>312 ——&gt; 0000000312</code></li> <li>auto_increment：自增的，可自定义设置起始值和步长</li> <li>not null：非空，默认为可空</li> <li>default：设置默认值</li> <li>comment：解释</li></ol> <h4 id="创建-查看"><a href="#创建-查看" class="header-anchor">#</a> 创建/查看</h4> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">(</span>

<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>

</code></pre></div><p>所有删除创建操作尽量加上判断语句，以免报错</p> <h4 id="数据表引擎类型"><a href="#数据表引擎类型" class="header-anchor">#</a> 数据表引擎类型</h4> <table><thead><tr><th>区别</th> <th>MyISAM</th> <th>InnoDB</th></tr></thead> <tbody><tr><td>事务支持</td> <td>不支持</td> <td>支持</td></tr> <tr><td>外键约束</td> <td>不支持</td> <td>支持</td></tr> <tr><td>全文索引</td> <td>支持</td> <td>不支持</td></tr> <tr><td>数据行锁定</td> <td>不支持</td> <td>支持</td></tr> <tr><td>表空间大小</td> <td>较小</td> <td>较大，约为前者两倍</td></tr></tbody></table> <p>简单来说</p> <ul><li>MyISAM 更轻便（节约空间）、更快</li> <li>InnoDB 安全性高，支持事务处理，支持多表多用户操作（外键、多行同时操作），功能更丰富</li></ul> <p>数据库的本质仍是文件存储，储存在 data 文件夹下，一个文件夹对应一个数据库</p> <p>MySQL 引擎在物理文件上的区别</p> <ul><li>InnoDB 中数据库表中只有一个<code>*.frm</code>以及上级目录下的<code>ibdata1</code>文件</li> <li>MyISAM 对应的文件
<ul><li>*.frm 表结构的定义文件</li> <li>*.MYD 数据文件（data）</li> <li>*.MYI 索引文件</li></ul></li></ul> <p>表默认的字符集编码并不支持中文，要手动设置</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">default</span> <span class="token keyword">charset</span><span class="token operator">=</span>utf8

    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-test<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>配置后台监控页面</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">DruidConfig</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@ConfigurationProperties</span><span class="token punctuation">(</span>prefix <span class="token operator">=</span> <span class="token string">&quot;spring.datasource&quot;</span><span class="token punctuation">)</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">DataSource</span> <span class="token function">druidDataSource</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">DruidDataSource</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">//后台监控</span>
    <span class="token comment">//相当于web.xml</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">ServletRegistrationBean</span> <span class="token function">servlet</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">ServletRegistrationBean</span> bean <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ServletRegistrationBean</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">StatViewServlet</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token string">&quot;/druid/*&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> properties <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        properties<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;loginUsername&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;admin&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        properties<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;loginPassword&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;011026&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token comment">//允许谁能访问</span>
        properties<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;allow&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//禁止谁能访问</span>
        <span class="token comment">//properties.put(&quot;NorthBoat&quot;, &quot;39.106.160.174&quot;);</span>

        bean<span class="token punctuation">.</span><span class="token function">setInitParameters</span><span class="token punctuation">(</span>properties<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> bean<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>log4j 报错</p> <div class="language-bash extra-class"><pre class="language-bash"><code>log4j:WARN No appenders could be found <span class="token keyword">for</span> logger <span class="token punctuation">(</span>org.apache.ibatis.logging.LogFactory<span class="token punctuation">)</span>.
log4j:WARN Please initialize the log4j system properly.
log4j:WARN See http://logging.apache.org/log4j/1.2/faq.html<span class="token comment">#noconfig for more info.</span>
</code></pre></div><p>原因：未配置 log4j.properties</p> <div class="language-properties extra-class"><pre class="language-properties"><code><span class="token key attr-name">log4j.rootLogger</span><span class="token punctuation">=</span><span class="token value attr-value">debug, stdout, R</span>

<span class="token key attr-name">log4j.appender.stdout</span><span class="token punctuation">=</span><span class="token value attr-value">org.apache.log4j.ConsoleAppender</span>
<span class="token key attr-name">log4j.appender.stdout.layout</span><span class="token punctuation">=</span><span class="token value attr-value">org.apache.log4j.PatternLayout</span>

<span class="token comment"># Pattern to output the caller's file name and line number.</span>
<span class="token key attr-name">log4j.appender.stdout.layout.ConversionPattern</span><span class="token punctuation">=</span><span class="token value attr-value">%5p [%t] (%F:%L) - %m%n</span>

<span class="token key attr-name">log4j.appender.R</span><span class="token punctuation">=</span><span class="token value attr-value">org.apache.log4j.RollingFileAppender</span>
<span class="token key attr-name">log4j.appender.R.File</span><span class="token punctuation">=</span><span class="token value attr-value">example.log</span>

<span class="token key attr-name">log4j.appender.R.MaxFileSize</span><span class="token punctuation">=</span><span class="token value attr-value">100KB</span>
<span class="token comment"># Keep one backup file</span>
<span class="token key attr-name">log4j.appender.R.MaxBackupIndex</span><span class="token punctuation">=</span><span class="token value attr-value">5</span>

<span class="token key attr-name">log4j.appender.R.layout</span><span class="token punctuation">=</span><span class="token value attr-value">org.apache.log4j.PatternLayout</span>
<span class="token key attr-name">log4j.appender.R.layout.ConversionPattern</span><span class="token punctuation">=</span><span class="token value attr-value">%p %t %c - %m%n</span>
</code></pre></div><p>使用原生 jdbc 进行 CRUD</p> <p>注意全局查找返回结果类型<code>List&lt;Map&lt;String, Object&gt;&gt;</code>，以及插入列名用飘号括起防止关键字造成sql语句报错</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">JDBCController</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token class-name">JdbcTemplate</span> jdbcTemplate<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/list&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Map</span><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span><span class="token punctuation">&gt;</span></span> <span class="token function">list</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">String</span> sql <span class="token operator">=</span> <span class="token string">&quot;select * from Postman&quot;</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> jdbcTemplate<span class="token punctuation">.</span><span class="token function">queryForList</span><span class="token punctuation">(</span>sql<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/add&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">add</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">String</span> sql <span class="token operator">=</span> <span class="token string">&quot;insert into PostOffice.Postman(num,`count`,`name`,`to`,`subject`,`text`) values (3,0,'xzt','1543625674@qq.com','hello','hahaha')&quot;</span><span class="token punctuation">;</span>
        jdbcTemplate<span class="token punctuation">.</span><span class="token function">update</span><span class="token punctuation">(</span>sql<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token string">&quot;add ok&quot;</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="非关系型数据库-redis"><a href="#非关系型数据库-redis" class="header-anchor">#</a> 非关系型数据库 Redis</h2> <blockquote><p>Key-Value 型数据库</p></blockquote> <p>主要的三个使用场景</p> <ul><li>数据缓存</li> <li>分布式锁</li> <li>消息队列（简单的发布-订阅场景）</li></ul> <p>古法安装：上传安装包并放在 /opt 目录下（古法）</p> <div class="language-java extra-class"><pre class="language-java"><code>mv redis<span class="token operator">-</span><span class="token number">6.2</span><span class="token number">.6</span><span class="token punctuation">.</span>tar<span class="token punctuation">.</span>gz <span class="token operator">/</span>opt
</code></pre></div><p>解压</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> redis-6.2.6.tar.gz
</code></pre></div><p>进入redis目录</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> redis-6.2.6.tar.gz
</code></pre></div><p>编译下载</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> <span class="token function">make</span>
yay <span class="token parameter variable">-S</span> pkg-config

<span class="token function">make</span> <span class="token operator">&amp;&amp;</span> <span class="token function">make</span> <span class="token function">install</span>
</code></pre></div><p>默认安装路径</p> <div class="language-bash extra-class"><pre class="language-bash"><code>/usr/local/bin
</code></pre></div><p>进入该目录，将redis.conf拷贝至当前目录，使用这个拷贝的文件进行配置启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">mkdir</span> config
<span class="token function">cp</span> /home/northboat/redis-6.2.6/redis.conf config
</code></pre></div><p>修改默认启动方式</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> config
<span class="token function">vim</span> redis.conf
<span class="token comment">#设置 daemonize 为 yes 保存并退出</span>
</code></pre></div><p>在/usr/local/bin目录下启动服务，通过指定的配置文件启动</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-server config/redis.conf
</code></pre></div><h3 id="数据库操作与命名"><a href="#数据库操作与命名" class="header-anchor">#</a> 数据库操作与命名</h3> <p>连接redis</p> <div class="language-bash extra-class"><pre class="language-bash"><code>redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token comment"># -h 默认为本机</span>
 
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token function">ping</span>
PONG
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> <span class="token builtin class-name">set</span> name NorthBoat
OK
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> get a
<span class="token punctuation">(</span>nil<span class="token punctuation">)</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> keys *
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;name&quot;</span>
</code></pre></div><p>查看redis进程是否开启</p> <div class="language-shell extra-class"><pre class="language-shell"><code><span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> redis

<span class="token comment">#查看后台java进程</span>
<span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> <span class="token function">java</span>
jps <span class="token parameter variable">-l</span> <span class="token parameter variable">-v</span>
</code></pre></div><p>关闭redis服务</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span><span class="token operator">:</span><span class="token number">6379</span><span class="token operator">&gt;</span> shutdown
not connected<span class="token operator">&gt;</span> exit
</code></pre></div><p>设置密码，在redis.conf中搜索requirepass，插入新行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># vim搜索：&quot;:/requirepass&quot;，按寻找下一个</span>
requirepass <span class="token number">123456</span>
</code></pre></div><p>在登录redis后验证密码即可操作数据</p> <div class="language-bash extra-class"><pre class="language-bash"><code>auth <span class="token string">&quot;123456&quot;</span>

<span class="token comment">#或在启动时验证，这样并不安全，因为密码可见</span>
redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token parameter variable">-a</span> <span class="token number">123456</span>
</code></pre></div><p>可视化工具：<a href="https://gitee.com/qishibo/AnotherRedisDesktopManager" target="_blank" rel="nofollow noopener noreferrer">Another Redis Desktop Manager<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>基本使用</p> <table><thead><tr><th>命令</th> <th>解释</th></tr></thead> <tbody><tr><td>set name NorthBoat</td> <td>设置键值对{name: NorthBoat}</td></tr> <tr><td>get name</td> <td>获取键的值</td></tr> <tr><td>del name</td> <td>删除键值对</td></tr> <tr><td>exists name</td> <td>检查键是否存在</td></tr> <tr><td>expire name seconds</td> <td>为键设置过期时间，单位s（注意在设置完键值后使用）</td></tr> <tr><td>move name db</td> <td>将当前库的name转移到指定的数据库db中</td></tr> <tr><td>ttl name</td> <td>返回name剩余时间，单位为s</td></tr> <tr><td>persist name</td> <td>移除name的过期时间</td></tr> <tr><td>rename name n</td> <td>将键name改名为n</td></tr> <tr><td>flushdb</td> <td>刷新redis，清除所有键值</td></tr></tbody></table> <p>键规范：Redis 的键命名有一套业界推荐的规范，即采用<strong>冒号</strong>作为分隔符表示数据的层级关系</p> <p>一套常用的结构模板</p> <table><thead><tr><th>类型</th> <th>命名规则</th> <th>示例</th></tr></thead> <tbody><tr><td>用户 Token 存储</td> <td><code>login:token:{token}</code></td> <td><code>login:token:abc123</code></td></tr> <tr><td>用户 ID 映射 Token</td> <td><code>login:user:{userId}</code></td> <td><code>login:user:u001</code></td></tr> <tr><td>缓存（对象）</td> <td><code>cache:{业务}:{标识}</code></td> <td><code>cache:user:u001</code></td></tr> <tr><td>限流</td> <td><code>rate_limit:{类型}:{标识}</code></td> <td><code>rate_limit:ip:127.0.0.1</code></td></tr> <tr><td>队列</td> <td><code>queue:{业务}</code></td> <td><code>queue:email</code></td></tr> <tr><td>计数器</td> <td><code>counter:{业务}:{标识}</code></td> <td><code>counter:login_fail:u001</code></td></tr> <tr><td>分布式锁</td> <td><code>lock:{资源}</code></td> <td><code>lock:order:123456</code></td></tr> <tr><td>会话管理</td> <td><code>session:{sessionId}</code></td> <td><code>session:sess_abc123</code></td></tr></tbody></table> <h3 id="缓存数据库"><a href="#缓存数据库" class="header-anchor">#</a> 缓存数据库</h3> <p>基于内存的 KV 数据库，支持高速读写，常用作关系型数据库的缓存</p> <p>String：从<code>Redis</code>中取出的字符串在<code>Java</code>程序中会显示为<code>&quot;NorthBoat&quot;</code>的形式，要加转义字符<code>\&quot;</code>表示双引号</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> <span class="token keyword">set</span> name NorthBoat
OK
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>

<span class="token comment"># 批量设置</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mset id <span class="token number">4</span> grade <span class="token number">11</span>
OK
<span class="token comment"># 批量获取</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mget id grade
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;4&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;11&quot;</span>
</code></pre></div><p>List</p> <p>向左插入队列</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> redis
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> mysql
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">2</span>
</code></pre></div><p>查看队列</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrange <span class="token builtin class-name">test</span> <span class="token number">0</span> <span class="token number">10</span>
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;redis&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;mysql&quot;</span>
</code></pre></div><p>查看队列长度</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> llen <span class="token builtin class-name">test</span>
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">2</span>
</code></pre></div><p>删除元素</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token comment"># 1 表示从左向右找第一个元素删</span>
<span class="token comment"># -1 表示从右向左找第一个元素删</span>
<span class="token comment"># 0 表示把该元素删完</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrem <span class="token builtin class-name">test</span> <span class="token number">1</span> mysql
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>

<span class="token comment"># # 从 start 删到 end，若 start &gt; end 则删完</span>

</code></pre></div><p>ACID 原则：原子性、一致性、隔离性、持久性</p> <ul><li>redis 单条命令保证原子性，但 redis 事物不保证原子性</li> <li>redis 事务没有隔离级别的概念，所有命令在事务中并没有直接被执行，只有发起执行命令的时候才会执行（exec）</li></ul> <p>redis 事务的一次正常执行</p> <ul><li>开启事务：multi</li> <li>命令入队：依次写命令</li> <li>执行事务：exec</li></ul> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi

</code></pre></div><p>redis 可以实现乐观锁，使用 watch 实现</p> <h3 id="jedis"><a href="#jedis" class="header-anchor">#</a> Jedis</h3> <p>导入依赖</p> <div class="language-xml extra-class"><pre class="language-xml"><code><span class="token comment">&lt;!-- https://mvnrepository.com/artifact/redis.clients/jedis --&gt;</span>

    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>redis.clients<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>jedis<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>4.1.1<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre></div><p>基本使用：方法名与<code>Redis</code>命令保持一致，返回值同样保持一致，告知操作结果</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Listener</span> <span class="token punctuation">{</span>
    
    <span class="token keyword">private</span> <span class="token class-name">Jedis</span> jedis<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> url <span class="token operator">=</span> <span class="token string">&quot;39.106.160.174&quot;</span><span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">int</span> port <span class="token operator">=</span> <span class="token number">6379</span><span class="token punctuation">;</span>


    <span class="token keyword">private</span> <span class="token keyword">int</span> <span class="token function">initRedis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">try</span><span class="token punctuation">{</span>
            jedis <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Jedis</span><span class="token punctuation">(</span>url<span class="token punctuation">,</span> port<span class="token punctuation">)</span><span class="token punctuation">;</span>
            jedis<span class="token punctuation">.</span><span class="token function">auth</span><span class="token punctuation">(</span><span class="token string">&quot;011026&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name"><span class="token namespace">redis<span class="token punctuation">.</span>clients<span class="token punctuation">.</span>jedis<span class="token punctuation">.</span>exceptions<span class="token punctuation">.</span></span>JedisConnectionException</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token comment">// 若没连接上，将报此错</span>
            <span class="token keyword">return</span> <span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token number">200</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">test</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">String</span> str <span class="token operator">=</span> jedis<span class="token punctuation">.</span><span class="token function">set</span><span class="token punctuation">(</span><span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;hahaha&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//OK</span>

        <span class="token keyword">long</span> r2 <span class="token operator">=</span> jedis<span class="token punctuation">.</span><span class="token function">del</span><span class="token punctuation">(</span><span class="token string">&quot;1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//1</span>
        <span class="token keyword">long</span> r3 <span class="token operator">=</span> jedis<span class="token punctuation">.</span><span class="token function">del</span><span class="token punctuation">(</span><span class="token string">&quot;2&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//0</span>
        <span class="token keyword">long</span> r4 <span class="token operator">=</span> jedis<span class="token punctuation">.</span><span class="token function">del</span><span class="token punctuation">(</span><span class="token string">&quot;3&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//0</span>
        jedis<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>事务：<code>Transaction multi = jedis.multi()</code></p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Listener</span> <span class="token punctuation">{</span>
    
    <span class="token keyword">private</span> <span class="token class-name">Jedis</span> jedis <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Jedis</span><span class="token punctuation">(</span><span class="token string">&quot;39.106.160.174&quot;</span><span class="token punctuation">,</span> <span class="token number">6379</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">test</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">Transaction</span> multi <span class="token operator">=</span> jedis<span class="token punctuation">.</span><span class="token function">multi</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">JSONObject</span> jsonObject <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">JSONObject</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        jsonObject<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;sad&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;NorthBoat&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        jsonObject<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;hello&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;hahaha&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">String</span> jsonString <span class="token operator">=</span> jsonObject<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">try</span><span class="token punctuation">{</span>
            multi<span class="token punctuation">.</span><span class="token function">set</span><span class="token punctuation">(</span><span class="token string">&quot;user1&quot;</span><span class="token punctuation">,</span> jsonString<span class="token punctuation">)</span><span class="token punctuation">;</span>
            multi<span class="token punctuation">.</span><span class="token function">set</span><span class="token punctuation">(</span><span class="token string">&quot;user2&quot;</span><span class="token punctuation">,</span> jsonString<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">1</span><span class="token operator">/</span><span class="token number">0</span><span class="token punctuation">;</span> <span class="token comment">//当出现错误，捕获异常后discard，整个事务全不会生效</span>
            multi<span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
            multi<span class="token punctuation">.</span><span class="token function">discard</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token keyword">finally</span> <span class="token punctuation">{</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>jedis<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;user1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>jedis<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;user2&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            jedis<span class="token punctuation">.</span><span class="token function">del</span><span class="token punctuation">(</span><span class="token string">&quot;user1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            jedis<span class="token punctuation">.</span><span class="token function">del</span><span class="token punctuation">(</span><span class="token string">&quot;user2&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            jedis<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">Listener</span> listener <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Listener</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        listener<span class="token punctuation">.</span><span class="token function">initRedis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        listener<span class="token punctuation">.</span><span class="token function">test</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h2 id="orm-框架"><a href="#orm-框架" class="header-anchor">#</a> ORM 框架</h2> <p>ORM 框架，即 Object-Relational Mapping，对象关系映射框架，用对象映射关系代替 SQL 语句编写</p> <p>参见 <a href="https://northboat.github.io/pages/2d1368/#spring-date" target="_blank" rel="nofollow noopener noreferrer">Spring Boot 基础 - Spring Data | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="内存数据库-h2db"><a href="#内存数据库-h2db" class="header-anchor">#</a> 内存数据库 H2DB</h2> <blockquote><p><a href="https://juejin.cn/post/6844903625039282183" target="_blank" rel="nofollow noopener noreferrer">h2db新手入门篇——概念及初步使用 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>关系型内存数据库，存储关系型数据（和 MySQL）一样，数据默认存在内存中（和 Redis 一样），目前主流的内存数据库有以下</p> <ol><li>关系型内存数据库：作为传统数据库应用层数据的缓存，支持 sql 语句访问数据库中的数据，提供有限的事务保证，例如 h2db</li> <li>键值对内存数据库：键值对存储结果，按 key 进行读取，value 支持各种数据类型，比如 redis</li> <li>传统数据库的内核引擎：在数据库层面提供了数据库引擎机制，最大程度减少磁盘 IO；支持事务和数据持久化保证，但对数据类型有限制，如 MySQL Memory Engine</li></ol> <h3 id="h2db-概述"><a href="#h2db-概述" class="header-anchor">#</a> H2DB 概述</h3> <p>官网下载：<a href="http://www.h2database.com/html/download.html" target="_blank" rel="nofollow noopener noreferrer">Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>h2db 是纯 Java 编写的内存数据库，是一个开源项目，其源码都打包在 jar 文件中，目前稳定的最新版本 h2-1.4.196.jar 只有 1.8M 左右</p> <p>h2db 有两种工作方式：嵌入式模式和服务器模式</p> <ul><li>嵌入式运行模式：数据库作为整个应用的一部分，数据库 server 和应用运行在一个进程中；应用结束时，h2db server 也会关闭</li> <li>服务器运行模式：数据库 server 运行在独立的进程中，应用通过连接和数据库 server 建立联系。该模式下又有三种连接方式，分别是 web  server 模式、TCP  server 模式，PG server 模式（PostgreSQL clients），在启动 h2db 服务时通过参数指定工作模式</li></ul> <p>由于在服务器模式下，数据要通过 TCP/IP 相关协议完成传输，所以工作效率可能低于嵌入模式</p> <p>这两种模式还可以混合使用，即工作在嵌入式模式下的 h2db 允许其他应用连接，这样就是一种混合模式了。无论在哪种模式下，h2db 都支持都支持持久（persistence）和内存临时数据库（in-memory）</p> <img src="E:\File\Repo\cur\northboat.github.io\docs\02.开发与运维\02.运维\02.中间件\assets\h2db-mixed-mode.png"> <h3 id="嵌入式模式"><a href="#嵌入式模式" class="header-anchor">#</a> 嵌入式模式</h3> <h3 id="服务器模式"><a href="#服务器模式" class="header-anchor">#</a> 服务器模式</h3> <h2 id="现代数据库-postgresql"><a href="#现代数据库-postgresql" class="header-anchor">#</a> 现代数据库 PostgreSQL</h2> <h3 id="b-link-树索引"><a href="#b-link-树索引" class="header-anchor">#</a> B-Link 树索引</h3> <p>一颗变种的 B+ 树，之前也说过，B+ 是就是一个叶子节点间存在链路的 B 树</p> <p>而在 B-Link 树中，其每一层的分支节点之间同样存在向右的单向链路，这样可以有效避免回退根节点搜索右子树的操作，即可以直接从左子树跳转到右子树</p> <h3 id="postmaster-和-postgres"><a href="#postmaster-和-postgres" class="header-anchor">#</a> Postmaster 和 Postgres</h3> <p>每个数据库连接都会新起一个后端进程（Postgres），各个后端进程之间相互独立，Postmaster 作为主进程（类似于 Docker Demon），管理各个后端进程的连接和释放</p> <h3 id="共享内存"><a href="#共享内存" class="header-anchor">#</a> 共享内存</h3> <p>对于每个相互独立的连接 Postgres，我们不可能为他们每一个都维护一个内存区域以供读写，这样太过于浪费，于是在磁盘和后端进程之间会多加一层共享内存</p> <p>后端进程收到读写命令后，会先到共享内存中去进行查找，如果查找失败，则从磁盘中将相关内容读入共享内存</p> <h3 id="wal-机制和后台进程"><a href="#wal-机制和后台进程" class="header-anchor">#</a> WAL 机制和后台进程</h3> <p>Write Ahead Logging，解决共享内存与磁盘的同步更新问题</p> <p>其核心原理是，顺序写入比离散写入快无数倍，所以在写入磁盘之前会先顺序写 WAL 日志，等到有充足时间后，再将 WAF 文件依次写入磁盘</p> <h3 id="模块化扩展"><a href="#模块化扩展" class="header-anchor">#</a> 模块化扩展</h3> <p>为了支持多种索引，后端进程中的优化器、执行器以及 Access Methods 被设计为开放接口</p> <ul><li>优化器指 SQL 语句解析后的优化程序</li> <li>执行器指执行具体机器码数据库操作的程序</li> <li>Access Methods 是 PostgreSQL 向后端进程提供的 API</li></ul> <p>通过扩写优化器、执行器插件的形式，PostgreSQL 可以支持多种索引，例如</p> <ul><li>向量数据库（VectorSQL）</li> <li>图数据库</li></ul> <h2 id="分布式数据库-tidb"><a href="#分布式数据库-tidb" class="header-anchor">#</a> 分布式数据库 TiDB</h2></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2025/12/22, 12:57:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/040068/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">测试开发基础</div></a> <a href="/pages/d7c3d3/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">容器技术</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
