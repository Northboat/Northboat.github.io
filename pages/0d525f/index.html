<span class="token function">service</span> mysqld restart
<span class="token function">service</span> mysql restart <span class="token comment"># 某些版本</span>
</code></pre></div><p>启动命令行客户端：<code>mysql -u root -p</code></p> <div class="language-sh extra-class"><pre class="language-sh"><code><span class="token comment">#本地机</span>
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>

<span class="token comment">#远端机</span>
mysql <span class="token parameter variable">-h</span> <span class="token function">ip</span> <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>

<span class="token comment">#再输入密码即可登录命令行客户端</span>
</code></pre></div><h3 id="库表操作"><a href="#库表操作" class="header-anchor">#</a> 库表操作</h3> <p>创建数据库：<code>create database database_name;</code></p> <div class="language-sql extra-class"><pre class="language-sql"><code>mysql<span class="token operator">&gt;</span> <span class="token keyword">create</span> <span class="token keyword">database</span> Book<span class="token punctuation">;</span>

    <span class="token identifier"><span class="token punctuation">`</span>birthday<span class="token punctuation">`</span></span> <span class="token keyword">datetime</span> <span class="token keyword">default</span> <span class="token boolean">null</span> <span class="token keyword">comment</span> <span class="token string">'出生日期'</span><span class="token punctuation">,</span>

<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>

<span class="token keyword">show</span> <span class="token keyword">tables</span><span class="token punctuation">;</span>

<span class="token keyword">show</span> <span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

<span class="token keyword">desc</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">;</span>
</code></pre></div><p>修改表属性</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token comment">#修改表名</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span> <span class="token keyword">rename</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

</code></pre></div><p>导入 .sql 文件中的 SQL 语句：<code>sourse + 文件路径</code></p> <p>删除数据库或表</p> <ol><li><code>drop database + 库名;</code></li> <li><code>drop table + 表名;</code></li></ol> <p>图形界面管理：下载解压 SQLyog</p> <p>点击运行并注册</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">名称</span><span class="token punctuation">:</span> <span class="token string">&quot;kuangshen&quot;</span>

</code></pre></div><p>绑定本机 MySQL：</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">主机地址</span><span class="token punctuation">:</span> <span class="token string">&quot;localhost&quot;</span>

</code></pre></div><p>可视化工具</p> <div class="language-bash extra-class"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> mysql-workbench
</code></pre></div><h3 id="数据表引擎"><a href="#数据表引擎" class="header-anchor">#</a> 数据表引擎</h3> <table><thead><tr><th>区别</th> <th>MyISAM</th> <th>InnoDB</th></tr></thead> <tbody><tr><td>事务支持</td> <td>不支持</td> <td>支持</td></tr> <tr><td>外键约束</td> <td>不支持</td> <td>支持</td></tr> <tr><td>全文索引</td> <td>支持</td> <td>不支持</td></tr> <tr><td>数据行锁定</td> <td>不支持</td> <td>支持</td></tr> <tr><td>表空间大小</td> <td>较小</td> <td>较大，约为前者两倍</td></tr></tbody></table> <p>简单来说</p> <ul><li>MyISAM 更轻便（节约空间）、更快</li> <li>InnoDB 安全性高，支持事务处理，支持多表多用户操作（外键、多行同时操作），功能更丰富</li></ul> <p>数据库的本质仍是文件存储，储存在 data 文件夹下，一个文件夹对应一个数据库</p> <p>MySQL 引擎在物理文件上的区别</p> <ul><li>InnoDB 中数据库表中只有一个<code>*.frm</code>以及上级目录下的<code>ibdata1</code>文件</li> <li>MyISAM 对应的文件
<ul><li>*.frm 表结构的定义文件</li> <li>*.MYD 数据文件（data）</li> <li>*.MYI 索引文件</li></ul></li></ul> <p>表默认的字符集编码并不支持中文，要手动设置</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">default</span> <span class="token keyword">charset</span><span class="token operator">=</span>utf8
</code></pre></div><h3 id="主键与外键"><a href="#主键与外键" class="header-anchor">#</a> 主键与外键</h3> <p>外键：在创建时绑定约束设置外键</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>grade<span class="token punctuation">`</span></span><span class="token punctuation">(</span>

    <span class="token comment">#设置外键</span>

<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>
</code></pre></div><p>在删除有外键关系的表时，必须删除引用别人的表（从表），再删除主表</p> <p>在创建后设置外键关系</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>grade<span class="token punctuation">`</span></span><span class="token punctuation">(</span>

    <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>gradeid<span class="token punctuation">`</span></span><span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>

<span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
	<span class="token identifier"><span class="token punctuation">`</span>id<span class="token punctuation">`</span></span> <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span> <span class="token keyword">auto_increment</span> <span class="token keyword">comment</span> <span class="token string">'学号'</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>name<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">30</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span> <span class="token keyword">default</span> <span class="token string">'匿名'</span> <span class="token keyword">comment</span> <span class="token string">'姓名'</span><span class="token punctuation">,</span>

    <span class="token identifier"><span class="token punctuation">`</span>birthday<span class="token punctuation">`</span></span> <span class="token keyword">datetime</span> <span class="token keyword">default</span> <span class="token boolean">null</span> <span class="token keyword">comment</span> <span class="token string">'出生日期'</span><span class="token punctuation">,</span>
    <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>id<span class="token punctuation">`</span></span><span class="token punctuation">)</span> <span class="token comment">#设置主键，莫忘辽</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>

<span class="token comment">#修改已有表的外键关系</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span>
<span class="token keyword">add</span> <span class="token keyword">constraint</span> <span class="token identifier"><span class="token punctuation">`</span>FK_gradeid<span class="token punctuation">`</span></span> <span class="token keyword">foreign</span> <span class="token keyword">key</span><span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>gradeid<span class="token punctuation">`</span></span><span class="token punctuation">)</span> <span class="token keyword">references</span> <span class="token identifier"><span class="token punctuation">`</span>grade<span class="token punctuation">`</span></span> <span class="token punctuation">(</span><span class="token identifier"><span class="token punctuation">`</span>gradeid<span class="token punctuation">`</span></span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>以上都是物理外键，数据库级别的外键不建议使用，避免数据库过多造成臃肿</p> <p>最佳实践</p> <ul><li>数据库就是单纯的表，只用来存数据，只有行（数据）列（字段）</li> <li>我们想使用多张表的数据，想使用外键，我们用程序去实现（一段逻辑）</li></ul> <p>DML：参考SQL语句编写</p> <h3 id="b-树索引"><a href="#b-树索引" class="header-anchor">#</a> B+ 树索引</h3> <blockquote><p>MySQL 的索引结构</p></blockquote> <p>B 树</p> <ul><li>叶子节点具有相同深度，叶节点指针为空</li> <li>索引元素不重复</li> <li>节点中数据索引从左到右递增</li></ul> <p>B+ 树：叶子节点间存在横向链路的 B 树</p> <img src="/assets/img/1176659-20190124170518912-630934803.8182c82f.png"> <h3 id="orm-框架"><a href="#orm-框架" class="header-anchor">#</a> ORM 框架</h3> <p>ORM（Object-Relational Mapping），对象关系映射框架，用对象映射关系代替 SQL 语句编写</p> <p>详见 <a href="https://northboat.github.io/pages/2d1368/#spring-date" target="_blank" rel="nofollow noopener noreferrer">Spring Boot 基础 - Spring Data | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="mvcc-多版本并发控制"><a href="#mvcc-多版本并发控制" class="header-anchor">#</a> MVCC 多版本并发控制</h3> <p>MVCC（Multi-Version Concurrency Control），多版本并发控制，是MySQL中被广泛采用的并发控制机制，它通过版本管理（维护多个版本快照）让读写互不阻塞，并实现事务的隔离</p> <p>核心机制：用<strong>版本快照</strong>替代锁阻塞，依赖 3 个关键组件，事务版本号、数据版本链和 Read View（读视图）</p> <p>事务版本号</p> <ul><li>数据库会为每个事务分配一个唯一递增的事务 ID（<code>transaction_id</code>），事务开始时生成</li> <li>数据的每次修改（INSERT/UPDATE/DELETE） 都会生成一个新的数据版本，并更新当前事务 ID 为新版本号</li></ul> <p>数据版本链：以 InnoDB 为例，每行数据的物理存储包含 3 个隐藏字段</p> <table><thead><tr><th style="text-align:center;">隐藏字段</th> <th style="text-align:center;">作用</th></tr></thead> <tbody><tr><td style="text-align:center;"><code>DB_TRX_ID</code></td> <td style="text-align:center;">最后一次修改该数据的事务 ID</td></tr> <tr><td style="text-align:center;"><code>DB_ROLL_PTR</code></td> <td style="text-align:center;">回滚指针，指向该数据的<strong>上一个历史版本</strong></td></tr> <tr><td style="text-align:center;"><code>DB_ROW_ID</code></td> <td style="text-align:center;">行唯一标识（无主键时自动生成）</td></tr></tbody></table> <p>通过当前事务 ID 和回滚指针能够轻松定位当前行数据的操作链（链表结构）</p> <p>Read View：当事务执行快照读（普通 <code>SELECT</code>，不加锁）时，数据库会生成一个 Read View，包含 4 个核心参数</p> <ul><li><code>m_ids</code>：当前活跃事务 ID 列表（未提交的事务）</li> <li><code>min_trx_id</code>：<code>m_ids</code>中的最小事务 ID</li> <li><code>max_trx_id</code>：下一个即将分配的事务 ID</li> <li><code>creator_trx_id</code>：生成该 Read View 的事务 ID</li></ul> <p>Read View 的可见性规则（判断数据版本是否对当前事务可见）</p> <ol><li>若数据版本的 <code>DB_TRX_ID == creator_trx_id</code> → 自己修改的，可见</li> <li>若 <code>DB_TRX_ID &lt; min_trx_id</code> → 事务已提交，可见</li> <li>若 <code>DB_TRX_ID &gt;= max_trx_id</code> → 事务在 Read View 生成后开启，不可见</li> <li>若 <code>min_trx_id ≤ DB_TRX_ID &lt; max_trx_id</code> → 若 <code>DB_TRX_ID</code> 在 <code>m_ids</code> 中（事务活跃），不可见，否则可见</li></ol> <p>如果当前版本不可见，就通过<code>DB_ROLL_PTR</code>回溯版本链，直到找到第一个可见版本</p> <p>也就是说，MVCC 通过管理事务状态，如果当前数据“正在被写”不允许读（读写锁的功能），那么就会通过事务回滚找到之前的版本返回，这样就能实现“写时可读”的需求</p> <h3 id="延时双删和-binlog-异步双删"><a href="#延时双删和-binlog-异步双删" class="header-anchor">#</a> 延时双删和 Binlog 异步双删</h3> <h4 id="缓存数据一致性"><a href="#缓存数据一致性" class="header-anchor">#</a> 缓存数据一致性</h4> <p>假设我现在有一个高频数据表，用户的每次“读”都会先查询 Redis 数据库，看看有没有缓存，如果有就直接拿，如果无就去打 MySQL 数据库，拿到数据后，将数据存入 Redis 缓存，再返回</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 拿缓存</span>
<span class="token class-name">User</span> cache <span class="token operator">=</span> redisService<span class="token punctuation">.</span><span class="token function">getCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>cache <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> cache<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token comment">// 拿数据库</span>
<span class="token class-name">User</span> user <span class="token operator">=</span> userService<span class="token punctuation">.</span><span class="token function">getUserById</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>user <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">CustomException</span><span class="token punctuation">(</span><span class="token string">&quot;User not found&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token comment">// 存缓存</span>
redisService<span class="token punctuation">.</span><span class="token function">setCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">return</span> user<span class="token punctuation">;</span>
</code></pre></div><p>OK，看起来非常正常，但马上就会出现问题，考虑这样一个场景</p> <ul><li>现在用户 1 需要“写”一个数据项</li> <li>同时另一个用户 2 并发的想“读”这条数据</li></ul> <p>显然，如果不做任何处理，处理的结果会是这样</p> <ol><li>用户 1 成功的更改了 MySQL 中数据</li> <li>用户 2 成功的命中了缓存</li></ol> <p>但用户 2 拿到的永远会是缓存中的脏数据</p> <p>那么显然，在用户“写” MySQL 数据时，我一定要把这条数据对应的缓存从 Redis 里面删掉，于是现在的写流程变为</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 删缓存</span>
redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 写数据库</span>
userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre></div><p>这样，再读的时候，缓存将命中不了，用户 2 会从 MySQL 中拿到最新的数据</p> <h4 id="延时双删"><a href="#延时双删" class="header-anchor">#</a> 延时双删</h4> <p>OK，看起来非常完美，但马上又会出现问题，众所周知，写是需要时间的，假设</p> <ol><li>用户 1 在写的这条数据（还没写完），此时用户 2 来读这条数据，由于 MySQL 的 MVCC 机制，MySQL 将返回上一版本的数据</li> <li>这样，后端将会拿到一条上个版本的脏数据，继而把他存入 Redis 缓存，最后返回给前端</li> <li>之后的每次查询，都会命中 Redis 缓存中的脏数据返回，而不会去找 MySQL 的新数据</li></ol> <p>于是又发生了第一个场景中的问题，用户 2 将始终命中缓存，返回脏数据</p> <p>所以很自然的，提出了一个“双删”的办法，简单来说，就是在写之前删一次缓存，写之后再删一次缓存，这样无论其他并发怎么写缓存，脏数据的缓存都会被删掉</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 延时</span>
    <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 再删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>可以注意到这里 sleep 了 1 秒，这是因为在后端，我无法判断 MySQL “到底写完没”，所以只能采取简单的线程等待，再去执行删除</p> <ul><li>sleep 的时间实际上取决于“完成写事务”的时间，因为第二次删除是防止从“开始写”到“写完”这段时间的读取，将 MVCC 上一版本的脏数据缓存到 Redis</li></ul> <p>有个问题，我都延时删缓存了，为什么不直接去更新缓存，这样能保证下次命中还不用等？</p> <ul><li>和缓存的存储逻辑严重不符，这样做的结果就是，每次写都会同步写缓存，读写对于 Redis 都变成了增量操作，相当于把 MySQL 整个搬到 Redis 里，那我为什么不直接用 Redis 存，脑瘫了</li></ul> <p>但这样的同步阻塞，对于高并发场景显然是极大的负担</p> <h4 id="binlog-异步双删"><a href="#binlog-异步双删" class="header-anchor">#</a> Binlog 异步双删</h4> <p>既然同步阻塞不行，我们可以考虑异步删除</p> <ul><li>MySQL 的 Binlog（二进制日志）记录了数据库的所有数据变更操作（如 INSERT、UPDATE 和 DELETE），对数据恢复、主从复制和审计非常重要</li></ul> <p>查看 Binlog 文件</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">SHOW</span> MASTER <span class="token keyword">STATUS</span><span class="token punctuation">;</span>
</code></pre></div><p>每当写操作之后，通过查看解析 Binlog 内容，将删除缓存的事件通过 MQ 发布，消费者 Comsumer 对相应的缓存进行删除，也就是说，双删的第二次删，通过 Binlog 事件驱动 MQ 消费者异步处理</p> <p>这样，在我的后端，每次写之后，进行一条消息推送，然后正常返回即可</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 推送第二次删除</span>
    rabbitMqService<span class="token punctuation">.</span><span class="token function">pushDeleteCacheEvent</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>一个题外话，try - catch - finally 的执行顺序</p> <ul><li>try 中无异常，则 try → finally</li> <li>try 中有异常，则 try → catch → finally</li> <li>try 中无异常但有 return 语句，则 try → finally → return</li> <li>try 中有异常且有 return 语句，则 try → catch → finally → return</li> <li>try 中有异常且有 return 语句，catch 中有 throw 语句，则 try → catch → finally → throw</li></ul> <p>所以不会在 finally 中 return，只是做资源关闭等操作</p> <h2 id="内存数据库-h2db"><a href="#内存数据库-h2db" class="header-anchor">#</a> 内存数据库 H2DB</h2> <blockquote><p><a href="https://juejin.cn/post/6844903625039282183" target="_blank" rel="nofollow noopener noreferrer">h2db新手入门篇——概念及初步使用 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>关系型内存数据库，存储关系型数据（和 MySQL）一样，数据默认存在内存中（和 Redis 一样），目前主流的内存数据库有以下</p> <ol><li>关系型内存数据库：作为传统数据库应用层数据的缓存，支持 sql 语句访问数据库中的数据，提供有限的事务保证，例如 h2db</li> <li>键值对内存数据库：键值对存储结果，按 key 进行读取，value 支持各种数据类型，比如 redis</li> <li>传统数据库的内核引擎：在数据库层面提供了数据库引擎机制，最大程度减少磁盘 IO；支持事务和数据持久化保证，但对数据类型有限制，如 MySQL Memory Engine</li></ol> <p>官网下载：<a href="http://www.h2database.com/html/download.html" target="_blank" rel="nofollow noopener noreferrer">Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>h2db 是纯 Java 编写的开源内存数据库，其源码都打包在 jar 文件中，目前稳定的最新版本 h2-1.4.196.jar 只有 1.8M 左右</p> <p>h2db 有两种工作方式：嵌入式模式和服务器模式</p> <ul><li>嵌入式运行模式：数据库作为整个应用的一部分，数据库 server 和应用运行在一个进程中；应用结束时，h2db server 也会关闭</li> <li>服务器运行模式：数据库 server 运行在独立的进程中，应用通过连接和数据库 server 建立联系。该模式下又有三种连接方式，分别是 web  server 模式、TCP  server 模式，PG server 模式（PostgreSQL clients），在启动 h2db 服务时通过参数指定工作模式</li></ul> <p>由于在服务器模式下，数据要通过 TCP/IP 相关协议完成传输，所以工作效率可能低于嵌入模式</p> <p>这两种模式还可以混合使用，即工作在嵌入式模式下的 h2db 允许其他应用连接，这样就是一种混合模式了。无论在哪种模式下，h2db 都支持都支持持久（persistence）和内存临时数据库（in-memory）</p> <img src="/assets/img/h2db-mixed-mode.e973d97b.png"> <h2 id="后现代数据库-postgresql"><a href="#后现代数据库-postgresql" class="header-anchor">#</a> 后现代数据库 PostgreSQL</h2> <h3 id="b-link-树索引"><a href="#b-link-树索引" class="header-anchor">#</a> B-Link 树索引</h3> <p>PostgreSQL 的底层数据结构，一颗变种的 B+ 树，之前也说过，B+ 是就是一个叶子节点间存在链路的 B 树</p> <p>而在 B-Link 树中，其每一层的分支节点之间同样存在向右的单向链路，这样可以有效避免回退根节点搜索右子树的操作，即可以直接从左子树跳转到右子树</p> <h3 id="postmaster-和-postgres"><a href="#postmaster-和-postgres" class="header-anchor">#</a> Postmaster 和 Postgres</h3> <p>每个数据库连接都会新起一个后端进程（Postgres），各个后端进程之间相互独立，Postmaster 作为主进程（类似于 Docker Demon），管理各个后端进程的连接和释放</p> <h3 id="共享内存"><a href="#共享内存" class="header-anchor">#</a> 共享内存</h3> <p>对于每个相互独立的连接 Postgres，我们不可能为他们每一个都维护一个内存区域以供读写，这样太过于浪费，于是在磁盘和后端进程之间会多加一层共享内存</p> <p>后端进程收到读写命令后，会先到共享内存中去进行查找，如果查找失败，则从磁盘中将相关内容读入共享内存</p> <h3 id="wal-机制和后台进程"><a href="#wal-机制和后台进程" class="header-anchor">#</a> WAL 机制和后台进程</h3> <p>Write Ahead Logging，解决共享内存与磁盘的同步更新问题</p> <p>其核心原理是，顺序写入比离散写入快无数倍，所以在写入磁盘之前会先顺序写 WAL 日志，等到有充足时间后，再将 WAF 文件依次写入磁盘</p> <h3 id="向量数据库扩展"><a href="#向量数据库扩展" class="header-anchor">#</a> 向量数据库扩展</h3> <p>为了支持多种索引，后端进程中的优化器、执行器以及 Access Methods 被设计为开放接口</p> <ul><li>优化器指 SQL 语句解析后的优化程序</li> <li>执行器指执行具体机器码数据库操作的程序</li> <li>Access Methods 是 PostgreSQL 向后端进程提供的 API</li></ul> <p>通过扩写优化器、执行器插件的形式，PostgreSQL 可以支持多种索引，例如</p> <ul><li><strong>向量数据库（VectorSQL）</strong></li> <li>图数据库</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/01/18, 15:29:13</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/040068/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">测试开发基础</div></a> <a href="/pages/aee6d6/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">键值数据库</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
