</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>导入 .sql 文件中的 SQL 语句：<code>sourse + 文件路径</code></p> <p>删除数据库或表</p> <ol><li><code>drop database + 库名;</code></li> <li><code>drop table + 表名;</code></li></ol> <p>图形界面管理</p> <ul><li>SQLyog</li> <li>IDEA 自带的数据库管理</li> <li>DataGrip</li></ul> <h3 id="orm-框架"><a href="#orm-框架" class="header-anchor">#</a> ORM 框架</h3> <p>ORM（Object-Relational Mapping），对象关系映射框架，用对象映射关系代替 SQL 语句编写</p> <ul><li>Spring Data 内置了 Java 的 ORM，例如 JPA，可见 <a href="https://northboat.github.io/pages/2d1368/#spring-date" target="_blank" rel="nofollow noopener noreferrer">Spring Boot 基础 - Spring Data | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，或者熟知 MyBatis（使用 xml 作为 SQL 的载体）</li> <li>Golang 而言，基本上就是 GORM，采用的是和 JPA 类似的“参数化查询”，可以在一定程度上避免拼接 SQL 带来的注入风险</li></ul> <p>一个超绝 SQL 示例，狠狠的 left join</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetQueueList ...</span>
<span class="token keyword">func</span> <span class="token function">GetQueueList</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> db <span class="token operator">*</span>database<span class="token punctuation">.</span>GormDb<span class="token punctuation">,</span> queueType <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>EnvironmentQueue<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        rows<span class="token punctuation">,</span> err <span class="token operator">:=</span> db<span class="token punctuation">.</span><span class="token function">Table</span><span class="token punctuation">(</span><span class="token string">&quot;environmentQueue&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Joins</span><span class="token punctuation">(</span><span class="token string">&quot;left join userInfo on environmentQueue.username = userInfo.username&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Joins</span><span class="token punctuation">(</span><span class="token string">&quot;inner join devEnvironmentInstance on environmentQueue.envId = devEnvironmentInstance.uid&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;queueType = ? and environmentQueue.status = ? and devEnvironmentInstance.status in (?)&quot;</span><span class="token punctuation">,</span>
                        queueType<span class="token punctuation">,</span> <span class="token string">&quot;active&quot;</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span><span class="token string">&quot;queuing&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;queue_start&quot;</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Order</span><span class="token punctuation">(</span><span class="token string">&quot;environmentQueue.priority desc, environmentQueue.createdAt asc&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Select</span><span class="token punctuation">(</span><span class="token string">`environmentQueue.uid, environmentQueue.username, environmentQueue.EnvId, 
                                           environmentQueue.QueueType, environmentQueue.CreatedAt, environmentQueue.UpdatedAt, 
                                        environmentQueue.status, environmentQueue.action, environmentQueue.params, userInfo.groupId,
                                        userInfo.groupName, devEnvironmentInstance.envConfigTypeId, environmentQueue.priority, 
                                        devEnvironmentInstance.status, devEnvironmentInstance.region`</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Rows</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询gpu队列失败, err: %+v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
                <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>

        queueList <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>EnvironmentQueue<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span>
        <span class="token keyword">for</span> rows<span class="token punctuation">.</span><span class="token function">Next</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">var</span> groupId sql<span class="token punctuation">.</span>NullInt32
                <span class="token keyword">var</span> groupName sql<span class="token punctuation">.</span>NullString
                item <span class="token operator">:=</span> <span class="token operator">&amp;</span>EnvironmentQueue<span class="token punctuation">{</span><span class="token punctuation">}</span>
                <span class="token keyword">if</span> err <span class="token operator">=</span> rows<span class="token punctuation">.</span><span class="token function">Scan</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Uid<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Username<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>EnvId<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>QueueType<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>CreatedAt<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>UpdatedAt<span class="token punctuation">,</span>
                        <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Status<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Action<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Params<span class="token punctuation">,</span> <span class="token operator">&amp;</span>groupId<span class="token punctuation">,</span> <span class="token operator">&amp;</span>groupName<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>EnvConfigTypeId<span class="token punctuation">,</span>
                        <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Priority<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>EnvStatus<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Region<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询gpu队列失败, err: %+v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
                        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
                <span class="token punctuation">}</span>
                item<span class="token punctuation">.</span>GroupId <span class="token operator">=</span> groupId<span class="token punctuation">.</span>Int32
                item<span class="token punctuation">.</span>GroupName <span class="token operator">=</span> groupName<span class="token punctuation">.</span>String
                queueList <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>queueList<span class="token punctuation">,</span> item<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> queueList<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br></div></div><h3 id="轻量关系数据库"><a href="#轻量关系数据库" class="header-anchor">#</a> 轻量关系数据库</h3> <blockquote><p>H2DB 和 SQLite</p></blockquote> <p>H2DB：h2db 是纯 Java 编写的开源内存数据库，其源码都打包在 jar 文件中，目前稳定的最新版本 h2-1.4.196.jar 只有 1.8M 左右，提供一个运行在内存中的关系型数据库，可用于本地工具数据源和做本地缓存（客户端或插件开发）</p> <ul><li><a href="http://www.h2database.com/html/download.html" target="_blank" rel="nofollow noopener noreferrer">官网下载 | Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://juejin.cn/post/6844903625039282183" target="_blank" rel="nofollow noopener noreferrer">h2db 新手入门篇 - 概念及初步使用 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>h2db 有三种工作方式，无论在哪种模式，h2db 都支持都支持持久（persistence）和内存临时数据库（in-memory）</p> <ul><li>嵌入式模式：H2DB 作为应用的一部分，DB Server 和应用运行在一个进程，应用关闭，H2DB 也同时关闭</li> <li>服务器模式：传统的 Server 模式，用户通过客户端连接 H2DB Server，需使用网络协议（web server 模式、TCP server 模式，PostgreSQL Client 模式）</li> <li>混合模式（Mix Mode）：允许嵌入式模式下的 H2DB 被其他应用的 Client 连接，同时作为本地 Server 和远程 Server（磨盘拉飞了）</li></ul> <p>在服务器模式下，数据要通过 TCP/IP 相关协议完成传输，效率可能低于嵌入模式</p> <img src="/assets/img/h2db-mixed-mode.e973d97b.png"> <p>SQLite 更加为人熟知，这是一个由 C 编写的轻量关系数据库，微信的本地消息存储好像就用的这玩意儿，沟槽的 30GB 聊天记录</p> <ul><li><a href="https://sqlite.org/index.html" target="_blank" rel="nofollow noopener noreferrer">SQLite Home Page<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/sqlite/sqlite" target="_blank" rel="nofollow noopener noreferrer">GitHub - sqlite/sqlite: Official Git mirror of the SQLite source tree · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.runoob.com/sqlite/sqlite-tutorial.html" target="_blank" rel="nofollow noopener noreferrer">SQLite 教程 | 菜鸟教程<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="mysql-索引"><a href="#mysql-索引" class="header-anchor">#</a> MySQL 索引</h2> <h3 id="b-树索引结构"><a href="#b-树索引结构" class="header-anchor">#</a> B+ 树索引结构</h3> <blockquote><p>为什么数据库索引选择 B+ 树，而不是相似的 B 树，或者是 CRUD 效率均为 O(n) 的红黑树，又或者 LSM-Tree</p></blockquote> <p>为什么选择 B+ 树而不选择 B 树？</p> <p>首先要明确的是，B 树和 B+ 树一样，都是一个多路平衡查找树</p> <ul><li>多路即多叉树；平衡意味着叶子节点都在同一层，保证查询的平衡性</li></ul> <p>B+ 树和 B 树的不同点在于，B 树的每个节点既存储用于分路的索引，又存储当前索引对应的数据记录，即，每个索引对应的位置，同时存储了其对应的数据记录</p> <img src="/assets/img/image-20260303112420296.c00d44b3.png"> <p>这会造成数据过于分散，例如我要查询索引区间在 20-70 的数据，B 树必须遍历这个树，才能得到结果</p> <p>B+ 树做了极为聪明的处理</p> <ul><li>他不在中间节点存储数据，而只存储索引，所有的数据都堆积在叶子节点，由于多路平衡，实际上数据都堆积在底层</li> <li>令叶子节点在物理上尽量连续存储，契合磁盘按页读取特性</li> <li>在叶子节点那一层，每个节点之间增加双向指针</li></ul> <img src="/assets/img/image-20260303171448627.339d68c0.png"> <p>于是同样范围查询 3-20 的数据，B+ 树只需要找到起始点 3，然后一路向后遍历即可，并且由于磁盘上的连续，这样的遍历几近于一个数组遍历</p> <p>红黑树为什么不适用于数据库？很简单，因为是二叉树，不适合大量数据存储</p> <p>那 LSM-Tree 呢？这是一种面向写密集型场景的存储结构，其思路是，先写内存，在异步刷进磁盘并合并</p> <ul><li>写入时，先写入内存中的 MemTable（基于红黑树实现的有序结构），达到阈值后刷盘为 SSTable（有序的磁盘文件）</li> <li>多个 SSTable 后台异步合并，仍然保持有序性</li> <li>查询时需要遍历 MemTable 和 SSTable，统一合并结果返回</li></ul> <p>读性能太弱了</p> <h3 id="主键和外键"><a href="#主键和外键" class="header-anchor">#</a> 主键和外键</h3> <blockquote><p>主键即：聚集索引</p></blockquote> <p>在 InnoDB 里，每个数据表必须要有且只有一个聚集索引（主键索引），其规则如下</p> <ol><li>如果定义了主键 PK，则 PK 是聚集索引</li> <li>若未定义主键，则第一个非空唯一索引将默认作为聚集索引</li> <li>若既无主键，也无非空唯一字段，则 InnoDB 会创建一个隐藏的 row-id 作为聚集索引</li></ol> <p>例如下面这张表</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
    id <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span> 
    name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">16</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    role <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">index</span> <span class="token punctuation">(</span>name<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>id 这一字段作为聚集索引，而 name 字段作为一个普通索引</p> <p>外键：通过某一字段关联两张数据表，提供结构化的约束</p> <ul><li>优点：由数据库自身保证数据的一致性和完整性，比程序更可靠，增加 ER 图的可读性，帮助理解数据库设计</li> <li>缺点：增加开发难度，使数据管理变得复杂，影响性能，特别是在处理大量数据时</li></ul> <p>例如，将用户表 user 与判题记录表通过 userId 这一外键关联</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
    id <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span> 
    name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">16</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    role <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">index</span> <span class="token punctuation">(</span>name<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>

<span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">FOREIGN</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>userId<span class="token punctuation">)</span> <span class="token keyword">REFERENCES</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>这样，record 这张表的 userId 将依赖于 user 表的 id 字段，也就是说，每一个在 record 中出现的记录，其 userId 必然是 user 中的某一个已存在的值，那么</p> <ul><li>在删除 user 表中某一个用户时，数据库会先把 record 中所有外键依赖了这个用户的所有记录先删除，再会从主表中删除用户</li> <li>从表 record 不会出现“永陵数据”，每个 userId 都一定是 user 中存在的</li></ul> <p>外键的本质是：是数据一致性约束，而不是查询机制</p> <h3 id="联合主键"><a href="#联合主键" class="header-anchor">#</a> 联合主键</h3> <p>以判题记录为例，设置一个用户 ID + 题目 ID 的联合主键</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    userId <span class="token keyword">INT</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">INT</span><span class="token punctuation">,</span>
    state <span class="token keyword">INT</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>联合主键遵循“最左前缀原则”，例如这里的主键是</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>studentID<span class="token punctuation">,</span> courseID<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>那么主键索引可用情况为</p> <table><thead><tr><th>查询条件</th> <th>是否走索引</th></tr></thead> <tbody><tr><td>studentID = 1</td> <td>是</td></tr> <tr><td>studentID = 1 AND courseID = 2</td> <td>是</td></tr> <tr><td>courseID = 2</td> <td>否</td></tr></tbody></table> <p>这点在设计阶段必须想清楚，否则索引等于白建</p> <p>并且，如果以 userId 和 questionId 为主键，那么对于每个用户而言，每个题目的判题记录将会是唯一的，这实际上严重不符合业务逻辑</p> <p>所以，正确的判题记录表应该是</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>用一个判题记录 id 作为主键（仅作为记录的行数记录），然后为 userId 和 questionId 建立索引以满足根据用户查记录和根据题目查记录的业务需求，这样的普通索引会导致回表问题</p> <h3 id="索引最左匹配原则"><a href="#索引最左匹配原则" class="header-anchor">#</a> 索引最左匹配原则</h3> <blockquote><p>什么是最左匹配原则，底层数据结构原理是什么？</p></blockquote> <p>索引最左匹配原则</p> <ul><li>在使用联合索引查询时，数据库会优先匹配索引的<strong>最左侧字段</strong>，并依次向右匹配</li> <li>如果左侧字段不参与查询条件（或无法被索引匹配），那么右侧字段将无法使用该联合索引，会退化为全表扫描或部分索引扫描</li></ul> <p>例如联合索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code>idx<span class="token punctuation">(</span>a<span class="token punctuation">,</span> b<span class="token punctuation">,</span> c<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>B+ 树的排序优先级为：<strong>先按<code>a</code>字段排序 → 再按<code>b</code>字段排序 → 最后按<code>c</code>字段排序</strong></p> <p>这是导致最左匹配原则的底层原理，这意味着</p> <ul><li>若查询条件包含<code>a</code>，可以快速定位到<code>a</code>对应的子树，再在子树中匹配<code>b</code>，以此类推</li> <li>若查询条件不包含<code>a</code>，B+ 树无法确定起始遍历位置，只能全表扫描，无法利用<code>b, c</code>字段的索引</li></ul> <p>也就是说，如果是多个联合索引，一定要满足“左侧”的搜索条件，“右侧”的索引才会生效</p> <p>具体而言，其联合索引<code>idx(a,b,c)</code>索引的可用情况为</p> <table><thead><tr><th>情况</th> <th>查询条件</th> <th>是否走索引</th></tr></thead> <tbody><tr><td>1</td> <td>a = 1</td> <td>是</td></tr> <tr><td>2</td> <td>a = 1 and b = 2</td> <td>是</td></tr> <tr><td>3</td> <td>a = 1 and b = 2 and c = 3</td> <td>是</td></tr> <tr><td>4</td> <td>b = 2 and c = 3</td> <td>否</td></tr> <tr><td>5</td> <td>a = 1 and c = 3</td> <td>否</td></tr></tbody></table> <p>注意</p> <ul><li>在情况 4 中：因为最左条件没有，所以从一开始就不会走索引，会直接全表扫描<code>b = 2 and c = 3</code>的数据行</li> <li>而在情况 5 中：最左条件<code>a = 1</code>存在，所以会先走一遍索引，筛选出<code>a = 1</code>的记录，而后因为此时的最左索引<code>b</code>条件不存在，所以不会继续索引匹配，而是直接回表逐行过滤<code>c = 3</code>的情况（暴力过滤）</li></ul> <h3 id="回表查询"><a href="#回表查询" class="header-anchor">#</a> 回表查询</h3> <p>在现实场景中，基本上不用外键约束，数据库设计的复杂度和耦合度会激增，一般情况会设置一个逻辑外键，即不写<code>Foreign key</code>，只作为外键“逻辑”使用</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>这里虽然没有令 userId 为外键，但为其建立了一个普通索引，我可以直接根据 userId 去查询记录</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> state <span class="token keyword">from</span> record <span class="token keyword">where</span> userId <span class="token operator">=</span> <span class="token string">&quot;202012143&quot;</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这样会先根据 idx_user 索引找到 userId 为 202012143 的 B+ 树叶子节点，获取这条数据的聚集索引 recordId，然后根据 recordId 查主键索引，找到对应记录的 state，这就是所谓的回表查询</p> <p>在普通索引（非主键索引）中：B+ 树叶子节点存的是「索引列值 + 主键值」</p> <p>假设我在 record 表中插入这样一条数据</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">INSERT</span> <span class="token keyword">INTO</span> record<span class="token punctuation">(</span>recordId<span class="token punctuation">,</span> userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">,</span> <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span><span class="token punctuation">)</span> <span class="token keyword">VALUES</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">202012143</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;通过&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后我要查询 userId 字段为 202012143 的数据行</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> record <span class="token keyword">where</span> userId <span class="token operator">=</span> <span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这段查询</p> <ol><li>会先走普通索引，找到记录了 userId 为 202012143 的叶子节点后，拿到其对应的 recordId 主键索引值，例如这里为 1</li> <li>然后再根据聚集索引 1 去找到这条完整的数据</li></ol> <p>在整个流程中，存在先找普通索引，再找聚集索引的过程，实际上查了两次表，这第二次查表，就是所谓的回表查询</p> <ul><li>这样的查询会大幅拖慢查询速度，所以在在大表 + 高频查询场景中要谨慎设计普通索引</li></ul> <p>也就是说，用户想找自己做了哪些题，仅仅为 userId 做一个普通索引，是一定会导致回表的</p> <h3 id="联合索引、覆盖索引和索引下推"><a href="#联合索引、覆盖索引和索引下推" class="header-anchor">#</a> 联合索引、覆盖索引和索引下推</h3> <p>解决回表问题，详见业务场景 <a href="https://northboat.github.io/pages/2bb10d/#%E8%81%94%E5%90%88%E8%A6%86%E7%9B%96%E7%B4%A2%E5%BC%95" target="_blank" rel="nofollow noopener noreferrer">高并发与高可用场景 | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ol><li>覆盖索引</li> <li>索引下推</li> <li>索引跳跃式扫描</li></ol> <h2 id="数据一致性"><a href="#数据一致性" class="header-anchor">#</a> 数据一致性</h2> <h3 id="mysql-事务"><a href="#mysql-事务" class="header-anchor">#</a> MySQL 事务</h3> <p>GORM 层面的事务控制，返回一个 DB 连接</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// Begin 开启事务</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>GormDb<span class="token punctuation">)</span> <span class="token function">Begin</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>GormDb<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        db <span class="token operator">:=</span> its<span class="token punctuation">.</span>DB<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Begin</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">if</span> db<span class="token punctuation">.</span>Error <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> its<span class="token punctuation">.</span><span class="token function">HandleError</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> db<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token operator">&amp;</span>GormDb<span class="token punctuation">{</span>
                DB<span class="token punctuation">:</span> db<span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>在函数中，所有的数据库操作使用同一个数据库连接</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GpuQueueCreate 进行排队预约创建/重启</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>QueueController<span class="token punctuation">)</span> <span class="token function">GpuQueueCreate</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> action<span class="token punctuation">,</span> params <span class="token builtin">string</span><span class="token punctuation">,</span> open<span class="token punctuation">,</span>
                                           anyOpen <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>queue<span class="token punctuation">.</span>EnvironmentQueue<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>

    <span class="token comment">// 获取事务连接</span>
    tx<span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Begin</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;预约gpu资源失败, err: %+v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>

    <span class="token comment">// 定义数据库回滚</span>
    <span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token comment">// 回滚所有数据库提交</span>
            <span class="token boolean">_</span> <span class="token operator">=</span> tx<span class="token punctuation">.</span><span class="token function">Rollback</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">if</span> open <span class="token punctuation">{</span>
        envId<span class="token punctuation">,</span> action<span class="token punctuation">,</span> err <span class="token operator">=</span> its<span class="token punctuation">.</span><span class="token function">GpuQueueOpen</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> tx<span class="token punctuation">,</span> queueUid<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> anyOpen <span class="token punctuation">{</span>
        envId<span class="token punctuation">,</span> action<span class="token punctuation">,</span> err <span class="token operator">=</span> its<span class="token punctuation">.</span><span class="token function">GpuQueueAnyOpen</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> tx<span class="token punctuation">,</span> queueUid<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span> <span class="token comment">//...</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br></div></div><p>当执行任何数据库操作时，至今赋值给 err，只要当任意一个过程使得 err 不为 nil，那么触发 defer 的时候，就会执行数据库回滚，实现当前函数的事务性（这和 Spring 的 @Transaction 是一样的效果，但实现的优雅的多，有感觉吗）</p> <h3 id="多版本并发控制"><a href="#多版本并发控制" class="header-anchor">#</a> 多版本并发控制</h3> <p>MVCC（Multi-Version Concurrency Control），多版本并发控制，是MySQL中被广泛采用的并发控制机制，它通过版本管理（维护多个版本快照）让读写互不阻塞，并实现事务的隔离</p> <p>核心机制：用<strong>版本快照</strong>替代锁阻塞，依赖 3 个关键组件，事务版本号、数据版本链和 Read View（读视图）</p> <p>事务版本号</p> <ul><li>数据库会为每个事务分配一个唯一递增的事务 ID（<code>transaction_id</code>），事务开始时生成</li> <li>数据的每次修改（INSERT/UPDATE/DELETE） 都会生成一个新的数据版本，并更新当前事务 ID 为新版本号</li></ul> <p>数据版本链：以 InnoDB 为例，每行数据的物理存储包含 3 个隐藏字段</p> <table><thead><tr><th style="text-align:center;">隐藏字段</th> <th style="text-align:center;">作用</th></tr></thead> <tbody><tr><td style="text-align:center;"><code>DB_TRX_ID</code></td> <td style="text-align:center;">最后一次修改该数据的事务 ID</td></tr> <tr><td style="text-align:center;"><code>DB_ROLL_PTR</code></td> <td style="text-align:center;">回滚指针，指向该数据的<strong>上一个历史版本</strong></td></tr> <tr><td style="text-align:center;"><code>DB_ROW_ID</code></td> <td style="text-align:center;">行唯一标识（无主键时自动生成）</td></tr></tbody></table> <p>通过当前事务 ID 和回滚指针能够轻松定位当前行数据的操作链（链表结构）</p> <p>Read View：当事务执行快照读（普通 <code>SELECT</code>，不加锁）时，数据库会生成一个 Read View，包含 4 个核心参数</p> <ul><li><code>m_ids</code>：当前活跃事务 ID 列表（未提交的事务）</li> <li><code>min_trx_id</code>：<code>m_ids</code>中的最小事务 ID</li> <li><code>max_trx_id</code>：下一个即将分配的事务 ID</li> <li><code>creator_trx_id</code>：生成该 Read View 的事务 ID</li></ul> <p>Read View 的可见性规则（判断数据版本是否对当前事务可见）</p> <ol><li>若数据版本的 <code>DB_TRX_ID == creator_trx_id</code> → 自己修改的，可见</li> <li>若 <code>DB_TRX_ID &lt; min_trx_id</code> → 事务已提交，可见</li> <li>若 <code>DB_TRX_ID &gt;= max_trx_id</code> → 事务在 Read View 生成后开启，不可见</li> <li>若 <code>min_trx_id ≤ DB_TRX_ID &lt; max_trx_id</code> → 若 <code>DB_TRX_ID</code> 在 <code>m_ids</code> 中（事务活跃），不可见，否则可见</li></ol> <p>如果当前版本不可见，就通过<code>DB_ROLL_PTR</code>回溯版本链，直到找到第一个可见版本</p> <p>也就是说，MVCC 通过管理事务状态，如果当前数据“正在被写”不允许读（读写锁的功能），那么就会通过事务回滚找到之前的版本返回，这样就能实现“写时可读”的需求</p> <h3 id="postgre-的-mvcc"><a href="#postgre-的-mvcc" class="header-anchor">#</a> Postgre 的 MVCC</h3> <p>PostgreSQL 与 MySQL 的 MVCC 区别在哪</p> <h3 id="缓存一致性"><a href="#缓存一致性" class="header-anchor">#</a> 缓存一致性</h3> <p>假设我现在有一个高频数据表，用户的每次“读”都会先查询 Redis 数据库，看看有没有缓存，如果有就直接拿，如果无就去打 MySQL 数据库，拿到数据后，将数据存入 Redis 缓存，再返回</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 拿缓存</span>
<span class="token class-name">User</span> cache <span class="token operator">=</span> redisService<span class="token punctuation">.</span><span class="token function">getCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>cache <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> cache<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token comment">// 拿数据库</span>
<span class="token class-name">User</span> user <span class="token operator">=</span> userService<span class="token punctuation">.</span><span class="token function">getUserById</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">if</span><span class="token punctuation">(</span>user <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">CustomException</span><span class="token punctuation">(</span><span class="token string">&quot;User not found&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token comment">// 存缓存</span>
redisService<span class="token punctuation">.</span><span class="token function">setCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">return</span> user<span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>OK，看起来非常正常，但马上就会出现问题，考虑这样一个场景</p> <ul><li>现在用户 1 需要“写”一个数据项</li> <li>同时另一个用户 2 并发的想“读”这条数据</li></ul> <p>显然，如果不做任何处理，处理的结果会是这样</p> <ol><li>用户 1 成功的更改了 MySQL 中数据</li> <li>用户 2 成功的命中了缓存</li></ol> <p>但用户 2 拿到的永远会是缓存中的脏数据</p> <p>那么显然，在用户“写” MySQL 数据时，我一定要把这条数据对应的缓存从 Redis 里面删掉，于是现在的写流程变为</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 删缓存</span>
redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 写数据库</span>
userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>这样，再读的时候，缓存将命中不了，用户 2 会从 MySQL 中拿到最新的数据</p> <h3 id="延时双删"><a href="#延时双删" class="header-anchor">#</a> 延时双删</h3> <p>OK，看起来非常完美，但马上又会出现问题，众所周知，写是需要时间的，假设</p> <ol><li>用户 1 在写的这条数据（还没写完），此时用户 2 来读这条数据，由于 MySQL 的 MVCC 机制，MySQL 将返回上一版本的数据</li> <li>这样，后端将会拿到一条上个版本的脏数据，继而把他存入 Redis 缓存，最后返回给前端</li> <li>之后的每次查询，都会命中 Redis 缓存中的脏数据返回，而不会去找 MySQL 的新数据</li></ol> <p>于是又发生了第一个场景中的问题，用户 2 将始终命中缓存，返回脏数据</p> <p>所以很自然的，提出了一个“双删”的办法，简单来说，就是在写之前删一次缓存，写之后再删一次缓存，这样无论其他并发怎么写缓存，脏数据的缓存都会被删掉</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 延时</span>
    <span class="token class-name">Thread</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 再删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>可以注意到这里 sleep 了 1 秒，这是因为在后端，我无法判断 MySQL “到底写完没”，所以只能采取简单的线程等待，再去执行删除</p> <ul><li>sleep 的时间实际上取决于“完成写事务”的时间，因为第二次删除是防止从“开始写”到“写完”这段时间的读取，将 MVCC 上一版本的脏数据缓存到 Redis</li></ul> <p>有个问题，我都延时删缓存了，为什么不直接去更新缓存，这样能保证下次命中还不用等？</p> <ul><li>和缓存的存储逻辑严重不符，这样做的结果就是，每次写都会同步写缓存，读写对于 Redis 都变成了增量操作，相当于把 MySQL 整个搬到 Redis 里，那我为什么不直接用 Redis 存，脑瘫了</li></ul> <p>但这样的同步阻塞，对于高并发场景显然是极大的负担</p> <h3 id="binlog-异步双删"><a href="#binlog-异步双删" class="header-anchor">#</a> Binlog 异步双删</h3> <blockquote><p>Binlog 是 MySQL 的操作日志</p></blockquote> <p>既然同步阻塞不行，我们可以考虑异步删除</p> <ul><li>MySQL 的 Binlog（二进制日志）记录了数据库的所有数据变更操作（如 INSERT、UPDATE 和 DELETE），对数据恢复、主从复制和审计非常重要</li></ul> <p>查看 Binlog 文件</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SHOW</span> MASTER <span class="token keyword">STATUS</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>每当写操作之后，通过查看解析 Binlog 内容，将删除缓存的事件通过 MQ 发布，消费者 Comsumer 对相应的缓存进行删除，也就是说，双删的第二次删，通过 Binlog 事件驱动 MQ 消费者异步处理</p> <p>这样，在我的后端，每次写之后，进行一条消息推送，然后正常返回即可</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 推送第二次删除</span>
    rabbitMqService<span class="token punctuation">.</span><span class="token function">pushDeleteCacheEvent</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>一个题外话，try - catch - finally 的执行顺序</p> <ul><li>try 中无异常，则 try → finally</li> <li>try 中有异常，则 try → catch → finally</li> <li>try 中无异常但有 return 语句，则 try → finally → return</li> <li>try 中有异常且有 return 语句，则 try → catch → finally → return</li> <li>try 中有异常且有 return 语句，catch 中有 throw 语句，则 try → catch → finally → throw</li></ul> <p>所以不会在 finally 中 return，只是做资源关闭等操作</p> <h2 id="分页分库分表"><a href="#分页分库分表" class="header-anchor">#</a> 分页分库分表</h2> <h3 id="深度分页问题"><a href="#深度分页问题" class="header-anchor">#</a> 深度分页问题</h3> <p>这里的分页不是指 OS 中的内存分页策略，只是一个简单的业务场景，就是我有 1w 条数据需要在前端展示，每页展示 100 条，我后端对应的查询策略</p> <p>显然，要实现这个功能，很简单，我直接一个</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> devEnvironmentInstance
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>拉 tm 1w 条数据返给前端，大概 30MB 吧，前端自己去分页，卡爆用户，很好，代码提交上去的同时离职信也会同步下发</p> <p>然后我想到了排序 + offset + limit 分页</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span> <span class="token keyword">OFFSET</span> <span class="token number">5000</span><span class="token punctuation">;</span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>需要扫描并跳过前 5000 条，说实话，这和全表扫描没差</p> <p>正确的做法应该是用某一个字段作为“游标”，通过字段比较 + limit 死死卡住一页内容，文库的做法是用 updateTime 作为游标，每次查询走 <code>update_time</code> 索引，只扫描 100 条</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment">-- 第一页</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> update_time <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 23:59:59'</span>  <span class="token comment">-- 初始为当前时间</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>

<span class="token comment">-- 第二页（使用上一页最后一条的 update_time 作为游标），第三页以此类推</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> update_time <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 18:30:15'</span>  <span class="token comment">-- 上一页最后一条的 update_time</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>问题又来了，updateTime 是精确到秒的数据，如果两条数据 a 和 b 在同一秒 update，同时上一次分页刚好 limit 10，而相同的数据在第 11，那么 b 就会被这一页掠过，并且恐怖的是，因为下一次游标会是一个严格的大于，这个 b 在下一页也会被条件排除在外，成了一只查不出野鬼</p> <p>这个时候就要用到双游标方案，用 <code>(update_time, id)</code> 组合作为唯一游标</p> <ul><li>第一，保证排序的唯一性，保证同一时间戳下按 <code>id</code> 有序，只要“排序”是唯一的，就不会出现上述分页边界遗漏数据的问题</li> <li>其次，id 一定有主键索引，加上之前 updateTime 的索引，这样一定能吃到 <code>(update_time, id)</code> 的联合索引，不会回表扫描</li></ul> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment">-- 第一页</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> <span class="token punctuation">(</span>update_time <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 23:59:59'</span><span class="token punctuation">)</span>
   <span class="token operator">OR</span> <span class="token punctuation">(</span>update_time <span class="token operator">=</span> <span class="token string">'2026-07-02 23:59:59'</span> <span class="token operator">AND</span> id <span class="token operator">&lt;</span> <span class="token number">999999999</span><span class="token punctuation">)</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span><span class="token punctuation">,</span> id <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>

<span class="token comment">-- 第二页：使用上一页最后一条的 (update_time, id) 作为游标</span>
<span class="token comment">-- 假设上一页最后一条：update_time = '2026-07-02 18:30:15', id = 100</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> <span class="token punctuation">(</span>update_time <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 18:30:15'</span><span class="token punctuation">)</span>
   <span class="token operator">OR</span> <span class="token punctuation">(</span>update_time <span class="token operator">=</span> <span class="token string">'2026-07-02 18:30:15'</span> <span class="token operator">AND</span> id <span class="token operator">&lt;</span> <span class="token number">100</span><span class="token punctuation">)</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span><span class="token punctuation">,</span> id <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>联合索引一定要建</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">ALTER</span> <span class="token keyword">TABLE</span> devEnvironmentInstance 
<span class="token keyword">ADD</span> <span class="token keyword">INDEX</span> idx_update_id <span class="token punctuation">(</span>update_time <span class="token keyword">DESC</span><span class="token punctuation">,</span> id <span class="token keyword">DESC</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>前端的请求如下</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// 请求参数</span>
<span class="token punctuation">{</span>
  pageSize<span class="token operator">:</span> <span class="token number">100</span><span class="token punctuation">,</span>
  cursor<span class="token operator">:</span> <span class="token punctuation">{</span> updateTime<span class="token operator">:</span> '<span class="token number">2026</span><span class="token number">-07</span><span class="token number">-02</span> <span class="token number">18</span><span class="token operator">:</span><span class="token number">30</span><span class="token operator">:</span><span class="token number">15</span>'<span class="token punctuation">,</span> id<span class="token operator">:</span> <span class="token number">100</span> <span class="token punctuation">}</span>  <span class="token comment">// 上一页最后一条</span>
<span class="token punctuation">}</span>

<span class="token comment">// 第一次请求取当前最大时间 + 无穷大 id，找到 DB 中“最大”的数据行开始向后遍历</span>
<span class="token punctuation">{</span>
  pageSize<span class="token operator">:</span> <span class="token number">100</span><span class="token punctuation">,</span>
  cursor<span class="token operator">:</span> <span class="token punctuation">{</span> updateTime<span class="token operator">:</span> Now()<span class="token punctuation">,</span> id<span class="token operator">:</span> <span class="token number">9223372036854775807</span> <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>后端返回携带 hasMore 字段，告知前端是否还有下一页</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// 响应返回</span>
<span class="token punctuation">{</span>
  list<span class="token operator">:</span> <span class="token punctuation">[</span>...<span class="token punctuation">]</span><span class="token punctuation">,</span>
  nextCursor<span class="token operator">:</span> <span class="token punctuation">{</span> updateTime<span class="token operator">:</span> '...'<span class="token punctuation">,</span> id<span class="token operator">:</span> ... <span class="token punctuation">}</span><span class="token punctuation">,</span>  <span class="token comment">// 本页最后一条</span>
  hasMore<span class="token operator">:</span> <span class="token boolean">true</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="主从库读写分离"><a href="#主从库读写分离" class="header-anchor">#</a> 主从库读写分离</h3> <p>主库写，从库读，写操作统一走 mq 解耦进行削峰，这是文库服务端的数据库架构</p> <h3 id="水平分表"><a href="#水平分表" class="header-anchor">#</a> 水平分表</h3> <p>根据 uid 哈希取模，决定其在哪张表，在读表前同样进行取模确定表再进行读取</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/07/07, 22:32:07</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4feb0e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Linux 基础</div></a> <a href="/pages/d7c3d3/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">容器技术</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
