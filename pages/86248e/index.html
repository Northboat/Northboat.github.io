<span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> s<span class="token punctuation">.</span><span class="token function">length</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">int</span> c <span class="token operator">=</span> s<span class="token punctuation">.</span><span class="token function">charAt</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span> <span class="token operator">-</span> <span class="token char">'a'</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">(</span>mask <span class="token operator">&gt;&gt;</span> c<span class="token punctuation">)</span> <span class="token operator">&amp;</span> <span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        mask <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
        <span class="token keyword">break</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    mask <span class="token operator">|=</span> <span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">&lt;&lt;</span> c<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>判断两个字符串是否有重复字母：两字符串对应的 Integer 进行 &amp; 操作（相同位均为 1 才为 1），若为 0，说明没有重复的位</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">if</span><span class="token punctuation">(</span>mask <span class="token operator">==</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">continue</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token keyword">int</span> n <span class="token operator">=</span> masks<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> n<span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">int</span> m <span class="token operator">=</span> masks<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token punctuation">(</span>m <span class="token operator">&amp;</span> mask<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        masks<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>m <span class="token operator">|</span> mask<span class="token punctuation">)</span><span class="token punctuation">;</span>
        res <span class="token operator">=</span> <span class="token class-name">Math</span><span class="token punctuation">.</span><span class="token function">max</span><span class="token punctuation">(</span>res<span class="token punctuation">,</span> <span class="token class-name">Integer</span><span class="token punctuation">.</span><span class="token function">bitCount</span><span class="token punctuation">(</span>m <span class="token operator">|</span> mask<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="快速幂和快速乘"><a href="#快速幂和快速乘" class="header-anchor">#</a> 快速幂和快速乘</h3> <p><a href="https://leetcode.cn/problems/powx-n/" target="_blank" rel="nofollow noopener noreferrer">50. Pow(x, n)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>用乘法实现快速幂运算，快速是指 O(logn) 的时间复杂度，我老是想到“模指数算法”，总感觉差不多，感觉就是一样的</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">double</span> <span class="token function">myPow</span><span class="token punctuation">(</span><span class="token keyword">double</span> x<span class="token punctuation">,</span> <span class="token keyword">int</span> n<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">long</span> <span class="token class-name">N</span> <span class="token operator">=</span> n<span class="token punctuation">;</span>
    <span class="token keyword">boolean</span> flag <span class="token operator">=</span> <span class="token class-name">N</span> <span class="token operator">&lt;</span> <span class="token number">0</span><span class="token punctuation">;</span>
    <span class="token class-name">N</span> <span class="token operator">=</span> <span class="token class-name">N</span> <span class="token operator">&lt;</span> <span class="token number">0</span> <span class="token operator">?</span> <span class="token operator">-</span><span class="token class-name">N</span> <span class="token operator">:</span> <span class="token class-name">N</span><span class="token punctuation">;</span>
    <span class="token keyword">double</span> res <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">,</span> mul <span class="token operator">=</span> x<span class="token punctuation">;</span>
    <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token class-name">N</span> <span class="token operator">&gt;</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">N</span> <span class="token operator">&amp;</span> <span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            res <span class="token operator">*=</span> mul<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        mul <span class="token operator">*=</span> mul<span class="token punctuation">;</span>
        <span class="token class-name">N</span> <span class="token operator">&gt;&gt;=</span> <span class="token number">1</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> flag <span class="token operator">?</span> <span class="token punctuation">(</span><span class="token number">1.0</span> <span class="token operator">/</span> res<span class="token punctuation">)</span> <span class="token operator">:</span> res<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>快速乘：用加法实现快速乘运算，同样要求 O(logn) 的复杂度，这里计算</p> <div class="language-java extra-class"><pre class="language-java"><code><span class="token comment">// 用加法计算 ax</span>
<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">int</span> <span class="token function">myMul</span><span class="token punctuation">(</span><span class="token keyword">int</span> a<span class="token punctuation">,</span> <span class="token keyword">int</span> x<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">boolean</span> flag <span class="token operator">=</span> <span class="token punctuation">(</span>a <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> x <span class="token operator">&lt;</span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token operator">||</span> <span class="token punctuation">(</span>a <span class="token operator">&lt;</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> x <span class="token operator">&gt;</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    a <span class="token operator">=</span> <span class="token class-name">Math</span><span class="token punctuation">.</span><span class="token function">abs</span><span class="token punctuation">(</span>a<span class="token punctuation">)</span><span class="token punctuation">;</span> x <span class="token operator">=</span> <span class="token class-name">Math</span><span class="token punctuation">.</span><span class="token function">abs</span><span class="token punctuation">(</span>x<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">int</span> add <span class="token operator">=</span> a<span class="token punctuation">,</span> ans <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
    <span class="token keyword">while</span><span class="token punctuation">(</span>x <span class="token operator">!=</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token punctuation">(</span>x <span class="token operator">&amp;</span> <span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            ans <span class="token operator">+=</span> add<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span>x <span class="token operator">!=</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            add <span class="token operator">+=</span> add<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 用掉当前位，考虑更高位</span>
        x <span class="token operator">&gt;&gt;=</span> <span class="token number">1</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> flag <span class="token operator">?</span> <span class="token operator">-</span>ans <span class="token operator">:</span> ans<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre></div><p><a href="https://leetcode.cn/problems/divide-two-integers/" target="_blank" rel="nofollow noopener noreferrer">29. 两数相除<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，这道题真的司马了，看不明白捏</p> <h2 id="sql-语句"><a href="#sql-语句" class="header-anchor">#</a> SQL 语句</h2> <h3 id="排序和分组"><a href="#排序和分组" class="header-anchor">#</a> 排序和分组</h3> <p>去重和排序（默认升序），同时给<code>author_id</code>起一个别名，方便编写</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
	<span class="token keyword">distinct</span> author_id <span class="token keyword">as</span> id
<span class="token keyword">from</span>
	Views
<span class="token keyword">where</span>
	author_id <span class="token operator">=</span> viewer_id
<span class="token keyword">order</span> <span class="token keyword">by</span>
	id<span class="token punctuation">;</span>
</code></pre></div><p>若要降序排列，需要添加关键字<code>desc</code>在<code>id</code>之后</p> <h3 id="函数"><a href="#函数" class="header-anchor">#</a> 函数</h3> <p><code>length</code>返回字符串长度，统计表中<code>content</code>大于 15 的数据项</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
    tweet_id
<span class="token keyword">from</span>
    Tweets
<span class="token keyword">where</span>
    length<span class="token punctuation">(</span>content<span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">15</span><span class="token punctuation">;</span>
</code></pre></div><h3 id="左连接"><a href="#左连接" class="header-anchor">#</a> 左连接</h3> <p>MySQL中的 left join 是一种连接方式，它以左表为基准，返回左表中所有的行，同时返回右表中与左表匹配的行。如果右表中没有匹配的行，则用 NULL 填充</p> <p>一个简单的左连接示例</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
    <span class="token operator">*</span>
<span class="token keyword">from</span>
    Employees
<span class="token keyword">left</span> <span class="token keyword">join</span>
    EmployeeUNI
<span class="token keyword">on</span>
    Employees<span class="token punctuation">.</span>id <span class="token operator">=</span> EmployeeUNI<span class="token punctuation">.</span>id<span class="token punctuation">;</span>
</code></pre></div><p><a href="https://leetcode.cn/problems/replace-employee-id-with-the-unique-identifier/" target="_blank" rel="nofollow noopener noreferrer">1378. 使用唯一标识码替换员工ID<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>用表一的员工 ID 和表二的 ID 进行左连接：<code>from 表一 left join 表二 on 表一.ID = 表二.ID</code></p> <p>就相当于，表一表二通过 ID 这一字段横向扩展成了一张大表，而后正常在这张大表上<code>select</code>想要的内容就行</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
    EmployeeUNI<span class="token punctuation">.</span>unique_id<span class="token punctuation">,</span> Employees<span class="token punctuation">.</span>name
<span class="token keyword">from</span>
    Employees
<span class="token keyword">left</span> <span class="token keyword">join</span>
    EmployeeUNI
<span class="token keyword">on</span>
    EmployeeUNI<span class="token punctuation">.</span>id <span class="token operator">=</span> Employees<span class="token punctuation">.</span>id<span class="token punctuation">;</span>
</code></pre></div><p>统计连接后为空的项</p> <p><a href="https://leetcode.cn/problems/product-sales-analysis-i/" target="_blank" rel="nofollow noopener noreferrer">1068. 产品销售分析 I<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
    Product<span class="token punctuation">.</span>product_name<span class="token punctuation">,</span> Sales<span class="token punctuation">.</span><span class="token keyword">year</span><span class="token punctuation">,</span> Sales<span class="token punctuation">.</span>price
<span class="token keyword">from</span>
    Sales
<span class="token keyword">left</span> <span class="token keyword">join</span>
    Product
<span class="token keyword">on</span>
    Sales<span class="token punctuation">.</span>product_id <span class="token operator">=</span> Product<span class="token punctuation">.</span>product_id<span class="token punctuation">;</span>
</code></pre></div><p>注意，连接后，比如表一左连接表二，如果主键在表二没有对应的项，则会产生存在空字段的数据项，例如 <a href="https://leetcode.cn/problems/customer-who-visited-but-did-not-make-any-transactions/" target="_blank" rel="nofollow noopener noreferrer">1581. 进店却未进行过交易的顾客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-sql extra-class"><pre class="language-sql"><code>Visits
<span class="token operator">+</span><span class="token comment">----------+-------------+</span>
<span class="token operator">|</span> visit_id <span class="token operator">|</span> customer_id <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">----------+-------------+</span>
<span class="token operator">|</span> <span class="token number">1</span>        <span class="token operator">|</span> <span class="token number">23</span>          <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">2</span>        <span class="token operator">|</span> <span class="token number">9</span>           <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">4</span>        <span class="token operator">|</span> <span class="token number">30</span>          <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">5</span>        <span class="token operator">|</span> <span class="token number">54</span>          <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">6</span>        <span class="token operator">|</span> <span class="token number">96</span>          <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">7</span>        <span class="token operator">|</span> <span class="token number">54</span>          <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">8</span>        <span class="token operator">|</span> <span class="token number">54</span>          <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">----------+-------------+</span>
<span class="token keyword">Transactions</span>
<span class="token operator">+</span><span class="token comment">----------------+----------+--------+</span>
<span class="token operator">|</span> transaction_id <span class="token operator">|</span> visit_id <span class="token operator">|</span> amount <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">----------------+----------+--------+</span>
<span class="token operator">|</span> <span class="token number">2</span>              <span class="token operator">|</span> <span class="token number">5</span>        <span class="token operator">|</span> <span class="token number">310</span>    <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">3</span>              <span class="token operator">|</span> <span class="token number">5</span>        <span class="token operator">|</span> <span class="token number">300</span>    <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">9</span>              <span class="token operator">|</span> <span class="token number">5</span>        <span class="token operator">|</span> <span class="token number">200</span>    <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">12</span>             <span class="token operator">|</span> <span class="token number">1</span>        <span class="token operator">|</span> <span class="token number">910</span>    <span class="token operator">|</span>
<span class="token operator">|</span> <span class="token number">13</span>             <span class="token operator">|</span> <span class="token number">2</span>        <span class="token operator">|</span> <span class="token number">970</span>    <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">----------------+----------+--------+</span>
</code></pre></div><p>显然，<code>visit_id = 4</code>的项在表二中并不存在，所以在连接后会出现</p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token operator">+</span><span class="token comment">----------------+----------+--------+-------------+</span>
<span class="token operator">|</span> transaction_id <span class="token operator">|</span> visit_id <span class="token operator">|</span> amount <span class="token operator">|</span> customer_id <span class="token operator">|</span>
<span class="token operator">+</span><span class="token comment">----------------+----------+--------+-------------+</span>
<span class="token operator">|</span> <span class="token boolean">null</span>           <span class="token operator">|</span> <span class="token number">4</span>        <span class="token operator">|</span> <span class="token boolean">null</span>   <span class="token operator">|</span> <span class="token number">30</span>          <span class="token operator">|</span>
</code></pre></div><p>这种数据项，那么显然在连接后，若字段<code>transaction_id is null</code>，则说明该用户“进店了但未消费”</p> <p>题目要求返回每个用户进店后未消费的数量，即统计左连接后的大表中每个 id 对应的<code>transaction_id is null</code>的数量，使用 count 函数并取别名为<code>count_no_trans</code></p> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token comment"># Write your MySQL query statement below</span>
<span class="token keyword">select</span>
    Visits<span class="token punctuation">.</span>customer_id<span class="token punctuation">,</span> <span class="token function">count</span><span class="token punctuation">(</span>customer_id<span class="token punctuation">)</span> <span class="token keyword">as</span> count_no_trans
<span class="token keyword">from</span>
    Visits
<span class="token keyword">left</span> <span class="token keyword">join</span>
    <span class="token keyword">Transactions</span>
<span class="token keyword">on</span>
    Visits<span class="token punctuation">.</span>visit_id <span class="token operator">=</span> <span class="token keyword">Transactions</span><span class="token punctuation">.</span>visit_id
<span class="token keyword">where</span>
    transaction_id <span class="token operator">is</span> <span class="token boolean">null</span>
<span class="token keyword">group</span> <span class="token keyword">by</span>
    customer_id<span class="token punctuation">;</span>
</code></pre></div><h3 id="自连接"><a href="#自连接" class="header-anchor">#</a> 自连接</h3> <p>简单的自连接和日期差函数：<a href="https://leetcode.cn/problems/rising-temperature/" target="_blank" rel="nofollow noopener noreferrer">197. 上升的温度<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>从温度表中找出所有比前一天温度高的项，每个数据项由 ID、日期、温度三个字段构成</p> <ul><li>计算日期差值函数（单位：日）：<code>datediff(d2, d1) = (d2-d1)</code></li></ul> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
    w2<span class="token punctuation">.</span>id
<span class="token keyword">from</span>
    Weather w1
<span class="token keyword">join</span>
   	Weather w2
<span class="token keyword">where</span>
    datediff<span class="token punctuation">(</span>w2<span class="token punctuation">.</span>recordDate<span class="token punctuation">,</span> w1<span class="token punctuation">.</span>recordDate<span class="token punctuation">)</span> <span class="token operator">=</span> <span class="token number">1</span>
<span class="token operator">and</span>
    w2<span class="token punctuation">.</span>temperature <span class="token operator">&gt;</span> w1<span class="token punctuation">.</span>temperature<span class="token punctuation">;</span>
</code></pre></div><p>自连接、分组均值及浮点：<a href="https://leetcode.cn/problems/average-time-of-process-per-machine/" target="_blank" rel="nofollow noopener noreferrer">1661. 每台机器的进程平均运行时间<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>计算每个进程的平均运行时间</p> <ul><li>计算均值函数：<code>avg(...)</code></li> <li>规定浮点格式：<code>round(..., 3)</code>，规定为 3 位小数</li> <li>分组：<code>group by machine_id</code>将同一台机器的数据项聚合在一起处理</li></ul> <div class="language-sql extra-class"><pre class="language-sql"><code><span class="token keyword">select</span>
    a1<span class="token punctuation">.</span>machine_id<span class="token punctuation">,</span> <span class="token function">round</span><span class="token punctuation">(</span><span class="token function">avg</span><span class="token punctuation">(</span>a2<span class="token punctuation">.</span><span class="token keyword">timestamp</span><span class="token operator">-</span>a1<span class="token punctuation">.</span><span class="token keyword">timestamp</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">)</span> <span class="token keyword">as</span> processing_time
<span class="token keyword">from</span>
    Activity <span class="token keyword">as</span> a1
<span class="token keyword">join</span>
    Activity <span class="token keyword">as</span> a2
<span class="token keyword">on</span>
    a1<span class="token punctuation">.</span><span class="token keyword">timestamp</span> <span class="token operator">&lt;</span> a2<span class="token punctuation">.</span><span class="token keyword">timestamp</span> <span class="token operator">and</span> a1<span class="token punctuation">.</span>machine_id <span class="token operator">=</span> a2<span class="token punctuation">.</span>machine_id <span class="token operator">and</span> a1<span class="token punctuation">.</span>process_id <span class="token operator">=</span> a2<span class="token punctuation">.</span>process_id
<span class="token keyword">group</span> <span class="token keyword">by</span>
    a1<span class="token punctuation">.</span>machine_id<span class="token punctuation">;</span>
</code></pre></div><p>示例：原数据</p> <div class="language-sql extra-class"><pre class="language-sql"><code>machine_id	process_id	activity_type	<span class="token keyword">timestamp</span>
<span class="token number">0</span>			<span class="token number">0</span>		   	<span class="token keyword">start</span>		   	<span class="token number">0.712</span>
<span class="token number">0</span>			<span class="token number">0</span>		   	<span class="token keyword">end</span>			   	<span class="token number">1.520</span>
<span class="token number">0</span>			<span class="token number">1</span>	 	   	<span class="token keyword">start</span>		   	<span class="token number">3.140</span>
<span class="token number">0</span>			<span class="token number">1</span>			<span class="token keyword">end</span>				<span class="token number">4.120</span>
<span class="token number">1</span>			<span class="token number">0</span>			<span class="token keyword">start</span>			<span class="token number">0.550</span>
<span class="token number">1</span>			<span class="token number">0</span>			<span class="token keyword">end</span>				<span class="token number">1.550</span>
<span class="token number">1</span>			<span class="token number">1</span>			<span class="token keyword">start</span>			<span class="token number">2.300</span>
<span class="token number">1</span>			<span class="token number">1</span>			<span class="token keyword">end</span>				<span class="token number">3.600</span>
</code></pre></div><p>自连接后</p> <div class="language-sql extra-class"><pre class="language-sql"><code>a1<span class="token punctuation">.</span>machine_id	a1<span class="token punctuation">.</span>process_id	a1<span class="token punctuation">.</span><span class="token keyword">timestamp</span>	a2<span class="token punctuation">.</span><span class="token keyword">timestamp</span>
<span class="token number">0</span>				<span class="token number">0</span>				<span class="token number">0.712</span>			<span class="token number">1.520</span>
<span class="token number">0</span>				<span class="token number">1</span>				<span class="token number">3.140</span>			<span class="token number">4.120</span>
<span class="token number">1</span>				<span class="token number">0</span>				<span class="token number">0.550</span>			<span class="token number">1.550</span>
<span class="token number">1</span>				<span class="token number">1</span>				<span class="token number">2.300</span>			<span class="token number">3.600</span>
</code></pre></div><p>分组并取均值后：这个分组取均值有点迷，怎么理解</p> <div class="language-sql extra-class"><pre class="language-sql"><code>machine_id	processing_time
<span class="token number">0</span>			<span class="token number">0.808</span>	<span class="token comment"># (1.520 - 0.712 + 4.120 - 3.140) / 2</span>
<span class="token number">1</span>			<span class="token number">1.150</span>	<span class="token comment"># (1.550 - 0.550 + 3.600 - 2.300) / 2</span>
</code></pre></div></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/03/27, 00:18:18</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/239853/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">回溯、剪枝和线性规划</div></a> <a href="/pages/dc2530/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">数据库系统概述</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
