个逻辑点</li> <li><strong>可读性</strong>：测试名应自描述（如 <code>TestLogin_InvalidPassword</code>）</li></ol> <hr> <h2 id="_2-指令类规则"><a href="#_2-指令类规则" class="header-anchor">#</a> 2. 指令类规则</h2> <h3 id="_2-1-基本结构规范"><a href="#_2-1-基本结构规范" class="header-anchor">#</a> 2.1 基本结构规范</h3> <h4 id="_2-1-1-测试函数模板"><a href="#_2-1-1-测试函数模板" class="header-anchor">#</a> 2.1.1 测试函数模板</h4> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> Test<span class="token punctuation">{</span>FunctionName<span class="token punctuation">}</span><span class="token punctuation">(</span>t <span class="token operator">*</span>testing<span class="token punctuation">.</span>T<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">type</span> args <span class="token keyword">struct</span> <span class="token punctuation">{</span>
        param1 type1
        param2 type2
    <span class="token punctuation">}</span>
    patch <span class="token operator">:=</span> gomonkey<span class="token punctuation">.</span><span class="token function">NewPatches</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">defer</span> patch<span class="token punctuation">.</span><span class="token function">Reset</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    tests <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token keyword">struct</span> <span class="token punctuation">{</span>
        name     <span class="token builtin">string</span>
        args     args
        want     any
        wantErr  <span class="token builtin">bool</span>
        mockfunc <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span><span class="token punctuation">{</span>
        <span class="token punctuation">{</span>
            name<span class="token punctuation">:</span> <span class="token string">&quot;正常场景&quot;</span><span class="token punctuation">,</span>
            args<span class="token punctuation">:</span> args<span class="token punctuation">{</span><span class="token operator">...</span><span class="token punctuation">}</span><span class="token punctuation">,</span>
            want<span class="token punctuation">:</span> <span class="token operator">...</span><span class="token punctuation">,</span>
            mockfunc<span class="token punctuation">:</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span>Function<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span>value<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                patch<span class="token punctuation">.</span><span class="token function">ApplyFunc</span><span class="token punctuation">(</span>ExternalFunc<span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token operator">...</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
            <span class="token punctuation">}</span><span class="token punctuation">,</span>
            wantErr<span class="token punctuation">:</span> <span class="token boolean">false</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> tt <span class="token operator">:=</span> <span class="token keyword">range</span> tests <span class="token punctuation">{</span>
        t<span class="token punctuation">.</span><span class="token function">Run</span><span class="token punctuation">(</span>tt<span class="token punctuation">.</span>name<span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>t <span class="token operator">*</span>testing<span class="token punctuation">.</span>T<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            tt<span class="token punctuation">.</span><span class="token function">mockfunc</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            got<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">Function</span><span class="token punctuation">(</span>tt<span class="token punctuation">.</span>args<span class="token punctuation">.</span>param1<span class="token punctuation">,</span> tt<span class="token punctuation">.</span>args<span class="token punctuation">.</span>param2<span class="token punctuation">)</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>err <span class="token operator">!=</span> <span class="token boolean">nil</span><span class="token punctuation">)</span> <span class="token operator">!=</span> tt<span class="token punctuation">.</span>wantErr <span class="token punctuation">{</span>
                t<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;错误不符合预期: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
            <span class="token punctuation">}</span>
            <span class="token keyword">if</span> <span class="token operator">!</span>reflect<span class="token punctuation">.</span><span class="token function">DeepEqual</span><span class="token punctuation">(</span>got<span class="token punctuation">,</span> tt<span class="token punctuation">.</span>want<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                t<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;结果不符合预期: got=%v, want=%v&quot;</span><span class="token punctuation">,</span> got<span class="token punctuation">,</span> tt<span class="token punctuation">.</span>want<span class="token punctuation">)</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><hr> <h2 id="_3-约束类规则"><a href="#_3-约束类规则" class="header-anchor">#</a> 3. 约束类规则</h2> <h3 id="_3-1-mock-规则约束"><a href="#_3-1-mock-规则约束" class="header-anchor">#</a> 3.1 Mock 规则约束</h3> <ul><li>对于测试文件中已有的单测函数<strong>不要修改</strong>，只新增/修改当前函数需要生成的单测</li> <li>mock 函数时，必须保证与被 mock 函数的入参和出参类型保持一致</li> <li><strong>mock 优先选择 mockey 方式</strong>，如果函数太短再选择 gomonkey</li></ul> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// 正确示例</span>
patch<span class="token punctuation">.</span><span class="token function">ApplyFunc</span><span class="token punctuation">(</span>resource<span class="token punctuation">.</span>Cipher<span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">*</span>fcrypt<span class="token punctuation">.</span>Fcrypt <span class="token punctuation">{</span>
    <span class="token keyword">return</span> fcrypt<span class="token punctuation">.</span><span class="token function">NewCipher</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span>
patch<span class="token punctuation">.</span><span class="token function">ApplyMethod</span><span class="token punctuation">(</span>reflect<span class="token punctuation">.</span><span class="token function">TypeOf</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>fcrypt<span class="token punctuation">.</span>Fcrypt<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token string">&quot;FcryptHstr2Id&quot;</span><span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token boolean">_</span> <span class="token operator">*</span>fcrypt<span class="token punctuation">.</span>Fcrypt<span class="token punctuation">,</span> docID <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">uint64</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">,</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;FcryptHstr2Id err&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span>

</code></pre></div><ul><li><strong>gomonkey patch 的创建方法必须为</strong> <code>patch := gomonkey.NewPatches()</code></li></ul> <hr> <h2 id="_4-索引类规则"><a href="#_4-索引类规则" class="header-anchor">#</a> 4. 索引类规则</h2> <h3 id="_4-1-基础-mock-方法索引"><a href="#_4-1-基础-mock-方法索引" class="header-anchor">#</a> 4.1 基础 Mock 方法索引</h3> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// 函数 Mock</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span>Function<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span>value<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

<span class="token comment">// 方法 Mock</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>Struct<span class="token punctuation">)</span><span class="token punctuation">.</span>Method<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span>value<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

<span class="token comment">// 带参数的 Mock</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span>Function<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">To</span><span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span>arg <span class="token keyword">type</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>ret<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> value<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

<span class="token comment">// 接口 Mock</span>
<span class="token keyword">type</span> mockImpl <span class="token keyword">struct</span><span class="token punctuation">{</span> Interface <span class="token punctuation">}</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span>NewInterface<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>mockImpl<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>mockImpl<span class="token punctuation">)</span><span class="token punctuation">.</span>Method<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span>value<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
</code></pre></div><h3 id="_4-2-常用组件-mock-索引"><a href="#_4-2-常用组件-mock-索引" class="header-anchor">#</a> 4.2 常用组件 Mock 索引</h3> <h4 id="redis-mock"><a href="#redis-mock" class="header-anchor">#</a> Redis Mock</h4> <blockquote><p>注意：以下只有函数中使用 redis 接口调用才 mock</p></blockquote> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> tRedis <span class="token keyword">struct</span><span class="token punctuation">{</span> redis<span class="token punctuation">.</span>Client <span class="token punctuation">}</span>
<span class="token keyword">type</span> tBoolCmder <span class="token keyword">struct</span><span class="token punctuation">{</span> redis<span class="token punctuation">.</span>BoolCmder <span class="token punctuation">}</span>
<span class="token keyword">type</span> tIntCmder <span class="token keyword">struct</span><span class="token punctuation">{</span> redis<span class="token punctuation">.</span>IntCmder <span class="token punctuation">}</span>
<span class="token keyword">type</span> tStringCmder <span class="token keyword">struct</span><span class="token punctuation">{</span> redis<span class="token punctuation">.</span>StringCmder <span class="token punctuation">}</span>

tR <span class="token operator">:=</span> tRedis<span class="token punctuation">{</span><span class="token punctuation">}</span>
tBC <span class="token operator">:=</span> tBoolCmder<span class="token punctuation">{</span><span class="token punctuation">}</span>
tIC <span class="token operator">:=</span> tIntCmder<span class="token punctuation">{</span><span class="token punctuation">}</span>
tSC <span class="token operator">:=</span> tStringCmder<span class="token punctuation">{</span><span class="token punctuation">}</span>

mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span>basis<span class="token punctuation">.</span>GetRedisIns<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span>tR<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>tRedis<span class="token punctuation">)</span><span class="token punctuation">.</span>SetNX<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span>tBC<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
mockey<span class="token punctuation">.</span><span class="token function">Mock</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token operator">*</span>tBoolCmder<span class="token punctuation">)</span><span class="token punctuation">.</span>Result<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Return</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Build</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
</code></pre></div><h4 id="http-相关"><a href="#http-相关" class="header-anchor">#</a> HTTP 相关</h4> <blockquote><p>注意：请求 ghttp.Request 函数 mock</p></blockquote> <div class="language-go extra-class"><pre class="language-go"><code><span class="token comment">// Request Mock</span>
req <span class="token operator">:=</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> ghttp<span class="token punctuation">.</span>Request <span class="token punctuation">{</span>
