    <span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>runes<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>反转字符串：转化为一个 byte 数组操作，最后转化为 string 返回</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">invert</span><span class="token punctuation">(</span>s <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    bytes <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span>
    <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> <span class="token function">len</span><span class="token punctuation">(</span>bytes<span class="token punctuation">)</span><span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> bytes<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">==</span> <span class="token char">'0'</span><span class="token punctuation">{</span>
            bytes<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token char">'1'</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
            bytes<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token char">'0'</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>bytes<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>业务逻辑实现：注意 n 和 k 的下标都从 1 开始</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">findKthBit</span><span class="token punctuation">(</span>n <span class="token builtin">int</span><span class="token punctuation">,</span> k <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">byte</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token function">S</span><span class="token punctuation">(</span>n<span class="token punctuation">)</span><span class="token punctuation">[</span>k<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">]</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">S</span><span class="token punctuation">(</span>n <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span> n <span class="token operator">==</span> <span class="token number">1</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token string">&quot;0&quot;</span>
    <span class="token punctuation">}</span>
    pre <span class="token operator">:=</span> <span class="token function">S</span><span class="token punctuation">(</span>n<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">)</span>
    <span class="token keyword">return</span> pre <span class="token operator">+</span> <span class="token string">&quot;1&quot;</span> <span class="token operator">+</span> <span class="token function">reverse</span><span class="token punctuation">(</span><span class="token function">invert</span><span class="token punctuation">(</span>pre<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p><code>byte[], rune[]</code>和<code>string</code>的区别？</p> <h3 id="struct-结构体"><a href="#struct-结构体" class="header-anchor">#</a> struct 结构体</h3> <blockquote><p>OOP 面向对象编程：封装、~<s>继承</s>~、多态</p></blockquote> <p>不同于 Java，结构体的定义和其功能的实现并不在同一域，比方我先定义一个结构体 Account</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> Account <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Id       <span class="token builtin">string</span>
    Name     <span class="token builtin">string</span>
    Password <span class="token builtin">string</span>
<span class="token punctuation">}</span>
</code></pre></div><p>而后我想实现他的功能，直接定义函数，通过在 func 后的小括号指定其所属的结构体，这个小括号叫做接收者</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>a <span class="token operator">*</span>Account<span class="token punctuation">)</span> <span class="token function">SayHello</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    res <span class="token operator">:=</span> <span class="token string">&quot;Hello! &quot;</span> <span class="token operator">+</span> <span class="token string">&quot;I'm &quot;</span> <span class="token operator">+</span> a<span class="token punctuation">.</span>id <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> a<span class="token punctuation">.</span>Name
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>res<span class="token punctuation">)</span>
    <span class="token keyword">return</span> res
<span class="token punctuation">}</span>
</code></pre></div><p>在 Main 中调用</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    account <span class="token operator">:=</span> learning<span class="token punctuation">.</span>Account<span class="token punctuation">{</span>Id<span class="token punctuation">:</span> <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span> Name<span class="token punctuation">:</span> <span class="token string">&quot;test&quot;</span><span class="token punctuation">,</span> Password<span class="token punctuation">:</span> <span class="token string">&quot;123456&quot;</span><span class="token punctuation">}</span>
    account<span class="token punctuation">.</span><span class="token function">SayHello</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token comment">// 输出 &quot;Hello! I'm 1:test&quot;</span>
<span class="token punctuation">}</span>
</code></pre></div><p>值得注意的点是，在定义接受者的时候，如果没有<code>*</code>号，则为值传递（否则为指针传递），值传递不会对对象原本的值做改变（值是复制进来的），只有在传入指针时，原结构体的数据才是可修改的（和 C 保持一致）</p> <p>结构体的 Embedding 嵌入</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> CovertParseSubmit <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	AIBase
	params   covertParseSubmitParam
	docIdInt <span class="token builtin">uint64</span>
	docFlag  <span class="token builtin">uint32</span>
	docPage  <span class="token builtin">uint32</span>
	dataType <span class="token builtin">int8</span>
	bduss    <span class="token builtin">string</span>
<span class="token punctuation">}</span>
</code></pre></div><p>将结构体 AIBase 嵌入到结构体 ConvertParseSubmit 里，后者包含前者，这是一个组合（嵌入），而非继承，要和子类的逻辑严格区分开，在 Go 中是没有继承这一说的</p> <h3 id="interface-接口"><a href="#interface-接口" class="header-anchor">#</a> interface 接口</h3> <blockquote><p>在 Go 语言中，接口（interface）是一种抽象类型，定义了一组方法，但不包含具体实现</p></blockquote> <p>接口提供了一种灵活的方式，使不同类型的对象可以共享相同的行为，同时支持多态编程</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">import</span> <span class="token string">&quot;fmt&quot;</span>

<span class="token comment">// 定义一个接口</span>
<span class="token keyword">type</span> Speaker <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    <span class="token function">Speak</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span>
    <span class="token function">Run</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span>
<span class="token punctuation">}</span>

<span class="token comment">// 定义一个结构体</span>
<span class="token keyword">type</span> Animal <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Name <span class="token builtin">string</span>
    Type <span class="token builtin">string</span>
<span class="token punctuation">}</span>

<span class="token comment">// 让 Animal 实现 Speaker 接口中的两个函数 Speak 和 Run</span>
<span class="token comment">// 实现接口函数到结构体的双向绑定，可以通过这个结构体来实例化接口</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>d Animal<span class="token punctuation">)</span> <span class="token function">Speak</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;I'm &quot;</span> <span class="token operator">+</span> d<span class="token punctuation">.</span>Name <span class="token operator">+</span> <span class="token string">&quot;, I'm a &quot;</span> <span class="token operator">+</span> d<span class="token punctuation">.</span>Type
<span class="token punctuation">}</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>d Animal<span class="token punctuation">)</span> <span class="token function">Run</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;The &quot;</span> <span class="token operator">+</span> d<span class="token punctuation">.</span>Type <span class="token operator">+</span> <span class="token string">&quot; &quot;</span> <span class="token operator">+</span> d<span class="token punctuation">.</span>Name <span class="token operator">+</span> <span class="token string">&quot; is running&quot;</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">TestInterface</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">var</span> s Speaker
    <span class="token comment">// 通过 Animal 实例化 Speaker</span>
    s <span class="token operator">=</span> Animal<span class="token punctuation">{</span>Name<span class="token punctuation">:</span> <span class="token string">&quot;Buddy&quot;</span><span class="token punctuation">,</span> Type<span class="token punctuation">:</span> <span class="token string">&quot;Dog&quot;</span><span class="token punctuation">}</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>s<span class="token punctuation">.</span><span class="token function">Speak</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>s<span class="token punctuation">.</span><span class="token function">Run</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    learning<span class="token punctuation">.</span><span class="token function">TestInterface</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">/*
输出
I'm Buddy, I'm a Dog
The Dog Buddy is running
*/</span>
</code></pre></div><p>也就是说，接口定义函数轮廓，具体逻辑由结构体和函数实现共同完成，最后向上返回时，只提供接口，但内容可以是千奇百怪，这就是 Go 中的多模态实现</p> <p>还可以用 interface 定义函数体的返回，这样相当于 Java 中返回 Object 类，即可返回任意类型</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">TestInterfaceFunc</span><span class="token punctuation">(</span>a <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token keyword">interface</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span> a <span class="token operator">&gt;=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token number">95</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token string">&quot;hahaha&quot;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在 Go 中，interface 更像是一个泛型的存在，例如定义一个泛型数组</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">type</span> PPTJSONData <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Title <span class="token builtin">string</span> 'json<span class="token punctuation">:</span><span class="token string">&quot;task_id&quot;</span>'
    Slide <span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token keyword">interface</span> 'json<span class="token punctuation">:</span><span class="token string">&quot;slide&quot;</span>'
<span class="token punctuation">}</span>
</code></pre></div><h2 id="并发编程"><a href="#并发编程" class="header-anchor">#</a> 并发编程</h2> <p>Go 语言的协程（goroutine）和通道（channel）是其并发模型的核心</p> <h3 id="goroutine-协程"><a href="#goroutine-协程" class="header-anchor">#</a> Goroutine 协程</h3> <p>Goroutine 是 Go 语言中的一种轻量级线程，它由 Go 运行时（runtime）管理，用户不需要手动管理线程。相比操作系统级别的线程，Goroutine 更加高效，可以轻松创建数十万个 Goroutine，而不会导致大量的资源消耗</p> <p>协程为什么比线程快</p> <table><thead><tr><th>特性</th> <th>协程</th> <th>线程</th></tr></thead> <tbody><tr><td>内存消耗</td> <td>非常小（&lt; 2KB），可动态扩展至 1GB</td> <td>较大（&gt; 1MB）</td></tr> <tr><td>创建 / 销毁</td> <td>由 GO 运行时管理（GPM 模型）</td> <td>由 OS 管理</td></tr> <tr><td>上下文切换</td> <td>都在用户态完成</td> <td>需要在用户态和内核态切换</td></tr> <tr><td>通信方式</td> <td>通过 Channel 通信</td> <td>主要靠共享内存</td></tr></tbody></table> <p>Go 使用 go 关键字创建一个协程</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">import</span> <span class="token punctuation">(</span>
    <span class="token string">&quot;time&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">func</span> <span class="token function">TestGoroutine</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">go</span> <span class="token function">TestInterface</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">3</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>Main 函数</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    learning<span class="token punctuation">.</span><span class="token function">TestGoroutine</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>输出</p> <div class="language-sh extra-class"><pre class="language-sh"><code>I<span class="token string">'m Buddy, I'</span>m a Dog
The Dog Buddy is running
</code></pre></div><p>注意： <code>main</code>函数是主 Goroutine，若它执行完毕，所有子 Goroutine 也会立即结束，因此需要<code>time.Sleep</code>等待子 Goroutine 执行（这里手动等了 3s）</p> <p>也就是说，如果不等，有可能子协程并没有执行，整个程序就跑完了，非阻塞，这和 Java 的线程很不一样（在 Java 里，主线程是需要等待子线程执行完毕才结束的）</p> <p>在 Go 中，Goroutine 默认是并发的，而不是并行的，如果要让 Go 充分利用多核 CPU 并行执行，需要使用设置 CPU 核心数</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">import</span> <span class="token string">&quot;runtime&quot;</span>

<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    runtime<span class="token punctuation">.</span><span class="token function">GOMAXPROCS</span><span class="token punctuation">(</span>runtime<span class="token punctuation">.</span><span class="token function">NumCPU</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">// 设置使用 CPU 核心数</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="channel-通道与-sse-传输"><a href="#channel-通道与-sse-传输" class="header-anchor">#</a> Channel 通道与 SSE 传输</h3> <p>Channel 是 Go 语言中用于协程之间通信的数据结构，可在多个 Goroutine 之间传输数据，Channel 的存在意义</p> <ol><li>Goroutine 之间共享内存可能导致数据竞争，Channel 提供了一种安全的数据传输方式</li> <li>Go 语言提倡通过通信共享内存（CSP 模型，Conmunicating Sequential Process），而不是通过共享内存进行通信</li></ol> <p>通过 make chan 关键字创建通道，可指定数据类型是 any 任意</p> <div class="language-go extra-class"><pre class="language-go"><code>ch <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> any<span class="token punctuation">)</span>
</code></pre></div><p>发送和接收消息</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">TestChannel</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ch1 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">)</span>
    ch2 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">string</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        ch1 <span class="token operator">&lt;-</span> <span class="token number">42</span> <span class="token comment">// 发送数据</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
        ch2 <span class="token operator">&lt;-</span> <span class="token string">&quot;nmsl&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    num <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch1     <span class="token comment">// 接收数据</span>
    str <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch2     <span class="token comment">// 会被阻塞 1s</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>num<span class="token punctuation">)</span> <span class="token comment">// 输出 42</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>str<span class="token punctuation">)</span> <span class="token comment">// 输出 nmsl</span>
<span class="token punctuation">}</span>
</code></pre></div><p>Channel 的阻塞特性</p> <ul><li>发送操作 <code>&lt;-</code> 会阻塞，直到数据被接收</li> <li>接收操作 <code>&lt;-</code> 会阻塞，直到数据被发送</li></ul> <p>如上述<code>str := &lt;-ch2</code>会被阻塞 1s 才输出</p> <p>单向 Channel</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">sendData</span><span class="token punctuation">(</span>ch <span class="token keyword">chan</span><span class="token operator">&lt;-</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">// 只能发送数据</span>
    ch <span class="token operator">&lt;-</span> <span class="token number">100</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">receiveData</span><span class="token punctuation">(</span>ch <span class="token operator">&lt;-</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">// 只能接收数据</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">&lt;-</span>ch<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>带缓冲的 Channel：默认的 Channel 是无缓冲的，发送和接收必须同步进行，如果想要异步通信，可以使用带缓冲的 Channel</p> <div class="language-go extra-class"><pre class="language-go"><code>ch <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">)</span> <span class="token comment">// 创建一个最多存储 3 个 int 的缓冲通道</span>
</code></pre></div><div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ch <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">)</span> <span class="token comment">// 容量为 2</span>

    ch <span class="token operator">&lt;-</span> <span class="token number">1</span>
    ch <span class="token operator">&lt;-</span> <span class="token number">2</span>
    <span class="token comment">// ch &lt;- 3 // 若继续写入，会发生死锁（fatal error）</span>

    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">&lt;-</span> ch<span class="token punctuation">)</span> <span class="token comment">// 1</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">&lt;-</span> ch<span class="token punctuation">)</span> <span class="token comment">// 2</span>
<span class="token punctuation">}</span>
</code></pre></div><p>与智能体的交互，大多都是走的 SSE 流，通过 chan any 管道和<code>&lt;-</code>操作符接收 LLM 的输出并实现“一帧帧”的输出</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token operator">&lt;-</span> ch <span class="token comment">// 只同步数据，不进行接收</span>
</code></pre></div><p>可以理解为，清除管道中的数据</p> <h3 id="select-语句和超时控制"><a href="#select-语句和超时控制" class="header-anchor">#</a> Select 语句和超时控制</h3> <p><code>select</code>语句类似<code>switch</code>，专用于处理<code>channel</code>的并发通信</p> <ul><li><code>select</code>会等待某个<code>case</code>变为可用（即<code>channel</code>有数据）</li> <li><code>default</code>分支可选，如果所有<code>case</code>都阻塞，<code>default</code>立即执行</li></ul> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ch1 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">string</span><span class="token punctuation">)</span>
    ch2 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">string</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">2</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
        ch1 <span class="token operator">&lt;-</span> <span class="token string">&quot;Message from ch1&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
        ch2 <span class="token operator">&lt;-</span> <span class="token string">&quot;Message from ch2&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">select</span> <span class="token punctuation">{</span>
    <span class="token keyword">case</span> msg1 <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch1<span class="token punctuation">:</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Received:&quot;</span><span class="token punctuation">,</span> msg1<span class="token punctuation">)</span>
    <span class="token keyword">case</span> msg2 <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch2<span class="token punctuation">:</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Received:&quot;</span><span class="token punctuation">,</span> msg2<span class="token punctuation">)</span>
    <span class="token keyword">case</span> <span class="token operator">&lt;-</span>time<span class="token punctuation">.</span><span class="token function">After</span><span class="token punctuation">(</span><span class="token number">3</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span><span class="token punctuation">:</span> <span class="token comment">// 超时控制</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Timeout!&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><h3 id="gpm-调度机制"><a href="#gpm-调度机制" class="header-anchor">#</a> GPM 调度机制</h3> <blockquote><p>Goroutine、Processor and Machine，协程进程和机器</p></blockquote> <p>GPM 调度机制：GPM 是 Go 语言运行时（runtime）用于管理 Goroutine 并发执行的调度模型，它由 Goroutine、Processor 和 Machine 组成</p> <table><thead><tr><th>组件</th> <th>作用</th></tr></thead> <tbody><tr><td>G（Goroutine）</td> <td>Go 协程，执行具体的任务</td></tr> <tr><td>P（Processor）</td> <td>逻辑处理器，负责调度 Goroutine 并提供执行环境</td></tr> <tr><td>M（Machine**）**</td> <td>OS 线程，代表操作系统的线程，运行 Go 代码</td></tr></tbody></table> <p>GPM 关系图</p> <div class="language-sh extra-class"><pre class="language-sh"><code>多个 Goroutine 绑定到 Processor，Processor 绑定到 Machine，Machine 由 OS 线程提供

OS 线程（M1）    OS 线程（M2）  <span class="token punctuation">..</span>.
    <span class="token operator">|</span>              <span class="token operator">|</span>
Processor（P1）  Processor（P2） <span class="token punctuation">..</span>.
    <span class="token operator">|</span>              <span class="token operator">|</span>
Goroutine（G1, G2, G3<span class="token punctuation">..</span>.）
</code></pre></div><h2 id="后端开发"><a href="#后端开发" class="header-anchor">#</a> 后端开发</h2> <h3 id="gin-基础"><a href="#gin-基础" class="header-anchor">#</a> Gin 基础</h3> <h4 id="依赖导入"><a href="#依赖导入" class="header-anchor">#</a> 依赖导入</h4> <p>Gin 依赖：在项目根目录命令行导入 gin</p> <div class="language-sh extra-class"><pre class="language-sh"><code>go get <span class="token parameter variable">-u</span> github.com/gin-gonic/gin
</code></pre></div><p>Go 的包管理工具整合在 go 命令中，可以通过 go get 直接导入 http 包并自动更新 go.mod</p> <p>在 Main 函数中启动 Gin 服务器，定义一个简单的 ping 接口</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">package</span> main

<span class="token keyword">import</span> <span class="token punctuation">(</span>
	<span class="token string">&quot;github.com/gin-gonic/gin&quot;</span>
	<span class="token string">&quot;net/http&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	r <span class="token operator">:=</span> gin<span class="token punctuation">.</span><span class="token function">Default</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 定义一个简单的接口</span>
	r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/ping&quot;</span><span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>StatusOK<span class="token punctuation">,</span> gin<span class="token punctuation">.</span>H<span class="token punctuation">{</span>
			<span class="token string">&quot;message&quot;</span><span class="token punctuation">:</span> <span class="token string">&quot;pong&quot;</span><span class="token punctuation">,</span>
		<span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span><span class="token punctuation">)</span>

	<span class="token comment">// 启动服务，监听 8080 端口</span>
	r<span class="token punctuation">.</span><span class="token function">Run</span><span class="token punctuation">(</span><span class="token string">&quot;:8080&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在浏览器中访问<code>localhost://8080/ping</code>就会得到 Json 格式的返回<code>{&quot;message&quot;:&quot;pong&quot;}</code></p> <h4 id="配置文件解析"><a href="#配置文件解析" class="header-anchor">#</a> 配置文件解析</h4> <p>yaml 解析：安装 yaml 文件解析工具</p> <div class="language-sh extra-class"><pre class="language-sh"><code>go get gopkg.in/yaml.v3
</code></pre></div><p>在 config 目录下编写配置文件 config.yaml，等同于 application.yaml</p> <div class="language-yaml extra-class"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">12345</span>

<span class="token key atrule">mysql</span><span class="token punctuation">:</span>
  <span class="token key atrule">host</span><span class="token punctuation">:</span> <span class="token string">&quot;127.0.0.1&quot;</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">3306</span>
  <span class="token key atrule">user</span><span class="token punctuation">:</span> <span class="token string">&quot;root&quot;</span>
  <span class="token key atrule">password</span><span class="token punctuation">:</span> <span class="token string">&quot;&quot;</span>

<span class="token comment">#redis:</span>
<span class="token comment">#  host: &quot;127.0.0.1&quot;</span>
<span class="token comment">#  port: 6379</span>
<span class="token comment">#  password: &quot;&quot;</span>
<span class="token comment">#  db: 0</span>
</code></pre></div><p>而后通过<code>yaml.v3</code>包解析 config.go，将配置写进全局变量 AppConfig 中</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">package</span> config

<span class="token keyword">import</span> <span class="token punctuation">(</span>
    <span class="token string">&quot;fmt&quot;</span>
    <span class="token string">&quot;gopkg.in/yaml.v3&quot;</span>
    <span class="token string">&quot;os&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">type</span> Config <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Server ServerConfig <span class="token string">`yaml:&quot;server&quot;`</span>
    MySQL  MySQLConfig  <span class="token string">`yaml:&quot;mysql&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> ServerConfig <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Port <span class="token builtin">int</span>    <span class="token string">`yaml:&quot;port&quot;`</span>
    Host <span class="token builtin">string</span> <span class="token string">`yaml:&quot;host&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> MySQLConfig <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Host     <span class="token builtin">string</span> <span class="token string">`yaml:&quot;host&quot;`</span>
    Port     <span class="token builtin">int</span>    <span class="token string">`yaml:&quot;port&quot;`</span>
    Username <span class="token builtin">string</span> <span class="token string">`yaml:&quot;username&quot;`</span>
    Password <span class="token builtin">string</span> <span class="token string">`yaml:&quot;password&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">var</span> AppConfig Config

<span class="token keyword">func</span> <span class="token function">LoadConfig</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    file<span class="token punctuation">,</span> err <span class="token operator">:=</span> os<span class="token punctuation">.</span><span class="token function">ReadFile</span><span class="token punctuation">(</span><span class="token string">&quot;config/config.yaml&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token function">panic</span><span class="token punctuation">(</span>fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;无法加载配置文件: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    err <span class="token operator">=</span> yaml<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span>file<span class="token punctuation">,</span> <span class="token operator">&amp;</span>AppConfig<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token function">panic</span><span class="token punctuation">(</span>fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;解析 YAML 失败: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在其余文件中将统一使用这个全局变量 AppConfig 来实现项目的配置</p> <h4 id="路由"><a href="#路由" class="header-anchor">#</a> 路由</h4> <p>routes 路由：Gin 开发 Web 接口时的标准函数写法</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">GetRank</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 处理请求的逻辑</span>
<span class="token punctuation">}</span>
</code></pre></div><p><code>c *gin.Context</code></p> <ul><li>是这个函数的参数，类型是<code>gin.Context</code></li> <li>这个参数是 Gin 框架每次处理请求时传进来的上下文对象，类似于 Session</li> <li>它包含了请求信息、响应对象、路径参数、请求体、查询参数等</li></ul> <p><strong>接口函数没有返回值</strong>，是因为 Gin 的路由处理函数通常不直接返回值（路由信息已经在上下文中含了），而通过<code>c.JSON()</code>、<code>c.String()</code>等方法直接向客户端写响应，例如</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">GetRank</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// []model.StudentWithSubjectTag</span>
    c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>StatusOK<span class="token punctuation">,</span> service<span class="token punctuation">.</span><span class="token function">GetStudentsSortedByAllSubjects</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">GetTop</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// map[string]model.StudentWithSubjectTag</span>
    c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>StatusOK<span class="token punctuation">,</span> service<span class="token punctuation">.</span><span class="token function">GetTopStudents</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><p>在 routes 中注册</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">SetupRouter</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">*</span>gin<span class="token punctuation">.</span>Engine <span class="token punctuation">{</span>
    r <span class="token operator">:=</span> gin<span class="token punctuation">.</span><span class="token function">Default</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/ping&quot;</span><span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span><span class="token number">200</span><span class="token punctuation">,</span> gin<span class="token punctuation">.</span>H<span class="token punctuation">{</span>
            <span class="token string">&quot;message&quot;</span><span class="token punctuation">:</span> <span class="token string">&quot;pong&quot;</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>

    r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/getRank&quot;</span><span class="token punctuation">,</span> controller<span class="token punctuation">.</span>GetRank<span class="token punctuation">)</span>
    r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/getTop&quot;</span><span class="token punctuation">,</span> controller<span class="token punctuation">.</span>GetTop<span class="token punctuation">)</span>
    <span class="token keyword">return</span> r
<span class="token punctuation">}</span>
</code></pre></div><p>相应的，在 Main 函数中调用 SetupRouter 返回的 Gin 启动运行服务</p> <div class="language-go extra-class"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    config<span class="token punctuation">.</span><span class="token function">LoadConfig</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    r <span class="token operator">:=</span> routes<span class="token punctuation">.</span><span class="token function">SetupRouter</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token comment">// 启动服务，监听 12345 端口</span>
    r<span class="token punctuation">.</span><span class="token function">Run</span><span class="token punctuation">(</span><span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> strconv<span class="token punctuation">.</span><span class="token function">Itoa</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>AppConfig<span class="token punctuation">.</span>Server<span class="token punctuation">.</span>Port<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre></div><h4 id="http-handler"><a href="#http-handler" class="header-anchor">#</a> HTTP Handler</h4> <p>上面也提到，不同于 Java 接口直接返回 ResultMap，Go 返回的是接口一个标准库中的 net.http.Handler 处理器，这个 Handler 具备处理用户 http 请求的能力，其实际上是一个具有 ServeHTTP 方法的对象</p> <p>向请求的上下文 ctx 中直接写入响应，实现接口返回的功能，这一逻辑通过实现 Handler 接口实现，通过内置的结构体，完成以下逻辑再由统一的工厂创建</p> <ol><li>Init</li> <li>InitBase</li> <li>OnExecute</li></ol> <p>在 routes 中，接口绑定的就是工厂创建的一个个 Handler，Controller 通过实现 Handler 接口实现多态和 IoC</p> <h4 id="gorm-框架"><a href="#gorm-框架" class="header-anchor">#</a> GORM 框架</h4> <p><a href="https://gorm.io/zh_CN/docs/index.html" target="_blank" rel="nofollow noopener noreferrer">GORM 指南 | GORM - The fantastic ORM library for Golang, aims to be developer friendly.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="领域模型划分"><a href="#领域模型划分" class="header-anchor">#</a> 领域模型划分</h3> <p>以 CANVAS 为例</p> <div class="language- extra-class"><pre class="language-text"><code>CANVAS
|-- bin
|-- bootstrap
|-- cmd
|-- cmdtask
|-- conf
|-- conftest
|-- model
|-- data
|-- document
|-- hestia
|-- httpserver
|-- nshandserver
|-- log
|-- library
|-- noahdes
|-- script
|-- main.go
|-- go.mod
|-- go.sum
</code></pre></div><p>httpserver 和 nshandserver 分别是 http 和微服务接口</p> <p>核心的业务在 model 中，这是关键的领域模型业务分层</p> <div class="language- extra-class"><pre class="language-text"><code>model
|-- dao
|-- dto
|-- service
|-- mservice
|-- data
|-- workflow
</code></pre></div><p>service 和 mservice 分别对应 http 和微服务业务，dao 是数据库接入</p> <h3 id="单测与部署"><a href="#单测与部署" class="header-anchor">#</a> 单测与部署</h3> <p>单测命令</p> <ul><li>go test 测试覆盖率</li> <li>go tool cover 生成覆盖率报告</li></ul> <div class="language-bash extra-class"><pre class="language-bash"><code>go <span class="token builtin class-name">test</span> <span class="token parameter variable">-coverprofile</span><span class="token operator">=</span>coverage.out ./<span class="token punctuation">..</span>. <span class="token operator">&amp;&amp;</span> go tool cover <span class="token parameter variable">-html</span><span class="token operator">=</span>coverage.out <span class="token parameter variable">-o</span> coverage.html
</code></pre></div><p>单测的生成可以交由 AI 实现</p> <p>打包部署：保持打包和测试环境一致，在开发机/代码空间打包，下载本地，推到 EOS 环境运行</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token assign-left variable">CGO_ENABLED</span><span class="token operator">=</span><span class="token number">0</span> go build <span class="token parameter variable">-o</span> <span class="token keyword">function</span> main.go
</code></pre></div><p><code>CGO_ENABLE=0</code>禁止 CGO 编译静态链接二进制，防止运行时链接到系统的 glibc，若打包和测试环境的 glibc 不一致会导致执行失败</p> <p>跨平台编译：指定系统，本地 Mac，测试环境 Linux</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token assign-left variable">CGO_ENABLED</span><span class="token operator">=</span><span class="token number">0</span> <span class="token assign-left variable">GOOS</span><span class="token operator">=</span>linux <span class="token assign-left variable">GOARCH</span><span class="token operator">=</span>amd64 go build <span class="token parameter variable">-o</span> <span class="token keyword">function</span> main.go

<span class="token comment"># 上传服务器并添加执行权限，当前位于 function 目录</span>
<span class="token function">chmod</span> +x ./bin/function
</code></pre></div><p>查看并重启进程</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">ps</span> <span class="token parameter variable">-ef</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token keyword">function</span>
<span class="token function">kill</span> pid
./bin/function <span class="token operator">&gt;</span> /dev/null <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span> <span class="token operator">&amp;</span>
</code></pre></div><p>查看日志</p> <div class="language-bash extra-class"><pre class="language-bash"><code><span class="token function">cat</span> access.log.* <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'/chat'</span>
<span class="token comment"># ctrl f queryid</span>
<span class="token function">cat</span> access.log.* <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'queryid'</span>
</code></pre></div></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/04/20, 00:54:13</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/b85196/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">React 和 Electron</div></a> <a href="/pages/699675/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">锁机制</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
